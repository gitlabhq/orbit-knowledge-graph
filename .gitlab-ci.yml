workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^trident-4915-reviewer-/

build-musl:
  image: registry.gitlab.com/gitlab-org/rust/build-images/orbit-knowledge-graph:latest
  tags: [saas-linux-large-amd64]
  timeout: 1h
  variables:
    CARGO_INCREMENTAL: "0"
    RUSTC_WRAPPER: ""
    MISE_DISABLE_TOOLS: lefthook
  script:
    - mise install
    - rustup target add --toolchain 1.98.1 x86_64-unknown-linux-musl
    - mise exec -- cargo zigbuild --release --locked -p orbit-cli --bin orbit --target x86_64-unknown-linux-musl --features duckdb-client/bundled
    - mkdir -p out && cp target/x86_64-unknown-linux-musl/release/orbit out/orbit-musl-base
    - git apply ci-bench/clockfix.patch && git diff --stat
    - mise exec -- cargo zigbuild --release --locked -p orbit-cli --bin orbit --target x86_64-unknown-linux-musl --features duckdb-client/bundled
    - cp target/x86_64-unknown-linux-musl/release/orbit out/orbit-musl-clockfix
    - ls -la out
  artifacts:
    paths: [out/]
    expire_in: 1 day

bench-musl:
  image: debian:trixie
  tags: [saas-linux-small-amd64]
  needs: [build-musl]
  timeout: 2h
  variables:
    GIT_DEPTH: "1"
  script:
    - apt-get update -qq && apt-get install -y -qq git curl bc ca-certificates >/dev/null
    - B=https://gitlab.com/api/v4/projects/77960826/packages/generic/orbit-cli/0.159.0
    - mkdir -p /opt/musl && curl -fsSL $B/orbit-cli-linux-musl-x86_64.tar.gz | tar xz -C /opt/musl
    - chmod +x out/orbit-*
    - |
      export VARIANTS="musl-release|/opt/musl/orbit|X=1
      musl-src-base|$CI_PROJECT_DIR/out/orbit-musl-base|X=1
      musl-src-clockfix|$CI_PROJECT_DIR/out/orbit-musl-clockfix|X=1
      musl-src-clockfix-2|$CI_PROJECT_DIR/out/orbit-musl-clockfix|X=1
      musl-src-base-2|$CI_PROJECT_DIR/out/orbit-musl-base|X=1
      musl-release-2|/opt/musl/orbit|X=1"
    - bash $CI_PROJECT_DIR/ci-bench/bench.sh
