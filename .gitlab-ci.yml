stages: [test]

.windows:
  stage: test
  needs: []
  timeout: 1h
  tags: [saas-windows-medium-amd64]
  variables:
    RUSTUP_HOME: "C:\\r"
    CARGO_HOME: "C:\\c"
    CARGO_TARGET_DIR: "C:\\t"
    CARGO_TERM_COLOR: never
  before_script:
    - $ErrorActionPreference = 'Stop'
    - git config --global core.longpaths true
    - Invoke-WebRequest -UseBasicParsing -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain none --profile minimal
    - $env:PATH = "$env:CARGO_HOME\bin;$env:PATH"
    - rustup show   # installs the toolchain pinned by rust-toolchain.toml
    - rustc -vV
    - git rev-parse HEAD
    - whoami /groups | Select-String "High Mandatory"
  script:
    - $env:PATH = "$env:CARGO_HOME\bin;$env:PATH"
    - cargo test -p orbit-utils --test vfs_paths -- --nocapture; $a = $LASTEXITCODE
    - cargo test -p orbit-utils --test windows_e2e -- --nocapture; $b = $LASTEXITCODE
    - if ($a -ne 0 -or $b -ne 0) { exit 1 }

windows-e2e-fix:
  extends: .windows

windows-e2e-control:
  extends: .windows
  allow_failure: true
  before_script:
    - git checkout cc494e038a8ef5122d98a9d89a346d2da8e88643 -- crates/utils/src/vfs/sources/directory.rs
    - git diff --stat HEAD
    - !reference [.windows, before_script]
