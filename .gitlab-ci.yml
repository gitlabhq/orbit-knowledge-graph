workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^trident-4915-/

bench-variants:
  image: ubuntu:24.04
  tags: [saas-linux-small-amd64]
  timeout: 2h
  variables:
    GIT_DEPTH: "1"
  script:
    - apt-get update -qq && apt-get install -y -qq git curl bc ca-certificates >/dev/null
    - B=https://gitlab.com/api/v4/projects/77960826/packages/generic/orbit-cli/0.159.0
    - mkdir -p /opt/musl /opt/gnu
    - curl -fsSL $B/orbit-cli-linux-musl-x86_64.tar.gz | tar xz -C /opt/musl
    - curl -fsSL $B/orbit-cli-linux-x86_64.tar.gz | tar xz -C /opt/gnu
    - |
      export VARIANTS="musl-default|/opt/musl/orbit|X=1
      gnu-default|/opt/gnu/orbit|X=1
      musl-rayon1|/opt/musl/orbit|RAYON_NUM_THREADS=1
      musl-rayon4|/opt/musl/orbit|RAYON_NUM_THREADS=4
      gnu-default-2|/opt/gnu/orbit|X=1
      musl-default-2|/opt/musl/orbit|X=1"
    - bash $CI_PROJECT_DIR/ci-bench/bench.sh
