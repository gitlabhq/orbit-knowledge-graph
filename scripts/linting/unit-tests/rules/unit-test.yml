id: unit-test
language: rust
severity: error
message: Rust unit tests are opt-in. Put behavior tests in YAML, or opt in with a reason.
rule:
  kind: function_item
  any:
    - follows:
        stopBy:
          not:
            any:
              - kind: attribute_item
              - kind: line_comment
              - kind: block_comment
        kind: attribute_item
        regex: '^#\[(tokio::test|test|rstest)\b'
    - has:
        field: parameters
        regex: '&\s*TestContext\b'
files:
  - crates/**
