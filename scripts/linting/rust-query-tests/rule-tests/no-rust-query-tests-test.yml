id: no-rust-query-tests
valid:
  - |
    fn helper() { compile("MATCH (u:User) RETURN u"); }
  - |
    #[test]
    fn parses_numbers() { assert_eq!(parse("1"), 1); }
  - |
    #[test]
    #[should_panic]
    fn rejects_empty() { parse(""); }
invalid:
  - |
    #[test]
    fn compiles_gql() { compile("MATCH (u:User) RETURN u"); }
  - |
    #[tokio::test]
    #[serial]
    async fn compiles_json() { compile(r#"{"query_type": "traversal"}"#); }
  - |
    #[test]
    // a note
    fn noted() { compile("MATCH (u:User) RETURN u"); }
  - |
    async fn subtest(ctx: &TestContext) { run(ctx, "MATCH (u:User) RETURN u").await; }
