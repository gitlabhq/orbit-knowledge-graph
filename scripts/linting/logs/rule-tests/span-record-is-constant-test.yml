id: span-record-is-constant
valid:
  - 'span.record(safe::GL_ROOT_NAMESPACE_ID, id);'
  - 'tracing::Span::current().record(expanded::BRANCH, branch);'
  - 'histogram.record(1.0, &[]);'
  - 'metrics.record("phase", 1);'
invalid:
  - 'span.record("gl_root_namespace_id", id);'
  - 'tracing::Span::current().record("branch", branch.as_str());'
  - 'span.record(REASON, value);'
  - 'tracing::Span::current().record(orbit_log_fields::safe::REASON, value);'
