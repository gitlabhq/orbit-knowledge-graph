id: no-print
language: rust
severity: error
message: Server code must not print. Log through the orbit_log_fields macros.
note: |
  Output that bypasses `tracing` bypasses the expanded logs policy. Local
  tools (orbit-cli, xtask, profilers, tests) may print.
rule:
  any:
    - kind: macro_invocation
      has:
        field: macro
        regex: '^(::)?(std::)?(print|println|eprint|eprintln|dbg)$'
    - kind: call_expression
      has:
        field: function
        regex: '^(::)?(std::)?(io::)?(stdout|stderr)$'
    - kind: identifier
      regex: '^(stdout|stderr)$'
      precedes:
        kind: token_tree
        regex: '^\(\s*\)$'
      inside:
        kind: token_tree
        inside:
          kind: macro_invocation
          has:
            field: macro
            regex: '^(::)?(std::)?(write|writeln)$'
  not:
    matches: test-code
ignores:
  - crates/orbit-cli/**
  - crates/xtask/**
  - crates/query-engine/profiler/**
  - crates/code-graph/treesitter-visit/src/bin/**
  # Debug tracer that only integration tests turn on.
  - crates/code-graph/src/v2/trace.rs
