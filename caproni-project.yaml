# yaml-language-server: $schema=https://gitlab.com/gitlab-org/caproni/-/raw/main/schema/caproni-project.schema.json

lifecycle_hooks:
  - type: edit_mode_prepare
    script: mise trust && mise install && scripts/dev/caproni-edit-mode.sh build

reloaders:
  orbit-webserver:
    type: mirror
    repository: knowledge-graph
    edit_mode: false
    mirror:
      target:
        namespace: gitlab
        kubernetes_type: deployment
        name: orbit-webserver
        container: orbit-webserver
      filesystem:
        mode: localwithoverrides
        read_only:
          - "^/app/config(/.*)?$"
          - "^/etc/secrets(/.*)?$"
          - "^/etc/tls(/.*)?$"
      network:
        outgoing:
          # Caproni's supervisor dials localhost:<port> before it starts a
          # process. Without this the dial is intercepted and answered by the
          # pod, which reports the port as taken when nothing listens on the
          # host. With it, the check sees the host, so a native `mise run dev`
          # holding 50054 is reported for what it is.
          ignore_localhost: true
      edit_mode_processes:
        gkg-build:
          command: scripts/dev/caproni-edit-mode.sh watch
          context: local
        orbit-webserver:
          command: scripts/dev/caproni-edit-mode.sh webserver
          port: 50054
  orbit-indexer-sdlc:
    type: mirror
    repository: knowledge-graph
    edit_mode: false
    mirror:
      target:
        namespace: gitlab
        kubernetes_type: deployment
        name: orbit-indexer-sdlc
        container: orbit-indexer
      filesystem:
        mode: localwithoverrides
        read_only:
          - "^/app/config(/.*)?$"
          - "^/etc/secrets(/.*)?$"
          - "^/etc/tls(/.*)?$"
      network:
        outgoing:
          ignore_localhost: true
      edit_mode_processes:
        gkg-build:
          command: scripts/dev/caproni-edit-mode.sh watch
          context: local
        orbit-indexer-sdlc:
          command: scripts/dev/caproni-edit-mode.sh indexer-sdlc
  orbit-indexer-code:
    type: mirror
    repository: knowledge-graph
    edit_mode: false
    mirror:
      target:
        namespace: gitlab
        kubernetes_type: deployment
        name: orbit-indexer-code
        container: orbit-indexer
      filesystem:
        mode: localwithoverrides
        read_only:
          - "^/app/config(/.*)?$"
          - "^/etc/secrets(/.*)?$"
          - "^/etc/tls(/.*)?$"
      network:
        outgoing:
          ignore_localhost: true
      edit_mode_processes:
        gkg-build:
          command: scripts/dev/caproni-edit-mode.sh watch
          context: local
        orbit-indexer-code:
          command: scripts/dev/caproni-edit-mode.sh indexer-code
  orbit-dispatcher:
    type: mirror
    repository: knowledge-graph
    edit_mode: false
    mirror:
      target:
        namespace: gitlab
        kubernetes_type: deployment
        name: orbit-dispatcher
        container: orbit-dispatcher
      filesystem:
        mode: localwithoverrides
        read_only:
          - "^/app/config(/.*)?$"
          - "^/etc/secrets(/.*)?$"
          - "^/etc/tls(/.*)?$"
      network:
        outgoing:
          ignore_localhost: true
      edit_mode_processes:
        gkg-build:
          command: scripts/dev/caproni-edit-mode.sh watch
          context: local
        orbit-dispatcher:
          command: scripts/dev/caproni-edit-mode.sh dispatcher
