# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade; direct workspace dep and transitive via arrow" },
    # astral-tokio-tar unmaintained - dev-only via testcontainers, reached through
    # integration-testkit and testcontainers-modules (nats-client, integration-tests).
    # No safe upgrade available. Remove when testcontainers drops it
    # (check: cargo tree -i astral-tokio-tar)
    "RUSTSEC-2026-0440",
    # zstd 0.13.3 / zstd-safe 7.2.4 stay in the lock for tonic 0.14.6 (gRPC compression) and
    # arrow-ipc/parquet 58. They call only zstd::stream::read::{Encoder, Decoder}::new and the
    # bulk API, which neither advisory affects: 0391 needs raw with_context, 0403 needs the
    # write Decoder. 0398 needs the seekable feature, which no crate enables. Our crates use
    # zstd 0.14.3. Remove when tonic and arrow move to zstd 0.14
    # (check: cargo tree -i zstd@0.13.3 --target all).
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016", # finl_unicode via comrak; OSI-approved predecessor of Unicode-3.0
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "LicenseRef-EE",
    "OpenSSL", # aws-lc-sys and aws-lc-fips-sys via rustls
    "0BSD", # mock_instant via lance-graph
    "BSL-1.0", # xxhash-rust via lance-graph
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
registries = []

