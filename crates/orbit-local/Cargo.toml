[package]
name = "orbit-local"
version.workspace = true
edition = "2024"
build = "build.rs"

[[bin]]
name = "orbit"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Dev-only: swaps the global allocator for the RSS-correlated profiler and
# writes a report at the end of `index`. See crates/memprof.
memprof = ["dep:memprof"]

[dependencies]
mimalloc = { workspace = true }
memprof = { path = "../memprof", optional = true }
arrow = { workspace = true, features = ["prettyprint"] }
code-graph = { path = "../code-graph" }
duckdb-client = { path = "../duckdb-client" }
orbit-prompts = { path = "../orbit-prompts" }
orbit-utils = { path = "../utils" }
ontology = { path = "../ontology" }
gitalisk-core = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
rmcp = { workspace = true }
rust-embed = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
strum = { workspace = true }

[build-dependencies]
orbit-prompts = { path = "../orbit-prompts" }

[dev-dependencies]
tempfile = { workspace = true }
