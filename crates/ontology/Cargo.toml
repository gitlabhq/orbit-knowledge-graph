[package]
name = "ontology"
version.workspace = true
edition = "2024"

[features]
# `sha2` (RustCrypto) is the default fingerprint SHA-256 backend.
default = ["sha2"]
# Non-FIPS SHA-256 backend.
sha2 = ["dep:sha2"]
# FIPS: compute the ontology/DDL fingerprint SHA-256 with the FIPS-validated
# AWS-LC module (aws-lc-rs) instead of RustCrypto `sha2`. Enabled by orbit-server's
# `fips` feature so no non-TLS SHA-256 on the server's boundary runs on a
# non-validated implementation. When `fips` is set the code path uses aws-lc-rs
# regardless of whether `sha2` is also present (feature unification may still
# pull `sha2` via another crate's default; it is then compiled but not used).
fips = ["dep:aws-lc-rs"]

[dependencies]
const_format = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
minijinja = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
rust-embed = { workspace = true, features = ["include-exclude"] }
strum = { workspace = true }
