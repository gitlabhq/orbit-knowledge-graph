apiVersion: orbit.gitlab.com/extensions/v1alpha1
kind: Package
metadata:
  name: example.widgets
  version: 0.1.0
graph:
  entities:
    Widget:
      label: name
      properties:
        id: { type: int64 }
        name: { type: string }
        status: { type: string }
    Gadget:
      label: title
      properties:
        id: { type: int64 }
        title: { type: string }
        size: { type: int64 }
  relationships:
    PART_OF:
      variants:
        - { from: Gadget, to: Widget, fk: { column: widget_id } }
    LINKS:
      variants:
        - { from: Widget, to: Gadget, table: ex_widget_links }
authorization:
  entities:
    Widget: { scope: namespace }
    Gadget: { scope: namespace }
storage:
  store: graph
  entities:
    Widget:
      columns: { id: Int64, name: String, status: LowCardinality(String) }
      sort_key: [traversal_path, id]
    Gadget:
      columns: { id: Int64, title: String, size: Int64 }
      sort_key: [traversal_path, id]
sources:
  source: data_lake
  entities:
    Widget: { tables: [ex_widgets], order_by: [traversal_path, id] }
    Gadget: { tables: [ex_gadgets], order_by: [traversal_path, id] }
live:
  entities:
    Widget:
      properties:
        colour: { type: string }
        weight: { type: float }
      operation:
        name: widgets.get
        keys: [name, status]
        max_keys: 200
        timeout_ms: 1500
    Gadget:
      properties:
        shininess: { type: float }
      operation:
        name: gadgets.get
        keys: [title]
        max_keys: 50
        timeout_ms: 1000
