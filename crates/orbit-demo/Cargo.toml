integration-testkit = { path = "../integration-testkit" }
orbit-authorization = { path = "../orbit-authorization" }
orbit-migrations = { path = "../orbit-migrations" }
orbit-server = { path = "../orbit-server" }
orbit-server-config = { path = "../orbit-server-config" }
orbit-utils = { path = "../utils" }
query-data-model = { path = "../query-data-model", features = ["testkit"] }
query-engine = { path = "../query-engine" }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
