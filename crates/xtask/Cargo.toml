[package]
name = "xtask"
version.workspace = true
edition = "2024"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints.rust]
# Downgraded from workspace `forbid` to `deny` so the generator's
# hot-path hex formatting can use #[allow(unsafe_code)] locally.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
serde = { workspace = true }
toml = { workspace = true }

# `toml` is used only from `build_support/crate_map_drift.rs`, which is pulled
# in via `include!` from `build.rs` and `tests/`; cargo-shear does not follow
# `include!`, so it reports `toml` as unused.
[package.metadata.cargo-shear]
ignored = ["toml"]

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
parquet = { workspace = true }
sqlformat = { workspace = true }
tabled = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
orbit-observability = { workspace = true }
orbit-server-config = { path = "../orbit-server-config" }
ontology = { path = "../ontology" }
schemars = { workspace = true }
clickhouse = { workspace = true }
clickhouse-client = { path = "../clickhouse-client" }
orbit-utils = { path = "../utils" }
orbit-migrations = { path = "../orbit-migrations" }
orbit-versions = { path = "../orbit-versions" }
query-engine = { path = "../query-engine" }
# Load-test subcommand: gRPC client + JWT auth, reusing the canonical proto
# and claims from orbit-server (no vendored proto, no hand-rolled JWT).
orbit-server = { path = "../orbit-server" }
tonic = { workspace = true }
tokio-stream = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
prost = { workspace = true }
sha2 = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
tempfile = { workspace = true }
