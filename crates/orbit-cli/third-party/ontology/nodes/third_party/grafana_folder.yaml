node_type: GrafanaFolder
domain: third_party
description: "A Grafana folder that holds dashboards and alert rules"
label: title
destination_table: gl_tp_grafana_folder
default_columns: [id, key, title]
redaction: {resource_type: third_party, id_column: id, ability: read_third_party}
properties:
  id: {type: int64, source: id, nullable: false, description: "Orbit ID, a hash of the source and key."}
  traversal_path: {type: string, source: traversal_path, nullable: true, hidden: true, description: ""}
  key: {type: string, source: key, nullable: false, description: "The ID in the source system."}
  source: {type: string, source: source, nullable: false, description: "The source it came from."}
  title: {type: string, source: title, nullable: true, description: ""}
storage:
  columns:
    - {name: id, type: "Int64"}
    - {name: traversal_path, type: "Nullable(String)"}
    - {name: key, type: "String"}
    - {name: source, type: "String"}
    - {name: title, type: "Nullable(String)"}
