base_url: https://slack.com
env: {token: SLACK_TOKEN, url: SLACK_URL, team: SLACK_TEAM}
entities:
  SlackChannel:
    type: channel
    description: A Slack channel you are a member of
    key: [/id]
    label: name
    search: [name, topic, purpose]
    list:
      path: /api/users.conversations
      params: {limit: "200", types: "public_channel,private_channel", exclude_archived: "true", team_id: "{team}"}
      items: /channels
      cursor: {param: cursor, next: /response_metadata/next_cursor}
    get:
      path: /api/conversations.info
      params: {channel: "{key}"}
      items: /channel
    properties:
      name: {from: /name, description: "Channel name without the leading #."}
      topic: {from: /topic/value}
      purpose: {from: /purpose/value}
      created_at: {type: unix_time, from: /created}
  SlackUser:
    type: user
    description: A person in the Slack workspace
    key: [/id]
    label: name
    search: [name, real_name, title]
    list:
      path: /api/users.list
      params: {limit: "200", team_id: "{team}"}
      items: /members
      cursor: {param: cursor, next: /response_metadata/next_cursor}
    get:
      path: /api/users.info
      params: {user: "{key}"}
      items: /user
    properties:
      name: {from: /name}
      real_name: {from: /real_name}
      title: {from: /profile/title}
  SlackMessage:
    type: message
    description: A message posted in a Slack channel
    key: [/channel_id, /message_ts]
    label: text
    search: [text]
    newest: posted_at
    shows: [channel_name, author_name, posted_at]
    search_api:
      path: /api/assistant.search.context
      params: {query: "{query}", limit: "20", sort: timestamp, channel_types: "public_channel,private_channel,mpim,im"}
      cursor: {param: cursor, next: /response_metadata/next_cursor}
      max_pages: 5
      items: /results/messages
      within:
        SlackChannel: "in:<#{key}>"
        SlackUser: "from:<@{key}>"
      within_name:
        SlackChannel: "in:#{name}"
        SlackUser: "from:@{name}"
    get:
      path: /api/conversations.replies
      params: {channel: "{key.0}", ts: "{key.1}", limit: "1", inclusive: "true"}
      items: /messages
      key: ["{key.0}", /ts]
      fields:
        text: /text
        channel: "{key.0}"
        author: /user
        posted_at: /ts
    properties:
      text: {from: /content}
      channel: {from: /channel_id, description: Key of the SlackChannel it was posted in.}
      channel_name: {from: /channel_name}
      author: {from: /author_user_id, description: Key of the SlackUser who posted it.}
      author_name: {from: /author_name}
      posted_at: {type: unix_time, from: /message_ts}
    links:
      - {type: IN_CHANNEL, to: SlackChannel, via: channel}
      - {type: AUTHORED_BY, to: SlackUser, via: author}
