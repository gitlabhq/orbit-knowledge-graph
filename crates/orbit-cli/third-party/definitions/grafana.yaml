env: {token: GRAFANA_TOKEN, url: GRAFANA_URL}
entities:
  GrafanaFolder:
    type: folder
    description: A Grafana folder that holds dashboards and alert rules
    key: [/uid]
    label: title
    search: [title]
    list:
      path: /api/folders
      params: {limit: "1000"}
      items: ""
    properties:
      title: {from: /title}
  GrafanaDashboard:
    type: dashboard
    description: A Grafana dashboard
    key: [/uid]
    label: title
    search: [title, tags, folder_title]
    shows: [folder_title]
    list:
      path: /api/search
      params: {type: dash-db, limit: "5000"}
      items: ""
    search_api:
      path: /api/search
      params: {type: dash-db, query: "{query}", limit: "5000"}
      limit: 5000
      items: ""
      within:
        GrafanaFolder: "folderUIDs={key}"
    properties:
      title: {from: /title}
      tags: {from: /tags}
      folder: {from: /folderUid, description: UID of the GrafanaFolder it is in.}
      folder_title: {from: /folderTitle}
    links:
      - {type: IN_FOLDER, to: GrafanaFolder, via: folder}
  GrafanaAlert:
    type: alert
    description: A Grafana alert rule
    key: [/uid]
    label: title
    search: [title, summary, description, rule_group]
    newest: updated_at
    shows: [rule_group, updated_at]
    list:
      path: /api/v1/provisioning/alert-rules
      items: ""
    properties:
      title: {from: /title}
      rule_group: {from: /ruleGroup}
      summary: {from: /annotations/summary}
      description: {from: /annotations/description}
      updated_at: {type: timestamp, from: /updated}
      folder: {from: /folderUID, description: UID of the GrafanaFolder it is in.}
      dashboard: {from: "/annotations/__dashboardUid__", description: UID of the GrafanaDashboard it is on.}
    links:
      - {type: IN_FOLDER, to: GrafanaFolder, via: folder}
      - {type: ON_DASHBOARD, to: GrafanaDashboard, via: dashboard}
