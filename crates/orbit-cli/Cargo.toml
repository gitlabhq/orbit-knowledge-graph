[package]
name = "orbit-cli"
version.workspace = true
edition = "2024"
build = "build.rs"

[[bin]]
name = "orbit"
path = "src/main.rs"

[lints]
workspace = true

# libduckdb-sys is used only by build.rs, which reads the download directory it publishes as
# DEP_DUCKDB_INCLUDE. cargo-shear does not see build-script use of links metadata.
[package.metadata.cargo-shear]
ignored = ["libduckdb-sys"]

[dependencies]
mimalloc = { workspace = true }
tempfile = { workspace = true }
arrow = { workspace = true, features = ["prettyprint"] }
code-graph-incremental = { path = "../code-graph-incremental" }
duckdb-client = { path = "../duckdb-client" }
libduckdb-sys = { workspace = true }
labkit-events = { workspace = true }
orbit-analytics = { path = "../orbit-analytics" }
orbit-cli-graphql = { workspace = true }
orbit-prompts = { path = "../orbit-prompts", features = ["skill-markers"] }
orbit-search = { path = "../orbit-search" }
orbit-utils = { path = "../utils" }
orbit-arrow = { path = "../utils/arrow" }
ontology = { path = "../ontology" }
gitalisk-core = { workspace = true }
clap = { workspace = true }
cliclack = { workspace = true }
cynic = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
orbit-log-fields = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
regex = { workspace = true }
grep-matcher = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
reqwest = { workspace = true, features = ["gzip", "brotli", "zstd"] }
rmcp = { workspace = true }
rust-embed = { workspace = true, features = ["include-exclude"] }
rustls = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
rustc-hash = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
toml_edit = { workspace = true }
toon-format = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

# musl's malloc serializes under contention and C deps (DuckDB, tree-sitter) call it directly.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true, features = ["override"] }

[build-dependencies]
orbit-prompts = { path = "../orbit-prompts", features = ["skill-validation"] }

[dev-dependencies]
flate2 = { workspace = true }
jsonschema = { workspace = true }
orbit-analytics = { path = "../orbit-analytics", features = ["testkit"] }
