# GitLab CI configuration, including `.gitlab-ci-*.yml` fragments and
# anything under the conventional `.gitlab/ci/` directory that local
# includes pull in.
# Root entries are either global keywords or author-named jobs (hidden
# `.template` jobs included); global variables and stages are named
# children; `include:` statements become imports.
# Import columns: path = source (project path, component spec, template
# name, local path, or URL), name = file within a project include,
# alias = pinned ref or component version.
name: gitlab_ci
match:
  filename_suffixes: [.gitlab-ci.yml, .gitlab-ci.yaml]
  filename_prefixes: [.gitlab-ci]
  directory_prefixes: [.gitlab/ci/]
keywords: [default, include, stages, variables, workflow, spec,
           image, services, cache, before_script, after_script, types]
definitions:
  - type: CiVariable
    children_of: variables
  - type: CiStage
    items_of: stages
  - type: CiJob
    root_keys: true
imports:
  - key: include
    also_under: [trigger]
    scalar_type: CiLocalInclude
    mapping_forms:
      - type: CiProjectInclude
        path_key: project
        name_keys: [file, files]
        alias_key: ref
      - type: CiLocalInclude
        path_key: local
      - type: CiTemplateInclude
        path_key: template
      - type: CiRemoteInclude
        path_key: remote
      - type: CiComponentInclude
        path_key: component
        version_split: "@"
