name: argo_cd
match:
  document_keys:
    kind:
      in: [Application, ApplicationSet]
    apiVersion:
      starts_with: argoproj.io
definitions:
  - type: ArgoCdApplication
    value_of: metadata.name
imports:
  - key: source
    also_under: [spec]
    mapping_forms:
      - type: ArgoCdSource
        path_key: repoURL
        name_keys: [path, chart]
        alias_key: targetRevision
  - key: sources
    also_under: [spec]
    mapping_forms:
      - type: ArgoCdSource
        path_key: repoURL
        name_keys: [path, chart]
        alias_key: targetRevision
