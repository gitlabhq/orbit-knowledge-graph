[package]
name = "treesitter-visit"
version.workspace = true
edition = "2024"
description = "Minimal tree-sitter wrapper for AST parsing and traversal"
license = "MIT"
authors = ["GitLab Inc."]

[dependencies]
orbit-log-fields = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
cpu-time = { workspace = true }

# Tree-sitter
tree-sitter = { workspace = true }
stacker = { workspace = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-kotlin = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-scala = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-elixir = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-hcl = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
tree-sitter-zig = { workspace = true, optional = true }
tree-sitter-containerfile = { workspace = true, optional = true }

[[bin]]
name = "ast"
required-features = ["cli"]

[features]
default = []
cli = ["builtin-parser"]
builtin-parser = [
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-c-sharp",
  "tree-sitter-cpp",
  "tree-sitter-elixir",
  "tree-sitter-go",
  "tree-sitter-java",
  "tree-sitter-kotlin",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-scala",
  "tree-sitter-typescript",
  "tree-sitter-php",
  "tree-sitter-hcl",
  "tree-sitter-swift",
  "tree-sitter-lua",
  "tree-sitter-yaml",
  "tree-sitter-zig",
  "tree-sitter-containerfile",
]
tree-sitter-hcl = ["dep:tree-sitter-hcl"]
tree-sitter-lua = ["dep:tree-sitter-lua"]
tree-sitter-scala = ["dep:tree-sitter-scala"]
tree-sitter-yaml = ["dep:tree-sitter-yaml"]
tree-sitter-zig = ["dep:tree-sitter-zig"]
tree-sitter-containerfile = ["dep:tree-sitter-containerfile"]

[dev-dependencies]

[lints]
workspace = true
