# Python rewrite rules — complete language definition.
# Stamps all synthetics needed by SSA and resolver.

stages:
  - name: normalize
    rules:
      # return expr → __return
      - match: '(return_statement $$$VALS)'
        replace: '(__return $$$VALS)'

      # Hoist decorators onto the inner def/class
      - match: '(decorated_definition $$$DECOS:decorator definition: $D)'
        append_under:
          target: D
          each: DECOS
          kind: __decorator
          tf: 'strip=@'

      # Superclass list → __supertype children
      - match: '(class_definition superclasses: (argument_list $$$SUPERS:identifier|attribute|call))'
        append_under:
          target: ROOT
          each: SUPERS
          kind: __supertype
          tf: 'field=function'

      # __callable detection
      - match: '(class_definition name: $N body: (block (function_definition name: (identifier "__call__"))))'
        append: '(__callable "__call__")'

      # self.x / cls.x → __ivar
      - match: '(attribute object: (identifier "self") attribute: $A)'
        replace: '(__ivar @$A)'
      - match: '(attribute object: (identifier "cls") attribute: $A)'
        replace: '(__ivar @$A)'

      # Aliased import: set sym to real name, append __alias
      - match: '(aliased_import name: $N)'
        set_text: '$N'
      - match: '(aliased_import alias: $A)'
        append: '(__alias @$A)'

  - name: retag-refs
    rules:
      # self.x.method → __member "method" (__object __ivar)
      - match: '(attribute object: $O:__ivar attribute: $M)'
        replace: '(__member @$M (__object $O))'
      # a.b → __member "b" (__object "a")
      - match: '(attribute object: $O attribute: $M)'
        replace: '(__member @$M (__object @$O))'

  - name: retag-calls
    rules:
      - match: '(call function: $F:__ivar arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call function: $F:__member arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call function: $F arguments: $A)'
        replace: '(__call (__callee @$F) $A)'

  - name: imports
    rules:
      # from X import * (must precede named-import rule due to first-match-wins)
      - match: '(import_from_statement module_name: $M $W:wildcard_import)'
        replace: '(__import (__source @$M) (__source_path @$M|to_rel(".")) (__name @$W))'

      # from X import a, b  /  from X import a as b  /  mixed
      - match: '(import_from_statement module_name: $M $$$NAMES:dotted_name|aliased_import)'
        replace: '(__import (__source @$M) (__source_path @$M|to_rel(".")) $$$NAMES->__name)'

      # import X
      - match: '(import_statement name: $N:dotted_name)'
        replace: '(__import (__source @$N) (__source_path @$N|to_rel(".")) (__name @$N))'

      # import X as Y — rekind capture to __name, keeping __alias subtree
      - match: '(import_statement name: $N:aliased_import)'
        replace: '(__import (__source @$N) (__source_path @$N|to_rel(".")) @$N->__name)'

      # from __future__ import X
      - match: '(future_import_statement $$$NAMES:dotted_name)'
        replace: '(__import (__source "__future__") (__source_path "__future__") $$$NAMES=>__name)'

  - name: classify
    rules:
      # Defs
      - match: '(assignment left: $N right: $R:lambda)'
        replace: '(__def (__defname @$N) (__deftype "Lambda") $R)'
      - match: '(assignment left: $N type: $T:type)'
        replace: '(__def (__defname @$N) (__deftype "Field"))'
      - match: '(typed_default_parameter name: $N)'
        replace: '(__binding @$N)'
      - match: '(typed_parameter $C:identifier)'
        replace: '(__binding @$C)'

      # Bindings — RHS wrapped in __rhs for canonical containment
      - match: '(assignment left: $N:__ivar right: $R:__call)'
        replace: '(__binding $N (__rhs $R))'
      - match: '(assignment left: $N:__ivar right: $R)'
        replace: '(__binding $N (__rhs @$R))'
      - match: '(assignment left: $N right: $R:__call)'
        replace: '(__binding @$N (__rhs $R))'
      - match: '(assignment left: $N right: $R)'
        replace: '(__binding @$N (__rhs @$R))'
      - match: '(assignment left: $N:__ivar)'
        replace: '(__binding $N)'
      - match: '(assignment left: $N)'
        replace: '(__binding @$N)'
      - match: '(augmented_assignment left: $N right: $R:__call)'
        replace: '(__binding @$N (__rhs $R))'
      - match: '(augmented_assignment left: $N right: $R)'
        replace: '(__binding @$N (__rhs @$R))'
      - match: '(named_expression name: $N value: $V:__call)'
        replace: '(__binding @$N (__rhs $V))'
      - match: '(named_expression name: $N value: $V)'
        replace: '(__binding @$N (__rhs @$V))'

      # Branches
      - match: '(if_statement condition: $COND consequence: $C $$$ALTS:elif_clause|else_clause)'
        replace: '(__branch $COND (__arm $C) $$$ALTS->__arm)'
      - match: '(if_statement condition: $COND consequence: $C)'
        replace: '(__branch $COND (__arm $C))'
      - match: '(try_statement body: $B $$$ALTS:except_clause|finally_clause)'
        replace: '(__branch (__arm $B) $$$ALTS->__arm)'
      - match: '(match_statement subject: $S body: (block $$$CASES:case_clause))'
        replace: '(__branch $S $$$CASES->__arm)'
      - match: '(conditional_expression)'
        replace: '(__branch)'

      # Loops
      - match: '(for_statement body: $B)'
        replace: '(__loop $B)'
      - match: '(while_statement body: $B)'
        replace: '(__loop $B)'
      - match: '(list_comprehension)'
        replace: '(__loop)'
      - match: '(set_comprehension)'
        replace: '(__loop)'
      - match: '(dictionary_comprehension)'
        replace: '(__loop)'
      - match: '(generator_expression)'
        replace: '(__loop)'

      # Functions (after bindings/control-flow so body is canonical)
      - match: '(function_definition name: $N return_type: $R body: $B $$$ANN:__decorator)'
        replace: '(__def (__defname @$N) (__deftype "Function") (__return_type @$R) (__scope) $$$ANN $B)'
      - match: '(function_definition name: $N body: $B $$$ANN:__decorator)'
        replace: '(__def (__defname @$N) (__deftype "Function") (__scope) $$$ANN $B)'

      # Classes (after functions so methods are canonical)
      - match: '(class_definition name: $N body: $B $$$ANN:__callable|__supertype|__decorator)'
        replace: '(__def (__defname @$N) (__deftype "Class") (__scope) $$$ANN $B)'

resolve:
  display_source: resolved
  lookup_from:
    - __source_root
  stages:
    - name: packages
      rules:
        - match: '(__dir (__file "__init__.py"))'
          append: '(__package)'
        - match: '(__dir (__file "__init__.pyi"))'
          append: '(__package)'
    - name: roots
      climb:
        while: __package
        mark: __source_root
    - name: src_dirs
      rules:
        - match: '(__dir "src")'
          append: '(__source_root)'
