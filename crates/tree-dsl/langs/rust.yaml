# Rust rewrite rules.
# Handles: use declarations, struct/enum/trait/impl/fn defs,
# method calls, field access, self.x, control flow, bindings.

stages:
  - name: normalize
    rules:
      - match: '(return_expression $$$VALS)'
        replace: '(__return $$$VALS)'

      # self.field → __ivar
      - match: '(field_expression value: (self) field: $F)'
        replace: '(__ivar @$F)'

      # Visibility modifier → __visibility (sym carries the text)
      - match: '(visibility_modifier $$$V)'
        replace: '(__visibility $$$V)'

      # struct/enum heritage via derive macros could go here

  - name: retag-refs
    rules:
      - match: '(field_expression value: $O:__ivar field: $F)'
        replace: '(__member @$F (__object $O))'
      - match: '(field_expression value: $O field: $F)'
        replace: '(__member @$F (__object @$O))'

  - name: retag-calls
    rules:
      - match: '(call_expression function: $F:__ivar arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F:__member arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F arguments: $A)'
        replace: '(__call (__callee @$F) $A)'

  - name: imports
    rules:
      # use crate::foo::Bar;
      - match: '(use_declaration argument: $A:scoped_identifier)'
        replace: '(__import (__source @$A|replace("::","/")) (__source_path @$A|replace("::","/")) (__name @$A|split_last("::")))' 

      # use foo::{A, B};
      - match: '(use_declaration argument: (scoped_use_list path: $P list: (use_list $$$NAMES:identifier)))'
        replace: '(__import (__source @$P|replace("::","/")) (__source_path @$P|replace("::","/")) $$$NAMES=>__name)'

      # use foo;
      - match: '(use_declaration argument: $A:identifier)'
        replace: '(__import (__source @$A) (__source_path @$A) (__name @$A))'

  - name: classify
    rules:
      # Bindings
      - match: '(let_declaration pattern: $N value: $V:__call)'
        replace: '(__binding @$N (__rhs $V))'
      - match: '(let_declaration pattern: $N value: $V)'
        replace: '(__binding @$N (__rhs @$V))'
      - match: '(let_declaration pattern: $N)'
        replace: '(__binding @$N)'
      - match: '(const_item name: $N)'
        replace: '(__def (__defname @$N) (__deftype "Constant"))'
      - match: '(static_item name: $N)'
        replace: '(__def (__defname @$N) (__deftype "Static"))'
      - match: '(type_item name: $N)'
        replace: '(__def (__defname @$N) (__deftype "TypeAlias"))'

      # Control flow
      - match: '(if_expression condition: $COND consequence: $C alternative:? $A)'
        replace: '(__branch $COND (__arm $C) (__arm? $A))'
      - match: '(match_expression value: $V body: $B)'
        replace: '(__branch $V $B)'
      - match: '(for_expression body: $B)'
        replace: '(__loop $B)'
      - match: '(while_expression body: $B)'
        replace: '(__loop $B)'
      - match: '(loop_expression body: $B)'
        replace: '(__loop $B)'

      # Trait method signatures (no body) — self variant first
      - match: '(function_signature_item name: $N **/(self_parameter))'
        replace: '(__def (__defname @$N) (__deftype "Function") (__self_method))'
      - match: '(function_signature_item name: $N)'
        replace: '(__def (__defname @$N) (__deftype "Function"))'

      # Functions — self variant first, then generic
      - match: '(function_item name: $N **/(self_parameter) body: $B $$$ANN:__visibility)'
        replace: '(__def (__defname @$N) (__deftype "Function") (__self_method) (__scope) $$$ANN $B)'
      - match: '(function_item name: $N body: $B $$$ANN:__visibility)'
        replace: '(__def (__defname @$N) (__deftype "Function") (__scope) $$$ANN $B)'

      # Containers (after functions)
      - match: '(struct_item name: $N body:? $B)'
        replace: '(__def (__defname @$N) (__deftype "Struct") (__scope) $B)'
      - match: '(enum_item name: $N body: $B)'
        replace: '(__def (__defname @$N) (__deftype "Enum") (__scope) $B)'
      - match: '(trait_item name: $N body: $B)'
        replace: '(__def (__defname @$N) (__deftype "Trait") (__scope) $B)'
      - match: '(impl_item trait: $T type: $TY body: $B)'
        replace: '(__def (__defname @$TY) (__deftype "Impl") (__scope) (__supertype @$T) $B)'
      - match: '(impl_item type: $T body: $B)'
        replace: '(__def (__defname @$T) (__deftype "Impl") (__scope) $B)'

resolve:
  lookup_from:
    - __source_root
    - __crate_root
  stages:
    - name: crate_roots
      rules:
        - match: '(__dir (__file "Cargo.toml") $$$REST)'
          replace: '(__dir (__crate_root) (__file "Cargo.toml") $$$REST)'
        - match: '(__dir (__file "lib.rs") $$$REST)'
          replace: '(__dir (__source_root) (__file "lib.rs") $$$REST)'
        - match: '(__dir (__file "main.rs") $$$REST)'
          replace: '(__dir (__source_root) (__file "main.rs") $$$REST)'
