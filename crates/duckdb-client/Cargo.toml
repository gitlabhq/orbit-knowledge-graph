[package]
name = "duckdb-client"
version.workspace = true
edition = "2024"
license = "LicenseRef-EE"

[features]
# Compile DuckDB from C++ source for a fully static, self-contained binary.
# Use for Docker/release builds: cargo build --release --features duckdb-client/bundled
bundled = ["duckdb/bundled"]

[dependencies]
duckdb = { workspace = true }
arrow = { workspace = true }
code-graph = { path = "../code-graph" }
orbit-search = { path = "../orbit-search" }
orbit-utils = { path = "../utils" }
anyhow = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
ontology = { path = "../ontology" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
