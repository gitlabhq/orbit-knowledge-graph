[package]
name = "sdlc-profiler"
version.workspace = true
edition = "2024"
license = "LicenseRef-EE"
publish = false

[features]
# Production builds mimalloc with `secure`, so the profiler does too: guard
# pages and free-list encoding change the allocator overhead on top of the
# requested bytes, which is most of the gap between the two.
default = ["track-alloc", "secure-alloc"]
track-alloc = ["memprofile/track-alloc"]
good-size = ["memprofile/good-size"]
# Matches orbit-server, which builds mimalloc with guard pages and free-list
# encoding.
secure-alloc = ["mimalloc/secure"]
realloc-pessimistic = ["memprofile/realloc-pessimistic"]

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clickhouse-client = { workspace = true }
futures = { workspace = true }
indexer = { path = "../indexer", features = ["testkit"] }
memprofile = { path = "../memprofile" }
mimalloc = { workspace = true, features = ["extended"] }
ontology = { path = "../ontology" }
orbit-utils = { path = "../utils" }
orbit-server-config = { path = "../orbit-server-config" }
query-engine = { path = "../query-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
