name: "Depth 2 — forward + backward + intersection"
input: {"query_type":"path_finding","nodes":[{"id":"start","entity":"MergeRequest","node_ids":[1]},{"id":"end","entity":"Project","node_ids":[100]}],"path":{"type":"shortest","from":"start","to":"end","max_depth":2,"rel_types":["IN_PROJECT","CONTAINS"]},"limit":10}
expected: |
  (With
    (_nf_start =
      (Limit 500
        (Project [start.id:id start.traversal_path:traversal_path]
          (Filter [!start.deleted]
            (Project [start.id:id start.traversal_path:traversal_path start._deleted:_deleted]
              (Filter [start.id=1]
                (Scan gl_merge_request start FINAL)))))))
    (_nf_end =
      (Limit 500
        (Project [end.id:id end.traversal_path:traversal_path]
          (Filter [!end.deleted]
            (Project [end.id:id end.traversal_path:traversal_path end._deleted:_deleted]
              (Filter [end.id=100]
                (Scan gl_project end FINAL)))))))
    (_path_scope_traversal_paths =
      (Union _path_scope
        (Agg [group: _path_scope_start.traversal_path:traversal_path] [metrics: ]
          (Scan _nf_start _path_scope_start))
        (Agg [group: _path_scope_end.traversal_path:traversal_path] [metrics: ]
          (Scan _nf_end _path_scope_end))))
    (forward =
      (Union _frontier
        (Project [e1.source_id:anchor_id e1.target_id:end_id e1.target_kind:end_kind array(tuple(e1.target_id e1.target_kind)):path_nodes array(e1.relationship_kind):edge_kinds 1:depth e1.traversal_path:traversal_path]
          (Filter [e1.relationship_kind∈["IN_PROJECT","CONTAINS"] e1.source_kind="MergeRequest" !e1.deleted]
            (Join Semi (e1.traversal_path = _path_scope_traversal_paths.traversal_path)
              (Join Semi (e1.source_id = _nf_start.id)
                (Scan gl_edge e1)
                (Scan _nf_start _nf_start))
              (Scan _path_scope_traversal_paths _path_scope_traversal_paths))))))
    (backward =
      (Union _frontier
        (Project [e1.target_id:anchor_id e1.source_id:end_id e1.source_kind:end_kind arrayResize(array(tuple(0 "")) 0):path_nodes array(e1.relationship_kind):edge_kinds 1:depth e1.traversal_path:traversal_path]
          (Filter [e1.relationship_kind∈["IN_PROJECT","CONTAINS"] e1.target_kind="Project" !e1.deleted]
            (Join Semi (e1.traversal_path = _path_scope_traversal_paths.traversal_path)
              (Join Semi (e1.target_id = _nf_end.id)
                (Scan gl_edge e1)
                (Scan _nf_end _nf_end))
              (Scan _path_scope_traversal_paths _path_scope_traversal_paths))))))
    (Limit 11
      (Sort [paths.depth↑]
        (Project [paths._gkg_path:_gkg_path paths._gkg_edge_kinds:_gkg_edge_kinds paths.depth:depth]
          (Union paths
            (Project [f.depth:depth arrayConcat(array(tuple(f.anchor_id "MergeRequest")) f.path_nodes):_gkg_path f.edge_kinds:_gkg_edge_kinds]
              (Join Semi (f.end_id = _nf_end.id)
                (Filter [f.depth=1 f.end_kind="Project"]
                  (Scan forward f))
                (Scan _nf_end _nf_end)))
            (Project [plus(f.depth b.depth):depth arrayConcat(array(tuple(f.anchor_id "MergeRequest")) f.path_nodes arrayReverse(b.path_nodes) array(tuple(b.anchor_id "Project"))):_gkg_path arrayConcat(f.edge_kinds arrayReverse(b.edge_kinds)):_gkg_edge_kinds]
              (Filter [plus(f.depth b.depth)≤2]
                (Join Inner (f.end_id = b.end_id ∧ f.traversal_path = b.traversal_path)
                  (Scan forward f)
                  (Scan backward b)))))))))
