name: "Depth 3 — forward body is Union of 2 depth arms"
input:
  json: |
    {"query_type":"path_finding","nodes":[{"id":"start","entity":"MergeRequest","node_ids":[1]},{"id":"end","entity":"Project","node_ids":[100]}],"path":{"type":"shortest","from":"start","to":"end","max_depth":3,"rel_types":["IN_PROJECT","CONTAINS"]},"limit":10}
expected:
  op: TopN
  input:
    op: Cte
    name: _nf_start
    consumer:
      op: Cte
      name: forward
      body:
        op: Union
        arms:
          - op: Scan
            alias: e1
          - op: Join
            left:
              op: Scan
              alias: e1
            right:
              op: Scan
              alias: e2
      consumer:
        op: Cte
        name: _nf_end
        consumer:
          op: Cte
          name: backward
