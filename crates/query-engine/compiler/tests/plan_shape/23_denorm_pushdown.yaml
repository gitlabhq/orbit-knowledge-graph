name: "Denorm tag pushdown - single hop FK with state filter"
input:
  json: |
    {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"state":"merged"}},{"id":"p","entity":"Project","node_ids":[1]}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"}],"limit":10}
expected:
  op: TopN
  input:
    op: Join
    left:
      op: Scan
      table: gl_merge_request
      alias: mr
      dedup: true
    right:
      op: Scan
      table: gl_project
      alias: p
      dedup: true
absent:
  - table: gl_edge
