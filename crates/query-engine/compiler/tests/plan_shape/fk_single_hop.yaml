name: "AUTHORED has FK — no edge table"
input: {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest"},{"id":"u","entity":"User","node_ids":[1]}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr"}],"limit":10}
expected: |
  (Limit 11
    (Project
        'AUTHORED' AS e0_type
        u.id AS e0_src
        'User' AS e0_src_type
        mr.id AS e0_dst
        'MergeRequest' AS e0_dst_type
        mr.id AS mr_id
        mr.iid AS mr_iid
        excerpt(mr.title) AS mr_title
        mr.state AS mr_state
        excerpt(mr.source_branch) AS mr_source_branch
