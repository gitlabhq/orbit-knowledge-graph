name: "Variable-length 1..3 — 3 depth arms with narrowing CTE"
input: {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p","hops":[1,3]}],"limit":10}
expected: |
  (Limit 11
    (Project
