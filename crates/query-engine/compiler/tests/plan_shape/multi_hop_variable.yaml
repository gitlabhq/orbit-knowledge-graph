        e0.source_id AS hop_e0_src
        e0.source_kind AS hop_e0_src_type
        e0.target_id AS hop_e0_dst
        e0.target_kind AS hop_e0_dst_type
        e0.path_nodes AS hop_e0_path_nodes
      (Filter
          e0.source_kind = 'User'
          e0.source_id = 1
          e0.target_kind = 'Project'
          !deleted(e0)
        (Union AS e0
          (Project
              e1.traversal_path AS traversal_path
              e1.relationship_kind AS relationship_kind
              e1.source_id AS source_id
              e1.source_kind AS source_kind
              e1.target_id AS target_id
              e1.target_kind AS target_kind
              e1.source_tags AS source_tags
              e1.target_tags AS target_tags
              [tuple(e1.target_id, e1.target_kind)] AS path_nodes
              1 AS depth
              e1._deleted AS _deleted
            (Filter e1.relationship_kind = 'MEMBER_OF', !deleted(e1)
              (Scan gl_edge AS e1)))
          (Project
              e1.traversal_path AS traversal_path
              e1.relationship_kind AS relationship_kind
              e1.source_id AS source_id
              e1.source_kind AS source_kind
              e2.target_id AS target_id
              e2.target_kind AS target_kind
              e1.source_tags AS source_tags
              e2.target_tags AS target_tags
              [tuple(e1.target_id, e1.target_kind), tuple(e2.target_id, e2.target_kind)] AS path_nodes
              2 AS depth
              e1._deleted AS _deleted
            (Join ON e1.target_id = e2.source_id
              (Filter e1.relationship_kind = 'MEMBER_OF', !deleted(e1)
                (Scan gl_edge AS e1))
              (Filter e2.relationship_kind = 'MEMBER_OF', !deleted(e2)
                (Scan gl_edge AS e2))))
          (Project
              e1.traversal_path AS traversal_path
              e1.relationship_kind AS relationship_kind
              e1.source_id AS source_id
              e1.source_kind AS source_kind
              e3.target_id AS target_id
              e3.target_kind AS target_kind
              e1.source_tags AS source_tags
              e3.target_tags AS target_tags
              [tuple(e1.target_id, e1.target_kind), tuple(e2.target_id, e2.target_kind), tuple(e3.target_id, e3.target_kind)] AS path_nodes
              3 AS depth
              e1._deleted AS _deleted
            (Join ON e2.target_id = e3.source_id
              (Join ON e1.target_id = e2.source_id
                (Filter e1.relationship_kind = 'MEMBER_OF', !deleted(e1)
                  (Scan gl_edge AS e1))
                (Filter e2.relationship_kind = 'MEMBER_OF', !deleted(e2)
                  (Scan gl_edge AS e2)))
              (Filter e3.relationship_kind = 'MEMBER_OF', !deleted(e3)
                (Scan gl_edge AS e3))))))))
