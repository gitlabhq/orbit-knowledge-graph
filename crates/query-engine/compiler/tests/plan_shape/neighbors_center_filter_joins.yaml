name: "Non-denorm center filter forces node table join with FINAL"
input:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"title":{"contains":"fix"}}}],"neighbors":{"direction":"outgoing"},"limit":20}
expected:
  op: TopN
  input:
    op: Join
    left:
      op: Scan
      table: gl_edge
      dedup: false
    right:
      op: Scan
      table: gl_merge_request
      dedup: true
