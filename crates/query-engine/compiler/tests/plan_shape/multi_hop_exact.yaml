              e1.source_tags AS source_tags
              e2.target_tags AS target_tags
              [tuple(e1.target_id, e1.target_kind), tuple(e2.target_id, e2.target_kind)] AS path_nodes
              2 AS depth
              e1._deleted AS _deleted
            (Join ON e1.target_id = e2.source_id
              (Filter e1.relationship_kind = 'CONTAINS', !deleted(e1), scope(e1)
                (Scan gl_edge AS e1))
              (Filter e2.relationship_kind = 'CONTAINS', !deleted(e2)
                (Scan gl_edge AS e2))))))))
