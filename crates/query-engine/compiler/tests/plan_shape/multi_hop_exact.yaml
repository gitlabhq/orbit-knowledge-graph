name: "Exact 2 hops — 1 depth arm with narrowing CTE"
input: {"query_type":"traversal","nodes":[{"id":"g","entity":"Group","node_ids":[1]},{"id":"p","entity":"Project"}],"relationships":[{"type":"CONTAINS","from":"g","to":"p","hops":[2,2]}],"limit":10}
expected: |
  (Limit 11
    (Project
        e0.relationship_kind AS hop_e0_type
        e0.source_id AS hop_e0_src
        e0.source_kind AS hop_e0_src_type
        e0.target_id AS hop_e0_dst
        e0.target_kind AS hop_e0_dst_type
        e0.path_nodes AS hop_e0_path_nodes
      (Filter
          e0.source_kind = 'Group'
          e0.source_id = 1
          e0.target_kind = 'Project'
          !deleted(e0)
        (Union AS e0
          (Project
              e1.traversal_path AS traversal_path
              e1.relationship_kind AS relationship_kind
