name: "Aggregation with group-by and FK elision"
input:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest"},
        {"id": "p", "entity": "Project", "node_ids": [1]}
      ],
      "relationships": [{"type": "IN_PROJECT", "from": "mr", "to": "p"}],
      "group_by": ["p"],
      "aggregations": [{"count": "mr", "as": "n"}],
      "limit": 10
    }
expected:
  op: Aggregate
  input:
    op: Join
