---
cases:
  - name: contains ignores case, spans a token boundary, matches a word prefix, and prunes granules with the ngram skip index
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "mr", "entity": "MergeRequest", "id_range": {"start": 2000, "end": 2200},
                     "columns": ["title"],
                     "filters": {"title": {"contains": "SHIP FEAT"}}}],
          "order_by": "mr.id",
          "limit": 10
        }
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.id >= 2000 AND mr.id <= 2200 AND mr.title CONTAINS 'SHIP FEAT'
        RETURN mr.title ORDER BY mr.id LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - multiSearchAny(lower(mr.title), [lower('SHIP FEAT')])
          not_contains: []
        indexes:
          - table: gl_merge_request
            name: idx_title_ngram
