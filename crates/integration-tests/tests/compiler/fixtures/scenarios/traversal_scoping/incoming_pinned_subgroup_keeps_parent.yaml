---
cases:
  - name: Incoming containment from a pinned subgroup keeps its ancestor's scope
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"child","entity":"Group","node_ids":[200]},{"id":"parent","entity":"Group","columns":["name"]}],
         "relationships":[{"type":"CONTAINS","from":"child","to":"parent","direction":"incoming"}],"group_by":["parent"],"aggregations":[{"count":"parent","as":"n"}],"limit":10}
      gql: |
        MATCH (child:Group {id: 200})<-[:CONTAINS]-(parent:Group) RETURN parent{.id, .name}, count(parent) AS n LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - gl_edge
          not_contains: []
