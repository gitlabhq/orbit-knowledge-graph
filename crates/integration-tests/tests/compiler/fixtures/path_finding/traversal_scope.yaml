cases:
  - name: Filtered code endpoints keep every frontier hop inside one traversal path
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"start","entity":"Definition","filters":{"name":{"eq":"compile"}}},{"id":"end","entity":"Definition","filters":{"name":{"eq":"run_query"}}}],"path":{"type":"shortest","from":"start","to":"end","max_depth":3,"rel_types":["CALLS"]},"limit":10}
      gql: |
        MATCH p = ANY SHORTEST (start:Definition {name: 'compile'})-[:CALLS*1..3]->(`end`:Definition {name: 'run_query'}) RETURN p LIMIT 10
    logical:
      expect: ["(Input path_finding (...))"]
    physical:
      clickhouse:
        planned:
          expect: ["(PathFinding start->end depth=3 forward=2 backward=1 scoped=true tables=[gl_code_edge] relationships=[CALLS] (_) (_))"]
        emitted:
          ctes:
            exact_order: [_orbit_nf_start, _orbit_nf_end, _orbit_path_scope, _orbit_forward, _orbit_backward]
          expect:
            - (CTE _orbit_path_scope (Union ALL (_) (_)))
            - (Filter _orbit_e1.source_id IN _orbit_nf_start.id, _orbit_e1.source_kind = 'Definition', _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path, ... (_))
            - (Join ON (_orbit_e1.target_id = _orbit_e2.source_id) AND (_orbit_e1.target_kind = _orbit_e2.source_kind) AND (_orbit_e1.traversal_path = _orbit_e2.traversal_path) AND (_orbit_e2.relationship_kind = 'CALLS') AND _orbit_e2.traversal_path IN _orbit_path_scope.traversal_path (_) (_))
            - (Filter _orbit_e1.target_id IN _orbit_nf_end.id, _orbit_e1.target_kind = 'Definition', _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path, ... (_))
            - (Join ON (_orbit_forward._orbit_end_node = _orbit_backward._orbit_end_node) AND (_orbit_forward._orbit_end_kind = _orbit_backward._orbit_end_kind) AND (_orbit_forward.traversal_path = _orbit_backward.traversal_path) (_) (_))

  - name: Cross-level endpoints scope frontiers by the union of both endpoint paths
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"from","entity":"Group","node_ids":[9970]},{"id":"to","entity":"Project","node_ids":[278964]}],"path":{"type":"shortest","from":"from","to":"to","max_depth":3,"rel_types":["CONTAINS"]}}
      gql: |
        MATCH p = ANY SHORTEST (from:Group {id: 9970})-[:CONTAINS*1..3]->(to:Project {id: 278964}) RETURN p
    logical:
      expect: ["(Input path_finding (...))"]
    physical:
      clickhouse:
        planned:
          expect: ["(PathFinding from->to depth=3 forward=2 backward=1 scoped=true ... (_) (_))"]
        emitted:
          expect:
            - (CTE _orbit_path_scope (Union ALL (Aggregate ... (Scan Table(_orbit_nf_from) AS _orbit_path_scope_start)) (Aggregate ... (Scan Table(_orbit_nf_to) AS _orbit_path_scope_end))))
            - (Filter _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path, ... (_))
