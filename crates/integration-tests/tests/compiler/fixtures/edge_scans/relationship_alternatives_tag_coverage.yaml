name: Covered relationship alternatives share denormalized tag filtering

query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","filters":{"user_type":"human"}},{"id":"mr","entity":"MergeRequest","node_ids":[99002]}],"relationships":[{"type":["REVIEWER","APPROVED"],"from":"u","to":"mr"}],"aggregations":[{"count":"u","as":"n"}]}
  gql: |
    MATCH (u:User {user_type: 'human'})-[:REVIEWER|APPROVED]->(mr:MergeRequest {id: 99002})
    RETURN count(u) AS n

logical:
  expect:
    - (Aggregate COUNT(u) AS n (_))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_edge_0.source_tags HAS ANY ['user_type:human'], ... (Scan Table(gl_edge) AS _orbit_edge_0))
    emitted:
      expect:
        - (Filter ArrayContains(_orbit_edge_0.source_tags, 'user_type:human'), ... (Bind _orbit_edge_0 (_)))
