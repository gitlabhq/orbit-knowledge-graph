name: Denormalized singleton sets and boolean filters retain value tokens

query:
  gql: |
    MATCH (j:Job {id: 1})-[:TRIGGERS_PIPELINE]->(p:Pipeline)
    WHERE p.source IN ['push'] AND p.tag = true
    RETURN j, p

logical:
  expect: ["(Filter p.source IN ['push'], p.tag = true (_))"]

physical:
  clickhouse:
    planned:
      expect: ["(Filter _orbit_edge_0.target_tags HAS ANY ['source:push'], _orbit_edge_0.target_tags HAS ANY ['tag:true'], ... (_))"]
    emitted:
      expect: ["(Filter ArrayContains(_orbit_edge_0.target_tags, 'source:push'), ArrayContains(_orbit_edge_0.target_tags, 'tag:true'), ... (_))"]
      reject: ["(CTE _orbit_nf_p (_))", "(Filter ArrayContains(_orbit_edge_0.target_tags, 'tag:'), ... (_))"]
