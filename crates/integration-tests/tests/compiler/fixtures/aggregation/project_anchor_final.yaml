security: { admin: true, access_level: 50 }

cases:
  - name: A project ID equality alone keeps FINAL on the counted table
    query:
      gql: |
        MATCH (d:Definition) WHERE d.project_id = 278964 RETURN count(d) AS total
    physical:
      clickhouse:
        planned:
          expect:
            - (Aggregate COUNT() AS total (_))
            - (Filter d.project_id = 278964 (Deduplicate Final (Scan Table(gl_definition) AS d)))
        final_ast:
          expect: ["(Deduplicate Final (Scan Table(gl_definition) AS d))"]

  - name: A project ID set alone keeps FINAL on the counted table
    query:
      gql: |
        MATCH (d:Definition) WHERE d.project_id IN [69095239, 278964, 74646916] RETURN count(d) AS total
    physical:
      clickhouse:
        planned:
          expect:
            - (Aggregate COUNT() AS total (_))
            - (Filter d.project_id IN [69095239, 278964, 74646916] (Deduplicate Final (Scan Table(gl_definition) AS d)))
        final_ast:
          expect: ["(Deduplicate Final (Scan Table(gl_definition) AS d))"]
