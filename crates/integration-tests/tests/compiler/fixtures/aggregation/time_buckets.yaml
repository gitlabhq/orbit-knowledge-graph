cases:
  - name: A minute bucket on pinned ids casts to a second-precision timestamp
    query:
      gql: |
        MATCH (u:Note) WHERE u.id IN [1, 2] RETURN date_trunc('minute', u.created_at), count(u) AS n LIMIT 10
    logical:
      expect: ["(Filter u.id IN [1, 2] (NodeScan Note AS u))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Aggregate group bucket(minute, u.created_at), bucket(minute, u.created_at) AS u_created_at_minute, COUNT() AS n (_))"]
        sql:
          contains: ["toDateTime64(toStartOfMinute(", "), 0) AS u_created_at_minute"]

  - name: An hour bucket under a property filter casts to a second-precision timestamp
    query:
      gql: |
        MATCH (u:Note) WHERE u.created_at >= '2026-04-01T00:00:00Z' RETURN date_trunc('hour', u.created_at), count(u) AS n LIMIT 50
    logical:
      expect: ["(Filter u.created_at >= '2026-04-01T00:00:00Z' (NodeScan Note AS u))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Aggregate group bucket(hour, u.created_at), bucket(hour, u.created_at) AS u_created_at_hour, COUNT() AS n (_))"]
        sql:
          contains: ["toDateTime64(toStartOfHour(", "), 0) AS u_created_at_hour"]

  - name: A day bucket casts to a date
    query:
      gql: |
        MATCH (u:Note {id: 1}) RETURN date_trunc('day', u.created_at), count(u) AS n LIMIT 10
    logical:
      expect: ["(Filter u.id IN [1] (NodeScan Note AS u))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Aggregate group bucket(day, u.created_at), bucket(day, u.created_at) AS u_created_at_day, COUNT() AS n (_))"]
        sql:
          contains: ["toDate32(toStartOfDay("]

  - name: A week bucket casts to a date
    query:
      gql: |
        MATCH (u:Note {id: 1}) RETURN date_trunc('week', u.created_at), count(u) AS n LIMIT 10
    logical:
      expect: ["(Filter u.id IN [1] (NodeScan Note AS u))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Aggregate group bucket(week, u.created_at), bucket(week, u.created_at) AS u_created_at_week, COUNT() AS n (_))"]
        sql:
          contains: ["toDate32(toStartOfWeek("]

  - name: A month bucket under a property filter casts to a date under the derived column name
    query:
      gql: |
        MATCH (u:Note {confidential: false}) RETURN date_trunc('month', u.created_at), count(u) AS n LIMIT 50
    logical:
      expect: ["(Filter u.confidential = false (NodeScan Note AS u))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Aggregate group bucket(month, u.created_at), bucket(month, u.created_at) AS u_created_at_month, COUNT() AS n (_))"]
        sql:
          contains: ["toDate32(toStartOfMonth(", "))) AS u_created_at_month"]

  - name: A quarter bucket casts to a date
    query:
      gql: |
        MATCH (u:Note {id: 1}) RETURN date_trunc('quarter', u.created_at), count(u) AS n LIMIT 10
    logical:
      expect: ["(Filter u.id IN [1] (NodeScan Note AS u))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Aggregate group bucket(quarter, u.created_at), bucket(quarter, u.created_at) AS u_created_at_quarter, COUNT() AS n (_))"]
        sql:
          contains: ["toDate32(toStartOfQuarter("]

  - name: A year bucket casts to a date
    query:
      gql: |
        MATCH (u:Note {id: 1}) RETURN date_trunc('year', u.created_at), count(u) AS n LIMIT 10
    logical:
      expect: ["(Filter u.id IN [1] (NodeScan Note AS u))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Aggregate group bucket(year, u.created_at), bucket(year, u.created_at) AS u_created_at_year, COUNT() AS n (_))"]
        sql:
          contains: ["toDate32(toStartOfYear("]

  - name: A bucket alias replaces the derived column name
    query:
      gql: |
        MATCH (u:Note {id: 1}) RETURN date_trunc('month', u.created_at) AS bucket, count(u) AS n LIMIT 10
    logical:
      expect: ["(Filter u.id IN [1] (NodeScan Note AS u))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Aggregate group bucket(month, u.created_at), bucket(month, u.created_at) AS bucket, COUNT() AS n (_))"]
