cases:
  - name: A pinned node is a point lookup
    query:
      gql: |
        MATCH (w:WorkItem {id: 4000}) RETURN w
    logical: { expect: ["(Filter w.id IN [4000] (_))"] }
    physical:
      clickhouse:
        point_lookup: true
        emitted:
          ctes:
            absent: true
        settings:
          exact:
            max_ast_depth: "10000"
            max_ast_elements: "1000000"
            max_execution_time: "30"
            max_expanded_ast_elements: "10000000"
            query_cache_ttl: "10"
            use_query_cache: "0"

  - name: An open joined node is not a point lookup
    query:
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(w:WorkItem) RETURN p, w LIMIT 10
    logical: { expect: ["(EdgeScan IN_PROJECT w->p AS e0)"] }
    physical:
      clickhouse:
        point_lookup: false
        settings:
          exact:
            max_ast_depth: "10000"
            max_ast_elements: "1000000"
            max_execution_time: "30"
            max_expanded_ast_elements: "10000000"
            optimize_move_to_prewhere_if_final: "1"
            query_cache_nondeterministic_function_handling: "'ignore'"
            query_cache_system_table_handling: "'ignore'"
            query_cache_ttl: "10"
            use_index_for_in_with_subqueries_max_values: "1000000"
            use_query_cache: "1"

  - name: Pinned nodes over single hops form a point lookup
    query:
      gql: |
        MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project {id: 1000})<-[:IN_PROJECT]-(w:WorkItem {id: 4000}) RETURN g, p, w
    logical: { expect: ["(Filter g.id IN [100] (_))", "(Filter p.id IN [1000] (_))", "(Filter w.id IN [4000] (_))"] }
    physical:
      clickhouse:
        point_lookup: true
        settings:
          exact:
            enable_materialized_cte: "1"
            max_ast_depth: "10000"
            max_ast_elements: "1000000"
            max_execution_time: "30"
            max_expanded_ast_elements: "10000000"
            optimize_move_to_prewhere_if_final: "1"
            query_cache_ttl: "10"
            use_index_for_in_with_subqueries_max_values: "1000000"
            use_query_cache: "0"

  - name: A variable hop prevents point lookup classification
    query:
      gql: |
        MATCH (a:WorkItem {id: 4000})-[:RELATED_TO*1..3]->(b:WorkItem {id: 4001}) RETURN a, b
    logical: { expect: ["(EdgeScan RELATED_TO a->b AS e0 HOPS 1..3)"] }
    physical:
      clickhouse:
        point_lookup: false
        settings:
          exact:
            enable_materialized_cte: "1"
            max_ast_depth: "10000"
            max_ast_elements: "1000000"
            max_execution_time: "30"
            max_expanded_ast_elements: "10000000"
            query_cache_nondeterministic_function_handling: "'ignore'"
            query_cache_system_table_handling: "'ignore'"
            query_cache_ttl: "10"
            use_index_for_in_with_subqueries_max_values: "1000000"
            use_query_cache: "1"

  - name: A pinned aggregation is a point lookup
    query:
      gql: |
        MATCH (w:WorkItem {id: 4000}) RETURN count(w) AS c
    logical: { expect: ["(Aggregate COUNT(w) AS c (_))"] }
    physical:
      clickhouse:
        point_lookup: true
        settings:
          exact:
            max_ast_depth: "10000"
            max_ast_elements: "1000000"
            max_execution_time: "30"
            max_expanded_ast_elements: "10000000"
            query_cache_ttl: "10"
            use_query_cache: "0"

  - name: An ID range is not a point lookup
    query:
      gql: |
        MATCH (w:WorkItem) WHERE w.id >= 1 AND w.id <= 100000 RETURN w LIMIT 10
    logical: { expect: ["(Filter w.id >= 1, w.id <= 100000 (_))"] }
    physical:
      clickhouse:
        point_lookup: false
        settings:
          exact:
            max_ast_depth: "10000"
            max_ast_elements: "1000000"
            max_execution_time: "30"
            max_expanded_ast_elements: "10000000"
            query_cache_nondeterministic_function_handling: "'ignore'"
            query_cache_system_table_handling: "'ignore'"
            query_cache_ttl: "10"
            use_query_cache: "1"

  - name: Neighbors are not point lookups
    query:
      gql: |
        MATCH (w:WorkItem {id: 4000})--(n) RETURN w, n LIMIT 10
    logical: { expect: ["(Filter w.id IN [4000] (_))"] }
    physical:
      clickhouse:
        point_lookup: false
        settings:
          exact:
            enable_materialized_cte: "1"
            max_ast_depth: "10000"
            max_ast_elements: "1000000"
            max_execution_time: "30"
            max_expanded_ast_elements: "10000000"
            query_cache_nondeterministic_function_handling: "'ignore'"
            query_cache_system_table_handling: "'ignore'"
            query_cache_ttl: "10"
            use_index_for_in_with_subqueries_max_values: "1000000"
            use_query_cache: "1"
