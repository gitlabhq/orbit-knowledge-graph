cases:
  - name: Several nodes without relationships name the traversal shapes instead of the oneOf keyword
    query:
      gql: |
        MATCH (u:User {id: 1}), (mr:MergeRequest {id: 2}) RETURN u.username, mr LIMIT 5
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: [all declared nodes must belong to one connected pattern]
          not_contains: [oneOf]

  - name: A non-numeric id bound says the value is invalid
    query:
      gql: |
        MATCH (p:Project) WHERE p.id >= 'abc' AND p.id <= 5 RETURN p.name LIMIT 5
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['filter on "id" for Project: value is a string, not an integer']

  - name: An aggregation with a node-to-node comparison says comparisons need a traversal
    query:
      gql: |
        MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project) WHERE g.id = p.id RETURN count(p) AS c LIMIT 20
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [cross-node property comparisons are only supported in traversal queries]

  - name: An aggregation with the comparison written the other way says comparisons need a traversal
    query:
      gql: |
        MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project) WHERE p.id = g.id RETURN count(p) AS c LIMIT 20
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [cross-node property comparisons are only supported in traversal queries]
