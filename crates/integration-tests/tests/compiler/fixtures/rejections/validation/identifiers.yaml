cases:
  - name: A node variable with SQL text is rejected
    query:
      gql: |
        MATCH (`n; DROP TABLE users; --`:User) RETURN `n; DROP TABLE users; --`
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ['invalid identifier "n; DROP TABLE users; --"']

  - name: An empty node variable is rejected
    query:
      gql: |
        MATCH (``:User) RETURN ``
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["column 8: expected a variable"]

  - name: A node variable that starts with a digit is rejected
    query:
      gql: |
        MATCH (`123abc`:User) RETURN `123abc`
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ['invalid identifier "123abc"']

  - name: A filter property with SQL text is rejected
    query:
      gql: |
        MATCH (u:User {`foo; DROP TABLE--`: 'value'}) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ['invalid identifier "foo; DROP TABLE--"']

  - name: A non-numeric id in an id list is rejected
    query:
      gql: |
        MATCH (u:User) WHERE u.id IN ['invalid'] AND u.id >= 1 AND u.id <= 3 RETURN u
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["node IDs must be signed 64-bit integers"]
