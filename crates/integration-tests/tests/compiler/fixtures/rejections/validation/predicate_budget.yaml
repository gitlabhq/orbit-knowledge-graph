cases:
  - name: 16 predicates across two MATCH clauses are accepted
    query:
      gql: |
        MATCH (a:Definition {id: 1})-[r:CALLS]->(b:Definition)
        WHERE b.name = 'callee' AND a.start_line <= a.end_line
        MATCH (a) WHERE r.source_id >= 1 AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id RETURN a.id, b.id
    missing_frontends:
      json: JSON has no property-to-property comparisons or MATCH clauses.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse: {}
      duckdb: {}

  - name: 17 predicates across two MATCH clauses are rejected
    query:
      gql: |
        MATCH (a:Definition {id: 1})-[r:CALLS]->(b:Definition)
        WHERE b.name = 'callee' AND a.start_line <= a.end_line
        MATCH (a) WHERE r.source_id >= 1 AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id AND a.id = b.id RETURN a.id, b.id
    missing_frontends:
      json: JSON has no property-to-property comparisons or MATCH clauses.
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["Query has 17 predicates; the maximum is 16 across the entire query. Remove redundant conditions or simplify the query."]
      duckdb:
        rejected:
          phase: validate_local
          reason: schema
          contains: ["Query has 17 predicates; the maximum is 16 across the entire query. Remove redundant conditions or simplify the query."]

  - name: An id list and an id range count as three of 16 predicates
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","columns":["id"],"node_ids":[1,2],"id_range":{"start":1,"end":100},"filters":{"name":[{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"}],"fqn":[{"eq":"main.caller"},{"eq":"main.caller"},{"eq":"main.caller"},{"eq":"main.caller"},{"eq":"main.caller"}]}}]}
      gql: |
        MATCH (a:Definition) WHERE a.id IN [1, 2] AND a.id >= 1 AND a.id <= 100
        AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' RETURN a.id
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse: {}
      duckdb: {}

  - name: An id list and an id range count as three of 17 predicates
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[1,2],"id_range":{"start":1,"end":100},"filters":{"name":[{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"},{"eq":"caller"}],"fqn":[{"eq":"main.caller"},{"eq":"main.caller"},{"eq":"main.caller"},{"eq":"main.caller"},{"eq":"main.caller"},{"eq":"main.caller"}]}}]}
      gql: |
        MATCH (a:Definition) WHERE a.id IN [1, 2] AND a.id >= 1 AND a.id <= 100
        AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.name = 'caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' AND a.fqn = 'main.caller' RETURN a.id
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["Query has 17 predicates; the maximum is 16 across the entire query. Remove redundant conditions or simplify the query."]
      duckdb:
        rejected:
          phase: validate_local
          reason: schema
          contains: ["Query has 17 predicates; the maximum is 16 across the entire query. Remove redundant conditions or simplify the query."]
