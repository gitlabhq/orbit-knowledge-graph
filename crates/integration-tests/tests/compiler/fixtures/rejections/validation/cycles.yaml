cases:
  - name: A relationship cycle is rejected
    query:
      gql: |
        MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition)-[:CALLS]->(a) RETURN a.id, b.id, c.id
    physical:
      duckdb:
        rejected:
          phase: gql_parse
          reason: schema
          contains: [cycles are unsupported]
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: [cycles are unsupported]
