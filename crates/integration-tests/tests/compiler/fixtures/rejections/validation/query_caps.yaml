          reason: schema
          contains: ["neighbors rel_types count (11) must not exceed 10"]

  - name: A chain of five nodes is accepted by both frontends
    query:
      gql: |
        MATCH (n0:Group {id: 1})-[:CONTAINS]->(n1:Group)-[:CONTAINS]->(n2:Group)-[:CONTAINS]->(n3:Group)-[:CONTAINS]->(n4:Group) RETURN n0
    logical:
      expect: ["(EdgeScan CONTAINS n3->n4 AS e3)"]
