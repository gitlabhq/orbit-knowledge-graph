        MATCH (n0:Group {id: 1})-[:CONTAINS]->(n1:Group)-[:CONTAINS]->(n2:Group)-[:CONTAINS]->(n3:Group)-[:CONTAINS]->(n4:Group)-[:CONTAINS]->(n5:Group) RETURN n0
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["a query declares at most 5 nodes"]

