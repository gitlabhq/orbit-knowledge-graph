      gql: |
        MATCH (a:User {id: 1})-[:MEMBER_OF|AUTHORED|CONTAINS|IN_PROJECT|REVIEWER|ASSIGNED|HAS_HEAD_PIPELINE|ON_BRANCH|DEFINES|CALLS|EXTENDS]->(b:Project) RETURN a, b
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["relationship type count (11) must not exceed 10"]
