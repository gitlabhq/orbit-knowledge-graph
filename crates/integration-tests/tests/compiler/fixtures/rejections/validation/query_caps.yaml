cases:
  - name: LIMIT 0 is rejected by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u LIMIT 0
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["limit must be between 1 and 1000"]

  - name: LIMIT 1001 is rejected by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u LIMIT 1001
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["limit must be between 1 and 1000"]

  - name: Four hops are rejected by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF*1..4]->(p:Project) RETURN u, p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["ordered hop bounds between 1 and 3"]

  - name: A 65-character variable name is rejected by both frontends
    query:
      gql: |
        MATCH (aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:User {id: 1}) RETURN aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["invalid identifier"]

  - name: A 64-character variable name is accepted by both frontends
    query:
      gql: |
        MATCH (aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:User {id: 1}) RETURN aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    logical:
      expect: ["(Filter aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.id IN [1] (NodeScan User AS aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa))"]
    physical:
      clickhouse: {}

  - name: A 1025-character string literal is rejected by both frontends
    query:
      gql: |
        MATCH (u:User {username: ''}) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["string literal must not exceed 1024 characters"]

  - name: A shortest path of depth 0 is rejected by both frontends
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:Group {id: 1})-[:CONTAINS*1..0]->(b:Project {id: 2}) RETURN p
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["hop bounds must be positive and ordered"]

  - name: A shortest path of depth 1 is accepted by both frontends
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:Group {id: 1})-[:CONTAINS*1..1]->(b:Project {id: 2}) RETURN p
    logical:
      expect: ["(Input path_finding (...))"]
    physical:
      clickhouse: {}

  - name: A shortest path of depth 3 is accepted by both frontends
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:Group {id: 1})-[:CONTAINS*1..3]->(b:Project {id: 2}) RETURN p
    logical:
      expect: ["(Input path_finding (...))"]
    physical:
      clickhouse: {}

  - name: A shortest path of depth 4 is rejected by both frontends
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:Group {id: 1})-[:CONTAINS*1..4]->(b:Project {id: 2}) RETURN p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["path max_depth must be between 1 and 3"]

  - name: A shortest path of depth 4294967295 is rejected by both frontends
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:Group {id: 1})-[:CONTAINS*1..4294967295]->(b:Project {id: 2}) RETURN p
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["a hop count from 1 to 3"]

  - name: Outgoing neighbors with 1 relationship type are accepted by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED]->(n) RETURN n
    logical:
      expect: ["(Input neighbors (...))"]
    physical:
      clickhouse: {}

  - name: Outgoing neighbors with 10 relationship types are accepted by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED]->(n) RETURN n
    logical:
      expect: ["(Input neighbors (...))"]
    physical:
      clickhouse: {}

  - name: Outgoing neighbors with 11 relationship types are rejected by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED]->(n) RETURN n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["neighbors rel_types count (11) must not exceed 10"]

  - name: Incoming neighbors with 1 relationship type are accepted by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1})<-[:AUTHORED]-(n) RETURN n
    logical:
      expect: ["(Input neighbors (...))"]
    physical:
      clickhouse: {}

  - name: Incoming neighbors with 10 relationship types are accepted by both frontends
