      clickhouse: {}

  - name: Eleven conditions on one property are rejected by both frontends
    query:
      gql: |
        MATCH (u:User) WHERE u.username CONTAINS 'abc0' AND u.username CONTAINS 'abc1' AND u.username CONTAINS 'abc2' AND u.username CONTAINS 'abc3' AND u.username CONTAINS 'abc4' AND u.username CONTAINS 'abc5' AND u.username CONTAINS 'abc6' AND u.username CONTAINS 'abc7' AND u.username CONTAINS 'abc8' AND u.username CONTAINS 'abc9' AND u.username CONTAINS 'abc10' RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['filter on "username" needs between 1 and 10 predicates']

  - name: Six positive and four negated conditions on one property are accepted by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1}) WHERE u.username CONTAINS 'ab0' AND u.username CONTAINS 'ab1' AND u.username CONTAINS 'ab2' AND u.username CONTAINS 'ab3' AND u.username CONTAINS 'ab4' AND u.username CONTAINS 'ab5' AND NOT (u.username CONTAINS 'zz0' AND u.username CONTAINS 'zz1' AND u.username CONTAINS 'zz2' AND u.username CONTAINS 'zz3') RETURN u
    logical:
      expect: ["(Filter contains(u.username, 'ab0'), ... (NodeScan User AS u))"]
    physical:
      clickhouse: {}

  - name: Six positive and five negated conditions on one property exceed the per-property cap
    query:
      gql: |
        MATCH (u:User {id: 1}) WHERE u.username CONTAINS 'ab0' AND u.username CONTAINS 'ab1' AND u.username CONTAINS 'ab2' AND u.username CONTAINS 'ab3' AND u.username CONTAINS 'ab4' AND u.username CONTAINS 'ab5' AND NOT (u.username CONTAINS 'zz0' AND u.username CONTAINS 'zz1' AND u.username CONTAINS 'zz2' AND u.username CONTAINS 'zz3' AND u.username CONTAINS 'zz4') RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['filter entry count (11) on property "username" for node "u" must not exceed 10']

  - name: Ten relationship types are accepted by both frontends
    query:
      gql: |
        MATCH (a:User {id: 1})-[:MEMBER_OF|AUTHORED|CONTAINS|IN_PROJECT|REVIEWER|ASSIGNED|HAS_HEAD_PIPELINE|ON_BRANCH|DEFINES|CALLS]->(b:Project) RETURN a, b
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse: {}

  - name: Eleven relationship types are rejected by both frontends
