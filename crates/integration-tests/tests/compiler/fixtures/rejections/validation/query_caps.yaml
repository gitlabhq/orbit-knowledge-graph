  - name: Ten conditions on one property are accepted by both frontends
    query:
      gql: |
        MATCH (u:User) WHERE u.username CONTAINS 'abc0' AND u.username CONTAINS 'abc1' AND u.username CONTAINS 'abc2' AND u.username CONTAINS 'abc3' AND u.username CONTAINS 'abc4' AND u.username CONTAINS 'abc5' AND u.username CONTAINS 'abc6' AND u.username CONTAINS 'abc7' AND u.username CONTAINS 'abc8' AND u.username CONTAINS 'abc9' RETURN u
