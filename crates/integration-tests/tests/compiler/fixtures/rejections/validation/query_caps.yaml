      gql: |
        MATCH (u:User {id: 1})<-[:AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED]-(n) RETURN n
    logical:
      expect: ["(Input neighbors (...))"]
    physical:
      clickhouse: {}

  - name: Incoming neighbors with 11 relationship types are rejected by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1})<-[:AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED|AUTHORED]-(n) RETURN n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["neighbors rel_types count (11) must not exceed 10"]

  - name: Both neighbors with 1 relationship type are accepted by both frontends
    query:
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED]-(n) RETURN n
    logical:
      expect: ["(Input neighbors (...))"]
    physical:
      clickhouse: {}

  - name: Both neighbors with 10 relationship types are accepted by both frontends
