cases:
  - name: A string compared with an integer property is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"n","entity":"Note","filters":{"noteable_id":"abc"}}]}
      gql: |
        MATCH (n:Note {noteable_id: 'abc'}) RETURN n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["value is a string, not an integer, expected Int"]

  - name: A string compared with a boolean property is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"n","entity":"Note","filters":{"confidential":"yes"}}]}
      gql: |
        MATCH (n:Note {confidential: 'yes'}) RETURN n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["value is a string, not a boolean, expected Bool"]

  - name: A float compared with an integer property is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"n","entity":"Note","filters":{"noteable_id":3.14}}]}
      gql: |
        MATCH (n:Note {noteable_id: 3.14}) RETURN n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["is a float, not an integer"]

  - name: A boolean compared with an enum property is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"user_type":true}}]}
      gql: |
        MATCH (u:User {user_type: true}) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["not a string or integer"]

  - name: An IN list with one mismatched element names its index
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"n","entity":"Note","filters":{"noteable_id":{"in":[1,"two",3]}}}]}
      gql: |
        MATCH (n:Note) WHERE n.noteable_id IN [1, 'two', 3] RETURN n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["element [1] is a string, not an integer, expected Int"]

  - name: A range with one mismatched bound is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1],"filters":{"created_at":[{"gte":"2026-04-01T00:00:00Z"},{"lt":12345}]}}]}
      gql: |
        MATCH (u:User {id: 1}) WHERE u.created_at >= '2026-04-01T00:00:00Z' AND u.created_at < 12345 RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["not a string"]

  - name: A string compared with an integer edge column is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"n","entity":"Note"}],"relationships":[{"type":"AUTHORED","from":"u","to":"n","filters":{"source_id":"not-a-number"}}]}
      gql: |
        MATCH (u:User {id: 1})-[r:AUTHORED]->(n:Note) WHERE r.source_id = 'not-a-number' RETURN u, n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [source_id, "expected Int"]

  - name: An integer compared with a text edge column is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"n","entity":"Note"}],"relationships":[{"type":"AUTHORED","from":"u","to":"n","filters":{"target_kind":123}}]}
      gql: |
        MATCH (u:User {id: 1})-[r:AUTHORED]->(n:Note) WHERE r.target_kind = 123 RETURN u, n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["expected String"]

  - name: An unknown edge column names the relationship type and the column, not a table
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"n","entity":"Note"}],"relationships":[{"type":"AUTHORED","from":"u","to":"n","filters":{"bogus_column":42}}]}
      gql: |
        MATCH (u:User {id: 1})-[r:AUTHORED]->(n:Note) WHERE r.bogus_column = 42 RETURN u, n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['relationship[0] AUTHORED has no filterable column "bogus_column"']

  - name: An edge column that only some endpoint pairs store is rejected without naming tables
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"g","entity":"Group","node_ids":[1]},{"id":"p","entity":"Project"}],"relationships":[{"type":"CONTAINS","from":"g","to":"p","hops":[1,2],"filters":{"project_id":1}}]}
    missing_frontends:
      gql: GQL rejects any property filter on a variable-length relationship before validation, as variable_length_filters.yaml checks.
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['relationship[0] CONTAINS column "project_id" is missing or has a different type for some endpoint pairs']

  - name: An edge IN list with one mismatched element names its index
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"n","entity":"Note"}],"relationships":[{"type":"AUTHORED","from":"u","to":"n","filters":{"source_id":{"in":[1,"bad",3]}}}]}
      gql: |
        MATCH (u:User {id: 1})-[r:AUTHORED]->(n:Note) WHERE r.source_id IN [1, 'bad', 3] RETURN u, n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["element [1]"]

  - name: Substring matching on a field that disallows it is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"public_email":{"contains":"example"}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.public_email CONTAINS 'example' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["string operators (contains/starts_with/ends_with) are not allowed on this field"]

  - name: A substring filter on a property that disallows string operators is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"email":{"contains":"example"}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.email CONTAINS 'example' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [string operators]

  - name: A prefix filter on a property that disallows string operators is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"email":{"starts_with":"alice"}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.email STARTS WITH 'alice' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [string operators]

  - name: Equality on an administrator-only property is rejected for other users
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"email":"alice@example.com"}}],"limit":10}
      gql: |
        MATCH (u:User {email: 'alice@example.com'}) RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: restrict
          reason: restrict
          contains: [email, administrator]

  - name: Substring matching on a timestamp is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"created_at":{"contains":"2024"}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.created_at CONTAINS '2024' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["string operators (contains/starts_with/ends_with) require a text field"]

  - name: Eleven filtered properties on one node exceed the property cap
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"a","email":"a","name":"a","first_name":"a","last_name":"a","created_at":"2020-01-01","updated_at":"2020-01-01","state":"active","avatar_url":"a","public_email":"a","preferred_language":"en"}}]}
      gql: |
        MATCH (u:User {username: 'a', email: 'a', name: 'a', first_name: 'a', last_name: 'a', created_at: '2020-01-01', updated_at: '2020-01-01', state: 'active', avatar_url: 'a', public_email: 'a', preferred_language: 'en'}) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: schema
          contains: { json: ["value has more than 10 properties at /nodes/0/filters"], gql: ['filter property count (11) for node "u" must not exceed 10'] }

  - name: Eleven conditions on one property exceed the per-property cap
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"created_at":[{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"},{"gte":"2020-01-01"}]}}]}
      gql: |
        MATCH (u:User) WHERE u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' AND u.created_at >= '2020-01-01' RETURN u
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: schema
          contains: { json: ["invalid value at /nodes/0/filters/created_at"], gql: ['filter on "created_at" needs between 1 and 10 predicates'] }
