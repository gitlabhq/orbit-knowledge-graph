cases:
  - name: collect is not a supported aggregate
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"collect":"u.username","as":"usernames"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN collect(u.username) AS usernames
    physical:
      clickhouse:
        rejected:
          phase: { json: validate, gql: gql_parse }
          reason: schema
          contains: { json: ['"collect" is not supported'], gql: ["function collect() is not supported"] }

  - name: distinct applies only to count
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"sum":"u.id","distinct":true,"as":"n"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN sum(DISTINCT u.id) AS n
    physical:
      clickhouse:
        rejected:
          phase: { json: validate, gql: gql_parse }
          reason: schema
          contains: { json: ['"distinct" works only with "count"'], gql: ["DISTINCT works only inside count()"] }

  - name: sum needs a node property, not a node
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"sum":"u","as":"result"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN sum(u) AS result
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: gql_parse }
          reason: schema
          contains: { json: ["value does not match", "at /aggregations/0/sum"], gql: ["this aggregate requires a node.property target"] }

  - name: avg needs a node property, not a node
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"avg":"u","as":"result"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN avg(u) AS result
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: gql_parse }
          reason: schema
          contains: { json: ["value does not match", "at /aggregations/0/avg"], gql: ["this aggregate requires a node.property target"] }

  - name: min needs a node property, not a node
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"min":"u","as":"result"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN min(u) AS result
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: gql_parse }
          reason: schema
          contains: { json: ["value does not match", "at /aggregations/0/min"], gql: ["this aggregate requires a node.property target"] }

  - name: max needs a node property, not a node
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"max":"u","as":"result"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN max(u) AS result
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: gql_parse }
          reason: schema
          contains: { json: ["value does not match", "at /aggregations/0/max"], gql: ["this aggregate requires a node.property target"] }

  - name: sum on a text property is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"sum":"u.username","as":"username_sum"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN sum(u.username) AS username_sum
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["requires a numeric property"]

  - name: avg on a text property is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"avg":"u.username","as":"username_avg"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN avg(u.username) AS username_avg
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["requires a numeric property"]

  - name: An ungrouped aggregation over disconnected nodes is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"mr","entity":"MergeRequest"},{"id":"p","entity":"Project","node_ids":[278964]}],"aggregations":[{"count":"mr","as":"total"}]}
      gql: |
        MATCH (mr:MergeRequest), (p:Project {id: 278964}) RETURN count(mr) AS total
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: gql_parse }
          reason: schema
          contains: { json: ['"group_by" is a required property'], gql: ["all declared nodes must belong to one connected pattern"] }

  - name: An aggregation relationship in both directions is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr","direction":"both"}],"group_by":["u"],"aggregations":[{"count":"mr","as":"count"}]}
    missing_frontends:
      gql: undirected_relationships.yaml covers the GQL undirected aggregation, which the parser rejects.
    physical:
      clickhouse:
        rejected:
          phase: json_dsl_parse
          reason: schema
          contains: ['"both" is not an allowed value. Valid values: outgoing, incoming at /relationships/0/direction']

  - name: Grouping by a virtual property is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"f","entity":"File","node_ids":[1]}],"group_by":["f.content"],"aggregations":[{"count":"f","as":"file_count"}]}
      gql: |
        MATCH (f:File {id: 1}) RETURN f.content, count(f) AS file_count
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["field is virtual"]
