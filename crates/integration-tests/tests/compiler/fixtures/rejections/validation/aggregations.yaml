cases:
  - name: collect is not a supported aggregate
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN collect(u.username) AS usernames
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["function collect() is not supported"]

  - name: distinct applies only to count
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN sum(DISTINCT u.id) AS n
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["DISTINCT works only inside count()"]

  - name: sum needs a node property, not a node
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN sum(u) AS result
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["this aggregate requires a node.property target"]

  - name: avg needs a node property, not a node
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN avg(u) AS result
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["this aggregate requires a node.property target"]

  - name: min needs a node property, not a node
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN min(u) AS result
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["this aggregate requires a node.property target"]

  - name: max needs a node property, not a node
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN max(u) AS result
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["this aggregate requires a node.property target"]

  - name: sum on a text property is rejected
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN sum(u.username) AS username_sum
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["requires a numeric property"]

  - name: avg on a text property is rejected
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN avg(u.username) AS username_avg
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["requires a numeric property"]

  - name: An ungrouped aggregation over disconnected nodes is rejected
    query:
      gql: |
        MATCH (mr:MergeRequest), (p:Project {id: 278964}) RETURN count(mr) AS total
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["all declared nodes must belong to one connected pattern"]

  - name: Grouping by a virtual property is rejected
    query:
      gql: |
        MATCH (f:File {id: 1}) RETURN f.content, count(f) AS file_count
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["field is virtual"]

  - name: Minute buckets need pinned ids or a selective filter
    query:
      gql: |
        MATCH (u:Note) RETURN date_trunc('minute', u.created_at), count(u) AS n LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [requires either node_ids, minute]

  - name: Truncating a property that is not a date is rejected
    query:
      gql: |
        MATCH (u:Note {id: 1}) RETURN date_trunc('month', u.confidential), count(u) AS n LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [requires a Date or DateTime property]

  - name: Counting over shortest paths from an id range is rejected
    query:
      gql: |
        MATCH path = ANY SHORTEST (u:User)-[*1..3]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 RETURN p, count(u) AS hit LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [aggregation over shortest paths is not supported]

  - name: Counting over shortest paths between pinned nodes is rejected
    query:
      gql: |
        MATCH path = ANY SHORTEST (u:User {id: 1})-[*1..3]->(p:Project {id: 2}) WHERE u.id >= 2 AND u.id <= 2 RETURN p{.id}, count(u) AS hit LIMIT 1
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [aggregation over shortest paths is not supported]
