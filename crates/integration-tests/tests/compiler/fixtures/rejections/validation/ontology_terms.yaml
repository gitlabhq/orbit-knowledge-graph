cases:
  - name: An unknown entity is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"NotAnEntity"}]}
      gql: |
        MATCH (u:NotAnEntity) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: ontology
          contains: [NotAnEntity]

  - name: An unknown projected property is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","columns":["missing"]}]}
      gql: |
        MATCH (u:User) RETURN u.missing
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: ontology
          contains: [missing]

  - name: An unknown filtered property is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"missing":"abc"}}]}
      gql: |
        MATCH (u:User {missing: 'abc'}) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: ontology
          contains: [missing]

  - name: A number compared with a string property is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":42}}]}
      gql: |
        MATCH (u:User {username: 42}) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["value is a number, not a string, expected String"]

  - name: A substring pattern below the minimum length is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":{"contains":"ab"}}}]}
      gql: |
        MATCH (u:User) WHERE u.username CONTAINS 'ab' RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["search pattern must be at least 3 characters"]

  - name: Token matching on a property without a text index is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"state":{"token_match":"abc"}}}]}
      gql: |
        MATCH (u:User) WHERE token_match(u.state, 'abc') RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["require a text index"]

  - name: An unknown relationship type is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"p","entity":"Project"}],"relationships":[{"type":"UNKNOWN_EDGE","from":"u","to":"p"}]}
      gql: |
        MATCH (u:User {id: 1})-[:UNKNOWN_EDGE]->(p:Project) RETURN u, p
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: ontology
          contains: [UNKNOWN_EDGE]
