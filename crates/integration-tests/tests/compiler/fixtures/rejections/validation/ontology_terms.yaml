cases:
  - name: An unknown entity is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"NotAnEntity"}]}
      gql: |
        MATCH (u:NotAnEntity) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: ontology
          contains:
            json: [NotAnEntity, "Valid values:", Branch, WorkItem]
            gql: [NotAnEntity]
          not_contains: ["more —"]

  - name: An unknown projected property is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","columns":["missing"]}]}
      gql: |
        MATCH (u:User) RETURN u.missing
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: ontology
          contains:
            json: [missing, /nodes/0/columns, Valid values, username]
            gql: [missing, Valid fields, username]
          not_contains: [under any of the schemas]

  - name: An unknown filtered property is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"missing":"abc"}}]}
      gql: |
        MATCH (u:User {missing: 'abc'}) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: ontology
          contains:
            json: [missing, "Valid values:", username]
            gql: [missing, Valid fields, username]
          not_contains: ["more —", other candidates]

  - name: A number compared with a string property is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":42}}]}
      gql: |
        MATCH (u:User {username: 42}) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["value is a number, not a string, expected String"]

  - name: A substring pattern below the minimum length is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":{"contains":"ab"}}}]}
      gql: |
        MATCH (u:User) WHERE u.username CONTAINS 'ab' RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["search pattern must be at least 3 characters"]

  - name: A one-character prefix is below the minimum pattern length
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":{"starts_with":"a"}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.username STARTS WITH 'a' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [search pattern must be at least 3]

  - name: An empty suffix is below the minimum pattern length
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":{"ends_with":""}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.username ENDS WITH '' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [search pattern must be at least 3]

  - name: Token matching on a property without a text index is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"state":{"token_match":"abc"}}}]}
      gql: |
        MATCH (u:User) WHERE token_match(u.state, 'abc') RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["require a text index"]

  - name: An unknown relationship type is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"p","entity":"Project"}],"relationships":[{"type":"UNKNOWN_EDGE","from":"u","to":"p"}]}
      gql: |
        MATCH (u:User {id: 1})-[:UNKNOWN_EDGE]->(p:Project) RETURN u, p
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: ontology
          contains:
            json: [UNKNOWN_EDGE, /relationships/0/type, Valid values, AUTHORED]
            gql: [UNKNOWN_EDGE]
          not_contains: [under any of the schemas]

  - name: An unknown sort property is rejected by both frontends
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1],"columns":["username"]}],"limit":10,"order_by":"u.nonexistent_column"}
      gql: |
        MATCH (u:User {id: 1}) RETURN u.username ORDER BY u.nonexistent_column LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: ontology
          contains: [nonexistent_column, does not exist, Valid fields, username]

  - name: An unknown aggregated property is rejected by both frontends
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1],"columns":["name"]}],"aggregations":[{"sum":"p.invalid_property","as":"total"}],"limit":10}
      gql: |
        MATCH (p:Project {id: 1}) RETURN sum(p.invalid_property) AS total LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: ontology
          contains: [invalid property, invalid_property, does not exist, Valid fields, name]

  - name: An unknown grouped property names the valid fields
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":["p.reviewer_count"],"aggregations":[{"count":"p","as":"c"}],"limit":10}
      gql: |
        MATCH (p:Project {id: 1}) RETURN p.reviewer_count, count(p) AS c LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: ontology
          contains: [invalid property, reviewer_count, does not exist, Valid fields, name]

  - name: Grouping by an undefined node names the reference
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":["name"],"aggregations":[{"count":"p","as":"c"}],"limit":10}
      gql: |
        MATCH (p:Project {id: 1}) RETURN name, count(p) AS c LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: { json: validate, gql: gql_parse }
          reason: reference
          contains: ['undefined node "name"']

  - name: A group_by object with unknown keys shows the accepted entry shapes
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":[{"node":"p","property":"name"}],"aggregations":[{"count":"p","as":"c"}],"limit":10}
    missing_frontends:
      gql: GQL groups by RETURN items and has no group_by entry.
    physical:
      clickhouse:
        rejected:
          phase: json_dsl_parse
          reason: schema
          contains: [/group_by/0, '"<node-id>.<property>"', '"truncate"']

  - name: A group_by string with two dots shows the accepted entry shapes
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":["p.name.x"],"aggregations":[{"count":"p","as":"c"}],"limit":10}
    missing_frontends:
      gql: GQL groups by RETURN items and has no group_by entry.
    physical:
      clickhouse:
        rejected:
          phase: json_dsl_parse
          reason: schema
          contains: [/group_by/0, '"<node-id>"', '"<node-id>.<property>"']

