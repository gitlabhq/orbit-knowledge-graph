cases:
  - name: A traversal with no selective node names the selector forms and no id_range hint
    query:
      gql: |
        MATCH (u:User) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["add filters or node_ids to at least one node, such as (p:Project {full_path: 'group/project'}) or WHERE mr.project_id = 42"]
          not_contains: [id_range]

  - name: A traversal whose only selector is a wide id range adds the id_range span hint
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 999999999 RETURN u
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["add filters or node_ids to at least one node, such as (p:Project {full_path: 'group/project'}) or WHERE mr.project_id = 42 (an id_range counts only with a span of at most 100000)"]

  - name: A two-node traversal with no selective node is rejected
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(p:Project) RETURN u, p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["add filters or node_ids to at least one node"]

  - name: A variable-length traversal with no selective node is rejected
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF*1..2]->(p:Project) RETURN u, p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["add filters or node_ids to at least one node"]

  - name: An aggregation with no selective node is rejected
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(p:Project) RETURN p, count(u) AS c
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["add filters or node_ids to at least one node"]

  - name: A neighbors query with no selective center node is rejected without an id_range hint
    query:
      gql: |
        MATCH (u:User)--(n) RETURN u, n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["neighbors requires filters or node_ids on the center node to avoid scanning all edges"]
          not_contains: [id_range]

  - name: A neighbors query whose center has only a wide id range adds the id_range span hint
    query:
      gql: |
        MATCH (u:User)--(n) WHERE u.id >= 1 AND u.id <= 999999999 RETURN u, n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["neighbors requires filters or node_ids on the center node to avoid scanning all edges (an id_range counts only with a span of at most 100000)"]

  - name: A path start with no selector is rejected and named
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:User)-[:MEMBER_OF*1..2]->(b:Project {id: 2}) RETURN p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['path_finding requires node_ids, filters, or id_range (max span 500) on endpoint "a"']

  - name: A path end with no selector is rejected and named
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:Project {id: 1})-[:MEMBER_OF*1..2]->(b:User) RETURN p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['endpoint "b"']

  - name: A path endpoint id range wider than the anchor span is rejected
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:Project)-[:CONTAINS*1..2]->(b:Project {id: 2}) WHERE a.id >= 1 AND a.id <= 1000 RETURN p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['endpoint "a"']

  - name: A path endpoint id range inside the traversal span but wider than the anchor span is rejected
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:User)-[:MEMBER_OF*1..2]->(b:Project {id: 2}) WHERE a.id >= 1 AND a.id <= 10000 RETURN p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['endpoint "a"']

  - name: A path with filtered endpoints but no relationship types is rejected
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:User {username: 'alice'})-[*1..2]->(b:Project {id: 2}) RETURN p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["require named relationship types"]

  - name: A path with pinned endpoints but no relationship types is rejected
    query:
      gql: |
        MATCH p = ANY SHORTEST (a:Project {id: 1})-[*1..2]->(b:Project {id: 2}) RETURN p
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["shortest paths require named relationship types"]
