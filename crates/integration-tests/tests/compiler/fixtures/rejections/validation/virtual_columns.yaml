cases:
  - name: A virtual column filter without pinned ids names node_ids and the column
    query:
      gql: |
        MATCH (f:File) WHERE f.content CONTAINS 'needle' AND f.project_id = 1000 RETURN f.path LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains:
            - filter on "content" for File
            - virtual columns can only be filtered on nodes with explicit node_ids

  - name: A virtual column filter in an aggregation names the query type and the column
    query:
      gql: |
        MATCH (f:File) WHERE f.content CONTAINS 'needle' RETURN f.language, count(f) AS total LIMIT 5
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains:
            - filter on "content" for File
            - virtual columns cannot be filtered in aggregation queries

  - name: A virtual column filter on a neighbors center names the query type and the column
    query:
      gql: |
        MATCH (f:File {id: 1})-[r]->(n) WHERE f.content CONTAINS 'needle' RETURN f, r, n LIMIT 5
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains:
            - filter on "content" for File
            - virtual columns cannot be filtered in neighbors queries

  - name: An unsupported operator on a virtual column names the operator and the column
    query:
      gql: |
        MATCH (f:File {id: 1}) WHERE f.content > 'x' RETURN f LIMIT 5
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains:
            - filter on "content" for File
            - operator "gt" is not supported on this virtual column
