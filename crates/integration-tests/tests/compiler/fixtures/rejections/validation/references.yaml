cases:
  - name: A relationship from an undefined node is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"n","entity":"Note"}],"relationships":[{"type":"AUTHORED","from":"ghost","to":"n"}]}
    missing_frontends:
      gql: A GQL relationship connects two pattern variables, so it cannot name an undefined node.
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "ghost"']

  - name: A relationship to an undefined node is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"n","entity":"Note"}],"relationships":[{"type":"AUTHORED","from":"u","to":"ghost"}]}
    missing_frontends:
      gql: A GQL relationship connects two pattern variables, so it cannot name an undefined node.
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "ghost"']

  - name: A path from an undefined node is rejected
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"a","entity":"Project","node_ids":[1]},{"id":"b","entity":"Project","node_ids":[2]}],"path":{"type":"shortest","from":"ghost","to":"b","max_depth":2,"rel_types":["CONTAINS"]}}
    missing_frontends:
      gql: A GQL path pattern binds both endpoints, so it cannot name an undefined node.
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "ghost"']

  - name: A path to an undefined node is rejected
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"a","entity":"Project","node_ids":[1]},{"id":"b","entity":"Project","node_ids":[2]}],"path":{"type":"shortest","from":"a","to":"ghost","max_depth":2,"rel_types":["CONTAINS"]}}
    missing_frontends:
      gql: A GQL path pattern binds both endpoints, so it cannot name an undefined node.
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "ghost"']

  - name: Counting an undefined node is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"aggregations":[{"count":"missing","as":"c"}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN count(missing) AS c
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "missing"']

  - name: Grouping by a property of an undefined node is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":["missing.visibility_level"],"aggregations":[{"count":"p","as":"project_count"}]}
      gql: |
        MATCH (p:Project {id: 1}) RETURN missing.visibility_level, count(p) AS project_count
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "missing"']

  - name: A group_by on a traversal is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":["p.visibility_level"]}
    missing_frontends:
      gql: GQL groups only when RETURN has an aggregate, which makes the query an aggregation.
    physical:
      clickhouse:
        rejected:
          phase: json_dsl_parse
          reason: schema
          contains: ['{"required":["group_by"]} is not allowed']

  - name: Grouping twice by the same property is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":["p.visibility_level","p.visibility_level"],"aggregations":[{"count":"p","as":"project_count"}]}
      gql: |
        MATCH (p:Project {id: 1}) RETURN p.visibility_level, p.visibility_level, count(p) AS project_count
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["duplicate group_by output column"]

  - name: An aggregate alias that matches a group column name is rejected
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":["p.visibility_level"],"aggregations":[{"count":"p","as":"p_visibility_level"}]}
      gql: |
        MATCH (p:Project {id: 1}) RETURN p.visibility_level, count(p) AS p_visibility_level
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["conflicts with another output column"]

  - name: Sorting by a property of an undefined node is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"order_by":"missing.username"}
      gql: |
        MATCH (u:User {id: 1}) RETURN u ORDER BY missing.username
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "missing"']

  - name: Two JSON nodes with the same id are rejected as a duplicate node id
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"u","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"u"}]}
    missing_frontends:
      gql: A repeated GQL variable refers to the same node, so GQL cannot declare two nodes with one id.
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['duplicate node id "u"']

  - name: A repeated GQL node with a different label is rejected
    query:
      gql: |
        MATCH (u:User {id: 1}), (u:Project) RETURN u
    missing_frontends:
      json: JSON nodes have no labels to repeat; each node declares one entity.
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["a repeated node must keep its original label"]

  - name: A traversal node outside the relationship chain fails the n-1 relationship rule
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"p","entity":"Project"},{"id":"orphan","entity":"Note"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p"}]}
    missing_frontends:
      gql: GQL rejects a node outside the pattern as a disconnected pattern before validation, as gql_unsupported_syntax.yaml checks.
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["traversal requires exactly n-1 relationships for n nodes"]
