cases:
  - name: Counting an undefined node is rejected
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN count(missing) AS c
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "missing"']

  - name: Grouping by a property of an undefined node is rejected
    query:
      gql: |
        MATCH (p:Project {id: 1}) RETURN missing.visibility_level, count(p) AS project_count
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "missing"']

  - name: Grouping twice by the same property is rejected
    query:
      gql: |
        MATCH (p:Project {id: 1}) RETURN p.visibility_level, p.visibility_level, count(p) AS project_count
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["duplicate group_by output column"]

  - name: An aggregate alias that matches a group column name is rejected
    query:
      gql: |
        MATCH (p:Project {id: 1}) RETURN p.visibility_level, count(p) AS p_visibility_level
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ["conflicts with another output column"]

  - name: Sorting by a property of an undefined node is rejected
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u ORDER BY missing.username
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: reference
          contains: ['undefined node "missing"']

  - name: A repeated GQL node with a different label is rejected
    query:
      gql: |
        MATCH (u:User {id: 1}), (u:Project) RETURN u
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains: ["a repeated node must keep its original label"]
