missing_frontends:
  gql: GQL writes comparisons as operators, so it has no JSON filter value shape.

cases:
  - name: An op and value object names the accepted filter shapes instead of the oneOf keyword
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"p","entity":"Project","node_ids":[1],"columns":["name"],"filters":{"name":{"op":"bogus","value":1}}}],"limit":5}
    physical:
      clickhouse:
        rejected:
          phase: json_dsl_parse
          reason: schema
          contains:
            - "invalid value at /nodes/0/filters/name: "
            - A bare value is an equality match
          not_contains: [oneOf]

  - name: A nullability operator that is not a boolean names the accepted filter shapes
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"merged_at":{"is_null":1}}}]}
    physical:
      clickhouse:
        rejected:
          phase: json_dsl_parse
          reason: schema
          contains:
            - "invalid value at /nodes/0/filters/merged_at: "
            - A bare value is an equality match
          not_contains: [oneOf]

  - name: An empty operator object names the accepted filter shapes
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"state":{}}}]}
    physical:
      clickhouse:
        rejected:
          phase: json_dsl_parse
          reason: schema
          contains:
            - "invalid value at /nodes/0/filters/state: "
            - array only to repeat an operator
          not_contains: [oneOf]

  - name: A filter array that mixes operator objects and bare values names the accepted filter shapes
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"state":[{"gte":1},5]}}]}
    physical:
      clickhouse:
        rejected:
          phase: json_dsl_parse
          reason: schema
          contains:
            - "invalid value at /nodes/0/filters/state: "
            - array only to repeat an operator
          not_contains: [oneOf]

  - name: A bare array is not an IN list
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"project_id":[1,2,3]}}]}
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains:
            - value is an array, not an integer
