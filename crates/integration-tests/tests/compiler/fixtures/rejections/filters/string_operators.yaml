cases:
  - name: A one-character prefix is below the minimum pattern length
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":{"starts_with":"a"}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.username STARTS WITH 'a' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [search pattern must be at least 3]

  - name: An empty suffix is below the minimum pattern length
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":{"ends_with":""}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.username ENDS WITH '' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [search pattern must be at least 3]

  - name: A substring filter on a property that disallows string operators is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"email":{"contains":"example"}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.email CONTAINS 'example' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [string operators]

  - name: A prefix filter on a property that disallows string operators is rejected
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"email":{"starts_with":"alice"}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.email STARTS WITH 'alice' RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: [string operators]

  - name: Equality on a property that disallows string operators is accepted for an administrator
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"email":"alice@example.com"}}],"limit":10}
      gql: |
        MATCH (u:User {email: 'alice@example.com'}) RETURN u LIMIT 10
    security:
      admin: true
    logical:
      expect: ["(Filter u.email = 'alice@example.com' (NodeScan User AS u))"]
    physical:
      clickhouse: {}

  - name: Equality on an administrator-only property is rejected for other users
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"email":"alice@example.com"}}],"limit":10}
      gql: |
        MATCH (u:User {email: 'alice@example.com'}) RETURN u LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: restrict
          reason: restrict
          contains: [email, administrator]
