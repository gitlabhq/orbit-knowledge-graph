cases:
  - name: An aggregate call in ORDER BY says to sort by its alias instead
    query:
      gql: |
        MATCH (mr:MergeRequest {project_id: 1})-[:IN_PROJECT]->(p:Project) RETURN p.full_path, count(mr) ORDER BY count(mr) LIMIT 10
    missing_frontends:
      json: The source scenario supplies only GQL.
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains:
            - "function count() is not supported in ORDER BY: ORDER BY takes the alias of an aggregate, not the call: write RETURN ..., count(mr) AS n ORDER BY n"
