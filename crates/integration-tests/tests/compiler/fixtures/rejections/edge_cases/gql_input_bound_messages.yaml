  - name: Forty nested parentheses are rejected before recursive parsing
    query:
      gql: |
        MATCH (u:User) WHERE ((((((((((((((((((((((((((((((((((((((((u.id = 1)))))))))))))))))))))))))))))))))))))))) RETURN u
    missing_frontends:
      json: JSON filters have no parenthesized expressions.
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains:
            - "expression nesting is too deep"

  - name: A query past five nodes is rejected at the first extra node
    query:
      gql: |
        MATCH (a0),(a1),(a2),(a3),(a4),(a5),(a6),(a7) RETURN a0
    missing_frontends:
      json: The source test checks where GQL reports the error.
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains:
            - "line 1, column 32: a query declares at most 5 nodes"

  - name: A node past fifty projected properties is rejected at the first extra property
    query:
      gql: |
        MATCH (u:User) RETURN u.c0, u.c1, u.c2, u.c3, u.c4, u.c5, u.c6, u.c7, u.c8, u.c9, u.c10, u.c11, u.c12, u.c13, u.c14, u.c15, u.c16, u.c17, u.c18, u.c19, u.c20, u.c21, u.c22, u.c23, u.c24, u.c25, u.c26, u.c27, u.c28, u.c29, u.c30, u.c31, u.c32, u.c33, u.c34, u.c35, u.c36, u.c37, u.c38, u.c39, u.c40, u.c41, u.c42, u.c43, u.c44, u.c45, u.c46, u.c47, u.c48, u.c49, u.c50
    missing_frontends:
      json: The source test checks where GQL reports the error.
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains:
            - "line 1, column 363: a node projects at most 50 properties"

  - name: A query past the byte limit is rejected before parsing
    generate: { kind: repeat, placeholder: LONG_NAME, repeat: x, count: 40000 }
    query:
      gql: |
        MATCH (u:User {username: 'LONG_NAME'}) RETURN u
    missing_frontends:
      json: The JSON schema caps a filter value before the byte limit applies.
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: limit
          contains: [query must not exceed 32768 bytes]
