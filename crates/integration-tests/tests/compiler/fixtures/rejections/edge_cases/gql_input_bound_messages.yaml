cases:
  - name: A LIMIT far above the maximum names the accepted range instead of a generic syntax error
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u LIMIT 5000
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains:
            - expected an integer from 1 to 1000

  - name: Every negative SKIP names the accepted range
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u SKIP -2 LIMIT 5
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          reason: schema
          contains:
            - expected an integer from 0 to 10000

