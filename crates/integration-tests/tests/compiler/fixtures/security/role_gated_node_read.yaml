name: A role-gated entity keeps its node read under a covered filter

security: { admin: true, access_level: 50 }

query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"v","entity":"Vulnerability","filters":{"state":{"eq":"detected"}}},{"id":"proj","entity":"Project","node_ids":[1]}],"relationships":[{"type":"IN_PROJECT","from":"v","to":"proj"}],"group_by":["proj"],"aggregations":[{"count":"v","as":"n"}],"limit":10}
  gql: |
    MATCH (v:Vulnerability {state: 'detected'})-[:IN_PROJECT]->(proj:Project {id: 1}) RETURN proj, count(v) AS n LIMIT 10

logical:
  expect: ["(Filter v.state = 'detected' (NodeScan Vulnerability AS v))"]

physical:
  clickhouse:
    final_ast:
      expect: ["(Join ON proj.id = v.project_id (Bind v (_)) (_))", "(Deduplicate Final (Scan Table(gl_vulnerability) AS v))"]
