cases:
  - name: A schema version prefix renames the node table
    schema_version_prefix: v1_
    query:
      gql: |
        MATCH (g:Group {id: 1}) RETURN g.name LIMIT 1
    physical:
      clickhouse:
        final_ast:
          expect: ["(Scan Table(v1_gl_group) AS g)"]
          reject: ["(Scan Table(gl_group) AS g)"]

  - name: A path-scoped User filters its table by the caller's path
    ontology_overlay: scoped_user
    query: &scoped_user
      gql: |
        MATCH (u:User {id: 1}) RETURN u.id LIMIT 1
    physical:
      clickhouse:
        final_ast:
          expect: ["(Filter StartsWith(u.traversal_path, '1/'), u.id = 1 (Scan Table(gl_user) AS u))"]

  - name: A path-scoped User keeps its scope under a schema version prefix
    ontology_overlay: scoped_user
    schema_version_prefix: v1_
    query: *scoped_user
    physical:
      clickhouse:
        final_ast:
          expect: ["(Filter StartsWith(u.traversal_path, '1/'), u.id = 1 (Scan Table(v1_gl_user) AS u))"]

  - name: A renamed global User table stays unscoped while the joined Project and edge stay scoped
    ontology_overlay: renamed_user
    query: &member_of
      gql: |
        MATCH (user:User {id: 1, username: 'alice'})-[:MEMBER_OF]->(project:Project {name: 'orbit'}) RETURN user, project LIMIT 1
    physical:
      clickhouse:
        final_ast:
          expect:
            - (Scan Table(gl_renamed_user) AS user)
            - (Filter StartsWith(project.traversal_path, '1/') (_))
            - (Filter StartsWith(_orbit_edge_0.traversal_path, '1/'), ... (_))
          reject: ["(Filter StartsWith(user.traversal_path, '1/'), ... (_))", "(Scan Table(gl_user) AS user)"]

  - name: A renamed global User table takes the schema version prefix
    ontology_overlay: renamed_user
    schema_version_prefix: v1_
    query: *member_of
    physical:
      clickhouse:
        final_ast:
          expect:
            - (Scan Table(v1_gl_renamed_user) AS user)
            - (Filter StartsWith(project.traversal_path, '1/') (_))
            - (Filter StartsWith(_orbit_edge_0.traversal_path, '1/'), ... (_))
          reject: ["(Filter StartsWith(user.traversal_path, '1/'), ... (_))"]

  - name: The default global User table takes the schema version prefix
    schema_version_prefix: v2_
    query: *member_of
    physical:
      clickhouse:
        final_ast:
          expect:
            - (Scan Table(v2_gl_user) AS user)
            - (Filter StartsWith(project.traversal_path, '1/') (_))
            - (Filter StartsWith(_orbit_edge_0.traversal_path, '1/'), ... (_))
          reject: ["(Filter StartsWith(user.traversal_path, '1/'), ... (_))"]
