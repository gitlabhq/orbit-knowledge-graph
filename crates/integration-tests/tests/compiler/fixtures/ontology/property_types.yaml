cases:
  - name: An integer compares with a float property
    ontology_overlay: property_types
    query:
      gql: |
        MATCH (g:Group {id: 1, score: 42}) RETURN g
    logical:
      expect: ["(Filter g.score = 42, ... (_))"]
    physical:
      clickhouse:
        params: [{ value: 42, data_type: Float64 }]

  - name: A filter on a property that cannot be filtered is rejected
    ontology_overlay: property_types
    query:
      gql: |
        MATCH (g:Group {private_note: 'secret'}) RETURN g LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['filter on "private_note" for Group: field is not filterable']

  - name: Grouping by a property that cannot be filtered is rejected
    ontology_overlay: property_types
    query:
      gql: |
        MATCH (g:Group {id: 1}) RETURN g.private_note, count(g) AS group_count LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['group_by[0] on "private_note" for Group: field is not filterable']

  - name: A relationship filter takes its value type from the edge table column
    ontology_overlay: string_edge_source
    query:
      gql: |
        MATCH (u:User {id: 1})-[:NOTED {source_id: 42}]->(n:Note) RETURN u, n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['filter on "source_id" for relationship[0]: value is a number, not a string, expected String']
