cases:
  - name: An integer compares with a float property
    ontology_overlay: property_types
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"g","entity":"Group","node_ids":[1],"filters":{"score":42}}]}
      gql: |
        MATCH (g:Group {id: 1, score: 42}) RETURN g
    logical:
      expect: ["(Filter g.score = 42, ... (_))"]
    physical:
      clickhouse:
        params: [{ value: 1, data_type: Int64 }, { value: 67650, data_type: Int64 }, { value: " [truncated]", data_type: String }, { value: "", data_type: String }, { value: "Group", data_type: String }, { value: "1/", data_type: String }, { value: 42, data_type: Float64 }, { value: false, data_type: Bool }]

  - name: A filter on a property that cannot be filtered is rejected
    ontology_overlay: property_types
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"g","entity":"Group","filters":{"private_note":"secret"}}],"limit":10}
      gql: |
        MATCH (g:Group {private_note: 'secret'}) RETURN g LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: { json: json_dsl_parse, gql: validate }
          reason: { json: ontology, gql: schema }
          contains:
            json: ['"private_note" is not an allowed value']
            gql: ['filter on "private_note" for Group: field is not filterable']

  - name: Grouping by a property that cannot be filtered is rejected
    ontology_overlay: property_types
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"g","entity":"Group","node_ids":[1]}],"group_by":["g.private_note"],"aggregations":[{"count":"g","as":"group_count"}],"limit":10}
      gql: |
        MATCH (g:Group {id: 1}) RETURN g.private_note, count(g) AS group_count LIMIT 10
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['group_by[0] on "private_note" for Group: field is not filterable']

  - name: A relationship filter takes its value type from the edge table column
    ontology_overlay: string_edge_source
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"n","entity":"Note"}],"relationships":[{"type":"NOTED","from":"u","to":"n","filters":{"source_id":42}}]}
      gql: |
        MATCH (u:User {id: 1})-[:NOTED {source_id: 42}]->(n:Note) RETURN u, n
    physical:
      clickhouse:
        rejected:
          phase: validate
          reason: schema
          contains: ['filter on "source_id" for relationship[0]: value is a number, not a string, expected String']
