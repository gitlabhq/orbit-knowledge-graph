name: APPROVED neighbor filters use writer-provided source tags

query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"u","entity":"User","node_ids":[99000],"filters":{"user_type":"human"}}],"neighbors":{"direction":"outgoing","rel_types":["APPROVED"]}}
  gql: |
    MATCH (u:User {id: 99000, user_type: 'human'})-[:APPROVED]->(neighbor)
    RETURN neighbor

logical:
  expect:
    - (Filter u.id IN [99000], u.user_type = 'human' (NodeScan User AS u))

physical:
  clickhouse:
    emitted:
      expect:
        - (Filter ArrayContains(_orbit_neighbor_edge.source_tags, 'user_type:human'), ... (Scan Table(gl_edge) AS _orbit_neighbor_edge))
