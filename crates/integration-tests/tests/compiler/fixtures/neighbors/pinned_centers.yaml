cases:
  - name: A multi-id center keeps one fused edge scan
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"g","entity":"Group","node_ids":[1,2]}],"neighbors":{"direction":"both","rel_types":["MEMBER_OF","CONTAINS"]},"limit":30}
      gql: |
        MATCH (g:Group)-[r:MEMBER_OF|CONTAINS]-(m) WHERE g.id IN [1, 2] RETURN g, r, m LIMIT 30
    logical:
      expect: ["(Filter g.id IN [1, 2] (NodeScan Group AS g))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=g direction=both fused table=gl_edge ... (_))"]
        emitted:
          expect: ["(Bind _orbit_fused (_))"]

  - name: A single-id center scans each arm by its own id
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"w","entity":"WorkItem","node_ids":[7]}],"neighbors":{"direction":"both","rel_types":["RELATED_TO","HAS_LABEL"]},"limit":30}
      gql: |
        MATCH (w:WorkItem)-[r:RELATED_TO|HAS_LABEL]-(m) WHERE w.id = 7 RETURN w, r, m LIMIT 30
    logical:
      expect: ["(Filter w.id IN [7] (NodeScan WorkItem AS w))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=w direction=both directional ... (_))"]
        emitted:
          expect:
            - (Filter _orbit_neighbor_edge.source_kind = 'WorkItem', _orbit_neighbor_edge.source_id = 7, ... (_))
            - (Filter _orbit_neighbor_edge.target_kind = 'WorkItem', _orbit_neighbor_edge.target_id = 7, ... (_))
          reject: ["(Bind _orbit_fused (_))"]
