cases:
  - name: A multi-id center keeps one fused edge scan
    query:
      gql: |
        MATCH (g:Group)-[r:MEMBER_OF|CONTAINS]-(m) WHERE g.id IN [1, 2] RETURN g, r, m LIMIT 30
    logical:
      expect: ["(Filter g.id IN [1, 2] (NodeScan Group AS g))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=g direction=both fused table=gl_edge ... (_))"]
        emitted:
          expect: ["(Bind _orbit_fused (_))"]

  - name: A single-id center scans each arm by its own id
    query:
      gql: |
        MATCH (w:WorkItem)-[r:RELATED_TO|HAS_LABEL]-(m) WHERE w.id = 7 RETURN w, r, m LIMIT 30
    logical:
      expect: ["(Filter w.id IN [7] (NodeScan WorkItem AS w))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=w direction=both directional ... (_))"]
        emitted:
          expect:
            - (Filter _orbit_neighbor_edge.source_kind = 'WorkItem', _orbit_neighbor_edge.source_id = 7, ... (_))
            - (Filter _orbit_neighbor_edge.target_kind = 'WorkItem', _orbit_neighbor_edge.target_id = 7, ... (_))
          reject: ["(Bind _orbit_fused (_))"]

  - name: An id equality filter on a neighbors center compiles like a pinned id
    query:
      gql: |
        MATCH (w:WorkItem)-[r]-(m) WHERE w.id = 7 RETURN w, r, m LIMIT 30
    logical:
      exact: |
        (Limit 30
          (Input neighbors
            (Project w.id, w.iid, w.title, w.state, w.work_item_type
              (Filter w.id IN [7]
                (NodeScan WorkItem AS w)))))
    physical:
      clickhouse:
        planned:
          exact: |
            (Neighbors center=w direction=both directional outgoing=[gl_edge] incoming=[gl_edge] center_filter=false relationships=[ASSIGNED, AUTHORED, BLOCKS, CLOSED, CLOSES, CONTAINS, HAS_LABEL, HAS_NOTE, IN_GROUP, IN_MILESTONE, IN_PROJECT, MENTIONS, RELATED_TO, REOPENED] incoming_scoped=[] incoming_cross_scope=[ASSIGNED, AUTHORED, BLOCKS, CLOSED, CLOSES, CONTAINS, MENTIONS, RELATED_TO, REOPENED]
              (Filter w.id = 7, w._deleted = false
                (NodeScan WorkItem AS w)))

  - name: A single-id center records the center and its label for the response
    query:
      gql: |
        MATCH (u:User {id: 1})-->(n) RETURN u, n LIMIT 10
    physical:
      clickhouse:
        result_context:
          neighbors_center: { entity: User, id: 1 }
          labels: { User: username }

  - name: A multi-id center records no center and no label
    query:
      gql: |
        MATCH (u:User)-->(n) WHERE u.id IN [1, 2] RETURN u, n LIMIT 10
    physical:
      clickhouse:
        result_context:
          neighbors_center: null
          labels: { $exact: {} }
