name: ASSIGNED neighbor filters use writer-provided source tags

query:
  gql: |
    MATCH (u:User {id: 99000, user_type: 'human'})-[:ASSIGNED]->(neighbor)
    RETURN neighbor

logical:
  expect:
    - (Filter u.id IN [99000], u.user_type = 'human' (NodeScan User AS u))

physical:
  clickhouse:
    emitted:
      expect:
        - (Filter ArrayContains(_orbit_neighbor_edge.source_tags, 'user_type:human'), ... (Scan Table(gl_edge) AS _orbit_neighbor_edge))
