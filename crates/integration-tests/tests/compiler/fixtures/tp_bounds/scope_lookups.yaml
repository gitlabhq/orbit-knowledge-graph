security: { admin: true, authorized_paths: [{ path: 1/, access_level: 50 }] }

cases:
  - name: A project filter bounds the traversed node by the project's path
    query:
      gql: |
        MATCH (wi:WorkItem)-[:IN_PROJECT]->(p:Project) WHERE p.id = 1 RETURN wi.id, p LIMIT 100
    logical:
      expect: ["(Filter p.id IN [1] (NodeScan Project AS p))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(wi.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 1)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 1) = '0/'), ... (Bind wi (_)))"]

  - name: A cross-namespace relationship bounds the edge by the source project, not the target
    query:
      gql: |
        MATCH (p:Project)<-[:IN_PROJECT]-(wi:WorkItem)-[:RELATED_TO]->(rel:WorkItem) WHERE p.id = 1 RETURN p, wi.id, rel.id, rel.title LIMIT 100
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(_orbit_edge_1.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 1)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 1) = '0/'), ... (_))"]
          reject: ["(Scan Table(gl_work_item) AS rel)"]
        hydration:
          static:
            rel: { destination_table: gl_work_item, injected_columns: [] }

  - name: A project filter on the callee bounds the caller's authorization scan
    query:
      gql: |
        MATCH (c:Definition)-[:CALLS]->(d:Definition) WHERE d.project_id = 5 AND d.name = 'compile' RETURN c.fqn, d.fqn LIMIT 100
    logical:
      expect: ["(Filter d.project_id = 5, d.name = 'compile' (NodeScan Definition AS d))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(c.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 5)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 5) = '0/'), ... (Scan Table(gl_definition) AS c))"]

  - name: A project filter bounds the counted node of an aggregation
    query:
      gql: |
        MATCH (wi:WorkItem)-[:IN_PROJECT]->(p:Project) WHERE p.id = 1 RETURN p, count(wi) AS c LIMIT 100
    logical:
      expect: ["(Aggregate group p AS p, COUNT(wi) AS c (_))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Aggregate ... (Filter StartsWith(wi.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 1)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 1) = '0/'), ... (_)))"]

  - name: A conditional count leaves the scope lookup out of its condition
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group {id: 100}) RETURN g, count(u) AS n LIMIT 5
    logical:
      expect: ["(Aggregate group g AS g, COUNT(u) AS n (_))"]
    physical:
      clickhouse:
        final_ast:
          expect:
            - "(Aggregate COUNT() FILTER [(_orbit_edge_0.relationship_kind = 'MEMBER_OF') AND (_orbit_edge_0.source_kind = 'User') AND (_orbit_edge_0.target_kind = 'Group') AND (_orbit_edge_0._deleted = false) AND (_orbit_edge_0.target_id = 100)] AS n, ... (_))"
            - "(Filter StartsWith(_orbit_edge_0.traversal_path, '1/'), StartsWith(_orbit_edge_0.traversal_path, scalar(gl_group AS _orbit_scope WHERE StartsWith(_orbit_scope.traversal_path, '1/') AND (_orbit_scope.id = 100))) OR (scalar(gl_group AS _orbit_scope WHERE StartsWith(_orbit_scope.traversal_path, '1/') AND (_orbit_scope.id = 100)) = '0/'), ... (Scan Table(gl_edge) AS _orbit_edge_0))"
