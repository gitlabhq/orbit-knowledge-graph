cases:
  - name: A node pinned by its own id keeps its own read free of a path lookup
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 7}) RETURN mr LIMIT 1
    logical:
      expect: ["(NodeScan MergeRequest AS mr)"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter mr.id = 7, ... (Scan Table(gl_merge_request) AS mr))"]
          reject: ["(Filter StartsWith(mr.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (_))"]

  - name: A pinned node shares one path lookup with the nodes it reaches
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 7})-[:HAS_LATEST_DIFF]->(d:MergeRequestDiff) RETURN d.id LIMIT 10
    logical:
      expect: ["(EdgeScan HAS_LATEST_DIFF mr->d AS e0)"]
    physical:
      clickhouse:
        emitted:
          expect:
            - (Filter StartsWith(d.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (Scan Table(gl_merge_request_diff) AS d))
            - (Filter StartsWith(mr.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (Scan Table(gl_merge_request) AS mr))

  - name: A pinned pipeline bounds its jobs by its path
    query:
      gql: |
        MATCH (pl:Pipeline {id: 7})-[:HAS_JOB]->(j:Job) RETURN j.name LIMIT 100
    logical:
      expect: ["(EdgeScan HAS_JOB pl->j AS e0)"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(j.traversal_path, scalar(gl_pipeline AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_pipeline AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (Scan Table(gl_job) AS j))"]

  - name: A node pinned through a foreign key keeps the anchor's path lookup on its own read
    query:
      gql: |
        MATCH (mr:MergeRequest {project_id: 100}) RETURN mr.iid LIMIT 10
    logical:
      expect: ["(Filter mr.project_id = 100 (NodeScan MergeRequest AS mr))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(mr.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 100)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 100) = '0/'), mr.project_id = 100, ... (Bind mr (_)))"]

  - name: A scope-preserving relationship carries the pinned source's path to its target
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 7})-[:HAS_DIFF]->(diff:MergeRequestDiff) RETURN mr, diff LIMIT 1
    logical:
      expect: ["(EdgeScan HAS_DIFF mr->diff AS e0)"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(diff.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (Scan Table(gl_merge_request_diff) AS diff))"]

  - name: A relationship that is not scope-preserving keeps the pinned source's path off its target
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 7})-[:HAS_LABEL]->(l:Label {title: 'bug'}) RETURN l.title LIMIT 10
    logical:
      expect: ["(EdgeScan HAS_LABEL mr->l AS e0)"]
    physical:
      clickhouse:
        emitted:
          expect:
            - (Filter StartsWith(_orbit_edge_0.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (Scan Table(gl_edge) AS _orbit_edge_0))
            - (Filter l.title = 'bug', ... (_))
          reject:
            - (Filter StartsWith(l.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (_))

  - name: A pinned prune-to-target endpoint keeps its own bound
    security: { paths: [1/9970/] }
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(p:Project {id: 15846663}) RETURN u, p
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(_orbit_edge_0.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 15846663)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 15846663) = '0/'), ... (Scan Table(gl_edge) AS _orbit_edge_0))"]

  - name: A prune-to-target bound does not cross a user hub
    security: { paths: [1/9970/] }
    query:
      gql: |
        MATCH (a:Project {id: 15846663})<-[:MEMBER_OF]-(u:User)-[:MEMBER_OF]->(b:Project) RETURN a, u, b
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(_orbit_edge_0.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 15846663)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 15846663) = '0/'), ... (Scan Table(gl_edge) AS _orbit_edge_0))"]
          reject:
            - "(Filter StartsWith(_orbit_edge_1.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 15846663)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 15846663) = '0/'), ... (_))"
            - "(Filter StartsWith(b.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 15846663)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 15846663) = '0/'), ... (_))"
