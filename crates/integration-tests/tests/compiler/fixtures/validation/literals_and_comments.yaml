physical:
  clickhouse: {}

cases:
  - name: Comments, lowercase keywords, a hex id, and a trailing semicolon normalize like JSON
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[16]}]}
      gql: |
        /* MATCH nothing */ match(u:User {id: 0x10}) return u; // done
    logical:
      expect: ["(Filter u.id IN [16] (NodeScan User AS u))"]

  - name: An octal id normalizes like JSON
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[8]}]}
      gql: |
        MATCH (u:User {id: 0o10}) RETURN u
    logical:
      expect: ["(Filter u.id IN [8] (NodeScan User AS u))"]

  - name: The smallest 64-bit id normalizes like JSON
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[-9223372036854775808]}]}
      gql: |
        MATCH (u:User {id: -9223372036854775808}) RETURN u
    logical:
      expect: ["(Filter u.id IN [-9223372036854775808] (NodeScan User AS u))"]

  - name: String escapes and a surrogate pair decode like JSON
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"a'b\\c\n😀"}}]}
      gql: |
        MATCH (`u`:User {username: 'a\'b\\c\n\uD83D\uDE00'}) RETURN u
    logical:
      expect: ["(Filter u.username = 'a\\'b\\\\c\n😀' (NodeScan User AS u))"]

  - name: A date() call normalizes like a JSON date string
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"created_at":{"gte":"2024-01-01"}}}]}
      gql: |
        MATCH (u:User) WHERE u.created_at >= date('2024-01-01') RETURN u
    logical:
      expect: ["(Filter u.created_at >= '2024-01-01' (NodeScan User AS u))"]

  - name: DEBUG inside a string literal stays a bound value
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"DEBUG"}}]}
      gql: |
        MATCH (u:User {username: 'DEBUG'}) RETURN u
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: DEBUG, data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: An escaped quote cannot end a literal and turn on DEBUG
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"x' RETURN u DEBUG //"}}]}
      gql: |
        MATCH (u:User {username: 'x\' RETURN u DEBUG //'}) RETURN u
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "x' RETURN u DEBUG //", data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: A unicode-escaped quote cannot end a literal and turn on DEBUG
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"' RETURN u DEBUG //"}}]}
      gql: |
        MATCH (u:User {username: '\u0027 RETURN u DEBUG //'}) RETURN u
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "' RETURN u DEBUG //", data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: SQL inside a double-quoted literal stays a bound value
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"'; DROP TABLE gl_user; --"}}]}
      gql: |
        MATCH (u:User {username: "'; DROP TABLE gl_user; --"}) RETURN u
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "'; DROP TABLE gl_user; --", data_type: String }]
        parameterized_sql: { not_contains: [DROP TABLE] }

  - name: DEBUG inside a string literal followed by DEBUG in a block comment leaves debug SQL off
    query:
      gql: |
        MATCH (u:User {username: 'DEBUG'}) RETURN u /* DEBUG */
    missing_frontends:
      json: JSON has no comments.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: DEBUG, data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: DEBUG inside a string literal followed by DEBUG in a line comment leaves debug SQL off
    query:
      gql: |
        MATCH (u:User {username: 'DEBUG'}) RETURN u // DEBUG
    missing_frontends:
      json: JSON has no comments.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: DEBUG, data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: An escaped quote in a literal followed by DEBUG in a block comment leaves debug SQL off
    query:
      gql: |
        MATCH (u:User {username: 'x\' RETURN u DEBUG //'}) RETURN u /* DEBUG */
    missing_frontends:
      json: JSON has no comments.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "x' RETURN u DEBUG //", data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: An escaped quote in a literal followed by DEBUG in a line comment leaves debug SQL off
    query:
      gql: |
        MATCH (u:User {username: 'x\' RETURN u DEBUG //'}) RETURN u // DEBUG
    missing_frontends:
      json: JSON has no comments.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "x' RETURN u DEBUG //", data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: A unicode-escaped quote in a literal followed by DEBUG in a block comment leaves debug SQL off
    query:
      gql: |
        MATCH (u:User {username: '\u0027 RETURN u DEBUG //'}) RETURN u /* DEBUG */
    missing_frontends:
      json: JSON has no comments.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "' RETURN u DEBUG //", data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: A unicode-escaped quote in a literal followed by DEBUG in a line comment leaves debug SQL off
    query:
      gql: |
        MATCH (u:User {username: '\u0027 RETURN u DEBUG //'}) RETURN u // DEBUG
    missing_frontends:
      json: JSON has no comments.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "' RETURN u DEBUG //", data_type: String }]
        parameterized_sql: { not_contains: [DEBUG] }

  - name: SQL in a double-quoted literal followed by DEBUG in a block comment leaves debug SQL off
    query:
      gql: |
        MATCH (u:User {username: "'; DROP TABLE gl_user; --"}) RETURN u /* DEBUG */
    missing_frontends:
      json: JSON has no comments.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "'; DROP TABLE gl_user; --", data_type: String }]
        parameterized_sql: { not_contains: [DROP TABLE] }

  - name: SQL in a double-quoted literal followed by DEBUG in a line comment leaves debug SQL off
    query:
      gql: |
        MATCH (u:User {username: "'; DROP TABLE gl_user; --"}) RETURN u // DEBUG
    missing_frontends:
      json: JSON has no comments.
    logical:
      expect: ["(Input traversal (...))"]
    physical:
      clickhouse:
        params: [{ value: "'; DROP TABLE gl_user; --", data_type: String }]
        parameterized_sql: { not_contains: [DROP TABLE] }
