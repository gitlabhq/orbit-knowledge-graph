physical:
  clickhouse: {}

cases:
  - name: Operator objects normalize like GQL comparisons and IN lists
    query:
      gql: |
        MATCH (u:User) WHERE u.created_at >= '2024-01-01' AND u.state IN ['active', 'blocked'] RETURN u
    logical:
      expect: ["(Filter u.created_at >= '2024-01-01', u.state IN ['active', 'blocked'] (NodeScan User AS u))"]

  - name: An array of operator objects bounds one property and a bare value stays an equality
    query:
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.created_at >= '2026-04-01T00:00:00Z' AND mr.created_at < '2026-05-01T00:00:00Z' AND mr.state = 'merged' RETURN mr
    logical:
      expect: ["(Filter mr.created_at >= '2026-04-01T00:00:00Z', mr.created_at < '2026-05-01T00:00:00Z', mr.state = 'merged' (NodeScan MergeRequest AS mr))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter mr.created_at >= '2026-04-01T00:00:00Z', mr.created_at < '2026-05-01T00:00:00Z', ... (Scan Table(gl_merge_request) AS mr))"]

  - name: Several keys in one operator object combine with AND
    query:
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.created_at >= '2026-04-01' AND mr.created_at < '2026-05-01' RETURN mr
    logical:
      expect: ["(Filter mr.created_at >= '2026-04-01', mr.created_at < '2026-05-01' (NodeScan MergeRequest AS mr))"]

  - name: A false nullability operator selects the opposite null check
    query:
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.merged_at IS NULL AND mr.latest_closed_at IS NOT NULL AND mr.created_at IS NULL RETURN mr
    logical:
      expect: ["(Filter mr.created_at IS NULL, mr.latest_closed_at IS NOT NULL, mr.merged_at IS NULL (NodeScan MergeRequest AS mr))"]
