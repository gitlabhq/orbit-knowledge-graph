missing_frontends:
  json: The source test checks how GQL reads its optional trailing clauses.

physical:
  clickhouse: {}

cases:
  - name: A query with unsorted, no SKIP, no LIMIT, no DEBUG keeps those clauses
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u
    logical:
      expect: ["(Input traversal (...))", "(Limit 30 (_))"]
      reject: ["(Sort ... (_))", "(Offset ... (_))"]

  - name: A query with unsorted, no SKIP, no LIMIT, DEBUG keeps those clauses
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u DEBUG
    logical:
      expect: ["(Input traversal include_debug_sql (...))", "(Limit 30 (_))"]
      reject: ["(Sort ... (_))", "(Offset ... (_))"]

  - name: A query with unsorted, no SKIP, LIMIT 7, no DEBUG keeps those clauses
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u LIMIT 7
    logical:
      expect: ["(Input traversal (...))", "(Limit 7 (_))"]
      reject: ["(Sort ... (_))", "(Offset ... (_))"]

  - name: A query with unsorted, no SKIP, LIMIT 7, DEBUG keeps those clauses
