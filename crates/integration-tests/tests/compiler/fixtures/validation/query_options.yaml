physical:
  clickhouse: {}

cases:
  - name: Omitted options keep the default columns and no debug SQL
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]}]}
      gql: |
        MATCH (u:User {id: 1}) RETURN u
    logical:
      expect: ["(Input traversal (...))"]

  - name: An empty options object keeps the defaults
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"options":{}}
      gql: |
        MATCH (u:User {id: 1}) RETURN u
    logical:
      expect: ["(Input traversal (...))"]

  - name: The JSON debug option matches GQL DEBUG
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"options":{"include_debug_sql":true}}
      gql: |
        MATCH (u:User {id: 1}) RETURN u DEBUG
    logical:
      expect: ["(Input traversal include_debug_sql (...))"]

  - name: Dynamic columns alone leave debug SQL off
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"options":{"dynamic_columns":"*"}}
    missing_frontends:
      gql: GQL sets dynamic columns only on neighbors and path results.
    logical:
      expect: ["(Input traversal dynamic_columns=* (...))"]

  - name: Default dynamic columns keep the default neighbor properties
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"g","entity":"Group","node_ids":[100]}],"neighbors":{"direction":"both"},"options":{"dynamic_columns":"default"}}
      gql: |
        MATCH (g:Group {id: 100})--(n) RETURN g, n
    logical:
      expect: ["(Input neighbors (...))"]
    physical:
      clickhouse:
        hydration:
          dynamic:
            Project: { entity_type: Project, columns: [id, full_path, name, visibility_level] }

  - name: The JSON dynamic columns option matches GQL neighbor properties
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"g","entity":"Group","node_ids":[100]}],"neighbors":{"direction":"both"},"options":{"dynamic_columns":"*"}}
      gql: |
        MATCH (g:Group {id: 100})--(n) RETURN g, properties(n)
    logical:
      expect: ["(Input neighbors dynamic_columns=* (...))"]
    physical:
      clickhouse:
        hydration:
          dynamic:
            Project:
              entity_type: Project
              columns: [id, full_path, name, description, created_at, updated_at, visibility_level, archived, star_count, last_activity_at]

  - name: The JSON dynamic columns option matches GQL path properties
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"start","entity":"Project","node_ids":[100]},{"id":"end","entity":"Project","node_ids":[200]}],"path":{"type":"shortest","from":"start","to":"end","max_depth":3,"rel_types":["CONTAINS"]},"options":{"dynamic_columns":"*"}}
      gql: |
        MATCH p = ANY SHORTEST (start:Project {id: 100})-[:CONTAINS*1..3]->(`end`:Project {id: 200}) RETURN properties(p)
    logical:
      expect: ["(Input path_finding dynamic_columns=* (...))"]
