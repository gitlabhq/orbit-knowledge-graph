physical:
  clickhouse: {}

cases:
  - name: A bounded hop range normalizes to the JSON hops
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"User","node_ids":[1]},{"id":"b","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"a","to":"b","hops":[1,3]}]}
      gql: |
        MATCH (a:User {id: 1})-[:MEMBER_OF*1..3]->(b:Project) RETURN a, b
    logical:
      expect: ["(EdgeScan MEMBER_OF a->b AS e0 HOPS 1..3)"]

  - name: An exact hop count normalizes to equal hop bounds
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"User","node_ids":[1]},{"id":"b","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"a","to":"b","hops":[2,2]}]}
      gql: |
        MATCH (a:User {id: 1})-[:MEMBER_OF*2]->(b:Project) RETURN a, b
    logical:
      expect: ["(EdgeScan MEMBER_OF a->b AS e0 HOPS 2..2)"]

  - name: A WHERE comparison on a relationship variable becomes a relationship filter
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"User","node_ids":[1]},{"id":"b","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"a","to":"b","filters":{"target_id":{"gte":2}}}]}
      gql: |
        MATCH (a:User {id: 1})-[r:MEMBER_OF]->(b:Project) WHERE r.target_id >= 2 RETURN a, b
    logical:
      expect: ["(Filter e0.target_id >= 2 (EdgeScan MEMBER_OF a->b AS e0))"]

  - name: An inline relationship property becomes a relationship filter
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"User","node_ids":[1]},{"id":"b","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"a","to":"b","filters":{"target_id":2}}]}
      gql: |
        MATCH (a:User {id: 1})-[:MEMBER_OF {target_id: 2}]->(b:Project) RETURN a, b
    logical:
      expect: ["(Filter e0.target_id = 2 (EdgeScan MEMBER_OF a->b AS e0))"]

  - name: An inline property on a single-hop range is a plain relationship filter
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"User","node_ids":[1]},{"id":"b","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"a","to":"b","filters":{"target_id":2}}]}
      gql: |
        MATCH (a:User {id: 1})-[:MEMBER_OF*1..1 {target_id: 2}]->(b:Project) RETURN a, b
    logical:
      expect: ["(Filter e0.target_id = 2 (EdgeScan MEMBER_OF a->b AS e0))"]

  - name: An empty property map on a hop range adds no filter
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"User","node_ids":[1]},{"id":"b","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"a","to":"b","hops":[1,3]}]}
      gql: |
        MATCH (a:User {id: 1})-[:MEMBER_OF*1..3 {}]->(b:Project) RETURN a, b
    logical:
      expect: ["(Input traversal (_) (_) (EdgeScan MEMBER_OF a->b AS e0 HOPS 1..3))"]

  - name: An outgoing arrow from the pinned node keeps the relationship direction
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"g","entity":"Group"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}]}
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF]->(g:Group) RETURN u, g
    logical:
      expect: ["(EdgeScan MEMBER_OF u->g AS e0)"]

  - name: An incoming arrow into the pinned node keeps the relationship direction
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"g","entity":"Group","node_ids":[1]},{"id":"u","entity":"User"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}]}
      gql: |
        MATCH (g:Group {id: 1})<-[:MEMBER_OF]-(u:User) RETURN g, u
    logical:
      expect: ["(EdgeScan MEMBER_OF u->g AS e0)"]

  - name: A typed undirected relationship to an unlabeled node is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"g","entity":"Group","node_ids":[1]}],"neighbors":{"direction":"both","rel_types":["MEMBER_OF"]}}
      gql: |
        MATCH (g:Group {id: 1})-[:MEMBER_OF]-(n) RETURN n
    logical:
      expect: ["(Input neighbors (Project ... (Filter g.id IN [1] (NodeScan Group AS g))))"]

  - name: An untyped undirected relationship to an unlabeled node is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"g","entity":"Group","node_ids":[1]}],"neighbors":{"direction":"both"}}
      gql: |
        MATCH (g:Group {id: 1})--(n) RETURN n
    logical:
      expect: ["(Input neighbors (Project ... (Filter g.id IN [1] (NodeScan Group AS g))))"]

  - name: A incoming neighbors pattern with the endpoint written after the center is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"center","entity":"WorkItem","node_ids":[1]}],"neighbors":{"rel_types":["AUTHORED"],"direction":"incoming"}}
      gql: |
        MATCH (n)-[:AUTHORED]->(center:WorkItem {id: 1}) RETURN center, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter center.id IN [1] (NodeScan WorkItem AS center))))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=center direction=incoming ... (_))"]

  - name: A incoming neighbors pattern with the endpoint written before the center is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"center","entity":"WorkItem","node_ids":[1]}],"neighbors":{"rel_types":["AUTHORED"],"direction":"incoming"}}
      gql: |
        MATCH (center:WorkItem {id: 1})<-[:AUTHORED]-(n) RETURN center, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter center.id IN [1] (NodeScan WorkItem AS center))))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=center direction=incoming ... (_))"]

  - name: A outgoing neighbors pattern with the endpoint written after the center is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"center","entity":"WorkItem","node_ids":[1]}],"neighbors":{"direction":"outgoing"}}
      gql: |
        MATCH (n)<--(center:WorkItem {id: 1}) RETURN center, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter center.id IN [1] (NodeScan WorkItem AS center))))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=center direction=outgoing ... (_))"]

  - name: A outgoing neighbors pattern with the endpoint written before the center is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"center","entity":"WorkItem","node_ids":[1]}],"neighbors":{"direction":"outgoing"}}
      gql: |
        MATCH (center:WorkItem {id: 1})-->(n) RETURN center, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter center.id IN [1] (NodeScan WorkItem AS center))))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=center direction=outgoing ... (_))"]

  - name: A both neighbors pattern with the endpoint written after the center is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"center","entity":"WorkItem","node_ids":[1]}],"neighbors":{"direction":"both"}}
      gql: |
        MATCH (n)--(center:WorkItem {id: 1}) RETURN center, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter center.id IN [1] (NodeScan WorkItem AS center))))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=center direction=both ... (_))"]

  - name: A both neighbors pattern with the endpoint written before the center is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"center","entity":"WorkItem","node_ids":[1]}],"neighbors":{"direction":"both"}}
      gql: |
        MATCH (center:WorkItem {id: 1})--(n) RETURN center, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter center.id IN [1] (NodeScan WorkItem AS center))))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=center direction=both ... (_))"]

  - name: Returning a neighbors center by name is a neighbors query
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"center","entity":"User","node_ids":[1]}],"neighbors":{"direction":"both"}}
      gql: |
        MATCH (center:User {id: 1})--(n) RETURN center, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter center.id IN [1] (NodeScan User AS center))))"]

  - name: Returning neighbors center properties projects them
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"center","entity":"User","node_ids":[1],"columns":["username","state"]}],"neighbors":{"direction":"both"}}
      gql: |
        MATCH (center:User {id: 1})--(n) RETURN center.username, center.state, n
    logical:
      expect: ["(Input neighbors (Project center.username, center.state (_)))"]
