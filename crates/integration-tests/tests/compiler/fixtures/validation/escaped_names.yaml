physical:
  clickhouse: {}

cases:
  - name: Backticked variable, label, and property names normalize
    query:
      gql: |
        MATCH (`u`:`User` {`id`: 1}) RETURN `u` LIMIT 5
    logical:
      exact: |
        (Limit 5
          (Input traversal
            (Project u.id, u.username, u.name, u.state
              (Filter u.id IN [1]
                (NodeScan User AS u)))))

  - name: A backticked reserved SKIP word is a valid variable name
    query:
      gql: |
        MATCH (`offset`:User {id: 1}) RETURN `offset`
    logical:
      expect: ["(Filter offset.id IN [1] (NodeScan User AS offset))"]

  - name: Variables with underscores, capitals, and digits render as SQL identifiers
    query:
      gql: |
        MATCH (user_node:User {id: 1})-[:AUTHORED]->(_private:Note)-[:IN_PROJECT]->(CamelCase:Project {id: 1}), (user_node)-[:MEMBER_OF]->(node123:Group) RETURN user_node.username, _private.confidential, CamelCase.name, node123.name
    physical:
      clickhouse:
        sql:
          contains: [_orbit_user_node_id, _orbit__private_id, _orbit_CamelCase_id, _orbit_node123_id]
          not_contains: ["{p"]
