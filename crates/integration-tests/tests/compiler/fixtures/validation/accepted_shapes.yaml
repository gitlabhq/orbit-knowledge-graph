cases:
  - name: Equality on a text property passes validation on an ungrouped aggregation node
    query:
      gql: |
        MATCH (w:WorkItem)-[:IN_GROUP]->(g:Group {id: 100}) WHERE w.title = 'Implement login page' RETURN g, count(w) AS n
    missing_frontends:
      json: The source scenario supplies only GQL.
    logical:
      expect: ["(Filter w.title = 'Implement login page' (_))"]
    physical:
      clickhouse: {}

  - name: Code entities keep text filters on ungrouped aggregation nodes
    query:
      gql: |
        MATCH (d:Definition) WHERE d.project_id = 1000 AND d.fqn STARTS WITH 'src' RETURN count(d) AS n
    missing_frontends:
      json: The source scenario supplies only GQL.
    logical:
      expect: ["(Filter starts_with(d.fqn, 'src'), ... (_))"]
    physical:
      clickhouse: {}

  - name: Group and project text filters pass validation on ungrouped aggregation nodes
    query:
      gql: |
        MATCH (g:Group)-[:CONTAINS]->(p:Project)<-[:IN_PROJECT]-(mr:MergeRequest) WHERE g.full_path STARTS WITH 'public' AND p.name CONTAINS 'Project' RETURN count(mr) AS n
    missing_frontends:
      json: The source scenario supplies only GQL.
    logical:
      expect:
        - "(Filter starts_with(g.full_path, 'public') (_))"
        - "(Filter contains(p.name, 'Project') (_))"

    physical:
      clickhouse: {}

  - name: A User neighbors query is not blocked by the User aggregation guard
    query:
      json: |
        {"query_type": "neighbors", "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}], "neighbors": {"direction": "outgoing", "rel_types": ["MEMBER_OF"]}, "limit": 10}
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF]->(n) RETURN u, n LIMIT 10
    logical:
      expect: ["(Input neighbors (...))"]
    physical:
      clickhouse: {}

  - name: A pinned node and an unfiltered related node pass validation
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"n","entity":"Note"}],"relationships":[{"type":"AUTHORED","from":"u","to":"n"}]}
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED]->(n:Note) RETURN u, n
    logical:
      expect: ["(EdgeScan AUTHORED u->n AS e0)"]
    physical:
      clickhouse: {}

  - name: A filter on either end of a relationship makes a traversal selective
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User"},{"id":"p","entity":"Project","filters":{"name":"gitlab"}}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p"}]}
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(p:Project {name: 'gitlab'}) RETURN u, p
    logical:
      expect: ["(Filter p.name = 'gitlab' (NodeScan Project AS p))"]
    physical:
      clickhouse: {}

  - name: Distinct node ids pass validation and a pinned node makes the traversal selective
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p"}]}
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF]->(p:Project) RETURN u, p
    logical:
      expect: ["(EdgeScan MEMBER_OF u->p AS e0)"]
    physical:
      clickhouse: {}

  - name: A pinned node makes a variable-length traversal selective
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p","hops":[1,2]}]}
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF*1..2]->(p:Project) RETURN u, p
    logical:
      expect: ["(EdgeScan MEMBER_OF u->p AS e0 HOPS 1..2)"]
    physical:
      clickhouse: {}

  - name: A narrow id range makes a related traversal selective
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","id_range":{"start":1,"end":100}},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p"}]}
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(p:Project) WHERE u.id >= 1 AND u.id <= 100 RETURN u, p
    logical:
      expect: ["(Filter u.id >= 1, u.id <= 100 (NodeScan User AS u))"]
    physical:
      clickhouse: {}

  - name: A narrow id range makes a single-node traversal selective
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","id_range":{"start":1,"end":100}}]}
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 100 RETURN u
    logical:
      expect: ["(Filter u.id >= 1, u.id <= 100 (NodeScan User AS u))"]
    physical:
      clickhouse: {}

  - name: A property filter makes a single-node traversal selective
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"root"}}]}
      gql: |
        MATCH (u:User {username: 'root'}) RETURN u
    logical:
      expect: ["(Filter u.username = 'root' (NodeScan User AS u))"]
    physical:
      clickhouse: {}

  - name: A traversal can sort by a property of its node
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1],"columns":["username"]}],"order_by":"u.username"}
      gql: |
        MATCH (u:User {id: 1}) RETURN u.username ORDER BY u.username
    logical:
      expect: ["(Project u.username (Filter u.id IN [1] (NodeScan User AS u)))"]
    physical:
      clickhouse: {}

  - name: A path between pinned endpoints with a named relationship type passes validation
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"a","entity":"Project","node_ids":[1]},{"id":"b","entity":"Project","node_ids":[2]}],"path":{"type":"shortest","from":"a","to":"b","max_depth":3,"rel_types":["CONTAINS"]}}
      gql: |
        MATCH p = ANY SHORTEST (a:Project {id: 1})-[:CONTAINS*1..3]->(b:Project {id: 2}) RETURN p
    logical:
      expect: ["(Input path_finding (Project ... (Filter a.id IN [1] (_))) (Project ... (Filter b.id IN [2] (_))))"]
    physical:
      clickhouse: {}

  - name: A property filter makes a path endpoint selective
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"a","entity":"User","filters":{"username":"alice"}},{"id":"b","entity":"Project","node_ids":[2]}],"path":{"type":"shortest","from":"a","to":"b","max_depth":2,"rel_types":["MEMBER_OF"]}}
      gql: |
        MATCH p = ANY SHORTEST (a:User {username: 'alice'})-[:MEMBER_OF*1..2]->(b:Project {id: 2}) RETURN p
    logical:
      expect: ["(Filter a.username = 'alice' (NodeScan User AS a))"]
    physical:
      clickhouse: {}

  - name: An id range inside the anchor span makes a path endpoint selective
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"a","entity":"User","id_range":{"start":1,"end":100}},{"id":"b","entity":"Project","node_ids":[2]}],"path":{"type":"shortest","from":"a","to":"b","max_depth":2,"rel_types":["MEMBER_OF"]}}
      gql: |
        MATCH p = ANY SHORTEST (a:User)-[:MEMBER_OF*1..2]->(b:Project {id: 2}) WHERE a.id >= 1 AND a.id <= 100 RETURN p
    logical:
      expect: ["(Filter a.id >= 1, a.id <= 100 (NodeScan User AS a))"]
    physical:
      clickhouse: {}

  - name: A pinned center passes the neighbors guard without relationship types
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"neighbors":{"direction":"both"}}
      gql: |
        MATCH (u:User {id: 1})--(n) RETURN u, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter u.id IN [1] (NodeScan User AS u))))"]
    physical:
      clickhouse: {}

  - name: A property filter on the center passes the neighbors guard
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"u","entity":"User","filters":{"username":"root"}}],"neighbors":{"direction":"both"}}
      gql: |
        MATCH (u:User {username: 'root'})--(n) RETURN u, n
    logical:
      expect: ["(Input neighbors (Project ... (Filter u.username = 'root' (NodeScan User AS u))))"]
    physical:
      clickhouse: {}

  - name: A single pinned node aggregation needs no group_by or relationship
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"aggregations":[{"count":"p","as":"total"}]}
      gql: |
        MATCH (p:Project {id: 1}) RETURN count(p) AS total
    logical:
      expect: ["(Aggregate COUNT(p) AS total (_))"]
    physical:
      clickhouse: {}

  - name: count accepts distinct on a property
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"aggregations":[{"count":"p.name","distinct":true,"as":"n"}]}
      gql: |
        MATCH (p:Project {id: 1}) RETURN count(DISTINCT p.name) AS n
    logical:
      expect: ["(Aggregate COUNT(p.name) AS n (_))"]
    physical:
      clickhouse:
        sql: { contains: ["countDistinct(p.name) AS n"] }

  - name: Grouping by a node counts that node and its related node
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"g","entity":"Group"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}],"group_by":["u"],"aggregations":[{"count":"u","as":"total"},{"count":"g","as":"group_count"}]}
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF]->(g:Group) RETURN u, count(u) AS total, count(g) AS group_count
    logical:
      expect: ["(Aggregate group u AS u, COUNT(u) AS total, COUNT(g) AS group_count (_))"]
    physical:
      clickhouse: {}

  - name: Grouping by a node counts a related node with a projected group column
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1],"columns":["username"]},{"id":"n","entity":"Note"}],"relationships":[{"type":"AUTHORED","from":"u","to":"n"}],"group_by":["u"],"aggregations":[{"count":"n","as":"note_count"}]}
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED]->(n:Note) RETURN u{.username}, count(n) AS note_count
    logical:
      expect: ["(Aggregate group u AS u, COUNT(n) AS note_count (_))"]
    physical:
      clickhouse: {}

  - name: Grouping by an enum property passes validation
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1]}],"group_by":["p.visibility_level"],"aggregations":[{"count":"p","as":"project_count"}]}
      gql: |
        MATCH (p:Project {id: 1}) RETURN p.visibility_level, count(p) AS project_count
    logical:
      expect: ["(Aggregate group p.visibility_level AS p_visibility_level, COUNT(p) AS project_count (_))"]
    physical:
      clickhouse: {}

  - name: A filter on one side makes a grouped aggregation selective
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","filters":{"username":"root"}},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p"}],"group_by":["p"],"aggregations":[{"count":"u","as":"c"}]}
      gql: |
        MATCH (u:User {username: 'root'})-[:MEMBER_OF]->(p:Project) RETURN p, count(u) AS c
    logical:
      expect: ["(Aggregate group p AS p, COUNT(u) AS c (_))"]
    physical:
      clickhouse: {}

  - name: A narrow id range makes a grouped aggregation selective
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","id_range":{"start":1,"end":100}},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p"}],"group_by":["p"],"aggregations":[{"count":"u","as":"c"}]}
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(p:Project) WHERE u.id >= 1 AND u.id <= 100 RETURN p, count(u) AS c
    logical:
      expect: ["(Filter u.id >= 1, u.id <= 100 (NodeScan User AS u))"]
    physical:
      clickhouse: {}

  - name: An id range inside the anchor span makes a Project path endpoint selective
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"a","entity":"Project","id_range":{"start":1,"end":100}},{"id":"b","entity":"Project","node_ids":[2]}],"path":{"type":"shortest","from":"a","to":"b","max_depth":2,"rel_types":["CONTAINS"]}}
      gql: |
        MATCH p = ANY SHORTEST (a:Project)-[:CONTAINS*1..2]->(b:Project {id: 2}) WHERE a.id >= 1 AND a.id <= 100 RETURN p
    logical:
      expect: ["(Filter a.id >= 1, a.id <= 100 (NodeScan Project AS a))"]
    physical:
      clickhouse: {}

  - name: Sorting by a known property passes validation
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1],"columns":["username"]}],"limit":10,"order_by":"u.username"}
      gql: |
        MATCH (u:User {id: 1}) RETURN u.username ORDER BY u.username LIMIT 10
    logical:
      expect: ["(Limit 10 (Sort u.username (_)))"]
    physical:
      clickhouse: {}

  - name: Counting a known property passes validation
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1],"columns":["name"]}],"aggregations":[{"count":"p.name","as":"name_count"}],"limit":10}
      gql: |
        MATCH (p:Project {id: 1}) RETURN count(p.name) AS name_count LIMIT 10
    logical:
      expect: ["(Aggregate COUNT(p.name) AS name_count (_))"]
    physical:
      clickhouse: {}

  - name: CALLS accepts an ImportedSymbol target
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"caller","entity":"Definition","node_ids":[1],"columns":["name"]},{"id":"sym","entity":"ImportedSymbol","columns":["identifier_name"]}],"relationships":[{"type":"CALLS","from":"caller","to":"sym"}],"limit":10}
      gql: |
        MATCH (caller:Definition {id: 1})-[:CALLS]->(sym:ImportedSymbol) RETURN caller.name, sym.identifier_name LIMIT 10
    security:
      admin: true
    logical:
      expect: ["(EdgeScan CALLS caller->sym AS e0)"]
    physical:
      clickhouse: {}

  - name: A CALLS aggregation grouped by the callee passes validation
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"caller","entity":"Definition","node_ids":[1]},{"id":"callee","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"caller","to":"callee"}],"group_by":["callee"],"aggregations":[{"count":"caller","as":"callers"}],"limit":1}
      gql: |
        MATCH (caller:Definition {id: 1})-[:CALLS]->(callee:Definition) RETURN callee, count(caller) AS callers LIMIT 1
    security:
      admin: true
    logical:
      expect: ["(Aggregate group callee AS callee, COUNT(caller) AS callers (_))"]
    physical:
      clickhouse: {}
