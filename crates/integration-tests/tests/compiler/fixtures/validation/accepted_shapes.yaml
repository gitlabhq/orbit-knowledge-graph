cases:
  - name: Equality on a text property passes validation on an ungrouped aggregation node
    query:
      gql: |
        MATCH (w:WorkItem)-[:IN_GROUP]->(g:Group {id: 100}) WHERE w.title = 'Implement login page' RETURN g, count(w) AS n
    missing_frontends:
      json: The source scenario supplies only GQL.
    logical:
      expect: ["(Filter w.title = 'Implement login page' (_))"]
    physical:
      clickhouse: {}

  - name: Code entities keep text filters on ungrouped aggregation nodes
    query:
      gql: |
        MATCH (d:Definition) WHERE d.project_id = 1000 AND d.fqn STARTS WITH 'src' RETURN count(d) AS n
    missing_frontends:
      json: The source scenario supplies only GQL.
    logical:
      expect: ["(Filter starts_with(d.fqn, 'src'), ... (_))"]
    physical:
      clickhouse: {}

  - name: Group and project text filters pass validation on ungrouped aggregation nodes
    query:
      gql: |
        MATCH (g:Group)-[:CONTAINS]->(p:Project)<-[:IN_PROJECT]-(mr:MergeRequest) WHERE g.full_path STARTS WITH 'public' AND p.name CONTAINS 'Project' RETURN count(mr) AS n
    missing_frontends:
      json: The source scenario supplies only GQL.
    logical:
      expect:
        - "(Filter starts_with(g.full_path, 'public') (_))"
        - "(Filter contains(p.name, 'Project') (_))"

    physical:
      clickhouse: {}

  - name: A User neighbors query is not blocked by the User aggregation guard
    query:
      json: |
        {"query_type": "neighbors", "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}], "neighbors": {"direction": "outgoing", "rel_types": ["MEMBER_OF"]}, "limit": 10}
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF]->(n) RETURN u, n LIMIT 10
    logical:
      expect: ["(Input neighbors (...))"]
    physical:
      clickhouse: {}

  - name: Sorting by a known property passes validation
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1],"columns":["username"]}],"limit":10,"order_by":"u.username"}
      gql: |
        MATCH (u:User {id: 1}) RETURN u.username ORDER BY u.username LIMIT 10
    logical:
      expect: ["(Limit 10 (Sort u.username (_)))"]
    physical:
      clickhouse: {}

  - name: Counting a known property passes validation
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1],"columns":["name"]}],"aggregations":[{"count":"p.name","as":"name_count"}],"limit":10}
      gql: |
        MATCH (p:Project {id: 1}) RETURN count(p.name) AS name_count LIMIT 10
    logical:
      expect: ["(Aggregate COUNT(p.name) AS name_count (_))"]
    physical:
      clickhouse: {}

  - name: CALLS accepts an ImportedSymbol target
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"caller","entity":"Definition","node_ids":[1],"columns":["name"]},{"id":"sym","entity":"ImportedSymbol","columns":["identifier_name"]}],"relationships":[{"type":"CALLS","from":"caller","to":"sym"}],"limit":10}
      gql: |
        MATCH (caller:Definition {id: 1})-[:CALLS]->(sym:ImportedSymbol) RETURN caller.name, sym.identifier_name LIMIT 10
    security:
      admin: true
    logical:
      expect: ["(EdgeScan CALLS caller->sym AS e0)"]
    physical:
      clickhouse: {}

  - name: A CALLS aggregation grouped by the callee passes validation
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"caller","entity":"Definition","node_ids":[1]},{"id":"callee","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"caller","to":"callee"}],"group_by":["callee"],"aggregations":[{"count":"caller","as":"callers"}],"limit":1}
      gql: |
        MATCH (caller:Definition {id: 1})-[:CALLS]->(callee:Definition) RETURN callee, count(caller) AS callers LIMIT 1
    security:
      admin: true
    logical:
      expect: ["(Aggregate group callee AS callee, COUNT(caller) AS callers (_))"]
    physical:
      clickhouse: {}
