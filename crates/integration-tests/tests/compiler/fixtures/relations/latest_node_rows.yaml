cases:
  - name: A filtered traversal reads the latest node rows with FINAL
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"state":"merged"}}],"limit":10}
      gql: |
        MATCH (mr:MergeRequest {state: 'merged'}) RETURN mr LIMIT 10
    logical:
      expect: ["(Filter mr.state = 'merged' (NodeScan MergeRequest AS mr))"]
    physical:
      clickhouse:
        final_ast:
          expect: ["(Deduplicate Final (Scan Table(gl_merge_request) AS mr))"]

  - name: A filtered aggregation input reads the latest node rows with FINAL
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"state":"merged"}},{"id":"p","entity":"Project"}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"}],"group_by":["p"],"aggregations":[{"count":"mr","as":"merged_mrs"}],"limit":10}
      gql: |
        MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project) RETURN p, count(mr) AS merged_mrs LIMIT 10
    logical:
      expect: ["(Aggregate group p AS p, COUNT(mr) AS merged_mrs (_))"]
    physical:
      clickhouse:
        final_ast:
          expect: ["(Deduplicate Final (Scan Table(gl_merge_request) AS mr))"]

  - name: A filtered path-finding endpoint reads the latest node rows with FINAL
    query:
      json: |
        {"query_type":"path_finding","nodes":[{"id":"start","entity":"User","filters":{"username":"root"}},{"id":"end","entity":"Project","node_ids":[100]}],"path":{"type":"shortest","from":"start","to":"end","max_depth":2,"rel_types":["MEMBER_OF","CONTAINS"]},"limit":10}
      gql: |
        MATCH p = ANY SHORTEST (start:User {username: 'root'})-[:MEMBER_OF|CONTAINS*1..2]->(`end`:Project {id: 100}) RETURN p LIMIT 10
    logical:
      expect: ["(Filter start.username = 'root' (NodeScan User AS start))"]
    physical:
      clickhouse:
        final_ast:
          expect: ["(Deduplicate Final (Scan Table(gl_user) AS start))"]

  - name: A filtered neighbors center reads the latest node rows with FINAL
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"title":{"contains":"fix"}}}],"neighbors":{"direction":"both"},"limit":10}
      gql: |
        MATCH (mr:MergeRequest)-[r]-(m) WHERE mr.title CONTAINS 'fix' RETURN mr, r, m LIMIT 10
    logical:
      expect: ["(Filter contains(mr.title, 'fix') (NodeScan MergeRequest AS mr))"]
    physical:
      clickhouse:
        final_ast:
          expect: ["(Deduplicate Final (Scan Table(gl_merge_request) AS mr))"]
