cases:
  - name: Rendered traversal SQL inlines filter and relationship values
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User"},{"id":"mr","entity":"MergeRequest","filters":{"state":"opened"}}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr"}],"limit":10}
      gql: |
        MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest {state: 'opened'}) RETURN mr, u LIMIT 10
    physical:
      clickhouse:
        sql:
          contains: ["mr.state = 'opened'", "'AUTHORED'"]
          not_contains: ["{p"]
        parameterized_sql:
          contains: ["mr.state = {p"]
          not_contains: [opened]
        params: [{ value: "1/", data_type: String }, { value: "opened", data_type: String }, { value: false, data_type: Bool }, { value: 1, data_type: Int64 }, { value: 190650, data_type: Int64 }, { value: " [truncated]", data_type: String }, { value: "", data_type: String }, { value: "AUTHORED", data_type: String }, { value: "User", data_type: String }, { value: "MergeRequest", data_type: String }]

  - name: Rendered SQL inlines an IN filter array
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"user_type":{"in":["project_bot","service_account"]}}}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.user_type IN ['project_bot', 'service_account'] RETURN u LIMIT 10
    physical:
      clickhouse:
        sql:
          contains: ["u.user_type IN ['project_bot', 'service_account']"]
          not_contains: ["{p"]

  - name: Rendered SQL inlines pinned node IDs
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[100,200,300]}],"limit":10}
      gql: |
        MATCH (u:User) WHERE u.id IN [100, 200, 300] RETURN u LIMIT 10
    physical:
      clickhouse:
        sql:
          contains: ["u.id IN [100, 200, 300]"]
          not_contains: ["{p"]

  - name: Rendered SQL keeps a boolean filter value
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"n","entity":"Note","columns":["confidential"],"filters":{"confidential":true}}],"limit":5}
      gql: |
        MATCH (n:Note {confidential: true}) RETURN n.confidential LIMIT 5
    logical:
      expect: ["(Filter n.confidential = true (NodeScan Note AS n))"]
    physical:
      clickhouse:
        sql:
          contains: ["n.confidential = true"]

  - name: Rendered SQL keeps range, list, and substring filter values
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","columns":["username","state","created_at"],"filters":{"created_at":{"gte":"2024-01-01"},"state":{"in":["active","blocked"]},"username":{"contains":"admin"}}}],"limit":30}
      gql: |
        MATCH (u:User) WHERE u.created_at >= '2024-01-01' AND u.state IN ['active', 'blocked'] AND u.username CONTAINS 'admin' RETURN u.username, u.state, u.created_at LIMIT 30
    physical:
      clickhouse:
        sql:
          contains: ["u.created_at >= ", "u.state IN ['active', 'blocked']", "multiSearchAny(lower(u.username), [lower('admin')])", "_deleted", "LIMIT 1 BY"]
          not_contains: ["{p"]
