cases:
  - name: A wildcard search leaves virtual properties out of the SQL
    query:
      gql: |
        MATCH (f:File {id: 1}) RETURN properties(f) LIMIT 5
    physical:
      clickhouse:
        sql:
          contains: [AS f_name]
          not_contains: [f_content, f.content]

  - name: A search without virtual properties has no hydration plan
    query:
      gql: |
        MATCH (f:File {id: 1}) RETURN f.id, f.name, f.path LIMIT 5
    physical:
      clickhouse:
        hydration: none

  - name: A traversal leaves a virtual property out of the SQL and hydrates it
    query:
      gql: |
        MATCH (f:File {id: 1})-[:ON_BRANCH]->(b:Branch) RETURN f.id, f.name, f.content, b.id, b.name LIMIT 5
    physical:
      clickhouse:
        sql:
          not_contains: [f_content, f.content]
        hydration:
          static:
            $exact:
              f:
                entity_type: File
                virtual_columns: [{ column_name: content, service: gitaly, lookup: blob_content }]
                columns: [id, name, project_id, commit_sha, branch, path]
              b: { entity_type: Branch, columns: [id, name] }

  - name: A merge request diff stays out of the SQL and is hydrated
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 1}) RETURN mr.id, mr.title, mr.diff LIMIT 5
    physical:
      clickhouse:
        sql:
          not_contains: [mr_diff, mr.diff]
        hydration:
          static:
            $exact:
              mr:
                entity_type: MergeRequest
                virtual_columns: [{ column_name: diff, service: gitaly, lookup: mr_raw_patch }]
                columns: [project_id, iid]
                injected_columns: [project_id, iid]

  - name: A search hydrates a selected virtual property and injects its dependencies
    query:
      gql: |
        MATCH (f:File {id: 1}) RETURN f.id, f.name, f.content LIMIT 5
    physical:
      clickhouse:
        hydration:
          static:
            $exact:
              f:
                entity_type: File
                virtual_columns: [{ column_name: content, service: gitaly, lookup: blob_content }]
                columns: [project_id, commit_sha, branch, path]
                injected_columns: [project_id, commit_sha, branch, path]

  - name: A traversal injects the dependencies of a virtual property on the unpinned node
    query:
      gql: |
        MATCH (f:File)-[:ON_BRANCH]->(b:Branch {id: 1}) RETURN f.id, f.content, b.id, b.name LIMIT 5
    physical:
      clickhouse:
        hydration:
          static:
            $exact:
              f:
                columns: [id, project_id, commit_sha, branch, path]
                injected_columns: [project_id, commit_sha, branch, path]
              b: { entity_type: Branch, columns: [id, name] }

  - name: A definition and its file each hydrate their own content
    query:
      gql: |
        MATCH (f:File {id: 1})-[:DEFINES]->(def:Definition) RETURN f.id, f.path, f.content, def.id, def.name, def.content LIMIT 5
    physical:
      clickhouse:
        hydration:
          static:
            $exact:
              f:
                virtual_columns: [{ column_name: content, service: gitaly, lookup: blob_content }]
              def:
                entity_type: Definition
                virtual_columns: [{ column_name: content, service: gitaly, lookup: blob_content }]
                columns: [id, name, project_id, commit_sha, branch, file_path, start_byte, end_byte]

  - name: A virtual property filter stays out of the SQL and filters after hydration
    query:
      gql: |
        MATCH (f:File {id: 1}) WHERE f.content = 'x' RETURN f.path, f.content LIMIT 5
    physical:
      clickhouse:
        sql:
          not_contains: [content]
        hydration:
          static:
            $exact:
              f:
                virtual_filters: { content: { op: eq, value: x } }
                filter_injected_columns: []

  - name: An inline GQL property on a virtual property hydrates an equality filter
    query:
      gql: |
        MATCH (f:File {id: 1, content: 'abc'}) RETURN f
    physical:
      clickhouse:
        hydration:
          static:
            $exact:
              f:
                virtual_filters: { content: { op: eq, value: abc } }

  - name: A filter on an unselected virtual property resolves it only for the filter
    query:
      gql: |
        MATCH (f:File) WHERE f.id IN [1, 2] AND f.content CONTAINS 'needle' AND f.project_id = 1000 RETURN f.project_id, f.path LIMIT 10
    physical:
      clickhouse:
        hydration:
          static:
            $exact:
              f:
                virtual_columns: [{ column_name: content, service: gitaly, lookup: blob_content }]
                virtual_filters: { content: { op: contains, value: needle } }
                filter_injected_columns: [content]

  - name: A filter on a selected virtual property resolves it once and keeps it
    query:
      gql: |
        MATCH (f:File {id: 1}) WHERE f.content CONTAINS 'needle' RETURN f.path, f.content LIMIT 5
    physical:
      clickhouse:
        hydration:
          static:
            $exact:
              f:
                virtual_columns: [{ column_name: content, service: gitaly, lookup: blob_content }]
                filter_injected_columns: []
