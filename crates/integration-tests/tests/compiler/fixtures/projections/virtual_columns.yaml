cases:
  - name: A wildcard search leaves virtual properties out of the SQL
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"f","entity":"File","node_ids":[1],"columns":"*"}],"limit":5}
      gql: |
        MATCH (f:File {id: 1}) RETURN properties(f) LIMIT 5
    physical:
      clickhouse:
        sql:
          contains: [AS f_name]
          not_contains: [f_content, f.content]

  - name: A search without virtual properties has no hydration plan
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"f","entity":"File","node_ids":[1],"columns":["id","name","path"]}],"limit":5}
      gql: |
        MATCH (f:File {id: 1}) RETURN f.id, f.name, f.path LIMIT 5
    physical:
      clickhouse:
        hydration: none

  - name: A wildcard aggregation leaves virtual properties out of the SQL
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"f","entity":"File","node_ids":[1],"columns":"*"}],"aggregations":[{"count":"f","as":"total"}],"limit":5}
    missing_frontends:
      gql: GQL cannot project all properties of a node in an aggregation without grouping by it.
    physical:
      clickhouse:
        sql:
          not_contains: [f_content, f.content]

  - name: A traversal leaves a virtual property out of the SQL and hydrates it
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"f","entity":"File","node_ids":[1],"columns":["id","name","content"]},{"id":"b","entity":"Branch","columns":["id","name"]}],"relationships":[{"type":"ON_BRANCH","from":"f","to":"b"}],"limit":5}
      gql: |
        MATCH (f:File {id: 1})-[:ON_BRANCH]->(b:Branch) RETURN f.id, f.name, f.content, b.id, b.name LIMIT 5
    physical:
      clickhouse:
        sql:
          not_contains: [f_content, f.content]
        hydration: static

  - name: A merge request diff stays out of the SQL and is hydrated
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[1],"columns":["id","title","diff"]}],"limit":5}
      gql: |
        MATCH (mr:MergeRequest {id: 1}) RETURN mr.id, mr.title, mr.diff LIMIT 5
    physical:
      clickhouse:
        sql:
          not_contains: [mr_diff, mr.diff]
        hydration: static
