ontology_overlay: local_dates

cases:
  - name: A minute bucket renders DuckDB date_trunc
    query:
      gql: |
        MATCH (d:Definition {id: 1}) RETURN date_trunc('minute', d.created_at) AS bucket, count(d) AS n LIMIT 10
    physical:
      duckdb:
        duckdb_codegen:
          output:
            sql: { contains: ["date_trunc('minute', d.created_at)"], not_contains: [toStartOf] }

  - name: A hour bucket renders DuckDB date_trunc
    query:
      gql: |
        MATCH (d:Definition {id: 1}) RETURN date_trunc('hour', d.created_at) AS bucket, count(d) AS n LIMIT 10
    physical:
      duckdb:
        duckdb_codegen:
          output:
            sql: { contains: ["date_trunc('hour', d.created_at)"], not_contains: [toStartOf] }

  - name: A day bucket renders DuckDB date_trunc
    query:
      gql: |
        MATCH (d:Definition {id: 1}) RETURN date_trunc('day', d.created_at) AS bucket, count(d) AS n LIMIT 10
    physical:
      duckdb:
        duckdb_codegen:
          output:
            sql: { contains: ["date_trunc('day', d.created_at)"], not_contains: [toStartOf] }

  - name: A week bucket renders DuckDB date_trunc shifted to start on Sunday
    query:
      gql: |
        MATCH (d:Definition {id: 1}) RETURN date_trunc('week', d.created_at) AS bucket, count(d) AS n LIMIT 10
    physical:
      duckdb:
        duckdb_codegen:
          output:
            sql: { contains: ["date_trunc('week', d.created_at + INTERVAL 1 DAY) - INTERVAL 1 DAY"], not_contains: [toStartOf] }

  - name: A month bucket renders DuckDB date_trunc
    query:
      gql: |
        MATCH (d:Definition {id: 1}) RETURN date_trunc('month', d.created_at) AS bucket, count(d) AS n LIMIT 10
    physical:
      duckdb:
        duckdb_codegen:
          output:
            sql: { contains: ["date_trunc('month', d.created_at)"], not_contains: [toStartOf] }

  - name: A quarter bucket renders DuckDB date_trunc
    query:
      gql: |
        MATCH (d:Definition {id: 1}) RETURN date_trunc('quarter', d.created_at) AS bucket, count(d) AS n LIMIT 10
    physical:
      duckdb:
        duckdb_codegen:
          output:
            sql: { contains: ["date_trunc('quarter', d.created_at)"], not_contains: [toStartOf] }

  - name: A year bucket renders DuckDB date_trunc
    query:
      gql: |
        MATCH (d:Definition {id: 1}) RETURN date_trunc('year', d.created_at) AS bucket, count(d) AS n LIMIT 10
    physical:
      duckdb:
        duckdb_codegen:
          output:
            sql: { contains: ["date_trunc('year', d.created_at)"], not_contains: [toStartOf] }
