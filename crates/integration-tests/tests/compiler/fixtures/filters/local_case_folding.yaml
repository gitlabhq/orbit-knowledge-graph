cases:
  - name: Local contains folds case on both sides
    query:
      gql: |
        MATCH (f:File) WHERE f.path CONTAINS 'ALI' RETURN f LIMIT 10
    logical:
      expect: ["(Filter contains(f.path, 'ALI') (NodeScan File AS f))"]
    physical:
      duckdb:
        emitted:
          expect: ["(Filter Contains(Lower(f.path), Lower('ALI')), ... (_))"]

  - name: Local starts_with folds case on both sides
    query:
      gql: |
        MATCH (f:File) WHERE f.path STARTS WITH 'ALI' RETURN f LIMIT 10
    logical:
      expect: ["(Filter starts_with(f.path, 'ALI') (NodeScan File AS f))"]
    physical:
      duckdb:
        emitted:
          expect: ["(Filter StartsWith(Lower(f.path), Lower('ALI')), ... (_))"]

  - name: Local ends_with folds case on both sides
    query:
      gql: |
        MATCH (f:File) WHERE f.path ENDS WITH 'ALI' RETURN f LIMIT 10
    logical:
      expect: ["(Filter ends_with(f.path, 'ALI') (NodeScan File AS f))"]
    physical:
      duckdb:
        emitted:
          expect: ["(Filter EndsWith(Lower(f.path), Lower('ALI')), ... (_))"]
