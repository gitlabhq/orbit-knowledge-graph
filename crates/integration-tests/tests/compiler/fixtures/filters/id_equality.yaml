logical:
  exact: |
    (Limit 30
      (Input traversal
        (Project w.id, w.iid, w.title, w.state, w.work_item_type
          (Filter w.id IN [7]
            (NodeScan WorkItem AS w)))
        (Project n.note
          (NodeScan Note AS n))
        (EdgeScan HAS_NOTE w->n AS e0)))

physical:
  clickhouse:
    planned:
      expect: ["(Filter _orbit_edge_0.relationship_kind = 'HAS_NOTE', _orbit_edge_0.source_kind = 'WorkItem', _orbit_edge_0.target_kind = 'Note', _orbit_edge_0.source_id = 7 (Scan Table(gl_edge) AS _orbit_edge_0))"]

cases:
  - name: An id equality filter compiles like a pinned id
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"w","entity":"WorkItem","filters":{"id":7}},{"id":"n","entity":"Note","columns":["note"]}],"relationships":[{"type":"HAS_NOTE","from":"w","to":"n"}],"limit":30}
      gql: |
        MATCH (w:WorkItem)-[:HAS_NOTE]->(n:Note) WHERE w.id = 7 RETURN n.note

  - name: A pinned id
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"w","entity":"WorkItem","node_ids":[7]},{"id":"n","entity":"Note","columns":["note"]}],"relationships":[{"type":"HAS_NOTE","from":"w","to":"n"}],"limit":30}
      gql: |
        MATCH (w:WorkItem {id: 7})-[:HAS_NOTE]->(n:Note) RETURN n.note
