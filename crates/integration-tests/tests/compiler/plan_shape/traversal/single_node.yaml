name: "Single node traversal scans with FINAL and projects the node columns"
input: {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"state":"merged"}}],"limit":10}
logical:
  expect:
    - (Limit 11 (Project mr.id AS mr_id, ..., mr.title AS mr_title, ... (Filter mr.state Eq 'merged' AND mr._deleted = false (NodeScan MergeRequest AS mr))))
physical:
  clickhouse:
    expect:
      - (Deduplicate Final mr.id (Scan Table(gl_merge_request) AS mr))
  duckdb:
    expect:
      - (Scan Table() AS mr)
    reject:
      - (Deduplicate ...)
