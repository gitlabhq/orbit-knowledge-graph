name: "Both directions with a center filter: each arm joins the center table"
input: {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"title":{"contains":"fix"}}}],"neighbors":{"direction":"both"},"limit":20}
logical:
  expect:
    - (Union (Project ... (Join e2.source_id = mr.id (...))) (Project ... (Join e4.target_id = mr.id (...))))
physical:
  clickhouse:
    expect:
      - (Union (Project ... (Join ON e2.source_id = mr.id (...))) (Project ... (Join ON e4.target_id = mr.id (...))))
      - (Deduplicate Final mr.id (Scan Table(gl_merge_request) AS mr))
