name: "Neighbors both directions: union of an outgoing and an incoming arm"
input: {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[1]}],"neighbors":{"direction":"both"},"limit":20}
logical:
  expect:
    - (Union (Project ..., 1 AS _gkg_neighbor_is_outgoing, ... (_)) (Project ..., 0 AS _gkg_neighbor_is_outgoing, ... (_)))
physical:
  clickhouse:
    expect:
      - (FusedNeighbors Both (Scan EdgeTables(gl_ci_edge|gl_diff_edge|gl_edge) AS e2))
    reject:
      - (Union (Project ..., 1 AS _gkg_neighbor_is_outgoing, ... (_)) (Project ..., 0 AS _gkg_neighbor_is_outgoing, ... (_)))
  duckdb:
    expect:
      - (Union (Project ..., 1 AS _gkg_neighbor_is_outgoing, ... (_)) (Project ..., 0 AS _gkg_neighbor_is_outgoing, ... (_)))
