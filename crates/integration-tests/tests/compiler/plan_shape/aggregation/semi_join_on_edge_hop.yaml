name: "Filtered unread node on an edge hop is a semi-join on the edge column"
# The IN_PROJECT hop is FK-backed but the chain is mixed, so both hops stay
# edge scans (FK elision is all-or-nothing per chain).
input: {"query_type":"aggregation","nodes":[{"id":"n","entity":"Note"},{"id":"p","entity":"Project"},{"id":"g","entity":"Group","filters":{"name":"gitlab-org"}}],"relationships":[{"type":"IN_PROJECT","from":"n","to":"p"},{"type":"CONTAINS","from":"g","to":"p"}],"group_by":["p"],"aggregations":[{"count":"n","as":"note_count"}],"limit":10}
logical:
  expect:
    - (SemiJoin e1.source_id = g.id (...))
physical:
  clickhouse:
    expect:
      - (SemiJoin e1.source_id = g.id (...))
      - (Deduplicate Final (Scan EdgeTables(gl_edge) AS e0))
      - (Deduplicate Final (Scan EdgeTables(gl_edge) AS e1))
skip: true
