name: "Group by a property; the pinned FK target becomes a predicate on the FK column"
input: {"query_type":"aggregation","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"state":"merged"}},{"id":"p","entity":"Project","node_ids":[1]}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"}],"group_by":["mr.state"],"aggregations":[{"count":"mr","as":"n"}],"limit":10}
logical:
  expect:
    - (Aggregate group mr.state AS mr_state, COUNT() AS n (...))
physical:
  clickhouse:
    expect:
      - (Filter mr.project_id = 1 (Filter mr.state Eq 'merged' AND mr._deleted = false (Deduplicate Final mr.id (Scan Table(gl_merge_request) AS mr))))
    reject:
      - (Scan EdgeTables(...))
