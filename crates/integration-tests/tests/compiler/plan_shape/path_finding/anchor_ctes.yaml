name: "Filtered endpoints become _nf_ anchor CTEs the first hop is semi-joined against, plus a scope CTE"
input: {"query_type":"path_finding","nodes":[{"id":"start","entity":"MergeRequest","node_ids":[1]},{"id":"end","entity":"Project","node_ids":[100]}],"path":{"type":"shortest","from":"start","to":"end","max_depth":2,"rel_types":["IN_PROJECT","CONTAINS"]},"limit":10}
logical:
  expect:
    - (Union (Project ..., 1 AS depth (...)) (Project ..., 2 AS depth (...)))
    - (NodeScan MergeRequest AS start)
physical:
  clickhouse:
    expect:
      - (PathFinding max_depth=2 forward=1 backward=1 scoped=true (...))
      - (Scan EdgeTables(gl_edge) AS e1)
      - (Deduplicate Final start.id (Scan Table(gl_merge_request) AS start))
