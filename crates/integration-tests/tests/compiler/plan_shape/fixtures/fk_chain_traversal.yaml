name: FK-chain traversal preserves node outputs and stored edge orientation
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User", "filters": {"username": "alice"}, "columns": ["id"]},
        {"id": "mr", "entity": "MergeRequest", "filters": {"state": "merged"}, "columns": ["id"]},
        {"id": "pipe", "entity": "Pipeline", "columns": ["id"]},
        {"id": "j", "entity": "Job", "filters": {"status": "failed"}, "columns": ["id"]}
      ],
      "relationships": [
        {"type": "AUTHORED", "from": "u", "to": "mr"},
        {"type": "HAS_HEAD_PIPELINE", "from": "mr", "to": "pipe"},
        {"type": "HAS_JOB", "from": "pipe", "to": "j"}
      ]
    }
  gql: |
    MATCH (u:User {username: 'alice'})-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})
      -[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)-[:HAS_JOB]->(j:Job {status: 'failed'})
    RETURN u.id, mr.id, pipe.id, j.id
logical:
  expect:
    - (Relationship u mr Outgoing (Kinds AUTHORED) (Hops 1 1) (Filters))
physical:
  clickhouse:
    expect:
      - (Strategy (FkChain (SourceFragment (Outputs ...) (Join ...))))
      - (Output e0_src (Column u id))
      - (Output e0_dst (Column mr id))
      - (Output e2_src (Column pipe id))
      - (Output e2_dst (Column j id))
      - (Scope u (Filter _ (Read gl_user u Final)))
      - (Scope j (Filter _ (Read gl_job j Final)))
    reject:
      - (Scan gl_edge ...)
      - (Scan gl_ci_edge ...)
