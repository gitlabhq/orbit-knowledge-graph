- name: 'Migrated SQL assertion 1: fk_filter_only_target / top'
  query:
    json: |
      {
        "query_type": "aggregation",
        "nodes": [
          {"id": "mr", "entity": "MergeRequest"},
          {"id": "p", "entity": "Project", "filters": {"name": "Public Project"}}
        ],
        "relationships": [{"type": "IN_PROJECT", "from": "mr", "to": "p"}],
        "aggregations": [{"count": "mr", "as": "c"}],
        "limit": 10
      }
    gql: |
      MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {name: 'Public Project'})
      RETURN count(mr) AS c LIMIT 10
  security:
    admin: false
    paths:
    - 1/
  physical:
    clickhouse:
      sql:
        contains:
        - _filter_p
        - mr.project_id IN
        not_contains:
        - gl_edge
