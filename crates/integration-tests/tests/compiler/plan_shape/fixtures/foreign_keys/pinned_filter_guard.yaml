name: Additional filters prevent pinned FK target elimination

query:
  gql: |
    MATCH (v:User {id: 2})-[:APPROVED]->(mr:MergeRequest)<-[:AUTHORED]-(u:User {id: 1, username: 'nonexistent'})
    RETURN v, mr, u

logical:
  expect:
    - (Filter u.id IN [1], u.username = 'nonexistent' (NodeScan User AS u))

physical:
  clickhouse:
    planned:
      expect:
        - (CTE _filter_u (Project u.id AS id (_)))
        - (Filter _orbit_edge_1.source_id IN _filter_u.id, ... (_))
      reject:
        - (Filter mr.author_id = 1, ... (_))
