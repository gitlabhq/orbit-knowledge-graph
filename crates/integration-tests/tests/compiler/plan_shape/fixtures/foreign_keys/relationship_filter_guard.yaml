name: Relationship filters remain on stored edges

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr","filters":{"source_id":999999}}]}
  gql: |
    MATCH (u:User {id: 1})-[r:AUTHORED]->(mr:MergeRequest)
    WHERE r.source_id = 999999 RETURN u, mr

logical:
  expect:
    - (EdgeScan AUTHORED u->mr AS e0 ...)

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_edge_0.source_id = 999999, ... (_))
