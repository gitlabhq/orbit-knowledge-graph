name: A pinned FK target becomes a holder predicate after the first edge

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: 1000}) RETURN count(mr) AS n

logical:
  expect: ["(EdgeScan IN_PROJECT mr->p AS e1)"]

physical:
  clickhouse:
    planned:
      expect: ["(Filter mr.project_id = 1000, ... (_))"]
      reject: ["(Scan Table(gl_project) ...)", "(Scan Table(gl_edge) ...)"]
    emitted:
      expect: ["(Filter mr.project_id = 1000, ... (_))"]
      reject: ["(Scan Table(gl_project) ...)", "(Scan Table(gl_edge) ...)"]
