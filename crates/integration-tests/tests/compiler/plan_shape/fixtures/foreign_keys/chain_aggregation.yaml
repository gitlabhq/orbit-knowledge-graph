name: A target-held foreign key chain joins node rows in stored orientation

query:
  gql: |
    MATCH (pl:Pipeline {status: 'failed', source: 'merge_request_event'})<-[:TRIGGERED]-(mr:MergeRequest)
      -[:HAS_LATEST_DIFF]->(d:MergeRequestDiff)-[:HAS_FILE]->(f:MergeRequestDiffFile)
    RETURN f.old_path, count(f) AS appearances LIMIT 60

logical:
  expect:
    - (Aggregate group f.old_path AS f_old_path, COUNT(f) AS appearances (_))

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON mr.id = pl.merge_request_id (_) (_))
        - (Join ON f.merge_request_diff_id = mr.latest_merge_request_diff_id (_) (_))
        - (Filter pl.source = 'merge_request_event', pl.status = 'failed', ... (Deduplicate Final (Scan Table(gl_pipeline) AS pl)))
        - (Filter d.id IN ?.id (Scan Table(gl_merge_request_diff) AS d))
      reject:
        - (Scan Table(gl_edge) ...)
        - (Scan Table(gl_ci_edge) ...)
        - (Scan Table(gl_diff_edge) ...)
    emitted:
      expect:
        - (Join ON mr.id = pl.merge_request_id (_) (_))
        - (Aggregate group f.old_path, ... (_))
      reject:
        - (Scan Table(gl_edge) ...)
        - (Scan Table(gl_ci_edge) ...)
