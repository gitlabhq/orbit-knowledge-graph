cases:
  - name: A work item note hop reads issue notes by their noteable key instead of edges
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "w", "entity": "WorkItem", "columns": ["id"]},
            {"id": "n", "entity": "Note", "filters": {"internal": true}, "columns": ["id"]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "w", "to": "n"}]
        }
      gql: |
        MATCH (w:WorkItem)-[:HAS_NOTE]->(n:Note {internal: true})
        RETURN w.id, n.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE w->n AS e0)
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
            - (Scan Table(gl_note) AS n)
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A merge request note hop reads merge request notes by their noteable key
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "mr", "entity": "MergeRequest", "node_ids": [2000], "columns": ["id"]},
            {"id": "n", "entity": "Note", "columns": ["id"]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "mr", "to": "n"}]
        }
      gql: |
        MATCH (mr:MergeRequest {id: 2000})-[:HAS_NOTE]->(n:Note)
        RETURN mr.id, n.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE mr->n AS e0)
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['MergeRequest'] (_))
            - (Scan Table(gl_note) AS n)
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A vulnerability note count reads vulnerability notes by their noteable key
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "v", "entity": "Vulnerability", "filters": {"severity": "critical"}},
            {"id": "n", "entity": "Note"}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "v", "to": "n"}],
          "aggregations": [{"count": "n", "as": "c"}]
        }
      gql: |
        MATCH (v:Vulnerability {severity: 'critical'})-[:HAS_NOTE]->(n:Note)
        RETURN count(n) AS c
    logical:
      expect:
        - (Aggregate COUNT(n) AS c (_))
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Vulnerability'] (_))
            - (Scan Table(gl_vulnerability) AS v)
          reject:
            - (Scan Table(gl_edge) ...)

  - name: An earlier note read joins the work item hop only through issue notes
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "p", "entity": "Project", "node_ids": [1000], "columns": ["id"]},
            {"id": "n", "entity": "Note", "columns": ["id"]},
            {"id": "w", "entity": "WorkItem", "columns": ["id"]}
          ],
          "relationships": [
            {"type": "IN_PROJECT", "from": "n", "to": "p"},
            {"type": "HAS_NOTE", "from": "w", "to": "n"}
          ]
        }
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(n:Note)<-[:HAS_NOTE]-(w:WorkItem)
        RETURN p.id, n.id, w.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE w->n AS e1)
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A note hop that returns type(r) reads the relationship from issue note keys
    query:
      gql: |
        MATCH (w:WorkItem {id: 100})-[r:HAS_NOTE]->(n:Note)
        RETURN w.id, n.id, type(r)
    missing_frontends: { json: The JSON frontend cannot return type(r). }
    logical:
      expect: ["(EdgeScan HAS_NOTE w->n AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
            - (Project ..., n.noteable_id AS e0_src (_))
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A wildcard hop narrowed by type(r) reads issue notes by their noteable key
    query:
      gql: |
        MATCH (w:WorkItem)-[r]->(n:Note {internal: true})
        WHERE type(r) = 'HAS_NOTE'
        RETURN w.id, n.id
    missing_frontends: { json: The JSON frontend has no type(r) predicate. }
    logical:
      expect: ["(EdgeScan ...)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A variable-length note hop keeps the stored edge
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"w","entity":"WorkItem","node_ids":[100]},{"id":"n","entity":"Note"}],"relationships":[{"type":"HAS_NOTE","from":"w","to":"n","hops":[1,2]}]}
      gql: |
        MATCH (w:WorkItem {id: 100})-[:HAS_NOTE*1..2]->(n:Note) RETURN w, n
    logical:
      expect: ["(EdgeScan HAS_NOTE w->n AS e0 HOPS 1..2)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_edge) ...)
          reject:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))

  - name: An undirected note hop keeps the stored edge
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"w","entity":"WorkItem","node_ids":[100]},{"id":"n","entity":"Note"}],"relationships":[{"type":"HAS_NOTE","from":"w","to":"n","direction":"both"}]}
    missing_frontends: { gql: GQL accepts undirected hops only in neighbors queries. }
    logical:
      expect: ["(EdgeScan ...)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_edge) ...)
          reject:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))

  - name: A note hop that returns its relationship reads it from issue note keys
    query:
      gql: |
        MATCH (w:WorkItem {id: 100})-[r:HAS_NOTE]->(n:Note)
        RETURN w, r, n
    missing_frontends: { json: The JSON frontend has no relationship return. }
    logical:
      expect: ["(EdgeScan HAS_NOTE w->n AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
            - (Project ..., n.noteable_id AS e0_src (_))
          reject:
            - (Scan Table(gl_edge) ...)
