cases:
  - name: A selective note filter drives a work item note hop through issue note keys
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "w", "entity": "WorkItem", "columns": ["id"]},
            {"id": "n", "entity": "Note", "filters": {"note": {"contains": "pipeline"}}, "columns": ["id"]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "w", "to": "n"}]
        }
      gql: |
        MATCH (w:WorkItem)-[:HAS_NOTE]->(n:Note)
        WHERE n.note CONTAINS 'pipeline'
        RETURN w.id, n.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE w->n AS e0)
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
            - (Scan Table(gl_note) AS n)
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A selective note filter keeps the key route when the merge request is pinned too
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "mr", "entity": "MergeRequest", "node_ids": [2000], "columns": ["id"]},
            {"id": "n", "entity": "Note", "filters": {"note": {"contains": "pipeline"}}, "columns": ["id"]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "mr", "to": "n"}]
        }
      gql: |
        MATCH (mr:MergeRequest {id: 2000})-[:HAS_NOTE]->(n:Note)
        WHERE n.note CONTAINS 'pipeline'
        RETURN mr.id, n.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE mr->n AS e0)
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['MergeRequest'] (_))
            - (Scan Table(gl_note) AS n)
          reject:
            - (Scan Table(gl_edge) ...)

  - name: Pinned notes drive a vulnerability note count through vulnerability note keys
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "v", "entity": "Vulnerability"},
            {"id": "n", "entity": "Note", "node_ids": [3000, 3001]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "v", "to": "n"}],
          "aggregations": [{"count": "v", "as": "c"}]
        }
      gql: |
        MATCH (v:Vulnerability)-[:HAS_NOTE]->(n:Note)
        WHERE n.id IN [3000, 3001]
        RETURN count(v) AS c
    logical:
      expect:
        - (Aggregate COUNT(v) AS c (_))
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Vulnerability'] (_))
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A note reached through an earlier hop reads the work item hop from the edge table
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "p", "entity": "Project", "node_ids": [1000], "columns": ["id"]},
            {"id": "n", "entity": "Note", "columns": ["id"]},
            {"id": "w", "entity": "WorkItem", "columns": ["id"]}
          ],
          "relationships": [
            {"type": "IN_PROJECT", "from": "n", "to": "p"},
            {"type": "HAS_NOTE", "from": "w", "to": "n"}
          ]
        }
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(n:Note)<-[:HAS_NOTE]-(w:WorkItem)
        RETURN p.id, n.id, w.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE w->n AS e1)
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_1.relationship_kind = 'HAS_NOTE', ... (_))
            - (Scan Table(gl_edge) AS _orbit_edge_1)
          reject:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))

  - name: A selectively filtered note joined through an earlier hop reads the work item hop through issue note keys
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "p", "entity": "Project", "node_ids": [1000], "columns": ["id"]},
            {"id": "n", "entity": "Note", "filters": {"note": {"contains": "pipeline"}}, "columns": ["id"]},
            {"id": "w", "entity": "WorkItem", "columns": ["id"]}
          ],
          "relationships": [
            {"type": "IN_PROJECT", "from": "n", "to": "p"},
            {"type": "HAS_NOTE", "from": "w", "to": "n"}
          ]
        }
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(n:Note)<-[:HAS_NOTE]-(w:WorkItem)
        WHERE n.note CONTAINS 'pipeline'
        RETURN p.id, n.id, w.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE w->n AS e1)
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A note-driven hop that returns its relationship reads it from issue note keys
    query:
      gql: |
        MATCH (w:WorkItem)-[r:HAS_NOTE]->(n:Note)
        WHERE n.id IN [3000, 3001]
        RETURN w, r, n
    missing_frontends: { json: The JSON frontend has no relationship return. }
    logical:
      expect: ["(EdgeScan HAS_NOTE w->n AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
            - (Project ..., n.noteable_id AS e0_src (_))
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A note-driven hop that returns type(r) reads the relationship from issue note keys
    query:
      gql: |
        MATCH (w:WorkItem)-[r:HAS_NOTE]->(n:Note)
        WHERE n.id IN [3000, 3001]
        RETURN w.id, n.id, type(r)
    missing_frontends: { json: The JSON frontend cannot return type(r). }
    logical:
      expect: ["(EdgeScan HAS_NOTE w->n AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
            - (Project ..., n.noteable_id AS e0_src (_))
          reject:
            - (Scan Table(gl_edge) ...)

  - name: A pinned merge request drives its note hop through the edge table
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "mr", "entity": "MergeRequest", "node_ids": [2000], "columns": ["id"]},
            {"id": "n", "entity": "Note", "columns": ["id"]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "mr", "to": "n"}]
        }
      gql: |
        MATCH (mr:MergeRequest {id: 2000})-[:HAS_NOTE]->(n:Note)
        RETURN mr.id, n.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE mr->n AS e0)
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ..., _orbit_edge_0.source_id = 2000 (_))
            - (Scan Table(gl_edge) AS _orbit_edge_0)
          reject:
            - (Filter ..., n.noteable_type IN ['MergeRequest'] (_))

  - name: A pinned merge request drives a note chain to authors through the edge table
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "u", "entity": "User", "columns": ["username"]},
            {"id": "n", "entity": "Note"},
            {"id": "mr", "entity": "MergeRequest", "node_ids": [2000]}
          ],
          "relationships": [
            {"type": "AUTHORED", "from": "u", "to": "n"},
            {"type": "HAS_NOTE", "from": "mr", "to": "n"}
          ],
          "group_by": ["u"],
          "aggregations": [{"count": "n", "as": "c"}]
        }
      gql: |
        MATCH (u:User)-[:AUTHORED]->(n:Note)<-[:HAS_NOTE]-(mr:MergeRequest {id: 2000})
        RETURN u{.id, .username}, count(n) AS c
    logical:
      expect: ["(Aggregate group u AS u, COUNT(n) AS c (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_edge) ...)
          reject:
            - (Filter ..., n.noteable_type IN ['MergeRequest'] (_))

  - name: A merge request reached from a project drives its note hop through the edge table
    query:
      gql: |
        MATCH (n:Note)<-[:HAS_NOTE]-(mr:MergeRequest)-[:IN_PROJECT]->(p:Project {full_path: 'group/project'})
        RETURN mr, count(n) AS note_count
    missing_frontends: { json: The JSON frontend cannot group by a returned node with a count. }
    logical:
      expect: ["(EdgeScan HAS_NOTE mr->n AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_edge) ...)
          reject:
            - (Filter ..., n.noteable_type IN ['MergeRequest'] (_))

  - name: A note hop with neither endpoint narrowed reads the edge table
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "mr", "entity": "MergeRequest", "filters": {"state": "merged"}, "columns": ["id"]},
            {"id": "n", "entity": "Note", "columns": ["id"]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "mr", "to": "n"}]
        }
      gql: |
        MATCH (mr:MergeRequest {state: 'merged'})-[:HAS_NOTE]->(n:Note)
        RETURN mr.id, n.id
    logical:
      expect:
        - (EdgeScan HAS_NOTE mr->n AS e0)
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_edge) ...)
          reject:
            - (Filter ..., n.noteable_type IN ['MergeRequest'] (_))

  - name: A wildcard note hop narrowed by type(r) with neither endpoint narrowed reads the edge table
    query:
      gql: |
        MATCH (w:WorkItem)-[r]->(n:Note {internal: true})
        WHERE type(r) = 'HAS_NOTE'
        RETURN w.id, n.id
    missing_frontends: { json: The JSON frontend has no type(r) predicate. }
    logical:
      expect: ["(EdgeScan ...)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_edge) ...)
          reject:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))

  - name: A variable-length note hop keeps the stored edge
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"w","entity":"WorkItem","node_ids":[100]},{"id":"n","entity":"Note"}],"relationships":[{"type":"HAS_NOTE","from":"w","to":"n","hops":[1,2]}]}
      gql: |
        MATCH (w:WorkItem {id: 100})-[:HAS_NOTE*1..2]->(n:Note) RETURN w, n
    logical:
      expect: ["(EdgeScan HAS_NOTE w->n AS e0 HOPS 1..2)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_edge) ...)
          reject:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))

  - name: An undirected note hop keeps the stored edge
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"w","entity":"WorkItem","node_ids":[100]},{"id":"n","entity":"Note","node_ids":[3000]}],"relationships":[{"type":"HAS_NOTE","from":"w","to":"n","direction":"both"}]}
    missing_frontends: { gql: GQL accepts undirected hops only in neighbors queries. }
    logical:
      expect: ["(EdgeScan ...)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_edge) ...)
          reject:
            - (Filter ..., n.noteable_type IN ['Issue'] (_))
