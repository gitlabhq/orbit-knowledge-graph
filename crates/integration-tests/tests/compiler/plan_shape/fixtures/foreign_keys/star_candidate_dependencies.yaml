name: FK stars plan target candidates before the narrowed center

query:
  gql: |
    MATCH (u:User {username: 'alice'})-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project) WHERE p.id IN [1000, 1001] RETURN u.username, mr.title, p.name ORDER BY p.name

logical:
  expect: ["(Sort p.name (_))"]

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_candidate_p, _candidate_u, _candidate_mr]
      expect: ["(CTE _candidate_u (_))", "(CTE _candidate_mr (_))", "(Filter mr.author_id IN _candidate_u.id, ... (_))"]
      reject: ["(Scan Table(gl_edge) ...)"]
    emitted:
      ctes:
        exact_order: [_candidate_p, _candidate_u, _candidate_mr]
      expect: ["(CTE _candidate_u (_))", "(Filter u.username = 'alice', ... (_))"]
      reject: ["(Scan Table(gl_edge) ...)"]
