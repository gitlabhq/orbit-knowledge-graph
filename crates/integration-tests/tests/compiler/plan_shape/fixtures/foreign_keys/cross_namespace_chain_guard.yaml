name: Cross-namespace FK chains retain edge scans

query:
  gql: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group) RETURN mr, p, g

logical:
  expect: ["(EdgeScan CONTAINS g->p AS e1)"]

physical:
  clickhouse:
    planned:
      expect: ["(Join ON _orbit_edge_0.target_id = _orbit_edge_1.target_id (_) (_))", "(Scan Table(gl_edge) AS _orbit_edge_0)"]
    emitted:
      expect: ["(Scan Table(gl_edge) AS _orbit_edge_0)", "(Scan Table(gl_edge) AS _orbit_edge_1)"]
