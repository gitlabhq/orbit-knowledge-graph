name: Cross-namespace FK chains retain edge scans
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest"},{"id":"p","entity":"Project"},{"id":"g","entity":"Group"}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"},{"type":"CONTAINS","from":"g","to":"p"}]}
  gql: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group) RETURN mr, p, g
logical:
  expect: ["(EdgeScan CONTAINS g->p AS e1)"]
physical:
  clickhouse:
    planned:
      expect: ["(Join ON e0.target_id = e1.target_id (_) (_))", "(Scan Table(gl_edge) AS e0)"]
    emitted:
      expect: ["(Scan Table(gl_edge) AS e0)", "(Scan Table(gl_edge) AS e1)"]
