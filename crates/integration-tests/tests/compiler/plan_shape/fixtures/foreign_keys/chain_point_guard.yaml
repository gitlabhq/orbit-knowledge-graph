name: Point-selective FK chains retain the edge path

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[1]},{"id":"pipe","entity":"Pipeline"},{"id":"j","entity":"Job"}],"relationships":[{"type":"HAS_HEAD_PIPELINE","from":"mr","to":"pipe"},{"type":"HAS_JOB","from":"pipe","to":"j"}]}
  gql: |
    MATCH (mr:MergeRequest {id: 1})-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)-[:HAS_JOB]->(j:Job) RETURN mr, pipe, j

logical:
  expect: ["(Filter mr.id IN [1] (_))"]

physical:
  clickhouse:
    planned:
      expect: ["(Join ON _orbit_edge_0.target_id = _orbit_edge_1.source_id (_) (_))", "(Deduplicate Final (Scan Table(gl_ci_edge) AS _orbit_edge_0))"]
    emitted:
      expect: ["(Deduplicate Final (Scan Table(gl_ci_edge) AS _orbit_edge_0))", "(Deduplicate Final (Scan Table(gl_ci_edge) AS _orbit_edge_1))"]
