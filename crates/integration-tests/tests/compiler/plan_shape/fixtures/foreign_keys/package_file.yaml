name: Package files use their stored package foreign key
missing_frontends:
  json: The JSON query form is being deprecated.
query:
  gql: |
    MATCH (p:Package {id: 8001})-[:HAS_PACKAGE_FILE]->(f:PackageFile) RETURN p.id, f.file_name
logical:
  expect: ["(EdgeScan HAS_PACKAGE_FILE p->f AS e0)"]
physical:
  clickhouse:
    planned:
      expect:
        - (Filter f.package_id = 8001 (Bind f (_)))
        - (Project f.file_name AS f_file_name, ... (_))
      reject:
        - (Scan Table(gl_edge) ...)
        - (Scan Table(gl_package) ...)
