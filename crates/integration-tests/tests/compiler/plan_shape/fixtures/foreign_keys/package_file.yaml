name: Package files use their FK edge relation

query: |
  MATCH (p:Package {id: 8001})-[:HAS_PACKAGE_FILE]->(f:PackageFile) RETURN p.id, f.file_name

logical:
  expect: ["(Follow HAS_PACKAGE_FILE p->f AS e0 (Filter p.id = 8001 (Entities Package AS p)))"]

physical:
  clickhouse:
    planned:
      expect:
        - (Filter f.package_id = 8001, ... (_))
        - (Project p.id AS id (Filter p._deleted = false (Bind p (Deduplicate LimitBy ... (Sort p.traversal_path, p.id, p._version DESC (Project * (Filter StartsWith(p.traversal_path, scalar(gl_package AS _orbit_scope WHERE _orbit_scope.id = 8001)) OR (scalar(gl_package AS _orbit_scope WHERE _orbit_scope.id = 8001) = '0/'), p.id = 8001 (_))))))))
        - (Project f.package_id AS _orbit_e0_src, ... (_))
        - (Filter f.package_id = 8001, ... (Bind f (Project * (Deduplicate Final (Scan Table(gl_package_file) AS f)))))
      reject:
        - (Deduplicate LimitBy ... (Scan Table(gl_package_file) AS f))
        - (Scan Table(gl_edge) ...)
        - (Project f.id AS _orbit_e0_src, f.package_id AS _orbit_e0_dst, ... (_))
