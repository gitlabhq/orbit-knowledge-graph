name: Filter-only endpoints use exact reusable keys

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "node_ids": [2000]},
        {"id": "u", "entity": "User", "filters": {"username": "alice"}}
      ],
      "relationships": [{"type": "AUTHORED", "from": "u", "to": "mr"}],
      "aggregations": [{"count": "mr", "as": "n"}]
    }
  gql: |
    MATCH (mr:MergeRequest {id: 2000})<-[:AUTHORED]-(u:User {username: 'alice'})
    RETURN count(mr) AS n

logical:
  expect:
    - (Filter u.username = 'alice' (NodeScan User AS u))
    - (Aggregate COUNT(mr) AS n (_))

physical:
  clickhouse:
    planned:
      expect:
        - (CTE _orbit_subplan_0 (Project u.id AS id (Filter u.username = 'alice' (Scan Table(gl_user) AS u))))
        - (CTE _orbit_subplan_1 (Project u.id AS id (Filter u.id IN _orbit_subplan_0.id, u.username = 'alice', u._deleted = false (Deduplicate Final (Scan Table(gl_user) AS u)))))
        - (Filter mr.author_id IN _orbit_subplan_1.id, ... (_))
        - (Scan Table(gl_merge_request) AS mr)
