name: Filter-only endpoints use exact reusable keys

query:
  gql: |
    MATCH (mr:MergeRequest {id: 2000})<-[:AUTHORED]-(u:User {username: 'alice'})
    RETURN count(mr) AS n

logical:
  expect:
    - (Filter u.username = 'alice' (NodeScan User AS u))
    - (Aggregate COUNT(mr) AS n (_))

physical:
  clickhouse:
    planned:
      bind:
        - (CTE $users (Project u.id AS id (Filter u.username = 'alice', ... (Deduplicate LimitBy ... (_)))))
      expect:
        - (Filter mr.author_id IN $users.id, ... (_))
        - (Scan Table(gl_merge_request) AS mr)
      occurrences:
        - pattern: (CTE ? (Project u.id AS id (Filter u.username = 'alice', ... (Deduplicate LimitBy ... (_)))))
          count: 1
      reject:
        - (Scan Table(gl_edge) ...)
        - (CTE $users (Project ... (Filter ... (Scan Table(gl_user) AS u))))
