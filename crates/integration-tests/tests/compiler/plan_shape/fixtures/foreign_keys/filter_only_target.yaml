name: Filter-only endpoints use exact reusable keys

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "node_ids": [2000]},
        {"id": "u", "entity": "User", "filters": {"username": "alice"}}
      ],
      "relationships": [{"type": "AUTHORED", "from": "u", "to": "mr"}],
      "aggregations": [{"count": "mr", "as": "n"}]
    }
  gql: |
    MATCH (mr:MergeRequest {id: 2000})<-[:AUTHORED]-(u:User {username: 'alice'})
    RETURN count(mr) AS n

logical:
  expect:
    - (Aggregate COUNT(mr) AS n (Filter u.username = 'alice' (Follow AUTHORED mr<-u AS e0 (_))))

physical:
  clickhouse:
    planned:
      bind:
        - (Bind $users (Project u.id AS id (Filter u.username = 'alice', ... (Bind u (Deduplicate LimitBy ... (_))))))
      expect:
        - (Filter mr.author_id IN $users.id, ... (_))
        - (Scan Table(gl_merge_request) AS mr)
      occurrences:
        - pattern: (Bind ? (Project u.id AS id (Filter u.username = 'alice', ... (Bind u (Deduplicate LimitBy ... (_))))))
          count: 1
      reject:
        - (Scan Table(gl_edge) ...)
        - (Bind $users (Project ... (Filter ... (Scan Table(gl_user) AS u))))
