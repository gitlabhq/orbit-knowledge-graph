name: Filter-only multi-ID FK targets elide into holder membership

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project) WHERE p.id IN [1000, 1001] RETURN count(mr) AS n

logical:
  expect: ["(Filter p.id IN [1000, 1001] (_))"]

physical:
  clickhouse:
    planned:
      expect: ["(Filter mr.project_id IN [1000, 1001], ... (_))"]
      reject: ["(Scan Table(gl_project) ...)", "(Scan Table(gl_edge) ...)"]
    emitted:
      expect: ["(Filter mr.project_id IN [1000, 1001], ... (_))"]
      reject: ["(Scan Table(gl_project) ...)"]
