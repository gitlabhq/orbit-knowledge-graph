name: NOT on a pinned FK target keeps the target join so its columns stay readable

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: 1000})
    WHERE NOT (p.name CONTAINS 'Public' AND mr.state = 'opened')
    RETURN mr.title

missing_frontends:
  json: JSON filters cannot express grouped negation.

logical:
  expect:
    - (Filter p.id = 1000, NOT ((contains(p.name, 'Public')) AND (mr.state = 'opened')) (Follow IN_PROJECT mr->p AS e1 (Follow AUTHORED u->mr AS e0 (Entities User AS u))))

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON p.id = mr.project_id (_) (_))
        - (Scan Table(gl_project) AS p)
