name: Both-direction neighbors of a center no edge targets scan only the outgoing arm

query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"neighbors":{"direction":"both"}}
  gql: |
    MATCH (u:User {id: 1})--(neighbor) RETURN u, neighbor

logical:
  gql:
    expect:
      - (Limit 30 (Select u, neighbor (Neighbors APPROVED|ASSIGNED|AUTHORED|CLOSED|CONFIRMED_BY|CONTAINS|CREATOR|DEPLOYED_BY|DISMISSED_BY|LAST_EDITED_BY|MEMBER_OF|MERGED|OWNER|REOPENED|RESOLVED_BY|REVIEWER|TRIGGERED|UPDATED_BY u--neighbor (Filter u.id = 1 (Entities User AS u)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_neighbor_edge_arm.source_kind = 'User', _orbit_neighbor_edge_arm.source_id = 1, ... (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm))
        - (Filter _orbit_neighbor_edge_arm.source_kind = 'User', _orbit_neighbor_edge_arm.source_id = 1, ... (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm))
        - (Filter _orbit_neighbor_edge_arm.source_kind = 'User', _orbit_neighbor_edge_arm.source_id = 1, ... (Scan Table(gl_sec_edge) AS _orbit_neighbor_edge_arm))
      occurrences:
        - pattern: (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm)
          count: 1
        - pattern: (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)
          count: 1
        - pattern: (Scan Table(gl_sec_edge) AS _orbit_neighbor_edge_arm)
          count: 1
    emitted:
      expect:
        - (Filter _orbit_neighbor_edge_arm.source_kind = 'User', _orbit_neighbor_edge_arm.source_id = 1, ... (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm))
      reject:
        - (Filter _orbit_neighbor_edge_arm.target_kind = 'User', ... (_))
