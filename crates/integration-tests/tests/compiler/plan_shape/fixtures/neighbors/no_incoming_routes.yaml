name: Both-direction neighbors of a center no edge targets scan only the outgoing arm

query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"neighbors":{"direction":"both"}}
  gql: |
    MATCH (u:User {id: 1})--(neighbor) RETURN u, neighbor

logical:
  expect: ["(Input neighbors (...))"]

physical:
  clickhouse:
    planned:
      expect: ["(Neighbors center=u direction=outgoing directional ... (_))"]
    emitted:
      expect:
        - (Filter _e.source_kind = 'User', _e.source_id = 1, ... (Scan Table(gl_edge) AS _e))
      reject:
        - (Filter _e.target_kind = 'User', ... (_))
