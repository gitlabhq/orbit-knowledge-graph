name: Incoming neighbors include all tables containing compatible variants
ontology_overlay: variant_routes

query:
  gql: |
    MATCH (callee:Definition {id: 12001})<-[:CALLS]-(caller) RETURN callee, caller

logical:
  expect: ["(Input neighbors (...))"]

physical:
  clickhouse:
    emitted:
      expect:
        - (Union ALL AS _orbit_neighbor_edge (_) (_))
        - (Scan Table(gl_code_edge) AS _orbit_neighbor_edge_arm)
        - (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)
