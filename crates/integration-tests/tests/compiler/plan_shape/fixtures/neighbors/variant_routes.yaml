name: Incoming neighbors include all tables containing compatible variants
ontology_overlay: variant_routes

query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"callee","entity":"Definition","node_ids":[12001]}],"neighbors":{"direction":"incoming","rel_types":["CALLS"]}}
  gql: |
    MATCH (callee:Definition {id: 12001})<-[:CALLS]-(caller) RETURN callee, caller

logical:
  gql:
    expect:
      - (Limit 30 (Select callee, caller (Neighbors CALLS callee<-caller (Filter callee.id = 12001 (Entities Definition AS callee)))))
  json:
    expect:
      - (Limit 30 (Select callee, neighbor (Neighbors CALLS callee<-neighbor (Filter callee.id IN [12001] (Entities Definition AS callee)))))

physical:
  clickhouse:
    emitted:
      expect:
        - (Union ALL AS _orbit_neighbor_edge (_) (_))
        - (Scan Table(gl_code_edge) AS _orbit_neighbor_edge_arm)
        - (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)
