name: Covered center filters retain fused neighbor scans and filter both tag directions

query: |
  MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT|AUTHORED]-(neighbor) RETURN mr, neighbor

logical:
  expect:
    - (Limit 30 (Select mr, neighbor (Neighbors IN_PROJECT|AUTHORED mr--neighbor (Filter mr.state = 'merged' (Entities MergeRequest AS mr)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter ((_orbit_neighbor_edge.source_kind = 'MergeRequest') AND ArrayContains(_orbit_neighbor_edge.source_tags, 'state:merged')) OR ((_orbit_neighbor_edge.target_kind = 'MergeRequest') AND ArrayContains(_orbit_neighbor_edge.target_tags, 'state:merged')), ... (Scan Table(gl_edge) AS _orbit_neighbor_edge))
      reject: ["(Scan Table(gl_merge_request) AS mr)"]
    emitted:
      expect:
        - (Filter ((_orbit_neighbor_edge.source_kind = 'MergeRequest') AND ArrayContains(_orbit_neighbor_edge.source_tags, 'state:merged')) OR ((_orbit_neighbor_edge.target_kind = 'MergeRequest') AND ArrayContains(_orbit_neighbor_edge.target_tags, 'state:merged')), ... (_))
      occurrences:
        - pattern: (Scan Table(gl_edge) AS _orbit_neighbor_edge)
          count: 1
      reject: ["(Scan Table(gl_merge_request) ...)", "(Union ... (...))"]
