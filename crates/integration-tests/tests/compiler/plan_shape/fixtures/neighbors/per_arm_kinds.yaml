name: Both-direction neighbor arms filter only the kinds that touch the center on their side

query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[1]}],"neighbors":{"direction":"both","rel_types":["AUTHORED","HAS_HEAD_PIPELINE"]}}
  gql: |
    MATCH (mr:MergeRequest {id: 1})-[:AUTHORED|HAS_HEAD_PIPELINE]-(neighbor) RETURN mr, neighbor

physical:
  clickhouse:
    normalize:
      input:
        expect: ["(Input neighbors (...))"]
    plan_clickhouse:
      query_plan:
        expect: ["(Neighbors center=mr direction=both directional ... (_))"]
    response_policy:
      node:
        expect:
          - (Union ALL (_) (_))
          - (Filter _orbit_neighbor_edge.source_kind = 'MergeRequest', _orbit_neighbor_edge.source_id = 1, _orbit_neighbor_edge.relationship_kind = 'HAS_HEAD_PIPELINE', ... (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge))
          - (Filter _orbit_neighbor_edge.target_kind = 'MergeRequest', _orbit_neighbor_edge.target_id = 1, _orbit_neighbor_edge.relationship_kind = 'AUTHORED', ... (Scan Table(gl_edge) AS _orbit_neighbor_edge))
