logical:
  expect: ["(Input neighbors (...))"]

cases:
  - name: Filter-pinned incoming arms pin the target id and scope only anchored kinds
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"iid":{"eq":7},"project_id":{"eq":1000}}}],"neighbors":{"direction":"incoming","rel_types":["MENTIONS","AUTHORED"]}}
      gql: |
        MATCH (mr:MergeRequest {iid: 7, project_id: 1000})<-[:MENTIONS|AUTHORED]-(neighbor) RETURN mr, neighbor
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=mr direction=incoming directional outgoing=[gl_edge] incoming=[gl_edge] center_filter=true relationships=[MENTIONS, AUTHORED] arms=[in gl_edge MENTIONS, in gl_edge AUTHORED path] (_))"]
        emitted:
          expect:
            - (SemiJoin _e.target_id IN subquery (Filter _e.target_kind = 'MergeRequest' (Scan Table(gl_edge) AS _e)) (Project _ctr.id AS id (Filter _ctr.iid = 7, _ctr.project_id = 1000, _ctr._deleted = false (Deduplicate Final (Scan Table(gl_merge_request) AS _ctr)))))
            - (SemiJoin _e.traversal_path IN subquery (Filter _e.relationship_kind = 'AUTHORED' (_)) (Project _tpd.traversal_path AS traversal_path (Filter _tpd.iid = 7, _tpd.project_id = 1000, _tpd._deleted = false (Deduplicate Final (Scan Table(gl_merge_request) AS _tpd)))))
          reject:
            - (SemiJoin _e.traversal_path IN subquery (Filter _e.relationship_kind = 'MENTIONS' (_)) (_))

  - name: An unpinned center keeps one arm per table and no center lookups
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"state":"opened"}}],"neighbors":{"direction":"incoming","rel_types":["APPROVED"]}}
      gql: |
        MATCH (mr:MergeRequest {state: 'opened'})<-[:APPROVED]-(neighbor) RETURN mr, neighbor
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=mr direction=incoming directional outgoing=[gl_edge] incoming=[gl_edge] center_filter=false relationships=[APPROVED] arms=[in gl_edge APPROVED] (_))"]
        emitted:
          expect:
            - (Filter ArrayContains(e.target_tags, 'state:opened'), e.target_kind = 'MergeRequest', e.relationship_kind = 'APPROVED', e._deleted = false (Scan Table(gl_edge) AS e))
          reject:
            - (SemiJoin ? (_) (_))

  - name: A center without traversal_path pins ids and never scopes paths
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"u","entity":"User","node_ids":[100]}],"neighbors":{"direction":"outgoing","rel_types":["MEMBER_OF","AUTHORED"]}}
      gql: |
        MATCH (u:User {id: 100})-[:MEMBER_OF|AUTHORED]->(neighbor) RETURN u, neighbor
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=u direction=outgoing directional outgoing=[gl_edge, gl_sec_edge] incoming=[gl_edge, gl_sec_edge] center_filter=false relationships=[MEMBER_OF, AUTHORED] arms=[out gl_edge MEMBER_OF|AUTHORED, out gl_sec_edge AUTHORED] (_))"]
        emitted:
          expect:
            - (Filter _e.source_kind = 'User', _e.source_id = 100, _e.relationship_kind IN ['MEMBER_OF', 'AUTHORED'], _e._deleted = false (Scan Table(gl_edge) AS _e))
            - (Filter _e.source_kind = 'User', _e.source_id = 100, _e.relationship_kind = 'AUTHORED', _e._deleted = false (Scan Table(gl_sec_edge) AS _e))
          reject:
            - (SemiJoin ? (_) (_))

  - name: A filter-pinned center without traversal_path pins ids through the center lookup only
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"u","entity":"User","filters":{"username":{"eq":"alice"}}}],"neighbors":{"direction":"outgoing","rel_types":["MEMBER_OF"]}}
      gql: |
        MATCH (u:User {username: 'alice'})-[:MEMBER_OF]->(neighbor) RETURN u, neighbor
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=u direction=outgoing directional outgoing=[gl_edge] incoming=[gl_edge] center_filter=true relationships=[MEMBER_OF] arms=[out gl_edge MEMBER_OF] (_))"]
        emitted:
          expect:
            - (SemiJoin e.source_id IN subquery (_) (Project _ctr.id AS id (_)))
            - (Deduplicate Final (Scan Table(gl_user) AS _ctr))
          reject:
            - (SemiJoin e.traversal_path IN subquery (_) (_))

  - name: Untyped neighbors of an id-pinned center keep one arm per routed table
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[1]}],"neighbors":{"direction":"outgoing"}}
      gql: |
        MATCH (mr:MergeRequest {id: 1})-->(neighbor) RETURN mr, neighbor
    physical:
      clickhouse:
        planned:
          expect: ["(Neighbors center=mr direction=outgoing directional outgoing=[gl_ci_edge, gl_diff_edge, gl_edge, gl_sec_edge] ... (_))"]
        emitted:
          expect:
            - (Filter _e.source_kind = 'MergeRequest', _e.source_id = 1, _e.relationship_kind IN ['HAS_DIFF', 'HAS_LATEST_DIFF'], _e._deleted = false (Scan Table(gl_diff_edge) AS _e))
            - (Filter _e.source_kind = 'MergeRequest', _e.source_id = 1, _e.relationship_kind = 'FIXES', _e._deleted = false (Scan Table(gl_sec_edge) AS _e))
            - (Filter _e.source_kind = 'MergeRequest', _e.source_id = 1, _e.relationship_kind IN ['DEPLOYED_TO', 'HAS_HEAD_PIPELINE', 'TRIGGERED'], _e._deleted = false (Scan Table(gl_ci_edge) AS _e))
            - (Filter _e.source_kind = 'MergeRequest', _e.source_id = 1, _e.relationship_kind IN ['CLOSES', 'HAS_LABEL', 'HAS_NOTE', 'IN_MILESTONE', 'IN_PROJECT', 'MENTIONS', 'MERGED_AT_COMMIT', 'SOURCE_PROJECT'], _e._deleted = false (Scan Table(gl_edge) AS _e))
          reject:
            - (SemiJoin ? (_) (_))
