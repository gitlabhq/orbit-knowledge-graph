name: Multiple neighbor edge routes keep per-arm predicates and disable fusion

query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[1]}],"neighbors":{"direction":"both","rel_types":["IN_PROJECT","HAS_HEAD_PIPELINE"]}}
  gql: |
    MATCH (mr:MergeRequest {id: 1})-[:IN_PROJECT|HAS_HEAD_PIPELINE]-(neighbor) RETURN mr, neighbor

logical:
  expect: ["(Input neighbors (...))"]

physical:
  clickhouse:
    planned:
      expect: ["(Neighbors center=mr direction=both directional outgoing=[gl_ci_edge, gl_edge] incoming=[gl_ci_edge, gl_code_edge, gl_diff_edge, gl_edge, gl_sec_edge] center_filter=false relationships=[IN_PROJECT, HAS_HEAD_PIPELINE] arms=[out gl_ci_edge HAS_HEAD_PIPELINE, out gl_edge IN_PROJECT, in gl_ci_edge IN_PROJECT|HAS_HEAD_PIPELINE, in gl_code_edge IN_PROJECT|HAS_HEAD_PIPELINE, in gl_diff_edge IN_PROJECT|HAS_HEAD_PIPELINE, in gl_edge IN_PROJECT|HAS_HEAD_PIPELINE, in gl_sec_edge IN_PROJECT|HAS_HEAD_PIPELINE] (_))"]
    emitted:
      expect:
        - (Union ALL (_) (_))
        - (Filter _e.source_kind = 'MergeRequest', _e.source_id = 1, _e.relationship_kind = 'HAS_HEAD_PIPELINE', _e._deleted = false (Scan Table(gl_ci_edge) AS _e))
        - (Filter _e.source_kind = 'MergeRequest', _e.source_id = 1, _e.relationship_kind = 'IN_PROJECT', _e._deleted = false (Scan Table(gl_edge) AS _e))
      reject:
        - (Bind _orbit_fused (_))
        - (SemiJoin _e.traversal_path IN subquery (_) (_))
