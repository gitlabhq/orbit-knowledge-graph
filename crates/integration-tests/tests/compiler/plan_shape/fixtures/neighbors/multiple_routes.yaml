name: Multiple neighbor edge routes keep per-arm predicates and disable fusion

query: |
  MATCH (mr:MergeRequest {id: 1})-[:IN_PROJECT|HAS_HEAD_PIPELINE]-(neighbor) RETURN mr, neighbor

logical:
  expect:
    - (Limit 30 (Select mr, neighbor (Neighbors IN_PROJECT|HAS_HEAD_PIPELINE mr--neighbor (Filter mr.id = 1 (Entities MergeRequest AS mr)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_neighbor_edge_arm.source_kind = 'MergeRequest', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind IN ['IN_PROJECT', 'HAS_HEAD_PIPELINE'] (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm))
        - (Filter _orbit_neighbor_edge_arm.source_kind = 'MergeRequest', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind IN ['IN_PROJECT', 'HAS_HEAD_PIPELINE'] (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm))
      occurrences:
        - pattern: (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm)
          count: 1
        - pattern: (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)
          count: 1
    emitted:
      expect:
        - (Union ALL AS _orbit_neighbor_edge (_) (_))
        - (Filter _orbit_neighbor_edge_arm.source_kind = 'MergeRequest', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind IN ['IN_PROJECT', 'HAS_HEAD_PIPELINE'], ... (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm))
        - (Filter _orbit_neighbor_edge_arm.source_kind = 'MergeRequest', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind IN ['IN_PROJECT', 'HAS_HEAD_PIPELINE'], ... (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm))
      reject: ["(Bind _orbit_fused (_))"]
