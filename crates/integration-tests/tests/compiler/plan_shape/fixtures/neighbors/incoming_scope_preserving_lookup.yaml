name: Incoming neighbors keep path narrowing for scope-preserving relationships

query: |
  MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(neighbor) RETURN p, neighbor

logical:
  expect:
    - (Limit 30 (Select p, neighbor (Neighbors IN_PROJECT p<-neighbor (Filter p.id = 1000 (Entities Project AS p)))))

physical:
  clickhouse:
    emitted:
      expect:
        - (SemiJoin _orbit_neighbor_edge_arm.traversal_path IN subquery (_) (Project _orbit_center_rows.traversal_path AS traversal_path (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
