name: Split IN_PROJECT variants use directional table unions

query: |
  MATCH (p:Project {id: 1000})-[:IN_PROJECT]-(neighbor) RETURN p, neighbor

logical:
  expect:
    - (Limit 30 (Select p, neighbor (Neighbors IN_PROJECT p--neighbor (Filter p.id = 1000 (Entities Project AS p)))))

physical:
  clickhouse:
    planned:
      expect:
        - (SemiJoin _orbit_neighbor_edge_arm.traversal_path IN subquery (Filter _orbit_neighbor_edge_arm.target_kind = 'Project', _orbit_neighbor_edge_arm.target_id = 1000, _orbit_neighbor_edge_arm.relationship_kind = 'IN_PROJECT' (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm)) (Project _orbit_center_rows.traversal_path AS traversal_path (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
        - (SemiJoin _orbit_neighbor_edge_arm.traversal_path IN subquery (Filter _orbit_neighbor_edge_arm.target_kind = 'Project', _orbit_neighbor_edge_arm.target_id = 1000, _orbit_neighbor_edge_arm.relationship_kind = 'IN_PROJECT' (Scan Table(gl_code_edge) AS _orbit_neighbor_edge_arm)) (Project _orbit_center_rows.traversal_path AS traversal_path (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
        - (SemiJoin _orbit_neighbor_edge_arm.traversal_path IN subquery (Filter _orbit_neighbor_edge_arm.target_kind = 'Project', _orbit_neighbor_edge_arm.target_id = 1000, _orbit_neighbor_edge_arm.relationship_kind = 'IN_PROJECT' (Scan Table(gl_diff_edge) AS _orbit_neighbor_edge_arm)) (Project _orbit_center_rows.traversal_path AS traversal_path (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
        - (SemiJoin _orbit_neighbor_edge_arm.traversal_path IN subquery (Filter _orbit_neighbor_edge_arm.target_kind = 'Project', _orbit_neighbor_edge_arm.target_id = 1000, _orbit_neighbor_edge_arm.relationship_kind = 'IN_PROJECT' (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)) (Project _orbit_center_rows.traversal_path AS traversal_path (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
        - (SemiJoin _orbit_neighbor_edge_arm.traversal_path IN subquery (Filter _orbit_neighbor_edge_arm.target_kind = 'Project', _orbit_neighbor_edge_arm.target_id = 1000, _orbit_neighbor_edge_arm.relationship_kind = 'IN_PROJECT' (Scan Table(gl_sec_edge) AS _orbit_neighbor_edge_arm)) (Project _orbit_center_rows.traversal_path AS traversal_path (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
      reject: ["(Scan Table(gl_project) AS p)"]
    emitted:
      expect:
        - (Union ALL AS _orbit_neighbor_edge (_) (_) (_) (_) (_))
        - (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm)
        - (Scan Table(gl_code_edge) AS _orbit_neighbor_edge_arm)
        - (Scan Table(gl_diff_edge) AS _orbit_neighbor_edge_arm)
        - (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)
        - (Scan Table(gl_sec_edge) AS _orbit_neighbor_edge_arm)
