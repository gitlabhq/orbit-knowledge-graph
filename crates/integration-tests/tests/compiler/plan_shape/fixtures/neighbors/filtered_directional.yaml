name: Filtered neighbors plan separate directional arms

query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"d","entity":"Definition","node_ids":[1],"filters":{"name":"caller"}}],"neighbors":{"direction":"both","rel_types":["CALLS"]}}
  gql: |
    MATCH (d:Definition {id: 1, name: 'caller'})-[:CALLS]-(neighbor) RETURN d, neighbor

logical:
  gql:
    expect:
      - (Limit 30 (Select d, neighbor (Neighbors CALLS d--neighbor (Filter d.id = 1, d.name = 'caller' (Entities Definition AS d)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON _orbit_neighbor_edge.source_id = d.id (Scan Table(gl_code_edge) AS _orbit_neighbor_edge) (Bind d (Project d.id AS id, d._deleted AS _deleted, d.project_id AS project_id (Filter d.name = 'caller', Lower(d.name) = Lower('caller'), d.id = 1 (Deduplicate Final (Scan Table(gl_definition) AS d))))))
        - (Join ON _orbit_neighbor_edge.target_id = d.id (Scan Table(gl_code_edge) AS _orbit_neighbor_edge) (Bind d (Project d.id AS id, d._deleted AS _deleted, d.project_id AS project_id (Filter d.name = 'caller', Lower(d.name) = Lower('caller'), d.id = 1 (Deduplicate Final (Scan Table(gl_definition) AS d))))))
    emitted:
      expect:
        - (Union ALL (_) (_))
