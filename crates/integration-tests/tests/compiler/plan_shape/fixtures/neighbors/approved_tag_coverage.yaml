name: APPROVED neighbor filters use writer-provided target tags

query: |
  MATCH (mr:MergeRequest {id: 99000, state: 'opened'})<-[:APPROVED]-(neighbor)
  RETURN neighbor

logical:
  expect:
    - (Limit 30 (Select neighbor (Neighbors APPROVED mr<-neighbor (Filter mr.id = 99000, mr.state = 'opened' (Entities MergeRequest AS mr)))))

physical:
  clickhouse:
    planned:
      expect:
        - (SemiJoin _orbit_neighbor_edge.target_id IN subquery (Filter ArrayContains(_orbit_neighbor_edge.target_tags, 'state:opened'), _orbit_neighbor_edge.target_kind = 'MergeRequest', _orbit_neighbor_edge.target_id = 99000, _orbit_neighbor_edge.relationship_kind = 'APPROVED' (Scan Table(gl_edge) AS _orbit_neighbor_edge)) (Project _orbit_center_rows.id AS id (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
      reject: ["(Scan Table(gl_merge_request) AS mr)"]
      occurrences:
        - pattern: (Scan Table(gl_edge) AS _orbit_neighbor_edge)
          count: 1
    emitted:
      expect:
        - (SemiJoin _orbit_neighbor_edge.target_id IN subquery (Filter ArrayContains(_orbit_neighbor_edge.target_tags, 'state:opened'), _orbit_neighbor_edge.target_kind = 'MergeRequest', _orbit_neighbor_edge.target_id = 99000, _orbit_neighbor_edge.relationship_kind = 'APPROVED' (Scan Table(gl_edge) AS _orbit_neighbor_edge)) (Project _orbit_center_rows.id AS id (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
