name: APPROVED neighbor filters use writer-provided target tags
query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[99000],"filters":{"state":"opened"}}],"neighbors":{"direction":"incoming","rel_types":["APPROVED"]}}
  gql: |
    MATCH (mr:MergeRequest {id: 99000, state: 'opened'})<-[:APPROVED]-(neighbor)
    RETURN neighbor
logical:
  expect:
    - (Filter mr.id IN [99000], mr.state = 'opened' (NodeScan MergeRequest AS mr))
physical:
  clickhouse:
    planned:
      expect:
        - (Neighbors center=mr direction=incoming directional outgoing=[gl_edge] incoming=[gl_edge] center_filter=false relationships=[APPROVED] incoming_scoped=false (_))
    emitted:
      expect:
        - (Filter e.target_kind = 'MergeRequest', e.target_id = 99000, e.relationship_kind = 'APPROVED', ArrayContains(e.target_tags, 'state:opened'), e._deleted = false (Scan Table(gl_edge) AS e))
      reject:
        - (Scan Table(gl_merge_request) ...)
