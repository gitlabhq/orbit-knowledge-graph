name: Incoming cross-namespace neighbors keep broad edge scope and verify the center

query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[100]}],"neighbors":{"direction":"incoming","rel_types":["MENTIONS"]}}
  gql: |
    MATCH (mr:MergeRequest {id: 100})<-[:MENTIONS]-(neighbor) RETURN mr, neighbor

logical:
  expect: ["(Input neighbors (...))"]

physical:
  clickhouse:
    planned:
      expect: ["(Neighbors center=mr direction=incoming directional outgoing=[gl_edge] incoming=[gl_edge] center_filter=false relationships=[MENTIONS] arms=[in gl_edge MENTIONS] (_))"]
    emitted:
      expect:
        - (SemiJoin e.target_id IN subquery (Filter e.target_kind = 'MergeRequest', e.target_id = 100, e.relationship_kind = 'MENTIONS' (Scan Table(gl_edge) AS e)) (Project _ctr.id AS id (Filter _ctr.id = 100, _ctr._deleted = false (Deduplicate Final (Scan Table(gl_merge_request) AS _ctr)))))
      reject:
        - (SemiJoin e.traversal_path IN subquery (_))
