name: Incoming neighbors keep broad scope for relationships that can cross namespaces
query:
  json: |
    {"query_type":"neighbors","nodes":[{"id":"g","entity":"Group","node_ids":[100]}],"neighbors":{"direction":"incoming","rel_types":["MEMBER_OF"]}}
  gql: |
    MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(neighbor) RETURN g, neighbor
logical:
  expect: ["(Input neighbors (...))"]
physical:
  clickhouse:
    planned:
      expect: ["(Neighbors center=g direction=incoming directional ... (_))"]
    emitted:
      expect:
        - (Filter e.target_kind = 'Group', e.target_id = 100, e.relationship_kind = 'MEMBER_OF', e._deleted = false (Scan Table(gl_edge) AS e))
      reject:
        - (SemiJoin e.traversal_path IN subquery (_))
        - (Join ... (_) (_))
