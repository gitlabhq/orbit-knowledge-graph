name: Incoming neighbors keep broad edge scope and verify the center

query:
  gql: |
    MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(neighbor) RETURN g, neighbor

logical:
  expect: ["(Input neighbors (...))"]

physical:
  clickhouse:
    planned:
      expect: ["(Neighbors center=g direction=incoming directional ... (_))"]
    emitted:
      expect:
        - (SemiJoin _orbit_neighbor_edge.target_id IN subquery (Filter _orbit_neighbor_edge.target_kind = 'Group', _orbit_neighbor_edge.target_id = 100, _orbit_neighbor_edge.relationship_kind = 'MEMBER_OF' (Scan Table(gl_edge) AS _orbit_neighbor_edge)) (Project _orbit_center_rows.id AS id (Scan Table(_orbit_center_rows) AS _orbit_center_rows)))
      reject:
        - (SemiJoin _orbit_neighbor_edge.traversal_path IN subquery (_))
