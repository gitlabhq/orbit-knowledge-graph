name: Incoming neighbors keep broad edge scope and verify the center

query:
  gql: |
    MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(neighbor) RETURN g, neighbor

logical:
  expect: ["(Input neighbors (...))"]

physical:
  clickhouse:
    planned:
      expect: ["(Neighbors center=g direction=incoming directional ... (_))"]
    emitted:
      expect:
        - (SemiJoin e.target_id IN subquery (Filter e.target_kind = 'Group', e.target_id = 100, e.relationship_kind = 'MEMBER_OF' (Scan Table(gl_edge) AS e)) (Project _ctr.id AS id (Scan Table(_ctr) AS _ctr)))
      reject:
        - (SemiJoin e.traversal_path IN subquery (_))
