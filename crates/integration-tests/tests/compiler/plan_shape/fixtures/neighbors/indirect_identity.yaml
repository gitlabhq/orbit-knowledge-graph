name: Neighbors uses its family emitter without an edge-chain strategy

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "d", "entity": "Definition", "node_ids": [1]}],
      "neighbors": {"direction": "both", "rel_types": ["CALLS"]}
    }
  gql: |
    MATCH (d:Definition {id: 1})-[:CALLS]-(neighbor) RETURN d, neighbor

logical:
  gql:
    expect:
      - (Limit 30 (Select d, neighbor (Neighbors CALLS d--neighbor (Filter d.id = 1 (Entities Definition AS d)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_neighbor_edge.source_kind = 'Definition', _orbit_neighbor_edge.source_id = 1, _orbit_neighbor_edge.relationship_kind = 'CALLS' (Join ON _orbit_neighbor_edge.source_id = d.id (Scan Table(gl_code_edge) AS _orbit_neighbor_edge) (Deduplicate Final (Scan Table(gl_definition) AS d))))
        - (Filter _orbit_neighbor_edge.target_kind = 'Definition', _orbit_neighbor_edge.target_id = 1, _orbit_neighbor_edge.relationship_kind = 'CALLS' (Join ON _orbit_neighbor_edge.target_id = d.id (Scan Table(gl_code_edge) AS _orbit_neighbor_edge) (Deduplicate Final (Scan Table(gl_definition) AS d))))
    emitted:
      expect:
        - (Scan Table(gl_code_edge) ...)
  duckdb:
    planned:
      expect:
        - (Filter _orbit_neighbor_edge.source_kind = 'Definition', _orbit_neighbor_edge.source_id = 1, _orbit_neighbor_edge.relationship_kind = 'CALLS' (Scan Table(gl_edge) AS _orbit_neighbor_edge))
        - (Filter _orbit_neighbor_edge.target_kind = 'Definition', _orbit_neighbor_edge.target_id = 1, _orbit_neighbor_edge.relationship_kind = 'CALLS' (Scan Table(gl_edge) AS _orbit_neighbor_edge))
    emitted:
      expect:
        - (Scan Table(gl_edge) ...)
