name: Neighbors uses its family emitter without an edge-chain strategy

query:
  gql: |
    MATCH (d:Definition {id: 1})-[:CALLS]-(neighbor) RETURN d, neighbor

logical:
  expect:
    - (Input neighbors (...))
    - (Filter d.id IN [1] (NodeScan Definition AS d))

physical:
  clickhouse:
    planned:
      expect:
        - (Neighbors center=d direction=both directional outgoing=[gl_code_edge] incoming=[gl_code_edge] center_filter=false relationships=[CALLS] ... (_))
        - (NodeScan Definition AS d)
    emitted:
      expect:
        - (Scan Table(gl_code_edge) ...)
  duckdb:
    planned:
      expect:
        - (Neighbors center=d direction=both ... (_))
    emitted:
      expect:
        - (Scan Table(gl_edge) ...)
