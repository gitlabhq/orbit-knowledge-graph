---
cases:
  - name: FK aggregation returns zero when the unprojected target filter has no match
    query:
      gql: |
        MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {name: 'Missing Project'})
        RETURN count(mr) AS c LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - AS p FINAL
            - p.name = 'Missing Project'
            - mr.project_id IN (SELECT id FROM _orbit_relation_
          not_contains:
            - gl_edge
