cases:
  - name: text_prefix_on_ungrouped_node_rejected
    query:
      gql: |
        MATCH (w:WorkItem {id: 4001}) WHERE w.title STARTS WITH 'Fix a' RETURN count(w) AS n
      json: |
        {"query_type":"aggregation","nodes":[{"id":"w","entity":"WorkItem","node_ids":[4001],"filters":{"title":{"starts_with":"Fix a"}}}],"aggregations":[{"count":"w","as":"n"}]}
    security:
      org_id: 1
      paths:
        - 1/100/
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - text matching and ordering require grouping by "w"

