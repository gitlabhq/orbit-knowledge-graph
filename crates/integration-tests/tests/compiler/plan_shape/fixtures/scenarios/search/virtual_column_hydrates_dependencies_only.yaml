---
cases:
  - name: Search with a virtual column keeps a hydration plan for the virtual column while DB columns stay inline
    query:
      gql: |
        MATCH (f:File {id: 13000}) RETURN f.name, f.content LIMIT 5
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - AS f_name
          not_contains:
            - f_content
            - f.content
        hydration: static
