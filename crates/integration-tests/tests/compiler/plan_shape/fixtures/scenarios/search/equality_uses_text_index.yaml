---
cases:
  - name: equality
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "mr", "entity": "MergeRequest", "id_range": {"start": 2000, "end": 2200},
                     "columns": ["title"],
                     "filters": {"title": "Ship feature E"}}],
          "order_by": "mr.id",
          "limit": 10
        }
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.id >= 2000 AND mr.id <= 2200 AND mr.title = 'Ship feature E'
        RETURN mr.title ORDER BY mr.id LIMIT 10
