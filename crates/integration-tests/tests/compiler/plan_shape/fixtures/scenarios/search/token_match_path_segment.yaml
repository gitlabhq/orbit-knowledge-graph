cases:
  - name: token_match on a file path matches one segment regardless of case, so main matches crates/orbit/src/main.rs
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "d", "entity": "Definition", "id_range": {"start": 12000, "end": 12300},
                     "columns": ["file_path"],
                     "filters": {"file_path": {"token_match": "MAIN"}}}],
          "order_by": "d.id",
          "limit": 10
        }
      gql: |
        MATCH (d:Definition) WHERE d.id >= 12000 AND d.id <= 12300 AND token_match(d.file_path, 'MAIN')
        RETURN d.file_path ORDER BY d.id LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        codegen:
          output:
            indexes:
              - table: gl_definition
                name: idx_file_path
