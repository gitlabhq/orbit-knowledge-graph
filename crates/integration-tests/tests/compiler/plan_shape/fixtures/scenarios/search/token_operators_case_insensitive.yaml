---
cases:
  - name: token_match, all_tokens, and any_tokens each exclude one row regardless of case and prune granules with the text skip index
    query:
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.id >= 2000 AND mr.id <= 2200
          AND token_match(mr.title, 'FIX') AND all_tokens(mr.title, 'LOGIN Crash') AND any_tokens(mr.title, 'URGENT ios')
        RETURN mr.title LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - hasToken(lower(mr.title), lower('FIX'))
            - hasAllTokens(lower(mr.title), lower('LOGIN Crash'))
            - hasAnyTokens(lower(mr.title), lower('URGENT ios'))
          not_contains: []
        indexes:
          - table: gl_merge_request
            name: idx_title
