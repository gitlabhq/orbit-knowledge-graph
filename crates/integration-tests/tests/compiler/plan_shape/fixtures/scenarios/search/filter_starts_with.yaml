---
cases:
  - name: starts_with filter returns rows with matching prefix regardless of case and prunes granules with the ngram skip index
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username STARTS WITH 'ALI' RETURN u.username LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - startsWith(lower(u.username), lower('ALI'))
          not_contains: []
        indexes:
          - table: gl_user
            name: idx_username_ngram
