cases:
  - name: A DateTime filter value on or before 1970-01-01 is rejected because the epoch stands for null
    query:
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.id >= 2000 AND mr.id <= 2005 AND mr.merged_at >= '1970-01-01T00:00:00Z' RETURN mr.title LIMIT 10
    missing_frontends:
      json: The source scenario supplies only GQL.
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - stand for null
