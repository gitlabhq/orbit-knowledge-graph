---
cases:
  - name: starts_with on a sort-key column such as branch compares exact case so the primary key keeps pruning
    query:
      gql: |
        MATCH (d:Definition) WHERE d.id >= 12000 AND d.id <= 12300 AND d.branch STARTS WITH 'MAI'
        RETURN d.branch LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - startsWith(d.branch, 'MAI')
          not_contains:
            - lower(d.branch)
