---
cases:
  - name: Inline datetime renders as ISO 8601 UTC
    query:
      gql: |
        MATCH (n:Note {id: 3000}) RETURN n.created_at LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - AS n_created_at
          not_contains: []
        hydration: none
