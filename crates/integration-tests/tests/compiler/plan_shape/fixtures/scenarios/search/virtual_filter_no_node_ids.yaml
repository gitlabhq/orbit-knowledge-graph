cases:
  - name: Virtual column filter without node_ids is rejected at compile time
    query:
      gql: |
        MATCH (f:File) WHERE f.project_id = 1000 AND f.content CONTAINS 'ClickHouse' RETURN f.path LIMIT 10
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "f", "entity": "File",
                   "columns": ["path"],
                   "filters": {
                       "project_id": {"eq": 1000},
                       "content": {"contains": "ClickHouse"}
                   }}],
          "limit": 10
        }
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - node_ids
            - content
