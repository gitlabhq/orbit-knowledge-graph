cases:
  - name: contains treats %, _, and backslash as plain characters with independent decoys and ngram index pruning
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "mr", "entity": "MergeRequest", "id_range": {"start": 2000, "end": 2200},
                     "columns": ["title"],
                     "filters": {"title": {"contains": "100% done_now c:\\temp"}}}],
          "limit": 10
        }
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.id >= 2000 AND mr.id <= 2200 AND mr.title CONTAINS '100% done_now c:\\temp'
        RETURN mr.title LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        codegen:
          output:
            indexes:
              - table: gl_merge_request
                name: idx_title_ngram
