cases:
  - name: Syntax errors name clauses instead of grammar rules, and a keyword followed by a parenthesis is not called a function
    query:
      gql: |
        MATCH (u:User {id: 1}) RETURN u LIMIT(1)
    missing_frontends:
      json: The source scenario supplies only GQL.
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          contains:
            - expected end of query, ORDER BY, SKIP, LIMIT, or DEBUG
          not_contains:
            - EOI
            - function
