cases:
  - name: filter
    query:
      gql: |
        MATCH (f:File) WHERE f.id >= 1 AND f.id <= 100000 AND f.content = 'x' RETURN f LIMIT 5
      json: |
        {"query_type": "traversal", "nodes": [{"id": "f", "entity": "File", "id_range": {"start": 1, "end": 100000}, "filters": {"content": {"eq": "x"}}}], "limit": 5}
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - content

  - name: order_by
    query:
      gql: |
        MATCH (f:File) WHERE f.id >= 1 AND f.id <= 100000 RETURN f ORDER BY f.content LIMIT 5
      json: |
        {"query_type": "traversal", "nodes": [{"id": "f", "entity": "File", "id_range": {"start": 1, "end": 100000}}], "order_by": "f.content", "limit": 5}
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - content

  - name: group_by
    query:
      gql: |
        MATCH (f:File) WHERE f.id >= 1 AND f.id <= 100000 RETURN f.content, count(f) AS n
    missing_frontends:
      json: The source scenario supplies only GQL.
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - content
