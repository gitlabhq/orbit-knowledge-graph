---
cases:
  - name: ends_with filter returns the matching username regardless of case and prunes granules with the ngram skip index
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username ENDS WITH 'ICE' RETURN u.username LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - endsWith(lower(u.username), lower('ICE'))
          not_contains: []
        indexes:
          - table: gl_user
            name: idx_username_ngram
