---
cases:
  - name: A narrowed FK target applies mutable filters after selecting its latest version
    query:
      gql: |
        MATCH (g:Group {id: 970})-[:CONTAINS]->(p:Project {star_count: 1})<-[:IN_PROJECT]-(mr:MergeRequest)
        RETURN p.name, count(mr) AS c LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - AS p FINAL
            - p.star_count = 1
            - gl_edge
          not_contains: []
