---
cases:
  - name: Hydration returns every requested entity when an earlier ID exists at two paths
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 2000})-[:HAS_NOTE]->(n:Note)
        RETURN mr.id, n.note LIMIT 10
    security:
      org_id: 1
      paths:
        - 1/
    physical:
      clickhouse:
        hydration: static
    missing_frontends:
      json: The original query scenario supplies only GQL.
