---
cases:
  - name: A renamed group does not resolve through its obsolete full path
    query:
      gql: |
        MATCH (p:Project)<-[:CONTAINS]-(g:Group {full_path: 'old'}) RETURN count(p) AS c LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - gl_group AS _orbit_scope FINAL
            - _orbit_scope.full_path = 'old'
            - gl_edge
            - AS g FINAL
          not_contains: []
