cases:
  - name: return_column_rejected
    query:
      gql: |
        MATCH (g:Group {id: 100}) RETURN g.name, g.traversal_path LIMIT 10
      json: |
        {"query_type": "traversal", "nodes": [{"id": "g", "entity": "Group", "node_ids": [100], "columns": ["name", "traversal_path"]}], "limit": 10}
    security:
      org_id: 1
      paths:
        - 1/100/
    physical:
      clickhouse:
        rejected:
          phase:
            gql: validate
            json: json_dsl_parse
          contains:
            - traversal_path

