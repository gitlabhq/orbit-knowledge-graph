cases:
  - name: Property comparison referencing an undefined variable is rejected. The RHS node must be bound in the MATCH pattern.
    query:
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)
        WHERE u.username <> ghost.username
        RETURN mr.title LIMIT 10
    missing_frontends:
      json: The source scenario supplies only GQL.
    physical:
      clickhouse:
        rejected:
          phase: gql_parse
          contains:
            - undefined variable ghost
