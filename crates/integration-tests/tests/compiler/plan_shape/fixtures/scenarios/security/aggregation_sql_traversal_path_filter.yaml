---
cases:
  - name: Compiled aggregation SQL contains startsWith traversal_path filter
    query:
      gql: |
        MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10
    security:
      org_id: 1
      paths:
        - 1/100/
    physical:
      clickhouse:
        sql:
          contains:
            - startsWith
            - traversal_path
            - 1/100/
          not_contains: []
