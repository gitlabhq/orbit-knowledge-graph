cases:
  - name: Cross-node property comparisons are rejected in aggregation queries. The join predicate would reference an alias not in the outer FROM.
    query:
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)
        WHERE u.state <> mr.title
        RETURN count(mr) AS n
    missing_frontends:
      json: The source scenario supplies only GQL.
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - only supported in traversal
