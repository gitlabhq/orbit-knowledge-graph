---
cases:
  - name: Incoming containment from a pinned subgroup keeps its ancestor's scope
    query:
      gql: |
        MATCH (child:Group {id: 200})<-[:CONTAINS]-(parent:Group) RETURN parent{.id, .name}, count(parent) AS n LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - gl_edge
          not_contains: []
