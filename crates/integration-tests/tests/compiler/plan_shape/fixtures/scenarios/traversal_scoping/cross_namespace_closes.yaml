cases:
  - name: Cross-namespace CLOSES edge does not hydrate a work item outside the caller scope
    query:
      json: |
        {
            "query_type": "traversal",
            "nodes": [
                {"id": "mr", "entity": "MergeRequest", "columns": ["project_id"],
                 "filters": {"project_id": {"eq": 1000}}},
                {"id": "wi", "entity": "WorkItem"}
            ],
            "relationships": [{"type": "CLOSES", "from": "mr", "to": "wi"}],
            "limit": 50
        }
      gql: |
        MATCH (mr:MergeRequest)-[:CLOSES]->(wi:WorkItem) WHERE mr.project_id = 1000 RETURN mr.project_id, wi LIMIT 50
    security:
      org_id: 1
      paths:
        - 1/100/
    physical:
      clickhouse:
        hydrate_plan:
          hydration_plan: static
