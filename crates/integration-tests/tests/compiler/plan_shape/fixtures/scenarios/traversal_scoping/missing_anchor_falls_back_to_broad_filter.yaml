cases:
  - name: Rows of a project with no Project row are still returned; the missing anchor falls back to the authorization filter
    query:
      json: |
        {
            "query_type": "traversal",
            "nodes": [{"id": "mr", "entity": "MergeRequest", "filters": {"project_id": 5555}, "columns": ["title"]}],
            "limit": 10
        }
      gql: |
        MATCH (mr:MergeRequest {project_id: 5555}) RETURN mr.title LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        codegen:
          output:
            sql:
              contains:
                - AS _orbit_scope WHERE
                - = '0/')
              not_contains: []
