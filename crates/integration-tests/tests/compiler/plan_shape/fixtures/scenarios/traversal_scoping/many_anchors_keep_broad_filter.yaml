---
cases:
  - name: A node pinned to more than eight anchors keeps only the authorization filter
    query:
      gql: |
        MATCH (p:Project) WHERE p.id IN [1, 2, 3, 4, 5, 6, 7, 8, 9] RETURN p.name LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - startsWith(p.traversal_path, '1/')
          not_contains:
            - AS _orbit_scope
