---
cases:
  - name: Project-scoped MR-MRDiff-MRDiffFile chain returns all diff files without loss
    query:
      gql: |
        MATCH (mr:MergeRequest)-[:HAS_DIFF]->(diff:MergeRequestDiff)-[:HAS_FILE]->(df:MergeRequestDiffFile) WHERE mr.project_id = 1000 RETURN mr.project_id, diff, df LIMIT 50
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - gl_project AS _orbit_scope WHERE
          not_contains: []
