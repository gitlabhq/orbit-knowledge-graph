---
cases:
  - name: Containment over CONTAINS edges counts projects one or two hops away
    query:
      gql: |
        MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS*1..2]->(x:Project) RETURN count(x) AS c LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - AS g FINAL
            - relationship_kind = 'CONTAINS'
            - depth
          not_contains: []
