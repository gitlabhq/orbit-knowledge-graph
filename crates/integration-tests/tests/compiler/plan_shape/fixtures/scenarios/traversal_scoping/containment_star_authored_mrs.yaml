---
cases:
  - name: A star aggregation from a group through CONTAINS counts direct-project MRs per user and excludes subgroup projects
    query:
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project)<-[:IN_PROJECT]-(mr:MergeRequest)<-[:AUTHORED]-(u:User) WHERE g.full_path = 'g700' RETURN u{.id, .username}, count(mr) AS c, count(p.id) AS project_rows, count(p.created_at) AS dated_projects LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - gl_group AS _orbit_scope FINAL WHERE
            - _orbit_scope.full_path = 'g700'
            - AS g FINAL
            - relationship_kind = 'CONTAINS'
          not_contains: []
