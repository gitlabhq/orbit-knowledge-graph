---
cases:
  - name: Containment over CONTAINS edges counts only direct projects
    query:
      gql: |
        MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS]->(x:Project) RETURN count(x) AS c LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - AS g FINAL
            - relationship_kind = 'CONTAINS'
            - source_kind = 'Group'
            - target_kind = 'Project'
          not_contains: []
