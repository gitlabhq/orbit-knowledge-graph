---
cases:
  - name: A four-hop chain from a group through CONTAINS counts diff files per project
    query:
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project)<-[:IN_PROJECT]-(mr:MergeRequest)-[:HAS_LATEST_DIFF]->(d:MergeRequestDiff)-[:HAS_FILE]->(f:MergeRequestDiffFile) WHERE g.full_path = 'g701' RETURN p, count(f) AS c LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - gl_group AS _orbit_scope FINAL WHERE
            - _orbit_scope.full_path = 'g701'
            - AS g FINAL
            - relationship_kind = 'CONTAINS'
          not_contains: []
