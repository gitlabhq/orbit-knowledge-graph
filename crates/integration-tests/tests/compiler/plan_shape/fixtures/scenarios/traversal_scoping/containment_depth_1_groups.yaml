---
cases:
  - name: Containment over CONTAINS edges excludes the anchor and deeper groups
    query:
      gql: |
        MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS]->(x:Group) RETURN count(x) AS c LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - AS g FINAL
            - relationship_kind = 'CONTAINS'
            - source_kind = 'Group'
            - target_kind = 'Group'
          not_contains: []
