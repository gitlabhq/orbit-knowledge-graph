---
cases:
  - name: Containment over CONTAINS edges counts only projects two hops away
    query:
      gql: |
        MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS*2..2]->(x:Project) RETURN count(x) AS c LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - AS g FINAL
            - relationship_kind = 'CONTAINS'
            - 2 AS _orbit_depth
          not_contains: []
