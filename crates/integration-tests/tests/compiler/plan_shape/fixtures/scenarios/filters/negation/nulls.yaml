---
cases:
  - name: transform_null_in_pinned_for_not_tree
    query:
      gql: |
        MATCH (wi:WorkItem)
        WHERE wi.id >= 4000 AND wi.id <= 4010 AND NOT wi.weight IN [3]
        RETURN wi.weight LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains:
            - transform_null_in = 0
          not_contains: []

  - name: transform_null_in_absent_without_not
    query:
      gql: |
        MATCH (wi:WorkItem)
        WHERE wi.id >= 4000 AND wi.id <= 4010 AND wi.weight IN [3]
        RETURN wi.weight LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains: []
          not_contains:
            - transform_null_in

  - name: transform_null_in_absent_when_not_folds
    query:
      gql: |
        MATCH (wi:WorkItem)
        WHERE wi.id >= 4000 AND wi.id <= 4010 AND NOT wi.weight = 3
        RETURN wi.weight LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains: []
          not_contains:
            - transform_null_in
