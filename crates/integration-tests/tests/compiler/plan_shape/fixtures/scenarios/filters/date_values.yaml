      gql: |
        MATCH (n:Note {id: 3000, note: date('2024-01-15')}) RETURN n
    missing_frontends:
      json: The source scenario supplies only GQL.
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - datetime() and date() compare only with date fields
