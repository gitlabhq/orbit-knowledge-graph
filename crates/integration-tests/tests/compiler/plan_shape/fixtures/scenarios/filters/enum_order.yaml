  - name: min_rejected
    query:
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(mr:MergeRequest) RETURN p, min(mr.state) AS s
      json: |
        {"query_type": "aggregation", "nodes": [{"id": "p", "entity": "Project", "node_ids": [1000]}, {"id": "mr", "entity": "MergeRequest"}], "relationships": [{"type": "IN_PROJECT", "from": "mr", "to": "p"}], "group_by": ["p"], "aggregations": [{"min": "mr.state", "as": "s"}]}
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - because enum values have no order

