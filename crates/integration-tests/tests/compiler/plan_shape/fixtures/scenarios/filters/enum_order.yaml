cases:
  - name: greater_than_rejected
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 2000}) WHERE mr.state > 'opened' RETURN mr
      json: |
        {"query_type": "traversal", "nodes": [{"id": "mr", "entity": "MergeRequest", "node_ids": [2000], "filters": {"state": {"gt": 1}}}]}
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
            - enum values have no order

  - name: greater_or_equal_rejected
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 2000}) WHERE mr.state >= 3 RETURN mr
      json: |
