        MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project) WHERE g.visibility_level < p.visibility_level RETURN p
    missing_frontends:
      json: The source scenario supplies only GQL.
    physical:
      clickhouse:
        rejected:
          phase: validate
          contains:
