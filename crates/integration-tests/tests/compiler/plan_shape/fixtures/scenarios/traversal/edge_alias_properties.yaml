---
cases:
  - name: A node aliased like a generated edge column keeps its properties
    query:
      gql: |
        MATCH (e0:User {id: 1})-[:AUTHORED]->(mr:MergeRequest) RETURN e0.username, mr.title LIMIT 20
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains: []
          not_contains:
            - AS e0_type
            - AS e0_src
