cases:
  - name: nullable_and_missing_fk_targets_do_not_emit_edges
    query:
      gql: |
        MATCH (mr:MergeRequest)-[:HAS_HEAD_PIPELINE]->(p:Pipeline)
        WHERE mr.id >= 2200 AND mr.id <= 2202
        RETURN mr, p LIMIT 10
    security:
      org_id: 1
      paths:
        - 1/
    physical:
      clickhouse:
        codegen:
          output:
            sql:
              contains:
                - head_pipeline_id IN (SELECT id FROM _orbit_relation_
              not_contains: []
    missing_frontends:
      json: The original query scenario supplies only GQL.

  - name: wrong_kind_and_missing_namespace_targets_do_not_emit_groups
    query:
      gql: |
        MATCH (w:WorkItem)-[:IN_GROUP]->(g:Group)
        WHERE w.id >= 4100 AND w.id <= 4102
        RETURN w, g LIMIT 10
    security:
      org_id: 1
      paths:
        - 1/
    physical:
      clickhouse:
        codegen:
          output:
            sql:
              contains:
                - namespace_id IN (SELECT id FROM _orbit_relation_
              not_contains: []
    missing_frontends:
      json: The original query scenario supplies only GQL.
