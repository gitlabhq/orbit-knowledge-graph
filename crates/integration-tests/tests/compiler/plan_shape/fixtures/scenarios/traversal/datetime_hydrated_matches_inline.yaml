---
cases:
  - name: Hydrated datetime renders in the same ISO 8601 UTC form as the inline path
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 2000})-[:HAS_NOTE]->(n:Note) WHERE n.id >= 1 AND n.id <= 10000 RETURN n.created_at LIMIT 10
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        sql:
          contains: []
          not_contains:
            - AS n_created_at
        hydration: static
