cases:
  - name: "A filter on a relationship backed by a foreign key keeps the edge scan and excludes rows. The filter on the edge's source_id removes merge request 2000.\n"
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"p","entity":"Project","node_ids":[1000],"columns":["name"]},{"id":"mr","entity":"MergeRequest","columns":["title"]}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p","filters":{"source_id":{"ne":2000}}}],"limit":20}
      gql: |
        MATCH (p:Project {id: 1000})<-[r:IN_PROJECT]-(mr:MergeRequest)
        WHERE r.source_id <> 2000
        RETURN p.name, mr.title LIMIT 20
    security:
      paths:
        - 1/
    physical:
      clickhouse:
        codegen:
          output:
            sql:
              contains:
                - source_id != 2000
              not_contains: []
