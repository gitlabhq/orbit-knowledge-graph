cases:
  - name: Projected endpoints hydrate from one edge relation
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[2000],"columns":["title"]},{"id":"p","entity":"Project","columns":["name"]}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"}]}
      gql: |
        MATCH (mr:MergeRequest {id: 2000})-[:IN_PROJECT]->(p:Project)
        RETURN mr.title, p.name
    logical:
      expect: ["(EdgeScan IN_PROJECT mr->p AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter mr.id = 2000, ... (_))
            - (Project mr.id AS e0_src, mr.project_id AS e0_dst, ... (_))
            - (Deduplicate LimitBy ... (_))
            - (Scan Table(gl_merge_request) AS mr)
            - (Project p.id AS id (Filter p._deleted = false (Deduplicate Final (Scan Table(gl_project) AS p))))
          reject: ["(Scan Table(gl_edge) ...)"]

  - name: A fixed chain composes routed edge relations
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"alice"},"columns":["id"]},{"id":"mr","entity":"MergeRequest","columns":["id"]},{"id":"pipe","entity":"Pipeline","columns":["id"]},{"id":"j","entity":"Job","filters":{"status":"failed"},"columns":["id"]}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr"},{"type":"HAS_HEAD_PIPELINE","from":"mr","to":"pipe"},{"type":"HAS_JOB","from":"pipe","to":"j"}]}
      gql: |
        MATCH (u:User {username: 'alice'})-[:AUTHORED]->(mr:MergeRequest)
          -[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)-[:HAS_JOB]->(j:Job {status: 'failed'})
        RETURN u.id, mr.id, pipe.id, j.id
    logical:
      expect: ["(EdgeScan AUTHORED u->mr AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON u.id = mr.author_id (_) (_))
            - (Join ON j.pipeline_id = mr.head_pipeline_id (_) (_))
            - (Scan Table(gl_merge_request) AS mr)
            - (Scan Table(gl_job) AS j)

  - name: Stored relationship families compose through shared endpoints
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1],"columns":["username"]},{"id":"mr","entity":"MergeRequest","columns":["title"]},{"id":"p","entity":"Project","columns":["name"]}],"relationships":[{"type":"APPROVED","from":"u","to":"mr"},{"type":"IN_PROJECT","from":"mr","to":"p"}]}
      gql: |
        MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
        RETURN u.username, mr.title, p.name
    logical:
      expect: ["(EdgeScan APPROVED u->mr AS e0)", "(EdgeScan IN_PROJECT mr->p AS e1)"]
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $ids (Distinct (Project _id_source.target_id AS id (_))))
          expect:
            - (Join ON mr.id = _orbit_edge_0.target_id (_) (_))
            - (Scan Table(gl_edge) AS _orbit_edge_0)
            - (Scan Table(gl_merge_request) AS mr)
            - (Filter mr.id IN $ids.id, ... (_))

  - name: Relationship filters remain on their edge relation
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","columns":["id"]},{"id":"pipe","entity":"Pipeline","columns":["id"]},{"id":"j","entity":"Job","columns":["id"]}],"relationships":[{"type":"HAS_HEAD_PIPELINE","from":"mr","to":"pipe","filters":{"target_id":1}},{"type":"HAS_JOB","from":"pipe","to":"j"}]}
      gql: |
        MATCH (mr:MergeRequest)-[:HAS_HEAD_PIPELINE {target_id: 1}]->(pipe:Pipeline)-[:HAS_JOB]->(j:Job)
        RETURN mr.id, pipe.id, j.id
    logical:
      expect: ["(Filter e0.target_id = 1 (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_0.target_id = 1, ... (Deduplicate LimitBy ... (_)))
            - (Scan Table(gl_job) AS j)

  - name: FK endpoints narrow current holder rows
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"pl","entity":"Pipeline","node_ids":[1000]},{"id":"j","entity":"Job"}],"relationships":[{"type":"HAS_JOB","from":"pl","to":"j"}],"group_by":["j.status"],"aggregations":[{"count":"j","as":"n"}]}
      gql: |
        MATCH (pl:Pipeline {id: 1000})-[:HAS_JOB]->(j:Job)
        RETURN j.status, count(j) AS n
    logical:
      expect: ["(Aggregate group j.status AS j_status, COUNT(j) AS n (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Project j.traversal_path AS traversal_path, j.id AS id (Filter j.pipeline_id = 1000, ... (Scan Table(gl_job) AS j)))
            - (Deduplicate LimitBy j.traversal_path, j.id (Filter (j.traversal_path, j.id) IN ?.(traversal_path, id) (Scan Table(gl_job) AS j)))
          reject: ["(Deduplicate Final (Scan Table(gl_job) AS j))"]
