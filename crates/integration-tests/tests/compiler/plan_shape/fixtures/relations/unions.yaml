cases:
  - name: Multi-table alternatives expose one typed stored relation
    query: |
      MATCH (a:Pipeline {id: 99000})-[r:CHILD_OF|AUTO_CANCELED_BY]->(b:Pipeline)
      RETURN a, b, type(r)
    logical:
      expect:
        - "(Select a, b, type(e0) AS type(r) (Follow CHILD_OF|AUTO_CANCELED_BY a->b AS e0 (Filter a.id = 99000 (Entities Pipeline AS a))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Deduplicate LimitBy ... (_))
            - (Scan Table(gl_ci_edge) AS _orbit_edge_0)
            - (Project _orbit_edge_0.relationship_kind AS _orbit_e0_kind, ... (_))
