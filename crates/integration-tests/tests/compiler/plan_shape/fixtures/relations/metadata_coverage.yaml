cases:
- name: Uncovered endpoint filters join current node rows
  query:
    json: |
      {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[2000],"columns":["title"]},{"id":"p","entity":"Project","filters":{"full_path":"gitlab-org/orbit"},"columns":["name"]}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"}]}
    gql: |
      MATCH (mr:MergeRequest {id: 2000})-[:IN_PROJECT]->(p:Project {full_path: 'gitlab-org/orbit'})
      RETURN mr.title, p.name
  logical:
    expect: ["(Filter p.full_path = 'gitlab-org/orbit' (_))"]
  physical:
    clickhouse:
      planned:
        expect:
        - (Join ON p.id = _orbit_edge_0.target_id (_) (Bind p (Filter p.full_path = 'gitlab-org/orbit', p._deleted = false (Deduplicate Final (Scan Table(gl_project) AS p)))))
- name: Filtered aggregation endpoints join current node rows
  query:
    json: |
      {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","filters":{"username":"alice"}},{"id":"mr","entity":"MergeRequest","node_ids":[2000]}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr"}],"aggregations":[{"count":"mr","as":"n"}]}
    gql: |
      MATCH (u:User {username: 'alice'})-[:AUTHORED]->(mr:MergeRequest {id: 2000})
      RETURN count(mr) AS n
  logical:
    expect: ["(Aggregate COUNT(mr) AS n (_))"]
  physical:
    clickhouse:
      planned:
        expect:
        - (Join ON u.id = _orbit_edge_0.source_id (_) (Bind u (Filter u.username = 'alice', u._deleted = false (Deduplicate Final (Scan Table(gl_user) AS u)))))
        - (Scan Table(gl_edge) AS _orbit_edge_0)
- name: Exact edge metadata avoids current node reads
  query:
    json: |
      {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","filters":{"state":"merged"},"columns":["title"]},{"id":"p","entity":"Project","columns":["name"]}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"}]}
    gql: |
      MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
      RETURN mr.title, p.name
  logical:
    expect: ["(Filter mr.state = 'merged' (_))"]
  physical:
    clickhouse:
      planned:
        expect:
        - (Filter _orbit_edge_0.source_tags HAS ANY ['state:merged'], ... (Deduplicate Final (Scan Table(gl_edge) AS _orbit_edge_0)))
        reject:
        - (Scan Table(gl_merge_request) ...)
- name: Uncovered numeric filters join current node rows
  query:
    json: |
      {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","columns":["title"]},{"id":"p","entity":"Project","filters":{"star_count":1},"columns":["name"]}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"}]}
    gql: |
      MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {star_count: 1})
      RETURN mr.title, p.name
  logical:
    expect: ["(Filter p.star_count = 1 (_))"]
  physical:
    clickhouse:
      planned:
        expect:
        - (Filter p.star_count = 1, p._deleted = false (Deduplicate Final (Scan Table(gl_project) AS p)))
