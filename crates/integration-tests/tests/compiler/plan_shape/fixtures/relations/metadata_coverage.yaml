cases:
  - name: Uncovered endpoint filters join current node rows
    query: |
      MATCH (mr:MergeRequest {id: 2000})-[:IN_PROJECT]->(p:Project {full_path: 'gitlab-org/orbit'})
      RETURN mr.title, p.name
    logical:
      expect:
        - "(Filter p.full_path = 'gitlab-org/orbit' (Follow IN_PROJECT mr->p AS e0 (Filter ... (Entities MergeRequest AS mr))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON p.id = mr.project_id (_) (Filter p.full_path = 'gitlab-org/orbit', p._deleted = false (Bind p (Project * (Deduplicate Final (Scan Table(gl_project) AS p))))))

  - name: Filtered aggregation endpoints use exact reusable keys
    query: |
      MATCH (u:User {username: 'alice'})-[:AUTHORED]->(mr:MergeRequest {id: 2000})
      RETURN count(mr) AS n
    logical:
      expect:
        - "(Aggregate COUNT(mr) AS n (Filter ... (Follow AUTHORED u->mr AS e0 (Filter u.username = 'alice' (Entities User AS u)))))"
    physical:
      clickhouse:
        planned:
          bind:
            - (Bind $users (Project u.id AS id (Filter u.username = 'alice', ... (Bind u (Deduplicate LimitBy ... (_))))))
          expect:
            - (Filter mr.author_id IN $users.id, ... (_))
            - (Scan Table(gl_merge_request) AS mr)

  - name: FK holder filters use the current holder row
    query: |
      MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
      RETURN mr.title, p.name
    logical:
      expect:
        - "(Follow IN_PROJECT mr->p AS e0 (Filter mr.state = 'merged' (Entities MergeRequest AS mr)))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter mr.state = 'merged', mr._deleted = false, ... (Bind mr (Project * (Deduplicate Final (Scan Table(gl_merge_request) AS mr)))))
            - (Project _orbit_id_source.project_id AS id (Scan Share(?) AS _orbit_id_source))
            - (Filter p.id IN ?.id (_))
          reject:
            - (Scan Table(gl_edge) ...)
            - (Deduplicate Final (Scan Table(gl_project) AS p))

  - name: Uncovered numeric filters join current node rows
    query: |
      MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {star_count: 1})
      RETURN mr.title, p.name
    logical:
      expect:
        - "(Filter p.star_count = 1 (Follow IN_PROJECT mr->p AS e0 (Entities MergeRequest AS mr)))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter p.star_count = 1, p._deleted = false (Bind p (Project * (Deduplicate Final (Scan Table(gl_project) AS p)))))

  - name: Low-cardinality endpoint filters do not create candidate relations
    query: |
      MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition {definition_type: 'function'})-[:CALLS]->(c:Definition)
      RETURN a.id, b.id, c.id
    logical:
      expect:
        - "(Follow CALLS b->c AS e1 (Filter b.definition_type = 'function' (Follow CALLS a->b AS e0 (Filter ... (Entities Definition AS a)))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ArrayContains(_orbit_edge_0.target_tags, 'definition_type:function'), ... (_))
          reject:
            - (CTE ? (Project b.id AS id (_)))
            - (Bind ? (Project b.id AS id (_)))
