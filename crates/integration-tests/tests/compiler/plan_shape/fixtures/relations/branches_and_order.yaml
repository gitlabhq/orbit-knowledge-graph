cases:
  - name: A branch joins edge relations through the shared occurrence
    query: |
      MATCH (mr:MergeRequest {id: 2000})-[:IN_PROJECT]->(p:Project),
        (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)-[:HAS_JOB]->(j:Job)
      RETURN mr.title, p.name, pipe.status, j.name
    logical:
      expect:
        - "(Follow HAS_JOB pipe->j AS e2 (Follow HAS_HEAD_PIPELINE mr->pipe AS e1 (Follow IN_PROJECT mr->p AS e0 (Filter ... (Entities MergeRequest AS mr)))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON j.pipeline_id = mr.head_pipeline_id (_) (_))
            - (Scan Table(gl_merge_request) AS mr)
            - (Scan Table(gl_job) AS j)

  - name: Node-backed relations reuse their shared source row
    query: |
      MATCH (mr:MergeRequest {id: 2000})-[:IN_PROJECT]->(p:Project),
        (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)
      RETURN mr.title, p.id, pipe.id
    logical:
      expect:
        - "(Follow HAS_HEAD_PIPELINE mr->pipe AS e1 (Follow IN_PROJECT mr->p AS e0 (Filter ... (Entities MergeRequest AS mr))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Project mr.project_id AS _orbit_e0_dst, mr.head_pipeline_id AS _orbit_e1_dst, ... (_))
          occurrences:
            - pattern: (Scan Table(gl_merge_request) AS mr)
              count: 1

  - name: A mixed table branch keeps one edge relation per relationship
    query: |
      MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest),
        (mr)-[:IN_PROJECT]->(p:Project), (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)
      RETURN u.username, mr.title, p.name, pipe.status
    logical:
      expect:
        - "(Follow HAS_HEAD_PIPELINE mr->pipe AS e2 (Follow IN_PROJECT mr->p AS e1 (Follow APPROVED u->mr AS e0 (Filter ... (Entities User AS u)))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON mr.id = _orbit_edge_0.target_id (_) (_))
            - (Scan Table(gl_edge) AS _orbit_edge_0)
            - (Scan Table(gl_merge_request) AS mr)

  - name: Convergent stored relations keep selective reads inline
    query: |
      MATCH (a:Definition {id: 1})-[:CALLS]->(c:Definition)<-[:CALLS]-(b:Definition {id: 2})
      RETURN a.id, b.id, c.id
    logical:
      expect:
        - "(Filter b.id = 2 (Follow CALLS c<-b AS e1 (Follow CALLS a->c AS e0 (Filter a.id = 1 (Entities Definition AS a)))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON _orbit_edge_0.target_id = _orbit_edge_1.target_id (_) (_))
            - (Filter _orbit_edge_0._deleted = false (Bind _orbit_edge_0 (Deduplicate LimitBy ... (Sort _orbit_edge_0.traversal_path, _orbit_edge_0.relationship_kind, _orbit_edge_0.project_id, _orbit_edge_0.branch, _orbit_edge_0.source_id, _orbit_edge_0.target_id, _orbit_edge_0.source_kind, _orbit_edge_0.target_kind, _orbit_edge_0._version DESC (Project * (Filter _orbit_edge_0.source_id = 1, ... (_)))))))
            - (Filter _orbit_edge_1._deleted = false (Bind _orbit_edge_1 (Deduplicate LimitBy ... (Sort _orbit_edge_1.traversal_path, _orbit_edge_1.relationship_kind, _orbit_edge_1.project_id, _orbit_edge_1.branch, _orbit_edge_1.source_id, _orbit_edge_1.target_id, _orbit_edge_1.source_kind, _orbit_edge_1.target_kind, _orbit_edge_1._version DESC (Project * (Filter _orbit_edge_1.source_id = 2, ... (_)))))))
          reject:
            - (CTE ? (Deduplicate Final (Scan Table(gl_code_edge) ...)))
          occurrences:
            - pattern: (Scan Table(gl_code_edge) ...)
              count: 2

  - name: Incoming code-edge branches join on the stored endpoints of the shared node
    query: |
      MATCH (a:Definition {id: 1})<-[:CALLS]-(b:Definition), (b)<-[:CALLS]-(c:Definition), (a)<-[:CALLS]-(d:Definition) RETURN a, b, c, d
    logical:
      expect:
        - "(Follow CALLS a<-d AS e2 (Follow CALLS b<-c AS e1 (Follow CALLS a<-b AS e0 (Filter a.id = 1 (Entities Definition AS a)))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON _orbit_edge_0.source_id = _orbit_edge_1.target_id (Join ON _orbit_edge_0.target_id = _orbit_edge_2.target_id (_) (_)) (_))
            - (Filter _orbit_edge_0._deleted = false (Bind _orbit_edge_0 (Deduplicate LimitBy ... (Sort _orbit_edge_0.traversal_path, _orbit_edge_0.relationship_kind, _orbit_edge_0.project_id, _orbit_edge_0.branch, _orbit_edge_0.source_id, _orbit_edge_0.target_id, _orbit_edge_0.source_kind, _orbit_edge_0.target_kind, _orbit_edge_0._version DESC (Project * (Filter _orbit_edge_0.target_id = 1, ... (_)))))))
            - (Filter _orbit_edge_1.target_id IN ?.id, ... (_))
