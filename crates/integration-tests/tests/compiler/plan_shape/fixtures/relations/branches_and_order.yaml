cases:
  - name: A branch joins edge relations through the shared occurrence
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 2000})-[:IN_PROJECT]->(p:Project),
          (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)-[:HAS_JOB]->(j:Job)
        RETURN mr.title, p.name, pipe.status, j.name
    logical:
      expect: ["(EdgeScan IN_PROJECT mr->p AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON j.pipeline_id = mr.head_pipeline_id (_) (_))
            - (Scan Table(gl_merge_request) AS mr)
            - (Scan Table(gl_job) AS j)

  - name: Node-backed relations reuse their shared source row
    query:
      gql: |
        MATCH (mr:MergeRequest {id: 2000})-[:IN_PROJECT]->(p:Project),
          (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)
        RETURN mr.title, p.id, pipe.id
    logical:
      expect: ["(EdgeScan IN_PROJECT mr->p AS e0)", "(EdgeScan HAS_HEAD_PIPELINE mr->pipe AS e1)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Project mr.project_id AS e0_dst, mr.head_pipeline_id AS e1_dst, ... (_))
          occurrences:
            - pattern: (Scan Table(gl_merge_request) AS mr)
              count: 1

  - name: A mixed table branch keeps one edge relation per relationship
    query:
      gql: |
        MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest),
          (mr)-[:IN_PROJECT]->(p:Project), (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)
        RETURN u.username, mr.title, p.name, pipe.status
    logical:
      expect: ["(EdgeScan APPROVED u->mr AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON mr.id = _orbit_edge_0.target_id (_) (_))
            - (Scan Table(gl_edge) AS _orbit_edge_0)
            - (Scan Table(gl_merge_request) AS mr)

  - name: Convergent stored relations keep selective reads inline
    query:
      gql: |
        MATCH (a:Definition {id: 1})-[:CALLS]->(c:Definition)<-[:CALLS]-(b:Definition {id: 2})
        RETURN a.id, b.id, c.id
    logical:
      expect: ["(EdgeScan CALLS a->c AS e0)", "(EdgeScan CALLS b->c AS e1)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON _orbit_edge_0.target_id = _orbit_edge_1.target_id (_) (_))
            - (Filter _orbit_edge_0._deleted = false (Deduplicate LimitBy ... (Filter _orbit_edge_0.source_id = 1, ... (_))))
            - (Filter _orbit_edge_1._deleted = false (Deduplicate LimitBy ... (Filter _orbit_edge_1.source_id = 2, ... (_))))
          reject:
            - (CTE ? (Deduplicate Final (Scan Table(gl_code_edge) ...)))
          occurrences:
            - pattern: (Scan Table(gl_code_edge) ...)
              count: 2

  - name: Incoming code-edge branches join on the stored endpoints of the shared node
    missing_frontends:
      gql: GQL normalizes incoming arrows into outgoing edges and reorders hops, so it plans a different join.
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition"},{"id":"c","entity":"Definition"},{"id":"d","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b","direction":"incoming"},{"type":"CALLS","from":"b","to":"c","direction":"incoming"},{"type":"CALLS","from":"a","to":"d","direction":"incoming"}]}
    logical:
      expect: ["(EdgeScan CALLS b->a AS e0)", "(EdgeScan CALLS c->b AS e1)", "(EdgeScan CALLS d->a AS e2)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON _orbit_edge_0.source_id = _orbit_edge_1.target_id (Join ON _orbit_edge_0.target_id = _orbit_edge_2.target_id (_) (_)) (_))
            - (Filter _orbit_edge_0._deleted = false (Deduplicate LimitBy ... (Filter _orbit_edge_0.target_id = 1, ... (_))))
            - (Filter _orbit_edge_1.target_id IN ?.id, ... (_))
