name: Unselective chains join edge reads without id sets or candidate rescans

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","filters":{"definition_type":"Function"}},{"id":"b","entity":"Definition"},{"id":"c","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"},{"type":"CALLS","from":"b","to":"c"}]}
  gql: |
    MATCH (a:Definition {definition_type: 'Function'})-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition) RETURN a, b, c

physical:
  clickhouse:
    normalize:
      input:
        expect: ["(EdgeScan CALLS b->c AS e1)"]
    plan_clickhouse:
      query_plan:
        ctes:
          absent: true
        expect: ["(Join ON _orbit_edge_0.target_id = _orbit_edge_1.source_id (_) (_))"]
        reject: ["(Filter _orbit_edge_1.source_id IN ?.id (_))"]
    response_policy:
      node:
        ctes:
          absent: true
        occurrences:
          - { pattern: "(Scan Table(gl_code_edge) ...)", count: 2 }
