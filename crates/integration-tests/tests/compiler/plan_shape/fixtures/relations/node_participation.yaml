cases:
- name: Stored aggregation filters an endpoint with an exact semi-join
  query:
    json: |
      {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest","filters":{"title":{"starts_with":"Fix"}}}],"relationships":[{"type":"APPROVED","from":"u","to":"mr"}],"aggregations":[{"count":"mr","as":"n"}]}
    gql: |
      MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest)
      WHERE mr.title STARTS WITH 'Fix'
      RETURN count(mr) AS n
  logical:
    expect: ["(Aggregate COUNT(mr) AS n (_))"]
  physical:
    clickhouse:
      planned:
        expect:
        - (SemiJoin _orbit_edge_0.target_id IN subquery (_) (Project mr.id AS id (Filter starts_with(mr.title, 'Fix'), mr._deleted = false (Deduplicate Final (Scan Table(gl_merge_request) AS mr)))))
        reject: ["(CTE ... (_))"]
- name: FK endpoint IDs and ranges remain visible on the current node join
  query:
    json: |
      {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","columns":["title"]},{"id":"p","entity":"Project","node_ids":[1000,1001],"id_range":{"start":1000,"end":1001},"columns":["name"]}],"relationships":[{"type":"IN_PROJECT","from":"mr","to":"p"}]}
    gql: |
      MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
      WHERE p.id IN [1000, 1001] AND p.id >= 1000 AND p.id <= 1001
      RETURN mr.title, p.name
  logical:
    expect: ["(Filter p.id IN [1000, 1001], p.id >= 1000, p.id <= 1001 (_))"]
  physical:
    clickhouse:
      planned:
        expect:
        - (Join ON mr.project_id = p.id (_) (Bind p (Filter p.id IN [1000, 1001], p.id >= 1000, p.id <= 1001, ... (_))))
        reject: ["(Scan Table(gl_edge) ...)"]
- name: Nullable aggregate properties retain current node rows and arguments
  query:
    json: |
      {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"}],"relationships":[{"type":"APPROVED","from":"u","to":"mr"}],"aggregations":[{"count":"mr.merged_at","as":"n"}]}
    gql: |
      MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest)
      RETURN count(mr.merged_at) AS n
  logical:
    expect: ["(Aggregate COUNT(mr.merged_at) AS n (_))"]
  physical:
    clickhouse:
      planned:
        expect:
        - (Join ON mr.id = _orbit_edge_0.target_id (_) (Bind mr (_)))
        - (Aggregate COUNT(mr.merged_at) FILTER ? AS n (_))
