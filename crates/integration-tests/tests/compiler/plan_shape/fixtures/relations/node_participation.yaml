cases:
  - name: Stored aggregation uses exact keys for an uncovered endpoint filter
    query: |
      MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest)
      WHERE mr.title STARTS WITH 'Fix'
      RETURN count(mr) AS n
    logical:
      expect:
        - "(Aggregate COUNT(mr) AS n (Filter starts_with(mr.title, 'Fix') (Follow APPROVED u->mr AS e0 (Filter ... (Entities User AS u)))))"
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $mrs (Project mr.id AS id (Filter StartsWith(Lower(mr.title), Lower('Fix')), ... (Bind mr (Project * (Deduplicate Final (_)))))))
          expect:
            - (Filter _orbit_edge_0.target_id IN $mrs.id, ... (_))

  - name: Endpoint IDs and ranges remain visible on the edge relation
    query: |
      MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
      WHERE p.id IN [1000, 1001] AND p.id >= 1000 AND p.id <= 1001
      RETURN mr.title, p.name
    logical:
      expect:
        - "(Filter p.id IN [1000, 1001], p.id >= 1000, p.id <= 1001 (Follow IN_PROJECT mr->p AS e0 (Entities MergeRequest AS mr)))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter mr.project_id IN [1000, 1001], mr.project_id >= 1000, mr.project_id <= 1001, ... (_))
            - (Scan Table(gl_merge_request) AS mr)

  - name: Every id equality and IN list intersects into the pins and every id bound joins the range
    query: |
      MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
      WHERE p.id IN [1000, 1001, 1002] AND p.id IN [1001, 1002] AND p.id > 999 AND p.id <= 2000 AND p.id < 1500 AND p.id <> 1002
      RETURN mr.title, p.name
    logical:
      expect:
        - "(Filter ... (Follow IN_PROJECT mr->p AS e0 (Entities MergeRequest AS mr)))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter mr.project_id IN [1001, 1002], mr.project_id >= 1000, mr.project_id <= 1499, ... (_))

  - name: Nullable aggregate properties retain current node rows and arguments
    query: |
      MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest)
      RETURN count(mr.merged_at) AS n
    logical:
      expect:
        - "(Aggregate COUNT(mr.merged_at) AS n (Follow APPROVED u->mr AS e0 (Filter ... (Entities User AS u))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Join ON mr.id = _orbit_edge_0.target_id (_) (Filter mr._deleted = false (Bind mr (_))))
            - (Aggregate COUNT(NullIf(mr.merged_at, '1970-01-01 00:00:00')) FILTER ? AS n (_))
