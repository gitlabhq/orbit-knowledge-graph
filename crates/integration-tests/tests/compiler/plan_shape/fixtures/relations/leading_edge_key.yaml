name: A reached ID set on a later hop filters below its latest-row pick

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"g","entity":"Group"},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"},{"type":"CONTAINS","from":"g","to":"p"}]}
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project) RETURN u, g, p

logical:
  expect: ["(EdgeScan CONTAINS g->p AS e1)"]

physical:
  clickhouse:
    planned:
      expect:
        - (Bind _orbit_edge_1 (Filter _orbit_edge_1._deleted = false (Deduplicate LimitBy ... (Filter _orbit_edge_1.source_id IN ?.id, ... (Scan Table(gl_edge) AS _orbit_edge_1)))))
      reject:
        - (Filter _orbit_edge_1.source_id IN ?.id, ... (Filter _orbit_edge_1._deleted = false (_)))
        - (Deduplicate Final (Scan Table(gl_edge) AS _orbit_edge_1))
    emitted:
      expect:
        - (Deduplicate LimitBy ... (Sort ... (Project * (Filter _orbit_edge_1.source_id IN ?.id, ... (Scan Table(gl_edge) AS _orbit_edge_1)))))
