cases:
  - name: A selective single-node search finds then checks without a join
    query: |
      MATCH (u:User {username: 'admin'}) RETURN u.username LIMIT 10
    logical:
      expect:
        - "(Limit 10 (Select u{username} (Filter u.username = 'admin' (Entities User AS u))))"
    physical:
      clickhouse:
        planned:
          bind:
            - (Bind $candidates (Project u.id AS id (Filter u.username = 'admin', ... (Scan Table(gl_user) AS u))))
          expect:
            - (Filter u.username = 'admin', Lower(u.username) = Lower('admin'), u._deleted = false (Bind u (Deduplicate LimitBy 1 BY u.id (Sort u.id, u._version DESC (Project * (Filter u.id IN $candidates.id (Scan Table(gl_user) AS u)))))))
          reject: ["(Join ... (_) (_))", "(SemiJoin ... (_) (_))"]
        emitted:
          expect: ["(Limit 11 (_))", "(Filter u.id IN ?.id (Scan Table(gl_user) AS u))"]
          reject: ["(Join ... (_) (_))", "(SemiJoin ... (_) (_))"]

  - name: A multi-filter ordered single-node search keeps one node read without a join
    query: |
      MATCH (u:User)
      WHERE u.username STARTS WITH 'admin' AND u.state IN ['active', 'blocked'] AND u.created_at >= '2024-01-01'
      RETURN u.username, u.state, u.created_at ORDER BY u.created_at DESC LIMIT 50
    logical:
      expect:
        - "(Limit 50 (Select u{username, state, created_at} (Sort u.created_at DESC (Filter starts_with(u.username, 'admin'), u.state IN ['active', 'blocked'], u.created_at >= '2024-01-01' (Entities User AS u)))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Deduplicate LimitBy 1 BY u.id (Sort u.id, u._version DESC (Project * (Filter u.id IN ?.id, ... (Scan Table(gl_user) AS u)))))
          reject: ["(Join ... (_) (_))", "(SemiJoin ... (_) (_))"]
        emitted:
          expect: ["(Limit 51 (_))", "(Sort NullIf(u.created_at, '1970-01-01 00:00:00') DESC (_))"]
          reject: ["(Join ... (_) (_))", "(SemiJoin ... (_) (_))"]
