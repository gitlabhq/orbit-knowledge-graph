cases:
  - name: A unique-column point lookup is recomputed inline at each use
    query: |
      MATCH (u:User {username: 'alice'})-[:AUTHORED]->(mr:MergeRequest), (u)-[:APPROVED]->(mr2:MergeRequest)
      RETURN u, mr, mr2
    logical:
      expect:
        - "(Follow APPROVED u->mr2 AS e1 (Follow AUTHORED u->mr AS e0 (Filter u.username = 'alice' (Entities User AS u))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter u.username = 'alice', ... (Bind u (Deduplicate LimitBy 1 BY u.id (_))))
          occurrences:
            - { pattern: "(Deduplicate LimitBy 1 BY u.id (_))", count: 2 }
          reject:
            - (CTE ? (Project * (Filter u.username = 'alice', ... (Bind u (Deduplicate LimitBy 1 BY u.id (_))))))

  - name: A non-unique selective lookup is materialized once and reused
    query: |
      MATCH (u:User {name: 'Alice'})-[:AUTHORED]->(mr:MergeRequest), (u)-[:APPROVED]->(mr2:MergeRequest)
      RETURN u, mr, mr2
    logical:
      expect:
        - "(Follow APPROVED u->mr2 AS e1 (Follow AUTHORED u->mr AS e0 (Filter u.name = 'Alice' (Entities User AS u))))"
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $users (Project * (Filter u.name = 'Alice', ... (Bind u (Deduplicate LimitBy 1 BY u.id (_))))))
          occurrences:
            - { pattern: "(Deduplicate LimitBy 1 BY u.id (_))", count: 1 }
