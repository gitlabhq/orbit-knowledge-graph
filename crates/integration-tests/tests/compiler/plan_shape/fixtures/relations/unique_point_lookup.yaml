cases:
  - name: A unique-column point lookup read twice is shared once
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"alice"}},{"id":"mr","entity":"MergeRequest"},{"id":"mr2","entity":"MergeRequest"}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr"},{"type":"APPROVED","from":"u","to":"mr2"}]}
      gql: |
        MATCH (u:User {username: 'alice'})-[:AUTHORED]->(mr:MergeRequest), (u)-[:APPROVED]->(mr2:MergeRequest)
        RETURN u, mr, mr2
    logical:
      expect:
        - "(Follow APPROVED u->mr2 AS e1 (Follow AUTHORED u->mr AS e0 (Filter u.username = 'alice' (Entities User AS u))))"
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $users (Project * (Filter u.username = 'alice', ... (Bind u (Deduplicate LimitBy 1 BY u.id (_))))))
          occurrences:
            - { pattern: "(Deduplicate LimitBy 1 BY u.id (_))", count: 1 }

  - name: A non-unique selective lookup is materialized once and reused
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"name":"Alice"}},{"id":"mr","entity":"MergeRequest"},{"id":"mr2","entity":"MergeRequest"}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr"},{"type":"APPROVED","from":"u","to":"mr2"}]}
      gql: |
        MATCH (u:User {name: 'Alice'})-[:AUTHORED]->(mr:MergeRequest), (u)-[:APPROVED]->(mr2:MergeRequest)
        RETURN u, mr, mr2
    logical:
      expect:
        - "(Follow APPROVED u->mr2 AS e1 (Follow AUTHORED u->mr AS e0 (Filter u.name = 'Alice' (Entities User AS u))))"
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $users (Project * (Filter u.name = 'Alice', ... (Bind u (Deduplicate LimitBy 1 BY u.id (_))))))
          occurrences:
            - { pattern: "(Deduplicate LimitBy 1 BY u.id (_))", count: 1 }
