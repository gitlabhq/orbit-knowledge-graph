name: A convergent filter-only aggregation reads each edge table once

query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"a","entity":"Definition","filters":{"name":"compile"}},{"id":"b","entity":"Definition"},{"id":"c","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"c"},{"type":"CALLS","from":"b","to":"c"}],"group_by":["c.name"],"aggregations":[{"count":"a","as":"n"}]}
  gql: |
    MATCH (a:Definition {name: 'compile'})-[:CALLS]->(c:Definition)<-[:CALLS]-(b:Definition) RETURN c.name, count(a) AS n

logical:
  expect: ["(EdgeScan CALLS b->c AS e1)"]

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON _orbit_edge_0.target_id = _orbit_edge_1.target_id (_) (_))
        - (Filter c.id IN ?.id (Scan Table(gl_definition) AS c))
      occurrences:
        - { pattern: "(Scan Table(gl_code_edge) ...)", count: 2 }
        - { pattern: "(Scan Table(gl_definition) ...)", count: 2 }
      reject:
        - (Project ?.target_id AS id (Bind ? (Filter ... (_))))
    emitted:
      occurrences:
        - { pattern: "(Scan Table(gl_code_edge) ...)", count: 2 }
