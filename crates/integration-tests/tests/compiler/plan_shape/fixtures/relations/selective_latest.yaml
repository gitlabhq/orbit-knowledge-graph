cases:
  - name: A selective filter on a changing column reads once with FINAL and checks after the merge
    query:
      gql: |
        MATCH (mr:MergeRequest {source_branch: 'feature-x'}) RETURN mr.id, mr.title LIMIT 10
    logical:
      expect: ["(Filter mr.source_branch = 'feature-x' (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter mr.source_branch = 'feature-x', mr._deleted = false (Deduplicate Final (Scan Table(gl_merge_request) AS mr)))
          reject:
            - (Filter (mr.traversal_path, mr.id) IN ?.(traversal_path, id) (_))
            - (Deduplicate LimitBy ... (_))
          ctes:
            absent: true

  - name: High-selectivity filters on an unchanging column apply before the latest-row pick
    query:
      gql: |
        MATCH (j:Job {name: 'build'}) RETURN j.id, j.name LIMIT 10
    logical:
      expect: ["(Filter j.name = 'build' (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter j._deleted = false (Deduplicate LimitBy j.traversal_path, j.id (Filter j.name = 'build' (Scan Table(gl_job) AS j))))
          reject:
            - (Filter (j.traversal_path, j.id) IN ?.(traversal_path, id) (_))
            - (Deduplicate Final (Scan Table(gl_job) AS j))

  - name: Low-selectivity node filters keep FINAL
    query:
      gql: |
        MATCH (j:Job {status: 'failed'}) RETURN j.id, j.status LIMIT 10
    logical:
      expect: ["(Filter j.status = 'failed' (_))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Filter j.status = 'failed', j._deleted = false (Deduplicate Final (Scan Table(gl_job) AS j)))"]
          reject: ["(Deduplicate LimitBy ... (_))"]

  - name: An unpinned range on a high fan out child reads once with FINAL
    query:
      gql: |
        MATCH (j:Job) WHERE j.finished_at >= '2026-10-10' RETURN j.id, j.finished_at LIMIT 10
    logical:
      expect: ["(Filter j.finished_at >= '2026-10-10' (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter j.finished_at >= '2026-10-10', j._deleted = false (Deduplicate Final (Scan Table(gl_job) AS j)))
          reject:
            - (Filter (j.traversal_path, j.id) IN ?.(traversal_path, id) (_))
            - (Deduplicate LimitBy ... (_))
          ctes:
            absent: true

  - name: A changing-column filter on a high fan out child pinned by its parent keeps find then check
    query:
      gql: |
        MATCH (j:Job {pipeline_id: 7}) WHERE j.finished_at >= '2026-10-10' RETURN j.id, j.finished_at LIMIT 10
    logical:
      expect: ["(Filter j.finished_at >= '2026-10-10', j.pipeline_id = 7 (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Project j.traversal_path AS traversal_path, j.id AS id (Filter j.finished_at >= '2026-10-10', j.pipeline_id = 7, ... (Scan Table(gl_job) AS j)))
            - (Deduplicate LimitBy j.traversal_path, j.id (Filter j.pipeline_id = 7, (j.traversal_path, j.id) IN ?.(traversal_path, id) (Scan Table(gl_job) AS j)))
          reject: ["(Deduplicate Final (Scan Table(gl_job) AS j))"]

  - name: A changing-column filter on a high fan out child pinned by id keeps find then check
    query:
      gql: |
        MATCH (j:Job) WHERE j.id IN [7, 8] AND j.finished_at >= '2026-10-10' RETURN j.id, j.finished_at LIMIT 10
    logical:
      expect: ["(Filter j.finished_at >= '2026-10-10', j.id IN [7, 8] (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Project j.traversal_path AS traversal_path, j.id AS id (Filter j.finished_at >= '2026-10-10', ... (Scan Table(gl_job) AS j)))
            - (Deduplicate LimitBy j.traversal_path, j.id (Filter ..., (j.traversal_path, j.id) IN ?.(traversal_path, id) (Scan Table(gl_job) AS j)))
          reject: ["(Deduplicate Final (Scan Table(gl_job) AS j))"]

  - name: A changing-column filter on a high fan out child reached through its parent keeps find then check
    query:
      gql: |
        MATCH (pl:Pipeline {id: 1000})-[:HAS_JOB]->(j:Job) WHERE j.finished_at >= '2026-10-10' RETURN j.id, j.finished_at LIMIT 10
    logical:
      expect: ["(Filter j.finished_at >= '2026-10-10' (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Project j.traversal_path AS traversal_path, j.id AS id (Filter j.finished_at >= '2026-10-10', ... (Scan Table(gl_job) AS j)))
            - (Deduplicate LimitBy j.traversal_path, j.id (Filter ..., (j.traversal_path, j.id) IN ?.(traversal_path, id) (Scan Table(gl_job) AS j)))
          reject: ["(Deduplicate Final (Scan Table(gl_job) AS j))"]

  - name: A text match on a high fan out child pinned by its polymorphic parent keeps find then check
    query:
      gql: |
        MATCH (n:Note) WHERE n.noteable_id = 5 AND n.note CONTAINS 'abc' RETURN n.id, n.note LIMIT 10
    logical:
      expect: ["(Filter contains(n.note, 'abc'), n.noteable_id = 5 (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Project n.traversal_path AS traversal_path, n.id AS id (Filter contains(n.note, 'abc'), n.noteable_id = 5, ... (Scan Table(gl_note) AS n)))
            - (Deduplicate LimitBy n.traversal_path, n.id (Filter n.noteable_id = 5, (n.traversal_path, n.id) IN ?.(traversal_path, id) (Scan Table(gl_note) AS n)))
          reject: ["(Deduplicate Final (Scan Table(gl_note) AS n))"]

  - name: A changing-column filter on a pinned read of an ordinary table reads once with FINAL
    query:
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.id IN [2000, 2001] AND mr.source_branch = 'feature-x' RETURN mr.id, mr.title LIMIT 10
    logical:
      expect: ["(Filter mr.source_branch = 'feature-x', mr.id IN [2000, 2001] (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter mr.source_branch = 'feature-x', mr._deleted = false (_))
            - (Deduplicate Final (Scan Table(gl_merge_request) AS mr))
          reject:
            - (Filter (mr.traversal_path, mr.id) IN ?.(traversal_path, id) (_))
            - (Deduplicate LimitBy ... (_))
          ctes:
            absent: true

  - name: High-selectivity ranges on an unchanging column apply before the latest-row pick
    query:
      gql: |
        MATCH (j:Job) WHERE j.created_at >= '2026-10-10' RETURN j.id, j.created_at LIMIT 10
    logical:
      expect: ["(Filter j.created_at >= '2026-10-10' (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter j._deleted = false (Deduplicate LimitBy j.traversal_path, j.id (Filter j.created_at >= '2026-10-10' (Scan Table(gl_job) AS j))))
          reject:
            - (Filter (j.traversal_path, j.id) IN ?.(traversal_path, id) (_))
            - (Deduplicate Final (Scan Table(gl_job) AS j))

  - name: Namespace anchors keep FINAL by themselves
    query:
      gql: |
        MATCH (j:Job {project_id: 1000}) RETURN count(j) AS n
    logical:
      expect: ["(Filter j.project_id = 1000 (_))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Filter j.project_id = 1000, j._deleted = false (Deduplicate Final (Scan Table(gl_job) AS j)))"]
          reject: ["(Deduplicate LimitBy ... (_))"]

  - name: A text match on a changing column keeps FINAL instead of a keyed re-read
    query:
      gql: |
        MATCH (mr:MergeRequest {project_id: 1000})
        WHERE mr.title CONTAINS 'migration'
        RETURN mr.title LIMIT 10
    logical:
      expect: ["(Filter contains(mr.title, 'migration'), mr.project_id = 1000 (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter mr.project_id = 1000, contains(mr.title, 'migration'), ... (Deduplicate Final (Scan Table(gl_merge_request) AS mr)))
          reject: ["(Filter (mr.traversal_path, mr.id) IN ?.(traversal_path, id) (_))"]

  - name: A text match beside a key range still finds then checks
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username STARTS WITH 'ALI' RETURN u.username LIMIT 10
    logical:
      expect: ["(Filter u.id >= 1, u.id <= 10000, starts_with(u.username, 'ALI') (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Project u.id AS id (Filter u.id >= 1, u.id <= 10000, starts_with(u.username, 'ALI'), ... (Scan Table(gl_user) AS u)))
            - (Deduplicate LimitBy u.id (Filter u.id >= 1, u.id <= 10000, u.id IN ?.id (Scan Table(gl_user) AS u)))
          reject: ["(Deduplicate Final (Scan Table(gl_user) AS u))"]

  - name: Text indexes on an unchanging column apply before the latest-row pick
    query:
      gql: |
        MATCH (f:MergeRequestDiffFile {project_id: 1000})
        WHERE f.new_path CONTAINS 'app/services'
        RETURN f.new_path LIMIT 10
    logical:
      expect: ["(Filter contains(f.new_path, 'app/services'), f.project_id = 1000 (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter f._deleted = false (Deduplicate LimitBy f.traversal_path, f.id (Filter contains(f.new_path, 'app/services'), f.project_id = 1000 (Scan Table(gl_merge_request_diff_file) AS f))))
          reject:
            - (Filter (f.traversal_path, f.id) IN ?.(traversal_path, id) (_))
            - (Deduplicate Final (Scan Table(gl_merge_request_diff_file) AS f))

  - name: Negated high-selectivity node filters keep FINAL
    query:
      gql: |
        MATCH (j:Job) WHERE NOT j.name = 'build' RETURN j.id, j.name LIMIT 10
    logical:
      expect: ["(Filter j.name != 'build' (_))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Filter j.name != 'build', j._deleted = false (Deduplicate Final (Scan Table(gl_job) AS j)))"]
          reject: ["(Deduplicate LimitBy ... (_))"]

  - name: Wide ID ranges keep FINAL
    query:
      gql: |
        MATCH (j:Job) WHERE j.id >= 1 AND j.id <= 100002 RETURN j.id LIMIT 10
    logical:
      expect: ["(Filter j.id >= 1, j.id <= 100002 (_))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Filter j._deleted = false (Bind j (Filter j.id >= 1, j.id <= 100002 (Deduplicate Final (Scan Table(gl_job) AS j)))))"]
          reject: ["(Deduplicate LimitBy ... (_))"]
