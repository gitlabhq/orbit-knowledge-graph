cases:
  - name: A selective chain reuses each prefix and reached ID set
    query: |
      MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition), (b)-[:CALLS]->(c:Definition), (c)-[:CALLS]->(d:Definition), (d)-[:CALLS]->(e:Definition) RETURN a, b, c, d, e
    logical:
      expect:
        - "(Follow CALLS d->e AS e3 (Follow CALLS c->d AS e2 (Follow CALLS b->c AS e1 (Follow CALLS a->b AS e0 (Filter a.id = 1 (Entities Definition AS a))))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_1.source_id IN ? . id, ... (_))
            - (Filter _orbit_edge_2.source_id IN ? . id, ... (_))
          occurrences:
            - { pattern: "(Project _orbit_id_source.target_id AS id (_))", count: 4 }

  - name: One reached ID set narrows every branch arm
    query: |
      MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest),
        (mr)-[:IN_PROJECT]->(p:Project), (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)
      RETURN u.id, mr.id, p.id, pipe.id
    logical:
      expect:
        - "(Follow HAS_HEAD_PIPELINE mr->pipe AS e2 (Follow IN_PROJECT mr->p AS e1 (Follow APPROVED u->mr AS e0 (Filter ... (Entities User AS u)))))"
    physical:
      clickhouse:
        planned:
          bind:
            - (Bind $mr_ids (Project _orbit_id_source.target_id AS id (_)))
          expect:
            - (Filter mr.id IN $mr_ids.id, ... (_))
          occurrences:
            - pattern: (Scan Table(gl_merge_request) AS mr)
              count: 1

  - name: Shared uncovered endpoint filters materialize matching IDs once
    query: |
      MATCH (u:User {username: 'alice'})-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project)
      RETURN p.id, count(p) AS n
    logical:
      expect:
        - "(Aggregate group p.id AS p_id, COUNT(p) AS n (Follow CONTAINS g->p AS e1 (Follow MEMBER_OF u->g AS e0 (Filter u.username = 'alice' (Entities User AS u)))))"
    physical:
      clickhouse:
        planned:
          bind:
            - (Bind $users (Project u.id AS id (Filter u.username = 'alice', ... (Bind u (Deduplicate LimitBy ... (_))))))
          expect:
            - (Filter _orbit_edge_0.source_id IN $users.id, ... (_))
          occurrences:
            - pattern: (Bind ? (Project u.id AS id (Filter u.username = 'alice', ... (Bind u (Deduplicate LimitBy ... (_))))))
              count: 1

  - name: Repeated low-cardinality row filters stay inline
    query: |
      MATCH (a:Definition {definition_type: 'function'})-[:CALLS]->(b:Definition),
        (a)-[:CALLS]->(c:Definition)
      RETURN a.id, b.id, c.id
    logical:
      expect:
        - "(Follow CALLS a->c AS e1 (Follow CALLS a->b AS e0 (Filter a.definition_type = 'function' (Entities Definition AS a))))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter ArrayContains(_orbit_edge_0.source_tags, 'definition_type:function'), ... (_))
            - (Filter _orbit_edge_1.relationship_kind = 'CALLS', ... (_))
          reject:
            - (CTE ? (Project * (Filter ArrayContains(?.source_tags, 'definition_type:function'), ... (_))))
