cases:
  - name: A selective chain reuses each prefix and reached ID set
    missing_frontends:
      gql: The fixture needs a four-edge chain longer than the GQL frontend accepts.
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition"},{"id":"c","entity":"Definition"},{"id":"d","entity":"Definition"},{"id":"e","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"},{"type":"CALLS","from":"b","to":"c"},{"type":"CALLS","from":"c","to":"d"},{"type":"CALLS","from":"d","to":"e"}]}
    logical:
      expect: ["(EdgeScan CALLS a->b AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_1.source_id IN ? . id, ... (_))
            - (Filter _orbit_edge_2.source_id IN ? . id, ... (_))
          occurrences:
            - { pattern: "(Distinct (Project _id_source.target_id AS id (_)))", count: 3 }

  - name: One reached ID set narrows every branch arm
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"},{"id":"p","entity":"Project"},{"id":"pipe","entity":"Pipeline"}],"relationships":[{"type":"APPROVED","from":"u","to":"mr"},{"type":"IN_PROJECT","from":"mr","to":"p"},{"type":"HAS_HEAD_PIPELINE","from":"mr","to":"pipe"}]}
      gql: |
        MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest),
          (mr)-[:IN_PROJECT]->(p:Project), (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)
        RETURN u.id, mr.id, p.id, pipe.id
    logical:
      expect: ["(EdgeScan APPROVED u->mr AS e0)"]
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $mr_ids (Distinct (Project _id_source.target_id AS id (_))))
          expect:
            - (Filter mr.id IN $mr_ids.id, ... (_))
          occurrences:
            - pattern: (Scan Table(gl_merge_request) AS mr)
              count: 1

  - name: Shared uncovered endpoint filters materialize matching IDs once
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","filters":{"username":"alice"}},{"id":"g","entity":"Group"},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"},{"type":"CONTAINS","from":"g","to":"p"}],"group_by":["p.id"],"aggregations":[{"count":"p","as":"n"}]}
      gql: |
        MATCH (u:User {username: 'alice'})-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project)
        RETURN p.id, count(p) AS n
    logical:
      expect: ["(Aggregate group p.id AS p_id, COUNT(p) AS n (_))"]
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $users (Project u.id AS id (Filter u.username = 'alice', ... (_))))
          expect:
            - (Filter _orbit_edge_0.source_id IN $users.id, ... (_))

  - name: Repeated low-cardinality row filters stay inline
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","filters":{"definition_type":"function"}},{"id":"b","entity":"Definition"},{"id":"c","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"},{"type":"CALLS","from":"a","to":"c"}]}
      gql: |
        MATCH (a:Definition {definition_type: 'function'})-[:CALLS]->(b:Definition),
          (a)-[:CALLS]->(c:Definition)
        RETURN a.id, b.id, c.id
    logical:
      expect: ["(Filter a.definition_type = 'function' (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_0.source_tags HAS ANY ['definition_type:function'], ... (_))
            - (Filter _orbit_edge_1.relationship_kind = 'CALLS', ... (_))
          reject:
            - (CTE ? (Filter ?.source_tags HAS ANY ['definition_type:function'], ... (_)))
