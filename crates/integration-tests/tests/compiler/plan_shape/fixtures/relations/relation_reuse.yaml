cases:
  - name: A selective chain reuses each prefix and reached ID set
    query:
      gql: |
        MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition)
          -[:CALLS]->(d:Definition)-[:CALLS]->(e:Definition)
        RETURN a.id, b.id, c.id, d.id, e.id
    logical:
      expect: ["(EdgeScan CALLS a->b AS e0)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_1.source_id IN ? . id, ... (_))
            - (Filter _orbit_edge_2.source_id IN ? . id, ... (_))
          occurrences:
            - { pattern: "(Project _orbit_id_source.target_id AS id (_))", count: 4 }

  - name: One reached ID set narrows every branch arm
    query:
      gql: |
        MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest),
          (mr)-[:IN_PROJECT]->(p:Project), (mr)-[:HAS_HEAD_PIPELINE]->(pipe:Pipeline)
        RETURN u.id, mr.id, p.id, pipe.id
    logical:
      expect: ["(EdgeScan APPROVED u->mr AS e0)"]
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $mr_ids (Project _orbit_id_source.target_id AS id (_)))
          expect:
            - (Filter mr.id IN $mr_ids.id, ... (_))
          occurrences:
            - pattern: (Scan Table(gl_merge_request) AS mr)
              count: 1

  - name: Shared uncovered endpoint filters materialize matching IDs once
    query:
      gql: |
        MATCH (u:User {username: 'alice'})-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project)
        RETURN p.id, count(p) AS n
    logical:
      expect: ["(Aggregate group p.id AS p_id, COUNT(p) AS n (_))"]
    physical:
      clickhouse:
        planned:
          bind:
            - (CTE $users (Project u.id AS id (Filter u.username = 'alice', ... (Deduplicate LimitBy ... (_)))))
          expect:
            - (Filter _orbit_edge_0.source_id IN $users.id, ... (_))
          occurrences:
            - pattern: (CTE ? (Project u.id AS id (Filter u.username = 'alice', ... (Deduplicate LimitBy ... (_)))))
              count: 1

  - name: Repeated low-cardinality row filters stay inline
    query:
      gql: |
        MATCH (a:Definition {definition_type: 'function'})-[:CALLS]->(b:Definition),
          (a)-[:CALLS]->(c:Definition)
        RETURN a.id, b.id, c.id
    logical:
      expect: ["(Filter a.definition_type = 'function' (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_0.source_tags HAS ANY ['definition_type:function'], ... (_))
            - (Filter _orbit_edge_1.relationship_kind = 'CALLS', ... (_))
          reject:
            - (CTE ? (Filter ?.source_tags HAS ANY ['definition_type:function'], ... (_)))
