name: Variable hops plan one executable union arm per depth
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "a", "entity": "Definition", "node_ids": [1], "columns": ["id"]},
        {"id": "b", "entity": "Definition", "columns": ["id"]}
      ],
      "relationships": [{"type": "CALLS", "from": "a", "to": "b", "hops": [1, 3]}]
    }
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS*1..3]->(b:Definition) RETURN a.id, b.id
logical:
  expect:
    - (EdgeScan CALLS a->b AS e0 HOPS 1..3)
physical:
  clickhouse:
    planned:
      expect:
        - (Union ALL AS e0 (Project 1 AS depth, ... (_)) (Project 2 AS depth, ... (_)) (Project 3 AS depth, ... (_)))
        - (Project e1.source_tags AS source_tags, e3.target_tags AS target_tags, ... (_))
    emitted:
      expect:
        - (Project e0.path_nodes AS hop_e0_path_nodes, ... (_))
  duckdb:
    planned:
      expect:
        - (Union ALL AS e0 (_) (_) (_))
        - (Project 3 AS depth, ... (_))
    emitted:
      expect:
        - (Project e0.path_nodes AS hop_e0_path_nodes, ... (_))
