name: Variable hops plan one executable union arm per depth
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "a", "entity": "Definition", "node_ids": [1], "columns": ["id"]},
        {"id": "b", "entity": "Definition", "columns": ["id"]}
      ],
      "relationships": [{"type": "CALLS", "from": "a", "to": "b", "hops": [1, 3]}]
    }
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS*1..3]->(b:Definition) RETURN a.id, b.id
logical:
  expect:
    - (Relationship a b Outgoing (Kinds CALLS) (Hops 1 3) (Filters))
physical:
  clickhouse:
    expect:
      - (Strategy (Flat (MultiHop (Filter _ (Union e0 (SourceFragment (Outputs ... (Output depth (Literal 1)) ...) _) (SourceFragment (Outputs ... (Output depth (Literal 2)) ...) _) (SourceFragment (Outputs ... (Output depth (Literal 3)) ...) _))))))
      - (Output source_tags (Column e1 source_tags))
      - (Output target_tags (Column e3 target_tags))
      - (Output hop_e0_path_nodes (Column e0 path_nodes))
  duckdb:
    expect:
      - (Strategy (Flat (MultiHop (Filter _ (Union e0 _ _ _)))))
      - (Output depth (Literal 3))
      - (Output hop_e0_path_nodes (Column e0 path_nodes))
