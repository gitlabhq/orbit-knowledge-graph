name: A complemented NOT becomes an ordinary node filter
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[12000]},{"id":"b","entity":"Definition","filters":{"name":{"ne":"skip"}},"columns":["name"]}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
  gql: |
    MATCH (a:Definition {id: 12000})-[:CALLS]->(b:Definition)
    WHERE NOT b.name = 'skip'
    RETURN b.name
logical:
  expect:
    - (Filter b.name != 'skip' (NodeScan Definition AS b))
  reject:
    - (Filter NOT (b.name = 'skip') (_))
physical:
  clickhouse:
    planned:
      expect:
        - (Filter b.name != 'skip', ... (_))
