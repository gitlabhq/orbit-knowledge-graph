cases:
  - name: "A NOT tree on a query without relationships binds into that node's scan"
    query: |
      MATCH (d:Definition)
      WHERE d.id >= 1 AND d.id <= 10 AND NOT d.id IN [3, 4]
      RETURN d.name
    logical:
      expect: ["(Filter d.id >= 1, d.id <= 10, NOT (d.id IN [3, 4]) (Entities Definition AS d))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter NOT(d.id IN [3, 4]), d._deleted = false (Bind d (Deduplicate LimitBy ... (Sort d.traversal_path, d.project_id, d.branch, d.id, d._version DESC (Project * (Filter d.id >= 1, d.id <= 10 (_)))))))

  - name: A complemented NOT becomes an ordinary node filter
    query: |
      MATCH (a:Definition {id: 12000})-[:CALLS]->(b:Definition)
      WHERE NOT b.name = 'skip'
      RETURN b.name
    logical:
      expect:
        - "(Filter NOT (b.name = 'skip') (Follow CALLS a->b AS e0 (Filter a.id = 12000 (Entities Definition AS a))))"
    physical:
      clickhouse:
        planned:
          expect: ["(Filter b.name != 'skip', ... (_))"]

  - name: A doubly negated leaf reads its column like an unnegated one
    query: |
      MATCH (j:Job)
      WHERE j.project_id = 1 AND NOT (j.name = 'build' AND NOT j.finished_at >= '2026-10-10')
      RETURN j.name
    logical:
      expect: ["(Filter ... (Entities Job AS j))"]
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter j.project_id = 1, NOT((j.name = 'build') AND (Lower(j.name) = Lower('build')) AND NOT((j.finished_at >= '2026-10-10') AND (j.finished_at != '1970-01-01 00:00:00'))), ... (_))"
