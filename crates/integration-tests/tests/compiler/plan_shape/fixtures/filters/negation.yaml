cases:
  - name: "A NOT tree on a query without relationships binds into that node's scan"
    query:
      gql: |
        MATCH (d:Definition)
        WHERE d.id >= 1 AND d.id <= 10 AND NOT d.id IN [3, 4]
        RETURN d.name
    logical:
      expect: ["(Filter NOT (d.id IN [3, 4]) (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter NOT (d.id IN [3, 4]), d.id >= 1, d.id <= 10, d._deleted = false (Deduplicate Final (Scan Table(gl_definition) AS d)))

  - name: A complemented NOT becomes an ordinary node filter
    query:
      gql: |
        MATCH (a:Definition {id: 12000})-[:CALLS]->(b:Definition)
        WHERE NOT b.name = 'skip'
        RETURN b.name
    logical:
      expect:
        - "(Filter b.name != 'skip' (NodeScan Definition AS b))"
      reject: ["(Filter NOT (b.name = 'skip') (_))"]
    physical:
      clickhouse:
        planned:
          expect: ["(Filter b.name != 'skip', ... (_))"]
