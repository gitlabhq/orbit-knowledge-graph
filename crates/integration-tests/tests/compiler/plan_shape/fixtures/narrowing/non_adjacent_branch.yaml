name: Branch joins and cascade bounds follow the shared alias rather than the preceding hop

query:
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition),
          (a)-[:CALLS]->(d:Definition)
    RETURN a, b, c, d

logical:
  expect:
    - (EdgeScan CALLS a->b AS e0)
    - (EdgeScan CALLS b->c AS e1)
    - (EdgeScan CALLS a->d AS e2)

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON _orbit_edge_0.source_id = _orbit_edge_2.source_id (Join ON _orbit_edge_0.target_id = _orbit_edge_1.source_id (_) (_)) (_))
        - (SemiJoin _orbit_edge_1.source_id IN subquery (_) (Project e0p.target_id AS target_id (Filter e0p.source_id = 1, ... (Scan Table(gl_code_edge) AS e0p))))
        - (Filter _orbit_edge_2.source_id = 1, ... (_))
        - (SemiJoin _orbit_edge_2.source_id IN subquery (_) (Project e0p.source_id AS source_id (Filter e0p.source_id = 1, ... (Scan Table(gl_code_edge) AS e0p))))
      reject:
        - (SemiJoin _orbit_edge_2.source_id IN subquery (_) (Project e1p.target_id AS target_id (_)))
    emitted:
      expect:
        - (Join ON _orbit_edge_0.source_id = _orbit_edge_2.source_id (Join ON _orbit_edge_0.target_id = _orbit_edge_1.source_id (_) (_)) (_))
        - (SemiJoin _orbit_edge_2.source_id IN subquery (_) (Project e0p.source_id AS source_id (Filter e0p.source_id = 1, ... (Scan Table(gl_code_edge) AS e0p))))
        - (SemiJoin _orbit_edge_1.source_id IN subquery (_) (Project e0p.target_id AS target_id (Filter e0p.source_id = 1, ... (Scan Table(gl_code_edge) AS e0p))))
      reject:
        - (SemiJoin _orbit_edge_2.source_id IN subquery (_) (Project e1p.target_id AS target_id (_)))
  duckdb:
    planned:
      expect:
        - (Join ON e0.source_id = e2.source_id (Join ON e0.target_id = e1.source_id (_) (_)) (_))
        - (Filter a.id = 1, ... (Scan Table(gl_definition) AS a))
      reject:
        - (SemiJoin e2.source_id IN subquery (_) (Project e1p.target_id AS target_id (_)))
