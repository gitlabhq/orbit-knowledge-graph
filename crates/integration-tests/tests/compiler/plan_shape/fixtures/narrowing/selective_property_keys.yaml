name: A high-selectivity property creates candidate keys for an ordered node

query:
  gql: |
    MATCH (a:Definition {name: 'compile'})-[:CALLS]->(b:Definition) RETURN a.name, b ORDER BY a.name

logical:
  expect: ["(Sort a.name (_))"]

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_filter_a]
      expect: ["(CTE _filter_a (Project a.id AS id (Deduplicate LimitBy ... (Filter a.name = 'compile', a._deleted = false (Scan Table(gl_definition) AS a)))))", "(Filter _orbit_edge_0.source_id IN _filter_a.id, ... (_))"]
    emitted:
      ctes:
        exact_order: [_filter_a]
      expect: ["(Filter _orbit_edge_0.source_id IN _filter_a.id, ... (_))", "(Bind a (Project * (Filter a.name = 'compile', a._deleted = false (Deduplicate Final (Scan Table(gl_definition) AS a)))))"]
