name: Narrowed node reads recheck mutable fields outside latest-row resolution
query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "p", "entity": "Project", "filters": {"star_count": 1}},
        {"id": "mr", "entity": "MergeRequest", "node_ids": [9710]}
      ],
      "relationships": [
        {"type": "IN_PROJECT", "from": "mr", "to": "p"}
      ],
      "group_by": ["p.name"],
      "aggregations": [{"count": "mr", "as": "c"}]
    }
  gql: |
    MATCH (p:Project {star_count: 1})<-[:IN_PROJECT]-(mr:MergeRequest {id: 9710})
    RETURN p.name, count(mr) AS c
logical:
  expect:
    - (Filter p.star_count = 1 (NodeScan Project AS p))
physical:
  clickhouse:
    planned:
      bind:
        - (CTE $projects (Project p.id AS id (Filter p.star_count = 1, p._deleted = false (Scan Table(gl_project) AS p))))
        - (CTE $requests (Project mr.id AS id (_)))
      ctes:
        exact_order: [$projects, $requests]
      expect:
        - (Filter mr.id IN $requests.id, ... (_))
        - |
          (Bind p
            (Filter p.star_count = 1, p._deleted = false
              (Deduplicate LimitBy p.traversal_path, p.id
                (Filter p.id IN $projects.id
                  (Scan Table(gl_project) AS p)))))
      reject:
        - (Scan Table(gl_edge) ...)
