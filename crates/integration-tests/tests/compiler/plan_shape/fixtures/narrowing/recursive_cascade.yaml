name: Selective flat chain retains current-row scans and a dependent cascade anchor

query:
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition)-[:CALLS]->(d:Definition)
    RETURN a.id, b.id, c.id, d.id

logical:
  expect:
    - (Filter a.id IN [1] (NodeScan Definition AS a))
    - (EdgeScan CALLS a->b AS e0)
    - (EdgeScan CALLS b->c AS e1)

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON _orbit_edge_1.target_id = _orbit_edge_2.source_id (Join ON _orbit_edge_0.target_id = _orbit_edge_1.source_id (_) (_)) (_))
        - |
          (SemiJoin _orbit_edge_1.source_id IN subquery
            (Bind _orbit_edge_1 (Filter _orbit_edge_1._deleted = false (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_1))))
            (Project e0p.target_id AS target_id (Filter e0p.source_id = 1, ... (Scan Table(gl_code_edge) AS e0p))))
        - |
          (SemiJoin _orbit_edge_2.source_id IN subquery
            (_)
            (Project e1p.target_id AS target_id
              (SemiJoin e1p.source_id IN subquery
                (Filter ... (Scan Table(gl_code_edge) AS e1p))
                (Project e0p.target_id AS target_id (Filter ... (Scan Table(gl_code_edge) AS e0p))))))
        - (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0))
    emitted:
      expect:
        - |
          (SemiJoin _orbit_edge_2.source_id IN subquery
            (_)
            (Project e1p.target_id AS target_id
              (SemiJoin e1p.source_id IN subquery
                (Filter ... (Scan Table(gl_code_edge) AS e1p))
                (Project e0p.target_id AS target_id
                  (Filter e0p.source_id = 1, ... (Scan Table(gl_code_edge) AS e0p))))))
  duckdb:
    planned:
      ctes: { absent: true }
      reject: ["(SemiJoin ... (_) (_))", "(Deduplicate ... (_))"]
      expect:
        - (Join ON d.id = e2.target_id (_) (Filter ... (Scan Table(gl_definition) AS d)))
        - (Join ON e0.target_id = e1.source_id (_) (_))
        - (Join ON a.id = e0.source_id (_) (_))
        - (Join ON b.id = e0.target_id (_) (_))
        - (Join ON c.id = e1.target_id (_) (_))
