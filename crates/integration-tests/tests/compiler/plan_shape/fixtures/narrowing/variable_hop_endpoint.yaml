name: Variable-hop endpoint hydration does not use a one-hop frontier

query:
  gql: |
    MATCH (a:Definition {id: 99000, branch: 'main'})-[:CALLS*2]->(b:Definition)
    RETURN a.id, a.branch, b.name, b.branch

logical:
  expect:
    - (NodeScan Definition AS a)

physical:
  clickhouse:
    planned:
      expect:
        - (Union ALL AS _orbit_edge_0 (Project 2 AS depth, ... (_)))
      reject:
        - (CTE _narrow_b (_))
