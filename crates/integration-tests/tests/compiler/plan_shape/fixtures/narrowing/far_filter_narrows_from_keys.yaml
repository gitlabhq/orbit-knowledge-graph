cases:
  - name: A filter-only endpoint without selective keys narrows from its selective partner and rechecks its filter after dedup

    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "mr", "entity": "MergeRequest", "filters": {"project_id": 9, "iid": 42}},
            {"id": "n", "entity": "Note", "filters": {"resolved_at": {"is_not_null": true}}, "columns": ["id", "created_at"]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "mr", "to": "n"}],
          "limit": 10
        }
      gql: |
        MATCH (mr:MergeRequest {project_id: 9, iid: 42})-[:HAS_NOTE]->(n:Note)
        WHERE n.resolved_at IS NOT NULL RETURN n.id, n.created_at LIMIT 10

    logical:
      expect:
        - (Filter n.resolved_at IS NOT NULL (_))

    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_filter_mr, _narrow_n]
          expect:
            - (CTE _narrow_n (Project _orbit_edge_0n.target_id AS id (Filter _orbit_edge_0n.source_id IN _filter_mr.id, ... (Scan Table(gl_edge) AS _orbit_edge_0n))))
            - (Bind n (Filter n.resolved_at IS NOT NULL, n._deleted = false (Deduplicate LimitBy ... (Filter n.id IN _narrow_n.id (Scan Table(gl_note) AS n)))))
          reject:
            - (CTE _filter_n (_))

  - name: An ordered endpoint with a non-selective filter narrows from its selective partner too

    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "mr", "entity": "MergeRequest", "filters": {"project_id": 9, "iid": 42}},
            {"id": "n", "entity": "Note", "filters": {"resolved_at": {"is_not_null": true}}, "columns": ["id", "created_at"]}
          ],
          "relationships": [{"type": "HAS_NOTE", "from": "mr", "to": "n"}],
          "order_by": "-n.created_at",
          "limit": 10
        }
      gql: |
        MATCH (mr:MergeRequest {project_id: 9, iid: 42})-[:HAS_NOTE]->(n:Note)
        WHERE n.resolved_at IS NOT NULL RETURN n.id, n.created_at ORDER BY n.created_at DESC LIMIT 10

    logical:
      expect:
        - (Sort n.created_at DESC (_))

    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_filter_mr, _narrow_n]
          expect:
            - (Bind n (Filter n.resolved_at IS NOT NULL, n._deleted = false (Deduplicate LimitBy ... (Filter n.id IN _narrow_n.id (Scan Table(gl_note) AS n)))))
          reject:
            - (CTE _filter_n (_))

  - name: A variable-length first hop keeps the filter-only keys and never narrows the node

    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","filters":{"definition_type":"function"}},{"id":"b","entity":"Definition","filters":{"start_line":{"ne":0}},"columns":["id"]},{"id":"c","entity":"Definition","filters":{"name":"compile"}}],"relationships":[{"type":"CALLS","from":"a","to":"b","hops":[1,2]},{"type":"CALLS","from":"b","to":"c"}]}
      gql: |
        MATCH (a:Definition {definition_type: 'function'})-[:CALLS*1..2]->(b:Definition)-[:CALLS]->(c:Definition {name: 'compile'})
        WHERE b.start_line <> 0 RETURN b.id

    logical:
      expect:
        - (Filter b.start_line != 0 (_))

    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_filter_b, _filter_c]
          expect:
            - (Filter _orbit_edge_0.target_id IN _filter_b.id, ... (Union ALL AS _orbit_edge_0 (_) (_)))
          reject:
            - (CTE _narrow_b (_))
            - (Deduplicate LimitBy ... (Filter b.id IN _narrow_b.id (_)))

  - name: Only the first hop decides, so later selective keys do not narrow a filter-only node

    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"User","filters":{"state":"active"}},{"id":"mr","entity":"MergeRequest","filters":{"merged_at":{"is_not_null":true}},"columns":["id"]},{"id":"n","entity":"Note","filters":{"discussion_id":"x"}}],"relationships":[{"type":"AUTHORED","from":"a","to":"mr"},{"type":"HAS_NOTE","from":"mr","to":"n"}]}
      gql: |
        MATCH (a:User {state: 'active'})-[:AUTHORED]->(mr:MergeRequest)-[:HAS_NOTE]->(n:Note {discussion_id: 'x'})
        WHERE mr.merged_at IS NOT NULL RETURN mr.id

    logical:
      expect:
        - (Filter mr.merged_at IS NOT NULL (_))

    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_filter_a, _filter_mr, _filter_n]
          expect:
            - (Filter _orbit_edge_0.source_id IN _filter_a.id, _orbit_edge_0.target_id IN _filter_mr.id, ... (Deduplicate Final (Scan Table(gl_edge) AS _orbit_edge_0)))
          reject:
            - (CTE _narrow_mr (_))
            - (Deduplicate LimitBy ... (Filter mr.id IN _narrow_mr.id (_)))

  - name: A pinned partner narrows an ordered endpoint with a non-selective filter

    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[9460]},{"id":"n","entity":"Note","filters":{"resolved_at":{"is_not_null":true}},"columns":["id"]}],"relationships":[{"type":"HAS_NOTE","from":"mr","to":"n"}],"order_by":"-n.created_at"}
      gql: |
        MATCH (mr:MergeRequest {id: 9460})-[:HAS_NOTE]->(n:Note) WHERE n.resolved_at IS NOT NULL
        RETURN n.id ORDER BY n.created_at DESC

    logical:
      expect:
        - (Sort n.created_at DESC (_))

    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_narrow_n]
          expect:
            - (CTE _narrow_n (Project _orbit_edge_0n.target_id AS id (Filter _orbit_edge_0n.source_id = 9460, ... (Scan Table(gl_edge) AS _orbit_edge_0n))))
            - (Bind n (Filter n.resolved_at IS NOT NULL, n._deleted = false (Deduplicate LimitBy ... (Filter n.id IN _narrow_n.id (Scan Table(gl_note) AS n)))))
