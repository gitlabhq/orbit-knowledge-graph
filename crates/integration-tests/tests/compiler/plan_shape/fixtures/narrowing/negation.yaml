cases:
  - name: Negated node groups stay in the node scan next to positive ID selectors
    query:
      gql: |
        MATCH (a:Definition)-[:CALLS]->(b:Definition)
        WHERE a.id IN [1, 2] AND a.id >= 1 AND a.id <= 10
          AND b.name = 'keep' AND NOT (b.id IN [3, 4] AND b.name = 'skip')
        RETURN b.id
    missing_frontends: { json: JSON filters cannot express grouped negation. }
    logical:
      expect:
        - (Filter a.id IN [1, 2], a.id >= 1, a.id <= 10 (NodeScan Definition AS a))
        - "(Filter b.name = 'keep' (NodeScan Definition AS b))"
        - "(Filter NOT ((b.id IN [3, 4]) AND (b.name = 'skip')) (_))"
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_definition) AS b)
            - "(Filter b.name = 'keep', NOT ((b.id IN [3, 4]) AND (b.name = 'skip')), ... (_))"
      duckdb:
        planned:
          expect:
            - "(Filter b.name = 'keep', NOT ((b.id IN [3, 4]) AND (b.name = 'skip')), ... (_))"

  - name: A node whose only condition is NOT gets edge-key narrowing, not candidate or filter keys
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[12000]},{"id":"b","entity":"Definition","not":{"name":{"in":["skip","other"]}},"columns":["name"]}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
      gql: |
        MATCH (a:Definition {id: 12000})-[:CALLS]->(b:Definition)
        WHERE NOT b.name IN ['skip', 'other']
        RETURN b.name
    logical:
      expect:
        - "(Filter NOT (b.name IN ['skip', 'other']) (_))"
    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_narrow_b]
          expect:
            - "(Filter NOT (b.name IN ['skip', 'other']), ... (_))"
        emitted:
          ctes:
            exact_order: [_narrow_b]
      duckdb:
        planned:
          ctes:
            absent: true
          expect:
            - "(Filter NOT (b.name IN ['skip', 'other']), ... (_))"

  - name: A NOT leaf without an edge tag narrows its node scan to the edge keys
    query:
      gql: |
        MATCH (mr:MergeRequest {project_id: 1000})-[:CLOSES]->(wi:WorkItem)
        WHERE NOT (mr.state = 'merged' AND wi.title = 'x')
        RETURN count(mr) AS n
    missing_frontends: { json: JSON filters cannot express grouped negation. }
    logical:
      expect:
        - "(Filter NOT ((mr.state = 'merged') AND (wi.title = 'x')) (_))"
    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_filter_mr, _narrow_wi]
          expect:
            - "(Filter NOT (((mr.state = 'merged') AND (_orbit_edge_0.source_tags HAS ANY ['state:merged'])) AND (wi.title = 'x')) (_))"
