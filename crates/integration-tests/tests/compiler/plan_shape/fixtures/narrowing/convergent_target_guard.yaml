name: Convergent joined targets avoid an edge-derived narrowing rescan

query:
  gql: |
    MATCH (a:Definition {name: 'compile'})-[:CALLS]->(c:Definition)<-[:CALLS]-(b:Definition) RETURN c.name, count(a) AS n

logical:
  expect: ["(EdgeScan CALLS b->c AS e1)"]

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_filter_a]
      expect: ["(Bind c (Filter c._deleted = false (Deduplicate Final (Scan Table(gl_definition) AS c))))"]
      reject: ["(CTE _narrow_c (_))"]
    emitted:
      expect: ["(Deduplicate Final (Scan Table(gl_definition) AS c))"]
      reject: ["(CTE _narrow_c (_))"]
