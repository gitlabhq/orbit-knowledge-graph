name: ID ranges constrain edge endpoints and seed downstream cascades

query:
  gql: |
    MATCH (a:Definition)-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition) WHERE a.id >= 1 AND a.id <= 10 RETURN a, b, c

logical:
  expect: ["(Filter ... (NodeScan Definition AS a))"]

physical:
  clickhouse:
    planned:
      expect: ["(Filter _orbit_edge_0.source_id >= 1, _orbit_edge_0.source_id <= 10, ... (_))", "(SemiJoin _orbit_edge_1.source_id IN subquery (_) (Project ... (Filter e0p.source_id >= 1, e0p.source_id <= 10, ... (_))))"]
    emitted:
      expect: ["(Filter _orbit_edge_0.source_id >= 1, _orbit_edge_0.source_id <= 10, ... (_))", "(SemiJoin _orbit_edge_1.source_id IN subquery (_) (_))"]
