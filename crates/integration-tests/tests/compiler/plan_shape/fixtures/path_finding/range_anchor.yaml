name: Path endpoint ranges create bounded anchor keys

query:
  json: |
    {"query_type":"path_finding","nodes":[{"id":"a","entity":"User","node_ids":[1]},{"id":"b","entity":"Project","id_range":{"start":100,"end":200}}],"path":{"type":"shortest","from":"a","to":"b","max_depth":2,"rel_types":["MEMBER_OF","CONTAINS"]}}
  gql: |
    MATCH p = ANY SHORTEST (a:User {id: 1})-[:MEMBER_OF|CONTAINS*1..2]->(b:Project) WHERE b.id >= 100 AND b.id <= 200 RETURN p

logical:
  gql:
    expect:
      - (Limit 30 (Select p (Shortest MEMBER_OF|CONTAINS a->b DEPTH 2 (Filter a.id = 1 (Entities User AS a)) (Filter b.id >= 100, b.id <= 200 (Entities Project AS b)))))
  json:
    expect:
      - (Limit 30 (Select a, b, path (Shortest MEMBER_OF|CONTAINS a->b DEPTH 2 (Filter a.id IN [1] (Entities User AS a)) (Filter b.id >= 100, b.id <= 200 (Entities Project AS b)))))

physical:
  clickhouse:
    planned:
      expect: ["(Filter b.id >= 100, b.id <= 200, ... (_))"]
    emitted:
      ctes:
        exact_order: [_orbit_nf_b, _orbit_forward, _orbit_backward]
      expect: ["(CTE _orbit_nf_b (Limit 500 (_)))", "(Filter b.id >= 100, b.id <= 200 (_))"]
