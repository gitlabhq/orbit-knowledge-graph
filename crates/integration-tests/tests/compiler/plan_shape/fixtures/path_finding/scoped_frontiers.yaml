name: Path finding uses its frontier emitter without an edge-chain strategy
query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "a", "entity": "Definition", "node_ids": [1]},
        {"id": "b", "entity": "Definition", "node_ids": [2]}
      ],
      "path": {"type": "shortest", "from": "a", "to": "b", "max_depth": 2, "rel_types": ["CALLS"]}
    }
  gql: |
    MATCH p = ANY SHORTEST (a:Definition {id: 1})-[:CALLS*1..2]->(b:Definition {id: 2}) RETURN p
logical:
  expect:
    - (Input path_finding (...))
    - (Filter a.id IN [1] (NodeScan Definition AS a))
    - (Filter b.id IN [2] (NodeScan Definition AS b))
physical:
  clickhouse:
    planned:
      expect:
        - (PathFinding a->b depth=2 forward=1 backward=1 scoped=true tables=[gl_code_edge] relationships=[CALLS] ... (_) (_))
        - (Filter a.id = 1, ... (NodeScan Definition AS a))
        - (Filter b.id = 2, ... (NodeScan Definition AS b))
    emitted:
      ctes:
        exact_order: [_nf_a, _nf_b, _path_scope_traversal_paths, forward, backward]
      expect:
        - (CTE _path_scope_traversal_paths (Union ALL (_) (_)))
        - (Filter e1.traversal_path IN _path_scope_traversal_paths.traversal_path, e1.source_id IN _nf_a.id, ... (_))
        - (Filter e1.traversal_path IN _path_scope_traversal_paths.traversal_path, e1.target_id IN _nf_b.id, ... (_))
        - (Join ON (f.end_id = b.end_id) AND (f.traversal_path = b.traversal_path) (_) (_))
  duckdb:
    planned:
      expect:
        - (PathFinding a->b depth=2 forward=1 backward=1 scoped=false tables=[gl_edge] relationships=[CALLS] ... (_) (_))
    emitted:
      expect:
        - (CTE _ (_))
        - (Scan Table(gl_edge) ...)
