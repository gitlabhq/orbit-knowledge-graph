name: Path finding uses its frontier emitter without an edge-chain strategy

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "a", "entity": "Definition", "node_ids": [1]},
        {"id": "b", "entity": "Definition", "node_ids": [2]}
      ],
      "path": {"type": "shortest", "from": "a", "to": "b", "max_depth": 2, "rel_types": ["CALLS"]}
    }
  gql: |
    MATCH p = ANY SHORTEST (a:Definition {id: 1})-[:CALLS*1..2]->(b:Definition {id: 2}) RETURN p

logical:
  expect:
    - (Input path_finding (...))
    - (Filter a.id IN [1] (NodeScan Definition AS a))
    - (Filter b.id IN [2] (NodeScan Definition AS b))

physical:
  clickhouse:
    planned:
      expect:
        - (PathFinding a->b depth=2 scoped=true tables=[gl_code_edge] relationships=[CALLS] ... (_) (_))
        - (Filter a.id = 1, ... (NodeScan Definition AS a))
        - (Filter b.id = 2, ... (NodeScan Definition AS b))
    emitted:
      ctes:
        exact_order: [_orbit_nf_a, _orbit_nf_b, _orbit_path_scope, _orbit_forward_reach_1, _orbit_forward]
      expect:
        - (CTE _orbit_path_scope (Union ALL (_) (_)))
        - (Filter _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path, _orbit_e1.source_id IN _orbit_nf_a.id, ... (_))
  duckdb:
    planned:
      expect:
        - (PathFinding a->b depth=2 scoped=true tables=[gl_edge] relationships=[CALLS] ... (_) (_))
    emitted:
      expect:
        - (CTE _ (_))
        - (Scan Table(gl_edge) ...)
