name: Wildcard paths restrict first-hop kinds from endpoint metadata

query:
  gql: |
    MATCH p = ANY SHORTEST (a:Definition {id: 1})-[*1..2]->(b:Definition {id: 2}) RETURN p

logical:
  expect: ["(Input path_finding (...))"]

physical:
  clickhouse:
    planned:
      expect: ["(PathFinding a->b depth=2 forward=1 backward=1 scoped=true tables=? relationships=[*] forward_kinds=[CALLS, DEFINES, EXTENDS] backward_kinds=[CALLS, DEFINES, EXTENDS, IMPORTS] (_) (_))"]
    emitted:
      expect:
        - (CTE forward (Project ... (Filter e1.relationship_kind IN ?, e1.source_kind = 'Definition', ... (_))))
        - (CTE backward (Project ... (Filter e1.relationship_kind IN ?, e1.target_kind = 'Definition', ... (_))))
