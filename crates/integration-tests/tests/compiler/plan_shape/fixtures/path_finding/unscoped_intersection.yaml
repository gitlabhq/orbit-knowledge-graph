name: Global path endpoints avoid traversal-path scope on frontier intersections

query: |
  MATCH p = ANY SHORTEST (a:User {id: 1})-[:MEMBER_OF|CONTAINS*1..3]->(b:Project {id: 100}) RETURN p

logical:
  expect:
    - (Limit 30 (Select p (Shortest MEMBER_OF|CONTAINS a->b DEPTH 3 (Filter a.id = 1 (Entities User AS a)) (Filter b.id = 100 (Entities Project AS b)))))

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_orbit_forward, _orbit_backward]
      expect:
        - (Filter _orbit_e1.target_id = 100, _orbit_e1.relationship_kind IN ['MEMBER_OF', 'CONTAINS'], _orbit_e1.target_kind = 'Project' (_))
        - (Filter (_orbit_forward._orbit_depth + _orbit_backward._orbit_depth) <= 3 (Join ON (_orbit_forward._orbit_end_node = _orbit_backward._orbit_end_node) AND (_orbit_forward._orbit_end_kind = _orbit_backward._orbit_end_kind) (Scan Table(_orbit_forward) AS _orbit_forward) (Scan Table(_orbit_backward) AS _orbit_backward)))
      occurrences:
        - pattern: (Filter _orbit_e1.source_id = 1, _orbit_e1.relationship_kind IN ['MEMBER_OF', 'CONTAINS'], _orbit_e1.source_kind = 'User' (_))
          count: 2
        - pattern: (Scan Table(gl_edge) AS _orbit_e2_arm)
          count: 1
    emitted:
      ctes:
        exact_order: [_orbit_forward, _orbit_backward]
      expect: ["(Join ON (_orbit_forward._orbit_end_node = _orbit_backward._orbit_end_node) AND (_orbit_forward._orbit_end_kind = _orbit_backward._orbit_end_kind) (_) (_))"]
      reject: ["(CTE _orbit_path_scope (_))"]
