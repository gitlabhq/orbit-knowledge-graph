name: Depth-one paths from a global endpoint avoid anchor and backward scans

query:
  json: |
    {"query_type":"path_finding","nodes":[{"id":"a","entity":"User","node_ids":[1]},{"id":"b","entity":"Group","node_ids":[2]}],"path":{"type":"shortest","from":"a","to":"b","max_depth":1,"rel_types":["MEMBER_OF"]}}
  gql: |
    MATCH p = ANY SHORTEST (a:User {id: 1})-[:MEMBER_OF*1..1]->(b:Group {id: 2}) RETURN p

logical:
  gql:
    expect:
      - (Limit 30 (Select p (Shortest MEMBER_OF a->b DEPTH 1 (Filter a.id = 1 (Entities User AS a)) (Filter b.id = 2 (Entities Group AS b)))))

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_orbit_forward]
      expect:
        - (Filter _orbit_e1.source_id = 1, _orbit_e1.relationship_kind = 'MEMBER_OF', _orbit_e1.source_kind = 'User' (Deduplicate Final (Scan Table(gl_edge) AS _orbit_e1)))
        - (Filter _orbit_forward._orbit_depth = 1, _orbit_forward._orbit_end_kind = 'Group', _orbit_forward._orbit_end_node = 2 (Scan Table(_orbit_forward) AS _orbit_forward))
    emitted:
      ctes:
        exact_order: [_orbit_forward]
      expect: ["(Filter _orbit_e1.source_id = 1, ... (Deduplicate Final (Scan Table(gl_edge) AS _orbit_e1)))"]
      reject: ["(Scan Table(gl_user) ...)", "(CTE _orbit_backward (_))"]
