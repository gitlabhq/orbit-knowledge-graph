name: Three-hop paths prune each scoped expansion to the nodes the previous hop reached

query:
  json: |
    {"query_type":"path_finding","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition","node_ids":[2]}],"path":{"type":"shortest","from":"a","to":"b","max_depth":3,"rel_types":["CALLS"]}}
  gql: |
    MATCH p = ANY SHORTEST (a:Definition {id: 1})-[:CALLS*1..3]->(b:Definition {id: 2}) RETURN p

logical:
  expect: ["(Input path_finding (...))"]

physical:
  clickhouse:
    planned:
      expect: ["(PathFinding a->b depth=3 scoped=true ... (_) (_))"]
    emitted:
      ctes:
        exact_order: [_orbit_nf_a, _orbit_nf_b, _orbit_path_scope, _orbit_forward_reach_1, _orbit_forward_reach_2, _orbit_forward]
      expect:
        - (CTE _orbit_forward (Union ALL (_) (_) (_)))
        - (Join ON (_orbit_e1.target_id = _orbit_e2.source_id) AND (_orbit_e1.target_kind = _orbit_e2.source_kind) AND (_orbit_e1.traversal_path = _orbit_e2.traversal_path) AND (_orbit_e2.relationship_kind = 'CALLS') AND _orbit_e2.traversal_path IN _orbit_path_scope.traversal_path AND _orbit_e2.source_id IN _orbit_forward_reach_1._orbit_end_node (Deduplicate Final (_)) (Deduplicate Final (_)))
