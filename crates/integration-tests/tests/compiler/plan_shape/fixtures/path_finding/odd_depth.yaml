name: Odd path depths split the frontier and prune each scoped expansion

query: |
  MATCH p = ANY SHORTEST (a:Definition {id: 1})-[:CALLS*1..3]->(b:Definition {id: 2}) RETURN p

logical:
  expect:
    - (Limit 30 (Select p (Shortest CALLS a->b DEPTH 3 (Filter a.id = 1 (Entities Definition AS a)) (Filter b.id = 2 (Entities Definition AS b)))))

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_orbit_nf_a, _orbit_nf_b, _orbit_path_scope, _orbit_forward, _orbit_backward]
      expect:
        - (Filter a.id = 1 (Deduplicate Final (Scan Table(gl_definition) AS a)))
        - (Filter b.id = 2 (Deduplicate Final (Scan Table(gl_definition) AS b)))
        - (Filter _orbit_e1.target_id IN _orbit_nf_b.id, _orbit_e1.relationship_kind = 'CALLS', _orbit_e1.target_kind = 'Definition', _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_e1)))
        - (Filter (_orbit_forward._orbit_depth + _orbit_backward._orbit_depth) <= 3 (Join ON (_orbit_forward._orbit_end_node = _orbit_backward._orbit_end_node) AND (_orbit_forward._orbit_end_kind = _orbit_backward._orbit_end_kind) AND (_orbit_forward.traversal_path = _orbit_backward.traversal_path) (Scan Table(_orbit_forward) AS _orbit_forward) (Scan Table(_orbit_backward) AS _orbit_backward)))
      occurrences:
        - pattern: (Filter _orbit_e1.source_id IN _orbit_nf_a.id, _orbit_e1.relationship_kind = 'CALLS', _orbit_e1.source_kind = 'Definition', _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path (_))
          count: 2
        - pattern: (Scan Table(gl_code_edge) AS _orbit_e2)
          count: 1
    emitted:
      ctes:
        exact_order: [_orbit_nf_a, _orbit_nf_b, _orbit_path_scope, _orbit_forward, _orbit_backward]
      expect:
        - (CTE _orbit_forward (Union ALL (_) (_)))
        - (Join ON (_orbit_e1.target_id = _orbit_e2.source_id) AND (_orbit_e1.target_kind = _orbit_e2.source_kind) AND (_orbit_e1.traversal_path = _orbit_e2.traversal_path) AND (_orbit_e2.relationship_kind = 'CALLS') AND _orbit_e2.traversal_path IN _orbit_path_scope.traversal_path (Deduplicate Final (_)) (Deduplicate Final (_)))
        - (Filter (_orbit_forward._orbit_depth + _orbit_backward._orbit_depth) <= 3 (_))
