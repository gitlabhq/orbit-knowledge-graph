name: CI path frontiers select current edge versions

query:
  json: |
    {"query_type":"path_finding","nodes":[{"id":"a","entity":"Pipeline","node_ids":[99000]},{"id":"b","entity":"Pipeline","node_ids":[99002]}],"path":{"type":"shortest","from":"a","to":"b","max_depth":2,"rel_types":["CHILD_OF","AUTO_CANCELED_BY"]}}
  gql: |
    MATCH path = ANY SHORTEST (a:Pipeline {id: 99000})-[:CHILD_OF|AUTO_CANCELED_BY*1..2]->(b:Pipeline {id: 99002})
    RETURN path

logical:
  gql:
    expect:
      - (Limit 30 (Select path (Shortest CHILD_OF|AUTO_CANCELED_BY a->b DEPTH 2 (Filter a.id = 99000 (Entities Pipeline AS a)) (Filter b.id = 99002 (Entities Pipeline AS b)))))
  json:
    expect:
      - (Limit 30 (Select a, b, path (Shortest CHILD_OF|AUTO_CANCELED_BY a->b DEPTH 2 (Filter a.id IN [99000] (Entities Pipeline AS a)) (Filter b.id IN [99002] (Entities Pipeline AS b)))))

physical:
  clickhouse:
    planned:
      expect:
        - (PathFinding a->b depth=2 forward=1 backward=1 scoped=true tables=[gl_ci_edge] relationships=[CHILD_OF, AUTO_CANCELED_BY] ... (_) (_))
    emitted:
      expect:
        - (Deduplicate Final (Scan Table(gl_ci_edge) AS _orbit_e1))
