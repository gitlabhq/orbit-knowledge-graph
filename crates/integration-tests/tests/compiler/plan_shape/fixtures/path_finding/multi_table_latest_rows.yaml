name: CI path frontiers select current edge versions

query: |
  MATCH path = ANY SHORTEST (a:Pipeline {id: 99000})-[:CHILD_OF|AUTO_CANCELED_BY*1..2]->(b:Pipeline {id: 99002})
  RETURN path

logical:
  expect:
    - (Limit 30 (Select path (Shortest CHILD_OF|AUTO_CANCELED_BY a->b DEPTH 2 (Filter a.id = 99000 (Entities Pipeline AS a)) (Filter b.id = 99002 (Entities Pipeline AS b)))))

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_orbit_nf_a, _orbit_nf_b, _orbit_path_scope, _orbit_forward, _orbit_backward]
      expect:
        - (Filter _orbit_e1.source_id IN _orbit_nf_a.id, _orbit_e1.relationship_kind IN ['CHILD_OF', 'AUTO_CANCELED_BY'], _orbit_e1.source_kind = 'Pipeline', _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path (Deduplicate Final (Scan Table(gl_ci_edge) AS _orbit_e1)))
        - (Filter _orbit_e1.target_id IN _orbit_nf_b.id, _orbit_e1.relationship_kind IN ['CHILD_OF', 'AUTO_CANCELED_BY'], _orbit_e1.target_kind = 'Pipeline', _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path (Deduplicate Final (Scan Table(gl_ci_edge) AS _orbit_e1)))
        - (Filter (_orbit_forward._orbit_depth + _orbit_backward._orbit_depth) <= 2 (Join ON (_orbit_forward._orbit_end_node = _orbit_backward._orbit_end_node) AND (_orbit_forward._orbit_end_kind = _orbit_backward._orbit_end_kind) AND (_orbit_forward.traversal_path = _orbit_backward.traversal_path) (Scan Table(_orbit_forward) AS _orbit_forward) (Scan Table(_orbit_backward) AS _orbit_backward)))
      reject: ["(Scan Table(gl_ci_edge) AS _orbit_e2)"]
    emitted:
      expect:
        - (Deduplicate Final (Scan Table(gl_ci_edge) AS _orbit_e1))
