name: Filtered path endpoints use bounded current-row anchor keys

query: |
  MATCH p = ANY SHORTEST (a:User {username: 'alice'})-[:MEMBER_OF*1..1]->(b:Group {id: 100}) RETURN p

logical:
  expect:
    - (Limit 30 (Select p (Shortest MEMBER_OF a->b DEPTH 1 (Filter a.username = 'alice' (Entities User AS a)) (Filter b.id = 100 (Entities Group AS b)))))

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_orbit_nf_a, _orbit_forward]
      expect:
        - (Filter a.username = 'alice', Lower(a.username) = Lower('alice') (Deduplicate Final (Scan Table(gl_user) AS a)))
        - (Filter _orbit_e1.source_id IN _orbit_nf_a.id, _orbit_e1.relationship_kind = 'MEMBER_OF', _orbit_e1.source_kind = 'User' (Deduplicate Final (Scan Table(gl_edge) AS _orbit_e1)))
        - (Filter _orbit_forward._orbit_depth = 1, _orbit_forward._orbit_end_kind = 'Group', _orbit_forward._orbit_end_node = 100 (Scan Table(_orbit_forward) AS _orbit_forward))
    emitted:
      ctes:
        exact_order: [_orbit_nf_a, _orbit_forward]
      expect:
        - (CTE _orbit_nf_a (Limit 500 (_)))
        - (Filter a.username = 'alice', Lower(a.username) = Lower('alice') (Deduplicate Final (Scan Table(gl_user) AS a)))
        - (Filter _orbit_e1.source_id IN _orbit_nf_a.id, ... (_))
      reject: ["(CTE _orbit_path_scope (_))", "(Scan Table(gl_group) ...)"]
