name: Direct path anchors retain filters on pinned global nodes

query: |
  MATCH p = ANY SHORTEST (u:User {id: 1, username: 'nonexistent'})-[:MEMBER_OF*1..2]->(g:Group {id: 100})
  RETURN p

logical:
  expect:
    - (Limit 30 (Select p (Shortest MEMBER_OF u->g DEPTH 2 (Filter u.id = 1, u.username = 'nonexistent' (Entities User AS u)) (Filter g.id = 100 (Entities Group AS g)))))

physical:
  clickhouse:
    emitted:
      expect:
        - (Filter u.username = 'nonexistent', ... (_))
