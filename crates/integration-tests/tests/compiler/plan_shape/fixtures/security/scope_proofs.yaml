security: { paths: [1/2/3/, 1/2/4/], scope_proofs: { p: 1/2/ } }

cases:
  - name: A literal proof without a lookup keeps the user's deeper paths
    query:
      json: '{"query_type":"traversal","nodes":[{"id":"p","entity":"Project","filters":{"name":"example"}}],"limit":20}'
      gql: "MATCH (p:Project {name: 'example'}) RETURN p LIMIT 20"
    physical:
      clickhouse:
        compiled:
          expect:
            - (Filter StartsWith(p.traversal_path, '1/2/3/') OR StartsWith(p.traversal_path, '1/2/4/'), StartsWith(p.traversal_path, '1/2/') OR ('1/2/' = '0/'), ... (_))
          reject: ["(Filter StartsWith(p.traversal_path, scalar ?) OR ?, ... (_))"]

  - name: An ID lookup proof is itself limited to the user's paths
    query:
      json: '{"query_type":"traversal","nodes":[{"id":"p","entity":"Project","node_ids":[100]}],"limit":20}'
      gql: "MATCH (p:Project {id: 100}) RETURN p LIMIT 20"
    physical:
      clickhouse:
        compiled:
          expect:
            - (Filter StartsWith(p.traversal_path, '1/2/3/') OR StartsWith(p.traversal_path, '1/2/4/'), StartsWith(p.traversal_path, '1/2/') OR ('1/2/' = '0/'), ... (_))
            - (Filter StartsWith(p.traversal_path, scalar(SELECT Coalesce(If(ArgMaxOrNull(_scope._deleted, _scope._version), null, ArgMaxOrNull(_scope.traversal_path, _scope._version)), '0/') AS traversal_path FROM gl_project AS _scope WHERE (StartsWith(_scope.traversal_path, '1/2/3/') OR StartsWith(_scope.traversal_path, '1/2/4/')) AND (_scope.id = 100))) OR ?, ... (_))

  - name: A full-path lookup proof is itself limited to the user's paths
    query:
      json: '{"query_type":"traversal","nodes":[{"id":"p","entity":"Project","filters":{"full_path":"parent/project"}}],"limit":20}'
      gql: "MATCH (p:Project {full_path: 'parent/project'}) RETURN p LIMIT 20"
    physical:
      clickhouse:
        compiled:
          expect:
            - (Filter StartsWith(p.traversal_path, '1/2/3/') OR StartsWith(p.traversal_path, '1/2/4/'), StartsWith(p.traversal_path, '1/2/') OR ('1/2/' = '0/'), ... (_))
            - (Filter StartsWith(p.traversal_path, scalar(SELECT Coalesce(If(ArgMaxOrNull(_scope._deleted, _scope._version), null, ArgMaxOrNull(_scope.traversal_path, _scope._version)), '0/') AS traversal_path FROM gl_project AS _scope FINAL WHERE (StartsWith(_scope.traversal_path, '1/2/3/') OR StartsWith(_scope.traversal_path, '1/2/4/')) AND (_scope.full_path = 'parent/project'))) OR ?, ... (_))

  - name: A holder FK lookup proof is itself limited to the user's paths
    query:
      json: '{"query_type":"traversal","nodes":[{"id":"p","entity":"MergeRequest","filters":{"project_id":100}}],"limit":20}'
      gql: "MATCH (p:MergeRequest {project_id: 100}) RETURN p LIMIT 20"
    physical:
      clickhouse:
        compiled:
          expect:
            - (Filter StartsWith(p.traversal_path, '1/2/3/') OR StartsWith(p.traversal_path, '1/2/4/'), StartsWith(p.traversal_path, '1/2/') OR ('1/2/' = '0/'), ... (_))
            - (Filter StartsWith(p.traversal_path, scalar(SELECT Coalesce(If(ArgMaxOrNull(_scope._deleted, _scope._version), null, ArgMaxOrNull(_scope.traversal_path, _scope._version)), '0/') AS traversal_path FROM gl_project AS _scope WHERE (StartsWith(_scope.traversal_path, '1/2/3/') OR StartsWith(_scope.traversal_path, '1/2/4/')) AND (_scope.id = 100))) OR ?, ... (_))

  - name: A container lookup proof is itself limited to the user's paths
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"g","entity":"Group","node_ids":[100]},{"id":"p","entity":"Project"}],"relationships":[{"type":"CONTAINS","from":"g","to":"p"}],"aggregations":[{"count":"p","as":"c"}],"limit":20}'
      gql: "MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project) RETURN count(p) AS c LIMIT 20"
    physical:
      clickhouse:
        compiled:
          expect:
            - (Filter StartsWith(p.traversal_path, '1/2/3/') OR StartsWith(p.traversal_path, '1/2/4/'), StartsWith(p.traversal_path, '1/2/') OR ('1/2/' = '0/'), ... (_))
            - (Filter (StartsWith(p.traversal_path, scalar(SELECT Coalesce(If(ArgMaxOrNull(_scope._deleted, _scope._version), null, ArgMaxOrNull(_scope.traversal_path, _scope._version)), '0/') AS traversal_path FROM gl_group AS _scope WHERE (StartsWith(_scope.traversal_path, '1/2/3/') OR StartsWith(_scope.traversal_path, '1/2/4/')) AND (_scope.id = 100))) AND (CountSubstrings(p.traversal_path, '/') >= ?) AND (CountSubstrings(p.traversal_path, '/') <= ?)) OR ?, ... (_))
