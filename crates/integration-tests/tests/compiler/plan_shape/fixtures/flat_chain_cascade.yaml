name: Selective flat chain retains current-row scans and a dependent cascade anchor
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "a", "entity": "Definition", "node_ids": [1], "columns": ["id"]},
        {"id": "b", "entity": "Definition", "columns": ["id"]},
        {"id": "c", "entity": "Definition", "columns": ["id"]},
        {"id": "d", "entity": "Definition", "columns": ["id"]}
      ],
      "relationships": [
        {"type": "CALLS", "from": "a", "to": "b"},
        {"type": "CALLS", "from": "b", "to": "c"},
        {"type": "CALLS", "from": "c", "to": "d"}
      ]
    }
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition)-[:CALLS]->(d:Definition)
    RETURN a.id, b.id, c.id, d.id
logical:
  expect:
    - (Node a Definition (Ids 1) ...)
    - (Relationship a b Outgoing (Kinds CALLS) (Hops 1 1) (Filters))
    - (Relationship b c Outgoing (Kinds CALLS) (Hops 1 1) (Filters))
physical:
  clickhouse:
    expect:
      - (Strategy (Flat (Join INNER (= (Column e1 target_id) (Column e2 source_id)) (Join ...) _)))
      - (KeyFilter (Column e1 source_id) _ (Scope e1 (Filter (= (Column e1 _deleted) (Literal false)) (Read gl_code_edge e1 Final))))
      - (KeyFilter (Column e1p source_id) (SourceFragment (Outputs (Output target_id (Column e0p target_id))) (Filter _ (Read gl_code_edge e0p Plain))) (Filter _ (Read gl_code_edge e1p Plain)))
      - (Hop b c gl_code_edge (Depth 1 1) (Cascade true))
      - (Join INNER (= (Column e0 target_id) (Column e1 source_id)) _ _)
      - (Scan gl_code_edge e0 Final)
      - (Scan gl_code_edge e1 Final)
      - (InQuery (Column e1 source_id) (Query ... (Scan gl_code_edge e0p Plain) ...))
      - (InQuery (Column e2 source_id) (Query ... (Scan gl_code_edge e1p Plain) (Where (AND _ (InQuery (Column e1p source_id) (Query ... (Scan gl_code_edge e0p Plain) ...)))) ...))
  duckdb:
    expect:
      - (Strategy (Flat (Join INNER (= (Column d id) (Column e2 target_id)) _ (Scope d _))))
      - (KeyFilter (Column e2 source_id) _ _)
      - (Join INNER (= (Column e0 target_id) (Column e1 source_id)) _ _)
      - (Node a gl_definition Join)
      - (Node b gl_definition Join)
      - (Node c gl_definition Join)
