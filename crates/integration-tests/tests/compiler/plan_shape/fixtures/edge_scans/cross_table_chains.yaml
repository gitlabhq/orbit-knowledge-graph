cases:
  - name: Merge request pipeline branch chain composes default CI and code tables
    query: |
      MATCH (user:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)-[:HAS_HEAD_PIPELINE]->(pipeline:Pipeline)-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch) RETURN user, mr, pipeline, project, branch
    logical:
      expect:
        - (Follow CONTAINS project->branch AS e3 (Follow IN_PROJECT pipeline->project AS e2 (Follow HAS_HEAD_PIPELINE mr->pipeline AS e1 (Follow AUTHORED user->mr AS e0 (Filter ... (Entities User AS user))))))
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_merge_request) AS mr)
            - (Scan Table(gl_pipeline) AS pipeline)
            - (Scan Table(gl_code_edge) AS _orbit_edge_3)

  - name: Merge request diff branch chain composes default diff and code tables
    query: |
      MATCH (user:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)-[:HAS_DIFF]->(diff:MergeRequestDiff)-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch) RETURN user, mr, diff, project, branch
    logical:
      expect:
        - (Follow CONTAINS project->branch AS e3 (Follow IN_PROJECT diff->project AS e2 (Follow HAS_DIFF mr->diff AS e1 (Follow AUTHORED user->mr AS e0 (Filter ... (Entities User AS user))))))
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_merge_request) AS mr)
            - (Scan Table(gl_merge_request_diff) AS diff)
            - (Scan Table(gl_code_edge) AS _orbit_edge_3)

  - name: Security scan project branch chain composes security and code tables
    query: |
      MATCH (scan:SecurityScan {id: 1})-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch)-[:CONTAINS]->(directory:Directory) RETURN scan, project, branch, directory
    logical:
      expect:
        - (Follow CONTAINS branch->directory AS e2 (Follow CONTAINS project->branch AS e1 (Follow IN_PROJECT scan->project AS e0 (Filter ... (Entities SecurityScan AS scan)))))
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_security_scan) AS scan)
            - (Scan Table(gl_code_edge) AS _orbit_edge_1)
            - (Scan Table(gl_code_edge) AS _orbit_edge_2)

  - name: Untyped merge request alternatives union default CI and diff tables
    query: |
      MATCH (mr:MergeRequest {id: 1})-[:IN_PROJECT|HAS_HEAD_PIPELINE|HAS_DIFF]->(target) RETURN mr, target
    logical:
      expect:
        - (Neighbors IN_PROJECT|HAS_HEAD_PIPELINE|HAS_DIFF mr->target (Filter mr.id = 1 (Entities MergeRequest AS mr)))
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_neighbor_edge_arm.source_kind = 'MergeRequest', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind IN ['IN_PROJECT', 'HAS_HEAD_PIPELINE', 'HAS_DIFF'] (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm))
            - (Filter _orbit_neighbor_edge_arm.source_kind = 'MergeRequest', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind IN ['IN_PROJECT', 'HAS_HEAD_PIPELINE', 'HAS_DIFF'] (Scan Table(gl_diff_edge) AS _orbit_neighbor_edge_arm))
            - (Filter _orbit_neighbor_edge_arm.source_kind = 'MergeRequest', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind IN ['IN_PROJECT', 'HAS_HEAD_PIPELINE', 'HAS_DIFF'] (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm))
          occurrences:
            - pattern: (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm)
              count: 1
            - pattern: (Scan Table(gl_diff_edge) AS _orbit_neighbor_edge_arm)
              count: 1
            - pattern: (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)
              count: 1
        emitted:
          expect:
            - (Union ALL AS _orbit_neighbor_edge (_) (_) (_))
            - (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)
            - (Scan Table(gl_ci_edge) AS _orbit_neighbor_edge_arm)
            - (Scan Table(gl_diff_edge) AS _orbit_neighbor_edge_arm)

  - name: Split AUTHORED neighbors retain default and security routes
    query: |
      MATCH (user:User {id: 1})-[:AUTHORED]->(neighbor) RETURN user, neighbor
    logical:
      expect:
        - (Neighbors AUTHORED user->neighbor (Filter user.id = 1 (Entities User AS user)))
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_neighbor_edge_arm.source_kind = 'User', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind = 'AUTHORED', _orbit_neighbor_edge_arm._deleted = false (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm))
            - (Filter _orbit_neighbor_edge_arm.source_kind = 'User', _orbit_neighbor_edge_arm.source_id = 1, _orbit_neighbor_edge_arm.relationship_kind = 'AUTHORED', _orbit_neighbor_edge_arm._deleted = false (Scan Table(gl_sec_edge) AS _orbit_neighbor_edge_arm))
        emitted:
          expect:
            - (Union ALL AS _orbit_neighbor_edge (_) (_))
            - (Scan Table(gl_edge) AS _orbit_neighbor_edge_arm)
            - (Scan Table(gl_sec_edge) AS _orbit_neighbor_edge_arm)

  - name: Cross-table shortest path keeps scoped CI and code frontiers
    query: |
      MATCH path = ANY SHORTEST (pipeline:Pipeline {id: 1})-[:IN_PROJECT|CONTAINS*1..2]->(branch:Branch {id: 2}) RETURN path
    logical:
      expect:
        - (Shortest IN_PROJECT|CONTAINS pipeline->branch DEPTH 2 (Filter pipeline.id = 1 (Entities Pipeline AS pipeline)) (Filter branch.id = 2 (Entities Branch AS branch)))
    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_orbit_nf_pipeline, _orbit_nf_branch, _orbit_path_scope, _orbit_forward, _orbit_backward]
          expect:
            - (Filter _orbit_e1.source_id IN _orbit_nf_pipeline.id, _orbit_e1.relationship_kind IN ['IN_PROJECT', 'CONTAINS'], _orbit_e1.source_kind = 'Pipeline', _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path (_))
            - (Filter _orbit_e1.target_id IN _orbit_nf_branch.id, _orbit_e1.relationship_kind IN ['IN_PROJECT', 'CONTAINS'], _orbit_e1.target_kind = 'Branch', _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path (_))
            - (Filter (_orbit_forward._orbit_depth + _orbit_backward._orbit_depth) <= 2 (Join ON (_orbit_forward._orbit_end_node = _orbit_backward._orbit_end_node) AND (_orbit_forward._orbit_end_kind = _orbit_backward._orbit_end_kind) AND (_orbit_forward.traversal_path = _orbit_backward.traversal_path) (Scan Table(_orbit_forward) AS _orbit_forward) (Scan Table(_orbit_backward) AS _orbit_backward)))
          reject: ["(Scan Table(gl_edge) AS _orbit_e2_arm)"]
          occurrences:
            - pattern: (Scan Table(gl_ci_edge) AS _orbit_e1_arm)
              count: 2
            - pattern: (Scan Table(gl_code_edge) AS _orbit_e1_arm)
              count: 2
            - pattern: (Scan Table(gl_diff_edge) AS _orbit_e1_arm)
              count: 2
            - pattern: (Scan Table(gl_edge) AS _orbit_e1_arm)
              count: 2
            - pattern: (Scan Table(gl_sec_edge) AS _orbit_e1_arm)
              count: 2
        emitted:
          expect:
            - (CTE _orbit_path_scope (Union ALL (_) (_)))
            - (Filter _orbit_e1.traversal_path IN _orbit_path_scope.traversal_path, ... (_))
            - (Scan Table(gl_ci_edge) AS _orbit_e1_arm)
            - (Scan Table(gl_code_edge) AS _orbit_e1_arm)
            - (Scan Table(gl_diff_edge) AS _orbit_e1_arm)
            - (Scan Table(gl_edge) AS _orbit_e1_arm)
            - (Scan Table(gl_sec_edge) AS _orbit_e1_arm)
