name: Code relationships retain endpoint filtering on both backends

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "caller", "entity": "Definition", "node_ids": [1], "columns": ["id"]},
        {"id": "callee", "entity": "Definition", "columns": ["id"]}
      ],
      "relationships": [{"type": "CALLS", "from": "caller", "to": "callee"}]
    }
  gql: |
    MATCH (caller:Definition {id: 1})-[:CALLS]->(callee:Definition)
    RETURN caller.id, callee.id

logical:
  expect:
    - (Filter caller.id IN [1] (NodeScan Definition AS caller))
    - (EdgeScan CALLS caller->callee AS e0)

physical:
  clickhouse:
    planned:
      expect:
        - (Scan Table(gl_code_edge) AS _orbit_edge_0)
        - (Filter _orbit_edge_0.source_id = 1, ... (_))
  duckdb:
    planned:
      expect:
        - (Join ON callee.id = _orbit_edge_0.target_id (_) (Bind callee (Filter ... (Deduplicate Final (Scan Table(gl_definition) AS callee)))))
        - (Join ON caller.id = _orbit_edge_0.source_id (_) (Bind caller (Filter ... (Deduplicate Final (Scan Table(gl_definition) AS caller)))))
        - (Scan Table(gl_edge) AS _orbit_edge_0)
