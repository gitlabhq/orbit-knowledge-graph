name: Code relationships retain endpoint filtering on both backends

query: |
  MATCH (caller:Definition {id: 1})-[:CALLS]->(callee:Definition)
  RETURN caller.id, callee.id

logical:
  expect:
    - (Select caller{id}, callee{id} (Follow CALLS caller->callee AS e0 (Filter caller.id = 1 (Entities Definition AS caller))))

physical:
  clickhouse:
    planned:
      expect:
        - (Scan Table(gl_code_edge) AS _orbit_edge_0)
        - (Filter _orbit_edge_0.source_id = 1, ... (_))
  duckdb:
    planned:
      expect:
        - (Join ON callee.id = _orbit_edge_0.target_id (_) (Bind callee (Project * (Scan Table(gl_definition) AS callee))))
        - (Join ON caller.id = _orbit_edge_0.source_id (_) (Bind caller (Project * (Filter caller.id = 1 (Scan Table(gl_definition) AS caller)))))
        - (Scan Table(gl_edge) AS _orbit_edge_0)
