name: Covered node filters use edge tags and the capped edge read bounds the node reads

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","filters":{"definition_type":"function"}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
  gql: |
    MATCH (a:Definition {definition_type: 'function'})-[:CALLS]->(b:Definition) RETURN a, b

logical:
  expect: ["(Filter a.definition_type = 'function' (_))"]

physical:
  clickhouse:
    planned:
      bind:
        - (CTE $edges (Deduplicate LimitBy ... (_)))
        - (CTE $sources (Project _id_source.source_id AS id (_)))
        - (CTE $targets (Project _id_source.target_id AS id (_)))
      ctes:
        exact_order: [$edges, $sources, $targets]
      expect:
        - (Deduplicate LimitBy _orbit_edge_0.traversal_path, _orbit_edge_0.relationship_kind, _orbit_edge_0.project_id, _orbit_edge_0.branch, _orbit_edge_0.source_id, _orbit_edge_0.target_id, _orbit_edge_0.source_kind, _orbit_edge_0.target_kind Limit 124 (Filter _orbit_edge_0.relationship_kind = 'CALLS', _orbit_edge_0.source_kind = 'Definition', _orbit_edge_0.target_kind = 'Definition', _orbit_edge_0._deleted = false, _orbit_edge_0.source_tags HAS ANY ['definition_type:function'] (Scan Table(gl_code_edge) AS _orbit_edge_0)))
        - (Filter a.id IN $sources.id (Scan Table(gl_definition) AS a))
        - (Filter b.id IN $targets.id (Scan Table(gl_definition) AS b))
      reject:
        - (Deduplicate Final (_))
    emitted:
      expect:
        - (Limit 124 (Project * (Filter _orbit_edge_0._deleted = false, ArrayContains(_orbit_edge_0.source_tags, 'definition_type:function') (_))))
      occurrences:
        - { pattern: "(Scan Table(gl_code_edge) ...)", count: 1 }
