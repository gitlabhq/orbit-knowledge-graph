name: A pinned final endpoint reverses the edge chain

query:
  gql: |
    MATCH (a:Definition)-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition {id: 7}) RETURN a, b, c

logical:
  expect: ["(EdgeScan CALLS a->b AS e0)"]

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON _orbit_edge_1.source_id = _orbit_edge_0.target_id (_) (_))
        - (Filter _orbit_edge_1.target_id = 7, ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_1)))
      reject: ["(Scan Table(gl_definition) ...)"]
    emitted:
      expect:
        - (Join ON _orbit_edge_1.source_id = _orbit_edge_0.target_id (_) (_))
        - (Filter _orbit_edge_1.target_id = 7, ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_1)))
