name: A pinned final endpoint anchors the chain at its last edge

query: |
  MATCH (a:Definition)-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition {id: 7}) RETURN a, b, c

logical:
  expect:
    - (Filter c.id = 7 (Follow CALLS b->c AS e1 (Follow CALLS a->b AS e0 (Entities Definition AS a))))

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON _orbit_edge_1.source_id = _orbit_edge_0.target_id (_) (_))
        - (Filter _orbit_edge_1._deleted = false (Bind _orbit_edge_1 (Deduplicate LimitBy ... (Sort _orbit_edge_1.traversal_path, _orbit_edge_1.relationship_kind, _orbit_edge_1.project_id, _orbit_edge_1.branch, _orbit_edge_1.source_id, _orbit_edge_1.target_id, _orbit_edge_1.source_kind, _orbit_edge_1.target_kind, _orbit_edge_1._version DESC (Project * (Filter _orbit_edge_1.target_id = 7, ... (Scan Table(gl_code_edge) AS _orbit_edge_1)))))))
        - (Filter _orbit_edge_0._deleted = false (Bind _orbit_edge_0 (Deduplicate LimitBy ... (Sort _orbit_edge_0.traversal_path, _orbit_edge_0.relationship_kind, _orbit_edge_0.project_id, _orbit_edge_0.branch, _orbit_edge_0.source_id, _orbit_edge_0.target_id, _orbit_edge_0.source_kind, _orbit_edge_0.target_kind, _orbit_edge_0._version DESC (Project * (Filter _orbit_edge_0.target_id IN ?.id, ... (Scan Table(gl_code_edge) AS _orbit_edge_0)))))))
    emitted:
      expect:
        - (Join ON _orbit_edge_1.source_id = _orbit_edge_0.target_id (_) (_))
        - (Filter _orbit_edge_1.target_id = 7, ... (Scan Table(gl_code_edge) AS _orbit_edge_1))
        - (Filter _orbit_edge_0.target_id IN ?.id, ... (Scan Table(gl_code_edge) AS _orbit_edge_0))
