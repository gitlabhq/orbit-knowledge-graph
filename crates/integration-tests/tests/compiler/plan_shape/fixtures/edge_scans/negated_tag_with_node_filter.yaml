name: A NOT leaf on a node that also has an untagged filter reads the node row and the edge tag
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":{"starts_with":"ali"}},"not":{"state":{"in":["blocked"]}}},{"id":"g","entity":"Group","node_ids":[100]},{"id":"p","entity":"Project","columns":["name"]}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"},{"type":"CONTAINS","from":"g","to":"p"}]}
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group {id: 100})-[:CONTAINS]->(p:Project)
    WHERE u.username STARTS WITH 'ali' AND NOT u.state IN ['blocked']
    RETURN p.name
logical:
  expect:
    - (Filter NOT (u.state IN ['blocked']) (_))
physical:
  clickhouse:
    planned:
      expect:
        - (Filter NOT ((u.state IN ['blocked']) AND (e0.source_tags HAS ANY ['state:blocked'])) (_))
