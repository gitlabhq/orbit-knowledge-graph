name: A shared denormalized node filter is emitted only once

query:
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition {definition_type: 'function'})-[:CALLS]->(c:Definition) RETURN a, b, c

logical:
  expect: ["(Filter b.definition_type = 'function' (_))"]

physical:
  clickhouse:
    planned:
      expect: ["(Filter _orbit_edge_0.target_tags HAS ANY ['definition_type:function'], ... (_))"]
      reject: ["(Filter _orbit_edge_1.source_tags HAS ANY ?, ... (_))", "(Scan Table(gl_definition) ...)"]
    emitted:
      expect: ["(Filter ArrayContains(_orbit_edge_0.target_tags, 'definition_type:function'), ... (_))"]
      reject: ["(Filter ArrayContains(_orbit_edge_1.source_tags, ?), ... (_))"]
