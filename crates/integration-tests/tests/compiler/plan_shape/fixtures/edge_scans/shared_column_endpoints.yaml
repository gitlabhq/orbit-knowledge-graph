cases:
  - name: A project filter on one endpoint pins every endpoint scan of a code edge
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"i","entity":"ImportedSymbol","filters":{"project_id":42}},{"id":"d","entity":"Definition"}],"relationships":[{"type":"IMPORTS","from":"i","to":"d"}]}
      gql: |
        MATCH (i:ImportedSymbol)-[:IMPORTS]->(d:Definition) WHERE i.project_id = 42 RETURN i, d
    logical:
      expect: ["(Filter i.project_id = 42 (_))"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_0.project_id = 42, ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))
            - (Filter i.project_id = 42 (Deduplicate Final (Scan Table(gl_imported_symbol) AS i)))
            - (Filter d.project_id = 42 (Deduplicate Final (Scan Table(gl_definition) AS d)))
        emitted:
          expect:
            - (Filter i.project_id = 42 (Deduplicate Final (Scan Table(gl_imported_symbol) AS i)))
            - (Filter d.project_id = 42 (Deduplicate Final (Scan Table(gl_definition) AS d)))

  - name: A filter on the target endpoint pins the source endpoint scan
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition"},{"id":"b","entity":"Definition","filters":{"project_id":42}}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
      gql: |
        MATCH (a:Definition)-[:CALLS]->(b:Definition) WHERE b.project_id = 42 RETURN a, b
    logical:
      expect: ["(Filter b.project_id = 42 (_))"]
    physical:
      clickhouse:
        emitted:
          expect:
            - (Filter _orbit_edge_0.project_id = 42, ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))
            - (Filter a.project_id = 42 (Deduplicate Final (Scan Table(gl_definition) AS a)))
            - (Filter b.project_id = 42 (Deduplicate Final (Scan Table(gl_definition) AS b)))

  - name: An endpoint takes only the shared columns its own table stores
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"b","entity":"Branch"},{"id":"f","entity":"File","filters":{"project_id":42,"branch":"main"}}],"relationships":[{"type":"CONTAINS","from":"b","to":"f"}]}
      gql: |
        MATCH (b:Branch)-[:CONTAINS]->(f:File) WHERE f.project_id = 42 AND f.branch = 'main' RETURN b, f
    logical:
      expect: ["(Filter f.project_id = 42, f.branch = 'main' (_))"]
    physical:
      clickhouse:
        emitted:
          expect:
            - (Filter _orbit_edge_0.branch = 'main', _orbit_edge_0.project_id = 42, ... (Scan Table(gl_code_edge) AS _orbit_edge_0))
            - (Filter b.project_id = 42 (Deduplicate Final (Scan Table(gl_branch) AS b)))
            - (Filter f.branch = 'main', f.project_id = 42 (Scan Table(gl_file) AS f))
          reject:
            - (Filter b.branch = 'main', ... (_))
