name: A NOT group over edge columns and non-nullable denormalized properties reads no node table
query:
  gql: |
    MATCH (u:User)-[r:MEMBER_OF]->(g:Group {id: 100})
    WHERE NOT (r.source_id < 50 AND u.state = 'active')
    RETURN count(u) AS n
missing_frontends:
  json: JSON filters cannot express grouped negation.
logical:
  expect:
    - (Filter NOT ((e0.source_id < 50) AND (u.state = 'active')) (_))
physical:
  clickhouse:
    planned:
      expect:
        - (Filter NOT ((e0.source_id < 50) AND (e0.source_tags HAS ANY ['state:active'])) (_))
      reject:
        - (Scan Table(gl_user) ...)
