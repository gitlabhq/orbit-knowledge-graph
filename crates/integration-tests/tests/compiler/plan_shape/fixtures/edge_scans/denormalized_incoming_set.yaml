name: Incoming denormalized sets filter the physical target tags

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","filters":{"definition_type":{"in":["function","method"]}}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b","direction":"incoming"}]}
  gql: |
    MATCH (a:Definition)<-[:CALLS]-(b:Definition) WHERE a.definition_type IN ['function', 'method'] RETURN a, b

logical:
  gql:
    expect:
      - (Filter a.definition_type IN ['function', 'method'] (Follow CALLS a<-b AS e0 (Entities Definition AS a)))
  json:
    expect:
      - (Follow CALLS a<-b AS e0 (Filter a.definition_type IN ['function', 'method'] (Entities Definition AS a)))

physical:
  clickhouse:
    planned:
      expect: ["(Filter _orbit_edge_0.target_tags HAS ANY ['definition_type:function', 'definition_type:method'], ... (_))"]
    emitted:
      expect: ["(Filter ArrayContainsAny(_orbit_edge_0.target_tags, Array('definition_type:function', 'definition_type:method')), ... (_))"]
