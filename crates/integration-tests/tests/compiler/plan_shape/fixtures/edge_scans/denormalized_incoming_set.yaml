name: Incoming denormalized sets filter the physical target tags

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","filters":{"kind":{"in":["function","method"]}}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b","direction":"incoming"}]}
  gql: |
    MATCH (a:Definition)<-[:CALLS]-(b:Definition) WHERE a.kind IN ['function', 'method'] RETURN a, b

logical:
  expect: ["(EdgeScan CALLS b->a AS e0)"]

physical:
  clickhouse:
    planned:
      expect: ["(Filter _orbit_edge_0.target_tags HAS ANY ['kind:function', 'kind:method'], ... (_))"]
    emitted:
      expect: ["(Filter ArrayContainsAny(_orbit_edge_0.target_tags, Array('kind:function', 'kind:method')), ... (_))"]
