name: Code scope columns push to edges once while reserved IDs keep endpoint meaning

query:
  gql: |
    MATCH (a:Definition {id: 1, project_id: 9, branch: 'main'})-[:CALLS]->(b:Definition {project_id: 9, branch: 'main'}) RETURN a, b

logical:
  expect: ["(Filter a.project_id = 9, a.branch = 'main', ... (_))"]

physical:
  clickhouse:
    planned:
      expect: ["(Filter _orbit_edge_0.branch = 'main', _orbit_edge_0.project_id = 9, _orbit_edge_0.source_id = 1, _orbit_edge_0.relationship_kind = 'CALLS', _orbit_edge_0.source_kind = 'Definition', _orbit_edge_0.target_kind = 'Definition', _orbit_edge_0._deleted = false (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))"]
      reject: ["(Filter _orbit_edge_0.id = 1, ... (_))"]
    emitted:
      expect: ["(Filter _orbit_edge_0.branch = 'main', _orbit_edge_0.project_id = 9, _orbit_edge_0.source_id = 1, ... (_))"]
