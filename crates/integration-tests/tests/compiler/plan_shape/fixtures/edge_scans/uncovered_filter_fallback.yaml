name: Uncovered filters keep the node scan alongside covered edge tags

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","filters":{"kind":"function","name":"compile"}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
  gql: |
    MATCH (a:Definition {kind: 'function', name: 'compile'})-[:CALLS]->(b:Definition) RETURN a, b

logical:
  expect: ["(Filter a.kind = 'function', a.name = 'compile' (_))"]

physical:
  clickhouse:
    planned:
      expect:
        - (Filter a._deleted = false (Deduplicate LimitBy ... (Filter a.kind = 'function', a.name = 'compile' (Scan Table(gl_definition) AS a))))
        - (Filter _orbit_edge_0.source_tags HAS ANY ['kind:function'], ... (_))
    emitted:
      expect:
        - (Filter a.kind = 'function', a.name = 'compile', Lower(a.name) = Lower('compile') (Scan Table(gl_definition) AS a))
        - (Deduplicate LimitBy ... (_))
        - (Filter ArrayContains(_orbit_edge_0.source_tags, 'kind:function'), ... (_))
        - (Join ON a.id = _orbit_edge_0.source_id (_) (Bind a (_)))
      reject: ["(CTE _filter_a (_))"]
