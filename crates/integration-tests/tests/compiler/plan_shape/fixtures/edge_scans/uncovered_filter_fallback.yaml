name: Uncovered filters narrow the edge scan with filter-only keys alongside covered edge tags

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","filters":{"definition_type":"function","name":"compile"}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
  gql: |
    MATCH (a:Definition {definition_type: 'function', name: 'compile'})-[:CALLS]->(b:Definition) RETURN a, b

logical:
  expect: ["(Filter a.definition_type = 'function', a.name = 'compile' (_))"]

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_filter_a]
      expect:
        - (CTE _filter_a (Project a.id AS id (Filter a.definition_type = 'function', a.name = 'compile', ... (Deduplicate Final (Scan Table(gl_definition) AS a)))))
        - (Filter _orbit_edge_0.source_id IN _filter_a.id, _orbit_edge_0.source_tags HAS ANY ['definition_type:function'], ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))
    emitted:
      ctes:
        exact_order: [_filter_a]
      expect:
        - (CTE _filter_a (Project a.id AS id (Filter a.definition_type = 'function', a.name = 'compile', ... (Deduplicate Final (Scan Table(gl_definition) AS a)))))
        - (Filter _orbit_edge_0.source_id IN _filter_a.id, ArrayContains(_orbit_edge_0.source_tags, 'definition_type:function'), ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))
      reject: ["(Join ON a.id = _orbit_edge_0.source_id (_) (_))"]
