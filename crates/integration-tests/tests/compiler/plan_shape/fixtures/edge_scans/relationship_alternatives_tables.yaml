name: Typed CI relationship alternatives share the CI edge table

query:
  gql: |
    MATCH (a:Pipeline {id: 99000})-[:CHILD_OF|AUTO_CANCELED_BY]->(b:Pipeline)
    RETURN a,b

logical:
  expect:
    - (NodeScan Pipeline AS a)

physical:
  clickhouse:
    planned:
      expect:
        - (Scan Table(gl_ci_edge) AS _orbit_edge_0)
      reject:
        - (Scan Table(gl_edge) ...)
