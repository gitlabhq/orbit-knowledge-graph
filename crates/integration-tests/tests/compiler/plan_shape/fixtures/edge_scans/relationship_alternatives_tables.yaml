name: Typed CI relationship alternatives share the CI edge table

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Pipeline","node_ids":[99000]},{"id":"b","entity":"Pipeline"}],"relationships":[{"type":["CHILD_OF","AUTO_CANCELED_BY"],"from":"a","to":"b"}]}
  gql: |
    MATCH (a:Pipeline {id: 99000})-[:CHILD_OF|AUTO_CANCELED_BY]->(b:Pipeline)
    RETURN a,b

physical:
  clickhouse:
    normalize:
      input:
        expect:
          - (NodeScan Pipeline AS a)

    plan_clickhouse:
      query_plan:
        expect:
          - (Scan Table(gl_ci_edge) AS _orbit_edge_0)
        reject:
          - (Scan Table(gl_edge) ...)
