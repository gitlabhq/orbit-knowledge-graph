name: Covered relationship alternatives share denormalized tag filtering

query: |
  MATCH (u:User {id: 99002})-[:AUTHORED|APPROVED]->(mr:MergeRequest {state: 'opened'})
  RETURN count(mr) AS n

logical:
  expect:
    - (Aggregate COUNT(mr) AS n (Filter mr.state = 'opened' (Follow AUTHORED|APPROVED u->mr AS e0 (Filter ... (Entities User AS u)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter ArrayContains(_orbit_edge_0.target_tags, 'state:opened'), ... (Bind _orbit_edge_0 (Deduplicate LimitBy 1 BY _orbit_edge_0.traversal_path, _orbit_edge_0.relationship_kind, _orbit_edge_0.source_id, _orbit_edge_0.target_id, _orbit_edge_0.source_kind, _orbit_edge_0.target_kind (Sort _orbit_edge_0.traversal_path, _orbit_edge_0.relationship_kind, _orbit_edge_0.source_id, _orbit_edge_0.target_id, _orbit_edge_0.source_kind, _orbit_edge_0.target_kind, _orbit_edge_0._version DESC (Project * (Filter _orbit_edge_0.relationship_kind IN ['AUTHORED', 'APPROVED'], _orbit_edge_0.source_kind = 'User', _orbit_edge_0.target_kind = 'MergeRequest', _orbit_edge_0.source_id = 99002 (Scan Table(gl_edge) AS _orbit_edge_0)))))))
      reject:
    emitted:
      expect:
        - (Filter ArrayContains(_orbit_edge_0.target_tags, 'state:opened'), ... (Bind _orbit_edge_0 (_)))
      reject:
