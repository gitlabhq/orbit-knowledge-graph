cases:
  - name: Wildcard traversals infer relationship kinds from both endpoint entities
    query:
      json: '{"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"}],"relationships":[{"type":"*","from":"u","to":"mr"}],"limit":10}'
      gql: "MATCH (u:User {id: 1})-->(mr:MergeRequest) RETURN u, mr LIMIT 10"
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter _orbit_edge_0.relationship_kind IN ['APPROVED', 'ASSIGNED', 'AUTHORED', 'CLOSED', 'LAST_EDITED_BY', 'MERGED', 'REOPENED', 'REVIEWER', 'UPDATED_BY'], _orbit_edge_0.source_kind = 'User', _orbit_edge_0.target_kind = 'MergeRequest', ... (Deduplicate Final (Scan Table(gl_edge) AS _orbit_edge_0)))
          reject: [(Scan Table(gl_code_edge) ...)]

  - name: Wildcard neighbors infer relationship kinds and tables from the center entity
    query:
      json: '{"query_type":"neighbors","nodes":[{"id":"u","entity":"User","node_ids":[1]}],"neighbors":{"direction":"outgoing"},"limit":10}'
      gql: "MATCH (u:User {id: 1})-->(n) RETURN n LIMIT 10"
    physical:
      clickhouse:
        planned:
          expect:
            - (Neighbors center=u direction=outgoing directional outgoing=[gl_ci_edge, gl_edge] incoming=[gl_ci_edge, gl_edge] center_filter=false relationships=[APPROVED, ASSIGNED, AUTHORED, CLOSED, CONFIRMED_BY, CONTAINS, CREATOR, DEPLOYED_BY, DISMISSED_BY, LAST_EDITED_BY, MEMBER_OF, MERGED, OWNER, REOPENED, RESOLVED_BY, REVIEWER, TRIGGERED, UPDATED_BY] ... (_))
        emitted:
          reject: [(Scan Table(gl_code_edge) ...)]
          expect:
            - (Filter _e.source_kind = 'User', _e.source_id = 1, _e.relationship_kind IN ?, _e._deleted = false (Scan Table(gl_edge) AS _e))
