name: Target-anchored bounded hops expand from the target layout
ontology_overlay: reordered_edges

query:
  gql: |
    MATCH (caller:Definition)-[:CALLS*1..3]->(callee:Definition {id: 12001}) RETURN caller, callee

logical:
  expect: ["(EdgeScan CALLS caller->callee AS e0 HOPS 1..3)"]

physical:
  clickhouse:
    planned:
      expect:
        - (Scan Table(gl_code_edge_by_target) ...)
        - (Filter e1._deleted = false (Deduplicate LimitBy ... (Filter e1.relationship_kind = 'CALLS', e1.target_kind = 'Definition', e1.target_id = 12001 (_))))
        - (Project prepend((e2.target_id, e2.target_kind), _depth_1.path_nodes) AS path_nodes, ... (_))
      reject: ["(Scan Table(gl_code_edge) ...)"]
  duckdb:
    planned:
      expect: ["(Scan Table(gl_edge) ...)"]
