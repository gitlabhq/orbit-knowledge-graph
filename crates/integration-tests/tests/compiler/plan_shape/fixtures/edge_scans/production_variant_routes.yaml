physical:
  clickhouse:
    planned:
      occurrences:
        - { pattern: "(Scan Table(?) AS _orbit_edge_0)", count: 1 }

cases:
  - name: Pipeline IN_PROJECT scans the CI edge table
    query: |
      MATCH (pipeline:Pipeline {id: 1})-[:IN_PROJECT {target_id: 1}]->(project:Project) RETURN pipeline, project
    logical: { expect: ["(Filter e0.target_id = 1 (Follow IN_PROJECT pipeline->project AS e0 (Filter ... (Entities Pipeline AS pipeline))))"] }
    physical:
      clickhouse:
        planned: { expect: ["(Scan Table(gl_ci_edge) AS _orbit_edge_0)"], reject: ["(Scan Table(gl_edge) ...)"] }

