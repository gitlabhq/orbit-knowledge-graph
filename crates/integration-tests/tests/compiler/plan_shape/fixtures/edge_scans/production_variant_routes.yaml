- name: IN_PROJECT returns every specialized route
  query:
    json: '{"query_type":"neighbors","nodes":[{"id":"project","entity":"Project","node_ids":[1000,3000]}],"neighbors":{"direction":"incoming","rel_types":["IN_PROJECT"]}}

'
    gql: 'MATCH (project:Project)<-[:IN_PROJECT]-(neighbor) WHERE project.id IN [1000,
      3000] RETURN project, neighbor

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_ci_edge
        - gl_code_edge
        - gl_diff_edge
        - gl_edge
        - gl_sec_edge
        not_contains: []
