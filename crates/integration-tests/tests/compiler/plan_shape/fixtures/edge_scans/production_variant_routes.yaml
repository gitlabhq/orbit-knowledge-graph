cases:
  - name: CI variants scan the CI edge table
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"pipeline","entity":"Pipeline","node_ids":[1]},{"id":"project","entity":"Project"}],"relationships":[{"type":"IN_PROJECT","from":"pipeline","to":"project","filters":{"target_id":1}}]}
      gql: |
        MATCH (pipeline:Pipeline {id: 1})-[:IN_PROJECT {target_id: 1}]->(project:Project) RETURN pipeline, project
    logical:
      expect: ["(EdgeScan IN_PROJECT pipeline->project AS e0)"]
    physical:
      clickhouse:
        planned:
          expect: ["(Scan Table(gl_ci_edge) AS _orbit_edge_0)"]
          reject: ["(Scan Table(gl_edge) ...)"]

