  query:
    json: '{"query_type":"traversal","nodes":[{"id":"diff","entity":"MergeRequestDiff","node_ids":[20001,40001]},{"id":"project","entity":"Project"}],"relationships":[{"type":"IN_PROJECT","from":"diff","to":"project","filters":{"target_id":1000}}]}

