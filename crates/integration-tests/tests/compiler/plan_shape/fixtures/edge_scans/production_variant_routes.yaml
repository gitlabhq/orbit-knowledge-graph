      org_id: 1
      paths:
        - 1/100/
      access_level: 50
    physical:
      clickhouse:
        sql:
          contains:
            - gl_ci_edge
            - gl_code_edge
            - gl_diff_edge
            - gl_edge
            - gl_sec_edge
          not_contains: []

