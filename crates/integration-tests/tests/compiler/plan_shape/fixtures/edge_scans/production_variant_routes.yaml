---
cases:
  - name: Pipeline IN_PROJECT scans the CI edge table
    query:
      gql: |
        MATCH (pipeline:Pipeline {id: 1})-[:IN_PROJECT {target_id: 1}]->(project:Project) RETURN pipeline, project
    logical:
      expect:
        - (EdgeScan IN_PROJECT pipeline->project AS e0)
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_ci_edge) AS _orbit_edge_0)
          reject:
            - (Scan Table(gl_edge) ...)
        sql:
          contains:
            - gl_ci_edge
          not_contains:
            - gl_edge

