- name: Branch neighbors return bridge and root containment routes
  query:
    json: '{"query_type":"neighbors","nodes":[{"id":"branch","entity":"Branch","node_ids":[2601,3601]}],"neighbors":{"direction":"both","rel_types":["CONTAINS"]}}

'
    gql: 'MATCH (branch:Branch)-[:CONTAINS]-(neighbor) WHERE branch.id IN [2601, 3601]
      RETURN branch, neighbor

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_code_edge
        not_contains:
        - gl_edge
- name: Directory neighbors return nested containment routes
  query:
    json: '{"query_type":"neighbors","nodes":[{"id":"directory","entity":"Directory","node_ids":[2701,4701]}],"neighbors":{"direction":"both","rel_types":["CONTAINS"]}}

'
    gql: 'MATCH (directory:Directory)-[:CONTAINS]-(neighbor) WHERE directory.id IN
      [2701, 4701] RETURN directory, neighbor

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_code_edge
        not_contains:
        - gl_edge
- name: HAS_VULNERABILITY excludes another namespace
  query:
    json: '{"query_type":"neighbors","nodes":[{"id":"package","entity":"Package","node_ids":[2301,4301]}],"neighbors":{"direction":"outgoing","rel_types":["HAS_VULNERABILITY"]}}

'
    gql: 'MATCH (package:Package)-[:HAS_VULNERABILITY]->(neighbor) WHERE package.id
      IN [2301, 4301] RETURN package, neighbor

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_sec_edge
        not_contains: []
- name: Merge request pipeline branch chain crosses three edge tables
  query:
    json: '{"query_type":"traversal","nodes":[{"id":"user","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"},{"id":"pipeline","entity":"Pipeline"},{"id":"project","entity":"Project"},{"id":"branch","entity":"Branch"}],"relationships":[{"type":"AUTHORED","from":"user","to":"mr"},{"type":"HAS_HEAD_PIPELINE","from":"mr","to":"pipeline"},{"type":"IN_PROJECT","from":"pipeline","to":"project"},{"type":"CONTAINS","from":"project","to":"branch"}]}

'
    gql: 'MATCH (user:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)-[:HAS_HEAD_PIPELINE]->(pipeline:Pipeline)-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch)
      RETURN user, mr, pipeline, project, branch

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_edge
        - gl_ci_edge
        - gl_code_edge
        not_contains: []
- name: Merge request diff branch chain crosses three edge tables
  query:
    json: '{"query_type":"traversal","nodes":[{"id":"user","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"},{"id":"diff","entity":"MergeRequestDiff"},{"id":"project","entity":"Project"},{"id":"branch","entity":"Branch"}],"relationships":[{"type":"AUTHORED","from":"user","to":"mr"},{"type":"HAS_DIFF","from":"mr","to":"diff"},{"type":"IN_PROJECT","from":"diff","to":"project"},{"type":"CONTAINS","from":"project","to":"branch"}]}

'
    gql: 'MATCH (user:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)-[:HAS_DIFF]->(diff:MergeRequestDiff)-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch)
      RETURN user, mr, diff, project, branch

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_edge
        - gl_diff_edge
        - gl_code_edge
        not_contains: []
- name: Security scan directory chain crosses security and code tables
  query:
    json: '{"query_type":"traversal","nodes":[{"id":"scan","entity":"SecurityScan","node_ids":[1701]},{"id":"project","entity":"Project"},{"id":"branch","entity":"Branch"},{"id":"directory","entity":"Directory"}],"relationships":[{"type":"IN_PROJECT","from":"scan","to":"project"},{"type":"CONTAINS","from":"project","to":"branch"},{"type":"CONTAINS","from":"branch","to":"directory"}]}

'
    gql: 'MATCH (scan:SecurityScan {id: 1701})-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch)-[:CONTAINS]->(directory:Directory)
      RETURN scan, project, branch, directory

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_sec_edge
        - gl_code_edge
        not_contains: []
- name: Merge request alternatives union default CI and diff tables
  query:
    json: '{"query_type":"neighbors","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[2500,3500]}],"neighbors":{"direction":"outgoing","rel_types":["IN_PROJECT","HAS_HEAD_PIPELINE","HAS_DIFF"]}}

'
    gql: 'MATCH (mr:MergeRequest)-[:IN_PROJECT|HAS_HEAD_PIPELINE|HAS_DIFF]->(target)
      WHERE mr.id IN [2500, 3500] RETURN mr, target

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_edge
        - gl_ci_edge
        - gl_diff_edge
        not_contains: []
- name: Cross-table chain excludes another namespace
  query:
    json: '{"query_type":"traversal","nodes":[{"id":"user","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"},{"id":"pipeline","entity":"Pipeline"},{"id":"project","entity":"Project"},{"id":"branch","entity":"Branch"}],"relationships":[{"type":"AUTHORED","from":"user","to":"mr"},{"type":"HAS_HEAD_PIPELINE","from":"mr","to":"pipeline"},{"type":"IN_PROJECT","from":"pipeline","to":"project"},{"type":"CONTAINS","from":"project","to":"branch"}]}

'
    gql: 'MATCH (user:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)-[:HAS_HEAD_PIPELINE]->(pipeline:Pipeline)-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch)
      RETURN user, mr, pipeline, project, branch

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_edge
        - gl_ci_edge
        - gl_code_edge
        not_contains: []
- name: Specialized routes exclude another namespace
  query:
    json: '{"query_type":"traversal","nodes":[{"id":"scan","entity":"SecurityScan","node_ids":[1701,3701]},{"id":"project","entity":"Project"},{"id":"branch","entity":"Branch"}],"relationships":[{"type":"IN_PROJECT","from":"scan","to":"project"},{"type":"CONTAINS","from":"project","to":"branch"}]}

'
    gql: 'MATCH (scan:SecurityScan)-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch)
      WHERE scan.id IN [1701, 3701] RETURN scan, project, branch

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_sec_edge
        - gl_code_edge
        not_contains: []
- name: Cross-table shortest path excludes another namespace
  query:
    json: '{"query_type":"path_finding","nodes":[{"id":"pipeline","entity":"Pipeline","node_ids":[1101,3101]},{"id":"branch","entity":"Branch","node_ids":[2601,3601]}],"path":{"type":"shortest","from":"pipeline","to":"branch","max_depth":2,"rel_types":["IN_PROJECT","CONTAINS"]}}

'
    gql: 'MATCH path = ANY SHORTEST (pipeline:Pipeline)-[:IN_PROJECT|CONTAINS*1..2]->(branch:Branch)
      WHERE pipeline.id IN [1101, 3101] AND branch.id IN [2601, 3601] RETURN path

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_ci_edge
        - gl_code_edge
        - gl_diff_edge
        - gl_edge
        - gl_sec_edge
        not_contains: []
- name: Variable traversal excludes another namespace
  query:
    json: '{"query_type":"traversal","nodes":[{"id":"pipeline","entity":"Pipeline","node_ids":[1101,3101]},{"id":"branch","entity":"Branch"}],"relationships":[{"type":["IN_PROJECT","CONTAINS"],"from":"pipeline","to":"branch","hops":[2,2]}]}

'
    gql: 'MATCH (pipeline:Pipeline)-[:IN_PROJECT|CONTAINS*2]->(branch:Branch) WHERE
      pipeline.id IN [1101, 3101] RETURN pipeline, branch

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_ci_edge
        - gl_code_edge
        - gl_edge
        not_contains: []
- name: Mixed-table aggregation excludes another namespace
  query:
    json: '{"query_type":"aggregation","nodes":[{"id":"pipeline","entity":"Pipeline","node_ids":[1101,3101]},{"id":"project","entity":"Project"},{"id":"branch","entity":"Branch"}],"relationships":[{"type":"IN_PROJECT","from":"pipeline","to":"project"},{"type":"CONTAINS","from":"project","to":"branch"}],"aggregations":[{"count":"branch","as":"n"}],"limit":10}

'
    gql: 'MATCH (pipeline:Pipeline)-[:IN_PROJECT]->(project:Project)-[:CONTAINS]->(branch:Branch)
      WHERE pipeline.id IN [1101, 3101] RETURN count(branch) AS n LIMIT 10

'
  physical:
    clickhouse:
      sql:
        contains:
        - gl_ci_edge
        - gl_code_edge
        not_contains: []
