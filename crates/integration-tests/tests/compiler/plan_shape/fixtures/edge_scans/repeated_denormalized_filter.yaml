name: Denormalized pushdown preserves every predicate on one property

query: |
  MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)
  WHERE a.definition_type = 'function' AND a.definition_type = 'class'
  RETURN count(b) AS n

logical:
  expect:
    - (Aggregate COUNT(b) AS n (Filter a.definition_type = 'function', a.definition_type = 'class' (Follow CALLS a->b AS e0 (Filter a.id = 1 (Entities Definition AS a)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter ArrayContains(_orbit_edge_0.source_tags, 'definition_type:function'), ArrayContains(_orbit_edge_0.source_tags, 'definition_type:class'), ... (_))
