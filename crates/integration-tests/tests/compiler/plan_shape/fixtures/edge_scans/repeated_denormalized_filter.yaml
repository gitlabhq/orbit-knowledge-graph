name: Denormalized pushdown preserves every predicate on one property

query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"a","entity":"Definition","node_ids":[1],"filters":{"kind":[{"eq":"Function"},{"eq":"Class"}]}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}],"aggregations":[{"count":"b","as":"n"}]}
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)
    WHERE a.kind = 'Function' AND a.kind = 'Class'
    RETURN count(b) AS n

logical:
  expect:
    - (Aggregate COUNT(b) AS n (_))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_edge_0.source_tags HAS ANY ['kind:Function'], _orbit_edge_0.source_tags HAS ANY ['kind:Class'], ... (_))
