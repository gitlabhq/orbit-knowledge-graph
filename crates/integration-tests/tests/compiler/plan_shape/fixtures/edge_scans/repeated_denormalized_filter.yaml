name: Denormalized pushdown preserves every predicate on one property

query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"a","entity":"Definition","node_ids":[1],"filters":{"definition_type":[{"eq":"function"},{"eq":"class"}]}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}],"aggregations":[{"count":"b","as":"n"}]}
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)
    WHERE a.definition_type = 'function' AND a.definition_type = 'class'
    RETURN count(b) AS n

logical:
  gql:
    expect:
      - (Aggregate COUNT(b) AS n (Filter a.definition_type = 'function', a.definition_type = 'class' (Follow CALLS a->b AS e0 (Filter a.id = 1 (Entities Definition AS a)))))
  json:
    expect:
      - (Aggregate COUNT(b) AS n (Follow CALLS a->b AS e0 (Filter a.id IN [1], a.definition_type = 'function', a.definition_type = 'class' (Entities Definition AS a))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_edge_0.source_tags HAS ANY ['definition_type:function'], _orbit_edge_0.source_tags HAS ANY ['definition_type:class'], ... (_))
