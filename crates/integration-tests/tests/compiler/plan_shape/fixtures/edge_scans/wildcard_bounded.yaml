name: Bounded wildcard hops retain their default-table plan

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Import","node_ids":[1]},{"id":"b","entity":"Import"}],"relationships":[{"type":"*","from":"a","to":"b","hops":[1,3]}]}
  gql: |
    MATCH (a:Import {id: 1})-[*1..3]->(b:Import) RETURN a, b

logical:
  expect: ["(EdgeScan * a->b AS e0 HOPS 1..3)"]

physical:
  clickhouse:
    planned:
      expect: ["(Scan Table(gl_edge) ...)"]
  duckdb:
    planned:
      expect: ["(Scan Table(gl_edge) ...)"]
