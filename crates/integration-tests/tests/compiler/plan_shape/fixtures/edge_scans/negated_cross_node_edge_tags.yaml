name: A NOT group across two nodes reads each leaf from the source its positive form reads
query:
  gql: |
    MATCH (mr:MergeRequest {project_id: 1000})-[:CLOSES]->(wi:WorkItem)
    WHERE NOT (mr.state = 'merged' AND wi.state = 'closed')
    RETURN count(mr) AS n
missing_frontends:
  json: JSON filters cannot express grouped negation.
logical:
  expect:
    - (Filter NOT ((mr.state = 'merged') AND (wi.state = 'closed')) (_))
physical:
  clickhouse:
    planned:
      expect:
        - (Filter NOT (((mr.state = 'merged') AND (e0.source_tags HAS ANY ['state:merged'])) AND (e0.target_tags HAS ANY ['state:closed'])) (_))
      reject:
        - (Scan Table(gl_work_item) ...)
