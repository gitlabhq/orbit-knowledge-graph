name: Single-hop traversal uses a plain edge scan and skips node hydration joins

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition) RETURN a, b

logical:
  expect: ["(EdgeScan CALLS a->b AS e0)"]

physical:
  clickhouse:
    planned:
      ctes:
        absent: true
      expect: ["(Filter _orbit_edge_0.source_id = 1, _orbit_edge_0._deleted = false, ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))"]
    emitted:
      expect: ["(Filter _orbit_edge_0.source_id = 1, _orbit_edge_0._deleted = false, ... (_))"]
  duckdb:
    planned:
      expect: ["(Join ON b.id = _orbit_edge_0.target_id (_) (Bind b (Filter ... (Deduplicate Final (Scan Table(gl_definition) AS b)))))", "(Join ON a.id = _orbit_edge_0.source_id (_) (Bind a (Filter ... (Deduplicate Final (Scan Table(gl_definition) AS a)))))"]
      ctes: { absent: true }
      reject: ["(SemiJoin ... (_) (_))"]
