name: Single-hop traversal uses a plain edge scan and narrows the redaction join from the pinned endpoint

query: |
  MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition) RETURN a, b

logical:
  expect:
    - (Follow CALLS a->b AS e0 (Filter a.id = 1 (Entities Definition AS a)))

physical:
  clickhouse:
    planned:
      bind:
        - (CTE $edge (Project * (Filter _orbit_edge_0._deleted = false (Bind _orbit_edge_0 (Deduplicate LimitBy ... (Sort _orbit_edge_0.traversal_path, _orbit_edge_0.relationship_kind, _orbit_edge_0.project_id, _orbit_edge_0.branch, _orbit_edge_0.source_id, _orbit_edge_0.target_id, _orbit_edge_0.source_kind, _orbit_edge_0.target_kind, _orbit_edge_0._version DESC (Project * (Filter _orbit_edge_0.source_id = 1, ... (_)))))))))
        - (Bind $ids (Project _orbit_id_source.target_id AS id (_)))
      expect:
        - (Filter b._deleted = false (Bind b (Deduplicate LimitBy ... (Sort b.traversal_path, b.project_id, b.branch, b.id, b._version DESC (Project * (Filter StartsWith(b.traversal_path, scalar(gl_definition AS _orbit_scope WHERE _orbit_scope.id = 1)) OR (scalar(gl_definition AS _orbit_scope WHERE _orbit_scope.id = 1) = '0/'), b.id IN $ids.id (_)))))))
      reject: ["(Deduplicate Final (Scan Table(gl_definition) AS b))"]
    emitted:
      expect:
        - (Join ON b.id = _orbit_edge_0.target_id (_) (_))
        - (Filter _orbit_edge_0.source_id = 1, ... (Scan Table(gl_code_edge) AS _orbit_edge_0))
        - (Filter StartsWith(b.traversal_path, scalar(gl_definition AS _orbit_scope WHERE _orbit_scope.id = 1)) OR (scalar(gl_definition AS _orbit_scope WHERE _orbit_scope.id = 1) = '0/'), b.id IN ?.id (Scan Table(gl_definition) AS b))
      reject: ["(Deduplicate Final (Scan Table(gl_definition) AS b))"]
  duckdb:
    planned:
      expect: ["(Join ON b.id = _orbit_edge_0.target_id (_) (Bind b (Project * (Scan Table(gl_definition) AS b))))", "(Join ON a.id = _orbit_edge_0.source_id (_) (Bind a (Project * (Filter a.id = 1 (Scan Table(gl_definition) AS a)))))"]
      ctes: { absent: true }
      reject: ["(SemiJoin ... (_) (_))"]
