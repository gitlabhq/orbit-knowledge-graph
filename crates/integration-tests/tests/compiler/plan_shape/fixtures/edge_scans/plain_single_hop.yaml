name: Single-hop traversal uses a plain edge scan and narrows the redaction join from the pinned endpoint

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition) RETURN a, b

logical:
  expect: ["(EdgeScan CALLS a->b AS e0)"]

physical:
  clickhouse:
    planned:
      ctes:
        exact_order: [_narrow_b]
      expect:
        - "(Filter _orbit_edge_0.source_id = 1, _orbit_edge_0._deleted = false, ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))"
        - "(Filter _orbit_edge_0n.source_id = 1, ... (Scan Table(gl_code_edge) AS _orbit_edge_0n))"
        - "(Filter b.id IN _narrow_b.id (Scan Table(gl_definition) AS b))"
      reject: ["(Scan Table(gl_definition) AS a)"]
    emitted:
      expect:
        - "(Filter _orbit_edge_0.source_id = 1, _orbit_edge_0._deleted = false, ... (Join ON b.id = _orbit_edge_0.target_id (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)) (_)))"
        - "(Filter b.id IN _narrow_b.id (Scan Table(gl_definition) AS b))"
      reject: ["(Scan Table(gl_definition) AS a)"]
  duckdb:
    planned:
      expect: ["(Join ON b.id = e0.target_id (_) (Filter ... (Scan Table(gl_definition) AS b)))", "(Join ON a.id = e0.source_id (_) (Filter ... (Scan Table(gl_definition) AS a)))"]
      ctes: { absent: true }
      reject: ["(Deduplicate ... (_))", "(SemiJoin ... (_) (_))"]
