name: Single-hop traversal uses a plain edge scan and skips node hydration joins

query:
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition) RETURN a, b

logical:
  expect: ["(EdgeScan CALLS a->b AS e0)"]

physical:
  clickhouse:
    planned:
      ctes:
        absent: true
      expect: ["(Filter _orbit_edge_0.source_id = 1, _orbit_edge_0._deleted = false, ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))"]
      reject: ["(Scan Table(gl_definition) ...)"]
    emitted:
      expect: ["(Filter _orbit_edge_0.source_id = 1, _orbit_edge_0._deleted = false, ... (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0)))"]
      reject: ["(Scan Table(gl_definition) ...)"]
  duckdb:
    planned:
      expect: ["(Join ON b.id = e0.target_id (_) (Filter ... (Scan Table(gl_definition) AS b)))", "(Join ON a.id = e0.source_id (_) (Filter ... (Scan Table(gl_definition) AS a)))"]
      ctes: { absent: true }
      reject: ["(Deduplicate ... (_))", "(SemiJoin ... (_) (_))"]
