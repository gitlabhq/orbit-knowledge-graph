name: Single-hop traversal uses a plain edge scan and narrows the redaction join from the pinned endpoint

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition) RETURN a, b

logical:
  expect: ["(EdgeScan CALLS a->b AS e0)"]

physical:
  clickhouse:
    planned:
      bind:
        - (CTE $edge (Filter _orbit_edge_0._deleted = false (Deduplicate LimitBy ... (Filter _orbit_edge_0.source_id = 1, ... (_)))))
        - (CTE $ids (Project _id_source.target_id AS id (_)))
      expect:
        - (Filter b._deleted = false (Deduplicate LimitBy ... (Filter b.id IN $ids.id (_))))
      reject: ["(Scan Table(gl_definition) AS a)", "(Deduplicate Final (Scan Table(gl_definition) AS b))"]
    emitted:
      expect:
        - (Join ON b.id = _orbit_edge_0.target_id (_) (_))
        - (Filter _orbit_edge_0.source_id = 1, ... (Scan Table(gl_code_edge) AS _orbit_edge_0))
        - (Filter b.id IN ?.id (Scan Table(gl_definition) AS b))
      reject: ["(Scan Table(gl_definition) AS a)", "(Deduplicate Final (Scan Table(gl_definition) AS b))"]
  duckdb:
    planned:
      expect: ["(Join ON b.id = _orbit_edge_0.target_id (_) (Bind b (Filter ... (Deduplicate Final (Scan Table(gl_definition) AS b)))))", "(Join ON a.id = _orbit_edge_0.source_id (_) (Bind a (Filter ... (Bind a (Filter ... (Deduplicate Final (Scan Table(gl_definition) AS a)))))))"]
      ctes: { absent: true }
      reject: ["(SemiJoin ... (_) (_))"]
