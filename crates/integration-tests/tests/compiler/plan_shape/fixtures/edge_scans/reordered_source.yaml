ontology_overlay: reordered_edges

cases:
  - name: A pinned source reads the copy that leads with source_id
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1],"columns":["id"]},{"id":"g","entity":"Group","columns":["id"]}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}]}
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF]->(g:Group) RETURN u.id, g.id
    logical:
      expect: ["(EdgeScan MEMBER_OF u->g AS e0)"]
    physical:
      clickhouse:
        planned:
          expect: ["(Scan Table(gl_edge_by_source) AS _orbit_edge_0)"]
          reject: ["(Scan Table(gl_edge) AS _orbit_edge_0)"]

  - name: A source found by a unique property reads the copy
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":"alice"},"columns":["id"]},{"id":"g","entity":"Group","columns":["id"]}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}]}
      gql: |
        MATCH (u:User {username: 'alice'})-[:MEMBER_OF]->(g:Group) RETURN u.id, g.id
    logical:
      expect: ["(EdgeScan MEMBER_OF u->g AS e0)"]
    physical:
      clickhouse:
        planned:
          expect: ["(Scan Table(gl_edge_by_source) AS _orbit_edge_0)"]
          reject: ["(Scan Table(gl_edge) AS _orbit_edge_0)"]

  - name: More pinned ids than the copy limit keep the base table
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1,2,3],"columns":["id"]},{"id":"g","entity":"Group","columns":["id"]}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}]}
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id IN [1, 2, 3] RETURN u.id, g.id
    logical:
      expect: ["(EdgeScan MEMBER_OF u->g AS e0)"]
    physical:
      clickhouse:
        planned:
          expect: ["(Scan Table(gl_edge) AS _orbit_edge_0)"]
          reject: ["(Scan Table(gl_edge_by_source) AS _orbit_edge_0)"]

  - name: A pinned target keeps the base table
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","columns":["id"]},{"id":"g","entity":"Group","node_ids":[100],"columns":["id"]}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}]}
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group {id: 100}) RETURN u.id, g.id
    logical:
      expect: ["(EdgeScan MEMBER_OF u->g AS e0)"]
    physical:
      clickhouse:
        planned:
          expect: ["(Scan Table(gl_edge) AS _orbit_edge_0)"]
          reject: ["(Scan Table(gl_edge_by_source) AS _orbit_edge_0)"]

  - name: A variable-length walk from a pinned source keeps the base table
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"g","entity":"Group"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g","hops":[1,2]}]}
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF*1..2]->(g:Group) RETURN u, g
    logical:
      expect: ["(EdgeScan MEMBER_OF u->g AS e0 HOPS 1..2)"]
    physical:
      clickhouse:
        planned:
          expect: ["(Scan Table(gl_edge) ...)"]
          reject: ["(Scan Table(gl_edge_by_source) ...)"]
