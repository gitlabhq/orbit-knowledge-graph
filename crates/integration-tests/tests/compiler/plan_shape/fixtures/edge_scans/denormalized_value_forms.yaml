name: Denormalized singleton sets and boolean filters retain value tokens

query: |
  MATCH (u:User {id: 1})-[:REVIEWER]->(mr:MergeRequest)
  WHERE mr.state IN ['merged'] AND mr.draft = true
  RETURN u, mr

logical:
  expect:
    - (Filter mr.state IN ['merged'], mr.draft = true (Follow REVIEWER u->mr AS e0 (Filter ... (Entities User AS u))))

physical:
  clickhouse:
    planned:
      expect: ["(Filter ArrayContains(_orbit_edge_0.target_tags, 'draft:true'), ArrayContains(_orbit_edge_0.target_tags, 'state:merged'), ... (_))"]
    emitted:
      expect: ["(Filter ArrayContains(_orbit_edge_0.target_tags, 'draft:true'), ArrayContains(_orbit_edge_0.target_tags, 'state:merged'), ... (_))"]
      reject: ["(CTE _orbit_nf_mr (_))", "(Filter ArrayContains(_orbit_edge_0.target_tags, 'draft:'), ... (_))"]
