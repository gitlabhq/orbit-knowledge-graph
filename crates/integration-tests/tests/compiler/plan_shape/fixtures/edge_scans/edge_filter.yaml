name: Relationship filters survive both frontends and physical emission

query:
  gql: |
    MATCH (caller:Definition {id: 1})-[:CALLS {target_id: 2}]->(callee:Definition)
    RETURN caller.id, callee.id

logical:
  expect:
    - (Filter e0.target_id = 2 (EdgeScan CALLS caller->callee AS e0))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_edge_0.target_id = 2, ... (_))
    emitted:
      expect:
        - (Filter _orbit_edge_0.target_id = 2, ... (_))
  duckdb:
    planned:
      expect:
        - (Join ON callee.id = _orbit_edge_0.target_id (_) (Bind callee (Filter ... (Deduplicate Final (Scan Table(gl_definition) AS callee)))))
        - (Filter _orbit_edge_0.target_id = 2, ... (_))
