name: A target selector uses the target-oriented edge layout
model_overlay: reordered_edges

query: |
  MATCH (caller:Definition)-[:CALLS]->(callee:Definition {id: 12001}) RETURN caller.id, callee.id

logical:
  expect:
    - (Filter callee.id = 12001 (Follow CALLS caller->callee AS e0 (Entities Definition AS caller)))

physical:
  clickhouse:
    planned:
      expect: ["(Scan Table(gl_code_edge_by_target) AS _orbit_edge_0)"]
      reject: ["(Scan Table(gl_code_edge) AS _orbit_edge_0)"]
  duckdb:
    planned:
      expect: ["(Scan Table(gl_edge) AS _orbit_edge_0)"]
