name: A pinned target keeps the source edge scan while reordered tables are metadata only
ontology_overlay: reordered_edges

query:
  gql: |
    MATCH (caller:Definition)-[:CALLS]->(callee:Definition {id: 12001}) RETURN caller.id, callee.id

logical:
  expect: ["(EdgeScan CALLS caller->callee AS e0)"]

physical:
  clickhouse:
    planned:
      expect: ["(Scan Table(gl_code_edge) AS _orbit_edge_0)"]
      reject: ["(Scan Table(gl_code_edge_by_target) ...)"]
  duckdb:
    planned:
      expect: ["(Scan Table(gl_edge) AS e0)"]
