cases:
  - name: A NOT group across two nodes reads each leaf from the source its positive form reads
    query:
      gql: |
        MATCH (mr:MergeRequest {project_id: 1000})-[:CLOSES]->(wi:WorkItem)
        WHERE NOT (mr.state = 'merged' AND wi.state = 'closed')
        RETURN count(mr) AS n
    missing_frontends: { json: JSON filters cannot express grouped negation. }
    logical:
      expect:
        - "(Filter NOT ((mr.state = 'merged') AND (wi.state = 'closed')) (_))"
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter NOT (((mr.state = 'merged') AND (_orbit_edge_0.source_tags HAS ANY ['state:merged'])) AND (_orbit_edge_0.target_tags HAS ANY ['state:closed'])) (_))"
          reject: [(Scan Table(gl_work_item) ...)]

  - name: NOT over a non-nullable denormalized property reads edge tags instead of the node table
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[12000],"not":{"definition_type":{"in":["function","method"]}}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
      gql: |
        MATCH (a:Definition)-[:CALLS]->(b:Definition)
        WHERE a.id IN [12000] AND NOT a.definition_type IN ['function', 'method']
        RETURN a, b
    logical:
      expect:
        - "(Filter NOT (a.definition_type IN ['function', 'method']) (_))"
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter ..., NOT (_orbit_edge_0.source_tags HAS ANY ['definition_type:function', 'definition_type:method']) (_))"
          reject:
            - "(Filter NOT (a.definition_type IN ['function', 'method']), ... (_))"

  - name: A NOT group over edge columns and non-nullable denormalized properties reads no node table
    query:
      gql: |
        MATCH (u:User)-[r:MEMBER_OF]->(g:Group {id: 100})
        WHERE NOT (r.source_id < 50 AND u.state = 'active')
        RETURN count(u) AS n
    missing_frontends: { json: JSON filters cannot express grouped negation. }
    logical:
      expect:
        - "(Filter NOT ((e0.source_id < 50) AND (u.state = 'active')) (_))"
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter NOT ((_orbit_edge_0.source_id < 50) AND (_orbit_edge_0.source_tags HAS ANY ['state:active'])) (_))"
          reject: [(Scan Table(gl_user) ...)]

  - name: A NOT group over a nullable denormalized property reads the node table instead of edge tags
    query:
      gql: |
        MATCH (wi:WorkItem {id: 100})-[:HAS_NOTE]->(n:Note)
        WHERE NOT (n.confidential = true AND n.internal = true)
        RETURN count(n) AS c
    missing_frontends: { json: JSON filters cannot express grouped negation. }
    logical:
      expect:
        - (Filter NOT ((n.confidential = true) AND (n.internal = true)) (_))
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_note) AS n)
            - (Filter NOT ((n.confidential = true) AND (n.internal = true)), ... (_))
          reject:
            - "(Filter ..., NOT ((_orbit_edge_0.target_tags HAS ANY ['confidential:true']) AND (_orbit_edge_0.target_tags HAS ANY ['internal:true'])) (_))"

  - name: A NOT leaf on a node that also has an untagged filter reads the node row and the edge tag
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User","filters":{"username":{"starts_with":"ali"}},"not":{"state":{"in":["blocked"]}}},{"id":"g","entity":"Group","node_ids":[100]},{"id":"p","entity":"Project","columns":["name"]}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"},{"type":"CONTAINS","from":"g","to":"p"}]}
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group {id: 100})-[:CONTAINS]->(p:Project)
        WHERE u.username STARTS WITH 'ali' AND NOT u.state IN ['blocked']
        RETURN p.name
    logical:
      expect:
        - "(Filter NOT (u.state IN ['blocked']) (_))"
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter NOT ((u.state IN ['blocked']) AND (_orbit_edge_0.source_tags HAS ANY ['state:blocked'])) (_))"
