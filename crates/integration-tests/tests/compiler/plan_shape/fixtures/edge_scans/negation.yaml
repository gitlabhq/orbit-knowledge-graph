cases:
  - name: A NOT group across two nodes reads each leaf from the source its positive form reads
    query: |
      MATCH (mr:MergeRequest {project_id: 1000})-[:CLOSES]->(wi:WorkItem)
      WHERE NOT (mr.state = 'merged' AND wi.state = 'closed')
      RETURN count(mr) AS n
    logical:
      expect:
        - "(Aggregate COUNT(mr) AS n (Filter NOT ((mr.state = 'merged') AND (wi.state = 'closed')) (Follow CLOSES mr->wi AS e0 (Filter mr.project_id = 1000 (Entities MergeRequest AS mr)))))"
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter NOT((mr.state = 'merged') AND ArrayContains(_orbit_edge_0.source_tags, 'state:merged') AND ArrayContains(_orbit_edge_0.target_tags, 'state:closed')) (_))"
          reject: ["(Scan Table(gl_work_item) ...)"]

  - name: NOT over a non-nullable denormalized property reads the node row and its edge tag together
    query: |
      MATCH (a:Definition)-[:CALLS]->(b:Definition)
      WHERE a.id IN [12000] AND NOT a.definition_type IN ['function', 'method']
      RETURN a, b
    logical:
      expect:
        - "(Filter a.id IN [12000], NOT (a.definition_type IN ['function', 'method']) (Follow CALLS a->b AS e0 (Entities Definition AS a)))"
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter NOT((a.definition_type IN ['function', 'method']) AND ArrayContainsAny(_orbit_edge_0.source_tags, Array('definition_type:function', 'definition_type:method'))) (_))"

  - name: A NOT group over edge columns and non-nullable denormalized properties reads no node table
    query: |
      MATCH (u:User)-[r:MEMBER_OF]->(g:Group {id: 100})
      WHERE NOT (r.source_id < 50 AND u.state = 'active')
      RETURN count(u) AS n
    logical:
      expect:
        - "(Aggregate COUNT(u) AS n (Filter g.id = 100, NOT ((e0.source_id < 50) AND (u.state = 'active')) (Follow MEMBER_OF u->g AS e0 (Entities User AS u))))"
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter _orbit_edge_0.relationship_kind = 'MEMBER_OF', _orbit_edge_0.source_kind = 'User', _orbit_edge_0.target_kind = 'Group', _orbit_edge_0._deleted = false, _orbit_edge_0.target_id = 100, NOT((_orbit_edge_0.source_id < 50) AND ArrayContains(_orbit_edge_0.source_tags, 'state:active')) (_))"
          reject: ["(Scan Table(gl_user) ...)"]

  - name: A NOT group over a nullable denormalized property reads the node table instead of edge tags
    query: |
      MATCH (wi:WorkItem {id: 100})-[:HAS_NOTE]->(n:Note)
      WHERE NOT (n.confidential = true AND n.internal = true)
      RETURN count(n) AS c
    logical:
      expect:
        - (Aggregate COUNT(n) AS c (Filter NOT ((n.confidential = true) AND (n.internal = true)) (Follow HAS_NOTE wi->n AS e0 (Filter wi.id = 100 (Entities WorkItem AS wi)))))
    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_note) AS n)
            - (Filter NOT((n.confidential = true) AND (n.internal = true)), ... (_))
          reject:
            - "(Filter ..., NOT(ArrayContains(_orbit_edge_0.target_tags, 'confidential:true') AND ArrayContains(_orbit_edge_0.target_tags, 'internal:true')) (_))"

  - name: A NOT leaf on a node that also has an untagged filter reads the node row and the edge tag
    query: |
      MATCH (u:User)-[:MEMBER_OF]->(g:Group {id: 100})-[:CONTAINS]->(p:Project)
      WHERE u.username STARTS WITH 'ali' AND NOT u.state IN ['blocked']
      RETURN p.name
    logical:
      expect:
        - "(Filter starts_with(u.username, 'ali'), NOT (u.state IN ['blocked']) (Follow CONTAINS g->p AS e1 (Filter g.id = 100 (Follow MEMBER_OF u->g AS e0 (Entities User AS u)))))"
    physical:
      clickhouse:
        planned:
          expect:
            - "(Filter ..., NOT((u.state = 'blocked') AND ArrayContains(_orbit_edge_0.source_tags, 'state:blocked')) (_))"
