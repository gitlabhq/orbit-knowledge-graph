name: Typed edge scans select the endpoint variant while local storage stays unified
ontology_overlay: variant_routes

query:
  gql: |
    MATCH (file:File {id: 11000})-[:CALLS]->(callee:Definition) RETURN file.id, callee.id

logical:
  expect: ["(EdgeScan CALLS file->callee AS e0)"]

physical:
  clickhouse:
    planned:
      expect: ["(Scan Table(gl_edge) AS _orbit_edge_0)"]
      reject: ["(Scan Table(gl_code_edge) ...)"]
  duckdb:
    planned:
      expect: ["(Scan Table(gl_edge) AS _orbit_edge_0)"]
