name: A counted node with redaction.owner_column keeps its table in the statement
ontology_overlay: owner_scope

query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[2000]},{"id":"n","entity":"Note"}],"relationships":[{"type":"HAS_NOTE","from":"mr","to":"n"}],"group_by":["mr"],"aggregations":[{"count":"n","as":"notes"}]}
  gql: |
    MATCH (mr:MergeRequest {id: 2000})-[:HAS_NOTE]->(n:Note) RETURN mr, count(n) AS notes

logical:
  expect: ["(Aggregate ... (_))"]

physical:
  clickhouse:
    emitted:
      expect:
        - (Scan Table(gl_note) AS n)
