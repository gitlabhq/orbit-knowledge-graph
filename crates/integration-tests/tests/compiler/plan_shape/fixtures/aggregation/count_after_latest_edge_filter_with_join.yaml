name: Edge aggregation over a grouped node join counts the filtered latest edge rows

query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}],"group_by":["b.name"],"aggregations":[{"count":"a","as":"n"}]}
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition) RETURN b.name, count(a) AS n

logical:
  expect: ["(Aggregate ... (_))"]

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON b.id = _orbit_edge_0.target_id (_) (Bind b (Filter b._deleted = false (Deduplicate LimitBy ... (Filter b.id IN ?.id (_))))))
        - (Aggregate ..., COUNT() AS n (_))
    emitted:
      expect: ["(Aggregate ..., COUNT() AS n (Join ON b.id = _orbit_edge_0.target_id (Scan Table(_orbit_relation_3) AS _orbit_edge_0) (_)))", "(Deduplicate LimitBy 1 BY ... (_))"]
