name: Branch aggregation counts matches joined through the original shared node

query: |
  MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition)-[:CALLS]->(c:Definition),
        (a)-[:CALLS]->(d:Definition)
  RETURN count(d) AS matches

logical:
  expect:
    - (Aggregate COUNT(d) AS matches (Follow CALLS a->d AS e2 (Follow CALLS b->c AS e1 (Follow CALLS a->b AS e0 (_)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON _orbit_edge_0.source_id = _orbit_edge_2.source_id (_) (_))
        - (Join ON _orbit_edge_0.target_id = _orbit_edge_1.source_id (_) (_))
    emitted:
      expect:
        - (Join ON _orbit_edge_0.source_id = _orbit_edge_2.source_id (_) (_))
        - (Join ON _orbit_edge_0.target_id = _orbit_edge_1.source_id (_) (_))
  duckdb:
    planned:
      expect:
        - (Join ON _orbit_edge_0.source_id = _orbit_edge_2.source_id (_) (_))
        - (Join ON _orbit_edge_0.target_id = _orbit_edge_1.source_id (_) (_))
