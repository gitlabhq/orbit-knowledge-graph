name: Property aggregation keeps grouping and measure inputs off the node projection

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [{"id": "d", "entity": "Definition", "node_ids": [1, 2]}],
      "group_by": ["d.name"],
      "aggregations": [{"count": "d", "as": "n"}],
      "limit": 5
    }
  gql: |
    MATCH (d:Definition) WHERE d.id IN [1, 2]
    RETURN d.name, count(d) AS n LIMIT 5

logical:
  expect:
    - (Aggregate group d.name AS d_name, COUNT(d) AS n (Filter d.id IN [1, 2] (Entities Definition AS d)))

physical:
  clickhouse:
    planned:
      expect:
        - (Deduplicate LimitBy ... (_))
        - (Scan Table(gl_definition) AS d)
        - (Aggregate group d.name, d.name AS d_name, COUNT() AS n (_))
    emitted:
      expect:
        - (Aggregate group d.name, Concat(Substring(d.name, 1, 349525), If(ByteLength(d.name) > ByteLength(Substring(d.name, 1, 349525)), ' [truncated]', '')) AS d_name, COUNT() AS n (_))
  duckdb:
    planned:
      expect:
        - (Bind d (Project * (Filter d.id IN [1, 2] (Scan Table(gl_definition) AS d))))
        - (Aggregate group d.name, d.name AS d_name, COUNT() AS n (_))
    emitted:
      expect:
        - (Aggregate group d.name, d.name AS d_name, COUNT() AS n (_))
