name: Nullable property counts retain a property argument

query:
  gql: |
    MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest)
    RETURN count(mr.merged_at) AS n

logical:
  expect:
    - (Aggregate COUNT(mr.merged_at) AS n (_))

physical:
  clickhouse:
    planned:
      expect:
        - (Scan Table(gl_merge_request) ...)
