cases:
  - name: Nullable property counts retain a property argument

    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"mr","entity":"MergeRequest"}],"relationships":[{"type":"APPROVED","from":"u","to":"mr"}],"aggregations":[{"count":"mr.merged_at","as":"n"}]}
      gql: |
        MATCH (u:User {id: 1})-[:APPROVED]->(mr:MergeRequest)
        RETURN count(mr.merged_at) AS n

    logical:
      expect:
        - (Aggregate COUNT(mr.merged_at) AS n (_))

    physical:
      clickhouse:
        planned:
          expect:
            - (Scan Table(gl_merge_request) ...)

  - name: Non-nullable property counts of a filter-only node drop the argument

    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"a","entity":"Definition","filters":{"name":"compile"}},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}],"aggregations":[{"count":"a.fqn","as":"n"}]}
      gql: |
        MATCH (a:Definition {name: 'compile'})-[:CALLS]->(b:Definition)
        RETURN count(a.fqn) AS n

    logical:
      expect:
        - (Aggregate COUNT(a.fqn) AS n (_))

    physical:
      clickhouse:
        planned:
          ctes:
            exact_order: [_filter_a]
          expect:
            - (Aggregate COUNT() FILTER ? AS n, ... (_))
          reject:
            - (Aggregate COUNT(a.fqn) FILTER ? AS n, ... (_))
            - (Join ON a.id = _orbit_edge_0.source_id (_) (_))
