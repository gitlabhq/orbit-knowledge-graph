name: A relationship property group key reads the edge column under the edge alias
ontology_overlay: edge_properties

query:
  gql: |
    MATCH (u:User)-[r:REVIEWER]->(mr:MergeRequest {id: 2000}) RETURN r.state, count(u) AS n

missing_frontends:
  json: the JSON frontend has no relationship variables, so it cannot name a relationship property

logical:
  expect: ["(Aggregate group r.state AS r_state, COUNT(u) AS n (_))"]

physical:
  clickhouse:
    emitted:
      expect:
        - "(Aggregate group _orbit_edge_0.state, _orbit_edge_0.state AS r_state, COUNT() FILTER ? AS n (_))"
