name: Conditional edge aggregation survives a grouped node join

query: |
  MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition) RETURN b.name, count(a) AS n

logical:
  expect:
    - (Aggregate group b.name AS b_name, COUNT(a) AS n (Follow CALLS a->b AS e0 (Filter a.id = 1 (Entities Definition AS a))))

physical:
  clickhouse:
    planned:
      expect:
        - (Join ON b.id = _orbit_edge_0.target_id (_) (Filter b._deleted = false (Bind b (Deduplicate LimitBy ... (Sort b.traversal_path, b.project_id, b.branch, b.id, b._version DESC (Project * (Filter StartsWith(b.traversal_path, scalar(gl_definition AS _orbit_scope WHERE _orbit_scope.id = 1)) OR (scalar(gl_definition AS _orbit_scope WHERE _orbit_scope.id = 1) = '0/'), b.id IN ?.id (Scan Table(gl_definition) AS b))))))))
        - (Aggregate COUNT() FILTER ? AS n, ... (_))
    emitted:
      expect: ["(Aggregate COUNT() FILTER [(_orbit_edge_0.relationship_kind = 'CALLS') AND (_orbit_edge_0.source_kind = 'Definition') AND (_orbit_edge_0.target_kind = 'Definition') AND (_orbit_edge_0._deleted = false) AND (_orbit_edge_0.source_id = 1)] AS n, ... (_))", "(Deduplicate LimitBy 1 BY ... (_))"]
