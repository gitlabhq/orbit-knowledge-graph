cases:
  - name: A free-text key of a node authorized by its project groups by the project, not the entity
    query:
      json: |
        {"query_type": "aggregation", "nodes": [{"id": "j", "entity": "Job"}], "group_by": ["j.name"], "aggregations": [{"count": "j", "as": "n"}]}
      gql: |
        MATCH (j:Job) RETURN j.name, count(j) AS n
    logical:
      expect:
        - (Aggregate group j.name AS j_name, COUNT(j) AS n (_))
    physical:
      clickhouse:
        planned:
          expect:
            - (Aggregate group j.name, group j.project_id, j.name AS j_name, COUNT() AS n (_))

  - name: A free-text key of a node read per entity adds no owner group
    query:
      json: |
        {"query_type": "aggregation", "nodes": [{"id": "mr", "entity": "MergeRequest"}], "group_by": ["mr.title"], "aggregations": [{"count": "mr", "as": "n"}]}
      gql: |
        MATCH (mr:MergeRequest) RETURN mr.title, count(mr) AS n
    logical:
      expect:
        - (Aggregate group mr.title AS mr_title, COUNT(mr) AS n (_))
    physical:
      clickhouse:
        planned:
          expect:
            - (Aggregate group mr.title, mr.title AS mr_title, COUNT() AS n (_))
