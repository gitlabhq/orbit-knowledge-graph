name: Aggregation over one edge relation filters the relationship kind before picking the latest row

query:
  gql: |
    MATCH (u:User)-[:APPROVED]->(mr:MergeRequest {state: 'merged'}) RETURN u.username, count(mr) AS n

logical:
  expect: ["(Aggregate ... (_))"]

physical:
  clickhouse:
    planned:
      expect:
        - (Deduplicate LimitBy ... (Filter _orbit_edge_0.relationship_kind = 'APPROVED', ... (Scan Table(gl_edge) AS _orbit_edge_0)))
      reject:
        - (Deduplicate Final (Scan Table(gl_edge) AS _orbit_edge_0))
