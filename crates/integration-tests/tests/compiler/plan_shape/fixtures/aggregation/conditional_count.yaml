name: Single-edge aggregation retains latest-row dedup and conditional counting

query:
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS]->(b:Definition) RETURN count(b) AS n

logical:
  expect:
    - (Aggregate COUNT(b) AS n (_))

physical:
  clickhouse:
    planned:
      expect:
        - (Project (Deduplicate LimitBy ... (Filter ... (Scan Table(gl_code_edge) AS _orbit_edge_0))))
        - (Aggregate COUNT() FILTER [_orbit_edge_0.relationship_kind = 'CALLS', _orbit_edge_0.source_kind = 'Definition', _orbit_edge_0.target_kind = 'Definition', _orbit_edge_0._deleted = false, _orbit_edge_0.source_id = 1] AS n (_))
      reject:
        - (Deduplicate Final (Scan Table(gl_code_edge) AS _orbit_edge_0))
    emitted:
      expect:
        - (Deduplicate LimitBy 1 BY ... (_))
        - (Aggregate COUNT() FILTER [(_orbit_edge_0.relationship_kind = 'CALLS') AND (_orbit_edge_0.source_kind = 'Definition') AND (_orbit_edge_0.target_kind = 'Definition') AND (_orbit_edge_0._deleted = false) AND (_orbit_edge_0.source_id = 1)] AS n (_))
