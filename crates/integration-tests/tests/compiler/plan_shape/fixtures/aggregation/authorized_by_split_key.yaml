name: Pipeline text keys group external pipelines apart from the rest of the project

query:
  json: |
    {"query_type": "aggregation", "nodes": [{"id": "pl", "entity": "Pipeline"}], "group_by": ["pl.ref"], "aggregations": [{"count": "pl", "as": "n"}]}
  gql: |
    MATCH (pl:Pipeline) RETURN pl.ref, count(pl) AS n

logical:
  expect:
    - (Aggregate group pl.ref AS pl_ref, COUNT(pl) AS n (_))

physical:
  clickhouse:
    planned:
      expect:
        - (Aggregate group pl.ref, group pl.project_id, group pl.source IN ('external'), pl.ref AS pl_ref, COUNT() AS n (_))
