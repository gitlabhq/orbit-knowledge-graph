name: Pipeline text keys group external pipelines apart from the rest of the project

query:
  json: |
    {"query_type": "aggregation", "nodes": [{"id": "pl", "entity": "Pipeline", "filters": {"project_id": 1000}}], "group_by": ["pl.ref"], "aggregations": [{"count": "pl", "as": "n"}]}
  gql: |
    MATCH (pl:Pipeline) WHERE pl.project_id = 1000 RETURN pl.ref, count(pl) AS n

logical:
  expect:
    - (Aggregate group pl.ref AS pl_ref, COUNT(pl) AS n (_))

physical:
  clickhouse:
    planned:
      expect:
        - (Aggregate group pl.ref, group pl.project_id, group pl.source IN ('external'), pl.ref AS pl_ref, pl.project_id AS _orbit_pl_owner0, pl.source IN ('external') AS _orbit_pl_owner1, COUNT() AS n (_))
