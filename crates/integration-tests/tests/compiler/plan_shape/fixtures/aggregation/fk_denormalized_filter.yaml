name: FK aggregations keep denormalized holder filters on the holder scan without a separate filter definition

query:
  json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[116]},{"id":"mr","entity":"MergeRequest","filters":{"state":{"eq":"merged"}}},{"id":"p","entity":"Project"}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr"},{"type":"IN_PROJECT","from":"mr","to":"p"}],"group_by":["p"],"aggregations":[{"count":"mr","as":"user_mrs"}],"limit":5}'
  gql: "MATCH (u:User {id: 116})-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project) RETURN p, count(mr) AS user_mrs LIMIT 5"

physical:
  clickhouse:
    emitted:
      ctes: { exact_order: [_candidate_mr] }
      expect: ["(Filter mr.state = 'merged', ... (Deduplicate Final (Scan Table(gl_merge_request) AS mr)))"]
