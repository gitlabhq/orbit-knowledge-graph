name: Single node retains its filter and requested projection

query: |
  MATCH (f:File {language: 'rust'}) RETURN f.id, f.path LIMIT 10

logical:
  expect:
    - (Limit 10 (Select f{id, path} (Filter f.language = 'rust' (Entities File AS f))))

physical:
  clickhouse:
    planned:
      exact: |
        (Limit 10
          (Project f.id AS f_id, f.path AS f_path
            (Filter f.language = 'rust', f._deleted = false
              (Bind f (Project * (Deduplicate Final (Scan Table(gl_file) AS f)))))))
    emitted:
      exact: |
        (Limit 11
          (Project f.id AS f_id, f.path AS f_path
            (Filter f.language = 'rust', f._deleted = false
              (Bind f (Project * (Deduplicate Final (Scan Table(gl_file) AS f)))))))
  duckdb:
    planned:
      exact: |
        (Limit 10
          (Project f.id AS f_id, f.path AS f_path
            (Filter f.language = 'rust'
              (Bind f (Project * (Scan Table(gl_file) AS f))))))
