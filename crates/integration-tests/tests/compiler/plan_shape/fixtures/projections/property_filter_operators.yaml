name: Property filters distinguish requirements from SQL functions

query:
  gql: |
    MATCH (p:Project)
    WHERE p.name CONTAINS 'orbit' AND p.name STARTS WITH 'git' AND p.name ENDS WITH 'lab'
      AND token_match(p.name, 'graph') AND all_tokens(p.name, 'graph query') AND any_tokens(p.name, 'code data')
      AND p.name IS NOT NULL AND p.description IS NULL
    RETURN p.name

logical:
  expect:
    - (Filter contains(p.name, 'orbit'), starts_with(p.name, 'git'), ends_with(p.name, 'lab'), token_match(p.name, 'graph'), all_tokens(p.name, 'graph query'), any_tokens(p.name, 'code data'), p.name IS NOT NULL, p.description IS NULL (_))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter contains(p.name, 'orbit'), starts_with(p.name, 'git'), ends_with(p.name, 'lab'), token_match(p.name, 'graph'), all_tokens(p.name, 'graph query'), any_tokens(p.name, 'code data'), p.name IS NOT NULL, p.description IS NULL, ... (_))
    emitted:
      expect:
        - (Filter Contains(Lower(p.name), Lower('orbit')), StartsWith(Lower(p.name), Lower('git')), EndsWith(Lower(p.name), Lower('lab')), TokenMatch(Lower(p.name), Lower('graph')), AllTokens(Lower(p.name), Lower('graph query')), AnyTokens(Lower(p.name), Lower('code data')), p.name IS NOT NULL, p.description IS NULL, ... (_))
