name: Pinned search keeps an unprojected sort column available

query: |
  MATCH (f:File) WHERE f.id IN [1, 2]
  RETURN f.path ORDER BY f.id DESC LIMIT 5

logical:
  expect:
    - (Limit 5 (Select f{path} (Sort f.id DESC (Filter f.id IN [1, 2] (Entities File AS f)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Project f.path AS f_path (Filter f._deleted = false (Bind f (Deduplicate LimitBy ... (Sort f.traversal_path, f.project_id, f.branch, f.id, f._version DESC (Project * (Filter f.id IN [1, 2] (_))))))))
      reject:
        - (Project f.id AS f_id, ... (_))
    emitted:
      expect:
        - (Limit 6 (Sort f.id DESC (_)))
      reject:
        - (Project f.id AS f_id, ... (_))
  duckdb:
    planned:
      expect:
        - (Project f.path AS f_path (Bind f (Project * (Filter f.id IN [1, 2] (Scan Table(gl_file) AS f)))))
      reject:
        - (Project f.id AS f_id, ... (_))
    emitted:
      expect:
        - (Limit 6 (Sort f.id DESC (_)))
