name: Pinned search keeps an unprojected sort column available
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "f", "entity": "File", "node_ids": [1, 2], "columns": ["path"]}],
      "order_by": "-f.id",
      "limit": 5
    }
  gql: |
    MATCH (f:File) WHERE f.id IN [1, 2]
    RETURN f.path ORDER BY f.id DESC LIMIT 5
logical:
  expect:
    - (Project f.path (Filter f.id IN [1, 2] (NodeScan File AS f)))
    - (Limit 5 (Sort f.id DESC (_)))
physical:
  clickhouse:
    planned:
      expect:
        - (Project f.path AS f_path (Filter f.id IN [1, 2], ... (Deduplicate Final (Scan Table(gl_file) AS f))))
      reject:
        - (Project f.id AS f_id, ... (_))
    emitted:
      expect:
        - (Limit 5 (Sort f.id DESC (_)))
      reject:
        - (Project f.id AS f_id, ... (_))
  duckdb:
    planned:
      expect:
        - (Project f.path AS f_path (Filter ... (Deduplicate Final (Scan Table(gl_file) AS f))))
      reject:
        - (Project f.id AS f_id, ... (_))
    emitted:
      expect:
        - (Limit 5 (Sort f.id DESC (_)))
