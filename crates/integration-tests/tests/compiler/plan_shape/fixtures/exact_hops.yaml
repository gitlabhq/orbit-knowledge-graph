name: Exact hop depth excludes shorter arms
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "a", "entity": "Definition", "node_ids": [1], "columns": ["id"]},
        {"id": "b", "entity": "Definition", "columns": ["id"]}
      ],
      "relationships": [{"type": "CALLS", "from": "a", "to": "b", "hops": [2, 2]}]
    }
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS*2]->(b:Definition) RETURN a.id, b.id
logical:
  expect:
    - (Relationship a b Outgoing (Kinds CALLS) (Hops 2 2) (Filters))
physical:
  clickhouse:
    expect:
      - (Union e0 (SourceFragment (Outputs ... (Output depth (Literal 2)) ...) _))
      - (Join INNER (AND (AND (= (Column e1 target_id) (Column e2 source_id)) _) _) _ _)
    reject:
      - (Output depth (Literal 1))
      - (Output depth (Literal 3))
  duckdb:
    expect:
      - (Union e0 _)
      - (Output depth (Literal 2))
    reject:
      - (Output depth (Literal 1))
      - (Output depth (Literal 3))
