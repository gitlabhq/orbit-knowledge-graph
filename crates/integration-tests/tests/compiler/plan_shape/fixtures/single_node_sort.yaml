name: Pinned search keeps an unprojected sort column available
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "f", "entity": "File", "node_ids": [1, 2], "columns": ["path"]}],
      "order_by": "-f.id",
      "limit": 5
    }
  gql: |
    MATCH (f:File) WHERE f.id IN [1, 2]
    RETURN f.path ORDER BY f.id DESC LIMIT 5
logical:
  expect:
    - (Node f File (Ids 1 2) (Columns path) ...)
    - (OrderBy (Desc f id))
    - (Limit 5)
physical:
  clickhouse:
    expect:
      - (Strategy (SingleNode (SourceFragment (Outputs (Output f_path (Column f path))) (Filter _ (Read gl_file f Final)))))
      - (IN (Column f id) (Literal "[1,2]"))
      - (OrderBy (Desc (Column f id)))
      - (Limit 5)
    reject:
      - (Output f_id ...)
  duckdb:
    expect:
      - (Strategy (SingleNode (SourceFragment (Outputs (Output f_path (Column f path))) (Filter _ (Read gl_file f Final)))))
      - (OrderBy (Desc (Column f id)))
      - (Limit 5)
    reject:
      - (Output f_id ...)
