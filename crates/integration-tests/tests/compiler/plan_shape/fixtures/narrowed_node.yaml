name: Narrowed node reads recheck mutable fields outside latest-row resolution
query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "p", "entity": "Project", "filters": {"star_count": 1}},
        {"id": "mr", "entity": "MergeRequest", "node_ids": [9710]}
      ],
      "relationships": [
        {"type": "IN_PROJECT", "from": "mr", "to": "p"}
      ],
      "group_by": ["p.name"],
      "aggregations": [{"count": "mr", "as": "c"}]
    }
  gql: |
    MATCH (p:Project {star_count: 1})<-[:IN_PROJECT]-(mr:MergeRequest {id: 9710})
    RETURN p.name, count(mr) AS c
logical:
  expect:
    - (Node p Project ... (Filters (Predicate star_count eq 1)))
physical:
  clickhouse:
    expect:
      - (Definitions (Keys _candidate_p _) (Keys _candidate_mr _))
      - (CenterFilter (InCte (Column mr id) _candidate_mr id))
      - (Target p (Reference _candidate_p))
      - (Cte _candidate_p (Query ... (Scan gl_project p Plain) (Where (AND (= (Column p star_count) (Literal 1)) (= (Column p _deleted) (Literal false)))) ...))
      - (Subquery p (Query (Ctes) (Select (Output Unaliased Star)) (Subquery p (Query ... (Scan gl_project p Plain) (Where (InCte (Column p id) _candidate_p id)) ... (LimitBy 1 (Column p traversal_path) (Column p id)))) (Where (AND (= (Column p star_count) (Literal 1)) (= (Column p _deleted) (Literal false)))) ...))
    reject:
      - (Scan gl_edge ...)
