name: LIMIT alone fetches one probe row without tie-breakers or an OFFSET

query:
  json: |
    {"query_type": "traversal", "nodes": [{"id": "f", "entity": "File", "id_range": {"start": 1, "end": 10000}, "columns": ["path"]}], "limit": 2}
  gql: |
    MATCH (f:File) WHERE f.id >= 1 AND f.id <= 10000 RETURN f.path LIMIT 2

physical:
  clickhouse:
    normalize:
      input:
        expect: ["(Limit 2 (Input traversal (...)))"]
        reject: ["(Offset ... (_))"]
    response_policy:
      node:
        expect: ["(Limit 3 (Project f.path AS f_path (_)))"]
        reject: ["(Offset ... (_))", "(Limit ... (Sort ... (_)))"]
  duckdb:
    normalize:
      input:
        expect: ["(Limit 2 (Input traversal (...)))"]
        reject: ["(Offset ... (_))"]
    paginate:
      node:
        expect: ["(Limit 3 (Project f.path AS f_path (_)))"]
        reject: ["(Offset ... (_))", "(Limit ... (Sort ... (_)))"]
