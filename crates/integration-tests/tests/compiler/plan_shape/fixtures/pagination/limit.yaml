name: LIMIT alone fetches one probe row without tie-breakers or an OFFSET

query: |
  MATCH (f:File) RETURN f.path LIMIT 2

logical:
  expect: ["(Limit 2 (Select f{path} (Entities File AS f)))"]
  reject: ["(Offset ... (_))"]

physical:
  clickhouse:
    emitted:
      expect: ["(Limit 3 (Project f.path AS f_path (_)))"]
      reject: ["(Offset ... (_))", "(Sort ... (_))"]
  duckdb:
    emitted:
      expect: ["(Limit 3 (Project f.path AS f_path (_)))"]
      reject: ["(Offset ... (_))", "(Sort ... (_))"]
