name: Filter-only FK target exports keys from an authoritative filtered scan
query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "node_ids": [2000]},
        {"id": "u", "entity": "User", "filters": {"username": "alice"}}
      ],
      "relationships": [{"type": "AUTHORED", "from": "u", "to": "mr"}],
      "aggregations": [{"count": "mr", "as": "n"}]
    }
  gql: |
    MATCH (mr:MergeRequest {id: 2000})<-[:AUTHORED]-(u:User {username: 'alice'})
    RETURN count(mr) AS n
logical:
  expect:
    - '(Node u User ... (Filters (Predicate username eq "\"alice\"")))'
    - (Measures (Measure count mr Node n))
physical:
  clickhouse:
    expect:
      - (Strategy (FkStar mr))
      - '(Cte _filter_u (Query (Ctes) (Select (Output id (Column u id))) (Scan gl_user u Final) (Where (AND (= (Column u username) (Literal "\"alice\"")) (= (Column u _deleted) (Literal false)))) ...))'
      - (InCte (Column mr author_id) _filter_u id)
    reject:
      - (Scan gl_edge ...)
      - (Scan gl_user u Plain)
