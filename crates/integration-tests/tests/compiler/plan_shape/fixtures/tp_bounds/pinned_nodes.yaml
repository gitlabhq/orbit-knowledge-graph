cases:
  - name: A node pinned by its own id keeps its own read free of a path lookup
    query: |
      MATCH (mr:MergeRequest {id: 7}) RETURN mr LIMIT 1
    logical:
      expect: ["(Limit 1 (Select mr (Filter mr.id = 7 (Entities MergeRequest AS mr))))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter mr.id = 7, ... (Scan Table(gl_merge_request) AS mr))"]
          reject: ["(Filter StartsWith(mr.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (_))"]

  - name: A pinned node shares one path lookup with the nodes it reaches
    query: |
      MATCH (mr:MergeRequest {id: 7})-[:HAS_LATEST_DIFF]->(d:MergeRequestDiff) RETURN d.id LIMIT 10
    logical:
      expect: ["(Follow HAS_LATEST_DIFF mr->d AS e0 (Filter mr.id = 7 (Entities MergeRequest AS mr)))"]
    physical:
      clickhouse:
        emitted:
          expect:
            - (Filter StartsWith(d.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (Scan Table(gl_merge_request_diff) AS d))
            - (Filter StartsWith(mr.traversal_path, scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_merge_request AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (Scan Table(gl_merge_request) AS mr))

  - name: A pinned pipeline bounds its jobs by its path
    query: |
      MATCH (pl:Pipeline {id: 7})-[:HAS_JOB]->(j:Job) RETURN j.name LIMIT 100
    logical:
      expect: ["(Follow HAS_JOB pl->j AS e0 (Filter pl.id = 7 (Entities Pipeline AS pl)))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(j.traversal_path, scalar(gl_pipeline AS _orbit_scope WHERE _orbit_scope.id = 7)) OR (scalar(gl_pipeline AS _orbit_scope WHERE _orbit_scope.id = 7) = '0/'), ... (Scan Table(gl_job) AS j))"]

  - name: A node pinned through a foreign key keeps the anchor's path lookup on its own read
    query: |
      MATCH (mr:MergeRequest {project_id: 100}) RETURN mr.iid LIMIT 10
    logical:
      expect: ["(Filter mr.project_id = 100 (Entities MergeRequest AS mr))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(mr.traversal_path, scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 100)) OR (scalar(gl_project AS _orbit_scope WHERE _orbit_scope.id = 100) = '0/'), mr.project_id = 100, ... (Bind mr (_)))"]
