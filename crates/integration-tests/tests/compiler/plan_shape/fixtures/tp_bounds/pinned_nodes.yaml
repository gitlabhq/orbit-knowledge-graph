cases:
  - name: A node pinned by its own id keeps its own read free of a path lookup
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[7]}],"limit":1}
      gql: |
        MATCH (mr:MergeRequest {id: 7}) RETURN mr LIMIT 1
    logical:
      expect: ["(NodeScan MergeRequest AS mr)"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter mr.id = 7, ... (Scan Table(gl_merge_request) AS mr))"]
          reject: ["(Filter StartsWith(mr.traversal_path, scalar(gl_merge_request AS _scope WHERE _scope.id = 7)) OR (scalar(gl_merge_request AS _scope WHERE _scope.id = 7) = '0/'), ... (_))"]

  - name: A pinned node shares one path lookup with the nodes it reaches
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[7]},{"id":"d","entity":"MergeRequestDiff","columns":["id"]}],"relationships":[{"type":"HAS_LATEST_DIFF","from":"mr","to":"d"}],"limit":10}
      gql: |
        MATCH (mr:MergeRequest {id: 7})-[:HAS_LATEST_DIFF]->(d:MergeRequestDiff) RETURN d.id LIMIT 10
    logical:
      expect: ["(EdgeScan HAS_LATEST_DIFF mr->d AS e0)"]
    physical:
      clickhouse:
        emitted:
          expect:
            - (Filter StartsWith(d.traversal_path, scalar(gl_merge_request AS _scope WHERE _scope.id = 7)) OR (scalar(gl_merge_request AS _scope WHERE _scope.id = 7) = '0/'), ... (Scan Table(gl_merge_request_diff) AS d))
            - (Filter StartsWith(mr.traversal_path, scalar(gl_merge_request AS _scope WHERE _scope.id = 7)) OR (scalar(gl_merge_request AS _scope WHERE _scope.id = 7) = '0/'), ... (Scan Table(gl_merge_request) AS mr))

  - name: A pinned pipeline bounds its jobs by its path
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"pl","entity":"Pipeline","node_ids":[7]},{"id":"j","entity":"Job","columns":["name"]}],"relationships":[{"type":"HAS_JOB","from":"pl","to":"j"}],"limit":100}
      gql: |
        MATCH (pl:Pipeline {id: 7})-[:HAS_JOB]->(j:Job) RETURN j.name LIMIT 100
    logical:
      expect: ["(EdgeScan HAS_JOB pl->j AS e0)"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(j.traversal_path, scalar(gl_pipeline AS _scope WHERE _scope.id = 7)) OR (scalar(gl_pipeline AS _scope WHERE _scope.id = 7) = '0/'), ... (Bind j (Project * (Deduplicate Final (Scan Table(gl_job) AS j)))))"]

  - name: A node pinned through a foreign key keeps the anchor's path lookup on its own read
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","columns":["iid"],"filters":{"project_id":{"eq":100}}}],"limit":10}
      gql: |
        MATCH (mr:MergeRequest {project_id: 100}) RETURN mr.iid LIMIT 10
    logical:
      expect: ["(Filter mr.project_id = 100 (NodeScan MergeRequest AS mr))"]
    physical:
      clickhouse:
        emitted:
          expect: ["(Filter StartsWith(mr.traversal_path, scalar(gl_project AS _scope WHERE _scope.id = 100)) OR (scalar(gl_project AS _scope WHERE _scope.id = 100) = '0/'), mr.project_id = 100, ... (Bind mr (_)))"]
