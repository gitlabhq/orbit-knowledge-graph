name: Dynamic hydration without paths filters only pinned IDs

query: |
  MATCH (f:File) WHERE f.id IN [1, 2] RETURN f.path

hydration:
  dynamic: true

logical:
  expect:
    - (Limit 30 (Select f{path} (Filter f.id IN [1, 2] (Entities File AS f))))

physical:
  clickhouse:
    planned:
      expect: ["(Filter f.id IN [1, 2] (Scan Table(gl_file) AS f))"]
    emitted:
      expect: ["(Filter f.id IN [1, 2] (Scan Table(gl_file) AS f))"]
