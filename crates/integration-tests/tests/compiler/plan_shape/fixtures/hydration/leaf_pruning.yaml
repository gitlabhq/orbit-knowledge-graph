name: Hydration plans pruned path prefixes before current-row rendering

query: |
  MATCH (f:File) WHERE f.id IN [1, 2] RETURN f.path

hydration:
  dynamic: true
  paths:
    f: ["1/", "1/100/", "1/200/"]

logical:
  expect:
    - (Limit 30 (Select f{path} (Filter f.id IN [1, 2] (Entities File AS f))))

physical:
  clickhouse:
    planned:
      expect:
        - |
          (Filter f._deleted = false
            (Bind f
              (Deduplicate LimitBy ...
                (Sort f.traversal_path, f.project_id, f.branch, f.id, f._version DESC
                  (Project f.id AS id, f._deleted AS _deleted, f.path AS path
                    (Filter StartsWith(f.traversal_path, '1/100/') OR StartsWith(f.traversal_path, '1/200/'), f.id IN [1, 2]
                      (Scan Table(gl_file) AS f)))))))
    emitted:
      expect:
        - (Filter StartsWith(f.traversal_path, '1/100/') OR StartsWith(f.traversal_path, '1/200/'), f.id IN [1, 2] (_))
