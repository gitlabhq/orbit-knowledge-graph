name: Static hydration keeps individual prefix predicates

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"f","entity":"File","node_ids":[1],"columns":["path"]}]}
  gql: |
    MATCH (f:File {id: 1}) RETURN f.path

hydration:
  paths:
    f: ["1/10/", "1/20/", "1/30/", "1/40/"]

logical:
  gql:
    expect:
      - (Limit 30 (Select f{path} (Filter f.id = 1 (Entities File AS f))))
  json:
    expect:
      - (Limit 30 (Select f{path} (Filter f.id IN [1] (Entities File AS f))))

physical:
  clickhouse:
    planned:
      expect: ["(Filter f.traversal_path PREFIX UNION ['1/10/', '1/20/', '1/30/', '1/40/'], f.id IN [1] (_))"]
    emitted:
      expect: ["(Filter StartsWith(f.traversal_path, '1/10/') OR StartsWith(f.traversal_path, '1/20/') OR StartsWith(f.traversal_path, '1/30/') OR StartsWith(f.traversal_path, '1/40/'), f.id = 1 (_))"]
