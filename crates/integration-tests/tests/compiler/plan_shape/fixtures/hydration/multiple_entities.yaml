name: Multiple hydration entities share one union with per-table projections and keys

query: |
  MATCH (f:File {id: 1})-[:DEFINES]->(d:Definition {id: 2}) RETURN f.path, d.name

hydration:
  paths:
    f: ["1/100/"]
    d: ["1/100/"]

logical:
  expect:
    - (Limit 30 (Select f{path}, d{name} (Filter d.id = 2 (Follow DEFINES f->d AS e0 (Filter f.id = 1 (Entities File AS f))))))

physical:
  clickhouse:
    planned:
      expect: ["(Union ALL (_) (_))", "(Project f.id AS id, f._deleted AS _deleted, f.path AS path (_))", "(Project d.id AS id, d._deleted AS _deleted, d.name AS name (_))"]
    emitted:
      expect:
        - (Union ALL (_) (_))
        - (Project f.id AS id, f._deleted AS _deleted, f.path AS path (_))
        - (Project d.id AS id, d._deleted AS _deleted, d.name AS name (_))
      reject: ["(Deduplicate Final (_))", "(Scan Table(gl_code_edge) ...)"]
