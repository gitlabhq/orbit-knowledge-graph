name: Hydration reads only requested properties and current-row columns
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"f","entity":"File","node_ids":[1],"columns":["path"]}]}
  gql: |
    MATCH (f:File {id: 1}) RETURN f.path
hydration: {}
logical:
  expect: ["(Query hydration (...))"]
physical:
  clickhouse:
    planned:
      expect: ["(Hydration (Project hydrate.path (Filter hydrate._deleted = false (Deduplicate LimitBy hydrate.traversal_path, hydrate.project_id, hydrate.branch, hydrate.id (_)))))"]
    emitted:
      expect: ["(Project hydrate.id AS id, hydrate._deleted AS _deleted, hydrate.path AS path (_))"]
      reject: ["(Project * (_))", "(Deduplicate Final (_))", "(Filter StartsWith(hydrate.traversal_path, ?), ... (_))"]
