name: Hydration reads only requested properties and current-row columns

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"f","entity":"File","node_ids":[1],"columns":["path"]}]}
  gql: |
    MATCH (f:File {id: 1}) RETURN f.path

hydration: {}

logical:
  gql:
    expect:
      - (Limit 30 (Select f{path} (Filter f.id = 1 (Entities File AS f))))

physical:
  clickhouse:
    planned:
      expect: ["(Filter f._deleted = false (Bind f (Deduplicate LimitBy 1 BY f.traversal_path, f.project_id, f.branch, f.id (Sort f.traversal_path, f.project_id, f.branch, f.id, f._version DESC (Project f.id AS id, f._deleted AS _deleted, f.path AS path (_))))))"]
    emitted:
      expect: ["(Project f.id AS id, f._deleted AS _deleted, f.path AS path (_))"]
      reject: ["(Project * (_))", "(Deduplicate Final (_))", "(Filter StartsWith(f.traversal_path, ?), ... (_))"]
