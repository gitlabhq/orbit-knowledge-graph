name: Hydration without pinned IDs has no ID predicate

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"f","entity":"File","columns":["path"]}]}
  gql: |
    MATCH (f:File) RETURN f.path

hydration:
  paths:
    f: ["1/", "1/100/"]

physical:
  clickhouse:
    plan_clickhouse:
      input:
        expect:
          - (Input hydration (...))

      query_plan:
        expect:
          - (Filter f.traversal_path PREFIX UNION ['1/100/'] (Scan Table(gl_file) AS f))
        reject:
          - (Filter f.id IN ?, ... (_))
    response_policy:
      node:
        expect:
          - (Filter StartsWith(f.traversal_path, '1/100/') (Scan Table(gl_file) AS f))
        reject:
          - (Filter f.id IN ?, ... (_))
