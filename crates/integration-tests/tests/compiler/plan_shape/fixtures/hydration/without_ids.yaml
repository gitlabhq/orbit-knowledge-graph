name: Hydration without pinned IDs has no ID predicate

query: |
  MATCH (f:File) RETURN f.path

hydration:
  paths:
    f: ["1/", "1/100/"]

logical:
  expect:
    - (Limit 30 (Select f{path} (Entities File AS f)))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter StartsWith(f.traversal_path, '1/100/') (Scan Table(gl_file) AS f))
      reject:
        - (Filter f.id IN ?, ... (_))
    emitted:
      expect:
        - (Filter StartsWith(f.traversal_path, '1/100/') (Scan Table(gl_file) AS f))
      reject:
        - (Filter f.id IN ?, ... (_))
