name: Hydration without pinned IDs has no ID predicate
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"f","entity":"File","columns":["path"]}]}
  gql: |
    MATCH (f:File) RETURN f.path
hydration:
  paths:
    f: ["1/", "1/100/"]
logical:
  expect:
    - (Query hydration (...))
physical:
  clickhouse:
    planned:
      expect:
        - (Filter hydrate.traversal_path PREFIX UNION ['1/100/'] (Scan Table(gl_file) AS hydrate))
      reject:
        - (Filter hydrate.id IN ?, ... (_))
    emitted:
      expect:
        - (Filter StartsWith(hydrate.traversal_path, '1/100/') (Scan Table(gl_file) AS hydrate))
      reject:
        - (Filter hydrate.id IN ?, ... (_))
