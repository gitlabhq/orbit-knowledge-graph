name: Hydration widens prefixes to the budget during planning

query: |
  MATCH (f:File {id: 1}) RETURN f.path

hydration:
  dynamic: true
  path_segment_budget: 1
  paths:
    f: ["1/100/10/", "1/200/20/"]

logical:
  expect:
    - (Limit 30 (Select f{path} (Filter f.id = 1 (Entities File AS f))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter StartsWith(f.traversal_path, '1/'), f.id = 1 (Scan Table(gl_file) AS f))
    emitted:
      expect:
        - (Filter StartsWith(f.traversal_path, '1/'), f.id = 1 (_))
