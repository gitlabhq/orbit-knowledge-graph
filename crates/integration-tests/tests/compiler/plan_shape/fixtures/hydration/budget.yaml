name: Hydration widens prefixes to the budget during planning

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"f","entity":"File","node_ids":[1],"columns":["path"]}]}
  gql: |
    MATCH (f:File {id: 1}) RETURN f.path

hydration:
  dynamic: true
  path_segment_budget: 1
  paths:
    f: ["1/100/10/", "1/200/20/"]

physical:
  clickhouse:
    plan_clickhouse:
      input:
        expect:
          - (Input hydration (...))

      query_plan:
        expect:
          - (Filter f.traversal_path PREFIX UNION ['1/'], f.id IN [1] (_))
    response_policy:
      node:
        expect:
          - (Filter StartsWith(f.traversal_path, '1/'), f.id = 1 (_))
