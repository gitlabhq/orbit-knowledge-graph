name: Dynamic hydration prunes an ancestor to one prefix

query:
  gql: |
    MATCH (f:File {id: 1}) RETURN f.path

hydration:
  dynamic: true
  paths:
    f: ["1/", "1/100/"]

logical:
  expect: ["(Input hydration (...))"]

physical:
  clickhouse:
    planned:
      expect: ["(Filter f.traversal_path PREFIX UNION ['1/100/'], f.id IN [1] (_))"]
    emitted:
      expect: ["(Filter StartsWith(f.traversal_path, '1/100/'), f.id = 1 (Scan Table(gl_file) AS f))"]
