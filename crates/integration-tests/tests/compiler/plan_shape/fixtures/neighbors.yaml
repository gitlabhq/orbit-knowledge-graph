name: Neighbors uses its family emitter without an edge-chain strategy
query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "d", "entity": "Definition", "node_ids": [1]}],
      "neighbors": {"direction": "both", "rel_types": ["CALLS"]}
    }
  gql: |
    MATCH (d:Definition {id: 1})-[:CALLS]-(neighbor) RETURN d, neighbor
logical:
  expect:
    - (Input neighbors (...))
    - (Filter d.id IN [1] (NodeScan Definition AS d))
physical:
  clickhouse:
    planned:
      exact: (Neighbors)
    emitted:
      expect:
        - (Scan Table(gl_code_edge) ...)
  duckdb:
    planned:
      exact: (Neighbors)
    emitted:
      expect:
        - (Scan Table(gl_edge) ...)
