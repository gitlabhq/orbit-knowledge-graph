cases:
  - name: Variable hops read only the tables and start kinds of variants that reach the target
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"g","entity":"Group","node_ids":[1]},{"id":"p","entity":"Project","columns":["id"]}],"relationships":[{"type":"CONTAINS","from":"g","to":"p","hops":[1,3]}]}
      gql: |
        MATCH (g:Group {id: 1})-[:CONTAINS*1..3]->(p:Project) RETURN p.id
    logical:
      expect: ["(EdgeScan CONTAINS g->p AS e0 HOPS 1..3)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter e2.relationship_kind = 'CONTAINS', e2.source_kind = 'Group', e2.source_id IN ?.target_id (_))
            - (Filter e3.relationship_kind = 'CONTAINS', e3.source_kind = 'Group', e3.source_id IN ?.target_id (_))
          reject: ["(Scan Table(gl_code_edge) ...)"]

  - name: Variable hops keep every start kind that can still reach the target
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"MergeRequest","node_ids":[1]},{"id":"b","entity":"MergeRequest","columns":["id"]}],"relationships":[{"type":"MENTIONS","from":"a","to":"b","hops":[1,2]}]}
      gql: |
        MATCH (a:MergeRequest {id: 1})-[:MENTIONS*1..2]->(b:MergeRequest) RETURN b.id
    logical:
      expect: ["(EdgeScan MENTIONS a->b AS e0 HOPS 1..2)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter e2.relationship_kind = 'MENTIONS', e2.source_kind IN ['MergeRequest', 'WorkItem'], e2.source_id IN ?.target_id (_))

  - name: A namespace-anchored endpoint seeds the first hop with its ids
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"e","entity":"WorkItem","filters":{"project_id":5},"columns":["id"]},{"id":"c","entity":"WorkItem","columns":["id"]}],"relationships":[{"type":"CONTAINS","from":"e","to":"c","hops":[1,2]}]}
      gql: |
        MATCH (e:WorkItem)-[:CONTAINS*1..2]->(c:WorkItem) WHERE e.project_id = 5 RETURN e.id, c.id
    logical:
      expect: ["(EdgeScan CONTAINS e->c AS e0 HOPS 1..2)"]
    physical:
      clickhouse:
        planned:
          expect:
            - (Filter e1.relationship_kind = 'CONTAINS', e1.source_kind = 'WorkItem', e1.source_id IN ?.id (_))
