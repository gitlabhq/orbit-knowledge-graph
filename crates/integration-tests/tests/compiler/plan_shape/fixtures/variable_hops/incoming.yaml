name: Incoming variable hops preserve reverse join endpoints and path output
missing_frontends:
  gql: GQL normalizes incoming patterns to outgoing edges; depth_arms.yaml covers that plan.
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b","direction":"incoming","hops":[1,2]}]}
logical:
  expect: ["(EdgeScan CALLS b->a AS e0 ...)"]
physical:
  clickhouse:
    planned:
      expect: ["(Union ALL AS e0 (_) (_))", "(Join ON (e1.source_id = e2.target_id) AND ... (_) (_))"]
      reject: ["(SemiJoin ... (_) (_))"]
    emitted:
      expect: ["(Union ALL AS e0 (_) (_))", "(Project array(tuple(e1.source_id, e1.source_kind), tuple(e2.source_id, e2.source_kind)) AS path_nodes, ... (_))"]
