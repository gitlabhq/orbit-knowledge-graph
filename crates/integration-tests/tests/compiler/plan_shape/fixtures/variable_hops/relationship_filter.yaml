name: Variable-hop relationship filters apply to every physical hop

missing_frontends:
  gql: GQL does not support property filters on variable-length relationships.

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[1]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b","hops":[2,2],"filters":{"project_id":9}}]}

logical:
  expect:
    - (Limit 30 (Select a, b (Filter e0.project_id = 9 (Follow CALLS a->b AS e0 HOPS 2..2 (Filter a.id IN [1] (Entities Definition AS a))))))

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_e1.relationship_kind = 'CALLS', _orbit_e1.project_id = 9, ... (_))
        - (Filter _orbit_e2.relationship_kind = 'CALLS', _orbit_e2.project_id = 9, ... (_))
  duckdb:
    rejected: unknown column _orbit_e1.project_id
