name: Wildcard two-hop paths retain relationships for intermediate kinds

query: |
  MATCH (u:User {id: 1})-[*2]->(p:Project {id: 1000}) RETURN u, p

logical:
  expect:
    - (Limit 30 (Select u, p (Filter p.id = 1000 (Follow * u->p AS e0 HOPS 2..2 (Filter u.id = 1 (Entities User AS u))))))

physical:
  clickhouse:
    emitted:
      expect:
        - (Scan Table(gl_edge) ...)
      reject:
        - (Filter _orbit_e1.relationship_kind IN ['CONTAINS', 'CREATOR', 'MEMBER_OF'], ... (_))
