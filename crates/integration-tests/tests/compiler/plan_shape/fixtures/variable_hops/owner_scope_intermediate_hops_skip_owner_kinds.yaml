name: Variable-hop intermediates skip owner-scoped kinds for a caller without the admin claim
ontology_overlay: owner_scope

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[2000]},{"id":"p","entity":"Project"}],"relationships":[{"type":["HAS_NOTE","IN_PROJECT"],"from":"mr","to":"p","hops":[2,2]}]}
  gql: |
    MATCH (mr:MergeRequest {id: 2000})-[:HAS_NOTE|IN_PROJECT*2..2]->(p:Project) RETURN mr, p

logical:
  expect: ["(EdgeScan HAS_NOTE|IN_PROJECT mr->p AS e0 HOPS 2..2)"]

physical:
  clickhouse:
    planned:
      expect:
        - (Filter _orbit_e2.relationship_kind IN ['HAS_NOTE', 'IN_PROJECT'], _orbit_e2.source_id IN ?.target_id, _orbit_e2.source_kind NOT IN ['Note'] (_))
