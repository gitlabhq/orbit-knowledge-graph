name: Exact hop depth excludes shorter arms
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "a", "entity": "Definition", "node_ids": [1], "columns": ["id"]},
        {"id": "b", "entity": "Definition", "columns": ["id"]}
      ],
      "relationships": [{"type": "CALLS", "from": "a", "to": "b", "hops": [2, 2]}]
    }
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS*2]->(b:Definition) RETURN a.id, b.id
logical:
  expect:
    - (EdgeScan CALLS a->b AS e0 HOPS 2..2)
physical:
  clickhouse:
    planned:
      expect:
        - (Union ALL AS e0 (Project 2 AS depth, ... (_)))
        - (Join ON (e1.target_id = e2.source_id) AND (e2._deleted = false) AND (e2.relationship_kind = 'CALLS') (_) (_))
      reject:
        - (Project 1 AS depth, ... (_))
        - (Project 3 AS depth, ... (_))
      occurrences:
        - pattern: (Union ALL AS e0 (_))
          count: 1
  duckdb:
    planned:
      expect:
        - (Union ALL AS e0 (Project 2 AS depth, ... (_)))
      reject:
        - (Project 1 AS depth, ... (_))
        - (Project 3 AS depth, ... (_))
