name: Exact hop depth excludes shorter arms

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "a", "entity": "Definition", "node_ids": [1], "columns": ["id"]},
        {"id": "b", "entity": "Definition", "columns": ["id"]}
      ],
      "relationships": [{"type": "CALLS", "from": "a", "to": "b", "hops": [2, 2]}]
    }
  gql: |
    MATCH (a:Definition {id: 1})-[:CALLS*2]->(b:Definition) RETURN a.id, b.id

logical:
  gql:
    expect:
      - (Limit 30 (Select a{id}, b{id} (Follow CALLS a->b AS e0 HOPS 2..2 (Filter a.id = 1 (Entities Definition AS a)))))

physical:
  clickhouse:
    planned:
      expect:
        - (Union ALL AS _orbit_edge_0 (Project * (Filter _orbit_edge_0.target_kind = 'Definition' (Bind _orbit_edge_0 (Project 2 AS _orbit_depth, ... (_))))))
        - (Join ON (_orbit_depth_1.target_id = _orbit_e2.source_id) AND (_orbit_depth_1.target_kind = _orbit_e2.source_kind) (_) (_))
        - (Filter _orbit_e2._deleted = false (Bind _orbit_e2 (Deduplicate LimitBy ... (Sort _orbit_e2.traversal_path, _orbit_e2.relationship_kind, _orbit_e2.project_id, _orbit_e2.branch, _orbit_e2.source_id, _orbit_e2.target_id, _orbit_e2.source_kind, _orbit_e2.target_kind, _orbit_e2._version DESC (Project * (Filter StartsWith(_orbit_e2.traversal_path, scalar(gl_definition AS _orbit_scope WHERE _orbit_scope.id = 1)) OR (scalar(gl_definition AS _orbit_scope WHERE _orbit_scope.id = 1) = '0/'), _orbit_e2.relationship_kind = 'CALLS', _orbit_e2.source_id IN ?.target_id (_)))))))
      reject:
        - (Project 3 AS _orbit_depth, ... (_))
      occurrences:
        - pattern: (Union ALL AS _orbit_edge_0 (_))
          count: 1
  duckdb:
    planned:
      expect:
        - (Union ALL AS _orbit_edge_0 (Project * (Filter _orbit_edge_0.target_kind = 'Definition' (Bind _orbit_edge_0 (Project 2 AS _orbit_depth, ... (_))))))
      reject:
        - (Project 3 AS _orbit_depth, ... (_))
