ontology: { schema_prefix: v1_ }

cases:
  - name: Prefixed ontologies read prefixed node tables
    query:
      json: '{"query_type":"traversal","nodes":[{"id":"g","entity":"Group","node_ids":[1],"columns":["name"]}],"limit":1}'
      gql: "MATCH (g:Group {id: 1}) RETURN g.name LIMIT 1"
    physical:
      clickhouse:
        compiled: { expect: [(Scan Table(v1_gl_group) AS g)], reject: [(Scan Table(gl_group) AS g)] }

  - name: Prefixed ontologies keep FK elision on prefixed tables
    query:
      json: '{"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1],"columns":["username"]},{"id":"mr","entity":"MergeRequest","columns":["title"]}],"relationships":[{"type":"AUTHORED","from":"u","to":"mr"}],"limit":1}'
      gql: "MATCH (u:User {id: 1})-[:AUTHORED]->(mr:MergeRequest) RETURN u.username, mr.title LIMIT 1"
    physical:
      clickhouse:
        compiled:
          expect:
            - (Join ON u.id = mr.author_id (_) (_))
            - (Scan Table(v1_gl_merge_request) AS mr)
            - (Scan Table(v1_gl_user) AS u)
