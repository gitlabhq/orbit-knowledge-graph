cases:
  - name: A pinned node is a point lookup
    query:
      gql: |
        MATCH (w:WorkItem {id: 4000}) RETURN w
    logical: { expect: ["(Filter w.id IN [4000] (_))"] }
    physical:
      clickhouse:
        point_lookup: true

  - name: An open joined node is not a point lookup
    query:
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(w:WorkItem) RETURN p, w LIMIT 10
    logical: { expect: ["(EdgeScan IN_PROJECT w->p AS e0)"] }
    physical:
      clickhouse:
        point_lookup: false

  - name: Pinned nodes over single hops form a point lookup
    query:
      gql: |
        MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project {id: 1000})<-[:IN_PROJECT]-(w:WorkItem {id: 4000}) RETURN g, p, w
    logical: { expect: ["(Filter g.id IN [100] (_))", "(Filter p.id IN [1000] (_))", "(Filter w.id IN [4000] (_))"] }
    physical:
      clickhouse:
        point_lookup: true

  - name: A variable hop prevents point lookup classification
    query:
      gql: |
        MATCH (a:WorkItem {id: 4000})-[:RELATED_TO*1..3]->(b:WorkItem {id: 4001}) RETURN a, b
    logical: { expect: ["(EdgeScan RELATED_TO a->b AS e0 HOPS 1..3)"] }
    physical:
      clickhouse:
        point_lookup: false

  - name: A pinned aggregation is a point lookup
    query:
      gql: |
        MATCH (w:WorkItem {id: 4000}) RETURN count(w) AS c
    logical: { expect: ["(Aggregate COUNT(w) AS c (_))"] }
    physical:
      clickhouse:
        point_lookup: true

  - name: An ID range is not a point lookup
    query:
      gql: |
        MATCH (w:WorkItem) WHERE w.id >= 1 AND w.id <= 100000 RETURN w LIMIT 10
    logical: { expect: ["(Filter w.id >= 1, w.id <= 100000 (_))"] }
    physical:
      clickhouse:
        point_lookup: false

  - name: Neighbors are not point lookups
    query:
      gql: |
        MATCH (w:WorkItem {id: 4000})--(n) RETURN w, n LIMIT 10
    logical: { expect: ["(Filter w.id IN [4000] (_))"] }
    physical:
      clickhouse:
        point_lookup: false
