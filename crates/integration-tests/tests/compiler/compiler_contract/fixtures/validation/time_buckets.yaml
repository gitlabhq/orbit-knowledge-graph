cases:
  - name: Truncating by minute compiles on a pinned node
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"minute"}],"limit":10}'
      gql: "MATCH (u:Note {id: 1}) RETURN date_trunc('minute', u.created_at), count(u) AS n LIMIT 10"
    expect:
      input: { group_by: [{ kind: property, property: created_at, truncate: minute, name: u_created_at_minute }] }

  - name: Truncating by hour compiles on a pinned node
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"hour"}],"limit":10}'
      gql: "MATCH (u:Note {id: 1}) RETURN date_trunc('hour', u.created_at), count(u) AS n LIMIT 10"
    expect:
      input: { group_by: [{ kind: property, property: created_at, truncate: hour, name: u_created_at_hour }] }

  - name: Truncating by day compiles on a pinned node
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"day"}],"limit":10}'
      gql: "MATCH (u:Note {id: 1}) RETURN date_trunc('day', u.created_at), count(u) AS n LIMIT 10"
    expect:
      input: { group_by: [{ kind: property, property: created_at, truncate: day, name: u_created_at_day }] }

  - name: Truncating by week compiles on a pinned node
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"week"}],"limit":10}'
      gql: "MATCH (u:Note {id: 1}) RETURN date_trunc('week', u.created_at), count(u) AS n LIMIT 10"
    expect:
      input: { group_by: [{ kind: property, property: created_at, truncate: week, name: u_created_at_week }] }

  - name: Truncating by month compiles on a pinned node
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"month"}],"limit":10}'
      gql: "MATCH (u:Note {id: 1}) RETURN date_trunc('month', u.created_at), count(u) AS n LIMIT 10"
    expect:
      input: { group_by: [{ kind: property, property: created_at, truncate: month, name: u_created_at_month }] }

  - name: Truncating by quarter compiles on a pinned node
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"quarter"}],"limit":10}'
      gql: "MATCH (u:Note {id: 1}) RETURN date_trunc('quarter', u.created_at), count(u) AS n LIMIT 10"
    expect:
      input:
        group_by: [{ kind: property, property: created_at, truncate: quarter, name: u_created_at_quarter }]

  - name: Truncating by year compiles on a pinned node
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"year"}],"limit":10}'
      gql: "MATCH (u:Note {id: 1}) RETURN date_trunc('year', u.created_at), count(u) AS n LIMIT 10"
    expect:
      input: { group_by: [{ kind: property, property: created_at, truncate: year, name: u_created_at_year }] }

  - name: Minute truncation needs a selective node
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note"}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"minute"}],"limit":10}'
      gql: MATCH (u:Note) RETURN date_trunc('minute', u.created_at), count(u) AS n LIMIT 10
    expect: { error: { contains: [requires either node_ids, minute] } }

  - name: Minute truncation accepts pinned node IDs
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1,2]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"minute"}],"limit":10}'
      gql: MATCH (u:Note) WHERE u.id IN [1, 2] RETURN date_trunc('minute', u.created_at), count(u) AS n LIMIT 10

  - name: Hour truncation accepts a property filter
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","filters":{"created_at":{"gte":"2026-04-01T00:00:00Z"}}}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.created_at","truncate":"hour"}],"limit":50}'
      gql: MATCH (u:Note) WHERE u.created_at >= '2026-04-01T00:00:00Z' RETURN date_trunc('hour', u.created_at), count(u) AS n LIMIT 50

  - name: Truncation needs a date or datetime property
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"Note","node_ids":[1]}],"aggregations":[{"count":"u","as":"n"}],"group_by":[{"key":"u.confidential","truncate":"month"}],"limit":10}'
      gql: "MATCH (u:Note {id: 1}) RETURN date_trunc('month', u.confidential), count(u) AS n LIMIT 10"
    expect: { error: { contains: [requires a Date or DateTime property] } }
