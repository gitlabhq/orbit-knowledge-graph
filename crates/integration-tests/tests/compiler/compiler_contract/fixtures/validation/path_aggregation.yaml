cases:
  - name: Aggregation over shortest paths is unsupported
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"User","id_range":{"start":1,"end":10000}},{"id":"p","entity":"Project"}],"path":{"type":"shortest","from":"u","to":"p","max_depth":3,"rel_types":["*"]},"group_by":["p"],"aggregations":[{"count":"u","as":"hit"}],"limit":10}'
      gql: MATCH path = ANY SHORTEST (u:User)-[*1..3]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 RETURN p, count(u) AS hit LIMIT 10
    expect: { error: { reason: schema, message: aggregation over shortest paths is not supported } }

  - name: Aggregation over pinned shortest paths is unsupported
    query:
      json: '{"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[1],"id_range":{"start":2,"end":2}},{"id":"p","entity":"Project","node_ids":[2],"columns":["id"]}],"path":{"type":"shortest","from":"u","to":"p","max_depth":3,"rel_types":["*"]},"group_by":["p"],"aggregations":[{"count":"u","as":"hit"}],"limit":1}'
      gql: "MATCH path = ANY SHORTEST (u:User {id: 1})-[*1..3]->(p:Project {id: 2}) WHERE u.id >= 2 AND u.id <= 2 RETURN p{.id}, count(u) AS hit LIMIT 1"
    expect: { error: { reason: schema, message: aggregation over shortest paths is not supported } }
