description: Pages across NULL merged_at sort keys in DESC order cover all 6 MRs

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "mr", "entity": "MergeRequest", "id_range": {"start": 1, "end": 10000},
                 "columns": ["title"]}],
      "order_by": "-mr.merged_at",
      "cursor": {"page_size": 2}
    }
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 1 AND mr.id <= 10000 RETURN mr.title ORDER BY mr.merged_at DESC PAGE 2

expect:
  all_pages:
    node_order:
      MergeRequest: [2005, 2004, 2002, 2000, 2001, 2003]
    no_duplicate_ids: true
    matches_unpaginated: true
  pages:
    - node_count: 2
      nodes:
        MergeRequest: { order: [2005, 2004] }
      has_more: true
    - node_count: 2
      nodes:
        MergeRequest: { order: [2002, 2000] }
      has_more: true
    - node_count: 2
      nodes:
        MergeRequest: { order: [2001, 2003] }
      has_more: false
