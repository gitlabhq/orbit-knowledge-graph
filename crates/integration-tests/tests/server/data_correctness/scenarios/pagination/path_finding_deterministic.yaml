description: Path-finding cursor returns deterministic first page

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|CONTAINS*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1002, 1004] RETURN p PAGE 2

expect:
  repeat_count: 2
  node_count: 4
  has_more: true
  path_count: 2
  path_destinations:
    Project: [1000, 1002]
  path_edges:
    - - { from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 100, step: 0 }
      - { from: Group, from_id: 100, type: CONTAINS, to: Project, to_id: 1000, step: 1 }
    - - { from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 100, step: 0 }
      - { from: Group, from_id: 100, type: CONTAINS, to: Project, to_id: 1002, step: 1 }
