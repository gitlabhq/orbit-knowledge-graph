description: Traversal cursor without order_by returns deterministic first page

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
        {"id": "g", "entity": "Group"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "cursor": {"page_size": 4}
    }
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u, g PAGE 4

expect:
  repeat_count: 2
  node_count: 6
  nodes:
    User: { order: [1, 2, 3] }
    Group: { ids: [100, 101, 102] }
  edge_count: { MEMBER_OF: 4 }
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 100 }
      - { from: User, from_id: 1, to: Group, to_id: 102 }
      - { from: User, from_id: 2, to: Group, to_id: 100 }
      - { from: User, from_id: 3, to: Group, to_id: 101 }
  has_more: true
