description: Path-finding cursor pages cover all 3 shortest paths

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "User", "node_ids": [1]},
        {"id": "end", "entity": "Project", "node_ids": [1000, 1002, 1004]}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3,
               "rel_types": ["MEMBER_OF", "CONTAINS"]},
      "cursor": {"page_size": 2}
    }
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|CONTAINS*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1002, 1004] RETURN p PAGE 2

expect:
  all_pages:
    page_count: 2
    matches_unpaginated: true
  pages:
    - node_count: 4
      path_count: 2
      path_destinations:
        Project: [1000, 1002]
      path_edges:
        - - { from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 100, step: 0 }
          - { from: Group, from_id: 100, type: CONTAINS, to: Project, to_id: 1000, step: 1 }
        - - { from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 100, step: 0 }
          - { from: Group, from_id: 100, type: CONTAINS, to: Project, to_id: 1002, step: 1 }
      has_more: true
    - node_count: 3
      path_count: 1
      path_destinations:
        Project: [1004]
      path_edges:
        - - { from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 102, step: 0 }
          - { from: Group, from_id: 102, type: CONTAINS, to: Project, to_id: 1004, step: 1 }
      has_more: false
