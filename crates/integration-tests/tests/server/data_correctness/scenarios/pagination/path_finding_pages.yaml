# source: crates/integration-tests/tests/server/data_correctness/pagination.rs::cursor_path_finding_pages_cover_all_paths
description: Path-finding cursor pages cover all 3 shortest paths

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "User", "node_ids": [1]},
        {"id": "end", "entity": "Project", "node_ids": [1000, 1002, 1004]}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3,
               "rel_types": ["MEMBER_OF", "CONTAINS"]},
      "cursor": {"page_size": 2}
    }
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|CONTAINS*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1002, 1004] RETURN p PAGE 2

expect:
  all_pages:
    page_count: 2
  pages:
    - path_count: 2
      has_more: true
    - path_count: 1
      has_more: false
