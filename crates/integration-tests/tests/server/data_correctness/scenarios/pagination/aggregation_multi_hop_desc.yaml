description: Multi-hop aggregation DESC seek pages cover all 6 groups

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["id", "username"]},
        {"id": "g", "entity": "Group"},
        {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}}
      ],
      "relationships": [
        {"type": "MEMBER_OF", "from": "u", "to": "g"},
        {"type": "CONTAINS", "from": "g", "to": "p"}
      ],
      "group_by": ["u"],
      "aggregations": [{"count": "p", "as": "project_count"}],
      "aggregation_sort": "-project_count",
      "cursor": {"page_size": 2}
    }
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u{.id, .username}, count(p) AS project_count ORDER BY project_count DESC PAGE 2

expect:
  all_pages:
    group_node_ids:
      "u:User": [1, 2, 3, 4, 5, 6]
    no_duplicate_ids: true
  pages:
    - groups:
        u:
          rows:
            - entity: User
              id: 6
              values:
                project_count: 4
      skip_requirements: [cursor, aggregation, aggregation_sort]
    - skip_requirements: [cursor, aggregation, aggregation_sort]
    - skip_requirements: [cursor, aggregation, aggregation_sort]
