description: Multi-hop aggregation DESC seek pages cover all 6 groups

query:
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u{.id, .username}, count(p) AS project_count ORDER BY project_count DESC SKIP 0 LIMIT 2

expect:
  all_pages:
    group_node_ids:
      "u:User": [1, 2, 3, 4, 5, 6]
    no_duplicate_ids: true
    matches_unpaginated: true
  pages:
    - groups:
        u:
          entity: User
          count: 2
          order: [6, 1]
          rows:
            - { entity: User, id: 6, values: { project_count: 4 } }
            - { entity: User, id: 1, values: { project_count: 3 } }
      has_more: true
    - groups:
        u:
          entity: User
          count: 2
          order: [4, 2]
          rows:
            - { entity: User, id: 4, values: { project_count: 3 } }
            - { entity: User, id: 2, values: { project_count: 2 } }
      has_more: true
    - groups:
        u:
          entity: User
          count: 2
          order: [3, 5]
          rows:
            - { entity: User, id: 3, values: { project_count: 2 } }
            - { entity: User, id: 5, values: { project_count: 2 } }
      has_more: false
