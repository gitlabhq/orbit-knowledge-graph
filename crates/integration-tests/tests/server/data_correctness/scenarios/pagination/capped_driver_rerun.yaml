query:
  gql: |
    MATCH (f:File)-[:DEFINES]->(d:Definition)
    WHERE f.path ENDS WITH 'rerun_controller.rb'
    RETURN f.id, d.id LIMIT 1

expect:
  skip_requirements: ["filter:path", "relationship:DEFINES"]
  node_count: 2
  nodes:
    File:
      ids: [98020]
    Definition:
      ids: [98120]
  has_more: false
