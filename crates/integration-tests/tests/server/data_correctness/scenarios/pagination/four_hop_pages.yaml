description: Four-hop traversal pages cover all 13 edges in 3 pages

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
        {"id": "wi", "entity": "WorkItem"},
        {"id": "g", "entity": "Group"},
        {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}}
      ],
      "relationships": [
        {"type": "AUTHORED", "from": "u", "to": "wi"},
        {"type": "IN_GROUP", "from": "wi", "to": "g"},
        {"type": "CONTAINS", "from": "g", "to": "p"}
      ],
      "cursor": {"page_size": 3}
    }

expect:
  all_pages:
    edge_count: 13
    page_count: 3
  pages:
    - skip_requirements: [cursor, "relationship:AUTHORED", "relationship:IN_GROUP", "relationship:CONTAINS"]
    - skip_requirements: [cursor, "relationship:AUTHORED", "relationship:IN_GROUP", "relationship:CONTAINS"]
    - skip_requirements: [cursor, "relationship:AUTHORED", "relationship:IN_GROUP", "relationship:CONTAINS"]
