description: Cursor with active-only filter pages through 6 active users

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username", "state"],
                 "filters": {"state": "active"}}],
      "order_by": "u.id",
      "cursor": {"page_size": 2}
    }
  gql: |
    MATCH (u:User {state: 'active'}) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state ORDER BY u.id PAGE 2

expect:
  all_pages:
    node_order:
      User: [1, 2, 3, 4, 6, 7]
    no_duplicate_ids: true
    matches_unpaginated: true
  pages:
    - node_count: 2
      nodes:
        User:
          order: [1, 2]
          absent: [5]
          filters:
            state: active
      has_more: true
    - node_count: 2
      nodes:
        User:
          order: [3, 4]
          absent: [5]
          filters:
            state: active
      has_more: true
    - node_count: 2
      nodes:
        User:
          order: [6, 7]
          absent: [5]
          filters:
            state: active
      has_more: false
