description: Cross-namespace scoped traversal pages cover 3 in-scope edges

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "g", "entity": "Group"},
        {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}}
      ],
      "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
      "cursor": {"page_size": 1}
    }
  gql: |
    MATCH (g:Group)-[:CONTAINS]->(p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN g, p PAGE 1

expect:
  all_pages:
    node_ids:
      Group: [100, 200]
      Project: [1000, 1002, 1010]
    edge_count: 3
    page_count: 3
    no_duplicate_edges: true
    matches_unpaginated: true
  pages:
    - node_count: 2
      nodes:
        Group: { ids: [100], absent: [101, 102, 900] }
        Project: { ids: [1000], absent: [1001, 1003, 1004, 9000] }
      edge_exists:
        CONTAINS:
          - { from: Group, from_id: 100, to: Project, to_id: 1000 }
      edge_count: { CONTAINS: 1 }
      has_more: true
    - node_count: 2
      nodes:
        Group: { ids: [100], absent: [101, 102, 900] }
        Project: { ids: [1002], absent: [1001, 1003, 1004, 9000] }
      edge_exists:
        CONTAINS:
          - { from: Group, from_id: 100, to: Project, to_id: 1002 }
      edge_count: { CONTAINS: 1 }
      has_more: true
    - node_count: 2
      nodes:
        Group: { ids: [200], absent: [101, 102, 900] }
        Project: { ids: [1010], absent: [1001, 1003, 1004, 9000] }
      edge_exists:
        CONTAINS:
          - { from: Group, from_id: 200, to: Project, to_id: 1010 }
      edge_count: { CONTAINS: 1 }
      has_more: false
