description: SKIP above the row ceiling is rejected before execution

query:
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username SKIP 10001 LIMIT 2

expect:
  compile_error: skip must be at most 10000
  compile_error_contains: ["ORDER BY a unique key such as id and filter past the last value"]
