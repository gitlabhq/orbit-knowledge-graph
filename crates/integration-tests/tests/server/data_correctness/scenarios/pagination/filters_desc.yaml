description: Filtered DESC pagination returns exact matches per page

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
        {"id": "wi", "entity": "WorkItem", "columns": ["work_item_type", "weight"],
         "filters": {"work_item_type": {"in": ["issue", "task", "epic"]},
                     "weight": {"gte": 3}}}
      ],
      "relationships": [{"type": "AUTHORED", "from": "u", "to": "wi"}],
      "order_by": "-wi.id",
      "cursor": {"page_size": 1}
    }
  gql: |
    MATCH (u:User)-[:AUTHORED]->(wi:WorkItem) WHERE u.id >= 1 AND u.id <= 10000 AND wi.work_item_type IN ['issue', 'task', 'epic'] AND wi.weight >= 3 RETURN u, wi.work_item_type, wi.weight ORDER BY wi.id DESC PAGE 1

expect:
  all_pages:
    node_order:
      WorkItem: [4010, 4003, 4000]
    no_duplicate_ids: true
    no_duplicate_edges: true
    matches_unpaginated: true
  pages:
    - node_count: 2
      nodes:
        WorkItem:
          order: [4010]
          absent: [4001, 4002]
          filters:
            work_item_type: { in: [issue, task, epic] }
            weight: { gte: 3 }
      edge_exists:
        AUTHORED:
          - { from: User, from_id: 7, to: WorkItem, to_id: 4010 }
      has_more: true
    - node_count: 2
      nodes:
        WorkItem:
          order: [4003]
          absent: [4001, 4002]
          filters:
            work_item_type: { in: [issue, task, epic] }
            weight: { gte: 3 }
      edge_exists:
        AUTHORED:
          - { from: User, from_id: 3, to: WorkItem, to_id: 4003 }
      has_more: true
    - node_count: 2
      nodes:
        WorkItem:
          order: [4000]
          absent: [4001, 4002]
          filters:
            work_item_type: { in: [issue, task, epic] }
            weight: { gte: 3 }
      edge_exists:
        AUTHORED:
          - { from: User, from_id: 1, to: WorkItem, to_id: 4000 }
      has_more: false
