# source: crates/integration-tests/tests/server/data_correctness/pagination.rs::cursor_follows_next_cursor_to_exhaustion
description: Cursor pages cover all 7 users with no gaps or duplicates

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"]}],
      "order_by": "u.id",
      "cursor": {"page_size": 3}
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username ORDER BY u.id PAGE 3

expect:
  all_pages:
    node_ids:
      User: [1, 2, 3, 4, 5, 6, 7]
    page_count: 3
    no_duplicate_ids: true
  pages:
    - skip_requirements: [node_count, order_by]
    - skip_requirements: [node_count, order_by]
    - skip_requirements: [node_count, order_by]
