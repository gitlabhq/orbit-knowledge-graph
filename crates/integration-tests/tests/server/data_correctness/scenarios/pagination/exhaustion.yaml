description: Cursor pages cover all 7 users with no gaps or duplicates

query:
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username ORDER BY u.id PAGE 3

expect:
  all_pages:
    node_order:
      User: [1, 2, 3, 4, 5, 6, 7]
    page_count: 3
    no_duplicate_ids: true
    matches_unpaginated: true
  pages:
    - node_count: 3
      nodes:
        User: { order: [1, 2, 3] }
      has_more: true
    - node_count: 3
      nodes:
        User: { order: [4, 5, 6] }
      has_more: true
    - node_count: 1
      nodes:
        User: { order: [7] }
      has_more: false
