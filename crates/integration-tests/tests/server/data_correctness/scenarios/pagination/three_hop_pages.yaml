description: Three-hop traversal pages cover all 14 edges in 4 pages

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
        {"id": "g", "entity": "Group"},
        {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}}
      ],
      "relationships": [
        {"type": "MEMBER_OF", "from": "u", "to": "g"},
        {"type": "CONTAINS", "from": "g", "to": "p"}
      ],
      "cursor": {"page_size": 5}
    }
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u, g, p PAGE 5

expect:
  all_pages:
    node_ids:
      User: [1, 2, 3, 4, 5, 6]
      Group: [100, 101, 102]
      Project: [1000, 1001, 1002, 1003, 1004]
    edge_count: 14
    page_count: 4
    matches_unpaginated: true
  pages:
    - node_count: 7
      nodes:
        User: { ids: [1, 2] }
        Group: { ids: [100, 102] }
        Project: { ids: [1000, 1002, 1004] }
      edge_count: { MEMBER_OF: 3, CONTAINS: 3 }
      has_more: true
    - node_count: 7
      nodes:
        User: { ids: [3, 4] }
        Group: { ids: [101, 102] }
        Project: { ids: [1001, 1003, 1004] }
      edge_count: { MEMBER_OF: 3, CONTAINS: 3 }
      has_more: true
    - node_count: 8
      nodes:
        User: { ids: [5, 6] }
        Group: { ids: [100, 101] }
        Project: { ids: [1000, 1001, 1002, 1003] }
      edge_count: { MEMBER_OF: 3, CONTAINS: 4 }
      has_more: true
    - node_count: 3
      nodes:
        User: { ids: [6] }
        Group: { ids: [101] }
        Project: { ids: [1003] }
      edge_count: { MEMBER_OF: 1, CONTAINS: 1 }
      has_more: false
