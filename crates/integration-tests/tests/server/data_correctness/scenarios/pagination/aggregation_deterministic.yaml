description: Aggregation cursor without sort returns deterministic first page

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["id", "username"]},
        {"id": "mr", "entity": "MergeRequest"}
      ],
      "relationships": [{"type": "AUTHORED", "from": "u", "to": "mr"}],
      "group_by": ["u"],
      "aggregations": [{"count": "mr", "as": "mr_count"}],
      "cursor": {"page_size": 2}
    }
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest) WHERE u.id >= 1 AND u.id <= 10000 RETURN u{.id, .username}, count(mr) AS mr_count PAGE 2

expect:
  repeat_count: 2
  groups:
    u:
      entity: User
      count: 2
      order: [1, 2]
      rows:
        - { entity: User, id: 1, values: { mr_count: 2 } }
        - { entity: User, id: 2, values: { mr_count: 1 } }
  has_more: true
