description: Aggregation SKIP pages cover all 3 groups

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest) WHERE u.id >= 1 AND u.id <= 10000 RETURN u{.id, .username}, count(mr) AS mr_count SKIP 0 LIMIT 2

expect:
  all_pages:
    group_node_ids:
      "u:User": [1, 2, 3]
    no_duplicate_ids: true
    matches_unpaginated: true
  pages:
    - groups:
        u:
          entity: User
          count: 2
          order: [1, 2]
          rows:
            - { entity: User, id: 1, values: { mr_count: 2 } }
            - { entity: User, id: 2, values: { mr_count: 1 } }
      has_more: true
    - groups:
        u:
          entity: User
          count: 1
          order: [3]
          rows:
            - { entity: User, id: 3, values: { mr_count: 1 } }
      has_more: false
