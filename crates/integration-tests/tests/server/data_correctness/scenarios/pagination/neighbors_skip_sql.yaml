description: Both-direction neighbors SKIP orders the union by projected aliases, not inner edge columns

query:
  gql: |
    MATCH (mr:MergeRequest)--(n) WHERE mr.id IN [1, 2, 3] RETURN mr, n SKIP 20 LIMIT 20

expect:
  compile_only: true
  sql_contains: ["ORDER BY _orbit_mr_id ASC, _orbit_neighbor_id ASC", "LIMIT 21 OFFSET 20"]
  sql_not_contains: ["ORDER BY e.source_id"]
