# source: (no direct Rust counterpart — complementary to sql_injection_cursor)
description: Malformed cursor after token is rejected at compile time

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"]}],
      "order_by": "u.username",
      "cursor": {"page_size": 2, "after": "invalid-but-must-not-crash"}
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username ORDER BY u.username PAGE 2 AFTER 'invalid-but-must-not-crash'

expect:
  compile_error: true
