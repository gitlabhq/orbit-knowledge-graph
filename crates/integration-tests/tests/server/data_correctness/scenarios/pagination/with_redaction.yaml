description: SKIP counts redacted rows, so pages shrink instead of shifting and cover only authorized users

config:
  redaction:
    allow:
      user: [1, 3, 5]
    deny:
      user: [2, 4, 6, 7]

query:
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username ORDER BY u.id SKIP 0 LIMIT 2

expect:
  all_pages:
    node_order:
      User: [1, 3, 5]
    no_duplicate_ids: true
    matches_unpaginated: true
    page_count: 4
  pages:
    - node_count: 1
      nodes:
        User: { order: [1], absent: [2, 4, 6, 7] }
      has_more: true
    - node_count: 1
      nodes:
        User: { order: [3], absent: [2, 4, 6, 7] }
      has_more: true
    - node_count: 1
      nodes:
        User: { order: [5], absent: [2, 4, 6, 7] }
      has_more: true
    - node_count: 0
      nodes:
        User: { order: [], absent: [2, 4, 6, 7] }
      has_more: false
