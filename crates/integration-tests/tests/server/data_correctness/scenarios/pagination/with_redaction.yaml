# source: crates/integration-tests/tests/server/data_correctness/pagination.rs::cursor_with_redaction
description: Cursor with redaction pages through only authorized users

config:
  redaction:
    allow:
      user: [1, 3, 5]
    deny:
      user: [2, 4, 6, 7]

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"]}],
      "order_by": "u.id",
      "cursor": {"page_size": 2}
    }

expect:
  pages:
    - nodes:
        User:
          order: [1, 3]
      has_more: true
      skip_requirements: [cursor]
    - nodes:
        User:
          order: [5]
      has_more: false
      skip_requirements: [cursor]
