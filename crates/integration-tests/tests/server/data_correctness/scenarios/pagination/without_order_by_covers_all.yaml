# source: crates/integration-tests/tests/server/data_correctness/pagination.rs::cursor_without_order_by_pages_cover_all_data
description: Cursor without order_by covers all users via synthesized PK tie-breaker

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"]}],
      "cursor": {"page_size": 2}
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username PAGE 2

expect:
  all_pages:
    node_ids:
      User: [1, 2, 3, 4, 5, 6, 7]
    no_duplicate_ids: true
  pages:
    - skip_requirements: [node_count]
    - skip_requirements: [node_count]
    - skip_requirements: [node_count]
    - skip_requirements: [node_count]
