description: SKIP without ORDER BY covers all users via synthesized PK tie-breaker

query:
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username SKIP 0 LIMIT 2

expect:
  all_pages:
    node_order:
      User: [1, 2, 3, 4, 5, 6, 7]
    no_duplicate_ids: true
    matches_unpaginated: true
  pages:
    - node_count: 2
      nodes:
        User: { order: [1, 2] }
      has_more: true
    - node_count: 2
      nodes:
        User: { order: [3, 4] }
      has_more: true
    - node_count: 2
      nodes:
        User: { order: [5, 6] }
      has_more: true
    - node_count: 1
      nodes:
        User: { order: [7] }
      has_more: false
