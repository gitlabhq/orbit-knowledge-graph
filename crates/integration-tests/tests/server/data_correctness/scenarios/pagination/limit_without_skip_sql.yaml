description: LIMIT without SKIP adds no tie-breakers to the path sort

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|CONTAINS*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1002, 1004] RETURN p LIMIT 2

expect:
  compile_only: true
  sql_contains: ["LIMIT 3"]
  sql_not_contains: ["toString(paths._orbit_path)", "OFFSET"]
