    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"]}],
      "order_by": "u.username",
      "cursor": {"page_size": 2, "after": "invalid-but-must-not-crash"}
