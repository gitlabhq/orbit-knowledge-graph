description: Two-hop MEMBER_OF traversal pages cover all 9 edges

query:
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u, g SKIP 0 LIMIT 4

expect:
  all_pages:
    node_ids:
      User: [1, 2, 3, 4, 5, 6]
      Group: [100, 101, 102]
    edge_count: 9
    page_count: 3
    no_duplicate_edges: true
    matches_unpaginated: true
  pages:
    - node_count: 6
      nodes:
        User: { order: [1, 2, 3] }
        Group: { ids: [100, 101, 102] }
      edge_count: { MEMBER_OF: 4 }
      has_more: true
    - node_count: 6
      nodes:
        User: { order: [4, 5, 6] }
        Group: { ids: [100, 101, 102] }
      edge_count: { MEMBER_OF: 4 }
      has_more: true
    - node_count: 2
      nodes:
        User: { order: [6] }
        Group: { ids: [101] }
      edge_count: { MEMBER_OF: 1 }
      has_more: false
