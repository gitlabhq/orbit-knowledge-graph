# source: crates/integration-tests/tests/server/data_correctness/dedup.rs::neighbors_dedup_returns_unique_edges
description: Neighbors dedup returns unique edges for duplicated node

config:
  extra_seed:
    gl_user:
      - { id: 9300, username: nbr_old, name: Neighbor Old, state: active, user_type: human, _version: "2024-01-01 00:00:00", _deleted: false }
      - { id: 9300, username: nbr_new, name: Neighbor New, state: active, user_type: human, _version: "2024-06-01 00:00:00", _deleted: false }
    gl_merge_request:
      - { id: 9310, iid: 310, title: "Neighbor center MR", state: opened, traversal_path: "1/100/1000/", _version: "2024-06-01 00:00:00", _deleted: false }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 9300, source_kind: User, relationship_kind: AUTHORED, target_id: 9310, target_kind: MergeRequest, source_tags: [], target_tags: ["state:opened"], _version: "1970-01-01 00:00:00", _deleted: false }
  redaction:
    allow:
      user: [1, 2, 3, 4, 5, 6, 7, 9300]
      merge_request: [2000, 2001, 2002, 2003, 2004, 2005, 9100, 9310]

query:
