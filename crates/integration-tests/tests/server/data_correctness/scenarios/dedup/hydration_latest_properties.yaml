# source: crates/integration-tests/tests/server/data_correctness/dedup.rs::hydration_returns_latest_properties
description: Hydration returns latest properties for deduped node

config:
  extra_seed:
    gl_user:
      - { id: 9600, username: hydrate_old, name: Old Hydrated, state: active, user_type: human, _version: "2024-01-01 00:00:00", _deleted: false }
      - { id: 9600, username: hydrate_new, name: New Hydrated, state: active, user_type: human, _version: "2024-06-01 00:00:00", _deleted: false }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 9600, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: [], target_tags: [], _version: "1970-01-01 00:00:00", _deleted: false }
  redaction:
    allow:
      user: [1, 2, 3, 4, 5, 6, 7, 9600]

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User", "node_ids": [9600], "columns": ["username", "name"]},
        {"id": "g", "entity": "Group"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "limit": 10
    }

expect:
  skip_requirements: [node_count]
  nodes:
    User:
      ids: [9600]
      rows:
        - { id: 9600, username: hydrate_new, name: New Hydrated }
  edge_exists:
    MEMBER_OF:
      - [9600, 100]
