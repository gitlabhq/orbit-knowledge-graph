# source: crates/integration-tests/tests/server/data_correctness/dedup.rs::aggregation_dedup_counts_unique_entities
description: Aggregation counts each entity once after dedup

config:
  extra_seed:
    gl_merge_request:
      - { id: 9100, iid: 99, title: "Dedup MR", state: merged, traversal_path: "1/100/1000/", project_id: 1000, _version: "2024-01-01 00:00:00", _deleted: false }
      - { id: 9100, iid: 99, title: "Dedup MR Updated", state: merged, traversal_path: "1/100/1000/", project_id: 1000, _version: "2024-06-01 00:00:00", _deleted: false }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 9100, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1000, target_kind: Project, source_tags: ["state:merged"], target_tags: [], _version: "1970-01-01 00:00:00", _deleted: false }

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "filters": {"state": "merged"}},
        {"id": "p", "entity": "Project", "columns": ["name"], "node_ids": [1000]}
      ],
      "relationships": [{"type": "IN_PROJECT", "from": "mr", "to": "p"}],
      "group_by": ["p"],
      "aggregations": [{"count": "mr", "as": "mr_count"}],
      "limit": 10
    }

expect:
  skip_requirements: ["filter:state"]
  groups:
    p:
      rows:
        - { entity: Project, id: 1000, values: { mr_count: 3 }, properties: { name: "Public Project" } }
