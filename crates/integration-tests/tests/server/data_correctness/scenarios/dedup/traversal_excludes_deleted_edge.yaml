# source: crates/integration-tests/tests/server/data_correctness/dedup.rs::traversal_excludes_deleted_edge
description: Soft-deleted edge excluded from traversal

config:
  extra_seed:
    gl_merge_request:
      - { id: 9700, iid: 700, title: "Alive MR deleted edge", state: merged, traversal_path: "1/100/1000/", project_id: 0, _version: "2024-06-01 00:00:00", _deleted: false }
      - { id: 9701, iid: 701, title: "Alive MR good edge", state: merged, traversal_path: "1/100/1000/", project_id: 1000, _version: "2024-06-01 00:00:00", _deleted: false }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 9700, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1000, target_kind: Project, source_tags: ["state:merged"], target_tags: [], _version: "1970-01-01 00:00:00", _deleted: true }
      - { traversal_path: "1/100/1000/", source_id: 9701, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1000, target_kind: Project, source_tags: ["state:merged"], target_tags: [], _version: "1970-01-01 00:00:00", _deleted: false }
  redaction:
    allow:
      merge_request: [2000, 2001, 2002, 2003, 2004, 2005, 9100, 9700, 9701]

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "id_range": {"start": 1, "end": 10000}},
        {"id": "p", "entity": "Project", "node_ids": [1000]}
      ],
      "relationships": [{"type": "IN_PROJECT", "from": "mr", "to": "p"}],
      "limit": 10
    }

expect:
  skip_requirements: [node_count]
  nodes:
    Project:
      ids: [1000]
  edge_exists:
    IN_PROJECT:
      - [9701, 1000]
  edge_absent:
    IN_PROJECT:
      - [9700, 1000]
