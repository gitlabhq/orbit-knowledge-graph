description: ReplacingMergeTree dedup returns the latest version

config:
  extra_seed:
    gl_user:
      - { id: 9001, username: stale_name, name: Stale Name, state: blocked, user_type: human, _version: "2024-01-01 00:00:00", _deleted: false }
      - { id: 9001, username: fresh_name, name: Fresh Name, state: active, user_type: human, _version: "2024-06-01 00:00:00", _deleted: false }
  redaction:
    allow:
      user: [1, 2, 3, 4, 5, 6, 7, 9001]

query:
  gql: |
    MATCH (u:User {id: 9001}) RETURN u.username, u.name, u.state LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      ids: [9001]
      rows:
        - { id: 9001, username: fresh_name, name: Fresh Name, state: active }
