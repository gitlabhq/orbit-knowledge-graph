# source: crates/integration-tests/tests/server/data_correctness/dedup.rs::aggregation_multi_hop_self_join_dedups_edge_versions
description: Multi-hop aggregation deduplicates versioned edge rows

config:
  extra_seed:
    gl_merge_request:
      - { id: 9210, iid: 210, title: "Multi-hop dedup MR", state: opened, traversal_path: "1/100/1000/", project_id: 1000, _version: "2024-06-01 00:00:00", _deleted: false }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 9210, source_kind: MergeRequest, relationship_kind: HAS_LABEL, target_id: 7000, target_kind: Label, source_tags: ["state:opened"], target_tags: [], _version: "2024-01-01 00:00:00", _deleted: false }
      - { traversal_path: "1/100/1000/", source_id: 9210, source_kind: MergeRequest, relationship_kind: HAS_LABEL, target_id: 7000, target_kind: Label, source_tags: ["state:opened"], target_tags: [], _version: "2024-06-01 00:00:00", _deleted: false }
      - { traversal_path: "1/100/1000/", source_id: 9210, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1000, target_kind: Project, source_tags: ["state:opened"], target_tags: [], _version: "2024-01-01 00:00:00", _deleted: false }
      - { traversal_path: "1/100/1000/", source_id: 9210, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1000, target_kind: Project, source_tags: ["state:opened"], target_tags: [], _version: "2024-06-01 00:00:00", _deleted: false }
  redaction:
    allow:
      merge_request: [2000, 2001, 2002, 2003, 2004, 2005, 9100, 9210]

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "node_ids": [9210]},
        {"id": "label", "entity": "Label", "filters": {"title": "bug"}},
        {"id": "project", "entity": "Project", "node_ids": [1000]}
      ],
      "relationships": [
        {"type": "HAS_LABEL", "from": "mr", "to": "label"},
        {"type": "IN_PROJECT", "from": "mr", "to": "project"}
      ],
      "aggregations": [{"count": "mr", "as": "n"}],
      "limit": 1
    }
  gql: |
    MATCH (label:Label)<-[:HAS_LABEL]-(mr:MergeRequest {id: 9210})-[:IN_PROJECT]->(project:Project {id: 1000}) WHERE label.title = 'bug' RETURN count(mr) AS n LIMIT 1

expect:
  skip_requirements: [node_count, node_ids, "filter:title"]
  row_values:
    - { n: 1 }
