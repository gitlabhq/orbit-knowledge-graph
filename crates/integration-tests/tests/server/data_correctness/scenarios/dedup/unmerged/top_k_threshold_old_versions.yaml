description: Old versions that fill the raw top-k of created_at still return a complete, exact page

config:
  unmerged_seed: true
  redaction:
    allow:
      ci_build: [9950, 9951, 9952, 9953, 9954, 9955, 9956]
      project: [1000]
  extra_seed:
    gl_job:
      - { id: 9950, name: newest v1, status: pending, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-05 00:00:00", _version: "2030-01-05 00:00:00" }
      - { id: 9950, name: newest v2, status: running, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-05 00:00:00", _version: "2030-01-06 00:00:00" }
      - { id: 9950, name: newest v3, status: success, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-05 00:00:00", _version: "2030-01-07 00:00:00" }
      - { id: 9951, name: second v1, status: pending, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-04 00:00:00", _version: "2030-01-04 00:00:00" }
      - { id: 9951, name: second v2, status: running, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-04 00:00:00", _version: "2030-01-05 00:00:00" }
      - { id: 9952, name: third, status: success, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-03 00:00:00", _version: "2030-01-03 00:00:00" }
      - { id: 9953, name: oldest v1, status: pending, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-01 00:00:00", _version: "2030-01-01 00:00:00" }
      - { id: 9953, name: oldest v2, status: running, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-01 00:00:00", _version: "2030-01-02 00:00:00" }
      - { id: 9953, name: oldest v3, status: failed, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-01 00:00:00", _version: "2030-01-03 00:00:00" }
      - { id: 9954, name: second oldest, status: success, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-02 00:00:00", _version: "2030-01-02 00:00:00" }
      - { id: 9955, name: no creation time, status: success, project_id: 1000, traversal_path: "1/100/1000/", _version: "2030-01-02 00:00:00" }
      - { id: 9956, name: deleted v1, status: pending, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-06 00:00:00", _version: "2030-01-06 00:00:00" }
      - { id: 9956, name: deleted v2, status: pending, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2030-01-06 00:00:00", _version: "2030-01-07 00:00:00", _deleted: true }

cases:
  - name: desc_page_reruns_when_old_versions_fill_the_threshold
    description: The live version of deleted job 9956 and 2 versions of job 9950 are the raw top 3, so the pruned page holds 1 job and the exact rerun returns the newest 2 live jobs
    query:
      gql: |
        MATCH (j:Job) WHERE j.id >= 9950 AND j.id <= 9960 RETURN j.name, j.created_at ORDER BY j.created_at DESC LIMIT 2
    expect:
      node_count: 2
      has_more: true
      nodes:
        Job:
          order: [9950, 9951]
          absent: [9956]
          rows:
            - { id: 9950, name: newest v3, created_at: "2030-01-05T00:00:00Z" }
            - { id: 9951, name: second v2 }

  - name: asc_page_reruns_when_old_versions_fill_the_threshold
    description: The 3 versions of job 9953 are the raw bottom 3, and the null creation time of job 9955 sorts last
    query:
      gql: |
        MATCH (j:Job) WHERE j.id >= 9950 AND j.id <= 9960 RETURN j.name ORDER BY j.created_at ASC LIMIT 2
    expect:
      node_count: 2
      has_more: true
      nodes:
        Job:
          order: [9953, 9954]
          rows:
            - { id: 9953, name: oldest v3 }

  - name: driving_read_reruns_through_the_project_join
    description: Jobs ordered by created_at and joined to their project return the newest 2 jobs
    query:
      gql: |
        MATCH (j:Job)-[:IN_PROJECT]->(p:Project {id: 1000}) WHERE j.id >= 9950 AND j.id <= 9960 RETURN j.name ORDER BY j.created_at DESC LIMIT 2
    expect:
      nodes:
        Job:
          order: [9950, 9951]
      edges:
        IN_PROJECT: [[9950, 1000], [9951, 1000]]
