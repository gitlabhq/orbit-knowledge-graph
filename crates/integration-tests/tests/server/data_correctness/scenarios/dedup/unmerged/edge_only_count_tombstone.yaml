description: Edge-only aggregation excludes a newer tombstone before merges
config:
  unmerged_seed: true
  extra_seed:
    gl_edge:
      - {source_id: 99001, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, traversal_path: "1/100/", _version: "2024-01-01 00:00:00", _deleted: false}
      - {source_id: 99001, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, traversal_path: "1/100/", _version: "2024-06-01 00:00:00", _deleted: true}
query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"u","entity":"User","node_ids":[99001]},{"id":"g","entity":"Group"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}],"aggregations":[{"count":"g","as":"c"}]}
  gql: |
    MATCH (u:User {id: 99001})-[:MEMBER_OF]->(g:Group) RETURN count(g) AS c
expect:
  row_count: 1
  row_values: [{c: 0}]
  skip_requirements: [node_ids]
