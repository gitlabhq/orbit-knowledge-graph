description: A candidate read found through an old version drops the merge request when its latest version no longer matches

config:
  unmerged_seed: true
  redaction:
    allow:
      merge_request: [9810]
      project: [1000]
  extra_seed:
    gl_merge_request:
      - { id: 9810, iid: 810, title: a, state: opened, source_branch: feature-zz, target_branch: main, project_id: 1000, traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00" }
      - { id: 9810, iid: 810, title: b, state: opened, source_branch: other-branch, target_branch: main, project_id: 1000, traversal_path: "1/100/1000/", _version: "2024-06-01 00:00:00" }

query:
  gql: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: 1000}) WHERE mr.source_branch = 'feature-zz' RETURN mr.title, mr.source_branch, p LIMIT 10

expect:
  sql_contains: ["tuple(mr.traversal_path, mr.id) IN (SELECT traversal_path, id FROM _orbit_relation_"]
  skip_requirements: ["node_ids", "filter:source_branch", "relationship:IN_PROJECT"]
  node_count: 0
