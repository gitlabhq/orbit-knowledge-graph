description: A tombstone stamped with its deletion time does not resurrect a job outside the filter window

config:
  unmerged_seed: true
  redaction:
    allow:
      ci_build: [9900, 9901]
  extra_seed:
    gl_job:
      - { id: 9900, name: build, status: success, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00", _deleted: false }
      - { id: 9900, name: build, status: success, project_id: 1000, created_at: "2024-06-01 00:00:00", traversal_path: "1/100/1000/", _version: "2024-06-01 00:00:00", _deleted: true }
      - { id: 9901, name: build, status: success, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/" }

query:
  gql: |
    MATCH (j:Job) WHERE j.id >= 9900 AND j.id <= 9901 AND j.created_at <= '2024-03-01' RETURN j.id

expect:
  skip_requirements: ["filter:created_at"]
  sql_contains: ["OR j._deleted"]
  node_count: 1
  nodes:
    Job: { ids: [9901] }
