description: A tombstone carries only its key columns, so a filter on an unchanging column must not drop it and resurrect the live version

config:
  unmerged_seed: true
  redaction:
    allow:
      ci_build: [9950, 9951, 9952]
  extra_seed:
    gl_job:
      - { id: 9950, name: build, status: success, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00" }
      - { id: 9950, traversal_path: "1/100/1000/", _version: "2024-06-01 00:00:00", _deleted: true }
      - { id: 9951, name: build, status: success, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00" }
      - { id: 9952, name: build, status: running, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00" }
      - { id: 9952, name: build, status: success, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-06-01 00:00:00" }

cases:
  - name: name_filter
    description: An equality on the job name leaves out a job whose latest version is a tombstone
    query:
      gql: |
        MATCH (j:Job) WHERE j.id IN [9950, 9951] AND j.name = 'build' RETURN j.id
    expect:
      skip_requirements: ["filter:name"]
      node_count: 1
      nodes:
        Job: { ids: [9951] }

  - name: created_at_window
    description: A creation window leaves out a job whose latest version is a tombstone
    query:
      gql: |
        MATCH (j:Job) WHERE j.id IN [9950, 9951] AND j.created_at >= '2024-01-01' AND j.created_at <= '2024-03-01' RETURN j.id
    expect:
      skip_requirements: ["filter:created_at"]
      node_count: 1
      nodes:
        Job: { ids: [9951] }

  - name: name_count
    description: A count over the job name leaves out a job whose latest version is a tombstone
    query:
      gql: |
        MATCH (j:Job) WHERE j.id IN [9950, 9951] AND j.name = 'build' RETURN count(j) AS n
    expect:
      skip_requirements: ["node_ids", "filter:name"]
      row_count: 1
      row_values: [{ n: 1 }]

  - name: later_live_version
    description: A job with an older matching version and a later live version returns once with the latest values
    query:
      gql: |
        MATCH (j:Job) WHERE j.id IN [9952] AND j.name = 'build' RETURN j.id, j.status
    expect:
      skip_requirements: ["filter:name"]
      node_count: 1
      nodes:
        Job:
          ids: [9952]
          rows:
            - { id: 9952, status: success }
