description: A node filter answered from edge tags uses the latest edge version

config:
  unmerged_seed: true
  redaction:
    allow:
      user: [1, 2, 6, 9020]
      group: [100]
  extra_seed:
    gl_user:
      - { id: 9020, username: tag_flip, name: Tag Flip, state: blocked, user_type: human, _version: "2024-01-01 00:00:00" }
      - { id: 9020, username: tag_flip, name: Tag Flip, state: active, user_type: human, _version: "2024-06-01 00:00:00" }
    gl_edge:
      - { traversal_path: "1/100/", source_id: 9020, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: ["state:blocked"], target_tags: [], _version: "2024-01-01 00:00:00" }
      - { traversal_path: "1/100/", source_id: 9020, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: ["state:active"], target_tags: [], _version: "2024-06-01 00:00:00" }

cases:
  - name: stale_tag_excluded
    description: A user whose old membership edge carried the blocked tag does not match a blocked filter
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group {id: 100}) WHERE u.state = 'blocked' RETURN u, g LIMIT 10
    expect:
      skip_requirements: ["node_ids", "filter:state", "relationship:MEMBER_OF"]
      node_count: 0

  - name: latest_tag_included
    description: The same user matches the filter on its latest tag value
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group {id: 100}) WHERE u.state = 'active' RETURN u.state, g LIMIT 10
    expect:
      skip_requirements: [node_count]
      nodes:
        User:
          ids: [1, 2, 6, 9020]
          filters:
            state: active
        Group:
          ids: [100]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 9020, to: Group, to_id: 100 }
