description: A narrowed FK target applies mutable filters after selecting its latest version
config:
  unmerged_seed: true
  extra_seed:
    gl_group:
      - { id: 970, name: root, full_path: root, traversal_path: "1/970/" }
    gl_project:
      - { id: 9700, name: project, full_path: "root/project", star_count: 1, traversal_path: "1/970/9700/", _version: "2024-01-01 00:00:00" }
      - { id: 9700, name: project, full_path: "root/project", star_count: 2, traversal_path: "1/970/9700/", _version: "2024-06-01 00:00:00" }
    gl_merge_request:
      - { id: 9710, title: a, project_id: 9700, traversal_path: "1/970/9700/" }
query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"g","entity":"Group","node_ids":[970]},{"id":"p","entity":"Project","filters":{"star_count":1}},{"id":"mr","entity":"MergeRequest"}],
     "relationships":[{"type":"CONTAINS","from":"g","to":"p"},{"type":"IN_PROJECT","from":"mr","to":"p"}],"group_by":["p.name"],"aggregations":[{"count":"mr","as":"c"}],"limit":10}
  gql: |
    MATCH (g:Group {id: 970})-[:CONTAINS]->(p:Project {star_count: 1})<-[:IN_PROJECT]-(mr:MergeRequest)
    RETURN p.name, count(mr) AS c LIMIT 10
expect:
  sql_contains: ['WITH ', ' IN (SELECT ']
  sql_matches: ['LIMIT 1 BY q\."[^"]+", q\."[^"]+"\) AS q WHERE']
  sql_not_contains: ["gl_edge"]
  skip_requirements: ["node_ids", "filter:star_count"]
  row_count: 0
