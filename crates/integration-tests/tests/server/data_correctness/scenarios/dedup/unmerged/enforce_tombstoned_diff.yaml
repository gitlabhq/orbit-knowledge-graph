description: A diff reached through its merge request disappears once its latest version is a tombstone, even while the edge is still live

config:
  unmerged_seed: true
  extra_seed:
    gl_merge_request_diff:
      - { id: 9730, merge_request_id: 2000, state: collected, head_commit_sha: sha9730, traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00" }
      - { id: 9730, traversal_path: "1/100/1000/", _version: "2024-06-01 00:00:00", _deleted: true }
      - { id: 9731, merge_request_id: 2000, state: collected, head_commit_sha: sha9731, traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00" }
    gl_diff_edge:
      - { traversal_path: "1/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: HAS_DIFF, target_id: 9730, target_kind: MergeRequestDiff, source_tags: ["state:opened"], target_tags: [] }
      - { traversal_path: "1/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: HAS_DIFF, target_id: 9731, target_kind: MergeRequestDiff, source_tags: ["state:opened"], target_tags: [] }

query:
  gql: |
    MATCH (mr:MergeRequest {id: 2000})-[:HAS_DIFF]->(d:MergeRequestDiff) RETURN mr, d LIMIT 10

expect:
  node_count: 4
  nodes:
    MergeRequest:
      ids: [2000]
    MergeRequestDiff:
      ids: [5000, 5001, 9731]
  edges:
    HAS_DIFF: [[2000, 5000], [2000, 5001], [2000, 9731]]
