description: A tombstone carries the unchanging columns of the row it deletes, so a filter on one of them runs inside the latest-row pick without resurrecting the live version

config:
  unmerged_seed: true
  redaction:
    allow:
      merge_request: [9800, 9801]
      ci_build: [9900, 9901]
  extra_seed:
    gl_merge_request:
      - { id: 9800, title: a, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00", _deleted: false }
      - { id: 9800, title: "", project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-06-01 00:00:00", _deleted: true }
      - { id: 9801, title: b, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/" }
    gl_job:
      - { id: 9900, name: build, status: success, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-01-01 00:00:00", _deleted: false }
      - { id: 9900, name: build, status: "", project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/", _version: "2024-06-01 00:00:00", _deleted: true }
      - { id: 9901, name: build, status: success, project_id: 1000, created_at: "2024-01-15 00:00:00", traversal_path: "1/100/1000/" }

cases:
  - name: merge_request_defaults
    description: An immutable filter inside the latest-row pick does not resurrect a row whose tombstone carries the column
    query:
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.id >= 9800 AND mr.id <= 9801 AND mr.created_at >= '2023-01-01' RETURN mr.id

    expect:
      skip_requirements: ["filter:created_at"]
      node_count: 1
      nodes:
        MergeRequest: { ids: [9801] }

  - name: merge_request_count
    description: A count over an immutable filter excludes a row whose tombstone carries the column
    query:
      gql: |
        MATCH (mr:MergeRequest) WHERE mr.id >= 9800 AND mr.id <= 9801 AND mr.created_at >= '2023-01-01' RETURN count(mr) AS n

    expect:
      skip_requirements: ["filter:created_at"]
      row_count: 1
      row_values: [{ n: 1 }]

  - name: job_deletion_time
    description: A job tombstone carries the job's created_at and stays excluded from the filter window
    query:
      gql: |
        MATCH (j:Job) WHERE j.id >= 9900 AND j.id <= 9901 AND j.created_at <= '2024-03-01' RETURN j.id

    expect:
      skip_requirements: ["filter:created_at"]
      node_count: 1
      nodes:
        Job: { ids: [9901] }
