# source: crates/integration-tests/tests/server/data_correctness/dedup.rs::aggregation_filter_excludes_stale_mutable_match
description: Aggregation filter excludes stale mutable match after dedup

config:
  extra_seed:
    gl_merge_request:
      - { id: 9200, iid: 200, title: "Flipped MR", state: merged, traversal_path: "1/100/1002/", project_id: 1002, _version: "2024-01-01 00:00:00", _deleted: false }
      - { id: 9200, iid: 200, title: "Flipped MR", state: opened, traversal_path: "1/100/1002/", project_id: 1002, _version: "2024-06-01 00:00:00", _deleted: false }
      - { id: 9201, iid: 201, title: "Stable MR", state: merged, traversal_path: "1/100/1002/", project_id: 1002, _version: "2024-06-01 00:00:00", _deleted: false }
    gl_edge:
      - { traversal_path: "1/100/1002/", source_id: 9200, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1002, target_kind: Project, source_tags: ["state:opened"], target_tags: [], _version: "1970-01-01 00:00:00", _deleted: false }
      - { traversal_path: "1/100/1002/", source_id: 9201, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1002, target_kind: Project, source_tags: ["state:merged"], target_tags: [], _version: "1970-01-01 00:00:00", _deleted: false }
  redaction:
    allow:
      merge_request: [2000, 2001, 2002, 2003, 2004, 2005, 9100, 9200, 9201]

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "filters": {"state": "merged"}},
        {"id": "p", "entity": "Project", "columns": ["name"], "node_ids": [1002]}
      ],
      "relationships": [{"type": "IN_PROJECT", "from": "mr", "to": "p"}],
      "group_by": ["p"],
      "aggregations": [{"count": "mr", "as": "mr_count"}],
      "limit": 10
    }

expect:
  skip_requirements: ["filter:state"]
  groups:
    p:
      rows:
        - { entity: Project, id: 1002, values: { mr_count: 1 }, properties: { name: "Internal Project" } }
