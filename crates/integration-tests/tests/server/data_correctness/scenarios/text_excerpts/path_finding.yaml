description: Path hydration preserves the complete path while returning text excerpts

config:
  extra_seed: text_excerpts
  redaction: text_excerpts

query:
  json: |
    {
      "query_type": "path_finding",
      "options": {"dynamic_columns": "*"},
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "node_ids": [40000], "columns": "*"},
        {"id": "note", "entity": "Note", "node_ids": [30005], "columns": "*"}
      ],
      "path": {"type": "shortest", "from": "mr", "to": "note", "max_depth": 1, "rel_types": ["HAS_NOTE"]}
    }

expect:
  nodes:
    MergeRequest:
      ids: [40000]
    Note:
      ids: [30005]
      rows:
        - { id: 30005, note: { text: "🙂", repeat: 2048, suffix: " [truncated]" }, internal: false, discussion_id: null }
  edges:
    HAS_NOTE: [[40000, 30005]]
  path_count: 1
