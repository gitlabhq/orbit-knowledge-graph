description: Wildcard column selections return text excerpts

config:
  extra_seed: text_excerpts
  redaction: text_excerpts

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "mr", "entity": "MergeRequest", "node_ids": [40000], "columns": "*"}]
    }

expect:
  nodes:
    MergeRequest:
      ids: [40000]
      rows:
        - { id: 40000, title: { text: m, repeat: 2048, suffix: " [truncated]" }, state: opened }
