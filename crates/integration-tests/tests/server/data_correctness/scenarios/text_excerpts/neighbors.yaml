description: Neighbor hydration returns excerpts without changing edges or nullable properties

config:
  extra_seed: text_excerpts
  redaction: text_excerpts

query:
  json: |
    {
      "query_type": "neighbors",
      "options": {"dynamic_columns": "*"},
      "nodes": [{"id": "note", "entity": "Note", "node_ids": [30005], "columns": "*"}],
      "neighbors": {"direction": "incoming", "rel_types": ["HAS_NOTE"]}
    }

expect:
  nodes:
    MergeRequest:
      ids: [40000]
    Note:
      ids: [30005]
      rows:
        - { id: 30005, note: { text: "🙂", repeat: 2048, suffix: " [truncated]" }, internal: false, discussion_id: null }
  edges:
    HAS_NOTE: [[40000, 30005]]
