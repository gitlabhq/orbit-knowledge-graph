description: Filters match text beyond the returned excerpt boundary

config:
  extra_seed: text_excerpts
  redaction: text_excerpts

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "note", "entity": "Note", "node_ids": [30006, 30007],
                 "columns": ["note"], "filters": {"note": {"ends_with": "xxz"}}}]
    }

expect:
  nodes:
    Note:
      ids: [30006]
      filters:
        note: { text: x, repeat: 2048, suffix: " [truncated]" }
