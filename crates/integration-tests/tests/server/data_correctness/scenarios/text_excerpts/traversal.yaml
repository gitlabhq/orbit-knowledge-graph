description: Joined traversal returns excerpts without changing edges or nullable properties

config:
  extra_seed: text_excerpts
  redaction: text_excerpts

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "node_ids": [40000]},
        {"id": "note", "entity": "Note", "node_ids": [30005], "columns": ["note", "internal", "discussion_id"]}
      ],
      "relationships": [{"type": "HAS_NOTE", "from": "mr", "to": "note"}]
    }

expect:
  nodes:
    MergeRequest:
      ids: [40000]
    Note:
      ids: [30005]
      rows:
        - { id: 30005, note: { text: "🙂", repeat: 2048, suffix: " [truncated]" }, internal: false, discussion_id: null }
  edges:
    HAS_NOTE: [[40000, 30005]]
