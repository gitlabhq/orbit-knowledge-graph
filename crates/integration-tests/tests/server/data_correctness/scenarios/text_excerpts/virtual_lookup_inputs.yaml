description: Virtual lookup inputs remain complete while ordinary text is shortened

config:
  extra_seed: text_excerpts
  redaction: text_excerpts

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "file", "entity": "File", "node_ids": [50000], "columns": ["branch", "path", "name"]}]
    }

expect:
  nodes:
    File:
      ids: [50000]
      rows:
        - id: 50000
          branch: { text: b, repeat: 3000 }
          path: { text: p, repeat: 3000 }
          name: { text: n, repeat: 2048, suffix: " [truncated]" }
