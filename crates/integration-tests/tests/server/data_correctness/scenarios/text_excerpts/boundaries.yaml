description: Text excerpts preserve exact boundaries, Unicode, escaping, nulls, and property types

config:
  extra_seed: text_excerpts
  redaction: text_excerpts

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "note", "entity": "Note",
                 "node_ids": [30000, 30001, 30002, 30003, 30004, 30005, 30006, 30007, 30008],
                 "columns": ["note", "discussion_id", "noteable_type", "author_id", "created_at", "internal"]}]
    }

expect:
  nodes:
    Note:
      ids: [30000, 30001, 30002, 30003, 30004, 30005, 30006, 30007, 30008]
      filters:
        noteable_type: MergeRequest
        author_id: 1
        created_at: "2026-01-01T00:00:00Z"
        internal: false
      rows:
        - { id: 30000, note: "", discussion_id: null }
        - id: 30001
          note: &short_ascii { text: a, repeat: 2047 }
          discussion_id: *short_ascii
        - id: 30002
          note: &boundary_ascii { text: a, repeat: 2048 }
          discussion_id: *boundary_ascii
        - id: 30003
          note: &ascii_excerpt { text: a, repeat: 2048, suffix: " [truncated]" }
          discussion_id: *ascii_excerpt
        - id: 30004
          note: &boundary_unicode { text: "🙂", repeat: 2048 }
          discussion_id: *boundary_unicode
        - id: 30005
          note: { text: "🙂", repeat: 2048, suffix: " [truncated]" }
          discussion_id: null
        - id: 30006
          note: &shared_prefix { text: x, repeat: 2048, suffix: " [truncated]" }
          discussion_id: *shared_prefix
        - { id: 30007, note: *shared_prefix, discussion_id: *shared_prefix }
        - id: 30008
          note: &escaped_excerpt { text: "\"\n🙂", repeat: 682, suffix: "\"\n [truncated]" }
          discussion_id: *escaped_excerpt
