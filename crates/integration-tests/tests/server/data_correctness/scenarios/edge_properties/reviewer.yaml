config:
  ontology_overlay: edge_properties
  extra_seed:
    gl_prop_edge:
      - { traversal_path: "1/100/1000/", source_id: 1, source_kind: User, relationship_kind: REVIEWED_BY, target_id: 2000, target_kind: MergeRequest, state: reviewed, created_at: "2024-01-02 00:00:00", project_id: 1000, review_note: "looks good", approved_at: "2024-01-05 00:00:00" }
      - { traversal_path: "1/100/1000/", source_id: 2, source_kind: User, relationship_kind: REVIEWED_BY, target_id: 2000, target_kind: MergeRequest, state: unreviewed, created_at: "2024-01-03 00:00:00" }
      - { traversal_path: "1/100/1000/", source_id: 3, source_kind: User, relationship_kind: REVIEWED_BY, target_id: 2000, target_kind: MergeRequest, state: reviewed, created_at: "2024-01-01 00:00:00" }
      - { traversal_path: "1/100/1000/", source_id: 1, source_kind: User, relationship_kind: REVIEWED_BY, target_id: 2001, target_kind: MergeRequest, state: requested_changes, created_at: "2024-01-04 00:00:00" }
      - { traversal_path: "1/100/1000/", source_id: 1, source_kind: User, relationship_kind: REVIEWED_BY, target_id: 2900, target_kind: MergeRequest, state: reviewed, created_at: "2024-02-01 00:00:00" }
      - { traversal_path: "1/100/1000/", source_id: 2, source_kind: User, relationship_kind: REVIEWED_BY, target_id: 2900, target_kind: MergeRequest, state: reviewed, created_at: "2024-02-02 00:00:00" }
    gl_merge_request:
      - { id: 2900, iid: 90, title: "Old request", state: opened, source_branch: old, target_branch: main, project_id: 1000, author_id: 1, traversal_path: "1/100/1000/", created_at: "1999-06-01 00:00:00" }

cases:
  - name: return_relationship_properties
    description: A RETURN of relationship properties gives the state and the request time of each review
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) RETURN u.username, r.state, r.created_at ORDER BY u.username LIMIT 10
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1, 2, 3]
          order: [1, 2, 3]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000], [2, 2000], [3, 2000]]
      gql_columns:
        r.state: ['"reviewed"', '"unreviewed"', '"reviewed"']

  - name: filter_on_relationship_property
    description: A WHERE on a relationship enum keeps the reviews in that state
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User"},{"id":"mr","entity":"MergeRequest","node_ids":[2000]}],"relationships":[{"type":"REVIEWED_BY","from":"u","to":"mr","filters":{"state":"reviewed"}}],"limit":10}
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) WHERE r.state = 'reviewed' RETURN u, mr LIMIT 10
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1, 3]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000], [3, 2000]]

  - name: filter_on_relationship_time
    description: A WHERE on a relationship time keeps the reviews requested after the date
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) WHERE r.created_at > datetime('2024-01-01T12:00:00Z') RETURN u, mr LIMIT 10
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1, 2]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000], [2, 2000]]

  - name: order_by_relationship_property
    description: An ORDER BY on a relationship time sorts the reviews by request time
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) RETURN u.username, r.state ORDER BY r.created_at DESC LIMIT 10
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1, 2, 3]
          order: [2, 1, 3]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000], [2, 2000], [3, 2000]]
      gql_columns:
        r.state: ['"unreviewed"', '"reviewed"', '"reviewed"']

  - name: return_and_sort_the_same_property
    description: A property that the query returns and sorts by is projected once
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) RETURN u.username, r.state ORDER BY r.state LIMIT 10
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1, 2, 3]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000], [2, 2000], [3, 2000]]
      gql_columns:
        r.state: ['"reviewed"', '"reviewed"', '"unreviewed"']

  - name: node_filter_with_a_property_name_stays_on_the_node
    description: A node filter on a name that an edge also declares filters the node, not the edge; the seeded merge request is from 1999 and its review rows are from 2024
    config:
      redaction: { allow: { user: [1, 2], merge_request: [2900] } }
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2900}) WHERE mr.created_at < datetime('2000-01-01T00:00:00Z') RETURN u, mr LIMIT 10
    expect:
      skip_requirements: ["filter:created_at"]
      node_count: 3
      nodes:
        User:
          ids: [1, 2]
        MergeRequest:
          ids: [2900]
      edges:
        REVIEWED_BY: [[1, 2900], [2, 2900]]

  - name: unknown_enum_value_is_rejected
    description: A relationship enum filter rejects a value outside the declared set and names the valid ones
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) WHERE r.state = 'guess' RETURN u, mr LIMIT 10
    expect:
      compile_error_contains: ['"guess" cannot match this pattern', reviewed, unreviewed]

  - name: undeclared_relationship_type_is_rejected
    description: A property read through a relationship type that does not declare it names the types that do
    query:
      gql: |
        MATCH (u:User)-[r:APPROVED]->(mr:MergeRequest {id: 2000}) RETURN u.username, r.state LIMIT 10
    expect:
      compile_error_contains: ['reads property "state"', REVIEWED_BY]

  - name: untyped_relationship_is_rejected
    description: A property read needs a relationship type in the pattern
    query:
      gql: |
        MATCH (u:User)-[r]->(mr:MergeRequest {id: 2000}) WHERE r.state = 'reviewed' RETURN u, mr LIMIT 10
    expect:
      compile_error_contains: ['reads property "state"', "name one of those relationship types"]

  - name: group_by_relationship_property
    description: An aggregation groups the reviews of a merge request by the review state
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) RETURN r.state, count(u) AS n ORDER BY n DESC
    expect:
      skip_requirements: [node_ids, aggregation_sort]
      row_count: 2
      row_values: [{ r_state: reviewed, n: 2 }, { r_state: unreviewed, n: 1 }]

  - name: aggregate_relationship_property
    description: An aggregation measures a relationship time per merge request
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest) WHERE mr.id IN [2000, 2001] RETURN mr.id, max(r.created_at) AS last_request, count(r) AS reviews ORDER BY reviews DESC
    expect:
      skip_requirements: [node_ids, "filter:id", aggregation_sort]
      row_count: 2
      row_values: [{ reviews: 3 }, { reviews: 1 }]

  - name: aggregate_rejects_an_undeclared_relationship_property
    description: An aggregation over a property that the relationship type does not declare is rejected
    query:
      gql: |
        MATCH (u:User)-[r:APPROVED]->(mr:MergeRequest {id: 2000}) RETURN r.state, count(u) AS n
    expect:
      compile_error_contains: ['reads property "state"', REVIEWED_BY]

  - name: aggregate_rejects_an_enum_measure
    description: A min or max over an enum relationship property is rejected and points to grouping
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) RETURN max(r.state) AS s
    expect:
      compile_error_contains: [does not apply to enum, group by it instead]

  - name: json_filter_with_direction_both
    description: A JSON relationship filter on a property works when the relationship has no direction
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User"},{"id":"mr","entity":"MergeRequest","node_ids":[2000]}],"relationships":[{"type":"REVIEWED_BY","from":"u","to":"mr","direction":"both","filters":{"state":"reviewed"}}],"limit":10}
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1, 3]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000], [3, 2000]]

  - name: json_filter_over_a_hop_range
    description: A JSON relationship filter on a property applies to every hop of a variable-length relationship
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"u","entity":"User"},{"id":"mr","entity":"MergeRequest","node_ids":[2000]}],"relationships":[{"type":"REVIEWED_BY","from":"u","to":"mr","hops":[1,2],"filters":{"state":"reviewed"}}],"limit":10}
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1, 3]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000], [3, 2000]]

  - name: nullable_property_renders_null
    description: A nullable relationship property without a value renders NULL
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) RETURN u.username, r.review_note ORDER BY u.username LIMIT 10
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1, 2, 3]
          order: [1, 2, 3]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000], [2, 2000], [3, 2000]]
      gql_columns:
        r.review_note: ['"looks good"', "NULL", "NULL"]

  - name: base_column_filter_on_another_table_still_works
    description: A relationship filter on a base column of one edge table works although another edge declares a property with that name
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[12000]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b","filters":{"project_id":1000}}],"limit":10}
    expect:
      node_count: 2
      nodes:
        Definition:
          ids: [12000, 12001]
      edges:
        CALLS: [[12000, 12001]]

  - name: node_filter_on_a_shared_base_column_stays_covered
    description: A node filter on a column the edge table also stores still runs on the edge row although another edge declares a property with that name
    query:
      gql: |
        MATCH (a:Definition {id: 12000})-[:CALLS]->(b:Definition) WHERE b.project_id = 1000 RETURN a, b LIMIT 10
    expect:
      skip_requirements: ["filter:project_id"]
      sql_contains: ["_orbit_edge_0.project_id"]
      node_count: 2
      nodes:
        Definition:
          ids: [12000, 12001]
      edges:
        CALLS: [[12000, 12001]]

  - name: nullable_time_is_null_filter
    description: IS NULL on a nullable relationship time matches the rows that store the epoch and renders them as NULL
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) WHERE r.approved_at IS NULL RETURN u.username, r.approved_at ORDER BY u.username LIMIT 10
    expect:
      node_count: 3
      nodes:
        User:
          ids: [2, 3]
          order: [2, 3]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[2, 2000], [3, 2000]]
      gql_columns:
        r.approved_at: ["NULL", "NULL"]

  - name: nullable_time_is_not_null_filter
    description: IS NOT NULL on a nullable relationship time keeps only the rows with a value
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest {id: 2000}) WHERE r.approved_at IS NOT NULL RETURN u.username LIMIT 10
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1]
        MergeRequest:
          ids: [2000]
      edges:
        REVIEWED_BY: [[1, 2000]]

  - name: group_on_a_relationship_property_alone_is_not_selective
    description: A group key on a relationship property does not count as node selectivity
    query:
      gql: |
        MATCH (u:User)-[r:REVIEWED_BY]->(mr:MergeRequest) RETURN r.state, count(u) AS n
    expect:
      compile_error_contains: [add filters or node_ids to at least one node]
