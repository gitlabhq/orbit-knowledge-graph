description: File and Definition rows authorize through their owning Project, which is not itself a node in the query

config:
  extra_seed:
    gl_file:
      - { id: 3000, traversal_path: "1/100/1000/", project_id: 1000, branch: main, path: src/lib.rs, name: lib.rs, extension: rs, language: Rust }
      - { id: 3001, traversal_path: "1/100/1000/", project_id: 1000, branch: main, path: src/main.rs, name: main.rs, extension: rs, language: Rust }
      - { id: 3002, traversal_path: "1/101/1001/", project_id: 1001, branch: main, path: src/secret.rs, name: secret.rs, extension: rs, language: Rust }
    gl_definition:
      - { id: 5000, traversal_path: "1/100/1000/", project_id: 1000, branch: main, file_path: src/lib.rs, fqn: "crate::MyStruct", name: MyStruct, definition_type: class, start_line: 10, end_line: 50, start_byte: 100, end_byte: 500, start_char: 0, end_char: 0 }
      - { id: 5001, traversal_path: "1/100/1000/", project_id: 1000, branch: main, file_path: src/lib.rs, fqn: "crate::my_func", name: my_func, definition_type: function, start_line: 60, end_line: 80, start_byte: 600, end_byte: 900, start_char: 0, end_char: 0 }
      - { id: 5002, traversal_path: "1/100/1000/", project_id: 1000, branch: main, file_path: src/main.rs, fqn: "crate::main", name: main, definition_type: function, start_line: 1, end_line: 20, start_byte: 0, end_byte: 200, start_char: 0, end_char: 0 }
      - { id: 5003, traversal_path: "1/101/1001/", project_id: 1001, branch: main, file_path: src/secret.rs, fqn: "crate::Secret", name: Secret, definition_type: class, start_line: 1, end_line: 30, start_byte: 0, end_byte: 300, start_char: 0, end_char: 0 }
    gl_code_edge:
      - { traversal_path: "1/100/1000/", source_id: 3000, source_kind: File, relationship_kind: DEFINES, target_id: 5000, target_kind: Definition }
      - { traversal_path: "1/100/1000/", source_id: 3000, source_kind: File, relationship_kind: DEFINES, target_id: 5001, target_kind: Definition }
      - { traversal_path: "1/100/1000/", source_id: 3001, source_kind: File, relationship_kind: DEFINES, target_id: 5002, target_kind: Definition }
      - { traversal_path: "1/101/1001/", source_id: 3002, source_kind: File, relationship_kind: DEFINES, target_id: 5003, target_kind: Definition }

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "f", "entity": "File", "node_ids": [3000]}],
      "neighbors": {"direction": "outgoing", "rel_types": ["DEFINES"]}
    }
  gql: |
    MATCH (f:File {id: 3000})-[:DEFINES]->(n) RETURN f, n

cases:
  - name: neighbors_owner_project_allowed
    config:
      redaction:
        allow:
          project: [1000]
    expect:
      node_count: 3
      referential_integrity: true
      nodes:
        File:
          ids: [3000]
        Definition:
          ids: [5000, 5001]
      edges:
        DEFINES: [[3000, 5000], [3000, 5001]]
      edge_exists:
        DEFINES:
          - { from: File, from_id: 3000, to: Definition, to_id: 5000 }
          - { from: File, from_id: 3000, to: Definition, to_id: 5001 }

  - name: neighbors_owner_project_denied
    config:
      redaction:
        deny:
          project: [1000]
    expect:
      node_count: 0

  - name: neighbors_no_authorization_returns_nothing
    config:
      redaction: none
    expect:
      node_count: 0

  - name: neighbors_mixed_projects_all_allowed
    config:
      redaction:
        allow:
          project: [1000, 1001]
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "f", "entity": "File", "node_ids": [3000, 3002]}],
          "neighbors": {"direction": "outgoing", "rel_types": ["DEFINES"]}
        }
      gql: |
        MATCH (f:File)-[:DEFINES]->(n) WHERE f.id IN [3000, 3002] RETURN f, n
    expect:
      node_count: 5
      nodes:
        File:
          ids: [3000, 3002]
        Definition:
          ids: [5000, 5001, 5003]
      edges:
        DEFINES: [[3000, 5000], [3000, 5001], [3002, 5003]]

  - name: neighbors_mixed_projects_keep_allowed_owner
    config:
      redaction:
        allow:
          project: [1000]
        deny:
          project: [1001]
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "f", "entity": "File", "node_ids": [3000, 3002]}],
          "neighbors": {"direction": "outgoing", "rel_types": ["DEFINES"]}
        }
      gql: |
        MATCH (f:File)-[:DEFINES]->(n) WHERE f.id IN [3000, 3002] RETURN f, n
    expect:
      node_count: 3
      nodes:
        File:
          ids: [3000]
          absent: [3002]
        Definition:
          ids: [5000, 5001]
          absent: [5003]
      edges:
        DEFINES: [[3000, 5000], [3000, 5001]]

  - name: path_owner_not_in_path_allowed
    config:
      redaction:
        allow:
          project: [1000]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "File", "node_ids": [3000]},
            {"id": "end", "entity": "Definition", "node_ids": [5000, 5001]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 2, "rel_types": ["DEFINES"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:File {id: 3000})-[:DEFINES*1..2]->(`end`:Definition) WHERE `end`.id IN [5000, 5001] RETURN p
    expect:
      path_count: 2
      path_destinations:
        Definition: [5000, 5001]
      path_edges:
        - [{ from: File, from_id: 3000, type: DEFINES, to: Definition, to_id: 5000, step: 0 }]
        - [{ from: File, from_id: 3000, type: DEFINES, to: Definition, to_id: 5001, step: 0 }]

  - name: path_owner_not_in_path_denied
    config:
      redaction:
        deny:
          project: [1000]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "File", "node_ids": [3000]},
            {"id": "end", "entity": "Definition", "node_ids": [5000, 5001]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 2, "rel_types": ["DEFINES"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:File {id: 3000})-[:DEFINES*1..2]->(`end`:Definition) WHERE `end`.id IN [5000, 5001] RETURN p
    expect:
      node_count: 0
      path_count: 0
