description: Neighbors redaction needs both the center node and the neighbor to be allowed

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}],
      "neighbors": {"direction": "outgoing"}
    }
  gql: |
    MATCH (u:User {id: 1})-->(n) RETURN u, n

cases:
  - name: center_and_neighbors_allowed
    config:
      redaction:
        allow:
          user: [1]
          group: [100, 102]
    expect:
      node_count: 3
      referential_integrity: true
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100, 102]
      edges:
        MEMBER_OF: [[1, 100], [1, 102]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }
          - { from: User, from_id: 1, to: Group, to_id: 102 }

  - name: no_authorization_returns_nothing
    config:
      redaction: none
    expect:
      node_count: 0

  - name: center_allowed_alone_returns_nothing
    config:
      redaction:
        allow:
          user: [1]
    expect:
      node_count: 0

  - name: denied_neighbor_is_removed
    config:
      redaction:
        allow:
          user: [1]
          group: [100]
        deny:
          group: [102]
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100]
          absent: [102]
      edges:
        MEMBER_OF: [[1, 100]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }

  - name: denied_center_filters_all
    config:
      redaction:
        allow:
          group: [100, 101, 102]
        deny:
          user: [1]
    expect:
      node_count: 0

  - name: multiple_centers_all_allowed
    config:
      redaction:
        allow:
          user: [1, 3]
          group: [100, 101, 102]
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "u", "entity": "User", "node_ids": [1, 3]}],
          "neighbors": {"direction": "outgoing"}
        }
      gql: |
        MATCH (u:User)-->(n) WHERE u.id IN [1, 3] RETURN u, n
    expect:
      node_count: 5
      nodes:
        User:
          ids: [1, 3]
        Group:
          ids: [100, 101, 102]
      edges:
        MEMBER_OF: [[1, 100], [1, 102], [3, 101]]

  - name: multiple_centers_mixed_authorization
    config:
      redaction:
        allow:
          user: [1]
          group: [100, 102]
        deny:
          user: [3]
          group: [101]
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "u", "entity": "User", "node_ids": [1, 3]}],
          "neighbors": {"direction": "outgoing"}
        }
      gql: |
        MATCH (u:User)-->(n) WHERE u.id IN [1, 3] RETURN u, n
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1]
          absent: [3]
        Group:
          ids: [100, 102]
          absent: [101]
      edges:
        MEMBER_OF: [[1, 100], [1, 102]]

  - name: incoming_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [100]
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "g", "entity": "Group", "node_ids": [100]}],
          "neighbors": {"direction": "incoming", "rel_types": ["MEMBER_OF"]}
        }
      gql: |
        MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(n) RETURN g, n
    expect:
      node_count: 3
      nodes:
        Group:
          ids: [100]
        User:
          ids: [1, 2]
      edges:
        MEMBER_OF: [[1, 100], [2, 100]]

  - name: incoming_denied_neighbor_is_removed
    config:
      redaction:
        allow:
          user: [1]
          group: [100]
        deny:
          user: [2]
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "g", "entity": "Group", "node_ids": [100]}],
          "neighbors": {"direction": "incoming", "rel_types": ["MEMBER_OF"]}
        }
      gql: |
        MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(n) RETURN g, n
    expect:
      node_count: 2
      nodes:
        Group:
          ids: [100]
        User:
          ids: [1]
          absent: [2]
      edges:
        MEMBER_OF: [[1, 100]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }

  - name: source_kind_separates_colliding_ids
    config:
      extra_seed:
        gl_project:
          - { id: 9999, name: Collision Project, visibility_level: public, traversal_path: "1/9999/" }
        gl_edge:
          - { traversal_path: "1/", source_id: 1, source_kind: Group, relationship_kind: CONTAINS, target_id: 9999, target_kind: Project }
      redaction:
        allow:
          user: [1]
          group: [100, 102]
          project: [9999]
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100, 102]
        Project:
          absent: [9999]
      edges:
        MEMBER_OF: [[1, 100], [1, 102]]
      edge_absent:
        CONTAINS:
          - [1, 9999]

  - name: source_kind_separates_colliding_ids_after_redaction
    config:
      extra_seed:
        gl_project:
          - { id: 9999, name: Collision Project, visibility_level: public, traversal_path: "1/9999/" }
        gl_edge:
          - { traversal_path: "1/", source_id: 1, source_kind: Group, relationship_kind: CONTAINS, target_id: 9999, target_kind: Project }
      redaction:
        allow:
          user: [1]
          group: [100]
          project: [9999]
        deny:
          group: [102]
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100]
          absent: [102]
        Project:
          absent: [9999]
      edges:
        MEMBER_OF: [[1, 100]]
      edge_absent:
        CONTAINS:
          - [1, 9999]
