          group: [701, 702, 703]
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "User", "node_ids": [99999]},
            {"id": "end", "entity": "Project", "node_ids": [99999]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 99999})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project {id: 99999}) RETURN p
