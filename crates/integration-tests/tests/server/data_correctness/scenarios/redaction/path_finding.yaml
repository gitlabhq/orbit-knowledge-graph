description: Path finding drops a path when any node on it is denied, and keeps the edge kinds of every surviving path

config:
  security: { paths: ["1/700/"] }
  seed: redaction

cases:
  - name: user_to_project_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [701, 702, 703]
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "User", "node_ids": [1]},
            {"id": "end", "entity": "Project", "node_ids": [7100]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project {id: 7100}) RETURN p
    expect:
      referential_integrity: true
      path_count: 1
      nodes:
        User:
          ids: [1]
        Group:
          ids: [701]
        Project:
          ids: [7100]
      path_edges:
        - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 701, step: 0 }, { from: Group, from_id: 701, type: CONTAINS, to: Project, to_id: 7100, step: 1 }]

  - name: no_authorization_returns_nothing
    config:
      redaction: none
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "User", "node_ids": [1]},
            {"id": "end", "entity": "Project", "node_ids": [7100]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project {id: 7100}) RETURN p
    expect:
      node_count: 0
      path_count: 0

  - name: denied_start_node_filters_all_paths
    config:
      redaction:
        allow:
          group: [701, 702, 703]
          project: [7100, 7101, 7102, 7103, 7104]
        deny:
          user: [1]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "User", "node_ids": [1]},
            {"id": "end", "entity": "Project", "node_ids": [7100]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project {id: 7100}) RETURN p
    expect:
      node_count: 0
      path_count: 0

  - name: denied_intermediates_filter_all_paths
    config:
      redaction:
        allow:
          user: [1]
          project: [7100]
        deny:
          group: [701, 702, 703]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "User", "node_ids": [1]},
            {"id": "end", "entity": "Project", "node_ids": [7100]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project {id: 7100}) RETURN p
    expect:
      node_count: 0
      path_count: 0

  - name: three_destinations_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [701, 702, 703]
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "User", "node_ids": [1]},
            {"id": "end", "entity": "Project", "node_ids": [7100, 7102, 7104]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project) WHERE `end`.id IN [7100, 7102, 7104] RETURN p
    expect:
      referential_integrity: true
      path_count: 3
      path_destinations:
        Project: [7100, 7102, 7104]
      path_edges:
        - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 701, step: 0 }, { from: Group, from_id: 701, type: CONTAINS, to: Project, to_id: 7100, step: 1 }]
        - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 701, step: 0 }, { from: Group, from_id: 701, type: CONTAINS, to: Project, to_id: 7102, step: 1 }]
        - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 703, step: 0 }, { from: Group, from_id: 703, type: CONTAINS, to: Project, to_id: 7104, step: 1 }]

  - name: denied_intermediate_filters_its_path
    config:
      redaction:
        allow:
          user: [1]
          group: [701]
          project: [7100, 7102, 7104]
        deny:
          group: [703]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "start", "entity": "User", "node_ids": [1]},
            {"id": "end", "entity": "Project", "node_ids": [7100, 7102, 7104]}
          ],
          "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project) WHERE `end`.id IN [7100, 7102, 7104] RETURN p
    expect:
      referential_integrity: true
      path_count: 2
      nodes:
        Group:
          ids: [701]
          absent: [703]
        Project:
          ids: [7100, 7102]
          absent: [7104]
      path_destinations:
        Project: [7100, 7102]
      path_edges:
        - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 701, step: 0 }, { from: Group, from_id: 701, type: CONTAINS, to: Project, to_id: 7100, step: 1 }]
        - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 701, step: 0 }, { from: Group, from_id: 701, type: CONTAINS, to: Project, to_id: 7102, step: 1 }]

  - name: denied_intermediate_with_all_projects_allowed
    config:
      redaction:
        allow:
          user: [1]
          group: [701]
          project: [7100, 7101, 7102, 7103, 7104]
