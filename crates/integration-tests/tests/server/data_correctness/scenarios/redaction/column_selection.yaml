description: Redaction works the same whether a query selects specific columns, every column, or the default columns

config:
  security: { org_id: 5, paths: ["5/"] }
  extra_seed:
    gl_user:
      - { id: 1, username: alice, name: Alice Admin, state: active, user_type: human, _version: "2099-01-01 00:00:00" }
      - { id: 2, username: bob, name: Bob Builder, state: active, user_type: human, _version: "2099-01-01 00:00:00" }
      - { id: 3, username: charlie, name: Charlie Private, state: active, user_type: human, _version: "2099-01-01 00:00:00" }
      - { id: 4, username: diana, name: Diana Developer, state: active, user_type: project_bot, _version: "2099-01-01 00:00:00" }
      - { id: 5, username: eve, name: Eve External, state: blocked, user_type: service_account, _version: "2099-01-01 00:00:00" }
      - { id: 6, _version: "2099-01-01 00:00:00", _deleted: true }
      - { id: 7, _version: "2099-01-01 00:00:00", _deleted: true }
    gl_group:
      - { id: 500, name: Public Group, visibility_level: public, traversal_path: "5/500/" }
      - { id: 501, name: Private Group, visibility_level: private, traversal_path: "5/501/" }
      - { id: 502, name: Internal Group, visibility_level: internal, traversal_path: "5/502/" }
    gl_project:
      - { id: 5000, name: Public Project, visibility_level: public, traversal_path: "5/500/5000/" }
      - { id: 5001, name: Private Project, visibility_level: private, traversal_path: "5/501/5001/" }
      - { id: 5002, name: Internal Project, visibility_level: internal, traversal_path: "5/500/5002/" }
      - { id: 5003, name: Secret Project, visibility_level: private, traversal_path: "5/501/5003/" }
      - { id: 5004, name: Shared Project, visibility_level: public, traversal_path: "5/502/5004/" }
    gl_merge_request:
      - { id: 5200, title: Add feature A, state: opened, source_branch: feature-a, target_branch: main, traversal_path: "5/500/5000/" }
      - { id: 5201, title: Fix bug B, state: opened, source_branch: fix-b, target_branch: main, traversal_path: "5/500/5000/" }
      - { id: 5202, title: Refactor C, state: merged, source_branch: refactor-c, target_branch: main, traversal_path: "5/501/5001/" }
      - { id: 5203, title: Update D, state: closed, source_branch: update-d, target_branch: main, traversal_path: "5/502/5004/" }
    gl_edge:
      - { traversal_path: "5/500/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 500, target_kind: Group }
      - { traversal_path: "5/502/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 502, target_kind: Group }
      - { traversal_path: "5/500/", source_id: 2, source_kind: User, relationship_kind: MEMBER_OF, target_id: 500, target_kind: Group }
      - { traversal_path: "5/501/", source_id: 3, source_kind: User, relationship_kind: MEMBER_OF, target_id: 501, target_kind: Group }
      - { traversal_path: "5/501/", source_id: 4, source_kind: User, relationship_kind: MEMBER_OF, target_id: 501, target_kind: Group }
      - { traversal_path: "5/502/", source_id: 4, source_kind: User, relationship_kind: MEMBER_OF, target_id: 502, target_kind: Group }
      - { traversal_path: "5/501/", source_id: 5, source_kind: User, relationship_kind: MEMBER_OF, target_id: 501, target_kind: Group }
      - { traversal_path: "5/500/5000/", source_id: 500, source_kind: Group, relationship_kind: CONTAINS, target_id: 5000, target_kind: Project }
      - { traversal_path: "5/500/5002/", source_id: 500, source_kind: Group, relationship_kind: CONTAINS, target_id: 5002, target_kind: Project }
      - { traversal_path: "5/501/5001/", source_id: 501, source_kind: Group, relationship_kind: CONTAINS, target_id: 5001, target_kind: Project }
      - { traversal_path: "5/501/5003/", source_id: 501, source_kind: Group, relationship_kind: CONTAINS, target_id: 5003, target_kind: Project }
      - { traversal_path: "5/502/5004/", source_id: 502, source_kind: Group, relationship_kind: CONTAINS, target_id: 5004, target_kind: Project }

cases:
  - name: specific_columns_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                     "columns": ["username", "state"]}],
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state LIMIT 10
    expect:
      node_count: 5
      nodes:
        User:
          ids: [1, 2, 3, 4, 5]
          prop_present: [username, state]

  - name: specific_columns_redacted
    config:
      redaction:
        allow:
          user: [1, 2, 3]
        deny:
          user: [4, 5]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                     "columns": ["username", "state"]}],
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state LIMIT 10
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1, 2, 3]
          absent: [4, 5]
          rows:
            - { id: 1, username: alice, state: active }
            - { id: 2, username: bob, state: active }
            - { id: 3, username: charlie, state: active }

  - name: wildcard_columns_all_allowed
    config:
      redaction:
        allow:
          group: [500, 501, 502]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000},
                     "columns": "*"}],
          "limit": 10
        }
      gql: |
        MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN properties(g) LIMIT 10
    expect:
      node_count: 3
      nodes:
        Group:
          ids: [500, 501, 502]
          prop_present: [name, visibility_level]
          prop_absent: [traversal_path]

  - name: wildcard_columns_redacted
    config:
      redaction:
        allow:
          group: [500]
        deny:
          group: [501, 502]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000},
                     "columns": "*"}],
          "limit": 10
        }
      gql: |
        MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN properties(g) LIMIT 10
    expect:
      node_count: 1
      nodes:
        Group:
          ids: [500]
          absent: [501, 502]
          prop_absent: [traversal_path]
          rows:
            - { id: 500, name: Public Group, visibility_level: public }

  - name: omitted_columns_redacted
    config:
      redaction:
        allow:
          user: [1, 2]
        deny:
          user: [3, 4, 5]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}}],
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u LIMIT 10
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1, 2]
          absent: [3, 4, 5]

  - name: multi_hop_columns_keep_single_authorized_path
    config:
      redaction:
        allow:
          user: [1]
          group: [500]
          project: [5000]
        deny:
          user: [2, 3, 4, 5]
          group: [501, 502]
          project: [5001, 5002, 5003, 5004]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group", "columns": ["name"]},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name", "visibility_level"]}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name, p.visibility_level LIMIT 30
    expect:
      node_count: 3
      referential_integrity: true
      nodes:
        User:
          rows:
            - { id: 1, username: alice }
        Group:
          rows:
            - { id: 500, name: Public Group }
        Project:
          rows:
            - { id: 5000, name: Public Project, visibility_level: public }
      edges:
        MEMBER_OF: [[1, 500]]
        CONTAINS: [[500, 5000]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 500 }
        CONTAINS:
          - { from: Group, from_id: 500, to: Project, to_id: 5000 }

  - name: multi_hop_columns_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [500, 501, 502]
          project: [5000, 5001, 5002, 5003, 5004]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group", "columns": ["name"]},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name", "visibility_level"]}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name, p.visibility_level LIMIT 30
    expect:
      node_count: 13
      nodes:
        User:
          ids: [1, 2, 3, 4, 5]
        Group:
          ids: [500, 501, 502]
        Project:
          ids: [5000, 5001, 5002, 5003, 5004]
      edges:
        MEMBER_OF: [[1, 500], [1, 502], [2, 500], [3, 501], [4, 501], [4, 502], [5, 501]]
        CONTAINS: [[500, 5000], [500, 5002], [501, 5001], [501, 5003], [502, 5004]]

  - name: specific_columns_on_single_hop_redacted
    config:
      redaction:
        allow:
          user: [1]
          group: [500]
        deny:
          user: [2, 3, 4, 5]
          group: [501, 502]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username", "state"]},
            {"id": "g", "entity": "Group", "columns": ["name"]}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "limit": 20
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state, g.name LIMIT 20
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1]
          rows:
            - { id: 1, username: alice, state: active }
        Group:
          ids: [500]
          rows:
            - { id: 500, name: Public Group }
      edges:
        MEMBER_OF: [[1, 500]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 500 }

  - name: any_unauthorized_node_drops_the_row
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [500, 501, 502]
        deny:
          project: [5000, 5001, 5002, 5003, 5004]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group", "columns": ["name"]},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 50
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name LIMIT 50
    expect:
      node_count: 0

  - name: data_values_preserved
    config:
      redaction:
        allow:
          user: [1, 2]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                     "columns": ["username", "name", "state"],
                     "filters": {"username": {"in": ["alice", "bob"]}}}],
          "order_by": "u.username",
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username IN ['alice', 'bob'] RETURN u.username, u.name, u.state ORDER BY u.username LIMIT 10
    expect:
      node_count: 2
      nodes:
        User:
          order: [1, 2]
          filters:
            username: { in: [alice, bob] }
          rows:
            - { id: 1, username: alice, name: Alice Admin, state: active }
            - { id: 2, username: bob, name: Bob Builder, state: active }

  - name: id_in_column_list_all_allowed
    config:
      redaction:
        allow:
          project: [5000, 5001, 5002, 5003, 5004]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000},
                     "columns": ["id", "name", "visibility_level"]}],
          "limit": 10
        }
      gql: |
        MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.id, p.name, p.visibility_level LIMIT 10
    expect:
      node_count: 5
      nodes:
        Project:
          ids: [5000, 5001, 5002, 5003, 5004]

  - name: id_in_column_list_redacted
    config:
      redaction:
        allow:
          project: [5000, 5004]
        deny:
          project: [5001, 5002, 5003]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000},
                     "columns": ["id", "name", "visibility_level"]}],
          "limit": 10
        }
      gql: |
        MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.id, p.name, p.visibility_level LIMIT 10
    expect:
      node_count: 2
      nodes:
        Project:
          ids: [5000, 5004]
          absent: [5001, 5002, 5003]
          rows:
            - { id: 5000, name: Public Project, visibility_level: public }
            - { id: 5004, name: Shared Project, visibility_level: public }

  - name: join_semantics_all_allowed
    config:
      redaction:
        allow:
          group: [500, 501, 502]
          project: [5000, 5001, 5002, 5003, 5004]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name", "visibility_level"]},
            {"id": "p", "entity": "Project", "columns": ["name", "visibility_level"]}
          ],
          "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
          "limit": 20
        }
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g.name, g.visibility_level, p.name, p.visibility_level LIMIT 20
    expect:
      node_count: 8
      edges:
        CONTAINS: [[500, 5000], [500, 5002], [501, 5001], [501, 5003], [502, 5004]]

  - name: join_semantics_redacted
    config:
      redaction:
        allow:
          group: [500]
          project: [5000, 5002]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name", "visibility_level"]},
            {"id": "p", "entity": "Project", "columns": ["name", "visibility_level"]}
          ],
          "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
          "limit": 20
        }
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g.name, g.visibility_level, p.name, p.visibility_level LIMIT 20
    expect:
      node_count: 3
      nodes:
        Group:
          ids: [500]
        Project:
          ids: [5000, 5002]
      edges:
        CONTAINS: [[500, 5000], [500, 5002]]

  - name: filters_work_with_columns
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                     "columns": ["username"], "filters": {"state": "active"}}],
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.state = 'active' RETURN u.username LIMIT 10
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1, 2, 3, 4]
          absent: [5]
          prop_present: [username]
