description: Redaction works the same whether a query selects specific columns, every column, or the default columns

config:
  security: { paths: ["1/700/"] }
  seed: redaction

cases:
  - name: specific_columns_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state LIMIT 10
    expect:
      node_count: 5
      nodes:
        User:
          ids: [1, 2, 3, 4, 5]
          prop_present: [username, state]

  - name: specific_columns_redacted
    config:
      redaction:
        allow:
          user: [1, 2, 3]
        deny:
          user: [4, 5]
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state LIMIT 10
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1, 2, 3]
          absent: [4, 5]
          rows:
            - { id: 1, username: alice, state: active }
            - { id: 2, username: bob, state: active }
            - { id: 3, username: charlie, state: active }

  - name: wildcard_columns_all_allowed
    config:
      redaction:
        allow:
          group: [701, 702, 703]
    query:
      gql: |
        MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN properties(g) LIMIT 10
    expect:
      node_count: 3
      nodes:
        Group:
          ids: [701, 702, 703]
          prop_present: [name, visibility_level]
          prop_absent: [traversal_path]

  - name: wildcard_columns_redacted
    config:
      redaction:
        allow:
          group: [701]
        deny:
          group: [702, 703]
    query:
      gql: |
        MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN properties(g) LIMIT 10
    expect:
      node_count: 1
      nodes:
        Group:
          ids: [701]
          absent: [702, 703]
          prop_absent: [traversal_path]
          rows:
            - { id: 701, name: Public Group, visibility_level: public }

  - name: omitted_columns_redacted
    config:
      redaction:
        allow:
          user: [1, 2]
        deny:
          user: [3, 4, 5]
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u LIMIT 10
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1, 2]
          absent: [3, 4, 5]

  - name: multi_hop_columns_keep_single_authorized_path
    config:
      redaction:
        allow:
          user: [1]
          group: [701]
          project: [7100]
        deny:
          user: [2, 3, 4, 5]
          group: [702, 703]
          project: [7101, 7102, 7103, 7104]
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name, p.visibility_level LIMIT 30
    expect:
      node_count: 3
      referential_integrity: true
      nodes:
        User:
          rows:
            - { id: 1, username: alice }
        Group:
          rows:
            - { id: 701, name: Public Group }
        Project:
          rows:
            - { id: 7100, name: Public Project, visibility_level: public }
      edges:
        MEMBER_OF: [[1, 701]]
        CONTAINS: [[701, 7100]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 701 }
        CONTAINS:
          - { from: Group, from_id: 701, to: Project, to_id: 7100 }

  - name: multi_hop_columns_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [701, 702, 703]
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name, p.visibility_level LIMIT 30
    expect:
      node_count: 13
      nodes:
        User:
          ids: [1, 2, 3, 4, 5]
        Group:
          ids: [701, 702, 703]
        Project:
          ids: [7100, 7101, 7102, 7103, 7104]
      edges:
        MEMBER_OF: [[1, 701], [1, 703], [2, 701], [3, 702], [4, 702], [4, 703], [5, 702]]
        CONTAINS: [[701, 7100], [701, 7102], [702, 7101], [702, 7103], [703, 7104]]

  - name: specific_columns_on_single_hop_redacted
    config:
      redaction:
        allow:
          user: [1]
          group: [701]
        deny:
          user: [2, 3, 4, 5]
          group: [702, 703]
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state, g.name LIMIT 20
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1]
          rows:
            - { id: 1, username: alice, state: active }
        Group:
          ids: [701]
          rows:
            - { id: 701, name: Public Group }
      edges:
        MEMBER_OF: [[1, 701]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 701 }

  - name: any_unauthorized_node_drops_the_row
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [701, 702, 703]
        deny:
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name LIMIT 50
    expect:
      node_count: 0

  - name: data_values_preserved
    config:
      redaction:
        allow:
          user: [1, 2]
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username IN ['alice', 'bob'] RETURN u.username, u.name, u.state ORDER BY u.username LIMIT 10
    expect:
      node_count: 2
      nodes:
        User:
          order: [1, 2]
          filters:
            username: { in: [alice, bob] }
          rows:
            - { id: 1, username: alice, name: Alice Admin, state: active }
            - { id: 2, username: bob, name: Bob Builder, state: active }

  - name: id_in_column_list_all_allowed
    config:
      redaction:
        allow:
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      gql: |
        MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.id, p.name, p.visibility_level LIMIT 10
    expect:
      node_count: 5
      nodes:
        Project:
          ids: [7100, 7101, 7102, 7103, 7104]

  - name: id_in_column_list_redacted
    config:
      redaction:
        allow:
          project: [7100, 7104]
        deny:
          project: [7101, 7102, 7103]
    query:
      gql: |
        MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.id, p.name, p.visibility_level LIMIT 10
    expect:
      node_count: 2
      nodes:
        Project:
          ids: [7100, 7104]
          absent: [7101, 7102, 7103]
          rows:
            - { id: 7100, name: Public Project, visibility_level: public }
            - { id: 7104, name: Shared Project, visibility_level: public }

  - name: join_semantics_all_allowed
    config:
      redaction:
        allow:
          group: [701, 702, 703]
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g.name, g.visibility_level, p.name, p.visibility_level LIMIT 20
    expect:
      node_count: 8
      edges:
        CONTAINS: [[701, 7100], [701, 7102], [702, 7101], [702, 7103], [703, 7104]]

  - name: join_semantics_redacted
    config:
      redaction:
        allow:
          group: [701]
          project: [7100, 7102]
    query:
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g.name, g.visibility_level, p.name, p.visibility_level LIMIT 20
    expect:
      node_count: 3
      nodes:
        Group:
          ids: [701]
        Project:
          ids: [7100, 7102]
      edges:
        CONTAINS: [[701, 7100], [701, 7102]]

  - name: filters_work_with_columns
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
    query:
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.state = 'active' RETURN u.username LIMIT 10
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1, 2, 3, 4]
          absent: [5]
          prop_present: [username]
