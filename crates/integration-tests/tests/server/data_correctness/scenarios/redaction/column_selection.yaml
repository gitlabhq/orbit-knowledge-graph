description: Redaction works the same whether a query selects specific columns, every column, or the default columns

config:
  security: { paths: ["1/700/"] }
  extra_seed:
    gl_user:
      - { id: 1, username: alice, name: Alice Admin, state: active, user_type: human, _version: "2099-01-01 00:00:00" }
      - { id: 2, username: bob, name: Bob Builder, state: active, user_type: human, _version: "2099-01-01 00:00:00" }
      - { id: 3, username: charlie, name: Charlie Private, state: active, user_type: human, _version: "2099-01-01 00:00:00" }
      - { id: 4, username: diana, name: Diana Developer, state: active, user_type: project_bot, _version: "2099-01-01 00:00:00" }
      - { id: 5, username: eve, name: Eve External, state: blocked, user_type: service_account, _version: "2099-01-01 00:00:00" }
      - { id: 6, _version: "2099-01-01 00:00:00", _deleted: true }
      - { id: 7, _version: "2099-01-01 00:00:00", _deleted: true }
    gl_group:
      - { id: 701, name: Public Group, visibility_level: public, traversal_path: "1/700/701/" }
      - { id: 702, name: Private Group, visibility_level: private, traversal_path: "1/700/702/" }
      - { id: 703, name: Internal Group, visibility_level: internal, traversal_path: "1/700/703/" }
    gl_project:
      - { id: 7100, name: Public Project, visibility_level: public, traversal_path: "1/700/701/7100/" }
      - { id: 7101, name: Private Project, visibility_level: private, traversal_path: "1/700/702/7101/" }
      - { id: 7102, name: Internal Project, visibility_level: internal, traversal_path: "1/700/701/7102/" }
      - { id: 7103, name: Secret Project, visibility_level: private, traversal_path: "1/700/702/7103/" }
      - { id: 7104, name: Shared Project, visibility_level: public, traversal_path: "1/700/703/7104/" }
    gl_merge_request:
      - { id: 7200, title: Add feature A, state: opened, source_branch: feature-a, target_branch: main, traversal_path: "1/700/701/7100/" }
      - { id: 7201, title: Fix bug B, state: opened, source_branch: fix-b, target_branch: main, traversal_path: "1/700/701/7100/" }
      - { id: 7202, title: Refactor C, state: merged, source_branch: refactor-c, target_branch: main, traversal_path: "1/700/702/7101/" }
      - { id: 7203, title: Update D, state: closed, source_branch: update-d, target_branch: main, traversal_path: "1/700/703/7104/" }
    gl_edge:
      - { traversal_path: "1/700/701/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 701, target_kind: Group }
      - { traversal_path: "1/700/703/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 703, target_kind: Group }
      - { traversal_path: "1/700/701/", source_id: 2, source_kind: User, relationship_kind: MEMBER_OF, target_id: 701, target_kind: Group }
      - { traversal_path: "1/700/702/", source_id: 3, source_kind: User, relationship_kind: MEMBER_OF, target_id: 702, target_kind: Group }
      - { traversal_path: "1/700/702/", source_id: 4, source_kind: User, relationship_kind: MEMBER_OF, target_id: 702, target_kind: Group }
      - { traversal_path: "1/700/703/", source_id: 4, source_kind: User, relationship_kind: MEMBER_OF, target_id: 703, target_kind: Group }
      - { traversal_path: "1/700/702/", source_id: 5, source_kind: User, relationship_kind: MEMBER_OF, target_id: 702, target_kind: Group }
      - { traversal_path: "1/700/701/7100/", source_id: 701, source_kind: Group, relationship_kind: CONTAINS, target_id: 7100, target_kind: Project }
      - { traversal_path: "1/700/701/7102/", source_id: 701, source_kind: Group, relationship_kind: CONTAINS, target_id: 7102, target_kind: Project }
      - { traversal_path: "1/700/702/7101/", source_id: 702, source_kind: Group, relationship_kind: CONTAINS, target_id: 7101, target_kind: Project }
      - { traversal_path: "1/700/702/7103/", source_id: 702, source_kind: Group, relationship_kind: CONTAINS, target_id: 7103, target_kind: Project }
      - { traversal_path: "1/700/703/7104/", source_id: 703, source_kind: Group, relationship_kind: CONTAINS, target_id: 7104, target_kind: Project }

cases:
  - name: specific_columns_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                     "columns": ["username", "state"]}],
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state LIMIT 10
    expect:
      node_count: 5
      nodes:
        User:
          ids: [1, 2, 3, 4, 5]
          prop_present: [username, state]

  - name: specific_columns_redacted
    config:
      redaction:
        allow:
          user: [1, 2, 3]
        deny:
          user: [4, 5]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                     "columns": ["username", "state"]}],
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state LIMIT 10
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1, 2, 3]
          absent: [4, 5]
          rows:
            - { id: 1, username: alice, state: active }
            - { id: 2, username: bob, state: active }
            - { id: 3, username: charlie, state: active }

  - name: wildcard_columns_all_allowed
    config:
      redaction:
        allow:
          group: [701, 702, 703]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000},
                     "columns": "*"}],
          "limit": 10
        }
      gql: |
        MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN properties(g) LIMIT 10
    expect:
      node_count: 3
      nodes:
        Group:
          ids: [701, 702, 703]
          prop_present: [name, visibility_level]
          prop_absent: [traversal_path]

  - name: wildcard_columns_redacted
    config:
      redaction:
        allow:
          group: [701]
        deny:
          group: [702, 703]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000},
                     "columns": "*"}],
          "limit": 10
        }
      gql: |
        MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN properties(g) LIMIT 10
    expect:
      node_count: 1
      nodes:
        Group:
          ids: [701]
          absent: [702, 703]
          prop_absent: [traversal_path]
          rows:
            - { id: 701, name: Public Group, visibility_level: public }

  - name: omitted_columns_redacted
    config:
      redaction:
        allow:
          user: [1, 2]
        deny:
          user: [3, 4, 5]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}}],
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u LIMIT 10
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1, 2]
          absent: [3, 4, 5]

  - name: multi_hop_columns_keep_single_authorized_path
    config:
      redaction:
        allow:
          user: [1]
          group: [701]
          project: [7100]
        deny:
          user: [2, 3, 4, 5]
          group: [702, 703]
          project: [7101, 7102, 7103, 7104]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group", "columns": ["name"]},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name", "visibility_level"]}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name, p.visibility_level LIMIT 30
    expect:
      node_count: 3
      referential_integrity: true
      nodes:
        User:
          rows:
            - { id: 1, username: alice }
        Group:
          rows:
            - { id: 701, name: Public Group }
        Project:
          rows:
            - { id: 7100, name: Public Project, visibility_level: public }
      edges:
        MEMBER_OF: [[1, 701]]
        CONTAINS: [[701, 7100]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 701 }
        CONTAINS:
          - { from: Group, from_id: 701, to: Project, to_id: 7100 }

  - name: multi_hop_columns_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [701, 702, 703]
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group", "columns": ["name"]},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name", "visibility_level"]}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name, p.visibility_level LIMIT 30
    expect:
      node_count: 13
      nodes:
        User:
          ids: [1, 2, 3, 4, 5]
        Group:
          ids: [701, 702, 703]
        Project:
          ids: [7100, 7101, 7102, 7103, 7104]
      edges:
        MEMBER_OF: [[1, 701], [1, 703], [2, 701], [3, 702], [4, 702], [4, 703], [5, 702]]
        CONTAINS: [[701, 7100], [701, 7102], [702, 7101], [702, 7103], [703, 7104]]

  - name: specific_columns_on_single_hop_redacted
    config:
      redaction:
        allow:
          user: [1]
          group: [701]
        deny:
          user: [2, 3, 4, 5]
          group: [702, 703]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username", "state"]},
            {"id": "g", "entity": "Group", "columns": ["name"]}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "limit": 20
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state, g.name LIMIT 20
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1]
          rows:
            - { id: 1, username: alice, state: active }
        Group:
          ids: [701]
          rows:
            - { id: 701, name: Public Group }
      edges:
        MEMBER_OF: [[1, 701]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 701 }

  - name: any_unauthorized_node_drops_the_row
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [701, 702, 703]
        deny:
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group", "columns": ["name"]},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 50
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u.username, g.name, p.name LIMIT 50
    expect:
      node_count: 0

  - name: data_values_preserved
    config:
      redaction:
        allow:
          user: [1, 2]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                     "columns": ["username", "name", "state"],
                     "filters": {"username": {"in": ["alice", "bob"]}}}],
          "order_by": "u.username",
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username IN ['alice', 'bob'] RETURN u.username, u.name, u.state ORDER BY u.username LIMIT 10
    expect:
      node_count: 2
      nodes:
        User:
          order: [1, 2]
          filters:
            username: { in: [alice, bob] }
          rows:
            - { id: 1, username: alice, name: Alice Admin, state: active }
            - { id: 2, username: bob, name: Bob Builder, state: active }

  - name: id_in_column_list_all_allowed
    config:
      redaction:
        allow:
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000},
                     "columns": ["id", "name", "visibility_level"]}],
          "limit": 10
        }
      gql: |
        MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.id, p.name, p.visibility_level LIMIT 10
    expect:
      node_count: 5
      nodes:
        Project:
          ids: [7100, 7101, 7102, 7103, 7104]

  - name: id_in_column_list_redacted
    config:
      redaction:
        allow:
          project: [7100, 7104]
        deny:
          project: [7101, 7102, 7103]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000},
                     "columns": ["id", "name", "visibility_level"]}],
          "limit": 10
        }
      gql: |
        MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.id, p.name, p.visibility_level LIMIT 10
    expect:
      node_count: 2
      nodes:
        Project:
          ids: [7100, 7104]
          absent: [7101, 7102, 7103]
          rows:
            - { id: 7100, name: Public Project, visibility_level: public }
            - { id: 7104, name: Shared Project, visibility_level: public }

  - name: join_semantics_all_allowed
    config:
      redaction:
        allow:
          group: [701, 702, 703]
          project: [7100, 7101, 7102, 7103, 7104]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name", "visibility_level"]},
            {"id": "p", "entity": "Project", "columns": ["name", "visibility_level"]}
          ],
          "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
          "limit": 20
        }
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g.name, g.visibility_level, p.name, p.visibility_level LIMIT 20
    expect:
      node_count: 8
      edges:
        CONTAINS: [[701, 7100], [701, 7102], [702, 7101], [702, 7103], [703, 7104]]

  - name: join_semantics_redacted
    config:
      redaction:
        allow:
          group: [701]
          project: [7100, 7102]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name", "visibility_level"]},
            {"id": "p", "entity": "Project", "columns": ["name", "visibility_level"]}
          ],
          "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
          "limit": 20
        }
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g.name, g.visibility_level, p.name, p.visibility_level LIMIT 20
    expect:
      node_count: 3
      nodes:
        Group:
          ids: [701]
        Project:
          ids: [7100, 7102]
      edges:
        CONTAINS: [[701, 7100], [701, 7102]]

  - name: filters_work_with_columns
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                     "columns": ["username"], "filters": {"state": "active"}}],
          "limit": 10
        }
      gql: |
        MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.state = 'active' RETURN u.username LIMIT 10
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1, 2, 3, 4]
          absent: [5]
          prop_present: [username]
