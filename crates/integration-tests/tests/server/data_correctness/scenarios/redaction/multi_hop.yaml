description: Redaction on multi-hop traversals drops every row that holds a denied node, so only fully authorized paths keep their nodes and edges

cases:
  - name: member_of_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [100, 101, 102]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "limit": 20
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u, g LIMIT 20
    expect:
      node_count: 8
      referential_integrity: true
      nodes:
        User:
          ids: [1, 2, 3, 4, 5]
        Group:
          ids: [100, 101, 102]
      edges:
        MEMBER_OF: [[1, 100], [1, 102], [2, 100], [3, 101], [4, 101], [4, 102], [5, 101]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }
          - { from: User, from_id: 1, to: Group, to_id: 102 }
          - { from: User, from_id: 2, to: Group, to_id: 100 }
          - { from: User, from_id: 3, to: Group, to_id: 101 }
          - { from: User, from_id: 4, to: Group, to_id: 101 }
          - { from: User, from_id: 4, to: Group, to_id: 102 }
          - { from: User, from_id: 5, to: Group, to_id: 101 }

  - name: single_hop_keeps_pairs_with_both_nodes_allowed
    config:
      redaction:
        allow:
          user: [1, 2]
          group: [100]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "limit": 20
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u, g LIMIT 20
    expect:
      node_count: 3
      referential_integrity: true
      nodes:
        User:
          ids: [1, 2]
          absent: [3, 4, 5]
        Group:
          ids: [100]
          absent: [101, 102]
      edges:
        MEMBER_OF: [[1, 100], [2, 100]]

  - name: denied_groups_remove_every_pair_through_them
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [100]
        deny:
          group: [101, 102]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "limit": 20
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u, g LIMIT 20
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1, 2]
        Group:
          ids: [100]
          absent: [101, 102]
      edges:
        MEMBER_OF: [[1, 100], [2, 100]]

  - name: edge_endpoints_survive_redaction
    config:
      redaction:
        allow:
          user: [1]
          group: [100]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "limit": 20
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u, g LIMIT 20
    expect:
      node_count: 2
      referential_integrity: true
      nodes:
        User:
          ids: [1]
          absent: [2, 3, 4, 5]
        Group:
          ids: [100]
          absent: [101, 102]
      edges:
        MEMBER_OF: [[1, 100]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }

  - name: id_collision_across_entities_all_allowed
    config:
      extra_seed:
        gl_group:
          - { id: 1, name: Collision Group, visibility_level: public, traversal_path: "1/1/" }
        gl_edge:
          - { traversal_path: "1/1/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 1, target_kind: Group }
      redaction:
        allow:
          user: [1]
          group: [1, 100, 102]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u, g LIMIT 30
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1]
        Group:
          ids: [1, 100, 102]
      edges:
        MEMBER_OF: [[1, 1], [1, 100], [1, 102]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 1 }

  - name: id_collision_across_entities_denies_by_type
    config:
      extra_seed:
        gl_group:
          - { id: 1, name: Collision Group, visibility_level: public, traversal_path: "1/1/" }
        gl_edge:
          - { traversal_path: "1/1/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 1, target_kind: Group }
      redaction:
        allow:
          user: [1]
          group: [100, 102]
        deny:
          group: [1]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u, g LIMIT 30
    expect:
      node_count: 3
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100, 102]
          absent: [1]
      edges:
        MEMBER_OF: [[1, 100], [1, 102]]
      edge_absent:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 1 }

  - name: contains_all_allowed
    config:
      redaction:
        allow:
          group: [100, 101, 102]
          project: [1000, 1001, 1002, 1003, 1004]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}},
            {"id": "p", "entity": "Project"}
          ],
          "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
          "limit": 20
        }
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g, p LIMIT 20
    expect:
      node_count: 8
      referential_integrity: true
      nodes:
        Group:
          ids: [100, 101, 102]
        Project:
          ids: [1000, 1001, 1002, 1003, 1004]
      edges:
        CONTAINS: [[100, 1000], [100, 1002], [101, 1001], [101, 1003], [102, 1004]]
      edge_exists:
        CONTAINS:
          - { from: Group, from_id: 100, to: Project, to_id: 1000 }
          - { from: Group, from_id: 100, to: Project, to_id: 1002 }
          - { from: Group, from_id: 101, to: Project, to_id: 1001 }
          - { from: Group, from_id: 101, to: Project, to_id: 1003 }
          - { from: Group, from_id: 102, to: Project, to_id: 1004 }

  - name: group_project_pairs_with_denied_group_and_projects
    config:
      redaction:
        allow:
          group: [100, 102]
          project: [1000, 1002, 1004]
        deny:
          group: [101]
          project: [1001, 1003]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}},
            {"id": "p", "entity": "Project"}
          ],
          "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
          "limit": 20
        }
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g, p LIMIT 20
    expect:
      node_count: 5
      nodes:
        Group:
          ids: [100, 102]
          absent: [101]
        Project:
          ids: [1000, 1002, 1004]
          absent: [1001, 1003]
      edges:
        CONTAINS: [[100, 1000], [100, 1002], [102, 1004]]

  - name: group_project_columns_survive_redaction
    config:
      redaction:
        allow:
          group: [100]
          project: [1000, 1002]
        deny:
          group: [101, 102]
          project: [1001, 1003, 1004]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}},
            {"id": "p", "entity": "Project"}
          ],
          "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
          "limit": 20
        }
      gql: |
        MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g, p LIMIT 20
    expect:
      node_count: 3
      referential_integrity: true
      nodes:
        Group:
          ids: [100]
        Project:
          ids: [1000, 1002]
      edges:
        CONTAINS: [[100, 1000], [100, 1002]]
      edge_exists:
        CONTAINS:
          - { from: Group, from_id: 100, to: Project, to_id: 1000 }
          - { from: Group, from_id: 100, to: Project, to_id: 1002 }

  - name: three_hop_all_allowed
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [100, 101, 102]
          project: [1000, 1001, 1002, 1003, 1004]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u, g, p LIMIT 30
    expect:
      node_count: 13
      referential_integrity: true
      nodes:
        User:
          ids: [1, 2, 3, 4, 5]
        Group:
          ids: [100, 101, 102]
        Project:
          ids: [1000, 1001, 1002, 1003, 1004]
      edges:
        MEMBER_OF: [[1, 100], [1, 102], [2, 100], [3, 101], [4, 101], [4, 102], [5, 101]]
        CONTAINS: [[100, 1000], [100, 1002], [101, 1001], [101, 1003], [102, 1004]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }
          - { from: User, from_id: 5, to: Group, to_id: 101 }
        CONTAINS:
          - { from: Group, from_id: 100, to: Project, to_id: 1000 }
          - { from: Group, from_id: 102, to: Project, to_id: 1004 }

  - name: three_hop_keeps_fully_authorized_paths
    config:
      redaction:
        allow:
          user: [1, 2]
          group: [100]
          project: [1000]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u, g, p LIMIT 30
    expect:
      node_count: 4
      nodes:
        User:
          ids: [1, 2]
        Group:
          ids: [100]
        Project:
          ids: [1000]
          absent: [1002]
      edges:
        MEMBER_OF: [[1, 100], [2, 100]]
        CONTAINS: [[100, 1000]]

  - name: three_hop_denied_projects_remove_only_their_paths
    config:
      redaction:
        allow:
          user: [1, 2, 3, 4, 5]
          group: [100, 101, 102]
          project: [1000, 1002, 1004]
        deny:
          project: [1001, 1003]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u, g, p LIMIT 30
    expect:
      node_count: 8
      nodes:
        User:
          ids: [1, 2, 4]
          absent: [3, 5]
        Group:
          ids: [100, 102]
          absent: [101]
        Project:
          ids: [1000, 1002, 1004]
          absent: [1001, 1003]
      edges:
        MEMBER_OF: [[1, 100], [1, 102], [2, 100], [4, 102]]
        CONTAINS: [[100, 1000], [100, 1002], [102, 1004]]

  - name: three_hop_single_path_keeps_ids_types_and_edges
    config:
      redaction:
        allow:
          user: [1]
          group: [100]
          project: [1000]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
            {"id": "g", "entity": "Group"},
            {"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}}
          ],
          "relationships": [
            {"type": "MEMBER_OF", "from": "u", "to": "g"},
            {"type": "CONTAINS", "from": "g", "to": "p"}
          ],
          "limit": 30
        }
      gql: |
        MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:`CONTAINS`]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 AND p.id >= 1 AND p.id <= 10000 RETURN u, g, p LIMIT 30
    expect:
      node_count: 3
      referential_integrity: true
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100]
        Project:
          ids: [1000]
      edges:
        MEMBER_OF: [[1, 100]]
        CONTAINS: [[100, 1000]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }
        CONTAINS:
          - { from: Group, from_id: 100, to: Project, to_id: 1000 }
