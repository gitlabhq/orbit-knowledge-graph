description: Grouping OR makes NOT closed apply to both work item IDs

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE (wi.id = 4001 OR wi.id = 4000) AND NOT wi.state = 'closed'
    RETURN wi.state ORDER BY wi.id LIMIT 10

expect:
  node_count: 1
  nodes:
    WorkItem:
      order: [4000]
      rows:
        - { id: 4000, state: opened }
