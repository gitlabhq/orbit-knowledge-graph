description: Cursor bounds apply to the whole OR expression without repeats or missing matches

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010
      AND (wi.id = 4001 OR NOT wi.state = 'closed')
    RETURN wi.state ORDER BY wi.id PAGE 2

expect:
  all_pages:
    node_ids:
      WorkItem: [4000, 4001, 4002, 4003, 4010]
    page_count: 3
    no_duplicate_ids: true
  pages:
    - node_count: 2
      nodes:
        WorkItem:
          order: [4000, 4001]
      has_more: true
    - node_count: 2
      nodes:
        WorkItem:
          order: [4002, 4003]
      has_more: true
    - node_count: 1
      nodes:
        WorkItem:
          order: [4010]
      has_more: false
