description: OR combines user and group properties with a membership property

query:
  gql: |
    MATCH (u:User)-[membership:MEMBER_OF]->(g:Group)
    WHERE u.id >= 1 AND u.id <= 7
      AND (u.username = 'alice' OR g.visibility_level = 'private' AND membership.source_id = 3)
    RETURN u.username, g.visibility_level LIMIT 20

expect:
  node_count: 5
  nodes:
    User:
      ids: [1, 3]
      rows:
        - { id: 1, username: alice }
        - { id: 3, username: charlie }
    Group:
      ids: [100, 101, 102]
  edges:
    MEMBER_OF: [[1, 100], [1, 102], [3, 101]]
  referential_integrity: true
