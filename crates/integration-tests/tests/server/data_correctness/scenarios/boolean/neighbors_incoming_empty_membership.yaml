description: Empty state membership removes the merge request center and its incoming author neighbor

query:
  gql: |
    MATCH (mr:MergeRequest {id: 2000})<-[:AUTHORED]-(n)
    WHERE mr.state IN []
    RETURN n

expect:
  node_count: 0
  nodes:
    MergeRequest:
      ids: []
  skip_requirements: [filter:state]
  edges:
    AUTHORED: []
