description: Cross-node OR counts each matching merge request once even when both branches match

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)
    WHERE u.id >= 1 AND u.id <= 7
      AND (u.username = 'alice' OR mr.id IN [2000, 2002])
    RETURN u{.username}, count(mr) AS mr_count LIMIT 10

expect:
  groups:
    u:
      entity: User
      ids: [1, 2]
      rows:
        - { entity: User, id: 1, values: { mr_count: 2 }, properties: { username: alice } }
        - { entity: User, id: 2, values: { mr_count: 1 }, properties: { username: bob } }
