description: Empty membership on a denormalized merge request state produces zero counts for both endpoints

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)
    WHERE u.id >= 1 AND u.id <= 1 AND mr.state IN []
    RETURN count(mr) AS mr_count, count(u) AS author_count

expect:
  skip_requirements: [filter:state]
  row_count: 1
  row_values:
    - { mr_count: 0, author_count: 0 }
