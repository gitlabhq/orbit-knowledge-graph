description: Double NOT preserves membership and does not turn NULL into a match

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010 AND NOT NOT wi.weight IN [3, 8]
    RETURN wi.weight ORDER BY wi.id LIMIT 10

expect:
  node_count: 2
  nodes:
    WorkItem:
      order: [4000, 4001]
      rows:
        - { id: 4000, weight: 3 }
        - { id: 4001, weight: 8 }
