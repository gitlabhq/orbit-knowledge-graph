description: AND NOT callee.name IN removes a call whose callee is in the exclusion list

query:
  gql: |
    MATCH (caller:Definition)-[:CALLS {project_id: 1000}]->(callee:Definition)
    WHERE caller.name = 'compile' AND NOT callee.name IN ['helper']
    RETURN caller.name, callee.name LIMIT 20

expect:
  node_count: 0
  skip_requirements: [filter:name]
  edges:
    CALLS: []
