description: A matching project OR branch cannot bypass the vulnerability role requirement

config:
  security:
    authorized_paths:
      - { path: "1/100/", access_level: 20 }
      - { path: "1/101/", access_level: 30 }
      - { path: "1/102/", access_level: 20 }

query:
  gql: |
    MATCH (p:Project)<-[:IN_PROJECT]-(v:Vulnerability)
    WHERE p.id >= 1000 AND p.id <= 1004
      AND (p.id = 1000 OR v.severity IN ['high', 'critical'])
    RETURN p{.name}, count(v) AS vuln_count LIMIT 10

expect:
  groups:
    p:
      entity: Project
      ids: [1001]
      rows:
        - { entity: Project, id: 1001, values: { vuln_count: 1 }, properties: { name: Private Project } }
