description: A denied intermediate group removes only the paths through it

config:
  redaction: { allow: { user: [1], group: [100], project: [1000, 1002, 1004] }, deny: { group: [102] } }

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "User", "node_ids": [1]},
        {"id": "end", "entity": "Project", "node_ids": [1000, 1002, 1004]}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
    }
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1002, 1004] RETURN p

expect:
  node_count: 4
  path_count: 2
  path_destinations:
    Project: [1000, 1002]
  nodes:
    Group: { ids: [100], absent: [102] }
