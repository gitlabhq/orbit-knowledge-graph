description: Shortest path from User 1 to Project 1000 via Group

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|`CONTAINS`*1..3]->(`end`:Project {id: 1000}) RETURN p

expect:
  referential_integrity: true
  path_count: 1
  nodes:
    User:
      ids: [1]
    Group:
      ids: [100]
    Project:
      ids: [1000]
  path_edges:
    - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 100, step: 0 }, { from: Group, from_id: 100, type: CONTAINS, to: Project, to_id: 1000, step: 1 }]
