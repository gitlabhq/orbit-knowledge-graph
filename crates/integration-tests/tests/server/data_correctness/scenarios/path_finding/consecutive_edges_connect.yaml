# source: crates/integration-tests/tests/server/data_correctness/path_finding.rs::path_finding_consecutive_edges_connect
description: Consecutive edges in each path share matching to/from endpoints

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "User", "node_ids": [1]},
        {"id": "end", "entity": "Project", "node_ids": [1000, 1004]}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3,
               "rel_types": ["MEMBER_OF", "CONTAINS"]}
    }
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|`CONTAINS`*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1004] RETURN p

expect:
  referential_integrity: true
  path_count: 2
