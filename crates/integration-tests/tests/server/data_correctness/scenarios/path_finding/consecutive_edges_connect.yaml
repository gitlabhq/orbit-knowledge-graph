description: Consecutive edges in each path share matching to/from endpoints

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|`CONTAINS`*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1004] RETURN p

expect:
  referential_integrity: true
  path_count: 2
  path_destinations:
    Project: [1000, 1004]
  path_edges:
    - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 100 }, { from: Group, from_id: 100, type: CONTAINS, to: Project, to_id: 1000 }]
    - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 102 }, { from: Group, from_id: 102, type: CONTAINS, to: Project, to_id: 1004 }]
