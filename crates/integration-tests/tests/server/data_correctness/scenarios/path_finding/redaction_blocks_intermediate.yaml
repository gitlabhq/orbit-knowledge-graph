description: Redaction blocking intermediate Group prevents path discovery

config:
  redaction:
    allow:
      user: [1]
      project: [1000]

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project {id: 1000}) RETURN p

expect:
  path_count: 0
