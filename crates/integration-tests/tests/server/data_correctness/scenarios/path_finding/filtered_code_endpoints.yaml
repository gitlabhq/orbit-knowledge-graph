description: Name-filtered Definition endpoints join CALLS hops only within one traversal path, so the cross-project run_query is unreachable

config:
  redaction:
    allow:
      project: [1000, 1001]

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "Definition", "filters": {"name": {"eq": "compile"}}},
        {"id": "end", "entity": "Definition", "filters": {"name": {"eq": "run_query"}}}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3,
               "rel_types": ["CALLS"]},
      "limit": 10
    }
  gql: |
    MATCH p = ANY SHORTEST (start:Definition)-[:CALLS*1..3]->(`end`:Definition) WHERE start.name = 'compile' AND `end`.name = 'run_query' RETURN p LIMIT 10

expect:
  referential_integrity: true
  path_count: 1
  nodes:
    Definition:
      ids: [12000, 12001, 12002]
      filters:
        name: { in: [compile, helper, run_query] }
  path_destinations:
    Definition: [12002]
  path_edges:
    - [{ from: Definition, from_id: 12000, type: CALLS, to: Definition, to_id: 12001 }, { from: Definition, from_id: 12001, type: CALLS, to: Definition, to_id: 12002 }]
