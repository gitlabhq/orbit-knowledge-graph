description: Path edge step indices are sequential starting from 0

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|`CONTAINS`*1..3]->(`end`:Project {id: 1000}) RETURN p

expect:
  referential_integrity: true
  path_count: 1
  path_edges:
    - [{ from: User, from_id: 1, type: MEMBER_OF, step: 0 }, { type: CONTAINS, to: Project, to_id: 1000, step: 1 }]
