# source: crates/integration-tests/tests/server/data_correctness/path_finding.rs::path_finding_step_indices_are_sequential
description: Path edge step indices are sequential starting from 0

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "User", "node_ids": [1]},
        {"id": "end", "entity": "Project", "node_ids": [1000]}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3,
               "rel_types": ["MEMBER_OF", "CONTAINS"]}
    }
  gql: |
    MATCH p = shortestPath((start:User {id: 1})-[:MEMBER_OF|`CONTAINS`*1..3]->(`end`:Project {id: 1000})) RETURN p

expect:
  referential_integrity: true
  path_count: 1
