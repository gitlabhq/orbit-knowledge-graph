description: id_range endpoint filters to MergeRequest, excludes Note and WorkItem

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:AUTHORED*1]->(`end`:MergeRequest) WHERE `end`.id >= 2000 AND `end`.id <= 2003 RETURN p

expect:
  referential_integrity: true
  path_count: 2
  path_endpoint_absent: [Note, WorkItem]
  path_destinations:
    MergeRequest: [2000, 2001]
