cases:
  - name: untyped_path_rejected
    description: A shortest path must name its relationship types; a wildcard is rejected
    query:
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[*1..3]->(`end`:Project {id: 1004}) RETURN p
    expect:
      compile_error: shortest paths require named relationship types

  - name: legacy_shortest_path_hint_names_a_type
    description: The legacy shortestPath() syntax points to the typed ANY SHORTEST form
    query:
      gql: |
        MATCH p = shortestPath((start:User {id: 1})-[*1..3]->(`end`:Project {id: 1004})) RETURN p
    expect:
      compile_error: -[:CONTAINS*1..3]->

  - name: negated_type_condition_rejected
    description: A negated type(r) condition leaves the path open to every other type and is rejected
    query:
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[r*1]->(`end`:Group {id: 100}) WHERE NOT type(r) = 'CONTAINS' RETURN p
    expect:
      compile_error: shortest paths require named relationship types

  - name: not_equal_type_condition_rejected
    description: A type(r) <> condition leaves the path open to every other type and is rejected
    query:
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[r*1]->(`end`:Group {id: 100}) WHERE type(r) <> 'CONTAINS' RETURN p
    expect:
      compile_error: shortest paths require named relationship types

  - name: named_types_find_the_path
    description: Naming the relationship types finds the same User -> Group -> Project path
    query:
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|CONTAINS*1..3]->(`end`:Project {id: 1004}) RETURN p
    expect:
      referential_integrity: true
      path_count: 1
      path_edges:
        - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 102 }, { from: Group, from_id: 102, type: CONTAINS, to: Project, to_id: 1004 }]

  - name: type_condition_in_list_finds_the_path
    description: A positive type(r) IN condition names the types of an untyped shortest path
    query:
      gql: |
        MATCH p = ANY SHORTEST (start:User {id: 1})-[r*1]->(`end`:Group {id: 102}) WHERE type(r) IN ['MEMBER_OF', 'CONTAINS'] RETURN p
    expect:
      path_count: 1
      path_edges:
        - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 102 }]
