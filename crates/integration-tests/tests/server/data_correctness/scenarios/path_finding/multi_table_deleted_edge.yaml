description: Multi-table shortest paths do not use a deleted edge version

config:
  unmerged_seed: true
  redaction:
    allow:
      ci_pipeline: [99000, 99001, 99002]
  extra_seed:
    gl_pipeline:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000 }
      - { id: 99001, traversal_path: "1/100/1000/", project_id: 1000, auto_canceled_by_id: 99002 }
      - { id: 99002, traversal_path: "1/100/1000/", project_id: 1000 }
    gl_ci_edge:
      - { traversal_path: "1/100/1000/", source_id: 99000, source_kind: Pipeline, relationship_kind: CHILD_OF, target_id: 99001, target_kind: Pipeline, _version: "2026-01-01 00:00:00", _deleted: false }
      - { traversal_path: "1/100/1000/", source_id: 99000, source_kind: Pipeline, relationship_kind: CHILD_OF, target_id: 99001, target_kind: Pipeline, _version: "2026-01-02 00:00:00", _deleted: true }
      - { traversal_path: "1/100/1000/", source_id: 99001, source_kind: Pipeline, relationship_kind: AUTO_CANCELED_BY, target_id: 99002, target_kind: Pipeline }

query:
  gql: |
    MATCH path = ANY SHORTEST (a:Pipeline {id: 99000})-[:CHILD_OF|AUTO_CANCELED_BY*1..2]->(b:Pipeline {id: 99002})
    RETURN path

expect:
  path_count: 0
