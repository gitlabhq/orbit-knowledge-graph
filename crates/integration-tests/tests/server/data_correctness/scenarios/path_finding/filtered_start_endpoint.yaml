description: Filtered start endpoint (username=alice) finds path to Project 1004

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User)-[:MEMBER_OF|`CONTAINS`*1..3]->(`end`:Project {id: 1004}) WHERE start.username = 'alice' RETURN p

expect:
  referential_integrity: true
  path_count: 1
  nodes:
    User:
      filters:
        username: { eq: alice }
  path_edges:
    - [{ from: User, from_id: 1, type: MEMBER_OF }, { type: CONTAINS, to: Project, to_id: 1004 }]
