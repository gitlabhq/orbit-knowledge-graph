config:
  extra_seed:
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 12001, source_kind: Definition, relationship_kind: CALLS, target_id: 12102, target_kind: Definition }

cases:
  - name: allowed_project
    description: Path between Definitions authorizes through the owning project
    config:
      redaction:
        allow:
          project: [1000]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "a", "entity": "Definition", "node_ids": [12000]},
            {"id": "b", "entity": "Definition", "node_ids": [12001]}
          ],
          "path": {"type": "shortest", "from": "a", "to": "b", "max_depth": 2,
                   "rel_types": ["CALLS"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (a:Definition {id: 12000})-[:CALLS*1..2]->(b:Definition {id: 12001}) RETURN p
    expect:
      referential_integrity: true
      path_count: 1
      nodes:
        Definition:
          ids: [12000, 12001]
      path_edges:
        - [{ from: Definition, from_id: 12000, type: CALLS, to: Definition, to_id: 12001, step: 0 }]

  - name: denied_project
    description: Denying the owning project redacts the Definition path
    config:
      redaction:
        deny:
          project: [1000]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "a", "entity": "Definition", "node_ids": [12000]},
            {"id": "b", "entity": "Definition", "node_ids": [12001]}
          ],
          "path": {"type": "shortest", "from": "a", "to": "b", "max_depth": 2,
                   "rel_types": ["CALLS"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (a:Definition {id: 12000})-[:CALLS*1..2]->(b:Definition {id: 12001}) RETURN p
    expect:
      path_count: 0

  - name: cross_project_allowed
    description: Path crossing into a second project is returned when both owning projects are allowed
    config:
      redaction:
        allow:
          project: [1000, 1001]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "a", "entity": "Definition", "node_ids": [12000]},
            {"id": "b", "entity": "Definition", "node_ids": [12102]}
          ],
          "path": {"type": "shortest", "from": "a", "to": "b", "max_depth": 3,
                   "rel_types": ["CALLS"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (a:Definition {id: 12000})-[:CALLS*1..3]->(b:Definition {id: 12102}) RETURN p
    expect:
      referential_integrity: true
      path_count: 1
      nodes:
        Definition:
          ids: [12000, 12001, 12102]

  - name: cross_project_denied_second_project
    description: Path crossing into a second project is redacted when only the first project is allowed
    config:
      redaction:
        allow:
          project: [1000]
    query:
      json: |
        {
          "query_type": "path_finding",
          "nodes": [
            {"id": "a", "entity": "Definition", "node_ids": [12000]},
            {"id": "b", "entity": "Definition", "node_ids": [12102]}
          ],
          "path": {"type": "shortest", "from": "a", "to": "b", "max_depth": 3,
                   "rel_types": ["CALLS"]}
        }
      gql: |
        MATCH p = ANY SHORTEST (a:Definition {id: 12000})-[:CALLS*1..3]->(b:Definition {id: 12102}) RETURN p
    expect:
      path_count: 0
