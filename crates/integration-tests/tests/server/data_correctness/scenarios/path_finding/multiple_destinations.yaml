description: Multiple destination node_ids return distinct paths to each project

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|`CONTAINS`*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1002, 1004] RETURN p

expect:
  referential_integrity: true
  path_count: 3
  path_destinations:
    Project: [1000, 1002, 1004]
