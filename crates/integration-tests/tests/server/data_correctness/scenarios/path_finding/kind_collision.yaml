description: Frontier intersection cannot join a group to a merge request with the same ID

config:
  redaction:
    allow:
      user: [1]
      group: [99000]
      project: [99001]
  extra_seed:
    gl_group:
      - { id: 99000, traversal_path: "1/100/99000/", name: audit_group }
    gl_project:
      - { id: 99001, traversal_path: "1/100/99001/", name: audit_project }
    gl_merge_request:
      - { id: 99000, traversal_path: "1/100/99001/", project_id: 99001, title: audit_merge_request }
    gl_edge:
      - { traversal_path: "1/100/99000/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 99000, target_kind: Group }
      - { traversal_path: "1/100/99001/", source_id: 99000, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 99001, target_kind: Project }

query:
  gql: |
    MATCH p = ANY SHORTEST (u:User {id: 1})-[:MEMBER_OF|IN_PROJECT*1..2]->(target:Project {id: 99001})
    RETURN p

expect:
  path_count: 0
