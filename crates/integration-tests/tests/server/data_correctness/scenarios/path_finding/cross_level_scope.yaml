description: Path finding connects a group to its project across namespace depths

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "Group", "node_ids": [100]},
        {"id": "end", "entity": "Project", "node_ids": [1000]}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3,
               "rel_types": ["CONTAINS"]}
    }
  gql: |
    MATCH p = ANY SHORTEST (start:Group {id: 100})-[:CONTAINS*1..3]->(`end`:Project {id: 1000}) RETURN p

expect:
  referential_integrity: true
  path_count: 1
  path_edges:
    - [{ from: Group, from_id: 100, type: CONTAINS, to: Project, to_id: 1000 }]
