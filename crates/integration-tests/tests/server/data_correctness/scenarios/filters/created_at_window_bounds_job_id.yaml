description: a created_at window on Job reads only the recent part, because the id lower bound skips the history part that FINAL would pull back in through the tombstone of an old job

config:
  redaction:
    allow:
      ci_build: [900]
  seed_parts:
    - gl_job:
        - { id: 100, name: old-a, status: failed, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2020-01-01 00:00:00", _version: "2020-01-01 00:00:00" }
        - { id: 300, name: old-b, status: failed, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2020-02-01 00:00:00", _version: "2020-02-01 00:00:00" }
        - { id: 500, name: old-c, status: success, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2020-03-01 00:00:00", _version: "2020-03-01 00:00:00" }
    - gl_job:
        - { id: 300, name: "", status: "", project_id: 0, traversal_path: "1/100/1000/", created_at: "2026-10-12 00:00:00", _version: "2026-10-12 00:00:00", _deleted: true }
        - { id: 900, name: new-a, status: failed, project_id: 1000, traversal_path: "1/100/1000/", created_at: "2026-10-12 00:00:00", _version: "2026-10-12 00:00:00", _deleted: false }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "j", "entity": "Job", "columns": ["name"],
                 "filters": {"created_at": {"gte": "2026-10-01T00:00:00Z"}}}],
      "order_by": "j.id",
      "limit": 10
    }
  gql: |
    MATCH (j:Job) WHERE j.created_at >= '2026-10-01' RETURN j.name ORDER BY j.id LIMIT 10

expect:
  sql_contains: ["_id_bound"]
  granules_read: [{ table: gl_job, granules: 1 }]
  skip_requirements: ["filter:created_at"]
  node_count: 1
  nodes:
    Job:
      order: [900]
      rows:
        - { id: 900, name: new-a }
