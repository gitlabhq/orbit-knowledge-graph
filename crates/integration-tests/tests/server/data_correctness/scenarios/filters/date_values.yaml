cases:
  - name: invalid_calendar_date_rejected
    description: A month or day outside the calendar is rejected
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": {"gte": "2024-13-45"}}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= '2024-02-30' RETURN n
    expect:
      compile_error: is not a valid date

  - name: non_leap_day_rejected
    description: February 29 is rejected outside a leap year
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= date('2023-02-29') RETURN n
    expect:
      compile_error: is not a valid date

  - name: invalid_time_rejected
    description: An hour outside the day, or a time without seconds, is rejected
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": {"gte": "2024-01-15T25:00:00Z"}}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= '2024-01-15T10:30' RETURN n
    expect:
      compile_error: is not a valid date

  - name: offset_rejected
    description: A time with a UTC offset is rejected; send UTC with Z instead
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": {"gte": "2024-01-15T12:30:00+02:00"}}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= datetime('2024-01-15T12:30:00+02:00') RETURN n
    expect:
      compile_error: is not a valid date

  - name: free_text_rejected
    description: Words and unix seconds are not dates
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": {"in": ["2024-01-15", "yesterday"]}}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= '1705314600' RETURN n
    expect:
      compile_error: is not a valid date

  - name: empty_value_rejected
    description: An empty string is not a date
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": {"gte": ""}}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= '' RETURN n
    expect:
      compile_error: is not a valid date

  - name: day_past_month_end_rejected
    description: A day past the end of its month is rejected
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= '2024-06-31' RETURN n
    expect:
      compile_error: is not a valid date

  - name: lowercase_separators_rejected
    description: The T separator and Z suffix must be uppercase
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= '2024-01-15t10:30:00z' RETURN n
    expect:
      compile_error: is not a valid date

  - name: surrounding_text_rejected
    description: Leading spaces and trailing text around a date are rejected
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": {"gte": " 2024-01-15"}}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= '2024-01-15 garbage' RETURN n
    expect:
      compile_error: is not a valid date

  - name: invalid_date_field_value_rejected
    description: A date field rejects an offset and an impossible calendar date
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "w", "entity": "WorkItem", "node_ids": [4000], "filters": {"due_date": "2024-06-10T10:00:00+02:00"}}]}
      gql: |
        MATCH (w:WorkItem {id: 4000}) WHERE w.due_date IN [date('2024-06-10'), date('2024-06-31')] RETURN w
    expect:
      compile_error: is not a valid date

  - name: date_field_rejects_time_of_day
    description: A date field takes only YYYY-MM-DD, because a time of day has no meaning on a date
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "w", "entity": "WorkItem", "node_ids": [4000], "filters": {"due_date": "2024-06-10T10:00:00Z"}}]}
      gql: |
        MATCH (w:WorkItem {id: 4000}) WHERE w.due_date = datetime('2024-06-10T10:00:00Z') RETURN w
    expect:
      compile_error: "is not a valid date; use YYYY-MM-DD"
      compile_error_not_contains: ["HH:MM:SS"]

  - name: date_field_bound_executes
    description: A valid date bound on a date field runs and excludes rows with no date
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "w", "entity": "WorkItem", "id_range": {"start": 4000, "end": 4010}, "filters": {"due_date": {"gte": "2024-01-01"}}}]}
      gql: |
        MATCH (w:WorkItem) WHERE w.id >= 4000 AND w.id <= 4010 AND w.due_date >= date('2024-01-01') RETURN w
    expect:
      node_count: 0
      nodes:
        WorkItem:
          ids: []
          filters:
            due_date: { gte: "2024-01-01" }

  - name: temporal_literal_on_text_rejected
    description: datetime() and date() compare only with date fields
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.note = datetime('2024-01-15T10:30:00Z') RETURN n
    expect:
      compile_error: datetime() and date() compare only with date fields

  - name: temporal_literal_on_integer_rejected
    description: date() is rejected against an integer field
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.noteable_id > date('2024-01-15') RETURN n
    expect:
      compile_error: datetime() and date() compare only with date fields

  - name: temporal_literal_in_property_map_rejected
    description: A property map cannot compare a text field with date()
    query:
      gql: |
        MATCH (n:Note {id: 3000, note: date('2024-01-15')}) RETURN n
    expect:
      compile_error: datetime() and date() compare only with date fields

  - name: date_only_bound_matches
    description: A date-only bound compares at midnight UTC, with or without a trailing Z
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": [{"gte": "2024-01-15"}, {"lt": "2024-01-16Z"}]}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at >= date('2024-01-15') AND n.created_at < '2024-01-16Z' RETURN n
    expect:
      node_count: 1
      nodes:
        Note:
          ids: [3000]
          filters:
            created_at: { gte: "2024-01-15T00:00:00Z", lt: "2024-01-16T00:00:00Z" }

  - name: exact_timestamp_formats_match
    description: The T, space, and trailing Z forms all match the same UTC timestamp
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": [{"eq": "2024-01-15T10:30:00Z"}, {"eq": "2024-01-15 10:30:00"}, {"eq": "2024-01-15T10:30:00"}]}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at = datetime('2024-01-15T10:30:00Z') AND n.created_at = '2024-01-15 10:30:00' AND n.created_at = '2024-01-15T10:30:00' RETURN n
    expect:
      node_count: 1
      nodes:
        Note:
          ids: [3000]
          filters:
            created_at: { eq: "2024-01-15T10:30:00Z" }

  - name: fractional_seconds_match
    description: Fractional seconds up to microseconds bound the timestamp precisely
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at > '2024-01-15T10:29:59.999999Z' AND n.created_at < '2024-01-15 10:30:00.5' RETURN n
    expect:
      node_count: 1
      nodes:
        Note:
          ids: [3000]
          filters:
            created_at: { eq: "2024-01-15T10:30:00Z" }

  - name: nanosecond_fraction_executes
    description: A nine-digit fraction is accepted and runs in ClickHouse
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at > '2024-01-15T10:29:59.123456789Z' RETURN n
    expect:
      node_count: 1
      nodes:
        Note:
          ids: [3000]
          filters:
            created_at: { gt: "2024-01-15T10:29:59Z" }

  - name: later_bound_excludes_the_row
    description: A valid bound after the timestamp returns nothing
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at > datetime('2024-01-15T10:30:00Z') RETURN n
    expect:
      node_count: 0
      nodes:
        Note:
          ids: []
          filters:
            created_at: { gt: "2024-01-15T10:30:00Z" }

  - name: timestamp_list_with_utc_suffix_matches
    description: A timestamp IN list whose elements end in Z runs and matches the listed timestamp
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "n", "entity": "Note", "node_ids": [3000], "filters": {"created_at": {"in": ["2024-01-15T10:30:00Z", "2024-01-16T00:00:00Z"]}}}]}
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at IN ['2024-01-15T10:30:00Z', '2024-01-16T00:00:00Z'] RETURN n
    expect:
      node_count: 1
      nodes:
        Note:
          ids: [3000]
          filters:
            created_at: { eq: "2024-01-15T10:30:00Z" }

  - name: temporal_literal_list_matches
    description: A list of datetime() literals ending in Z runs and matches the listed timestamp
    query:
      gql: |
        MATCH (n:Note {id: 3000}) WHERE n.created_at IN [datetime('2024-01-16T00:00:00Z'), datetime('2024-01-15T10:30:00Z')] RETURN n
    expect:
      node_count: 1
      nodes:
        Note:
          ids: [3000]
          filters:
            created_at: { eq: "2024-01-15T10:30:00Z" }

  - name: date_list_with_utc_suffix_executes
    description: A date IN list whose elements end in Z runs on a date field
    query:
      json: |
        {"query_type": "traversal", "nodes": [{"id": "w", "entity": "WorkItem", "id_range": {"start": 4000, "end": 4010}, "filters": {"due_date": {"in": ["2024-01-15Z", "2024-01-16Z"]}}}]}
      gql: |
        MATCH (w:WorkItem) WHERE w.id >= 4000 AND w.id <= 4010 AND w.due_date IN ['2024-01-15Z', '2024-01-16Z'] RETURN w
    expect:
      node_count: 0
      nodes:
        WorkItem:
          ids: []
          filters:
            due_date: { in: ["2024-01-15", "2024-01-16"] }
