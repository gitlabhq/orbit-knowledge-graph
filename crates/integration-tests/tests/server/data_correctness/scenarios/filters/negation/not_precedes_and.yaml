description: NOT binds before AND so the weight condition still restricts the result

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id IN [4000, 4001] AND NOT wi.state = 'closed' AND wi.weight = 3
    RETURN wi.state, wi.weight ORDER BY wi.id LIMIT 10

expect:
  node_count: 1
  nodes:
    WorkItem:
      order: [4000]
      filters:
        state: opened
        weight: 3
      rows:
        - { id: 4000, state: opened }
