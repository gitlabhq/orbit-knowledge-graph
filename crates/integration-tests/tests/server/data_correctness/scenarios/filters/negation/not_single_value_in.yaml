description: NOT IN with one value stays a NOT condition and drops the NULL weight

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"wi","entity":"WorkItem","id_range":{"start":4000,"end":4010},"not":{"weight":{"in":[3]}},"columns":["weight"]}],"limit":10}
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010 AND NOT wi.weight IN [3]
    RETURN wi.weight LIMIT 10

expect:
  node_count: 3
  nodes:
    WorkItem:
      ids: [4001, 4003, 4010]
      absent: [4000, 4002]
