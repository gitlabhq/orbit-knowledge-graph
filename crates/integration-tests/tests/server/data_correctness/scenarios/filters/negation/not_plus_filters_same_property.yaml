description: A filter and a not entry on the same property both apply

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"wi","entity":"WorkItem","id_range":{"start":4000,"end":4010},"filters":{"weight":{"gte":3}},"not":{"weight":{"in":[8,13]}},"columns":["weight"]}],"limit":10}
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010 AND wi.weight >= 3 AND NOT wi.weight IN [8, 13]
    RETURN wi.weight LIMIT 10

expect:
  node_count: 2
  nodes:
    WorkItem:
      ids: [4000, 4010]
      absent: [4001, 4002, 4003]
      filters:
        weight: { in: [3, 5] }
