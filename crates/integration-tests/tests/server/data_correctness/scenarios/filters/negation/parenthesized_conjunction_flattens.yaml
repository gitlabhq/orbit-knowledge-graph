description: A parenthesized AND with a complemented NOT matches like the same conditions without parentheses

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010 AND (wi.state = 'opened' AND NOT wi.weight = 3)
    RETURN wi.state, wi.weight LIMIT 10

expect:
  node_count: 2
  nodes:
    WorkItem:
      ids: [4003, 4010]
      absent: [4000, 4001, 4002]
      filters:
        state: opened
        weight: { in: [13, 5] }
