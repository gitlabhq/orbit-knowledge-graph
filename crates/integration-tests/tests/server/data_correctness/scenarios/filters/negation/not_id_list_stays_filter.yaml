description: NOT over an ID list stays a filter and does not become an ID selector

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010 AND wi.id < 4003 AND NOT wi.id IN [4000, 4001]
    RETURN wi.state LIMIT 10

expect:
  skip_requirements: ["filter:id"]
  node_count: 1
  nodes:
    WorkItem:
      ids: [4002]
