description: NOT IN an empty list includes NULL and non-NULL weights

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010 AND NOT wi.weight IN []
    RETURN wi.weight ORDER BY wi.id LIMIT 10

expect:
  node_count: 5
  nodes:
    WorkItem:
      order: [4000, 4001, 4002, 4003, 4010]
      rows:
        - { id: 4002, weight: null }
