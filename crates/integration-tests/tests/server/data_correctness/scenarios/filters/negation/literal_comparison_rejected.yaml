description: A comparison of two literals without NOT is rejected for the same reason

query:
  gql: |
    MATCH (wi:WorkItem {id: 4000}) WHERE 'private-query-literal' = 'private-query-literal' RETURN wi.id

expect:
  compile_error: "each comparison starts with a property such as n.name"
  compile_error_not_contains: ["private-query-literal"]
