description: NOT IN a nonempty list excludes both matching weights and NULL weights

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010 AND NOT wi.weight IN [3, 8]
    RETURN wi.weight ORDER BY wi.id LIMIT 10

expect:
  node_count: 2
  nodes:
    WorkItem:
      order: [4003, 4010]
      rows:
        - { id: 4003, weight: 13 }
        - { id: 4010, weight: 5 }
