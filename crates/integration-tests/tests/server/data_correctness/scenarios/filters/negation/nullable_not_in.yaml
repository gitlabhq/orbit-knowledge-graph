description: NOT IN a nonempty list excludes both matching weights and NULL weights

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"wi","entity":"WorkItem","id_range":{"start":4000,"end":4010},"not":{"weight":{"in":[3,8]}},"columns":["weight"]}],"order_by":"wi.id","limit":10}
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010 AND NOT wi.weight IN [3, 8]
    RETURN wi.weight ORDER BY wi.id LIMIT 10

expect:
  node_count: 2
  nodes:
    WorkItem:
      order: [4003, 4010]
      rows:
        - { id: 4003, weight: 13 }
        - { id: 4010, weight: 5 }
