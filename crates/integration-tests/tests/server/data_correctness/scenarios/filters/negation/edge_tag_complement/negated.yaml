description: >-
  NOT reads the same edge tag as its positive twin, so the two counts add up
  to all five memberships. Only the dangling user 77 matches.

config:
  extra_seed:
    gl_edge:
      - { traversal_path: "1/100/", source_id: 5, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: [state:active], target_tags: [] }
      - { traversal_path: "1/100/", source_id: 77, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: [state:blocked], target_tags: [] }

query:
  gql: |
    MATCH (u:User)-[r:MEMBER_OF]->(g:Group {id: 100})
    WHERE NOT (r.source_id < 70 AND u.state = 'active')
    RETURN g{.name}, count(u) AS members LIMIT 10

expect:
  groups:
    g:
      entity: Group
      ids: [100]
      rows:
        - { entity: Group, id: 100, values: { members: 1 } }
