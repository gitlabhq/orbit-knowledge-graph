description: NOT over a group of IS NOT NULL checks keeps the rows where either value is NULL

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010
      AND NOT (wi.weight IS NOT NULL AND wi.milestone_id IS NOT NULL)
    RETURN wi.weight LIMIT 10

expect:
  node_count: 3
  nodes:
    WorkItem:
      ids: [4002, 4003, 4010]
      absent: [4000, 4001]
