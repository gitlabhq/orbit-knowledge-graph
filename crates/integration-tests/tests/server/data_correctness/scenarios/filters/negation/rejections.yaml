cases:
  - name: boolean_operator_no_literal_echo
    description: The OR and XOR rejections do not echo a string literal from the query
    query:
      gql: |
        MATCH (u:User {id: 1})
        WHERE u.username = 'private-query-literal' XOR u.id = 2
        RETURN u
    expect:
      compile_error: OR and XOR are not supported
      compile_error_not_contains: [private-query-literal, Orbit query syntax]

  - name: invalid_value_rejected
    description: Negated membership validates element types
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000}) WHERE NOT wi.id IN ['bad'] RETURN wi.id
    expect: { compile_error: not an integer }

  - name: is_true_rejected_names_not
    description: IS TRUE is not supported, and the syntax error names NULL or NOT NULL instead of a grammar rule
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000}) WHERE wi.confidential IS TRUE RETURN wi.id
    expect:
      compile_error: expected NULL or NOT NULL
      compile_error_not_contains: [expected Not, Rule]

  - name: literal_comparison_rejected
    description: A comparison of two literals without NOT is rejected for the same reason
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000}) WHERE 'private-query-literal' = 'private-query-literal' RETURN wi.id
    expect:
      compile_error: each comparison starts with a property such as n.name
      compile_error_not_contains: [private-query-literal]

  - name: negated_ids_need_anchor
    description: Negated ID bounds do not become a selective positive anchor
    query:
      gql: MATCH (wi:WorkItem) WHERE NOT (wi.id IN [4000] AND wi.id >= 4000 AND wi.id <= 4010) RETURN wi.id
    expect: { compile_error: add filters or node_ids to at least one node (NOT conditions do not count) }

