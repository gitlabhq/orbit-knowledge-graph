  - name: not_group_literal_rejected
    description: A literal comparison inside a NOT group is rejected, even next to a property comparison
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000}) WHERE NOT ('private-query-literal' = 'x' AND wi.weight = 1) RETURN wi.id
    expect:
      compile_error: each comparison starts with a property such as n.name
      compile_error_not_contains: [private-query-literal]

  - name: not_group_neighbors_rejected
    description: Neighbors queries reject NOT over a grouped condition
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000})-->(n)
        WHERE NOT (wi.state = 'closed' AND wi.weight = 8)
        RETURN n
    expect: { compile_error: "neighbors queries support NOT only on =, <>, IS NULL, and IS NOT NULL conditions" }

  - name: not_group_path_rejected
    description: Shortest paths reject NOT over a list membership
    query:
      gql: |
        MATCH p = ANY SHORTEST (u:User {id: 1})-[*1..2]->(g:Group)
        WHERE g.id IN [100, 102] AND NOT g.visibility_level IN ['internal']
        RETURN p
    expect: { compile_error: "shortest paths support NOT only on =, <>, IS NULL, and IS NOT NULL conditions" }

  - name: not_in_empty_rejected
    description: NOT IN over an empty list is rejected, so no condition becomes a constant true
    query:
      gql: |
        MATCH (wi:WorkItem)
        WHERE wi.id >= 4000 AND wi.id <= 4010 AND NOT wi.weight IN []
        RETURN wi.weight LIMIT 10
    expect: { compile_error: IN requires 1-100 values }

  - name: not_in_operator_rejected
    description: GQL rejects the x NOT IN [...] spelling and names the supported form
    query:
      gql: |
        MATCH (wi:WorkItem)
        WHERE wi.id >= 4000 AND wi.id <= 4010 AND wi.state NOT IN ['closed']
        RETURN wi.state LIMIT 10
    expect:
      compile_error: write NOT n.property IN [...] to exclude values
      compile_error_not_contains: [closed]

  - name: not_list_only_needs_anchor
    description: A node whose only condition is NOT over a list is not anchored
    query:
      gql: |
        MATCH (u:User) WHERE NOT u.id IN [1] RETURN u
    expect: { compile_error: add filters or node_ids to at least one node (NOT conditions do not count) }

  - name: not_literal_comparison_rejected
    description: NOT over a comparison of two literals is rejected. A comparison must start with a property of a pattern variable.
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000}) WHERE NOT 'private-query-literal' = 'private-query-literal' RETURN wi.id
    expect:
      compile_error: { gql: each comparison starts with a property such as n.name }
      compile_error_not_contains: [private-query-literal]

  - name: not_literal_left_rejected
    description: A literal on the left of a comparison is rejected, even when the right side is a property
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000}) WHERE NOT 'private-query-literal' < wi.title RETURN wi.id
    expect:
      compile_error: each comparison starts with a property such as n.name
      compile_error_not_contains: [private-query-literal]

  - name: not_neighbors_endpoint_rejected
    description: A NOT list on the neighbors endpoint gets the neighbors shape message
    query:
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF]->(x)
        WHERE NOT x.name IN ['private-query-literal']
        RETURN x
    expect:
      compile_error: neighbors requires one labeled center and an unfiltered, unlabeled endpoint at one hop
      compile_error_not_contains: [undefined, private-query-literal]

  - name: not_path_relationship_rejected
    description: A NOT list on the shortest-path relationship gets the path shape message
    query:
      gql: |
        MATCH p = ANY SHORTEST (u:User {id: 1})-[r]->(g:Group {id: 100})
        WHERE NOT r.source_id IN [1, 2]
        RETURN p
    expect:
      compile_error: path finding supports outgoing paths starting at one hop, without relationship predicates
      compile_error_not_contains: [undefined]

  - name: not_virtual_contains_rejected
    description: NOT cannot wrap a condition on a virtual column
    query:
      gql: |
        MATCH (f:File {id: 13000})
        WHERE NOT f.content CONTAINS 'secret'
        RETURN f.name
    expect:
      compile_error: virtual columns cannot be used under NOT
      compile_error_not_contains: [secret]

  - name: not_virtual_eq_rejected
    description: A complemented NOT on a virtual column follows the virtual column operator rules
    query:
      gql: |
        MATCH (f:File {id: 13000})
        WHERE NOT f.content = 'secret'
        RETURN f.name
    expect:
      compile_error: virtual column
      compile_error_not_contains: [secret]

  - name: or_rejected
    description: GQL rejects OR with a message that points to AND, NOT, and IN
    query:
      gql: |
        MATCH (wi:WorkItem)
        WHERE wi.id = 4000 OR wi.id = 4001
        RETURN wi.state LIMIT 10
    expect:
      compile_error: OR and XOR are not supported; combine conditions with AND and NOT, or use IN [...] to match one of several values
      compile_error_not_contains: [Orbit query syntax, "4001"]

  - name: same_property_comparison_rejected
    description: A comparison of a property with itself is rejected, with or without NOT
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000}) WHERE NOT wi.weight = wi.weight RETURN wi.id
    expect: { compile_error: every condition must compare a property of a matched node or relationship }

  - name: unknown_property_rejected
    description: Negated groups validate every referenced property
    query:
      gql: |
        MATCH (u:User {id: 1}) WHERE NOT (u.username = 'alice' AND u.missing = 'value') RETURN u.id
    expect: { compile_error: does not exist }

  - name: variable_edge_rejected
    description: A variable-length relationship list cannot be used as a scalar predicate
    query:
      gql: |
        MATCH (a:Definition {id: 12000})-[calls:CALLS*1..2]->(b:Definition) WHERE NOT calls.source_id = 12000 RETURN b.id
    expect: { compile_error: relationship-list }

  - name: xor_rejected
    description: GQL rejects XOR, including inside a negated group
    query:
      gql: |
        MATCH (wi:WorkItem {id: 4000})
        WHERE NOT (wi.state = 'closed' XOR wi.weight = 3)
        RETURN wi.state LIMIT 10
    expect:
      compile_error: OR and XOR are not supported
      compile_error_not_contains: [Orbit query syntax, closed]
