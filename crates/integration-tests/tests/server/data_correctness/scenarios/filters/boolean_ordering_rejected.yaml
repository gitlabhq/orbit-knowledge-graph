description: Ordering operators reject boolean properties in both query languages

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"w","entity":"WorkItem","node_ids":[4001],"filters":{"confidential":{"gt":false}}}]}
  gql: |
    MATCH (w:WorkItem {id: 4001}) WHERE w.confidential > false RETURN w.id

expect:
  compile_error: operator "gt" is not supported on Bool
