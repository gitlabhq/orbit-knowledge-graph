cases:
  - name: aggregation_negation_oracle_boolean
    description: A complemented NOT on a Vulnerability boolean is no oracle for a Reporter
    config:
      security:
        org_id: 1
        paths: [1/100/]
        access_level: 20
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","columns":["name"],"node_ids":[1000]},{"id":"v","entity":"Vulnerability","filters":{"resolved_on_default_branch":{"ne":true}}}],"relationships":[{"type":"IN_PROJECT","from":"v","to":"p"}],"group_by":["p"],"aggregations":[{"count":"v","as":"c"}],"limit":10}
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(v:Vulnerability) WHERE NOT v.resolved_on_default_branch = true RETURN p{.id, .name}, count(v) AS c LIMIT 10
    expect:
      empty_aggregation: true
      nodes:
        Project:
          absent: [1000]

  - name: aggregation_negation_oracle_complement_twin
    description: The positive twin of the severity NOT is also empty, so the pair never reveals the total
    config:
      security:
        org_id: 1
        paths: [1/100/]
        access_level: 20
    query:
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(v:Vulnerability) WHERE NOT NOT v.severity = 'critical' RETURN p{.id, .name}, count(v) AS c LIMIT 10
    expect:
      empty_aggregation: true
      nodes:
        Project:
          absent: [1000]

  - name: aggregation_negation_oracle_enum_ne
    description: A complemented NOT on Vulnerability severity is no oracle for a Reporter
    config:
      security:
        org_id: 1
        paths: [1/100/]
        access_level: 20
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","columns":["name"],"node_ids":[1000]},{"id":"v","entity":"Vulnerability","filters":{"severity":{"ne":"critical"}}}],"relationships":[{"type":"IN_PROJECT","from":"v","to":"p"}],"group_by":["p"],"aggregations":[{"count":"v","as":"c"}],"limit":10}
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(v:Vulnerability) WHERE NOT v.severity = 'critical' RETURN p{.id, .name}, count(v) AS c LIMIT 10
    expect:
      empty_aggregation: true
      nodes:
        Project:
          absent: [1000]

  - name: aggregation_negation_oracle_enum_not_in
    description: NOT IN on Vulnerability severity is no oracle for a Reporter
    config:
      security:
        org_id: 1
        paths: [1/100/]
        access_level: 20
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1000],"columns":["id","name"]},{"id":"v","entity":"Vulnerability","not":{"severity":{"in":["critical","high"]}}}],"relationships":[{"type":"IN_PROJECT","from":"v","to":"p"}],"group_by":["p"],"aggregations":[{"count":"v","as":"c"}],"limit":10}
      gql: |
        MATCH (p:Project {id: 1000})<-[:IN_PROJECT]-(v:Vulnerability) WHERE NOT v.severity IN ['critical', 'high'] RETURN p{.id, .name}, count(v) AS c LIMIT 10
    expect:
