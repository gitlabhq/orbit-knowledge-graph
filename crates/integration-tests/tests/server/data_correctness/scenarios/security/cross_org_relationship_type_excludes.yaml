description: >
  type(r) does not widen access across org boundaries. User 1 authored
  MRs in both org 1 and org 2. A traversal that types the relationship
  with WHERE type(r) = 'AUTHORED', scoped to org 1, must not return
  org-2 MR 9100.

config:
  security: { org_id: 1, paths: ["1/"] }

query:
  gql: |
    MATCH (u:User {id: 1})-[r]->(mr:MergeRequest)
    WHERE type(r) = 'AUTHORED'
    RETURN u, mr.title, type(r) LIMIT 50

expect:
  node_count: 3
  nodes:
    MergeRequest:
      ids: [2000, 2001]
      absent: [9100]
  edges:
    AUTHORED: [[1, 2000], [1, 2001]]
