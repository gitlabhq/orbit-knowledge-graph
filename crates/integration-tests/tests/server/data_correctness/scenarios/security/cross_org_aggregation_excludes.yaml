description: Org-1 aggregation counts members only in org-1 groups

config:
  security: { org_id: 1, paths: ["1/"] }

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { member_count: 3 } }
      absent:
        - { entity: Group, id: 900 }
