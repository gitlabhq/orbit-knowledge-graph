# source: crates/integration-tests/tests/server/data_correctness/security.rs::admin_only_admin_aggregation_compiles
description: Admin MAX aggregation on admin-only field compiles successfully

config:
  security: admin

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
        {"id": "g", "entity": "Group", "columns": ["name"]}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"max": "u.is_admin", "as": "has_admin"}],
      "limit": 10
    }

expect:
  skip_requirements: [node_count, aggregation, order_by]
