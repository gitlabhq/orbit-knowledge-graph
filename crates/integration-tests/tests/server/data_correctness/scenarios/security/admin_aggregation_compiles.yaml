description: Admin MAX aggregation on admin-only timestamp compiles successfully

config:
  security: admin

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
        {"id": "g", "entity": "Group", "columns": ["name"]}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"max": "u.updated_at", "as": "latest_update"}],
      "limit": 10
    }
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN g{.id, .name}, max(u.updated_at) AS latest_update LIMIT 10

expect:
  compile_only: true
