description: Non-admin naming admin-only columns is rejected instead of silently getting fewer columns

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User",
                 "id_range": {"start": 1, "end": 10000},
                 "columns": ["username", "is_admin", "is_auditor"],
                 "node_ids": [1]}],
      "limit": 10
    }
  gql: |
    MATCH (u:User {id: 1}) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.is_admin, u.is_auditor LIMIT 10

expect:
  compile_error_contains: [is_admin, administrator]
