# source: crates/integration-tests/tests/server/data_correctness/security.rs::search_multi_path_returns_union_of_scopes
description: Multiple scope paths return the union of both namespaces

config:
  security: { org_id: 1, paths: ["1/100/", "1/102/"] }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]}],
      "limit": 10
    }

expect:
  node_count: 4
  nodes:
    Project:
      ids: [1000, 1002, 1004, 1010]
      absent: [1001, 1003]
