description: Admin caller bypasses User-only aggregation guard

config:
  security: admin

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]}],
      "aggregations": [{"count": "u", "as": "cnt"}],
      "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN count(u) AS cnt LIMIT 10

expect:
  compile_only: true
