# source: crates/integration-tests/tests/server/data_correctness/security.rs::search_scoped_path_excludes_other_namespaces
description: Scoping to path 1/100/ returns only projects under that namespace

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]}],
      "limit": 10
    }

expect:
  node_count: 3
  nodes:
    Project:
      ids: [1000, 1002, 1010]
      absent: [1001, 1003, 1004]
