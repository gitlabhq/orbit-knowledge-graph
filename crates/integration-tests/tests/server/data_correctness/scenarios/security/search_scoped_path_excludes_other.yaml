description: Scoping to path 1/100/ returns only projects under that namespace

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  gql: |
    MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.name LIMIT 10

expect:
  node_count: 3
  nodes:
    Project:
      ids: [1000, 1002, 1010]
      absent: [1001, 1003, 1004]
