description: >
  A NOT query over a project that does not exist returns the same empty
  result as a NOT query over a project the caller cannot see.

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  gql: |
    MATCH (p:Project) WHERE p.id IN [1999] AND NOT p.name = 'x' RETURN p.name

expect:
  skip_requirements: [node_ids, "filter:name"]
  node_count: 0
