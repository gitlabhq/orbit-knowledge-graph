description: Org-1 scoped search returns only org-1 projects, not org-2

config:
  security: { org_id: 1, paths: ["1/"] }

query:
  gql: |
    MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.name LIMIT 50

expect:
  node_count: 6
  nodes:
    Project:
      ids: [1000, 1001, 1002, 1003, 1004, 1010]
      absent: [9000]
