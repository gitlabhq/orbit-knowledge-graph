description: Non-admin order_by on admin-only field rejects at compile

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]}],
      "order_by": "-u.updated_at",
      "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username ORDER BY u.updated_at DESC LIMIT 10

expect:
  compile_error: true
  compile_error_contains: [updated_at, order_by, administrator]
