# source: crates/integration-tests/tests/server/data_correctness/security.rs::admin_only_non_admin_order_by_rejects_at_compile
description: Non-admin order_by on admin-only field rejects at compile

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]}],
      "order_by": "-u.is_admin",
      "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username ORDER BY u.is_admin DESC LIMIT 10

expect:
  compile_error: true
