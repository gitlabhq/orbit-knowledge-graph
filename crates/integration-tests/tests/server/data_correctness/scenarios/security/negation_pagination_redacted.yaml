description: NOT pages skip a redaction-denied row without repeating or losing a visible row

config:
  redaction:
    allow:
      work_item: [4000, 4001, 4003, 4010]

query:
  gql: |
    MATCH (wi:WorkItem)
    WHERE wi.id >= 4000 AND wi.id <= 4010
      AND NOT (NOT wi.id = 4001 AND wi.state = 'closed')
    RETURN wi.state ORDER BY wi.id PAGE 2

expect:
  all_pages:
    node_ids:
      WorkItem: [4000, 4001, 4003, 4010]
    page_count: 3
    no_duplicate_ids: true
  pages:
    - node_count: 2
      nodes:
        WorkItem:
          order: [4000, 4001]
      has_more: true
    - node_count: 1
      nodes:
        WorkItem:
          order: [4003]
          absent: [4002]
      has_more: true
    - node_count: 1
      nodes:
        WorkItem:
          order: [4010]
      has_more: false
