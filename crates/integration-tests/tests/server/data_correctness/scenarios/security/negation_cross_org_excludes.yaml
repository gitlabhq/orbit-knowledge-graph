description: >
  NOT conditions cannot reach another organization. User 1 authored opened
  merge requests in org 1 and org 2; the pushed-down NOT and the NOT group
  both match org-2 MR 9100, and the org-1 scope still removes it.

config:
  security: { org_id: 1, paths: ["1/"] }

query:
  gql: |
    MATCH (u:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)
    WHERE NOT mr.state = 'merged' AND NOT (mr.state = 'closed' AND mr.title CONTAINS 'Org')
    RETURN u, mr.title LIMIT 50

expect:
  node_count: 3
  nodes:
    User:
      ids: [1]
    MergeRequest:
      ids: [2000, 2001]
      absent: [9100]
      filters:
        state: opened
  edges:
    AUTHORED: [[1, 2000], [1, 2001]]
