description: >
  NOT type(r) matches that redaction denies return neither the merge
  request nor its edge.

config:
  redaction:
    allow:
      user: [1]
      merge_request: [2000, 2002]

query:
  gql: |
    MATCH (u:User {id: 1})-[r]->(mr:MergeRequest)
    WHERE NOT type(r) = 'APPROVED'
    RETURN u, mr.title, type(r) LIMIT 50

expect:
  node_count: 2
  nodes:
    MergeRequest:
      ids: [2000]
      absent: [2001, 2002]
  edges:
    AUTHORED: [[1, 2000]]
  edge_absent:
    AUTHORED: [[1, 2001]]
