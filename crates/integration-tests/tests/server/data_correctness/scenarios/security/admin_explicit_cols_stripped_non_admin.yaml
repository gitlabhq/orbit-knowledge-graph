# source: crates/integration-tests/tests/server/data_correctness/security.rs::admin_only_non_admin_explicit_columns_silently_stripped
description: Non-admin explicit admin-only columns are silently stripped from results

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User",
                 "id_range": {"start": 1, "end": 10000},
                 "columns": ["username", "is_admin", "is_auditor"],
                 "node_ids": [1]}],
      "limit": 10
    }
  gql: |
    MATCH (u:User {id: 1}) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.is_admin, u.is_auditor LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      ids: [1]
      prop_present: [username]
      prop_absent: [is_admin, is_auditor]
