description: Admin naming admin-only columns gets their values

config:
  security: admin

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "columns": ["username", "is_admin", "is_auditor"], "node_ids": [1]}],
      "limit": 10
    }
  gql: |
    MATCH (u:User {id: 1}) RETURN u{.username, .is_admin, .is_auditor} LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      ids: [1]
      rows:
        - { id: 1, username: alice, is_admin: false, is_auditor: false }
