description: Relationship traversal_path filter returns matching edges within scope

config:
  security: { org_id: 1, paths: ["1/"] }

query:
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF {traversal_path: '1/102/'}]->(g:Group) RETURN u.username, g.name, g.traversal_path LIMIT 10

expect:
  node_count: 2
  nodes:
    User:
      ids: [1]
    Group:
      ids: [102]
  edges:
    MEMBER_OF: [[1, 102]]
