# source: crates/integration-tests/tests/server/data_correctness/security.rs::aggregation_user_joined_runtime_returns_expected_counts
description: User joined to Group aggregation returns expected member counts at runtime

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
        {"id": "u", "entity": "User"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"count": "u", "as": "member_count"}],
      "limit": 10
    }

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { member_count: 3 } }
      absent:
        - { entity: Group, id: 101 }
        - { entity: Group, id: 102 }
