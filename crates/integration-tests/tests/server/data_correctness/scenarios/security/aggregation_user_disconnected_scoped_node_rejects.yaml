description: Aggregation with User and declared-but-disconnected Group rejects because User scan would be unbounded

query: |
  MATCH (u:User {email: 'target@example.com'}), (g:Group) RETURN g, count(u) AS hit LIMIT 1

expect:
  compile_error: true
  compile_error_contains: [one connected pattern]
  compile_error_not_contains: ["target@example.com"]
