description: Non-admin filtering on is_admin rejects at compile time

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "filters": {"is_admin": true}}],
      "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.is_admin = true RETURN u LIMIT 10

expect:
  compile_error: true
  compile_error_contains: [is_admin, administrator]
