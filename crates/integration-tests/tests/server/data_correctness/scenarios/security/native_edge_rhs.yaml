description: Native edge predicates reject property comparisons before authorization
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"p","entity":"Project"}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"p"}]}
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF]->(p:Project) RETURN u, p
expect:
  predicates:
    - not:
        relationship: 0
        property: source_id
        op: eq
        rhs_column: [u, is_admin]
  compile_error: relationship property comparisons are unsupported
