# source: crates/integration-tests/tests/server/data_correctness/security.rs::admin_only_non_admin_count_aggregation_on_auditor_rejects_at_compile
description: Non-admin COUNT aggregation on is_auditor rejects at compile

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}},
        {"id": "u", "entity": "User", "columns": ["username"]}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"count": "u.is_auditor", "as": "auditor_count"}],
      "limit": 10
    }

expect:
  compile_error: "is_auditor"
