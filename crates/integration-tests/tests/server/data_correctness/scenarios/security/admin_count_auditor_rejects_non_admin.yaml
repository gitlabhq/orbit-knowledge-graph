description: Non-admin COUNT aggregation on is_auditor rejects at compile

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g, count(u.is_auditor) AS auditor_count LIMIT 10

expect:
  compile_error: true
  compile_error_contains: [is_auditor, aggregation]
