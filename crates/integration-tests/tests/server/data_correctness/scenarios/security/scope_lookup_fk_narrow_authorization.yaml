description: FK scope lookups preserve narrower authorization

config:
  security: { paths: ["1/100/1000/", "1/100/200/"] }

query:
  gql: |
    MATCH (mr:MergeRequest {project_id: 1000})
    RETURN mr.project_id LIMIT 20

expect:
  node_count: 4
  nodes:
    MergeRequest:
      ids: [2000, 2001, 2004, 2005]
      filters: { project_id: 1000 }
