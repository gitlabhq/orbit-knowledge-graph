description: Filters intersect with scope — only public projects within 1/100/

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  gql: |
    MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 AND p.visibility_level = 'public' RETURN p.name, p.visibility_level LIMIT 10

expect:
  node_count: 2
  nodes:
    Project:
      ids: [1000, 1010]
      filters:
        visibility_level: "public"
