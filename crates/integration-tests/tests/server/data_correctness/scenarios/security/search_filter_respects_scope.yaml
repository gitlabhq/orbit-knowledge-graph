# source: crates/integration-tests/tests/server/data_correctness/security.rs::search_with_filter_respects_scope
description: Filters intersect with scope — only public projects within 1/100/

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000},
                 "columns": ["name", "visibility_level"],
                 "filters": {"visibility_level": "public"}}],
      "limit": 10
    }
  gql: |
    MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 AND p.visibility_level = 'public' RETURN p.name, p.visibility_level LIMIT 10

expect:
  node_count: 2
  nodes:
    Project:
      ids: [1000, 1010]
      filters:
        visibility_level: "public"
