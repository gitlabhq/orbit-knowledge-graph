config:
  duckdb: true

cases:
  - name: return_column_rejected
    description: Local and remote queries cannot return traversal_path
    query:
      gql: |
        MATCH (f:File {id: 13000}) RETURN f.name, f.traversal_path
    expect:
      compile_error: traversal_path

  - name: order_by_rejected
    description: Local and remote queries cannot sort by traversal_path
    query:
      gql: |
        MATCH (f:File {id: 13000}) RETURN f ORDER BY f.traversal_path
    expect:
      compile_error: traversal_path

  - name: group_by_rejected
    description: Local and remote aggregations cannot group by traversal_path
    query:
      gql: |
        MATCH (f:File {id: 13000})-[:DEFINES]->(d:Definition) RETURN f.traversal_path AS path, count(d) AS n
    expect:
      compile_error: traversal_path

  - name: node_filter_rejected
    description: Local and remote queries cannot filter on traversal_path
    query:
      gql: |
        MATCH (f:File) WHERE f.traversal_path = '1/100/1000/' RETURN f
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: negated_filter_rejected
    description: Local and remote queries cannot negate a traversal_path condition
    query:
      gql: |
        MATCH (f:File {id: 13000}) WHERE NOT f.traversal_path STARTS WITH '1/100/' RETURN f
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: relationship_filter_rejected
    description: Local and remote relationships cannot filter on traversal_path
    query:
      gql: |
        MATCH (f:File {id: 13000})-[r:DEFINES]->(d:Definition) WHERE r.traversal_path = '1/100/1000/' RETURN d
    expect:
      compile_error: private edge column "traversal_path"
      compile_error_not_contains: [1/100/]

  - name: property_comparison_rejected
    description: Local and remote queries cannot compare traversal_path with another property
    query:
      gql: |
        MATCH (f:File {id: 13000})-[:DEFINES]->(d:Definition) WHERE f.traversal_path = d.traversal_path RETURN d
    expect:
      compile_error: traversal_path

  - name: default_columns_leave_it_out
    description: Default columns on local and remote queries leave out traversal_path
    query:
      gql: |
        MATCH (f:File {id: 13000}) RETURN f
    expect:
      node_count: 1
      nodes:
        File:
          ids: [13000]
          prop_present: [name]
          prop_absent: [traversal_path]

  - name: wildcard_columns_leave_it_out
    description: Wildcard columns on local and remote queries leave out traversal_path
    query:
      gql: |
        MATCH (f:File {id: 13000}) RETURN properties(f)
    expect:
      node_count: 1
      nodes:
        File:
          ids: [13000]
          prop_present: [name, path]
          prop_absent: [traversal_path]
