description: Native node comparisons reject administrator-only right-hand properties
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]}]}
  gql: |
    MATCH (u:User {id: 1}) RETURN u
expect:
  predicates:
    - not: {node: u, property: private_profile, op: eq, rhs_column: [u, is_admin]}
  compile_error: administrator
