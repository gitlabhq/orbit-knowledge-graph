description: Narrow scope 1/101/ finds no paths to targets in 1/100/ or 1/102/

config:
  security: { org_id: 1, paths: ["1/101/"] }

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1004] RETURN p

expect:
  node_count: 0
  total_edge_count: 0
  referential_integrity: true
  path_count: 0
