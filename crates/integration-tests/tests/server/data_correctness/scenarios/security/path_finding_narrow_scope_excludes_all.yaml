# source: crates/integration-tests/tests/server/data_correctness/security.rs::path_finding_narrow_scope_excludes_all_targets
description: Narrow scope 1/101/ finds no paths to targets in 1/100/ or 1/102/

config:
  security: { org_id: 1, paths: ["1/101/"] }

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "User", "node_ids": [1]},
        {"id": "end", "entity": "Project", "node_ids": [1000, 1004]}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
    }
  gql: |
    MATCH p = shortestPath((start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project)) WHERE `end`.id IN [1000, 1004] RETURN p

expect:
  node_count: 0
  path_count: 0
