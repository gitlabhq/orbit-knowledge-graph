description: Admin wildcard columns include admin-only fields with values

config:
  security: admin

query:
  gql: |
    MATCH (u:User {id: 1}) RETURN properties(u) LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      ids: [1]
      rows:
        - { id: 1, is_admin: false, is_auditor: false }
