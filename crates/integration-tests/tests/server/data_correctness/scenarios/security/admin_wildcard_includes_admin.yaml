# source: crates/integration-tests/tests/server/data_correctness/security.rs::admin_only_admin_wildcard_columns_includes_admin_fields
description: Admin wildcard columns include admin-only fields with values

config:
  security: admin

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "columns": "*", "node_ids": [1]}],
      "limit": 10
    }

expect:
  node_count: 1
  nodes:
    User:
      ids: [1]
      prop_present: [is_admin, is_auditor]
