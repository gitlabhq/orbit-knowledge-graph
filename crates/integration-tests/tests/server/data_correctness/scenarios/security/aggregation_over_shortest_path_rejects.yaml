# source: crates/integration-tests/tests/server/data_correctness/security.rs::aggregation_over_shortest_path_rejects_at_compile
description: Aggregation over a shortest path rejects at compile for both frontends

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}},
        {"id": "p", "entity": "Project"}
      ],
      "path": {"type": "shortest", "from": "u", "to": "p", "max_depth": 3},
      "group_by": ["p"],
      "aggregations": [{"count": "u", "as": "hit"}],
      "limit": 10
    }
  gql: |
    MATCH path = ANY SHORTEST (u:User)-[*1..3]->(p:Project) WHERE u.id >= 1 AND u.id <= 10000 RETURN p, count(u) AS hit LIMIT 10

expect:
  compile_error: "aggregation over shortest paths is not supported"
