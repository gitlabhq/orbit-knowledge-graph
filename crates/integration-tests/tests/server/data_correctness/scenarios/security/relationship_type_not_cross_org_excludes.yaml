description: >
  NOT type(r) only narrows the relationship types. User 1 authored MR 9100
  in org 2; NOT type(r) = 'APPROVED' scoped to org 1 must not return it.

config:
  security: { org_id: 1, paths: ["1/"] }

query:
  gql: |
    MATCH (u:User {id: 1})-[r]->(mr:MergeRequest)
    WHERE NOT type(r) = 'APPROVED'
    RETURN u, mr.title, type(r) LIMIT 50

expect:
  node_count: 3
  nodes:
    MergeRequest:
      ids: [2000, 2001]
      absent: [9100, 2002]
  edges:
    AUTHORED: [[1, 2000], [1, 2001]]
