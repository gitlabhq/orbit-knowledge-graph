description: Traversal path starts_with filter returns matching descendants within scope

config:
  security: { org_id: 1, paths: ["1/"] }

query:
  gql: |
    MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 AND p.traversal_path STARTS WITH '1/100/200/' RETURN p.name, p.traversal_path LIMIT 10

expect:
  node_count: 1
  nodes:
    Project:
      count: 1
      ids: [1010]
      filters:
        traversal_path: { starts_with: "1/100/200/" }
