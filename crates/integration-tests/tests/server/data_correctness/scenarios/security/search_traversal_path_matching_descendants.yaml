# source: crates/integration-tests/tests/server/data_correctness/security.rs::search_traversal_path_filter_returns_matching_descendants
description: Traversal path starts_with filter returns matching descendants within scope

config:
  security: { org_id: 1, paths: ["1/"] }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "p", "entity": "Project",
                 "id_range": {"start": 1, "end": 10000},
                 "columns": ["name", "traversal_path"],
                 "filters": {"traversal_path": {"starts_with": "1/100/200/"}}}],
      "limit": 10
    }

expect:
  node_count: 1
  nodes:
    Project:
      count: 1
      ids: [1010]
      filters:
        traversal_path: { starts_with: "1/100/200/" }
