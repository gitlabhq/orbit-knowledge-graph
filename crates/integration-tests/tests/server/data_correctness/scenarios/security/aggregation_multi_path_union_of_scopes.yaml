# source: crates/integration-tests/tests/server/data_correctness/security.rs::aggregation_multi_path_returns_union_of_scopes
description: Multi-path aggregation returns union of scopes across both authorized paths

config:
  security: { org_id: 1, paths: ["1/100/", "1/102/"] }

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
        {"id": "u", "entity": "User"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"count": "u", "as": "member_count"}],
      "limit": 10
    }
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { member_count: 3 } }
        - { entity: Group, id: 102, values: { member_count: 2 } }
      absent:
        - { entity: Group, id: 101 }
