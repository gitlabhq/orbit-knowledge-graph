description: Non-admin path_finding with dynamic_columns wildcard strips admin-only fields

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:MEMBER_OF|`CONTAINS`*1..3]->(`end`:Project {id: 1000}) RETURN properties(p)

expect:
  referential_integrity: true
  path_count: 1
  path_edges:
    - [{ from: User, from_id: 1, type: MEMBER_OF, to: Group, to_id: 100 }, { from: Group, from_id: 100, type: CONTAINS, to: Project, to_id: 1000 }]
  nodes:
    User:
      ids: [1]
      prop_present: [username, name, state]
      prop_absent: [is_admin, is_auditor]
      rows:
        - { id: 1, username: alice, name: Alice Admin, state: active }
