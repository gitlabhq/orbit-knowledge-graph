cases:
  - name: non_admin_group_by_rejected
    description: A non-admin cannot group by an admin-only field
    query:
      json: |
        {"query_type": "aggregation", "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}}, {"id": "u", "entity": "User"}], "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}], "group_by": ["u.is_admin"], "aggregations": [{"count": "u", "as": "members"}], "limit": 10}
      gql: |
        MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN u.is_admin AS is_admin, count(u) AS members LIMIT 10
    expect:
      compile_error_contains: [group_by, is_admin, administrator]

  - name: admin_group_by_compiles
    description: An admin can group by an admin-only field
    config:
      security: admin
    query:
      json: |
        {"query_type": "aggregation", "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}}, {"id": "u", "entity": "User"}], "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}], "group_by": ["u.is_admin"], "aggregations": [{"count": "u", "as": "members"}], "limit": 10}
      gql: |
        MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN u.is_admin AS is_admin, count(u) AS members LIMIT 10
    expect:
      compile_only: true
