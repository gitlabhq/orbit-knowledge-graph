description: Non-admin neighbors with dynamic_columns wildcard strips admin-only fields

query:
  gql: |
    MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(n) RETURN g, properties(n)

expect:
  node_count: 4
  nodes:
    Group:
      ids: [100]
    User:
      ids: [1, 2, 6]
      prop_present: [username]
      prop_absent: [is_admin, is_auditor]
  edges:
    MEMBER_OF: [[1, 100], [2, 100], [6, 100]]
