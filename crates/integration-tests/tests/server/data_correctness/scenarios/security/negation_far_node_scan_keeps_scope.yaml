description: >
  A NOT on the far node of a traversal reads that node's table, narrowed to
  the edge keys. The table scan carries the caller's traversal_path filter,
  and the NOT applies to the latest row.

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"g","entity":"Group","not":{"name":{"contains":"secret"}},"columns":["name"]}],"relationships":[{"type":"MEMBER_OF","from":"u","to":"g"}],"limit":30}
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF]->(g:Group)
    WHERE NOT g.name CONTAINS 'secret'
    RETURN g.name

expect:
  compile_only: true
  sql_contains:
    - "WHERE (startsWith(g.traversal_path, '1/') AND g.id IN (SELECT id FROM _narrow_g))"
    - "AS g WHERE ((NOT multiSearchAny(lower(g.name), [lower('secret')]))"
