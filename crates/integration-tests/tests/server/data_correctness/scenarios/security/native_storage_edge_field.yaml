description: Grouped predicates cannot read undeclared physical columns
config:
  ontology_overlay: queryable_edge_fields
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[12000]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b"}]}
  gql: |
    MATCH (a:Definition {id: 12000})-[:CALLS]->(b:Definition) RETURN b
expect:
  predicates:
    - not: {relationship: 0, property: internal_marker, op: eq, value: 1}
  compile_error: unknown edge column
