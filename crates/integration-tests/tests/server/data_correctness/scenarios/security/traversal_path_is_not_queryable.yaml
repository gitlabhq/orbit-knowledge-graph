cases:
  - name: return_column_rejected
    description: A query cannot return traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (g:Group {id: 100}) RETURN g.name, g.traversal_path LIMIT 10
    expect:
      compile_error: traversal_path

  - name: order_by_rejected
    description: A query cannot sort by traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (g:Group {id: 100}) RETURN g ORDER BY g.traversal_path LIMIT 10
    expect:
      compile_error: traversal_path

  - name: group_by_rejected
    description: An aggregation cannot group by traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(u:User) RETURN g.traversal_path AS path, count(u) AS members LIMIT 10
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: node_filter_rejected
    description: A node cannot filter on traversal_path, even inside the caller's scope
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project) WHERE p.traversal_path STARTS WITH '1/100/' RETURN p LIMIT 10
    expect:
      compile_error: traversal_path

  - name: null_check_rejected
    description: A null check cannot read traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project {id: 1000}) WHERE p.traversal_path IS NOT NULL RETURN p
    expect:
      compile_error: traversal_path

  - name: node_property_map_rejected
    description: A node property map cannot pin traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project {traversal_path: '1/100/1000/'}) RETURN p LIMIT 10
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: negated_node_filter_rejected
    description: NOT cannot wrap a traversal_path condition
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project {id: 1000}) WHERE NOT p.traversal_path STARTS WITH '2/' RETURN p.id
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/, 2/]

  - name: relationship_filter_rejected
    description: A relationship cannot filter on traversal_path, even inside the caller's scope
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (u:User {id: 1})-[:MEMBER_OF {traversal_path: '1/100/'}]->(g:Group) RETURN u, g LIMIT 10
    expect:
      compile_error: private edge column "traversal_path"

  - name: negated_relationship_filter_rejected
    description: NOT cannot wrap a relationship traversal_path condition
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (g:Group {id: 100})-[c:CONTAINS]->(p:Project) WHERE NOT c.traversal_path = '1/100/1000/' RETURN p.id
    expect:
      compile_error: private edge column "traversal_path"
      compile_error_not_contains: [1/100/]

  - name: projection_rejected
    description: A node projection cannot include traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (g:Group {id: 100}) RETURN g{.name, .traversal_path} LIMIT 10
    expect:
      compile_error: traversal_path

  - name: aggregate_rejected
    description: An aggregate cannot read traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (g:Group {id: 100}) RETURN count(g.traversal_path) AS n
    expect:
      compile_error: traversal_path

  - name: equality_and_list_filters_rejected
    description: Equality and IN filters on traversal_path are rejected like prefix filters
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project) WHERE p.traversal_path = '1/100/1000/' RETURN p LIMIT 10
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: negated_in_scope_filter_rejected
    description: NOT cannot wrap a traversal_path condition even when the literal is inside the caller's scope
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project {id: 1000}) WHERE NOT p.traversal_path STARTS WITH '1/100/1000/' RETURN p.id
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: negated_null_check_rejected
    description: A JSON not entry with is_null on traversal_path is rejected
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project {id: 1000}) WHERE NOT p.traversal_path IS NULL RETURN p.id
    expect:
      compile_error: traversal_path

  - name: double_negation_rejected
    description: A double NOT cannot hide a traversal_path condition
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project {id: 1000}) WHERE NOT NOT p.traversal_path STARTS WITH '2/' RETURN p.id
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/, 2/]

  - name: grouped_negation_rejected
    description: A NOT group cannot contain a traversal_path condition
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project {id: 1000}) WHERE NOT (p.traversal_path STARTS WITH '1/100/' AND p.name = 'x') RETURN p.id
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: property_comparisons_rejected
    description: traversal_path cannot appear on either side of a property comparison
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project) WHERE g.traversal_path = p.traversal_path RETURN p
    expect:
      compile_error: traversal_path

  - name: left_side_comparison_rejected
    description: traversal_path cannot be the left side of a comparison with another property
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (p:Project {id: 1000}) WHERE p.traversal_path = p.full_path RETURN p
    expect:
      compile_error: traversal_path

  - name: relationship_where_filter_rejected
    description: A WHERE condition on a relationship cannot filter on traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (u:User {id: 1})-[r:MEMBER_OF]->(g:Group) WHERE r.traversal_path = '1/100/' RETURN g LIMIT 10
    expect:
      compile_error: private edge column "traversal_path"
      compile_error_not_contains: [1/100/]

  - name: path_endpoint_filter_rejected
    description: A shortest-path endpoint cannot filter on traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH p = ANY SHORTEST (g:Group {id: 100})-[:CONTAINS*1..2]->(q:Project) WHERE q.traversal_path STARTS WITH '1/100/' RETURN p
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: neighbors_center_filter_rejected
    description: A neighbors center cannot filter on traversal_path
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (g:Group)-[]-(x) WHERE g.traversal_path = '1/100/' RETURN x
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]

  - name: global_entity_filter_rejected
    description: An entity without a namespace has no traversal_path to filter on
    config:
      security: { org_id: 1, paths: ["1/100/"] }
    query:
      gql: |
        MATCH (u:User {id: 1}) WHERE u.traversal_path = '1/100/' RETURN u
    expect:
      compile_error: traversal_path
      compile_error_not_contains: [1/100/]
