description: An anchor the user cannot resolve leaves the authorization chain in force and returns nothing outside it

cases:
  - name: project_outside_authorized_paths
    config:
      security: { paths: ["1/102/"] }
    query:
      json: |
        {
            "query_type": "traversal",
            "nodes": [{"id": "p", "entity": "Project", "node_ids": [1000], "columns": ["name"]}],
            "limit": 10
        }
      gql: |
        MATCH (p:Project {id: 1000}) RETURN p.name LIMIT 10
    expect:
      sql_contains: ["= '/') AND startsWith(p.traversal_path, '1/102/'))"]
      skip_requirements: [node_ids]
      node_count: 0

  - name: deleted_project_beside_a_live_one
    config:
      extra_seed:
        gl_project:
          - { id: 5556, name: Gone Project, full_path: public-group/gone-project, visibility_level: public, traversal_path: "1/100/5556/", _version: "2024-06-01 00:00:00", _deleted: true }
    query:
      json: |
        {
            "query_type": "traversal",
            "nodes": [{"id": "p", "entity": "Project", "node_ids": [1000, 5556], "columns": ["name"]}],
            "limit": 10
        }
      gql: |
        MATCH (p:Project) WHERE p.id IN [1000, 5556] RETURN p.name LIMIT 10
    expect:
      sql_contains: ["= '/') OR ((SELECT", "(_scope.id = 5556)"]
      node_count: 1
      nodes:
        Project:
          ids: [1000]
          absent: [5556]

  - name: sentinel_path_row_beside_an_unresolved_anchor
    config:
      security: { paths: ["1/102/"] }
      extra_seed:
        gl_project:
          - { id: 1000, name: Sentinel Project, full_path: sentinel/project, visibility_level: public, traversal_path: "0/" }
    query:
      json: |
        {
            "query_type": "traversal",
            "nodes": [{"id": "p", "entity": "Project", "node_ids": [1000], "columns": ["name"]}],
            "limit": 10
        }
      gql: |
        MATCH (p:Project {id: 1000}) RETURN p.name LIMIT 10
    expect:
      sql_contains: ["= '/') AND startsWith(p.traversal_path, '1/102/'))"]
      skip_requirements: [node_ids]
      node_count: 0

  - name: sentinel_path_edge_beside_an_unresolved_anchor
    config:
      security: { paths: ["1/102/"] }
      extra_seed:
        gl_edge:
          - { traversal_path: "0/", source_id: 100, source_kind: Group, relationship_kind: CONTAINS, target_id: 1002, target_kind: Project }
    query:
      gql: |
        MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project) RETURN p.name LIMIT 10
    expect:
      sql_contains: ["= '/') AND startsWith(_orbit_edge_0.traversal_path, '1/102/'))"]
      skip_requirements: [node_ids]
      node_count: 0
      edge_count:
        CONTAINS: 0

  - name: guest_only_context_keeps_the_fail_closed_filter
    config:
      security:
        org_id: 1
        authorized_paths:
          - { path: "1/100/", access_level: 10 }
    query:
      json: |
        {
            "query_type": "traversal",
            "nodes": [{"id": "p", "entity": "Project", "node_ids": [1000], "columns": ["name"]}],
            "limit": 10
        }
      gql: |
        MATCH (p:Project {id: 1000}) RETURN p.name LIMIT 10
    expect:
      sql_contains: ["WHERE (false AND"]
      sql_not_contains: ["= '/') AND"]
      skip_requirements: [node_ids]
      node_count: 0
