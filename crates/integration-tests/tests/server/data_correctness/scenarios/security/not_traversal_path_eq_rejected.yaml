description: >
  A JSON not entry on traversal_path is rejected even when its operator has
  an exact complement, and the error does not echo the path.

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"p","entity":"Project","node_ids":[1000],"not":{"traversal_path":"1/100/1000/"}}],"limit":30}

expect:
  compile_error: "traversal_path cannot be used under NOT; Orbit scopes every query to your authorized paths"
  compile_error_not_contains: ["1/100/"]
