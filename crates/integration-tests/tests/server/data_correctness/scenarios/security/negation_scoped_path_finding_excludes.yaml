description: >
  A complemented NOT on a path endpoint keeps the caller's scope. Group 102
  is internal and outside 1/100/, so only the path to group 100 remains.

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  json: |
    {"query_type":"path_finding","nodes":[{"id":"u","entity":"User","node_ids":[1]},{"id":"g","entity":"Group","node_ids":[100,101,102],"not":{"visibility_level":"private"}}],"path":{"type":"shortest","from":"u","to":"g","max_depth":2,"rel_types":["*"]}}
  gql: |
    MATCH p = ANY SHORTEST (u:User {id: 1})-[*1..2]->(g:Group)
    WHERE g.id IN [100, 101, 102] AND NOT g.visibility_level = 'private'
    RETURN p

expect:
  path_destinations:
    Group: [100]
  nodes:
    Group:
      filters:
        visibility_level: public
