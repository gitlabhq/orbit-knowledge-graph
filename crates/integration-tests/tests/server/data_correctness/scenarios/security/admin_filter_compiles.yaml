description: Admin can filter on is_admin and get matching results

config:
  security: admin

query:
  gql: |
    MATCH (u:User {id: 1, is_admin: false}) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.is_admin LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      ids: [1]
      filters:
        is_admin: false
