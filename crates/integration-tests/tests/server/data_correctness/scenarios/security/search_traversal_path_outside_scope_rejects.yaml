# source: crates/integration-tests/tests/server/data_correctness/security.rs::search_traversal_path_filter_outside_scope_rejects_at_compile
description: Traversal path filter above JWT scope rejects at compile

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "p", "entity": "Project",
                 "filters": {"traversal_path": {"starts_with": "1/"}}}],
      "limit": 10
    }
  gql: |
    MATCH (p:Project) WHERE p.traversal_path STARTS WITH '1/' RETURN p LIMIT 10

expect:
  compile_error: "authorized traversal_path scope"
