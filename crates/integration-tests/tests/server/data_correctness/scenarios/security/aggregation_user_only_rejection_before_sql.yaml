query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [{
        "id": "u", "entity": "User",
        "filters": {"email": "victim@example.com"}
      }],
      "aggregations": [{"count": "u", "as": "oracle"}],
      "limit": 1
    }

expect:
  # Rust test only has negative assertions: !contains("v2_gl_user") && !contains("victim@example.com")
  compile_error: true
