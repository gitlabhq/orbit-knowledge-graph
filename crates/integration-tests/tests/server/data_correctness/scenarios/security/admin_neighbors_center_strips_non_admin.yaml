description: Non-admin neighbors dynamic wildcard strips admin-only fields from center node

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}],
      "neighbors": {"direction": "outgoing", "rel_types": ["MEMBER_OF"]},
      "options": {"dynamic_columns": "*"}
    }
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF]->(n) RETURN u, properties(n)

expect:
  node_count: 3
  nodes:
    User:
      ids: [1]
      prop_present: [username, name, state]
      prop_absent: [is_admin, is_auditor]
      rows:
        - { id: 1, username: alice, name: Alice Admin, state: active }
    Group:
      ids: [100, 102]
  edges:
    MEMBER_OF: [[1, 100], [1, 102]]
