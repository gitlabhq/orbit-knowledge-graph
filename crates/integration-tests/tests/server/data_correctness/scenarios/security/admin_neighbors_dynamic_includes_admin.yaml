description: Admin neighbors with dynamic_columns wildcard includes admin-only fields

config:
  security: admin

query:
  gql: |
    MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(n) RETURN g, properties(n)

expect:
  node_count: 4
  nodes:
    Group:
      ids: [100]
    User:
      ids: [1, 2, 6]
      rows:
        - { id: 1, is_admin: false, is_auditor: false }
  edges:
    MEMBER_OF: [[1, 100], [2, 100], [6, 100]]
