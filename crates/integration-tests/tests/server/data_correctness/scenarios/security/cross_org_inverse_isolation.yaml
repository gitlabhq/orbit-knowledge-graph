# source: crates/integration-tests/tests/server/data_correctness/security.rs::cross_org_inverse_isolation
description: Org-2 context sees only org-2 projects

config:
  security: { org_id: 2, paths: ["2/"] }
  redaction:
    allow:
      user: [1]
      group: [900]
      project: [9000]
      merge_request: [9100]

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "p", "entity": "Project", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]}],
      "limit": 50
    }

expect:
  nodes:
    Project:
      ids: [9000]
      absent: [1000, 1001, 1002, 1003, 1004]
