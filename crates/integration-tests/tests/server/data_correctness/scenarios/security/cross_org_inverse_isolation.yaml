description: Org-2 context sees only org-2 projects

config:
  security: { org_id: 2, paths: ["2/"] }
  redaction:
    allow:
      user: [1]
      group: [900]
      project: [9000]
      merge_request: [9100]

query:
  gql: |
    MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.name LIMIT 50

expect:
  node_count: 1
  nodes:
    Project:
      ids: [9000]
      absent: [1000, 1001, 1002, 1003, 1004]
