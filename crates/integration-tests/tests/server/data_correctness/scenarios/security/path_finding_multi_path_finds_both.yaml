description: Multi-path scope finds paths to targets in both namespaces

config:
  security: { org_id: 1, paths: ["1/100/", "1/102/"] }

query:
  gql: |
    MATCH p = ANY SHORTEST (start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project) WHERE `end`.id IN [1000, 1004] RETURN p

expect:
  referential_integrity: true
  path_count: 2
  path_destinations:
    Project: [1000, 1004]
