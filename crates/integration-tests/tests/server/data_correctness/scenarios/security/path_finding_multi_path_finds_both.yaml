# source: crates/integration-tests/tests/server/data_correctness/security.rs::path_finding_multi_path_scope_finds_both
description: Multi-path scope finds paths to targets in both namespaces

config:
  security: { org_id: 1, paths: ["1/100/", "1/102/"] }

query:
  json: |
    {
      "query_type": "path_finding",
      "nodes": [
        {"id": "start", "entity": "User", "node_ids": [1]},
        {"id": "end", "entity": "Project", "node_ids": [1000, 1004]}
      ],
      "path": {"type": "shortest", "from": "start", "to": "end", "max_depth": 3, "rel_types": ["CONTAINS", "MEMBER_OF"]}
    }
  gql: |
    MATCH p = shortestPath((start:User {id: 1})-[:`CONTAINS`|MEMBER_OF*1..3]->(`end`:Project)) WHERE `end`.id IN [1000, 1004] RETURN p

expect:
  referential_integrity: true
  path_count: 2
