description: Storage deletion flags are not exposed as graph edge fields
query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[12000]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b","filters":{"_deleted":true}}]}
  gql: |
    MATCH (a:Definition {id: 12000})-[:CALLS {_deleted: true}]->(b:Definition) RETURN b
expect:
  compile_error: unknown edge column
