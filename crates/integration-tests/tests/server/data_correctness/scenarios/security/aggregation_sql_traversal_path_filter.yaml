description: Compiled aggregation SQL contains startsWith traversal_path filter

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  compile_only: true
  sql_contains: ["startsWith", "traversal_path", "1/100/"]
