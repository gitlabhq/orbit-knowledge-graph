description: Variable-depth traversal follows CALLS variants across both edge tables

config:
  ontology_overlay: variant_routes
  extra_seed:
    gl_file:
      - { id: 11000, path: "crates/compiler/src/lib.rs", project_id: 1000, branch: main, traversal_path: "1/100/1000/" }
    gl_edge:
      - { source_id: 11000, source_kind: File, target_id: 12000, target_kind: Definition, relationship_kind: CALLS, traversal_path: "1/100/1000/", _deleted: false }

query:
  gql: |
    MATCH (file:File {id: 11000})-[:CALLS*1..2]->(callee:Definition) RETURN file, callee LIMIT 10

expect:
  sql_contains: ["gl_edge", "gl_code_edge", "target_kind = 'Definition'"]
  node_count: 3
  nodes:
    File:
      ids: [11000]
    Definition:
      ids: [12000, 12001]
  edges:
    CALLS: [[11000, 12000], [11000, 12001]]
  referential_integrity: true
