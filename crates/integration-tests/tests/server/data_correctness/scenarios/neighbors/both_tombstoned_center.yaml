cases:
  - name: both_tombstoned_center_among_pinned_ids
    description: Neighbors in both directions of two pinned centers skip the center whose latest row is a tombstone, even while its edges and its self-loop are live
    query:
      gql: |
        MATCH (g:Group)-[:MEMBER_OF|`CONTAINS`]-(n) WHERE g.id IN [99541, 99543] RETURN g, n
    expect:
      node_count: 3
      nodes:
        Group: { ids: [99541, 99544] }
        User: { ids: [99540] }
      edges:
        MEMBER_OF: [[99540, 99541]]
        CONTAINS: [[99541, 99544]]

  - name: both_tombstoned_center_across_edge_tables
    description: Neighbors of a pinned project whose latest row is a tombstone return nothing from any edge table its relationship routes to
    query:
      gql: |
        MATCH (p:Project {id: 99560})<-[:IN_PROJECT]-(n) RETURN p, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:IN_PROJECT"]
      node_count: 0

  - name: both_tombstoned_center_without_default_key
    description: Neighbors of a pinned merge request diff whose latest row is a tombstone return nothing
    query:
      gql: |
        MATCH (d:MergeRequestDiff {id: 99570})<-[:HAS_DIFF]-(n) RETURN d, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:HAS_DIFF"]
      node_count: 0

  - name: both_tombstoned_center_single_id_incoming_only
    description: Neighbors of one pinned center whose latest row is a tombstone return nothing when every relationship reaches it as the target
    query:
      gql: |
        MATCH (g:Group {id: 99543})-[:MEMBER_OF]-(n) RETURN g, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:MEMBER_OF"]
      node_count: 0

  - name: both_tombstoned_center_single_id
    description: Neighbors in both directions of one pinned center whose latest row is a tombstone return nothing
    query:
      gql: |
        MATCH (g:Group {id: 99543})-[:MEMBER_OF|`CONTAINS`]-(n) RETURN g, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:MEMBER_OF", "relationship:CONTAINS"]
      node_count: 0

  - name: both_tombstoned_center_without_node_row
    description: Neighbors of a pinned center that has no node row return nothing, even while its edges are live
    query:
      gql: |
        MATCH (g:Group {id: 99546})-[:MEMBER_OF|`CONTAINS`]-(n) RETURN g, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:MEMBER_OF", "relationship:CONTAINS"]
      node_count: 0

  - name: both_tombstoned_center_without_traversal_path
    description: Outgoing neighbors of a pinned user whose latest row is a tombstone return nothing, even while its edges are live
    query:
      gql: |
        MATCH (u:User {id: 99547})-[:MEMBER_OF]->(n) RETURN u, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:MEMBER_OF"]
      node_count: 0

  - name: both_tombstoned_center_sharing_a_path
    description: Pinned centers on one traversal path skip the tombstoned center on both the scope-carrying arm and the cross-scope arm
    query:
      gql: |
        MATCH (w:WorkItem)-[:RELATED_TO|`CONTAINS`]->(n) WHERE w.id IN [99550, 99552] RETURN w, n
    expect:
      node_count: 3
      nodes:
        WorkItem: { ids: [99550, 99551, 99555] }
      edges:
        RELATED_TO: [[99550, 99551]]
        CONTAINS: [[99550, 99555]]
