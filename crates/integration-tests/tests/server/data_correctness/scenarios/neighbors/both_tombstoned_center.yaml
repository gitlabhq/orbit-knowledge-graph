cases:
  - name: both_tombstoned_center_among_pinned_ids
    description: Neighbors in both directions of two pinned centers skip the center whose latest row is a tombstone, even while its edges are live
    query:
      gql: |
        MATCH (g:Group)-[:MEMBER_OF|`CONTAINS`]-(n) WHERE g.id IN [99541, 99543] RETURN g, n
    expect:
      node_count: 3
      nodes:
        Group: { ids: [99541, 99544] }
        User: { ids: [99540] }
      edges:
        MEMBER_OF: [[99540, 99541]]
        CONTAINS: [[99541, 99544]]

  - name: both_tombstoned_center_unpinned
    description: Neighbors in both directions of an unpinned center filtered on an edge tag skip a center whose latest row is a tombstone, even while its edge is live
    query:
      gql: |
        MATCH (w:WorkItem)-[:RELATED_TO]-(n) WHERE w.state = 'opened' RETURN w, n
    expect:
      skip_requirements: ["filter:state"]
      node_count: 2
      nodes:
        WorkItem: { ids: [99550, 99551] }
      edges:
        RELATED_TO: [[99550, 99551]]

  - name: both_tombstoned_center_single_id_incoming_only
    description: Neighbors of one pinned center whose latest row is a tombstone return nothing when every relationship reaches it as the target
    query:
      gql: |
        MATCH (g:Group {id: 99543})-[:MEMBER_OF]-(n) RETURN g, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:MEMBER_OF"]
      node_count: 0

  - name: both_tombstoned_center_single_id
    description: Neighbors in both directions of one pinned center whose latest row is a tombstone return nothing
    query:
      gql: |
        MATCH (g:Group {id: 99543})-[:MEMBER_OF|`CONTAINS`]-(n) RETURN g, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:MEMBER_OF", "relationship:CONTAINS"]
      node_count: 0
