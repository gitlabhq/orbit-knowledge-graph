description: Outgoing neighbors from User 1

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}],
      "neighbors": {"direction": "outgoing"}
    }
  gql: |
    MATCH (u:User {id: 1})-->(n) RETURN u, n

expect:
  node_count: 9
  referential_integrity: true
  nodes:
    User:
      ids: [1]
    Group:
      ids: [100, 102]
      rows:
        - { id: 100, name: Public Group }
        - { id: 102, name: Internal Group }
    MergeRequest:
      ids: [2000, 2001, 2002]
    Note:
      ids: [3000]
    WorkItem:
      ids: [4000, 4002]
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 100 }
      - { from: User, from_id: 1, to: Group, to_id: 102 }
    AUTHORED:
      - { from: User, from_id: 1, to: MergeRequest, to_id: 2000 }
      - { from: User, from_id: 1, to: Note, to_id: 3000 }
      - { from: User, from_id: 1, to: WorkItem, to_id: 4000 }
      - { from: User, from_id: 1, to: WorkItem, to_id: 4002 }
    APPROVED:
      - { from: User, from_id: 1, to: MergeRequest, to_id: 2002 }
    ASSIGNED:
      - { from: User, from_id: 1, to: WorkItem, to_id: 4000 }
