description: Bidirectional neighbors of MR 2000 span multiple entity types with dynamic columns

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "mr", "entity": "MergeRequest", "node_ids": [2000]}],
      "neighbors": {"direction": "both"},
      "options": {"dynamic_columns": "*"}
    }
  gql: |
    MATCH (mr:MergeRequest {id: 2000})--(n) RETURN mr, properties(n)

expect:
  node_count: 10
  referential_integrity: true
  nodes:
    User:
      ids: [1, 2, 3]
    Note:
      ids: [3000, 3002, 3003]
      prop_present: [note]
      rows:
        - id: 3002
          note: { repeat: "🙂", count: 10000, suffix: "tail" }
          discussion_id: { repeat: "🙂", count: 2048 }
    MergeRequestDiff:
      ids: [5000, 5001]
    Project:
      ids: [1000]
  edge_exists:
    AUTHORED:
      - { from: User, from_id: 1, to: MergeRequest, to_id: 2000 }
    APPROVED:
      - { from: User, from_id: 2, to: MergeRequest, to_id: 2000 }
      - { from: User, from_id: 3, to: MergeRequest, to_id: 2000 }
    HAS_NOTE:
      - { from: MergeRequest, from_id: 2000, to: Note, to_id: 3000 }
      - { from: MergeRequest, from_id: 2000, to: Note, to_id: 3002 }
      - { from: MergeRequest, from_id: 2000, to: Note, to_id: 3003 }
    HAS_DIFF:
      - { from: MergeRequest, from_id: 2000, to: MergeRequestDiff, to_id: 5000 }
      - { from: MergeRequest, from_id: 2000, to: MergeRequestDiff, to_id: 5001 }
    IN_PROJECT:
      - { from: MergeRequest, from_id: 2000, to: Project, to_id: 1000 }
