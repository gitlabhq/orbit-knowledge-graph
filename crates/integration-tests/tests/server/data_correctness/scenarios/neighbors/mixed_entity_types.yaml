# source: crates/integration-tests/tests/server/data_correctness/neighbors.rs::neighbors_mixed_entity_types
description: Bidirectional neighbors of MR 2000 span multiple entity types with dynamic columns

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "mr", "entity": "MergeRequest", "node_ids": [2000]}],
      "neighbors": {"direction": "both"},
      "options": {"dynamic_columns": "*"}
    }
  gql: |
    MATCH (mr:MergeRequest {id: 2000})--(n) RETURN mr, properties(n)

expect:
  node_count: 10
  referential_integrity: true
  nodes:
    User:
      ids: [1, 2, 3]
    Note:
      ids: [3000, 3002, 3003]
      prop_present: [note]
    MergeRequestDiff:
      ids: [5000, 5001]
    Project:
      ids: [1000]
  edge_exists:
    AUTHORED: [[1, 2000]]
    APPROVED: [[2, 2000], [3, 2000]]
    HAS_NOTE: [[2000, 3000], [2000, 3002], [2000, 3003]]
    HAS_DIFF: [[2000, 5000], [2000, 5001]]
    IN_PROJECT: [[2000, 1000]]
