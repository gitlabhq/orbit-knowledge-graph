description: Bidirectional query preserves edge direction (Group 100 is never MEMBER_OF source)

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "g", "entity": "Group", "node_ids": [100]}],
      "neighbors": {"direction": "both"}
    }
  gql: |
    MATCH (g:Group {id: 100})--(n) RETURN g, n

expect:
  node_count: 9
  referential_integrity: true
  nodes:
    Group:
      ids: [100, 200]
    User:
      ids: [1, 2, 6]
    Project:
      ids: [1000, 1002]
    WorkItem:
      ids: [4000, 4001]
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 100 }
      - { from: User, from_id: 2, to: Group, to_id: 100 }
      - { from: User, from_id: 6, to: Group, to_id: 100 }
    IN_GROUP:
      - { from: WorkItem, from_id: 4000, to: Group, to_id: 100 }
      - { from: WorkItem, from_id: 4001, to: Group, to_id: 100 }
    CONTAINS:
      - { from: Group, from_id: 100, to: Group, to_id: 200 }
      - { from: Group, from_id: 100, to: Project, to_id: 1000 }
      - { from: Group, from_id: 100, to: Project, to_id: 1002 }
  edges:
    MEMBER_OF: [[1, 100], [2, 100], [6, 100]]
