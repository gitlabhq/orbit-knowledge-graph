config:
  unmerged_seed: true
  redaction:
    allow:
      user: [99320]
      group: [99321, 99322]
  extra_seed:
    gl_user:
      - { id: 99320, username: versioned_neighbor, name: Versioned Neighbor, state: active, _version: "2024-01-01 00:00:00" }
    gl_group:
      - { id: 99321, name: Live Group, full_path: public-group/live, visibility_level: public, traversal_path: "1/100/99321/", _version: "2024-01-01 00:00:00" }
      - { id: 99322, name: Deleted Group, full_path: public-group/deleted, visibility_level: public, traversal_path: "1/100/99322/", _version: "2024-01-01 00:00:00" }
      - { id: 99322, name: Deleted Group, full_path: public-group/deleted, visibility_level: public, traversal_path: "1/100/99322/", _version: "2024-06-01 00:00:00", _deleted: true }
    gl_edge:
      - { traversal_path: "1/100/99321/", source_id: 99320, source_kind: User, relationship_kind: MEMBER_OF, target_id: 99321, target_kind: Group, source_tags: ["state:active"], target_tags: [], _version: "2024-01-01 00:00:00" }
      - { traversal_path: "1/100/99321/", source_id: 99320, source_kind: User, relationship_kind: MEMBER_OF, target_id: 99321, target_kind: Group, source_tags: ["state:active"], target_tags: ["visibility:public"], _version: "2024-06-01 00:00:00" }
      - { traversal_path: "1/100/99322/", source_id: 99320, source_kind: User, relationship_kind: MEMBER_OF, target_id: 99322, target_kind: Group, source_tags: ["state:active"], target_tags: [], _version: "2024-01-01 00:00:00" }
      - { traversal_path: "1/100/99322/", source_id: 99320, source_kind: User, relationship_kind: MEMBER_OF, target_id: 99322, target_kind: Group, source_tags: ["state:active"], target_tags: [], _version: "2024-06-01 00:00:00", _deleted: true }

cases:
  - name: outgoing
    description: Outgoing neighbors return one edge per versioned edge and drop the neighbor whose edges the indexer tombstoned with it
    query: |
      MATCH (u:User {id: 99320})-[:MEMBER_OF]->(n) RETURN u, n
    expect:
      node_count: 2
      nodes:
        User: { ids: [99320] }
        Group:
          ids: [99321]
          rows:
            - { id: 99321, name: Live Group }
      total_edge_count: 1
      edges:
        MEMBER_OF: [[99320, 99321]]

  - name: incoming
    description: Incoming neighbors of a group return one edge even though the edge has two versions
    query: |
      MATCH (g:Group {id: 99321})<-[:MEMBER_OF]-(n) RETURN g, n
    expect:
      node_count: 2
      nodes:
        Group: { ids: [99321] }
        User:
          ids: [99320]
          rows:
            - { id: 99320, username: versioned_neighbor }
      total_edge_count: 1
      edges:
        MEMBER_OF: [[99320, 99321]]

  - name: both
    description: Neighbors in both directions return one edge per versioned edge and drop the tombstoned neighbor
    query: |
      MATCH (u:User {id: 99320})-[:MEMBER_OF]-(n) RETURN u, n
    expect:
      node_count: 2
      nodes:
        User: { ids: [99320] }
        Group:
          ids: [99321]
      total_edge_count: 1
      edges:
        MEMBER_OF: [[99320, 99321]]

  - name: incoming_to_tombstoned_center
    description: Incoming neighbors of a group whose latest row is a tombstone return nothing
    query: |
      MATCH (g:Group {id: 99322})<-[:MEMBER_OF]-(n) RETURN g, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:MEMBER_OF"]
      node_count: 0

  - name: both_of_unpinned_tombstoned_center
    description: Neighbors of a tombstoned group found by a filter return nothing, because its edges died with it
    query: |
      MATCH (g:Group)-[:MEMBER_OF]-(n) WHERE g.name = 'Deleted Group' RETURN g, n
    expect:
      skip_requirements: [node_ids, neighbors, "relationship:MEMBER_OF"]
      node_count: 0
