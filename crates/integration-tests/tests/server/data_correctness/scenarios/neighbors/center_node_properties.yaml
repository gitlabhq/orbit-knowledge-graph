description: Center node columns are hydrated on User 1

query:
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF]->(n) RETURN u.username, u.name, u.state, n

expect:
  node_count: 3
  referential_integrity: true
  nodes:
    User:
      ids: [1]
      rows:
        - { id: 1, username: alice, name: Alice Admin, state: active }
    Group:
      ids: [100, 102]
      rows:
        - { id: 100, name: Public Group }
        - { id: 102, name: Internal Group }
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 100 }
      - { from: User, from_id: 1, to: Group, to_id: 102 }
