    {
      "query_type": "neighbors",
      "nodes": [{"id": "u", "entity": "User", "node_ids": [1], "columns": ["username", "name", "state"]}],
      "neighbors": {"direction": "outgoing", "rel_types": ["MEMBER_OF"]}
