description: A center aliased like a generated neighbor column keeps its neighbors

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "neighbor", "entity": "Group", "node_ids": [100]}],
      "neighbors": {"direction": "both"}
    }
  gql: |
    MATCH (neighbor:Group {id: 100})--(n) RETURN neighbor, n

expect:
  node_count: 9
  referential_integrity: true
  nodes:
    Group:
      ids: [100, 200]
    User:
      ids: [1, 2, 6]
    Project:
      ids: [1000, 1002]
    WorkItem:
      ids: [4000, 4001]
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 100 }
    CONTAINS:
      - { from: Group, from_id: 100, to: Group, to_id: 200 }
    IN_GROUP:
      - { from: WorkItem, from_id: 4000, to: Group, to_id: 100 }
      - { from: WorkItem, from_id: 4001, to: Group, to_id: 100 }
