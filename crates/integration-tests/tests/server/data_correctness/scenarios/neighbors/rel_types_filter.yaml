description: Outgoing CONTAINS neighbors from Group 100

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "g", "entity": "Group", "node_ids": [100]}],
      "neighbors": {"direction": "outgoing", "rel_types": ["CONTAINS"]}
    }
  gql: |
    MATCH (g:Group {id: 100})-[:`CONTAINS`]->(n) RETURN g, n

expect:
  node_count: 4
  nodes:
    Group:
      ids: [100, 200]
    Project:
      ids: [1000, 1002]
  edge_count:
    CONTAINS: 3
