description: Redaction removes unauthorized Group 102 from outgoing MEMBER_OF

config:
  redaction:
    allow:
      user: [1]
      group: [100]

query:
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF]->(n) RETURN u, n

expect:
  node_count: 2
  nodes:
    Group:
      ids: [100]
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 100 }
  edge_absent:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 102 }
