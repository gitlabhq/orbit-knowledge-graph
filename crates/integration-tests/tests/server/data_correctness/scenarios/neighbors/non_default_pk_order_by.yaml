description: Neighbors of pinned non-default PK centers ordered by a center property resolve the property through the center's latest rows

query:
  json: |
    {
      "query_type": "neighbors",
      "nodes": [{"id": "d", "entity": "MergeRequestDiff", "node_ids": [5000, 5001]}],
      "neighbors": {"direction": "incoming", "rel_types": ["HAS_DIFF"]},
      "order_by": "-d.created_at"
    }

expect:
  skip_requirements: [order_by]
  node_count: 3
  nodes:
    MergeRequest: { ids: [2000] }
    MergeRequestDiff: { ids: [5000, 5001] }
  edges:
    HAS_DIFF: [[2000, 5000], [2000, 5001]]
