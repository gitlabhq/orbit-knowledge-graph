description: WorkItem-Milestone IN_MILESTONE traversal returns correct edges and milestone properties

query:
  gql: |
    MATCH (w:WorkItem)-[:IN_MILESTONE]->(m:Milestone) WHERE w.id >= 1 AND w.id <= 10000 RETURN w.title, m.title, m.state LIMIT 20

expect:
  node_count: 3
  referential_integrity: true
  edge_exists:
    IN_MILESTONE:
      - { from: WorkItem, from_id: 4000, to: Milestone, to_id: 6000 }
      - { from: WorkItem, from_id: 4001, to: Milestone, to_id: 6000 }
  nodes:
    Milestone:
      rows:
        - { id: 6000, title: "Sprint 1", state: active }
