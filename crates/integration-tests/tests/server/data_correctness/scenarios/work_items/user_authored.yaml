description: User-WorkItem AUTHORED traversal returns correct edges and node properties

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(w:WorkItem) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, w.title, w.state LIMIT 20

expect:
  node_count: 9
  referential_integrity: true
  edge_exists:
    AUTHORED:
      - { from: User, from_id: 1, to: WorkItem, to_id: 4000 }
      - { from: User, from_id: 2, to: WorkItem, to_id: 4001 }
      - { from: User, from_id: 1, to: WorkItem, to_id: 4002 }
      - { from: User, from_id: 3, to: WorkItem, to_id: 4003 }
      - { from: User, from_id: 7, to: WorkItem, to_id: 4010 }
  nodes:
    WorkItem:
      rows:
        - { id: 4000, title: "Implement login page", state: opened }
        - { id: 4001, title: "Fix auth bug", state: closed }
