description: In-list filter on work_item_type returns only matching rows

query:
  gql: |
    MATCH (w:WorkItem) WHERE w.id >= 1 AND w.id <= 10000 AND w.work_item_type IN ['issue', 'task'] RETURN w.title, w.work_item_type LIMIT 10

expect:
  node_count: 3
  nodes:
    WorkItem:
      count: 3
      ids: [4000, 4002, 4010]
      filters:
        work_item_type: { in: [issue, task] }
