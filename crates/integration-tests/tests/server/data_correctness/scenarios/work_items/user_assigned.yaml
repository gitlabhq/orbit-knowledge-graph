# source: crates/integration-tests/tests/server/data_correctness/work_items.rs::traversal_user_assigned_work_item_returns_correct_edges
description: User-WorkItem ASSIGNED traversal returns correct edges and node properties

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
        {"id": "w", "entity": "WorkItem", "columns": ["title"]}
      ],
      "relationships": [{"type": "ASSIGNED", "from": "u", "to": "w"}],
      "limit": 20
    }
  gql: |
    MATCH (u:User)-[:ASSIGNED]->(w:WorkItem) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, w.title LIMIT 20

expect:
  node_count: 5
  referential_integrity: true
  edge_exists:
    ASSIGNED:
      - [1, 4000]
      - [2, 4000]
      - [3, 4001]
  nodes:
    User:
      rows:
        - { id: 1, username: alice }
    WorkItem:
      rows:
        - { id: 4000, title: "Implement login page" }
