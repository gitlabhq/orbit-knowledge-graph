description: WorkItem-Group IN_GROUP traversal returns correct edges and group names

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "w", "entity": "WorkItem", "id_range": {"start": 1, "end": 10000}, "columns": ["title"]},
        {"id": "g", "entity": "Group", "columns": ["name"]}
      ],
      "relationships": [{"type": "IN_GROUP", "from": "w", "to": "g"}],
      "limit": 20
    }
  gql: |
    MATCH (w:WorkItem)-[:IN_GROUP]->(g:Group) WHERE w.id >= 1 AND w.id <= 10000 RETURN w.title, g.name LIMIT 20

expect:
  node_count: 7
  referential_integrity: true
  edge_exists:
    IN_GROUP:
      - { from: WorkItem, from_id: 4000, to: Group, to_id: 100 }
      - { from: WorkItem, from_id: 4001, to: Group, to_id: 100 }
      - { from: WorkItem, from_id: 4002, to: Group, to_id: 101 }
      - { from: WorkItem, from_id: 4003, to: Group, to_id: 102 }
  nodes:
    Group:
      rows:
        - { id: 100, name: "Public Group" }
