# source: crates/integration-tests/tests/server/data_correctness/work_items.rs::traversal_work_item_has_label_returns_correct_edges
description: WorkItem-Label HAS_LABEL traversal returns correct edges and label properties

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "w", "entity": "WorkItem", "id_range": {"start": 1, "end": 10000}, "columns": ["title"]},
        {"id": "l", "entity": "Label", "columns": ["title", "color"]}
      ],
      "relationships": [{"type": "HAS_LABEL", "from": "w", "to": "l"}],
      "limit": 20
    }
  gql: |
    MATCH (w:WorkItem)-[:HAS_LABEL]->(l:Label) WHERE w.id >= 1 AND w.id <= 10000 RETURN w.title, l.title, l.color LIMIT 20

expect:
  node_count: 5
  referential_integrity: true
  edge_exists:
    HAS_LABEL:
      - [4000, 7000]
      - [4000, 7001]
      - [4001, 7002]
  nodes:
    Label:
      rows:
        - { id: 7000, title: bug, color: "#d73a4a" }
        - { id: 7001, title: feature }
