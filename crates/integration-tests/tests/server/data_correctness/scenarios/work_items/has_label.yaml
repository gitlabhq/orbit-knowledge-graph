description: WorkItem-Label HAS_LABEL traversal returns correct edges and label properties

query:
  gql: |
    MATCH (w:WorkItem)-[:HAS_LABEL]->(l:Label) WHERE w.id >= 1 AND w.id <= 10000 RETURN w.title, l.title, l.color LIMIT 20

expect:
  node_count: 5
  referential_integrity: true
  edge_exists:
    HAS_LABEL:
      - { from: WorkItem, from_id: 4000, to: Label, to_id: 7000 }
      - { from: WorkItem, from_id: 4000, to: Label, to_id: 7001 }
      - { from: WorkItem, from_id: 4001, to: Label, to_id: 7002 }
  nodes:
    Label:
      rows:
        - { id: 7000, title: bug, color: "#d73a4a" }
        - { id: 7001, title: feature }
