description: is_null filter matches rows where the nullable column is unset

query:
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.avatar_url IS NULL RETURN u.username, u.avatar_url LIMIT 10

expect:
  node_count: 7
  nodes:
    User:
      rows:
        - { id: 1, username: alice }
        - { id: 2, username: bob }
        - { id: 3, username: charlie }
        - { id: 4, username: diana }
        - { id: 5, username: eve }
        - { id: 6, username: "用户_émoji_🎉" }
        - { id: 7, username: frank }
      prop_absent: [avatar_url]
