description: "Wider date window captures multiple results: merged_at in [2024-01-01, 2024-07-01)"

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 1 AND mr.id <= 10000 AND mr.state = 'merged' AND mr.merged_at >= '2024-01-01T00:00:00Z' AND mr.merged_at < '2024-07-01T00:00:00Z' RETURN mr.title, mr.state, mr.merged_at ORDER BY mr.merged_at LIMIT 10

expect:
  node_count: 2
  nodes:
    MergeRequest:
      order: [2002, 2004]
      absent: [2005]
      filters:
        state: { eq: merged }
        merged_at: { gte: "2024-01-01", lt: "2024-07-01" }
