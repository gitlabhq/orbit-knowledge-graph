description: contains finds a multi-word phrase across a token boundary, served by the ngram skip index

config:
  unmerged_seed: true
  extra_seed:
    gl_work_item:
      - { id: 4100, iid: 9, title: Other item, state: opened, work_item_type: issue, confidential: false, project_id: 1000, author_id: 1, namespace_id: 100, traversal_path: "1/100/" }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "wi", "entity": "WorkItem", "id_range": {"start": 4000, "end": 4200},
                 "columns": ["title"],
                 "filters": {"title": {"contains": "LOGIN page"}}}],
      "limit": 10
    }
  gql: |
    MATCH (wi:WorkItem) WHERE wi.id >= 4000 AND wi.id <= 4200 AND wi.title CONTAINS 'LOGIN page'
    RETURN wi.title LIMIT 10

expect:
  indexes_used: [idx_title_ngram]
  skip_requirements: ["filter:title"]
  node_count: 1
  nodes:
    WorkItem:
      ids: [4000]
      rows:
        - { id: 4000, title: Implement login page }
