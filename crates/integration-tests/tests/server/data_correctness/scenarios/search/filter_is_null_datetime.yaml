description: is_null on a DateTime column matches the rows whose stored epoch stands for null

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 2000 AND mr.id <= 2005 AND mr.merged_at IS NULL RETURN mr.title, mr.merged_at ORDER BY mr.id LIMIT 10

expect:
  node_count: 3
  nodes:
    MergeRequest:
      order: [2000, 2001, 2003]
      absent: [2002, 2004, 2005]
      filters:
        merged_at: { is_null: true }
      prop_present: [title]
      prop_absent: [merged_at]
