description: User search returns correct properties and ordering

query:
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.name, u.state, u.user_type ORDER BY u.id LIMIT 10

expect:
  node_count: 7
  nodes:
    User:
      order: [1, 2, 3, 4, 5, 6, 7]
      rows:
        - { id: 1, username: alice, name: Alice Admin, state: active, user_type: human }
        - { id: 2, username: bob, name: Bob Builder }
        - { id: 5, username: eve, state: blocked, user_type: service_account }
