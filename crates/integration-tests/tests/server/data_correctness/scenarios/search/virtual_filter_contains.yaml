description: Virtual column contains filter returns matching rows

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id IN [2000, 2001, 2002, 2003, 2004, 2005] AND mr.state = 'merged' AND mr.diff CONTAINS 'ship' RETURN mr.title, mr.state, mr.diff ORDER BY mr.id LIMIT 10

expect:
  node_count: 2
  nodes:
    MergeRequest:
      order: [2004, 2005]
      filters:
        state: { eq: merged }
        diff: { contains: ship }
