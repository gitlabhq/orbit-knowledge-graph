description: Unicode and emoji values survive the query pipeline round-trip

query:
  gql: |
    MATCH (u:User {id: 6}) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.name LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      ids: [6]
      rows:
        - id: 6
          username: "用户_émoji_🎉"
          name: "Ünïcödé Üser"
