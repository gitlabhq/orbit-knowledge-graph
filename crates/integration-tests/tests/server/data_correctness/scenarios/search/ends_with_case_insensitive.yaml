description: ends_with matches a suffix regardless of case and prunes granules with the ngram skip index

config:
  unmerged_seed: true
  extra_seed:
    gl_user:
      - { id: 50, username: zed, name: Zed Zero, state: active, user_type: human, email: zed@example.com }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["name"],
                 "filters": {"name": {"ends_with": "BUILDER"}}}],
      "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.name ENDS WITH 'BUILDER' RETURN u.name LIMIT 10

expect:
  sql_contains: ["endsWith(lower(u.name), lower('BUILDER'))"]
  indexes_used: [idx_name_ngram]
  skip_requirements: ["filter:name"]
  node_count: 1
  nodes:
    User:
      ids: [2]
      rows:
        - { id: 2, name: Bob Builder }
