description: File content is_null filter works without selecting content column

query:
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content IS NULL RETURN f.path LIMIT 10

expect:
  node_count: 1
  skip_requirements: ["filter:project_id"]
  nodes:
    File:
      ids: [13003]
      prop_absent: [content]
      rows:
        - { id: 13003, path: assets/logo.png }
