# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_file_content_is_null_filter_without_selecting_column
description: File content is_null filter works without selecting content column

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "f", "entity": "File",
               "node_ids": [13000, 13001, 13002, 13003, 13004],
               "columns": ["path"],
               "filters": {
                   "project_id": {"eq": 1000},
                   "content": {"is_null": true}
               }}],
      "limit": 10
    }
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content IS NULL RETURN f.path LIMIT 10

expect:
  node_count: 1
  skip_requirements: ["filter:project_id"]
  nodes:
    File:
      ids: [13003]
      prop_absent: [content]
