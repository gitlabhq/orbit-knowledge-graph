# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_file_content_combined_with_physical
description: File content virtual filter combined with physical path filter

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "f", "entity": "File",
               "node_ids": [13000, 13001, 13002, 13003, 13004],
               "columns": ["path", "project_id", "content"],
               "filters": {
                   "project_id": {"eq": 1000},
                   "path": {"starts_with": "src/"},
                   "content": {"contains": "ClickHouse"}
               }}],
      "limit": 10
    }
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.path STARTS WITH 'src/' AND f.content CONTAINS 'ClickHouse' RETURN f.path, f.project_id, f.content LIMIT 10

expect:
  node_count: 1
  nodes:
    File:
      ids: [13001]
      filters:
        path: { starts_with: "src/" }
        project_id: { eq: 1000 }
        content: { contains: ClickHouse }
