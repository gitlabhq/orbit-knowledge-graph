description: DateTime columns serialize as the expected ISO 8601 UTC strings

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "n", "entity": "Note", "id_range": {"start": 1, "end": 10000},
                 "columns": ["note", "created_at"],
                 "node_ids": [3000, 3001]}],
      "limit": 10
    }
  gql: |
    MATCH (n:Note) WHERE n.id IN [3000, 3001] AND n.id >= 1 AND n.id <= 10000 RETURN n.note, n.created_at LIMIT 10

expect:
  node_count: 2
  nodes:
    Note:
      ids: [3000, 3001]
      rows:
        - { id: 3000, created_at: "2024-01-15T10:30:00Z" }
        - { id: 3001, created_at: "2024-02-20T14:45:00Z" }
