# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_datetime_columns_serialize_as_strings
description: DateTime columns serialize as strings containing the date components

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "n", "entity": "Note", "id_range": {"start": 1, "end": 10000},
                 "columns": ["note", "created_at"],
                 "node_ids": [3000, 3001]}],
      "limit": 10
    }
  gql: |
    MATCH (n:Note) WHERE n.id IN [3000, 3001] AND n.id >= 1 AND n.id <= 10000 RETURN n.note, n.created_at LIMIT 10

expect:
  node_count: 2
  nodes:
    Note:
      ids: [3000, 3001]
      prop_present: [created_at]
