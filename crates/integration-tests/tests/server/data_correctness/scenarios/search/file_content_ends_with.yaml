# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_file_content_ends_with
description: File content ends_with filter matches suffix

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "f", "entity": "File",
               "node_ids": [13000, 13001, 13002, 13003, 13004],
               "columns": ["path", "project_id", "content"],
               "filters": {
                   "project_id": {"eq": 1000},
                   "content": {"ends_with": "crate."}
               }}],
      "limit": 10
    }
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content ENDS WITH 'crate.' RETURN f.path, f.project_id, f.content LIMIT 10

expect:
  node_count: 1
  nodes:
    File:
      ids: [13002]
      filters:
        project_id: { eq: 1000 }
        content: { ends_with: "crate." }
