description: Project search returns correct name and visibility_level

query:
  gql: |
    MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 RETURN p.name, p.visibility_level LIMIT 10

expect:
  node_count: 6
  nodes:
    Project:
      rows:
        - { id: 1000, name: Public Project, visibility_level: public }
        - { id: 1003, name: Secret Project, visibility_level: private }
