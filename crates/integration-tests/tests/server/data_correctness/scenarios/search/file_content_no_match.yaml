description: File content contains filter with nonexistent token returns zero rows

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "f", "entity": "File",
               "node_ids": [13000, 13001, 13002, 13003, 13004],
               "columns": ["path", "content"],
               "filters": {
                   "project_id": {"eq": 1000},
                   "content": {"contains": "zqxj_nonexistent_token"}
               }}],
      "limit": 10
    }
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content CONTAINS 'zqxj_nonexistent_token' RETURN f.path, f.content LIMIT 10

expect:
  node_count: 0
