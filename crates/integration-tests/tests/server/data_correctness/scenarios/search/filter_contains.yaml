# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_filter_contains_returns_substring_matches
description: contains filter returns rows with matching substring

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"],
                 "filters": {"username": {"contains": "lic"}}}],
      "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username CONTAINS 'lic' RETURN u.username LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      ids: [1]
      filters:
        username: { contains: lic }
