description: Wildcard columns returns all ontology fields but excludes internal columns

query:
  gql: |
    MATCH (u:User {id: 1}) RETURN properties(u) LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      ids: [1]
      prop_absent: [traversal_path, _version, _deleted]
      rows:
        - { id: 1, username: alice, name: Alice Admin, state: active, user_type: human }
