# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_file_content_is_not_null_excludes_binary
description: File content is_not_null filter excludes binary files

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "f", "entity": "File",
               "node_ids": [13000, 13001, 13002, 13003, 13004],
               "columns": ["path", "project_id", "content"],
               "filters": {
                   "project_id": {"eq": 1000},
                   "content": {"is_not_null": true}
               }}],
      "order_by": "f.id",
      "limit": 10
    }

expect:
  node_count: 4
  nodes:
    File:
      order: [13000, 13001, 13002, 13004]
      filters:
        project_id: { eq: 1000 }
        content: { is_not_null: true }
