description: Virtual column eq filter with nonexistent content returns zero rows

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id IN [2000, 2001, 2002, 2003, 2004, 2005] AND mr.diff = 'nonexistent content' RETURN mr.title, mr.diff LIMIT 10

expect:
  skip_requirements:
    - "filter:diff"
    - node_ids
  node_count: 0
