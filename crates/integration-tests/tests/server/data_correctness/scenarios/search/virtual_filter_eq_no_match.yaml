# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_virtual_filter_eq_no_match
description: Virtual column eq filter with nonexistent content returns zero rows

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "mr", "entity": "MergeRequest",
               "node_ids": [2000, 2001, 2002, 2003, 2004, 2005],
               "columns": ["title", "diff"],
               "filters": {
                   "diff": {"eq": "nonexistent content"}
               }}],
      "limit": 10
    }
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id IN [2000, 2001, 2002, 2003, 2004, 2005] AND mr.diff = 'nonexistent content' RETURN mr.title, mr.diff LIMIT 10

expect:
  skip_requirements:
    - "filter:diff"
    - node_ids
  node_count: 0
