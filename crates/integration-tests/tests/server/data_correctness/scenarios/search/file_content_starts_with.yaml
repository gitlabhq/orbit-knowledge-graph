description: File content starts_with filter matches prefix regardless of case

query:
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content STARTS WITH '# DEMO' RETURN f.path, f.project_id, f.content LIMIT 10

expect:
  node_count: 1
  nodes:
    File:
      ids: [13002]
      filters:
        project_id: { eq: 1000 }
        content: { starts_with: "# Demo" }
