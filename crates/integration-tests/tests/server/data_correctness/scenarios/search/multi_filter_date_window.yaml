description: "Date window via multi-filter: merged_at >= 2024-04-01 AND < 2024-07-01"

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 1 AND mr.id <= 10000 AND mr.state = 'merged' AND mr.merged_at >= '2024-04-01T00:00:00Z' AND mr.merged_at < '2024-07-01T00:00:00Z' RETURN mr.title, mr.state, mr.merged_at LIMIT 10

expect:
  node_count: 1
  nodes:
    MergeRequest:
      ids: [2004]
      filters:
        state: { eq: merged }
        merged_at: { gte: "2024-04-01", lt: "2024-07-01" }
