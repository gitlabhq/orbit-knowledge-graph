description: File content filter works without selecting content column

query:
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content CONTAINS 'ClickHouse' RETURN f.path ORDER BY f.id LIMIT 10

expect:
  node_count: 2
  skip_requirements: ["filter:project_id"]
  nodes:
    File:
      order: [13001, 13002]
      prop_absent: [content]
      rows:
        - { id: 13001, path: src/clickhouse.rs }
        - { id: 13002, path: README.md }
