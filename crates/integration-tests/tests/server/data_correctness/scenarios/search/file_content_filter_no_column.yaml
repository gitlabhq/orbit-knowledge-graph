# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_file_content_filter_without_selecting_column
description: File content filter works without selecting content column

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "f", "entity": "File",
               "node_ids": [13000, 13001, 13002, 13003, 13004],
               "columns": ["path"],
               "filters": {
                   "project_id": {"eq": 1000},
                   "content": {"contains": "ClickHouse"}
               }}],
      "order_by": "f.id",
      "limit": 10
    }
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content CONTAINS 'ClickHouse' RETURN f.path ORDER BY f.id LIMIT 10

expect:
  node_count: 2
  skip_requirements: ["filter:project_id"]
  nodes:
    File:
      order: [13001, 13002]
      prop_absent: [content]
