description: File content contains filter returns matching files

query:
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content CONTAINS 'ClickHouse' RETURN f.path, f.project_id, f.content ORDER BY f.id LIMIT 10

expect:
  node_count: 2
  nodes:
    File:
      order: [13001, 13002]
      filters:
        project_id: { eq: 1000 }
        content: { contains: ClickHouse }
