description: is_not_null on DateTime returns rows with non-null merged_at

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 1 AND mr.id <= 10000 AND mr.merged_at IS NOT NULL RETURN mr.title, mr.state, mr.merged_at ORDER BY mr.merged_at DESC LIMIT 10

expect:
  node_count: 3
  nodes:
    MergeRequest:
      order: [2005, 2004, 2002]
      filters:
        merged_at: { starts_with: "2024-" }
