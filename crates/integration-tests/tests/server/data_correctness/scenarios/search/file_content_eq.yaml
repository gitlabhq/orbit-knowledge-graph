description: File content eq filter matches exact content

query:
  gql: |
    MATCH (f:File) WHERE f.id IN [13000, 13001, 13002, 13003, 13004] AND f.project_id = 1000 AND f.content = '0.91.0' RETURN f.path, f.project_id, f.content LIMIT 10

expect:
  node_count: 1
  nodes:
    File:
      ids: [13004]
      filters:
        project_id: { eq: 1000 }
        content: { eq: "0.91.0" }
