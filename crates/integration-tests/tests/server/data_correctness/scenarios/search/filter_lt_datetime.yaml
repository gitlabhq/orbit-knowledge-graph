description: Strict lt on DateTime excludes same-day rows after midnight

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 1 AND mr.id <= 10000 AND mr.state = 'merged' AND mr.merged_at < '2024-06-10T00:00:00Z' RETURN mr.title, mr.state, mr.merged_at LIMIT 10

expect:
  node_count: 1
  nodes:
    MergeRequest:
      order: [2002]
      absent: [2004, 2005]
      filters:
        state: { eq: merged }
        merged_at: { lt: "2024-06-10" }
