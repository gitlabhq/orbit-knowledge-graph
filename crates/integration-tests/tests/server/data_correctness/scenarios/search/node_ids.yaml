description: node_ids constraint returns only the specified IDs

query:
  gql: |
    MATCH (g:Group) WHERE g.id IN [100, 102] RETURN g.name LIMIT 10

expect:
  node_count: 2
  nodes:
    Group:
      ids: [100, 102]
      absent: [101]
      rows:
        - { id: 100, name: Public Group }
        - { id: 102, name: Internal Group }
