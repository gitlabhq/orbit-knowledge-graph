description: all_tokens on a file path matches segments split on every non-alphanumeric character, including the file extension

config:
  unmerged_seed: true
  extra_seed:
    gl_definition:
      - { id: 12200, traversal_path: "1/100/1000/", project_id: 1000, branch: main, commit_sha: abc123, file_path: "crates/other/src/x.rs", fqn: "other::unrelated", name: unrelated, definition_type: Function, start_line: 1, end_line: 2, start_byte: 0, end_byte: 10, start_char: 0, end_char: 9 }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "d", "entity": "Definition", "id_range": {"start": 12000, "end": 12300},
                 "columns": ["file_path"],
                 "filters": {"file_path": {"all_tokens": "Compiler lib rs"}}}],
      "order_by": "d.id",
      "limit": 10
    }
  gql: |
    MATCH (d:Definition) WHERE d.id >= 12000 AND d.id <= 12300 AND all_tokens(d.file_path, 'Compiler lib rs')
    RETURN d.file_path ORDER BY d.id LIMIT 10

expect:
  indexes_used: [idx_file_path]
  skip_requirements: ["filter:file_path"]
  node_count: 3
  nodes:
    Definition:
      order: [12000, 12001, 12100]
      absent: [12002, 12200]
