# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_virtual_filter_is_not_null
description: Virtual column is_not_null filter returns rows with non-null diff

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "mr", "entity": "MergeRequest",
               "node_ids": [2000, 2001, 2002, 2003, 2004, 2005],
               "columns": ["title", "diff"],
               "filters": {
                   "diff": {"is_not_null": true}
               }}],
      "order_by": "mr.id",
      "limit": 10
    }
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id IN [2000, 2001, 2002, 2003, 2004, 2005] AND mr.diff IS NOT NULL RETURN mr.title, mr.diff ORDER BY mr.id LIMIT 10

expect:
  node_count: 4
  nodes:
    MergeRequest:
      order: [2000, 2002, 2004, 2005]
      filters:
        diff: { is_not_null: true }
