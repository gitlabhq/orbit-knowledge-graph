description: Virtual column is_not_null filter returns rows with non-null diff

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id IN [2000, 2001, 2002, 2003, 2004, 2005] AND mr.diff IS NOT NULL RETURN mr.title, mr.diff ORDER BY mr.id LIMIT 10

expect:
  node_count: 4
  nodes:
    MergeRequest:
      order: [2000, 2002, 2004, 2005]
      filters:
        diff: { contains: "@@ -" }
