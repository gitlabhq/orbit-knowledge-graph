description: starts_with matches a prefix regardless of case and prunes granules with the text skip index

config:
  unmerged_seed: true
  extra_seed:
    gl_user:
      - { id: 50, username: zed, name: Zed Zero, state: active, user_type: human, email: zed@example.com }

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"],
                 "filters": {"username": {"starts_with": "ALI"}}}],
      "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username STARTS WITH 'ALI' RETURN u.username LIMIT 10

expect:
  sql_contains: ["startsWith(lower(u.username), lower('ALI'))"]
  indexes_used: [idx_username]
  skip_requirements: ["filter:username"]
  node_count: 1
  nodes:
    User:
      ids: [1]
      rows:
        - { id: 1, username: alice }
