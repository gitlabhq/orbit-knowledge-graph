cases:
  - name: is_null_on_date
    description: is_null on a Date column matches the rows whose stored epoch stands for null
    query:
      gql: |
        MATCH (wi:WorkItem)
        WHERE wi.id >= 4000 AND wi.id <= 4010 AND wi.due_date IS NULL
        RETURN wi.title, wi.due_date ORDER BY wi.id LIMIT 10
    expect:
      node_count: 5
      nodes:
        WorkItem:
          order: [4000, 4001, 4002, 4003, 4010]
          filters:
            due_date: { is_null: true }
          prop_present: [title]
          prop_absent: [due_date]

  - name: is_not_null_on_date
    description: is_not_null on a Date column keeps only the row with a real date and returns it
    config:
      redaction: { allow: { work_item: [99030] } }
      extra_seed:
        gl_work_item:
          - { id: 99030, iid: 90, title: Dated item, state: opened, work_item_type: issue, confidential: false, due_date: "2024-05-01", namespace_id: 100, project_id: 1000, traversal_path: "1/100/1000/" }
    query:
      gql: |
        MATCH (wi:WorkItem)
        WHERE wi.id IN [4000, 4001, 99030] AND wi.due_date IS NOT NULL
        RETURN wi.title, wi.due_date LIMIT 10
    expect:
      node_count: 1
      nodes:
        WorkItem:
          ids: [99030]
          absent: [4000, 4001]
          filters:
            due_date: { is_not_null: true }
          rows:
            - { id: 99030, due_date: "2024-05-01" }
