description: "Regression: DateTime64 gte filter binds as typed param, not implicit String cast"

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 1 AND mr.id <= 10000 AND mr.state = 'merged' AND mr.merged_at >= '2024-06-01T00:00:00Z' RETURN mr.title, mr.state, mr.merged_at ORDER BY mr.merged_at DESC LIMIT 10

expect:
  node_count: 2
  nodes:
    MergeRequest:
      order: [2005, 2004]
      absent: [2002]
      filters:
        state: merged
        merged_at: { gte: "2024-06-01" }
