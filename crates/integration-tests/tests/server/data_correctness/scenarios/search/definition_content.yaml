# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_definition_content_selective
description: Definition content contains filter returns matching definitions

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "d", "entity": "Definition",
               "node_ids": [12000, 12001, 12002, 12100, 12102],
               "columns": ["name", "file_path", "content"],
               "filters": {
                   "content": {"contains": "normalize"}
               }}],
      "limit": 10
    }
  gql: |
    MATCH (d:Definition) WHERE d.id IN [12000, 12001, 12002, 12100, 12102] AND d.content CONTAINS 'normalize' RETURN d.name, d.file_path, d.content LIMIT 10

expect:
  node_count: 1
  nodes:
    Definition:
      ids: [12000]
      filters:
        content: { contains: normalize }
