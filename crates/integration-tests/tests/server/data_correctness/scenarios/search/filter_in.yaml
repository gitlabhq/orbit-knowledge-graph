description: IN filter returns rows matching any of the specified values

query:
  gql: |
    MATCH (p:Project) WHERE p.id >= 1 AND p.id <= 10000 AND p.visibility_level IN ['public', 'internal'] RETURN p.name, p.visibility_level LIMIT 10

expect:
  node_count: 4
  nodes:
    Project:
      ids: [1000, 1002, 1004, 1010]
      filters:
        visibility_level: { in: [public, internal] }
