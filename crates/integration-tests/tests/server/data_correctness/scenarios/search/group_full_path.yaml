description: Group search returns correct full_path for nested groups

query:
  gql: |
    MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN g.name, g.full_path ORDER BY g.id LIMIT 10

expect:
  node_count: 5
  nodes:
    Group:
      order: [100, 101, 102, 200, 300]
      rows:
        - { id: 100, full_path: public-group }
        - { id: 200, full_path: public-group/deep-a }
        - { id: 300, full_path: public-group/deep-a/deep-b }
