description: Default columns include full_path without explicit column selection

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}}],
      "limit": 10
    }
  gql: |
    MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN g LIMIT 10

expect:
  node_count: 5
  nodes:
    Group:
      rows:
        - { id: 100, full_path: public-group }
