description: Zero-width date window returns no results

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 1 AND mr.id <= 10000 AND mr.merged_at >= '2024-07-01T00:00:00Z' AND mr.merged_at < '2024-07-01T00:00:00Z' RETURN mr.title, mr.merged_at LIMIT 10

expect:
  skip_requirements:
    - "filter:merged_at"
  node_count: 0
