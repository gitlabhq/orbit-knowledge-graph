# source: crates/integration-tests/tests/server/data_correctness/search.rs::search_multi_filter_empty_window_returns_empty
description: Zero-width date window returns no results

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "mr", "entity": "MergeRequest",
               "id_range": {"start": 1, "end": 10000},
               "columns": ["title", "merged_at"],
               "filters": {
                   "merged_at": [
                       {"gte": "2024-07-01T00:00:00Z"},
                       {"lt": "2024-07-01T00:00:00Z"}
                   ]
               }}],
      "limit": 10
    }
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 1 AND mr.id <= 10000 AND mr.merged_at >= '2024-07-01T00:00:00Z' AND mr.merged_at < '2024-07-01T00:00:00Z' RETURN mr.title, mr.merged_at LIMIT 10

expect:
  skip_requirements:
    - "filter:merged_at"
  node_count: 0
