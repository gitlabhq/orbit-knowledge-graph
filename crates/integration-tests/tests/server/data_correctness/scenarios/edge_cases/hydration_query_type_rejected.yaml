description: A public query cannot request the internal hydration query type

query:
  json: |
    {
      "query_type": "hydration",
      "nodes": [{"id": "h", "entity": "User", "node_ids": [1]}],
      "limit": 10
    }

expect:
  compile_error: "is not an allowed value. Valid values: traversal, aggregation, path_finding, neighbors at /query_type"
