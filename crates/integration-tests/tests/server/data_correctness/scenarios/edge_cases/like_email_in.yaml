description: IN filter on admin_only email field returns both matching users

config:
  security: admin

query:
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.email IN ['alice@example.com', 'bob@example.com'] RETURN u.username, u.email LIMIT 10

expect:
  node_count: 2
  nodes:
    User:
      count: 2
      filters:
        email: { in: ["alice@example.com", "bob@example.com"] }
