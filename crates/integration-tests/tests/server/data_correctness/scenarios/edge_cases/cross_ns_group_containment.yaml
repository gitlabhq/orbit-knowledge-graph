description: Nested group containment visible within namespace 1/100/

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  gql: |
    MATCH (g:Group)-[:`CONTAINS`]->(child:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN g.name, child.name LIMIT 20

expect:
  node_count: 3
  edge_exists:
    CONTAINS:
      - { from: Group, from_id: 100, to: Group, to_id: 200 }
      - { from: Group, from_id: 200, to: Group, to_id: 300 }
  referential_integrity: true
