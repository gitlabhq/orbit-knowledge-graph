description: Aggregation with state filter counts only opened MRs per user

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest) WHERE u.id >= 1 AND u.id <= 10000 AND mr.state = 'opened' RETURN u{.id, .username}, count(mr) AS open_mr_count LIMIT 10

expect:
  skip_requirements: ["filter:state"]
  groups:
    u:
      rows:
        - { entity: User, id: 1, values: { open_mr_count: 2 }, properties: { username: alice } }
      absent:
        - { entity: User, id: 2 }
        - { entity: User, id: 3 }
