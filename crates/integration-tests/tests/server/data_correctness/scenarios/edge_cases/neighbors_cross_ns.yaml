description: Bidirectional neighbors of Group 101 scoped to 1/101/ excludes other namespaces

config:
  security: { org_id: 1, paths: ["1/101/"] }

query:
  json: |
    {
        "query_type": "neighbors",
        "nodes": [{"id": "g", "entity": "Group", "node_ids": [101]}],
        "neighbors": {"direction": "both"}
    }
  gql: |
    MATCH (g:Group {id: 101})--(n) RETURN g, n

expect:
  node_count: 8
  nodes:
    Group:
      ids: [101]
      absent: [100, 200]
    User:
      ids: [3, 4, 5, 6]
      absent: [1, 2]
    Project:
      ids: [1001, 1003]
      absent: [1000, 1002, 1004]
    WorkItem:
      ids: [4002]
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 3, to: Group, to_id: 101 }
      - { from: User, from_id: 4, to: Group, to_id: 101 }
      - { from: User, from_id: 5, to: Group, to_id: 101 }
      - { from: User, from_id: 6, to: Group, to_id: 101 }
    CONTAINS:
      - { from: Group, from_id: 101, to: Project, to_id: 1001 }
      - { from: Group, from_id: 101, to: Project, to_id: 1003 }
    IN_GROUP:
      - { from: WorkItem, from_id: 4002, to: Group, to_id: 101 }
  referential_integrity: true
