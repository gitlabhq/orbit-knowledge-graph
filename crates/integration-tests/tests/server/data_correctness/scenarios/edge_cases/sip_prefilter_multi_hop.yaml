description: Multi-hop CONTAINS [1,2] from Group 100 returns transitive children

query:
  gql: |
    MATCH (parent:Group {id: 100})-[:`CONTAINS`*1..2]->(child:Group) RETURN parent.name, child.name LIMIT 10

expect:
  node_count: 3
  nodes:
    Group:
      ids: [100, 200, 300]
  edge_exists:
    CONTAINS:
      - { from: Group, from_id: 100, to: Group, to_id: 200 }
      - { from: Group, from_id: 100, to: Group, to_id: 300 }
  referential_integrity: true
