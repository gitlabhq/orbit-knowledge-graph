# source: crates/integration-tests/tests/server/data_correctness/edge_cases/mod.rs::sip_prefilter_multi_hop_returns_correct_results
description: Multi-hop CONTAINS [1,2] from Group 100 returns transitive children

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "parent", "entity": "Group", "columns": ["name"], "node_ids": [100]},
            {"id": "child", "entity": "Group", "columns": ["name"]}
        ],
        "relationships": [{"type": "CONTAINS", "from": "parent", "to": "child", "hops": [1, 2]}],
        "limit": 10
    }

expect:
  node_count: 3
  nodes:
    Group:
      ids: [100, 200, 300]
  edge_exists:
    CONTAINS:
      - [100, 200]
      - [100, 300]
  referential_integrity: true
