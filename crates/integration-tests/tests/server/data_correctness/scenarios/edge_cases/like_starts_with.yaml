# source: crates/integration-tests/tests/server/data_correctness/edge_cases/like.rs::like_starts_with_returns_matching_rows
description: LIKE starts_with filter returns matching username

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"],
                 "filters": {"username": {"starts_with": "ali"}}}],
        "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username STARTS WITH 'ali' RETURN u.username LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      filters:
        username: { starts_with: ali }
