description: On DuckDB a case-insensitive starts_with folds non-ASCII letters, so ÄRG matches ärger and not other

config:
  backends: [duckdb]
  extra_seed:
    gl_file:
      - { id: 14001, traversal_path: 1/100/1000/, project_id: 1000, branch: main, name: f, extension: "", language: "", path: ärger }
      - { id: 14002, traversal_path: 1/100/1000/, project_id: 1000, branch: main, name: f, extension: "", language: "", path: other }

query:
  gql: |
    MATCH (f:File) WHERE f.path STARTS WITH 'ÄRG' RETURN f.path LIMIT 10

expect:
  nodes:
    File:
      ids: [14001]
      filters:
        path: { eq: ärger }
