# source: crates/integration-tests/tests/server/data_correctness/edge_cases/mod.rs::long_node_text_is_excerpted_only_on_wide_pages
description: Narrow-page limit preserves full text without truncation

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "n", "entity": "Note", "node_ids": [3002],
                 "columns": ["note", "discussion_id"],
                 "filters": {"note": {"ends_with": "tail"}}}],
      "limit": 1
    }
  gql: |
    MATCH (n:Note {id: 3002}) WHERE n.note ENDS WITH 'tail' RETURN n.note, n.discussion_id LIMIT 1

expect:
  node_count: 1
  nodes:
    Note:
      ids: [3002]
      filters:
        note: { ends_with: "tail" }
      rows:
        - id: 3002
          note: { repeat: "🙂", count: 10000, suffix: "tail" }
          discussion_id: { repeat: "🙂", count: 2048 }
