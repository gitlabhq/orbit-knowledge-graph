description: Single-row page returns full emoji text without truncation

query:
  gql: |
    MATCH (n:Note {id: 3002}) WHERE n.note ENDS WITH 'tail' RETURN n.note, n.discussion_id LIMIT 1

expect:
  node_count: 1
  nodes:
    Note:
      ids: [3002]
      filters:
        note: { ends_with: tail }
      prop_present: [note, discussion_id]
