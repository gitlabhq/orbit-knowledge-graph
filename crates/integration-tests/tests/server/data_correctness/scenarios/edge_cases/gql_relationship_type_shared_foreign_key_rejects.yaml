description: >
  SCANS and IN_PROJECT both come from the scanner's project_id column, so a
  foreign-key row cannot say which type it is. type(r) on that hop rejects
  instead of labeling every row with one of the two types.

query:
  gql: |
    MATCH (s:VulnerabilityScanner)-[r:SCANS|IN_PROJECT]->(p:Project {id: 1000})
    RETURN s, p, type(r) LIMIT 10

expect:
  compile_error: "SCANS|IN_PROJECT share one foreign key between VulnerabilityScanner and Project"
