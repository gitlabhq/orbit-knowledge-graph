cases:
  - name: aggregate_star
    description: An aggregate with an unsupported argument says where it works and in what form
    query:
      gql: |
        MATCH (u:User) RETURN count(*)
    expect:
      compile_error: "function count() is not supported: count() works only in RETURN, with one variable or property"

  - name: aggregate_in_where
    description: An aggregate in WHERE says that WHERE cannot filter on an aggregate
    query:
      gql: |
        MATCH (u:User {id: 1})-[:AUTHORED]->(m:MergeRequest) WHERE count(m) > 1 RETURN u LIMIT 10
    expect:
      compile_error: "WHERE cannot filter on an aggregate"

  - name: token_function_in_return
    description: A token function outside WHERE says it works only in WHERE
    query:
      gql: |
        MATCH (m:MergeRequest) RETURN token_match(m.title, 'login') LIMIT 10
    expect:
      compile_error: "token_match() works only in WHERE, with a property and a string"
