description: traversal_path (filterable=false) is readable as a return column on Project

query:
  gql: |
    MATCH (p:Project {id: 1000}) RETURN p.name, p.traversal_path LIMIT 10

expect:
  node_count: 1
  nodes:
    Project:
      ids: [1000]
      rows:
        - { id: 1000, traversal_path: "1/100/1000/" }
