# source: crates/integration-tests/tests/server/data_correctness/edge_cases/mod.rs::non_default_redaction_id_entity_traversal
description: MergeRequestDiff (non-default id_column) traversal returns correct diffs

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "mr", "entity": "MergeRequest", "columns": ["title"], "node_ids": [2000]},
            {"id": "d", "entity": "MergeRequestDiff", "columns": ["state"]}
        ],
        "relationships": [{"type": "HAS_DIFF", "from": "mr", "to": "d"}],
        "limit": 20
    }
  gql: |
    MATCH (mr:MergeRequest {id: 2000})-[:HAS_DIFF]->(d:MergeRequestDiff) RETURN mr.title, d.state LIMIT 20

expect:
  node_count: 3
  referential_integrity: true
  nodes:
    MergeRequest:
      ids: [2000]
    MergeRequestDiff:
      ids: [5000, 5001]
  edges:
    HAS_DIFF: [[2000, 5000], [2000, 5001]]
