# source: crates/integration-tests/tests/server/data_correctness/edge_cases/mod.rs::sip_prefilter_with_filter_returns_correct_results
description: SIP prefilter with user_type filter returns only project_bot users

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username", "user_type"],
             "filters": {"user_type": "project_bot"}},
            {"id": "g", "entity": "Group", "columns": ["name"]}
        ],
        "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
        "limit": 20
    }
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 AND u.user_type = 'project_bot' RETURN u.username, u.user_type, g.name LIMIT 20

expect:
  node_count: 3
  nodes:
    User:
      ids: [4]
      filters:
        user_type: project_bot
    Group:
      ids: [101, 102]
  edges:
    MEMBER_OF: [[4, 101], [4, 102]]
  referential_integrity: true
