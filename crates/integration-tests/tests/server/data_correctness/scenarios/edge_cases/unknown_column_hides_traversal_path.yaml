description: The unknown-field error lists valid fields without the hidden traversal_path field

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "p", "entity": "Project", "columns": ["no_such_field"], "node_ids": [1000]}],
      "limit": 10
    }
  gql: |
    MATCH (p:Project {id: 1000}) RETURN p.no_such_field LIMIT 10

expect:
  compile_error:
    json: "Valid values: id, "
    gql: "Valid fields: id, "
  compile_error_not_contains: ["traversal_path"]
