description: Aggregation scoped to 1/100/ counts only projects in that namespace

config:
  security: { org_id: 1, paths: ["1/100/"] }

query:
  gql: |
    MATCH (p:Project)<-[:`CONTAINS`]-(g:Group) WHERE p.id >= 1 AND p.id <= 10000 RETURN g{.id, .name}, count(p) AS project_count LIMIT 20

expect:
  groups:
    g:
      count: 2
      rows:
        - { entity: Group, id: 100, values: { project_count: 2 } }
        - { entity: Group, id: 200, values: { project_count: 1 } }
      absent:
        - { entity: Group, id: 101 }
        - { entity: Group, id: 102 }
