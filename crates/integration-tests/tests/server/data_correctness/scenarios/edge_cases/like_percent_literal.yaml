# source: crates/integration-tests/tests/server/data_correctness/edge_cases/like.rs::like_percent_matched_literally
description: Percent sign in LIKE filter is matched literally, not as wildcard

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"],
                 "filters": {"username": {"contains": "100%"}}}],
        "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username CONTAINS '100%' RETURN u.username LIMIT 10

expect:
  skip_requirements: ["filter:username"]
  node_count: 0
