description: Multiple MRs with allow-all redaction return all associated diffs

query:
  gql: |
    MATCH (mr:MergeRequest)-[:HAS_DIFF]->(d:MergeRequestDiff) WHERE mr.id IN [2000, 2001] RETURN mr, d LIMIT 20

expect:
  node_count: 5
  referential_integrity: true
  nodes:
    MergeRequest:
      ids: [2000, 2001]
    MergeRequestDiff:
      ids: [5000, 5001, 5002]
  edges:
    HAS_DIFF: [[2000, 5000], [2000, 5001], [2001, 5002]]
