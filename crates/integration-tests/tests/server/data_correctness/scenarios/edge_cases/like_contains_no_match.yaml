description: LIKE contains filter with no match returns empty

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"],
                 "filters": {"username": {"contains": "zzz"}}}],
        "limit": 10
    }
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.username CONTAINS 'zzz' RETURN u.username LIMIT 10

expect:
  skip_requirements: ["filter:username"]
  node_count: 0
