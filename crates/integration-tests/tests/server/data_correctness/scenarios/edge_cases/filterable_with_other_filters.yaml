description: Other filters still work when traversal_path is a return column

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [{"id": "g", "entity": "Group",
                 "columns": ["name", "traversal_path"],
                 "filters": {"name": "Public Group"}}],
        "limit": 10
    }
  gql: |
    MATCH (g:Group) WHERE g.name = 'Public Group' RETURN g.name, g.traversal_path LIMIT 10

expect:
  node_count: 1
  nodes:
    Group:
      filters:
        name: Public Group
      rows:
        - { id: 100, traversal_path: "1/100/" }
