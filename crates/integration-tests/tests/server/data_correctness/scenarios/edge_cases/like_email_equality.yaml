description: Exact equality on admin_only email field works (like_allowed false does not block eq)

config:
  security: admin

query:
  gql: |
    MATCH (u:User) WHERE u.id >= 1 AND u.id <= 10000 AND u.email = 'alice@example.com' RETURN u.username, u.email LIMIT 10

expect:
  node_count: 1
  nodes:
    User:
      filters:
        email: "alice@example.com"
