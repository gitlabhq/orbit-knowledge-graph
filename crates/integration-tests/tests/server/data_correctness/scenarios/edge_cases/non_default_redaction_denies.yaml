description: Redaction on non-default id_column denies unauthorized MergeRequestDiffs

config:
  redaction:
    allow:
      merge_request: [2001]

query:
  gql: |
    MATCH (mr:MergeRequest)-[:HAS_DIFF]->(d:MergeRequestDiff) WHERE mr.id IN [2000, 2001] RETURN mr, d LIMIT 20

expect:
  node_count: 2
  nodes:
    MergeRequest:
      ids: [2001]
      absent: [2000]
    MergeRequestDiff:
      ids: [5002]
      absent: [5000, 5001]
  edges:
    HAS_DIFF: [[2001, 5002]]
