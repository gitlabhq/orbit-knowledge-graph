config:
  security: { paths: ["1/600/"] }
  redaction:
    allow:
      user: [1, 2, 3, 4, 5]
      group: [100, 101, 102, 200, 300]
      project: [1000, 1001, 1002]
      merge_request: [2000, 2001, 2002]
      note: [3000, 3001, 3002, 3003, 9000]
  extra_seed:
    gl_user:
      - { id: 1, username: alice, name: Alice Admin, state: active, user_type: human, _version: "2030-01-01 00:00:00" }
      - { id: 2, username: bob, name: Bob Builder, state: active, user_type: human, _version: "2030-01-01 00:00:00" }
      - { id: 3, username: charlie, name: Charlie Private, state: active, user_type: human, _version: "2030-01-01 00:00:00" }
      - { id: 4, username: diana, name: Diana Dev, state: blocked, user_type: project_bot, _version: "2030-01-01 00:00:00" }
      - { id: 5, username: "用户_émoji_🎉", name: "Unicode Name ñ", state: active, user_type: human, _version: "2030-01-01 00:00:00" }
    gl_group:
      - { id: 100, name: Public Group, visibility_level: public, traversal_path: "1/600/100/" }
      - { id: 101, name: Private Group, visibility_level: private, traversal_path: "1/600/101/" }
      - { id: 102, name: Internal Group, visibility_level: internal, traversal_path: "1/600/102/" }
      - { id: 200, name: Depth2 Group, visibility_level: public, traversal_path: "1/600/200/" }
      - { id: 300, name: Depth3 Group, visibility_level: public, traversal_path: "1/600/300/" }
    gl_project:
      - { id: 1000, name: Public Project, visibility_level: public, traversal_path: "1/600/100/1000/" }
      - { id: 1001, name: Private Project, visibility_level: private, traversal_path: "1/600/101/1001/" }
      - { id: 1002, name: Internal Project, visibility_level: internal, traversal_path: "1/600/102/1002/" }
    gl_merge_request:
      - { id: 2000, iid: 1, title: Add feature A, state: opened, source_branch: feature-a, target_branch: main, author_id: 1, traversal_path: "1/600/100/1000/" }
      - { id: 2001, iid: 2, title: Fix bug B, state: merged, source_branch: fix-b, target_branch: main, author_id: 2, traversal_path: "1/600/101/1001/" }
      - { id: 2002, iid: 3, title: Update C, state: closed, source_branch: update-c, target_branch: main, author_id: 3, traversal_path: "1/600/102/1002/" }
    gl_note:
      - { id: 3000, note: Normal note, noteable_type: MergeRequest, noteable_id: 2000, author_id: 1, traversal_path: "1/600/100/1000/", internal: true, confidential: true }
      - { id: 3001, note: { sql: "repeat('A', 10000)" }, noteable_type: MergeRequest, noteable_id: 2001, author_id: 2, traversal_path: "1/600/101/1001/", internal: false, confidential: null }
      - { id: 3002, note: "SQL injection attempt: '; DROP TABLE gl_user; --", noteable_type: MergeRequest, noteable_id: 2000, author_id: 1, traversal_path: "1/600/100/1000/", internal: false, confidential: null }
      - { id: 3003, note: "Backslash\\quote\"newline\n\ttab", noteable_type: MergeRequest, noteable_id: 2000, author_id: 1, traversal_path: "1/600/100/1000/", internal: false, confidential: null }
    gl_edge:
      - { traversal_path: "1/600/100/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:public"] }
      - { traversal_path: "1/600/101/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 101, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:private"] }
      - { traversal_path: "1/600/101/", source_id: 2, source_kind: User, relationship_kind: MEMBER_OF, target_id: 101, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:private"] }
      - { traversal_path: "1/600/102/", source_id: 3, source_kind: User, relationship_kind: MEMBER_OF, target_id: 102, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:internal"] }
      - { traversal_path: "1/600/102/", source_id: 4, source_kind: User, relationship_kind: MEMBER_OF, target_id: 102, target_kind: Group, source_tags: ["state:blocked", "user_type:project_bot"], target_tags: ["visibility_level:internal"] }
      - { traversal_path: "1/600/100/", source_id: 5, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:public"] }
      - { traversal_path: "1/600/200/", source_id: 100, source_kind: Group, relationship_kind: MEMBER_OF, target_id: 200, target_kind: Group, source_tags: ["visibility_level:public"], target_tags: ["visibility_level:public"] }
      - { traversal_path: "1/600/300/", source_id: 200, source_kind: Group, relationship_kind: MEMBER_OF, target_id: 300, target_kind: Group, source_tags: ["visibility_level:public"], target_tags: ["visibility_level:public"] }
      - { traversal_path: "1/600/100/", source_id: 100, source_kind: Group, relationship_kind: CONTAINS, target_id: 1000, target_kind: Project, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/101/", source_id: 101, source_kind: Group, relationship_kind: CONTAINS, target_id: 1001, target_kind: Project, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/102/", source_id: 102, source_kind: Group, relationship_kind: CONTAINS, target_id: 1002, target_kind: Project, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/100/1000/", source_id: 1, source_kind: User, relationship_kind: AUTHORED, target_id: 2000, target_kind: MergeRequest, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/101/1001/", source_id: 2, source_kind: User, relationship_kind: AUTHORED, target_id: 2001, target_kind: MergeRequest, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/102/1002/", source_id: 3, source_kind: User, relationship_kind: AUTHORED, target_id: 2002, target_kind: MergeRequest, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: HAS_NOTE, target_id: 3000, target_kind: Note, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: HAS_NOTE, target_id: 3002, target_kind: Note, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: HAS_NOTE, target_id: 3003, target_kind: Note, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/101/1001/", source_id: 2001, source_kind: MergeRequest, relationship_kind: HAS_NOTE, target_id: 3001, target_kind: Note, source_tags: [], target_tags: [] }

cases:
  - name: neighbors_both_direction_edges_correct
    description: Both-direction neighbors of a user keep MEMBER_OF edges pointing out of the user
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}],
          "neighbors": {"direction": "both"}
        }
    expect:
      edges:
        MEMBER_OF: [[1, 100], [1, 101]]
        AUTHORED: [[1, 2000]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }
          - { from: User, from_id: 1, to: Group, to_id: 101 }

  - name: neighbors_both_direction_mixed_entity
    description: Both-direction neighbors of an MR keep each edge's true source
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "mr", "entity": "MergeRequest", "node_ids": [2000]}],
          "neighbors": {"direction": "both"}
        }
    expect:
      edges:
        AUTHORED: [[1, 2000]]
        HAS_NOTE: [[2000, 3000], [2000, 3002], [2000, 3003]]
      edge_exists:
        AUTHORED:
          - { from: User, from_id: 1, to: MergeRequest, to_id: 2000 }
        HAS_NOTE:
          - { from: MergeRequest, from_id: 2000, to: Note, to_id: 3000 }
          - { from: MergeRequest, from_id: 2000, to: Note, to_id: 3002 }
          - { from: MergeRequest, from_id: 2000, to: Note, to_id: 3003 }

  - name: neighbors_dynamic_columns_all
    description: dynamic_columns star hydrates neighbor group properties
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}],
          "neighbors": {"direction": "outgoing", "rel_types": ["MEMBER_OF"]},
          "options": {"dynamic_columns": "*"}
        }
    expect:
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100, 101]
          prop_present: [name]
          rows:
            - { id: 100, name: Public Group }
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }
          - { from: User, from_id: 1, to: Group, to_id: 101 }
      edge_count:
        MEMBER_OF: 2

  - name: neighbors_redaction
    description: Redaction removes unauthorized neighbors and their edges
    config:
      redaction:
        allow:
          user: [1]
          group: [100]
          project: []
          merge_request: []
          note: []
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}],
          "neighbors": {"direction": "outgoing"}
        }
    expect:
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100]
          absent: [101, 102]
      edges:
        MEMBER_OF: [[1, 100]]

  - name: neighbors_outgoing_exact
    description: Outgoing neighbors of a user are its groups and authored MR, with no path metadata on edges
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}],
          "neighbors": {"direction": "outgoing"}
        }
    expect:
      nodes:
        User:
          ids: [1]
        Group:
          ids: [100, 101]
        MergeRequest:
          ids: [2000]
      edges:
        MEMBER_OF: [[1, 100], [1, 101]]
        AUTHORED: [[1, 2000]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }
          - { from: User, from_id: 1, to: Group, to_id: 101 }
        AUTHORED:
          - { from: User, from_id: 1, to: MergeRequest, to_id: 2000 }
      edge_prop_absent: [path_id, step, depth]

  - name: neighbors_incoming_exact
    description: Incoming neighbors of group 101 are exactly its two members, with no path metadata on edges
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "g", "entity": "Group", "node_ids": [101]}],
          "neighbors": {"direction": "incoming"}
        }
    expect:
      nodes:
        Group:
          ids: [101]
        User:
          ids: [1, 2]
          absent: [3, 4, 5]
      edges:
        MEMBER_OF: [[1, 101], [2, 101]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 101 }
          - { from: User, from_id: 2, to: Group, to_id: 101 }
      edge_prop_absent: [path_id, step, depth]

  - name: neighbors_both_exact
    description: Both-direction neighbors of group 100 include its members, parent group, and project
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "g", "entity": "Group", "node_ids": [100]}],
          "neighbors": {"direction": "both"}
        }
    expect:
      nodes:
        Group:
          ids: [100]
        User:
          ids: [1, 5]
        Project:
          ids: [1000]
      edges:
        MEMBER_OF: [[1, 100], [5, 100]]
        CONTAINS: [[100, 1000]]
      edge_exists:
        MEMBER_OF:
          - { from: User, from_id: 1, to: Group, to_id: 100 }
          - { from: User, from_id: 5, to: Group, to_id: 100 }
        CONTAINS:
          - { from: Group, from_id: 100, to: Project, to_id: 1000 }
      edge_prop_absent: [path_id, step, depth]

  - name: neighbors_with_rel_types_filter
    description: rel_types AUTHORED keeps only the authored MR and drops group neighbors
    query:
      json: |
        {
          "query_type": "neighbors",
          "nodes": [{"id": "u", "entity": "User", "node_ids": [1]}],
          "neighbors": {"direction": "outgoing", "rel_types": ["AUTHORED"]}
        }
    expect:
      node_count: 2
      nodes:
        User:
          ids: [1]
        MergeRequest:
          ids: [2000]
      edges:
        AUTHORED: [[1, 2000]]
      edge_exists:
        AUTHORED:
          - { from: User, from_id: 1, to: MergeRequest, to_id: 2000 }
      edge_prop_absent: [path_id, step, depth]
