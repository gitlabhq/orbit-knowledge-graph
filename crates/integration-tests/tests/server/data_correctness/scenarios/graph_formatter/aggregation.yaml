config:
  security: { paths: ["1/600/"] }
  redaction:
    allow:
      user: [1, 2, 3, 4, 5]
      group: [100, 101, 102, 200, 300]
      project: [1000, 1001, 1002]
      merge_request: [2000, 2001, 2002]
      note: [3000, 3001, 3002, 3003, 9000]
  extra_seed:
    gl_user:
      - { id: 1, username: alice, name: Alice Admin, state: active, user_type: human, _version: "2030-01-01 00:00:00" }
      - { id: 2, username: bob, name: Bob Builder, state: active, user_type: human, _version: "2030-01-01 00:00:00" }
      - { id: 3, username: charlie, name: Charlie Private, state: active, user_type: human, _version: "2030-01-01 00:00:00" }
      - { id: 4, username: diana, name: Diana Dev, state: blocked, user_type: project_bot, _version: "2030-01-01 00:00:00" }
      - { id: 5, username: "用户_émoji_🎉", name: "Unicode Name ñ", state: active, user_type: human, _version: "2030-01-01 00:00:00" }
    gl_group:
      - { id: 100, name: Public Group, visibility_level: public, traversal_path: "1/600/100/" }
      - { id: 101, name: Private Group, visibility_level: private, traversal_path: "1/600/101/" }
      - { id: 102, name: Internal Group, visibility_level: internal, traversal_path: "1/600/102/" }
      - { id: 200, name: Depth2 Group, visibility_level: public, traversal_path: "1/600/200/" }
      - { id: 300, name: Depth3 Group, visibility_level: public, traversal_path: "1/600/300/" }
    gl_project:
      - { id: 1000, name: Public Project, visibility_level: public, traversal_path: "1/600/100/1000/" }
      - { id: 1001, name: Private Project, visibility_level: private, traversal_path: "1/600/101/1001/" }
      - { id: 1002, name: Internal Project, visibility_level: internal, traversal_path: "1/600/102/1002/" }
    gl_merge_request:
      - { id: 2000, iid: 1, title: Add feature A, state: opened, source_branch: feature-a, target_branch: main, author_id: 1, traversal_path: "1/600/100/1000/" }
      - { id: 2001, iid: 2, title: Fix bug B, state: merged, source_branch: fix-b, target_branch: main, author_id: 2, traversal_path: "1/600/101/1001/" }
      - { id: 2002, iid: 3, title: Update C, state: closed, source_branch: update-c, target_branch: main, author_id: 3, traversal_path: "1/600/102/1002/" }
    gl_note:
      - { id: 3000, note: Normal note, noteable_type: MergeRequest, noteable_id: 2000, author_id: 1, traversal_path: "1/600/100/1000/", internal: true, confidential: true }
      - { id: 3001, note: { sql: "repeat('A', 10000)" }, noteable_type: MergeRequest, noteable_id: 2001, author_id: 2, traversal_path: "1/600/101/1001/", internal: false, confidential: null }
      - { id: 3002, note: "SQL injection attempt: '; DROP TABLE gl_user; --", noteable_type: MergeRequest, noteable_id: 2000, author_id: 1, traversal_path: "1/600/100/1000/", internal: false, confidential: null }
      - { id: 3003, note: "Backslash\\quote\"newline\n\ttab", noteable_type: MergeRequest, noteable_id: 2000, author_id: 1, traversal_path: "1/600/100/1000/", internal: false, confidential: null }
    gl_edge:
      - { traversal_path: "1/600/100/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:public"] }
      - { traversal_path: "1/600/101/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 101, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:private"] }
      - { traversal_path: "1/600/101/", source_id: 2, source_kind: User, relationship_kind: MEMBER_OF, target_id: 101, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:private"] }
      - { traversal_path: "1/600/102/", source_id: 3, source_kind: User, relationship_kind: MEMBER_OF, target_id: 102, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:internal"] }
      - { traversal_path: "1/600/102/", source_id: 4, source_kind: User, relationship_kind: MEMBER_OF, target_id: 102, target_kind: Group, source_tags: ["state:blocked", "user_type:project_bot"], target_tags: ["visibility_level:internal"] }
      - { traversal_path: "1/600/100/", source_id: 5, source_kind: User, relationship_kind: MEMBER_OF, target_id: 100, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:public"] }
      - { traversal_path: "1/600/200/", source_id: 100, source_kind: Group, relationship_kind: MEMBER_OF, target_id: 200, target_kind: Group, source_tags: ["visibility_level:public"], target_tags: ["visibility_level:public"] }
      - { traversal_path: "1/600/300/", source_id: 200, source_kind: Group, relationship_kind: MEMBER_OF, target_id: 300, target_kind: Group, source_tags: ["visibility_level:public"], target_tags: ["visibility_level:public"] }
      - { traversal_path: "1/600/100/", source_id: 100, source_kind: Group, relationship_kind: CONTAINS, target_id: 1000, target_kind: Project, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/101/", source_id: 101, source_kind: Group, relationship_kind: CONTAINS, target_id: 1001, target_kind: Project, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/102/", source_id: 102, source_kind: Group, relationship_kind: CONTAINS, target_id: 1002, target_kind: Project, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/100/1000/", source_id: 1, source_kind: User, relationship_kind: AUTHORED, target_id: 2000, target_kind: MergeRequest, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/101/1001/", source_id: 2, source_kind: User, relationship_kind: AUTHORED, target_id: 2001, target_kind: MergeRequest, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/102/1002/", source_id: 3, source_kind: User, relationship_kind: AUTHORED, target_id: 2002, target_kind: MergeRequest, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: HAS_NOTE, target_id: 3000, target_kind: Note, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: HAS_NOTE, target_id: 3002, target_kind: Note, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: HAS_NOTE, target_id: 3003, target_kind: Note, source_tags: [], target_tags: [] }
      - { traversal_path: "1/600/101/1001/", source_id: 2001, source_kind: MergeRequest, relationship_kind: HAS_NOTE, target_id: 3001, target_kind: Note, source_tags: [], target_tags: [] }

cases:
  - name: aggregation_count_exact
    description: Grouping users counts each user's group memberships
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["u"],
          "aggregations": [{"count": "g", "as": "group_count"}],
          "limit": 10
        }
    expect:
      groups:
        u:
          entity: User
          ids: [1, 2, 3, 4, 5]
          rows:
            - { entity: User, id: 1, values: { group_count: 2 }, properties: { username: alice } }
            - { entity: User, id: 2, values: { group_count: 1 }, properties: { username: bob } }
            - { entity: User, id: 3, values: { group_count: 1 } }
            - { entity: User, id: 4, values: { group_count: 1 } }
            - { entity: User, id: 5, values: { group_count: 1 } }

  - name: aggregation_redaction
    description: Redacted users drop out of a grouped aggregation
    config:
      redaction:
        allow:
          user: [1, 2]
          group: [100, 101, 102]
          project: []
          merge_request: []
          note: []
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["u"],
          "aggregations": [{"count": "g", "as": "group_count"}],
          "limit": 10
        }
    expect:
      groups:
        u:
          entity: User
          ids: [1, 2]
          absent:
            - { entity: User, id: 3 }
            - { entity: User, id: 4 }
            - { entity: User, id: 5 }
          rows:
            - { entity: User, id: 1, values: { group_count: 2 }, properties: { username: alice } }
            - { entity: User, id: 2, values: { group_count: 1 }, properties: { username: bob } }

  - name: aggregation_sum
    description: sum over member ids per group
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
            {"id": "u", "entity": "User"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["g"],
          "aggregations": [{"sum": "u.id", "as": "id_sum"}],
          "limit": 10
        }
    expect:
      groups:
        g:
          entity: Group
          ids: [100, 101, 102]
          rows:
            - { entity: Group, id: 100, values: { id_sum: 6 }, properties: { name: Public Group } }
            - { entity: Group, id: 101, values: { id_sum: 3 }, properties: { name: Private Group } }
            - { entity: Group, id: 102, values: { id_sum: 7 } }

  - name: aggregation_avg
    description: avg over member ids per group returns floating point values
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
            {"id": "u", "entity": "User"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["g"],
          "aggregations": [{"avg": "u.id", "as": "avg_id"}],
          "limit": 10
        }
    expect:
      groups:
        g:
          entity: Group
          ids: [100, 101, 102]
          rows:
            - { entity: Group, id: 100, values: { avg_id: 3.0 } }
            - { entity: Group, id: 101, values: { avg_id: 1.5 }, properties: { name: Private Group } }
            - { entity: Group, id: 102, values: { avg_id: 3.5 } }

  - name: aggregation_min_max
    description: min and max over member ids per group
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
            {"id": "u", "entity": "User"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["g"],
          "aggregations": [
            {"min": "u.id", "as": "min_id"},
            {"max": "u.id", "as": "max_id"}
          ],
          "limit": 10
        }
    expect:
      groups:
        g:
          entity: Group
          ids: [100, 101, 102]
          rows:
            - { entity: Group, id: 100, values: { min_id: 1, max_id: 5 } }
            - { entity: Group, id: 101, values: { min_id: 1, max_id: 2 } }
            - { entity: Group, id: 102, values: { min_id: 3, max_id: 4 } }

  - name: aggregation_multiple_functions
    description: count, avg, and min in one grouped aggregation keep their value types
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
            {"id": "u", "entity": "User"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["g"],
          "aggregations": [
            {"count": "u", "as": "member_count"},
            {"avg": "u.id", "as": "avg_id"},
            {"min": "u.id", "as": "min_id"}
          ],
          "limit": 10
        }
    expect:
      groups:
        g:
          entity: Group
          ids: [100, 101, 102]
          rows:
            - { entity: Group, id: 100, values: { member_count: 2, avg_id: 3.0, min_id: 1 } }
            - { entity: Group, id: 101, values: { member_count: 2, avg_id: 1.5, min_id: 1 } }
            - { entity: Group, id: 102, values: { member_count: 2, avg_id: 3.5, min_id: 3 } }

  - name: no_alias_aggregation_with_sort
    description: A sorted aggregation without an alias exposes and sorts by the derived count_u name
    steps:
      - seed:
          gl_edge:
            - { traversal_path: "1/600/102/", source_id: 1, source_kind: User, relationship_kind: MEMBER_OF, target_id: 102, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:internal"] }
            - { traversal_path: "1/600/102/", source_id: 2, source_kind: User, relationship_kind: MEMBER_OF, target_id: 102, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:internal"] }
            - { traversal_path: "1/600/101/", source_id: 5, source_kind: User, relationship_kind: MEMBER_OF, target_id: 101, target_kind: Group, source_tags: ["state:active", "user_type:human"], target_tags: ["visibility_level:private"] }
        query:
          json: |
            {
              "query_type": "aggregation",
              "nodes": [
                {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
                {"id": "u", "entity": "User"}
              ],
              "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
              "group_by": ["g"],
              "aggregations": [{"count": "u"}],
              "aggregation_sort": "-count_u",
              "limit": 10
            }
        expect:
          groups:
            g:
              entity: Group
              order: [102, 101, 100]
              rows:
                - { entity: Group, id: 102, values: { count_u: 4 } }
                - { entity: Group, id: 101, values: { count_u: 3 } }
                - { entity: Group, id: 100, values: { count_u: 2 } }

  - name: ungrouped_count_emits_aggregates
    description: An ungrouped count returns no nodes, one count column, and the total on the first row
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}}],
          "aggregations": [{"count": "g", "as": "total"}],
          "limit": 10
        }
    expect:
      node_count: 0
      aggregation_columns:
        - { name: total, function: count, target: g }
      row_values:
        - { total: 5 }

  - name: ungrouped_multiple_functions_emits_aggregates
    description: Ungrouped count, min, and max report their column metadata and values
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}}],
          "aggregations": [
            {"count": "g", "as": "total"},
            {"min": "g.id", "as": "min_id"},
            {"max": "g.id", "as": "max_id"}
          ],
          "limit": 10
        }
    expect:
      node_count: 0
      aggregation_columns:
        - { name: total, function: count, target: g }
        - { name: min_id, function: min, target: g, property: id }
        - { name: max_id, function: max, target: g, property: id }
      row_values:
        - { total: 5, min_id: 100, max_id: 300 }

  - name: grouped_aggregation_uses_node_group_rows
    description: A grouped count puts User group cells on the rows and describes the count column
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["u"],
          "aggregations": [{"count": "g", "as": "group_count"}],
          "limit": 10
        }
    expect:
      aggregation_columns:
        - { name: group_count, function: count, target: g }
      groups:
        u:
          entity: User
          ids: [1, 2, 3, 4, 5]

  - name: ungrouped_count_with_redaction
    description: Redaction does not change an ungrouped count
    config:
      redaction:
        allow:
          user: []
          group: [100, 101]
          project: []
          merge_request: []
          note: []
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}}],
          "aggregations": [{"count": "g", "as": "total"}],
          "limit": 10
        }
    expect:
      node_count: 0
      aggregation_columns:
        - { name: total, function: count, target: g }
      row_values:
        - { total: 5 }

  - name: no_alias_grouped_count_uses_derived_name
    description: A grouped count without an alias is named count_g in the columns and on the rows
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["u"],
          "aggregations": [{"count": "g"}],
          "limit": 10
        }
    expect:
      aggregation_columns:
        - { name: count_g, function: count, target: g }
      groups:
        u:
          rows:
            - { entity: User, id: 1, values: { count_g: 2 } }

  - name: no_alias_ungrouped_count_uses_derived_name
    description: An ungrouped count without an alias is named count_g in the columns and on the row
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [{"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}}],
          "aggregations": [{"count": "g"}],
          "limit": 10
        }
    expect:
      aggregation_columns:
        - { name: count_g, function: count, target: g }
      row_values:
        - { count_g: 5 }

  - name: no_alias_multi_agg_each_uses_own_derived_name
    description: Each aggregation without an alias gets its own derived name
    query:
      json: |
        {
          "query_type": "aggregation",
          "nodes": [
            {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
            {"id": "u", "entity": "User"}
          ],
          "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
          "group_by": ["g"],
          "aggregations": [
            {"count": "u"},
            {"min": "u.id"},
            {"max": "u.id"}
          ],
          "limit": 10
        }
    expect:
      aggregation_columns:
        - { name: count_u, function: count, target: u }
        - { name: min_u_id, function: min, target: u, property: id }
        - { name: max_u_id, function: max, target: u, property: id }
      groups:
        g:
          rows:
            - { entity: Group, id: 100, values: { count_u: 2, min_u_id: 1, max_u_id: 5 } }
