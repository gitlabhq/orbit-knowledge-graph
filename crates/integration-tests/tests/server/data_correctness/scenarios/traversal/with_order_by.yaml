description: Order by descending user ID preserves correct node ordering

query:
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, g.name ORDER BY u.id DESC LIMIT 20

expect:
  node_count: 9
  nodes:
    User:
      order: [6, 5, 4, 3, 2, 1]
  edges:
    MEMBER_OF:
      - [1, 100]
      - [1, 102]
      - [2, 100]
      - [3, 101]
      - [4, 101]
      - [4, 102]
      - [5, 101]
      - [6, 100]
      - [6, 101]
