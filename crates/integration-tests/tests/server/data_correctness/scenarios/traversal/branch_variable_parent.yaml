description: A branch from a two-hop endpoint keeps callers beyond the direct neighbors

config:
  security:
    paths: ["1/100/1000/"]
  extra_seed:
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 12002, source_kind: Definition, relationship_kind: CALLS, target_id: 12000, target_kind: Definition }

query:
  gql: |
    MATCH (a:Definition {id: 12000})-[:CALLS*2]->(b:Definition),
          (a)-[:CALLS]->(c:Definition), (b)-[:CALLS]->(d:Definition)
    RETURN a, b, c, d LIMIT 20

expect:
  node_count: 3
  total_edge_count: 3
  referential_integrity: true
  nodes:
    Definition: { ids: [12000, 12001, 12002] }
  edges:
    CALLS: [[12000, 12002], [12000, 12001], [12002, 12000]]
