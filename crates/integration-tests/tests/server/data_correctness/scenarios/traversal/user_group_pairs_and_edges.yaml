description: User-Group traversal returns correct node pairs and MEMBER_OF edges

query:
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, g.name LIMIT 20

expect:
  node_count: 9
  referential_integrity: true
  edges:
    MEMBER_OF:
      - [1, 100]
      - [1, 102]
      - [2, 100]
      - [3, 101]
      - [4, 101]
      - [4, 102]
      - [5, 101]
      - [6, 100]
      - [6, 101]
  nodes:
    User:
      rows:
        - id: 1
          username: alice
    Group:
      rows:
        - id: 100
          name: "Public Group"
        - id: 101
          name: "Private Group"
