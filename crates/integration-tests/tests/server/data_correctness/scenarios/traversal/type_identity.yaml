description: Multi-hop joins preserve entity kind as well as numeric identity

config:
  security:
    paths: ["1/100/1000/"]
  extra_seed:
    gl_definition:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000, branch: main, name: audit_caller, fqn: audit_caller }
      - { id: 99001, traversal_path: "1/100/1000/", project_id: 1000, branch: main, name: audit_target, fqn: audit_target }
    gl_import:
      - { id: 12001, traversal_path: "1/100/1000/", project_id: 1000, branch: main }
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 99000, source_kind: Definition, relationship_kind: CALLS, target_id: 12001, target_kind: Import }
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 12001, source_kind: Definition, relationship_kind: CALLS, target_id: 99001, target_kind: Definition }

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[99000],"columns":["id"]},{"id":"b","entity":"Definition","node_ids":[99001],"columns":["id"]}],"relationships":[{"type":"CALLS","from":"a","to":"b","hops":[2,2]}]}
  gql: |
    MATCH (a:Definition {id: 99000})-[:CALLS*2]->(b:Definition {id: 99001})
    RETURN a.id, b.id

expect:
  node_count: 0
  nodes:
    Definition: { ids: [] }
  edge_count: { CALLS: 0 }
