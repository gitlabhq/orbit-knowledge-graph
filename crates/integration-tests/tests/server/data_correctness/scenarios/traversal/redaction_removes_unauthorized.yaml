description: Redaction removes nodes and edges the user is not authorized to see

config:
  redaction:
    allow:
      user: [1]
      group: [100]

query:
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, g.name LIMIT 20

expect:
  node_count: 2
  nodes:
    User:
      ids: [1]
      absent: [2]
    Group:
      ids: [100]
      absent: [102]
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 100 }
  edge_absent:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 102 }
