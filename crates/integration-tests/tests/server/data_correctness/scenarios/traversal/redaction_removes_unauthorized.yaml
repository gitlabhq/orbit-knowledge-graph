# source: crates/integration-tests/tests/server/data_correctness/traversal.rs::traversal_redaction_removes_unauthorized_data
description: Redaction removes nodes and edges the user is not authorized to see

config:
  redaction:
    allow:
      user: [1]
      group: [100]

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "g", "entity": "Group", "columns": ["name"]}
        ],
        "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
        "limit": 20
    }
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, g.name LIMIT 20

expect:
  node_count: 2
  nodes:
    User:
      ids: [1]
      absent: [2]
    Group:
      ids: [100]
      absent: [102]
  edge_exists:
    MEMBER_OF:
      - [1, 100]
  edge_absent:
    MEMBER_OF:
      - [1, 102]
