description: Shared group nodes are deduplicated when multiple users fan into them

query:
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id IN [1, 2] RETURN u.username, g.name LIMIT 20

expect:
  node_count: 4
  nodes:
    User:
      ids: [1, 2]
    Group:
      ids: [100, 102]
  edges:
    MEMBER_OF:
      - [1, 100]
      - [1, 102]
      - [2, 100]
