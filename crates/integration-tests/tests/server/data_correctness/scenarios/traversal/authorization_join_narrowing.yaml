cases:
  - name: pinned_target_narrows_the_caller_join
    description: The caller authorization join reads only the keys of edges into the pinned definition
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"caller","entity":"Definition"},{"id":"def","entity":"Definition","node_ids":[12001]}],"relationships":[{"type":"CALLS","from":"caller","to":"def"}],"limit":50}
      gql: |
        MATCH (caller:Definition)-[:CALLS]->(def:Definition {id: 12001}) RETURN caller, def LIMIT 50
    expect:
      sql_contains: ["(def.id = ", "caller.id IN (SELECT _orbit_edge_0.source_id AS id FROM"]
      node_count: 2
      nodes:
        Definition:
          ids: [12000, 12001]
      edges:
        CALLS:
          - [12000, 12001]

  - name: pinned_source_narrows_the_callee_join
    description: The callee authorization join reads only the keys of edges out of the pinned definition
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"caller","entity":"Definition","node_ids":[12000]},{"id":"callee","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"caller","to":"callee"}],"limit":50}
      gql: |
        MATCH (caller:Definition {id: 12000})-[:CALLS]->(callee:Definition) RETURN caller, callee LIMIT 50
    expect:
      sql_contains: ["(caller.id = ", "callee.id IN (SELECT _orbit_edge_0.target_id AS id FROM"]
      node_count: 2
      nodes:
        Definition:
          ids: [12000, 12001]
      edges:
        CALLS:
          - [12000, 12001]

  - name: unkeyed_edge_keeps_the_full_join
    description: Without source_id or target_id conditions the edge cannot narrow the authorization join
    query:
      gql: |
        MATCH (caller:Definition)-[:CALLS]->(callee:Definition) WHERE caller.project_id = 1000 RETURN caller, callee LIMIT 50
    expect:
      compile_only: true
      sql_contains: ["AS callee FINAL ON"]
      sql_not_contains: ["IN (SELECT _orbit_edge_0"]
