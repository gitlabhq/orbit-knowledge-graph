description: Hydrated datetime renders in the same ISO 8601 UTC form as the inline path

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "n", "entity": "Note", "id_range": {"start": 3004, "end": 3004}, "columns": ["created_at"]},
            {"id": "u", "entity": "User", "node_ids": [4], "columns": ["username"]}
        ],
        "relationships": [{"type": "AUTHORED", "from": "u", "to": "n"}],
        "limit": 10
    }
  gql: |
    MATCH (u:User {id: 4})-[:AUTHORED]->(n:Note) WHERE n.id >= 3004 AND n.id <= 3004 RETURN n.created_at, u.username LIMIT 10

expect:
  hydration: static
  sql_not_contains: ["AS n_created_at"]
  node_count: 2
  edge_exists:
    AUTHORED:
      - [4, 3004]
  nodes:
    Note:
      ids: [3004]
      rows:
        - { id: 3004, created_at: "2024-01-15T10:30:00.123456Z" }
    User:
      rows:
        - { id: 4, username: diana }
