description: Hydrated datetime renders in the same ISO 8601 UTC form as the inline path

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "u", "entity": "User", "node_ids": [1]},
            {"id": "w", "entity": "WorkItem", "id_range": {"start": 1, "end": 10000}, "columns": ["created_at"]}
        ],
        "relationships": [{"type": "ASSIGNED", "from": "u", "to": "w"}],
        "limit": 10
    }
  gql: |
    MATCH (u:User {id: 1})-[:ASSIGNED]->(w:WorkItem) WHERE w.id >= 1 AND w.id <= 10000 RETURN w.created_at LIMIT 10

expect:
  hydration: static
  sql_not_contains: ["AS w_created_at"]
  node_count: 2
  edge_exists:
    ASSIGNED:
      - [1, 4000]
  nodes:
    User:
      ids: [1]
    WorkItem:
      ids: [4000]
      rows:
        - { id: 4000, created_at: "2024-03-01T09:00:00Z" }
