# source: crates/integration-tests/tests/server/data_correctness/traversal.rs::aggregation_variable_length_counts_all_depths
description: Variable-length aggregation counts paths at all depths

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "u", "entity": "User", "node_ids": [7]},
        {"id": "wi", "entity": "WorkItem"},
        {"id": "p", "entity": "Project"},
        {"id": "g", "entity": "Group"}
      ],
      "relationships": [
        {"type": "AUTHORED", "from": "u", "to": "wi"},
        {"type": "IN_PROJECT", "from": "wi", "to": "p"},
        {"type": "CONTAINS", "from": "g", "to": "p", "hops": [1, 2]}
      ],
      "group_by": ["u"],
      "aggregations": [{"count": "g", "as": "n"}],
      "limit": 5
    }

expect:
  groups:
    u:
      entity: User
      ids: [7]
      rows:
        - { entity: User, id: 7, values: { n: 2 } }
