description: Order by source node username sorts users alphabetically

query:
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, g.name ORDER BY u.username LIMIT 20

expect:
  node_count: 9
  referential_integrity: true
  edge_count:
    MEMBER_OF: 9
  nodes:
    User:
      order: [1, 2, 3, 4, 5, 6]
