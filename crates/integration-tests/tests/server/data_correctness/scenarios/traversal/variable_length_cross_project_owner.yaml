description: A denied project's Definition as the middle hop of CALLS*2..2 is redacted

config:
  extra_seed:
    gl_definition:
      - { id: 12003, traversal_path: "1/100/1000/", project_id: 1000, branch: main, commit_sha: abc123, file_path: "crates/orbit/src/sink.rs", fqn: "orbit::sink", name: sink, definition_type: Function, start_line: 1, end_line: 2, start_byte: 1, end_byte: 2, start_char: 1, end_char: 2 }
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 12001, source_kind: Definition, relationship_kind: CALLS, target_id: 12102, target_kind: Definition }
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 12102, source_kind: Definition, relationship_kind: CALLS, target_id: 12003, target_kind: Definition }

cases:
  - name: hop_project_allowed
    description: Both projects allowed returns the path through the project 1001 hop
    config:
      redaction:
        allow:
          project: [1000, 1001]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "start", "entity": "Definition", "id_range": {"start": 12000, "end": 12999}},
            {"id": "callee", "entity": "Definition", "id_range": {"start": 12003, "end": 12003}}
          ],
          "relationships": [{"type": "CALLS", "from": "start", "to": "callee", "hops": [2, 2]}],
          "limit": 10
        }
      gql: |
        MATCH (start:Definition)-[:CALLS*2..2]->(callee:Definition) WHERE start.id >= 12000 AND start.id <= 12999 AND callee.id = 12003 RETURN start, callee LIMIT 10
    expect:
      skip_requirements: ["node_ids", "node_count", "relationship:CALLS"]
      nodes:
        Definition:
          ids: [12001, 12003]

  - name: hop_project_denied
    description: The middle hop is owned by the denied project, so the whole row is redacted
    config:
      redaction:
        allow:
          project: [1000]
    query:
      json: |
        {
          "query_type": "traversal",
          "nodes": [
            {"id": "start", "entity": "Definition", "id_range": {"start": 12000, "end": 12999}},
            {"id": "callee", "entity": "Definition", "id_range": {"start": 12003, "end": 12003}}
          ],
          "relationships": [{"type": "CALLS", "from": "start", "to": "callee", "hops": [2, 2]}],
          "limit": 10
        }
      gql: |
        MATCH (start:Definition)-[:CALLS*2..2]->(callee:Definition) WHERE start.id >= 12000 AND start.id <= 12999 AND callee.id = 12003 RETURN start, callee LIMIT 10
    expect:
      skip_requirements: ["node_ids", "node_count", "relationship:CALLS"]
      nodes:
        Definition:
          absent: [12001, 12003]
