description: Code graph CALLS traversal without node_ids relies on auth-scope cascade

query:
  gql: |
    MATCH (caller:Definition)-[:CALLS]->(callee:Definition) WHERE caller.id >= 12000 AND caller.id <= 12999 RETURN caller.name, caller.fqn, callee.name, callee.fqn LIMIT 20

expect:
  node_count: 4
  referential_integrity: true
  nodes:
    Definition:
      rows:
        - id: 12000
          name: compile
  edges:
    CALLS:
      - [12000, 12001]
      - [12001, 12002]
      - [12001, 12102]
