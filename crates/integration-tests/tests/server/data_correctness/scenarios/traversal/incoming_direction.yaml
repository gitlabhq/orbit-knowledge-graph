description: Incoming direction reverses MEMBER_OF to find users of a group

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "g", "entity": "Group", "columns": ["name"], "node_ids": [100]},
            {"id": "u", "entity": "User", "columns": ["username"]}
        ],
        "relationships": [{"type": "MEMBER_OF", "from": "g", "to": "u", "direction": "incoming"}],
        "limit": 10
    }
  gql: |
    MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(u:User) RETURN g.name, u.username LIMIT 10

expect:
  node_count: 4
  nodes:
    User:
      ids: [1, 2, 6]
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 1, to: Group, to_id: 100 }
      - { from: User, from_id: 2, to: Group, to_id: 100 }
      - { from: User, from_id: 6, to: Group, to_id: 100 }
