description: Filter on User state=blocked narrows traversal to matching users

query:
  gql: |
    MATCH (u:User {state: 'blocked'})-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.state, g.name LIMIT 20

expect:
  node_count: 2
  nodes:
    User:
      ids: [5]
      filters:
        state: blocked
  edge_exists:
    MEMBER_OF:
      - { from: User, from_id: 5, to: Group, to_id: 101 }
