description: Code graph CALLS traversal with explicit node_ids on caller

query:
  gql: |
    MATCH (caller:Definition {id: 12000})-[:CALLS]->(callee:Definition) RETURN caller.name, caller.fqn, callee.name, callee.fqn LIMIT 20

expect:
  node_count: 2
  referential_integrity: true
  nodes:
    Definition:
      ids: [12000, 12001]
  edges:
    CALLS:
      - [12000, 12001]
