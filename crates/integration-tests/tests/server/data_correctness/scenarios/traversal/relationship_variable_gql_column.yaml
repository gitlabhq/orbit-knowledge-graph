description: RETURN m, r, w adds an r column to the gql table that shows each row's relationship

query:
  gql: |
    MATCH (u:User {id: 1})-[r:AUTHORED]->(mr:MergeRequest) RETURN u, r, mr LIMIT 10

expect:
  node_count: 3
  nodes:
    MergeRequest:
      ids: [2000, 2001]
  edges:
    AUTHORED: [[1, 2000], [1, 2001]]
  gql_columns:
    r: ['[:AUTHORED]', '[:AUTHORED]']
