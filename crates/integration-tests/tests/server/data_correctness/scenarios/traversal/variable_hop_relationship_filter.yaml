description: A relationship filter on a two-hop walk applies to both edges, so only the path whose edges are both in project 9 is returned

config:
  redaction:
    allow:
      project: [1000, 9, 10]
  extra_seed:
    gl_definition:
      - { id: 99390, traversal_path: "1/100/1000/", project_id: 9, branch: main, name: root, fqn: root }
      - { id: 99391, traversal_path: "1/100/1000/", project_id: 9, branch: main, name: hop, fqn: hop }
      - { id: 99392, traversal_path: "1/100/1000/", project_id: 9, branch: main, name: kept, fqn: kept }
      - { id: 99393, traversal_path: "1/100/1000/", project_id: 10, branch: main, name: second_hop_other_project, fqn: second_hop_other_project }
      - { id: 99394, traversal_path: "1/100/1000/", project_id: 10, branch: main, name: first_hop_other_project, fqn: first_hop_other_project }
      - { id: 99395, traversal_path: "1/100/1000/", project_id: 9, branch: main, name: behind_other_project, fqn: behind_other_project }
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 9, branch: main, source_id: 99390, source_kind: Definition, relationship_kind: CALLS, target_id: 99391, target_kind: Definition }
      - { traversal_path: "1/100/1000/", project_id: 9, branch: main, source_id: 99391, source_kind: Definition, relationship_kind: CALLS, target_id: 99392, target_kind: Definition }
      - { traversal_path: "1/100/1000/", project_id: 10, branch: main, source_id: 99391, source_kind: Definition, relationship_kind: CALLS, target_id: 99393, target_kind: Definition }
      - { traversal_path: "1/100/1000/", project_id: 10, branch: main, source_id: 99390, source_kind: Definition, relationship_kind: CALLS, target_id: 99394, target_kind: Definition }
      - { traversal_path: "1/100/1000/", project_id: 9, branch: main, source_id: 99394, source_kind: Definition, relationship_kind: CALLS, target_id: 99395, target_kind: Definition }

query:
  json: |
    {"query_type":"traversal","nodes":[{"id":"a","entity":"Definition","node_ids":[99390]},{"id":"b","entity":"Definition"}],"relationships":[{"type":"CALLS","from":"a","to":"b","hops":[2,2],"filters":{"project_id":9}}],"limit":10}

expect:
  node_count: 2
  nodes:
    Definition:
      ids: [99390, 99392]
      absent: [99393, 99395]
  edges:
    CALLS: [[99390, 99392]]
