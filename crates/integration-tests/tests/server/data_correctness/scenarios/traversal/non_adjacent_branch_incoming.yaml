description: An incoming membership branch joins projects through the original group

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "g", "entity": "Group", "node_ids": [100]},
        {"id": "u", "entity": "User"},
        {"id": "mr", "entity": "MergeRequest"},
        {"id": "p", "entity": "Project"}
      ],
      "relationships": [
        {"type": "MEMBER_OF", "from": "g", "to": "u", "direction": "incoming"},
        {"type": "APPROVED", "from": "u", "to": "mr"},
        {"type": "CONTAINS", "from": "g", "to": "p"}
      ],
      "limit": 20
    }
  gql: |
    MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(u:User)-[:APPROVED]->(mr:MergeRequest),
          (g)-[:CONTAINS]->(p:Project)
    RETURN g, u, mr, p LIMIT 20

expect:
  node_count: 7
  total_edge_count: 6
  referential_integrity: true
  nodes:
    Group: { ids: [100] }
    User: { ids: [1, 2] }
    MergeRequest: { ids: [2000, 2002] }
    Project: { ids: [1000, 1002] }
  edges:
    MEMBER_OF: [[1, 100], [2, 100]]
    APPROVED: [[1, 2002], [2, 2000]]
    CONTAINS: [[100, 1000], [100, 1002]]
