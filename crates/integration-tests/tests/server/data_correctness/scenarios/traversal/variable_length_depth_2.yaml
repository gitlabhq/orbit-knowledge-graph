# source: crates/integration-tests/tests/server/data_correctness/traversal.rs::traversal_variable_length_reaches_depth_2
description: Variable-length CONTAINS with hops [1,2] reaches depth-2 groups

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "parent", "entity": "Group", "columns": ["name"], "node_ids": [100]},
            {"id": "child", "entity": "Group", "columns": ["name"]}
        ],
        "relationships": [{"type": "CONTAINS", "from": "parent", "to": "child", "hops": [1, 2]}],
        "limit": 10
    }

expect:
  node_count: 3
  nodes:
    Group:
      ids: [100, 200, 300]
  edge_exists:
    CONTAINS:
      - [100, 200]
      - [100, 300]
