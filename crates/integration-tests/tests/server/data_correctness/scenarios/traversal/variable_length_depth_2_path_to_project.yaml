description: Variable-length CONTAINS includes depth-2 path from group to project (MR !1069 cliff fix)

query:
  gql: |
    MATCH (u:User {id: 7})-[:AUTHORED]->(wi:WorkItem)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS*1..2]-(g:Group) RETURN u.username, wi.title, p.name, g.name LIMIT 20

expect:
  referential_integrity: true
  node_count: 5
  nodes:
    User:
      ids: [7]
    WorkItem:
      ids: [4010]
    Project:
      ids: [1010]
    Group:
      ids: [100, 200]
  edge_exists:
    AUTHORED:
      - { from: User, from_id: 7, to: WorkItem, to_id: 4010 }
    IN_PROJECT:
      - { from: WorkItem, from_id: 4010, to: Project, to_id: 1010 }
    CONTAINS:
      - { from: Group, from_id: 200, to: Project, to_id: 1010 }
      - { from: Group, from_id: 100, to: Project, to_id: 1010 }
