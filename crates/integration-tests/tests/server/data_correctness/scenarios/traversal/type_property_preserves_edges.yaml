description: Selecting user_type retains membership edges

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username", "user_type"]},
        {"id": "g", "entity": "Group", "columns": ["name"]}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "order_by": "u.username",
      "limit": 20
    }
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, u.user_type, g.name ORDER BY u.username LIMIT 20

expect:
  node_count: 9
  referential_integrity: true
  edge_count:
    MEMBER_OF: 9
  nodes:
    User:
      order: [1, 2, 3, 4, 5, 6]
