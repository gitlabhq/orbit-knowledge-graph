# source: crates/integration-tests/tests/server/data_correctness/traversal.rs::traversal_variable_length_with_redaction_at_depth
description: Redacting an intermediate group in a variable-length path denies all rows through it

config:
  redaction:
    allow:
      group: [100, 300]

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "parent", "entity": "Group", "columns": ["name"], "node_ids": [100]},
            {"id": "child", "entity": "Group", "columns": ["name"]}
        ],
        "relationships": [{"type": "CONTAINS", "from": "parent", "to": "child", "hops": [1, 2]}],
        "limit": 10
    }

expect:
  skip_requirements: ["node_ids", "node_count", "relationship:CONTAINS"]
  nodes:
    Group:
      absent: [200]
