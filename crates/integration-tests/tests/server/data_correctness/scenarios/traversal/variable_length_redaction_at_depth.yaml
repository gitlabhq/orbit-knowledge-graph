description: Redacting an intermediate group in a variable-length path denies all rows through it

config:
  redaction:
    allow:
      group: [100, 300]

query:
  gql: |
    MATCH (parent:Group {id: 100})-[:CONTAINS*1..2]->(child:Group) RETURN parent.name, child.name LIMIT 10

expect:
  skip_requirements: ["node_ids", "node_count", "relationship:CONTAINS"]
  nodes:
    Group:
      absent: [200]
