description: A branch after a two-hop path joins back to the pinned user

query:
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project),
          (u)-[:APPROVED]->(mr:MergeRequest)
    RETURN u, g, p, mr LIMIT 20

expect:
  node_count: 7
  total_edge_count: 6
  referential_integrity: true
  nodes:
    User: { ids: [1] }
    Group: { ids: [100, 102] }
    Project: { ids: [1000, 1002, 1004] }
    MergeRequest: { ids: [2002] }
  edges:
    MEMBER_OF: [[1, 100], [1, 102]]
    CONTAINS: [[100, 1000], [100, 1002], [102, 1004]]
    APPROVED: [[1, 2002]]
