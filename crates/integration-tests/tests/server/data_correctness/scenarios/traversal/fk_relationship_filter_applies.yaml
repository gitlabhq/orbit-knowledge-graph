description: >
  A filter on a relationship backed by a foreign key keeps the edge scan and
  excludes rows. The filter on the edge's source_id removes merge request 2000.

query:
  gql: |
    MATCH (p:Project {id: 1000})<-[r:IN_PROJECT]-(mr:MergeRequest)
    WHERE r.source_id <> 2000
    RETURN p.name, mr.title LIMIT 20

expect:
  skip_requirements: [node_ids]
  sql_contains: ["source_id != 2000"]
  node_count: 4
  nodes:
    Project:
      ids: [1000]
    MergeRequest:
      ids: [2001, 2004, 2005]
      absent: [2000]
  edges:
    IN_PROJECT: [[2001, 1000], [2004, 1000], [2005, 1000]]
