description: Variable-hop traversal uses an edge whose current version is live

config:
  unmerged_seed: true
  security: { paths: ["1/100/1000/"] }
  extra_seed:
    gl_definition:
      - { id: 99010, traversal_path: "1/100/1000/", project_id: 1000, branch: main, name: caller, fqn: caller }
      - { id: 99011, traversal_path: "1/100/1000/", project_id: 1000, branch: main, name: callee, fqn: callee }
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 99010, source_kind: Definition, relationship_kind: CALLS, target_id: 12001, target_kind: Definition, _version: "2026-01-01 00:00:00", _deleted: false }
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 12001, source_kind: Definition, relationship_kind: CALLS, target_id: 99011, target_kind: Definition }

query:
  gql: |
    MATCH (a:Definition {id: 99010})-[:CALLS*2]->(b:Definition {id: 99011})
    RETURN a.id, b.id

expect:
  node_count: 2
  nodes:
    Definition: { ids: [99010, 99011] }
  edges:
    CALLS: [[99010, 99011]]
