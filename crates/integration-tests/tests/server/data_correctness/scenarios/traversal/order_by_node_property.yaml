description: Order by MR title sorts target nodes alphabetically

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "mr", "entity": "MergeRequest", "columns": ["title", "state"]}
        ],
        "relationships": [{"type": "AUTHORED", "from": "u", "to": "mr"}],
        "order_by": "mr.title",
        "limit": 20
    }
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, mr.title, mr.state ORDER BY mr.title LIMIT 20

expect:
  node_count: 7
  referential_integrity: true
  nodes:
    MergeRequest:
      order: [2000, 2001, 2002, 2003]
  edge_exists:
    AUTHORED:
      - { from: User, from_id: 1, to: MergeRequest, to_id: 2000 }
