description: Node narrowing uses the full variable-hop endpoint frontier

config:
  security:
    paths: ["1/100/1000/"]
  extra_seed:
    gl_definition:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000, branch: main, name: audit_caller, fqn: audit_caller }
      - { id: 99001, traversal_path: "1/100/1000/", project_id: 1000, branch: main, name: audit_target, fqn: audit_target }
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 99000, source_kind: Definition, relationship_kind: CALLS, target_id: 12001, target_kind: Definition }
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 12001, source_kind: Definition, relationship_kind: CALLS, target_id: 99001, target_kind: Definition }

query:
  gql: |
    MATCH (a:Definition {id: 99000, branch: 'main'})-[:CALLS*2]->(b:Definition)
    RETURN a.id, a.branch, b.name, b.branch

expect:
  node_count: 3
  nodes:
    Definition:
      ids: [99000, 99001, 12002]
      filters: { branch: main }
  edges:
    CALLS: [[99000, 99001], [99000, 12002]]
