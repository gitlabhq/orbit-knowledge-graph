description: User-MergeRequest AUTHORED traversal returns correct edges and node properties

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000}, "columns": ["username"]},
            {"id": "mr", "entity": "MergeRequest", "columns": ["title", "state"]}
        ],
        "relationships": [{"type": "AUTHORED", "from": "u", "to": "mr"}],
        "limit": 20
    }
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest) WHERE u.id >= 1 AND u.id <= 10000 RETURN u.username, mr.title, mr.state LIMIT 20

expect:
  hydration: static
  sql_contains: ["AS mr_title", "AS mr_state"]
  sql_not_contains: ["AS u_username"]
  node_count: 7
  referential_integrity: true
  edge_exists:
    AUTHORED:
      - { from: User, from_id: 1, to: MergeRequest, to_id: 2000 }
      - { from: User, from_id: 1, to: MergeRequest, to_id: 2001 }
      - { from: User, from_id: 2, to: MergeRequest, to_id: 2002 }
      - { from: User, from_id: 3, to: MergeRequest, to_id: 2003 }
  nodes:
    MergeRequest:
      rows:
        - id: 2000
          title: "Add feature A"
          state: opened
        - id: 2002
          title: "Refactor C"
          state: merged
