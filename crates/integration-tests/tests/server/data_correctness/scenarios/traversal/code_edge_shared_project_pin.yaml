description: A project filter on one endpoint of a code edge pins the other endpoint scan and keeps the rows

config:
  security:
    paths: ["1/100/"]
  extra_seed:
    gl_imported_symbol:
      - { id: 14000, traversal_path: "1/100/1000/", project_id: 1000, branch: main }
      - { id: 14200, traversal_path: "1/100/1002/", project_id: 1002, branch: main }
    gl_definition:
      - { id: 12200, traversal_path: "1/100/1002/", project_id: 1002, branch: main, name: compile, fqn: "compiler::compile" }
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 14000, source_kind: ImportedSymbol, relationship_kind: IMPORTS, target_id: 12000, target_kind: Definition }
      - { traversal_path: "1/100/1002/", project_id: 1002, branch: main, source_id: 14200, source_kind: ImportedSymbol, relationship_kind: IMPORTS, target_id: 12200, target_kind: Definition }

cases:
  - name: source_project_filter_pins_target_scan
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"i","entity":"ImportedSymbol","filters":{"project_id":1000},"columns":["project_id"]},{"id":"d","entity":"Definition","columns":["project_id","name"]}],"relationships":[{"type":"IMPORTS","from":"i","to":"d"}],"limit":10}
      gql: |
        MATCH (i:ImportedSymbol)-[:IMPORTS]->(d:Definition) WHERE i.project_id = 1000 RETURN i.project_id, d.project_id, d.name LIMIT 10
    expect:
      node_count: 2
      nodes:
        ImportedSymbol: { ids: [14000], filters: { project_id: { eq: 1000 } } }
        Definition: { rows: [{ id: 12000, project_id: 1000, name: compile }] }
      edges: { IMPORTS: [[14000, 12000]] }
      sql_contains: ["(d.project_id = 1000)"]

  - name: target_project_filter_pins_source_scan
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"i","entity":"ImportedSymbol","columns":["project_id"]},{"id":"d","entity":"Definition","filters":{"project_id":1002},"columns":["project_id","name"]}],"relationships":[{"type":"IMPORTS","from":"i","to":"d"}],"limit":10}
      gql: |
        MATCH (i:ImportedSymbol)-[:IMPORTS]->(d:Definition) WHERE d.project_id = 1002 RETURN i.project_id, d.project_id, d.name LIMIT 10
    expect:
      node_count: 2
      nodes:
        ImportedSymbol: { rows: [{ id: 14200, project_id: 1002 }] }
        Definition: { ids: [12200], filters: { project_id: { eq: 1002 } } }
      edges: { IMPORTS: [[14200, 12200]] }
      sql_contains: ["(i.project_id = 1002)"]

  - name: no_project_filter_keeps_both_projects
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"i","entity":"ImportedSymbol","columns":["project_id"]},{"id":"d","entity":"Definition","filters":{"name":"compile"},"columns":["project_id","name"]}],"relationships":[{"type":"IMPORTS","from":"i","to":"d"}],"limit":10}
      gql: |
        MATCH (i:ImportedSymbol)-[:IMPORTS]->(d:Definition) WHERE d.name = 'compile' RETURN i.project_id, d.project_id, d.name LIMIT 10
    expect:
      node_count: 4
      nodes:
        ImportedSymbol: { ids: [14000, 14200] }
        Definition: { ids: [12000, 12200], filters: { name: { eq: compile } } }
      edges: { IMPORTS: [[14000, 12000], [14200, 12200]] }
      sql_not_contains: ["i.project_id =", "d.project_id ="]
