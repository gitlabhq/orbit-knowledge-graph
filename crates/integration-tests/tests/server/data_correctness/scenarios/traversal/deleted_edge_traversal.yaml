description: Single-hop traversal does not return a tombstoned edge before merges

config:
  unmerged_seed: true
  redaction:
    allow:
      user: [99002]
      merge_request: [99000]
  extra_seed:
    gl_user:
      - { id: 99002, username: deleted_user }
    gl_merge_request:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000, title: deleted_mr }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 99002, source_kind: User, relationship_kind: APPROVED, target_id: 99000, target_kind: MergeRequest, _version: "2026-01-01 00:00:00", _deleted: false }
      - { traversal_path: "1/100/1000/", source_id: 99002, source_kind: User, relationship_kind: APPROVED, target_id: 99000, target_kind: MergeRequest, _version: "2026-01-02 00:00:00", _deleted: true }

query:
  gql: |
    MATCH (u:User {id: 99002})-[:APPROVED]->(mr:MergeRequest)
    RETURN mr

expect:
  skip_requirements: [node_ids, "relationship:APPROVED"]
  node_count: 0
  nodes:
    MergeRequest: { ids: [] }
  edge_count: { APPROVED: 0 }
