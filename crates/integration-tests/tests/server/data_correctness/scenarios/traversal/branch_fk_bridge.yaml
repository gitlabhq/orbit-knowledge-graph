description: A pinned author remains a bridge between approved merge requests and group memberships
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "v", "entity": "User"},
        {"id": "mr", "entity": "MergeRequest"},
        {"id": "u", "entity": "User", "node_ids": [1]},
        {"id": "g", "entity": "Group"}
      ],
      "relationships": [
        {"type": "APPROVED", "from": "v", "to": "mr"},
        {"type": "AUTHORED", "from": "u", "to": "mr"},
        {"type": "MEMBER_OF", "from": "u", "to": "g"}
      ],
      "limit": 20
    }
  gql: |
    MATCH (v:User)-[:APPROVED]->(mr:MergeRequest)<-[:AUTHORED]-(u:User {id: 1})-[:MEMBER_OF]->(g:Group)
    RETURN v, mr, u, g LIMIT 20
expect:
  node_count: 6
  total_edge_count: 5
  referential_integrity: true
  nodes:
    User: { ids: [1, 2, 3] }
    MergeRequest: { ids: [2000] }
    Group: { ids: [100, 102] }
  edges:
    APPROVED: [[2, 2000], [3, 2000]]
    AUTHORED: [[1, 2000]]
    MEMBER_OF: [[1, 100], [1, 102]]
