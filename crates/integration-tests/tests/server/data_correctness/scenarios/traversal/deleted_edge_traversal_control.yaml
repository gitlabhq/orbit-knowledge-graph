description: Single-hop traversal returns an edge whose current version is live

config:
  unmerged_seed: true
  redaction:
    allow:
      user: [99002]
      merge_request: [99000]
  extra_seed:
    gl_user:
      - { id: 99002, username: live_user }
    gl_merge_request:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000, title: live_mr }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 99002, source_kind: User, relationship_kind: APPROVED, target_id: 99000, target_kind: MergeRequest, _version: "2026-01-01 00:00:00", _deleted: false }

query:
  gql: |
    MATCH (u:User {id: 99002})-[:APPROVED]->(mr:MergeRequest)
    RETURN mr

expect:
  node_count: 2
  nodes:
    User: { ids: [99002] }
    MergeRequest: { ids: [99000] }
  edges:
    APPROVED: [[99002, 99000]]
