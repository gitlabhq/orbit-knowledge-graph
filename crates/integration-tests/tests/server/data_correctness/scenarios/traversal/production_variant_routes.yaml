      - { traversal_path: "2/200/3000/", source_id: 3500, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 3000, target_kind: Project }

cases:
  - name: IN_PROJECT returns every specialized route
    description: Incoming IN_PROJECT scopes directly authorizable variants across every physical table
    config:
      security: { org_id: 1, paths: ["1/100/"], access_level: 50 }
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"project","entity":"Project","node_ids":[1000,3000]}],"neighbors":{"direction":"incoming","rel_types":["IN_PROJECT"]}}
      gql: |
        MATCH (project:Project)<-[:IN_PROJECT]-(neighbor) WHERE project.id IN [1000, 3000] RETURN project, neighbor
    expect:
      node_count: 14
      skip_requirements: [node_ids]
      edges:
        IN_PROJECT: [[1101, 1000], [1201, 1000], [1301, 1000], [1401, 1000], [1501, 1000], [1601, 1000], [1701, 1000], [1801, 1000], [1901, 1000], [2101, 1000], [2201, 1000], [2500, 1000], [2601, 1000]]
      sql_contains: [gl_ci_edge, gl_code_edge, gl_diff_edge, gl_edge, gl_sec_edge]

  - name: MergeRequestDiff IN_PROJECT preserves indirect authorization and scope
    description: Exact traversal routes through gl_diff_edge and excludes the same variant in another organization
    config:
      security: { org_id: 1, paths: ["1/100/"], access_level: 50 }
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"diff","entity":"MergeRequestDiff","node_ids":[20001,40001]},{"id":"project","entity":"Project"}],"relationships":[{"type":"IN_PROJECT","from":"diff","to":"project","filters":{"target_id":1000}}]}
      gql: |
        MATCH (diff:MergeRequestDiff)-[:IN_PROJECT {target_id: 1000}]->(project:Project) WHERE diff.id IN [20001, 40001] RETURN diff, project
    expect:
      node_count: 2
      skip_requirements: [node_ids, "relationship:CONTAINS"]
      nodes:
        MergeRequestDiff: { ids: [20001], absent: [40001] }
        Project: { ids: [1000], absent: [3000] }
      edges:
        IN_PROJECT: [[20001, 1000]]
      sql_contains: [gl_diff_edge]

  - name: MergeRequestDiffFile IN_PROJECT preserves indirect authorization and scope
    description: Exact traversal routes through gl_diff_edge and excludes the same variant in another organization
    config:
      security: { org_id: 1, paths: ["1/100/"], access_level: 50 }
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"file","entity":"MergeRequestDiffFile","node_ids":[20002,40002]},{"id":"project","entity":"Project"}],"relationships":[{"type":"IN_PROJECT","from":"file","to":"project","filters":{"target_id":1000}}]}
      gql: |
        MATCH (file:MergeRequestDiffFile)-[:IN_PROJECT {target_id: 1000}]->(project:Project) WHERE file.id IN [20002, 40002] RETURN file, project
    expect:
      node_count: 2
      skip_requirements: [node_ids]
      nodes:
        MergeRequestDiffFile: { ids: [20002], absent: [40002] }
        Project: { ids: [1000], absent: [3000] }
      edges:
        IN_PROJECT: [[20002, 1000]]
      sql_contains: [gl_diff_edge]

  - name: Vulnerability neighbors return every security route
    description: Vulnerability neighbors read every newly specialized security relationship from gl_sec_edge
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"vulnerability","entity":"Vulnerability","node_ids":[1401]}],"neighbors":{"direction":"both","rel_types":["AUTHORED","CONFIRMED_BY","RESOLVED_BY","DISMISSED_BY","FIXES","HAS_VULNERABILITY"]}}
      gql: |
        MATCH (vulnerability:Vulnerability {id: 1401})-[:AUTHORED|CONFIRMED_BY|RESOLVED_BY|DISMISSED_BY|FIXES|HAS_VULNERABILITY]-(neighbor) RETURN vulnerability, neighbor
    expect:
      node_count: 4
      edges:
        AUTHORED: [[1, 1401]]
        CONFIRMED_BY: [[1, 1401]]
        RESOLVED_BY: [[1, 1401]]
        DISMISSED_BY: [[1, 1401]]
        FIXES: [[2501, 1401]]
        HAS_VULNERABILITY: [[2301, 1401]]
      sql_contains: [gl_sec_edge]
      skip_requirements: [node_ids]

  - name: Global user lifecycle routes exclude another namespace
    description: Split AUTHORED and vulnerability lifecycle routes prune to the authorized target namespace
    config:
      security: { org_id: 1, paths: ["1/100/"], access_level: 50 }
    query:
      json: |
        {"query_type":"neighbors","nodes":[{"id":"user","entity":"User","node_ids":[1]}],"neighbors":{"direction":"outgoing","rel_types":["AUTHORED","CONFIRMED_BY","RESOLVED_BY","DISMISSED_BY"]}}
      gql: |
        MATCH (user:User {id: 1})-[:AUTHORED|CONFIRMED_BY|RESOLVED_BY|DISMISSED_BY]->(neighbor) RETURN user, neighbor
    expect:
      node_count: 3
      skip_requirements: [node_ids]
      edges:
        AUTHORED: [[1, 1401], [1, 2500]]
        CONFIRMED_BY: [[1, 1401]]
        RESOLVED_BY: [[1, 1401]]
        DISMISSED_BY: [[1, 1401]]
      sql_contains: [gl_edge, gl_sec_edge]

  - name: FIXES excludes another namespace through endpoint authorization
    description: The unscoped FIXES route retains only the merge request and vulnerability in the authorized namespace
    config:
      security: { org_id: 1, paths: ["1/100/"], access_level: 50 }
    query:
      json: |
        {"query_type":"traversal","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[2501,4500]},{"id":"vulnerability","entity":"Vulnerability"}],"relationships":[{"type":"FIXES","from":"mr","to":"vulnerability"}]}
      gql: |
        MATCH (mr:MergeRequest)-[:FIXES]->(vulnerability:Vulnerability) WHERE mr.id IN [2501, 4500] RETURN mr, vulnerability
    expect:
      node_count: 2
      skip_requirements: [node_ids]
      nodes:
        MergeRequest: { ids: [2501], absent: [4500] }
        Vulnerability: { ids: [1401], absent: [3401] }
      edges:
        FIXES: [[2501, 1401]]
