      deployment: [1801, 3801]
      environment: [1901, 3901]
      merge_request: [2500, 2501, 3500, 4500]
      vulnerability_scanner: [2101, 4101]
      vulnerability_occurrence: [2201, 4201]
      package: [2301, 4301]
      package_file: [2401, 4401]
  extra_seed:
    gl_project:
      - { id: 1000, name: Route Project, full_path: route/project, visibility_level: public, traversal_path: "1/100/1000/" }
      - { id: 3000, name: Other Route Project, full_path: other/project, visibility_level: public, traversal_path: "2/200/3000/" }
    gl_user:
      - { id: 1, username: router, name: Route User, state: active }
    gl_pipeline:
