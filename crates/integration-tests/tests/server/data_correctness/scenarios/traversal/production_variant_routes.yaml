      - { id: 3301, name: route-job, status: success, project_id: 3000, traversal_path: "2/200/3000/" }
    gl_vulnerability:
      - { id: 1401, title: Route Vulnerability, state: detected, severity: critical, report_type: sast, project_id: 1000, traversal_path: "1/100/1000/" }
      - { id: 3401, title: Route Vulnerability, state: detected, severity: critical, report_type: sast, project_id: 3000, traversal_path: "2/200/3000/" }
    gl_finding:
