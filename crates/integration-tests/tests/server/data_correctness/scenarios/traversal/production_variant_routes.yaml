config:
  security: admin
  redaction:
    allow:
      project: [1000, 3000]
      user: [1]
      ci_pipeline: [1101, 1102, 3101, 3102]
      ci_stage: [1201, 3201]
      ci_build: [1301, 3301]
      vulnerability: [1401, 3401]
