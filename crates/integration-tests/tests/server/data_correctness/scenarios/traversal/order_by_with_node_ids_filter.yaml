description: Order by descending MR title with node_ids filter on source users

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest) WHERE u.id IN [1, 2] RETURN u.username, mr.title ORDER BY mr.title DESC LIMIT 20

expect:
  node_count: 5
  referential_integrity: true
  nodes:
    User:
      ids: [1, 2]
    MergeRequest:
      order: [2002, 2001, 2000]
  edges:
    AUTHORED:
      - [1, 2000]
      - [1, 2001]
      - [2, 2002]
