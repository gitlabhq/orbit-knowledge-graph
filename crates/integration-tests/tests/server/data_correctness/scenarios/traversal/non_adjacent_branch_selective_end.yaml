description: Pinning the final branch target preserves connectivity through the shared user

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "u", "entity": "User"},
        {"id": "g", "entity": "Group"},
        {"id": "p", "entity": "Project"},
        {"id": "mr", "entity": "MergeRequest", "node_ids": [2002]}
      ],
      "relationships": [
        {"type": "MEMBER_OF", "from": "u", "to": "g"},
        {"type": "CONTAINS", "from": "g", "to": "p"},
        {"type": "APPROVED", "from": "u", "to": "mr"}
      ],
      "limit": 20
    }
  gql: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project),
          (u)-[:APPROVED]->(mr:MergeRequest {id: 2002})
    RETURN u, g, p, mr LIMIT 20

expect:
  node_count: 7
  total_edge_count: 6
  referential_integrity: true
  nodes:
    User: { ids: [1] }
    Group: { ids: [100, 102] }
    Project: { ids: [1000, 1002, 1004] }
    MergeRequest: { ids: [2002] }
  edges:
    MEMBER_OF: [[1, 100], [1, 102]]
    CONTAINS: [[100, 1000], [100, 1002], [102, 1004]]
    APPROVED: [[1, 2002]]
