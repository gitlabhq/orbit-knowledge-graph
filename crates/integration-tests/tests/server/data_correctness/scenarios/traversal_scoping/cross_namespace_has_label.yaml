description: Cross-namespace HAS_LABEL returns labels from a different group

query:
  gql: |
    MATCH (wi:WorkItem)-[:HAS_LABEL]->(lab:Label) WHERE wi.id IN [4000, 4001] RETURN wi, lab LIMIT 50

expect:
  node_count: 5
  nodes:
    WorkItem:
      ids: [4000, 4001]
    Label:
      ids: [7000, 7001, 7002]
  edges:
    HAS_LABEL:
      - [4000, 7000]
      - [4000, 7001]
      - [4001, 7002]
  referential_integrity: true
