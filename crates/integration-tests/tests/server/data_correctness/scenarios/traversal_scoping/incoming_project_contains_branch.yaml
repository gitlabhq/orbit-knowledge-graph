description: JSON rejects incoming containment from a branch to its project

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "p", "entity": "Project", "node_ids": [7000]},
        {"id": "b", "entity": "Branch"}
      ],
      "relationships": [{"type": "CONTAINS", "from": "p", "to": "b", "direction": "incoming"}],
      "aggregations": [{"count": "b", "as": "c"}],
      "limit": 10
    }

expect:
  compile_error: "no CONTAINS relationship connects Project to Branch"
