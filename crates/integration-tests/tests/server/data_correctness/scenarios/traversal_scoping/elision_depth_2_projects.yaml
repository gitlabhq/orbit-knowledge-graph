description: Elided containment counts only projects two hops away
query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"g","entity":"Group","filters":{"full_path":"public-group"}},{"id":"x","entity":"Project"}],
     "relationships":[{"type":"CONTAINS","from":"g","to":"x","hops":[2,2]}],"aggregations":[{"count":"x","as":"c"}],"limit":10}
  gql: |
    MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS*2..2]->(x:Project) RETURN count(x) AS c LIMIT 10
expect:
  sql_contains: ["countSubstrings(x.traversal_path"]
  sql_not_contains: ["gl_edge", "gl_group AS g"]
  skip_requirements: ["filter:full_path"]
  row_count: 1
  row_values: [{c: 1}]
