description: Containment over CONTAINS edges counts only direct projects

query:
  gql: |
    MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS]->(x:Project) RETURN count(x) AS c LIMIT 10

expect:
  sql_contains: ["AS g FINAL", "relationship_kind = 'CONTAINS'", "source_kind = 'Group'", "target_kind = 'Project'"]
  skip_requirements: ["filter:full_path"]
  row_count: 1
  row_values: [{ c: 2 }]
