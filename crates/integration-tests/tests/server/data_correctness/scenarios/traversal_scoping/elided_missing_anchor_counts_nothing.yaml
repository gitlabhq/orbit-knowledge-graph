description: An elided container anchor that does not exist yields an empty aggregation instead of counting the whole authorized scope

query:
  gql: |
    MATCH (g:Group {full_path: 'no-such-group'})-[:CONTAINS]->(p:Project)<-[:IN_PROJECT]-(mr:MergeRequest)<-[:AUTHORED]-(u:User) RETURN u.username, count(mr) AS c LIMIT 10

expect:
  empty_aggregation: true
