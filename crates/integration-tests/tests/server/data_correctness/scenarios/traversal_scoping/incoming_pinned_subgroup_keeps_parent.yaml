description: Incoming containment from a pinned subgroup keeps its ancestor's scope

query:
  gql: |
    MATCH (child:Group {id: 200})<-[:CONTAINS]-(parent:Group) RETURN parent{.id, .name}, count(parent) AS n LIMIT 10

expect:
  sql_contains: ["gl_edge"]
  skip_requirements: ["node_ids"]
  groups:
    parent:
      ids: [100]
      entity: Group
      rows:
        - { entity: Group, id: 100, values: { n: 1 }, properties: { name: Public Group } }
