description: Containment over CONTAINS edges counts projects one or two hops away

query:
  gql: |
    MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS*1..2]->(x:Project) RETURN count(x) AS c LIMIT 10

expect:
  sql_contains: ["AS g FINAL", "relationship_kind = 'CONTAINS'", "depth"]
  skip_requirements: ["filter:full_path"]
  row_count: 1
  row_values: [{ c: 3 }]
