description: Cross-namespace CLOSES edge does not hydrate a work item outside the caller scope

config:
  security: { org_id: 1, paths: ["1/100/"] }
  redaction:
    allow:
      merge_request: [2000]
      work_item: [4002]
  extra_seed:
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 2000, source_kind: MergeRequest, relationship_kind: CLOSES, target_id: 4002, target_kind: WorkItem, source_tags: ["state:opened"], target_tags: ["state:opened", "wi_type:task"] }

query:
  gql: |
    MATCH (mr:MergeRequest)-[:CLOSES]->(wi:WorkItem) WHERE mr.project_id = 1000 RETURN mr.project_id, wi LIMIT 50

expect:
  hydration: static
  node_count: 2
  skip_requirements: ["filter:project_id"]
  nodes:
    MergeRequest:
      ids: [2000]
    WorkItem:
      ids: [4002]
      no_properties: true
  edges:
    CLOSES:
      - [2000, 4002]
  referential_integrity: true
