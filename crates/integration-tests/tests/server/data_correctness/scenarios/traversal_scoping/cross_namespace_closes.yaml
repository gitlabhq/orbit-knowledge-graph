# source: crates/integration-tests/tests/server/data_correctness/traversal_scoping.rs::cross_namespace_closes_returns_cross_project_work_item
description: Cross-namespace CLOSES edge returns a work item from a different group

config:
  security:
    scope_prefixes:
      mr: "1/100/1000/"
  extra_seed:
    gl_edge:
      - { traversal_path: "1/101/", source_id: 2000, source_kind: MergeRequest, relationship_kind: CLOSES, target_id: 4002, target_kind: WorkItem, source_tags: ["state:opened"], target_tags: ["state:opened", "wi_type:task"] }

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "mr", "entity": "MergeRequest", "columns": ["project_id"],
             "filters": {"project_id": {"eq": 1000}}},
            {"id": "wi", "entity": "WorkItem"}
        ],
        "relationships": [{"type": "CLOSES", "from": "mr", "to": "wi"}],
        "limit": 50
    }

expect:
  node_count: 2
  skip_requirements: ["filter:project_id"]
  nodes:
    MergeRequest:
      ids: [2000]
    WorkItem:
      ids: [4002]
  edges:
    CLOSES:
      - [2000, 4002]
  referential_integrity: true
