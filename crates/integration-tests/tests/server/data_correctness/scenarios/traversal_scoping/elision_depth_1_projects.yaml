description: Elided containment counts only direct projects

query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"g","entity":"Group","filters":{"full_path":"public-group"}},{"id":"x","entity":"Project"}],
     "relationships":[{"type":"CONTAINS","from":"g","to":"x","hops":[1,1]}],"aggregations":[{"count":"x","as":"c"}],"limit":10}
  gql: |
    MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS]->(x:Project) RETURN count(x) AS c LIMIT 10

expect:
  sql_contains: ["LIMIT 1 BY g.traversal_path, g.id", "relationship_kind = 'CONTAINS'", "source_kind = 'Group'", "target_kind = 'Project'"]
  skip_requirements: ["filter:full_path"]
  row_count: 1
  row_values: [{ c: 2 }]
