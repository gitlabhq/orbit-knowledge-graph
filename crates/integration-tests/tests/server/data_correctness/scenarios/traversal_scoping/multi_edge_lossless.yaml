# source: crates/integration-tests/tests/server/data_correctness/traversal_scoping.rs::project_scoped_multi_edge_traversal_is_lossless
description: Project-scoped MR-MRDiff-MRDiffFile chain returns all diff files without loss

config:
  security:
    scope_prefixes:
      mr: "1/100/1000/"
      diff: "1/100/1000/"
      df: "1/100/1000/"
  extra_seed:
    gl_merge_request_diff_file:
      - { id: 9300, merge_request_id: 2000, merge_request_diff_id: 5000, project_id: 1000, new_path: "src/a.rs", traversal_path: "1/100/1000/" }
      - { id: 9301, merge_request_id: 2000, merge_request_diff_id: 5000, project_id: 1000, new_path: "src/b.rs", traversal_path: "1/100/1000/" }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 5000, source_kind: MergeRequestDiff, relationship_kind: HAS_FILE, target_id: 9300, target_kind: MergeRequestDiffFile, source_tags: [], target_tags: [] }
      - { traversal_path: "1/100/1000/", source_id: 5000, source_kind: MergeRequestDiff, relationship_kind: HAS_FILE, target_id: 9301, target_kind: MergeRequestDiffFile, source_tags: [], target_tags: [] }

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "mr", "entity": "MergeRequest", "columns": ["project_id"],
             "filters": {"project_id": {"eq": 1000}}},
            {"id": "diff", "entity": "MergeRequestDiff"},
            {"id": "df", "entity": "MergeRequestDiffFile"}
        ],
        "relationships": [
            {"type": "HAS_DIFF", "from": "mr", "to": "diff"},
            {"type": "HAS_FILE", "from": "diff", "to": "df"}
        ],
        "limit": 50
    }
  gql: |
    MATCH (mr:MergeRequest)-[:HAS_DIFF]->(diff:MergeRequestDiff)-[:HAS_FILE]->(df:MergeRequestDiffFile) WHERE mr.project_id = 1000 RETURN mr.project_id, diff, df LIMIT 50

expect:
  node_count: 4
  skip_requirements: ["filter:project_id"]
  nodes:
    MergeRequest:
      ids: [2000]
    MergeRequestDiff:
      ids: [5000]
    MergeRequestDiffFile:
      ids: [9300, 9301]
  edges:
    HAS_DIFF:
      - [2000, 5000]
    HAS_FILE:
      - [5000, 9300]
      - [5000, 9301]
  referential_integrity: true
