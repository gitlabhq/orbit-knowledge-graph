# source: crates/integration-tests/tests/server/data_correctness/traversal_scoping.rs::scope_implied_container_elision_star_counts_authored_mrs
description: Container-elision star aggregation counts authored MRs per user

config:
  security:
    scope_prefixes:
      g: "1/700/"
      p: "1/700/"
      mr: "1/700/"
  extra_seed:
    gl_group:
      - { id: 700, name: g700, full_path: g700, visibility_level: public, traversal_path: "1/700/" }
    gl_project:
      - { id: 7000, name: p700, full_path: "g700/p700", visibility_level: public, traversal_path: "1/700/7000/" }
    gl_user:
      - { id: 7701, username: u7701, name: "U 7701", state: active, user_type: human, email: "u7701@x.com" }
      - { id: 7702, username: u7702, name: "U 7702", state: active, user_type: human, email: "u7702@x.com" }
    gl_merge_request:
      - { id: 7100, iid: 1, title: a, state: opened, source_branch: b, target_branch: main, project_id: 7000, author_id: 7701, traversal_path: "1/700/7000/" }
      - { id: 7101, iid: 2, title: b, state: opened, source_branch: b, target_branch: main, project_id: 7000, author_id: 7701, traversal_path: "1/700/7000/" }
      - { id: 7102, iid: 3, title: c, state: opened, source_branch: b, target_branch: main, project_id: 7000, author_id: 7702, traversal_path: "1/700/7000/" }
  redaction:
    allow:
      user: [1, 2, 3, 4, 5, 6, 7, 7701, 7702]
      group: [100, 101, 102, 200, 300, 700, 900]
      project: [1000, 1001, 1002, 1003, 1004, 1010, 7000, 9000]
      merge_request: [2000, 2001, 2002, 2003, 2004, 2005, 7100, 7101, 9100]
      note: [3000, 3001, 3002, 3003]
      work_item: [4000, 4001, 4002, 4003, 4010]
      milestone: [6000, 6001]
      label: [7000, 7001, 7002]

query:
  json: |
    {
        "query_type": "aggregation",
        "nodes": [
            {"id": "g", "entity": "Group", "filters": {"full_path": "g700"}},
            {"id": "p", "entity": "Project"},
            {"id": "mr", "entity": "MergeRequest"},
            {"id": "u", "entity": "User", "columns": ["username"]}
        ],
        "relationships": [
            {"type": "CONTAINS", "from": "g", "to": "p"},
            {"type": "IN_PROJECT", "from": "mr", "to": "p"},
            {"type": "AUTHORED", "from": "u", "to": "mr"}
        ],
        "group_by": ["u"],
        "aggregations": [{"count": "mr", "as": "c"}],
        "limit": 10
    }

expect:
  groups:
    u:
      rows:
        - { entity: User, id: 7701, values: { c: 2 } }
        - { entity: User, id: 7702, values: { c: 1 } }
