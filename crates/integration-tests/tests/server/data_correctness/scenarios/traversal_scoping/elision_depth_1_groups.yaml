description: Elided containment excludes the anchor and deeper groups

query:
  gql: |
    MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS]->(x:Group) RETURN count(x) AS c LIMIT 10

expect:
  sql_contains: ["countSubstrings(x.traversal_path"]
  sql_not_contains: ["gl_edge", "gl_group AS g"]
  skip_requirements: ["filter:full_path"]
  row_count: 1
  row_values: [{ c: 1 }]
