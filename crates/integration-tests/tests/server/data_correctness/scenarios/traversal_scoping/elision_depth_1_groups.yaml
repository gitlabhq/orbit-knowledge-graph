description: Elided containment excludes the anchor and deeper groups
query:
  json: |
    {"query_type":"aggregation","nodes":[{"id":"g","entity":"Group","filters":{"full_path":"public-group"}},{"id":"x","entity":"Group"}],
     "relationships":[{"type":"CONTAINS","from":"g","to":"x","hops":[1,1]}],"aggregations":[{"count":"x","as":"c"}],"limit":10}
  gql: |
    MATCH (g:Group {full_path: 'public-group'})-[:CONTAINS]->(x:Group) RETURN count(x) AS c LIMIT 10
expect:
  sql_matches: ['countSubstrings\(q\."[^"]+", ''/''\)']
  sql_not_contains: ["gl_edge", " JOIN "]
  skip_requirements: ["filter:full_path"]
  row_count: 1
  row_values: [{c: 1}]
