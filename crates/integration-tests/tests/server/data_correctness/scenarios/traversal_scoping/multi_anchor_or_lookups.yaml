description: A node pinned to two projects scopes its own scan and what it reaches with one lookup per anchor, OR-ed

query:
  json: |
    {
        "query_type": "traversal",
        "nodes": [
            {"id": "p", "entity": "Project", "node_ids": [1000, 1002], "columns": ["name"]},
            {"id": "mr", "entity": "MergeRequest", "columns": ["iid"]}
        ],
        "relationships": [{"type": "IN_PROJECT", "from": "mr", "to": "p"}],
        "limit": 10
    }
  gql: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project) WHERE p.id IN [1000, 1002] RETURN mr.iid, p.name LIMIT 10

expect:
  compile_only: true
  sql_contains:
    - "(_scope.id = 1000)"
    - "(_scope.id = 1002)"
    - ") OR startsWith(mr.traversal_path, (SELECT"
    - ") OR startsWith(p.traversal_path, (SELECT"
