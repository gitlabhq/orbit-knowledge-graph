byte_limit_resumes_from_last_returned_user:
  seed: |
    INSERT INTO gl_user (id, username, name, state, user_type)
    SELECT 8001 + number, concat('user', toString(8001 + number)),
           repeat('x', 4096), 'active', 'human'
    FROM numbers(6);
  max_response_bytes: 8192
  query:
    query_type: traversal
    nodes:
      - id: user
        entity: User
        node_ids: [8001, 8002, 8003, 8004, 8005, 8006]
        columns: [username, name]
    order_by: user.id
    cursor: {page_size: 4}
  expect:
    pages:
      - User: [8001]
      - User: [8002]
      - User: [8003]
      - User: [8004]
      - User: [8005]
      - User: [8006]

fitting_response_needs_no_continuation:
  seed: |
    INSERT INTO gl_user (id, username, name, state, user_type)
    VALUES (9001, 'small_user', 'Small User', 'active', 'human');
  max_response_bytes: 8192
  query:
    query_type: traversal
    nodes:
      - id: user
        entity: User
        node_ids: [9001]
        columns: [username, name]
    order_by: user.id
    cursor: {page_size: 4}
  expect:
    pages:
      - User: [9001]
