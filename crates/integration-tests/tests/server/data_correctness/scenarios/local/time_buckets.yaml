config:
  backends: [duckdb]
  ontology_overlay: local_dates
  extra_seed:
    gl_definition:
      - { id: 15001, traversal_path: 1/100/1000/, project_id: 1000, branch: main, commit_sha: abc123, file_path: src/dates.rs, fqn: "dates::saturday", name: saturday, definition_type: Function, start_line: 1, end_line: 2, start_byte: 0, end_byte: 10, start_char: 0, end_char: 5, created_at: "2026-10-03T23:59:59Z" }
      - { id: 15002, traversal_path: 1/100/1000/, project_id: 1000, branch: main, commit_sha: abc123, file_path: src/dates.rs, fqn: "dates::sunday", name: sunday, definition_type: Function, start_line: 1, end_line: 2, start_byte: 0, end_byte: 10, start_char: 0, end_char: 5, created_at: "2026-10-04T00:00:00Z" }
      - { id: 15003, traversal_path: 1/100/1000/, project_id: 1000, branch: main, commit_sha: abc123, file_path: src/dates.rs, fqn: "dates::monday", name: monday, definition_type: Function, start_line: 1, end_line: 2, start_byte: 0, end_byte: 10, start_char: 0, end_char: 5, created_at: "2026-10-05T12:00:00Z" }

cases:
  - name: week_buckets_start_sunday
    description: Week buckets start on Sunday and return dates
    query:
      gql: |
        MATCH (d:Definition) WHERE d.id IN [15001, 15002, 15003] RETURN date_trunc('week', d.created_at) AS week, count(d) AS n ORDER BY week
    expect:
      row_count: 2
      row_values:
        - { week: "2026-09-27", n: 1 }
        - { week: "2026-10-04", n: 2 }

  - name: clock_units
    description: Minute and hour buckets truncate one timestamp and stay timestamps; a day bucket is a date
    query:
      gql: |
        MATCH (d:Definition {id: 15003}) RETURN date_trunc('minute', d.created_at) AS minute, date_trunc('hour', d.created_at) AS hour, date_trunc('day', d.created_at) AS day, count(d) AS n
    expect:
      row_count: 1
      row_values:
        - { minute: "2026-10-05T12:00:00Z", hour: "2026-10-05T12:00:00Z", day: "2026-10-05", n: 1 }

  - name: calendar_units
    description: Month, quarter, and year buckets truncate one timestamp to dates
    query:
      gql: |
        MATCH (d:Definition {id: 15003}) RETURN date_trunc('month', d.created_at) AS month, date_trunc('quarter', d.created_at) AS quarter, date_trunc('year', d.created_at) AS year, count(d) AS n
    expect:
      row_count: 1
      row_values:
        - { month: "2026-10-01", quarter: "2026-10-01", year: "2026-01-01", n: 1 }

  - name: timestamp_filter
    description: A timestamp filter binds a timestamp parameter and keeps the rows from Sunday on
    query:
      gql: |
        MATCH (d:Definition) WHERE d.id IN [15001, 15002, 15003] AND d.created_at >= datetime('2026-10-04T00:00:00Z') RETURN d.name, d.created_at LIMIT 10
    expect:
      nodes:
        Definition:
          ids: [15002, 15003]
          filters:
            created_at: { gte: "2026-10-04" }

  - name: timestamp_extremes
    description: Minimum and maximum of a timestamp return the earliest and latest values
    query:
      gql: |
        MATCH (d:Definition) WHERE d.id IN [15001, 15002, 15003] RETURN min(d.created_at) AS first, max(d.created_at) AS last
    expect:
      row_count: 1
      row_values:
        - { first: "2026-10-03T23:59:59Z", last: "2026-10-05T12:00:00Z" }
