description: Ungrouped aggregation preserves relationship_kind filter in WHERE clause

config:
  security:
    paths: ["1/"]

query:
  gql: |
    MATCH (mr:MergeRequest)<-[:AUTHORED]-(u:User) WHERE mr.id >= 1 AND mr.id <= 10000 RETURN count(mr) AS total_authored LIMIT 10

expect:
  row_count: 1
  row_values:
    - { total_authored: 6 }
