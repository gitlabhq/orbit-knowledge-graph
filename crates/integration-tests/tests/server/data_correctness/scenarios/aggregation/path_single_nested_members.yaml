# source: crates/integration-tests/tests/server/data_correctness/aggregation.rs::aggregation_path_single_nested_group
description: Path 1/100/ restricts MEMBER_OF aggregation to Group 100 only

config:
  security:
    org_id: 1
    paths: ["1/100/"]

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
        {"id": "u", "entity": "User"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"count": "u", "as": "member_count"}],
      "limit": 10
    }
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { member_count: 3 }, properties: { name: Public Group } }
      absent:
        - { entity: Group, id: 101 }
        - { entity: Group, id: 102 }
