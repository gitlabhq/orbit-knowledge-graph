description: Ungrouped aggregation with node_ids filter on the non-aggregated node

config:
  security:
    paths: ["1/"]

query:
  gql: |
    MATCH (mr:MergeRequest)<-[:AUTHORED]-(u:User {id: 1}) WHERE mr.id >= 1 AND mr.id <= 10000 RETURN count(mr) AS total_mrs LIMIT 10

expect:
  skip_requirements: [node_ids]
  row_count: 1
  row_values:
    - { total_mrs: 2 }
