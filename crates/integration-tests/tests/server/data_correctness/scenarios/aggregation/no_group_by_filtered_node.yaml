# source: crates/integration-tests/tests/server/data_correctness/aggregation.rs::aggregation_no_group_by_with_filtered_other_node
description: Ungrouped aggregation with node_ids filter on the non-aggregated node

config:
  security:
    paths: ["1/"]

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest", "id_range": {"start": 1, "end": 10000}},
        {"id": "u", "entity": "User", "node_ids": [1]}
      ],
      "relationships": [{"type": "AUTHORED", "from": "u", "to": "mr"}],
      "aggregations": [{"count": "mr", "as": "total_mrs"}],
      "limit": 10
    }
  gql: |
    MATCH (mr:MergeRequest)<-[:AUTHORED]-(u:User {id: 1}) WHERE mr.id >= 1 AND mr.id <= 10000 RETURN count(mr) AS total_mrs LIMIT 10

expect:
  skip_requirements: [node_ids]
  row_count: 1
  row_values:
    - { total_mrs: 2 }
