description: Denormalized equality does not replace a property operand with an empty literal

config:
  security:
    paths: ["1/100/1000/"]
  extra_seed:
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 99000, source_kind: File, relationship_kind: DEFINES, target_id: 12001, target_kind: Definition, source_tags: ["extension:rs", "language:rs"] }
    gl_file:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000, branch: main, commit_sha: abc123, path: src/rs, name: rs, extension: rs, language: rs }

query:
  gql: |
    MATCH (a:File {id: 99000})-[:DEFINES]->(b:Definition)
    WHERE a.extension = a.language
    RETURN count(b) AS n

expect:
  skip_requirements: ["node_ids", "filter:extension"]
  row_count: 1
  row_values: [{ n: 1 }]
