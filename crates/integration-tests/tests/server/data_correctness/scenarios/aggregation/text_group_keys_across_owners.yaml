config:
  redaction:
    allow:
      ci_build: [9601, 9602, 9603, 9611, 9612, 9613]
    deny:
      ci_build: [9621, 9622, 9623, 9624]
  extra_seed:
    gl_job:
      - { id: 9601, name: rspec, status: failed, project_id: 1000, traversal_path: "1/100/1000/" }
      - { id: 9602, name: rspec, status: failed, project_id: 1000, traversal_path: "1/100/1000/" }
      - { id: 9603, name: lint, status: success, project_id: 1000, traversal_path: "1/100/1000/" }
      - { id: 9611, name: rspec, status: success, project_id: 1002, traversal_path: "1/100/1002/" }
      - { id: 9612, name: lint, status: failed, project_id: 1002, traversal_path: "1/100/1002/" }
      - { id: 9613, name: build, status: failed, project_id: 1002, traversal_path: "1/100/1002/" }
      - { id: 9621, name: build, status: failed, project_id: 1010, traversal_path: "1/100/200/1010/" }
      - { id: 9622, name: build, status: failed, project_id: 1010, traversal_path: "1/100/200/1010/" }
      - { id: 9623, name: build, status: failed, project_id: 1010, traversal_path: "1/100/200/1010/" }
      - { id: 9624, name: build, status: failed, project_id: 1010, traversal_path: "1/100/200/1010/" }

cases:
  - name: counts_sum_across_projects
    description: Jobs that share a name in two readable projects count as one row
    query:
      gql: |
        MATCH (j:Job) WHERE j.project_id IN [1000, 1002] RETURN j.name AS name, count(j) AS n ORDER BY name
    expect:
      skip_requirements: [filter:project_id, aggregation_sort]
      row_count: 3
      row_values:
        - { name: build, n: 1 }
        - { name: lint, n: 2 }
        - { name: rspec, n: 3 }

  - name: denied_project_counts_drop_out
    description: A project the caller cannot read leaves every shared name count
    query:
      gql: |
        MATCH (j:Job) WHERE j.project_id IN [1000, 1002, 1010] RETURN j.name AS name, count(j) AS n ORDER BY name
    expect:
      skip_requirements: [filter:project_id, aggregation_sort]
      row_count: 3
      row_values:
        - { name: build, n: 1 }
        - { name: lint, n: 2 }
        - { name: rspec, n: 3 }

  - name: top_value_is_ranked_after_redaction
    description: The denied project's build jobs cannot push build above rspec
    query:
      gql: |
        MATCH (j:Job) WHERE j.project_id IN [1000, 1002, 1010] RETURN j.name AS name, count(j) AS n ORDER BY n DESC LIMIT 1
    expect:
      skip_requirements: [filter:project_id, aggregation_sort]
      sql_contains: ["AS _orbit_partials", "LIMIT 1001"]
      sql_not_contains: ["ORDER BY"]
      row_count: 1
      has_more: true
      row_values:
        - { name: rspec, n: 3 }

  - name: distinct_count_rejected
    description: A distinct count cannot be added up across projects
    query:
      gql: |
        MATCH (j:Job) WHERE j.project_id IN [1000, 1002] RETURN j.name AS name, count(DISTINCT j.status) AS n
    expect:
      compile_error: count(DISTINCT
