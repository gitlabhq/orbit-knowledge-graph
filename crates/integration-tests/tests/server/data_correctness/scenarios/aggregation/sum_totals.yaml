description: Sum of user IDs per group

config:
  security:
    paths: ["1/"]

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, sum(u.id) AS id_sum LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { id_sum: 9 } }
        - { entity: Group, id: 101, values: { id_sum: 18 } }
        - { entity: Group, id: 102, values: { id_sum: 5 } }
