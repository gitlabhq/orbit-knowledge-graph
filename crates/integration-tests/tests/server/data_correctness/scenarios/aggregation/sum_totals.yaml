# source: crates/integration-tests/tests/server/data_correctness/aggregation.rs::aggregation_sum_produces_correct_totals
description: Sum of user IDs per group

config:
  security:
    paths: ["1/"]

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
        {"id": "u", "entity": "User"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"sum": "u.id", "as": "id_sum"}],
      "limit": 10
    }
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, sum(u.id) AS id_sum LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { id_sum: 9 } }
        - { entity: Group, id: 101, values: { id_sum: 18 } }
        - { entity: Group, id: 102, values: { id_sum: 5 } }
