# source: crates/integration-tests/tests/server/data_correctness/aggregation.rs::aggregation_min_on_string_column
description: Lexicographic min on string column (username)

config:
  security:
    paths: ["1/"]

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
        {"id": "u", "entity": "User"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"min": "u.username", "as": "first_username"}],
      "limit": 10
    }
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, min(u.username) AS first_username LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { first_username: "alice" } }
        - { entity: Group, id: 101, values: { first_username: "charlie" } }
        - { entity: Group, id: 102, values: { first_username: "alice" } }
