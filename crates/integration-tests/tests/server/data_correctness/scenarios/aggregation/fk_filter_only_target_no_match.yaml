description: FK aggregation returns zero when the unprojected target filter has no match

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "mr", "entity": "MergeRequest"},
        {"id": "p", "entity": "Project", "filters": {"name": "Missing Project"}}
      ],
      "relationships": [{"type": "IN_PROJECT", "from": "mr", "to": "p"}],
      "aggregations": [{"count": "mr", "as": "c"}],
      "limit": 10
    }
  gql: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {name: 'Missing Project'})
    RETURN count(mr) AS c LIMIT 10

expect:
  row_count: 1
  row_values: [{c: 0}]
  sql_contains: ['."project_id"', ' IN (SELECT ', 'WITH ']
  sql_matches: ['FROM "[^"]*gl_project" AS \w+ FINAL']
  sql_not_contains: ["gl_edge"]
  skip_requirements: ["filter:name"]
