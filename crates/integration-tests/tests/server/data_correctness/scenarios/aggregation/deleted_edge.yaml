description: Latest-row aggregation cannot filter tombstones before deduplication

config:
  unmerged_seed: true
  redaction:
    allow:
      user: [99002]
      merge_request: [99000]
  extra_seed:
    gl_user:
      - { id: 99002, username: audit_user }
    gl_merge_request:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000, title: audit_mr, state: opened }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 99002, source_kind: User, relationship_kind: APPROVED, target_id: 99000, target_kind: MergeRequest, _version: "2026-01-01 00:00:00", _deleted: false }
      - { traversal_path: "1/100/1000/", source_id: 99002, source_kind: User, relationship_kind: APPROVED, target_id: 99000, target_kind: MergeRequest, _version: "2026-01-02 00:00:00", _deleted: true }

cases:
  - name: count
    description: A count over a tombstoned edge is zero
    query:
      gql: |
        MATCH (u:User {id: 99002})-[:APPROVED]->(mr:MergeRequest)
        RETURN count(mr) AS n

    expect:
      skip_requirements: ["node_ids"]
      row_count: 1
      row_values: [{ n: 0 }]

  - name: grouped
    description: A grouped aggregation over a tombstoned edge returns no group rather than a zero count
    query:
      gql: |
        MATCH (u:User {id: 99002})-[:APPROVED]->(mr:MergeRequest)
        RETURN mr.state, count(mr) AS n

    expect:
      skip_requirements: ["node_ids"]
      row_count: 0
