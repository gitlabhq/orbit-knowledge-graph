description: An elided multi-ID target filter still excludes nonmatching holders

query:
  gql: |
    MATCH (u:User {username: 'alice'})-[:MEMBER_OF]->(g:Group {id: 100})
    MATCH (u)-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN [1001, 1004]
    RETURN count(mr) AS n

expect:
  row_count: 1
  row_values: [{ n: 0 }]
  skip_requirements: [node_ids, "filter:username"]
