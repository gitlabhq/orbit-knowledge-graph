description: An elided multi-ID target filter still excludes nonmatching holders

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "u", "entity": "User", "filters": {"username": "alice"}},
        {"id": "g", "entity": "Group", "node_ids": [100]},
        {"id": "mr", "entity": "MergeRequest"},
        {"id": "p", "entity": "Project", "node_ids": [1001, 1004]}
      ],
      "relationships": [
        {"type": "MEMBER_OF", "from": "u", "to": "g"},
        {"type": "AUTHORED", "from": "u", "to": "mr"},
        {"type": "IN_PROJECT", "from": "mr", "to": "p"}
      ],
      "aggregations": [{"count": "mr", "as": "n"}]
    }
  gql: |
    MATCH (u:User {username: 'alice'})-[:MEMBER_OF]->(g:Group {id: 100})
    MATCH (u)-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN [1001, 1004]
    RETURN count(mr) AS n

expect:
  row_count: 1
  row_values: [{n: 0}]
  skip_requirements: [node_ids, "filter:username"]
