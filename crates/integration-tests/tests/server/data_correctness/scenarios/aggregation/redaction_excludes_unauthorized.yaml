description: Aggregation counts survive redaction because they are computed in SQL before entity-level row removal

config:
  redaction:
    allow:
      user: [1, 2]
      group: [100, 101, 102, 200, 300]

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  groups:
    g:
      rows:
        - entity: Group
          id: 100
          values:
            member_count: 3
