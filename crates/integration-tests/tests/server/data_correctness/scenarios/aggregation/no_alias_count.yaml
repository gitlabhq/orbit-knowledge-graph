description: Omitted alias defaults to the function name (count)

config:
  security:
    paths: ["1/"]

query:
  gql: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest) WHERE u.id >= 1 AND u.id <= 10000 RETURN u{.id, .username}, count(mr) AS count LIMIT 10

expect:
  groups:
    u:
      rows:
        - { entity: User, id: 1, values: { count: 2 }, properties: { username: alice } }
        - { entity: User, id: 2, values: { count: 1 } }
        - { entity: User, id: 3, values: { count: 1 } }
