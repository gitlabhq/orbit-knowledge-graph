description: Grouping by a nullable DateTime returns one null group instead of a 1970 group

query:
  gql: |
    MATCH (mr:MergeRequest) WHERE mr.id >= 2000 AND mr.id <= 2005
    RETURN mr.merged_at AS merged, count(mr) AS n ORDER BY merged

expect:
  skip_requirements: [node_ids, aggregation_sort]
  row_count: 4
  row_values:
    - { merged: "2024-03-15T12:00:00Z", n: 1 }
    - { merged: "2024-06-10T09:00:00Z", n: 1 }
    - { merged: "2024-08-20T09:00:00Z", n: 1 }
    - { merged: null, n: 3 }
