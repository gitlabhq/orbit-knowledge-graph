config:
  security:
    org_id: 1
    paths: [1/100/]
  redaction:
    allow:
      project: [1000]
      group: [100]
      work_item: [4000]
    deny:
      work_item: [4001]

cases:
  - name: text_prefix_on_ungrouped_node
    description: A text prefix filter on an ungrouped node counts every match in the path scope
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"w","entity":"WorkItem","node_ids":[4001],"filters":{"title":{"starts_with":"Fix a"}}}],"aggregations":[{"count":"w","as":"n"}]}
      gql: |
        MATCH (w:WorkItem {id: 4001}) WHERE w.title STARTS WITH 'Fix a' RETURN count(w) AS n
    expect:
      row_values: [{ n: 1 }]

  - name: text_contains_on_ungrouped_node
    description: A CONTAINS filter on an ungrouped node counts every match under the grouped node
    query:
      gql: |
        MATCH (w:WorkItem)-[:IN_GROUP]->(g:Group {id: 100}) WHERE w.title CONTAINS 'auth' RETURN g, count(w) AS n
    expect:
      groups:
        g:
          entity: Group
          ids: [100]
          rows:
            - { entity: Group, id: 100, values: { n: 1 } }

  - name: negated_text_match_on_ungrouped_node
    description: A negated CONTAINS filter on an ungrouped node counts the work item whose empty description lacks the word
    query:
      gql: |
        MATCH (w:WorkItem {id: 4001}) WHERE NOT w.description CONTAINS 'login' RETURN count(w) AS n
    expect:
      row_values: [{ n: 1 }]

  - name: text_ordering_on_ungrouped_node
    description: An ordering comparison on text of an ungrouped node counts the matching work item
    query:
      gql: |
        MATCH (w:WorkItem {id: 4001}) WHERE w.title < 'G' RETURN count(w) AS n
    expect:
      row_values: [{ n: 1 }]

  - name: text_filter_on_grouped_node
    description: A text filter works on a grouped node and returns its readable rows
    query:
      gql: |
        MATCH (w:WorkItem)-[:IN_GROUP]->(g:Group {id: 100}) WHERE w.title STARTS WITH 'Fix' RETURN w, count(g) AS n
    expect:
      empty_aggregation: true
