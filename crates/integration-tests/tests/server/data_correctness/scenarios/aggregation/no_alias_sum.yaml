description: Omitted alias defaults to the function name (sum)

config:
  security:
    paths: ["1/"]

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, sum(u.id) AS sum LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { sum: 9 }, properties: { name: Public Group } }
