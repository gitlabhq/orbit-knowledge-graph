description: Latest-row aggregation counts an edge whose current version is live

config:
  unmerged_seed: true
  extra_seed:
    gl_user:
      - { id: 99012, username: live_user }
    gl_merge_request:
      - { id: 99010, traversal_path: "1/100/1000/", project_id: 1000, title: live_mr }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 99012, source_kind: User, relationship_kind: APPROVED, target_id: 99010, target_kind: MergeRequest, _version: "2026-01-01 00:00:00", _deleted: false }

query:
  gql: |
    MATCH (u:User {id: 99012})-[:APPROVED]->(mr:MergeRequest)
    RETURN count(mr) AS n

expect:
  row_count: 1
  row_values: [{ n: 1 }]
