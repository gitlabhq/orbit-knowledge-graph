description: Sum with path restricted to 1/100/ excludes groups 101 and 102

config:
  security:
    org_id: 1
    paths: ["1/100/"]

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, sum(u.id) AS id_sum LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { id_sum: 9 } }
      absent:
        - { entity: Group, id: 101 }
        - { entity: Group, id: 102 }
