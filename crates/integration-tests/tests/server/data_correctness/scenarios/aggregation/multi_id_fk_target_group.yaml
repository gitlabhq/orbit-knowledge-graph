description: A grouped multi-ID FK target retains its identity and properties

query:
  gql: |
    MATCH (u:User {username: 'alice'})-[:MEMBER_OF]->(g:Group {id: 100})
    MATCH (u)-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN [1000, 1001]
    RETURN p, count(mr) AS n

expect:
  groups:
    p:
      entity: Project
      ids: [1000]
      rows:
        - { entity: Project, id: 1000, values: { n: 2 } }
  skip_requirements: [node_ids, "filter:username"]
