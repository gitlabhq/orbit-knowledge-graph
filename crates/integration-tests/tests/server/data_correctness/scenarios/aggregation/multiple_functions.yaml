description: Multiple aggregation functions (count, avg, min) in one query

config:
  security:
    paths: ["1/"]

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS cnt, avg(u.id) AS avg_id, min(u.id) AS min_id LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { cnt: 3, avg_id: 3.0, min_id: 1 } }
        - { entity: Group, id: 101, values: { cnt: 4, avg_id: 4.5, min_id: 3 } }
