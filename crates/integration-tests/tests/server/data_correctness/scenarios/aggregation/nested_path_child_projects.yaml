description: Nested path 1/100/ includes child projects under Group 100

config:
  security:
    org_id: 1
    paths: ["1/100/"]

query:
  gql: |
    MATCH (g:Group)-[:`CONTAINS`]->(p:Project) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(p) AS project_count LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { project_count: 2 } }
      absent:
        - { entity: Group, id: 101 }
        - { entity: Group, id: 102 }
