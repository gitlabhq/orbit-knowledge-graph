    {"query_type":"aggregation","nodes":[{"id":"a","entity":"Definition","filters":{"name":"audit_caller"}}],"relationships":[{"type":"CALLS","from":"a","to":"a"}],"aggregations":[{"count":"a","as":"n"}]}

