config:
  extra_seed:
    gl_definition:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000, branch: main, name: audit_caller, fqn: audit_caller }
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 99000, source_kind: Definition, relationship_kind: CALLS, target_id: 12001, target_kind: Definition }

