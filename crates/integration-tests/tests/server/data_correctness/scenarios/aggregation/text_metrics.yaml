config:
  security:
    org_id: 1
    paths: [1/100/]

cases:
  - name: min_text_rejected
    description: MIN rejects a text property
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"w","entity":"WorkItem","node_ids":[9001]}],"aggregations":[{"min":"w.description","as":"v"}]}
      gql: |
        MATCH (w:WorkItem {id: 9001}) RETURN min(w.description) AS v
    expect:
      compile_error: aggregates are restricted to scalars

  - name: grouped_max_text_rejected
    description: A node-grouped MAX rejects a text property
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"p","entity":"Project","node_ids":[1000]},{"id":"w","entity":"WorkItem"}],"relationships":[{"type":"IN_PROJECT","from":"w","to":"p"}],"group_by":["p"],"aggregations":[{"max":"w.title","as":"v"}]}
      gql: |
        MATCH (w:WorkItem)-[:IN_PROJECT]->(p:Project {id: 1000}) RETURN p, max(w.title) AS v
    expect:
      compile_error: aggregates are restricted to scalars

  - name: max_uuid_rejected
    description: MAX rejects a UUID
    config:
      security:
        org_id: 1
        paths: [1/100/]
        access_level: 25
    query:
      gql: |
        MATCH (o:VulnerabilityOccurrence {id: 1}) RETURN max(o.uuid) AS v
    expect:
      compile_error: aggregates are restricted to scalars

  - name: scalar_metrics_compile
    description: MIN and MAX execute over timestamp, integer, boolean, and enum values
    query:
      gql: |
        MATCH (w:WorkItem {id: 4001})
        RETURN min(w.created_at) AS first_created, max(w.weight) AS max_weight, max(w.confidential) AS any_confidential, min(w.state) AS min_state
    expect:
      row_count: 1
      row_values:
        - { first_created: "2024-03-05T11:30:00Z", max_weight: 8, min_state: closed }
      gql_columns:
        any_confidential: ["TRUE"]

  - name: categorical_group_keys_compile
    description: Grouping returns enum, low-selectivity string, and truncated timestamp values
    config:
      extra_seed:
        gl_merge_request:
          - { id: 2000, iid: 1, title: Add feature A, state: opened, source_branch: feature-a, target_branch: main, merge_status: can_be_merged, created_at: "2024-01-15 10:30:00", project_id: 1000, author_id: 1, traversal_path: "1/100/1000/", _version: { sql: "now64(6) + INTERVAL 1 SECOND" } }
    query:
      json: |
        {"query_type":"aggregation","nodes":[{"id":"mr","entity":"MergeRequest","node_ids":[2000]}],"group_by":["mr.state","mr.merge_status",{"key":"mr.created_at","truncate":"month"}],"aggregations":[{"count":"mr","as":"n"}]}
      gql: |
        MATCH (mr:MergeRequest {id: 2000}) RETURN mr.state AS mr_state, mr.merge_status AS mr_merge_status, date_trunc('month', mr.created_at), count(mr) AS n
    expect:
      row_count: 1
      row_values:
        - { mr_state: opened, mr_merge_status: can_be_merged, mr_created_at_month: "2024-01-01", n: 1 }
      group_columns:
        mr_state: mr.state
        mr_merge_status: mr.merge_status
        mr_created_at_month: mr.created_at
