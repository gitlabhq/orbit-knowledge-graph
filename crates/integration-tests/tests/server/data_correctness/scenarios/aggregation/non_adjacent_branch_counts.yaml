description: Count the user's approval once per project in each membership branch

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "u", "entity": "User", "node_ids": [1]},
        {"id": "g", "entity": "Group", "columns": ["name"]},
        {"id": "p", "entity": "Project"},
        {"id": "mr", "entity": "MergeRequest"}
      ],
      "relationships": [
        {"type": "MEMBER_OF", "from": "u", "to": "g"},
        {"type": "CONTAINS", "from": "g", "to": "p"},
        {"type": "APPROVED", "from": "u", "to": "mr"}
      ],
      "group_by": ["g"],
      "aggregations": [{"count": "mr", "as": "approval_count"}],
      "limit": 20
    }
  gql: |
    MATCH (u:User {id: 1})-[:MEMBER_OF]->(g:Group)-[:CONTAINS]->(p:Project),
          (u)-[:APPROVED]->(mr:MergeRequest)
    RETURN g{.id, .name}, count(mr) AS approval_count LIMIT 20

expect:
  groups:
    g:
      entity: Group
      count: 2
      ids: [100, 102]
      rows:
        - { entity: Group, id: 100, values: { approval_count: 2 } }
        - { entity: Group, id: 102, values: { approval_count: 1 } }
