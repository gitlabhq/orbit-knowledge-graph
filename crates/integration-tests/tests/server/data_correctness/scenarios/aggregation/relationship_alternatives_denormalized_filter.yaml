description: Denormalized filters retain every matching relationship alternative
config:
  extra_seed:
    gl_user:
      - { id: 99002, username: filter_user }
    gl_merge_request:
      - { id: 99000, traversal_path: "1/100/1000/", project_id: 1000, author_id: 99002, state: opened, title: authored }
      - { id: 99001, traversal_path: "1/100/1000/", project_id: 1000, state: opened, title: approved }
    gl_edge:
      - { traversal_path: "1/100/1000/", source_id: 99002, source_kind: User, relationship_kind: AUTHORED, target_id: 99000, target_kind: MergeRequest, target_tags: ["state:opened"] }
      - { traversal_path: "1/100/1000/", source_id: 99002, source_kind: User, relationship_kind: APPROVED, target_id: 99001, target_kind: MergeRequest, target_tags: ["state:opened"] }
query:
  gql: |
    MATCH (u:User {id: 99002})-[:AUTHORED|APPROVED]->(mr:MergeRequest {state: 'opened'})
    RETURN count(mr) AS n
expect:
  skip_requirements: [node_ids, "filter:state"]
  row_count: 1
  row_values: [{ n: 2 }]
