description: Repeated matching denormalized predicates retain the matching row

config:
  security: { paths: ["1/100/1000/"] }
  extra_seed:
    gl_code_edge:
      - { traversal_path: "1/100/1000/", project_id: 1000, branch: main, source_id: 99010, source_kind: Definition, relationship_kind: CALLS, target_id: 12001, target_kind: Definition, source_tags: ["definition_type:function"] }
    gl_definition:
      - { id: 99010, traversal_path: "1/100/1000/", project_id: 1000, branch: main, name: function, fqn: function, definition_type: function }

query:
  gql: |
    MATCH (a:Definition {id: 99010})-[:CALLS]->(b:Definition)
    WHERE a.definition_type = 'function' AND a.definition_type = 'function'
    RETURN count(b) AS n

expect:
  row_count: 1
  row_values: [{ n: 1 }]
