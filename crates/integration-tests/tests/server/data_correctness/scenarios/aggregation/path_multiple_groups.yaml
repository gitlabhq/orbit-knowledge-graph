description: Multiple security paths (1/100/ and 1/102/) show both groups, exclude 101

config:
  security:
    org_id: 1
    paths: ["1/100/", "1/102/"]

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { member_count: 3 } }
        - { entity: Group, id: 102, values: { member_count: 2 } }
      absent:
        - { entity: Group, id: 101 }
