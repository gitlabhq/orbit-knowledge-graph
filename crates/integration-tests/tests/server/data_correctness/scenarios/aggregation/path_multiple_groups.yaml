# source: crates/integration-tests/tests/server/data_correctness/aggregation.rs::aggregation_path_multiple_groups
description: Multiple security paths (1/100/ and 1/102/) show both groups, exclude 101

config:
  security:
    org_id: 1
    paths: ["1/100/", "1/102/"]

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "id_range": {"start": 1, "end": 10000}, "columns": ["name"]},
        {"id": "u", "entity": "User"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"count": "u", "as": "member_count"}],
      "limit": 10
    }

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 100, values: { member_count: 3 } }
        - { entity: Group, id: 102, values: { member_count: 2 } }
      absent:
        - { entity: Group, id: 101 }
