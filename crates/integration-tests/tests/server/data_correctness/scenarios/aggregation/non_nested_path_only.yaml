description: Flat group path 1/102/ shows only Group 102

config:
  security:
    org_id: 1
    paths: ["1/102/"]

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  groups:
    g:
      rows:
        - { entity: Group, id: 102, values: { member_count: 2 }, properties: { name: Internal Group } }
      absent:
        - { entity: Group, id: 100 }
        - { entity: Group, id: 101 }
