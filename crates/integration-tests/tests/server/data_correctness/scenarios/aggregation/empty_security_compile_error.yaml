description: Empty traversal_paths rejects at compile time

config:
  security:
    org_id: 1
    paths: []

query:
  gql: |
    MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  compile_error: "traversal_path"
