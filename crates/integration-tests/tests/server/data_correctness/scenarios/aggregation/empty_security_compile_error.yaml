description: A session with no traversal paths holds no scope, so the read is rejected at compile time

config:
  security:
    org_id: 1
    paths: []

query: |
  MATCH (g:Group)<-[:MEMBER_OF]-(u:User) WHERE g.id >= 1 AND g.id <= 10000 RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  compile_error: "requires permission read"
