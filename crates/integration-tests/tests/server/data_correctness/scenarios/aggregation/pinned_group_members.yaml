description: A pinned group scopes the member count without filtering global users by traversal path

config:
  security:
    org_id: 1
    paths: ["1/100/"]

query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "node_ids": [100], "columns": ["name"]},
        {"id": "u", "entity": "User"}
      ],
      "relationships": [{"type": "MEMBER_OF", "from": "u", "to": "g"}],
      "group_by": ["g"],
      "aggregations": [{"count": "u", "as": "member_count"}],
      "limit": 10
    }
  gql: |
    MATCH (g:Group {id: 100})<-[:MEMBER_OF]-(u:User) RETURN g{.id, .name}, count(u) AS member_count LIMIT 10

expect:
  groups:
    g:
      entity: Group
      ids: [100]
      rows:
        - { entity: Group, id: 100, values: { member_count: 3 }, properties: { name: Public Group } }
      absent:
        - { entity: Group, id: 101 }
        - { entity: Group, id: 102 }
