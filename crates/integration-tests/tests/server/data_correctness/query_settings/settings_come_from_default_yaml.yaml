description: Read queries take their settings from config/default.yaml, and the compiler adds a query.when group only for the matching query shape

config:
  security: admin

cases:
  - name: default_settings_and_memory_cap
    query:
      gql: "MATCH (w:WorkItem) WHERE w.id >= 1 AND w.id <= 100000 RETURN w LIMIT 10"
    expect:
      compile_only: true
      settings: { max_execution_time: 30, max_memory_usage: 17179869184, query_cache_nondeterministic_function_handling: ignore }

  - name: path_finding_time_limit
    query:
      gql: "MATCH p = ANY SHORTEST (u:User {id: 1})-[:MEMBER_OF|CONTAINS*1..3]->(pr:Project {id: 1000}) RETURN p"
    expect:
      compile_only: true
      settings: { max_execution_time: 15, max_memory_usage: 17179869184 }

  - name: final_scan_group
    query:
      gql: "MATCH (u:User) WHERE u.state = 'active' RETURN u LIMIT 10"
    expect:
      compile_only: true
      sql_contains: [" FINAL"]
      settings: { optimize_move_to_prewhere_if_final: 1, use_skip_indexes_if_final: 1, use_skip_indexes_if_final_exact_mode: 1, query_plan_optimize_join_order_algorithm: null }

  - name: cte_group
    query:
      gql: "MATCH (u:User {username: 'alice'})-[:AUTHORED]->(mr:MergeRequest) RETURN count(mr) AS c"
    expect:
      compile_only: true
      settings: { use_index_for_in_with_subqueries_max_values: 1000000 }

  - name: multi_join_group
    query:
      gql: "MATCH (u:User {id: 1})-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group) RETURN mr, p, g LIMIT 10"
    expect:
      compile_only: true
      settings: { query_plan_optimize_join_order_algorithm: dpsize }
