description: A repeated filtered traversal reads the cached result inside the TTL, so a row written between two runs is not visible yet

config:
  security: admin
  redaction: { allow: { group: [100, 101, 102, 200, 300, 998] } }

steps:
  - query:
      gql: "MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN g LIMIT 10"
    expect:
      node_count: 5
      nodes: { Group: { ids: [100, 101, 102, 200, 300] } }

  - seed:
      gl_group:
        - { id: 998, name: Late Group, full_path: late-group, visibility_level: public, traversal_path: "1/998/" }
    query:
      gql: "MATCH (g:Group) WHERE g.id >= 1 AND g.id <= 10000 RETURN g LIMIT 10"
    expect:
      node_count: 5
      nodes: { Group: { ids: [100, 101, 102, 200, 300] } }
