description: Group -> Project CONTAINS traversal (perf load query)

query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [
        {"id": "g", "entity": "Group", "node_ids": [100]},
        {"id": "p", "entity": "Project"}
      ],
      "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
      "limit": 50
    }
