description: Group -> Project CONTAINS traversal (perf load query)

# compile_only: the query is validated against the live ontology but not
# executed, so no seeded rows are needed. The perf load driver reads this same
# file to fire the query against a running stack.
query:
  gql: |
    MATCH (g:Group {id: 100})-[:CONTAINS]->(p:Project) RETURN g, p LIMIT 50

expect:
  compile_only: true
