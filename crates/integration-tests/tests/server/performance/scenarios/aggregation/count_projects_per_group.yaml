description: Aggregation - count Projects contained per Group
query:
  json: |
    {
      "query_type": "aggregation",
      "nodes": [
        {"id": "g", "entity": "Group", "node_ids": [100]},
        {"id": "p", "entity": "Project"}
      ],
      "relationships": [{"type": "CONTAINS", "from": "g", "to": "p"}],
      "group_by": ["g"],
      "aggregations": [{"count": "p", "as": "project_count"}],
      "limit": 50
    }
expect:
  compile_only: true
