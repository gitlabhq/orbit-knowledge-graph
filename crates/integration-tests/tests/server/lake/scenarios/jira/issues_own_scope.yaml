description: A caller who holds only their own pseudo-namespace sees only the issues in it

config:
  security: own_scope

query: |
  MATCH (i:JiraIssue) RETURN i.key, i.summary ORDER BY i.key LIMIT 20

expect:
  node_count: 1
  nodes:
    JiraIssue:
      count: 1
      order: [10300]
      rows:
        - { id: "10300", key: ME-1 }
