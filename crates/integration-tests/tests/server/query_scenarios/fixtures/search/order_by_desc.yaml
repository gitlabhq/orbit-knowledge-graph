description: Descending order_by reverses result ordering
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"]}],
      "order_by": "-u.id",
      "limit": 10
    }
expect:
  nodes:
    User:
      order: [7, 6, 5, 4, 3, 2, 1]
