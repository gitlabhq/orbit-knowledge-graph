description: node_ids returns only specified IDs
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "g", "entity": "Group", "columns": ["name"], "node_ids": [100, 102]}],
      "limit": 10
    }
expect:
  node_count: 2
  node_ids:
    Group: [100, 102]
  nodes:
    Group:
      - { id: 100, name: Public Group }
      - { id: 102, name: Internal Group }
  node_absent:
    Group: [101]
