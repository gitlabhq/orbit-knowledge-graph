description: Partial redaction returns only allowed IDs
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username"]}],
      "limit": 10
    }
redaction:
  allow:
    user: [1, 3]
expect:
  nodes:
    User:
      ids: [1, 3]
      absent: [2, 5]
