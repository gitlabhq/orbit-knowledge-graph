description: User search returns correct properties and ordering
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username", "name", "state", "user_type"]}],
      "order_by": "u.id",
      "limit": 10
    }
expect:
  node_count: 7
  node_order:
    User: [1, 2, 3, 4, 5, 6, 7]
  nodes:
    User:
      1: { username: alice, name: Alice Admin, state: active, user_type: human }
      2: { username: bob, name: Bob Builder }
      5: { username: eve, state: blocked, user_type: service_account }
