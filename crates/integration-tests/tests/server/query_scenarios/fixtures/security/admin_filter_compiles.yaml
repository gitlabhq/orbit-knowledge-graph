description: Admin can compile a query filtering on is_admin
security: admin
query:
  json: |
    {
      "query_type": "traversal",
      "nodes": [{"id": "u", "entity": "User", "id_range": {"start": 1, "end": 10000},
                 "columns": ["username", "is_admin"],
                 "filters": {"is_admin": true}}],
      "limit": 10
    }
expect:
  node_count: 0
