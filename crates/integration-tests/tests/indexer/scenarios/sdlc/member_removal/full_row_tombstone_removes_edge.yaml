# The contrast case for pk_only_tombstone_removes_edge: when the tombstone still
# carries the endpoint columns, the transform's IsNotNull/TypeIn endpoint filters
# pass and the tombstone reaches gl_edge. Pins the shape the fix must generalize to.
description: A membership removal replicated with the full row removes the MEMBER_OF edge
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
      siphon_users:
        - { id: 1, email: user1@example.com, username: user1, name: User 1, state: active, organization_id: 1 }
      siphon_members:
        - { id: 11000, access_level: 40, source_id: 1000, source_type: Project, user_id: 1, state: 0, traversal_path: "1/100/" }
    expect:
      edges:
        - { kind: MEMBER_OF, from: User, to: Project, traversal_path: "1/100/", count: 1 }

  - seed:
      checkpoint:
        - { key: ns.100.MEMBER_OF_siphon_members, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null" }
      siphon_members:
        - { id: 11000, access_level: 40, source_id: 1000, source_type: Project, user_id: 1, state: 0, traversal_path: "1/100/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      edges:
        - { kind: MEMBER_OF, from: User, to: Project, traversal_path: "1/100/", count: 0 }
