description: Emoji reactions produce AWARDED edges to notes, work items and merge requests, skip other awardables, and a key-only tombstone removes its edge
scope: { namespace: 100 }

steps:
  - seed:
      siphon_award_emoji:
        - { id: 1, name: thumbsup, user_id: 7, awardable_type: Note, awardable_id: 10, namespace_id: 100, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/" }
        - { id: 2, name: thumbsup, user_id: 7, awardable_type: Issue, awardable_id: 20, namespace_id: 100, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/" }
        - { id: 3, name: tada, user_id: 8, awardable_type: MergeRequest, awardable_id: 30, namespace_id: 100, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/" }
        - { id: 4, name: tada, user_id: 8, awardable_type: Snippet, awardable_id: 40, namespace_id: 100, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/" }
    expect:
      edges:
        - kind: AWARDED
          count: 3
          rows:
            - { source_id: 7, source_kind: User, target_id: 10, target_kind: Note }
            - { source_id: 7, source_kind: User, target_id: 20, target_kind: WorkItem }
            - { source_id: 8, source_kind: User, target_id: 30, target_kind: MergeRequest }

  - seed:
      checkpoint:
        - { key: ns.100.AWARDED_siphon_award_emoji, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_award_emoji:
        - { id: 2, user_id: 0, awardable_type: Issue, awardable_id: 20, created_at: "1970-01-01 00:00:00", updated_at: "1970-01-01 00:00:00", traversal_path: "1/100/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      edges:
        - kind: AWARDED
          count: 2
          rows:
            - { source_id: 7, target_id: 10, target_kind: Note }
            - { source_id: 8, target_id: 30, target_kind: MergeRequest }
