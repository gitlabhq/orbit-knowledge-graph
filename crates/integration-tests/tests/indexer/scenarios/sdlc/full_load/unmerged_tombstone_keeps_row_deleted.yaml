description: A full load reads the latest version of each source row, so a tombstone that still sits in its own part hides the live version it replaced, for a generated extract (MEMBER_OF) and an authored one (AgentSession)
scope: { namespace: 100 }

steps:
  - stop_merges: [siphon_members, siphon_ai_governance_sessions]
    seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
      siphon_users:
        - { id: 1, email: user1@example.com, username: user1, name: User 1, state: active, organization_id: 1 }
        - { id: 2, email: user2@example.com, username: user2, name: User 2, state: active, organization_id: 1 }
      siphon_members:
        - { id: 10100, access_level: 40, source_id: 100, source_type: Namespace, user_id: 1, state: 0, traversal_path: "1/100/", _siphon_replicated_at: "2024-01-15 10:00:00" }
        - { id: 20100, access_level: 40, source_id: 100, source_type: Namespace, user_id: 2, state: 0, traversal_path: "1/100/", _siphon_replicated_at: "2024-01-15 10:00:00" }
        - { id: 20100, traversal_path: "1/100/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-15 11:00:00" }
      siphon_ai_governance_sessions:
        - { id: 11, namespace_id: 100, project_id: 1000, user_id: 7, workflow_id: 1, source: 0, flow_type: developer, session_started_at: "2024-01-15 10:00:00", created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/", _siphon_replicated_at: "2024-01-15 10:00:00" }
        - { id: 12, namespace_id: 100, project_id: 1000, user_id: 7, workflow_id: 2, source: 0, flow_type: developer, session_started_at: "2024-01-15 10:00:00", created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/", _siphon_replicated_at: "2024-01-15 10:00:00" }
        - { id: 12, namespace_id: 0, session_started_at: "2024-01-15 10:00:00", created_at: "1970-01-01 00:00:00", updated_at: "1970-01-01 00:00:00", traversal_path: "1/100/1000/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-15 11:00:00" }
    targets: [MEMBER_OF, AgentSession]
    expect:
      nodes:
        gl_agent_session:
          rows:
            - { id: 11, _deleted: false }
      edges:
        - { kind: MEMBER_OF, from: User, to: Group, traversal_path: "1/100/", count: 1 }
