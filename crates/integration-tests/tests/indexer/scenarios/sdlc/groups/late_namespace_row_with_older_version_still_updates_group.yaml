description: A namespace row that lands after a late route row, with an older replicated_at than that route row, still updates the group
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/", slug: orig }
      siphon_routes:
        - { id: 100, source_id: 100, source_type: Namespace, path: orig, namespace_id: 100, traversal_path: "1/100/" }
    expect:
      nodes:
        gl_group:
          rows:
            - { id: 100, full_path: orig }

  - seed:
      checkpoint:
        - { key: ns.100.Group, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_routes:
        - { id: 100, source_id: 100, source_type: Namespace, path: renamed, namespace_id: 100, traversal_path: "1/100/", _siphon_replicated_at: "2024-01-20 18:00:00", _siphon_watermark: "2024-01-20 18:00:00" }
    expect:
      nodes:
        gl_group:
          count: 1
          rows:
            - { id: 100, full_path: renamed }

  - seed:
      checkpoint:
        - { key: ns.100.Group, watermark: "2024-01-20 19:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 19:00:00.000000" }
      siphon_namespaces:
        - { id: 100, name: new-name, path: orig, type: Group, visibility_level: 20, traversal_ids: [1, 100], _siphon_replicated_at: "2024-01-20 17:00:00", _siphon_watermark: "2024-01-20 20:00:00" }
    expect:
      nodes:
        gl_group:
          count: 1
          rows:
            - { id: 100, name: new-name, visibility_level: public, full_path: renamed }
