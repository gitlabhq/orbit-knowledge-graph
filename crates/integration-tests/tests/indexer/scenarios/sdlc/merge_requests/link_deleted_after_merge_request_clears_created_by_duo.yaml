# A link deletion is a child-table change too: the tombstone must re-extract the
# unchanged MR even though it carries no _siphon_deleted filter on the child window.
# Siphon tombstones keep only key columns, so merge_request_id is 0 on the deletion.
description: A link tombstone that replicates after its merge request clears created_by_duo on the next incremental run
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      merge_requests:
        - { id: 10, iid: 1, title: Link later removed, description: "", source_branch: feat, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 1, traversal_path: "1/100/", _siphon_replicated_at: "2024-01-15 10:00:00" }
      siphon_duo_workflows_workflow_merge_requests:
        - { id: 1, workflow_id: 7, merge_request_id: 10, link_type: 1, project_id: 1000, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/", _siphon_replicated_at: "2024-01-15 10:00:00" }
    expect:
      nodes:
        gl_merge_request:
          rows:
            - { id: 10, created_by_duo: true }

  - seed:
      checkpoint:
        - { key: ns.100.MergeRequest, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_duo_workflows_workflow_merge_requests:
        - { id: 1, workflow_id: 7, merge_request_id: 0, link_type: 0, project_id: 1000, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/", _siphon_replicated_at: "2024-01-20 18:00:00", _siphon_deleted: true }
    expect:
      nodes:
        gl_merge_request:
          rows:
            - { id: 10, created_by_duo: false }
