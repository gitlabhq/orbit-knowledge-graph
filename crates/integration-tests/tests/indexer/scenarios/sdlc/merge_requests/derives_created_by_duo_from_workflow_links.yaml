# Only live "created" links (link_type = 1) mark a merge request as Duo-created;
# merge_requests.created_by_duo is deliberately ignored because Siphon can leave
# it false after the link replicates. Siphon delete tombstones keep only key columns
# (merge_request_id 0), so deletion must be resolved by (workflow_id, id). A link carries its workflow's scope (project,
# group or a sibling project), so MRs at a project path still match links at other paths.
description: created_by_duo comes from created-type workflow links, not the merge_requests column
scope: { namespace: 100 }

seed:
  namespaces:
    - { id: 100, traversal_path: "1/100/" }
  merge_requests:
    - { id: 10, iid: 1, title: Created by Duo, description: "", source_branch: duo, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 1, traversal_path: "1/100/1000/" }
