description: After GitLab moves a deleted author's records to the Ghost user, the old AUTHORED edge is tombstoned and the Ghost edge kept

seed:
  gl_work_item:
    - { id: 10, traversal_path: "1/9970/", author_id: 99, _version: "2099-01-01 00:00:00.000000", _deleted: false }
  gl_merge_request:
    - { id: 20, traversal_path: "1/9970/", author_id: 99, _version: "2099-01-01 00:00:00.000000", _deleted: false }
  gl_note:
    - { id: 30, traversal_path: "1/9970/", author_id: 99, _version: "2099-01-01 00:00:00.000000", _deleted: false }
  gl_edge:
    - { traversal_path: "1/9970/", source_id: 6, source_kind: User, relationship_kind: AUTHORED, target_id: 10, target_kind: WorkItem, _version: "2024-01-01 00:00:00.000000", _deleted: false }
    - { traversal_path: "1/9970/", source_id: 99, source_kind: User, relationship_kind: AUTHORED, target_id: 10, target_kind: WorkItem, _version: "2099-01-01 00:00:00.000000", _deleted: false }
    - { traversal_path: "1/9970/", source_id: 6, source_kind: User, relationship_kind: AUTHORED, target_id: 20, target_kind: MergeRequest, _version: "2024-01-01 00:00:00.000000", _deleted: false }
    - { traversal_path: "1/9970/", source_id: 99, source_kind: User, relationship_kind: AUTHORED, target_id: 20, target_kind: MergeRequest, _version: "2099-01-01 00:00:00.000000", _deleted: false }
    - { traversal_path: "1/9970/", source_id: 6, source_kind: User, relationship_kind: AUTHORED, target_id: 30, target_kind: Note, _version: "2024-01-01 00:00:00.000000", _deleted: false }
    - { traversal_path: "1/9970/", source_id: 99, source_kind: User, relationship_kind: AUTHORED, target_id: 30, target_kind: Note, _version: "2099-01-01 00:00:00.000000", _deleted: false }

run: stale_edge_reconciliation

expect:
