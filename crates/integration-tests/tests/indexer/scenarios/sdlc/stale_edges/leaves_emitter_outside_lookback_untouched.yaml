description: A deleted emitter older than the lookback keeps its edges; one inside the lookback loses them

seed:
  gl_merge_request:
    - { id: 10, traversal_path: "1/9970/", _version: "2023-12-01 00:00:00.000000", _deleted: true }
    - { id: 11, traversal_path: "1/9970/", _version: "2024-01-20 18:00:00.000000", _deleted: true }
  gl_edge:
    - { traversal_path: "1/9970/", source_id: 10, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1000, target_kind: Project, _version: "2023-11-01 00:00:00.000000", _deleted: false }
    - { traversal_path: "1/9970/", source_id: 11, source_kind: MergeRequest, relationship_kind: IN_PROJECT, target_id: 1000, target_kind: Project, _version: "2024-01-15 00:00:00.000000", _deleted: false }

run: stale_edge_reconciliation

expect:
  edges:
    - kind: IN_PROJECT
      from: MergeRequest
      to: Project
      count: 1
      rows:
        - { source_id: 10, target_id: 1000 }
