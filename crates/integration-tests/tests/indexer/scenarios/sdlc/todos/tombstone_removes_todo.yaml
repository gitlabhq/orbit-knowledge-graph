description: A key-only todo tombstone (default target_type and state) removes the Todo node
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
      siphon_todos:
        - { id: 1, user_id: 7, author_id: 8, project_id: 1000, target_id: 10, target_type: MergeRequest, action: 9, state: pending, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/", _siphon_replicated_at: "2024-01-15 10:00:00" }
    expect:
      nodes:
        gl_todo: { rows: [{ id: 1, state: pending }] }

  - seed:
      checkpoint:
        - { key: ns.100.Todo, watermark: "2024-01-20 00:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 00:00:00.000000" }
      siphon_todos:
        - { id: 1, user_id: 7, author_id: 0, target_type: "", action: 0, state: "", created_at: "1970-01-01 00:00:00", updated_at: "1970-01-01 00:00:00", traversal_path: "1/100/1000/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      nodes:
        gl_todo: { count: 0 }
