expect:
  nodes:
    gl_todo:
      rows:
        - { id: 1, user_id: 7, author_id: 8, action: review_requested, state: pending, target_type: MergeRequest, target_id: 10 }
        - { id: 2, user_id: 7, action: assigned, state: done, target_type: Issue }
        - { id: 3, user_id: 9, action: mentioned, target_type: Epic, group_id: 100 }
  edges:
    - { kind: HAS_TODO, from: User, to: Todo, count: 3, rows: [{ source_id: 7, target_id: 1, traversal_path: "1/100/1000/", _owner_id: 7 }, { source_id: 7, target_id: 2, traversal_path: "1/100/1000/", _owner_id: 7 }, { source_id: 9, target_id: 3, traversal_path: "1/100/", _owner_id: 9 }] }
