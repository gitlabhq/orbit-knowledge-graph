description: Todos index with mapped action, HAS_TODO edges from the owner, FOR edges to work items and merge requests, ON_NOTE and RAISED_BY edges; todos on User, Key, and Commit targets and todos with no namespace path (0/) are not indexed
scope: { namespace: 100 }

seed:
  namespaces:
    - { id: 100, traversal_path: "1/100/" }
  projects:
    - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
  siphon_todos:
    - { id: 1, user_id: 7, author_id: 8, project_id: 1000, target_id: 10, target_type: MergeRequest, action: 9, state: pending, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/" }
    - { id: 2, user_id: 7, author_id: 8, project_id: 1000, target_id: 20, note_id: 3000, target_type: Issue, action: 1, state: done, resolved_by_action: 4, created_at: "2024-01-16 10:00:00", updated_at: "2024-01-17 10:00:00", traversal_path: "1/100/1000/" }
    - { id: 3, user_id: 9, author_id: 8, project_id: null, group_id: 100, target_id: 30, target_type: Epic, action: 2, state: pending, created_at: "2024-01-16 10:00:00", updated_at: "2024-01-16 10:00:00", traversal_path: "1/100/" }
    - { id: 4, user_id: 7, author_id: 8, target_id: 7, target_type: User, action: 16, state: pending, created_at: "2024-01-16 10:00:00", updated_at: "2024-01-16 10:00:00", traversal_path: "1/100/" }
    - { id: 6, user_id: 7, author_id: 8, project_id: 1000, target_id: null, commit_id: abc123, target_type: Commit, action: 2, state: pending, created_at: "2024-01-16 10:00:00", updated_at: "2024-01-16 10:00:00", traversal_path: "1/100/1000/" }
