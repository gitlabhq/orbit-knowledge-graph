description: A pipeline re-canceled by another pipeline, retriggered by another user and detached from its merge request keeps only its current edges; a key-only deleted pipeline loses every FK edge; the untouched pipeline keeps its own
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
      siphon_p_ci_pipelines:
        - { id: 5001, partition_id: 1, project_id: 1000, iid: 1, sha: a, ref: main, status: canceled, source: 1, tag: false, user_id: 1, merge_request_id: 10, auto_canceled_by_id: 5002, created_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/" }
        - { id: 5002, partition_id: 1, project_id: 1000, iid: 2, sha: b, ref: main, status: success, source: 1, tag: false, user_id: 1, created_at: "2024-01-15 10:05:00", traversal_path: "1/100/1000/" }
        - { id: 5003, partition_id: 1, project_id: 1000, iid: 3, sha: c, ref: main, status: canceled, source: 1, tag: false, user_id: 2, merge_request_id: 10, auto_canceled_by_id: 5002, created_at: "2024-01-15 10:10:00", traversal_path: "1/100/1000/" }
    expect:
      edges:
        - { kind: AUTO_CANCELED_BY, from: Pipeline, to: Pipeline, count: 2 }
        - { kind: TRIGGERED, from: User, to: Pipeline, count: 3 }
        - { kind: TRIGGERED, from: MergeRequest, to: Pipeline, count: 2 }
        - { kind: IN_PROJECT, from: Pipeline, to: Project, count: 3 }

  - seed:
      checkpoint:
        - { key: ns.100.Pipeline, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_p_ci_pipelines:
        - { id: 5001, partition_id: 1, project_id: 1000, iid: 1, sha: a, ref: main, status: canceled, source: 1, tag: false, user_id: 2, merge_request_id: null, auto_canceled_by_id: 5004, created_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/", _siphon_replicated_at: "2024-01-20 18:00:00" }
        - { id: 5003, partition_id: 1, traversal_path: "1/100/1000/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      nodes:
        gl_pipeline:
          count: 2
      edges:
        - { kind: AUTO_CANCELED_BY, from: Pipeline, to: Pipeline, count: 1, rows: [{ source_id: 5001, target_id: 5004 }] }
        - kind: TRIGGERED
          from: User
          to: Pipeline
          count: 2
          rows:
            - { source_id: 2, target_id: 5001 }
            - { source_id: 1, target_id: 5002 }
        - { kind: TRIGGERED, from: MergeRequest, to: Pipeline, count: 0 }
        - kind: IN_PROJECT
          from: Pipeline
          to: Project
          count: 2
          rows:
            - { source_id: 5001, target_id: 1000 }
            - { source_id: 5002, target_id: 1000 }
