description: An issue note moved to another issue keeps only the HAS_NOTE edge from the new work item; the merge request note keeps its edge
scope: { namespace: 100 }

steps:
  - seed:
      siphon_notes:
        - { id: 1, note: MR note, noteable_type: MergeRequest, noteable_id: 100, author_id: 1, system: false, internal: false, traversal_path: "1/100/", created_at: "2024-01-15", updated_at: "2024-01-15" }
        - { id: 2, note: Issue note, noteable_type: Issue, noteable_id: 200, author_id: 2, system: false, internal: false, traversal_path: "1/100/", created_at: "2024-01-16", updated_at: "2024-01-16" }
    expect:
      edges:
        - { kind: HAS_NOTE, from: WorkItem, to: Note, count: 1, rows: [{ source_id: 200, target_id: 2 }] }
        - { kind: HAS_NOTE, from: MergeRequest, to: Note, count: 1, rows: [{ source_id: 100, target_id: 1 }] }

  - seed:
      checkpoint:
        - { key: ns.100.Note, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_notes:
        - { id: 2, note: Issue note, noteable_type: Issue, noteable_id: 201, author_id: 2, system: false, internal: false, traversal_path: "1/100/", created_at: "2024-01-16", updated_at: "2024-01-20", _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      edges:
        - { kind: HAS_NOTE, from: WorkItem, to: Note, count: 1, rows: [{ source_id: 201, target_id: 2 }] }
        - { kind: HAS_NOTE, from: MergeRequest, to: Note, count: 1, rows: [{ source_id: 100, target_id: 1 }] }
        - { kind: AUTHORED, from: User, to: Note, count: 2 }
