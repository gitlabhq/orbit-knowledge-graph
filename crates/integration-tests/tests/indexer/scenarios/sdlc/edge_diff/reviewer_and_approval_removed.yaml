description: Removing one reviewer and one approval retires only those REVIEWER and APPROVED edges once the merge request row is re-extracted
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      merge_requests:
        - { id: 10, iid: 1, title: Review me, source_branch: a, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 1, updated_by_id: 1, traversal_path: "1/100/" }
      siphon_merge_request_reviewers:
        - { id: 1, user_id: 4, merge_request_id: 10, created_at: "2024-01-15 10:00:00", state: 0, project_id: 1000, traversal_path: "1/100/" }
        - { id: 2, user_id: 5, merge_request_id: 10, created_at: "2024-01-15 10:00:00", state: 0, project_id: 1000, traversal_path: "1/100/" }
      siphon_approvals:
        - { id: 1, merge_request_id: 10, user_id: 6, created_at: "2024-01-16 10:00:00", updated_at: "2024-01-16 10:00:00", project_id: 1000, traversal_path: "1/100/" }
        - { id: 2, merge_request_id: 10, user_id: 7, created_at: "2024-01-16 10:00:00", updated_at: "2024-01-16 10:00:00", project_id: 1000, traversal_path: "1/100/" }
    expect:
      edges:
        - { kind: REVIEWER, from: User, to: MergeRequest, count: 2 }
        - { kind: APPROVED, from: User, to: MergeRequest, count: 2 }

  - seed:
      checkpoint:
        - { key: ns.100.MergeRequest, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      merge_requests:
        - { id: 10, iid: 1, title: Review me, source_branch: a, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 1, updated_by_id: 3, traversal_path: "1/100/", _siphon_replicated_at: "2024-01-20 18:00:00" }
      siphon_merge_request_reviewers:
        - { id: 2, merge_request_id: 10, traversal_path: "1/100/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
      siphon_approvals:
        - { id: 2, merge_request_id: 10, traversal_path: "1/100/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      edges:
        - { kind: REVIEWER, from: User, to: MergeRequest, count: 1, rows: [{ source_id: 4, target_id: 10 }] }
        - { kind: APPROVED, from: User, to: MergeRequest, count: 1, rows: [{ source_id: 6, target_id: 10 }] }
