description: A group whose owner changes keeps only the new owner's OWNER edge
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
    expect:
      edges:
        - { kind: OWNER, from: User, to: Group, count: 1, rows: [{ source_id: 1, target_id: 100 }] }

  - seed:
      checkpoint:
        - { key: ns.100.Group, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_namespaces:
        - { id: 100, name: namespace-100, path: namespace-100, type: Group, visibility_level: 0, owner_id: 2, traversal_ids: [1, 100], created_at: "2023-01-01", updated_at: "2024-01-20", _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      edges:
        - { kind: OWNER, from: User, to: Group, count: 1, rows: [{ source_id: 2, target_id: 100 }] }
