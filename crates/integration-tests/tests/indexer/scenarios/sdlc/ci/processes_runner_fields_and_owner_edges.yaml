description: Runners index registration and creation state, and link group runners to their group with OWNED_BY
scope: { namespace: 100 }

seed:
  namespaces:
    - { id: 100, traversal_path: "1/100/" }
    - { id: 101, parent_id: 100, traversal_path: "1/100/101/" }
  siphon_users:
    - { id: 1, email: user1@example.com, username: user1, name: User 1, state: active, organization_id: 1 }
  siphon_ci_runners:
    - { id: 9001, runner_type: 2, name: group runner, description: build, active: true, registration_type: 1, creation_state: 100, creator_id: 1, maintainer_note: rotate monthly, created_at: "2024-01-15", updated_at: "2024-01-16" }
    - { id: 9002, runner_type: 1, name: shared, description: shared, active: true, registration_type: 0, creation_state: 0, created_at: "2024-01-15", updated_at: "2024-01-15" }
  siphon_ci_runner_namespaces:
    - { id: 1, runner_id: 9001, namespace_id: 101, traversal_path: "1/100/101/" }

run: [global, namespace]

expect:
  nodes:
    gl_runner:
      rows:
        - { id: 9001, registration_type: authenticated_user, creation_state: finished, creator_id: 1, maintainer_note: rotate monthly }
        - { id: 9002, registration_type: registration_token, creation_state: started, creator_id: null }
  edges:
    - kind: OWNED_BY
      from: Runner
      to: Group
      count: 1
      rows:
        - { source_id: 9001, target_id: 101, traversal_path: "1/100/101/" }
