    - { id: 2, email: user2@example.com, username: user2, name: User 2, state: active, organization_id: 1 }
  siphon_p_ci_builds:
    - { id: 7001, partition_id: 1, project_id: 1000, name: compile, status: success, ref: main, type: "Ci::Build", queued_at: "2024-01-15 10:00:00", started_at: "2024-01-15 10:00:30", finished_at: "2024-01-15 10:02:00", protected: true, stage_idx: 2, erased_at: "2024-01-16 00:00:00", erased_by_id: 1, scoped_user_id: 2, resource_group_id: 40, artifacts_expire_at: "2024-02-15 00:00:00", traversal_path: "1/100/1000/" }
