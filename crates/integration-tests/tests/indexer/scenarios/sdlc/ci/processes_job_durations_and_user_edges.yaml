expect:
  nodes:
    gl_job:
      rows:
        - { id: 7001, duration: 90, queued_duration: 30, protected: true, stage_idx: 2, erased_by_id: 1, scoped_user_id: 2, resource_group_id: 40 }
        - { id: 7002, duration: null, queued_duration: 45 }
        - { id: 7003, duration: null, queued_duration: null }
        - { id: 7004, description: Security scan, target_url: "https://ci.example.com/1", duration: null }
  edges:
    - kind: ERASED_BY
      from: User
      to: Job
      count: 1
      rows:
        - { source_id: 1, target_id: 7001, traversal_path: "1/100/1000/" }
    - kind: SCOPED_TO
      from: Job
      to: User
      count: 1
      rows:
        - { source_id: 7001, target_id: 2, traversal_path: "1/100/1000/" }
