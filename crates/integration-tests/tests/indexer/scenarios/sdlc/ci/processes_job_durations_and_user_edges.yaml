    - { id: 7003, partition_id: 1, project_id: 1000, name: waiting, status: pending, ref: main, type: "Ci::Build", queued_at: "2024-01-15 10:00:00", scheduled_at: "2024-01-15 11:00:00", traversal_path: "1/100/1000/" }
