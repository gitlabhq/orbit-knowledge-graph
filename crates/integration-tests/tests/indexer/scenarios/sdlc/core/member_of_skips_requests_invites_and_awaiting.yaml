description: MEMBER_OF skips access requests, invites, and awaiting memberships; BANNED_FROM covers top-level group bans only
scope: { namespace: 100 }

seed:
  namespaces:
    - { id: 100, traversal_path: "1/100/" }
    - { id: 101, parent_id: 100, traversal_path: "1/100/101/" }
  projects:
    - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
  siphon_users:
    - { id: 1, email: user1@example.com, username: user1, name: User 1, state: active, organization_id: 1 }
    - { id: 2, email: user2@example.com, username: user2, name: User 2, state: active, organization_id: 1 }
    - { id: 3, email: user3@example.com, username: user3, name: User 3, state: active, organization_id: 1 }
  siphon_members:
    - { id: 11000, access_level: 30, source_id: 100, source_type: Namespace, user_id: 1, state: 0, traversal_path: "1/100/" }
    - { id: 11001, access_level: 30, source_id: 1000, source_type: Project, user_id: 1, state: 0, traversal_path: "1/100/1000/" }
    - { id: 11002, access_level: 10, source_id: 100, source_type: Namespace, user_id: 2, state: 0, requested_at: "2024-01-10 00:00:00", traversal_path: "1/100/" }
    - { id: 11003, access_level: 30, source_id: 100, source_type: Namespace, user_id: null, state: 0, invite_email: invitee@example.com, traversal_path: "1/100/" }
    - { id: 11004, access_level: 30, source_id: 1000, source_type: Project, user_id: 3, state: 1, traversal_path: "1/100/1000/" }
  siphon_namespace_bans:
    - { id: 1, namespace_id: 100, user_id: 3, created_at: "2024-01-10 00:00:00", updated_at: "2024-01-10 00:00:00", traversal_path: "1/100/" }
    - { id: 2, namespace_id: 101, user_id: 2, created_at: "2024-01-10 00:00:00", updated_at: "2024-01-10 00:00:00", traversal_path: "1/100/101/" }

expect:
  edges:
    - kind: MEMBER_OF
      from: User
      to: Group
      count: 1
      rows:
        - { source_id: 1, target_id: 100 }
    - kind: MEMBER_OF
      from: User
      to: Project
      count: 1
      rows:
        - { source_id: 1, target_id: 1000 }
    - kind: BANNED_FROM
      from: User
      to: Group
      count: 1
      rows:
        - { source_id: 3, target_id: 100, traversal_path: "1/100/" }
