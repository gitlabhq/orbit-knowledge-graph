description: Setting deleted_at on an AI catalog item removes its node, clearing it restores the node, and a key-only delete tombstone removes it again
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
      siphon_ai_catalog_items:
        - { id: 1, organization_id: 1, project_id: 1000, item_type: 1, name: Team Agent, description: Agent, visibility: 2, created_at: "2024-01-01 00:00:00", updated_at: "2024-01-01 00:00:00", traversal_path: "1/", _siphon_replicated_at: "2024-01-01 00:00:00" }
    expect:
      nodes:
        gl_duo_catalog_item: { rows: [{ id: 1, name: Team Agent }] }

  - seed:
      checkpoint:
        - { key: ns.100.DuoCatalogItem, watermark: "2024-01-20 00:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 00:00:00.000000" }
      siphon_ai_catalog_items:
        - { id: 1, organization_id: 1, project_id: 1000, item_type: 1, name: Team Agent, description: Agent, visibility: 2, deleted_at: "2024-01-20 18:00:00", created_at: "2024-01-01 00:00:00", updated_at: "2024-01-20 18:00:00", traversal_path: "1/", _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      nodes:
        gl_duo_catalog_item: { count: 0 }

  - seed:
      checkpoint:
        - { key: ns.100.DuoCatalogItem, watermark: "2024-01-20 19:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 19:00:00.000000" }
      siphon_ai_catalog_items:
        - { id: 1, organization_id: 1, project_id: 1000, item_type: 1, name: Team Agent, description: Agent, visibility: 2, deleted_at: null, created_at: "2024-01-01 00:00:00", updated_at: "2024-01-20 20:00:00", traversal_path: "1/", _siphon_replicated_at: "2024-01-20 20:00:00" }
    expect:
      nodes:
        gl_duo_catalog_item: { rows: [{ id: 1, name: Team Agent }] }

  - seed:
      checkpoint:
        - { key: ns.100.DuoCatalogItem, watermark: "2024-01-20 21:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 21:00:00.000000" }
      siphon_ai_catalog_items:
        - { id: 1, organization_id: 0, project_id: null, item_type: 0, name: "", description: "", visibility: 0, created_at: "1970-01-01 00:00:00", updated_at: "1970-01-01 00:00:00", traversal_path: "1/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 22:00:00" }
    expect:
      nodes:
        gl_duo_catalog_item: { count: 0 }
