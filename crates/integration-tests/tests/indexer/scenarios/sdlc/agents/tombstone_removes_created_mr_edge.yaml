description: A key-only tombstone for a link row removes the CREATED_MR edge while the live version is unmerged, and does nothing once only the tombstone is left
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
      merge_requests:
        - { id: 10, iid: 1, title: First, source_branch: a, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 1, traversal_path: "1/100/1000/" }
        - { id: 20, iid: 2, title: Second, source_branch: b, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 1, traversal_path: "1/100/1000/" }
        - { id: 30, iid: 3, title: Third, source_branch: c, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 1, traversal_path: "1/100/1000/" }
      siphon_ai_governance_sessions:
        - { id: 11, namespace_id: 100, project_id: 1000, user_id: 7, workflow_id: 1, source: 0, flow_type: developer, session_started_at: "2024-01-15 10:00:00", created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/" }
      siphon_duo_workflows_workflow_merge_requests:
        - { id: 1, workflow_id: 1, merge_request_id: 10, project_id: 1000, link_type: 1, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/" }
        - { id: 2, workflow_id: 1, merge_request_id: 20, project_id: 1000, link_type: 1, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/" }
    expect:
      edges:
        - { kind: CREATED_MR, from: AgentSession, to: MergeRequest, traversal_path: "1/100/1000/", count: 2 }

  - seed:
      checkpoint:
        - { key: ns.100.CREATED_MR_siphon_duo_workflows_workflow_merge_requests, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_duo_workflows_workflow_merge_requests:
        - { id: 1, workflow_id: 1, merge_request_id: 0, link_type: 0, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      edges:
        - kind: CREATED_MR
          from: AgentSession
          to: MergeRequest
          count: 1
          rows:
            - { source_id: 11, target_id: 20, traversal_path: "1/100/1000/" }
