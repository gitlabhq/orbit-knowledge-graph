description: A plan whose Siphon source table does not exist on this GitLab version completes with nothing indexed, so the other plans and the schema activation gate proceed; once the table appears the next run backfills every row from the start of time, and a table that disappears after rows were indexed keeps its watermark
scope: { namespace: 100 }

steps:
  - drop_tables: [siphon_ai_governance_sessions]
    seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
    targets: [Project, AgentSession, CREATED_MR]
    expect:
      nodes:
        gl_project: { rows: [{ id: 1000 }] }
        gl_agent_session: { count: 0 }
        checkpoint:
          rows:
            - { key: ns.100.Project, watermark: { not: "1970-01-01T00:00:00Z" }, indexed_at: { not: null } }
            - { key: ns.100.AgentSession, watermark: "1970-01-01T00:00:00Z", indexed_at: { not: null }, attempts: 0 }
            - { key: ns.100.CREATED_MR_siphon_duo_workflows_workflow_merge_requests, watermark: "1970-01-01T00:00:00Z", indexed_at: { not: null }, attempts: 0 }

  - create_tables: [siphon_ai_governance_sessions]
    seed:
      siphon_ai_governance_sessions:
        - { id: 11, namespace_id: 100, project_id: 1000, user_id: 7, workflow_id: 1, source: 0, flow_type: developer, session_started_at: "2024-01-15 10:00:00", created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/", _siphon_replicated_at: "2023-06-01 00:00:00" }
    targets: [AgentSession]
    expect:
      nodes:
        gl_agent_session:
          rows:
            - { id: 11, flow_type: developer, project_id: 1000 }
        checkpoint:
          rows:
            - { key: ns.100.Project, indexed_at: { not: null } }
            - { key: ns.100.AgentSession, watermark: { not: "1970-01-01T00:00:00Z" }, indexed_at: { not: null } }
            - { key: ns.100.CREATED_MR_siphon_duo_workflows_workflow_merge_requests, watermark: "1970-01-01T00:00:00Z" }
      edges:
        - { kind: IN_PROJECT, from: AgentSession, to: Project, traversal_path: "1/100/1000/", count: 1 }

  - drop_tables: [siphon_ai_governance_sessions]
    targets: [AgentSession]
    expect:
      nodes:
        gl_agent_session:
          rows:
            - { id: 11 }
        checkpoint:
          count: 3
          rows:
            - { key: ns.100.AgentSession, watermark: { not: "1970-01-01T00:00:00Z" }, indexed_at: { not: null }, attempts: 0 }
