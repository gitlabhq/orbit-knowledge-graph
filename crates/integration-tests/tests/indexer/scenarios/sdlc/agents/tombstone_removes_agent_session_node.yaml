description: a key-only governance session tombstone (no project_id, default source) tombstones the AgentSession node
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/" }
      siphon_ai_governance_sessions:
        - { id: 11, namespace_id: 100, project_id: 1000, user_id: 7, workflow_id: 1, source: 0, flow_type: developer, session_started_at: "2024-01-15 10:00:00", created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", traversal_path: "1/100/1000/", _siphon_replicated_at: "2024-01-15 10:00:00" }
    expect:
      nodes:
        gl_agent_session:
          rows:
            - { id: 11, _deleted: false }

  - seed:
      checkpoint:
        - { key: ns.100.AgentSession, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_ai_governance_sessions:
        - { id: 11, namespace_id: 0, session_started_at: "2024-01-15 10:00:00", created_at: "1970-01-01 00:00:00", updated_at: "1970-01-01 00:00:00", traversal_path: "1/100/1000/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      nodes:
        gl_agent_session:
          count: 0
