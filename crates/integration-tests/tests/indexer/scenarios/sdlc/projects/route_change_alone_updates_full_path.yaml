# The second run gets a new route row and no new siphon_projects row, as after
# a transfer whose route rows arrive later than the project row.
description: A route change without a project row change re-extracts the project full_path
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/", slug: org }
      projects:
        - { id: 1000, namespace_id: 100, traversal_path: "1/100/1000/", slug: app }
    expect:
      nodes:
        gl_project:
          rows:
            - { id: 1000, full_path: app }

  - seed:
      checkpoint:
        - { key: ns.100.Project, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_routes:
        - { id: 1000, source_id: 1000, source_type: Project, path: org/app, namespace_id: 100, traversal_path: "1/100/1000/", _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      nodes:
        gl_project:
          count: 1
          rows:
            - { id: 1000, full_path: org/app }
