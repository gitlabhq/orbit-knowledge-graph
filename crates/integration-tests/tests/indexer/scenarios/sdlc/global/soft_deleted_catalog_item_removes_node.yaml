description: Setting deleted_at on an AI catalog item removes its node; clearing it restores the node
run: global

steps:
  - seed:
      siphon_ai_catalog_items:
        - { id: 1, organization_id: 1, item_type: 1, name: Team Agent, description: Agent, visibility: 2, created_at: "2024-01-01 00:00:00", updated_at: "2024-01-01 00:00:00", traversal_path: "1/", _siphon_replicated_at: "2024-01-01 00:00:00" }
    expect:
      nodes:
        gl_duo_catalog_item: { rows: [{ id: 1, name: Team Agent }] }

  - seed:
      checkpoint:
        - { key: global.DuoCatalogItem, watermark: "2024-01-20 00:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 00:00:00.000000" }
      siphon_ai_catalog_items:
        - { id: 1, organization_id: 1, item_type: 1, name: Team Agent, description: Agent, visibility: 2, deleted_at: "2024-02-01 00:00:00", created_at: "2024-01-01 00:00:00", updated_at: "2024-02-01 00:00:00", traversal_path: "1/", _siphon_replicated_at: "2024-02-01 00:00:00" }
    expect:
      nodes:
        gl_duo_catalog_item: { count: 0 }

  - seed:
      checkpoint:
        - { key: global.DuoCatalogItem, watermark: "2024-02-10 00:00:00.000000", cursor_values: "null", indexed_at: "2024-02-10 00:00:00.000000" }
      siphon_ai_catalog_items:
        - { id: 1, organization_id: 1, item_type: 1, name: Team Agent, description: Agent, visibility: 2, deleted_at: null, created_at: "2024-01-01 00:00:00", updated_at: "2024-03-01 00:00:00", traversal_path: "1/", _siphon_replicated_at: "2024-03-01 00:00:00" }
    expect:
      nodes:
        gl_duo_catalog_item: { rows: [{ id: 1, name: Team Agent }] }
