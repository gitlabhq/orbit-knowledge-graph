# The approvals pipeline wrote these edges and sees no change; the merge request's key-only
# lake tombstone alone must take them.
description: A deleted merge request's APPROVED edges disappear and another's stay
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
      merge_requests:
        - { id: 10, iid: 101, title: Add auth, description: Auth feature, source_branch: feat-auth, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 1, traversal_path: "1/100/" }
        - { id: 20, iid: 102, title: Fix crash, description: Crash fix, source_branch: fix-crash, target_branch: main, state_id: 1, merge_status: can_be_merged, draft: false, squash: false, target_project_id: 1000, author_id: 2, traversal_path: "1/100/" }
      siphon_approvals:
        - { id: 1, merge_request_id: 10, user_id: 10, created_at: "2024-01-15 10:00:00", updated_at: "2024-01-15 10:00:00", project_id: 1000, traversal_path: "1/100/" }
        - { id: 2, merge_request_id: 10, user_id: 11, created_at: "2024-01-15 11:00:00", updated_at: "2024-01-15 11:00:00", project_id: 1000, traversal_path: "1/100/" }
        - { id: 3, merge_request_id: 20, user_id: 12, created_at: "2024-01-16 09:00:00", updated_at: "2024-01-16 09:00:00", project_id: 1000, traversal_path: "1/100/" }
    expect:
      edges:
        - { kind: APPROVED, from: User, to: MergeRequest, traversal_path: "1/100/", count: 3 }

  - seed:
      checkpoint:
        - { key: ns.100.MergeRequest, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
        - { key: ns.100.APPROVED_siphon_approvals_MergeRequest, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      merge_requests:
        - { id: 10, traversal_path: "1/100/", _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      edges:
        - kind: APPROVED
          from: User
          to: MergeRequest
          count: 1
          rows:
            - { source_id: 12, target_id: 20 }
