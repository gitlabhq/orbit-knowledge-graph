# The lake tombstone carries only the key, so no MEMBER_OF row is re-emitted as deleted; the
# group's tombstone reaches the edges another pipeline wrote.
description: A deleted group's MEMBER_OF edges disappear and its parent's stay
scope: { namespace: 100 }

steps:
  - seed:
      namespaces:
        - { id: 100, traversal_path: "1/100/" }
        - { id: 200, parent_id: 100, traversal_path: "1/100/200/" }
      siphon_users:
        - { id: 1, email: user1@example.com, username: user1, name: User 1, state: active, organization_id: 1 }
        - { id: 2, email: user2@example.com, username: user2, name: User 2, state: active, organization_id: 1 }
      siphon_members:
        - { id: 10200, access_level: 40, source_id: 200, source_type: Namespace, user_id: 1, state: 0, traversal_path: "1/100/200/" }
        - { id: 20100, access_level: 40, source_id: 100, source_type: Namespace, user_id: 2, state: 0, traversal_path: "1/100/" }
    expect:
      edges:
        - kind: MEMBER_OF
          from: User
          to: Group
          count: 2
          rows:
            - { source_id: 1, target_id: 200, traversal_path: "1/100/200/" }
            - { source_id: 2, target_id: 100, traversal_path: "1/100/" }

  - seed:
      checkpoint:
        - { key: ns.100.Group, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
        - { key: ns.100.MEMBER_OF_siphon_members, watermark: "2024-01-20 12:00:00.000000", cursor_values: "null", indexed_at: "2024-01-20 12:00:00.000000" }
      siphon_namespaces:
        - { id: 200, _siphon_deleted: true, _siphon_replicated_at: "2024-01-20 18:00:00" }
    expect:
      nodes:
        gl_group:
          rows:
            - { id: 100 }
      edges:
        - kind: MEMBER_OF
          from: User
          to: Group
          count: 1
          rows:
            - { source_id: 2, target_id: 100, traversal_path: "1/100/" }
