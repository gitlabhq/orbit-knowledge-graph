description: >
  An enabled-namespace CDC insert without a traversal_path column (what real
  Siphon events look like) resolves the path from namespace_traversal_paths
  and dispatches.

seed:
  namespace_traversal_paths:
    - { id: 800, traversal_path: "8/800/" }
  project_namespace_traversal_paths:
    - { id: 8000, traversal_path: "8/800/8000/" }

cdc:
  - table: knowledge_graph_enabled_namespaces
    operation: insert
    rows:
      - { root_namespace_id: 800 }

dispatch: enabled_namespaces

expect:
  dispatched:
    - kind: namespace
      count: 1
      rows:
        - { namespace: 800, traversal_path: "8/800/" }
    - kind: code_task
      count: 1
      rows:
        - { project_id: 8000, traversal_path: "8/800/8000/" }
