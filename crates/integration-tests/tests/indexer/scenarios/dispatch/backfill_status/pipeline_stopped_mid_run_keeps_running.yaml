description: >
  A pipeline whose parent checkpoint still carries a cursor has not finished
  its initial pass, so the namespace stays running even with no pending projects.

seed:
  siphon_knowledge_graph_enabled_namespaces:
    - { id: 330, root_namespace_id: 330, traversal_path: "3/330/", created_at: "2024-01-15", updated_at: "2024-01-15" }
  namespace_traversal_paths:
    - { id: 330, traversal_path: "3/330/" }
  completed_sdlc_pipelines:
    - { namespace_id: 330 }
  # Inserted with a later _version than the completed rows, so FINAL keeps the mid-run cursor.
  checkpoint:
    - { key: ns.330.Project, watermark: "2024-01-20 12:00:00", cursor_values: '{"c":["1000"]}', _version: "2030-01-01 00:00:00" }

dispatch: code_backfill

expect:
  backfill:
    - path: "3/330/"
      state: running
