[package]
name = "integration-tests"
version.workspace = true
edition = "2024"
publish = false

# No src/lib.rs — this crate only contains integration tests.
# Test targets are auto-discovered from tests/*.rs files.
# Shared helpers live in tests/common/ (subdirectory, ignored by auto-discovery).

[dev-dependencies]
clickhouse-client = { workspace = true }
compiler = { workspace = true }
orbit-analytics = { workspace = true, features = ["testkit"] }
code-graph = { workspace = true }
duckdb-client = { workspace = true }
orbit-server = { workspace = true, features = ["testkit"] }
orbit-server-config = { workspace = true }
orbit-utils = { workspace = true }
orbit-arrow = { workspace = true }
jsonschema = { workspace = true }
jsonwebtoken = { workspace = true }
indexer = { workspace = true, features = ["testkit"] }
indexer-duckdb = { workspace = true }
named-queries = { workspace = true }
nats-client = { workspace = true, features = ["testkit"] }
integration-testkit = { workspace = true }
ontology = { workspace = true }
orbit-migrations = { workspace = true }
query-data-model = { workspace = true }
query-engine = { workspace = true, features = ["testutils"] }
arrow = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
comrak = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
gitaly-protos = { workspace = true }
gitlab-client = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
siphon-proto = { workspace = true }
regex = { workspace = true }
tar = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
cargo_metadata = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls"] }
health-check = { workspace = true }
labkit = { workspace = true, features = ["health", "tls"] }
labkit-events = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["metrics", "rt-tokio", "testing"] }
uuid = { workspace = true }

[lints]
workspace = true
