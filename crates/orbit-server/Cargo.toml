[package]
name = "orbit-server"
version.workspace = true
edition = "2024"
license = "MIT"

[[bin]]
name = "gkg-server"
path = "src/main.rs"

[features]
default = []
regenerate-protos = ["dep:tonic-prost-build"]
testkit = ["orbit-analytics/testkit"]

# libduckdb-sys is used only by build.rs, which reads the download directory it publishes as
# DEP_DUCKDB_INCLUDE. cargo-shear does not see build-script use of links metadata.
[package.metadata.cargo-shear]
ignored = ["libduckdb-sys"]

[dependencies]
mimalloc = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
clickhouse-client = { workspace = true }
orbit-analytics = { workspace = true }
orbit-billing = { workspace = true }
orbit-observability = { workspace = true }
orbit-log-fields = { workspace = true }
orbit-prompts = { workspace = true }
orbit-server-config = { workspace = true }
orbit-utils = { workspace = true }
orbit-arrow = { workspace = true }
orbit-versions = { workspace = true }
health-check = { workspace = true }
indexer = { workspace = true }
indexer-duckdb = { workspace = true }
libduckdb-sys = { workspace = true }
orbit-migrations = { workspace = true }
minijinja = { workspace = true }
named-queries = { workspace = true }
nats-client = { workspace = true }
ontology = { workspace = true }
query-data-model = { workspace = true }
tower = { workspace = true, features = ["util"] }
opentelemetry = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
rustls = { workspace = true, features = ["fips"] }
aws-lc-rs = { workspace = true, features = ["fips"] }
query-engine = { workspace = true }
gitlab-client = { workspace = true }
jsonschema = { workspace = true }
jsonwebtoken = { workspace = true }
labkit = { workspace = true, features = ["grpc", "health", "otel", "prometheus", "verbose-logs"] }
labkit-events = { workspace = true }
serde = { workspace = true }
secrecy = { workspace = true }
semver = { workspace = true }
strum = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util.workspace = true
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
toon-format = { workspace = true }

[build-dependencies]
orbit-versions = { workspace = true }
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
axum = { workspace = true }
compiler = { workspace = true }
orbit-analytics = { workspace = true, features = ["testkit"] }
orbit-billing = { workspace = true, features = ["testkit"] }
orbit-prompts = { workspace = true, features = ["skill-validation"] }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true
