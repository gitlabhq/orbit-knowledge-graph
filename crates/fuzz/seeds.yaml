fuzz_gql:
  - labels: [aggregation, order_by]
    input: |
      MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
      WHERE p.id IN [1, 2]
      RETURN u, count(mr) AS mr_count
      ORDER BY mr_count DESC
      LIMIT 20
  - labels: [aggregation]
    input: |
      MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
      WHERE p.id IN [1, 2]
      RETURN p, count(mr) AS mr_count
      LIMIT 10
  - labels: [code_graph, string_match]
    input: |
      MATCH (f:File)-[:DEFINES]->(d:Definition)
      WHERE f.path ENDS WITH '.rb' AND d.name STARTS WITH 'process'
      RETURN *
      LIMIT 20
  - labels: [neighbors]
    input: |
      MATCH (p:Project)-[:CONTAINS|IN_PROJECT]-(n)
      WHERE p.id IN [1, 2]
      RETURN n
      LIMIT 20
  - labels: [pagination, order_by, skip]
    input: |
      MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
      WHERE p.id IN [1, 2]
      RETURN mr.iid, mr.title
      ORDER BY mr.iid
      SKIP 20
      LIMIT 10
  - labels: [path_finding, variable_length]
    input: |
      MATCH path = ANY SHORTEST (src:Group)-[:CONTAINS*1..2]->(dst:Group)
      WHERE src.id IN [1, 2] AND dst.id IN [3, 4]
      RETURN path
      LIMIT 5
  - labels: [search, projection]
    input: |
      MATCH (pipe:Pipeline {status: 'failed'})
      RETURN pipe{.id, .status, .ref}
      LIMIT 50
  - labels: [time_series, date_trunc]
    input: |
      MATCH (w:WorkItem {work_item_type: 'issue', state: 'closed'})
      WHERE w.closed_at >= '2026-07-19'
      RETURN date_trunc('week', w.closed_at) AS wk, count(w) AS n
      ORDER BY wk
  - labels: [traversal, datetime_filter, order_by]
    input: |
      MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
      WHERE mr.merged_at >= '2026-03-01T00:00:00Z' AND p.id IN [1, 2]
      RETURN *
      ORDER BY mr.merged_at DESC
      LIMIT 20
  - labels: [traversal, multi_hop, order_by]
    input: |
      MATCH (u:User {username: 'stanhu'})-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
      WHERE p.id IN [1, 2]
      RETURN *
      ORDER BY mr.merged_at DESC
      LIMIT 10
