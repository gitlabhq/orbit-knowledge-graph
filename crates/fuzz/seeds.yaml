fuzz_gql:
  - |
    MATCH (p:Project)-[:CONTAINS|IN_PROJECT]-(n)
    WHERE p.id IN [1, 2]
    RETURN n
    LIMIT 20
  - |
    MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE mr.merged_at >= '2026-03-01T00:00:00Z' AND p.id IN [1, 2]
    RETURN *
    ORDER BY mr.merged_at DESC
    LIMIT 20
  - |
    MATCH (f:File)-[:DEFINES]->(d:Definition)
    WHERE f.path ENDS WITH '.rb' AND d.name STARTS WITH 'process'
    RETURN *
    LIMIT 20
  - |
    MATCH (u:User {username: 'stanhu'})-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN [1, 2]
    RETURN *
    ORDER BY mr.merged_at DESC
    LIMIT 10
  - |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN [1, 2]
    RETURN u, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 20
