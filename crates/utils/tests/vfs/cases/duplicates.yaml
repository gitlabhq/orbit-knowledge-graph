name: The last file at a repeated path wins
sources: [memory, lazy, archive]
fixtures:
  - path: file
    content: first
  - path: file
    content: second
tests:
  - name: Repeated paths produce one node with the final content
    assert:
      - {op: read, path: file, expect: {ok: second}}
      - {op: usage, expect: {files: 1, duplicate_paths: 1}}
