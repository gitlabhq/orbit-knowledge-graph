sources: [checkout]
entries:
  - {path: .git/config, data: "[core]\n"}
  - {path: .git/info/exclude, data: "tmp/\n"}
  - {path: .gitignore, data: "build/\n"}
  - {path: .ignore, data: "notes/\n"}
  - {path: .env, data: x}
  - {path: notes/x, data: x}
  - {path: tmp/x, data: x}
  - {path: build/x, data: x}
steps:
  - {op: read_dir, path: /, expect: {ok: [.env, .gitignore, .ignore, notes]}}
  - {op: read, path: notes/x, expect: {ok: x}}
  - {op: stat, path: tmp/x, expect: {error: NotFound}}
  - {op: stat, path: build/x, expect: {error: NotFound}}
