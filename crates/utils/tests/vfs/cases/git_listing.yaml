name: Checkout applies Git ignore rules to the fixture tree
sources: [checkout]
fixtures:
  - path: .git/config
    content: |
      [core]
  - path: .git/info/exclude
    content: |
      tmp/
  - path: .gitignore
    content: |
      build/
  - path: .ignore
    content: |
      notes/
  - path: .env
    content: ""
  - path: notes/x
    content: ""
  - path: tmp/x
    content: ""
  - path: build/x
    content: ""
tests:
  - name: Git excludes apply while dotfiles and ripgrep-ignored paths remain
    assert:
      - {op: read_dir, path: /, expect: {ok: [.env, .gitignore, .ignore, notes]}}
      - {op: read, path: notes/x, expect: {ok: ""}}
      - {op: stat, path: tmp/x, expect: {error: NotFound}}
      - {op: stat, path: build/x, expect: {error: NotFound}}
