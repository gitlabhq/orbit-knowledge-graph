sources: [checkout, changed]
entries:
  - {path: deleted.rs, data: original}
  - {path: grown.rs, data: small}
rules:
  - {phase: header, decision: {kind: keep, value: source}}
steps:
  - {op: remove, path: deleted.rs}
  - {op: read, path: deleted.rs, expect: {error: NotFound}}
  - {op: stat, path: deleted.rs, expect: {ok: {path: /deleted.rs, kind: file, len: 8, decision: {kind: keep, value: source}}}}
  - {op: write, path: grown.rs, data: "larger than before"}
  - {op: read, path: grown.rs, expect: {error: InvalidData}}
