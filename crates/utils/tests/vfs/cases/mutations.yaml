name: Linked files reflect host changes after loading
sources: [checkout, changed]
fixtures:
  - path: deleted.rs
    content: original
  - path: grown.rs
    content: small
rules:
  - {phase: header, decision: {kind: keep, value: source}}
tests:
  - name: Deleting a host file refuses reads but keeps its metadata
    assert:
      - {op: remove, path: deleted.rs}
      - {op: read, path: deleted.rs, expect: {error: NotFound}}
      - {op: stat, path: deleted.rs, expect: {ok: {path: /deleted.rs, kind: file, len: 8, decision: {kind: keep, value: source}}}}
  - name: A changed size fails the read
    assert:
      - {op: write, path: grown.rs, content: "larger than before"}
      - {op: read, path: grown.rs, expect: {error: InvalidData}}
