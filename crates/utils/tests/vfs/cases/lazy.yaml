sources: [lazy]
entries:
  - {path: main.rs, data: code}
  - {path: input, data: data}
  - {path: logo.png, read_error: must_not_read}
  - {path: build.log, read_error: must_not_read}
rules:
  - {phase: header, suffix: .rs, decision: {kind: keep, value: source}}
  - {phase: header, suffix: .png, decision: {kind: list, value: excluded}}
  - {phase: header, suffix: .log, decision: {kind: drop, value: log}}
steps:
  - {op: lazy_reads, expect: 2}
  - {op: read, path: main.rs, expect: {ok: code}}
  - {op: read, path: main.rs, expect: {ok: code}}
  - {op: read, path: input, expect: {ok: data}}
  - {op: lazy_reads, expect: 2}
