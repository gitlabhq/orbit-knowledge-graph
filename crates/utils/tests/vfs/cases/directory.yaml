- name: Directory applies Git ignore rules to the fixture tree
  sources: [directory]
  fixtures:
    - path: .git/config
      content: |
        [core]
    - path: .git/info/exclude
      content: |
        tmp/
    - path: .gitignore
      content: |
        build/
    - path: .ignore
      content: |
        notes/
    - path: .env
      content: ""
    - path: notes/x
      content: ""
    - path: tmp/x
      content: ""
    - path: build/x
      content: ""
  tests:
    - name: Git excludes apply while dotfiles and ripgrep-ignored paths remain
      assert:
        - {op: read_dir, path: /, expect: {ok: [.env, .gitignore, .ignore, notes]}}
        - {op: read, path: notes/x, expect: {ok: ""}}
        - {op: stat, path: tmp/x, expect: {error: NotFound}}
        - {op: stat, path: build/x, expect: {error: NotFound}}

- name: A changeset selects files from the fixture tree
  sources: [changeset]
  fixtures:
    - path: a
      content: a
    - path: untouched
      content: x
    - path: dir/child
      content: x
  changeset: [a, dir, missing]
  tests:
    - name: Only selected regular files enter the VFS
      assert:
        - {op: read_dir, path: /, expect: {ok: [a]}}
        - {op: read, path: a, expect: {ok: a}}
        - {op: stat, path: untouched, expect: {error: NotFound}}
        - {op: stat, path: dir/child, expect: {error: NotFound}}
        - {op: usage, expect: {files: 1}}

- name: Changeset paths cannot escape the source directory
  sources: [changeset]
  fixtures: []
  changeset: [../outside]
  load_error: InvalidInput

- name: Linked files reflect host changes after loading
  sources: [directory, changeset]
  fixtures:
    - path: deleted.rs
      content: original
    - path: grown.rs
      content: small
  rules:
    - {phase: metadata, decision: {kind: keep, value: source}}
  tests:
    - name: Deleting a host file refuses reads but keeps its metadata
      assert:
        - {op: remove, path: deleted.rs}
        - {op: read, path: deleted.rs, expect: {error: NotFound}}
        - {op: stat, path: deleted.rs, expect: {ok: {path: /deleted.rs, kind: file, len: 8, decision: {kind: keep, value: source}}}}
    - name: A changed size fails the read
      assert:
        - {op: write, path: grown.rs, content: "larger than before"}
        - {op: read, path: grown.rs, expect: {error: InvalidData}}
