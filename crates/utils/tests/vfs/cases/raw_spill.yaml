name: Spilled content reads back without compression
sources: [memory, lazy, archive]
fixtures:
  - path: file
    content: &content |-
      Content stored on disk.
limits: {resident_bytes: 0}
tests:
  - name: Reads return the original bytes from scratch storage
    assert:
      - {op: read, path: file, expect: {ok: *content}}
      - {op: usage, expect: {resident: 0, spilled: 23}}
