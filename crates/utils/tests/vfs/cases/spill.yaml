name: Compressed spill preserves raw file content
sources: [memory, lazy, archive]
fixtures:
  - path: large
    content: &content |
      Repeated content compresses well.
      Repeated content compresses well.
      Repeated content compresses well.
      Repeated content compresses well.
      Repeated content compresses well.
      Repeated content compresses well.
      Repeated content compresses well.
      Repeated content compresses well.
  - path: duplicate
    content: *content
  - path: small
    content: fits
limits: {resident_bytes: 4}
options: {scratch: existing, compress_spill: true}
tests:
  - name: Resident and spilled files return their complete original bytes
    assert:
      - {op: read, path: large, expect: {ok: *content}}
      - {op: read, path: duplicate, expect: {ok: *content}}
      - {op: read, path: small, expect: {ok: fits}}
      - {op: usage, expect: {files: 3, resident: 4, deduped_bytes: 272, spilled_below: 100}}
