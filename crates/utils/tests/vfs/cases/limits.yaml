- name: The byte limit includes files whose content is rejected
  sources: [memory, lazy, directory, changeset, archive]
  fixtures:
    - path: a.log
      content: a
    - path: b.log
      content: bb
  rules:
    - {phase: metadata, decision: {kind: list, value: log}}
  limits: {total_bytes: 2}
  load_error: cap:total_bytes

- name: The file limit includes rejected empty files
  sources: [memory, lazy, directory, changeset, archive]
  fixtures:
    - path: a.log
      content: ""
    - path: b.log
      content: ""
  rules:
    - {phase: metadata, decision: {kind: list, value: log}}
  limits: {files: 1}
  load_error: cap:files

- name: Oversize files remain in the tree without readable content
  sources: [memory, lazy, directory, changeset, archive]
  fixtures:
    - path: big
      content: large
  limits: {file_bytes: 4}
  tests:
    - name: An oversize file is listed and has no retained bytes
      assert:
        - {op: files, expect: [{path: big, size: 5, decision: {kind: list, value: oversize}}]}
        - {op: read, path: big, expect: {error: Unsupported}}
        - {op: usage, expect: {resident: 0, kept: 0}}

- name: Content beyond the spill budget fails loading
  sources: [memory, lazy, archive]
  fixtures:
    - path: big
      content: large
  limits: {resident_bytes: 0, spilled_bytes: 4}
  load_error: cap:spilled_bytes

- name: Cancellation stops loading the remaining files
  sources: [memory, lazy, archive]
  fixtures:
    - path: one
      content: x
    - path: two
      content: y
    - path: three
      content: z
  options: {cancel_after: 2}
  load_error: cancelled
