sources: [archive]
entries:
  - {path: big.txt, data: {text: abcdefgh, repeat: 1500}}
  - {path: logo.png, data: image}
rules:
  - {phase: header, suffix: .png, decision: {kind: list, value: excluded}}
steps:
  - {op: read, path: big.txt, expect: {ok: {text: abcdefgh, repeat: 1500}}}
  - {op: stat, path: logo.png, expect: {ok: {path: /logo.png, kind: file, len: 5, decision: {kind: list, value: excluded}}}}
  - {op: read, path: logo.png, expect: {error: Unsupported}}
