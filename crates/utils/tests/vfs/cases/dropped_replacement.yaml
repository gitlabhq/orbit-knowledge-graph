name: A dropped replacement removes the earlier file
sources: [memory, lazy, archive]
fixtures:
  - path: file
    content: first
  - path: file
    content: drop
rules:
  - {phase: content, contains: drop, decision: {kind: drop, value: content}}
tests:
  - name: The old content cannot survive a dropped replacement
    assert:
      - {op: files, expect: []}
      - {op: read, path: file, expect: {error: NotFound}}
      - {op: usage, expect: {files: 0, duplicate_paths: 1}}
