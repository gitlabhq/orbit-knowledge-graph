name: Pending content decisions settle to the default tag
sources: [memory, lazy, checkout, changed, archive]
fixtures:
  - path: file
    content: data
rules:
  - {phase: header, decision: {kind: keep, value: source}}
  - {phase: content, decision: {kind: pending}}
tests:
  - name: Pending is never exposed after content classification
    assert:
      - {op: read, path: file, expect: {ok: data}}
      - {op: files, expect: [{path: file, size: 4, decision: {kind: keep, value: input}}]}
