name: A late drop refuses reads but retains the frozen tree
sources: [checkout, changed]
fixtures:
  - path: file
    content: drop
rules:
  - {phase: header, decision: {kind: keep, value: source}}
  - {phase: content, decision: {kind: drop, value: content}}
tests:
  - name: Rejected content remains listed after loading
    assert:
      - {op: read, path: file, expect: {error: Unsupported}}
      - {op: files, expect: [{path: file, size: 4, decision: {kind: drop, value: content}}]}
      - {op: read_dir, path: /, expect: {ok: [file]}}
