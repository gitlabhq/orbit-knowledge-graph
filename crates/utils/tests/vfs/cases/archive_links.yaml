sources: [archive]
entries:
  - {path: src/file, data: content}
  - {path: alias, hardlink: root/src/file}
  - {path: chain, link: alias}
  - {path: foreign, archive_path: other/file, data: ignored}
steps:
  - {op: read, path: alias, expect: {ok: content}}
  - {op: read, path: chain, expect: {ok: content}}
  - {op: stat, path: foreign, expect: {error: NotFound}}
  - {op: usage, expect: {files: 3, kept: 7}}
