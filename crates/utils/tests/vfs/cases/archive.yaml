- name: An archive without files reports empty input
  sources: [archive]
  fixtures: []
  load_error: empty

- name: Archive paths are not limited by host filename lengths
  sources: [archive]
  fixtures:
    - path: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/file.txt
      content: long_directory
    - path: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.txt
      content: long_name
  tests:
    - name: Long directory and file names remain readable
      assert:
        - op: read
          path: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/file.txt
          expect: {ok: long_directory}
        - op: read
          path: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.txt
          expect: {ok: long_name}
        - {op: usage, expect: {files: 2}}

- name: Absolute archive paths fail loading
  sources: [archive]
  input_file: inputs/absolute.tar.gz
  load_error: InvalidData

- name: Archive traversal above the root fails loading
  sources: [archive]
  input_file: inputs/traversal.tar.gz
  load_error: InvalidData

- name: Traversal in the stripped root also fails loading
  sources: [archive]
  input_file: inputs/root-traversal.tar.gz
  load_error: InvalidData

- name: Hard links cannot escape the archive root
  sources: [archive]
  input_file: inputs/hardlink-escape.tar.gz
  load_error: InvalidData

- name: Archive links resolve inside the selected root
  sources: [archive]
  input_file: inputs/links.tar.gz
  tests:
    - name: Files and link chains return the same content
      assert:
        - {op: read, path: src/file, expect: {ok: content}}
        - {op: read, path: alias, expect: {ok: content}}
        - {op: read, path: chain, expect: {ok: content}}
    - name: Foreign roots do not contribute files
      assert:
        - {op: read, path: file, expect: {error: NotFound}}
        - {op: usage, expect: {files: 3}}

- name: PAX headers do not become files
  sources: [archive]
  input_file: inputs/pax-headers.tar.gz
  tests:
    - name: Only the regular file appears in the tree
      assert:
        - {op: read_dir, path: /, expect: {ok: [file]}}
        - {op: read, path: file, expect: {ok: content}}

- name: PAX sizes enforce the file limit
  sources: [archive]
  input_file: inputs/pax-size.tar.gz
  limits: {file_bytes: 64}
  tests:
    - name: The PAX size overrides the zero size in the file header
      assert:
        - {op: stat, path: big.txt, expect: {ok: {path: /big.txt, kind: file, len: 4096, decision: {kind: list, value: oversize}}}}
        - {op: usage, expect: {resident: 0}}
        - {op: read, path: big.txt, expect: {error: Unsupported}}

- name: Truncation before the first entry reports empty input
  sources: [archive]
  input_file: inputs/truncated.tar.gz
  load_error: empty

- name: A zero-byte archive reports empty input
  sources: [archive]
  input_file: inputs/empty.tar.gz
  load_error: empty

- name: Archive policy receives the complete body
  sources: [archive]
  input_file: inputs/complete-body.tar.gz
  rules:
    - {phase: header, suffix: .png, decision: {kind: drop, value: excluded}}
    - {phase: content, contains: "end of complete body\n", decision: {kind: keep, value: source}}
  tests:
    - name: Policy sees the end of the body and reads return every byte
      assert:
        - {op: files, expect: [{path: big.txt, size: 12021, decision: {kind: keep, value: source}}]}
        - {op: read, path: big.txt, expect: {ok: {input_file: inputs/complete-body.txt}}}
        - {op: read_dir, path: /, expect: {ok: [big.txt]}}
