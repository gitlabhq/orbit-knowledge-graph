sources: [checkout, changed]
entries:
  - {path: blob.rs, data: "x\0y"}
rules:
  - {phase: header, decision: {kind: keep, value: source}}
  - {phase: content, contains: [0], decision: {kind: list, value: binary}}
steps:
  - {op: files, expect: [{path: blob.rs, size: 3, decision: {kind: keep, value: source}}]}
  - {op: read, path: blob.rs, expect: {error: Unsupported}}
  - {op: files, expect: [{path: blob.rs, size: 3, decision: {kind: list, value: binary}}]}
  - {op: usage, expect: {resident: 0, kept: 0}}
