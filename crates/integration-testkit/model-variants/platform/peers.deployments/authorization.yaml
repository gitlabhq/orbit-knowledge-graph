kind: authorization
package: peers.deployments
entities:
  Rollout:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    properties: {open: [id, environment, release_id], hidden: [traversal_path]}
  Review:
    scope: namespace
    permission: read
    enforce: {duckdb: {scope_key: traversal_path}}
    properties: {open: [id, verdict, merge_request_id], hidden: [traversal_path]}
relationships:
  DEPLOYS: {scope: namespace, permission: read, enforce: {clickhouse: {scope_key: traversal_path, of: source}}}
  REVIEWS: {scope: namespace, permission: read, enforce: {duckdb: {scope_key: traversal_path, of: source}}}
