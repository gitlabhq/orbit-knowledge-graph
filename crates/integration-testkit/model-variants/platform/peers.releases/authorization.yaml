kind: authorization
package: peers.releases
entities:
  Release:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    properties: {open: [id, name, merge_request_id], hidden: [traversal_path]}
relationships:
  SHIPS: {scope: namespace, permission: read, enforce: {clickhouse: {scope_key: traversal_path, of: source}}}
