kind: authorization
package: peers.ranks
entities:
  GuildRank:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    properties: {open: [guild, rank, title, granted_at, tier, badge], hidden: [traversal_path]}
  RankPost:
    scope: namespace
    permission: read
    enforce: {live: {scope_key: {via: RANK_POST_OF}}}
    properties: {open: [id, guild, rank, text]}
relationships:
  RANK_OF: {scope: namespace, permission: read, enforce: {clickhouse: {scope_key: traversal_path, of: source}}}
  RANK_POST_OF: {scope: namespace, permission: read, enforce: {}}
