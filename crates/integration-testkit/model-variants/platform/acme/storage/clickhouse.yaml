kind: storage
package: acme
store: acme
engine:
  kind: clickhouse
  connection: main
  backend:
    version_column: _version
    deleted_column: _deleted
entities:
  Folder:
    complete: true
    accepts: [id]
    table: acme_folder
    columns:
      id: {immutable: true, backend: {type: Int64}}
      name: {backend: {type: String}}
      team_key: {backend: {type: String}}
    access: {order: [id]}
  Person:
    complete: true
    accepts: [id]
    table: acme_person
    columns:
      id: {immutable: true, backend: {type: Int64}}
      name: {backend: {type: String}}
    access: {order: [id]}
