name: "Swift: every Definition and Import column of the ontology contract"

fixtures:
  - path: Sources/App/Shapes.swift
    content: |
      import Foundation
      import Utils
      import XCTest
      import struct Foundation.URL

      /// A store of items.
      ///
      /// It keeps items in memory.
      public protocol Store {
          func save(_ item: String) -> Bool
      }

      /// A shape with a name.
      open class Shape: Store {
          public let id: Int = 1
          private var name: String
          fileprivate static var count = 0

          public init(name: String) {
              self.name = name
          }

          /// Saves one item.
          public func save(_ item: String) -> Bool {
              let copy = item
              return !copy.isEmpty
          }

          open override func describe(prefix: String) async throws -> String {
              return prefix
          }

          final class func make() -> Shape {
              return Shape(name: "a")
          }
      }

      struct Point {
          var x: Double
      }

      enum Direction {
          case north
          case south
      }

      extension Shape {
          func area() -> Double {
              return 0.0
          }
      }

      typealias Name = String

      let limit = 10
      var label: String = "g"

      func helper(_ n: Int) -> Bool {
          return n > 0
      }

      class Circle: Shape {
          var center: Point = Point(x: 0)

          override func save(_ item: String) -> Bool {
              return true
          }
      }

      func measure(_ s: Shape) -> Int {
          return s.id
      }

      func readLimit() -> Int {
          return limit
      }

      func callUtil() {
          util()
      }

      class ShapeTests: XCTestCase {
          func testHelper() {
              _ = helper(1)
          }
      }

  - path: Sources/Utils/Util.swift
    content: |
      public func util() {}

