name: "Python: dataclass field references"

fixtures:
  - path: main.py
    content: |
      from dataclasses import dataclass

      @dataclass
      class User:
          email: str

      @dataclass
      class Audit:
          email: str

      def greet(u: User):
          print(u.email)

tests:
  # corrected: contract: a member read without a call is USES_VALUE
  - name: "typed dataclass attribute access resolves to the field definition"
    query: |
      MATCH (caller:Definition)-[r:USES_VALUE]->(field:Definition)
      WHERE caller.fqn = 'main.greet'
        AND field.name = 'email'
      RETURN field.fqn AS field
    assert:
      - { row_count: 1 }
      - { row: { field: "main.User.email" } }
