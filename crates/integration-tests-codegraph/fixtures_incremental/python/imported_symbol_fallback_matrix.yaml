name: "Python: imported-symbol fallback matrix"
fixtures:
  - path: main.py
    content: |
      import requests
      import httpx as external_httpx
      import urllib.parse
      import xml.etree.ElementTree as ET
      from sdk.client import Client
      from sdk.helpers import run as helper_run
      from local_models import LocalClient
      from wildcard_sdk import *

      helper_run()

      def package_import_call():
          requests.get("https://example.com")
          external_httpx.post("https://example.com")
          urllib.parse.urlparse("https://example.com")
          ET.fromstring("<root/>")

      def repeated_package_calls():
          urllib.parse.urlparse("first")
          urllib.parse.urlparse("second")

      def from_import_call():
          Client()
          helper_run()

      def local_import_call():
          LocalClient()

      def wildcard_import_call():
          wildcard_func()

      def builtin_print_call():
          print("debug")

      def builtin_len_call():
          len([1, 2])

      def local_print(value):
          pass

      def shadowed_builtin_call():
          print = local_print
          print("debug")

  - path: local_models.py
    content: |
      class LocalClient:
          def ping(self):
              pass

tests:
  - name: "package, aliased, and dotted package imports target imported symbols"
    # Package imports currently retain their module name in identifier_name.
    skip: true
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'package_import_call'
      RETURN caller.fqn AS caller, sym.import_path AS path, sym.identifier_name AS name, sym.identifier_alias AS alias
      ORDER BY path
    assert:
      - { row_count: 4 }
      - { row: { caller: "main.package_import_call", path: "httpx", name: null, alias: "external_httpx" } }
      - { row: { caller: "main.package_import_call", path: "requests", name: null, alias: null } }
      - { row: { caller: "main.package_import_call", path: "urllib.parse", name: null, alias: null } }
      - { row: { caller: "main.package_import_call", path: "xml.etree.ElementTree", name: null, alias: "ET" } }

  - name: "dotted package calls produce one edge and preserve aliases"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'package_import_call'
      RETURN sym.import_path AS path, sym.identifier_alias AS alias
    assert:
      - { row_count: 4 }
      - { row: { path: "requests", alias: null } }
      - { row: { path: "httpx", alias: "external_httpx" } }
      - { row: { path: "urllib.parse", alias: null } }
      - { row: { path: "xml.etree.ElementTree", alias: "ET" } }

  - name: "separate dotted package calls retain separate edges"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'repeated_package_calls'
      RETURN sym.import_path AS path
    assert:
      - { row_count: 2 }
      - { row: { path: "urllib.parse" } }

  - name: "from imports target imported symbols"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'from_import_call'
      RETURN caller.fqn AS caller, sym.import_path AS path, sym.identifier_name AS name, sym.identifier_alias AS alias
      ORDER BY path, name
    assert:
      - { row_count: 2 }
      - { row: { caller: "main.from_import_call", path: "sdk.client", name: "Client", alias: null } }
      - { row: { caller: "main.from_import_call", path: "sdk.helpers", name: "run", alias: "helper_run" } }

  - name: "top-level imported calls target imported symbols from the file"
    query: |
      MATCH (file:File)-[e:IMPORTS]->(sym:ImportedSymbol)
      WHERE file.path = 'main.py'
        AND sym.import_path = 'sdk.helpers'
      RETURN file.path AS file, sym.import_path AS path, sym.identifier_name AS name, sym.identifier_alias AS alias
    assert:
      - { row_count: 1 }
      - { row: { file: "main.py", path: "sdk.helpers", name: "run", alias: "helper_run" } }

  - name: "locally resolved imports do not emit imported-symbol fallback"
    queries:
      - query: |
          MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
          WHERE caller.name = 'local_import_call'
            AND callee.fqn = 'local_models.LocalClient'
          RETURN caller.fqn AS caller, callee.fqn AS callee
        assert:
          - { row_count: 1 }
      - query: |
          MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
          WHERE caller.name = 'local_import_call'
          RETURN sym.import_path AS path
        assert:
          - { empty: true }

  - name: "wildcard imports target wildcard imported symbols"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'wildcard_import_call'
      RETURN caller.fqn AS caller, sym.import_path AS path, sym.identifier_name AS name, sym.import_type AS import_type
    assert:
      - { row_count: 1 }
      - { row: { caller: "main.wildcard_import_call", path: "wildcard_sdk", name: "*", import_type: "WildcardImport" } }

  - name: "built-ins do not target wildcard imports"
    skip: false
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name IN ['builtin_len_call', 'builtin_print_call']
      RETURN sym.import_path AS path
    assert:
      - { empty: true }

  - name: "Local bindings still override builtin names"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'shadowed_builtin_call'
      RETURN callee.name AS target
    assert:
      - { row_count: 1 }
      - { row: { target: local_print } }
