name: "Python: instance attribute resolution across methods"

fixtures:
  - path: main.py
    content: |
      class Database:
          def execute(self):
              pass
          def close(self):
              pass

      class Repo:
          def __init__(self):
              self.db = Database()

          def query(self):
              self.db.execute()

          def cleanup(self):
              self.db.close()

      class Decoy:
          def execute(self):
              pass

tests:
  - name: self.db.execute() resolves to Database.execute not Decoy.execute
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'query' AND callee.name = 'execute'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { caller: "main.Repo.query", callee: "main.Database.execute" } }

  - name: self.db.close() resolves to Database.close
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'cleanup' AND callee.name = 'close'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { caller: "main.Repo.cleanup", callee: "main.Database.close" } }

  - name: No cross-method leakage
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'query' AND callee.name = 'close'
      RETURN caller.fqn AS caller
    assert:
      - { empty: true }
