name: "Python: lexical binding ownership"
fixtures:
  - path: global_read/main.py
    content: |
      def first():
          pass

      def second():
          pass

      f = first

      def run():
          global f
          f()
          f = second
  - path: nonlocal/main.py
    content: |
      def first():
          pass

      def second():
          pass

      def outer():
          f = first

          def run():
              nonlocal f
              f()
              f = second
  - path: class_local/main.py
    content: |
      def first():
          pass

      def second():
          pass

      def run():
          class Local:
              first = second

          first()
  - path: before_assignment/main.py
    content: |
      def first():
          pass

      def second():
          pass

      def run():
          first()
          first = second
  - path: branch/main.py
    content: |
      def first():
          pass

      def second():
          pass

      def run(flag):
          f = first
          if flag:
              f = second
          f()
  - path: global_write/main.py
    content: |
      def first():
          pass

      def second():
          pass

      f = first

      def run():
          global f
          f = second
          f()
  - path: global_nested/main.py
    content: |
      def first():
          pass

      def second():
          pass

      f = first

      def outer():
          f = second

          def run():
              global f
              f()
tests:
  - name: "Function locals block global fallback before assignment"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'run' AND caller.file_path = 'before_assignment/main.py'
      RETURN callee.name AS target
    assert:
      - { empty: true }
  - name: "Explicit ownership and branch assignments select exact targets"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'run'
      RETURN caller.file_path AS file, callee.name AS target
    assert:
      - { row_count: 7 }
      - { row: { file: global_read/main.py, target: first } }
      - { row: { file: nonlocal/main.py, target: first } }
      - { row: { file: class_local/main.py, target: first } }
      - { row: { file: branch/main.py, target: first } }
      - { row: { file: branch/main.py, target: second } }
      - { row: { file: global_write/main.py, target: second } }
      - { row: { file: global_nested/main.py, target: first } }
