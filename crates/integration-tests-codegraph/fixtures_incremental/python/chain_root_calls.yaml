name: "Python: the call at the root of a method chain links and types the chain"

fixtures:
  - path: chain.py
    content: |
      class Item:
          def touch(self):
              pass


      class Items:
          def first(self):
              return Item()

          def count(self):
              return 0


      def make_items():
          return Items()


      async def fetch_items():
          return Items()


      class Store:
          async def load(self):
              return Items()


      def make_store():
          return Store()


      async def bind_then_call():
          x = await fetch_items()
          x.count()


      def make_list():
          return [Items()]


      async def chain_through_await():
          n = (await fetch_items()).count()


      async def chain_await_prefix():
          n = await make_store().load()


      def chain_through_subscript():
          n = make_list()[0].count()


      def chain_in_assignment():
          n = make_items().count()


      def chain_as_statement():
          make_items().first().touch()


      def chain_in_loop():
          for index in range(make_items().count()):
              pass

tests:
  - name: "the call at the root of a method chain links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chain_in_assignment", "chain_as_statement"] AND callee.name = "make_items"
      RETURN caller.name AS caller
      ORDER BY caller
    assert:
      - { row_count: 2 }
      - { column_values: { field: caller, values: ["chain_as_statement", "chain_in_assignment"] } }

  - name: "the call at the root of a method chain in a for iterable links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "chain_in_loop" AND callee.name = "make_items"
      RETURN caller.name AS caller
    assert:
      - { row_count: 1 }

  - name: "the call at the root of a chain behind an await links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chain_through_await", "chain_await_prefix"] AND callee.name IN ["fetch_items", "make_store"]
      RETURN caller.name AS caller, callee.name AS callee
      ORDER BY caller
    assert:
      - { row_count: 2 }
      - { row: { caller: chain_await_prefix, callee: make_store } }
      - { row: { caller: chain_through_await, callee: fetch_items } }

  - name: "the method after an awaited call in parentheses resolves through the awaited return type"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "chain_through_await" AND callee.name = "count"
      RETURN callee.name AS callee
    assert:
      - { row_count: 1 }

  - name: "an awaited call binds its value and types the local"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "bind_then_call"
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - { column_values: { field: callee, values: ["count", "fetch_items"] } }

  - name: "the call at the root of a chain behind a subscript links"
    # Known gap: a subscript object keeps its text form; the subscript desugar is a separate decision.
    skip: true
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "chain_through_subscript" AND callee.name = "make_list"
      RETURN callee.name AS callee
    assert:
      - { row_count: 1 }

  - name: "the methods on the chain resolve through the return type of the root call"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chain_in_assignment", "chain_as_statement"] AND callee.name <> "make_items"
      RETURN caller.name AS caller, callee.name AS callee
      ORDER BY caller, callee
    assert:
      - { row_count: 3 }
      - { row: { caller: chain_as_statement, callee: first } }
      - { row: { caller: chain_as_statement, callee: touch } }
      - { row: { caller: chain_in_assignment, callee: count } }
