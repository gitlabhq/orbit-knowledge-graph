name: "Python: the call at the root of a method chain links and types the chain"

fixtures:
  - path: chain.py
    content: |
      class Item:
          def touch(self):
              pass


      class Items:
          def first(self):
              return Item()

          def count(self):
              return 0


      def make_items():
          return Items()


      def chain_in_assignment():
          n = make_items().count()


      def chain_as_statement():
          make_items().first().touch()


      def chain_in_loop():
          for index in range(make_items().count()):
              pass

tests:
  - name: "the call at the root of a method chain links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chain_in_assignment", "chain_as_statement"] AND callee.name = "make_items"
      RETURN caller.name AS caller
      ORDER BY caller
    assert:
      - { row_count: 2 }
      - { column_values: { field: caller, values: ["chain_as_statement", "chain_in_assignment"] } }

  - name: "the call at the root of a method chain in a for iterable links"
    # Known gap on this branch: the Python for rule keeps only the body until the for rules of the loop-phi producers branch (G32) land; the chain itself is handled.
    skip: true
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "chain_in_loop" AND callee.name = "make_items"
      RETURN caller.name AS caller
    assert:
      - { row_count: 1 }

  - name: "the methods on the chain resolve through the return type of the root call"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chain_in_assignment", "chain_as_statement"] AND callee.name <> "make_items"
      RETURN caller.name AS caller, callee.name AS callee
      ORDER BY caller, callee
    assert:
      - { row_count: 3 }
      - { row: { caller: chain_as_statement, callee: first } }
      - { row: { caller: chain_as_statement, callee: touch } }
      - { row: { caller: chain_in_assignment, callee: count } }
