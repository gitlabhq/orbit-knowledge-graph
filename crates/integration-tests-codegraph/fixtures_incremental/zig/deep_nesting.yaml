name: "Zig: deeply nested code links on the worker stack"

fixtures:
  - path: src/deep.zig
    content:
      - "fn target() void {}\nfn wrap(x: u32) u32 {\nreturn x;\n}\n\npub fn insideIf(c: bool) void {\n"
      - { repeat: 10000, text: "if (c) {\n" }
      - "target();\n"
      - { repeat: 10000, text: "}\n" }
      - "}\n\npub fn nestedIf(c: bool) void {\n"
      - { repeat: 10000, text: "if (c) {\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\npub fn elseIf(c: bool) void {\nif (c) {\n"
      - { repeat: 10000, text: "} else if (c) {\n" }
      - "}\ntarget();\n}\n\npub fn nestedLoop(c: bool) void {\n"
      - { repeat: 10000, text: "while (c) {\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\npub fn nestedBlock() void {\n"
      - { repeat: 10000, text: "{\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\npub fn nestedCall() void {\n_ = wrap("
      - { repeat: 10000, text: "wrap(" }
      - "0"
      - { repeat: 10000, text: ")" }
      - ");\ntarget();\n}\n"

tests:
  - name: "each function calls its target inside or after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - column_values:
          field: caller
          values: [insideIf, nestedIf, elseIf, nestedLoop, nestedBlock, nestedCall]
