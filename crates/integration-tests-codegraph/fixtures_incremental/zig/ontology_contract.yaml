          kind: "Struct"
          language_kind: "Struct"
          category: "Type"
          scope: "top_level"
          signature: "pub const Point = struct"
          parameters: []
          return_type: null
          declared_type: null
          doc_comment: "A point in space."
          modifiers: []
          visibility: "public"
          generated_by: null
          language: "zig"

