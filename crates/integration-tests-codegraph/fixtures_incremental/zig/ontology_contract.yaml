name: "Zig: every Definition and Import column of the ontology contract"

fixtures:
  - path: src/main.zig
    content: |
      const std = @import("std");
      const util = @import("util.zig");

      /// A point in space.
      ///
      /// Points are values.
      pub const Point = struct {
          /// The x coordinate.
          x: f32,
          y: f32 = 0,

          pub fn init(x: f32) Point {
              return Point{ .x = x };
          }

          fn norm(self: Point) f32 {
              return self.x;
          }
      };

      const Color = enum { red, green };

      pub const Value = union(enum) { int: i64, float: f64 };

      pub const MAX: u32 = 10;
      var counter: u32 = 0;

      /// Adds two numbers.
      pub fn add(a: i32, b: i32) i32 {
          const sum = a + b;
          return sum;
      }

      export fn exported() void {}

      inline fn fast() void {}

      test "adds numbers" {
          _ = add(1, 2);
      }

  - path: src/util.zig
    content: |
      pub fn helper() void {}

tests:
  - name: "std is a Constant"
    query: |
      MATCH (d:Definition) WHERE d.fqn = 'std' AND d.kind = 'Constant'
      RETURN d.kind AS kind, d.language_kind AS language_kind, d.category AS category, d.scope AS scope, d.signature AS signature, d.parameters AS parameters, d.return_type AS return_type, d.declared_type AS declared_type, d.doc_comment AS doc_comment, d.modifiers AS modifiers, d.visibility AS visibility, d.generated_by AS generated_by, d.language AS language
    assert:
      - { row_count: 1 }
      - row:
          kind: "Constant"
          language_kind: "Constant"
          category: "Value"
          scope: "top_level"
          signature: "const std"
          parameters: []
          return_type: null
          declared_type: null
          doc_comment: ""
          modifiers: []
          visibility: "private"
          generated_by: null
          language: "zig"

