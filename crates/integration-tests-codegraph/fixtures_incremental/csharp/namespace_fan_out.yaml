name: "C#: a namespace used by many files links each call once"

fixtures:
  - path: Ns0/C0_0.cs
    content: |
      using Ns0;
      using Ns1;
      using Ns2;

      namespace Ns0
      {
          public class C0_0
          {
              public static void Run() {}

              public void M()
              {
                  C0_0.Run();
                  C1_0.Run();
                  C2_0.Run();
              }
          }
      }

  - path: Ns0/C0_1.cs
    content: |
      using Ns0;
      using Ns1;
      using Ns2;

      namespace Ns0
      {
          public class C0_1
          {
              public static void Run() {}

              public void M()
              {
                  C0_0.Run();
                  C1_0.Run();
                  C2_0.Run();
              }
          }
      }

  - path: Ns0/C0_2.cs
    content: |
