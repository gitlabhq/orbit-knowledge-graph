  - name: "imports carry import_kind, language_kind, fqn, and is_external"
    query: |
      MATCH (i:Import)
      WHERE i.file_path = 'src/Order.cs'
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
      ORDER BY i.import_path, i.name
    assert:
      - { row_count: 3 }
      - row: { name: "*", alias: "", import_kind: "wildcard", language_kind: "WildcardImport", import_path: "Acme.Billing.Util", fqn: null }
      - row: { name: "*", alias: "", import_kind: "wildcard", language_kind: "WildcardImport", import_path: "System", fqn: null }
      - row: { name: "StringUtils", alias: "Strings", import_kind: "symbol", language_kind: "AliasedImport", import_path: "Vendor.Text.StringUtils", fqn: "Vendor.Text.StringUtils", is_external: true }

  - name: "a type has no return type, declared type, or generator"
    query: |
      MATCH (d:Definition)
      WHERE d.fqn = 'Acme.Billing.Order' AND d.return_type IS NULL AND d.declared_type IS NULL AND d.generated_by IS NULL
      RETURN d.fqn AS fqn
    assert:
      - { row_count: 1 }

  - name: "no definition has a kind outside the closed list"
    query: |
      MATCH (d:Definition) WHERE NOT d.kind IN ['Class','Struct','Interface','Trait','Enum','TypeAlias','Function','Method','Constructor','Test','Field','Constant','Variable','EnumMember','Module','Macro'] RETURN d.fqn
    assert:
      - { empty: true }
