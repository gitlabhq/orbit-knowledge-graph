name: "C#: every Definition and Import column of the code graph contract"

fixtures:
  - path: src/Money.cs
    content: |
      namespace Acme.Billing.Util
      {
          public sealed class Money
          {
              public static Money Zero() => new Money();
          }
      }

  - path: src/Order.cs
    content: |
      using System;
      using Acme.Billing.Util;
      using Strings = Vendor.Text.StringUtils;

      namespace Acme.Billing
      {
          /// <summary>
          /// An order with lines.
          /// </summary>
          public abstract class Order : IPayable
          {
              /// <summary>Most lines per order.</summary>
              public const int MaxLines = 50;
              private readonly int count;

              public string Label { get; set; }

              public Order(int count)
              {
                  this.count = count;
              }

              public abstract void Pay();

              /// <summary>Charges the <see cref="T:Money"/>.</summary>
              public static async Task<Money> ChargeAsync(Money amount, string card)
              {
                  int Local(int x) => x;
                  return Money.Zero();
              }

              protected virtual int Size() => 0;
          }

          interface IPayable
          {
              void Pay();
          }

          public struct Point
          {
              public int X;
          }

          public record Line(string Sku, int Qty);

          enum Status
          {
              Open,
              Closed
          }

          public class OrderTest
          {
              [Fact]
              public void ChargesTheCard()
              {
                  Order.ChargeAsync(null, Strings.Trim("x"));
              }
          }
      }

tests:
  - name: "every definition in src/Money.cs carries the contract columns"
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'src/Money.cs'
      RETURN d.fqn AS fqn, d.kind AS kind, d.language_kind AS language_kind, d.category AS category, d.scope AS scope, d.signature AS signature, d.parameters AS parameters, d.return_type AS return_type, d.declared_type AS declared_type, d.doc_comment AS doc_comment, d.modifiers AS modifiers, d.visibility AS visibility, d.generated_by AS generated_by, d.language AS language
      ORDER BY d.fqn
      LIMIT 100
    assert:
      - { row_count: 2 }
      - row:
          fqn: "Acme.Billing.Util.Money"
          kind: "Class"
          language_kind: "Class"
          category: "Type"
          scope: "top_level"
          signature: "public sealed class Money"
          parameters: []
          return_type: null
          declared_type: null
          doc_comment: ""
          modifiers: ["sealed"]
          visibility: "public"
          generated_by: null
          language: "csharp"
      - row:
          fqn: "Acme.Billing.Util.Money.Zero"
          kind: "Method"
          language_kind: "Method"
          category: "Callable"
          scope: "member"
          signature: "public static Money Zero()"
          parameters: []
          return_type: "Money"
          declared_type: null
          doc_comment: ""
          modifiers: ["static"]
          visibility: "public"
          generated_by: null
          language: "csharp"

