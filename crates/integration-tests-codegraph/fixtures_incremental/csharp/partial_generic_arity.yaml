name: "C#: partial parts merge only with the same generic arity"

fixtures:
  - path: Geo/C.cs
    content: |
      namespace Geo
      {
          public partial class C
          {
              public void M2() {}
          }
          public partial class C<T>
          {
              public void M1() {}
          }
          public partial class C
          {
              public void M3() {}
          }
      }

  - path: App/Runner.cs
    content: |
      using Geo;
      namespace App
      {
          public class Runner
          {
              private C c;
              public void Run()
              {
                  c.M2();
                  c.M3();
                  c.M1();
              }
          }
          public class GenericRunner
          {
              private C<int> g;
              public void Run()
              {
                  g.M1();
                  g.M2();
                  new C<System.Collections.Generic.List<int>>().M1();
                  new C().M3();
              }
          }
      }

tests:
  - name: "Run reaches both parts of C and not the method of C<T>"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'App.Runner.Run'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 2 }
      - { row: { callee: Geo.C.M2 } }
      - { row: { callee: Geo.C.M3 } }

  - name: "GenericRunner reaches the method of C<T> through C<int> and the parts of C through C"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'App.GenericRunner.Run' AND callee.definition_type = 'Method'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 3 }
      - { row: { callee: Geo.C.M1 } }
      - { row: { callee: Geo.C.M3 } }
