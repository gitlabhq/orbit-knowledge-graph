name: "Dockerfile: each runtime instruction keeps its own span and id"

fixtures:
  - path: Dockerfile
    content: |
      FROM alpine AS a
      EXPOSE 8080 9090
      CMD ["x"]
      CMD ["x"]
      ENTRYPOINT ["a"]
      CMD echo a \
          b

tests:
  - name: "ports, commands and entrypoints span their own lines"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type IN ['Port', 'Entrypoint', 'Command']
      RETURN d.definition_type AS kind, d.name AS name, d.start_line AS start_line, d.end_line AS end_line
      ORDER BY start_line, name
    assert:
      - { row_count: 6 }
      - { row: { kind: "Port", name: "8080", start_line: 2, end_line: 2 } }
      - { row: { kind: "Port", name: "9090", start_line: 2, end_line: 2 } }
      - { row: { kind: "Command", name: '["x"]', start_line: 3, end_line: 3 } }
      - { row: { kind: "Command", name: '["x"]', start_line: 4, end_line: 4 } }
      - { row: { kind: "Entrypoint", name: '["a"]', start_line: 5, end_line: 5 } }
      - { row: { kind: "Command", name: "echo a \\\n    b", start_line: 6, end_line: 7 } }

  - name: "the stage defines every one of them once"
    query: |
      MATCH (s:Definition)-[:DEFINES]->(d:Definition)
      WHERE d.definition_type IN ['Port', 'Entrypoint', 'Command']
      RETURN s.name AS stage, d.name AS name
    assert:
      - { row_count: 6 }
