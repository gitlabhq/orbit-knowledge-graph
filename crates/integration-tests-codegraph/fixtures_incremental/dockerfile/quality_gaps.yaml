name: "Dockerfile: stage names, variable bases and own-stage copies"

fixtures:
  - path: Dockerfile
    content: |
      ARG BASE=alpine:3.19
      FROM ${BASE} AS base
      FROM base AS build
      COPY --from=build /a /b
      FROM build AS app
      COPY --from=base /c /d
      ONBUILD COPY --from=app /x /y
      FROM alpine:3.19 AS tools
      FROM later AS early
      FROM base:1 AS pinned
      FROM base@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef AS digested
      FROM x AS later

tests:
  - name: "FROM <stage> is not an image import, but an unknown, later, tagged or digested name is"
    query: |
      MATCH (i:ImportedSymbol)
      RETURN i.import_path AS image
      ORDER BY image
    assert:
      - { row_count: 5 }
      - { row: { image: "alpine" } }
      - { row: { image: "base" } }
      - { row: { image: "later" } }
      - { row: { image: "x" } }

  # A later stage is called only by the incremental engine, so `early` is left out.
  - name: "stages call the earlier stages they build on"
    query: |
      MATCH (a:Definition)-[:CALLS]->(b:Definition)
      WHERE a.definition_type = 'Class' AND b.definition_type = 'Class'
        AND a.name <> 'early'
      RETURN a.name AS from_stage, b.name AS to_stage
      ORDER BY from_stage, to_stage
    assert:
      - { row_count: 3 }
      - { row: { from_stage: "app", to_stage: "base" } }
      - { row: { from_stage: "app", to_stage: "build" } }
      - { row: { from_stage: "build", to_stage: "base" } }

  - name: "FROM ${VAR} is one call to the variable and no image"
    query: |
      MATCH (a:Definition)-[:CALLS]->(v:Definition)
      WHERE v.definition_type = 'Variable'
      RETURN a.name AS user, v.name AS variable
    assert:
      - { row_count: 1 }
      - { row: { user: "base", variable: "BASE" } }

  - name: "a tagged or digested name is an image and calls no stage"
    query: |
      MATCH (a:Definition)-[:CALLS]->(b:Definition)
      WHERE a.name IN ['pinned', 'digested']
      RETURN b.name AS callee
    assert:
      - { empty: true }

  - name: "COPY --from naming its own stage is not a call"
    query: |
      MATCH (a:Definition)-[:CALLS]->(b:Definition)
      WHERE a.fqn = b.fqn AND a.file_path = b.file_path
      RETURN a.fqn AS fqn
    assert:
      - { empty: true }
