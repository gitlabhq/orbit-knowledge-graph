name: "Kotlin operator receiver and result identities"
fixtures:
  - path: Operators.kt
    content: |
      package operators
      class Operand {
          operator fun plus(other: Operand): First = First()
      }
      class First {
          operator fun plus(other: Operand): Final = Final()
          fun display() {}
      }
      class Final { fun display() {} }
      class Other {
          operator fun plus(other: Other): Other = Other()
          fun display() {}
      }
      fun makeOperand(): Operand = Operand()
      fun fromParameter(left: Operand, right: Operand) { (left + right).display() }
      fun fromConstructor() { (Operand() + Operand()).display() }
      fun fromFactory() { (makeOperand() + Operand()).display() }
      fun leftAssociative(a: Operand, b: Operand, c: Operand) { (a + b + c).display() }

tests:
  - name: "fromParameter selects the exact operator and result owners"
    query: |
      MATCH (caller:Definition)-[edge:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'operators.fromParameter'
        AND callee.name IN ['plus', 'display']
      RETURN callee.fqn AS target
      ORDER BY target
    assert:
      - { row_count: 2 }
      - { row: { target: operators.Operand.plus } }
      - { row: { target: operators.First.display } }
  - name: "fromConstructor selects the exact operator and result owners"
    query: |
      MATCH (caller:Definition)-[edge:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'operators.fromConstructor'
        AND callee.name IN ['plus', 'display']
      RETURN callee.fqn AS target
      ORDER BY target
    assert:
      - { row_count: 2 }
      - { row: { target: operators.Operand.plus } }
      - { row: { target: operators.First.display } }
  - name: "fromFactory selects the exact operator and result owners"
    query: |
      MATCH (caller:Definition)-[edge:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'operators.fromFactory'
        AND callee.name IN ['plus', 'display']
      RETURN callee.fqn AS target
      ORDER BY target
    assert:
      - { row_count: 2 }
      - { row: { target: operators.Operand.plus } }
      - { row: { target: operators.First.display } }
  - name: "leftAssociative selects the exact operator and result owners"
    query: |
      MATCH (caller:Definition)-[edge:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'operators.leftAssociative'
        AND callee.name IN ['plus', 'display']
      RETURN callee.fqn AS target
      ORDER BY target
    assert:
      - { row_count: 3 }
      - { row: { target: operators.Operand.plus } }
      - { row: { target: operators.First.plus } }
      - { row: { target: operators.Final.display } }
