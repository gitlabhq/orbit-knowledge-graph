name: "Kotlin: every Definition and Import column of the code graph contract"

fixtures:
  - path: src/acme/billing/Order.kt
    content: |
      package acme.billing

      import acme.billing.util.Money
      import acme.billing.util.*
      import org.apache.commons.lang3.StringUtils as Strings

      /**
       * An order with lines.
       *
       * More detail.
       */
      open class Order(val id: Int, private var label: String = "x") : Payable {
          /** The line count. */
          protected var count: Int = 0
          internal val tags = mutableListOf<String>()

          constructor(id: Int) : this(id, "y")

          override fun pay() {
              val local = Money.zero()
          }

          open suspend fun charge(amount: Money, card: String): Money = Money.zero()

          companion object {
              const val MAX_LINES = 50
              fun create(): Order = Order(1)
          }
      }

      interface Payable {
          fun pay()
      }

      data class Line(val sku: String, val qty: Int)

      object Registry

      enum class Status { OPEN, CLOSED }

      typealias Lines = List<Line>

      fun String.shout(): String = this.uppercase()

      private fun helper(x: Int): Int = x

      val defaultLabel: String = "none"

      class OrderTest {
          @Test
          fun chargesTheCard() {
              Strings.trim("x")
          }
      }

  - path: src/acme/billing/util/Money.kt
    content: |
      package acme.billing.util

      class Money {
          companion object {
              fun zero(): Money = Money()
          }
      }

