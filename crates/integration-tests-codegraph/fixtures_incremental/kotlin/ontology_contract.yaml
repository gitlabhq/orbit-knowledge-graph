name: "Kotlin: every Definition and Import column of the code graph contract"

fixtures:
  - path: src/acme/billing/Order.kt
    content: |
      package acme.billing

      import acme.billing.util.Money
      import acme.billing.util.*
      import org.apache.commons.lang3.StringUtils as Strings

      /**
       * An order with lines.
       *
       * More detail.
       */
      open class Order(val id: Int, private var label: String = "x") : Payable {
          /** The line count. */
          protected var count: Int = 0
          internal val tags = mutableListOf<String>()

          constructor(id: Int) : this(id, "y")

          override fun pay() {
              val local = Money.zero()
          }

          open suspend fun charge(amount: Money, card: String): Money = Money.zero()

          companion object {
              const val MAX_LINES = 50
              fun create(): Order = Order(1)
          }
      }

      interface Payable {
          fun pay()
      }

      data class Line(val sku: String, val qty: Int)

      object Registry

      enum class Status { OPEN, CLOSED }

      typealias Lines = List<Line>

      fun String.shout(): String = this.uppercase()

      private fun helper(x: Int): Int = x

      val defaultLabel: String = "none"

      class OrderTest {
          @Test
          fun chargesTheCard() {
              Strings.trim("x")
          }
      }

  - path: src/acme/billing/util/Money.kt
    content: |
      package acme.billing.util

      class Money {
          companion object {
              fun zero(): Money = Money()
          }
      }

  - path: src/com/acme/edges/lib/Base.kt
    content: |
      package com.acme.edges.lib

      open class Base {
          val size: Int = 1

          open fun run() {}

          companion object {
              fun make(): Base = Base()
          }
      }

      interface Runner {
          fun go()
      }

      annotation class Marked

  - path: src/com/acme/edges/util/Tool.kt
    content: |
      package com.acme.edges.util

      class Tool

  - path: src/com/acme/edges/App.kt
    content: |
      package com.acme.edges

      import com.acme.edges.lib.Base
      import com.acme.edges.lib.Runner
      import com.acme.edges.lib.Marked
      import com.acme.edges.util.*
      import org.vendor.Ext

      class App : Base(), Runner {
          private val held: Base = Base()

          @Marked
          override fun go() {
              helper()
              Base.make()
              val t = Tool()
              Ext.call()
          }

          override fun run() {}

          fun helper() {}

          fun use(p: Base) {
              p.run()
          }

          fun read(p: Base): Int {
              return p.size
          }

          fun infer() {
              val c = Base()
              c.run()
          }
      }

      fun App.extra(): Int = 1

  - path: src/com/acme/edges/Uses.kt
    content: |
      package com.acme.edges

      import com.acme.edges.lib.Base
      import com.acme.edges.util.Tool

      class Uses {
          fun pick(p: Base): Tool = Tool()
      }

