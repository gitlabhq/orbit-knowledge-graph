name: "Rust: fields copied from one shared source all keep its fields"

fixtures:
  - path: main.rs
    content: |
      fn helper() {}
      fn other() {}
      fn target() {}

      #[derive(Clone, Copy)]
      struct R {
          cb: fn(),
      }

      struct P {
          p: R,
          q: R,
      }

      fn make() -> P {
          todo!()
      }

      fn nested_copy(mut a: Node) {
          a.cb = helper;
          a.x = a;
          a.y = a;
          let b = a;
          let t = b.y;
          let u = t.x;
          (u.cb)();
      }

      fn copy_cycle(mut a: Node) {
          a.x = a;
          let b = a;
          target();
      }

      fn reset_then_rebind() {
          let s = R { cb: other };
          let w = R { cb: other };
          let mut a = P { p: s, q: w };
          a = make();
          let h = R { cb: helper };
          a.p = h;
          let t = a.q;
          (t.cb)();
      }

      fn reset_q() {
          let s = R { cb: other };
          let w = R { cb: other };
          let mut a = P { p: s, q: w };
          a = make();
          let t = a.q;
          (t.cb)();
      }

      fn literal_then_rebind() {
          let s = R { cb: other };
          let mut a = P { p: s, q: s };
          let h = R { cb: helper };
          a.p = h;
          let t = a.q;
          (t.cb)();
      }

tests:
  - name: "b.y.x still has the callback of a after the copy"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(target:Definition)
      WHERE caller.name = 'nested_copy'
      RETURN target.name AS target
    assert:
      - { row_count: 1 }
      - { row: { target: helper } }

  - name: "a copy of a self-referential value ends"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(target:Definition)
      WHERE caller.name = 'copy_cycle'
      RETURN target.name AS target
    assert:
      - { row_count: 1 }
      - { row: { target: target } }

  - name: "a reset clears each field on its own, so a later rebind of a.p does not reach a.q"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(target:Definition)
      WHERE caller.name IN ['reset_then_rebind', 'reset_q']
        AND target.name IN ['helper', 'other']
      RETURN caller.name AS caller, target.name AS target
    assert:
      - { empty: true }

  - name: "a rebind of a.p after a literal leaves a.q with the callback of s"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(target:Definition)
      WHERE caller.name = 'literal_then_rebind'
        AND target.name IN ['helper', 'other']
      RETURN target.name AS target
    assert:
      - { row_count: 1 }
      - { row: { target: other } }
