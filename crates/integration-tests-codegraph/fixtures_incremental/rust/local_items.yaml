name: "Rust: local items"

fixtures:
  - path: Cargo.toml
    content: |
      [package]
      name = "rust_local_items_fixture"
      version = "0.1.0"
      edition = "2021"

  - path: src/lib.rs
    content: |
      pub fn outer() {
          fn helper() {}

          struct Local(pub usize);

          enum Choice {
              Pick(Local),
          }

          helper();
          let _local = Local(1);
          let _choice = Choice::Pick(Local(2));
      }

      pub struct Container;

      impl Container {
          pub fn method() {
              fn nested() {}
              nested();
          }
      }

      pub fn with_local_mod() {
          mod local_mod {
              pub fn nested() {}
          }
      }

tests:
  - name: "block-local definitions are retained under the enclosing function"
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'src/lib.rs'
        AND d.fqn IN [
          'outer::helper',
          'outer::Local',
          'outer::Local::0',
          'outer::Choice',
          'outer::Choice::Pick',
          'outer::Choice::Pick::0',
          'Container::method::nested'
        ]
      RETURN d.fqn AS fqn, d.language_kind AS type
    assert:
      - { row_count: 7 }
      - { row: { fqn: "outer::helper", type: "Function" } }
      - { row: { fqn: "outer::Local", type: "Struct" } }
      - { row: { fqn: "outer::Local::0", type: "Field" } }
      - { row: { fqn: "outer::Choice", type: "Enum" } }
      - { row: { fqn: "outer::Choice::Pick", type: "Variant" } }
      - { row: { fqn: "outer::Choice::Pick::0", type: "Field" } }
      - { row: { fqn: "Container::method::nested", type: "Function" } }

  - name: "local helper calls resolve to local item definitions"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'outer' AND callee.name = 'helper'
      RETURN callee.fqn AS fqn, callee.kind AS type
    assert:
      - { row_count: 1 }
      - { row: { fqn: "outer::helper", type: "Function" } }

  # corrected: contract: a call that creates an instance of a type or an enum member is INSTANTIATES
  # corrected: contract: one edge row per source, target, and kind; lines holds each use
  - name: "local tuple struct constructors resolve to the local struct"
    query: |
      MATCH (caller:Definition)-[e:INSTANTIATES]->(callee:Definition)
      WHERE caller.name = 'outer' AND callee.name = 'Local'
      RETURN callee.fqn AS fqn, callee.kind AS type
    assert:
      - { row_count: 1 }
      - { row: { fqn: "outer::Local", type: "Struct" } }

  # corrected: contract: a call that creates an instance of a type or an enum member is INSTANTIATES
  - name: "local enum variant constructors resolve to the local variant"
    query: |
      MATCH (caller:Definition)-[e:INSTANTIATES]->(callee:Definition)
      WHERE caller.name = 'outer' AND callee.name = 'Pick'
      RETURN callee.fqn AS fqn, callee.language_kind AS type
    assert:
      - { row_count: 1 }
      - { row: { fqn: "outer::Choice::Pick", type: "Variant" } }

  - name: "local items inside methods are retained and callable"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'Container::method' AND callee.name = 'nested'
      RETURN callee.fqn AS fqn, callee.kind AS type
    assert:
      - { row_count: 1 }
      - { row: { fqn: "Container::method::nested", type: "Function" } }

  - name: "function-local modules keep nested definitions"
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'src/lib.rs'
        AND d.fqn IN [
          'with_local_mod::local_mod',
          'with_local_mod::local_mod::nested'
        ]
      RETURN d.fqn AS fqn, d.kind AS type
    assert:
      - { row_count: 2 }
      - { row: { fqn: "with_local_mod::local_mod", type: "Module" } }
      - { row: { fqn: "with_local_mod::local_mod::nested", type: "Function" } }
