name: "Rust: macro expansion resolution"
fixtures:
  - path: Cargo.toml
    content: |
      [package]
      name = "rust_macro_resolution_fixture"
      version = "0.1.0"
      edition = "2021"

  - path: src/lib.rs
    content: |
      pub trait Runner {
          fn run(&self);
      }

      pub struct Service;

      impl Runner for Service {
          fn run(&self) {}
      }

      pub fn helper() {}

      fn invoke_helper() {}

      pub fn direct_function_call() {
          invoke_helper();
      }

      macro_rules! invoke_helper {
          () => {
              helper();
          };
      }

      macro_rules! invoke_method {
          ($value:expr) => {
              $value.run();
          };
      }

      fn invoke_method() {}

      pub fn same_named_function_call() {
          invoke_method();
      }

      pub fn call_macro_function() {
          invoke_helper!();
      }

      pub fn call_macro_method() {
          let service = Service;
          invoke_method!(service);
      }

tests:
  - name: "macro invocations do not expand bodies or call same-named functions"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ['call_macro_function', 'call_macro_method']
        AND callee.name IN ['helper', 'run', 'invoke_helper', 'invoke_method']
      RETURN caller.file_path AS src, callee.file_path AS tgt
    assert:
      - { empty: true }

  - name: "ordinary function calls still resolve beside macro definitions"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ['direct_function_call', 'same_named_function_call']
      RETURN caller.name AS caller, callee.name AS target, callee.definition_type AS type
    assert:
      - { row_count: 2 }
      - { row: { caller: direct_function_call, target: invoke_helper, type: Function } }
      - { row: { caller: same_named_function_call, target: invoke_method, type: Function } }
