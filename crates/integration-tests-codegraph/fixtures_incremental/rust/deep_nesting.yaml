name: "Rust: deeply nested control flow and branch values link on the worker stack"
fixtures:
  - path: Cargo.toml
    content: |
      [package]
      name = "deep_nesting"
      version = "0.1.0"
      edition = "2021"
  - path: src/lib.rs
    content:
      - "fn target() {}\n\nfn nested_if(c: bool) {\n"
      - { repeat: 10000, text: "if c {\n" }
      - "fn innermost_if() {}\n"
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\nfn branch_value(c: bool) {\nlet v = if c { 0 }"
      - { repeat: 10000, text: " else if c { 1 }" }
      - " else { 2 };\ntarget();\n}\n\nfn nested_loop() {\n"
      - { repeat: 10000, text: "loop {\n" }
      - "fn innermost_loop() {}\n"
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n"
tests:
  - name: "each function calls its target after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - { row_count: 3 }
      - column_values:
          field: caller
          values: [nested_if, branch_value, nested_loop]
  - name: "the innermost definition of each nesting belongs to its function"
    query: |
      MATCH (owner:Definition)-[:DEFINES]->(nested:Definition)
      WHERE nested.name IN ['innermost_if', 'innermost_loop']
      RETURN owner.name AS owner, nested.name AS nested
    assert:
      - { row_count: 2 }
      - { row: { owner: nested_if, nested: innermost_if } }
      - { row: { owner: nested_loop, nested: innermost_loop } }
