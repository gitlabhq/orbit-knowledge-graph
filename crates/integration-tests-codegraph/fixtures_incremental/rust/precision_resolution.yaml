name: "Rust: precision and resolution"
fixtures:
  - path: Cargo.toml
    content: |
      [package]
      name = "rust_precision_fixture"
      version = "0.1.0"
      edition = "2021"

  - path: src/lib.rs
    content: |
      pub mod dep {
          pub fn imported() {}

          pub fn helper() {}

          pub struct LocalClient;

          impl LocalClient {
              pub fn do_work(&self) {}
          }

          pub struct Service;

          pub trait Pinger {
              fn trait_ping(&self);

              fn defaulted(&self) {
                  helper();
              }
          }

          impl Pinger for Service {
              fn trait_ping(&self) {}
          }

          impl Service {
              pub fn new() -> Self {
                  Service
              }

              pub fn inherent_ping(&self) {}
          }
      }

      use crate::dep::{Pinger, Service};
      use crate::dep::LocalClient;
      use crate::dep as dep_mod;
      use external_actions;
      use external_actions as actions;
      use external_actions::do_work;
      use external_actions::renamed as renamed_work;
      use external_actions::*;
      use external_macros as macros;
      use serde_json::json;
      use top_level_actions::shared;
      use tracing::info;

      pub fn module_alias_call() {
          dep_mod::imported();
      }

      pub fn local_closure_shadowing() {
          let imported = || {};
          imported();
      }

      pub fn local_callable_shadows_external_import() {
          let info = || {};
          info();
      }

      pub fn external_only() {
          let _ = std::mem::size_of::<usize>();
      }

      pub fn external_imported_calls() {
          info!("ready");
          let _ = json!({ "ok": true });
          do_work();
          renamed_work();
      }

      pub fn imported_function_reference_only() {
          let _handler = do_work;
      }

      pub fn imported_module_constant_reference() {
          let _ = external_actions::READY;
      }

      pub fn scoped_import_user() {
          use external_actions::scoped;
          scoped();
      }

      pub fn another_scoped_import_user() {
          use other_external_actions::scoped;
          scoped();
      }

      pub fn scoped_import_out_of_scope() {
          scoped();
      }

      pub fn top_level_import_user() {
          shared();
      }

      pub fn scoped_import_shadows_top_level() {
          use other_external_actions::shared;
          shared();
      }

      pub fn wildcard_external_import_user() {
          globbed();
      }

      pub fn builtin_macro_and_std_calls() {
          println!("debug");
          let _ = format!("debug");
          let _ = vec![1, 2, 3];
          let _ = Vec::<u8>::new();
      }

      pub fn explicit_std_import_user() {
          use core::mem::align_of;
          use std::mem::size_of;

          let _ = size_of::<usize>();
          let _ = align_of::<usize>();
      }

      pub fn qualified_external_imported_calls() {
          external_actions::do_work();
          actions::renamed();
          macros::ready!();
      }

      pub fn scoped_macro_user() {
          use local_macros::report;
          report!(do_work());
          report!();
      }

      pub fn other_scoped_macro_user() {
          use other_macros::report;
          report!();
      }

      pub fn fn_pointer_from_assoc() {
          let constructor: fn() -> Service = Service::new;
          let _service = constructor();
      }

      pub fn generic_trait_bound<T: Pinger>(value: &T) {
          value.trait_ping();
      }

      pub fn trait_default_dispatch<T: Pinger>(value: &T) {
          value.defaulted();
      }

      pub fn inherent_call() {
          let service = Service::new();
          service.inherent_ping();
      }

      pub fn local_method_same_name_as_external_import() {
          let client = LocalClient;
          client.do_work();
      }

tests:
  - name: "macro references retain scope and call sites without interpreting token bodies"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name IN ['scoped_macro_user', 'other_scoped_macro_user']
      RETURN caller.name AS caller, sym.import_path AS path
    assert:
      - { row_count: 3 }
      - { row: { caller: "scoped_macro_user", path: "local_macros::report" } }
      - { row: { caller: "other_scoped_macro_user", path: "other_macros::report" } }
      - { where: { caller: scoped_macro_user, path: 'local_macros::report' }, row_count: 2 }
      - { where: { caller: other_scoped_macro_user, path: 'other_macros::report' }, row_count: 1 }
  - name: "module aliases resolve callable paths"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.name = 'module_alias_call' AND callee.name = 'imported'
      RETURN caller.file_path AS src, callee.file_path AS tgt
    assert:
      - { row_count: 1 }
      - { row: { src: 'src/lib.rs', tgt: 'src/lib.rs' } }

  - name: "local closure shadowing does not create a bogus local edge"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.name = 'local_closure_shadowing'
      RETURN callee.name AS callee
    assert:
      - { empty: true }

  - name: "external std calls do not create repo-local edges"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.name = 'external_only'
      RETURN callee.name AS callee
    assert:
      - { empty: true }

  - name: "external imported Rust calls target imported symbols"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'external_imported_calls'
      RETURN caller.name AS caller, sym.import_path AS path, sym.identifier_name AS name, sym.identifier_alias AS alias
      ORDER BY path, name, alias
    assert:
      - { row_count: 4 }
      - { row: { caller: "external_imported_calls", path: "external_actions::do_work", name: "do_work", alias: null } }
      - { row: { caller: "external_imported_calls", path: "external_actions::renamed", name: "renamed", alias: "renamed_work" } }
      - { row: { caller: "external_imported_calls", path: "serde_json::json", name: "json", alias: null } }
      - { row: { caller: "external_imported_calls", path: "tracing::info", name: "info", alias: null } }

  - name: "local callable shadowing does not target imported symbols"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'local_callable_shadows_external_import'
      RETURN sym.identifier_name AS name
    assert:
      - { empty: true }

  - name: "function-scoped imports stay local while out-of-scope calls use the wildcard"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name IN ['scoped_import_user', 'another_scoped_import_user', 'scoped_import_out_of_scope']
      RETURN caller.name AS caller, sym.import_path AS path, sym.identifier_name AS name
      ORDER BY caller
    assert:
      - { row_count: 3 }
      - { row: { caller: "scoped_import_out_of_scope", path: "external_actions", name: "*" } }
      - { row: { caller: "another_scoped_import_user", path: "other_external_actions::scoped", name: "scoped" } }
      - { row: { caller: "scoped_import_user", path: "external_actions::scoped", name: "scoped" } }

  - name: "function-scoped Rust imports shadow top-level imports with the same name"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name IN ['top_level_import_user', 'scoped_import_shadows_top_level']
      RETURN caller.name AS caller, sym.import_path AS path, sym.identifier_name AS name
      ORDER BY caller
    assert:
      - { row_count: 2 }
      - { row: { caller: "scoped_import_shadows_top_level", path: "other_external_actions::shared", name: "shared" } }
      - { row: { caller: "top_level_import_user", path: "top_level_actions::shared", name: "shared" } }

  - name: "qualified Rust external imports target imported symbols"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'qualified_external_imported_calls'
      RETURN caller.name AS caller, sym.import_path AS path, sym.identifier_name AS name, sym.identifier_alias AS alias
      ORDER BY path, alias
    assert:
      - { row_count: 3 }
      - { row: { caller: "qualified_external_imported_calls", path: "external_actions", name: "external_actions", alias: null } }
      - { row: { caller: "qualified_external_imported_calls", path: "external_actions", name: "external_actions", alias: "actions" } }
      - { row: { caller: "qualified_external_imported_calls", path: "external_macros", name: "external_macros", alias: "macros" } }

  - name: "resolved Rust aliases and local dispatch do not emit imported-symbol fallback"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name IN [
        'module_alias_call',
        'fn_pointer_from_assoc',
        'generic_trait_bound',
        'trait_default_dispatch',
        'inherent_call',
        'local_method_same_name_as_external_import'
      ]
      RETURN caller.name AS caller, sym.import_path AS path, sym.identifier_name AS name
    assert:
      - { empty: true }

  - name: "Rust built-ins and bare references do not emit imported-symbol fallback"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name IN [
        'builtin_macro_and_std_calls',
        'imported_function_reference_only',
        'imported_module_constant_reference'
      ]
      RETURN caller.name AS caller, sym.import_path AS path, sym.identifier_name AS name
    assert:
      - { empty: true }

  - name: "std calls target the std import they name"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name IN ['external_only', 'explicit_std_import_user']
      RETURN caller.name AS caller, sym.import_path AS path, sym.identifier_name AS name
    assert:
      - { row_count: 3 }
      - { row: { caller: external_only, path: 'std::mem', name: size_of } }
      - { row: { caller: explicit_std_import_user, path: 'core::mem::align_of', name: align_of } }
      - { row: { caller: explicit_std_import_user, path: 'std::mem::size_of', name: size_of } }

  - name: "a call only a wildcard import can supply targets that import"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(sym:ImportedSymbol)
      WHERE caller.name = 'wildcard_external_import_user'
      RETURN sym.import_path AS path, sym.identifier_name AS name
    assert:
      - { row_count: 1 }
      - { row: { path: external_actions, name: '*' } }

  - name: "associated functions stored in fn pointers still resolve"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.name = 'fn_pointer_from_assoc' AND callee.name = 'new'
      RETURN caller.file_path AS src, callee.fqn AS fqn, callee.definition_type AS type
    assert:
      - { row_count: 1 }
      - { row: { src: 'src/lib.rs', fqn: 'dep::Service::new', type: 'Function' } }

  - name: "generic trait-bound method calls resolve to the trait method"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.name = 'generic_trait_bound' AND callee.name = 'trait_ping'
      RETURN callee.fqn AS fqn, callee.definition_type AS type
    assert:
      - { row_count: 1 }
      - { row: { fqn: 'dep::Pinger::trait_ping', type: 'Method' } }

  - name: "generic trait-bound default calls resolve to the trait default method"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.name = 'trait_default_dispatch' AND callee.name = 'defaulted'
      RETURN callee.fqn AS fqn, callee.definition_type AS type
    assert:
      - { row_count: 1 }
      - { row: { fqn: 'dep::Pinger::defaulted', type: 'Method' } }

  - name: "trait default bodies still resolve their internal calls"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.fqn = 'dep::Pinger::defaulted' AND callee.name = 'helper'
      RETURN callee.fqn AS fqn, callee.definition_type AS type
    assert:
      - { row_count: 1 }
      - { row: { fqn: 'dep::helper', type: 'Function' } }

  - name: "inherent methods still resolve on concrete receivers"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.name = 'inherent_call' AND callee.name = 'inherent_ping'
      RETURN callee.fqn AS fqn, callee.definition_type AS type
    assert:
      - { row_count: 1 }
      - { row: { fqn: 'dep::Service::inherent_ping', type: 'Method' } }
