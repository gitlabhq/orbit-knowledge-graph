name: "Rust: AST structural fixes"
fixtures:
  - path: Cargo.toml
    content: |
      [package]
      name = "rust_ast_structural_fixes_fixture"
      version = "0.1.0"
      edition = "2021"

  - path: src/lib.rs
    content: |
      pub mod foo {
          pub struct Bar;
      }

      pub(crate) use foo::Bar;

      pub struct Widget;

      pub trait Alpha {
          fn foo(&self);
      }

      pub trait Beta {
          fn foo(&self);
      }

      impl Alpha for Widget {
          fn foo(&self) { alpha_body(); }
      }

      impl Beta for Widget {
          fn foo(&self) { beta_body(); }
      }
      fn alpha_body() {}
      fn beta_body() {}
      fn call_alpha(value: &Widget) { <Widget as Alpha>::foo(value); }
      fn call_beta(value: &Widget) { <Widget as Beta>::foo(value); }

      pub mod outer {
          pub mod middle {
              pub mod inner {
                  pub struct Deep;

                  pub fn reference() {
                      let _: super::super::super::Widget;
                      let _: super::super::super::super::super::super::Widget;
                  }
              }
          }
      }

tests:
  - name: "restricted pub(crate) use is indexed as a private use"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = 'src/lib.rs'
        AND i.import_path = 'foo::Bar'
      RETURN i.import_type AS type
    assert:
      - { row_count: 1 }
      - { row: { type: 'Use' } }

  - name: "same-named trait implementations retain distinct definition identities"
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'src/lib.rs'
        AND d.name = 'foo'
        AND d.definition_type IN ['Method', 'Function']
      RETURN d.fqn AS fqn, d.start_line AS line
    assert:
      - { row_count: 4 }
      - { row: { fqn: 'Alpha::foo' } }
      - { row: { fqn: 'Beta::foo' } }
      - { row: { fqn: 'Widget::foo', line: 18 } }
      - { row: { fqn: 'Widget::foo', line: 22 } }
  - name: "qualified calls select distinct implementation bodies despite equal method names"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(method:Definition)-[:CALLS]->(body:Definition)
      WHERE caller.name IN ['call_alpha', 'call_beta']
      RETURN caller.name AS caller, body.name AS body
    assert:
      - { row_count: 2 }
      - { row: { caller: call_alpha, body: alpha_body } }
      - { row: { caller: call_beta, body: beta_body } }

  - name: "deeply nested module items are retained despite excess super segments"
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'src/lib.rs'
        AND d.fqn = 'outer::middle::inner::Deep'
      RETURN d.name AS name
    assert:
      - { row_count: 1 }
      - { row: { name: 'Deep' } }
