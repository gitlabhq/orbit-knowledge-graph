name: "Rust: a call result joined with a constructor result types the member call"

fixtures:
  - path: src/main.rs
    content: |
      struct Foo;

      impl Foo {
          fn bar(&self) {}
      }

      struct Foo2;

      impl Foo2 {
          fn new() -> Foo2 {
              Foo2
          }

          fn bar(&self) {}
      }

      fn make() -> Foo {
          Foo
      }

      fn call_then_new(c: bool) {
          let mut x = make();
          if c {
              x = make();
          }
          x.bar();
      }

      fn branch_call_and_new(c: bool) {
          let x = if c { make() } else { Foo2::new() };
          x.bar();
      }

      fn branch_call_only(c: bool) {
          let x = if c { make() } else { make() };
          x.bar();
      }

      fn call_only() {
          let x = make();
          x.bar();
      }

      fn new_only(c: bool) {
          let x = if c { Foo2::new() } else { Foo2::new() };
          x.bar();
      }

tests:
  - name: a branch of a call result and a constructor call reaches both bar methods
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'branch_call_and_new'
      RETURN t.fqn AS callee
    assert:
      - { column_values: { field: callee, values: ["Foo2::bar", "Foo2::new", "Foo::bar", "make"] } }

  - name: a reassigned call result still types the member call
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'call_then_new'
      RETURN t.fqn AS callee
    assert:
      - { column_values: { field: callee, values: ["Foo::bar", "make"] } }

  - name: a branch of two call results still types the member call
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'branch_call_only'
      RETURN t.fqn AS callee
    assert:
      - { column_values: { field: callee, values: ["Foo::bar", "make"] } }

  - name: a call result alone still types the member call
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'call_only'
      RETURN t.fqn AS callee
    assert:
      - { column_values: { field: callee, values: ["Foo::bar", "make"] } }

  - name: a branch of two constructor calls still types the member call
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'new_only'
      RETURN t.fqn AS callee
    assert:
      - { column_values: { field: callee, values: ["Foo2::bar", "Foo2::new"] } }
