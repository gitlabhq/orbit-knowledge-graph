name: "Rust: a long chain of conditional reassignments links in linear work"

fixtures:
  - path: Cargo.toml
    content: |
      [package]
      name = "phi_chain"
      version = "0.1.0"
      edition = "2021"

  - path: src/lib.rs
    content:
      - "pub struct Node;\n\nimpl Node {\n    pub fn new() -> Node {\n        Node\n    }\n\n    pub fn next(&self) -> Node {\n        Node\n    }\n\n    pub fn visit(&self) {}\n}\n\npub fn walk(c: bool) {\n    let mut n = Node::new();\n"
      - { repeat: 1000, text: "    if c {\n        n = n.next();\n    }\n" }
      - "    n.visit();\n}\n"

tests:
  - name: "walk calls new once, next at each of the 1,000 joins, and visit after them"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'walk'
      RETURN callee.name AS callee, count(caller) AS calls
      ORDER BY callee
    assert:
      - { row_count: 3 }
      - { row: { callee: new, calls: 1 } }
      - { row: { callee: next, calls: 1000 } }
      - { row: { callee: visit, calls: 1 } }
