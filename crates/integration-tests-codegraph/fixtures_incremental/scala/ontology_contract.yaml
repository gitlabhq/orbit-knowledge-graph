name: "Scala: every Definition and Import column of the code graph contract"

fixtures:
  - path: src/acme/billing/Order.scala
    content: |
      package acme.billing

      import acme.billing.util.Money
      import acme.billing.util._
      import org.apache.commons.lang3.{StringUtils => Strings}

      /** An order with lines.
        *
        * More detail.
        */
      abstract class Order(val id: Int, label: String) extends Payable {
        /** The line count. */
        protected var count: Int = 0
        final val MaxLines = 50

        def this(id: Int) = this(id, "x")

        override def pay(): Unit = {
          val local = Money.zero()
        }

        final def charge(amount: Money, card: String): Money = Money.zero()

        def size: Int
      }

      trait Payable {
        def pay(): Unit
      }

      case class Line(sku: String, qty: Int)

      object Registry

      enum Status {
        case Open, Closed
      }

      type Lines = List[Line]

      def helper(x: Int): Int = x

      class OrderTest {
        @Test
        def chargesTheCard(): Unit = {
          Strings.trim("x")
        }
      }

  - path: src/acme/billing/util/Money.scala
    content: |
      package acme.billing.util

      class Money

      object Money {
        def zero(): Money = new Money()
      }

  - path: src/com/acme/edges/lib/Base.scala
    content: |
      package com.acme.edges.lib

      class Base {
        val size: Int = 1
        def run(): Unit = {}
      }

      object Factory {
        def make(): Base = new Base()
      }

      trait Runner {
        def go(): Unit
      }

      class Marked extends scala.annotation.StaticAnnotation

  - path: src/com/acme/edges/util/Tool.scala
    content: |
      package com.acme.edges.util

      class Tool

  - path: src/com/acme/edges/App.scala
    content: |
      package com.acme.edges

      import com.acme.edges.lib.Base
      import com.acme.edges.lib.Factory
      import com.acme.edges.lib.Runner
      import com.acme.edges.lib.Marked
      import com.acme.edges.util._
      import org.vendor.Ext

      class App extends Base with Runner {
        val held: Base = new Base()

        @Marked
        def go(): Unit = {
          helper()
          Factory.make()
          val t = new Tool()
          Ext.call()
        }

        override def run(): Unit = {}

        def helper(): Unit = {}

        def use(p: Base): Unit = {
          p.run()
        }

        def read(p: Base): Int = {
          p.size
        }

        def infer(): Unit = {
          val c = new Base()
          c.run()
        }
      }

  - path: src/com/acme/edges/Uses.scala
    content: |
      package com.acme.edges

      import com.acme.edges.lib.Base
      import com.acme.edges.lib.Marked
      import com.acme.edges.util.Tool

      @Marked
      class Uses {
        def pick(p: Base): Tool = new Tool()
      }

