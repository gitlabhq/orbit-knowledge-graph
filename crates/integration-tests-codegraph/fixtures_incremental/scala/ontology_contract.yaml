  - name: "imports carry import_kind, language_kind, fqn, and is_external"
    query: |
      MATCH (i:Import)
      WHERE i.file_path = 'src/acme/billing/Order.scala'
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
      ORDER BY i.import_path, i.name
    assert:
      - { row_count: 3 }
      - row: { name: "*", alias: "", import_kind: "wildcard", language_kind: "WildcardImport", import_path: "acme.billing.util", fqn: null }
      - row: { name: "Money", alias: "", import_kind: "symbol", language_kind: "Import", import_path: "acme.billing.util", fqn: "acme.billing.util.Money", is_external: false }
