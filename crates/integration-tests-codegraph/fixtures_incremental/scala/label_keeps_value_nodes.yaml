name: "Scala: a value label keeps the calls inside its expression"

fixtures:
  - path: Shapes.scala
    content: |
      class Shapes {
        def f(): Int = 1
        def g(): Shapes = this
        def sum(): Unit = { val x = this.f() + f() }
        def cond(): Unit = { val w = if (true) f() else 0 }
        def mul(): Unit = { var x = 0; x = f() * 2 }
        def cast(): Unit = { val o = g().asInstanceOf[Any] }
        def chain(): Unit = { val y = g().g() }
      }

tests:
  - name: "a call inside a sum, conditional, assignment, cast or chain root links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["sum", "cond", "mul", "cast", "chain"]
      RETURN caller.name AS caller, callee.name AS callee, count(caller) AS n
      ORDER BY caller, callee
    assert:
      - { row_count: 5 }
      - { row: { caller: sum, callee: f } }
      - { row: { caller: cond, callee: f } }
      - { row: { caller: mul, callee: f } }
      - { row: { caller: cast, callee: g } }
      - { row: { caller: chain, callee: g } }
