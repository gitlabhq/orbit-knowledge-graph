name: "Scala: a parenless def read links to the def"

fixtures:
  - path: Tree.scala
    content: |
      class Tree(val value: Int, var child: Tree) {
        def right: Tree = child
        def size(): Int = 1
      }

      object Walk {
        def transform(t: Tree): Int = {
          val r = t.right
          val s = t.size()
          r.value + s
        }

        def chain(t: Tree): Int = t.right.size()
      }

tests:
  # corrected: contract: a callable that belongs to a type is kind Method
  - name: a parenless def read on the right-hand side links to the def
    # Known gap: Scala evaluates a parenless def by a call, but the export writes a bare member read as USES_VALUE.
    skip: true
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'transform' AND t.name = 'right'
      RETURN t.fqn AS callee, t.language_kind AS language_kind
    assert:
      - { row_count: 1 }
      - { row: { callee: "Tree.right", language_kind: "Method" } }

  - name: a parenless def read as a chain object links to the def
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'chain' AND t.name = 'right'
      RETURN t.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "Tree.right" } }

  - name: a call with parentheses still links to the def
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'transform' AND t.name = 'size'
      RETURN t.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "Tree.size" } }
