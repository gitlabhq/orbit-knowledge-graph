name: "Scala: two mixed-in traits emit every candidate"
fixtures:
  - path: Shapes.scala
    content: |
      trait A { def m(): Unit = () }
      trait B { def m(): Unit = () }
      class D extends A with B
      object Use {
        def run(): Unit = {
          val d = new D()
          d.m()
        }
      }

tests:
  - name: "d.m() on a D emits both mixed-in traits' m"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'run' AND callee.name = 'm'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 2 }
      - { row: { callee: "A.m" } }
      - { row: { callee: "B.m" } }
