name: "Ruby: two included modules emit every candidate"
fixtures:
  - path: app/models/thing.rb
    content: |
      module Alpha
        def m
        end
      end

      module Beta
        def m
        end
      end

      class Thing
        include Alpha
        include Beta

        def use
          m
        end
      end

tests:
  - name: "an implicit-self call emits both included modules' m"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'Thing::use' AND callee.name = 'm'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 2 }
      - { row: { callee: "Alpha::m" } }
      - { row: { callee: "Beta::m" } }
