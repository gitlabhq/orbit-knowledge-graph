name: "Ruby: deeply nested control flow links on the worker stack"

fixtures:
  - path: main.rb
    content:
      - "def target\nend\n\ndef nested_if(c)\n"
      - { repeat: 10000, text: "if c\n" }
      - { repeat: 10000, text: "end\n" }
      - "target\nend\n\ndef else_if(c)\nif c\n"
      - { repeat: 10000, text: "elsif c\n" }
      - "end\ntarget\nend\n"

tests:
  - name: "each method calls its target after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - { row_count: 2 }
      - column_values:
          field: caller
          values: [nested_if, else_if]
