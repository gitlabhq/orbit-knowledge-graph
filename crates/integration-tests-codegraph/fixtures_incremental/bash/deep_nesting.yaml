name: "Bash: deeply nested code links on the worker stack"

fixtures:
  - path: deep.sh
    content:
      - "target() {\n  :\n}\n\ninside_if() {\n"
      - { repeat: 10000, text: "if true; then\n" }
      - "target\n"
      - { repeat: 10000, text: "fi\n" }
      - "}\n\nnested_if() {\n"
      - { repeat: 10000, text: "if true; then\n" }
      - ":\n"
      - { repeat: 10000, text: "fi\n" }
      - "target\n}\n\nelse_if() {\nif true; then\n:\n"
      - { repeat: 10000, text: "elif true; then\n:\n" }
      - "fi\ntarget\n}\n\nnested_loop() {\n"
      - { repeat: 10000, text: "while true; do\n" }
      - ":\n"
      - { repeat: 10000, text: "done\n" }
      - "target\n}\n\nnested_group() {\n"
      - { repeat: 10000, text: "{\n" }
      - ":\n"
      - { repeat: 10000, text: "}\n" }
      - "target\n}\n"

tests:
  - name: "each function calls its target inside or after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - column_values:
          field: caller
          values: [inside_if, nested_if, else_if, nested_loop, nested_group]
