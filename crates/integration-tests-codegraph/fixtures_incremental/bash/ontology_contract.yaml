name: "Bash: the code graph contract columns for every definition and import kind"

fixtures:
  - path: main.sh
    content: |
      #!/bin/bash
      source ./lib/helpers.sh
      . /etc/profile

      # Prints a greeting.
      #
      # Second paragraph.
      greet() {
        echo "hi $1"
        helper_fn
      }

      function deploy {
        inner() {
          echo in
        }
        inner
        greet
      }

      deploy

  - path: lib/helpers.sh
    content: |
      helper_fn() {
        echo ok
      }

tests:
  - name: "every definition is a function with its category and scope"
    query: |
      MATCH (d:Definition)
      RETURN d.fqn AS fqn, d.kind AS kind, d.language_kind AS language_kind, d.category AS category, d.scope AS scope
      ORDER BY fqn
      LIMIT 100
    assert:
      - { row_count: 4 }
      - { row: { fqn: "main.greet", kind: "Function", language_kind: "Function", category: "Callable", scope: "top_level" } }
      - { row: { fqn: "main.deploy", kind: "Function", language_kind: "Function", category: "Callable", scope: "top_level" } }
      - { row: { fqn: "main.deploy.inner", kind: "Function", language_kind: "Function", category: "Callable", scope: "local" } }
      - { row: { fqn: "helpers.helper_fn", kind: "Function", language_kind: "Function", category: "Callable", scope: "top_level" } }

  - name: "definitions carry signature and doc comment"
    query: |
      MATCH (d:Definition)
      RETURN d.fqn AS fqn, d.signature AS signature, d.parameters AS parameters, d.doc_comment AS doc_comment, d.modifiers AS modifiers, d.language AS language
      ORDER BY fqn
      LIMIT 100
    assert:
      - { row: { fqn: "main.greet", signature: "greet()", parameters: [], doc_comment: "Prints a greeting.", modifiers: [], language: "bash" } }
      - { row: { fqn: "main.deploy", signature: "function deploy", parameters: [], doc_comment: "" } }
      - { row: { fqn: "main.deploy.inner", signature: "inner()" } }
      - { row: { fqn: "helpers.helper_fn", signature: "helper_fn()" } }

  - name: "Bash declares no types, visibility, or generated definitions"
    query: |
      MATCH (d:Definition)
      WHERE NOT (d.return_type IS NULL AND d.declared_type IS NULL AND d.visibility IS NULL AND d.generated_by IS NULL)
      RETURN d.fqn
    assert:
      - { empty: true }

  - name: "a sourced script is a wildcard import"
    query: |
      MATCH (i:Import)
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
      ORDER BY import_path, name
      LIMIT 100
    assert:
      - { row_count: 2 }
      - { row: { name: "*", import_kind: "wildcard", language_kind: "Source", import_path: "./lib/helpers.sh", fqn: null, is_external: false } }
      - { row: { name: "*", import_kind: "wildcard", language_kind: "Source", import_path: "/etc/profile", fqn: null } }

  - name: "every kind is in the closed list"
    query: |
      MATCH (d:Definition) WHERE NOT d.kind IN ['Class','Struct','Interface','Trait','Enum','TypeAlias','Function','Method','Constructor','Test','Field','Constant','Variable','EnumMember','Module','Macro']
      RETURN d.fqn
    assert:
      - { empty: true }

  - name: "A call to a function in the same script is CALLS with resolution local"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'main.deploy' AND e.resolution = 'local'
      RETURN b.fqn AS callee
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - { column_values: { field: callee, values: ["main.deploy.inner", "main.greet"] } }

  - name: "A call to a function of a sourced script is CALLS with resolution wildcard_import"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'main.greet' AND e.resolution = 'wildcard_import'
      RETURN b.fqn AS callee, b.file_path AS file
    assert:
      - { row_count: 1 }
      - { row: { callee: "helpers.helper_fn", file: "lib/helpers.sh" } }

  - name: "A top-level call in a script is a CALLS from the file with resolution local"
    query: |
      MATCH (f:File)-[e:CALLS]->(b:Definition)
      WHERE f.path = 'main.sh' AND e.resolution = 'local'
      RETURN b.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "main.deploy" } }

  - name: "A sourced script import RESOLVES_TO its functions with resolution wildcard_import"
    query: |
      MATCH (i:Import)-[e:RESOLVES_TO]->(d:Definition)
      WHERE i.import_path = './lib/helpers.sh' AND e.resolution = 'wildcard_import'
      RETURN d.fqn AS target
    assert:
      - { row_count: 1 }
      - { row: { target: "helpers.helper_fn" } }

  - name: "A sourced script import RESOLVES_TO the file with resolution import"
    query: |
      MATCH (i:Import)-[e:RESOLVES_TO]->(f:File)
      WHERE i.import_path = './lib/helpers.sh' AND e.resolution = 'import'
      RETURN f.path AS target
    assert:
      - { row_count: 1 }
      - { row: { target: "lib/helpers.sh" } }

  - name: "A script that sources another script DEPENDS_ON it"
    query: |
      MATCH (a:File)-[e:DEPENDS_ON]->(b:File)
      WHERE a.path = 'main.sh'
      RETURN b.path AS target
    assert:
      - { row_count: 1 }
      - { row: { target: "lib/helpers.sh" } }

  - name: "Bash has no types, classes, or annotations, so it has no type or annotation edges"
    query: |
      MATCH (a:Definition)-[e:INSTANTIATES|USES_TYPE|EXTENDS|IMPLEMENTS|OVERRIDES|ANNOTATED_BY]->(b:Definition)
      RETURN a.fqn AS source, b.fqn AS target
      LIMIT 100
    assert:
      - { empty: true }
