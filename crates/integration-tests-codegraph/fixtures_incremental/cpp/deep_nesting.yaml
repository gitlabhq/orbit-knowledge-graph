name: "C++: deeply nested code links on the worker stack"

fixtures:
  - path: deep.cpp
    content:
      - "void target() {}\nint wrap(int x) { return x; }\n\nvoid inside_if(int c) {\n"
      - { repeat: 10000, text: "if (c) {\n" }
      - "target();\n"
      - { repeat: 10000, text: "}\n" }
      - "}\n\nvoid nested_if(int c) {\n"
      - { repeat: 10000, text: "if (c) {\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\nvoid else_if(int c) {\nif (c) {\n"
      - { repeat: 10000, text: "} else if (c) {\n" }
      - "}\ntarget();\n}\n\nvoid nested_loop(int c) {\n"
      - { repeat: 10000, text: "while (c) {\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\nvoid nested_block() {\n"
      - { repeat: 10000, text: "{\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\nvoid nested_call() {\nwrap("
      - { repeat: 10000, text: "wrap(" }
      - "0"
      - { repeat: 10000, text: ")" }
      - ");\ntarget();\n}\n"
      - "\nvoid nested_try() {\n"
      - { repeat: 10000, text: "try {\n" }
      - { repeat: 10000, text: "} catch (...) {}\n" }
      - "target();\n}\n"

tests:
  - name: "each function calls its target inside or after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - column_values:
          field: caller
          values: [inside_if, nested_if, else_if, nested_loop, nested_call, nested_try]

  - name: "nested_block calls its target after the nesting"
    # Known gap: in C++, a call after ten or more nested bare blocks does not link, on main too.
    skip: true
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'nested_block' AND callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - { row_count: 1 }
