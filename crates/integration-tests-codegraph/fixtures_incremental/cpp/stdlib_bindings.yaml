name: C++ standard function names retain project bindings
fixtures:
  - path: local.hpp
    content: |
      int printf(const char *text) { return 1; }
  - path: main.cpp
    content: |
      #include "local.hpp"
      int run() { return printf("local"); }
  - path: external.cpp
    content: |
      #include <cstdio>
      void external_call() { printf("standard"); }
tests:
  - name: Local include resolves a standard-named function
    query: |
      MATCH (caller:Definition)-[:CALLS]->(target:Definition)
      WHERE caller.name = 'run'
      RETURN target.file_path AS file, target.name AS name
    assert:
      - { row_count: 1 }
      - { row: { file: local.hpp, name: printf } }
  - name: Standard calls do not become wildcard fallback calls
    query: |
      MATCH (caller:Definition)-[:CALLS]->(target:ImportedSymbol)
      WHERE caller.name = 'external_call'
      RETURN target.import_path
    assert:
      - { empty: true }
