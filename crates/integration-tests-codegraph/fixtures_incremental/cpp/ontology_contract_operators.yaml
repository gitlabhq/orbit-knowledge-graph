name: "C++: operator names with angle brackets keep the signature before the body"

fixtures:
  - path: point.cpp
    content: |
      struct Point {
          int x;
          bool operator<(const Point& other) const { return x < other.x; }
          bool operator<=(const Point& other) const { return x <= other.x; }
      };

tests:
  - name: "the comparison operator signature stops before the body"
    query: |
      MATCH (d:Definition) WHERE d.name = 'operator<'
      RETURN d.signature AS signature, d.parameters AS parameters
    assert:
      - { row: { signature: "bool operator<(const Point& other) const", parameters: ["const Point& other"] } }

  - name: "the less-or-equal operator signature stops before the body"
    query: |
      MATCH (d:Definition) WHERE d.name STARTS WITH 'operator<='
      RETURN d.signature AS signature, d.parameters AS parameters
    assert:
      - { row: { signature: "bool operator<=(const Point& other) const", parameters: ["const Point& other"] } }
