name: "C++: the call at the root of a method chain links and types the chain"

fixtures:
  - path: chain.cpp
    content: |
      struct Item {
          void touch() {}
      };

      struct Items {
          Item first() { return Item(); }
          int count() { return 0; }
      };

      struct Other {
          int count() { return 1; }
      };

      namespace ns {
      namespace detail {
      Other make(Items x) { return Other(); }
      Items build_items() { return Items(); }
      namespace deep {
      Items build_deep() { return Items(); }
      }
      }
      }

      void deep_qualified_root() {
          ns::detail::deep::build_deep().count();
      }

      struct Box {
          template <class T>
          T get() { return T(); }
      };

      Items (*fp)() = nullptr;

      Other (*fp_other)(Items) = nullptr;

      void qualified_root() {
          ns::detail::build_items().count();
      }

      void template_method_root() {
          Box box;
          box.get<Items>().count();
      }

      void pointer_root() {
          (*fp)().count();
      }

      void pointer_root_with_argument() {
          (*fp_other)(get_items()).count();
      }

      template <class T>
      Items make_items_of(T x) { return Items(); }

      void specialized_root() {
          make_items_of<int>(1).count();
      }

      Items get_items() { return Items(); }

      Items make_items() { return Items(); }

      Items* make_items_ptr() { return nullptr; }

      void chain_in_decl() {
          int n = make_items().count();
      }

      void chain_as_statement() {
          make_items().first().touch();
      }

      void chain_through_pointer() {
          make_items_ptr()->first().touch();
      }

      void lifted_root() {
          ns::detail::make(get_items()).count();
      }

      void chain_in_loop() {
          for (int i = 0; i < make_items().count(); i++) {
          }
      }

tests:
  - name: "the call at the root of a method chain links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chain_in_decl", "chain_as_statement", "chain_through_pointer"]
        AND callee.name IN ["make_items", "make_items_ptr"]
      RETURN caller.name AS caller, callee.name AS callee
      ORDER BY caller, callee
    assert:
      - { row_count: 3 }
      - { row: { caller: chain_as_statement, callee: make_items } }
      - { row: { caller: chain_in_decl, callee: make_items } }
      - { row: { caller: chain_through_pointer, callee: make_items_ptr } }

  - name: "the methods on the chain resolve through the return type of the root call"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chain_in_decl", "chain_as_statement"] AND callee.name IN ["first", "count", "touch"]
      RETURN caller.name AS caller, callee.name AS callee
      ORDER BY caller, callee
    assert:
      - { row_count: 3 }
      - { row: { caller: chain_as_statement, callee: first } }
      - { row: { caller: chain_as_statement, callee: touch } }
      - { row: { caller: chain_in_decl, callee: count } }

  - name: "the methods on a chain through a pointer-returning root call resolve"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "chain_through_pointer" AND callee.name IN ["first", "touch"]
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - { column_values: { field: callee, values: ["first", "touch"] } }

  - name: "a two-level qualified root call types its member through its own return type"
    query: |
      MATCH (owner:Definition)-[:DEFINES]->(callee:Definition)<-[:CALLS]-(caller:Definition)
      WHERE caller.name = "lifted_root" AND callee.name = "count"
      RETURN owner.name AS owner
    assert:
      - { row_count: 1 }
      - { row: { owner: Other } }

  - name: "a two-level qualified root call links the function and types its member"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "qualified_root"
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - { column_values: { field: callee, values: ["build_items", "count"] } }

  - name: "a three-level qualified root call links the function and types its member"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "deep_qualified_root"
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - { column_values: { field: callee, values: ["build_deep", "count"] } }

  - name: "a template method root call links by its name"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "template_method_root" AND callee.name = "get"
      RETURN callee.name AS callee
    assert:
      - { row_count: 1 }

  - name: "a call through a function pointer does not lift its argument to the chain root"
    query: |
      MATCH (owner:Definition)-[:DEFINES]->(callee:Definition)<-[:CALLS]-(caller:Definition)
      WHERE caller.name IN ["pointer_root", "pointer_root_with_argument"] AND callee.name = "count"
      RETURN owner.name AS owner
    assert:
      - { empty: true }
      - { not: true, row: { owner: Items } }

  - name: "an explicit specialization call reaches its template"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "specialized_root" AND callee.name = "make_items_of"
      RETURN callee.name AS callee
    assert:
      - { row_count: 1 }

  - name: "the call at the root of a chain in a for condition links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "chain_in_loop" AND callee.name IN ["make_items", "count"]
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - { column_values: { field: callee, values: ["count", "make_items"] } }
