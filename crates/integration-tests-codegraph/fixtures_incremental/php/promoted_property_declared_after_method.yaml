name: "PHP: a promoted property declared after the method of its name"

fixtures:
  - path: Box.php
    content: |
      <?php

      class Other
      {
          public function b(): void {}
      }

      class Box
      {
          public function x(): Box
          {
              return $this;
          }

          public function __construct(protected Other $x)
          {
          }

          public function read(): void
          {
              $this->x->b();
          }

          public function call(): Box
          {
              return $this->x();
          }
      }

tests:
  - name: a read on this of the shared name types by the promoted property declared after the method
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'read' AND t.name = 'b'
      RETURN t.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "Other\\b" } }

  - name: a call on this of the shared name targets the method declared before the promoted property
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'call' AND t.name = 'x'
      RETURN t.fqn AS callee, t.kind AS kind
    assert:
      - { row_count: 1 }
      - { row: { callee: "Box\\x", kind: "Method" } }
