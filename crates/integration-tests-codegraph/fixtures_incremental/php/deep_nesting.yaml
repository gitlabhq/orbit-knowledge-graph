name: "PHP: deeply nested code links on the worker stack"

fixtures:
  - path: src/deep.php
    content:
      - "<?php\n\nfunction target() {}\nfunction wrap($x) { return $x; }\n\nfunction insideIf($c) {\n"
      - { repeat: 10000, text: "if ($c) {\n" }
      - "target();\n"
      - { repeat: 10000, text: "}\n" }
      - "}\n\nfunction nestedIf($c) {\n"
      - { repeat: 10000, text: "if ($c) {\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\nfunction elseIf($c) {\nif ($c) {\n"
      - { repeat: 10000, text: "} elseif ($c) {\n" }
      - "}\ntarget();\n}\n\nfunction nestedLoop($c) {\n"
      - { repeat: 10000, text: "while ($c) {\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\nfunction nestedTry() {\n"
      - { repeat: 10000, text: "try {\n" }
      - { repeat: 10000, text: "} catch (Exception $e) {}\n" }
      - "target();\n}\n\nfunction nestedBlock() {\n"
      - { repeat: 10000, text: "{\n" }
      - { repeat: 10000, text: "}\n" }
      - "target();\n}\n\nfunction nestedCall() {\nwrap("
      - { repeat: 10000, text: "wrap(" }
      - "0"
      - { repeat: 10000, text: ")" }
      - ");\ntarget();\n}\n"

tests:
  - name: "each function calls its target inside or after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - column_values:
          field: caller
          values: [insideIf, nestedIf, nestedLoop, nestedTry, nestedBlock, nestedCall]

  - name: "elseIf calls its target after the nesting"
    # Known gap: in PHP, a call after fifty or more elseif branches does not link, on main too.
    skip: true
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'elseIf' AND callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - { row_count: 1 }
