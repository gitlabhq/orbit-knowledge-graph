  - name: "An aliased use of a vendor class is an external symbol import"
    query: |
      MATCH (i:Import) WHERE i.import_path = 'Vendor\Lib\Thing' AND i.name = 'Thing'
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
    assert:
      - { row_count: 1 }
      - row:
          name: "Thing"
          alias: "VendorThing"
          import_kind: "symbol"
          language_kind: "AliasedImport"
          import_path: "Vendor\\Lib\\Thing"
          fqn: "Vendor\\Lib\\Thing"
          is_external: true

