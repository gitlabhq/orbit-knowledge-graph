  # corrected: convention: a plain import has language_kind NamedImport
  - name: "A use of a class in the project is a symbol import"
    query: |
      MATCH (i:Import) WHERE i.import_path = 'App\Support\Helper' AND i.name = 'Helper' AND i.file_path = 'src/Models/Shape.php'
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
    assert:
      - { row_count: 1 }
      - row:
          name: "Helper"
          alias: ""
          import_kind: "symbol"
          language_kind: "NamedImport"
          import_path: "App\\Support\\Helper"
          fqn: "App\\Support\\Helper"
          is_external: false

