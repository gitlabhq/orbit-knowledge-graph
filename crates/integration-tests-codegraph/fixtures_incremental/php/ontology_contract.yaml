name: "PHP: every Definition and Import column of the ontology contract"

fixtures:
  - path: src/Models/Shape.php
    content: |
      <?php
      namespace App\Models;

      use App\Support\Helper;
      use Vendor\Lib\Thing as VendorThing;
      use App\Support\{Formatter};

      const VERSION = '1.0';

      /**
       * A shape with an area.
       *
       * Shapes are immutable.
       */
      abstract class Shape implements HasArea
      {
          use Loggable;

          public const MAX = 10;
          protected static int $count = 0;
          public $loose;

          public function __construct(private readonly int $id)
          {
          }

          /** Computes the area. */
          abstract public function area(): float;

          final public static function make(int ...$ids): static
          {
              $helper = new Helper();
              return new static(1);
          }

          protected function describe()
          {
              return Helper::fmt($this->id);
          }
      }

      interface HasArea
      {
          public function area(): float;
      }

      trait Loggable
      {
          public function log(string $msg): void {}
      }

      enum Suit: string
      {
          case Hearts = 'H';
      }

      /** Adds two numbers. */
      function add(int $a, $b = 2): int
      {
          return $a + $b;
      }

  - path: src/Models/Circle.php
    content: |
      <?php
      namespace App\Models;

      use App\Support\Helper;
      use App\Support\Formatter;

      #[Tracked]
      final class Circle extends Base implements HasArea
      {
          private Helper $helper;

          public const RATIO = 3;

          public function area(): float
          {
              $this->helper = new Helper();
              $f = new Formatter();
              Helper::fmt($f);
              return self::RATIO * $this->radius() * VERSION;
          }

          private function radius(): float
          {
              return 1.0;
          }

          public function compare(Shape $other): int
          {
              return $other->loose;
          }
      }

      class Base
      {
          public function area(): float
          {
              return 0.0;
          }
      }

      #[\Attribute]
      class Tracked {}

  - path: src/Support/Helper.php
    content: |
      <?php
      namespace App\Support;

      class Helper
      {
          public static function fmt($x) { return $x; }
      }

  - path: src/Support/Formatter.php
    content: |
      <?php
      namespace App\Support;

      class Formatter {}

  - path: tests/ShapeTest.php
    content: |
      <?php
      namespace Tests;

      use App\Support\Helper;

      class ShapeTest extends TestCase
      {
          public function testFormat(): void
          {
              Helper::fmt(1);
          }

          /** @test */
          public function itFormats(): void {}

          public function setUp(): void {}
      }

  - path: src/Models/Uses.php
    content: |
      <?php
      namespace App\Models;

      use App\Support\Helper;
      use App\Support\Formatter;

      class Uses
      {
          public function pick(Helper $h, $x): Formatter
          {
              if ($x instanceof Shape) {
                  return new Formatter();
              }
              return new Formatter();
          }
      }

