name: "Java: the selector keeps what it cannot rule out and drops only what is provably less specific"

fixtures:
  - path: p/Rules.java
    content: |
      package p;

      class Foo {}
      class Widget {}
      class IO {}

      class Rules {
        void obj(Object o) {}
        void obj(Foo f) {}
        void spec(Foo f) {}
        void spec(Object o) {}
        void tv(IO x) {}
        void tv(Foo x) {}
        void b(Foo f) {}
        void b(Object... o) {}
        void c(IO x) {}
        void c(int x) {}
        void num(Number n) {}
        void num(Object o) {}

        void objectArgument(Object o) { obj(o); }
        void unrelatedArgument(Widget w) { spec(w); }
        void exactArgument(Foo f) { spec(f); }
        void shortClassName(IO io) { tv(io); }
        void varargsCarry(Widget w) { b(w); }
        void boxedCarry(Integer i) { c(i); }
        void charIsNotNumber(char ch) { num(ch); }
        void characterIsNotNumber(Character ch) { num(ch); }
        void integerIsNumber(Integer i) { num(i); }
      }

tests:
  - name: an Object argument reaches only the Object overload
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'objectArgument' AND t.name = 'obj'
      RETURN t.signature AS signature
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Object)" } }

  - name: an unrelated class keeps the Object overload next to the specific one
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'unrelatedArgument' AND t.name = 'spec'
      RETURN t.signature AS signature
    assert:
      - { row_count: 2 }
      - { row: { signature: "(Foo)" } }
      - { row: { signature: "(Object)" } }

  - name: an exact argument still picks the most specific overload
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'exactArgument' AND t.name = 'spec'
      RETURN t.signature AS signature
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Foo)" } }

  - name: a two-letter class name keeps its exact overload
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'shortClassName' AND t.name = 'tv'
      RETURN t.signature AS signature
    assert:
      - { row: { signature: "(IO)" } }

  - name: a possible-only phase is kept next to a later certain one
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name IN ['varargsCarry', 'boxedCarry'] AND t.name IN ['b', 'c']
      RETURN c.name AS caller, t.signature AS signature
    assert:
      - { row_count: 4 }
      - { row: { caller: "varargsCarry", signature: "(Foo)" } }
      - { row: { caller: "varargsCarry", signature: "(Object...)" } }
      - { row: { caller: "boxedCarry", signature: "(IO)" } }
      - { row: { caller: "boxedCarry", signature: "(int)" } }

  - name: char and Character are not a Number
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name IN ['charIsNotNumber', 'characterIsNotNumber', 'integerIsNumber'] AND t.name = 'num'
      RETURN c.name AS caller, t.signature AS signature
    assert:
      - { row_count: 3 }
      - { row: { caller: "charIsNotNumber", signature: "(Object)" } }
      - { row: { caller: "characterIsNotNumber", signature: "(Object)" } }
      - { row: { caller: "integerIsNumber", signature: "(Number)" } }
