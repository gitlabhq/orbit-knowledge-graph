        void f(int a, String b) {}
        void call33() { f(null); }
        void make33() { f(1, "s"); }
      }

tests:
  - name: 32 viable overloads for null all stay viable
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'call32' AND t.name = 'f'
      RETURN t.signature AS signature
      LIMIT 100
    assert:
      - { row_count: 32 }

  - name: 33 viable overloads for null keep the original edges
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'call33' AND t.name = 'f'
      RETURN count(t) AS n
    assert:
      - { row: { n: 1 } }

  - name: a call with a different arity still narrows to one overload past the cap
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'make33' AND t.name = 'f'
      RETURN t.signature AS signature
    assert:
      - { row_count: 1 }
      - { row: { signature: "(int, String)" } }
