name: "Java v1 parity — imported symbol resolution"
fixtures:
  - path: com/example/app/Main.java
    content: |
      package com.example.app;
      import java.util.ArrayList;
      import java.util.List;
      public class Main extends Application {
          public void main() {
              var list = new ArrayList<String>();
              var list2 = List.of("a", "b", "c");
          }
      }
  - path: com/example/app/Application.java
    content: |
      package com.example.app;
      public class Application { public void run() {} }
  - path: com/example/app/Traceable.java
    content: |
      package com.example.app;
      import java.lang.annotation.*;
      @Retention(RetentionPolicy.RUNTIME)
      @Target({ElementType.METHOD, ElementType.TYPE})
      public @interface Traceable {}
  - path: com/example/app/ExplicitTarget.java
    content: |
      package com.example.app;
      import java.lang.annotation.Target;
      @Target({})
      public @interface ExplicitTarget {}

tests:
  - name: "explicit Target annotation resolves to its declared import"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
      WHERE caller.fqn = 'com.example.app.ExplicitTarget'
      RETURN sym.import_path AS path, sym.identifier_name AS name
    assert:
      - { row_count: 1 }
      - { row: { path: 'java.lang.annotation', name: Target } }

  - name: "Main.main -> ArrayList (imported symbol)"
    
    query: |
      MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
      WHERE caller.fqn = 'com.example.app.Main.main'
        AND sym.import_path = 'java.util'
        AND sym.identifier_name = 'ArrayList'
      RETURN caller.fqn AS caller, sym.identifier_name AS symbol
    assert:
      - { row_count: 1 }

  - name: "Main.main -> List (imported symbol)"
    
    query: |
      MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
      WHERE caller.fqn = 'com.example.app.Main.main'
        AND sym.import_path = 'java.util'
        AND sym.identifier_name = 'List'
      RETURN caller.fqn AS caller, sym.identifier_name AS symbol
    assert:
      - { row_count: 1 }

  - name: "Traceable -> java.lang.annotation.* (annotation wildcard import)"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
      WHERE caller.fqn = 'com.example.app.Traceable'
        AND sym.import_path = 'java.lang.annotation' AND sym.identifier_name = '*'
      RETURN caller.fqn AS caller, sym.identifier_name AS symbol
    assert:
      - { row_count: 2 }

  - name: "wildcard annotation imports do not synthesize named imported symbols"
    query: |
      MATCH (sym:ImportedSymbol)
      WHERE sym.file_path = 'com/example/app/Traceable.java'
      RETURN sym.import_path AS path, sym.identifier_name AS name
    assert:
      - { row_count: 1 }
      - { row: { path: 'java.lang.annotation', name: '*' } }
