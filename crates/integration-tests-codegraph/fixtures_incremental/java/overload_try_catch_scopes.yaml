name: "Java: a resource or catch parameter shadows a field of the same name in its body"

fixtures:
  - path: p/Scopes.java
    content: |
      package p;

      class Err extends Exception {}
      class Other { void ping() {} }
      class Res implements AutoCloseable { public void close() {} void ping() {} }

      class Scopes {
        int name = 0;
        int e = 0;
        Other o = new Other();

        void k(int x) {}
        void k(String x) {}
        void k(Res x) {}
        void j(int x) {}
        void j(String x) {}
        void j(Err x) {}

        void resource() throws Exception {
          try (java.io.StringReader name = new java.io.StringReader("")) { k(name); }
        }

        void typedResource() throws Exception {
          try (String name = "") { k(name); }
        }

        void inBody() throws Exception {
          try (Res name = new Res()) { k(name); }
        }

        void inFinally() throws Exception {
          try (Res name = new Res()) { } finally { k(name); }
        }

        void inCatch() throws Exception {
          try (Res name = new Res()) { } catch (Err x) { k(name); }
        }

        void afterTry() throws Exception {
          try (Res o = new Res()) { }
          o.ping();
        }

        void caught() {
          try { j(1); } catch (Err e) { j(e); }
        }
      }

tests:
  - name: a try resource of type String shadows the int field
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'typedResource' AND t.name = 'k'
      RETURN t.signature AS signature
    assert:
      - { row_count: 1 }
      - { row: { signature: "(String)" } }

  - name: a catch parameter shadows the int field
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'caught' AND t.name = 'j'
      RETURN t.signature AS signature
    assert:
      - { row: { signature: "(Err)" } }
      - { row: { signature: "(int)" } }
      - { row_count: 2 }

  - name: a resource is visible in the body only
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'inBody' AND t.name = 'k'
      RETURN t.signature AS signature
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Res)" } }

  - name: a resource is not visible in finally, so the call keeps every overload
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'inFinally' AND t.name = 'k'
      RETURN t.signature AS signature
    assert:
      - { row_count: 3 }
      - { row: { signature: "(int)" } }
      - { row: { signature: "(String)" } }
      - { row: { signature: "(Res)" } }

  - name: a resource is not visible in catch, so the call keeps every overload
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'inCatch' AND t.name = 'k'
      RETURN t.signature AS signature
    assert:
      - { row_count: 3 }
      - { row: { signature: "(int)" } }
      - { row: { signature: "(String)" } }
      - { row: { signature: "(Res)" } }

  - name: a qualified resource type keeps every overload
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'resource' AND t.name = 'k'
      RETURN t.signature AS signature
    assert:
      - { row_count: 3 }
      - { row: { signature: "(int)" } }
      - { row: { signature: "(String)" } }
      - { row: { signature: "(Res)" } }

  - name: a resource is not visible after the try statement
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'afterTry' AND t.name = 'ping'
      RETURN t.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { fqn: "p.Other.ping" } }
