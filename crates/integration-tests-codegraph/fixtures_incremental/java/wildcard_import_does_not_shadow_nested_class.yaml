name: "Java: a wildcard import does not shadow a nested class declared after its use"

fixtures:
  - path: shapes/Holder.java
    content: |
      package shapes;

      public class Holder {
          public static class Category {
              public Category() {}

              public void x() {}
          }
      }

  - path: app/Main.java
    content: |
      package app;

      import shapes.*;

      class Main {
          void go() {
              new Category().x();
          }

          static class Category {
              void x() {}
          }
      }

tests:
  - name: the call reaches the nested class, not the one the wildcard import brings in
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.fqn = 'app.Main.go' AND t.name = 'x'
      RETURN t.fqn AS callee
    assert:
      - { column_values: { field: callee, values: ["app.Main.Category.x"] } }
