name: "Java: every Definition and Import column of the code graph contract"

fixtures:
  - path: src/com/acme/billing/Order.java
    content: |
      package com.acme.billing;

      import java.util.List;
      import java.util.*;
      import com.acme.billing.util.Money;
      import org.apache.commons.lang3.StringUtils;

      /**
       * An order with lines.
       *
       * @since 1.0
       */
      public abstract class Order implements Payable {
          /** Most lines per order. */
          public static final int MAX_LINES = 50;
          private final List<String> lines = new ArrayList<>();
          protected int count;

          public Order(int count) {
              this.count = count;
          }

          /** Charges the card. */
          public static Money charge(final Money amount, String card) {
              return Money.zero();
          }

          abstract int size();

          native void flush();

          void helper() {
              class Local {}
          }
      }

      interface Payable {
          void pay();
      }

      enum Status {
          OPEN, CLOSED
      }

      record Line(String sku, int qty) {}

      @interface Audited {}

      class OrderTest {
          @Test
          void chargesTheCard() {
              Order.charge(null, StringUtils.trim("x"));
          }
      }

  - path: src/com/acme/billing/util/Money.java
    content: |
      package com.acme.billing.util;

      public final class Money {
          public static Money zero() { return new Money(); }
      }

  - path: src/com/acme/edges/lib/Base.java
    content: |
      package com.acme.edges.lib;

      public class Base {
          public int size = 1;

          public void run() {}

          public static Base make() {
              return new Base();
          }
      }

  - path: src/com/acme/edges/lib/Runner.java
    content: |
      package com.acme.edges.lib;

      public interface Runner {
          void go();
      }

  - path: src/com/acme/edges/lib/Marked.java
    content: |
      package com.acme.edges.lib;

      public @interface Marked {}

  - path: src/com/acme/edges/util/Tool.java
    content: |
      package com.acme.edges.util;

      public class Tool {}

  - path: src/com/acme/edges/App.java
    content: |
      package com.acme.edges;

      import com.acme.edges.lib.Base;
      import com.acme.edges.lib.Runner;
      import com.acme.edges.lib.Marked;
      import com.acme.edges.util.*;
      import org.vendor.Ext;

      public class App extends Base implements Runner {
          private Base held;

          @Marked
          public void go() {
              helper();
              Base.make();
              Tool t = new Tool();
              Ext.call();
          }

          @Override
          public void run() {}

          void helper() {}

          void use(Base p) {
              p.run();
          }

          int read(Base p) {
              return p.size;
          }

          void infer() {
              var c = Base.make();
              c.run();
          }
      }

  - path: src/com/acme/edges/Uses.java
    content: |
      package com.acme.edges;

      import com.acme.edges.lib.Base;
      import com.acme.edges.util.Tool;
      import com.acme.billing.util.Money;

      public class Uses {
          Tool pick(Base p, Object o) {
              if (o instanceof Money) {
                  return null;
              }
              return null;
          }
      }

