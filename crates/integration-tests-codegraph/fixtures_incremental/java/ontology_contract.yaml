name: "Java: every Definition and Import column of the code graph contract"

fixtures:
  - path: src/com/acme/billing/Order.java
    content: |
      package com.acme.billing;

      import java.util.List;
      import java.util.*;
      import com.acme.billing.util.Money;
      import org.apache.commons.lang3.StringUtils;

      /**
       * An order with lines.
       *
       * @since 1.0
       */
      public abstract class Order implements Payable {
          /** Most lines per order. */
          public static final int MAX_LINES = 50;
          private final List<String> lines = new ArrayList<>();
          protected int count;

          public Order(int count) {
              this.count = count;
          }

          /** Charges the card. */
          public static Money charge(final Money amount, String card) {
              return Money.zero();
          }

          abstract int size();

          native void flush();

          void helper() {
              class Local {}
          }
      }

      interface Payable {
          void pay();
      }

      enum Status {
          OPEN, CLOSED
      }

      record Line(String sku, int qty) {}

      @interface Audited {}

      class OrderTest {
          @Test
          void chargesTheCard() {
              Order.charge(null, StringUtils.trim("x"));
          }
      }

  - path: src/com/acme/billing/util/Money.java
    content: |
      package com.acme.billing.util;

      public final class Money {
          public static Money zero() { return new Money(); }
      }

