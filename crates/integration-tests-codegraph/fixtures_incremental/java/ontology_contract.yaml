  - name: "every definition in src/com/acme/billing/util/Money.java carries the contract columns"
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'src/com/acme/billing/util/Money.java'
      RETURN d.fqn AS fqn, d.kind AS kind, d.language_kind AS language_kind, d.category AS category, d.scope AS scope, d.signature AS signature, d.parameters AS parameters, d.return_type AS return_type, d.declared_type AS declared_type, d.doc_comment AS doc_comment, d.modifiers AS modifiers, d.visibility AS visibility, d.generated_by AS generated_by, d.language AS language
      ORDER BY d.fqn
      LIMIT 100
    assert:
      - { row_count: 2 }
      - row:
          fqn: "com.acme.billing.util.Money"
          kind: "Class"
          language_kind: "Class"
          category: "Type"
          scope: "top_level"
          signature: "public final class Money"
          parameters: []
          return_type: null
          declared_type: null
          doc_comment: ""
          modifiers: ["final"]
          visibility: "public"
          generated_by: null
