  - name: "imports carry import_kind, language_kind, fqn, and is_external"
    query: |
      MATCH (i:Import)
      WHERE i.file_path = 'src/com/acme/billing/Order.java'
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
      ORDER BY i.import_path, i.name
    assert:
      - { row_count: 4 }
      - row: { name: "*", alias: "", import_kind: "wildcard", language_kind: "WildcardImport", import_path: "java.util", fqn: null }
      - row: { name: "List", alias: "", import_kind: "symbol", language_kind: "NamedImport", import_path: "java.util", fqn: "java.util.List" }
      - row: { name: "Money", alias: "", import_kind: "symbol", language_kind: "NamedImport", import_path: "com.acme.billing.util", fqn: "com.acme.billing.util.Money", is_external: false }
      - row: { name: "StringUtils", alias: "", import_kind: "symbol", language_kind: "NamedImport", import_path: "org.apache.commons.lang3", fqn: "org.apache.commons.lang3.StringUtils", is_external: true }

  - name: "a type has no return type, declared type, or generator"
    query: |
      MATCH (d:Definition)
      WHERE d.fqn = 'com.acme.billing.Order' AND d.return_type IS NULL AND d.declared_type IS NULL AND d.generated_by IS NULL
      RETURN d.fqn AS fqn
    assert:
      - { row_count: 1 }

  - name: "no definition has a kind outside the closed list"
    query: |
      MATCH (d:Definition) WHERE NOT d.kind IN ['Class','Struct','Interface','Trait','Enum','TypeAlias','Function','Method','Constructor','Test','Field','Constant','Variable','EnumMember','Module','Macro'] RETURN d.fqn
    assert:
      - { empty: true }

  - name: "edges: CALLS to a definition in the same file has resolution local"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.go' AND b.fqn = 'com.acme.edges.App.helper' AND e.resolution = 'local'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: CALLS to an imported definition has resolution import"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.go' AND b.fqn = 'com.acme.edges.lib.Base.make' AND e.resolution = 'import'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: CALLS through a declared parameter type has resolution declared_type"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.use' AND b.fqn = 'com.acme.edges.lib.Base.run' AND e.resolution = 'declared_type'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: CALLS through an inferred local type has resolution inferred_type"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.infer' AND b.fqn = 'com.acme.edges.lib.Base.run' AND e.resolution = 'inferred_type'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: CALLS to an external import ends at the Import row"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Import)
      WHERE a.fqn = 'com.acme.edges.App.go' AND b.fqn = 'org.vendor.Ext' AND e.resolution = 'import'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: INSTANTIATES a type in the same file has resolution local"
    query: |
      MATCH (a:Definition)-[e:INSTANTIATES]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.lib.Base.make' AND b.fqn = 'com.acme.edges.lib.Base' AND e.resolution = 'local'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: INSTANTIATES a type found by a wildcard import has resolution wildcard_import"
    query: |
      MATCH (a:Definition)-[e:INSTANTIATES]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.go' AND b.fqn = 'com.acme.edges.util.Tool' AND e.resolution = 'wildcard_import'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: a static member call does not instantiate its type"
    query: |
      MATCH (a:Definition)-[e:INSTANTIATES]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.go' AND b.fqn = 'com.acme.edges.lib.Base'
      RETURN b.fqn AS dst
    assert:
      - { empty: true }

  - name: "edges: USES_VALUE reads a field through a declared parameter type"
    # Known gap: a field read through a parameter of an imported type gives no edge.
    skip: true
    query: |
      MATCH (a:Definition)-[e:USES_VALUE]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.read' AND b.fqn = 'com.acme.edges.lib.Base.size' AND e.resolution = 'declared_type'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: USES_TYPE links a parameter type"
    query: |
      MATCH (a:Definition)-[e:USES_TYPE]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.use' AND b.fqn = 'com.acme.edges.lib.Base' AND e.usage = 'parameter'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: USES_TYPE links a field type"
    query: |
      MATCH (a:Definition)-[e:USES_TYPE]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.held' AND b.fqn = 'com.acme.edges.lib.Base' AND e.usage = 'field'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: USES_TYPE from a parameter type has usage parameter"
    query: |
      MATCH (a:Definition)-[e:USES_TYPE]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.Uses.pick' AND b.fqn = 'com.acme.edges.lib.Base' AND e.usage = 'parameter'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }
      - { row: { src: "com.acme.edges.Uses.pick", dst: "com.acme.edges.lib.Base" } }

  - name: "edges: USES_TYPE from a return type has usage return"
    query: |
      MATCH (a:Definition)-[e:USES_TYPE]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.Uses.pick' AND b.fqn = 'com.acme.edges.util.Tool' AND e.usage = 'return'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }
      - { row: { src: "com.acme.edges.Uses.pick", dst: "com.acme.edges.util.Tool" } }

  - name: "edges: USES_TYPE from an instanceof type has usage cast"
    query: |
      MATCH (a:Definition)-[e:USES_TYPE]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.Uses.pick' AND b.fqn = 'com.acme.billing.util.Money' AND e.usage = 'cast'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }
      - { row: { src: "com.acme.edges.Uses.pick", dst: "com.acme.billing.util.Money" } }

  - name: "edges: EXTENDS a superclass has resolution import"
    query: |
      MATCH (a:Definition)-[e:EXTENDS]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App' AND b.fqn = 'com.acme.edges.lib.Base' AND e.resolution = 'import'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: IMPLEMENTS a supertype that is an Interface"
    query: |
      MATCH (a:Definition)-[e:IMPLEMENTS]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App' AND b.fqn = 'com.acme.edges.lib.Runner' AND e.resolution = 'import'
      RETURN a.fqn AS src, b.fqn AS dst, b.kind AS kind
    assert:
      - { row: { dst: "com.acme.edges.lib.Runner", kind: "Interface" } }

  - name: "edges: EXTENDS is not written for an interface or a trait"
    query: |
      MATCH (a:Definition)-[e:EXTENDS]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App' AND b.fqn = 'com.acme.edges.lib.Runner'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { empty: true }

  - name: "edges: OVERRIDES links each method to the method it replaces"
    query: |
      MATCH (a:Definition)-[e:OVERRIDES]->(b:Definition)
      WHERE a.fqn STARTS WITH 'com.acme.edges.App.' AND e.resolution = 'import'
      RETURN a.fqn AS src, b.fqn AS dst
      ORDER BY a.fqn
    assert:
      - { row_count: 2 }
      - { row: { src: "com.acme.edges.App.go", dst: "com.acme.edges.lib.Runner.go" } }
      - { row: { src: "com.acme.edges.App.run", dst: "com.acme.edges.lib.Base.run" } }

  - name: "edges: ANNOTATED_BY links a method to its annotation"
    query: |
      MATCH (a:Definition)-[e:ANNOTATED_BY]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App.go' AND b.fqn = 'com.acme.edges.lib.Marked'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: ANNOTATED_BY also links the method to the imported name"
    query: |
      MATCH (a:Definition)-[e:ANNOTATED_BY]->(b:Import)
      WHERE a.fqn = 'com.acme.edges.App.go' AND b.name = 'Marked'
      RETURN a.fqn AS src, b.name AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: DEFINES links a type to its member"
    query: |
      MATCH (a:Definition)-[e:DEFINES]->(b:Definition)
      WHERE a.fqn = 'com.acme.edges.App' AND b.fqn = 'com.acme.edges.App.go'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: RESOLVES_TO links an import to its definition with resolution import"
    query: |
      MATCH (i:Import)-[e:RESOLVES_TO]->(d:Definition)
      WHERE i.file_path = 'src/com/acme/edges/App.java' AND i.name = 'Base' AND e.resolution = 'import'
      RETURN d.fqn AS dst
    assert:
      - { row: { dst: "com.acme.edges.lib.Base" } }

  - name: "edges: RESOLVES_TO links a wildcard import to a definition with resolution wildcard_import"
    query: |
      MATCH (i:Import)-[e:RESOLVES_TO]->(d:Definition)
      WHERE i.file_path = 'src/com/acme/edges/App.java' AND i.name = '*' AND d.fqn = 'com.acme.edges.util.Tool' AND e.resolution = 'wildcard_import'
      RETURN d.fqn AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: RESOLVES_TO links a wildcard import to a file"
    query: |
      MATCH (i:Import)-[e:RESOLVES_TO]->(f:File)
      WHERE i.file_path = 'src/com/acme/edges/App.java' AND i.name = '*' AND f.path = 'src/com/acme/edges/util/Tool.java'
      RETURN f.path AS dst
    assert:
      - { row_count: 1 }

  - name: "edges: DEPENDS_ON links a file to each file it imports from"
    query: |
      MATCH (a:File)-[e:DEPENDS_ON]->(b:File)
      WHERE a.path = 'src/com/acme/edges/App.java'
      RETURN b.path AS dst
      ORDER BY b.path
    assert:
      - { row: { dst: "src/com/acme/edges/lib/Base.java" } }
      - { row: { dst: "src/com/acme/edges/util/Tool.java" } }

  - name: "edges: an annotation that resolves to nothing gives no edge"
    # Known gap: an annotation that resolves to nothing falls back to CALLS to the wildcard import of the package.
    skip: true
    query: |
      MATCH (a:Definition)-[e:CALLS]->(i:Import)
      WHERE a.fqn = 'com.acme.edges.App.run' AND i.name = '*'
      RETURN i.import_path AS path
    assert:
      - { empty: true }
