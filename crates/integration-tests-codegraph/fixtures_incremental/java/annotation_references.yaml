name: "Java: annotation references"
fixtures:
  - path: com/example/MyAnnotation.java
    content: |
      package com.example;
      public @interface MyAnnotation {}

  - path: com/example/OtherAnnotation.java
    content: |
      package com.example;
      public @interface OtherAnnotation {}

  - path: com/example/Service.java
    content: |
      package com.example;

      public class Service {
          @MyAnnotation
          public void annotatedMethod() {}

          @OtherAnnotation
          public void otherMethod() {}

          public void plainMethod() {}
      }

  - path: com/example/Traceable.java
    content: |
      package com.example;
      import java.lang.annotation.Target;
      import java.lang.annotation.ElementType;
      @Target(ElementType.METHOD)
      public @interface Traceable {}

tests:
  - name: "Explicit annotation imports retain their declared symbol"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(symbol:ImportedSymbol)
      WHERE caller.fqn = 'com.example.Traceable'
      RETURN symbol.import_path AS path, symbol.identifier_name AS name
    assert:
      - { row_count: 1 }
      - { row: { path: 'java.lang.annotation', name: Target } }

  - name: Annotation ref attributed to the annotated method
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'annotatedMethod'
      RETURN callee.name AS callee
    assert:
      - { row: { callee: "MyAnnotation" } }
      - { not: true, row: { callee: "OtherAnnotation" } }

  - name: Each method references its own annotation
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'otherMethod'
      RETURN callee.name AS callee
    assert:
      - { row: { callee: "OtherAnnotation" } }
      - { not: true, row: { callee: "MyAnnotation" } }

  - name: Plain method has no annotation edges
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'plainMethod'
      RETURN callee.name AS callee
    assert:
      - { empty: true }
