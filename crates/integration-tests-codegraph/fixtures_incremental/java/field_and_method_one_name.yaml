name: "Java: a field and a method of one name keep separate bindings"

fixtures:
  - path: Main.java
    content: |
      public class Main {
          static class Other {
              void b() {}
          }

          static class Box {
              Other x = new Other();

              Box x() {
                  if (x != null) {
                      x.b();
                  }
                  return new Box();
              }

              void b() {}

              void go() {
                  x.b();
              }

              void goCall() {
                  x().b();
              }

              void setX(Other v) {
                  x = v;
              }
          }

          static class Sub extends Box {
              void viaSuper() {
                  x.b();
              }
          }
      }

tests:
  - name: the method x reads the field x and has no self edge
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'x' AND t.name IN ['x', 'b']
      RETURN t.fqn AS callee, t.definition_type AS kind
    assert:
      - { row_count: 1 }
      - { row: { callee: "Main.Other.b", kind: "Method" } }

  - name: a read of x types the receiver by the field, not by the method of the same name
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'go'
      RETURN t.fqn AS callee, t.definition_type AS kind
    assert:
      - { row_count: 1 }
      - { row: { callee: "Main.Other.b", kind: "Method" } }

  - name: a call of x() targets the method and not the field's type
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'goCall'
      RETURN t.fqn AS callee
    assert:
      - { not: true, row: { callee: "Main.Other.b" } }
      - { row: { callee: "Main.Box.x" } }

  - name: a call of x() types the receiver by its return
    # Known gap: a Java chained call on a method result is not typed, on main too.
    skip: true
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'goCall'
      RETURN t.fqn AS callee
    assert:
      - { column_values: { field: callee, values: ["Main.Box.b", "Main.Box.x"] } }

  - name: an inherited read of x types the receiver by the field
    # Known gap: a bare read of an inherited field is not bound in the subclass scope, on main too.
    skip: true
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'viaSuper'
      RETURN t.fqn AS callee, t.definition_type AS kind
    assert:
      - { row_count: 1 }
      - { row: { callee: "Main.Other.b", kind: "Method" } }

  - name: an assignment to x is not a call
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'setX' AND t.name = 'x'
      RETURN t.fqn AS callee
    assert:
      - { empty: true }
