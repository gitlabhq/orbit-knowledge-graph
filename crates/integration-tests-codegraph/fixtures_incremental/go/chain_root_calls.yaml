name: "Go: the call at the root of a method chain links and types the chain"

fixtures:
  - path: chain.go
    content: |
      package main

      type Item struct{}

      func (i Item) Touch() {}

      type Items struct{}

      func (s Items) First() Item { return Item{} }

      func (s Items) Count() int { return 0 }

      func makeItems() Items { return Items{} }

      func chainInDecl() {
      	n := makeItems().Count()
      	_ = n
      }

      func chainAsStatement() {
      	makeItems().First().Touch()
      }

      func chainInLoop() {
      	for i := 0; i < makeItems().Count(); i++ {
      	}
      }

tests:
  - name: "the call at the root of a method chain links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chainInDecl", "chainAsStatement"] AND callee.name = "makeItems"
      RETURN caller.name AS caller
      ORDER BY caller
    assert:
      - { row_count: 2 }
      - { column_values: { field: caller, values: ["chainAsStatement", "chainInDecl"] } }

  - name: "the call at the root of a chain in a for condition links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "chainInLoop" AND callee.name IN ["makeItems", "Count"]
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - { column_values: { field: callee, values: ["Count", "makeItems"] } }

  - name: "the methods on the chain resolve through the return type of the root call"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["chainInDecl", "chainAsStatement"] AND callee.name IN ["First", "Count", "Touch"]
      RETURN caller.name AS caller, callee.name AS callee
      ORDER BY caller, callee
    assert:
      - { row_count: 3 }
      - { row: { caller: chainAsStatement, callee: First } }
      - { row: { caller: chainAsStatement, callee: Touch } }
      - { row: { caller: chainInDecl, callee: Count } }
