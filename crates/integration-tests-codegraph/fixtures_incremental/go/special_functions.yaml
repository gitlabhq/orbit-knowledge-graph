name: "Go: init and main special functions"

fixtures:
  - path: app.go
    content: |
      package main

      import "fmt"

      var initialized bool

      func init() {
          initialized = true
          fmt.Println("first init")
      }

      func init() {
          fmt.Println("second init")
      }

      func main() {
          fmt.Println("running")
      }

tests:
  - name: "main() is extracted as Function"
    query: |
      MATCH (d:Definition)
      WHERE d.name = 'main' AND d.language_kind = 'Function'
      RETURN d.name AS name
    assert:
      - { row: { name: "main" } }

  # corrected: contract: two definitions with the same file, fqn, kind and signature are one row
  - name: "Both init() functions share one Definition row"
    query: |
      MATCH (d:Definition)
      WHERE d.name = 'init' AND d.language_kind = 'Function'
      RETURN d.name AS name
    assert:
      - { row_count: 1 }

  - name: "Both init() functions share the package-scoped FQN main.init"
    query: |
      MATCH (d:Definition)
      WHERE d.name = 'init' AND d.language_kind = 'Function'
      RETURN d.fqn AS fqn
    assert:
      - { column_values: { field: fqn, values: ["main.init"] } }
