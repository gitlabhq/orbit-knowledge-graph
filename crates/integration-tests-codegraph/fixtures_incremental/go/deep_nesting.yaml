name: "Go: deeply nested control flow links on the worker stack"

fixtures:
  - path: main.go
    content:
      - "package main\n\nfunc target() {}\n\nfunc nestedIf(c bool) {\n"
      - { repeat: 10000, text: "if c {\n" }
      - { repeat: 10000, text: "}\n" }
      - "target()\n}\n\nfunc elseIf(c bool) {\nif c {\n"
      - { repeat: 10000, text: "} else if c {\n" }
      - "}\ntarget()\n}\n\nfunc nestedLoop() {\n"
      - { repeat: 10000, text: "for {\n" }
      - { repeat: 10000, text: "}\n" }
      - "target()\n}\n"

tests:
  - name: "each function calls its target after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - { row_count: 3 }
      - column_values:
          field: caller
          values: [nestedIf, elseIf, nestedLoop]
