name: "Go: nested and recursive calls"

fixtures:
  - path: nested.go
    content: |
      package main

      type Logger struct{}

      func (l *Logger) Info(msg string)  {}
      func (l *Logger) Error(msg string) {}

      type App struct{}

      func (a *App) Start(logger *Logger) {
          logger.Info("starting")
          a.process(logger)
      }

      func (a *App) process(logger *Logger) {
          logger.Info("processing")
          logger.Error("oops")
      }

      func recursive(n int) int {
          if n <= 0 {
              return 0
          }
          return recursive(n - 1)
      }

tests:
  # corrected: Go spec, a method belongs to its receiver base type, so its fqn is <package>.<Type>.<Method>
  - name: "Start calls Info and process, not Error"
    queries:
      - query: |
          MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
          WHERE caller.fqn = 'main.App.Start'
          RETURN callee.fqn AS callee
          ORDER BY callee
        assert:
          - { row: { callee: "main.Logger.Info" } }
          - { row: { callee: "main.App.process" } }
      - query: |
          MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
          WHERE caller.fqn = 'main.App.Start' AND callee.name = 'Error'
          RETURN callee.name
        assert:
          - { empty: true }

  # corrected: Go spec, a method belongs to its receiver base type, so its fqn is <package>.<Type>.<Method>
  - name: "process calls Info and Error"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'main.App.process'
      RETURN callee.fqn AS callee
      ORDER BY callee
    assert:
      - { row: { callee: "main.Logger.Error" } }
      - { row: { callee: "main.Logger.Info" } }

  - name: "recursive calls itself"
    query: |
      MATCH (caller:Definition)-[:CALLS|DEFINES|EXTENDS]->(callee:Definition)
      WHERE caller.fqn = 'main.recursive' AND callee.fqn = 'main.recursive'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 1 }
