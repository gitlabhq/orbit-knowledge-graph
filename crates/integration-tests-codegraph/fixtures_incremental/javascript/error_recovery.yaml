name: "JavaScript: malformed files retain catalog entries without definitions"

pipeline: js

fixtures:
  - path: broken.js
    content: |
      function incomplete( {
        const x = ;
        return @@@@;
      }

  - path: valid.js
    content: |
      export function processOrder(id) {
        return { id, status: 'pending' };
      }

      export class OrderService {
        constructor() {}
        create(order) { return processOrder(order.id); }
      }

tests:
  - name: "valid sibling retains its call and file containment"
    queries:
      - query: |
          MATCH (caller:Definition)-[:CALLS]->(target:Definition)
          WHERE caller.file_path = 'valid.js'
          RETURN caller.name AS caller, target.name AS target, target.file_path AS file
        assert:
          - { row_count: 1 }
          - { row: { caller: create, target: processOrder, file: 'valid.js' } }
      - query: |
          MATCH (file:File)-[:DEFINES]->(d:Definition)
          WHERE file.path = 'broken.js'
          RETURN d.name
        assert:
          - { empty: true }
  - name: "broken.js is skipped and contributes no definitions"
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'broken.js'
      RETURN d.name AS name
    assert:
      - { empty: true }

  - name: "valid.js sibling is still fully indexed despite broken.js"
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'valid.js'
        AND d.name IN ['processOrder', 'OrderService', 'create']
      RETURN d.name AS name, d.fqn AS fqn, d.definition_type AS type
    assert:
      - { row_count: 3 }
      - { row: { name: "processOrder", fqn: "processOrder", type: "Function" } }
      - { row: { name: "OrderService", fqn: "OrderService", type: "Class" } }
      - { row: { name: "create", fqn: "OrderService::create", type: "Method" } }

  - name: "both malformed and valid files remain in the catalog"
    query: |
      MATCH (f:File)
      RETURN f.path AS path
    assert:
      - { row_count: 2 }
      - { row: { path: "valid.js" } }
      - { row: { path: "broken.js" } }
