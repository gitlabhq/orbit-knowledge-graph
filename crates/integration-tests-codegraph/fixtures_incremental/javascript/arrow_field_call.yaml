name: "JavaScript: a call on an arrow field reaches the field"

fixtures:
  - path: main.js
    content: |
      class Widget {
        handler = () => {};

        count = 0;

        run() {
          this.handler();
        }

        size() {
          return this.count;
        }
      }

      class Pair {
        x = () => {};

        x() {}

        run() {
          this.x();
        }
      }

      function use(widget) {
        widget.handler();
        widget.size();
      }

tests:
  - name: a call on an arrow field keeps the field as its target
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.fqn = 'Widget::run'
      RETURN t.fqn AS callee, t.kind AS kind
    assert:
      - { row_count: 1 }
      - { row: { callee: "Widget::handler", kind: "Property" } }

  - name: an arrow field shadows the prototype method of the same name
    # Known gap: the engine prefers the method; in JavaScript the own property set in the constructor wins.
    skip: true
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'run' AND c.fqn = 'Pair::run'
      RETURN t.fqn AS callee, t.kind AS kind
    assert:
      - { row_count: 1 }
      - { row: { callee: "Pair::x", kind: "Property" } }
