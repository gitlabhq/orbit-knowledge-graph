name: "JavaScript: a join with a shadowed call does not take the type of the function it hides"

fixtures:
  - path: main.js
    content: |
      class Foo {
        bar() {}
      }

      class Foo2 {
        bar() {}
      }

      function make() {
        return new Foo();
      }

      function f(make, c) {
        let x = make();
        if (c) {
          x = new Foo2();
        }
        x.bar();
      }

      function h() {
        const x = make();
        x.bar();
      }

      function g(c) {
        let x = make();
        if (c) {
          x = new Foo2();
        }
        x.bar();
      }

tests:
  - name: "f, whose make is a parameter, calls only the bar of the class it constructs"
    description: "Foo2 does not extend Foo and has its own bar. With extends, f's join would resolve bar through the common class Foo, which is the language value and not the shadowing this suite pins."
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'f' AND callee.name = 'bar'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "Foo2::bar" } }

  - name: "f does not call the top-level make its parameter hides"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'f' AND callee.name = 'make'
      RETURN caller.name AS caller
    assert:
      - { empty: true }

  - name: "h, whose make is the top-level one, calls bar"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'h' AND callee.name = 'bar'
      RETURN caller.name AS caller
    assert:
      - { row_count: 1 }
