name: "JavaScript: a join with a shadowed call does not take the type of the function it hides"

fixtures:
  - path: main.js
    content: |
      class Foo {
        bar() {}
      }

      class Foo2 extends Foo {}

      function make() {
        return new Foo();
      }

      function f(make, c) {
        let x = make();
        if (c) {
          x = new Foo2();
        }
        x.bar();
      }

      function h() {
        const x = make();
        x.bar();
      }

      function g(c) {
        let x = make();
        if (c) {
          x = new Foo2();
        }
        x.bar();
      }

tests:
  # corrected: ECMAScript: Foo2 extends Foo, so x.bar() on the new Foo2() arm reaches the inherited Foo.bar; the parameter make adds no type
  - name: "f, whose make is a parameter, calls bar only through the Foo2 arm"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'f' AND callee.name = 'bar'
      RETURN caller.name AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { caller: "f", callee: "Foo::bar" } }

  - name: "h, whose make is the top-level one, calls bar"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'h' AND callee.name = 'bar'
      RETURN caller.name AS caller
    assert:
      - { row_count: 1 }
