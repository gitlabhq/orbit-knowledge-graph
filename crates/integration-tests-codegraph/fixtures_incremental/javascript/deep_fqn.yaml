name: "JavaScript: a definition nested past the qualified name limit keeps its innermost segments"

fixtures:
  - path: deep.js
    content:
      - { repeat: 70, text: "function f{i}() {\n" }
      - "target();\n"
      - { repeat: 70, text: "}\n" }
      - "function target() {}\n"

tests:
  - name: "the innermost definition keeps the last 64 segments of its qualified name"
    query: |
      MATCH (d:Definition)
      WHERE d.name = 'f69'
      RETURN d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { fqn: "f6::f7::f8::f9::f10::f11::f12::f13::f14::f15::f16::f17::f18::f19::f20::f21::f22::f23::f24::f25::f26::f27::f28::f29::f30::f31::f32::f33::f34::f35::f36::f37::f38::f39::f40::f41::f42::f43::f44::f45::f46::f47::f48::f49::f50::f51::f52::f53::f54::f55::f56::f57::f58::f59::f60::f61::f62::f63::f64::f65::f66::f67::f68::f69" } }

  - name: "a definition within the limit keeps its whole qualified name"
    query: |
      MATCH (d:Definition)
      WHERE d.name = 'f63'
      RETURN d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { fqn: "f0::f1::f2::f3::f4::f5::f6::f7::f8::f9::f10::f11::f12::f13::f14::f15::f16::f17::f18::f19::f20::f21::f22::f23::f24::f25::f26::f27::f28::f29::f30::f31::f32::f33::f34::f35::f36::f37::f38::f39::f40::f41::f42::f43::f44::f45::f46::f47::f48::f49::f50::f51::f52::f53::f54::f55::f56::f57::f58::f59::f60::f61::f62::f63" } }
