name: "Elixir: deeply nested code links on the worker stack"

fixtures:
  - path: lib/deep.ex
    content:
      - "defmodule Deep do\ndef target, do: :ok\ndef wrap(x), do: x\n\ndef inside_if(c) do\n"
      - { repeat: 10000, text: "if c do\n" }
      - "target()\n"
      - { repeat: 10000, text: "end\n" }
      - "end\n\ndef nested_if(c) do\n"
      - { repeat: 10000, text: "if c do\n" }
      - ":ok\n"
      - { repeat: 10000, text: "end\n" }
      - "target()\nend\n\ndef nested_case(c) do\n"
      - { repeat: 10000, text: "case c do\ntrue ->\n" }
      - ":ok\n"
      - { repeat: 10000, text: "end\n" }
      - "target()\nend\n\ndef nested_call do\nwrap("
      - { repeat: 10000, text: "wrap(" }
      - "0"
      - { repeat: 10000, text: ")" }
      - ")\ntarget()\nend\nend\n"

tests:
  - name: "each function calls its target inside or after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - column_values:
          field: caller
          values: [inside_if, nested_if, nested_case, nested_call]
