name: "Elixir: a protocol is a trait and a defimpl is a part of its target module"

fixtures:
  - path: lib/size.ex
    content: |
      defprotocol Size do
        def size(data)
      end

      defmodule Box do
        defstruct [:items]

        def items(box), do: box.items
      end

      defimpl Size, for: Box do
        def size(box), do: length(Box.items(box))
      end

tests:
  # corrected: contract: a type that the language keyword calls a protocol is an Interface with language_kind Protocol
  - name: the protocol is an interface definition
    query: |
      MATCH (d:Definition)
      WHERE d.name = 'Size'
      RETURN d.fqn AS fqn, d.kind AS kind, d.language_kind AS language_kind
    assert:
      - { row_count: 1 }
      - { row: { fqn: "Size", kind: "Interface", language_kind: "Protocol" } }

  # corrected: contract: an impl block is not a definition; the type defines its methods
  - name: the defimpl is a part of the target module
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.name = 'Box'
          RETURN d.kind AS kind
        assert:
          - { row_count: 1 }
          - { row: { kind: "Module" } }
      - query: |
          MATCH (o:Definition)-[:DEFINES]->(m:Definition)
          WHERE o.name = 'Box'
          RETURN m.name AS member
        assert:
          - { row: { member: "size" } }

  - name: the defimpl function calls the module function
    query: |
      MATCH (c:Definition)-[:CALLS]->(t:Definition)
      WHERE c.name = 'size' AND t.name = 'items'
      RETURN t.fqn AS callee
    assert:
      - { row: { callee: "Box.items" } }
