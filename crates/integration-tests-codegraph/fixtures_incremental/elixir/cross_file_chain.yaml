name: "Elixir: an imported function and a module-qualified call across files"

fixtures:
  - path: lib/a.ex
    content: |
      defmodule A do
        def helper, do: :ok
      end

  - path: lib/b.ex
    content: |
      defmodule B do
        import A

        def go, do: helper()
      end

  - path: lib/c.ex
    content: |
      defmodule C do
        def run, do: B.go()
      end

tests:
  - name: "each file defines its function"
    query: |
      MATCH (d:Definition)
      WHERE d.name IN ['helper', 'go', 'run']
      RETURN d.fqn AS fqn
    assert:
      - { row_count: 3 }
      - { row: { fqn: A.helper } }
      - { row: { fqn: B.go } }
      - { row: { fqn: C.run } }

  - name: "the import and the qualified call link across files"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ['run', 'go']
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 2 }
      - { row: { caller: C.run, callee: B.go } }
      - { row: { caller: B.go, callee: A.helper } }
