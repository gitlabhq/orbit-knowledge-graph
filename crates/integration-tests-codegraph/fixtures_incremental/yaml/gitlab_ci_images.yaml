name: "GitLab CI: container images"

fixtures:
  - path: image_string/.gitlab-ci.yml
    content: |
      image: node:18
      build:
        image: 'ruby:3.2@sha256:abc123'
        script: [make]

  - path: image_name_key/.gitlab-ci.yml
    content: |
      test:
        image:
          name: "host:5000/team/app:1.2"
          entrypoint: [""]
        script: [make test]

  - path: services/.gitlab-ci.yml
    content: |
      test:
        services:
          - postgres:15
          - name: redis:7
            alias: cache
          - "mysql@sha256:def456"
        script: [make test]

  - path: cs_image_variable/.gitlab-ci.yml
    content: |
      container_scanning:
        variables:
          CS_IMAGE: "nginx:1.25.3"

  - path: star_image_suffix/.gitlab-ci.yml
    content: |
      variables:
        DOCKER_IMAGE: alpine:3.19
        BUILD_IMAGE: golang:1.22
        IMAGE_TAG: not-this-one

  - path: default_image/.gitlab-ci.yml
    content: |
      default:
        image: python:3.12
        services:
          - docker:dind

  - path: not_an_image/.gitlab-ci.yml
    content: |
      variables:
        NODE_VERSION: 18
        IMAGE_PULL: "always"
      job:
        script:
          - echo image
          - docker run ubuntu:22.04

  - path: variable_in_image/.gitlab-ci.yml
    content: |
      build:
        image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      other:
        image: "${REGISTRY}/tools:${TOOLS_VERSION}"

  - path: variable_forms/.gitlab-ci.yml
    content: |
      variables:
        IMAGE: exact:1
        DESCRIBED_IMAGE:
          value: described:2
          description: "an image"
        MY_IMAGE_TAG: tagvar:1
        PUSH_IMAGE: "true"
        SCAN_IMAGE: false
        FLAG_IMAGE: yes
        QUOTED_IMAGE: "no"
        EMPTY_IMAGE:
        NULL_IMAGE: ~
      job:
        variables:
          JOB_IMAGE: jobvar:3

  - path: flow_forms/.gitlab-ci.yml
    content: |
      test:
        image: { name: "flowmap:2", entrypoint: [""] }
        services: [ "flowseq:1", { name: "flowseqmap:2", alias: db } ]

  - path: depth/.gitlab-ci.yml
    content: |
      include:
        - component: example.com/group/comp@1.0
          inputs:
            image: inputimg:1
      spec:
        inputs:
          image:
            default: inputdefault:1
      workflow:
        rules:
          - variables:
              WF_IMAGE: wf:1
      test:
        trigger:
          include:
            - local: ci/child.yml
              inputs:
                image: trigimg:3
        parallel:
          matrix:
            - MATRIX_IMAGE: [mat:1]
        environment:
          kubernetes:
            image: deepimg:1
        rules:
          - variables:
              RULE_IMAGE: rule:1
        services:
          - name: svc:4
            alias: db
            variables:
              INNER_IMAGE: inner:9

  - path: braces/.gitlab-ci.yml
    content: |
      a:
        image: ${IMG:-alpine}
      b:
        image: ${REG}:${VER}
      c:
        image: ${REG}/tools:${VER}@sha256:aa

  - path: names/build.gitlab-ci.yml
    content: |
      image: suffixed:1

  - path: names/.gitlab-ci.yml.example
    content: |
      image: example:1

  - path: names/.gitlab-ci.yml.template
    content: |
      image: template:1

  - path: names/values.json
    content: |
      {"image": "json:1"}

  - path: reference_tag/.gitlab-ci.yml
    content: |
      test:
        services: !reference [.x, services]
        image: !reference [.base, image]
        variables:
          TAGGED_IMAGE: !reference [.v, image]
      real:
        image: kept:1

  - path: ci/other.yml
    content: |
      image: not-indexed:1

  - path: .gitlab-ci.yml.bak
    content: |
      image: backup:1

  - path: config/app.yaml
    content: |
      image: nope:2

tests:
  - name: "image: as a string, quoted or plain"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "image_string/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest, i.import_type AS type
      ORDER BY image, tag
    assert:
      - { row_count: 2 }
      - { row: { image: "node", tag: "18", digest: "" } }
      - { row: { image: "ruby", tag: "3.2", digest: "sha256:abc123" } }

  - name: "image: with a name key and a registry port"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "image_name_key/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest, i.import_type AS type
      ORDER BY image, tag
    assert:
      - { row_count: 1 }
      - { row: { image: "host:5000/team/app", tag: "1.2", digest: "" } }

  - name: "services: as strings and name keys"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "services/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest, i.import_type AS type
      ORDER BY image, tag
    assert:
      - { row_count: 3 }
      - { row: { image: "postgres", tag: "15", digest: "" } }
      - { row: { image: "redis", tag: "7", digest: "" } }
      - { row: { image: "mysql", tag: "", digest: "sha256:def456" } }

  - name: "CS_IMAGE names an image"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "cs_image_variable/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest, i.import_type AS type
      ORDER BY image, tag
    assert:
      - { row_count: 1 }
      - { row: { image: "nginx", tag: "1.25.3", digest: "" } }

  - name: "variables ending in _IMAGE name images"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "star_image_suffix/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest, i.import_type AS type
      ORDER BY image, tag
    assert:
      - { row_count: 2 }
      - { row: { image: "alpine", tag: "3.19", digest: "" } }
      - { row: { image: "golang", tag: "1.22", digest: "" } }

  - name: "default: image and services"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "default_image/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest, i.import_type AS type
      ORDER BY image, tag
    assert:
      - { row_count: 2 }
      - { row: { image: "python", tag: "3.12", digest: "" } }
      - { row: { image: "docker", tag: "dind", digest: "" } }

  - name: "values that only look like images are skipped"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "not_an_image/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest, i.import_type AS type
      ORDER BY image, tag
    assert:
      - { row_count: 0 }

  - name: "a variable in the value stays as written"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "variable_in_image/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest, i.import_type AS type
      ORDER BY image, tag
    assert:
      - { row_count: 2 }
      - { row: { image: "$CI_REGISTRY_IMAGE", tag: "$CI_COMMIT_SHA", digest: "" } }
      - { row: { image: "${REGISTRY}/tools", tag: "${TOOLS_VERSION}", digest: "" } }

  - name: "images carry the CI image import type"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.import_type != "CiImage"
      RETURN i.file_path AS file
    assert:
      - { row_count: 0 }

  - name: "only GitLab CI files are indexed"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path IN ["ci/other.yml", ".gitlab-ci.yml.bak", "config/app.yaml"]
      RETURN i.file_path AS file
    assert:
      - { row_count: 0 }

  - name: "IMAGE, the value: form and root and job variables count; flags and nulls do not"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "variable_forms/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest
      ORDER BY image, tag
    assert:
      - { row_count: 5 }
      - { row: { image: "described", tag: "2", digest: "" } }
      - { row: { image: "exact", tag: "1", digest: "" } }
      - { row: { image: "jobvar", tag: "3", digest: "" } }
      - { row: { image: "no", tag: "", digest: "" } }
      - { row: { image: "true", tag: "", digest: "" } }

  - name: "flow image: and services: forms"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "flow_forms/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest
      ORDER BY image, tag
    assert:
      - { row_count: 3 }
      - { row: { image: "flowmap", tag: "2", digest: "" } }
      - { row: { image: "flowseq", tag: "1", digest: "" } }
      - { row: { image: "flowseqmap", tag: "2", digest: "" } }

  - name: "only the root, default and a job place images"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "depth/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest
      ORDER BY image, tag
    assert:
      - { row_count: 1 }
      - { row: { image: "svc", tag: "4", digest: "" } }

  - name: "braces are not tag separators"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "braces/.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest
      ORDER BY image, tag
    assert:
      - { row_count: 3 }
      - { row: { image: "${IMG:-alpine}", tag: "", digest: "" } }
      - { row: { image: "${REG}", tag: "${VER}", digest: "" } }
      - { row: { image: "${REG}/tools", tag: "${VER}", digest: "sha256:aa" } }

  - name: "a name ending in .gitlab-ci.yml is a CI file"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "names/build.gitlab-ci.yml"
      RETURN i.import_path AS image, i.identifier_name AS name, i.import_tag AS tag, i.import_digest AS digest
      ORDER BY image, tag
    assert:
      - { row_count: 1 }
      - { row: { image: "suffixed", tag: "1", digest: "" } }

  - name: "backup, example and template copies stay out"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path IN ["names/.gitlab-ci.yml.example", "names/.gitlab-ci.yml.template"]
      RETURN i.file_path AS file
    assert:
      - { row_count: 0 }

  - name: "CI files and .yaml files are yaml, other names keep their extension"
    query: |
      MATCH (f:File)
      WHERE f.path IN [".gitlab-ci.yml.bak", "names/build.gitlab-ci.yml", "config/app.yaml", "ci/other.yml", "names/values.json"]
      RETURN f.path AS path, f.language AS language
      ORDER BY path
    assert:
      - { row_count: 5 }
      - { row: { path: "names/build.gitlab-ci.yml", language: "yaml" } }
      - { row: { path: "names/values.json", language: "json" } }
      - { row: { path: ".gitlab-ci.yml.bak", language: "bak" } }
      - { row: { path: "config/app.yaml", language: "yaml" } }
      - { row: { path: "ci/other.yml", language: "yml" } }

  - name: "YAML-tagged values are not images"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = "reference_tag/.gitlab-ci.yml"
      RETURN i.import_path AS image
    assert:
      - { row_count: 1 }
      - { row: { image: "kept" } }
