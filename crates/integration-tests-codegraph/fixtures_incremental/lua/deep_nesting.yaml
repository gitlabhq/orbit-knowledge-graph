name: "Lua: deeply nested code links on the worker stack"

fixtures:
  - path: deep.lua
    content:
      - "function target()\nend\n\nfunction wrap(x)\nreturn x\nend\n\nfunction inside_if(c)\n"
      - { repeat: 10000, text: "if c then\n" }
      - "target()\n"
      - { repeat: 10000, text: "end\n" }
      - "end\n\nfunction nested_if(c)\n"
      - { repeat: 10000, text: "if c then\n" }
      - { repeat: 10000, text: "end\n" }
      - "target()\nend\n\nfunction else_if(c)\nif c then\n"
      - { repeat: 10000, text: "elseif c then\n" }
      - "end\ntarget()\nend\n\nfunction nested_loop(c)\n"
      - { repeat: 10000, text: "while c do\n" }
      - { repeat: 10000, text: "end\n" }
      - "target()\nend\n\nfunction nested_block()\n"
      - { repeat: 10000, text: "do\n" }
      - { repeat: 10000, text: "end\n" }
      - "target()\nend\n\nfunction nested_call()\nwrap("
      - { repeat: 10000, text: "wrap(" }
      - "0"
      - { repeat: 10000, text: ")" }
      - ")\ntarget()\nend\n"

tests:
  - name: "each function calls its target inside or after the nesting"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE callee.name = 'target'
      RETURN caller.name AS caller
    assert:
      - column_values:
          field: caller
          values: [inside_if, nested_if, else_if, nested_loop, nested_block, nested_call]
