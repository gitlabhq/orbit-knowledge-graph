name: "Markdown (incremental): front matter is one definition per file, identical across engines"
fixture_tree: markdown_front_matter

tests:
  - name: "every file with a front matter block has one FrontMatter definition"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'FrontMatter'
      RETURN d.file_path AS file, d.fqn AS fqn, d.name AS name
    assert:
      - { row_count: 9 }
      - { row: { file: "doc/user/merge_requests.md", fqn: "merge_requests#front_matter", name: "front_matter" } }
      - { row: { file: "skills/orbit/SKILL.md", fqn: "SKILL#front_matter", name: "front_matter" } }
      - { row: { file: "skills/review/SKILL.md", fqn: "SKILL#front_matter", name: "front_matter" } }
      - { row: { file: "notes/blank.md", fqn: "blank#front_matter", name: "front_matter" } }
      - { row: { file: "notes/break.md", fqn: "break#front_matter", name: "front_matter" } }
      - { row: { file: "notes/suffix.md", fqn: "suffix#front_matter", name: "front_matter" } }
      - { not: true, row: { file: "notes/toml.md" } }

  - name: "front matter keys do not become definitions"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type <> 'FrontMatter' AND d.definition_type <> 'Section'
      RETURN d.fqn AS fqn, d.definition_type AS definition_type
    assert:
      - { empty: true }

  - name: "the file defines its front matter block, which defines nothing"
    queries:
      - query: |
          MATCH (f:File)-[:DEFINES]->(d:Definition)
          WHERE d.definition_type = 'FrontMatter'
          RETURN f.path AS file, d.fqn AS fqn
        assert:
          - { row_count: 9 }
          - { row: { file: "skills/review/SKILL.md", fqn: "SKILL#front_matter" } }
      - query: |
          MATCH (p:Definition)-[:DEFINES]->(d:Definition)
          WHERE p.definition_type = 'FrontMatter'
          RETURN p.fqn AS parent, d.fqn AS child
        assert:
          - { empty: true }

  - name: "a heading named like the front matter gets a suffixed fqn"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Section'
      RETURN d.fqn AS fqn, d.name AS name
    assert:
      - { row_count: 8 }
      - { row: { fqn: "suffix#front_matter-1", name: "front_matter-1" } }
      - { row: { fqn: "suffix#front_matter-2", name: "front_matter" } }
      - { row: { fqn: "toml#Toml", name: "Toml" } }
      - { row: { fqn: "SKILL#front_matter-1", name: "front_matter" } }
      - { row: { fqn: "merge_requests#Create a merge request", name: "Create a merge request" } }
      - { row: { fqn: "blank#Blank", name: "Blank" } }

  - name: "front matter ids and ranges are the same in both engines"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'FrontMatter'
      RETURN d.file_path AS file, d.id AS id, d.start_byte AS start_byte, d.end_byte AS end_byte, d.start_line AS start_line, d.end_line AS end_line
    assert:
      - { row_count: 9 }
      - { row: { file: "notes/break.md", id: 7214704662862655811, start_byte: 0, end_byte: 21, start_line: 1, end_line: 3 } }
      - { row: { file: "notes/suffix.md", id: 1138141786811288481, start_byte: 0, end_byte: 22, start_line: 1, end_line: 3 } }
      - { row: { file: "doc/user/merge_requests.md", id: 1737322248835097902, start_byte: 0, end_byte: 191, start_line: 1, end_line: 6 } }
      - { row: { file: "skills/orbit/SKILL.md", id: 1250515828031768561, start_byte: 0, end_byte: 111, start_line: 1, end_line: 8 } }
      - { row: { file: "notes/blank.md", id: 511951402004096090, start_byte: 0, end_byte: 9, start_line: 1, end_line: 3 } }

  - name: "a SKILL.md block covers its multi-line values through the closing delimiter"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'FrontMatter' AND d.file_path = 'skills/review/SKILL.md'
      RETURN d.id AS id, d.start_byte AS start_byte, d.end_byte AS end_byte, d.start_line AS start_line, d.end_line AS end_line
    assert:
      - { row_count: 1 }
      - { row: { id: 5266977163424305735, start_byte: 0, end_byte: 243, start_line: 1, end_line: 16 } }

  - name: "sections after the front matter start at their heading in both engines"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Section'
      RETURN d.fqn AS fqn, d.id AS id, d.start_byte AS start_byte
    assert:
      - { row: { fqn: "merge_requests#Create a merge request", id: 4186158684943796567, start_byte: 241 } }
      - { row: { fqn: "SKILL#front_matter-1", id: 5595229349388437339, start_byte: 111 } }
      - { row: { fqn: "blank#Blank", id: 704564307224734628, start_byte: 10 } }
      - { row: { fqn: "SKILL#Review", id: 7763089820191681321, start_byte: 244 } }

  - name: "front matter values are stored in their columns, the same in both engines"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'FrontMatter'
      RETURN d.file_path AS file, d.front_matter_name AS name, d.front_matter_description AS description, d.front_matter_license AS license, d.front_matter_compatibility AS compatibility, d.front_matter_allowed_tools AS allowed_tools, d.front_matter_metadata AS metadata, d.front_matter_title AS title, d.front_matter_stage AS stage, d.front_matter_group AS group_name, d.front_matter_info AS info, d.front_matter_version AS version, d.front_matter_category AS category
    assert:
      - { row_count: 9 }
      - row:
          file: "skills/pdf/SKILL.md"
          name: "pdf-processing"
          description: "Extract text and tables from PDF files."
          license: "Apache-2.0"
          compatibility: "Requires poppler-utils"
          allowed_tools: "Bash(git:*) Read"
          metadata: '{"author":"example-org","version":"1.0"}'
          title: ""
          stage: ""
          group_name: ""
          info: ""
          version: "1.10"
          category: "Documentation"
      - row:
          file: "doc/ci/yaml.md"
          name: ""
          description: "Keywords for .gitlab-ci.yml."
          title: "CI/CD YAML syntax reference"
          stage: "Verify"
          group_name: "Pipeline Authoring"
          info: "To determine the technical writer, see https://handbook.gitlab.com/"
          metadata: ""
      - row:
          file: "skills/review/SKILL.md"
          name: "review-mr"
          description: "Review a merge request. Use when asked to review an MR."
          allowed_tools: ""
          metadata: '{"owner":"orbit","version":"2"}'
      - { row: { file: "skills/orbit/SKILL.md", name: "orbit", description: "Query the knowledge graph.", metadata: '{"version":"1"}' } }
      - { row: { file: "notes/odd.md", title: "", stage: "true", info: "", metadata: "" } }
      - { row: { file: "notes/blank.md", name: "", title: "", metadata: "" } }

  - name: "front matter columns filter like any other Definition property"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.definition_type = 'FrontMatter' AND d.front_matter_stage = 'Verify'
          RETURN d.file_path AS file, d.front_matter_group AS group_name
        assert:
          - { row_count: 1 }
          - { row: { file: "doc/ci/yaml.md", group_name: "Pipeline Authoring" } }
      - query: |
          MATCH (d:Definition)
          WHERE d.front_matter_metadata CONTAINS '"author":"example-org"'
          RETURN d.file_path AS file, d.front_matter_name AS name
        assert:
          - { row_count: 1 }
          - { row: { file: "skills/pdf/SKILL.md", name: "pdf-processing" } }
      - query: |
          MATCH (d:Definition)
          WHERE d.definition_type <> 'FrontMatter'
          RETURN d.front_matter_name AS name, d.front_matter_title AS title, d.front_matter_metadata AS metadata
        assert:
          - { column_values: { field: name, values: [""] } }
          - { column_values: { field: title, values: [""] } }
          - { column_values: { field: metadata, values: [""] } }
