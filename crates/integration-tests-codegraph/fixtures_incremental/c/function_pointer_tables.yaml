name: "C: a function named in an initializer is a value use of it"

# Dispatch tables and function-pointer variables name a function without calling it:
# `{ ether_if_print, DLT_EN10MB }` in a printer table, or `void (*hook)(int) = ppp_if_print;`.
# The function is reached through the pointer, so the graph needs an edge from where it is
# named, or nothing refers to it at all.

fixtures:
  - path: print.c
    content: |
      #include <stddef.h>

      struct printer {
      	void (*f)(int);
      	int type;
      };

      void ether_if_print(int n) { }
      void ppp_if_print(int n) { }
      void sll_if_print(int n) { }

      static const struct printer printers[] = {
      	{ ether_if_print,	1 },
      	{ ppp_if_print,		9 },
      	{ NULL,			0 },
      };

      static void (*hook)(int) = sll_if_print;

      void
      lookup(int t)
      {
      	const struct printer *p;
      	for (p = printers; p->f != NULL; p++)
      		if (p->type == t)
      			p->f(t);
      }

      void
      install(void)
      {
      	void (*local)(int) = ether_if_print;
      	struct printer one = { ppp_if_print, 2 };
      	local(1);
      }

      void
      first_printer(int t)
      {
      	printers[0].f(t);
      }

      void
      run_local(void)
      {
      	void (*fp)(int);
      	fp = sll_if_print;
      	fp(1);
      }

  - path: print.h
    content: |
      void llc_if_print(int n);

  - path: print-llc.c
    content: |
      #include "print.h"
      void llc_if_print(int n) { }

  - path: link.c
    content: |
      #include "print.h"
      static void (*link_printers[])(int) = { llc_if_print };
      void link_lookup(int t) { link_printers[0](t); }

tests:
  - name: "a table of function pointers is a definition"
    query: |
      MATCH (d:Definition)
      WHERE d.name IN ['printers', 'hook']
      RETURN d.name AS name, d.kind AS kind
      ORDER BY name
    assert:
      - { row_count: 2 }
      - { row: { name: hook, kind: Variable } }
      - { row: { name: printers, kind: Variable } }

  - name: "the table refers to each function it names"
    query: |
      MATCH (t:Definition)-[:USES_VALUE]->(f:Definition)
      WHERE t.name = 'printers'
      RETURN f.name AS function
      ORDER BY function
    assert:
      - { row_count: 2 }
      - { row: { function: ether_if_print } }
      - { row: { function: ppp_if_print } }

  - name: "a function-pointer variable refers to its function"
    query: |
      MATCH (t:Definition)-[:USES_VALUE]->(f:Definition)
      WHERE t.name = 'hook'
      RETURN f.name AS function
    assert:
      - { row: { function: sll_if_print } }

  - name: "a function that stores a function pointer refers to it"
    query: |
      MATCH (t:Definition)-[:USES_VALUE]->(f:Definition)
      WHERE t.name = 'install'
      RETURN f.name AS function
      ORDER BY function
    assert:
      - { row: { function: ether_if_print } }
      - { row: { function: ppp_if_print } }

  - name: "a table refers to functions defined in an included file"
    query: |
      MATCH (t:Definition)-[:USES_VALUE]->(f:Definition)
      WHERE t.name = 'link_printers'
      RETURN f.name AS function, f.file_path AS file
    assert:
      - { row_count: 1 }
      - { row: { function: llc_if_print, file: print-llc.c } }

  - name: "a function that walks or indexes the table refers to it"
    query: |
      MATCH (r:Definition)-[:USES_VALUE]->(t:Definition)
      WHERE t.name = 'printers'
      RETURN r.name AS reader
      ORDER BY reader
    assert:
      - { row: { reader: first_printer } }
      - { row: { reader: lookup } }

  - name: "an assignment still binds the pointer, so its call resolves"
    query: |
      MATCH (a:Definition)-[:CALLS]->(b:Definition)
      WHERE a.name = 'run_local'
      RETURN b.name AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: sll_if_print } }

  - name: "a table is placed at its own line, not at the start of the file"
    query: |
      MATCH (d:Definition)
      WHERE d.name IN ['printers', 'hook']
      RETURN d.name AS name, d.start_line AS start_line
      ORDER BY name
    assert:
      - { row: { name: hook, start_line: 18 } }
      - { row: { name: printers, start_line: 12 } }
