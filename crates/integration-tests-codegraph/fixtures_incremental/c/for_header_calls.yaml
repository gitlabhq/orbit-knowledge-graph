name: "C: a call in a loop header links"

fixtures:
  - path: loops.c
    content: |
      int start(void) { return 0; }

      int limit(void) { return 3; }

      int step(int i) { return i + 1; }

      int body_call(void) { return 1; }

      int header_calls(void) {
          for (int i = start(); i < limit(); i = step(i)) {
              body_call();
          }
          return 0;
      }

      int while_header(void) {
          int i = 0;
          while (i < limit()) {
              i = step(i);
          }
          return 0;
      }

      int do_header(void) {
          int i = 0;
          do {
              i = step(i);
          } while (i < limit());
          return 0;
      }

tests:
  - name: "calls in the init, condition and update of a for loop link"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = "header_calls"
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 4 }
      - { column_values: { field: callee, values: ["body_call", "limit", "start", "step"] } }

  - name: "a call in a while or do-while condition links"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name IN ["while_header", "do_header"]
      RETURN caller.name AS caller, callee.name AS callee
      ORDER BY caller, callee
    assert:
      - { row_count: 4 }
      - { row: { caller: do_header, callee: limit } }
      - { row: { caller: do_header, callee: step } }
      - { row: { caller: while_header, callee: limit } }
      - { row: { caller: while_header, callee: step } }
