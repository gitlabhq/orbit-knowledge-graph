name: "C: quoted includes resolve through the src and include roots"

fixtures:
  - path: include/calc/calc.h
    content: |
      int add(int a, int b);

  - path: include/flat.h
    content: |
      int flat(int a);

  - path: src/calc.c
    content: |
      #include "calc/calc.h"
      int add(int a, int b) { return a + b; }

  - path: src/flat.c
    content: |
      #include "flat.h"
      int flat(int a) { return a; }

  - path: src/main.c
    content: |
      #include "calc/calc.h"
      #include "flat.h"
      int run(void) { return add(1, 2) + flat(3); }

  - path: src/orphan.c
    content: |
      #include "missing/gone.h"
      int orphan(void) { return gone(); }

  - path: db/b.h
    content: |
      int stored(void);

  - path: db/b.c
    content: |
      #include "b.h"
      int stored(void) { return 4; }

  - path: db/a.c
    content: |
      #include "db/b.h"
      int fetch(void) { return stored(); }

tests:
  - name: "an include directory path and a flat include reach the header definitions"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'run'
      RETURN callee.name AS name
      ORDER BY name
    assert:
      - { row_count: 2 }
      - { row: { name: add } }
      - { row: { name: flat } }

  - name: "a missing header produces no edge"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'orphan'
      RETURN callee.name AS name
    assert:
      - { row_count: 0 }

  - name: "a repository-root-relative include reaches the header definition"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.name = 'fetch'
      RETURN callee.file_path AS file
    assert:
      - { row_count: 1 }
      - { row: { file: db/b.c } }
