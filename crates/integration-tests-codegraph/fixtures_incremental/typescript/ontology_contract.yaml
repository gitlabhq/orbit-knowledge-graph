name: "TypeScript: every Definition and Import column of the ontology contract"

fixtures:
  - path: src/shapes.ts
    content: |
      import { helper } from './util';
      import * as path from 'path';
      import './side';

      /** Shapes with an area. */
      export abstract class Shape {
        protected readonly id: number = 1;
        static count = 0;

        constructor(public owner: string) {}

        abstract area(): number;

        /** Scales the shape. */
        public static async scale(factor: number, label?: string): Promise<number> {
          return factor;
        }

        get label(): string {
          return helper(this.id);
        }

        *items(): Generator<number> {
          yield 1;
        }

        private describe() {
          function inner(x: number) { return x; }
          return inner(path.sep.length);
        }
      }

      export interface Named {
        name: string;
      }

      export enum Color { Red, Green = 2 }

      export type Id = string | number;

      export namespace Geometry {
        export function dist(a: number, b: number): number {
          return a - b;
        }
      }

      export const double = (x: number): number => x * 2;
      export const MAX: number = 10;
      export let counter = 0;

  - path: src/util.ts
    content: |
      /** Formats a number. */
      export function helper(n: number): string {
        return String(n);
      }

  - path: src/side.ts
    content: |
      export const loaded = true;

  - path: src/edges.ts
    content: |
      import { helper } from './util';
      import { Shape, Named, Color, MAX } from './shapes';
      import * as util from './util';

      function sealed(target: any) { return target; }

      class Point2 {
        x = 0;
        norm(): number { return this.x; }
      }

      @sealed
      class Circle extends Shape implements Named {
        name: string = 'c';
        center: Point2 = new Point2();

        area(): number {
          return MAX + Color.Red;
        }

        run(): string {
          const inferred = new Circle('i');
          inferred.area();
          util.helper(2);
          return helper(local());
        }

        measure(p: Point2): number {
          return p.norm();
        }

        size(p: Point2): number {
          return p.x;
        }
      }

      export function local(): number { return local2(); }
      function local2(): number { return 1; }

  - path: src/shapes.test.ts
    content: |
      import { helper } from './util';

      describe('formatting', () => {
        it('formats numbers', () => {
          helper(1);
        });
      });

  - path: src/uses.ts
    content: |
      class Holder {}
      class Item {}

      class Box {
        item: Item = new Item();
      }

      function pick(h: Holder): Item {
        return new Item();
      }

