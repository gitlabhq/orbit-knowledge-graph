      RETURN d.kind AS kind, d.language_kind AS language_kind, d.category AS category, d.scope AS scope, d.signature AS signature, d.parameters AS parameters, d.return_type AS return_type, d.declared_type AS declared_type, d.doc_comment AS doc_comment, d.modifiers AS modifiers, d.visibility AS visibility, d.generated_by AS generated_by, d.language AS language
    assert:
      - { row_count: 1 }
      - row:
          kind: "Test"
          language_kind: "Test"
          category: "Callable"
          scope: "local"
          signature: "it('formats numbers')"
          parameters: []
          return_type: null
          declared_type: null
          doc_comment: ""
          modifiers: []
          visibility: null
          generated_by: null
          language: "typescript"

  - name: "Import helper from ./util is symbol"
    query: |
      MATCH (i:Import) WHERE i.import_path = './util' AND i.name = 'helper' AND i.file_path = 'src/shapes.ts'
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
    assert:
      - { row_count: 1 }
      - row:
          name: "helper"
          alias: ""
          import_kind: "symbol"
          language_kind: "NamedImport"
          import_path: "./util"
          fqn: "src/util.helper"
          is_external: false

  - name: "Import * from path is module"
    query: |
      MATCH (i:Import) WHERE i.import_path = 'path' AND i.name = '*'
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
    assert:
      - { row_count: 1 }
      - row:
          name: "*"
          alias: "path"
          import_kind: "module"
          language_kind: "NamespaceImport"
          import_path: "path"
          fqn: "path"
          is_external: true

  - name: "Import ./side from ./side is side_effect"
    query: |
      MATCH (i:Import) WHERE i.import_path = './side' AND i.name = './side'
      RETURN i.name AS name, i.alias AS alias, i.import_kind AS import_kind, i.language_kind AS language_kind, i.import_path AS import_path, i.fqn AS fqn, i.is_external AS is_external
    assert:
      - { row_count: 1 }
      - row:
          name: "./side"
          alias: ""
          import_kind: "side_effect"
          language_kind: "SideEffectImport"
          import_path: "./side"
          fqn: "src/side"
          is_external: false

  - name: "The it block calls the function it tests"
    query: |
      MATCH (t:Definition)-[:CALLS]->(f:Definition)
      WHERE t.kind = 'Test' AND f.fqn = 'helper' AND f.kind = 'Function'
      RETURN t.name AS test
    assert:
      - { row_count: 1 }
      - { row: { test: "formats numbers" } }

  - name: "Every definition kind is in the closed kind list"
    query: |
      MATCH (d:Definition) WHERE NOT d.kind IN ['Class','Struct','Interface','Trait','Enum','TypeAlias','Function','Method','Constructor','Test','Field','Constant','Variable','EnumMember','Module','Macro']
      RETURN d.fqn LIMIT 100
    assert:
      - { empty: true }

  - name: "A call to a function in the same file is CALLS with resolution local"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'local' AND e.resolution = 'local'
      RETURN b.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "local2" } }

  - name: "A call to an imported function is CALLS with resolution import"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'Circle::run' AND e.resolution = 'import'
      RETURN b.fqn AS callee, b.file_path AS file
    assert:
      - { row_count: 1 }
      - { row: { callee: "helper", file: "src/util.ts" } }

  - name: "A call on a parameter of a declared type is CALLS with resolution declared_type"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'Circle::measure' AND e.resolution = 'declared_type'
      RETURN b.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "Point2::norm" } }

  - name: "A call on a value made by new is CALLS with resolution inferred_type"
    query: |
      MATCH (a:Definition)-[e:CALLS]->(b:Definition)
      WHERE a.fqn = 'Circle::run' AND e.resolution = 'inferred_type'
      RETURN b.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "Circle::area" } }

  - name: "new Circle() is INSTANTIATES with resolution local"
    query: |
      MATCH (a:Definition)-[e:INSTANTIATES]->(b:Definition)
      WHERE a.fqn = 'Circle::run' AND e.resolution = 'local'
      RETURN b.fqn AS target, b.kind AS kind
    assert:
      - { row_count: 1 }
      - { row: { target: "Circle", kind: "Class" } }

  - name: "A field read on a parameter of a declared type is USES_VALUE with resolution declared_type"
    query: |
      MATCH (a:Definition)-[e:USES_VALUE]->(b:Definition)
      WHERE a.fqn = 'Circle::size' AND e.resolution = 'declared_type'
      RETURN b.fqn AS target, b.kind AS kind
    assert:
      - { row_count: 1 }
      - { row: { target: "Point2::x", kind: "Field" } }

  - name: "edges: USES_TYPE from a parameter type has usage parameter"
    query: |
      MATCH (a:Definition)-[e:USES_TYPE]->(b:Definition)
      WHERE a.fqn = 'pick' AND b.fqn = 'Holder' AND e.usage = 'parameter'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }
      - { row: { src: "pick", dst: "Holder" } }

  - name: "edges: USES_TYPE from a return type has usage return"
    query: |
      MATCH (a:Definition)-[e:USES_TYPE]->(b:Definition)
      WHERE a.fqn = 'pick' AND b.fqn = 'Item' AND e.usage = 'return'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }
      - { row: { src: "pick", dst: "Item" } }

  - name: "edges: USES_TYPE from a field type has usage field"
    query: |
      MATCH (a:Definition)-[e:USES_TYPE]->(b:Definition)
      WHERE a.fqn = 'Box::item' AND b.fqn = 'Item' AND e.usage = 'field'
      RETURN a.fqn AS src, b.fqn AS dst
    assert:
      - { row_count: 1 }
      - { row: { src: "Box::item", dst: "Item" } }

  - name: "A module-level definition that is not exported has visibility file"
    query: |
      MATCH (d:Definition) WHERE d.file_path = 'src/uses.ts' AND d.scope = 'top_level'
      RETURN d.fqn AS fqn, d.visibility AS visibility
      ORDER BY fqn
    assert:
      - { row_count: 4 }
      - { row: { fqn: "Box", visibility: "file" } }
      - { row: { fqn: "Holder", visibility: "file" } }
      - { row: { fqn: "Item", visibility: "file" } }
      - { row: { fqn: "pick", visibility: "file" } }

  - name: "An imported superclass is EXTENDS with resolution import"
    query: |
      MATCH (a:Definition)-[e:EXTENDS]->(b:Definition)
      WHERE a.fqn = 'Circle' AND e.resolution = 'import'
      RETURN b.fqn AS parent, b.kind AS kind
    assert:
      - { row_count: 1 }
      - { row: { parent: "Shape", kind: "Class" } }

  - name: "An imported interface in implements is IMPLEMENTS with resolution import"
    query: |
      MATCH (a:Definition)-[e:IMPLEMENTS]->(b:Definition)
      WHERE a.fqn = 'Circle' AND e.resolution = 'import'
      RETURN b.fqn AS parent, b.kind AS kind
    assert:
      - { row_count: 1 }
      - { row: { parent: "Named", kind: "Interface" } }

  - name: "A method that replaces a superclass method is OVERRIDES with resolution import"
    query: |
      MATCH (a:Definition)-[e:OVERRIDES]->(b:Definition)
      WHERE a.fqn = 'Circle::area' AND e.resolution = 'import'
      RETURN b.fqn AS target
    assert:
      - { row_count: 1 }
      - { row: { target: "Shape::area" } }

  - name: "A class decorator is ANNOTATED_BY"
    query: |
      MATCH (a:Definition)-[e:ANNOTATED_BY]->(b:Definition)
      WHERE a.fqn = 'Circle'
      RETURN b.fqn AS decorator, b.kind AS kind
    assert:
      - { row_count: 1 }
      - { row: { decorator: "sealed", kind: "Function" } }

  - name: "A namespace DEFINES its members"
    query: |
      MATCH (a:Definition)-[e:DEFINES]->(b:Definition)
      WHERE a.fqn = 'Geometry'
      RETURN b.fqn AS member
    assert:
      - { row_count: 1 }
      - { row: { member: "Geometry::dist" } }

  - name: "A named import RESOLVES_TO the exported definition with resolution import"
    query: |
      MATCH (i:Import)-[e:RESOLVES_TO]->(d:Definition)
      WHERE i.file_path = 'src/edges.ts' AND i.name = 'Shape' AND e.resolution = 'import'
      RETURN d.fqn AS target, d.file_path AS file
    assert:
      - { row_count: 1 }
      - { row: { target: "Shape", file: "src/shapes.ts" } }

  - name: "A side-effect import RESOLVES_TO the file with resolution import"
    query: |
      MATCH (i:Import)-[e:RESOLVES_TO]->(f:File)
      WHERE i.name = './side' AND e.resolution = 'import'
      RETURN f.path AS target
    assert:
      - { row_count: 1 }
      - { row: { target: "src/side.ts" } }

  - name: "A file that imports from another file DEPENDS_ON it"
    query: |
      MATCH (a:File)-[e:DEPENDS_ON]->(b:File)
      WHERE a.path = 'src/edges.ts'
      RETURN b.path AS target
      ORDER BY target
    assert:
      - { row_count: 2 }
      - { column_values: { field: target, values: ["src/shapes.ts", "src/util.ts"] } }
