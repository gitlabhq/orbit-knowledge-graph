name: "Namespace reexports preserve their module identity"
fixtures:
  - path: left.ts
    content: |
      export function run() { leftBody(); }
      function leftBody() {}
  - path: right.ts
    content: |
      export function run() { rightBody(); }
      function rightBody() {}
  - path: barrel.ts
    content: |
      export * as left from './left';
      export * as right from './right';
      export function run() { unrelatedBody(); }
      function unrelatedBody() {}
  - path: main.ts
    content: |
      import { left, right } from './barrel';
      export function useLeft() { left.run(); }
      export function useRight() { right.run(); }
tests:
  - name: "namespace callers have exactly their selected direct targets"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(method:Definition)
      WHERE caller.file_path = 'main.ts'
      RETURN caller.name AS caller, method.name AS name, method.file_path AS file
    assert:
      - { row_count: 2 }
      - { row: { caller: useLeft, name: run, file: 'left.ts' } }
      - { row: { caller: useRight, name: run, file: 'right.ts' } }
  - name: "same-named members resolve only in their own namespace"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(method:Definition)-[:CALLS]->(body:Definition)
      WHERE caller.name IN ['useLeft', 'useRight']
      RETURN caller.name AS caller, body.name AS body
    assert:
      - { row_count: 2 }
      - { row: { caller: useLeft, body: leftBody } }
      - { row: { caller: useRight, body: rightBody } }
steps:
  - name: restore namespace identities
    snapshot: true
    tests:
      - name: "snapshot retains exactly the direct namespace targets"
        query: |
          MATCH (caller:Definition)-[:CALLS]->(method:Definition)
          WHERE caller.file_path = 'main.ts'
          RETURN caller.name AS caller, method.name AS name, method.file_path AS file
        assert:
          - { row_count: 2 }
          - { row: { caller: useLeft, name: run, file: 'left.ts' } }
          - { row: { caller: useRight, name: run, file: 'right.ts' } }
      - name: "snapshot loading preserves separate namespace targets"
        query: |
          MATCH (caller:Definition)-[:CALLS]->(method:Definition)-[:CALLS]->(body:Definition)
          WHERE caller.name IN ['useLeft', 'useRight']
          RETURN caller.name AS caller, body.name AS body
        assert:
          - { row_count: 2 }
          - { row: { caller: useLeft, body: leftBody } }
          - { row: { caller: useRight, body: rightBody } }
  - name: redirect a namespace export
    snapshot: true
    modify:
      - path: barrel.ts
        content: |
          export * as left from './right';
          export * as right from './right';
          export function run() { unrelatedBody(); }
          function unrelatedBody() {}
    tests:
      - name: "redirect replaces all direct namespace targets"
        query: |
          MATCH (caller:Definition)-[:CALLS]->(method:Definition)
          WHERE caller.file_path = 'main.ts'
          RETURN caller.name AS caller, method.name AS name, method.file_path AS file
        assert:
          - { row_count: 2 }
          - { row: { caller: useLeft, name: run, file: 'right.ts' } }
          - { row: { caller: useRight, name: run, file: 'right.ts' } }
      - name: "unchanged callers lose the previous namespace target"
        query: |
          MATCH (caller:Definition)-[:CALLS]->(method:Definition)-[:CALLS]->(body:Definition)
          WHERE caller.name IN ['useLeft', 'useRight']
          RETURN caller.name AS caller, body.name AS body
        assert:
          - { row_count: 2 }
          - { row: { caller: useLeft, body: rightBody } }
          - { row: { caller: useRight, body: rightBody } }
