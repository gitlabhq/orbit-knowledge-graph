name: "TypeScript: class inheritance and implements"
pipeline: js

fixtures:
  - path: main.ts
    content: |
      interface Speakable {
          speak(): string;
      }

      class Animal {
          name: string = "";
          greet(): string { return `I am ${this.name}`; }
      }

      class Dog extends Animal implements Speakable {
          speak(): string { return "woof"; }
          fetch(): void { this.greet(); }
      }

      class Puppy extends Dog {
          play(): void {
              this.speak();
              this.greet();
          }
      }

tests:
  - name: All definitions with correct types
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'main.ts'
        AND d.definition_type IN ['Interface', 'Class', 'Method']
      RETURN d.name AS name, d.definition_type AS type
      ORDER BY name
    assert:
      - { row_count: 8 }
      - { unique: name }
      - { row: { name: "Animal", type: "Class" } }
      - { row: { name: "Dog", type: "Class" } }
      - { row: { name: "Puppy", type: "Class" } }
      - { row: { name: "Speakable", type: "Interface" } }
      - { row: { name: "fetch", type: "Method" } }
      - { row: { name: "greet", type: "Method" } }
      - { row: { name: "play", type: "Method" } }
      - { row: { name: "speak", type: "Method" } }

  - name: extends and implements become Extends edges
    query: |
      MATCH (c:Definition)-[:EXTENDS]->(p:Definition)
      WHERE c.file_path = 'main.ts'
      RETURN c.name AS child, p.name AS parent
      ORDER BY child, parent
    assert:
      - { row_count: 3 }
      - { row: { child: "Dog", parent: "Animal" } }
      - { row: { child: "Dog", parent: "Speakable" } }
      - { row: { child: "Puppy", parent: "Dog" } }

  - name: Dog.fetch() resolves this.greet() through extends
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'fetch' AND callee.name = 'greet'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }

  - name: Puppy.play() resolves inherited this calls
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'play'
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - column_values:
          field: callee
          values: [greet, speak]
