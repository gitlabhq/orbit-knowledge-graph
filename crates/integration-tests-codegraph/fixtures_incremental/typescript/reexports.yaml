name: "TypeScript: re-exports"
pipeline: js

fixtures:
  - path: models.ts
    content: |
      export class User {}
      export class Admin {}

  - path: index.ts
    content: |
      export { User } from './models';
      export { Admin as SuperAdmin } from './models';

  - path: main.ts
    content: |
      import { User, SuperAdmin } from './index';

      function run(): void {
          const u = new User();
          const a = new SuperAdmin();
      }

tests:
  # corrected: contract: a call that creates an instance of a type is INSTANTIATES
  - name: main.ts imports resolve through re-export to original defs
    query: |
      MATCH (caller:Definition)-[e:INSTANTIATES]->(callee:Definition)
      WHERE caller.name = 'run'
      RETURN callee.name AS callee, callee.file_path AS file
      ORDER BY callee
    assert:
      - { row_count: 2 }
      - { row: { callee: "Admin", file: "models.ts" } }
      - { row: { callee: "User", file: "models.ts" } }
