- path: com/example/foo/Foo.kt
  content: |
    package com.example.foo

    class Foo : Bar() {
        companion object {
            fun companionFoo() {}
        }

        fun fooInFooBody() {}

        fun foo() {
            super.bar()
            fooInFooBody()
        }

        inner class InnerFoo {
            fun innerFoo() {
                fooInFooBody()
            }
        }
    }

- path: com/example/if/If.kt
  content: |
    package com.example.if

    import com.example.entites.Admin
    import com.example.entites.User

    data class IfConfig(val isAdmin: Boolean)

    fun ifTypeInference(config: IfConfig) = if (config.isAdmin) Admin() else User()

    fun usageOfIfTypeInference(config: IfConfig) {
        ifTypeInference(config).getName()
    }

- path: com/example/nestedclasses/Nested.kt
  content: |
    package com.example.nestedclasses

    class Parent {
        class Child {
            open class GrandChild {
                open fun greet() {
                    println("Hello")
                }
            }
        }

        class GrandChild : Child.GrandChild() {
            override fun greet() {
                super.greet()
            }
        }
    }

- path: com/example/operator/AnimalList.kt
  content: |
    package com.example.operator

    class AnimalList {
        companion object {
            fun of(list1: AnimalList, list2: AnimalList): AnimalList {
                return (list1 + list2).display()
            }
        }

        operator fun plus(other: AnimalList): AnimalList = AnimalList()
        fun display() = Unit
    }

- path: com/example/try/Try.kt
  content: |
    package com.example.try

    import com.example.entites.Admin
    import com.example.entites.User

    data class TryConfig(val isAdmin: Boolean)

    fun tryTypeInference(config: TryConfig?) {
        val result = try {
            if (config == null) {
                throw Exception("config is null")
            } else if (config.isAdmin) {
                Admin()
            } else {
                User()
            }
        } catch (e: Exception) {
            e.printStackTrace()
            null
        }
        result?.getName()
    }

- path: com/example/when/When.kt
  content: |
    package com.example.when

    import com.example.entites.Admin
    import com.example.entites.User

    data class Config(val type: String)

    fun whenTypeInference(config: Config) {
        val person = when (config.type) {
            "admin" -> Admin()
            else -> User()
        }
        person.getName()
    }
