- path: com/example/extensions/Extensions.kt
  content: |
    package com.example.extensions

    import com.example.extensions.utils.*
    import com.example.extensions.entities.ExtendMe
    import com.example.extensions.entities.ExtendMeFromProperty

    fun ExtendMe.printValue() {
        println(value)
    }

    val ExtendMe.extend
        get() = ExtendMeFromProperty(value, "<wrapper>")

    fun callToExtensions() {
        val extendMe = ExtendMe("Hello")
        extendMe.printValue()
        extendMe.extend.printValue()
    }

    fun callToImportedExtensions() {
        val extendMe = ExtendMe("Hello")
        extendMe.reverse()
        extendMe.reversed.printValue()
    }

- path: com/example/extensions/entities/Entities.kt
  content: |
    package com.example.extensions.entities

    data class ExtendMe(val value: String)

    data class ExtendMeFromProperty(val value: String, val wrapper: String) {
        fun printValue() {
            println(wrapper)
            println(value)
            println(wrapper)
        }
    }

- path: com/example/extensions/imported/Imported.kt
  content: |
    package com.example.extensions.imported

    import external.ExternalType

    fun ExternalType.print() {
        println(this.value)
    }

    fun callToImported() {
        val externalType = ExternalType("Hello")
        externalType.print()
    }

