name: "Python: a diamond emits every shallowest-depth candidate"
fixtures:
  - path: shapes.py
    content: |
      class B:
          def m(self):
              pass

      class C:
          def m(self):
              pass

      class D(B, C):
          pass

      def use():
          d = D()
          d.m()

tests:
  - name: "d.m() on a D emits both shallowest candidates, B.m and C.m"
    query: |
      MATCH (caller:Definition)-[e:CALLS]->(callee:Definition)
      WHERE caller.name = 'use' AND callee.name = 'm'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 2 }
      - { row: { callee: "shapes.B.m" } }
      - { row: { callee: "shapes.C.m" } }
