name: "Java: unknown-argument overload fan-out is capped"

fixtures:
  - path: p/AtCap.java
    content: |
      package p;

      class AtCap {
        static void f(Klass0 x) {}
        static void f(Klass1 x) {}
        static void f(Klass2 x) {}
        static void f(Klass3 x) {}
        static void f(Klass4 x) {}
        static void f(Klass5 x) {}
        static void f(Klass6 x) {}
        static void f(Klass7 x) {}
        static void f(Klass8 x) {}
        static void f(Klass9 x) {}
        static void f(Klass10 x) {}
        static void f(Klass11 x) {}
        static void f(Klass12 x) {}
        static void f(Klass13 x) {}
        static void f(Klass14 x) {}
        static void f(Klass15 x) {}
        static void f(Klass16 x) {}
        static void f(Klass17 x) {}
        static void f(Klass18 x) {}
        static void f(Klass19 x) {}
        static void f(Klass20 x) {}
        static void f(Klass21 x) {}
        static void f(Klass22 x) {}
        static void f(Klass23 x) {}
        static void f(Klass24 x) {}
        static void f(Klass25 x) {}
        static void f(Klass26 x) {}
        static void f(Klass27 x) {}
        static void f(Klass28 x) {}
        static void f(Klass29 x) {}
        static void f(Klass30 x) {}
        static void f(Klass31 x) {}
        static int g() { return 1; }
        void caller() {
          f(g());
        }
        void userType(Foo foo) {
          f(foo);
        }
        void nullArg() {
          f(null);
        }
        void known() {
          Klass0 c = null;
          f(c);
        }
      }

  - path: p/OverCap.java
    content: |
      package p;

      class OverCap {
        static void f(Klass0 x) {}
        static void f(Klass1 x) {}
        static void f(Klass2 x) {}
        static void f(Klass3 x) {}
        static void f(Klass4 x) {}
        static void f(Klass5 x) {}
        static void f(Klass6 x) {}
        static void f(Klass7 x) {}
        static void f(Klass8 x) {}
        static void f(Klass9 x) {}
        static void f(Klass10 x) {}
        static void f(Klass11 x) {}
        static void f(Klass12 x) {}
        static void f(Klass13 x) {}
        static void f(Klass14 x) {}
        static void f(Klass15 x) {}
        static void f(Klass16 x) {}
        static void f(Klass17 x) {}
        static void f(Klass18 x) {}
        static void f(Klass19 x) {}
        static void f(Klass20 x) {}
        static void f(Klass21 x) {}
        static void f(Klass22 x) {}
        static void f(Klass23 x) {}
        static void f(Klass24 x) {}
        static void f(Klass25 x) {}
        static void f(Klass26 x) {}
        static void f(Klass27 x) {}
        static void f(Klass28 x) {}
        static void f(Klass29 x) {}
        static void f(Klass30 x) {}
        static void f(Klass31 x) {}
        static void f(Klass32 x) {}
        static void f(String x) {}
        static int g() { return 1; }
        void caller() {
          f(g());
        }
        void userType(Foo foo) {
          f(foo);
        }
        void nullArg() {
          f(null);
        }
        void known() {
          String s = "x";
          f(s);
        }
      }

  - path: p/Types.java
    content: |
      package p;

      class Foo {}
      class Klass0 {}
      class Klass1 {}
      class Klass2 {}
      class Klass3 {}
      class Klass4 {}
      class Klass5 {}
      class Klass6 {}
      class Klass7 {}
      class Klass8 {}
      class Klass9 {}
      class Klass10 {}
      class Klass11 {}
      class Klass12 {}
      class Klass13 {}
      class Klass14 {}
      class Klass15 {}
      class Klass16 {}
      class Klass17 {}
      class Klass18 {}
      class Klass19 {}
      class Klass20 {}
      class Klass21 {}
      class Klass22 {}
      class Klass23 {}
      class Klass24 {}
      class Klass25 {}
      class Klass26 {}
      class Klass27 {}
      class Klass28 {}
      class Klass29 {}
      class Klass30 {}
      class Klass31 {}
      class Klass32 {}

tests:
  - name: "exactly 32 overloads still fan out for an unknown argument"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'p.AtCap.caller' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 100
    assert:
      - { row_count: 32 }

  - name: "more than 32 overloads fall back to the original candidates"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'p.OverCap.caller' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 100
    assert:
      - { row_count: 1 }

  - name: "known arguments still pick one overload past the cap"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'p.OverCap.known' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 100
    assert:
      - { row_count: 1 }
      - { row: { signature: "(String)" } }

  - name: "AtCap: a known non-final argument (userType)"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'p.AtCap.userType' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 100
    assert:
      - { row_count: 32 }

  - name: "AtCap: a null argument (nullArg)"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'p.AtCap.nullArg' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 100
    assert:
      - { row_count: 32 }

  - name: "OverCap: a known non-final argument (userType)"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'p.OverCap.userType' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 100
    assert:
      - { row_count: 1 }

  - name: "OverCap: a null argument (nullArg)"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'p.OverCap.nullArg' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 100
    assert:
      - { row_count: 1 }
