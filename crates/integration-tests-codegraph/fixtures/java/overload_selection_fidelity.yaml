name: "Java: overload selection keeps proven and possible overloads apart"

fixtures:
  - path: q/Types.java
    content: |
      package q;

      class Foo {}
      class Widget {}
      class IO {}

  - path: q/Obj.java
    content: |
      package q;

      class Obj {
        static void f(Object o) {}
        static void f(Foo foo) {}

        void objectArgument() {
          Object obj = null;
          f(obj);
        }
      }

  - path: q/Spec.java
    content: |
      package q;

      class Spec {
        static void f(Foo foo) {}
        static void f(Object o) {}

        void unrelatedClass() {
          Widget w = null;
          f(w);
        }

        void exactMatch() {
          Foo foo = null;
          f(foo);
        }
      }

  - path: q/TyVar.java
    content: |
      package q;

      class TyVar {
        static void f(IO io) {}
        static void f(Foo foo) {}

        void shortClassName() {
          IO io = null;
          f(io);
        }
      }

  - path: q/Scopes.java
    content: |
      package q;

      class Res implements AutoCloseable {
        public void close() {}
      }

      class Scopes {
        String name;
        String e;

        static void k(String s) {}
        static void k(IllegalStateException x) {}
        static void r(String s) {}
        static void r(Res x) {}

        void resourceBody() throws Exception {
          try (Res name = new Res()) {
            r(name);
          }
        }

        void catchBody() {
          try {
            k(e);
          } catch (IllegalStateException e) {
            k(e);
          }
        }

        void fieldOutsideTry() {
          k(name);
        }
      }

  - path: q/Phases.java
    content: |
      package q;

      class Phases {
        static void b(Foo foo) {}
        static void b(Object... rest) {}
        static void c(IO io) {}
        static void c(int i) {}
        static void h(Object[] a) {}
        static void h(Object o) {}

        void possibleThenVarargs() {
          Widget w = null;
          b(w);
        }

        void possibleThenUnboxing() {
          Integer i = 1;
          c(i);
        }

        void referenceArray() {
          String[] arr = null;
          h(arr);
        }
      }

  - path: q/ResourceScope.java
    content: |
      package q;

      class ResourceScope {
        String name;

        static void s(String v) {}
        static void s(Res v) {}

        void inCatch() {
          try (Res name = new Res()) {
          } catch (RuntimeException x) {
            s(name);
          }
        }

        void inFinally() {
          try (Res name = new Res()) {
          } finally {
            s(name);
          }
        }
      }

  - path: q/Chars.java
    content: |
      package q;

      class Chars {
        static void n(Number v) {}
        static void n(Object v) {}

        void charLiteral() {
          n('a');
        }

        void characterArgument() {
          Character c = 'a';
          n(c);
        }

        void integerArgument() {
          Integer i = 1;
          n(i);
        }
      }

tests:
  - name: "an Object argument reaches only the Object overload"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Obj.objectArgument' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Object)" } }

  - name: "an unrelated class keeps the possible overload next to the proven one"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Spec.unrelatedClass' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 2 }
      - { row: { signature: "(Foo)" } }
      - { row: { signature: "(Object)" } }

  - name: "an exact match still beats Object"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Spec.exactMatch' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Foo)" } }

  - name: "a short class name is not dropped as a type variable"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.TyVar.shortClassName' AND callee.name = 'f'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row: { signature: "(IO)" } }

  - name: "a try-with-resources variable shadows the field in the body"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Scopes.resourceBody' AND callee.name = 'r'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Res)" } }

  - name: "a catch parameter shadows the field only in the catch body"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Scopes.catchBody' AND callee.name = 'k'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 2 }
      - { row: { signature: "(String)" } }
      - { row: { signature: "(IllegalStateException)" } }

  - name: "outside the try the field type applies"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Scopes.fieldOutsideTry' AND callee.name = 'k'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(String)" } }

  - name: "a possible-only phase keeps the proven overload of a later phase"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Phases.possibleThenVarargs' AND callee.name = 'b'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 2 }
      - { row: { signature: "(Foo)" } }
      - { row: { signature: "(Object...)" } }

  - name: "a possible-only strict phase keeps the unboxing overload"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Phases.possibleThenUnboxing' AND callee.name = 'c'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 2 }
      - { row: { signature: "(IO)" } }
      - { row: { signature: "(int)" } }

  - name: "a reference array reaches Object[] as the most specific overload"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Phases.referenceArray' AND callee.name = 'h'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Object[])" } }

  - name: "a resource variable is not in scope in catch"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.ResourceScope.inCatch' AND callee.name = 's'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(String)" } }

  - name: "a resource variable is not in scope in finally"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.ResourceScope.inFinally' AND callee.name = 's'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(String)" } }

  - name: "Chars.charLiteral picks (Object)"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Chars.charLiteral' AND callee.name = 'n'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Object)" } }

  - name: "Chars.characterArgument picks (Object)"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Chars.characterArgument' AND callee.name = 'n'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Object)" } }

  - name: "Chars.integerArgument picks (Number)"
    query: |
      MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
      WHERE caller.fqn = 'q.Chars.integerArgument' AND callee.name = 'n'
      RETURN callee.signature AS signature
      LIMIT 10
    assert:
      - { row_count: 1 }
      - { row: { signature: "(Number)" } }
