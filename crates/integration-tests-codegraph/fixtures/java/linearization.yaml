name: "Java: a superclass method beats an interface default; two defaults are ambiguous"
fixtures:
  - path: com/example/lin/I.java
    content: |
      package com.example.lin;
      public interface I { default void m() {} }
  - path: com/example/lin/J.java
    content: |
      package com.example.lin;
      public interface J { default void m() {} }
  - path: com/example/lin/A.java
    content: |
      package com.example.lin;
      public class A { public void m() {} }
  - path: com/example/lin/C.java
    content: |
      package com.example.lin;
      public class C extends A implements I {}
  - path: com/example/lin/D.java
    content: |
      package com.example.lin;
      public class D implements I, J {}
  - path: com/example/lin/Use.java
    content: |
      package com.example.lin;
      public class Use {
          void viaClass() { new C().m(); }
          void viaTwoDefaults() { new D().m(); }
      }

tests:
  - name: "C.m() resolves to the superclass method A.m, not the interface default (JLS 8.4.8.4)"
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.fqn = 'com.example.lin.Use.viaClass' AND e.edge_kind = 'Calls' AND callee.name = 'm'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "com.example.lin.A.m" } }
  - name: "D.m() with two inherited defaults is ambiguous and yields no call (JLS 9.4.1.3)"
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.fqn = 'com.example.lin.Use.viaTwoDefaults' AND e.edge_kind = 'Calls' AND callee.name = 'm'
      RETURN callee.fqn AS callee
    assert:
      - { empty: true }
