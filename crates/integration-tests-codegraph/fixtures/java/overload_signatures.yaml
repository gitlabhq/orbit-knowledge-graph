name: "Java: overload signatures"

fixtures:
  - path: com/example/App.java
    content: |
      package com.example;

      import java.util.List;
      import java.util.Map;

      public class App {
          public App() {}

          public App(String name, int... counts) {}

          public static int plusMethod(int a, int b) {
              return a + b;
          }

          public static double plusMethod(double a, double b) {
              return a + b;
          }

          public static String plusMethod(String a, String b) {
              return a + b;
          }

          public int add(int a) {
              return a;
          }

          public int add(List<String> items, Map<String, List<Integer>> index, int[] raw, String tail[]) {
              return 0;
          }

          public void log(String... messages) {}

          public void declared(final @Deprecated String a, @Deprecated int... rest) {}

          public void typeUse(@Nullable Object @Nullable [] arr, java.util.@Nullable List<String> list) {}

          public void multiDim(int @A [] @B [] grid, int flat[]) {}

          public void receiver(App this, int x) {}

          public void brokenSpread(int x, String @NonNull ... xs) {}
      }

  - path: com/example/Child.java
    content: |
      package com.example;

      public class Child extends App {
          public int add(long a) {
              return 0;
          }
      }

tests:
  - name: "plusMethod overloads carry distinct signatures"
    query: |
      MATCH (m:Definition)
      WHERE m.name = 'plusMethod'
      RETURN m.parameter_types AS parameter_types
      ORDER BY m.start_line
    assert:
      - { row_count: 3 }
      - { row: { parameter_types: "(int, int)" } }
      - { row: { parameter_types: "(double, double)" } }
      - { row: { parameter_types: "(String, String)" } }

  - name: "instance method overloads, including one inherited from a parent, carry distinct signatures"
    query: |
      MATCH (m:Definition)
      WHERE m.name = 'add'
      RETURN m.fqn AS fqn, m.parameter_types AS parameter_types
      ORDER BY m.start_line
    assert:
      - { row_count: 3 }
      - { row: { fqn: "com.example.App.add", parameter_types: "(int)" } }
      - { row: { fqn: "com.example.App.add", parameter_types: "(List, Map, int[], String[])" } }
      - { row: { fqn: "com.example.Child.add", parameter_types: "(long)" } }

  - name: "varargs keep their marker"
    query: |
      MATCH (m:Definition)
      WHERE m.name = 'log'
      RETURN m.parameter_types AS parameter_types
    assert:
      - { row_count: 1 }
      - { row: { parameter_types: "(String...)" } }

  - name: "constructors carry signatures"
    query: |
      MATCH (m:Definition)
      WHERE m.definition_type = 'Constructor' AND m.fqn = 'com.example.App.App'
      RETURN m.parameter_types AS parameter_types
    assert:
      - { row_count: 2 }
      - { row: { parameter_types: "()" } }
      - { row: { parameter_types: "(String, int...)" } }

  - name: "classes carry no parameter types"
    query: |
      MATCH (c:Definition)
      WHERE c.name = 'App' AND c.definition_type = 'Class'
      RETURN c.parameter_types AS parameter_types
    assert:
      - { row_count: 1 }
      - { row: { parameter_types: "" } }

  - name: "declaration annotations and modifiers are dropped"
    query: |
      MATCH (m:Definition)
      WHERE m.name = 'declared'
      RETURN m.parameter_types AS parameter_types
    assert:
      - { row_count: 1 }
      - { row: { parameter_types: "(String, int...)" } }

  - name: "type-use annotations are not part of the signature"
    query: |
      MATCH (m:Definition)
      WHERE m.name = 'typeUse' OR m.name = 'multiDim'
      RETURN m.name AS name, m.parameter_types AS parameter_types
    assert:
      - { row_count: 2 }
      - { row: { name: "typeUse", parameter_types: "(Object[], java.util.List)" } }
      - { row: { name: "multiDim", parameter_types: "(int[][], int[])" } }

  - name: "a parameter list that does not parse stores no parameter types"
    query: |
      MATCH (m:Definition)
      WHERE m.name = 'brokenSpread'
      RETURN m.parameter_types AS parameter_types
    assert:
      - { row_count: 1 }
      - { row: { parameter_types: "" } }

  - name: "receiver parameters are not part of the signature"
    query: |
      MATCH (m:Definition)
      WHERE m.name = 'receiver'
      RETURN m.parameter_types AS parameter_types
    assert:
      - { row_count: 1 }
      - { row: { parameter_types: "(int)" } }
