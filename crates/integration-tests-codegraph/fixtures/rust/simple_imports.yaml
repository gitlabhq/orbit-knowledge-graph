name: "Rust: simple use imports and cross-file resolution"
pipeline: rust
fixtures:
  - path: models.rs
    content: |
      pub struct User {
          pub name: String,
      }

      pub fn create_user(name: &str) -> User {
          User { name: name.into() }
      }

  - path: main.rs
    content: |
      use crate::models::create_user;

      fn run() {
          let u = create_user("alice");
      }

tests:
  - name: Exactly 1 import extracted
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = 'main.rs'
      RETURN i.name AS name
    assert:
      - { row_count: 1 }
      - { row: { name: "create_user" } }

  - name: No imports from models.rs
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = 'models.rs'
      RETURN count(i) AS n
    assert:
      - { row_count: 1 }
      - { row: { n: 0 } }

  - name: Cross-file call from run to create_user
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.name = 'run' AND callee.name = 'create_user'
        AND caller.file_path <> callee.file_path
        AND e.edge_kind = 'Calls'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }

  - name: Exactly 2 Rust files
    query: |
      MATCH (f:File)
      RETURN f.path AS path, f.language AS lang
      ORDER BY path
    assert:
      - { row_count: 2 }
      - { match: { field: lang, pattern: "rust" } }
      - { column_values: { field: path, values: ["main.rs", "models.rs"] } }

  - name: All definitions across both files
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type IN ['Struct', 'Function']
      RETURN d.name AS name, d.file_path AS file
      ORDER BY name
    assert:
      - { row_count: 3 }
      - { unique: name }
      - { row: { name: "User", file: "models.rs" } }
      - { row: { name: "create_user", file: "models.rs" } }
      - { row: { name: "run", file: "main.rs" } }
