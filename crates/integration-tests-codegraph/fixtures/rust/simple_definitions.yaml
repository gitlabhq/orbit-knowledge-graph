name: "Rust: simple definitions"
pipeline: rust
fixtures:
  - path: main.rs
    content: |
      pub struct Dog {
          sound: String,
      }

      pub enum Color {
          Red,
          Green,
          Blue,
      }

      pub trait Animal {
          fn speak(&self) -> &str;
      }

      pub fn greet(name: &str) -> String {
          format!("hello {name}")
      }

      const MAX: usize = 100;

      type Result<T> = std::result::Result<T, String>;

tests:
  - name: All 6 definitions with correct types
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'main.rs'
        AND d.definition_type IN ['Struct', 'Enum', 'Trait', 'Function', 'Const', 'TypeAlias']
      RETURN d.name AS name, d.definition_type AS type
      ORDER BY name
    assert:
      - { row_count: 6 }
      - { unique: name }
      - { no_nulls: name }
      - { row: { name: "Animal", type: "Trait" } }
      - { row: { name: "Color", type: "Enum" } }
      - { row: { name: "Dog", type: "Struct" } }
      - { row: { name: "MAX", type: "Const" } }
      - { row: { name: "Result", type: "TypeAlias" } }
      - { row: { name: "greet", type: "Function" } }

  - name: No spurious definitions
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'main.rs' AND (d.name IS NULL OR d.name = '')
      RETURN count(d) AS n
    assert:
      - { row_count: 1 }
      - { row: { n: 0 } }

  - name: Exactly 1 Rust file
    query: |
      MATCH (f:File)
      RETURN f.path AS path, f.language AS lang
    assert:
      - { row_count: 1 }
      - { row: { path: "main.rs", lang: "rust" } }

  - name: No call edges (no function calls in this fixture)
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE e.edge_kind = 'Calls'
      RETURN count(*) AS n
    assert:
      - { row_count: 1 }
      - { row: { n: 0 } }
