name: "Kotlin: a local definition shadows a predeclared default-import name"
fixtures:
  - path: src/main/kotlin/com/ex/Main.kt
    content: |
      package com.ex
      fun listOf(x: Int): Int = x
      fun main() {
          listOf(1)
      }

tests:
  - name: "listOf(1) resolves to the file's own listOf"
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.fqn = 'com.ex.main' AND e.edge_kind = 'Calls'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: com.ex.listOf } }
