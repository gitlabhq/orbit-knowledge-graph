name: "YAML: GitLab CI jobs, stages, variables, and include imports"

fixtures:
  - path: .gitlab-ci.yml
    content: |
      stages: [lint, test]

      variables:
        CARGO_HOME: .cargo
        RUST_BACKTRACE: "1"

      include:
        - '/ci/lint.gitlab-ci.yml'
        - project: gitlab-org/pipeline-common
          ref: main
          file: [/templates/build.yml, /templates/test.yml]
        - template: Security/SAST.gitlab-ci.yml
        - component: gitlab.com/components/scan@1.2.0
        - remote: https://example.com/ci.yml

      default:
        image: alpine

      .base:
        image: alpine

      unit-test:
        extends: .base
        stage: test
        script: [true]

      deploy:
        stage: test
        trigger:
          include:
            project: gitlab-org/child
            file: /child.yml
  - path: ci/lint.gitlab-ci.yml
    content: |
      lint:
        stage: lint
        script: [true]

tests:
  - name: "CI files are indexed as yaml"
    query: |
      MATCH (f:File)
      RETURN f.path AS path, f.language AS language
    assert:
      - { row_count: 2 }
      - { row: { path: ".gitlab-ci.yml", language: yaml } }
      - { row: { path: "ci/lint.gitlab-ci.yml", language: yaml } }

  - name: "Author-named root keys become CiJob definitions; global keywords do not"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'CiJob'
      RETURN d.fqn AS fqn, d.file_path AS file
    assert:
      - { row_count: 4 }
      - { unique: fqn }
      - { row: { fqn: ".base", file: ".gitlab-ci.yml" } }
      - { row: { fqn: "unit-test", file: ".gitlab-ci.yml" } }
      - { row: { fqn: "deploy", file: ".gitlab-ci.yml" } }
      - { row: { fqn: "lint", file: "ci/lint.gitlab-ci.yml" } }

  - name: "Stages and variables are namespaced under their keyword"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type IN ['CiStage', 'CiVariable']
      RETURN d.definition_type AS type, d.fqn AS fqn
    assert:
      - { row_count: 4 }
      - { row: { type: CiStage, fqn: "stages.lint" } }
      - { row: { type: CiStage, fqn: "stages.test" } }
      - { row: { type: CiVariable, fqn: "variables.CARGO_HOME" } }
      - { row: { type: CiVariable, fqn: "variables.RUST_BACKTRACE" } }

  - name: "Every include flavor becomes a typed import, including child-pipeline triggers"
    query: |
      MATCH (i:ImportedSymbol)
      RETURN i.import_type AS type, i.path AS path, i.name AS name, i.alias AS alias
    assert:
      - { row_count: 7 }
      - { row: { type: CiLocalInclude, path: "/ci/lint.gitlab-ci.yml", name: null, alias: null } }
      - { row: { type: CiProjectInclude, path: "gitlab-org/pipeline-common", name: "/templates/build.yml", alias: main } }
      - { row: { type: CiProjectInclude, path: "gitlab-org/pipeline-common", name: "/templates/test.yml", alias: main } }
      - { row: { type: CiTemplateInclude, path: "Security/SAST.gitlab-ci.yml", name: null, alias: null } }
      - { row: { type: CiComponentInclude, path: "gitlab.com/components/scan", name: null, alias: "1.2.0" } }
      - { row: { type: CiRemoteInclude, path: "https://example.com/ci.yml", name: null, alias: null } }
      - { row: { type: CiProjectInclude, path: "gitlab-org/child", name: "/child.yml", alias: null } }

  - name: "Imports carry a real source range"
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.import_type = 'CiRemoteInclude'
      RETURN i.start_line AS start_line
    assert:
      - { row_count: 1 }
      - { row: { start_line: 14 } }
