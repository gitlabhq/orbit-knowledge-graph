name: "YAML ontology contract: kinds, content columns, imports, files, and edges"

fixtures:
  - path: config/app.yml
    content: |
      defaults: &defaults
        adapter: postgres
      production:
        <<: *defaults

  - path: spec/fixtures/test.yml
    content: |
      a: 1

  - path: vendor/lib/x.yml
    content: |
      b: 2

tests:
  - name: "Kinds, categories, language kinds, and scopes"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.file_path IN ['config/app.yml']
          RETURN d.name AS name, d.kind AS kind, d.category AS category, d.language_kind AS lk, d.scope AS scope
          LIMIT 100
        assert:
          - { row: { name: "defaults", kind: "Variable", category: "Value", lk: "Anchor", scope: "top_level" } }

  - name: "Closed lists for kind, category, and scope"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.kind IN ['Class', 'Struct', 'Interface', 'Trait', 'Enum', 'TypeAlias', 'Function', 'Method', 'Constructor', 'Test', 'Field', 'Constant', 'Variable', 'EnumMember', 'Module', 'Macro']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.category IN ['Type', 'Callable', 'Value', 'Module', 'Macro']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.scope IN ['top_level', 'member', 'local']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "No modifier rules"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE 'static' IN d.modifiers
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "No visibility rule"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.visibility IS NOT NULL
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "No generated members"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.generated_by IS NOT NULL
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "File flags"
    queries:
      - query: |
          MATCH (f:File)
          RETURN f.path AS path, f.is_test AS is_test, f.is_vendored AS is_vendored, f.is_generated AS is_generated, f.skip_reason AS skip_reason
          LIMIT 100
        assert:
          - { row: { path: "spec/fixtures/test.yml", is_test: true, is_vendored: false, is_generated: false, skip_reason: "" } }
          - { row: { path: "config/app.yml", is_test: false, is_vendored: false, is_generated: false } }
          - { row: { path: "vendor/lib/x.yml", is_test: false, is_vendored: true } }

  - name: "No declaration text for this language"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.signature <> ''
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "No return type and no declared type"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.return_type IS NOT NULL
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }
      - query: |
          MATCH (d:Definition)
          WHERE d.declared_type IS NOT NULL
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }
