name: "YAML: unclaimed files keep their File node plus anchors and aliases"

fixtures:
  - path: config/default.yaml
    content: |
      billing:
        quota:
          enabled: true
      defaults: &base
        retries: 2
      job:
        <<: *base
  - path: config/MyChart.yaml
    content: |
      dependencies:
        - name: redis

tests:
  - name: "Unclaimed YAML is still indexed as yaml File nodes"
    query: |
      MATCH (f:File)
      RETURN f.path AS path, f.language AS language
    assert:
      - { row_count: 2 }
      - { row: { path: "config/default.yaml", language: yaml } }
      - { row: { path: "config/MyChart.yaml", language: yaml } }

  - name: "Mapping keys in unclaimed files are not definitions"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type <> 'Anchor'
      RETURN d.fqn AS fqn
    assert:
      - { row_count: 0 }

  - name: "Anchors are definitions in every YAML file"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Anchor'
      RETURN d.fqn AS fqn, d.file_path AS file
    assert:
      - { row_count: 1 }
      - { row: { fqn: base, file: "config/default.yaml" } }

  - name: "A Chart.yaml-suffixed name that is not Chart.yaml yields no imports"
    query: |
      MATCH (i:ImportedSymbol)
      RETURN i.path AS path
    assert:
      - { row_count: 0 }
