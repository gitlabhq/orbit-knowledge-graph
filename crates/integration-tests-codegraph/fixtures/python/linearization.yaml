name: "Python: diamond resolves by C3 order, leftmost base wins"
fixtures:
  - path: shapes.py
    content: |
      class B:
          def m(self):
              pass

      class C:
          def m(self):
              pass

      class D(B, C):
          pass

      def use():
          d = D()
          d.m()

tests:
  - name: "d.m() on a D resolves to the leftmost base B.m"
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.name = 'use' AND e.edge_kind = 'Calls' AND callee.name = 'm'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "shapes.B.m" } }
