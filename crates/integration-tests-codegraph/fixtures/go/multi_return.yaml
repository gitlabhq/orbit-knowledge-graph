name: "Go: chained calls and short var declarations"

fixtures:
  - path: chain.go
    content: |
      package main

      type Builder struct{}

      func NewBuilder() *Builder {
          return &Builder{}
      }

      func (b *Builder) SetName(name string) *Builder {
          return b
      }

      func (b *Builder) SetAge(age int) *Builder {
          return b
      }

      func (b *Builder) Build() string {
          return ""
      }

      func useBuilder() {
          b := NewBuilder()
          b.SetName("Alice")
          b.SetAge(30)

          result := NewBuilder().SetName("Bob")
          result.Build()
      }

tests:
  - name: "useBuilder calls NewBuilder, SetName, SetAge"
    queries:
      - query: |
          MATCH (caller:Definition)-[e:CALLS|INSTANTIATES|USES_VALUE|USES_TYPE|ANNOTATED_BY]->(callee:Definition)
          WHERE caller.fqn = 'main.useBuilder'
          RETURN callee.fqn AS callee
          ORDER BY callee
        assert:
          - { row: { callee: "main.Build" } }
          - { row: { callee: "main.NewBuilder" } }
          - { row: { callee: "main.NewBuilder" } }
          - { row: { callee: "main.SetAge" } }
          - { row: { callee: "main.SetName" } }
          - { row: { callee: "main.SetName" } }
      # Exactly 6 call edges, no false positives
      - query: |
          MATCH (caller:Definition)-[e:CALLS|INSTANTIATES|USES_VALUE|USES_TYPE|ANNOTATED_BY]->(callee:Definition)
          WHERE caller.fqn = 'main.useBuilder'
          RETURN callee.fqn AS callee
        assert:
          - { row_count: 6 }

  - name: "Builder methods return self type for chaining"
    query: |
      MATCH (d:Definition)
      WHERE d.name IN ['SetName', 'SetAge', 'Build', 'NewBuilder']
      RETURN d.name AS name, d.language_kind AS language_kind
      ORDER BY name
    assert:
      - { row: { name: "Build", language_kind: "Method" } }
      - { row: { name: "NewBuilder", language_kind: "Function" } }
      - { row: { name: "SetAge", language_kind: "Method" } }
      - { row: { name: "SetName", language_kind: "Method" } }
