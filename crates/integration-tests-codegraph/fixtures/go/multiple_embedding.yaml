name: "Go: multiple struct embedding"

fixtures:
  - path: multi_embed.go
    content: |
      package main

      type Reader struct{}
      func (r *Reader) Read() {}

      type Writer struct{}
      func (w *Writer) Write() {}

      type Closer struct{}
      func (c *Closer) Close() {}

      type ReadWriter struct {
          Reader
          Writer
      }

      type ReadWriteCloser struct {
          ReadWriter
          Closer
      }

      func useRWC() {
          rwc := ReadWriteCloser{}
          rwc.Read()
          rwc.Write()
          rwc.Close()
      }

      // Diamond embedding: both Foo and Bar define Dup().
      // Go would reject this at compile time as ambiguous, but we
      // pin down the resolver behavior: it picks the first ancestor
      // in the sorted chain.
      type Foo struct{}
      func (f *Foo) Dup() {}

      type Bar struct{}
      func (b *Bar) Dup() {}

      type Diamond struct {
          Foo
          Bar
      }

      func useDiamond() {
          d := Diamond{}
          d.Dup()
      }

tests:
  - name: "Embedding hierarchy defined"
    queries:
      - query: |
          MATCH (child:Definition)-[e:EXTENDS|IMPLEMENTS]->(parent:Definition)
          RETURN child.name AS child, parent.name AS parent
          ORDER BY child, parent
        assert:
          - { row: { child: "ReadWriteCloser", parent: "Closer" } }
          - { row: { child: "ReadWriteCloser", parent: "ReadWriter" } }
          - { row: { child: "ReadWriter", parent: "Reader" } }
          - { row: { child: "ReadWriter", parent: "Writer" } }

  - name: "useRWC calls Read, Write, Close via promoted methods"
    queries:
      - query: |
          MATCH (caller:Definition)-[e:CALLS|INSTANTIATES|USES_VALUE|USES_TYPE|ANNOTATED_BY]->(callee:Definition)
          WHERE caller.fqn = 'main.useRWC'
          RETURN callee.fqn AS callee
          ORDER BY callee
        assert:
          - { row: { callee: "main.Closer.Close" } }
          - { row: { callee: "main.Reader.Read" } }
          - { row: { callee: "main.Writer.Write" } }

  # Diamond embedding: Foo and Bar both define Dup(). Go rejects this as
  # ambiguous at compile time. The hierarchy lookup stops at the first
  # ancestor that defines Dup, so one edge reaches Bar.Dup.
  - name: "Diamond ambiguity: resolver stops at the first ancestor with Dup"
    queries:
      - query: |
          MATCH (caller:Definition)-[e:CALLS|INSTANTIATES|USES_VALUE|USES_TYPE|ANNOTATED_BY]->(callee:Definition)
          WHERE caller.fqn = 'main.useDiamond'
            AND callee.name = 'Dup'
          RETURN callee.fqn AS callee
        assert:
          - { row_count: 1 }
          - { row: { callee: "main.Bar.Dup" } }
