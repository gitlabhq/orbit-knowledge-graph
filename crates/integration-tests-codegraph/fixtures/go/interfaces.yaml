name: "Go: interface implementation and type assertions"

fixtures:
  - path: repo.go
    content: |
      package main

      type Repository interface {
          Get(id int) string
          Save(data string) error
      }

      type PostgresRepo struct{}

      func (p *PostgresRepo) Get(id int) string {
          return "data"
      }

      func (p *PostgresRepo) Save(data string) error {
          return nil
      }

      type MockRepo struct{}

      func (m *MockRepo) Get(id int) string {
          return "mock"
      }

      func (m *MockRepo) Save(data string) error {
          return nil
      }

      func NewRepo(useMock bool) Repository {
          if useMock {
              return &MockRepo{}
          }
          return &PostgresRepo{}
      }

      func process(repo Repository) {
          repo.Get(1)
          repo.Save("new data")
      }

tests:
  - name: "Interface and implementations defined"
    query: |
      MATCH (d:Definition)
      WHERE d.name IN ['Repository', 'PostgresRepo', 'MockRepo']
      RETURN d.name AS name, d.language_kind AS language_kind
      ORDER BY name
    assert:
      - { row: { name: "MockRepo", language_kind: "Struct" } }
      - { row: { name: "PostgresRepo", language_kind: "Struct" } }
      - { row: { name: "Repository", language_kind: "Interface" } }

  - name: "process calls Repository.Get and Repository.Save, not Close"
    queries:
      - query: |
          MATCH (caller:Definition)-[e:CALLS|INSTANTIATES|USES_VALUE|USES_TYPE|ANNOTATED_BY]->(callee:Definition)
          WHERE caller.fqn = 'main.process'
          RETURN callee.fqn AS callee
          ORDER BY callee
        assert:
          - { row: { callee: "main.Repository.Get" } }
          - { row: { callee: "main.Repository.Save" } }
      # No edges to unrelated methods
      - query: |
          MATCH (caller:Definition)-[:CALLS|INSTANTIATES|USES_VALUE|USES_TYPE|ANNOTATED_BY|DEFINES|EXTENDS|IMPLEMENTS]->(callee:Definition)
          WHERE caller.fqn = 'main.process' AND callee.name = 'Close'
          RETURN callee.name
        assert:
          - { empty: true }
