name: "TypeScript: simple definitions"
pipeline: typescript
fixtures:
  - path: main.ts
    content: |
      function greet(name: string): string {
          return `hello ${name}`;
      }

      class Animal {
          sound: string = "generic";
          speak(): string { return this.sound; }
      }

      interface Shape {
          area(): number;
      }

      type Point = { x: number; y: number };

      enum Color { Red, Green, Blue }

      const helper = () => "help";

tests:
  - name: Exactly 6 top-level definitions with correct types
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'main.ts'
        AND d.definition_type IN ['Function', 'Class', 'Interface', 'TypeAlias', 'Enum']
      RETURN d.name AS name, d.definition_type AS type
      ORDER BY name
    assert:
      - { row_count: 6 }
      - { unique: name }
      - { no_nulls: name }
      - { row: { name: "Animal", type: "Class" } }
      - { row: { name: "Color", type: "Enum" } }
      - { row: { name: "Point", type: "TypeAlias" } }
      - { row: { name: "Shape", type: "Interface" } }
      - { row: { name: "greet", type: "Function" } }
      - { row: { name: "helper", type: "Function" } }

  - name: speak is a Method nested inside Animal
    query: |
      MATCH (cls:Definition)-[e:DefinitionToDefinition]->(m:Definition)
      WHERE cls.name = 'Animal' AND e.edge_kind = 'Defines'
      RETURN m.name AS method, m.definition_type AS type
    assert:
      - { row_count: 1 }
      - { row: { method: "speak", type: "Method" } }

  - name: No spurious definitions (no blank names, no duplicates)
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'main.ts' AND (d.name IS NULL OR d.name = '')
      RETURN count(d) AS n
    assert:
      - { row_count: 1 }
      - { row: { n: 0 } }

  - name: Exactly 1 TypeScript file
    query: |
      MATCH (f:File)
      RETURN f.path AS path, f.language AS lang
    assert:
      - { row_count: 1 }
      - { row: { path: "main.ts", lang: "typescript" } }
