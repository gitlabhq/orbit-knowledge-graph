name: "TypeScript: destructuring bindings and conditional flow"
pipeline: typescript
fixtures:
  - path: main.ts
    content: |
      function getCoords(): { x: number; y: number } {
          return { x: 1, y: 2 };
      }

      function makeDefault(): string {
          return "default";
      }

      function makeAlt(): string {
          return "alt";
      }

      function process(flag: boolean): void {
          const { x, y } = getCoords();

          const result = flag ? makeDefault() : makeAlt();

          if (flag) {
              makeDefault();
          } else {
              makeAlt();
          }
      }

tests:
  - name: All 4 functions extracted
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'main.ts' AND d.definition_type = 'Function'
      RETURN d.name AS name
      ORDER BY name
    assert:
      - { row_count: 4 }
      - { column_values: { field: name, values: ["getCoords", "makeAlt", "makeDefault", "process"] } }

  - name: process calls getCoords, makeDefault, and makeAlt
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.name = 'process' AND e.edge_kind = 'Calls'
      RETURN callee.name AS callee
      ORDER BY callee
    assert:
      - { row_count: 3 }
      - { column_values: { field: callee, values: ["getCoords", "makeAlt", "makeDefault"] } }
