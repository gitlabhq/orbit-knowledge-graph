name: "TypeScript: import variants (named, default, namespace, aliased, type-only)"
pipeline: typescript
fixtures:
  - path: models.ts
    content: |
      export class User {}
      export class Admin {}
      export default class DefaultExport {}
      export function helper() {}

  - path: main.ts
    content: |
      import DefaultExport from './models';
      import { User, Admin as SuperAdmin } from './models';
      import * as Models from './models';
      import type { User as TypeUser } from './models';

      function run(): void {
          const u = new User();
          const a = new SuperAdmin();
          Models.helper();
      }

tests:
  - name: All import variants extracted
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = 'main.ts'
      RETURN i.name AS name, i.alias AS alias, i.is_type_only AS type_only
      ORDER BY name
    assert:
      - { row_count: 5 }
      - { row: { name: "Admin", alias: "SuperAdmin", type_only: false } }
      - { row: { name: "DefaultExport", alias: null, type_only: false } }
      - { row: { name: "Models", alias: null, type_only: false } }
      - { row: { name: "User", alias: null, type_only: false } }
      - { row: { name: "User", alias: "TypeUser", type_only: true } }

  - name: All imports point to the same source
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = 'main.ts'
      RETURN DISTINCT i.path AS path
    assert:
      - { row_count: 1 }
      - { row: { path: "./models" } }
