name: "TypeScript: intra-file resolution"
pipeline: typescript
fixtures:
  - path: main.ts
    content: |
      function target(): void {}

      function caller(): void {
          target();
      }

      class Dog {
          speak(): string { return "woof"; }
          run(): void { this.speak(); }
      }

      class Puppy extends Dog {
          play(): void { this.speak(); }
      }

      function unused(): void {}

tests:
  - name: All definitions extracted with correct types
    query: |
      MATCH (d:Definition)
      WHERE d.file_path = 'main.ts'
        AND d.definition_type IN ['Function', 'Class', 'Method']
      RETURN d.name AS name, d.definition_type AS type
      ORDER BY name
    assert:
      - { row_count: 8 }
      - { unique: name }
      - { no_nulls: name }
      - { row: { name: "Dog", type: "Class" } }
      - { row: { name: "Puppy", type: "Class" } }
      - { row: { name: "caller", type: "Function" } }
      - { row: { name: "play", type: "Method" } }
      - { row: { name: "run", type: "Method" } }
      - { row: { name: "speak", type: "Method" } }
      - { row: { name: "target", type: "Function" } }
      - { row: { name: "unused", type: "Function" } }

  - name: Simple call resolves
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.name = 'caller' AND callee.name = 'target' AND e.edge_kind = 'Calls'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { caller: "main.caller", callee: "main.target" } }

  - name: this.speak() resolves within Dog
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.name = 'run' AND callee.name = 'speak' AND e.edge_kind = 'Calls'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }

  - name: Puppy.play() calls inherited speak via this
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.name = 'play' AND callee.name = 'speak' AND e.edge_kind = 'Calls'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }

  - name: unused has no incoming call edges
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE callee.name = 'unused' AND e.edge_kind = 'Calls'
      RETURN caller.fqn AS caller
    assert:
      - { empty: true }

  - name: No imports in a single-file suite
    query: |
      MATCH (i:ImportedSymbol)
      RETURN count(i) AS n
    assert:
      - { row_count: 1 }
      - { row: { n: 0 } }
