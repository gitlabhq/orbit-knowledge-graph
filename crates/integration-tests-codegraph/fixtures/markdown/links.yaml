name: "Markdown: links become File and Section IMPORTS edges to files and heading sections"
fixture_tree: markdown_links

tests:
  - name: "page links, broken anchors, images and cross-language targets link files"
    query: |
      MATCH (f:File)-[:IMPORTS]->(t:File)
      WHERE f.path = 'docs/index.md'
      RETURN t.path AS target
    assert:
      - { row_count: 6 }
      - column_values:
          field: target
          values:
            - assets/diagram.svg
            - assets/logo.png
            - docs/guide.md
            - docs/my notes.md
            - docs/other.md
            - src/main.py

  - name: "a broken anchor matching a link fragment in the target still falls back to the page"
    query: |
      MATCH (f:File)-[:IMPORTS]->(t:File)
      WHERE f.path = 'docs/index.md' AND t.path = 'docs/other.md'
      RETURN t.path AS target
    assert:
      - { row_count: 1 }

  - name: "anchors that resolve link the heading section, counting quoted headings"
    query: |
      MATCH (f:File)-[:IMPORTS]->(d:Definition)
      RETURN f.path AS source, d.fqn AS target
    assert:
      - { row_count: 5 }
      - { row: { source: "docs/index.md", target: "guide#Guide#Install" } }
      - { row: { source: "docs/index.md", target: "guide#Guide#Install 1" } }
      - { row: { source: "docs/index.md", target: "guide#Guide#Café über" } }
      - { row: { source: "docs/index.md", target: "faq#FAQ#Question" } }
      - { row: { source: "docs/my notes.md", target: "index#Index" } }

  - name: "external, same-document, missing and out-of-repository links add no edges"
    query: |
      MATCH (f:File)-[:IMPORTS]->(t:File)
      WHERE t.path IN ['docs/index.md', 'docs/missing.md']
      RETURN t.path AS target
    assert:
      - { row_count: 0 }

  - name: "link endpoint ids match across engines"
    query: |
      MATCH (f:File)-[:IMPORTS]->(t:File)
      WHERE f.path = 'docs/index.md' AND t.path IN ['docs/guide.md', 'src/main.py']
      RETURN f.id AS source, t.id AS target, t.path AS path
    assert:
      - { row_count: 2 }
      - { row: { path: "docs/guide.md", source: 3150211441383902751, target: 9131820625577551583 } }
      - { row: { path: "src/main.py", source: 3150211441383902751, target: 7208206329522652730 } }

  - name: "section link endpoint ids match across engines"
    query: |
      MATCH (f:File)-[:IMPORTS]->(d:Definition)
      WHERE d.name = 'Install'
      RETURN f.id AS source, d.id AS target
    assert:
      - { row_count: 1 }
      - { row: { source: 3150211441383902751, target: 4354769340535525246 } }

  - name: "links inside a heading section also link from its innermost section"
    query: |
      MATCH (s:Definition)-[:IMPORTS]->(t:File)
      RETURN s.fqn AS source, t.path AS target
    assert:
      - { row_count: 7 }
      - { row: { source: "index#Index", target: "docs/guide.md" } }
      - { row: { source: "index#Index", target: "docs/other.md" } }
      - { row: { source: "index#Index", target: "src/main.py" } }
      - { row: { source: "index#Index", target: "docs/my notes.md" } }
      - { row: { source: "index#Index#Assets", target: "assets/logo.png" } }
      - { row: { source: "index#Index#Assets", target: "assets/diagram.svg" } }
      - { row: { source: "other#Other", target: "docs/my notes.md" } }

  - name: "resolved anchors also link the heading section from the innermost source section"
    query: |
      MATCH (s:Definition)-[:IMPORTS]->(d:Definition)
      RETURN s.fqn AS source, d.fqn AS target
    assert:
      - { row_count: 5 }
      - { row: { source: "index#Index", target: "guide#Guide#Install" } }
      - { row: { source: "index#Index", target: "guide#Guide#Install 1" } }
      - { row: { source: "index#Index", target: "guide#Guide#Café über" } }
      - { row: { source: "index#Index", target: "faq#FAQ#Question" } }
      - { row: { source: "my notes#Notes", target: "index#Index" } }

  - name: "a link before the first heading links only from the file"
    query: |
      MATCH (f:File)-[:IMPORTS]->(t:File)
      WHERE f.path = 'docs/other.md'
      RETURN t.path AS target
    assert:
      - { row_count: 2 }
      - column_values:
          field: target
          values:
            - docs/guide.md
            - docs/my notes.md

  - name: "section-sourced file link endpoint ids match across engines"
    query: |
      MATCH (s:Definition)-[:IMPORTS]->(t:File)
      WHERE s.fqn = 'index#Index#Assets' AND t.path = 'assets/logo.png'
      RETURN s.id AS source, t.id AS target
    assert:
      - { row_count: 1 }
      - { row: { source: 6227688384652585182, target: 5169802220678377662 } }

  - name: "section-sourced section link endpoint ids match across engines"
    query: |
      MATCH (s:Definition)-[:IMPORTS]->(d:Definition)
      WHERE d.name = 'Install'
      RETURN s.id AS source, d.id AS target
    assert:
      - { row_count: 1 }
      - { row: { source: 2826921626353384516, target: 4354769340535525246 } }
