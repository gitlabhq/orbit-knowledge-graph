name: "Markdown: a hash in the file stem is escaped in section fqns"

fixtures:
  - path: docs/C#.md
    content: |
      # Basics

      ## Types

tests:
  - name: "the escaped stem prefixes every section fqn"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Section'
      RETURN d.fqn AS fqn, d.id AS id
    assert:
      - { row_count: 2 }
      - { row: { fqn: "C\\##Basics", id: 7431661662255701000 } }
      - { row: { fqn: "C\\##Basics#Types", id: 4581922493871891585 } }
