name: "Markdown: hashes and backslashes in the file stem are escaped in section fqns"

fixtures:
  - path: docs/C#.md
    content: |
      # Basics

      ## Types

  - path: docs/a\#b.md
    content: |
      # Intro

  - path: docs/F#.md
    content: |
      ---
      title: F sharp
      ---

tests:
  - name: "the escaped stem prefixes every section fqn"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Section'
      RETURN d.fqn AS fqn, d.id AS id
    assert:
      - { row_count: 3 }
      - { row: { fqn: "C\\##Basics", id: 7431661662255701000 } }
      - { row: { fqn: "C\\##Basics#Types", id: 4581922493871891585 } }
      - { row: { fqn: "a\\\\\\#b#Intro", id: 2925747467374241587 } }

  - name: "the escaped stem prefixes the front matter fqn"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'FrontMatter'
      RETURN d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { fqn: "F\\##front_matter" } }
