name: "Markdown: front matter is one block and one field per top-level key, identical across engines"

fixtures:
  - path: doc/user/merge_requests.md
    content: |
      ---
      stage: Create
      group: Source Code
      info: To determine the technical writer assigned to the Stage/Group associated with this page, see https://handbook.gitlab.com/
      title: Merge requests
      ---

      {{< details >}}

      - Tier: Free

      {{< /details >}}

      ## Create a merge request

  - path: skills/orbit/SKILL.md
    content: |
      ---
      name: orbit
      description: >-
        Query the knowledge graph.
      # metadata is optional
      metadata:
        version: 1
      ---
      # front_matter

  - path: notes/blank.md
    content: |
      ---

      ---

      # Blank

  - path: notes/rules.md
    content: |
      ---
      ---

      Two thematic breaks, not front matter.

tests:
  - name: "every file with a front matter block has one FrontMatter definition"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'FrontMatter'
      RETURN d.file_path AS file, d.fqn AS fqn, d.name AS name
    assert:
      - { row_count: 3 }
      - { row: { file: "doc/user/merge_requests.md", fqn: "merge_requests#front_matter", name: "front_matter" } }
      - { row: { file: "skills/orbit/SKILL.md", fqn: "SKILL#front_matter", name: "front_matter" } }
      - { row: { file: "notes/blank.md", fqn: "blank#front_matter", name: "front_matter" } }

  - name: "each top-level key is a FrontMatterField under its block"
    query: |
      MATCH (p:Definition)-[:DEFINES]->(d:Definition)
      WHERE d.definition_type = 'FrontMatterField'
      RETURN p.fqn AS parent, d.fqn AS fqn, d.name AS name
    assert:
      - { row_count: 7 }
      - { row: { parent: "merge_requests#front_matter", fqn: "merge_requests#front_matter#stage", name: "stage" } }
      - { row: { parent: "merge_requests#front_matter", fqn: "merge_requests#front_matter#title", name: "title" } }
      - { row: { parent: "SKILL#front_matter", fqn: "SKILL#front_matter#description", name: "description" } }
      - { row: { parent: "SKILL#front_matter", fqn: "SKILL#front_matter#metadata", name: "metadata" } }

  - name: "the file defines its front matter block and fields"
    query: |
      MATCH (f:File)-[:DEFINES]->(d:Definition)
      WHERE d.definition_type IN ['FrontMatter', 'FrontMatterField']
      RETURN f.path AS file, d.fqn AS fqn
    assert:
      - { row_count: 10 }

  - name: "a heading named like the front matter gets a suffixed fqn"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Section'
      RETURN d.fqn AS fqn, d.name AS name
    assert:
      - { row_count: 3 }
      - { row: { fqn: "SKILL#front_matter-1", name: "front_matter" } }
      - { row: { fqn: "merge_requests#Create a merge request", name: "Create a merge request" } }
      - { row: { fqn: "blank#Blank", name: "Blank" } }

  - name: "front matter ids and ranges are the same in both engines"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type IN ['FrontMatter', 'FrontMatterField']
      RETURN d.fqn AS fqn, d.id AS id, d.start_byte AS start_byte, d.end_byte AS end_byte, d.start_line AS start_line, d.end_line AS end_line
    assert:
      - { row_count: 10 }
      - { row: { fqn: "merge_requests#front_matter", id: 1737322248835097902, start_byte: 0, end_byte: 191, start_line: 1, end_line: 6 } }
      - { row: { fqn: "merge_requests#front_matter#stage", id: 7313459264623323367, start_byte: 4, end_byte: 18, start_line: 2, end_line: 2 } }
      - { row: { fqn: "merge_requests#front_matter#group", id: 5307424401651718400, start_byte: 18, end_byte: 37, start_line: 3, end_line: 3 } }
      - { row: { fqn: "merge_requests#front_matter#info", id: 5376148533253754433, start_byte: 37, end_byte: 165, start_line: 4, end_line: 4 } }
      - { row: { fqn: "merge_requests#front_matter#title", id: 8597904160589395415, start_byte: 165, end_byte: 187, start_line: 5, end_line: 5 } }
      - { row: { fqn: "SKILL#front_matter", id: 1250515828031768561, start_byte: 0, end_byte: 111, start_line: 1, end_line: 8 } }
      - { row: { fqn: "SKILL#front_matter#name", id: 1370902937627328482, start_byte: 4, end_byte: 16, start_line: 2, end_line: 2 } }
      - { row: { fqn: "SKILL#front_matter#description", id: 2346644788423363252, start_byte: 16, end_byte: 61, start_line: 3, end_line: 4 } }
      - { row: { fqn: "SKILL#front_matter#metadata", id: 8963022241248876000, start_byte: 84, end_byte: 107, start_line: 6, end_line: 7 } }
      - { row: { fqn: "blank#front_matter", id: 511951402004096090, start_byte: 0, end_byte: 9, start_line: 1, end_line: 3 } }

  - name: "sections after the front matter start at their heading in both engines"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Section'
      RETURN d.fqn AS fqn, d.id AS id, d.start_byte AS start_byte
    assert:
      - { row: { fqn: "merge_requests#Create a merge request", id: 4186158684943796567, start_byte: 241 } }
      - { row: { fqn: "SKILL#front_matter-1", id: 5595229349388437339, start_byte: 111 } }
      - { row: { fqn: "blank#Blank", id: 704564307224734628, start_byte: 10 } }
