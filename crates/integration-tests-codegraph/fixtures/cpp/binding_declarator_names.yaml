name: C++ binding declarator name extraction (kg#1116)

fixtures:
  - path: callbacks.cpp
    content: |
      int target(int v) { return v; }

      int dispatch() {
          int (*fp)(int) = target;
          return fp(1);
      }

tests:
  - name: "Call through a function-pointer local resolves to its initializer"
    query: |
      MATCH (caller:Definition)-[e:CALLS|INSTANTIATES|USES_VALUE|USES_TYPE|ANNOTATED_BY]->(callee:Definition)
      WHERE caller.fqn = 'callbacks::dispatch'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { caller: "callbacks::dispatch", callee: "callbacks::target" } }
