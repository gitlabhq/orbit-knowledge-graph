name: C++ declarator name extraction (kg#1115)

fixtures:
  - path: funcs.cpp
    content: |
      int plain(int a) { return a; }
      static inline int qualprefixed(int a) { return a; }
      void *ptr_return(int a) { return 0; }
      int (paren_decl)(int a) { return a; }
      int &ref_return(int a) { return a; }
      int attributed(int a) [[deprecated]] { return a; }
      void (__cdecl mscall)(int a) { }
  - path: members.cpp
    content: |
      int Foo::bar(int a) { return a; }
      int* Foo::baz(int a) { return 0; }
      int A::B::deep(int a) { return a; }
      bool Foo::operator==(const Foo& o) const { return true; }
      Foo::~Foo() {}
  - path: conversions.cpp
    content: |
      class InlineConv {
        operator bool() const { return true; }
        operator const char*() const { return 0; }
        operator int*() { return 0; }
        operator int&() { return x; }
        operator std::string() const { return {}; }
        operator std::function<void(int)>() { return {}; }
      };
      Ptr::operator int() const { return 0; }
      S::I::operator int() const { return 0; }

tests:
  - name: "Plain and storage-qualifier-prefixed functions keep the bare name"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.name IN ['plain', 'qualprefixed']
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 2 }
      - { row: { name: "plain", fqn: "funcs::plain" } }
      - { row: { name: "qualprefixed", fqn: "funcs::qualprefixed" } }

  - name: "Pointer-return function extracts bare identifier"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.fqn = 'funcs::ptr_return'
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { name: "ptr_return", fqn: "funcs::ptr_return" } }

  - name: "Parenthesized declarator extracts bare identifier"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.fqn = 'funcs::paren_decl'
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { name: "paren_decl", fqn: "funcs::paren_decl" } }

  - name: "Reference-return function extracts bare identifier"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.fqn = 'funcs::ref_return'
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { name: "ref_return", fqn: "funcs::ref_return" } }

  - name: "Postfix attribute is unwrapped, not captured as the name"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.fqn = 'funcs::attributed'
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { name: "attributed", fqn: "funcs::attributed" } }

  - name: "MSVC call modifier before the declarator is skipped, not captured as the name"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.fqn = 'funcs::mscall'
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { name: "mscall", fqn: "funcs::mscall" } }

  - name: "Out-of-line member keeps its class qualifier (single level)"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.name IN ['Foo::bar', 'Foo::baz']
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 2 }
      - { row: { name: "Foo::bar", fqn: "members::Foo::bar" } }
      - { row: { name: "Foo::baz", fqn: "members::Foo::baz" } }

  - name: "Out-of-line member keeps the full nested qualifier"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.fqn = 'members::A::B::deep'
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 1 }
      - { row: { name: "A::B::deep", fqn: "members::A::B::deep" } }

  - name: "Operator and destructor names keep the qualifier, drop params"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.name IN ['Foo::operator==', 'Foo::~Foo']
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 2 }
      - { row: { name: "Foo::operator==", fqn: "members::Foo::operator==" } }
      - { row: { name: "Foo::~Foo", fqn: "members::Foo::~Foo" } }

  - name: "Inline conversion operators normalize to operator <type>, keeping pointer/ref/cv"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function' AND d.name STARTS WITH 'operator'
      RETURN d.name AS name
    assert:
      - { row_count: 6 }
      - { unique: name }
      - { row: { name: "operator bool" } }
      - { row: { name: "operator const char*" } }
      - { row: { name: "operator int*" } }
      - { row: { name: "operator int&" } }
      - { row: { name: "operator std::string" } }
      - { row: { name: "operator std::function<void(int)>" } }

  - name: "Out-of-line conversion operator keeps the qualifier at any depth"
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function'
        AND d.name IN ['Ptr::operator int', 'S::I::operator int']
      RETURN d.name AS name, d.fqn AS fqn
    assert:
      - { row_count: 2 }
      - { row: { name: "Ptr::operator int", fqn: "conversions::Ptr::operator int" } }
      - { row: { name: "S::I::operator int", fqn: "conversions::S::I::operator int" } }
