name: "JavaScript: simple ES module imports and cross-file resolution"
pipeline: js
fixtures:
  - path: utils.js
    content: |
      export function helper() {
          return "help";
      }

      export function unused() {
          return "unused";
      }

  - path: main.js
    content: |
      import { helper } from './utils';

      function run() {
          helper();
      }

tests:
  - name: Exactly 1 import extracted
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = 'main.js'
      RETURN i.name AS name, i.path AS path
    assert:
      - { row_count: 1 }
      - { row: { name: "helper", path: "./utils" } }

  - name: No imports from utils.js
    query: |
      MATCH (i:ImportedSymbol)
      WHERE i.file_path = 'utils.js'
      RETURN count(i) AS n
    assert:
      - { row_count: 1 }
      - { row: { n: 0 } }

  - name: Cross-file call from run to helper
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.name = 'run' AND callee.name = 'helper'
        AND caller.file_path <> callee.file_path
        AND e.edge_kind = 'Calls'
      RETURN caller.fqn AS caller, callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { caller: "run", callee: "helper" } }

  - name: unused has no incoming cross-file calls
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE callee.name = 'unused' AND e.edge_kind = 'Calls'
      RETURN caller.fqn AS caller
    assert:
      - { empty: true }

  - name: Exactly 3 definitions across both files
    query: |
      MATCH (d:Definition)
      WHERE d.definition_type = 'Function'
      RETURN d.name AS name, d.file_path AS file
      ORDER BY name
    assert:
      - { row_count: 3 }
      - { unique: name }
      - { row: { name: "helper", file: "utils.js" } }
      - { row: { name: "run", file: "main.js" } }
      - { row: { name: "unused", file: "utils.js" } }

  - name: Exactly 2 JavaScript files
    query: |
      MATCH (f:File)
      RETURN f.path AS path
      ORDER BY path
    assert:
      - { row_count: 2 }
      - { column_values: { field: path, values: ["main.js", "utils.js"] } }
