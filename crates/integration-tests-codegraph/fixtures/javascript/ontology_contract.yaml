name: "JavaScript ontology contract: kinds, content columns, imports, files, and edges"
pipeline: js

fixtures:
  - path: src/order.js
    content: |
      const helper = require("./helper");

      /** An order. */
      class Order {
        constructor(total) { this.total = total; }
        async charge(amount) {
          this.describe();
          this.describe();
          return helper.run(amount);
        }
        describe() {}
        static build() { return new Order(1); }
      }

      export const MAX = 10;
      export function make(a, b) { return a + b; }

  - path: src/helper.js
    content: |
      module.exports = { run(x) { return x; } };

  - path: test/order.spec.js
    content: |
      describe("Order", () => {
        it("charges", () => {});
      });

  - path: vendor/lib/util.js
    content: |
      function util() {}

tests:
  - name: "Kinds, categories, language kinds, and scopes"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.file_path IN ['src/order.js']
          RETURN d.name AS name, d.kind AS kind, d.category AS category, d.language_kind AS lk, d.scope AS scope
          LIMIT 100
        assert:
          - { row: { name: "Order", kind: "Class", category: "Type", lk: "Class", scope: "top_level" } }
          - { row: { name: "constructor", kind: "Constructor", category: "Callable", lk: "Constructor", scope: "member" } }
          - { row: { name: "charge", kind: "Method", category: "Callable", lk: "Method", scope: "member" } }
          - { row: { name: "build", kind: "Method", category: "Callable", lk: "StaticMethod", scope: "member" } }
          - { row: { name: "MAX", kind: "Constant", category: "Value", lk: "Const", scope: "top_level" } }
          - { row: { name: "make", kind: "Function", category: "Callable", lk: "Function", scope: "top_level" } }

  - name: "Closed lists for kind, category, and scope"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.kind IN ['Class', 'Struct', 'Interface', 'Trait', 'Enum', 'TypeAlias', 'Function', 'Method', 'Constructor', 'Test', 'Field', 'Constant', 'Variable', 'EnumMember', 'Module', 'Macro']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.category IN ['Type', 'Callable', 'Value', 'Module', 'Macro']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.scope IN ['top_level', 'member', 'local']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "Signature, return type, declared type, and doc comment"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.file_path IN ['src/order.js']
          RETURN d.name AS name, d.signature AS signature, d.return_type AS return_type, d.declared_type AS declared_type, d.doc_comment AS doc
          LIMIT 100
        assert:
          - { row: { name: "Order", signature: "class Order", doc: "An order." } }
          - { row: { name: "make", signature: "function make(a, b)", return_type: null } }

  - name: "Parameters of make"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.name = 'make' AND 'a' IN d.parameters AND 'b' IN d.parameters
          RETURN d.fqn AS fqn
        assert:
          - { row_count: 1 }

  - name: "Modifiers"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.fqn = 'Order::charge' AND 'async' IN d.modifiers
          RETURN d.fqn AS fqn
        assert:
          - { row_count: 1 }
      - query: |
          MATCH (d:Definition)
          WHERE d.fqn = 'Order::build' AND 'static' IN d.modifiers
          RETURN d.fqn AS fqn
        assert:
          - { row_count: 1 }

  - name: "Visibility"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.name IN ['charge', 'make']
          RETURN d.name AS name, d.visibility AS visibility
          LIMIT 100
        assert:
          - { row: { name: "charge", visibility: "public" } }
          - { row: { name: "make", visibility: "public" } }

  - name: "Local definitions have no visibility"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.scope = 'local' AND d.visibility IS NOT NULL
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "No generated members"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.generated_by IS NOT NULL
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "File flags"
    queries:
      - query: |
          MATCH (f:File)
          RETURN f.path AS path, f.is_test AS is_test, f.is_vendored AS is_vendored, f.is_generated AS is_generated, f.skip_reason AS skip_reason
          LIMIT 100
        assert:
          - { row: { path: "test/order.spec.js", is_test: true, is_vendored: false, is_generated: false, skip_reason: "" } }
          - { row: { path: "src/order.js", is_test: false, is_vendored: false, is_generated: false } }
          - { row: { path: "vendor/lib/util.js", is_test: false, is_vendored: true } }

  - name: "CALLS"
    queries:
      - query: |
          MATCH (s:Definition)-[e:CALLS]->(t:Definition)
          WHERE s.fqn = 'Order::charge' AND t.fqn = 'Order::describe'
          RETURN s.id AS source
        assert:
          - { row_count: 1 }
      - query: |
          MATCH (s:Definition)-[e:CALLS]->(t:Definition)
          WHERE s.fqn = 'Order::charge' AND t.fqn = 'Order::describe' AND 7 IN e.lines AND 8 IN e.lines
          RETURN e.lines AS lines
        assert:
          - { row_count: 1 }

  - name: "Test definition charges"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.kind = 'Test' AND d.name = 'charges'
          RETURN d.language_kind AS lk
        assert:
          - { row: { lk: "TestCase" } }
