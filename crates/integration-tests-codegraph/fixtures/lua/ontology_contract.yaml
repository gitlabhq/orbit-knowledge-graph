name: "Lua ontology contract: kinds, content columns, imports, files, and edges"

fixtures:
  - path: src/order.lua
    content: |
      local helper = require("helper")

      -- Adds two numbers.
      local function add(a, b)
        return a + b
      end

      function M.charge(amount)
        add(amount, 1)
        add(amount, 2)
      end

      function M:describe(x)
      end

  - path: src/helper.lua
    content: |
      return {}

  - path: tests/order_test.lua
    content: |
      local function test_order() end

  - path: vendor/lib/util.lua
    content: |
      local function util() end

tests:
  - name: "Kinds, categories, language kinds, and scopes"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.file_path IN ['src/order.lua']
          RETURN d.name AS name, d.kind AS kind, d.category AS category, d.language_kind AS lk, d.scope AS scope
          LIMIT 100
        assert:
          - { row: { name: "add", kind: "Function", category: "Callable", lk: "Function", scope: "top_level" } }
          - { row: { name: "charge", kind: "Function", category: "Callable", lk: "Function", scope: "top_level" } }
          - { row: { name: "describe", kind: "Method", category: "Callable", lk: "Method", scope: "member" } }

  - name: "Closed lists for kind, category, and scope"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.kind IN ['Class', 'Struct', 'Interface', 'Trait', 'Enum', 'TypeAlias', 'Function', 'Method', 'Constructor', 'Test', 'Field', 'Constant', 'Variable', 'EnumMember', 'Module', 'Macro']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.category IN ['Type', 'Callable', 'Value', 'Module', 'Macro']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }
      - query: |
          MATCH (d:Definition)
          WHERE NOT d.scope IN ['top_level', 'member', 'local']
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "Signature, return type, declared type, and doc comment"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.file_path IN ['src/order.lua']
          RETURN d.name AS name, d.signature AS signature, d.return_type AS return_type, d.declared_type AS declared_type, d.doc_comment AS doc
          LIMIT 100
        assert:
          - { row: { name: "add", signature: "local function add(a, b)", doc: "Adds two numbers.", return_type: null } }

  - name: "Parameters of add"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.name = 'add' AND 'a' IN d.parameters AND 'b' IN d.parameters
          RETURN d.fqn AS fqn
        assert:
          - { row_count: 1 }

  - name: "No modifier rules"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE 'static' IN d.modifiers
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "No visibility rule"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.visibility IS NOT NULL
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "No generated members"
    queries:
      - query: |
          MATCH (d:Definition)
          WHERE d.generated_by IS NOT NULL
          RETURN d.fqn AS fqn
        assert:
          - { empty: true }

  - name: "File flags"
    queries:
      - query: |
          MATCH (f:File)
          RETURN f.path AS path, f.is_test AS is_test, f.is_vendored AS is_vendored, f.is_generated AS is_generated, f.skip_reason AS skip_reason
          LIMIT 100
        assert:
          - { row: { path: "tests/order_test.lua", is_test: true, is_vendored: false, is_generated: false, skip_reason: "" } }
          - { row: { path: "src/order.lua", is_test: false, is_vendored: false, is_generated: false } }
          - { row: { path: "vendor/lib/util.lua", is_test: false, is_vendored: true } }

  - name: "CALLS"
    queries:
      - query: |
          MATCH (s:Definition)-[e:CALLS]->(t:Definition)
          WHERE s.name = 'charge' AND t.name = 'add'
          RETURN s.id AS source
        assert:
          - { row_count: 1 }

  - name: "No EXTENDS edges"
    queries:
      - query: |
          MATCH (a:Definition)-[:EXTENDS]->(b:Definition)
          RETURN a.id AS id
        assert:
          - { empty: true }

  - name: "No IMPLEMENTS edges"
    queries:
      - query: |
          MATCH (a:Definition)-[:IMPLEMENTS]->(b:Definition)
          RETURN a.id AS id
        assert:
          - { empty: true }

  - name: "Every reference edge with its kind, resolution, access, usage, and lines"
    queries:
      - query: |
          MATCH (a:Definition)-[e:CALLS|INSTANTIATES|USES_VALUE|USES_TYPE|ANNOTATED_BY|EXTENDS|IMPLEMENTS|OVERRIDES]->(b:Definition)
          RETURN a.fqn AS src, b.fqn AS dst
          LIMIT 100
        assert:
          - { row_count: 1 }
      - query: |
          MATCH (a:Definition)-[e:CALLS]->(b:Definition)
          WHERE a.fqn = 'order.charge' AND b.fqn = 'order.add' AND e.resolution = 'local' AND 9 IN e.lines AND 10 IN e.lines
          RETURN a.fqn AS src
        assert:
          - { row_count: 1 }

  - name: "Import rows with kind, construct, path, full name, and external flag"
    queries:
      - query: |
          MATCH (i:Import)
          RETURN i.name AS name, i.alias AS alias, i.import_kind AS kind, i.language_kind AS lk, i.import_path AS path, i.fqn AS fqn, i.is_external AS external
          LIMIT 100
        assert:
          - { row_count: 1 }
          - { row: { name: "helper", alias: "", kind: "symbol", lk: "Require", path: "helper", fqn: "helper", external: false } }
