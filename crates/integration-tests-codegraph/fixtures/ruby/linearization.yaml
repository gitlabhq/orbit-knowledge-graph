name: "Ruby: the last included module wins"
fixtures:
  - path: app/models/thing.rb
    content: |
      module Alpha
        def m
        end
      end

      module Beta
        def m
        end
      end

      class Thing
        include Alpha
        include Beta

        def use
          m
        end
      end

tests:
  - name: "an implicit-self call resolves to the last included module"
    query: |
      MATCH (caller:Definition)-[e:DefinitionToDefinition]->(callee:Definition)
      WHERE caller.fqn = 'Thing::use' AND e.edge_kind = 'Calls' AND callee.name = 'm'
      RETURN callee.fqn AS callee
    assert:
      - { row_count: 1 }
      - { row: { callee: "Beta::m" } }
