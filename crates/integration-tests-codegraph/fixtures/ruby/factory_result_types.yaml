name: "Ruby factory method calls and result types"

fixtures:
  - path: app/models/application_record.rb
    content: |
      class ApplicationRecord
        def self.find(id)
        end
      end

  - path: app/models/merge_request.rb
    content: |
      class MergeRequest < ApplicationRecord
        def target_project
        end
      end

  - path: app/models/issue.rb
    content: |
      class Issue < ApplicationRecord
        def title
        end
      end

  - path: app/workers/factory_worker.rb
    content: |
      class FactoryWorker
        def chained(id)
          MergeRequest.find(id).target_project
        end

        def bound(id)
          record = MergeRequest.find(id)
          record.target_project
        end

        def initialize(id)
          @record = MergeRequest.find(id)
        end

        def stored
          @record.target_project
        end

        def distinct(id)
          MergeRequest.find(id).target_project
          Issue.find(id).title
        end

        def crossed(id)
          Issue.find(id).target_project
          MergeRequest.find(id).title
        end

        def crossed_bound(id)
          record = Issue.find(id)
          MergeRequest.find(id)
          record.target_project
        end

        def store_issue(id)
          @issue = Issue.find(id)
        end

        def crossed_field(id)
          MergeRequest.find(id)
          @issue.target_project
        end
      end

  - path: app/local.rb
    content: |
      class LocalRecord
        def self.find(id)
        end

        def target
        end
      end

      class LocalFactory
        def initialize(id)
          @record = LocalRecord.find(id)
        end

        def stored
          @record.target
        end
      end

tests:
  - name: "chained preserves the factory receiver type"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::chained'
        AND b.fqn = 'MergeRequest::target_project'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"row_count": 1}

  - name: "bound preserves the factory receiver type"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::bound'
        AND b.fqn = 'MergeRequest::target_project'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"row_count": 1}

  - name: "stored preserves the factory receiver type"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::stored'
        AND b.fqn = 'MergeRequest::target_project'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"row_count": 1}

  - name: "distinct preserves the factory receiver type"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::distinct'
        AND b.fqn = 'MergeRequest::target_project'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"row_count": 1}

  - name: "factory calls retain inherited method targets"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::chained'
        AND b.fqn = 'ApplicationRecord::find'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"row_count": 1}

  - name: "calls to the same factory keep distinct result types"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::distinct'
        AND b.fqn = 'Issue::title'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"row_count": 1}

  - name: "factory results do not take members from another receiver"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::crossed'
        AND b.fqn IN ['MergeRequest::target_project', 'Issue::title']
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"empty": true}

  - name: "local factory results preserve instance field types"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'LocalFactory::stored'
        AND b.fqn = 'LocalRecord::target'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"row_count": 1}

  - name: "crossed_bound does not acquire unrelated imported members"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::crossed_bound'
        AND b.fqn = 'MergeRequest::target_project'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"empty": true}

  - name: "crossed_field does not acquire unrelated imported members"
    query: |
      MATCH (a:Definition)-[e:DefinitionToDefinition]->(b:Definition)
      WHERE a.fqn = 'FactoryWorker::crossed_field'
        AND b.fqn = 'MergeRequest::target_project'
        AND e.edge_kind = 'Calls'
      RETURN b.fqn AS target
    assert:
      - {"empty": true}
