[package]
name = "integration-tests-codegraph"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
code-graph = { path = "../code-graph", optional = true }
code-graph-incremental = { path = "../code-graph-incremental" }
compiler = { path = "../query-engine/compiler" }
duckdb-client = { path = "../duckdb-client" }
ontology = { path = "../ontology" }

arrow = { workspace = true }

crossbeam-channel = { workspace = true }
regex = { workspace = true }
globset = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
orbit-server-config = { path = "../orbit-server-config" }
orbit-utils = { path = "../utils" }
orbit-arrow = { path = "../utils/arrow" }
tabled = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["code-graph"]

[[test]]
name = "cancellation"
required-features = ["code-graph"]

[[test]]
name = "file_name_detection"
required-features = ["code-graph"]

[[test]]
name = "suites"
required-features = ["code-graph"]

[[test]]
name = "vanished_tree"
required-features = ["code-graph"]

[lints]
workspace = true
