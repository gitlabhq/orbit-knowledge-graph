# Self-managed on GCP without Workload Identity: a service account JSON key.
# In Kubernetes mount the key file as /etc/secrets/object_storage/gcs/service_account_key
# and drop service_account_key_path; the secret layer then supplies the inline key.
object_storage:
  provider: gcs
  bucket: example-orbit-storage
  prefix: orbit
  gcs:
    auth: service_account_key
    service_account_key_path: /etc/orbit/gcs-service-account.json
