# TypeScript/JavaScript rewrite rules.
# Handles: import/export, class/function/interface/enum/type defs,
# member access, calls, this.x, control flow, bindings.

config:
  resolve:
    parse_files:
      - name: "tsconfig.json"
        format: json
      - name: "jsconfig.json"
        format: json
      - name: "package.json"
        format: json
      - name: "webpack.config.js"
        format: raw
        extract: "['\"]([^'\"]+)['\"]\\s*:\\s*path\\.\\w+\\([^,]+,\\s*['\"]([^'\"]+)['\"]"
    lookup_from:
      - __source_root

stages:
  - name: normalize
    rules:
      # <div> is an intrinsic element, not a component call
      - match: '(jsx_self_closing_element name: (identifier "/^[a-z]/") $$$A)'
        replace: '(jsx_intrinsic $$$A)'
      - match: '(jsx_opening_element name: (identifier "/^[a-z]/") $$$A)'
        replace: '(jsx_intrinsic_open $$$A)'
      - match: '(program $$$C)'
        replace: '(__source_file @$ROOT $$$C)'

      # Constructor parameter property (only when accessibility_modifier present)
      - match: '(required_parameter **/(accessibility_modifier) pattern: $N type: (type_annotation $T:type_identifier))'
        replace: '(__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__callee @$T)))))'
      - match: '(required_parameter **/(accessibility_modifier) pattern: $N)'
        replace: '(__def (__defname @$N) (__property))'

      # Regular typed parameter → binding with SSA type hint
      - match: '(required_parameter pattern: $N type: (type_annotation $T:type_identifier))'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T))'
      - match: '(required_parameter pattern: $N)'
        replace: '(__binding @$N (__declaration))'

      - match: '(return_statement $$$VALS)'
        replace: '(__ssa_return $$$VALS)'

      # Distinguish import type from import before rewriting
      - match: '(import_statement (type) $$$REST)'
        replace: '(import_type_statement $$$REST)'

      # this.x → __ivar
      - match: '(member_expression object: (this) property: $P)'
        replace: '(__ivar @$P)'

      # Superclass: extends clause → __supertype
      - match: '(extends_clause value: $V)'
        replace: '(__supertype @$V)'

      # implements clause → individual __supertype nodes
      - match: '(implements_clause $$$TYPES:type_identifier $$$REST)'
        replace: '(implements_clause $$$REST $$$TYPES=>__supertype)'

      # Import alias: capture real name as sym, alias as child
      - match: '(import_specifier (type) name: $N alias: $A)'
        replace: '(import_specifier @$N (__alias @$A))'
        tag: { type_only: "true" }
      - match: '(import_specifier (type) name: $N)'
        replace: '(import_specifier @$N)'
        tag: { type_only: "true" }
      - match: '(import_specifier name: $N alias: $A)'
        replace: '(import_specifier @$N (__alias @$A))'
      - match: '(import_specifier name: $N)'
        replace: '(import_specifier @$N)'

      # Export specifier alias
      - match: '(export_specifier name: $N alias: $A)'
        replace: '(export_specifier @$N (__alias @$A))'
      - match: '(export_specifier name: $N)'
        replace: '(export_specifier @$N)'

  - name: retag-refs
    rules:
      - match: '(member_expression object: $O:call_expression property: $M)'
        replace: '(__member @$M (__object $O))'
      - match: '(member_expression object: $O:__ivar property: $M)'
        replace: '(__member @$M (__object $O))'
      - match: '(member_expression object: $O property: $M)'
        replace: '(__member @$M (__object @$O))'

  - name: retag-calls
    rules:
      # <Comp … /> and <Comp>…</Comp> call the component
      - match: '(jsx_self_closing_element name: $N:__member $$$A)'
        replace: '(__call (__callee $N) $$$A)'
      - match: '(jsx_self_closing_element name: $N:identifier $$$A)'
        replace: '(__call (__callee @$N) $$$A)'
      - match: '(jsx_element open_tag: (jsx_opening_element name: $N:__member $$$A) $$$C)'
        replace: '(__call (__callee $N) $$$A $$$C)'
      - match: '(jsx_element open_tag: (jsx_opening_element name: $N:identifier $$$A) $$$C)'
        replace: '(__call (__callee @$N) $$$A $$$C)'
      - match: '(call_expression function: $F:__ivar arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F:__member arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F arguments: $A)'
        replace: '(__call (__callee @$F) $A)'
      - match: '(new_expression constructor: $C:__member arguments: $A)'
        replace: '(__call (__callee $C) $A)'
      - match: '(new_expression constructor: $C arguments: $A)'
        replace: '(__call (__callee @$C) $A)'

  - name: imports
    rules:
      - match: '(export_statement (default) value: $N:identifier)'
        replace: '(__module_export @$N (__default_export "default"))'
      # import type { a, b } from './source'
      - match: '(import_type_statement (import_clause (named_imports $$$SPECS:import_specifier)) source: (string $S:string_fragment))'
        replace: '(__import_type (__source @$S) (__source_path @$S) $$$SPECS->__name)'
      - match: '(import_type_statement (import_clause (namespace_import $N:identifier)) source: (string $S:string_fragment))'
        replace: '(__import_type (__source @$S) (__source_path @$S) (__name "*" (__alias @$N)))'
      - match: '(import_type_statement (import_clause $N:identifier) source: (string $S:string_fragment))'
        replace: '(__import_type (__source @$S) (__source_path @$S) (__name "default" (__alias @$N)))'

      # import defaultExport, { named } from './source' — combined default + named (before individual rules)
      - match: '(import_statement (import_clause $N:identifier $$$REST (named_imports $$$SPECS:import_specifier)) source: (string $S:string_fragment))'
        replace: '(__import (__source @$S) (__source_path @$S) (__name "default" (__alias @$N)) $$$SPECS->__name)'

      # import { a, b } from './source'
      - match: '(import_statement (import_clause (named_imports $$$SPECS:import_specifier)) source: (string $S:string_fragment))'
        replace: '(__import (__source @$S) (__source_path @$S) $$$SPECS->__name)'

      # import * as ns from './source'
      - match: '(import_statement (import_clause (namespace_import $N:identifier)) source: (string $S:string_fragment))'
        replace: '(__import (__source @$S) (__source_path @$S) (__name "*" (__alias @$N)))'

      # import defaultExport from './source'
      - match: '(import_statement (import_clause $N:identifier) source: (string $S:string_fragment))'
        replace: '(__import (__source @$S) (__source_path @$S) (__name "default" (__alias @$N)))'

      # const { a, b: c } = require('./source') — CJS destructured require; aliases finish in cjs-entries
      - match: '(variable_declarator name: (object_pattern $$$E:shorthand_property_identifier_pattern|pair_pattern) value: (__call (__callee "require") (arguments (string $S:string_fragment))))'
        replace: '(__import (__source @$S) (__source_path @$S) $$$E->cjs_entry)'

      # const x = require('./source') — CJS namespace require
      - match: '(variable_declarator name: $N:identifier value: (__call (__callee "require") (arguments (string $S:string_fragment))))'
        replace: '(__import (__source @$S) (__source_path @$S) (__name "default" (__alias @$N)))'
        tag: { import_type: CjsRequire }
        tag_on: __name

      # exports.f = function f() {} / module.exports.f = ... → an exported function def
      - match: '(expression_statement (assignment_expression left: $P:__member **/(__object "exports") right: (function_expression name: $N body: $B)))'
        replace: '(__def (__defname @$N) (__function) $B)'
        tag: { exports: '@$P' }
      - match: '(expression_statement (assignment_expression left: $P:__member **/(__object "module.exports") right: (function_expression name: $N body: $B)))'
        replace: '(__def (__defname @$N) (__function) $B)'
        tag: { exports: '@$P' }
      - match: '(expression_statement (assignment_expression left: $P:__member **/(__object "exports") right: (function_expression body: $B)))'
        replace: '(__def (__defname @$P) (__function) $B)'
        tag: { exports: '@$P' }
      - match: '(expression_statement (assignment_expression left: $P:__member **/(__object "module.exports") right: (function_expression body: $B)))'
        replace: '(__def (__defname @$P) (__function) $B)'
        tag: { exports: '@$P' }
      # exports.X = <value> → an exported variable
      - match: '(expression_statement (assignment_expression left: $P:__member **/(__object "exports") right: $V))'
        replace: '(__def (__defname @$P) (__variable) $V)'
        tag: { exports: '@$P' }
      # module.exports = function main() {} → the default export
      - match: '(expression_statement (assignment_expression left: (__member "exports" (__object "module")) right: (function_expression name: $N body: $B)))'
        replace: '(__def (__defname @$N) (__default_export "default") (__function) $B)'
      - match: '(expression_statement (assignment_expression left: (__member "exports" (__object "module")) right: $N:identifier))'
        replace: '(__module_export @$N (__default_export "default"))'

      # export { A, B } from './source' — named re-export with source (before star)
      - match: '(export_statement (export_clause $$$SPECS:export_specifier) source: (string $S:string_fragment))'
        replace: '(__module_export (__import (__source @$S) (__source_path @$S) $$$SPECS->__name))'

      # export * from './source' — star re-export (no export_clause)
      - match: '(export_statement source: (string $S:string_fragment))'
        replace: '(__module_export (__import (__source @$S) (__source_path @$S) (__name "*")))'

      # export { A, B } — local re-export (no source)
      - match: '(export_statement (export_clause $$$SPECS:export_specifier))'
        replace: '(export_statement $$$SPECS)'



  - name: binding-owners
    rules:
      - match: '(lexical_declaration $$$V)'
        replace: '(variable_owner "block" $$$V)'
      - match: '(variable_declaration $$$V)'
        replace: '(variable_owner "function" $$$V)'

  - name: classify
    rules:
      # Bindings
      - match: '(variable_declarator name: $N value: $V:arrow_function)'
        replace: '(__def (__defname @$N) (__declaration @$ROOT|ancestor_sym("variable_owner")) (__function) $V)'
      - match: '(variable_declarator name: $N value: $V:identifier)'
        replace: '(__binding @$N (__declaration @$ROOT|ancestor_sym("variable_owner")) (__rhs @$V))'
      - match: '(variable_declarator name: $N value: $V)'
        replace: '(__binding @$N (__declaration @$ROOT|ancestor_sym("variable_owner")) (__rhs $V))'
      - match: '(variable_declarator name: $N)'
        replace: '(__binding @$N (__declaration @$ROOT|ancestor_sym("variable_owner")))'
      - match: '(assignment_expression left: $N right: $R:__call)'
        replace: '(__binding @$N (__rhs $R))'
      - match: '(assignment_expression left: $N right: $R)'
        replace: '(__binding @$N (__rhs @$R))'
      - match: '(public_field_definition name: $N type: (type_annotation $T:type_identifier))'
        replace: '(__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__callee @$T)))))'
      - match: '(public_field_definition name: $N value: $V)'
        replace: '(__def (__defname @$N) (__property) $V)'
      - match: '(public_field_definition name: $N)'
        replace: '(__def (__defname @$N) (__property))'

      # Control flow
      - match: '(if_statement condition: $COND consequence: $C alternative:? $A)'
        replace: '(__ssa_branch $COND (__ssa_arm $C) (__ssa_arm? $A))'
      - match: '(switch_statement value: $V body: $B)'
        replace: '(__ssa_branch $V $B)'
      - match: '(ternary_expression condition: $COND consequence: $C alternative: $A)'
        replace: '(__ssa_branch $COND (__ssa_arm $C) (__ssa_arm $A))'
      - match: '(try_statement body: $B $$$ALTS:catch_clause|finally_clause)'
        replace: '(__ssa_branch (__ssa_arm $B) $$$ALTS->__ssa_arm)'

      # Loops
      - match: '(for_in_statement (let) left: $N:identifier right: $V body: $B)'
        replace: '(__scope "block" (__ssa_loop $V (__binding @$N (__declaration "block")) $B))'
      - match: '(for_in_statement (const) left: $N:identifier right: $V body: $B)'
        replace: '(__scope "block" (__ssa_loop $V (__binding @$N (__declaration "block")) $B))'
      - match: '(for_in_statement (var) left: $N:identifier right: $V body: $B)'
        replace: '(__ssa_loop $V (__binding @$N (__declaration "function") (__rhs)) $B)'
      - match: '(for_statement body: $B)'
        replace: '(__ssa_loop $B)'
      - match: '(for_in_statement body: $B)'
        replace: '(__ssa_loop $B)'
      - match: '(while_statement body: $B)'
        replace: '(__ssa_loop $B)'
      - match: '(do_statement body: $B)'
        replace: '(__ssa_loop $B)'

      # Abstract method signatures (no body)
      - match: '(abstract_method_signature name: $N)'
        replace: '(__def (__defname @$N) (__method))'
        tag: { flavor: abstract }
      # Functions
      - match: '(function_declaration name: $N parameters: (formal_parameters $$$P:__binding) body: $B)'
        replace: '(__def (__defname @$N) (__function) $$$P $B)'
      - match: '(function_declaration name: $N body: $B)'
        replace: '(__def (__defname @$N) (__function) $B)'
      # Methods — static before generic; parameters: captures ctor param properties.
      # A computed key ([expr]) is not a named member; `#name` drops the hash.
      - match: '(method_definition name: (computed_property_name) body: $B)'
        replace: '(__ssa_hint $B)'
      - match: '(method_definition **/(static) name: $N parameters: (formal_parameters $$$P:__def|__binding) body: $B)'
        replace: '(__def (__defname @$N|regex_replace("^#","")) (__method) $$$P $B)'
        tag: { flavor: static }
      - match: '(method_definition **/(static) name: $N body: $B)'
        replace: '(__def (__defname @$N|regex_replace("^#","")) (__method) $B)'
        tag: { flavor: static }
      - match: '(method_definition name: $N parameters: (formal_parameters $$$P:__def|__binding) body: $B)'
        replace: '(__def (__defname @$N|regex_replace("^#","")) (__method) $$$P $B)'
      - match: '(method_definition name: $N body: $B)'
        replace: '(__def (__defname @$N|regex_replace("^#","")) (__method) $B)'
      - match: '(generator_function_declaration name: $N body: $B)'
        replace: '(__def (__defname @$N) (__function) $B)'
        tag: { flavor: generator }
      - match: '(interface_declaration name: $N body: $B)'
        replace: '(__def (__defname @$N) (__interface) $B)'
      - match: '(type_alias_declaration name: $N)'
        replace: '(__def (__defname @$N) (__type_alias))'
      - match: '(enum_declaration name: $N body: $B)'
        replace: '(__def (__defname @$N) (__enum) $B)'

      # Classes (last — body contains already-canonical methods)
      - match: '(class_declaration name: $N body: $B $$$ANN:__supertype)'
        replace: '(__def (__defname @$N) (__class) $$$ANN $B)'
      - match: '(abstract_class_declaration name: $N body: $B $$$ANN:__supertype)'
        replace: '(__def (__defname @$N) (__class) $$$ANN $B)'
        tag: { flavor: abstract }

  - name: lexical-scopes
    rules:
      - match: '(statement_block $$$V)'
        replace: '(__scope "block" $$$V)'

  - name: cjs-entries
    rules:
      - match: '(cjs_entry key: $K value: $V)'
        replace: '(__name @$K (__alias @$V))'
        tag: { import_type: CjsRequire }
      - match: '(cjs_entry)'
        replace: '(__name @$ROOT)'
        tag: { import_type: CjsRequire }

  - name: exports
    rules:
      # export default function/class → mark the def as default export
      - match: '(export_statement **/(default) (__def $$$CHILDREN))'
        replace: '(export_statement (__def (__default_export "default") $$$CHILDREN))'

      # export const X = ... → promote binding to Variable def
      - match: '(export_statement (variable_owner $B:__binding))'
        replace: '(export_statement (__def (__defname @$B) (__variable)))'

  - name: ssa-cleanup
    rules:
      - match: '(__ssa_return $V:identifier)'
        replace: '(__ssa_return (__rhs @$V))'

  - name: tag-defs
    rules:
      - match: '(__def (__variable) (number))'
        tag: { non_callable: "true" }
      - match: '(__def (__function))'
        tag: { callable: "true", scoped: "function" }
      - match: '(__def (__method))'
        tag: { callable: "true", scoped: "function" }
      - match: '(__def (__class))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__lambda))'
        tag: { callable: "true" }
      - match: '(__def (__enum_variant))'
        tag: { callable: "true" }
      - match: '(__def (__enum))'
        tag: { scoped: "true" }

  - name: tag-file-dir
    rules:
      - match: '$M:__source_file'
        tag:
          file_dir: '@$M|regex_replace("[^/]*$", "")|regex_replace("/$", "")'

  - name: resolve-paths
    rules:
      - match: '(__import)'
        tag:
          resolved_source: '@$ROOT|child_sym("__source_path")'
      - match: '(__import (__source_path "^."))'
        tag:
          resolved_source: '@$ROOT|concat("/", "ancestor_tag:file_dir", "child_sym:__source_path")|regex_replace("(^|/)\./", "$1")|regex_loop("[^/]+/\.\./", "")|regex_replace("/$", "")|regex_replace("^/", "")'
      - match: '(__import_type)'
        tag:
          resolved_source: '@$ROOT|child_sym("__source_path")'
      - match: '(__import_type (__source_path "^."))'
        tag:
          resolved_source: '@$ROOT|concat("/", "ancestor_tag:file_dir", "child_sym:__source_path")|regex_replace("(^|/)\./", "$1")|regex_loop("[^/]+/\.\./", "")|regex_replace("/$", "")|regex_replace("^/", "")'

resolve:
  stages:
    - name: config
      rules:
        # tsconfig paths: each entry becomes an alias, first target wins
        - match: '(__field "paths" (__obj $$$E:__field))'
          replace: '(__field "paths" (__obj $$$E->path_alias))'
        # webpack resolve.alias pairs extracted from the config
        - match: '(__file "webpack.config.js" $$$F:__field)'
          replace: '(__file "webpack.config.js" $$$F->__alias)'
        # tsconfig baseUrl → source root
        - match: '(__file "/^(ts|js)config\\.json$/" (__obj (__field "compilerOptions" (__obj (__field "baseUrl" (__str $V)) $$$REST))) $$$OUTER)'
          replace: '(__file @$ROOT (__source_root @$V|strip_prefix("./")) (__obj (__field "compilerOptions" (__obj $$$REST))) $$$OUTER)'

    - name: aliases
      rules:
        - match: '(path_alias (__arr $V:__str $$$REST))'
          replace: '(__alias @$ROOT (__str @$V|strip_prefix("./")))'

    - name: packages
      rules:
        - match: '(__dir (__file "package.json"))'
          append: ['(__package_root)']
    - name: index_dirs
      rules:
        - match: '(__dir (__file "index.ts"))'
          append: ['(__source_root)']
        - match: '(__dir (__file "index.js"))'
          append: ['(__source_root)']

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          file_path: '@$M'
          language: '@$M|split_last(".")|map("ts:typescript", "tsx:tsx", "js:javascript", "jsx:javascript", "mjs:javascript", "cjs:javascript")'

      - match: '(__def)'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat("::", "ancestor_tag:fqn", "child_sym:__defname")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: def_type
    rules:
      - match: '(__def)'
        tag: { definition_span: "true" }
      - match: '(__def (__function))'
        tag: { def_type: Function }
      - match: '(__def (__method))'
        tag: { def_type: '@$ROOT|tag("flavor")|map("static:StaticMethod", "abstract:Method", "generator:Method")|default("Method")' }
      - match: '(__def (__class))'
        tag: { def_type: Class }
      - match: '(__def (__struct))'
        tag: { def_type: Struct }
      - match: '(__def (__interface))'
        tag: { def_type: Interface }
      - match: '(__def (__enum))'
        tag: { def_type: Enum }
      - match: '(__def (__enum_variant))'
        tag: { def_type: EnumVariant }
      - match: '(__def (__trait))'
        tag: { def_type: Trait }
      - match: '(__def (__impl))'
        tag: { def_type: Impl }
      - match: '(__def (__variable))'
        tag: { def_type: Variable }
      - match: '(__def (__constant))'
        tag: { def_type: Constant }
      - match: '(__def (__lambda))'
        tag: { def_type: Lambda }
      - match: '(__def (__field_def))'
        tag: { def_type: Field }
      - match: '(__def (__property))'
        tag: { def_type: Property }
      - match: '(__def (__type_alias))'
        tag: { def_type: TypeAlias }
  - name: module_exports
    rules:
      - match: '(__module_export)'
        tag:
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: ImportedSymbol
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__import_type)'
        tag:
          entity: ImportedSymbol
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name "*" (__alias))'
        tag:
          import_type: '@$ROOT|tag("import_type")|default("NamespaceImport")'
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name "*")'
        tag:
          import_type: '@$ROOT|tag("import_type")|default("WildcardImport")'
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name "default")'
        tag:
          import_type: '@$ROOT|tag("import_type")|default("DefaultImport")'
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          import_type: '@$ROOT|tag("import_type")|default("NamedImport")'
          resolved: '@$ROOT|has_incoming("Imports")'
