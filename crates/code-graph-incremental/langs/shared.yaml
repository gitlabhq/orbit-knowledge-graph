stages: []

display:
  - name: shared
    rules:
      - match: '$M:__source_file'
        tag:
          generated: '@$M|source("2048")|regex_match("(?i)code generated .*do not edit|@generated|<auto-generated|autogenerated by|generated by .*do not (edit|modify)")'
      - match: '(__def)'
        tag:
          language: '@$ROOT|ancestor_tag("language")'
