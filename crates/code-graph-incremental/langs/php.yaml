import: [canonical, display, roots, shapes]

data:
  builtins: [abs, array_filter, array_keys, array_map, array_merge, array_pop, array_push, array_reduce,
    array_reverse, array_search, array_shift, array_slice, array_unique, array_values, boolval, call_user_func,
    call_user_func_array, ceil, class_exists, count, date, defined, dirname, explode, extension_loaded,
    file_exists, file_get_contents, file_put_contents, floatval, floor, fopen, fclose, fread, fwrite,
    function_exists, get_class, gettype, hash, htmlspecialchars, implode, in_array, intval, is_array,
    is_bool, is_callable, is_float, is_int, is_null, is_numeric, is_object, is_string, json_decode, json_encode,
    ltrim, max, method_exists, microtime, min, number_format, preg_match, preg_replace, print_r, printf,
    round, rtrim, serialize, sort, sprintf, str_contains, str_ends_with, str_replace, str_starts_with,
    strlen, strpos, strtolower, strtoupper, strval, substr, time, trim, uniqid, unserialize, var_dump]
  stdlib: [BcMath, Dom, Random, Random/Engine]
  providers:
  - [BcMath, Number]
  - [Dom, HTMLDocument, XMLDocument]
  - [Random, Randomizer, RandomError, BrokenRandomEngineError]
  - [Random/Engine, Mt19937, PcgOneseq128XslRr64, Xoshiro256StarStar, Secure]
  compound_types: [union_type, intersection_type, disjunctive_normal_form_type]
  params: [simple_parameter, variadic_parameter]
  member_accesses: [member_access_expression, nullsafe_member_access_expression]
  member_calls: [member_call_expression, nullsafe_member_call_expression]
  loops: [foreach_statement, for_statement, while_statement, do_statement]

canonicalize:
  - stage: imports
    rewrite:
      - '(namespace_use_clause $Q:(qualified_name $N:name) alias: $A:name)': '(__import (__source @$Q $Q) (__source_path @$Q | replace("\", "/")) (__name @$N (__alias @$A)))'
      - '(namespace_use_clause $Q:(qualified_name $N:name))': '(__import (__source @$Q $Q) (__source_path @$Q | replace("\", "/")) (__name @$N))'
      - '(namespace_use_clause $N:name alias: $A:name)': '(namespace_use_clause @$N (__alias @$A))'
      - '(namespace_use_clause $N:name)': '(namespace_use_clause @$N)'
      - '(namespace_use_declaration $P:namespace_name body: (namespace_use_group $$$CLAUSES:namespace_use_clause))': '(__import (__source @$P $P) (__source_path @$P | replace("\", "/")) $$$CLAUSES->__name)'
      - '(scoped_call_expression scope: $Q:(qualified_name $N:name) name: $M arguments: $A)': '(php_fqn_ref (__import (__source @$Q $Q) (__source_path @$Q | replace("\", "/") | regex_replace("^/", "")) (__name @$N)) (scoped_call_expression scope: (name @$N) name: (name @$M) $A))'
      - '(object_creation_expression $Q:(qualified_name $N:name) $A:arguments)': '(php_fqn_ref (__import (__source @$Q $Q) (__source_path @$Q | replace("\", "/") | regex_replace("^/", "")) (__name @$N)) (object_creation_expression (name @$N) $A))'
  - stage: normalize
    rewrite:
      - '(global_declaration $$$N:variable_name)': '(global_names $$$N=>global_name)'
      - '(program $$$C)': '%source_file($$$C)'
      - '(namespace_definition name: $N:namespace_name body: (compound_statement $$$B))': '(namespace_definition (php_pkg (__package @$N) (__module_export (__import (__source @$N) (__source_path @$N | replace("\", "/") | regex_replace("$", "/*")) (__name "*")))) $$$B)'
      - '(namespace_definition name: $N:namespace_name)': '(php_pkg (__package @$N $N) (__module_export (__import (__source @$N) (__source_path @$N | replace("\", "/") | regex_replace("$", "/*")) (__name "*"))))'
      - '(return_statement $$$V)': '(__ssa_return $$$V)'
      - '(qualified_name $N:name)': '(name @$N)'
      - '(named_type $N:name)': '(named_type @$N)'
      - '(optional_type $T:named_type)': '(named_type @$T)'
      - '(%compound_types $T:named_type $$$R)': '(named_type @$T)'
      - '(attribute $N:name parameters:? $P)': '(__decorator @$N $P)'
      - '(member_access_expression object: (variable_name (name "this")) name: $N:name)': '(__ivar @$N)'
      - '(base_clause $$$S:name)': '(base_clause $$$S=>__supertype)'
      - '(class_interface_clause $$$S:name)': '(class_interface_clause $$$S=>__supertype)'
      - '(use_declaration $$$S:name)': '(use_declaration $$$S=>__supertype)'
      - '(property_promotion_parameter type: $T:named_type name: (variable_name $N:name))': '(__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T $T)))))'
      - '(property_promotion_parameter name: (variable_name $N:name))': '(__def (__defname @$N) (__property) (__binding (__ivar @$N)))'
      - '(simple_parameter type: $T:named_type name: $N:variable_name)': '(__binding @$N $N (__ssa_typed @$T) (__rhs (__call (__type) (__callee @$T $T))))'
      - '(%params name: $N:variable_name)': '(__binding @$N $N)'
      - '(catch_clause type: (type_list $T:named_type) name: $N:variable_name body: $B)': '(catch_clause (__binding @$N $N (__ssa_typed @$T) (__rhs (__member (__object @$T $T)))) $B)'
      - '(binary_expression left: $L (instanceof) right: $T:name)': '(binary_expression $L (__member (__object @$T $T)))'
  - stage: retag-expressions
    rewrite:
      - '(%member_accesses object: $O:__ivar name: $M:name)': '%member($M, $O)'
      - '(member_access_expression object: $O:__member name: $M:name)': '%member($M, $O)'
      - '(member_access_expression object: $O:__call name: $M:name)': '%member($M, $O)'
      - '(member_access_expression object: $O name: $M:name)': '%member_text($M, $O)'
      - '(nullsafe_member_access_expression object: $O name: $M:name)': '%member_text($M, $O)'
      - '(class_constant_access_expression $S:name $C:name)': '%member_text($C, $S)'
      - '(scoped_property_access_expression scope: $S:name name: $P:variable_name)': '%member_text($P, $S)'
      - '(%member_calls object: (variable_name (name "this")) name: $M:name arguments: $A)': '(__call (__callee (__ivar @$M)) $A)'
      - '(scoped_call_expression scope: (relative_scope "parent") name: $M:name arguments: $A)': '(__call (__callee (__member @$M (__object (__ivar "parent")))) $A)'
      - '(object_creation_expression (relative_scope "parent") $A:arguments)': '(__call (__callee "parent") $A)'
      - '(object_creation_expression $C:relative_scope $A:arguments)': '%call($C, $A)'
      - '(scoped_call_expression scope: (relative_scope) name: $M:name arguments: $A)': '(__call (__callee (__ivar @$M)) $A)'
      - '(%member_calls object: $O:__call name: $M:name arguments: $A)': '(__call (__callee %member($M, $O)) $A)'
      - '(%member_calls object: $O:__ivar name: $M:name arguments: $A)': '(__call (__callee %member($M, $O)) $A)'
      - '(member_call_expression object: $O:__member name: $M:name arguments: $A)': '(__call (__callee %member($M, $O)) $A)'
      - '(member_call_expression object: $O name: $M:name arguments: $A)': '(__call (__callee %member_text($M, $O)) $A)'
      - '(nullsafe_member_call_expression object: $O:__member name: $M:name arguments: $A)': '(__call (__callee %member($M, $O)) $A)'
      - '(nullsafe_member_call_expression object: $O name: $M:name arguments: $A)': '(__call (__callee %member_text($M, $O)) $A)'
      - '(scoped_call_expression scope: $S:name name: $M:name arguments: $A)': '(__call (__callee %member_text($M, $S)) $A)'
      - '(function_call_expression function: $F:name arguments: $A)': '%call($F, $A)'
      - '(object_creation_expression $C:name $A:arguments)': '%call($C, $A)'
      - '(object_creation_expression $C:name)': '(__call (__callee @$C $C))'
  - stage: classify
    rewrite:
      - '(assignment_expression left: $N:__ivar right: $R:__call)': '(__binding $N (__rhs $R))'
      - '(assignment_expression left: $N:__ivar right: $R)': '(__binding $N (__rhs @$R $R))'
      - '(assignment_expression left: $N:variable_name right: $R:__call)': '(__binding @$N $N (__rhs $R))'
      - '(assignment_expression left: $N:variable_name right: $R:php_fqn_ref)': '(__binding @$N $N (__rhs $R))'
      - '(assignment_expression left: $N:variable_name right: $R:__ssa_branch)': '%bind_call($N, $R)'
      - '(assignment_expression left: $N:variable_name right: $R:anonymous_function)': '(__binding @$N $N (__rhs $R))'
      - '(assignment_expression left: $N:variable_name right: $R:arrow_function)': '(__binding @$N $N (__rhs $R))'
      - '(assignment_expression left: $N:variable_name right: $R)': '(__binding @$N $N (__rhs @$R $R))'
      - '(static_variable_declaration name: $N:variable_name value: $V:__call)': '%bind_call($N, $V)'
      - '(static_variable_declaration name: $N:variable_name value: $V)': '%bind($N, $V)'
      - '(if_statement condition: $C body: $B $$$ALTS:else_if_clause|else_clause)': '(__ssa_branch $C (__ssa_arm $B) $$$ALTS->__ssa_arm)'
      - '(switch_statement condition: $C body: $B)': '(__ssa_branch $C $B)'
      - '(match_expression condition: $C body: (match_block $$$ARMS:match_conditional_expression|match_default_expression))': '(__ssa_branch $C $$$ARMS->__ssa_arm)'
      - '(try_statement body: $B $$$ALTS:catch_clause|finally_clause)': '(__ssa_branch (__ssa_arm $B) $$$ALTS->__ssa_arm)'
      - '(conditional_expression condition: $C body: $B alternative: $A)': '(__ssa_branch $C (__ssa_arm $B) (__ssa_arm $A))'
      - '(%loops body: $B)': '%loop($B)'
      - '(const_element $N:name)': '(__def (__defname @$N) (__constant))'
      - '(property_declaration type: $T:named_type (property_element name: (variable_name $N:name)))': '(__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T $T)))))'
      - '(property_declaration (property_element name: (variable_name $N:name)))': '(__def (__defname @$N) (__property))'
      - '(enum_case name: $N:name)': '(__def (__defname @$N) (__enum_variant))'
      - '(method_declaration $$$PRE name: $N:name parameters: $P return_type:? $R:named_type body: $B)': '(__def (__defname @$N) (__method) (__ssa_return_type? @$R) $$$PRE $P $B)'
      - '(method_declaration $$$PRE name: $N:name parameters: $P return_type:? $R:named_type)': '(__def (__defname @$N) (__method) (__ssa_return_type? @$R) $$$PRE $P)'
      - '(function_definition $$$PRE name: $N:name parameters: $P return_type:? $R:named_type body: $B)': '(__def (__defname @$N) (__function) (__ssa_return_type? @$R) $$$PRE $P $B)'
      - '(class_declaration $$$PRE name: $N:name (base_clause $S:__supertype) $$$ANN body: (declaration_list $$$B))': '(__def (__defname @$N) (__class @$N) (__alias "self") (__alias "static") $$$PRE $S $$$ANN (__binding "parent" (__rhs (__call (__callee @$S)))) (__binding (__ivar "parent") (__rhs (__call (__callee @$S)))) $$$B)'
      - '(class_declaration $$$PRE name: $N:name $$$ANN body: (declaration_list $$$B))': '(__def (__defname @$N) (__class @$N) (__alias "self") (__alias "static") $$$PRE $$$ANN $$$B)'
      - '(interface_declaration $$$PRE name: $N:name $$$ANN body: (declaration_list $$$B))': '(__def (__defname @$N) (__interface) $$$PRE $$$ANN $$$B)'
      - '(trait_declaration $$$PRE name: $N:name body: (declaration_list $$$B))': '(__def (__defname @$N) (__trait) (__alias "self") (__alias "static") $$$PRE $$$B)'
      - '(enum_declaration $$$PRE name: $N:name $$$ANN body: (enum_declaration_list $$$B))': '(__def (__defname @$N) (__enum) (__alias "self") (__alias "static") $$$PRE $$$ANN $$$B)'
  - stage: ssa-cleanup
    rewrite:
      - '(global_name)': '(__binding @$ROOT (__declaration "function") (__alias "module"))'
      - '(__binding "/^\$/")': '+ (__declaration "function")'
      - '(__object "/^\$/")': '+ (__declaration "function")'
      - '(__callee "/^\$/")': '+ (__declaration "function")'
      - '$R:(__ssa_return_type "self")': '(__ssa_return_type @$R | up_child("__class"))'
      - '(__ssa_return $V:variable_name)': '%return_value($V)'
  - stage: tag-defs
    rewrite:
      - '(__source_file)': '#scoped=module'
      - '(__def (__function))': '#callable=true #scoped=function'
      - '(__def (__method))': '#callable=true #scoped=function'
      - use: type_def_tags
      - use: interface_def_tags
      - '(__def (__property))': '#value=true'
      - '(__def (__constant))': '#value=true'
  - use: tag_file_dir
  - use: resolve_paths

project:
  - stage: roots
    rewrite:
      - use: src_root
      - '(__dir "app" $$$REST)': '(__dir "app" (__source_root) $$$REST)'
      - '(__dir "lib" $$$REST)': '(__dir "lib" (__source_root) $$$REST)'

display:
  - stage: fqn
    rewrite:
      - '$M:__source_file': '#entity=File #fqn=$M | child("__package") #file_path=@$M #language=@$M | split_last(".") | map("php:php", "phtml:php")'
      - '(__def)': '#entity=Definition #fqn=$ROOT | tag_up("fqn") | concat("\", $ROOT | child("__defname")) | keep_last("\", 64, 4096) #file_path=$ROOT | tag_up("file_path")'
  - stage: member_fqn
    rewrite:
      - '(__def (__property))': '#fqn=$ROOT | class | tag("fqn") | concat("\", $ROOT | child("__defname")) | keep_last("\", 64, 4096)'
  - use: def_types
  - stage: def_type_names
    rewrite:
      - '(__def (__enum_variant))': '#def_type=EnumCase'
  - stage: imports
    rewrite:
      - use: import_entity
      - '(__name)': '#import_type=Import'
      - use: aliased_import_type
