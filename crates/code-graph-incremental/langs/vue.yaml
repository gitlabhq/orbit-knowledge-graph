import: [shapes]

data:
  lifecycle_hooks: [beforeCreate, created, beforeMount, mounted, beforeUpdate, updated, beforeDestroy, destroyed,
    beforeUnmount, unmounted, activated, deactivated, errorCaptured, serverPrefetch]

canonicalize:
  - stage: normalize
    rewrite:
      - '(vue_document $$$C)': '%source_file($$$C)'
  - stage: embed
    rewrite:
      - '(vue_script $L:vue_lang)': 'parse($ROOT, @$L)'
  - stage: options-unwrap
    before: regions
    rewrite:
      - '(export_statement $$$P value: (call_expression function: (identifier "/^define(Async|Nuxt)?Component$/") arguments: (arguments $O:object)))': '(export_statement $$$P value: $O)'
  - stage: options-members
    repeat: true
    before: regions
    rewrite:
      - '(export_statement $$$P value: (object $$$A (pair key: (property_identifier "/^(methods|computed)$/") value: (object $$$M)) $$$B))': '(export_statement $$$P value: (object $$$A $$$M $$$B))'
  - stage: options-hooks
    before: regions
    rewrite:
      - '(export_statement value: (object $ROOT:(method_definition name: $N:(property_identifier %lifecycle_hooks) body: $B)))': '(__def (__defname @$N) (__method) $B) #flavor=LifecycleHook'
  - stage: options-component
    before: regions
    rewrite:
      - '(export_statement $$$P value: (object $$$A (pair key: (property_identifier "name") value: (string $S:string_fragment)) $$$B))': '(export_statement $$$P (class_declaration name: (type_identifier @$S) body: (class_body $$$A $$$B)))'
      - '(export_statement $$$P value: (object $$$A))': '(export_statement $$$P (class_declaration name: (type_identifier @$ROOT | file | regex_replace("^.*/", "") | regex_replace("[.].*$", "")) body: (class_body $$$A)))'
  - stage: options-this
    before: regions
    rewrite:
      - '(variable_declarator name: $N value: (this)) when $ROOT | up_child("type_identifier")': '(variable_declarator name: $N value: (identifier @$ROOT | up_child("type_identifier")))'

display:
  - stage: fqn
    rewrite:
      - '$M:__source_file': '#entity=File #file_path=@$M #language=vue'
