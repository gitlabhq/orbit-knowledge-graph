# GitLab CI files (`.gitlab-ci.yml` and fragments): container images only.
# Handles: `image:` (string or `name:`), `services:` entries (string or
# `name:`) and `*_IMAGE` variables (string or `value:`), each an ImportedSymbol
# named after the bare image with its tag and digest split out. Only the
# positions GitLab CI defines count: the root, `default:` and a job for `image:`
# and `services:`, and the root and a job `variables:`. Nothing else in the
# file is indexed, and an image reference is kept as written, `$VAR` included.

config:
  stdlib: []
  max_imports: 1000

stages:
  - name: normalize
    rules:
      - match: '(stream $$$C)'
        replace: '(__source_file @$ROOT $$$C)'

  - name: flags
    rules:
      - match: '(plain_scalar (string_scalar "/^(true|false|True|False|TRUE|FALSE|yes|no|on|off|null|Null|NULL|~)$/"))'
        replace: '(__flag)'

  # A quoted scalar keeps its quotes in the source text; every value and key
  # becomes a scalar node with the bare text. Unquoted booleans, null and
  # numbers stay out.
  - name: scalars
    rules:
      - match: '(plain_scalar $X:string_scalar)'
        replace: '(__scalar @$X)'
      - match: '$Q:double_quote_scalar'
        replace: '(__scalar @$Q|regex_replace("^[\x22\x27]|[\x22\x27]$", ""))'
      - match: '$Q:single_quote_scalar'
        replace: '(__scalar @$Q|regex_replace("^[\x22\x27]|[\x22\x27]$", ""))'

  - name: empty-scalars
    rules:
      - match: '(__scalar "/^$/")'
        replace: '(__empty)'

  - name: mark-root
    rules:
      - match: '(document (block_node (block_mapping $$$P)))'
        replace: '(document (block_node (__ci_root $$$P)))'

  # Each root entry is a keyword section, `default:` or a job. Marking runs to
  # a fixpoint because a marked entry no longer matches its own rule.
  - name: mark-sections
    repeat: true
    rules:
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar "default")) value: (block_node (block_mapping $$$P))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (block_node (__ci_default $$$P))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar "variables")) value: (block_node (block_mapping $$$P))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (block_node (__ci_vars $$$P))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar "/^(include|stages|workflow|spec|cache|before_script|after_script|types)$/")) value: (block_node (block_mapping $$$P))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (block_node (__ci_other $$$P))) $$$B)'

  # One entry per pass, so a long list costs a pass each; the rewrite budget
  # bounds it.
  - name: root-images
    repeat: true
    rules:
      - match: '(__ci_root $$$A (block_mapping_pair key: (flow_node (__scalar "image")) value: (flow_node $V:__scalar)) $$$B)'
        replace: '(__ci_root $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: (flow_node (__scalar "image")) value: (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$B)'
        replace: '(__ci_root $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: (flow_node (__scalar "image")) value: (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$B)'
        replace: '(__ci_root $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (block_node (block_sequence $$$C (block_sequence_item (flow_node $V:__scalar)) $$$D))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (block_node (block_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (block_node (block_sequence $$$C (block_sequence_item (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$D))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (block_node (block_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (block_node (block_sequence $$$C (block_sequence_item (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$D))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (block_node (block_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (flow_node (flow_sequence $$$C (flow_node $V:__scalar) $$$D))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (flow_node (flow_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (flow_node (flow_sequence $$$C (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)) $$$D))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (flow_node (flow_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'

  - name: mark-jobs
    repeat: true
    rules:
      - match: '(__ci_root $$$A (block_mapping_pair key: $K:(flow_node (__scalar)) value: (block_node (block_mapping $$$P))) $$$B)'
        replace: '(__ci_root $$$A (block_mapping_pair key: $K value: (block_node (__ci_scope $$$P))) $$$B)'

  - name: mark-job-variables
    repeat: true
    rules:
      - match: '(__ci_scope $$$A (block_mapping_pair key: $K:(flow_node (__scalar "variables")) value: (block_node (block_mapping $$$P))) $$$B)'
        replace: '(__ci_scope $$$A (block_mapping_pair key: $K value: (block_node (__ci_vars $$$P))) $$$B)'

  - name: mark-default
    rules:
      - match: '(__ci_default $$$P)'
        replace: '(__ci_scope $$$P)'

  - name: scope-images
    repeat: true
    rules:
      - match: '(__ci_scope $$$A (block_mapping_pair key: (flow_node (__scalar "image")) value: (flow_node $V:__scalar)) $$$B)'
        replace: '(__ci_scope $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)'
      - match: '(__ci_scope $$$A (block_mapping_pair key: (flow_node (__scalar "image")) value: (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$B)'
        replace: '(__ci_scope $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)'
      - match: '(__ci_scope $$$A (block_mapping_pair key: (flow_node (__scalar "image")) value: (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$B)'
        replace: '(__ci_scope $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)'
      - match: '(__ci_scope $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (block_node (block_sequence $$$C (block_sequence_item (flow_node $V:__scalar)) $$$D))) $$$B)'
        replace: '(__ci_scope $$$A (block_mapping_pair key: $K value: (block_node (block_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'
      - match: '(__ci_scope $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (block_node (block_sequence $$$C (block_sequence_item (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$D))) $$$B)'
        replace: '(__ci_scope $$$A (block_mapping_pair key: $K value: (block_node (block_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'
      - match: '(__ci_scope $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (block_node (block_sequence $$$C (block_sequence_item (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$D))) $$$B)'
        replace: '(__ci_scope $$$A (block_mapping_pair key: $K value: (block_node (block_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'
      - match: '(__ci_scope $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (flow_node (flow_sequence $$$C (flow_node $V:__scalar) $$$D))) $$$B)'
        replace: '(__ci_scope $$$A (block_mapping_pair key: $K value: (flow_node (flow_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'
      - match: '(__ci_scope $$$A (block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (flow_node (flow_sequence $$$C (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)) $$$D))) $$$B)'
        replace: '(__ci_scope $$$A (block_mapping_pair key: $K value: (flow_node (flow_sequence $$$C (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$D))) $$$B)'

  - name: variable-images
    repeat: true
    rules:
      - match: '(__ci_vars $$$A (block_mapping_pair key: (flow_node (__scalar "/^(IMAGE|.*_IMAGE)$/")) value: (flow_node $V:__scalar)) $$$B)'
        replace: '(__ci_vars $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)'
      - match: '(__ci_vars $$$A (block_mapping_pair key: (flow_node (__scalar "/^(IMAGE|.*_IMAGE)$/")) value: (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "value")) value: (flow_node $V:__scalar)) $$$Y))) $$$B)'
        replace: '(__ci_vars $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)'

  - name: tag-images
    rules:
      - match: '(__name (__ci_image))'
        tag: { import_type: CiImage }

resolve:
  stages: []

display:
  - name: file
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M|stem|split_last("/")'
          file_path: '@$M'
          language: '@$M|split_last("/")|regex_replace("(?i)^(\.gitlab-ci[.-].*|.*\.gitlab-ci)\.ya?ml$", "x.yaml")|split_last(".")'
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: ImportedSymbol
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
