# GitLab CI files (`.gitlab-ci.yml` and fragments): container images only.
# Handles: `image:` (string or `name:`), `services:` entries (string or
# `name:`) and `*_IMAGE` variables (string or `value:`), each an ImportedSymbol
# named after the bare image with its tag and digest split out. Only the
# positions GitLab CI defines count: the root, `default:` and a job for `image:`
# and `services:`, and the root and a job `variables:`. Nothing else in the
# file is indexed, an image reference is kept as written, `$VAR` included, and
# a value with a YAML tag such as `!reference` is not an image.

config:
  stdlib: []

stages:
  - name: normalize
    rules:
      - match: '(stream $$$C)'
        replace: '(__source_file @$ROOT $$$C)'

  - name: tagged
    rules:
      - match: '(flow_node (tag) $$$C)'
        replace: '(flow_node (__tagged))'
      - match: '(block_node (tag) $$$C)'
        replace: '(block_node (__tagged))'

  - name: flags
    rules:
      - match: '(plain_scalar (string_scalar "/^(true|false|True|False|TRUE|FALSE|yes|no|on|off|null|Null|NULL|~)$/"))'
        replace: '(__flag)'

  # A quoted scalar keeps its quotes in the source text; every value and key
  # becomes a scalar node with the bare text. Unquoted booleans, null and
  # numbers stay out.
  - name: scalars
    rules:
      - match: '(plain_scalar $X:string_scalar)'
        replace: '(__scalar @$X)'
      - match: '$Q:double_quote_scalar'
        replace: '(__scalar @$Q|regex_replace("^[\x22\x27]|[\x22\x27]$", ""))'
      - match: '$Q:single_quote_scalar'
        replace: '(__scalar @$Q|regex_replace("^[\x22\x27]|[\x22\x27]$", ""))'

  - name: empty-scalars
    rules:
      - match: '(__scalar "/^$/")'
        replace: '(__empty)'

  - name: mark-root
    rules:
      - match: '(document (block_node (block_mapping $$$P)))'
        replace: '(document (block_node (__ci_root $$$P->__ci_rpair)))'

  # Each stage reads a pair's own kind, so a pass is linear in the file. The
  # kinds say where a pair sits: root, `default:`, a job, or a variables map.
  - name: root-sections
    rules:
      - match: '(__ci_rpair key: (flow_node (__scalar "default")) value: (block_node (block_mapping $$$P)))'
        replace: '(__ci_default $$$P->__ci_dpair)'
      - match: '(__ci_rpair key: (flow_node (__scalar "variables")) value: (block_node (block_mapping $$$P)))'
        replace: '(__ci_vars $$$P->__ci_vpair)'
      - match: '(__ci_rpair key: (flow_node (__scalar "/^(include|stages|workflow|spec|cache|before_script|after_script|types)$/")) $$$C)'
        replace: '(__ci_other $$$C)'
      - match: '(__ci_rpair key: (flow_node (__scalar "image")) value: (flow_node $V:__scalar))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_rpair key: (flow_node (__scalar "image")) value: (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_rpair key: (flow_node (__scalar "image")) value: (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_rpair key: (flow_node (__scalar "services")) value: (block_node (block_sequence $$$I)))'
        replace: '(__ci_services $$$I->__ci_svc)'
      - match: '(__ci_rpair key: (flow_node (__scalar "services")) value: (flow_node (flow_sequence $$$I)))'
        replace: '(__ci_services $$$I->__ci_fsvc)'

  - name: mark-jobs
    rules:
      - match: '(__ci_rpair key: (flow_node (__scalar)) value: (block_node (block_mapping $$$P)))'
        replace: '(__ci_job $$$P->__ci_spair)'

  - name: job-sections
    rules:
      - match: '(__ci_spair key: (flow_node (__scalar "variables")) value: (block_node (block_mapping $$$P)))'
        replace: '(__ci_vars $$$P->__ci_vpair)'
      - match: '(__ci_spair key: (flow_node (__scalar "image")) value: (flow_node $V:__scalar))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_spair key: (flow_node (__scalar "image")) value: (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_spair key: (flow_node (__scalar "image")) value: (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_spair key: (flow_node (__scalar "services")) value: (block_node (block_sequence $$$I)))'
        replace: '(__ci_services $$$I->__ci_svc)'
      - match: '(__ci_spair key: (flow_node (__scalar "services")) value: (flow_node (flow_sequence $$$I)))'
        replace: '(__ci_services $$$I->__ci_fsvc)'
      - match: '(__ci_dpair key: (flow_node (__scalar "image")) value: (flow_node $V:__scalar))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_dpair key: (flow_node (__scalar "image")) value: (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_dpair key: (flow_node (__scalar "image")) value: (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_dpair key: (flow_node (__scalar "services")) value: (block_node (block_sequence $$$I)))'
        replace: '(__ci_services $$$I->__ci_svc)'
      - match: '(__ci_dpair key: (flow_node (__scalar "services")) value: (flow_node (flow_sequence $$$I)))'
        replace: '(__ci_services $$$I->__ci_fsvc)'

  - name: entries
    rules:
      - match: '(__ci_svc (flow_node $V:__scalar))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_svc (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_svc (flow_node (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_fsvc $V:__scalar)'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_fsvc (flow_mapping $$$X (flow_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_vpair key: (flow_node (__scalar "/^(IMAGE|.*_IMAGE)$/")) value: (flow_node $V:__scalar))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(__ci_vpair key: (flow_node (__scalar "/^(IMAGE|.*_IMAGE)$/")) value: (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "value")) value: (flow_node $V:__scalar)) $$$Y)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":(?:[^:/{}]|\{[^}]*\})*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?(?:[^:/{}]|\{[^}]*\})*$","")|regex_replace("^.*:((?:[^:/{}]|\{[^}]*\})*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'

  - name: tag-images
    rules:
      - match: '(__name (__ci_image))'
        tag: { import_type: CiImage }

resolve:
  stages: []

display:
  - name: file
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M|stem|split_last("/")'
          file_path: '@$M'
          language: '@$M|split_last("/")|regex_replace("(?i)^(\.gitlab-ci[.-].*|.*\.gitlab-ci)\.ya?ml$", "x.yaml")|split_last(".")'
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: ImportedSymbol
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
