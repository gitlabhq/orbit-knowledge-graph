# GitLab CI files (`.gitlab-ci.yml` and fragments): container images only.
# Handles: `image:` (string or `name:`), `services:` entries (string or
# `name:`) and `*_IMAGE` variables, each an ImportedSymbol named after the
# bare image with its tag and digest split out. Nothing else in the file is
# indexed, and an image reference is kept as written, `$VAR` included.

config:
  stdlib: []
  max_imports: 1000

stages:
  - name: normalize
    rules:
      - match: '(stream $$$C)'
        replace: '(__source_file @$ROOT $$$C)'

  # A quoted scalar keeps its quotes in the source text; every value and key
  # becomes a scalar node with the bare text.
  - name: scalars
    rules:
      - match: '(plain_scalar $X:string_scalar)'
        replace: '(__scalar @$X)'
      - match: '$Q:double_quote_scalar'
        replace: '(__scalar @$Q|regex_replace("^[\x22\x27]|[\x22\x27]$", ""))'
      - match: '$Q:single_quote_scalar'
        replace: '(__scalar @$Q|regex_replace("^[\x22\x27]|[\x22\x27]$", ""))'

  - name: empty-scalars
    rules:
      - match: '(__scalar "/^$/")'
        replace: '(__empty)'

  - name: images
    rules:
      - match: '(block_mapping_pair key: (flow_node (__scalar "image")) value: (flow_node $V:__scalar))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?[^/:]*$","")|regex_replace("^.*:([^:/]*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(block_mapping_pair key: (flow_node (__scalar "/_IMAGE$/")) value: (flow_node $V:__scalar))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?[^/:]*$","")|regex_replace("^.*:([^:/]*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'
      - match: '(block_mapping_pair key: (flow_node (__scalar "image")) value: (block_node (block_mapping $$$A (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$B)))'
        replace: '(__import (__source @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?[^/:]*$","")|regex_replace("^.*:([^:/]*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?",""))))'

  # One entry per pass, so a long list costs a pass each; the rewrite budget
  # bounds it.
  - name: services
    repeat: true
    rules:
      - match: '(block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (block_node (block_sequence $$$A (block_sequence_item (flow_node $V:__scalar)) $$$B)))'
        replace: '(block_mapping_pair key: $K value: (block_node (block_sequence $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?[^/:]*$","")|regex_replace("^.*:([^:/]*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)))'
      - match: '(block_mapping_pair key: $K:(flow_node (__scalar "services")) value: (block_node (block_sequence $$$A (block_sequence_item (block_node (block_mapping $$$X (block_mapping_pair key: (flow_node (__scalar "name")) value: (flow_node $V:__scalar)) $$$Y))) $$$B)))'
        replace: '(block_mapping_pair key: $K value: (block_node (block_sequence $$$A (__import (__source @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__source_path @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","")) (__name @$V|regex_replace("@.*$","")|regex_replace(":[^:/]*$","") (__ci_image) (__import_tag @$V|regex_replace("@.*$","")|regex_replace("^(?:.*/)?[^/:]*$","")|regex_replace("^.*:([^:/]*)$","$1")) (__import_digest @$V|regex_first("^[^@]*@?","")))) $$$B)))'

  - name: tag-images
    rules:
      - match: '(__name (__ci_image))'
        tag: { import_type: CiImage }

resolve:
  stages: []

display:
  - name: file
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M|stem|split_last("/")'
          file_path: '@$M'
          language: yaml
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: ImportedSymbol
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
