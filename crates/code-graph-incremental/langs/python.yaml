import: [canonical, display, roots, shapes]

data:
  value_kinds: [__class, __struct, __trait, __enum, __enum_variant, __field_def, __property, __constant,
    __static_constant, __variable, __type_alias, __interface, __function, __method]
  builtins: [__import__, abs, aiter, all, anext, any, ascii, bin, bool, breakpoint, bytearray, bytes,
    callable, chr, classmethod, compile, complex, delattr, dict, dir, divmod, enumerate, eval, exec, filter,
    float, format, frozenset, getattr, globals, hasattr, hash, help, hex, id, input, int, isinstance,
    issubclass, iter, len, list, locals, map, max, memoryview, min, next, object, oct, open, ord, pow,
    print, property, range, repr, reversed, round, set, setattr, slice, sorted, staticmethod, str, sum,
    super, tuple, type, vars, zip, BaseException, BaseExceptionGroup, Exception, ExceptionGroup, ArithmeticError,
    AssertionError, AttributeError, BlockingIOError, BrokenPipeError, BufferError, ChildProcessError,
    ConnectionAbortedError, ConnectionError, ConnectionRefusedError, ConnectionResetError, EOFError, FileExistsError,
    FileNotFoundError, FloatingPointError, GeneratorExit, ImportError, IndentationError, IndexError, InterruptedError,
    IsADirectoryError, KeyError, KeyboardInterrupt, LookupError, MemoryError, ModuleNotFoundError, NameError,
    NotADirectoryError, NotImplementedError, OSError, OverflowError, PermissionError, ProcessLookupError,
    RecursionError, ReferenceError, RuntimeError, StopAsyncIteration, StopIteration, SyntaxError, SystemError,
    SystemExit, TabError, TimeoutError, TypeError, UnboundLocalError, UnicodeDecodeError, UnicodeEncodeError,
    UnicodeError, UnicodeTranslateError, ValueError, ZeroDivisionError, Warning, UserWarning, DeprecationWarning,
    PendingDeprecationWarning, SyntaxWarning, RuntimeWarning, FutureWarning, ImportWarning, UnicodeWarning,
    BytesWarning, ResourceWarning, EncodingWarning]
  stdlib: [abc, argparse, ast, asyncio, base64, bisect, calendar, collections, concurrent, configparser,
    contextlib, contextvars, copy, csv, ctypes, dataclasses, datetime, decimal, difflib, email, enum,
    errno, fnmatch, fractions, ftplib, functools, gc, glob, gzip, hashlib, heapq, hmac, html, http, importlib,
    inspect, io, ipaddress, itertools, json, logging, math, mimetypes, multiprocessing, numbers, operator,
    os, pathlib, pdb, pickle, pkgutil, platform, pprint, queue, random, re, secrets, select, selectors,
    shelve, shlex, shutil, signal, socket, socketserver, sqlite3, ssl, stat, statistics, string, struct,
    subprocess, sysconfig, tarfile, tempfile, textwrap, threading, timeit, tkinter, tomllib, traceback,
    types, typing, unicodedata, unittest, urllib, uuid, venv, warnings, weakref, xml, xmlrpc, zipfile,
    zlib, zoneinfo]
  external: [sys, builtins, time]
  providers:
  - [builtins, '%builtins']
  - [math, acos, acosh, asin, asinh, atan, atan2, atanh, cbrt, ceil, comb, copysign, cos, cosh, degrees,
    dist, erf, erfc, exp, exp2, expm1, fabs, factorial, floor, fmod, frexp, fsum, gamma, gcd, hypot, isclose,
    isfinite, isinf, isnan, isqrt, lcm, ldexp, lgamma, log, log10, log1p, log2, modf, nextafter, perm,
    pow, prod, radians, remainder, sin, sinh, sqrt, sumprod, tan, tanh, trunc, ulp]
  lookup_from: [__source_root]
  project_dirs: [__root, __dir]
  call_wrappers: [await, parenthesized_expression]
  loops: [for_statement, while_statement]
  comprehensions: [list_comprehension, set_comprehension, dictionary_comprehension, generator_expression]

canonicalize:
  - stage: normalize
    rewrite:
      - '(module $$$C)': '%source_file($$$C)'
      - '(return_statement $$$VALS)': '(__ssa_return $$$VALS)'
      - '(lambda $$$C)': '(__lambda $$$C)'
      - '(decorator $N:identifier)': '(__decorator @$N)'
      - '(decorated_definition $$$DECOS:__decorator definition: $D)': '$D { $$$DECOS }'
      - '(class_definition name: $N superclasses: (argument_list $$$SUPERS:identifier|attribute|call) $$$REST)': '(class_definition $N $$$SUPERS=>__supertype $$$REST)'
      - '(attribute object: (identifier "self") attribute: $A)': '(__ivar @$A)'
      - '(attribute object: (identifier "cls") attribute: $A)': '(__ivar @$A)'
      - '(aliased_import name: $N alias: $A)': '(aliased_import @$N $N (__alias @$A))'
      - '(aliased_import name: $N)': '(aliased_import @$N)'
  - stage: retag-refs
    rewrite:
      - '(attribute object: $O:__ivar attribute: $M)': '%member($M, $O)'
      - '(attribute object: $O:__member attribute: $M)': '%member($M, $O)'
      - '(attribute object: $O attribute: $M)': '%member_text($M, $O)'
  - stage: retag-calls
    rewrite:
      - '(call function: $F:__ivar arguments: $A)': '(__call (__callee $F) $A)'
      - '(call function: $F:__member arguments: $A)': '(__call (__callee $F) $A)'
      - '(%call_wrappers $V:__call)': '$V'
      - '(call function: $F arguments: $A)': '%call($F, $A)'
  - stage: imports
    rewrite:
      - '(import_from_statement module_name: $M $W:wildcard_import)': '(__import (__source @$M $M) (__source_path @$M) (__name @$W $W))'
      - '(import_from_statement module_name: $M $$$NAMES:dotted_name|aliased_import)': '(__import (__source @$M $M) (__source_path @$M) $$$NAMES->__name)'
      - '(import_statement name: $N:dotted_name)': '(__import (__source @$N $N) (__source_path @$N) (__name @$N (__ssa_hint @$N | split_first("."))))'
      - '(import_statement name: $N:aliased_import)': '(__import (__source @$N) (__source_path @$N) @$N->__name)'
      - '(future_import_statement $$$NAMES:dotted_name)': '(__import (__source "__future__") (__source_path "__future__") $$$NAMES=>__name)'
  - stage: classify
    rewrite:
      - '(global_statement $$$N:identifier)': '(global_names $$$N=>global_name)'
      - '(nonlocal_statement $$$N:identifier)': '(nonlocal_names $$$N=>nonlocal_name)'
      - '(assignment left: $N right: $R:__lambda)': '(__def (__defname @$N $N) (__lambda) $R)'
      - '(assignment left: (attribute object: (identifier "self") attribute: $N) type: $T:type)': '(__def (__defname @$N) (__field_def) (__binding (__ivar @$N) (__ssa_typed @$T)))'
      - '(assignment left: $N type: $T:type)': '(__def (__defname @$N $N) (__field_def))'
      - '(typed_default_parameter name: $N type: (type $T) value: $V)': '(__binding @$N (__ssa_typed @$T $T) (__rhs @$V $V))'
      - '(typed_default_parameter name: $N type: (type $T))': '(__binding @$N (__ssa_typed @$T))'
      - '(typed_default_parameter name: $N)': '(__binding @$N)'
      - '(typed_parameter $C:identifier type: (type $T))': '(__binding @$C (__ssa_typed @$T $T))'
      - '(typed_parameter $C:identifier)': '(__binding @$C)'
      - '(default_parameter name: $N:identifier value: $V)': '%bind($N, $V)'
      - '(lambda_parameters $$$P:identifier|__binding)': '(lambda_parameters $$$P->__binding)'
      - '(assignment left: $N:__ivar right: $R:__call)': '(__binding $N (__rhs $R))'
      - '(assignment left: $N:__ivar right: $R)': '(__binding $N (__rhs @$R $R))'
      - '(assignment left: $N right: $R:__call)': '(__binding @$N $N (__declaration "function") (__rhs $R))'
      - '(assignment left: $N right: $R:__ssa_loop)': '(__binding @$N $N (__rhs $R))'
      - '(assignment left: $N right: $R)': '(__binding @$N $N (__declaration "function") (__rhs @$R $R))'
      - '(assignment left: $N:__ivar)': '(__binding $N)'
      - '(assignment left: $N)': '(__binding @$N)'
      - '(augmented_assignment left: $N right: $R:__call)': '(__binding @$N $N (__rhs $R))'
      - '(augmented_assignment left: $N right: $R)': '(__binding @$N $N (__rhs @$R $R))'
      - '(named_expression name: $N value: $V:__call)': '%bind_call($N, $V)'
      - '(named_expression name: $N value: $V)': '%bind($N, $V)'
      - '(if_statement condition: $COND consequence: $C $$$ALTS:elif_clause|else_clause)': '(__ssa_branch $COND (__ssa_arm $C) $$$ALTS->__ssa_arm)'
      - '(try_statement body: $B $$$ALTS:except_clause|finally_clause)': '(__ssa_branch (__ssa_arm $B) $$$ALTS->__ssa_arm)'
      - '(match_statement subject: $S body: (block $$$CASES:case_clause))': '(__ssa_branch $S $$$CASES->__ssa_arm)'
      - '(conditional_expression $A:_*_named $COND:_*_named $B:_*_named)': '(__ssa_branch $COND (__ssa_arm $A) (__ssa_arm $B))'
      - '(for_statement left: $N:identifier right: (tuple $$$E) body: $B)': '(__ssa_loop (__arr $$$E) (__binding @$N (__declaration "function")) $B)'
      - '(for_statement left: $N:identifier right: (list $$$E) body: $B)': '(__ssa_loop (__arr $$$E) (__binding @$N (__declaration "function")) $B)'
      - '(for_statement left: $N:identifier right: (expression_list $$$E) body: $B)': '(__ssa_loop (__arr $$$E) (__binding @$N (__declaration "function")) $B)'
      - '(for_statement left: $N:identifier right: $V body: $B)': '(__ssa_loop $V (__binding @$N (__declaration "function")) $B)'
      - '(%loops body: $B)': '%loop($B)'
      - '(%comprehensions $$$BODY)': '%loop($$$BODY)'
      - '(function_definition name: $N **/(identifier "self") parameters:? (parameters $$$P:__binding) return_type:? $R body: $B $$$ANN:__decorator)': '(__def (__defname @$N) (__method) (__ssa_return_type? @$R $R) $$$ANN $$$P $B) #flavor=self_method'
      - '(function_definition name: $N parameters:? (parameters $$$P:__binding) return_type:? $R body: $B $$$ANN:__decorator)': '(__def (__defname @$N) (__function) (__ssa_return_type? @$R $R) $$$ANN $$$P $B)'
      - '(class_definition name: $N $$$ANN:__supertype|__decorator body: $B **/(__def (__defname "__call__")))': '(__def (__defname @$N) (__class) (__callable "__call__") $$$ANN $B)'
      - '(class_definition name: $N $$$ANN:__supertype|__decorator body: $B)': '(__def (__defname @$N) (__class) $$$ANN $B)'
  - stage: ssa-cleanup
    rewrite:
      - '(global_name)': '(__binding @$ROOT (__declaration "function") (__alias "module"))'
      - '(nonlocal_name)': '(__binding @$ROOT (__declaration "function") (__alias "function"))'
      - '(__ssa_return $V:identifier)': '%return_value($V)'
  - stage: tag-defs
    rewrite:
      - '(__source_file)': '#scoped=module'
      - '(__def (__function))': '#callable=true #value=true #scoped=function'
      - '(__def (__method))': '#callable=true #value=true #scoped=function'
      - '(__def (__class))': '#callable=true #value=true #declares_type=true #scoped=true'
      - '(__def (__lambda))': '#callable=true #scoped=true'
      - '(__def (__enum_variant))': '#callable=true #value=true'
      - '(__def (__field_def))': '#value=true'
  - use: tag_file_dir
  - stage: tag-source-path
    rewrite:
      - '(__import)': '#source_rel=$ROOT | child_sym("__source_path") | regex_loop("(\w)\.(\w)", "$1/$2") | regex_loop("^((?:~/)*)\.", "$1~/") | regex_first("~/", "./") | regex_replace("~/", "../") | regex_loop("^\./\.\./", "../")'
  - stage: resolve-paths
    rewrite:
      - '(__import)': '#resolved_source=$ROOT | tag("source_rel")'
      - '(__import (__source_path "^."))': '#resolved_source=$ROOT | tag_up("file_dir") | concat("/", $ROOT | tag("source_rel")) | regex_replace("(^|/)\./", "$1") | regex_loop("[^/]+/\.\./", "") | regex_replace("/$", "") | regex_replace("^/", "")'

project:
  - stage: packages
    rewrite:
      - '(__dir (__file "__init__.py") $$$REST)': '(__dir (__package) (__file "__init__.py") $$$REST)'
      - '(__dir (__file "__init__.pyi") $$$REST)': '(__dir (__package) (__file "__init__.pyi") $$$REST)'
  - stage: roots
    rewrite:
      - '(%project_dirs !(__package) !(__source_root) (__dir (__package)))': '+ (__source_root)'
  - stage: src_dirs
    rewrite:
      - use: src_root

display:
  - stage: fqn
    rewrite:
      - '$M:__source_file': '#entity=File #fqn=@$M | stem | collapse_index("__init__") | replace("/", ".") #file_path=@$M #language=@$M | split_last(".") | map("py:python", "pyi:python")'
      - use: def_fqn_dotted
  - stage: def_type
    rewrite:
      - use: function_def_types
      - use: type_def_types
  - stage: imports
    rewrite:
      - '(__import)': '#entity=ImportedSymbol #file_path=$ROOT | tag_up("file_path") #source_path=$ROOT | tag("resolved_source") | replace("/", ".")'
      - '(__name "*")': '#import_type=WildcardImport'
      - use: aliased_import_type
      - '(__import $S:__source $$$A $N:__name $$$B) when @$N | eq(@$S)': '#import_type@__name=Import'
