# Python rewrite rules — complete language definition.
# Stamps all synthetics needed by SSA and resolver.

import: [canonical, display, roots, shapes]

data:
  value_kinds: [__class, __struct, __trait, __enum, __enum_variant, __field_def, __property, __constant, __static_constant, __variable, __type_alias, __interface, __function, __method]
  builtins: [
    __import__, abs, aiter, all, anext, any, ascii, bin, bool, breakpoint, bytearray, bytes,
    callable, chr, classmethod, compile, complex, delattr, dict, dir, divmod, enumerate, eval,
    exec, filter, float, format, frozenset, getattr, globals, hasattr, hash, help, hex, id, input,
    int, isinstance, issubclass, iter, len, list, locals, map, max, memoryview, min, next, object,
    oct, open, ord, pow, print, property, range, repr, reversed, round, set, setattr, slice,
    sorted, staticmethod, str, sum, super, tuple, type, vars, zip, BaseException,
    BaseExceptionGroup, Exception, ExceptionGroup, ArithmeticError, AssertionError, AttributeError,
    BlockingIOError, BrokenPipeError, BufferError, ChildProcessError, ConnectionAbortedError,
    ConnectionError, ConnectionRefusedError, ConnectionResetError, EOFError, FileExistsError,
    FileNotFoundError, FloatingPointError, GeneratorExit, ImportError, IndentationError,
    IndexError, InterruptedError, IsADirectoryError, KeyError, KeyboardInterrupt, LookupError,
    MemoryError, ModuleNotFoundError, NameError, NotADirectoryError, NotImplementedError, OSError,
    OverflowError, PermissionError, ProcessLookupError, RecursionError, ReferenceError,
    RuntimeError, StopAsyncIteration, StopIteration, SyntaxError, SystemError, SystemExit,
    TabError, TimeoutError, TypeError, UnboundLocalError, UnicodeDecodeError, UnicodeEncodeError,
    UnicodeError, UnicodeTranslateError, ValueError, ZeroDivisionError, Warning, UserWarning,
    DeprecationWarning, PendingDeprecationWarning, SyntaxWarning, RuntimeWarning, FutureWarning,
    ImportWarning, UnicodeWarning, BytesWarning, ResourceWarning, EncodingWarning
  ]
  stdlib: [
    abc, argparse, ast, asyncio, base64, bisect, calendar, collections, concurrent, configparser,
    contextlib, contextvars, copy, csv, ctypes, dataclasses, datetime, decimal, difflib, email,
    enum, errno, fnmatch, fractions, ftplib, functools, gc, glob, gzip, hashlib, heapq, hmac, html,
    http, importlib, inspect, io, ipaddress, itertools, json, logging, math, mimetypes,
    multiprocessing, numbers, operator, os, pathlib, pdb, pickle, pkgutil, platform, pprint, queue,
    random, re, secrets, select, selectors, shelve, shlex, shutil, signal, socket, socketserver,
    sqlite3, ssl, stat, statistics, string, struct, subprocess, sysconfig, tarfile, tempfile,
    textwrap, threading, timeit, tkinter, tomllib, traceback, types, typing, unicodedata, unittest,
    urllib, uuid, venv, warnings, weakref, xml, xmlrpc, zipfile, zlib, zoneinfo
  ]
  external: [sys, builtins, time]
  providers:
    - [builtins, '%builtins']
    - [
        math, acos, acosh, asin, asinh, atan, atan2, atanh, cbrt, ceil, comb, copysign, cos, cosh,
        degrees, dist, erf, erfc, exp, exp2, expm1, fabs, factorial, floor, fmod, frexp, fsum,
        gamma, gcd, hypot, isclose, isfinite, isinf, isnan, isqrt, lcm, ldexp, lgamma, log, log10,
        log1p, log2, modf, nextafter, perm, pow, prod, radians, remainder, sin, sinh, sqrt,
        sumprod, tan, tanh, trunc, ulp
      ]
  lookup_from: [__source_root]
  project_dirs: [__root, __dir]
  call_wrappers: [await, parenthesized_expression]
  loops: [for_statement, while_statement]
  comprehensions: [list_comprehension, set_comprehension, dictionary_comprehension, generator_expression]

canonicalize:
  - name: normalize
    rules:
      - match: '(module $$$C)'
        replace: '%source_file($$$C)'
      - match: '(return_statement $$$VALS)'
        replace: '(__ssa_return $$$VALS)'
      - match: '(lambda $$$C)'
        replace: '(__lambda $$$C)'
      # Hoist decorators onto the inner def/class
      - match: '(decorator $N:identifier)'
        replace: '(__decorator @$N)'
      - match: '(decorated_definition $$$DECOS:__decorator definition: $D)'
        replace: '$D { $$$DECOS }'
      # Superclass list → __supertype children on the class
      - match: '(class_definition name: $N superclasses: (argument_list $$$SUPERS:identifier|attribute|call) $$$REST)'
        replace: '(class_definition $N $$$SUPERS=>__supertype $$$REST)'
      # self.x / cls.x → __ivar
      - match: '(attribute object: (identifier "self") attribute: $A)'
        replace: '(__ivar @$A)'
      - match: '(attribute object: (identifier "cls") attribute: $A)'
        replace: '(__ivar @$A)'
      # Aliased import: capture real name as sym, alias as child
      - match: '(aliased_import name: $N alias: $A)'
        replace: '(aliased_import @$N $N (__alias @$A))'
      - match: '(aliased_import name: $N)'
        replace: '(aliased_import @$N)'
  - name: retag-refs
    rules:
      # self.x.method → __member "method" (__object __ivar)
      - match: '(attribute object: $O:__ivar attribute: $M)'
        replace: '%member($M, $O)'
      # a.b.c → __member "c" (__object (__member "b" (__object "a")))
      - match: '(attribute object: $O:__member attribute: $M)'
        replace: '%member($M, $O)'
      # a.b → __member "b" (__object "a")
      - match: '(attribute object: $O attribute: $M)'
        replace: '%member_text($M, $O)'
  - name: retag-calls
    rules:
      - match: '(call function: $F:__ivar arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call function: $F:__member arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      # `await f()` and `(f())` carry the value of the call they wrap
      - match: '(%call_wrappers $V:__call)'
        replace: '$V'
      - match: '(call function: $F arguments: $A)'
        replace: '%call($F, $A)'
  - name: imports
    rules:
      # from X import * (must precede named-import rule due to first-match-wins)
      - match: '(import_from_statement module_name: $M $W:wildcard_import)'
        replace: '(__import (__source @$M $M) (__source_path @$M) (__name @$W $W))'
      # from X import a, b  /  from X import a as b  /  mixed
      - match: '(import_from_statement module_name: $M $$$NAMES:dotted_name|aliased_import)'
        replace: '(__import (__source @$M $M) (__source_path @$M) $$$NAMES->__name)'
      # import X / import X.Y.Z
      - match: '(import_statement name: $N:dotted_name)'
        replace: '(__import (__source @$N $N) (__source_path @$N) (__name @$N (__ssa_hint @$N | split_first("."))))'
      # import X as Y — rekind capture to __name, keeping __alias subtree
      - match: '(import_statement name: $N:aliased_import)'
        replace: '(__import (__source @$N) (__source_path @$N) @$N->__name)'
      # from __future__ import X
      - match: '(future_import_statement $$$NAMES:dotted_name)'
        replace: '(__import (__source "__future__") (__source_path "__future__") $$$NAMES=>__name)'
  - name: classify
    rules:
      - match: '(global_statement $$$N:identifier)'
        replace: '(global_names $$$N=>global_name)'
      - match: '(nonlocal_statement $$$N:identifier)'
        replace: '(nonlocal_names $$$N=>nonlocal_name)'
      # Defs
      - match: '(assignment left: $N right: $R:__lambda)'
        replace: '(__def (__defname @$N $N) (__lambda) $R)'
      - match: '(assignment left: (attribute object: (identifier "self") attribute: $N) type: $T:type)'
        replace: '(__def (__defname @$N) (__field_def) (__binding (__ivar @$N) (__ssa_typed @$T)))'
      - match: '(assignment left: $N type: $T:type)'
        replace: '(__def (__defname @$N $N) (__field_def))'
      - match: '(typed_default_parameter name: $N type: (type $T) value: $V)'
        replace: '(__binding @$N (__ssa_typed @$T $T) (__rhs @$V $V))'
      - match: '(typed_default_parameter name: $N type: (type $T))'
        replace: '(__binding @$N (__ssa_typed @$T))'
      - match: '(typed_default_parameter name: $N)'
        replace: '(__binding @$N)'
      - match: '(typed_parameter $C:identifier type: (type $T))'
        replace: '(__binding @$C (__ssa_typed @$T $T))'
      - match: '(typed_parameter $C:identifier)'
        replace: '(__binding @$C)'
      - match: '(default_parameter name: $N:identifier value: $V)'
        replace: '%bind($N, $V)'
      - match: '(lambda_parameters $$$P:identifier|__binding)'
        replace: '(lambda_parameters $$$P->__binding)'
      # Bindings — RHS wrapped in __rhs for canonical containment
      - match: '(assignment left: $N:__ivar right: $R:__call)'
        replace: '(__binding $N (__rhs $R))'
      - match: '(assignment left: $N:__ivar right: $R)'
        replace: '(__binding $N (__rhs @$R $R))'
      - match: '(assignment left: $N right: $R:__call)'
        replace: '(__binding @$N $N (__declaration "function") (__rhs $R))'
      - match: '(assignment left: $N right: $R:__ssa_loop)'
        replace: '(__binding @$N $N (__rhs $R))'
      - match: '(assignment left: $N right: $R)'
        replace: '(__binding @$N $N (__declaration "function") (__rhs @$R $R))'
      - match: '(assignment left: $N:__ivar)'
        replace: '(__binding $N)'
      - match: '(assignment left: $N)'
        replace: '(__binding @$N)'
      - match: '(augmented_assignment left: $N right: $R:__call)'
        replace: '(__binding @$N $N (__rhs $R))'
      - match: '(augmented_assignment left: $N right: $R)'
        replace: '(__binding @$N $N (__rhs @$R $R))'
      - match: '(named_expression name: $N value: $V:__call)'
        replace: '%bind_call($N, $V)'
      - match: '(named_expression name: $N value: $V)'
        replace: '%bind($N, $V)'
      # Branches
      - match: '(if_statement condition: $COND consequence: $C $$$ALTS:elif_clause|else_clause)'
        replace: '(__ssa_branch $COND (__ssa_arm $C) $$$ALTS->__ssa_arm)'
      - match: '(try_statement body: $B $$$ALTS:except_clause|finally_clause)'
        replace: '(__ssa_branch (__ssa_arm $B) $$$ALTS->__ssa_arm)'
      - match: '(match_statement subject: $S body: (block $$$CASES:case_clause))'
        replace: '(__ssa_branch $S $$$CASES->__ssa_arm)'
      - match: '(conditional_expression $A:_*_named $COND:_*_named $B:_*_named)'
        replace: '(__ssa_branch $COND (__ssa_arm $A) (__ssa_arm $B))'
      # Loops
      - match: '(for_statement left: $N:identifier right: (tuple $$$E) body: $B)'
        replace: '(__ssa_loop (__arr $$$E) (__binding @$N (__declaration "function")) $B)'
      - match: '(for_statement left: $N:identifier right: (list $$$E) body: $B)'
        replace: '(__ssa_loop (__arr $$$E) (__binding @$N (__declaration "function")) $B)'
      - match: '(for_statement left: $N:identifier right: (expression_list $$$E) body: $B)'
        replace: '(__ssa_loop (__arr $$$E) (__binding @$N (__declaration "function")) $B)'
      - match: '(for_statement left: $N:identifier right: $V body: $B)'
        replace: '(__ssa_loop $V (__binding @$N (__declaration "function")) $B)'
      - match: '(%loops body: $B)'
        replace: '%loop($B)'
      - match: '(%comprehensions $$$BODY)'
        replace: '%loop($$$BODY)'
      # Methods — has self parameter (before generic function rule)
      - match: '(function_definition name: $N **/(identifier "self") parameters:? (parameters $$$P:__binding) return_type:? $R body: $B $$$ANN:__decorator)'
        replace: '(__def (__defname @$N) (__method) (__ssa_return_type? @$R $R) $$$ANN $$$P $B)'
        tag: { flavor: self_method }
      # Functions — no self parameter
      - match: '(function_definition name: $N parameters:? (parameters $$$P:__binding) return_type:? $R body: $B $$$ANN:__decorator)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$R $R) $$$ANN $$$P $B)'
      # Classes — variadic before body captures __supertype/__decorator
      - match: '(class_definition name: $N $$$ANN:__supertype|__decorator body: $B **/(__def (__defname "__call__")))'
        replace: '(__def (__defname @$N) (__class) (__callable "__call__") $$$ANN $B)'
      - match: '(class_definition name: $N $$$ANN:__supertype|__decorator body: $B)'
        replace: '(__def (__defname @$N) (__class) $$$ANN $B)'
  - name: ssa-cleanup
    rules:
      - match: '(global_name)'
        replace: '(__binding @$ROOT (__declaration "function") (__alias "module"))'
      - match: '(nonlocal_name)'
        replace: '(__binding @$ROOT (__declaration "function") (__alias "function"))'
      - match: '(__ssa_return $V:identifier)'
        replace: '%return_value($V)'
  - name: tag-defs
    rules:
      - match: '(__source_file)'
        tag: { scoped: module }
      - match: '(__def (__function))'
        tag: { callable: 'true', value: 'true', scoped: function }
      - match: '(__def (__method))'
        tag: { callable: 'true', value: 'true', scoped: function }
      - match: '(__def (__class))'
        tag: { callable: 'true', value: 'true', declares_type: 'true', scoped: 'true' }
      - match: '(__def (__lambda))'
        tag: { callable: 'true', scoped: 'true' }
      - match: '(__def (__enum_variant))'
        tag: { callable: 'true', value: 'true' }
      - match: '(__def (__field_def))'
        tag: { value: 'true' }
  - use: tag_file_dir
  - name: tag-source-path
    rules:
      - match: '(__import)'
        tag:
          source_rel: '$ROOT | child_sym("__source_path") | regex_loop("(\w)\.(\w)", "$1/$2") | regex_loop("^((?:~/)*)\.", "$1~/") | regex_first("~/", "./") | regex_replace("~/", "../") | regex_loop("^\./\.\./", "../")'
  - name: resolve-paths
    rules:
      - match: '(__import)'
        tag: { resolved_source: '$ROOT | tag("source_rel")' }
      - match: '(__import (__source_path "^."))'
        tag:
          resolved_source: '$ROOT | ancestor_tag("file_dir") | concat("/", $ROOT | tag("source_rel")) | regex_replace("(^|/)\./", "$1") | regex_loop("[^/]+/\.\./", "") | regex_replace("/$", "") | regex_replace("^/", "")'

project:
  - name: packages
    rules:
      - match: '(__dir (__file "__init__.py") $$$REST)'
        replace: '(__dir (__package) (__file "__init__.py") $$$REST)'
      - match: '(__dir (__file "__init__.pyi") $$$REST)'
        replace: '(__dir (__package) (__file "__init__.pyi") $$$REST)'
  - name: roots
    rules:
      - match: '(%project_dirs !(__package) !(__source_root) (__dir (__package)))'
        append: ['(__source_root)']
  - name: src_dirs
    rules:
      - use: src_root

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M | stem | collapse_index("__init__") | replace("/", ".")'
          file_path: '@$M'
          language: '@$M | split_last(".") | map("py:python", "pyi:python")'
      - use: def_fqn_dotted
  - name: def_type
    rules:
      - use: function_def_types
      - use: type_def_types
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: ImportedSymbol
          file_path: '$ROOT | ancestor_tag("file_path")'
          source_path: '$ROOT | tag("resolved_source") | replace("/", ".")'
      - match: '(__name "*")'
        tag: { import_type: WildcardImport, resolved: '$ROOT | has_incoming("Imports")' }
      - use: aliased_import_type
      # `import os`: the name repeats the module, so the whole module is imported.
      - match: '(__import $S:__source $$$A $N:__name $$$B)'
        when: '@$N | eq(@$S)'
        tag_on: __name
        tag: { import_type: Import }
      - match: '(__name)'
        tag: { resolved: '$ROOT | has_incoming("Imports")' }
