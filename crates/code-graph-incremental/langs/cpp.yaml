# C++ rewrite rules.
# Handles: #include as wildcard imports, namespaces (as class-like scopes),
# classes, structs, enums, in-class and out-of-class methods (the latter as
# __impl wrappers named after the class), free functions, new, member and
# qualified calls, this->x, locals, control flow.
# Definitions hang off the file stem (stem::ns::name).
#
# Known gaps (engine, not rules):
# - A file has one wildcard slot, so with several includes only the last
#   include receives unresolved calls.
# - Concepts are displayed as Interface; the canonical alphabet has no
#   Namespace or Concept kind.

config:
  stdlib: [
      { module: cstdio, symbols: [clearerr, fclose, feof, ferror, fflush, fgetc,
          fgetpos, fgets, fopen, fprintf, fputc, fputs, fread, freopen, fscanf,
          fseek, fsetpos, ftell, fwrite, getc, getchar, perror, printf, putc,
          putchar, puts, remove, rename, rewind, scanf, setbuf, setvbuf,
          snprintf, sprintf, sscanf, tmpfile, tmpnam, ungetc, vfprintf,
          vfscanf, vprintf, vscanf, vsnprintf, vsprintf, vsscanf] },
      { module: cstdlib, symbols: [abort, abs, atexit, atof, atoi, atol, atoll,
          at_quick_exit, aligned_alloc, bsearch, calloc, div, exit, free, getenv,
          labs, ldiv, llabs, lldiv, malloc, mblen, mbstowcs, mbtowc, qsort,
          quick_exit, rand, realloc, srand, strtod, strtof, strtol, strtold,
          strtoll, strtoul, strtoull, system, wcstombs, wctomb, _Exit] },
      { module: cstring, symbols: [memchr, memcmp, memcpy, memmove, memset,
          strcat, strchr, strcmp, strcoll, strcpy, strcspn, strerror, strlen,
          strncat, strncmp, strncpy, strpbrk, strrchr, strspn, strstr, strtok, strxfrm] },
      { module: cassert, symbols: [assert] },
      { module: cmath, symbols: [abs, acos, asin, atan, atan2, ceil, cos, cosh,
          exp, exp2, expm1, fabs, floor, fmod, frexp, hypot, ldexp, log, log10,
          log1p, log2, modf, pow, remainder, round, sin, sinh, sqrt, tan, tanh, trunc] },
      { module: cctype, symbols: [isalnum, isalpha, isblank, iscntrl, isdigit,
          isgraph, islower, isprint, ispunct, isspace, isupper, isxdigit, tolower, toupper] },
      { module: algorithm }, { module: any }, { module: array }, { module: atomic },
      { module: barrier }, { module: bit }, { module: bitset }, { module: cerrno },
      { module: cfenv }, { module: cfloat }, { module: charconv }, { module: chrono },
      { module: cinttypes }, { module: climits }, { module: clocale }, { module: codecvt },
      { module: compare }, { module: complex }, { module: concepts },
      { module: condition_variable }, { module: coroutine }, { module: csetjmp },
      { module: csignal }, { module: cstdarg }, { module: cstddef }, { module: cstdint },
      { module: ctime }, { module: cuchar }, { module: cwchar }, { module: cwctype },
      { module: deque }, { module: exception }, { module: execution }, { module: expected },
      { module: filesystem }, { module: format }, { module: forward_list },
      { module: fstream }, { module: functional }, { module: future },
      { module: initializer_list }, { module: iomanip }, { module: ios },
      { module: iosfwd }, { module: iostream }, { module: istream }, { module: iterator },
      { module: latch }, { module: limits }, { module: list }, { module: locale },
      { module: map }, { module: memory }, { module: memory_resource },
      { module: mutex }, { module: new }, { module: numbers }, { module: numeric },
      { module: optional }, { module: ostream }, { module: print }, { module: queue },
      { module: random }, { module: ranges }, { module: ratio }, { module: regex },
      { module: scoped_allocator }, { module: semaphore }, { module: set },
      { module: shared_mutex }, { module: source_location }, { module: span },
      { module: sstream }, { module: stack }, { module: stacktrace }, { module: stdexcept },
      { module: stop_token }, { module: streambuf }, { module: string },
      { module: string_view }, { module: syncstream }, { module: system_error },
      { module: thread }, { module: tuple }, { module: type_traits }, { module: typeindex },
      { module: typeinfo }, { module: unordered_map }, { module: unordered_set },
      { module: utility }, { module: valarray }, { module: variant },
      { module: vector }, { module: version }
    ]
  resolve:
    lookup_from:
      - __source_root

stages:
  - name: imports
    rules:
      - match: '(preproc_include path: $S:string_literal)'
        replace: '(__import (__source @$S $S) (__source_path @$S|regex_replace("^.", "")|regex_replace(".$", "")|prepend("./")) (__name "*"))'
      - match: '(preproc_include path: $S:system_lib_string)'
        replace: '(__import (__source @$S|strip=<|strip_suffix(">")) (__source_path @$S|strip=<|strip_suffix(">")) (__name "*"))'

  - name: normalize
    rules:
      - match: '(translation_unit $$$C)'
        replace: '(__source_file @$ROOT $$$C)'
      - match: '(return_statement $$$V)'
        replace: '(__ssa_return $$$V)'
      - match: '(field_expression argument: (this) field: $F:field_identifier)'
        replace: '(__ivar @$F)'
      - match: '(base_class_clause $$$S:type_identifier)'
        replace: '(base_class_clause $$$S=>__supertype)'
      - match: '(template_type name: $T:type_identifier)'
        replace: '(type_identifier @$T)'
      - match: '(parameter_declaration type: $T:type_identifier declarator: $N:identifier)'
        replace: '(__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T $T))))'
      - match: '(parameter_declaration type: $T:type_identifier declarator: (reference_declarator $N:identifier))'
        replace: '(__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T $T))))'
      - match: '(parameter_declaration type: $T:type_identifier declarator: (pointer_declarator declarator: $N:identifier))'
        replace: '(__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T $T))))'
      - match: '(parameter_declaration declarator: $N:identifier)'
        replace: '(__binding @$N)'
      - match: '(parameter_declaration declarator: (pointer_declarator declarator: $N:identifier))'
        replace: '(__binding @$N)'
      - match: '(parameter_declaration declarator: (reference_declarator $N:identifier))'
        replace: '(__binding @$N)'
      - match: '(enumerator name: $N:identifier)'
        replace: '(__def (__defname @$N) (__enum_variant))'

  - name: retag-refs
    rules:
      - match: '(field_expression argument: $O:__ivar field: $F:field_identifier)'
        replace: '(__member @$F (__object $O))'
      - match: '(field_expression argument: $O:__member field: $F:field_identifier)'
        replace: '(__member @$F (__object $O))'
      - match: '(field_expression argument: $O field: (template_method name: $F:field_identifier))'
        replace: '(__member @$F (__object @$O $O))'
      - match: '(field_expression argument: $O field: $F:field_identifier)'
        replace: '(__member @$F (__object @$O $O))'

  - name: retag-calls
    rules:
      - match: '(call_expression function: $F:__ivar arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F:__member arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      # a::b::f() and a::b::c::f(): the scope nests to the right, so each depth is its own rule
      - match: '(call_expression function: (qualified_identifier scope: $S:namespace_identifier name: (qualified_identifier scope: $T:namespace_identifier name: (qualified_identifier scope: $U:namespace_identifier name: $N:identifier))) arguments: $A)'
        replace: '(__call (__callee (__member @$N (__object (__member @$U (__object (__member @$T (__object @$S $S))))))) $A)'
      - match: '(call_expression function: (qualified_identifier scope: $S:namespace_identifier name: (qualified_identifier scope: $T:namespace_identifier name: $N:identifier)) arguments: $A)'
        replace: '(__call (__callee (__member @$N (__object (__member @$T (__object @$S $S))))) $A)'
      - match: '(call_expression function: (qualified_identifier scope: $S:namespace_identifier name: $N:identifier) arguments: $A)'
        replace: '(__call (__callee (__member @$N (__object @$S $S))) $A)'
      - match: '(call_expression function: (template_function name: $N:identifier) arguments: $A)'
        replace: '(__call (__callee @$N $N) $A)'
      - match: '(call_expression function: $F:identifier arguments: $A)'
        replace: '(__call (__callee @$F $F) $A)'
      - match: '(new_expression type: $T:type_identifier arguments:? $A)'
        replace: '(__call (__callee @$T $T) $A)'

  - name: classify
    rules:
      - match: '(function_definition type:? $RT:type_identifier declarator: (function_declarator declarator: (parenthesized_declarator (ms_call_modifier) $N:identifier) parameters: $P) body: $B)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_definition type:? $RT:type_identifier declarator: (function_declarator declarator: (parenthesized_declarator $N:identifier) parameters: $P) body: $B)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_definition type:? $RT:type_identifier declarator: (attributed_declarator (function_declarator declarator: $N:identifier parameters: $P)) body: $B)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_definition declarator: (function_declarator declarator: $Q:(qualified_identifier scope: $S name: $N) parameters: $P) body: $B)'
        where: '$S == $N'
        replace: '(__def (__defname @$Q $Q) (__function) $P $B)'
        tag: { ctor: "true" }
      - match: '(function_definition type:? $RT:type_identifier declarator: (pointer_declarator declarator: (function_declarator declarator: $Q:qualified_identifier parameters: $P)) body: $B)'
        replace: '(__def (__defname @$Q $Q) (__function) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_definition type:? $RT:type_identifier declarator: (function_declarator declarator: $Q:qualified_identifier parameters: $P) body: $B)'
        replace: '(__def (__defname @$Q $Q) (__function) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_definition declarator: $Q:qualified_identifier body: $B)'
        replace: '(__def (__defname @$Q|regex_replace("\s*\(\s*\)\s*(const)?\s*$", "")|regex_replace("\s*/\*[^*]*\*/\s*$", "") $Q) (__function) $B)'
      - match: '(function_definition declarator: $C:operator_cast body: $B)'
        replace: '(__def (__defname @$C|regex_replace("\s*\(\s*\)\s*(const)?\s*$", "")|regex_replace("\s*/\*[^*]*\*/\s*$", "") $C) (__function) $B)'
      - match: '(declaration declarator: (function_declarator declarator: $N:identifier))'
        replace: '(__defname @$N)'
        tag: { exports: '@$N' }
      - match: '(declaration declarator: (pointer_declarator declarator: (function_declarator declarator: $N:identifier)))'
        replace: '(__defname @$N)'
        tag: { exports: '@$N' }
      # Method declarations and definitions inside a class body
      - match: '(field_declaration type:? $RT:type_identifier declarator: (function_declarator declarator: $N:field_identifier parameters: $P))'
        replace: '(__def (__defname @$N) (__method) (__ssa_return_type? @$RT) $P)'
      - match: '(function_definition type:? $RT:type_identifier declarator: (function_declarator declarator: $N:field_identifier parameters: $P) body: $B)'
        replace: '(__def (__defname @$N) (__method) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_definition type:? $RT:type_identifier declarator: (function_declarator declarator: $N:operator_name parameters: $P) body: $B)'
        replace: '(__def (__defname @$N $N) (__method) (__ssa_return_type? @$RT) $P $B)'
      - match: '(field_declaration type:? $RT:type_identifier declarator: (function_declarator declarator: $N:operator_name parameters: $P))'
        replace: '(__def (__defname @$N $N) (__method) (__ssa_return_type? @$RT) $P)'
      - match: '(function_definition type:? $RT:type_identifier declarator: (function_declarator declarator: (qualified_identifier scope: $S:namespace_identifier name: $N:operator_name) parameters: $P) body: $B)'
        replace: '(__def (__defname @$S) (__impl) (__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B))'
      # Out-of-class method definitions: Class::method
      - match: '(function_definition type:? $RT:type_identifier declarator: (function_declarator declarator: (qualified_identifier scope: $S:namespace_identifier name: $N:identifier) parameters: $P) body: $B)'
        replace: '(__def (__defname @$S) (__impl) (__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B))'
      # Free functions
      - match: '(function_definition type:? $RT:type_identifier declarator: (function_declarator declarator: $N:identifier parameters: $P) body: $B)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_definition type:? $RT:type_identifier declarator: (pointer_declarator declarator: (function_declarator declarator: $N:identifier parameters: $P)) body: $B)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_definition type:? $RT:type_identifier declarator: (reference_declarator (function_declarator declarator: $N:identifier parameters: $P)) body: $B)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B)'
      # Fields
      - match: '(field_declaration type: $T:struct_specifier declarator: $N:field_identifier)'
        replace: '(field_declaration $T (__def (__defname @$N) (__field_def)))'
      - match: '(field_declaration type: $T:class_specifier declarator: $N:field_identifier)'
        replace: '(field_declaration $T (__def (__defname @$N) (__field_def)))'
      - match: '(field_declaration type: $T:type_identifier declarator: $N:field_identifier)'
        replace: '(__def (__defname @$N) (__field_def) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T $T)))))'
      - match: '(field_declaration declarator: $N:field_identifier)'
        replace: '(__def (__defname @$N) (__field_def))'
      - match: '(field_declaration declarator: (pointer_declarator declarator: $N:field_identifier))'
        replace: '(__def (__defname @$N) (__field_def))'
      # Locals (Type name(args) and Ns::Type name)
      - match: '(declaration type: $T:type_identifier declarator: (function_declarator declarator: $N:identifier parameters: $A))'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T) $A)'
      - match: '(declaration type: $T:qualified_identifier declarator: (function_declarator declarator: $N:identifier parameters: $A))'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T|split_last("::")) $A)'
      - match: '(declaration type: $T:qualified_identifier declarator: (init_declarator declarator: $N:identifier value: $V:__call))'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T|split_last("::") $T) (__rhs $V))'
      - match: '(declaration type: $T:qualified_identifier declarator: $N:identifier)'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T|split_last("::") $T))'
      - match: '(declaration type: $T:type_identifier declarator: (init_declarator declarator: $N:identifier value: $V:__call))'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T) (__rhs $V))'
      - match: '(declaration type: $T:type_identifier declarator: (init_declarator declarator: $N:identifier value: $V))'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T) (__rhs @$V $V))'
      - match: '(declaration type: $T:type_identifier declarator: (init_declarator declarator: (pointer_declarator declarator: $N:identifier) value: $V:__call))'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T) (__rhs $V))'
      - match: '(declaration type: $T:type_identifier declarator: $N:identifier)'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T))'
      - match: '(declaration type: $T:type_identifier declarator: (pointer_declarator declarator: $N:identifier))'
        replace: '(__binding @$N (__declaration) (__ssa_typed @$T))'
      - match: '(declaration declarator: (init_declarator declarator: $N:identifier value: $V:__call))'
        replace: '(__binding @$N (__declaration) (__rhs $V))'
      - match: '(declaration declarator: (init_declarator declarator: (pointer_declarator declarator: $N:identifier) value: $V:__call))'
        replace: '(__binding @$N (__declaration) (__rhs $V))'
      - match: '(declaration declarator: (init_declarator declarator: $N:identifier value: $V))'
        replace: '(__binding @$N (__declaration) (__rhs @$V $V))'
      - match: '(declaration declarator: (init_declarator declarator: (pointer_declarator declarator: $N:identifier) value: $V))'
        replace: '(__binding @$N (__declaration) (__rhs @$V $V))'
      - match: '(assignment_expression left: $N:identifier right: $R:__call)'
        replace: '(__binding @$N (__rhs $R))'
      - match: '(assignment_expression left: $N:identifier right: $R)'
        replace: '(__binding @$N (__rhs @$R $R))'
      - match: '(if_statement condition: $C consequence: $Q alternative:? $A)'
        replace: '(__ssa_branch $C (__ssa_arm $Q) (__ssa_arm? $A))'
      - match: '(switch_statement condition: $C body: $B)'
        replace: '(__ssa_branch $C $B)'
      - match: '(conditional_expression condition: $C consequence: $Q alternative: $A)'
        replace: '(__ssa_branch $C (__ssa_arm $Q) (__ssa_arm $A))'
      - match: '(for_statement $$$H body: $B)'
        replace: '(__ssa_loop $$$H $B)'
      - match: '(while_statement condition: $C body: $B)'
        replace: '(__ssa_loop $C $B)'
      - match: '(do_statement body: $B condition: $C)'
        replace: '(__ssa_loop $B $C)'
      - match: '(for_range_loop type:? $T:type_identifier declarator: $N:identifier right: $V body: $B)'
        replace: '(__scope (__ssa_loop $V (__binding @$N (__declaration) (__ssa_typed? @$T)) $B))'
      - match: '(for_range_loop declarator: $N:identifier right: $V body: $B)'
        replace: '(__scope (__ssa_loop $V (__binding @$N (__declaration)) $B))'
      - match: '(for_range_loop right: $V body: $B)'
        replace: '(__ssa_loop $V $B)'
      # Types
      - match: '(class_specifier name: $N:type_identifier $$$ANN body: $B)'
        replace: '(__def (__defname @$N) (__class) $$$ANN $B)'
      - match: '(struct_specifier name: $N:type_identifier $$$ANN body: $B)'
        replace: '(__def (__defname @$N) (__struct) $$$ANN $B)'
      - match: '(enum_specifier name: $N:type_identifier body: $B)'
        replace: '(__def (__defname @$N) (__enum) $B)'
      - match: '(union_specifier name: $N:type_identifier body: $B)'
        replace: '(__def (__defname @$N) (__struct) $B)'
        tag: { language_kind: Union }
      - match: '(type_definition type: $T declarator: $N:type_identifier)'
        replace: '(type_definition (__def (__defname @$N) (__type_alias)) $T)'
      - match: '(alias_declaration name: $N:type_identifier)'
        replace: '(__def (__defname @$N) (__type_alias))'
      - match: '(concept_definition name: $N:identifier)'
        replace: '(__def (__defname @$N) (__interface))'
        tag: { language_kind: Concept }
      - match: '(namespace_definition name: $N body: $B)'
        replace: '(__def (__defname @$N $N) (__class) $B)'
        tag: { language_kind: Namespace }

  - name: ssa-cleanup
    rules:
      - match: '(compound_statement $$$B)'
        replace: '(__scope $$$B)'
      - match: '(__ssa_return $V:identifier)'
        replace: '(__ssa_return (__rhs @$V $V))'

  - name: tag-defs
    rules:
      - match: '(__def (__function))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__method))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__class))'
        tag: { callable: "true", value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__lambda))'
        tag: { callable: "true" }
      - match: '(__def (__enum_variant))'
        tag: { callable: "true", value: "true" }
      - match: '(__def (__struct))'
        tag: { callable: "true", value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__impl))'
        tag: { scoped: "true" }
      - match: '(__def (__trait))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__enum))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__interface))'
        tag: { value: "true", declares_type: "true" }
      - match: '(__def (__type_alias))'
        tag: { value: "true", declares_type: "true" }
      - match: '(__def (__field_def))'
        tag: { value: "true" }

  - name: tag-file-dir
    rules:
      - match: '$M:__source_file'
        tag:
          file_dir: '@$M|regex_replace("[^/]*$", "")|regex_replace("/$", "")'

  - name: resolve-paths
    rules:
      - match: '(__import)'
        tag:
          resolved_source: '@$ROOT|child_sym("__source_path")'
      - match: '(__import (__source_path "^."))'
        tag:
          resolved_source: '@$ROOT|concat("/", "ancestor_tag:file_dir", "child_sym:__source_path")|regex_replace("(^|/)\./", "$1")|regex_loop("[^/]+/\.\./", "")|regex_replace("/$", "")|regex_replace("^/", "")'

resolve:
  stages:
    - name: roots
      rules:
        - match: '(__dir "src" $$$REST)'
          replace: '(__dir "src" (__source_root) $$$REST)'
        - match: '(__dir "include" $$$REST)'
          replace: '(__dir "include" (__source_root) $$$REST)'

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M|stem|split_last("/")'
          file_path: '@$M'
          language: '@$M|split_last(".")|map("cpp:cpp", "cc:cpp", "cxx:cpp", "hpp:cpp", "hh:cpp", "hxx:cpp")'
          is_test: '@$M|regex_match("(^|/)tests?/|_(unit)?test\.(cc|cpp|cxx)$")'
          generated: '@$M|source("2048")|regex_match("(?i)code generated .*do not edit|@generated|<auto-generated|autogenerated by|generated by .*do not (edit|modify)")'
      - match: '(__def (__impl))'
        tag:
          fqn: '@$ROOT|concat("::", "ancestor_tag:fqn", "child_sym:__defname")|keep_last("::", "64", "4096")'
      - match: '(__def !(__impl))'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat("::", "ancestor_tag:fqn", "child_sym:__defname")|keep_last("::", "64", "4096")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
      - match: '(__def (__impl))'
        tag:
          entity: Definition
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: def_type
    rules:
      - match: '(__def (__function))'
        tag: { def_type: Function }
      - match: '(__def (__method))'
        tag: { def_type: Method }
      - match: '(__def (__class))'
        tag: { def_type: Class }
      - match: '(__def (__struct))'
        tag: { def_type: Struct }
      - match: '(__def (__interface))'
        tag: { def_type: Interface }
      - match: '(__def (__enum))'
        tag: { def_type: Enum }
      - match: '(__def (__enum_variant))'
        tag: { def_type: EnumVariant }
      - match: '(__def (__trait))'
        tag: { def_type: Trait }
      - match: '(__def (__impl))'
        tag: { def_type: Impl }
      - match: '(__def (__variable))'
        tag: { def_type: Variable }
      - match: '(__def (__constant))'
        tag: { def_type: Constant }
      - match: '(__def (__static_constant))'
        tag: { def_type: Static }
      - match: '(__def (__lambda))'
        tag: { def_type: Lambda }
      - match: '(__def (__field_def))'
        tag: { def_type: Field }
      - match: '(__def (__property))'
        tag: { def_type: Property }
      - match: '(__def (__type_alias))'
        tag: { def_type: TypeAlias }
  - name: kind
    rules:
      - match: '(__def)'
        tag:
          preamble: '@$ROOT|source_before("4096")|regex_first("(?s)\A(?:(?:.*?\n)??((?:[ \t]*(?://[^\n]*|/\*(?:[^*]|\*+[^*/])*\*+/[ \t]*|template\s*<[^\n]*)\n)*)[ \t]*|.*)\z", "$1")'
      - match: '(__def (__function))'
        tag:
          kind: '@$ROOT|ancestor_tag("kind")|map("Class:Constructor", "Struct:Constructor")|regex_replace("^(Constructor)$|(?s).*", "$1")|default("Function")'
          friend: '@$ROOT|source_before("64")|regex_replace("(?s)\A.*\bfriend\s*\z", "Function")|regex_replace("^(Function)$|(?s).*", "$1")'
      - match: '(__def (__function))'
        tag:
          kind: '@$ROOT|or("tag:friend", "tag:kind")'
      - match: '(__def (__defname "/::/") (__function))'
        tag:
          kind: '@$ROOT|tag("ctor")|map("true:Constructor")|default("Method")'
          language_kind: '@$ROOT|child_sym("__defname")|regex_replace("(?s)\A.*::~.*\z", "Destructor")|regex_replace("^(Destructor)$|(?s).*", "$1")'
      - match: '(__def (__defname "/^(?:TEST|TEST_F|TEST_P|TYPED_TEST|TYPED_TEST_P|TEST_CASE|SCENARIO)$/") (__function))'
        tag: { kind: Test }
      - match: '(__def (__method))'
        tag:
          kind: Method
          friend: '@$ROOT|source_before("64")|regex_replace("(?s)\A.*\bfriend\s*\z", "Function")|regex_replace("^(Function)$|(?s).*", "$1")'
      - match: '(__def (__method))'
        tag:
          kind: '@$ROOT|or("tag:friend", "tag:kind")'
      - match: '(__def (__class))'
        tag:
          kind: '@$ROOT|tag("language_kind")|map("Namespace:Module")|regex_replace("^(Module)$|(?s).*", "$1")|default("Class")'
      - match: '(__def (__struct))'
        tag: { kind: Struct }
      - match: '(__def (__enum))'
        tag: { kind: Enum }
      - match: '(__def (__enum_variant))'
        tag: { kind: EnumMember }
      - match: '(__def (__interface))'
        tag: { kind: Interface }
      - match: '(__def (__type_alias))'
        tag:
          kind: TypeAlias
          language_kind: '@$ROOT|source("16")|regex_replace("(?s)\Atypedef\b.*\z", "Typedef")|regex_replace("^(Typedef)$|(?s).*", "$1")'
      - match: '(__def (__field_def))'
        tag: { kind: Field }
      - match: '(__def (__impl))'
        tag: { kind: Impl }
  - name: content
    rules:
      - match: '(__def !(__impl))'
        tag:
          doc_comment: '@$ROOT|tag("preamble")|regex_replace("(?m)^[ \t]*template\s*<.*$\n?", "")|regex_replace("(?m)^[ \t]*\*+/?[ \t]?", "")|regex_replace("/\*+!?<?|\*+/", "")|regex_replace("(?m)^[ \t]*//[/!]?<? ?", "")|regex_replace("(?s)\A\s+", "")|regex_replace("(?s)\n[ \t]*\n.*", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__function))'
        tag: &cpp_callable
          signature: '@$ROOT|source("4096")|top_until("\{|;", "()[]{}")|regex_replace("(?s)\)\s*:(?:[^:].*)?\z", ")")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__method))'
        tag: *cpp_callable
      - match: '(__def (__function))'
        tag: &cpp_parts
          prefix: '@$ROOT|tag("signature")|top_until("\(", "()[]{}<>")'
          suffix: '@$ROOT|tag("signature")|top_after("\(", "()[]{}<>")|top_after("\)", "()[]{}<>")|regex_replace("=\s*0\s*$", " abstract ")'
          parameters: '@$ROOT|tag("signature")|top_after("\(", "()[]{}<>")|top_until("\)", "()[]{}<>")|regex_replace("\s+", " ")|regex_replace("^\s*void\s*$", "")|top_split(",", "()[]{}<>")'
      - match: '(__def (__method))'
        tag: *cpp_parts
      - match: '(__def (__function))'
        tag: &cpp_mods
          return_type: '@$ROOT|tag("prefix")|regex_replace("(?s)(?:\boperator\b.*|[\w:~]+)\s*\z", "")|regex_replace("\[\[[^\]]*\]\]", "")|regex_replace("\b(?:static|inline|virtual|explicit|extern|constexpr|consteval|friend)\b\s*", "")|regex_replace("^ +| +$", "")'
          modifiers: '@$ROOT|concat(" ", "tag:prefix", "tag:suffix")|regex_replace("(?s)\b(static|inline|virtual|extern|override|final|abstract)\b|.", "$1 ")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__method))'
        tag: *cpp_mods
      - match: '(__def (__class))'
        tag: &cpp_type
          signature: '@$ROOT|source("4096")|top_until("\{|;", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
          modifiers: '@$ROOT|source("4096")|top_until("\{|;", "()[]{}")|top_until(":", "()[]{}")|regex_replace("(?s)\b(final)\b|.", "$1 ")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__struct))'
        tag: *cpp_type
      - match: '(__def (__enum))'
        tag: *cpp_type
      - match: '(__def (__type_alias))'
        tag:
          signature: '@$ROOT|source("4096")|top_until(";", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__interface))'
        tag:
          signature: '@$ROOT|source("4096")|top_until("=|;", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__enum_variant))'
        tag:
          signature: '@$ROOT|source("4096")|top_until("=", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__field_def))'
        tag:
          signature: '@$ROOT|source("4096")|top_until(";|=|\{", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__field_def))'
        tag:
          declared_type: '@$ROOT|tag("signature")|regex_replace("(?:^|[^:]):(?:[^:].*)?$", "")|regex_replace("(?:\[[^\]]*\]\s*)+$", "")|regex_replace("\w+\s*$", "")|regex_replace("\b(?:static|mutable|inline|constexpr|extern)\b\s*", "")|regex_replace("^ +| +$", "")'
          modifiers: '@$ROOT|tag("signature")|regex_replace("(?s)\b(static|inline|extern)\b|.", "$1 ")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: Import
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name "*")'
        tag:
          import_type: WildcardImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name (__alias))'
        tag:
          import_type: AliasedImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name "*")'
        tag: { import_kind: wildcard, fqn: '' }
