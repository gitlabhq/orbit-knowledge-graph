# Ruby rewrite rules.
# Handles: require/require_relative, include/extend/prepend (as supertypes
# and module imports), constant references as Zeitwerk-style autoload imports
# (Foo::Bar -> foo/bar under a Rails root), classes, modules, methods,
# singleton methods, constants and lambdas, attr_* and Rails metaprogramming
# synthetic definitions, self./@ivar calls, implicit-self calls, control flow.
#
# Known gaps (engine, not rules):
# - Bare identifiers cannot be told apart from locals, so implicit-self
#   calls without parentheses are modeled as this-calls and may over-link.

import: [canonical, display, shapes]

data:
  builtins: [
    abort, at_exit, autoload, binding, 'block_given?', caller, caller_locations, catch, chomp,
    chop, eval, exec, exit, 'exit!', fail, fork, format, gets, global_variables, 'iterator?',
    lambda, load, local_variables, loop, open, p, print, printf, proc, putc, puts, raise, rand,
    readline, readlines, require, require_relative, select, sleep, spawn, sprintf, srand, syscall,
    system, test, throw, trace_var, trap, untrace_var, warn
  ]
  stdlib: [
    kernel, pp, abbrev, base64, benchmark, bigdecimal, bundler, cgi, csv, date, delegate, digest,
    drb, erb, etc, fcntl, fiddle, fileutils, find, forwardable, getoptlong, io, ipaddr, irb, json,
    logger, monitor, mutex_m, net, nkf, objspace, observer, open-uri, open3, openssl, optparse,
    ostruct, pathname, prettyprint, pstore, psych, racc, rdoc, readline, resolv, ripper,
    securerandom, set, shellwords, singleton, socket, stringio, strscan, syslog, tempfile, time,
    timeout, tmpdir, tsort, un, uri, weakref, yaml, zlib
  ]
  external: [
    rails, active_record, active_model, active_support, action_controller, action_dispatch,
    action_view, action_mailer, action_cable, active_job, active_storage, action_mailbox,
    action_text, arel
  ]
  providers:
    - [kernel, '%builtins']
    - [pp, pp, pretty_inspect]
  frameworks: [rails]
  lookup_from: [__source_root]
  shadows_locals: false
  module_hooks: [included, prepended]
  class_attributes: [
    class_attribute, mattr_accessor, mattr_reader, mattr_writer, cattr_accessor, cattr_reader,
    cattr_writer
  ]
  plural_associations: [has_many, has_and_belongs_to_many]
  send_methods: [send, public_send, __send__]
  params: [optional_parameter, splat_parameter, hash_splat_parameter, keyword_parameter, block_parameter]
  conditionals: [if, elsif, unless]
  modifiers: [if_modifier, unless_modifier]
  loops: [while, until, for]
  namespaces: [class, module]
  blocks: [block, do_block]

canonicalize:
  - name: imports
    rules:
      - match: '(call method: (identifier "require_relative") arguments: (argument_list (string $S:string_content)))'
        replace: '(__import (__source @$S) (__source_path @$S | prepend("./")) (__name "*"))'
        tag: { import_type: RequireRelative }
      - match: '(call method: (identifier "require") arguments: (argument_list (string $S:string_content)))'
        replace: '%wildcard_import($S)'
        tag: { import_type: Require }
      - match: '(call receiver: !$RECEIVER method: (identifier %module_hooks) block: (do_block $$$B))'
        replace: '(rb_synth $$$B)'
      # include/extend/prepend: each module argument becomes a supertype and an import
      - match: '(call method: (identifier "include") arguments: (argument_list $$$M:constant|scope_resolution))'
        replace: '(rb_synth $$$M->rb_include)'
      - match: '(call method: (identifier "extend") arguments: (argument_list $$$M:constant|scope_resolution))'
        replace: '(rb_synth $$$M->rb_extend)'
      - match: '(call method: (identifier "prepend") arguments: (argument_list $$$M:constant|scope_resolution))'
        replace: '(rb_synth $$$M->rb_prepend)'
      # Metaprogramming: literal symbols become synthetic definitions
      - match: '(call method: (identifier "attr_accessor") arguments: (argument_list $$$S:simple_symbol))'
        replace: '(rb_synth $$$S->rb_attr)'
      - match: '(call method: (identifier "attr_reader") arguments: (argument_list $$$S:simple_symbol))'
        replace: '(rb_synth $$$S->rb_attr)'
      - match: '(call method: (identifier "attr_writer") arguments: (argument_list $$$S:simple_symbol))'
        replace: '(rb_synth $$$S->rb_attr)'
      - match: '(call receiver: !$RECEIVER method: (identifier %class_attributes) arguments: (argument_list $S:simple_symbol $$$REST:simple_symbol))'
        replace: '(rb_synth (rb_attr @$S) $$$REST->rb_attr)'
      - match: '(call receiver: !$RECEIVER method: (identifier "delegate") arguments: (argument_list $S:simple_symbol $$$REST:simple_symbol))'
        replace: '(rb_synth (rb_method @$S) $$$REST->rb_method)'
      - match: '(call method: (identifier "def_delegators") arguments: (argument_list (simple_symbol) $$$S:simple_symbol))'
        replace: '(rb_synth $$$S->rb_method)'
      - match: '(call receiver: !$RECEIVER method: (identifier "def_delegator") arguments: (argument_list (simple_symbol) (simple_symbol) $A:simple_symbol))'
        replace: '(rb_synth (rb_method @$A))'
      - match: '(call receiver: !$RECEIVER method: (identifier "def_delegator") arguments: (argument_list (simple_symbol) $S:simple_symbol))'
        replace: '(rb_synth (rb_method @$S))'
      - match: '(call receiver: !$RECEIVER method: (identifier "define_method") arguments: (argument_list $S:simple_symbol) block:? $B)'
        replace: '(rb_synth (rb_method @$S $B))'
      - match: '(call receiver: !$RECEIVER method: (identifier "define_method") arguments: (argument_list (string $S:string_content)) block:? $B)'
        replace: '(rb_synth (rb_method @$S $B))'
      - match: '(alias name: $N:simple_symbol alias: $O:simple_symbol)'
        replace: '(rb_synth (rb_method @$N (__call (__callee (__ivar @$O | strip(":"))))))'
      - match: '(call receiver: !$RECEIVER method: (identifier %plural_associations) arguments: (argument_list $S:simple_symbol))'
        replace: '(rb_synth (rb_method @$S))'
      - match: '(call receiver: !$RECEIVER method: (identifier "has_one") arguments: (argument_list $S:simple_symbol))'
        replace: '(rb_synth (rb_method @$S))'
      - match: '(call receiver: !$RECEIVER method: (identifier "belongs_to") arguments: (argument_list $S:simple_symbol))'
        replace: '(rb_synth (rb_method @$S))'
      - match: '(call receiver: !$RECEIVER method: (identifier "scope") arguments: (argument_list $S:simple_symbol $$$L))'
        replace: '(rb_synth (rb_method @$S $$$L))'
      - match: '(call receiver:? $R method: $M:(identifier %send_methods) arguments: (argument_list $N:_*_named $$$A) block:? $B)'
        replace: '(rb_send receiver: $R method: $M (rb_send_name $N) arguments: (argument_list $$$A) block: $B)'
  - name: synth
    rules:
      - match: '(rb_send_name $N:simple_symbol)'
        replace: '(rb_literal_method @$N | strip(":"))'
      - match: '(rb_send_name (string !(interpolation) $N:string_content))'
        replace: '(rb_literal_method @$N)'
      - match: '(rb_include)'
        replace: '(rb_synth (__supertype @$ROOT | split_last("::")) (__import (__source @$ROOT | regex_replace("(::)?[^:]+$", "")) (__source_path @$ROOT | strip("::") | replace("::", "/") | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$ROOT | split_last("::"))))'
        tag_on: __import
        tag: { import_type: Include }
      - match: '(rb_extend)'
        replace: '(rb_synth (__supertype @$ROOT | split_last("::")) (__import (__source @$ROOT | regex_replace("(::)?[^:]+$", "")) (__source_path @$ROOT | strip("::") | replace("::", "/") | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$ROOT | split_last("::"))))'
        tag_on: __import
        tag: { import_type: Extend }
      - match: '(rb_prepend)'
        replace: '(rb_synth (__supertype @$ROOT | split_last("::")) (__import (__source @$ROOT | regex_replace("(::)?[^:]+$", "")) (__source_path @$ROOT | strip("::") | replace("::", "/") | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$ROOT | split_last("::"))))'
        tag_on: __import
        tag: { import_type: Prepend }
      - match: '(rb_attr)'
        replace: '(__def (__defname @$ROOT | strip(":")) (__property))'
      - match: '(rb_method $$$B)'
        replace: '(__def (__defname @$ROOT | strip(":")) (__method) $$$B)'
  - name: literal-dispatch
    rules:
      - match: '(rb_send receiver:? $R method: $M $N:rb_literal_method arguments: $A block:? $B)'
        replace: '(call receiver: $R method: (identifier @$N) arguments: $A block: $B)'
      - match: '(rb_send receiver:? $R method: $M (rb_send_name $N) arguments: (argument_list $$$A) block:? $B)'
        replace: '(call receiver: $R method: $M arguments: (argument_list $N $$$A) block: $B)'
  - name: constants
    rules:
      # Callable constants are lambdas; other constant assignments are constants
      - match: '(assignment left: $N:constant right: $R:lambda)'
        replace: '(__def (__defname @$N) (__lambda) $R)'
      - match: '(assignment left: $N:constant right: (call method: (identifier "lambda") block: $B))'
        replace: '(__def (__defname @$N) (__lambda) $B)'
      - match: '(assignment left: $N:constant right: (call method: (identifier "proc") block: $B))'
        replace: '(__def (__defname @$N) (__lambda) $B)'
      - match: '(assignment left: $N:constant right: (call receiver: (constant "Proc") method: (identifier "new") block: $B))'
        replace: '(__def (__defname @$N) (__lambda) $B)'
      - match: '(assignment left: $N:identifier right: $R:lambda)'
        replace: '(__def (__defname @$N) (__lambda) $R)'
      - match: '(assignment left: $N:constant right: $R)'
        replace: '(__def (__defname @$N) (__constant) $R)'
      - match: '(assignment left: $N:scope_resolution right: $R)'
        replace: '(__def (__defname @$N | strip("::") $N) (__constant) $R)'
  - name: normalize
    rules:
      - match: '(program $$$C)'
        replace: '%source_file($$$C)'
      - match: '(return $$$V)'
        replace: '(__ssa_return $$$V)'
      - match: '(superclass $S:constant)'
        replace: '(rb_super (__supertype @$S) (__import (__source @$S) (__source_path @$S | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$S)))'
        tag_on: __import
        tag: { import_type: Autoload }
      - match: '(superclass $S:scope_resolution)'
        replace: '(rb_super (__supertype @$S | strip("::") | split_last("::") $S) (__import (__source @$S | regex_replace("(::)?[^:]+$", "")) (__source_path @$S | strip("::") | replace("::", "/") | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$S | strip("::") | split_last("::"))))'
        tag_on: __import
        tag: { import_type: Autoload }
      # Parameters
      - match: '(%params name: $N:identifier)'
        replace: '(__binding @$N)'
      - match: '(method_parameters $$$P)'
        replace: '(method_parameters $$$P=>__binding)'
      - match: '(block_parameters $$$P)'
        replace: '(block_parameters $$$P=>block_local)'
      - match: '(lambda_parameters $$$P)'
        replace: '(lambda_parameters $$$P=>__binding)'
      - match: '(exception_variable $V:identifier)'
        replace: '(__binding @$V)'
  - name: retag-calls
    rules:
      # self.m() → this-call
      - match: '(call receiver: (self) method: $M:identifier arguments:? $A block:? $B)'
        replace: '(__call (__callee (__ivar @$M)) $A $B)'
      # @x.m()
      - match: '(call receiver: $R:instance_variable method: $M:identifier arguments:? $A block:? $B)'
        replace: '(__call (__callee (__member @$M (__object (__ivar @$R | strip("@"))))) $A $B)'
      # Const.new / Const::Nested.new → constructor call plus autoload import
      - match: '(call receiver: $R:constant method: (identifier "new") arguments:? $A block:? $B)'
        replace: '(rb_ref (__import (__source @$R) (__source_path @$R | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$R)) (__call (__callee @$R) $A $B))'
        tag_on: __import
        tag: { import_type: Autoload }
      - match: '(call receiver: $R:scope_resolution method: (identifier "new") arguments:? $A block:? $B)'
        replace: '(rb_ref (__import (__source @$R $R) (__source_path @$R | strip("::") | replace("::", "/") | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$R | split_last("::"))) (__call (__callee @$R | split_last("::")) $A $B))'
        tag_on: __import
        tag: { import_type: Autoload }
      # Const.m / Const::Nested.m → member call plus autoload import
      - match: '(call receiver: $R:constant method: $M:identifier arguments:? $A block:? $B)'
        replace: '(rb_ref (__import (__source @$R) (__source_path @$R | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$R)) (__call (__callee (__member @$M (__object @$R))) $A $B))'
        tag_on: __import
        tag: { import_type: Autoload }
      - match: '(call receiver: $R:scope_resolution method: $M:identifier arguments:? $A block:? $B)'
        replace: '(rb_ref (__import (__source @$R $R) (__source_path @$R | strip("::") | replace("::", "/") | regex_replace("([a-z0-9])([A-Z])", "${1}_${2}") | lowercase) (__name @$R | split_last("::"))) (__call (__callee (__member @$M (__object @$R | split_last("::")))) $A $B))'
        tag_on: __import
        tag: { import_type: Autoload }
      # chained: f().m() and x.m()
      - match: '(call receiver: $R:__call method: $M:identifier arguments:? $A block:? $B)'
        replace: '(__call (__callee %member($M, $R)) $A $B)'
      - match: '(call receiver: $R:rb_ref method: $M:identifier arguments:? $A block:? $B)'
        replace: '(__call (__callee %member($M, $R)) $A $B)'
      - match: '(call receiver: $R:identifier method: $M:identifier arguments:? $A block:? $B)'
        replace: '(__call (__callee (__member @$M (__object @$R))) $A $B)'
      - match: '(call receiver: $R method: $M:identifier arguments:? $A block:? $B)'
        replace: '(__call (__callee %member_text($M, $R)) $A $B)'
      # m(...) → implicit self
      - match: '(call method: $M:identifier arguments:? $A block:? $B)'
        replace: '(__call (__callee @$M) $A $B)'
        tag: { implicit_self: 'true' }
  - name: classify
    rules:
      # Bindings
      - match: '(assignment left: $L:instance_variable right: $R:__call)'
        replace: '(__binding (__ivar @$L | strip("@")) (__rhs $R))'
      - match: '(assignment left: $L:instance_variable right: $R:rb_ref)'
        replace: '(__binding (__ivar @$L | strip("@")) (__rhs $R))'
      # begin ... end and ( ... ) stand for their last expression
      - match: '(assignment left: $L:instance_variable right: $R:begin)'
        replace: '(__binding (__ivar @$L | strip("@")) (__rhs $R))'
      - match: '(assignment left: $L:instance_variable right: $R:parenthesized_statements)'
        replace: '(__binding (__ivar @$L | strip("@")) (__rhs $R))'
      - match: '(assignment left: $L:instance_variable right: $R:constant)'
        replace: '(__binding (__ivar @$L | strip("@")) (__rhs (__call (__callee @$R))))'
      - match: '(assignment left: $L:instance_variable right: $R)'
        replace: '(__binding (__ivar @$L | strip("@")) (__rhs @$R $R))'
      - match: '(assignment left: $L:identifier right: $R:__call)'
        replace: '%bind_call($L, $R)'
      - match: '(assignment left: $L:identifier right: $R:rb_ref)'
        replace: '%bind_call($L, $R)'
      - match: '(assignment left: $L:identifier right: $R:__ssa_branch)'
        replace: '%bind_call($L, $R)'
      - match: '(assignment left: $L:identifier right: $R:begin)'
        replace: '%bind_call($L, $R)'
      - match: '(assignment left: $L:identifier right: $R:parenthesized_statements)'
        replace: '%bind_call($L, $R)'
      - match: '(assignment left: $L:identifier right: $R:constant)'
        replace: '(__binding @$L (__rhs (__call (__callee @$R))))'
      - match: '(assignment left: $L:identifier right: $R:identifier)'
        replace: '(__binding @$L (__rhs (__call (__callee @$R))))'
        tag_on: __call
        tag: { implicit_self: 'true' }
      - match: '(assignment left: $L:identifier right: $R)'
        replace: '%bind($L, $R)'
      # @x ||= v binds only v, ivar types are collected per class
      - match: '(operator_assignment left: $L:instance_variable ("||=") right: $R)'
        replace: '(__binding (__ivar @$L | strip("@")) (__rhs $R))'
      # x ||= v leaves a set x alone, so x is its old value or v
      - match: '(operator_assignment left: $L:identifier ("||=") right: $R)'
        replace: '(__binding @$L (__rhs (__ssa_branch (__ssa_arm (__call (__callee @$L))) (__ssa_arm $R))))'
      # Control flow
      - match: '(%conditionals condition: $C consequence:? $Q alternative:? $A)'
        replace: '(__ssa_branch $C (__ssa_arm? $Q) (__ssa_arm? $A))'
      - match: '(%modifiers body: $B condition: $C)'
        replace: '(__ssa_branch $C (__ssa_arm $B))'
      - match: '(conditional condition: $C consequence: $Q alternative: $A)'
        replace: '(__ssa_branch $C (__ssa_arm $Q) (__ssa_arm $A))'
      - match: '(case value:? $V $$$W:when|else)'
        replace: '(__ssa_branch $V $$$W->__ssa_arm)'
      # ensure clauses never supply the value; rescue modifier handlers are not typed on purpose, so x rescue y types from x
      - match: '(begin $$$BODY $R:rescue $$$ALTS $E:ensure)'
        replace: '(begin (__ssa_branch (__ssa_arm $$$BODY) (__ssa_arm $R) $$$ALTS->__ssa_arm) (__side_effect $E))'
      - match: '(begin $$$BODY $E:ensure)'
        replace: '(begin $$$BODY (__side_effect $E))'
      - match: '(rescue_modifier body: $B handler: $H)'
        replace: '(begin $B (__side_effect $H))'
      - match: '(begin $$$BODY $R:rescue $$$ALTS)'
        replace: '(__ssa_branch (__ssa_arm $$$BODY) (__ssa_arm $R) $$$ALTS->__ssa_arm)'
      - match: '(body_statement $$$BODY $R:rescue $$$ALTS)'
        replace: '(body_statement (__ssa_branch (__ssa_arm $$$BODY) (__ssa_arm $R) $$$ALTS->__ssa_arm))'
      - match: '(%loops body: $B)'
        replace: '%loop($B)'
      # Definitions
      - match: '(method name: $N parameters:? $P body:? $B)'
        replace: '(__def (__defname @$N) (__method) $P $B)'
      - match: '(singleton_method object: (self) name: $N parameters:? $P body:? $B)'
        replace: '(__def (__defname @$N) (__method) $P $B)'
      - match: '(singleton_class value: (self) body: $B)'
        replace: '(rb_singleton $B)'
      - match: '(class name: $N superclass: (rb_super $S:__supertype $I:__import) body:? $B)'
        replace: '(__def (__defname @$N | strip("::") $N) (__class) $S $I (__binding (__ivar "super") (__rhs (__call (__callee @$S)))) $B)'
      - match: '(%namespaces name: $N body:? $B)'
        replace: '(__def (__defname @$N | strip("::")) (__class) $B)'
  - name: refs
    rules:
      # Remaining bare identifiers: implicit-self calls (may be locals)
      - match: '(identifier)'
        replace: '(__call (__callee @$ROOT))'
        tag: { implicit_self: 'true' }
      # Remaining bare constants: references
      - match: '(constant)'
        replace: '(__call (__callee @$ROOT))'
      - match: '(scope_resolution)'
        replace: '(__call (__callee (__member @$ROOT | split_last("::") (__object @$ROOT | strip("::") | regex_replace("::[^:]+$", "")))))'
  - name: ssa-cleanup
    rules:
      - match: '(__ssa_return $V:instance_variable)'
        replace: '(__ssa_return (__rhs (__ivar @$V | strip("@"))))'
  - name: lexical-scopes
    rules:
      - match: '(block_local)'
        replace: '(__binding @$ROOT (__declaration))'
      - match: '(%blocks $$$B)'
        replace: '(__scope $$$B)'
  - name: tag-defs
    rules:
      - use: function_def_tags
      - match: '(__def (__class))'
        tag:
          declares_type: 'true'
          value: 'true'
          callable: 'true'
          scoped: 'true'
          exports: '$ROOT | child_sym("__defname")'
      - match: '(__def (__lambda))'
        tag: { callable: 'true', scoped: 'true' }
      - match: '(__def (__property))'
        tag: { callable: 'true', value: 'true' }
      - match: '(__def (__enum_variant))'
        tag: { callable: 'true', value: 'true' }
      - match: '(__def (__struct))'
        tag: { value: 'true', declares_type: 'true', scoped: 'true' }
      - use: trait_def_tags
      - match: '(__def (__constant))'
        tag: { value: 'true' }
  - use: tag_file_dir
  - use: resolve_paths

project:
  - name: roots
    rules:
      - match: '(__dir "models" $$$REST)'
        replace: '(__dir "models" (__source_root) $$$REST)'
      - match: '(__dir "concerns" $$$REST)'
        replace: '(__dir "concerns" (__source_root) $$$REST)'
      - match: '(__dir "services" $$$REST)'
        replace: '(__dir "services" (__source_root) $$$REST)'
      - match: '(__dir "controllers" $$$REST)'
        replace: '(__dir "controllers" (__source_root) $$$REST)'
      - match: '(__dir "workers" $$$REST)'
        replace: '(__dir "workers" (__source_root) $$$REST)'
      - match: '(__dir "helpers" $$$REST)'
        replace: '(__dir "helpers" (__source_root) $$$REST)'
      - match: '(__dir "policies" $$$REST)'
        replace: '(__dir "policies" (__source_root) $$$REST)'
      - match: '(__dir "finders" $$$REST)'
        replace: '(__dir "finders" (__source_root) $$$REST)'
      - match: '(__dir "jobs" $$$REST)'
        replace: '(__dir "jobs" (__source_root) $$$REST)'
      - match: '(__dir "mailers" $$$REST)'
        replace: '(__dir "mailers" (__source_root) $$$REST)'
      - match: '(__dir "lib" $$$REST)'
        replace: '(__dir "lib" (__source_root) $$$REST)'
      - match: '(__dir "app" $$$REST)'
        replace: '(__dir "app" (__source_root) $$$REST)'

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag: { entity: File, file_path: '@$M', language: '@$M | split_last(".") | map("rb:ruby")' }
      - use: def_fqn_colons
  - use: def_types
  - use: display_imports
