# Swift rewrite rules.
# Handles: import as a wildcard import, classes, structs, enums, extensions
# (as __impl wrappers), protocols, properties with self.x typing, functions,
# init, self./super. calls, control flow.

config:
  stdlib: [
      { module: Swift, availability: implicit, precedence: runtime, symbols: [abs, assert, assertionFailure, debugPrint, dump, fatalError,
      getVaList, isKnownUniquelyReferenced, max, min, numericCast, precondition,
      preconditionFailure, print, readLine, repeatElement, sequence, stride,
      swap, type, unsafeBitCast, unsafeDowncast, withExtendedLifetime,
      withUnsafeBytes, withUnsafeMutableBytes, withUnsafeMutablePointer,
      withUnsafePointer, withVaList, withoutActuallyEscaping, zip] },
      { module: Foundation, symbols: [NSLog, NSStringFromClass, NSClassFromString,
          NSStringFromSelector, NSSelectorFromString, NSHomeDirectory,
          NSTemporaryDirectory, NSSearchPathForDirectoriesInDomains] },
      { module: Dispatch }, { module: Darwin }, { module: Glibc }, { module: ObjectiveC },
      { module: Combine }, { module: SwiftUI }, { module: UIKit }, { module: AppKit }, { module: XCTest }]
  resolve:
    lookup_from:
      - __source_root

stages:
  - name: imports
    rules:
      - match: '(import_declaration $I:identifier)'
        replace: '(__import (__source @$I $I) (__source_path @$I|replace(".", "/")) (__name @$I|split_last(".")))'

  - name: normalize
    rules:
      - match: '(source_file $$$C)'
        replace: '(__source_file @$ROOT $$$C)'
      - match: '(control_transfer_statement (return) $$$V)'
        replace: '(__ssa_return $$$V)'
      - match: '(user_type $T:type_identifier)'
        replace: '(type_identifier @$T)'
      - match: '(optional_type $T:type_identifier)'
        replace: '(type_identifier @$T)'
      - match: '(inheritance_specifier $T:type_identifier)'
        replace: '(__supertype @$T)'
      - match: '(navigation_expression target: (self_expression) suffix: (navigation_suffix suffix: $N:simple_identifier))'
        replace: '(__ivar @$N)'
      - match: '(parameter name: $N:simple_identifier $T:type_identifier)'
        replace: '(__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T $T))))'
      - match: '(parameter name: $N:simple_identifier)'
        replace: '(__binding @$N)'

  - name: retag-refs
    rules:
      - match: '(navigation_expression target: $O:__ivar suffix: (navigation_suffix suffix: $M:simple_identifier))'
        replace: '(__member @$M (__object $O))'
      - match: '(navigation_expression target: $O:__member suffix: (navigation_suffix suffix: $M:simple_identifier))'
        replace: '(__member @$M (__object $O))'
      - match: '(navigation_expression target: $O:call_expression suffix: (navigation_suffix suffix: $M:simple_identifier))'
        replace: '(__member @$M (__object $O))'
      - match: '(navigation_expression target: (super_expression) suffix: (navigation_suffix suffix: $M:simple_identifier))'
        replace: '(__member @$M (__object (__ivar "super")))'
      - match: '(navigation_expression target: $O suffix: (navigation_suffix suffix: $M:simple_identifier))'
        replace: '(__member @$M (__object @$O $O))'

  - name: retag-calls
    rules:
      - match: '(call_expression $F:__ivar (call_suffix $$$A))'
        replace: '(__call (__callee $F) $$$A)'
      - match: '(call_expression $F:__member (call_suffix $$$A))'
        replace: '(__call (__callee $F) $$$A)'
      - match: '(call_expression $F:simple_identifier (call_suffix $$$A))'
        replace: '(__call (__callee @$F $F) $$$A)'
      - match: '(call_expression $F (call_suffix $$$A))'
        replace: '(__call (__callee @$F $F) $$$A)'

  - name: classify
    rules:
      - match: '(property_declaration (pattern bound_identifier: $N:simple_identifier) (type_annotation $T:type_identifier) value: $V:__call)'
        replace: '(sw_prop (__def (__defname @$N) (__property)) (__binding @$N (__declaration) (__ssa_typed @$T) (__rhs $V)) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T $T)))))'
      - match: '(property_declaration (pattern bound_identifier: $N:simple_identifier) (type_annotation $T:type_identifier))'
        replace: '(sw_prop (__def (__defname @$N) (__property)) (__binding @$N (__declaration) (__ssa_typed @$T) (__rhs (__member (__object @$T $T)))) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T)))))'
      - match: '(property_declaration (pattern bound_identifier: $N:simple_identifier) value: $V:__call)'
        replace: '(sw_prop (__def (__defname @$N) (__property)) (__binding @$N (__declaration) (__rhs $V)) (__binding (__ivar @$N) (__rhs $V)))'
      - match: '(property_declaration (pattern bound_identifier: $N:simple_identifier) value: $V)'
        replace: '(sw_prop (__def (__defname @$N) (__property)) (__binding @$N (__declaration) (__rhs @$V $V)))'
      - match: '(property_declaration (pattern bound_identifier: $N:simple_identifier) $$$R)'
        replace: '(sw_prop (__def (__defname @$N) (__property)) (__binding @$N (__declaration)) $$$R)'
      - match: '(assignment target: (directly_assignable_expression $T:__ivar) result: $R:__call)'
        replace: '(__binding $T (__rhs $R))'
      - match: '(assignment target: (directly_assignable_expression $T:__ivar) result: $R)'
        replace: '(__binding $T (__rhs @$R $R))'
      - match: '(assignment target: (directly_assignable_expression $T:simple_identifier) result: $R:__call)'
        replace: '(__binding @$T (__rhs $R))'
      - match: '(assignment target: (directly_assignable_expression $T:simple_identifier) result: $R)'
        replace: '(__binding @$T (__rhs @$R $R))'
      - match: '(control_transfer_statement (throw_keyword) $$$V)'
        replace: '(__ssa_branch $$$V)'
      - match: '(if_statement $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(guard_statement $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(switch_statement $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(for_statement $$$X)'
        replace: '(__ssa_loop $$$X)'
      - match: '(while_statement $$$X)'
        replace: '(__ssa_loop $$$X)'
      - match: '(repeat_while_statement $$$X)'
        replace: '(__ssa_loop $$$X)'
      - match: '(enum_entry name: $N:simple_identifier $$$R)'
        replace: '(__def (__defname @$N) (__enum_variant) $$$R)'
      - match: '(protocol_function_declaration name: $N:simple_identifier $$$P:__binding $RT?:type_identifier)'
        replace: '(__def (__defname @$N) (__method) (__ssa_return_type? @$RT) $$$P)'
      - match: '(init_declaration $$$P:__binding body: $B:function_body)'
        replace: '(__def (__defname "init") (__method) $$$P $B)'
      - match: '(function_declaration $M?:modifiers name: $N:simple_identifier $$$P:__binding $RT:type_identifier body: $B:function_body)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type @$RT) $M $$$P $B)'
      - match: '(function_declaration $M?:modifiers name: $N:simple_identifier $$$P:__binding body: $B:function_body)'
        replace: '(__def (__defname @$N) (__function) $M $$$P $B)'
      - match: '(class_declaration (struct) name: $N:type_identifier $$$ANN body: (class_body $$$B))'
        replace: '(__def (__defname @$N) (__struct) $$$ANN $$$B)'
      - match: '(class_declaration (enum) name: $N:type_identifier $$$ANN body: (enum_class_body $$$B))'
        replace: '(__def (__defname @$N) (__enum) $$$ANN $$$B)'
      - match: '(class_declaration (extension) name: $N:type_identifier $$$ANN body: (class_body $$$B))'
        replace: '(__def (__defname @$N) (__impl) $$$ANN $$$B)'
        tag: { language_kind: Extension }
      - match: '(class_declaration name: $N:type_identifier $S:__supertype $$$ANN body: (class_body $$$B))'
        replace: '(__def (__defname @$N) (__class) $S $$$ANN (__binding (__ivar "super") (__rhs (__call (__callee @$S)))) $$$B)'
      - match: '(class_declaration name: $N:type_identifier $$$ANN body: (class_body $$$B))'
        replace: '(__def (__defname @$N) (__class) $$$ANN $$$B)'
      - match: '(protocol_declaration name: $N:type_identifier $$$ANN body: (protocol_body $$$B))'
        replace: '(__def (__defname @$N) (__interface) $$$ANN $$$B)'
      - match: '(typealias_declaration name: $N:type_identifier)'
        replace: '(__def (__defname @$N) (__type_alias))'

  - name: ssa-cleanup
    rules:
      - match: '(statements $$$B)'
        replace: '(__scope $$$B)'
      - match: '(__ssa_return $V:simple_identifier)'
        replace: '(__ssa_return (__rhs @$V $V))'

  - name: tag-defs
    rules:
      - match: '(__def (__function))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__method))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__class))'
        tag: { callable: "true", value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__lambda))'
        tag: { callable: "true" }
      - match: '(__def (__enum_variant))'
        tag: { callable: "true", value: "true" }
      - match: '(__def (__struct))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__impl))'
        tag: { scoped: "true" }
      - match: '(__def (__trait))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__enum))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__interface))'
        tag: { value: "true", declares_type: "true" }
      - match: '(__def (__property))'
        tag: { value: "true" }
      - match: '(__def (__type_alias))'
        tag: { value: "true", declares_type: "true" }

  - name: tag-file-dir
    rules:
      - match: '$M:__source_file'
        tag:
          file_dir: '@$M|regex_replace("[^/]*$", "")|regex_replace("/$", "")'

  - name: resolve-paths
    rules:
      - match: '(__import)'
        tag:
          resolved_source: '@$ROOT|child_sym("__source_path")'
      - match: '(__import (__source_path "^."))'
        tag:
          resolved_source: '@$ROOT|concat("/", "ancestor_tag:file_dir", "child_sym:__source_path")|regex_replace("(^|/)\./", "$1")|regex_loop("[^/]+/\.\./", "")|regex_replace("/$", "")|regex_replace("^/", "")'

resolve:
  stages:
    - name: roots
      rules:
        - match: '(__dir "Sources" $$$REST)'
          replace: '(__dir "Sources" (__source_root) $$$REST)'
        - match: '(__dir "src" $$$REST)'
          replace: '(__dir "src" (__source_root) $$$REST)'

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          file_path: '@$M'
          language: '@$M|split_last(".")|map("swift:swift")'
          is_test: '@$M|regex_match("Tests?\.swift$|(^|/)Tests/")'
          generated: '@$M|source("2048")|regex_match("(?i)code generated .*do not edit|@generated|<auto-generated|autogenerated by|generated by .*do not (edit|modify)")'
      - match: '(__def !(__impl))'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat(".", "ancestor_tag:fqn", "child_sym:__defname")|keep_last(".", "64", "4096")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
      - match: '(__def (__impl))'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat(".", "ancestor_tag:fqn", "child_sym:__defname")|keep_last(".", "64", "4096")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: def_type
    rules:
      - match: '(__def (__function))'
        tag: { def_type: Function }
      - match: '(__def (__method))'
        tag: { def_type: Method }
      - match: '(__def (__class))'
        tag: { def_type: Class }
      - match: '(__def (__struct))'
        tag: { def_type: Struct }
      - match: '(__def (__interface))'
        tag: { def_type: Interface }
      - match: '(__def (__enum))'
        tag: { def_type: Enum }
      - match: '(__def (__enum_variant))'
        tag: { def_type: EnumVariant }
      - match: '(__def (__trait))'
        tag: { def_type: Trait }
      - match: '(__def (__impl))'
        tag: { def_type: Impl }
      - match: '(__def (__variable))'
        tag: { def_type: Variable }
      - match: '(__def (__constant))'
        tag: { def_type: Constant }
      - match: '(__def (__static_constant))'
        tag: { def_type: Static }
      - match: '(__def (__lambda))'
        tag: { def_type: Lambda }
      - match: '(__def (__field_def))'
        tag: { def_type: Field }
      - match: '(__def (__property))'
        tag: { def_type: Property }
      - match: '(__def (__type_alias))'
        tag: { def_type: TypeAlias }
  - name: signature
    rules:
      - match: '(__def)'
        tag:
          signature: '@$ROOT|source("4096")|top_until("\{", "()[]{}<>")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
          head: '@$ROOT|source("1024")|top_until("[(:=<{]", "()[]{}<>")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
          doc_comment: '@$ROOT|source_before("4096")|regex_first("(?s)\A(?:(?:.*?\n)??(?:((?:[ \t]*///[^\n]*\n)+)|[ \t]*/\*\*((?:[^*]|\*+[^*/])*)\*+/[ \t]*\n)?(?:[ \t]*@[^\n]*\n)*[ \t]*|.*)\z", "$1$2")|regex_replace("(?m)^[ \t]*(?:///|\*+)[ \t]?", "")|regex_replace("\A\s+", "")|regex_replace("(?s)(?:\n[ \t]*\n|(?:\A|\n)[ \t]*- (?:Parameter|Parameters|Returns|Throws)\b).*", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__property))'
        tag: &value_sig
          signature: '@$ROOT|source("2048")|top_until("=|\{", "()[]{}<>")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__type_alias))'
        tag: *value_sig
  - name: kind
    rules:
      - match: '(__def (__class))'
        tag: { kind: Class }
      - match: '(__def (__class) (__supertype "XCTestCase"))'
        tag: { xctest: "true" }
      - match: '(__def (__struct))'
        tag: { kind: Struct }
      - match: '(__def (__enum))'
        tag: { kind: Enum }
      - match: '(__def (__interface))'
        tag: { kind: Interface, language_kind: Protocol }
      - match: '(__def (__impl))'
        tag: { kind: Impl }
      - match: '(__def (__type_alias))'
        tag: { kind: TypeAlias }
      - match: '(__def (__enum_variant))'
        tag: { kind: EnumMember }
      - match: '(__def (__method))'
        tag: { kind: Method }
      - match: '(__def (__defname "init") (__method))'
        tag: { kind: Constructor }
      - match: '(__def (__function))'
        tag:
          kind: '@$ROOT|ancestor_tag("kind")|regex_replace("(?s)\A(?:Class|Struct|Enum|Interface|Impl)\z", "Method")|regex_replace("(?s)^(Method)$|.*", "$1")|default("Function")'
      - match: '(__def (__defname "/^test/") (__function))'
        tag:
          kind: '@$ROOT|concat(":", "ancestor_tag:xctest", "tag:kind")|regex_replace("(?s)\Atrue:Method\z", "Test")|regex_replace("\Atrue:", "")'
      - match: '(__def (__property))'
        tag:
          kind: '@$ROOT|concat(":", "ancestor_tag:kind", "tag:head")|regex_replace("(?s)\A(?:Class|Struct|Enum|Interface|Impl):.*", "Field")|regex_replace("(?s)\A(?:[A-Za-z]+:)?(?:.*\s)?let\s.*", "Constant")|regex_replace("(?s)^(Field|Constant)$|.*", "$1")|default("Variable")'
      - match: '(__def (__property))'
        tag:
          language_kind: '@$ROOT|tag("kind")|map("Field:Property")|regex_replace("(?s)^(Property)$|.*", "$1")'
  - name: content
    rules:
      - match: '(__def (__function))'
        tag: &callable
          parameters: '@$ROOT|tag("signature")|top_after("\(", "()[]{}<>")|top_until("\)", "()[]{}<>")|regex_replace("\s+", " ")|regex_replace("^ | $", "")|top_split(",", "()[]{}<>")'
          return_type: '@$ROOT|tag("signature")|top_after("\(", "()[]{}<>")|top_after("\)", "()[]{}<>")|top_after("->", "()[]{}<>")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
          after_params: '@$ROOT|tag("signature")|top_after("\(", "()[]{}<>")|top_after("\)", "()[]{}<>")|top_until("->", "()[]{}<>")'
      - match: '(__def (__method))'
        tag: *callable
      - match: '(__def (__property))'
        tag:
          declared_type: '@$ROOT|tag("signature")|top_after(":", "()[]{}<>")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__type_alias))'
        tag:
          declared_type: '@$ROOT|source("2048")|top_after("=", "()[]{}<>")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def)'
        tag:
          modifiers: '@$ROOT|concat(" ", "tag:head", "tag:after_params")|regex_replace("\b(static|final|override|async)\b|\b(class)\s+(?:func|var|let|subscript)\b|.", "$1$2 ")|regex_replace("\bclass\b", "static")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
          visibility: '@$ROOT|tag("head")|regex_first("(?s)\A(?:.*?\b(open|public|internal|fileprivate|private)\b(?:[^(]|\z).*|.*)\z", "$1")|map("open:public", "fileprivate:file")|default("internal")'
      - match: '(__def)'
        tag:
          visibility: '@$ROOT|concat(":", "ancestor_tag:kind", "tag:visibility")|regex_first("(?s)\A(?:(?:Function|Method|Constructor|Test):.*|(?:[A-Za-z]+:)?(.*))\z", "$1")'
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: Import
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name "*")'
        tag:
          import_type: WildcardImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name (__alias))'
        tag:
          import_type: AliasedImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          import_type: '@$ROOT|tag("import_type")|default("Import")'
          import_kind: '@$ROOT|source("256")|regex_replace("(?s)\A\s*(?:@\w+\s+)*import\s+(?:typealias|struct|class|enum|protocol|let|var|func)\s.*", "symbol")|regex_replace("(?s)^(symbol)$|.*", "$1")|default("module")'
          fqn: '@$ROOT|ancestor_tag("source_path")'
