import: [shapes]

canonicalize:
  - stage: normalize
    rewrite:
      - '(graphql_document)': '(__source_file @$ROOT (__def (__defname "default") (__default_export "default") (__variable)))'

display:
  - stage: file
    rewrite:
      - '$M:__source_file': '#entity=File #file_path=@$M #language=graphql'
  - stage: fqn
    rewrite:
      - '(__def)': '#entity=Definition #definition_span=true #def_type=Variable #fqn=$ROOT | tag_up("file_path") | concat("::", "default") #file_path=$ROOT | tag_up("file_path")'
