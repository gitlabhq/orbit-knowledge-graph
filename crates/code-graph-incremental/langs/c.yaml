import: [c_family, canonical, display, roots, shapes]

data:
  stdlib: [assert.h, ctype.h, math.h, stdio.h, stdlib.h, string.h, time.h, fenv.h, locale.h, setjmp.h,
    signal.h, inttypes.h, complex.h, errno.h, float.h, iso646.h, limits.h, stdalign.h, stdarg.h, stdatomic.h,
    stdbit.h, stdbool.h, stdckdint.h, stddef.h, stdint.h, stdnoreturn.h, tgmath.h, threads.h, uchar.h,
    wchar.h, wctype.h]
  providers:
  - [assert.h, assert]
  - [ctype.h, isalnum, isalpha, isblank, iscntrl, isdigit, isgraph, islower, isprint, ispunct, isspace,
    isupper, isxdigit, tolower, toupper]
  - [math.h, acos, asin, atan, atan2, cos, sin, tan, acosh, asinh, atanh, cosh, sinh, tanh, exp, exp2,
    expm1, frexp, ldexp, log, log10, log1p, log2, logb, modf, scalbn, scalbln, cbrt, fabs, hypot, pow,
    sqrt, erf, erfc, lgamma, tgamma, ceil, floor, nearbyint, rint, lrint, llrint, round, lround, llround,
    trunc, fmod, remainder, remquo, copysign, nan, nextafter, nexttoward, fdim, fmax, fmin, fma, fpclassify,
    isfinite, isinf, isnan, isnormal, signbit]
  - [stdio.h, clearerr, fclose, feof, ferror, fflush, fgetc, fgetpos, fgets, fopen, fprintf, fputc, fputs,
    fread, freopen, fscanf, fseek, fsetpos, ftell, fwrite, getc, getchar, gets, perror, printf, putc,
    putchar, puts, remove, rename, rewind, scanf, setbuf, setvbuf, snprintf, sprintf, sscanf, tmpfile,
    tmpnam, ungetc, vfprintf, vfscanf, vprintf, vscanf, vsnprintf, vsprintf, vsscanf]
  - [stdlib.h, abort, abs, atexit, atof, atoi, atol, atoll, at_quick_exit, aligned_alloc, bsearch, calloc,
    div, exit, free, getenv, labs, ldiv, llabs, lldiv, malloc, mblen, mbstowcs, mbtowc, qsort, quick_exit,
    rand, realloc, srand, strtod, strtof, strtol, strtold, strtoll, strtoul, strtoull, system, wcstombs,
    wctomb, _Exit]
  - [string.h, memchr, memcmp, memcpy, memmove, memset, strcat, strchr, strcmp, strcoll, strcpy, strcspn,
    strerror, strlen, strncat, strncmp, strncpy, strpbrk, strrchr, strspn, strstr, strtok, strxfrm]
  - [time.h, asctime, clock, ctime, difftime, gmtime, localtime, mktime, strftime, time, timespec_get,
    timespec_getres]
  - [fenv.h, feclearexcept, fegetexceptflag, feraiseexcept, fesetexceptflag, fetestexcept, fegetround,
    fesetround, fegetenv, feholdexcept, fesetenv, feupdateenv]
  - [locale.h, localeconv, setlocale]
  - [setjmp.h, setjmp, longjmp]
  - [signal.h, signal, raise]
  - [inttypes.h, imaxabs, imaxdiv, strtoimax, strtoumax, wcstoimax, wcstoumax]
  lookup_from: [__source_root]
  records: [struct_specifier, union_specifier]

canonicalize:
  - stage: imports
    rewrite:
      - '(preproc_include path: $S:string_literal)': '(__import (__source @$S $S) (__source_path @$S | regex_replace("^.", "") | regex_replace(".$", "") | prepend("./")) (__name "*"))'
      - '(preproc_include path: $S:system_lib_string)': '(__import (__source @$S) (__source_path @$S | strip("<") | strip_suffix(">")) (__name "*"))'
  - stage: normalize
    rewrite:
      - '(translation_unit $$$C)': '%source_file($$$C)'
      - '(return_statement $$$V)': '(__ssa_return $$$V)'
      - '(parameter_declaration declarator: $N:identifier)': '(__binding @$N)'
      - '(parameter_declaration declarator: (pointer_declarator declarator: $N:identifier))': '(__binding @$N)'
      - '(enumerator name: $N:identifier)': '(__def (__defname @$N) (__enum_variant))'
      - '(field_declaration type: $T:struct_specifier declarator: $N:field_identifier)': '(field_declaration $T (__def (__defname @$N) (__field_def)))'
      - '(field_declaration type: $T:union_specifier declarator: $N:field_identifier)': '(field_declaration $T (__def (__defname @$N) (__field_def)))'
      - '(field_declaration type: $T:enum_specifier declarator: $N:field_identifier)': '(field_declaration $T (__def (__defname @$N) (__field_def)))'
      - '(field_declaration declarator: $N:field_identifier)': '(__def (__defname @$N) (__field_def))'
      - '(field_declaration declarator: (pointer_declarator declarator: $N:field_identifier))': '(__def (__defname @$N) (__field_def))'
      - '(field_declaration declarator: (array_declarator declarator: $N:field_identifier))': '(__def (__defname @$N) (__field_def))'
  - stage: retag-calls
    rewrite:
      - '(call_expression function: (field_expression argument: $O field: $F:field_identifier) arguments: $A)': '(__call (__callee %member_text($F, $O)) $A)'
      - '(call_expression function: $F:identifier arguments: $A)': '%call($F, $A)'
  - stage: classify
    rewrite:
      - '(declaration declarator: (function_declarator declarator: $N:identifier))': '(__defname @$N) #exports=@$N'
      - '(declaration declarator: (pointer_declarator declarator: (function_declarator declarator: $N:identifier)))': '(__defname @$N) #exports=@$N'
      - '(function_definition declarator: (function_declarator declarator: (parenthesized_declarator (pointer_declarator (function_declarator declarator: $N:identifier parameters: $P)))) body: $B)': '(__def (__defname @$N) (__function) $P $B)'
      - '(function_definition declarator: (pointer_declarator declarator: (pointer_declarator declarator: (function_declarator declarator: $N:identifier parameters: $P))) body: $B)': '(__def (__defname @$N) (__function) $P $B)'
      - '(function_definition declarator: (function_declarator declarator: (parenthesized_declarator $N:identifier) parameters: $P) body: $B)': '(__def (__defname @$N) (__function) $P $B)'
      - '(function_definition declarator: (attributed_declarator (function_declarator declarator: $N:identifier parameters: $P)) body: $B)': '(__def (__defname @$N) (__function) $P $B)'
      - '(function_definition declarator: (function_declarator declarator: $N:identifier parameters: $P) body: $B)': '(__def (__defname @$N) (__function) $P $B)'
      - '(function_definition declarator: (pointer_declarator declarator: (function_declarator declarator: $N:identifier parameters: $P)) body: $B)': '(__def (__defname @$N) (__function) $P $B)'
      - use: c_statements
      - '(%records name: $N:type_identifier body: $B)': '(__def (__defname @$N) (__struct) $B)'
      - '(enum_specifier name: $N:type_identifier body: $B)': '(__def (__defname @$N) (__enum) $B)'
      - '(type_definition type: $T declarator: $N:type_identifier)': '(type_definition (__def (__defname @$N) (__type_alias)) $T)'
      - '(type_definition type: $T declarator: (pointer_declarator declarator: $N:type_identifier))': '(type_definition (__def (__defname @$N) (__type_alias)) $T)'
      - '(type_definition type: $T declarator: (array_declarator declarator: $N:type_identifier))': '(type_definition (__def (__defname @$N) (__type_alias)) $T)'
      - '(type_definition type: $T declarator: (function_declarator declarator: (parenthesized_declarator (pointer_declarator declarator: $N:type_identifier))))': '(type_definition (__def (__defname @$N) (__type_alias)) $T)'
  - stage: ssa-cleanup
    rewrite:
      - '(compound_statement $$$B)': '(__scope $$$B)'
      - '(__ssa_return $V:identifier)': '%return_value($V)'
  - stage: tag-defs
    rewrite:
      - use: function_def_tags
      - use: type_def_tags
      - use: alias_field_def_tags
  - use: tag_file_dir
  - use: resolve_paths

project:
  - stage: roots
    rewrite:
      - use: src_root
      - '(__dir "include" $$$REST)': '(__dir "include" (__source_root) $$$REST)'

display:
  - stage: fqn
    rewrite:
      - '$M:__source_file': '#entity=File #fqn=@$M | stem | split_last("/") #file_path=@$M #language=@$M | split_last(".") | map("c:c", "h:c")'
      - use: def_fqn_colons_except_impl
  - use: def_types
  - stage: def_type_names
    rewrite:
      - '(__def (__type_alias))': '#def_type=Typedef'
      - '(__def (__enum_variant))': '#def_type=EnumConstant'
  - use: display_wildcard_imports
