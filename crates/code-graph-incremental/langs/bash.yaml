# Bash rewrite rules.
# Handles: source/. as wildcard imports, function definitions, commands as
# calls, variable assignments, control flow. Definitions hang off the file
# stem (stem.name).

import: [canonical, display, shapes]

data:
  builtins: [
    alias, bg, bind, break, builtin, caller, cd, command, compgen, complete, compopt, continue,
    declare, dirs, disown, echo, enable, eval, exec, exit, export, 'false', fc, fg, getopts, hash,
    help, history, jobs, kill, let, local, logout, mapfile, popd, printf, pushd, pwd, read,
    readarray, readonly, return, set, shift, shopt, source, suspend, test, times, trap, 'true',
    type, typeset, ulimit, umask, unalias, unset, wait
  ]
  loops: [for_statement, c_style_for_statement, while_statement]

canonicalize:
  - name: imports
    rules:
      - match: '(command name: (command_name (word "source")) argument: $P:word)'
        replace: '%wildcard_import($P)'
      - match: '(command name: (command_name (word ".")) argument: $P:word)'
        replace: '%wildcard_import($P)'
      - match: '(command name: (command_name (word "source")) argument: (string $P:string_content))'
        replace: '%wildcard_import($P)'
  - name: normalize
    rules:
      - match: '(program $$$C)'
        replace: '%source_file($$$C)'
  - name: retag-calls
    rules:
      - match: '(command name: (command_name $W:word) $$$A)'
        replace: '%call($W, $$$A)'
  - name: classify
    rules:
      - match: '(variable_assignment name: $N:variable_name value: $V:__call)'
        replace: '(__binding @$N | prepend("$") (__rhs $V))'
      - match: '(variable_assignment name: $N:variable_name value: $V)'
        replace: '(__binding @$N | prepend("$") (__rhs @$V $V))'
      - match: '(if_statement $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(case_statement value: $V $$$X:case_item)'
        replace: '(__ssa_branch $V $$$X->__ssa_arm)'
      - match: '(%loops body: $B)'
        replace: '%loop($B)'
      - match: '(function_definition name: $N:word body: $B)'
        replace: '(__def (__defname @$N) (__function) $B)'
  - name: tag-defs
    rules:
      - use: function_def_tags
      - use: type_def_tags
  - use: tag_file_dir
  - use: resolve_paths

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M | stem | split_last("/")'
          file_path: '@$M'
          language: '@$M | split_last(".") | map("sh:bash", "bash:bash", "zsh:bash")'
      - use: def_fqn_dotted_except_impl
  - use: def_types
  - name: imports
    rules:
      - use: import_entity
      - match: '(__import)'
        tag: { import_type: Source }
      - match: '(__name "*")'
        tag: { resolved: '$ROOT | has_incoming("Imports")' }
      - use: aliased_import_type
      - match: '(__name)'
        tag: { resolved: '$ROOT | has_incoming("Imports")' }
