# Zig rewrite rules.
# Handles: const/var declarations (structs, enums, unions, constants,
# variables), container fields, functions, tests, member and struct
# initializer calls, control flow.

config:
  stdlib: [
    { availability: implicit, symbols: ['@as', '@alignCast', '@alignOf', '@bitCast', '@bitOffsetOf',
      '@bitSizeOf', '@byteSwap', '@call', '@cDefine', '@cImport', '@cInclude',
      '@cUndef', '@clz', '@compileError', '@compileLog', '@ctz', '@embedFile',
      '@enumFromInt', '@errorFromInt', '@errorName', '@errorReturnTrace',
      '@field', '@fieldParentPtr', '@floatCast', '@floatFromInt', '@hasDecl',
      '@hasField', '@import', '@inComptime', '@intCast', '@intFromBool',
      '@intFromEnum', '@intFromError', '@intFromFloat', '@intFromPtr', '@max',
      '@memcpy', '@memset', '@min', '@offsetOf', '@panic', '@popCount',
      '@ptrCast', '@ptrFromInt', '@sizeOf', '@src', '@tagName', '@This',
      '@trap', '@truncate', '@Type', '@typeInfo', '@typeName', '@TypeOf', '@Vector',
      '@abs', '@addWithOverflow', '@atomicLoad', '@atomicRmw', '@atomicStore',
      '@bitReverse', '@ceil', '@cmpxchgStrong', '@cmpxchgWeak', '@cos', '@divExact',
      '@divFloor', '@divTrunc', '@exp', '@exp2', '@floor', '@log',
      '@log2', '@log10', '@mod', '@mulAdd', '@mulWithOverflow', '@reduce', '@rem',
      '@round', '@select', '@shlExact', '@shlWithOverflow', '@shrExact', '@shuffle',
      '@sin', '@splat', '@sqrt', '@subWithOverflow', '@tan', '@trunc'] },
    { module: std, precedence: runtime }, { module: builtin, precedence: runtime }
  ]
  resolve:
    lookup_from:
      - __source_root

stages:
  - name: mark
    rules:
      - match: '(enum_declaration $$$F:container_field)'
        replace: '(enum_declaration $$$F->zig_enum_member)'

  - name: normalize
    rules:
      - match: '(source_file $$$C)'
        replace: '(__source_file @$ROOT $$$C)'
      - match: '(return_expression $$$V)'
        replace: '(__ssa_return $$$V)'
      - match: '(parameter name: $N:identifier type: $T:identifier)'
        replace: '(__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T $T))))'
      - match: '(parameter name: $N:identifier)'
        replace: '(__binding @$N)'
      - match: '(zig_enum_member name: $N:identifier)'
        replace: '(__def (__defname @$N) (__enum_variant))'
      - match: '(container_field name: $N:identifier)'
        replace: '(__def (__defname @$N) (__field_def))'

  - name: retag-calls
    rules:
      - match: '(call_expression function: (field_expression object: $O:identifier member: $M:identifier) $$$A)'
        replace: '(__call (__callee (__member @$M (__object @$O $O))) $$$A)'
      - match: '(call_expression function: $F:identifier $$$A)'
        replace: '(__call (__callee @$F $F) $$$A)'
      - match: '(struct_initializer $T:identifier $L:initializer_list)'
        replace: '(__call (__callee @$T $T) $L)'

  - name: classify
    rules:
      - match: '(variable_declaration $N:identifier $D:struct_declaration)'
        replace: '(__def (__defname @$N) (__struct) $D)'
      - match: '(variable_declaration $N:identifier $D:enum_declaration)'
        replace: '(__def (__defname @$N) (__enum) $D)'
      - match: '(variable_declaration $N:identifier $D:union_declaration)'
        replace: '(__def (__defname @$N) (__struct) $D)'
        tag: { language_kind: Union }
      - match: '(variable_declaration (const) $N:identifier (builtin_function (builtin_identifier "@import") (arguments (string $S:string_content))))'
        replace: '(zig_var (__def (__defname @$N) (__constant)) (__import (__source @$S) (__source_path @$S|regex_replace("^([^./].*\.zig)$", "./$1")) (__name "*" (__alias @$N))))'
      - match: '(variable_declaration (const) $N:identifier $V:__call)'
        replace: '(zig_var (__def (__defname @$N) (__constant)) (__binding @$N (__declaration) (__rhs $V)))'
      - match: '(variable_declaration (const) $N:identifier ("=") $V:identifier)'
        replace: '(zig_var (__def (__defname @$N) (__constant)) (__binding @$N (__declaration) (__rhs @$V $V)))'
      - match: '(variable_declaration (const) $N:identifier $$$V)'
        replace: '(zig_var (__def (__defname @$N) (__constant)) (__binding @$N $$$V))'
      - match: '(variable_declaration (var) $N:identifier $V:__call)'
        replace: '(zig_var (__def (__defname @$N) (__variable)) (__binding @$N (__declaration) (__rhs $V)))'
      - match: '(variable_declaration (var) $N:identifier ("=") $V:identifier)'
        replace: '(zig_var (__def (__defname @$N) (__variable)) (__binding @$N (__declaration) (__rhs @$V $V)))'
      - match: '(variable_declaration (var) $N:identifier $$$V)'
        replace: '(zig_var (__def (__defname @$N) (__variable)) (__binding @$N $$$V))'
      - match: '(if_expression $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(switch_expression $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(while_statement $$$X)'
        replace: '(__ssa_loop $$$X)'
      - match: '(for_statement $$$X)'
        replace: '(__ssa_loop $$$X)'
      - match: '(function_declaration name: $N:identifier $P:parameters type:? $RT:identifier body: $B:block)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $P $B)'
      - match: '(function_declaration name: $N:identifier $P:parameters $$$R)'
        replace: '(__def (__defname @$N) (__function) $P)'
      - match: '(test_declaration (string $S:string_content) $B:block)'
        replace: '(__def (__defname @$S) (__function) $B)'
        tag: { test_block: Test, unbound: "true" }
      - match: '(test_declaration $B:block)'
        replace: '(__def (__defname "test") (__function) $B)'
        tag: { test_block: Test, unbound: "true" }

  - name: ssa-cleanup
    rules:
      - match: '(block $$$B)'
        replace: '(__scope $$$B)'
      - match: '(__ssa_return $V:identifier)'
        replace: '(__ssa_return (__rhs @$V $V))'

  - name: tag-defs
    rules:
      - match: '(__def (__function))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__method))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__class))'
        tag: { callable: "true", value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__lambda))'
        tag: { callable: "true" }
      - match: '(__def (__enum_variant))'
        tag: { callable: "true", value: "true" }
      - match: '(__def (__struct))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__impl))'
        tag: { scoped: "true" }
      - match: '(__def (__trait))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__enum))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__field_def))'
        tag: { value: "true" }
      - match: '(__def (__variable))'
        tag: { value: "true" }
      - match: '(__def (__constant))'
        tag: { value: "true" }

  - name: tag-file-dir
    rules:
      - match: '$M:__source_file'
        tag:
          file_dir: '@$M|regex_replace("[^/]*$", "")|regex_replace("/$", "")'

  - name: resolve-paths
    rules:
      - match: '(__import)'
        tag:
          resolved_source: '@$ROOT|child_sym("__source_path")'
      - match: '(__import (__source_path "^."))'
        tag:
          resolved_source: '@$ROOT|concat("/", "ancestor_tag:file_dir", "child_sym:__source_path")|regex_replace("(^|/)\./", "$1")|regex_loop("[^/]+/\.\./", "")|regex_replace("/$", "")|regex_replace("^/", "")'

resolve:
  stages:
    - name: roots
      rules:
        - match: '(__dir "src" $$$REST)'
          replace: '(__dir "src" (__source_root) $$$REST)'

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          file_path: '@$M'
          language: '@$M|split_last(".")|map("zig:zig")'
          is_test: '@$M|regex_match("(^|/)tests?/|_test\.zig$")'
          generated: '@$M|source("2048")|regex_match("(?i)code generated .*do not edit|@generated|<auto-generated|autogenerated by|generated by .*do not (edit|modify)")'
      - match: '(__def !(__impl))'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat(".", "ancestor_tag:fqn", "child_sym:__defname")|keep_last(".", "64", "4096")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
      - match: '(__def (__impl))'
        tag:
          entity: Definition
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: def_type
    rules:
      - match: '(__def (__function))'
        tag: { def_type: Function }
      - match: '(__def (__method))'
        tag: { def_type: Method }
      - match: '(__def (__class))'
        tag: { def_type: Class }
      - match: '(__def (__struct))'
        tag: { def_type: Struct }
      - match: '(__def (__interface))'
        tag: { def_type: Interface }
      - match: '(__def (__enum))'
        tag: { def_type: Enum }
      - match: '(__def (__enum_variant))'
        tag: { def_type: EnumVariant }
      - match: '(__def (__trait))'
        tag: { def_type: Trait }
      - match: '(__def (__impl))'
        tag: { def_type: Impl }
      - match: '(__def (__variable))'
        tag: { def_type: Variable }
      - match: '(__def (__constant))'
        tag: { def_type: Constant }
      - match: '(__def (__static_constant))'
        tag: { def_type: Static }
      - match: '(__def (__lambda))'
        tag: { def_type: Lambda }
      - match: '(__def (__field_def))'
        tag: { def_type: Field }
      - match: '(__def (__property))'
        tag: { def_type: Property }
      - match: '(__def (__type_alias))'
        tag: { def_type: TypeAlias }
  - name: signature
    rules:
      - match: '(__def)'
        tag:
          signature: '@$ROOT|source("4096")|top_until("\{", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
          head: '@$ROOT|source("1024")|top_until("[(:=]", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
          doc_comment: '@$ROOT|source_before("4096")|regex_first("(?s)\A(?:(?:.*?\n)??((?:[ \t]*///[^\n]*\n)+)?[ \t]*|.*)\z", "$1")|regex_replace("(?m)^[ \t]*///[ \t]?", "")|regex_replace("\A\s+", "")|regex_replace("(?s)\n[ \t]*\n.*", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__constant))'
        tag: &value_sig
          signature: '@$ROOT|source("2048")|top_until("=|;|,", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__variable))'
        tag: *value_sig
      - match: '(__def (__field_def))'
        tag: *value_sig
      - match: '(__def (__enum_variant))'
        tag: *value_sig
  - name: kind
    rules:
      - match: '(__def (__struct))'
        tag: { kind: Struct }
      - match: '(__def (__enum))'
        tag: { kind: Enum }
      - match: '(__def (__enum_variant))'
        tag: { kind: EnumMember }
      - match: '(__def (__field_def))'
        tag: { kind: Field }
      - match: '(__def (__constant))'
        tag: { kind: Constant }
      - match: '(__def (__variable))'
        tag: { kind: Variable }
      - match: '(__def (__function))'
        tag:
          kind: '@$ROOT|ancestor_tag("kind")|regex_replace("(?s)\A(?:Struct|Enum)\z", "Method")|regex_replace("(?s)^(Method)$|.*", "$1")|default("Function")'
      - match: '(__def (__function))'
        tag:
          kind: '@$ROOT|or("tag:test_block", "tag:kind")'
  - name: content
    rules:
      - match: '(__def (__function))'
        tag:
          parameters: '@$ROOT|tag("signature")|top_after("\(", "()[]{}")|top_until("\)", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")|top_split(",", "()[]{}")'
          return_type: '@$ROOT|tag("signature")|top_after("\(", "()[]{}")|top_after("\)", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__constant))'
        tag: &declared
          declared_type: '@$ROOT|tag("signature")|top_after(":", "()[]{}")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__variable))'
        tag: *declared
      - match: '(__def (__field_def))'
        tag: *declared
      - match: '(__def)'
        tag:
          modifiers: '@$ROOT|tag("head")|regex_replace("\b(extern|inline)\b|\b(export)\b|.", "$1$2 ")|regex_replace("\bexport\b", "extern")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
          visibility: '@$ROOT|tag("head")|regex_first("(?s)\A(?:(pub)\b.*|.*)\z", "$1")|map("pub:public")|default("private")'
      - match: '(__def)'
        tag:
          visibility: '@$ROOT|concat(":", "ancestor_tag:kind", "tag:visibility")|regex_first("(?s)\A(?:(?:Function|Method|Test):.*|(?:[A-Za-z]+:)?(.*))\z", "$1")'
      - match: '(__def (__function))'
        tag:
          visibility: '@$ROOT|concat(":", "tag:test_block", "tag:visibility")|regex_first("(?s)\A(?:Test:.*|(.*))\z", "$1")'
      - match: '(__def (__field_def))'
        tag: { visibility: public }
      - match: '(__def (__enum_variant))'
        tag: { visibility: public }
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: Import
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name "*")'
        tag:
          import_type: WildcardImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name (__alias))'
        tag:
          import_type: AliasedImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          import_kind: module
          fqn: '@$ROOT|ancestor_tag("resolved_source")'
