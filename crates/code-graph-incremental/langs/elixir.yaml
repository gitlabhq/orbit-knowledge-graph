# Elixir rewrite rules.
# Handles: alias/import/require/use as imports (module names map to
# lib/snake_case paths), defmodule as class-like scopes, def/defp/defmacro,
# Module.fun calls, implicit-module calls, if/case/cond/for.

import: [canonical, display, shapes]

data:
  builtins: [
    abs, apply, binary_part, bit_size, byte_size, ceil, div, elem, exit, floor, hd, inspect,
    is_atom, is_binary, is_bitstring, is_boolean, is_float, is_function, is_integer, is_list,
    is_map, is_map_key, is_nil, is_number, is_pid, is_port, is_reference, is_tuple, length,
    make_ref, map_size, max, min, node, put_elem, raise, rem, round, self, send, spawn, spawn_link,
    spawn_monitor, struct, 'struct!', throw, tl, trunc, tuple_size
  ]
  stdlib: [
    Kernel, Bitwise, Enum, Access, Agent, Application, Atom, Base, Calendar, Code, Date, DateTime,
    DynamicSupervisor, Exception, File, Float, Function, GenServer, IO, Integer, Keyword, List,
    Logger, Macro, Map, MapSet, Module, NaiveDateTime, Node, OptionParser, Path, Port, Process,
    Protocol, Range, Record, Regex, Registry, Stream, String, StringIO, Supervisor, System, Task,
    Time, Tuple, URI, Version
  ]
  providers:
    - [Kernel, '%builtins']
    - [Bitwise, band, bnot, bor, bsl, bsr, bxor]
    - [
        Enum, 'all?', 'any?', at, chunk_by, chunk_every, concat, count, dedup, drop, each,
        'empty?', fetch, 'fetch!', filter, find, find_index, flat_map, frequencies, group_by, into,
        join, map, max, min, reduce, reject, reverse, sort, sort_by, split, sum, take, to_list,
        uniq, uniq_by, unzip, with_index, zip
      ]
  lookup_from: [__source_root]
  shadows_locals: false
  inline_modules: true

canonicalize:
  - name: imports
    rules:
      - match: '(call target: (identifier "alias") (arguments (dot left: $L:alias right: (tuple $$$M:alias))))'
        replace: '(__import (__source @$L) (__source_path @$L | replace(".", "/")) $$$M->__name)'
        tag: { import_type: Alias }
      - match: '(call target: (identifier "alias") (arguments $A:alias (keywords (pair value: $T:alias))))'
        replace: '(__import (__source @$A | regex_replace("(^|\.)[^.]+$", "")) (__source_path @$A | regex_replace("(^|\.)[^.]+$", "") | replace(".", "/")) (__name @$A | split_last(".") (__alias @$T)))'
        tag: { import_type: Alias }
      - match: '(call target: (identifier "alias") (arguments $A:alias))'
        replace: '(__import (__source @$A | regex_replace("(^|\.)[^.]+$", "")) (__source_path @$A | replace(".", "/")) (__name @$A | split_last(".")))'
        tag: { import_type: Alias }
      - match: '(call target: (identifier "import") (arguments $A:alias $$$R))'
        replace: '(__import (__source @$A) (__source_path @$A | replace(".", "/")) (__name @$A (__ssa_hint "*")))'
        tag: { import_type: Import }
      - match: '(call target: (identifier "require") (arguments $A:alias $$$R))'
        replace: '(__import (__source @$A | regex_replace("(^|\.)[^.]+$", "")) (__source_path @$A | replace(".", "/")) (__name @$A | split_last(".")))'
        tag: { import_type: Require }
      - match: '(call target: (identifier "use") (arguments $A:alias $$$R))'
        replace: '(__import (__source @$A | regex_replace("(^|\.)[^.]+$", "")) (__source_path @$A | replace(".", "/")) (__name @$A | split_last(".")))'
        tag: { import_type: Use }
  - name: defs
    rules:
      - match: '(source $$$C)'
        replace: '%source_file($$$C)'
      - match: '(call target: (identifier "defmodule") (arguments $A:alias) (do_block $$$B))'
        replace: '(__def (__defname @$A) (__class) $$$B)'
      - match: '(call target: (identifier "defprotocol") (arguments $A:alias) (do_block $$$B))'
        replace: '(__def (__defname @$A) (__trait) $$$B)'
      - match: '(call target: (identifier "defimpl") (arguments $A:alias (keywords (pair key: (keyword) value: $T:alias))) (do_block $$$B))'
        replace: '(__def (__defname @$T) (__impl) (__supertype @$A) $$$B)'
      - match: '(call target: (identifier "def") (arguments (call target: $N:identifier $P:arguments)) $B:do_block)'
        replace: '(__def (__defname @$N) (__function) $P $B)'
      - match: '(call target: (identifier "def") (arguments (call target: $N:identifier $P:arguments) $K:keywords))'
        replace: '(__def (__defname @$N) (__function) $P $K)'
      - match: '(call target: (identifier "def") (arguments (binary_operator left: (call target: $N:identifier $P:arguments))) $B:do_block)'
        replace: '(__def (__defname @$N) (__function) $P $B)'
      - match: '(call target: (identifier "defp") (arguments (binary_operator left: (call target: $N:identifier $P:arguments))) $B:do_block)'
        replace: '(__def (__defname @$N) (__function) $P $B)'
      - match: '(call target: (identifier "def") (arguments $N:identifier) $B:do_block)'
        replace: '(__def (__defname @$N) (__function) $B)'
      - match: '(call target: (identifier "def") (arguments $N:identifier $K:keywords))'
        replace: '(__def (__defname @$N) (__function) $K)'
      - match: '(call target: (identifier "defp") (arguments (call target: $N:identifier $P:arguments)) $B:do_block)'
        replace: '(__def (__defname @$N) (__function) $P $B)'
      - match: '(call target: (identifier "defp") (arguments (call target: $N:identifier $P:arguments) $K:keywords))'
        replace: '(__def (__defname @$N) (__function) $P $K)'
      - match: '(call target: (identifier "defp") (arguments $N:identifier) $B:do_block)'
        replace: '(__def (__defname @$N) (__function) $B)'
      - match: '(call target: (identifier "defp") (arguments $N:identifier $K:keywords))'
        replace: '(__def (__defname @$N) (__function) $K)'
      - match: '(call target: (identifier "defmacro") (arguments (call target: $N:identifier $P:arguments)) $B:do_block)'
        replace: '(__def (__defname @$N) (__function) $P $B)'
      - match: '(call target: (identifier "if") $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(call target: (identifier "unless") $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(call target: (identifier "case") $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(call target: (identifier "cond") $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(call target: (identifier "with") $$$X)'
        replace: '(__ssa_branch (__ssa_arm $$$X))'
      - match: '(call target: (identifier "for") $$$X)'
        replace: '%loop($$$X)'
  - name: retag-calls
    rules:
      - match: '(call target: (dot left: $M:alias right: $F:identifier) $A:arguments)'
        replace: '(ex_ref (__import (__source @$M) (__source_path @$M | replace(".", "/")) (__name @$M | split_last("."))) (__call (__callee (__member @$F (__object @$M | split_last(".") $M))) $A))'
        tag_on: __import
        tag: { import_type: Module }
      - match: '(call target: (dot left: $M:identifier right: $F:identifier) $A:arguments)'
        replace: '(__call (__callee %member_text($F, $M)) $A)'
      - match: '(call target: $F:identifier $A:arguments $$$B)'
        replace: '(__call (__callee @$F $F) $A $$$B)'
  - name: lexical-scopes
    rules:
      - match: '(do_block $$$B)'
        replace: '(__scope $$$B)'
        tag: { hoisted: 'true' }
  - name: tag-defs
    rules:
      - match: '(__def (__class))'
        tag:
          declares_type: 'true'
          value: 'true'
          exports: '$ROOT | child_sym("__defname") | split_last(".")'
      - use: function_def_tags
      - match: '(__def (__class))'
        tag: { value: 'true', declares_type: 'true', scoped: 'true', hoisted: 'true' }
      - match: '(__def (__lambda))'
        tag: { callable: 'true' }
      - match: '(__def (__enum_variant))'
        tag: { callable: 'true', value: 'true' }
      - match: '(__def (__struct))'
        tag: { value: 'true', declares_type: 'true', scoped: 'true' }
      - use: trait_def_tags
  - use: tag_file_dir
  - use: resolve_paths

project:
  - name: roots
    rules:
      - match: '(__dir "lib" $$$REST)'
        replace: '(__dir "lib" (__source_root) $$$REST)'
      - match: '(__dir "test" $$$REST)'
        replace: '(__dir "test" (__source_root) $$$REST)'

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          file_path: '@$M'
          language: '@$M | split_last(".") | map("ex:elixir", "exs:elixir")'
      - use: def_fqn_dotted_except_impl
  - use: def_types
  - use: display_imports
