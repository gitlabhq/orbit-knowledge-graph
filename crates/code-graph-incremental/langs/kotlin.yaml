# Kotlin rewrite rules.
# Handles: package, imports (named, aliased, wildcard), classes, interfaces,
# enums, objects, companion objects, extension functions (as __impl wrappers
# named after the receiver type), properties with this.x typing, functions,
# this./super. calls, control flow, bindings.
#
# Known gaps (engine, not rules):
# - Same-package siblings without an import need a package scope.
# - Wildcard imports name a directory; the resolver resolves only files.
# - The DSL cannot see a node's parent, so local `val`/`var` declarations
#   get the same treatment as properties: a __def plus SSA bindings.

config:
  stdlib: [{ module: java, precedence: runtime }, { module: javax }, { module: jdk },
      { module: kotlin, availability: implicit, precedence: runtime, symbols: [
      require, requireNotNull, check, checkNotNull, error,
      TODO, lazy, run, with, repeat, arrayOf, assert, arrayOfNulls,
      booleanArrayOf, byteArrayOf, charArrayOf, doubleArrayOf, floatArrayOf,
      intArrayOf, longArrayOf, shortArrayOf, runCatching,
      synchronized, Pair, Triple, Result, Unit, Any, String, Boolean, Byte,
      Char, Double, Float, Int, Long, Short, Array, BooleanArray, ByteArray,
      CharArray, DoubleArray, FloatArray, IntArray, LongArray, ShortArray
      ] },
      { module: kotlin/io, availability: implicit, symbols: [print, println, readLine,
          readln, readlnOrNull] },
      { module: kotlin/collections, availability: implicit, symbols: [listOf, setOf,
          mapOf, mutableListOf, mutableSetOf, mutableMapOf, emptyList, emptySet,
          emptyMap, setOfNotNull, listOfNotNull, linkedMapOf, linkedSetOf,
          hashMapOf, hashSetOf, buildList, buildMap, buildSet] },
      { module: kotlin/sequences, availability: implicit, symbols: [sequenceOf, emptySequence] },
      { module: kotlin/math, symbols: [abs, acos, acosh, asin, asinh, atan,
          atan2, atanh, cbrt, ceil, cos, cosh, exp, expm1, floor, hypot, ln,
          ln1p, log, log10, log2, max, min, round, sign, sin, sinh, sqrt, tan,
          tanh, truncate] }
    ]
  resolve:
    lookup_from:
      - __source_root

stages:
  - name: imports
    rules:
      - match: '(import_header $I:identifier (import_alias $A:type_identifier))'
        replace: '(__import (__source @$I|regex_replace("\.[^.]+$", "") $I) (__source_path @$I|replace(".", "/")) (__name @$I|split_last(".") (__alias @$A)))'
      - match: '(import_header $I:identifier (wildcard_import))'
        replace: '(__import (__source @$I $I) (__source_path @$I|replace(".", "/")) (__name "*"))'
      - match: '(import_header $I:identifier)'
        replace: '(__import (__source @$I|regex_replace("\.[^.]+$", "") $I) (__source_path @$I|replace(".", "/")) (__name @$I|split_last(".")))'

  - name: attach-getters
    rules:
      - match: '(source_file $$$A $P:property_declaration $G:getter $$$B)'
        replace: '(source_file @$ROOT $$$A $P { $G } $$$B)'
      - match: '(class_body $$$A $P:property_declaration $G:getter $$$B)'
        replace: '(class_body $$$A $P { $G } $$$B)'

  - name: normalize
    rules:
      - match: '(callable_reference $N:simple_identifier)'
        replace: '(__call (__callee @$N))'
      - match: '(source_file $$$C)'
        replace: '(__source_file @$ROOT $$$C)'
      - match: '(package_header $I:identifier)'
        replace: '(kt_pkg (__package @$I $I) (__module_export (__import (__source @$I) (__source_path @$I|replace(".", "/")|regex_replace("$", "/*")) (__name "*"))))'
      - match: '(jump_expression (throw) $$$V)'
        replace: '(__ssa_branch $$$V)'
      - match: '(null_literal)'
        replace: '(__ssa_branch)'
      - match: '(jump_expression (return) $$$V)'
        replace: '(__ssa_return $$$V)'

      - match: '(user_type $A:type_identifier $B:type_identifier $C:type_identifier $D:type_identifier)'
        replace: '$ROOT'
      - match: '(user_type $O:type_identifier $I:type_identifier $T:type_identifier)'
        replace: '(__member @$T (__object (__member @$I (__object @$O $O))))'
      - match: '(user_type $O:type_identifier $T:type_identifier)'
        replace: '(__member @$T (__object @$O $O))'
      - match: '(user_type $T:type_identifier)'
        replace: '(type_identifier @$T)'

      - match: '(annotation (constructor_invocation $T:__member $A:value_arguments))'
        replace: '(__decorator $T $A)'
      - match: '(annotation $T:__member)'
        replace: '(__decorator $T)'
      - match: '(annotation (constructor_invocation $T:type_identifier $A:value_arguments))'
        replace: '(__decorator @$T $A)'
      - match: '(annotation $T:type_identifier)'
        replace: '(__decorator @$T)'

      # this.x → __ivar
      - match: '(navigation_expression (this_expression) (navigation_suffix $N:simple_identifier))'
        replace: '(__ivar @$N $N)'

      # : Base(), : Iface → __supertype
      - match: '(delegation_specifier (constructor_invocation $T:__member $A:value_arguments))'
        replace: '(__supertype $T)'
      - match: '(delegation_specifier $T:__member)'
        replace: '(__supertype $T)'
      - match: '(delegation_specifier (constructor_invocation $T:type_identifier $A:value_arguments))'
        replace: '(__supertype @$T)'
      - match: '(delegation_specifier $T:type_identifier)'
        replace: '(__supertype @$T)'

      # Parameters
      - match: '(class_parameter (binding_pattern_kind) $N:simple_identifier $T:__member)'
        replace: '(kt_prop (__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee $T))))) (__binding @$N (__ssa_typed $T) (__rhs (__call (__type) (__callee $T)))))'
      - match: '(class_parameter (binding_pattern_kind) $N:simple_identifier $T:type_identifier)'
        replace: '(kt_prop (__def (__defname @$N $N) (__property) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T $T))))) (__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T)))))'
      - match: '(class_parameter (binding_pattern_kind) $N:simple_identifier)'
        replace: '(__def (__defname @$N) (__property))'
      - match: '(class_parameter $N:simple_identifier $T:__member)'
        replace: '(__binding @$N (__ssa_typed $T) (__rhs (__call (__type) (__callee $T))))'
      - match: '(class_parameter $N:simple_identifier $T:type_identifier)'
        replace: '(__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T $T))))'
      - match: '(class_parameter $N:simple_identifier)'
        replace: '(__binding @$N)'
      - match: '(parameter $N:simple_identifier $T:__member)'
        replace: '(__binding @$N (__ssa_typed $T) (__rhs (__call (__type) (__callee $T))))'
      - match: '(parameter $N:simple_identifier $T:type_identifier)'
        replace: '(__binding @$N $N (__ssa_typed @$T) (__rhs (__member (__object @$T $T))))'
      - match: '(parameter $N:simple_identifier)'
        replace: '(__binding @$N)'
      - match: '(catch_block $N:simple_identifier $T:type_identifier $$$B)'
        replace: '(catch_block (__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T $T)))) $$$B)'

  - name: retag-expressions
    rules:
      - match: '(parenthesized_expression ("(") $E (")"))'
        replace: '$E'
      - match: '(additive_expression $L:simple_identifier ("+") $R)'
        replace: '(__call (__callee (__member "plus" (__object @$L $L))) (__args $R))'
      - match: '(additive_expression $L ("+") $R)'
        replace: '(__call (__callee (__member "plus" (__object $L))) (__args $R))'
      - match: '(navigation_expression $O:__ivar (navigation_suffix $M:simple_identifier))'
        replace: '(__member @$M (__object $O))'
      - match: '(navigation_expression $O:__member (navigation_suffix $M:simple_identifier))'
        replace: '(__member @$M (__object $O))'
      - match: '(navigation_expression $O:__call (navigation_suffix $M:simple_identifier))'
        replace: '(__member @$M (__object $O))'
      - match: '(navigation_expression (super_expression) (navigation_suffix $M:simple_identifier))'
        replace: '(__member @$M (__object (__ivar "super")))'
      - match: '(navigation_expression $O (navigation_suffix $M:simple_identifier))'
        replace: '(__member @$M (__object @$O $O))'

      - match: '(call_expression $F:__ivar (call_suffix $$$A))'
        replace: '(__call (__callee $F) $$$A)'
      - match: '(call_expression $F:__member (call_suffix $$$A))'
        replace: '(__call (__callee $F) $$$A)'
      - match: '(call_expression $F:simple_identifier (call_suffix $$$A))'
        replace: '(__call (__callee @$F $F) $$$A)'
      - match: '(call_expression $F (call_suffix $$$A))'
        replace: '(__call (__callee @$F $F) $$$A)'

  - name: property-receivers
    rules:
      - match: '(__call (__callee $M:(__member (__object $P:__member))) $$$A)'
        replace: '(__call (__callee (__member @$M (__object (__call (__property) (__callee $P))))) $$$A)'

  - name: classify
    rules:
      # val (a, b) = expr: each slot reads the value's positional component
      - match: '(property_declaration (binding_pattern_kind) (multi_variable_declaration $$$V:variable_declaration) $E:__call)'
        replace: '(__destructure (__rhs $E) $$$V->__binding)'
      - match: '(property_declaration (binding_pattern_kind) (multi_variable_declaration $$$V:variable_declaration) $E:simple_identifier)'
        replace: '(__destructure (__rhs @$E $E) $$$V->__binding)'
      - match: '(property_declaration (binding_pattern_kind) $R:type_identifier (variable_declaration $N:simple_identifier) $$$V)'
        replace: '(__def (__defname @$R) (__impl) (__def (__defname @$N) (__property) $$$V))'
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier $T:__member) $G:getter)'
        replace: '(__def (__defname @$N) (__property) (__ssa_return_type $T) $G)'
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier $T?:type_identifier) $G:getter)'
        replace: '(__def (__defname @$N) (__property) (__ssa_return_type? @$T) $G)'
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier $T:__member) $$$V)'
        replace: '(kt_prop (__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee $T))))) (__binding @$N (__declaration) (__ssa_typed $T) (__rhs (__call (__type) (__callee $T)))) $$$V)'
      # Properties and locals: a __def for the graph plus SSA bindings
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier $T:type_identifier) $V:__call)'
        replace: '(kt_prop (__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T $T))))) (__binding @$N (__declaration) (__ssa_typed @$T) (__rhs $V)))'
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier $T:type_identifier))'
        replace: '(kt_prop (__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T $T))))) (__binding @$N (__declaration) (__ssa_typed @$T) (__rhs (__member (__object @$T)))))'
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier) $V:__call)'
        replace: '(kt_prop (__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs $V))) (__binding @$N (__declaration) (__rhs $V)))'
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier) $V:__ssa_branch)'
        replace: '(kt_prop (__def (__defname @$N) (__property)) (__binding @$N (__declaration) (__rhs $V)))'
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier) $V:simple_identifier)'
        replace: '(kt_prop (__def (__defname @$N) (__property)) (__binding @$N (__declaration) (__rhs @$V $V)))'
      - match: '(property_declaration (binding_pattern_kind) (variable_declaration $N:simple_identifier) $$$V)'
        replace: '(kt_prop (__def (__defname @$N) (__property)) (__binding @$N (__declaration) (__rhs $$$V)))'

      # Assignments
      - match: '(assignment (directly_assignable_expression $N:__ivar) $R:__call)'
        replace: '(__binding $N (__rhs $R))'
      - match: '(assignment (directly_assignable_expression $N:__ivar) $R)'
        replace: '(__binding $N (__rhs @$R $R))'
      - match: '(assignment (directly_assignable_expression $N:simple_identifier) $R:__call)'
        replace: '(__binding @$N (__rhs $R))'
      - match: '(assignment (directly_assignable_expression $N:simple_identifier) $R)'
        replace: '(__binding @$N (__rhs @$R $R))'

      # Control flow
      - match: '(if_expression condition: $C consequence: $Q alternative:? $A)'
        replace: '(__ssa_branch $C (__ssa_arm $Q) (__ssa_arm? $A))'
      - match: '(when_expression $S?:when_subject $$$E:when_entry)'
        replace: '(__ssa_branch $S $$$E->__ssa_arm)'
      - match: '(try_expression $B:statements $$$ALTS:catch_block $F?:finally_block)'
        replace: '(__ssa_branch (__ssa_arm $B) $$$ALTS->__ssa_arm $F)'
      - match: '(function_body ("=") $V)'
        replace: '(function_body (__ssa_return $V))'
      - match: '(for_statement $$$C)'
        replace: '(__ssa_loop $$$C)'
      - match: '(while_statement $$$C)'
        replace: '(__ssa_loop $$$C)'
      - match: '(do_while_statement $$$C)'
        replace: '(__ssa_loop $$$C)'

      # Enum entries
      - match: '(enum_entry $N:simple_identifier $$$R)'
        replace: '(__def (__defname @$N) (__enum_variant) $$$R)'

      - match: '(function_declaration $M?:modifiers $N:simple_identifier $P:function_value_parameters $RT:__member $B?:function_body)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type $RT) $M $P $B)'
      # Functions: extension functions become methods of the receiver type
      - match: '(function_declaration $M?:modifiers $R:type_identifier $N:simple_identifier $P:function_value_parameters $RT?:type_identifier $B?:function_body)'
        replace: '(__def (__defname @$R) (__impl) (__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $M (__binding "this" (__ssa_typed @$R)) $P $B))'
      - match: '(function_declaration $M?:modifiers $N:simple_identifier $P:function_value_parameters $RT?:type_identifier $B?:function_body)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $M $P $B)'

      # Class-likes
      - match: '(companion_object $N:type_identifier $B:class_body)'
        replace: '(__def (__defname @$N) (__class) (__impl) $B)'
      - match: '(companion_object $B:class_body)'
        replace: '(__def (__defname "Companion") (__class) (__impl) $B)'
      - match: '(object_declaration $N:type_identifier $$$D:__supertype $B?:class_body)'
        replace: '(__def (__defname @$N) (__class) $$$D $B)'
      - match: '(class_declaration $M?:modifiers (interface) $N:type_identifier $$$D:__supertype $B?:class_body)'
        replace: '(__def (__defname @$N) (__interface) $M $$$D $B)'
      - match: '(class_declaration $M?:modifiers (enum) $N:type_identifier $P?:primary_constructor $$$D:__supertype $B?:enum_class_body)'
        replace: '(__def (__defname @$N) (__enum @$N) $M $P $$$D $B)'
      - match: '(class_declaration $M?:modifiers $N:type_identifier $P?:primary_constructor $S:__supertype $$$D:__supertype $B?:class_body)'
        replace: '(__def (__defname @$N) (__class) $M $P $S $$$D (__binding (__ivar "super") (__rhs (__call @$S->__callee))) $B)'
      - match: '(class_declaration $M?:modifiers $N:type_identifier $P?:primary_constructor $B?:class_body)'
        replace: '(__def (__defname @$N) (__class) $M $P $B)'
      - match: '(secondary_constructor $$$C)'
        replace: '(__def (__defname "constructor") (__method) $$$C)'
      - match: '(type_alias $N:type_identifier)'
        replace: '(__def (__defname @$N) (__type_alias))'
  - name: primary-constructors
    rules:
      - match: '(primary_constructor $$$P)'
        replace: '(kt_ctor (__def (__defname "constructor") (__method)) $$$P)'

  - name: data-components
    rules:
      # A data class destructures by its primary-constructor order
      - match: '(__def $$$A (modifiers (class_modifier "data")) $$$B (kt_ctor $K:__def $$$P) $$$C)'
        replace: '(__def $$$A (modifiers (class_modifier "data")) $$$B $K (__positional $$$P) $$$C)'
  - name: ssa-cleanup
    rules:
      - match: '(statements $$$B)'
        replace: '(__scope $$$B)'
      - match: '(__ssa_return $V:simple_identifier)'
        replace: '(__ssa_return (__rhs @$V $V))'

  - name: tag-defs
    rules:
      - match: '(__def (__property))'
        tag: { callable: "true", value: "true", scoped: "true" }
      - match: '(__def (__function))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__method))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__class))'
        tag: { callable: "true", value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__lambda))'
        tag: { callable: "true" }
      - match: '(__def (__enum_variant))'
        tag: { callable: "true", value: "true" }
      - match: '(__def (__struct))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__impl))'
        tag: { scoped: "true" }
      - match: '(__def (__trait))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__enum))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__interface))'
        tag: { value: "true", declares_type: "true" }

  - name: tag-file-dir
    rules:
      - match: '$M:__source_file'
        tag:
          file_dir: '@$M|regex_replace("[^/]*$", "")|regex_replace("/$", "")'

  - name: resolve-paths
    rules:
      - match: '(__import)'
        tag:
          resolved_source: '@$ROOT|child_sym("__source_path")'
      - match: '(__import (__source_path "^."))'
        tag:
          resolved_source: '@$ROOT|concat("/", "ancestor_tag:file_dir", "child_sym:__source_path")|regex_replace("(^|/)\./", "$1")|regex_loop("[^/]+/\.\./", "")|regex_replace("/$", "")|regex_replace("^/", "")'

resolve:
  stages:
    - name: roots
      rules:
        - match: '(__dir "kotlin" $$$REST)'
          replace: '(__dir "kotlin" (__source_root) $$$REST)'
        - match: '(__dir "src" $$$REST)'
          replace: '(__dir "src" (__source_root) $$$REST)'

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M|child_sym("__package")'
          file_path: '@$M'
          language: '@$M|split_last(".")|map("kt:kotlin", "kts:kotlin")'
          is_test: '@$M|regex_match("(^|/)src/test/|(Test|Tests|Spec)\.kts?$")'
          generated: '@$M|source("2048")|regex_match("(?i)code generated .*do not edit|@generated|<auto-generated|autogenerated by|generated by .*do not (edit|modify)")'
      - match: '(__def (__impl) !(__class))'
        tag:
          entity: Definition
          fqn: '@$ROOT|child_sym("__defname")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
      - match: '(__def !(__impl))'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat(".", "ancestor_tag:fqn", "child_sym:__defname")|keep_last(".", "64", "4096")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
      - match: '(__def (__class) (__impl))'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat(".", "ancestor_tag:fqn", "child_sym:__defname")|keep_last(".", "64", "4096")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: def_type
    rules:
      - match: '(__def (__function))'
        tag: { def_type: Function }
      - match: '(__def (__method))'
        tag: { def_type: Method }
      - match: '(__def (__class))'
        tag: { def_type: Class }
      - match: '(__def (__struct))'
        tag: { def_type: Struct }
      - match: '(__def (__interface))'
        tag: { def_type: Interface }
      - match: '(__def (__enum))'
        tag: { def_type: Enum }
      - match: '(__def (__enum_variant))'
        tag: { def_type: EnumVariant }
      - match: '(__def (__trait))'
        tag: { def_type: Trait }
      - match: '(__def (__impl) !(__class))'
        tag: { def_type: Impl }
      - match: '(__def (__variable))'
        tag: { def_type: Variable }
      - match: '(__def (__constant))'
        tag: { def_type: Constant }
      - match: '(__def (__static_constant))'
        tag: { def_type: Static }
      - match: '(__def (__lambda))'
        tag: { def_type: Lambda }
      - match: '(__def (__field_def))'
        tag: { def_type: Field }
      - match: '(__def (__property))'
        tag: { def_type: Property }
      - match: '(__def (__type_alias))'
        tag: { def_type: TypeAlias }
  - name: kind
    rules:
      - match: '(__def (__class))'
        tag: { kind: Class }
      - match: '(__def (__impl) !(__class))'
        tag: { kind: Impl }
      - match: '(__def (__interface))'
        tag: { kind: Interface }
      - match: '(__def (__enum))'
        tag: { kind: Enum }
      - match: '(__def (__enum_variant))'
        tag: { kind: EnumMember }
      - match: '(__def (__type_alias))'
        tag: { kind: TypeAlias }
      - match: '(__def (__function))'
        tag:
          kind: '@$ROOT|ancestor_tag("kind")|regex_replace("^(?:Class|Interface|Enum|Impl|EnumMember)$", "Method")|regex_replace("^(Method)$|(?s).*", "$1")|default("Function")'
          language_kind: '@$ROOT|ancestor_tag("kind")|map("Impl:Extension")|regex_replace("^(Extension)$|(?s).*", "$1")'
      - match: '(__def (__method))'
        tag: { kind: Constructor }
      - match: '(__def (__function) (__decorator "/^(Test|ParameterizedTest|RepeatedTest)$/"))'
        tag: { kind: Test }
      - match: '(__def (__property))'
        tag:
          is_const: '@$ROOT|source("1024")|top_until("=", "()[]{}<>")|regex_replace("^(?:@(?:\w+:)?(?:\w+\.)*\w+(?:\s*\([^)]*\))?\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")|regex_replace("(?s)\b(?:val|var)\b.*", "")|regex_match("\bconst\b")'
      - match: '(__def (__property))'
        tag:
          kind: '@$ROOT|concat(":", "tag:is_const", "ancestor_tag:kind")|regex_replace("^true(?::.*)?$", "Constant")|regex_replace("^false:(?:Class|Interface|Enum|Impl|EnumMember)$", "Field")|regex_replace("^(Constant|Field)$|(?s).*", "$1")|default("Variable")'
      - match: '(__def (__property))'
        tag:
          language_kind: '@$ROOT|concat(":", "tag:kind", "ancestor_tag:kind")|regex_replace("^(?:Field|Constant):Impl$", "Extension")|regex_replace("^Variable:(?:Function|Method|Constructor|Test)$", "")|regex_replace("^(?:Constant|Field|Variable)(?::.*)?$", "Property")'
  - name: content
    rules:
      - match: '(__def)'
        tag:
          doc_comment: '@$ROOT|source_before("4096")|regex_first("(?s)\A(?:.*/\*\*((?:[^*]|\*+[^*/])*)\*+/\s*\z)?.*\z", "$1")|regex_replace("(?m)^[ \t]*\*+[ \t]?", "")|regex_replace("\{@\w+\s+([^}]*)\}", "$1")|regex_replace("\A\s+", "")|regex_replace("(?s)\n[ \t]*\n.*", "")|regex_replace("(?s)(?:\A|\n)[ \t]*@[a-zA-Z].*", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__class))'
        tag: &type_sig
          signature: '@$ROOT|source("4096")|top_until("\{", "()[]{}<>")|regex_replace("^(?:@(?:\w+:)?(?:\w+\.)*\w+(?:\s*\([^)]*\))?\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__interface))'
        tag: *type_sig
      - match: '(__def (__enum))'
        tag: *type_sig
      - match: '(__def (__enum_variant))'
        tag: *type_sig
      - match: '(__def (__type_alias))'
        tag:
          signature: '@$ROOT|source("2048")|regex_replace("^(?:@(?:\w+:)?(?:\w+\.)*\w+(?:\s*\([^)]*\))?\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__method))'
        tag: &callable_sig
          signature: '@$ROOT|source("4096")|top_until("\{|=", "()[]{}<>")|regex_replace("^(?:@(?:\w+:)?(?:\w+\.)*\w+(?:\s*\([^)]*\))?\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__function))'
        tag: *callable_sig
      - match: '(__def (__property))'
        tag:
          signature: '@$ROOT|source("2048")|top_until("=|\sby\s|\s(?:get|set)\b", "()[]{}<>")|regex_replace("^(?:@(?:\w+:)?(?:\w+\.)*\w+(?:\s*\([^)]*\))?\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def)'
        tag:
          head: '@$ROOT|tag("signature")|regex_replace("(?s)\b(?:fun|val|var|class|interface|object|constructor|typealias)\b.*", "")|regex_replace("(?s)\(.*", "")'
      - match: '(__def)'
        tag:
          vis_kw: '@$ROOT|tag("head")|regex_first("(?s)\A(?:.*?\b(public|protected|private|internal)\b)?.*\z", "$1")'
          modifiers: '@$ROOT|tag("head")|regex_replace("(?s)\b(abstract|final|override|sealed|inline|suspend|external)\b|.", "$1 ")|regex_replace("suspend", "async")|regex_replace("external", "extern")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def)'
        tag:
          visibility: '@$ROOT|concat("|", "tag:vis_kw", "ancestor_tag:kind")|regex_replace("^(public|protected|private|internal)\|.*$", "$1")|regex_replace("^(?:Function|Method|Constructor|Test)$", "none")|regex_replace("^(public|protected|private|internal|none)$|(?s).*", "$1")|default("public")|regex_replace("^none$", "")'
      - match: '(__def (__class))'
        tag:
          language_kind: '@$ROOT|tag("signature")|regex_replace("(?s)\b(?:class|object)\b.*", "")|regex_replace("(?s)\b(data|value|inline|annotation|companion)\b|.", "$1 ")|regex_replace("\s+", " ")|regex_replace("^ | $", "")|regex_replace("^.*\bdata\b.*$", "DataClass")|regex_replace("^.*\b(?:value|inline)\b.*$", "ValueClass")|regex_replace("^.*\bannotation\b.*$", "AnnotationClass")|regex_replace("^.*\bcompanion\b.*$", "Object")'
      - match: '(__def (__class))'
        tag:
          language_kind: '@$ROOT|concat(":", "tag:language_kind", "tag:signature")|regex_replace("(?s)^(DataClass|ValueClass|AnnotationClass|Object):.*", "$1")|regex_replace("(?s)^(?:[^:]*\s)?object\b.*", "Object")|regex_replace("^(DataClass|ValueClass|AnnotationClass|Object)$|(?s).*", "$1")'
      - match: '(__def (__class))'
        tag:
          class_final: '@$ROOT|concat(" ", "tag:head", "tag:language_kind")|default("class")|regex_replace("(?s).*\b(?:open|abstract|sealed|Object)\b.*", "")|regex_replace("(?s).+", "final")'
      - match: '(__def (__class))'
        tag:
          modifiers: '@$ROOT|concat(" ", "tag:modifiers", "tag:class_final")'
      - match: '(__def (__method))'
        tag: &params
          parameters: '@$ROOT|tag("signature")|top_after("\(", "()[]{}<>")|top_until("\)", "()[]{}<>")|regex_replace("\s+", " ")|top_split(",", "()[]{}<>")'
          return_type: '@$ROOT|tag("signature")|top_after("\(", "()[]{}<>")|top_after("\)", "()[]{}<>")|regex_replace("(?s)\s+where\s.*", "")|regex_first("(?s)\A(?:\s*:\s*(.*\S))?.*\z", "$1")'
      - match: '(__def (__function))'
        tag: *params
      - match: '(__def (__method))'
        tag: { return_type: '' }
      - match: '(__def (__property))'
        tag:
          declared_type: '@$ROOT|tag("signature")|top_after(":", "()[]{}<>")|regex_replace("^ | $", "")'
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: Import
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name "*")'
        tag:
          import_type: WildcardImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name (__alias))'
        tag:
          import_type: AliasedImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          import_kind: symbol
          fqn: '@$ROOT|concat(".", "ancestor_tag:source_path", "id")'
      - match: '(__name "*")'
        tag: { import_kind: wildcard, fqn: '' }
  - name: language
    rules:
      - match: '(__def)'
        tag:
          language: '@$ROOT|ancestor_tag("language")'
