stages:
  - name: normalize
    rules:
      - match: '(document $$$C)'
        replace: '(__source_file @$ROOT $$$C)'

  - name: classify
    rules:
      - match: '(section $N:heading $K:section_key $$$C)'
        replace: '(__def (__defname @$N) (__section) (__fqn_segment @$K) $$$C)'
      - match: '(front_matter $N:name $K:segment)'
        replace: '(__def (__defname @$N) (__front_matter) (__fqn_segment @$K))'

  - name: tag-defs
    rules:
      - match: '(__def (__section))'
        tag: { scoped: "true", definition_span: "true" }
      - match: '(__def (__front_matter))'
        tag: { definition_span: "true" }

resolve:
  stages: []

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M|stem|split_last("/")'
          file_path: '@$M'
          language: markdown
      - match: '(__def)'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat("#", "ancestor_tag:fqn", "child_sym:__fqn_segment")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: def_type
    rules:
      - match: '(__def (__section))'
        tag: { def_type: Section }
      - match: '(__def (__front_matter))'
        tag: { def_type: FrontMatter }
