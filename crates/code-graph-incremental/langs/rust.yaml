# Rust rewrite rules.
# Handles: use declarations, struct/enum/trait/impl/fn defs,
# method calls, field access, self.x, control flow, bindings.

config:
  link:
    inline_modules: true
    builtins: [
      println, print, eprintln, eprint, format, write, writeln, vec, panic, assert, assert_eq,
      assert_ne, debug_assert, todo, unimplemented, unreachable, matches, dbg, include_str,
      env, concat, stringify, line, file, column, cfg,
      Vec, String, Box, Rc, Arc, Option, Some, None, Result, Ok, Err, Default, Clone, Copy,
      Iterator, IntoIterator, ToString, From, Into, Drop, Send, Sync, Sized, Fn, FnMut, FnOnce,
      drop
    ]
  resolve:
    external: []
    stdlib: [std, core, alloc, proc_macro, test]
    parse_files:
      - name: "Cargo.toml"
        format: toml
    lookup_from:
      - __source_root
      - __crate_root

stages:
  - name: normalize
    rules:
      - match: '(foreign_mod_item body: (declaration_list $$$ITEMS:function_signature_item))'
        replace: '(foreign_declarations $$$ITEMS->foreign_function)'
      - match: '(source_file $$$C)'
        replace: '(__source_file @$ROOT $$$C)'
      - match: '(return_expression $$$VALS)'
        replace: '(__ssa_return $$$VALS)'
      - match: '(_)'
        replace: '(__binding "_")'
      - match: '(macro_invocation macro: (identifier "/^(panic|unreachable|todo|unimplemented)$/") $$$V)'
        replace: '(__ssa_branch $$$V)'

      # size_of::<T>() / Type::method::<T>(): the turbofish is not part of the name
      - match: '(generic_function function: $F)'
        replace: '$F'

      # match_arm → __ssa_arm (keep only the value expression)
      - match: '(match_arm value: $V)'
        replace: '(__ssa_arm $V)'

      # self.field → __ivar
      - match: '(field_expression value: (self) field: $F)'
        replace: '(__ivar @$F (__object "self"))'

      # Visibility modifier → __visibility (sym carries the text)
      - match: '(visibility_modifier $$$V)'
        replace: '(__visibility $$$V)'

      # struct/enum heritage via derive macros could go here

  - name: retag-refs
    rules:
      - match: '(field_initializer field: $N value: $V)'
        replace: '(__field @$N (__binding @$ROOT|tree_node_id|prepend("$value:") (__rhs @$V $V)))'
      - match: '(shorthand_field_initializer $N)'
        replace: '(__field @$N (__binding @$ROOT|tree_node_id|prepend("$value:") (__rhs @$N)))'
      - match: '(field_initializer_list $$$F:__field)'
        replace: '(__obj $$$F)'
      - match: '(field_expression value: $O:__ivar field: $F)'
        replace: '(__member @$F (__object $O))'
      - match: '(field_expression value: $O field: $F)'
        replace: '(__member @$F (__object @$O))'

  - name: retag-calls
    rules:
      - match: '(call_expression function: (parenthesized_expression $F:__member) arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: (parenthesized_expression $F:__ivar) arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F:__ivar arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F:__member arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      # Operators desugar to the trait methods they call
      - match: '(binary_expression left: $L operator: $OP right: $R)'
        replace: '(__call (__callee (__member @$OP|kind|map("+:add","-:sub","*:mul","/:div","%:rem","&:bitand","|:bitor","^:bitxor","<<:shl",">>:shr","==:eq","!=:ne","<:lt","<=:le",">:gt",">=:ge") (__object @$L))) $R)'
      - match: '(compound_assignment_expr left: $L operator: $OP right: $R)'
        replace: '(__call (__callee (__member @$OP|kind|map("+=:add_assign","-=:sub_assign","*=:mul_assign","/=:div_assign","%=:rem_assign","&=:bitand_assign","|=:bitor_assign","^=:bitxor_assign","<<=:shl_assign",">>=:shr_assign") (__object @$L))) $R)'
      - match: '(unary_expression $OP $E)'
        replace: '(__call (__callee (__member @$OP|kind|map("-:neg","!:not","*:deref") (__object @$E))))'
      - match: '(index_expression $E $I)'
        replace: '(__call (__callee (__member "index" (__object @$E))) $I)'
      - match: '(try_expression $E)'
        replace: '(__call (__callee (__member "branch" (__object @$E))))'
      - match: '(await_expression $E)'
        replace: '(__call (__callee (__member "poll" (__object @$E))))'
      # Record construction is a call to the struct
      - match: '(struct_expression name: $N body: $B)'
        replace: '(__call (__callee @$N) $B)'
      # `let f = Service::new;` aliases the associated function
      - match: '(let_declaration pattern: $N value: (scoped_identifier path: $P name: $M:(identifier "/^[a-z]/")))'
        replace: '(__binding @$N (__declaration) (__rhs (__member @$M (__object @$P))))'

      # self::f() is the local scope
      - match: '(call_expression function: (scoped_identifier path: (self) name: $N) arguments: $A)'
        replace: '(__call (__callee @$N) $A)'
      # crate::a::f() / super::f() / std::m::f(): a scoped import plus a plain call
      - match: '(call_expression function: (scoped_identifier "/^(crate|super|std|core|alloc)::/" path: $P name: $N) arguments: $A)'
        replace: '(__call (__import (__source @$P) (__source_path @$P|replace("::","/")|regex_replace("^crate(/|$)","")) (__name @$N)) (__callee @$N) $A)'
      - match: '(call_expression function: (scoped_identifier path: (bracketed_type (qualified_type type: $T alias: $Q)) name: $N) arguments: $A)'
        replace: '(__call (__callee (__member @$N (__object @$T $T) (__dispatch @$Q))) $A)'
      # Vec::<u8>::new(): the turbofish is not part of the type name
      - match: '(call_expression function: (scoped_identifier path: (generic_type type: $T) name: $N) arguments: $A)'
        replace: '(__call (__callee (__member @$N (__object @$T))) $A)'
      # Scoped call: Shape::Circle(5.0) → __call with __member callee
      - match: '(call_expression function: (scoped_identifier path: $P name: $N) arguments: $A:(arguments (reference_expression value: $R:identifier)))'
        replace: '(__call (__callee (__member @$N (__object @$P) (__dispatch @$P (__object @$R)))) $A)'
      - match: '(call_expression function: (scoped_identifier path: $P name: $N) arguments: $A)'
        replace: '(__call (__callee (__member @$N (__object @$P))) $A)'
      - match: '(call_expression function: $F arguments: $A)'
        replace: '(__call (__callee @$F) $A)'

  - name: type-params
    rules:
      # `T: Pinger` binds T to its first bound
      - match: '(type_parameter name: $T bounds: (trait_bounds **/$B:type_identifier))'
        replace: '(__binding @$T (__ssa_typed @$B))'

  - name: imports
    rules:
      # mod foo;  (a declaration, the body lives in another file)
      - match: '(mod_item name: $N !(declaration_list))'
        replace: '(__import (__source @$N) (__source_path "self") (__name @$N))'
        tag: { import_type: ModDeclaration }

      # extern crate x [as y];
      - match: '(extern_crate_declaration name: $N alias: $A)'
        replace: '(__import (__source @$N) (__source_path @$N) (__name @$N (__alias @$A)))'
        tag: { import_type: AliasedExternCrate }
      - match: '(extern_crate_declaration name: $N)'
        replace: '(__import (__source @$N) (__source_path @$N) (__name @$N))'
        tag: { import_type: ExternCrate }

      # use a::b::*;  and  pub use a::b::*;
      - match: '(use_declaration (__visibility !(crate)) argument: (use_wildcard $P))'
        replace: '(__import (__source @$P) (__source_path @$P|replace("::","/")|regex_replace("^crate(/|$)","")) (__name "*"))'
        tag: { import_type: ReExportGlob }
      - match: '(use_declaration argument: (use_wildcard $P))'
        replace: '(__import (__source @$P) (__source_path @$P|replace("::","/")|regex_replace("^crate(/|$)","")) (__name "*"))'
        tag: { import_type: GlobUse }

      # use a::b as c;  pub(crate) stays private
      - match: '(use_declaration (__visibility !(crate)) argument: (use_as_clause path: $P alias: $A))'
        replace: '(__import (__source @$P) (__source_path @$P|field("path")|replace("::","/")|regex_replace("^crate(/|$)","")) (__name @$P|or("field:name","id") (__alias @$A)))'
        tag: { import_type: ReExportAliased }
      - match: '(use_declaration argument: (use_as_clause path: $P alias: $A))'
        replace: '(__import (__source @$P) (__source_path @$P|field("path")|replace("::","/")|regex_replace("^crate(/|$)","")) (__name @$P|or("field:name","id") (__alias @$A)))'
        tag: { import_type: AliasedUse }

      # use a::{b, c as d, self};  one import per entry, built in the next stage
      - match: '(use_declaration (__visibility !(crate)) argument: (scoped_use_list path: $P list: (use_list $$$E)))'
        replace: '(use_group (__source @$P) (__source_path @$P|replace("::","/")|regex_replace("^crate(/|$)","")) $$$E:_*_named->pub_use_entry)'
      - match: '(use_declaration argument: (scoped_use_list path: $P list: (use_list $$$E)))'
        replace: '(use_group (__source @$P) (__source_path @$P|replace("::","/")|regex_replace("^crate(/|$)","")) $$$E:_*_named->use_entry)'

      # use crate::foo::Bar;
      - match: '(use_declaration (__visibility !(crate)) argument: $A:scoped_identifier)'
        replace: '(__import (__source @$A) (__source_path @$A|field("path")|replace("::","/")|regex_replace("^crate(/|$)","")) (__name @$A|field("name")))'
        tag: { import_type: PubUse }
      - match: '(use_declaration argument: $A:scoped_identifier)'
        replace: '(__import (__source @$A) (__source_path @$A|field("path")|replace("::","/")|regex_replace("^crate(/|$)","")) (__name @$A|field("name")))'
        tag: { import_type: Use }

      # use foo;
      - match: '(use_declaration argument: $A:identifier)'
        replace: '(__import (__source @$A) (__source_path "") (__name @$A))'
        tag: { import_type: Use }

  - name: import-entries
    rules:
      - match: '(use_entry path: (self) alias: $A)'
        replace: '(__import (__source @$ROOT|ancestor_sym("__source")) (__source_path @$ROOT|ancestor_sym("__source_path")|regex_replace("/?[^/]*$","")) (__name @$ROOT|ancestor_sym("__source")|split_last("::") (__alias @$A)))'
        tag: { import_type: UseGroup }
      - match: '(pub_use_entry path: (self) alias: $A)'
        replace: '(__import (__source @$ROOT|ancestor_sym("__source")) (__source_path @$ROOT|ancestor_sym("__source_path")|regex_replace("/?[^/]*$","")) (__name @$ROOT|ancestor_sym("__source")|split_last("::") (__alias @$A)))'
        tag: { import_type: PubUseGroup }
      - match: '(use_entry "self")'
        replace: '(__import (__source @$ROOT|ancestor_sym("__source")) (__source_path @$ROOT|ancestor_sym("__source_path")|regex_replace("/?[^/]*$","")) (__name @$ROOT|ancestor_sym("__source")|split_last("::")))'
        tag: { import_type: UseGroup }
      - match: '(pub_use_entry "self")'
        replace: '(__import (__source @$ROOT|ancestor_sym("__source")) (__source_path @$ROOT|ancestor_sym("__source_path")|regex_replace("/?[^/]*$","")) (__name @$ROOT|ancestor_sym("__source")|split_last("::")))'
        tag: { import_type: PubUseGroup }
      - match: '(use_entry path: $N alias: $A)'
        replace: '(__import (__source @$ROOT|concat("::", "ancestor_sym:__source", "field:path")) (__source_path @$ROOT|ancestor_sym("__source_path")) (__name @$N (__alias @$A)))'
        tag: { import_type: UseGroup }
      - match: '(pub_use_entry path: $N alias: $A)'
        replace: '(__import (__source @$ROOT|concat("::", "ancestor_sym:__source", "field:path")) (__source_path @$ROOT|ancestor_sym("__source_path")) (__name @$N (__alias @$A)))'
        tag: { import_type: PubUseGroup }
      - match: '(use_entry)'
        replace: '(__import (__source @$ROOT|concat("::", "ancestor_sym:__source", "id")) (__source_path @$ROOT|ancestor_sym("__source_path")) (__name @$ROOT))'
        tag: { import_type: UseGroup }
      - match: '(pub_use_entry)'
        replace: '(__import (__source @$ROOT|concat("::", "ancestor_sym:__source", "id")) (__source_path @$ROOT|ancestor_sym("__source_path")) (__name @$ROOT))'
        tag: { import_type: PubUseGroup }
      - match: '(use_group $$$I:__import)'
        replace: '$$$I'

  - name: patterns
    rules:
      - match: '(tuple_struct_pattern type: $T !(remaining_field_pattern) $$$P:_*_named)'
        replace: '(unpack_pattern (__object @$ROOT|tree_node_id|prepend("$binding:")) (unpack_positions $$$P:_*_named->unpack_position))'
      - match: '(tuple_pattern !(remaining_field_pattern) $$$P:_*_named)'
        replace: '(unpack_pattern (__object @$ROOT|tree_node_id|prepend("$binding:")) (unpack_positions $$$P:_*_named->unpack_position))'
      - match: '(field_pattern name: $N pattern: $P:unpack_pattern)'
        replace: '(unpack_field (__name @$N) $P)'
      - match: '(field_pattern name: $N pattern: $P)'
        replace: '(unpack_field @$P (__name @$N))'
      - match: '(field_pattern name: $N)'
        replace: '(unpack_field @$N (__name @$N))'
      - match: '(struct_pattern $$$P:unpack_field)'
        replace: '(unpack_pattern (__object @$ROOT|tree_node_id|prepend("$binding:")) $$$P)'

  - name: classify
    rules:
      - match: '(let_declaration pattern: $P:unpack_pattern value: $V)'
        replace: '(unpack (__binding @$P|child_sym("__object") (__rhs @$V $V)) $P)'
      - match: '(tuple_expression $$$V:_*_named)'
        replace: '(__obj $$$V:_*_named->tuple_value)'
      # Preserve subtree when RHS contains canonical structure
      - match: '(let_declaration pattern: $N value: $V:__ssa_branch)'
        replace: '(__binding @$N (__declaration) (__rhs $V))'
      - match: '(let_declaration pattern: $N value: $V:block)'
        replace: '(__binding @$N (__declaration) (__rhs $V))'
      - match: '(let_declaration pattern: $N value: $V:__call)'
        replace: '(__binding @$N (__declaration) (__rhs $V))'
      - match: '(let_declaration pattern: $N value: $V:__member)'
        replace: '(__binding @$N (__declaration) (__rhs $V))'
      - match: '(let_declaration pattern: $N value: $V:__obj)'
        replace: '(__binding @$N (__declaration) (__rhs $V))'
      - match: '(let_declaration pattern: $N value: $V)'
        replace: '(__binding @$N (__declaration) (__rhs @$V))'
      - match: '(let_declaration pattern: $N)'
        replace: '(__binding @$N (__declaration))'
      # Reassignment
      - match: '(assignment_expression left: $N right: $R:__obj)'
        replace: '(__binding @$N (__rhs $R))'
      - match: '(assignment_expression left: $N:__ivar right: $R)'
        replace: '(__binding $N (__rhs @$R) $R)'
      - match: '(assignment_expression left: $N right: $R:__call)'
        replace: '(__binding @$N (__rhs $R))'
      - match: '(assignment_expression left: $N:__member right: $R)'
        replace: '(__binding $N (__rhs @$R) $R)'
      - match: '(assignment_expression left: $N right: $R)'
        replace: '(__binding @$N (__rhs @$R))'
      - match: '(const_item name: $N)'
        replace: '(__def (__defname @$N) (__constant))'
      - match: '(static_item name: $N)'
        replace: '(__def (__defname @$N) (__static_constant))'
      - match: '(macro_definition name: $N)'
        replace: '(__def (__defname @$N) (__macro))'
      - match: '(associated_type name: $N)'
        replace: '(__def (__defname @$N) (__type_alias))'
      - match: '(type_item name: $N type: $T)'
        replace: '(__def (__defname @$N) (__type_alias) (__ssa_typed @$T))'
      - match: '(type_item name: $N)'
        replace: '(__def (__defname @$N) (__type_alias))'

      # Control flow
      - match: '(if_expression condition: $COND consequence: $C alternative:? $A)'
        replace: '(__ssa_branch $COND (__ssa_arm $C) (__ssa_arm? $A))'
      - match: '(match_expression value: $V body: (match_block $$$ARMS:__ssa_arm))'
        replace: '(__ssa_branch $V $$$ARMS)'
      - match: '(for_expression body: $B)'
        replace: '(__ssa_loop $B)'
      - match: '(while_expression body: $B)'
        replace: '(__ssa_loop $B)'
      - match: '(loop_expression body: $B)'
        replace: '(__ssa_loop $B)'

      # Parameters become typed bindings; the type is the bare type name
      - match: '(parameter pattern: (mut_pattern $N) type: $T)'
        replace: '(parameter (identifier @$N) $T)'
      - match: '(parameter pattern: $N type: (reference_type type: (generic_type type: $T)))'
        replace: '(__binding @$N (__ssa_typed @$T))'
      - match: '(parameter pattern: $N type: (reference_type type: $T))'
        replace: '(__binding @$N (__ssa_typed @$T))'
      - match: '(parameter pattern: $N type: (generic_type type: $T))'
        replace: '(__binding @$N (__ssa_typed @$T))'
      - match: '(parameter pattern: $N:identifier type: $T)'
        replace: '(__binding @$N (__ssa_typed @$T))'
      - match: '(parameter pattern: $N:identifier)'
        replace: '(__binding @$N)'

      # Trait method signatures (no body) — self variant first
      - match: '(function_signature_item name: $N **/(self_parameter) parameters: (parameters $$$P:__binding) return_type:? $R)'
        replace: '(__def (__defname @$N) (__method) (__declaration) (__ssa_return_type? @$R) $$$P)'
        tag: { flavor: self_method }
      - match: '(function_signature_item name: $N parameters: (parameters $$$P:__binding) return_type:? $R)'
        replace: '(__def (__defname @$N) (__function) (__declaration) (__ssa_return_type? @$R) $$$P)'

      # Functions — self variant first, then generic
      - match: '(function_item name: $N type_parameters:? (type_parameters $$$TP) **/(self_parameter) parameters: (parameters $$$P:__binding) return_type:? $R body: $B $$$ANN:__visibility)'
        replace: '(__def (__defname @$N) (__method) (__ssa_return_type? @$R) $$$ANN $$$TP $$$P $B)'
        tag: { flavor: self_method }
      - match: '(function_item name: $N type_parameters:? (type_parameters $$$TP) parameters: (parameters $$$P:__binding) return_type:? $R body: $B $$$ANN:__visibility)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$R) $$$ANN $$$TP $$$P $B)'

      # Fields: named ones by name, tuple ones by position
      - match: '(field_declaration name: $N)'
        replace: '(__def (__defname @$N) (__field_def))'
      - match: '(ordered_field_declaration_list $$$T:primitive_type|type_identifier|generic_type|reference_type|scoped_type_identifier|tuple_type|array_type|pointer_type|dynamic_type|function_type|unit_type)'
        replace: '(ordered_field_declaration_list $$$T->tuple_field)'

      # Containers (after functions)
      - match: '(struct_item name: $N !(field_declaration_list) !(ordered_field_declaration_list))'
        replace: '(__def (__defname @$N) (__struct) (__binding (__rhs (__call (__callee @$N)))))'
      - match: '(struct_item name: $N body:? $B)'
        replace: '(__def (__defname @$N) (__struct) $B)'
      - match: '(union_item name: $N body: $B)'
        replace: '(__def (__defname @$N) (__struct) $B)'
        tag: { flavor: union }
      # Inline modules: a scope in the FQN, exported as a Module definition
      - match: '(mod_item name: $N body: $B)'
        replace: '(__def (__defname @$N) (__class) $B)'
        tag: { flavor: module }
      - match: '(enum_variant name: $N body: $B:ordered_field_declaration_list)'
        replace: '(__def (__defname @$N) (__enum_variant) $B)'
      - match: '(enum_variant name: $N body: $B)'
        replace: '(__def (__defname @$N) (__enum_variant) $B)'
      - match: '(enum_variant name: $N)'
        replace: '(__def (__defname @$N) (__enum_variant))'
      - match: '(enum_item name: $N body: $B)'
        replace: '(__def (__defname @$N) (__enum) $B)'
      - match: '(trait_item name: $N bounds: (trait_bounds $$$SUPERS:type_identifier|scoped_type_identifier) body: $B)'
        replace: '(__def (__defname @$N) (__trait) $$$SUPERS=>__supertype $B)'
      - match: '(trait_item name: $N body: $B)'
        replace: '(__def (__defname @$N) (__trait) $B)'
      # Blanket impl: impl<T> Trait for T — type matches type param, skip defname
      - match: '(impl_item **/(type_parameter $TP) trait: $T type: $TY body: $B)'
        where: '$TY == $TP'
        replace: '(__def (__impl) (__supertype @$T) $B)'
      # impl Deref for Wrapper { type Target = Service; }: autoderef gives Wrapper Service's methods
      - match: '(impl_item trait: $T:(type_identifier "Deref") type: $TY body: $B **/(__def (__defname "Target") (__type_alias) $TG:__ssa_typed))'
        replace: '(__def (__defname @$TY) (__impl) (__alias "Self") (__supertype @$T) (__supertype @$TG) $B)'
      - match: '(impl_item trait: $T:(scoped_type_identifier name: (type_identifier "Deref")) type: $TY body: $B **/(__def (__defname "Target") (__type_alias) $TG:__ssa_typed))'
        replace: '(__def (__defname @$TY) (__impl) (__alias "Self") (__supertype @$T) (__supertype @$TG) $B)'
      # Generic impl: impl<T> Trait for Wrapper<T>
      - match: '(impl_item trait: $T type: (generic_type type: $TY) body: $B)'
        replace: '(__def (__defname @$TY) (__impl) (__alias "Self") (__supertype @$T) $B)'
      - match: '(impl_item trait: $T type: $TY body: $B)'
        replace: '(__def (__defname @$TY) (__impl) (__alias "Self") (__supertype @$T) $B)'
      - match: '(impl_item type: (generic_type type: $T) body: $B)'
        replace: '(__def (__defname @$T) (__impl) (__alias "Self") $B)'
      - match: '(impl_item type: $T body: $B)'
        replace: '(__def (__defname @$T) (__impl) (__alias "Self") $B)'

  - name: scoped-supertypes
    rules:
      - match: '(__object $T:scoped_type_identifier)'
        replace: '(__object (__member @$T|field("name") (__object @$T|field("path"))))'
      # `impl zoo::traits::Audible for X` / `trait Bark: crate::traits::Audible`:
      # a path in supertype position is a scoped import of its last segment
      - match: '(__supertype "/::/")'
        replace: '(__supertype @$ROOT|split_last("::") (__import (__source @$ROOT|regex_replace("::[^:]*$","")) (__source_path @$ROOT|regex_replace("::[^:]*$","")|replace("::","/")|regex_replace("^crate(/|$)","")) (__name @$ROOT|split_last("::"))))'

  - name: tuple-fields
    rules:
      - match: '(unpack_position $O:__object $$$P)'
        replace: '(unpack_field (__name @$ROOT|sibling_index) (unpack_pattern $O $$$P))'
      - match: '(unpack_position $N:identifier)'
        replace: '(unpack_field @$N (__name @$ROOT|sibling_index))'
      - match: '(unpack_position)'
        replace: '(unpack_field @$ROOT (__name @$ROOT|sibling_index))'
      - match: '(tuple_field)'
        replace: '(__def (__defname @$ROOT|sibling_index) (__field_def))'

  - name: ssa-cleanup
    rules:
      - match: '(unpack_field $N:__name $P:unpack_pattern)'
        replace: '(unpack (__binding @$P|child_sym("__object") (__rhs (__member @$N (__object @$ROOT|ancestor_sym("__object"))))) $P)'
      - match: '(unpack_field $N:__name)'
        replace: '(__binding @$ROOT (__declaration) (__rhs (__member @$N (__object @$ROOT|ancestor_sym("__object")))))'
      - match: '(arguments $$$V:_*_named)'
        replace: '(__args $$$V:_*_named->tuple_value)'

  - name: positional-fields
    rules:
      - match: '(tuple_value $F:__field $$$REST:__field)'
        replace: '(__field @$ROOT|sibling_index (__binding @$ROOT|tree_node_id|prepend("$value:") (__rhs (__obj $F $$$REST))))'
      - match: '(tuple_value $C:__callee $$$REST)'
        replace: '(__field @$ROOT|sibling_index (__binding @$ROOT|tree_node_id|prepend("$value:") (__rhs (__call $C $$$REST))))'
      - match: '(tuple_value)'
        replace: '(__field @$ROOT|sibling_index (__binding @$ROOT|tree_node_id|prepend("$value:") (__rhs @$ROOT $ROOT)))'
      - match: '(__ssa_return $V:identifier)'
        replace: '(__ssa_return (__rhs @$V))'
      - match: '(__ssa_arm $V:identifier)'
        replace: '(__ssa_arm (__rhs @$V))'
      - match: '(__ssa_arm (block $V:identifier))'
        replace: '(__ssa_arm (__rhs @$V))'
      - match: '(__ssa_arm (else_clause (block $V:identifier)))'
        replace: '(__ssa_arm (__rhs @$V))'
      - match: '(__ssa_arm (else_clause $V:block))'
        replace: '(__ssa_arm $V)'

  - name: lexical-scopes
    rules:
      - match: '(block $$$V)'
        replace: '(__scope $$$V)'
        tag: { hoisted: "true" }

  - name: tag-defs
    rules:
      - match: '(__def (__function))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__method))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__class))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__lambda))'
        tag: { callable: "true" }
      - match: '(__def (__enum_variant))'
        tag: { callable: "true" }
      - match: '(__def (__struct))'
        tag: { callable: "true", scoped: "true" }
      - match: '(__def (__impl))'
        tag: { scoped: "true" }
      - match: '(__def (__trait))'
        tag: { scoped: "true" }
      - match: '(__def (__enum))'
        tag: { scoped: "true" }

  - name: tag-module-path
    rules:
      - match: '$M:__source_file'
        tag:
          mod_self: '@$M|regex_replace("\.rs$","")|regex_replace("(^|/)(mod|lib|main)$","")'
      - match: '(__import (__source_path "/^(self|super)(/|$)/"))'
        tag:
          source_rel: '@$ROOT|child_sym("__source_path")|regex_replace("^self(/|$)","./")|regex_loop("super(/|$)","../")'

  - name: resolve-paths
    rules:
      - match: '(__import)'
        tag:
          resolved_source: '@$ROOT|child_sym("__source_path")'
      - match: '(__import (__source_path "/^(self|super)(/|$)/"))'
        tag:
          resolved_source: '@$ROOT|concat("/", "ancestor_tag:mod_self", "tag:source_rel")|regex_replace("(^|/)\./", "$1")|regex_loop("[^/]+/\.\./", "")|regex_replace("/$", "")|regex_replace("^/", "")'

resolve:
  stages:
    - name: crate_roots
      rules:
        - match: '(__dir (__file "Cargo.toml"))'
          append: ['(__crate_root)']
        # A package manifest below the root names its crate; `shared_lib::x` then
        # looks in that crate's src. The root manifest's crate stays unprefixed.
        - match: '(__dir (__file "Cargo.toml" (__obj (__field "package" (__obj $$$B (__field "name" $N:__str))))))'
          tag: { crate: '@$N|replace("-","_")' }
        - match: '(__dir (__file "Cargo.toml" (__obj (__field "package" (__obj $$$B (__field "name" $N:__str))))))'
          append: ['(__alias @$N|replace("-","_") (__str @$ROOT|tree_path("/")|regex_replace("$","/src")|regex_replace("^/","")))']
        - match: '(__dir (__file "lib.rs"))'
          append: ['(__source_root)']
        - match: '(__dir (__file "main.rs"))'
          append: ['(__source_root)']

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          file_path: '@$M'
          language: '@$M|split_last(".")|map("rs:rust")'
          module_path: '@$M|tag("source_root_rel")|regex_replace("\.rs$","")|regex_replace("(^|/)(mod|lib|main)$","")|replace("/","::")'
      - match: '$M:__source_file'
        tag:
          fqn: '@$M|concat("::", "tag:crate", "tag:module_path")'

      - match: '(__def)'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat("::", "ancestor_tag:fqn", "child_sym:__defname")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: def_type
    rules:
      - match: '(__def (__function))'
        tag: { def_type: Function }
      - match: '(__def (__method))'
        tag: { def_type: Method }
      - match: '(__def (__class))'
        tag: { def_type: '@$ROOT|tag("flavor")|map("module:Module")|default("Class")' }
      - match: '(__def (__struct))'
        tag: { def_type: '@$ROOT|tag("flavor")|map("union:Union")|default("Struct")' }
      - match: '(__def (__interface))'
        tag: { def_type: Interface }
      - match: '(__def (__enum))'
        tag: { def_type: Enum }
      - match: '(__def (__enum_variant))'
        tag: { def_type: Variant }
      - match: '(__def (__trait))'
        tag: { def_type: Trait }
      - match: '(__def (__impl))'
        tag: { def_type: Impl }
      - match: '(__def (__variable))'
        tag: { def_type: Variable }
      - match: '(__def (__constant))'
        tag: { def_type: Constant }
      - match: '(__def (__static_constant))'
        tag: { def_type: Static }
      - match: '(__def (__lambda))'
        tag: { def_type: Lambda }
      - match: '(__def (__macro))'
        tag: { def_type: Macro }
      - match: '(__def (__field_def))'
        tag: { def_type: Field }
      - match: '(__def (__property))'
        tag: { def_type: Property }
      - match: '(__def (__type_alias))'
        tag: { def_type: TypeAlias }
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: ImportedSymbol
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
