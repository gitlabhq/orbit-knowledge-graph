# Scala rewrite rules.
# Handles: package, imports (named, selectors, renamed, wildcard), classes,
# case classes, traits, objects, defs, vals, class parameters with this.x
# typing, new, member and this-calls, control flow.

config:
  stdlib: [{ module: java, precedence: runtime }, { module: scala }, { module: javax }, { module: jdk },
      { module: scala/Predef, availability: implicit, symbols: [assert, assume, classOf,
          identity, implicitly, locally, print, printf, println, require,
          summon, synchronized, valueOf] },
      { module: scala/math, symbols: [abs, acos, asin, atan, atan2, cbrt, ceil,
          cos, cosh, exp, expm1, floor, hypot, log, log10, log1p, max, min,
          pow, random, rint, round, signum, sin, sinh, sqrt, tan, tanh,
          toDegrees, toRadians, ulp] }
    ]
  resolve:
    lookup_from:
      - __source_root

stages:
  - name: import-aliases
    rules:
      - match: '(arrow_renamed_identifier name: $N:identifier alias: $A:identifier)'
        replace: '(arrow_renamed_identifier @$N (__alias @$A))'
  - name: import-selectors
    rules:
      - match: '(import_declaration $$$P:identifier (namespace_selectors $$$S:identifier|arrow_renamed_identifier (namespace_wildcard)))'
        replace: '(sc_imports (__import (__source @$ROOT|regex_replace("^import\s+", "")|regex_replace("\.\{.*$", "")) (__source_path @$ROOT|regex_replace("^import\s+", "")|regex_replace("\.\{.*$", "")|replace(".", "/")) $$$S->__name) (__import (__source @$ROOT|regex_replace("^import\s+", "")|regex_replace("\.\{.*$", "")) (__source_path @$ROOT|regex_replace("^import\s+", "")|regex_replace("\.\{.*$", "")|replace(".", "/")) (__name "*")))'
        tag: { import_type: GroupedImport }
        tag_on: __import
      - match: '(import_declaration $$$P:identifier (namespace_selectors $$$S:identifier|arrow_renamed_identifier))'
        replace: '(__import (__source @$ROOT|regex_replace("^import\s+", "")|regex_replace("\.\{.*$", "")) (__source_path @$ROOT|regex_replace("^import\s+", "")|regex_replace("\.\{.*$", "")|replace(".", "/")) $$$S->__name)'
        tag: { import_type: GroupedImport }
  - name: import-wildcards
    rules:
      - match: '(import_declaration $$$P:identifier (namespace_wildcard))'
        replace: '(__import (__source @$ROOT|regex_replace("^import\s+", "")|regex_replace("\._$", "")) (__source_path @$ROOT|regex_replace("^import\s+", "")|regex_replace("\._$", "")|replace(".", "/")) (__name "*"))'
        tag: { import_type: Import }
  - name: import-simple
    rules:
      - match: '(import_declaration $$$P:identifier)'
        replace: '(__import (__source @$ROOT|regex_replace("^import\s+", "")|regex_replace("\.[^.]+$", "")) (__source_path @$ROOT|regex_replace("^import\s+", "")|replace(".", "/")) (__name @$ROOT|split_last(".")))'
        tag: { import_type: Import }

  - name: normalize
    rules:
      - match: '(compilation_unit $$$C)'
        replace: '(__source_file @$ROOT $$$C)'
      - match: '(package_clause name: $N:package_identifier)'
        replace: '(sc_pkg (__package @$N $N) (__module_export (__import (__source @$N) (__source_path @$N|replace(".", "/")|regex_replace("$", "/*")) (__name "*"))))'
        tag: { import_type: Import }
        tag_on: __import
      - match: '(return_expression $$$V)'
        replace: '(__ssa_return $$$V)'
      - match: '(generic_type type: $T:type_identifier)'
        replace: '(type_identifier @$T)'
      - match: '(field_expression value: (this) field: $F:identifier)'
        replace: '(__ivar @$F)'
      - match: '(extends_clause type: $T:type_identifier $$$W:type_identifier)'
        replace: '(extends_clause (__supertype @$T) $$$W=>__supertype)'
      - match: '(class_parameter name: $N:identifier type: $T:type_identifier)'
        replace: '(sc_prop (__def (__defname @$N) (__property) (__binding (__ivar @$N) (__rhs (__call (__type) (__callee @$T $T))))) (__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T)))))'
      - match: '(class_parameter name: $N:identifier)'
        replace: '(__def (__defname @$N) (__property))'
      - match: '(parameter name: $N:identifier type: $T:type_identifier)'
        replace: '(__binding @$N (__ssa_typed @$T) (__rhs (__member (__object @$T $T))))'
      - match: '(parameter name: $N:identifier)'
        replace: '(__binding @$N)'

  - name: retag-refs
    rules:
      - match: '(field_expression value: $O:__ivar field: $F:identifier)'
        replace: '(__member @$F (__object $O))'
      - match: '(field_expression value: $O:__member field: $F:identifier)'
        replace: '(__member @$F (__object $O))'
      - match: '(field_expression value: $O:call_expression field: $F:identifier)'
        replace: '(__member @$F (__object $O))'
      - match: '(field_expression value: $O field: $F:identifier)'
        replace: '(__member @$F (__object @$O $O))'

  - name: retag-calls
    rules:
      - match: '(call_expression function: $F:__ivar arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F:__member arguments: $A)'
        replace: '(__call (__callee $F) $A)'
      - match: '(call_expression function: $F:identifier arguments: $A)'
        replace: '(__call (__callee @$F $F) $A)'
        tag: { implicit_self: "true" }
      - match: '(call_expression function: $F arguments: $A)'
        replace: '(__call (__callee @$F $F) $A)'
      - match: '(instance_expression $T:type_identifier $A:arguments)'
        replace: '(__call (__callee @$T $T) $A)'
      - match: '(instance_expression $T:type_identifier)'
        replace: '(__call (__callee @$T $T))'

  - name: classify
    rules:
      - match: '(postfix_expression $N:identifier (identifier "_"))'
        replace: '(identifier @$N)'
      - match: '(val_definition pattern: $N:identifier type:? $T:type_identifier value: $V:__call)'
        replace: '(sc_val (__def (__defname @$N) (__variable)) (__binding @$N (__declaration) (__ssa_typed? @$T) (__rhs $V)))'
      - match: '(val_definition pattern: $N:identifier type:? $T:type_identifier value: $V:__ssa_branch)'
        replace: '(sc_val (__def (__defname @$N) (__variable)) (__binding @$N (__declaration) (__ssa_typed? @$T) (__rhs $V)))'
      - match: '(val_definition pattern: $N:identifier type:? $T:type_identifier value: $V)'
        replace: '(sc_val (__def (__defname @$N) (__variable)) (__binding @$N (__declaration) (__ssa_typed? @$T) (__rhs @$V $V)))'
      - match: '(var_definition pattern: $N:identifier type:? $T:type_identifier value: $V:__call)'
        replace: '(sc_val (__def (__defname @$N) (__variable)) (__binding @$N (__declaration) (__ssa_typed? @$T) (__rhs $V)))'
      - match: '(var_definition pattern: $N:identifier type:? $T:type_identifier value: $V)'
        replace: '(sc_val (__def (__defname @$N) (__variable)) (__binding @$N (__declaration) (__ssa_typed? @$T) (__rhs @$V $V)))'
      - match: '(assignment_expression left: $N:identifier right: $R:__call)'
        replace: '(__binding @$N (__rhs $R))'
      - match: '(assignment_expression left: $N:identifier right: $R)'
        replace: '(__binding @$N (__rhs @$R $R))'
      - match: '(throw_expression $$$V)'
        replace: '(__ssa_branch $$$V)'
      - match: '(if_expression condition: $C consequence: $Q alternative:? $A)'
        replace: '(__ssa_branch $C (__ssa_arm $Q) (__ssa_arm? $A))'
      - match: '(match_expression value: $V body: (case_block $$$C:case_clause))'
        replace: '(__ssa_branch $V $$$C->__ssa_arm)'
      - match: '(try_expression body: $B $$$ALTS:catch_clause|finally_clause)'
        replace: '(__ssa_branch (__ssa_arm $B) $$$ALTS->__ssa_arm)'
      - match: '(for_expression body: $B)'
        replace: '(__ssa_loop $B)'
      - match: '(while_expression body: $B)'
        replace: '(__ssa_loop $B)'
      - match: '(function_definition $M?:modifiers name: $N:identifier $TP?:type_parameters parameters: $P return_type:? $RT:type_identifier body: $B)'
        replace: '(__def (__defname @$N $N) (__function) (__ssa_return_type? @$RT) $M $P $B)'
      - match: '(function_definition $M?:modifiers name: $N:identifier $TP?:type_parameters return_type:? $RT:type_identifier body: $B)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $M $B)'
      - match: '(function_declaration $M?:modifiers name: $N:identifier parameters:? $P return_type:? $RT:type_identifier)'
        replace: '(__def (__defname @$N) (__function) (__ssa_return_type? @$RT) $M $P)'
      - match: '(class_definition $M?:modifiers name: $N:identifier $$$PRE (extends_clause $S:__supertype $$$W:__supertype) $B?:template_body)'
        replace: '(__def (__defname @$N) (__class) $M $$$PRE $S $$$W (__binding (__ivar "super") (__rhs (__call (__callee @$S)))) $B)'
      - match: '(class_definition $M?:modifiers name: $N:identifier $$$PRE $B?:template_body)'
        replace: '(__def (__defname @$N) (__class) $M $$$PRE $B)'
      - match: '(trait_definition $M?:modifiers name: $N:identifier $$$PRE $B?:template_body)'
        replace: '(__def (__defname @$N) (__trait) $M $$$PRE $B)'
      - match: '(object_definition $M?:modifiers name: $N:identifier $$$PRE (extends_clause $S:__supertype $$$W:__supertype) $B?:template_body)'
        replace: '(__def (__defname @$N) (__class) $M $$$PRE $S $$$W (__binding (__ivar "super") (__rhs (__call (__callee @$S)))) $B)'
      - match: '(object_definition $M?:modifiers name: $N:identifier $$$PRE $B?:template_body)'
        replace: '(__def (__defname @$N) (__class) $M $$$PRE $B)'
      - match: '(enum_definition name: $N:identifier $$$PRE body: $B)'
        replace: '(__def (__defname @$N) (__enum) $$$PRE $B)'
      - match: '(simple_enum_case name: $N:identifier)'
        replace: '(__def (__defname @$N) (__enum_variant))'
      - match: '(full_enum_case name: $N:identifier $$$R)'
        replace: '(__def (__defname @$N) (__enum_variant) $$$R)'
      - match: '(type_definition name: $N:type_identifier)'
        replace: '(__def (__defname @$N) (__type_alias))'
  - name: primary-constructors
    rules:
      - match: '(class_parameters $$$P)'
        replace: '(sc_ctor (__def (__defname "this") (__function)) $$$P)'

  - name: ssa-cleanup
    rules:
      - match: '(block $$$B)'
        replace: '(__scope $$$B)'
        tag: { hoisted: "true" }
      - match: '(__ssa_return $V:identifier)'
        replace: '(__ssa_return (__rhs @$V $V))'

  - name: tag-defs
    rules:
      - match: '(__def (__function))'
        tag: { callable: "true", value: "true", scoped: "true" }
      - match: '(__def (__method))'
        tag: { callable: "true", value: "true", scoped: "true" }
      - match: '(__def (__class))'
        tag: { callable: "true", value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__lambda))'
        tag: { callable: "true" }
      - match: '(__def (__enum_variant))'
        tag: { callable: "true", value: "true" }
      - match: '(__def (__struct))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__impl))'
        tag: { scoped: "true" }
      - match: '(__def (__trait))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__enum))'
        tag: { value: "true", declares_type: "true", scoped: "true" }
      - match: '(__def (__property))'
        tag: { value: "true" }

  - name: tag-file-dir
    rules:
      - match: '$M:__source_file'
        tag:
          file_dir: '@$M|regex_replace("[^/]*$", "")|regex_replace("/$", "")'

  - name: resolve-paths
    rules:
      - match: '(__import)'
        tag:
          resolved_source: '@$ROOT|child_sym("__source_path")'
      - match: '(__import (__source_path "^."))'
        tag:
          resolved_source: '@$ROOT|concat("/", "ancestor_tag:file_dir", "child_sym:__source_path")|regex_replace("(^|/)\./", "$1")|regex_loop("[^/]+/\.\./", "")|regex_replace("/$", "")|regex_replace("^/", "")'

resolve:
  stages:
    - name: roots
      rules:
        - match: '(__dir "scala" $$$REST)'
          replace: '(__dir "scala" (__source_root) $$$REST)'
        - match: '(__dir "src" $$$REST)'
          replace: '(__dir "src" (__source_root) $$$REST)'

display:
  - name: fqn
    rules:
      - match: '$M:__source_file'
        tag:
          entity: File
          fqn: '@$M|child_sym("__package")'
          file_path: '@$M'
          language: '@$M|split_last(".")|map("scala:scala", "sc:scala")'
          is_test: '@$M|regex_match("(^|/)src/test/|(Test|Tests|Spec|Suite)\.scala$")'
          generated: '@$M|source("2048")|regex_match("(?i)code generated .*do not edit|@generated|<auto-generated|autogenerated by|generated by .*do not (edit|modify)")'
      - match: '(__def !(__impl))'
        tag:
          entity: Definition
          fqn: '@$ROOT|concat(".", "ancestor_tag:fqn", "child_sym:__defname")|keep_last(".", "64", "4096")'
          file_path: '@$ROOT|ancestor_tag("file_path")'
      - match: '(__def (__impl))'
        tag:
          entity: Definition
          file_path: '@$ROOT|ancestor_tag("file_path")'
  - name: def_type
    rules:
      - match: '(__def (__function))'
        tag: { def_type: Function }
      - match: '(__def (__method))'
        tag: { def_type: Method }
      - match: '(__def (__class))'
        tag: { def_type: Class }
      - match: '(__def (__struct))'
        tag: { def_type: Struct }
      - match: '(__def (__interface))'
        tag: { def_type: Interface }
      - match: '(__def (__enum))'
        tag: { def_type: Enum }
      - match: '(__def (__enum_variant))'
        tag: { def_type: EnumVariant }
      - match: '(__def (__trait))'
        tag: { def_type: Trait }
      - match: '(__def (__impl))'
        tag: { def_type: Impl }
      - match: '(__def (__variable))'
        tag: { def_type: Variable }
      - match: '(__def (__constant))'
        tag: { def_type: Constant }
      - match: '(__def (__static_constant))'
        tag: { def_type: Static }
      - match: '(__def (__lambda))'
        tag: { def_type: Lambda }
      - match: '(__def (__field_def))'
        tag: { def_type: Field }
      - match: '(__def (__property))'
        tag: { def_type: Property }
      - match: '(__def (__type_alias))'
        tag: { def_type: TypeAlias }
  - name: kind
    rules:
      - match: '(__def (__class))'
        tag: { kind: Class }
      - match: '(__def (__trait))'
        tag: { kind: Trait }
      - match: '(__def (__enum))'
        tag: { kind: Enum }
      - match: '(__def (__enum_variant))'
        tag: { kind: EnumMember }
      - match: '(__def (__type_alias))'
        tag: { kind: TypeAlias }
      - match: '(__def (__function))'
        tag:
          kind: '@$ROOT|ancestor_tag("kind")|regex_replace("^(?:Class|Trait|Enum|EnumMember)$", "Method")|regex_replace("^(Method)$|(?s).*", "$1")|default("Function")'
      - match: '(__def (__defname "this") (__function))'
        tag: { kind: Constructor }
      - match: '(__def (__function))'
        tag:
          annotations: '@$ROOT|source("2048")|regex_first("(?s)\A((?:@(?:\w+\.)*\w+(?:\s*\([^)]*\))*\s*)*).*\z", "$1")'
      - match: '(__def (__function))'
        tag:
          kind: '@$ROOT|concat(":", "tag:kind", "tag:annotations")|regex_replace("(?s)^(?:Function|Method):.*@(?:org\.junit\.(?:jupiter\.api\.)?)?(?:Test|ParameterizedTest|RepeatedTest)\b.*", "Test")|regex_replace("(?s):.*", "")'
      - match: '(__def (__property))'
        tag: &value_kind
          kind: '@$ROOT|ancestor_tag("kind")|regex_replace("^(?:Class|Trait|Enum|EnumMember)$", "Field")|regex_replace("^(Field)$|(?s).*", "$1")|default("Variable")'
      - match: '(__def (__variable))'
        tag: *value_kind
      - match: '(__def (__variable))'
        tag:
          final_val: '@$ROOT|source("1024")|top_until("=", "()[]{}")|regex_match("\bfinal\b[^:=]*\bval\b")'
      - match: '(__def (__variable))'
        tag:
          kind: '@$ROOT|concat(":", "tag:final_val", "tag:kind")|regex_replace("^true:.*$", "Constant")|regex_replace("^false:", "")'
  - name: content
    rules:
      - match: '(__def)'
        tag:
          doc_comment: '@$ROOT|source_before("4096")|regex_first("(?s)\A(?:.*/\*\*((?:[^*]|\*+[^*/])*)\*+/\s*\z)?.*\z", "$1")|regex_replace("(?m)^[ \t]*\*+[ \t]?", "")|regex_replace("\{@\w+\s+([^}]*)\}", "$1")|regex_replace("\[\[([^\]]*)\]\]", "$1")|regex_replace("\A\s+", "")|regex_replace("(?s)\n[ \t]*\n.*", "")|regex_replace("(?s)(?:\A|\n)[ \t]*@[a-zA-Z].*", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__class))'
        tag: &type_sig
          signature: '@$ROOT|source("4096")|top_until("\{", "()[]{}")|regex_replace("^(?:@(?:\w+\.)*\w+(?:\s*\([^)]*\))*\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__trait))'
        tag: *type_sig
      - match: '(__def (__enum))'
        tag: *type_sig
      - match: '(__def (__enum_variant))'
        tag: *type_sig
      - match: '(__def (__type_alias))'
        tag:
          signature: '@$ROOT|source("2048")|regex_replace("^(?:@(?:\w+\.)*\w+(?:\s*\([^)]*\))*\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__function))'
        tag:
          signature: '@$ROOT|source("4096")|top_until("=|\{", "()[]{}")|regex_replace("^(?:@(?:\w+\.)*\w+(?:\s*\([^)]*\))*\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__property))'
        tag: &value_sig
          signature: '@$ROOT|source("2048")|top_until("=", "()[]{}")|regex_replace("^(?:@(?:\w+\.)*\w+(?:\s*\([^)]*\))*\s*)+", "")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def (__variable))'
        tag: *value_sig
      - match: '(__def)'
        tag:
          head: '@$ROOT|tag("signature")|regex_replace("(?s)\b(?:def|val|var|class|trait|object|enum|type)\b.*", "")|regex_replace("(?s)\(.*", "")'
      - match: '(__def)'
        tag:
          vis_kw: '@$ROOT|tag("head")|regex_first("(?s)\A(?:.*?\b(protected|private)\b)?.*\z", "$1")'
          modifiers: '@$ROOT|tag("head")|regex_replace("(?s)\b(abstract|final|override|sealed|inline)\b|.", "$1 ")|regex_replace("\s+", " ")|regex_replace("^ | $", "")'
      - match: '(__def)'
        tag:
          visibility: '@$ROOT|concat("|", "tag:vis_kw", "ancestor_tag:kind")|regex_replace("^(protected|private)\|.*$", "$1")|regex_replace("^(?:Function|Method|Constructor|Test)$", "none")|regex_replace("^(protected|private|none)$|(?s).*", "$1")|default("public")|regex_replace("^none$", "")'
      - match: '(__def (__class))'
        tag:
          language_kind: '@$ROOT|concat(" ", "tag:head", "tag:signature")|regex_replace("(?s)\A(?:[^(]*?\s)?(object)\b.*", "Object")|regex_replace("(?s)\A(?:[^(]*?\s)?case\s+class\b.*", "CaseClass")|regex_replace("^(Object|CaseClass)$|(?s).*", "$1")'
      - match: '(__def (__function))'
        tag:
          parameters: '@$ROOT|tag("signature")|top_after("\(", "()[]{}")|top_until("\)", "()[]{}")|regex_replace("\s+", " ")|top_split(",", "()[]{}")'
          return_type: '@$ROOT|tag("signature")|regex_replace("(?s)\A.*?\bdef\s+[^\s(\[:]+", "")|top_after(":", "()[]{}")|regex_replace("^ | $", "")'
      - match: '(__def (__property))'
        tag: &declared
          declared_type: '@$ROOT|tag("signature")|top_after(":", "()[]{}")|regex_replace("^ | $", "")'
      - match: '(__def (__variable))'
        tag: *declared
  - name: imports
    rules:
      - match: '(__import)'
        tag:
          entity: Import
          file_path: '@$ROOT|ancestor_tag("file_path")'
          source_path: '@$ROOT|child_sym("__source")'
      - match: '(__name "*")'
        tag:
          import_type: WildcardImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name (__alias))'
        tag:
          import_type: AliasedImport
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          resolved: '@$ROOT|has_incoming("Imports")'
      - match: '(__name)'
        tag:
          import_kind: symbol
          fqn: '@$ROOT|concat(".", "ancestor_tag:source_path", "id")'
      - match: '(__name "*")'
        tag: { import_kind: wildcard, fqn: '' }
  - name: language
    rules:
      - match: '(__def)'
        tag:
          language: '@$ROOT|ancestor_tag("language")'
