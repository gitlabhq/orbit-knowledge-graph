link:
  - match: '(__import)'
    enter: [mod.ssa.bind_import($ROOT)]
    children: skip
  - match: '(__import_type)'
    enter: [mod.ssa.bind_import($ROOT)]
    children: skip

  - match: '(__def $N:__defname)'
    when: [$N | named, $ROOT | tagged("scoped")]
    enter:
      - emit: { imports: { from: $N | impl_name, to: $N | impl_name | reference, resolution: reference } }
      - define($ROOT)
      - mod.ssa.bind_import($ROOT | child_all("__supertype") | named | child_all("__import"))
      - inherit($ROOT, $ROOT | child_all("__supertype") | type)
      - mod.ssa.enter_def($ROOT)
    emit:
      defines: { from: enclosing_def, to: $ROOT }
      extends: { from: $ROOT, to: $ROOT | supers }
    children: $ROOT | body
    exit: [mod.ssa.leave()]
  - match: '(__def $N:__defname)'
    when: $N | named
    enter:
      - emit: { imports: { from: $N | impl_name, to: $N | impl_name | reference, resolution: reference } }
      - define($ROOT)
      - mod.ssa.bind_import($ROOT | child_all("__supertype") | named | child_all("__import"))
      - inherit($ROOT, $ROOT | child_all("__supertype") | type)
      - mod.ssa.enter_def($ROOT)
    emit:
      defines: { from: enclosing_def, to: $ROOT }
      extends: { from: $ROOT, to: $ROOT | supers }
    children: $ROOT | child_all("__decorator")
  - match: '(__def)'
    children: skip

  - match: '(__call $C:__callee (__property))'
    when: $C | type | is_class
    enter: [mod.ssa.bind_import($ROOT | child_all("__import"))]
    children: $ROOT | without("__import")
  - match: '(__call (__callee $M:__member))'
    when: $M | child("__dispatch") | lacks("__object")
    enter:
      - mod.ssa.bind_import($ROOT | child_all("__import"))
      - shadow($ROOT)
      - emit: { imports: { from: $M | child("__object"), to: $M | child("__object") | reference, site: $ROOT | binding_site, resolution: reference } }
      - emit: { imports: { from: $M | child("__dispatch"), to: $M | child("__dispatch") | reference, site: $ROOT | binding_site, resolution: reference } }
    children: $ROOT | without("__import")
  - match: '(__call (__callee $M:__member))'
    when: [$M | child("__dispatch") | child("__object"), $M | child("__object") | name | is_contract]
    enter:
      - mod.ssa.bind_import($ROOT | child_all("__import"))
      - shadow($ROOT)
      - emit: { type_flow: { from: enclosing, to: $M | receiver_calls, site: $ROOT, resolve: resolution } }
    children: $ROOT | without("__import")
  - match: '(__call $C:__callee)'
    when: $C | mod.ssa.phi
    enter:
      - mod.ssa.bind_import($ROOT | child_all("__import"))
      - shadow($ROOT)
      - emit:
          type_flow: { from: enclosing, to: $C | member_of | receiver_calls, site: $ROOT, resolve: resolution }
      - mod.ssa.defer($ROOT)
    children: $ROOT | without("__import")
  - match: '(__call (__callee $M:(__member $O:__object)))'
    enter:
      - mod.ssa.bind_import($ROOT | child_all("__import"))
      - shadow($ROOT)
      - shadow($O | value_call)
      - emit: { type_flow: { from: enclosing, to: $M | receiver_calls, site: $ROOT, resolve: resolution } }
      - emit: { calls: { from: enclosing, to: $O | type | member($M), site: $ROOT } }
      - emit:
          calls: { from: enclosing, to: $O | type | unmatched($M) | callable, site: $ROOT }
          imports: { from: enclosing, to: $O | type | unmatched($M) | imported, site: $ROOT, resolve: resolution }
          type_flow: { from: enclosing, to: $O | type | unmatched($M) | produced, site: $ROOT, resolve: resolution }
      - emit: { type_flow: { from: enclosing, to: $O | chain_head | type | typed_calls, site: $ROOT, resolve: resolution } }
      - mod.ssa.defer($ROOT)
    children: $ROOT | without("__import")
  - match: '(__call (__callee (__member)))'
    enter: [mod.ssa.bind_import($ROOT | child_all("__import")), shadow($ROOT)]
    children: $ROOT | without("__import")
  - match: '(__call (__callee $I:__ivar))'
    enter: [mod.ssa.bind_import($ROOT | child_all("__import")), shadow($ROOT)]
    emit: { calls: { from: enclosing, to: 'enclosing | class | members(@$I, $ROOT)', site: $ROOT } }
    children: $ROOT | without("__import")
  - match: '(__call $C:__callee)'
    when: $C | named
    enter: [mod.ssa.bind_import($ROOT | child_all("__import")), shadow($ROOT)]
    emit:
      calls: { from: enclosing, to: $ROOT | callee_targets | callable, site: $ROOT }
      imports: { from: enclosing, to: $ROOT | callee_targets | imported, site: $ROOT, resolve: resolution }
      type_flow: { from: enclosing, to: $ROOT | callee_targets | produced, site: $ROOT, resolve: resolution }
    children: $ROOT | without("__import")
  - match: '(__call)'
    enter: [mod.ssa.bind_import($ROOT | child_all("__import")), shadow($ROOT)]
    children: $ROOT | without("__import")

  - match: '(__supertype)'
    children: $ROOT | without("__import")
  - match: '(__member $O:__object)'
    when: $ROOT | standalone
    enter:
      - emit: { calls: { from: enclosing, to: $O | type | member($ROOT), resolution: reference } }
      - emit:
          calls: { from: enclosing, to: $O | type | unmatched($ROOT) | callable, resolution: reference }
          imports: { from: enclosing, to: $O | type | unmatched($ROOT) | imported, site: $ROOT | binding_site, resolution: reference }
          type_flow: { from: enclosing, to: $O | type | unmatched($ROOT) | produced, resolution: reference, resolve: resolution }

  - match: '(__decorator)'
    emit:
      calls: { from: $ROOT | parent, to: $ROOT | type | is_def }
      imports: { from: $ROOT | parent, to: $ROOT | type | imported, site: $ROOT, resolve: resolution }
    children: '$ROOT | if_true($ROOT | parent | tagged("scoped")) | children'

  - match: '(__binding (__qualifier))'
    enter: [mod.ssa.bind_static($ROOT)]
    children: skip
  - match: '(__binding)'
    when: [$ROOT | parent | is("__destructure"), $ROOT | named]
    enter: [mod.ssa.declare($ROOT), 'mod.ssa.bind($ROOT, $ROOT, $ROOT | rhs_tail)']
    children: skip
  - match: '(__binding)'
    when: $ROOT | parent | is("__destructure")
    children: skip
  - match: '(__binding)'
    when: [$ROOT | mod.ssa.slot, $ROOT | lacks("__rhs"), $ROOT | loop_elements]
    enter:
      - 'mod.ssa.bind($ROOT, $ROOT | loop_elements, $ROOT | rhs_tail)'
      - mod.ssa.declare($ROOT | is_declaration)
    children: skip
  - match: '(__binding)'
    when: [$ROOT | mod.ssa.slot, $ROOT | lacks("__rhs"), $ROOT | child("__declaration") | named]
    enter: ['mod.ssa.bind($ROOT, $ROOT | if_true($ROOT | parent | is("__ssa_loop")) | opaque, $ROOT | rhs_tail)']
    children: skip
  - match: '(__binding)'
    when: [$ROOT | mod.ssa.slot, $ROOT | child("__rhs") | child("__ssa_branch")]
    children: $ROOT | rhs_order
    exit: [mod.ssa.declare($ROOT | is_declaration)]
  - match: '(__binding)'
    when: $ROOT | mod.ssa.slot
    children: $ROOT | rhs_order
    exit:
      - emit:
          imports: { from: enclosing, to: $ROOT | bare_rhs | name | imported, site: $ROOT, resolution: reference }
          calls: { from: enclosing, to: $ROOT | bare_rhs | name | initialized, site: $ROOT }
      - emit:
          type_flow: { from: enclosing, to: '$ROOT | if_true($ROOT | bare_rhs | name | imported)', site: $ROOT, resolve: resolution }
      - >-
        mod.ssa.bind($ROOT,
          or($ROOT | if_true(or($ROOT | child("__ssa_typed"),
                             or($ROOT | bare_rhs | read | imported,
                                $ROOT | rhs_tail | is("__member") | if_true(not($ROOT | rhs_tail | slot))))),
             or($ROOT | rhs_tail | value_of, $ROOT | if_true(not($ROOT | rhs_tail)) | opaque)),
          or($ROOT | rhs_tail | record, $ROOT | rhs_tail))
      - mod.ssa.declare($ROOT | is_declaration)

  - match: '(__scope)'
    enter:
      - define($ROOT | if_true($ROOT | tagged("hoisted")) | child_all("__def"))
      - mod.ssa.enter_scope($ROOT)
    exit: [mod.ssa.leave()]
  - match: '(__lambda)'
    enter: [mod.ssa.fork($ROOT | sink)]
    exit: [mod.ssa.leave()]
  - match: '(__ssa_branch)'
    children: [$ROOT | without("__ssa_arm"), $ROOT | child_all("__ssa_arm")]
    between: [mod.ssa.fork($ROOT | sink)]
    exit: [mod.ssa.leave()]
  - match: '(__ssa_arm)'
    when: $ROOT | parent | is("__ssa_branch")
    exit:
      - >-
        mod.ssa.bind($ROOT | sink | if_true(or($ROOT | tail | value_of | not_opaque,
                                               $ROOT | tail | if_true(not($ROOT | tail | value_of)) | read | not_opaque)),
          $ROOT | tail | value_of | not_opaque,
          or($ROOT | tail | record, $ROOT | tail))
      - mod.ssa.join()
  - match: '(__ssa_loop)'
    children: [$ROOT | loop_head, $ROOT | loop_body]
    between: [mod.ssa.loop_header($ROOT)]
    exit: [mod.ssa.leave()]

