functions:
  producing:
    cases:
      - match: '(__call)'
        value: '$ROOT | callees | returned'
      - value: '$ROOT | type'

  returned:
    cases:
      - when: '$ROOT | returns | is_class'
        value: '$ROOT | returns'
      - value: 'mod.scope.lookup($ROOT, $ROOT | returns)'

dispatch:
  - group: use
    match: '(__call (__callee $M:__member))'
    emit: { calls: { from: enclosing, to: '$ROOT | producers | producing | member($M)', site: $ROOT } }
