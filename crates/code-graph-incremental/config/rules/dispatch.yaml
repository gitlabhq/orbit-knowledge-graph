functions:
  producing:
    cases:
      - match: '(__call)'
        value: '$ROOT | callees | type'
      - value: '$ROOT | type'

dispatch:
  - group: use
    match: '(__call (__callee $M:__member))'
    emit: { calls: { from: enclosing, to: '$ROOT | producers | producing | member($M) | foreign', site: $ROOT } }
