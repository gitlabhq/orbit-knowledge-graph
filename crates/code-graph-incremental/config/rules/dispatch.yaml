functions:
  produced:
    cases:
      - match: '(__call)'
        value: '$ROOT | callees | returns'
      - value: '$ROOT | type'

dispatch:
  - group: use
    match: '(__call (__callee $M:__member))'
    emit: { calls: { from: enclosing, to: '$ROOT | producers | produced | member($M) | foreign', site: $ROOT } }
