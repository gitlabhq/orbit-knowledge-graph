data:
  id_prefix: [project_id, branch]
  dirs: [__dir, __root]
  imports: [__import, __import_type]

tables:
  directory:
    table: gl_directory
    id: { seed: dir, parts: [path] }
    columns: [name, path, traversal_path]
  file:
    table: gl_file
    id: { seed: file, parts: [path] }
    columns: [extension, language, name, path, reason, size_bytes, traversal_path]
  definition:
    table: gl_definition
    id: { seed: def, parts: [file_path, fqn, span] }
    keys: [span]
    columns:
      - definition_type
      - end_byte
      - end_char
      - end_line
      - file_path
      - fqn
      - front_matter_allowed_tools
      - front_matter_category
      - front_matter_compatibility
      - front_matter_description
      - front_matter_group
      - front_matter_info
      - front_matter_license
      - front_matter_metadata
      - front_matter_name
      - front_matter_stage
      - front_matter_title
      - front_matter_version
      - name
      - start_byte
      - start_char
      - start_line
      - traversal_path
  imported_symbol:
    table: gl_imported_symbol
    id: { seed: import, parts: [file_path, import_path, identifier_name, identifier_alias, span] }
    keys: [span]
    columns:
      - end_byte
      - end_char
      - end_line
      - file_path
      - identifier_alias
      - identifier_name
      - import_path
      - import_type
      - start_byte
      - start_char
      - start_line
      - traversal_path
  contains:
    table: gl_edge
    follows: target_id
    columns: [relationship_kind, source_id, source_kind, target_id, target_kind, traversal_path]
  to_definition:
    table: gl_edge
    expect: { target_id: gl_definition }
    columns: [relationship_kind, source_id, source_kind, target_id, target_kind, traversal_path]
  to_imported_symbol:
    table: gl_edge
    expect: { target_id: gl_imported_symbol }
    columns: [relationship_kind, source_id, source_kind, target_id, target_kind, traversal_path]
  to_file:
    table: gl_edge
    expect: { target_id: gl_file }
    columns: [relationship_kind, source_id, source_kind, target_id, target_kind, traversal_path]

define:
  dangling(ROOT):
    '_ when $ROOT | follow(imports, from)': none
    '_': '$ROOT'
  measured(ROOT):
    '(__def #definition_span)': '$ROOT'
    '(__def $N:__defname)': '$N'
    '_': '$ROOT'
  import_of(ROOT):
    '$I:(%imports $ROOT:__name)': '$I'
    '_': '$ROOT'

export:
  entity:
    - '(%dirs)': >-
        row(directory, $ROOT,
          path: $ROOT | tree_path | default("."),
          name: $ROOT | default("."),
          traversal_path: "")
    - '(__source_file)': >-
        row(file, $ROOT,
          path: $ROOT,
          name: $ROOT | split_last("/"),
          extension: $ROOT | split_last("/") | split_last("."),
          language: $ROOT | tag("language"),
          size_bytes: $ROOT | end_byte,
          reason: $ROOT | tag("reason"),
          traversal_path: "")
    - '(__def)': >-
        row(definition, $ROOT,
          file_path: $ROOT | tag_up("file_path"),
          fqn: $ROOT | tag("fqn"),
          name: $ROOT | child_sym("__defname"),
          definition_type: $ROOT | tag("def_type"),
          start_line: $ROOT | measured | start_line,
          end_line: $ROOT | measured | end_line,
          start_byte: $ROOT | measured | start_byte,
          end_byte: $ROOT | measured | end_byte,
          start_char: $ROOT | measured | start_col,
          end_char: $ROOT | measured | end_col,
          front_matter_name: $ROOT | child_sym("__front_matter_name"),
          front_matter_description: $ROOT | child_sym("__front_matter_description"),
          front_matter_license: $ROOT | child_sym("__front_matter_license"),
          front_matter_compatibility: $ROOT | child_sym("__front_matter_compatibility"),
          front_matter_allowed_tools: $ROOT | child_sym("__front_matter_allowed_tools"),
          front_matter_metadata: $ROOT | child_sym("__front_matter_metadata"),
          front_matter_title: $ROOT | child_sym("__front_matter_title"),
          front_matter_stage: $ROOT | child_sym("__front_matter_stage"),
          front_matter_group: $ROOT | child_sym("__front_matter_group"),
          front_matter_info: $ROOT | child_sym("__front_matter_info"),
          front_matter_version: $ROOT | child_sym("__front_matter_version"),
          front_matter_category: $ROOT | child_sym("__front_matter_category"),
          traversal_path: "",
          span: $ROOT | span)
    - '(__module_export (%imports $ROOT:__name))': none
    - '(__module_export $ROOT:%imports)': none
    - '(%imports $ROOT:(__name "/./"))': >-
        row(imported_symbol, $ROOT,
          file_path: $ROOT | import_of | tag_up("file_path"),
          import_type: $ROOT | tag("import_type") | default($ROOT | tag_up("import_type")) | default("NamedImport"),
          import_path: $ROOT | import_of | tag("source_path"),
          identifier_name: $ROOT,
          identifier_alias: $ROOT | ancestor_sym("__alias"),
          start_line: $ROOT | import_of | start_line,
          end_line: $ROOT | import_of | end_line,
          start_byte: $ROOT | import_of | start_byte,
          end_byte: $ROOT | import_of | end_byte,
          start_char: $ROOT | import_of | start_col,
          end_char: $ROOT | import_of | end_col,
          traversal_path: "",
          span: $ROOT | import_of | span)
    - '(%imports !(__name "/./"))': >-
        row(imported_symbol, $ROOT,
          file_path: $ROOT | import_of | tag_up("file_path"),
          import_type: $ROOT | tag("import_type") | default($ROOT | tag_up("import_type")) | default("NamedImport"),
          import_path: $ROOT | import_of | tag("source_path"),
          identifier_name: $ROOT,
          identifier_alias: $ROOT | ancestor_sym("__alias"),
          start_line: $ROOT | import_of | start_line,
          end_line: $ROOT | import_of | end_line,
          start_byte: $ROOT | import_of | start_byte,
          end_byte: $ROOT | import_of | end_byte,
          start_char: $ROOT | import_of | start_col,
          end_char: $ROOT | import_of | end_col,
          traversal_path: "",
          span: $ROOT | import_of | span)
  contains:
    - '$P:(%dirs $ROOT:__dir)': >-
        row(contains, $ROOT, source_id: $P, source_kind: "Directory", relationship_kind: "CONTAINS",
          target_id: $ROOT, target_kind: "Directory", traversal_path: "")
    - '(__source_file)': >-
        row(contains, $ROOT, source_id: $ROOT | file_dir(project), source_kind: "Directory", relationship_kind: "CONTAINS",
          target_id: $ROOT, target_kind: "File", traversal_path: "")
    - '(__def)': >-
        row(contains, $ROOT, source_id: $ROOT | file, source_kind: "File", relationship_kind: "DEFINES",
          target_id: $ROOT, target_kind: "Definition", traversal_path: "")
    - '(__module_export (%imports $ROOT:__name))': none
    - '(__module_export $ROOT:%imports)': none
    - '(%imports $ROOT:(__name "/./"))': >-
        row(contains, $ROOT, source_id: $ROOT | file, source_kind: "File", relationship_kind: "IMPORTS",
          target_id: $ROOT, target_kind: "ImportedSymbol", traversal_path: "")
    - '(%imports !(__name "/./"))': >-
        row(contains, $ROOT, source_id: $ROOT | file, source_kind: "File", relationship_kind: "IMPORTS",
          target_id: $ROOT, target_kind: "ImportedSymbol", traversal_path: "")
  calls:
    - '(__def) --calls--> $T': >-
          row(to_definition, $ROOT, source_id: $ROOT, source_kind: "Definition", relationship_kind: "CALLS",
            target_id: $T, target_kind: "Definition", traversal_path: "")
    - '(__source_file) --calls--> $T': >-
          row(to_definition, $ROOT, source_id: $ROOT, source_kind: "File", relationship_kind: "CALLS",
            target_id: $T, target_kind: "Definition", traversal_path: "")
    - '(__module_export (%imports $ROOT:__name))': none
    - '(__module_export $ROOT:%imports)': none
    - '(%imports $ROOT:(__name "/./")) --calls--> $T': >-
          row(to_definition, $ROOT, source_id: $ROOT, source_kind: "ImportedSymbol", relationship_kind: "CALLS",
            target_id: $T, target_kind: "Definition", traversal_path: "")
    - '(%imports !(__name "/./")) --calls--> $T': >-
          row(to_definition, $ROOT, source_id: $ROOT, source_kind: "ImportedSymbol", relationship_kind: "CALLS",
            target_id: $T, target_kind: "Definition", traversal_path: "")
  defines:
    - '(__def) --defines--> $T': >-
          row(to_definition, $ROOT, source_id: $ROOT, source_kind: "Definition", relationship_kind: "DEFINES",
            target_id: $T, target_kind: "Definition", traversal_path: "")
  extends:
    - '(__def) --extends--> $T': >-
          row(to_definition, $ROOT, source_id: $ROOT, source_kind: "Definition", relationship_kind: "EXTENDS",
            target_id: $T, target_kind: "Definition", traversal_path: "")
  dangling:
    - '(__def) --imports !resolution--> $T': >-
          row(to_imported_symbol, $ROOT, source_id: $ROOT, source_kind: "Definition", relationship_kind: "CALLS",
            target_id: $T | dangling, target_kind: "ImportedSymbol", traversal_path: "")
  links:
    - '(__source_file) --links--> $T':
        - >-
            row(to_file, $ROOT, source_id: $ROOT, source_kind: "File", relationship_kind: "IMPORTS",
              target_id: $T, target_kind: "File", traversal_path: "")
        - >-
            row(to_definition, $ROOT, source_id: $ROOT, source_kind: "File", relationship_kind: "IMPORTS",
              target_id: $T, target_kind: "Definition", traversal_path: "")
  imports:
    - '(__module_export (%imports $ROOT:__name))': none
    - '(__module_export $ROOT:%imports)': none
    - '(%imports $ROOT:(__name "/./")) --imports--> $T': >-
          row(to_definition, $ROOT, source_id: $ROOT, source_kind: "ImportedSymbol", relationship_kind: "IMPORTS",
            target_id: $T, target_kind: "Definition", traversal_path: "")
    - '(%imports !(__name "/./")) --imports--> $T': >-
          row(to_definition, $ROOT, source_id: $ROOT, source_kind: "ImportedSymbol", relationship_kind: "IMPORTS",
            target_id: $T, target_kind: "Definition", traversal_path: "")
