data:
  id_prefix: [project_id, branch]
  dirs: [__dir, __root]
  imports: [__import, __import_type]

define:
  dangling(ROOT):
    '_ when $ROOT | follow(imports)': none
    '_': '$ROOT'
  measured(ROOT):
    '(__def #definition_span)': '$ROOT'
    '(__def $N:__defname)': '$N'
    '_': '$ROOT'
  import_of(ROOT):
    '$I:(%imports $ROOT:__name)': '$I'
    '_': '$ROOT'

export:
  entity:
    - '(%dirs)':
        - {"table": "gl_directory", "id": {"seed": "dir", "parts": ["path"]}, "columns": {"path": "$ROOT | tree_path(\"/\") | default(\".\")", "name": "$ROOT | default(\".\")", "traversal_path": "\"\""}}
    - '(__source_file)':
        - {"table": "gl_file", "id": {"seed": "file", "parts": ["path"]}, "columns": {"path": "$ROOT", "name": "$ROOT | split_last(\"/\")", "extension": "$ROOT | split_last(\"/\") | split_last(\".\")", "language": "$ROOT | tag(\"language\")", "size_bytes": "$ROOT | end_byte", "reason": "$ROOT | tag(\"reason\")", "traversal_path": "\"\""}}
    - '(__def)':
        - {"table": "gl_definition", "id": {"seed": "def", "parts": ["file_path", "fqn", "$ROOT | span"]}, "columns": {"file_path": "$ROOT | ancestor_tag(\"file_path\")", "fqn": "$ROOT | tag(\"fqn\")", "name": "$ROOT | child_sym(\"__defname\")", "definition_type": "$ROOT | tag(\"def_type\")", "start_line": "$ROOT | measured | start_line", "end_line": "$ROOT | measured | end_line", "start_byte": "$ROOT | measured | start_byte", "end_byte": "$ROOT | measured | end_byte", "start_char": "$ROOT | measured | start_col", "end_char": "$ROOT | measured | end_col", "front_matter_name": "$ROOT | child_sym(\"__front_matter_name\")", "front_matter_description": "$ROOT | child_sym(\"__front_matter_description\")", "front_matter_license": "$ROOT | child_sym(\"__front_matter_license\")", "front_matter_compatibility": "$ROOT | child_sym(\"__front_matter_compatibility\")", "front_matter_allowed_tools": "$ROOT | child_sym(\"__front_matter_allowed_tools\")", "front_matter_metadata": "$ROOT | child_sym(\"__front_matter_metadata\")", "front_matter_title": "$ROOT | child_sym(\"__front_matter_title\")", "front_matter_stage": "$ROOT | child_sym(\"__front_matter_stage\")", "front_matter_group": "$ROOT | child_sym(\"__front_matter_group\")", "front_matter_info": "$ROOT | child_sym(\"__front_matter_info\")", "front_matter_version": "$ROOT | child_sym(\"__front_matter_version\")", "front_matter_category": "$ROOT | child_sym(\"__front_matter_category\")", "traversal_path": "\"\""}}
    - '(__module_export (%imports $ROOT:__name))': none
    - '(__module_export $ROOT:%imports)': none
    - '(%imports $ROOT:(__name "/./"))':
        - {"table": "gl_imported_symbol", "id": {"seed": "import", "parts": ["file_path", "import_path", "identifier_name", "identifier_alias", "$ROOT | import_of | span"]}, "columns": {"file_path": "$ROOT | import_of | ancestor_tag(\"file_path\")", "import_type": "$ROOT | tag(\"import_type\") | default($ROOT | ancestor_tag(\"import_type\")) | default(\"NamedImport\")", "import_path": "$ROOT | import_of | tag(\"source_path\")", "identifier_name": "$ROOT", "identifier_alias": "$ROOT | ancestor_sym(\"__alias\")", "start_line": "$ROOT | import_of | start_line", "end_line": "$ROOT | import_of | end_line", "start_byte": "$ROOT | import_of | start_byte", "end_byte": "$ROOT | import_of | end_byte", "start_char": "$ROOT | import_of | start_col", "end_char": "$ROOT | import_of | end_col", "traversal_path": "\"\""}}
    - '(%imports !(__name "/./"))':
        - {"table": "gl_imported_symbol", "id": {"seed": "import", "parts": ["file_path", "import_path", "identifier_name", "identifier_alias", "$ROOT | import_of | span"]}, "columns": {"file_path": "$ROOT | import_of | ancestor_tag(\"file_path\")", "import_type": "$ROOT | tag(\"import_type\") | default($ROOT | ancestor_tag(\"import_type\")) | default(\"NamedImport\")", "import_path": "$ROOT | import_of | tag(\"source_path\")", "identifier_name": "$ROOT", "identifier_alias": "$ROOT | ancestor_sym(\"__alias\")", "start_line": "$ROOT | import_of | start_line", "end_line": "$ROOT | import_of | end_line", "start_byte": "$ROOT | import_of | start_byte", "end_byte": "$ROOT | import_of | end_byte", "start_char": "$ROOT | import_of | start_col", "end_char": "$ROOT | import_of | end_col", "traversal_path": "\"\""}}
  contains:
    - '$P:(%dirs $ROOT:__dir)':
        - {"table": "gl_edge", "follows": "target_id", "columns": {"source_id": "$P", "source_kind": "\"Directory\"", "relationship_kind": "\"CONTAINS\"", "target_id": "$ROOT", "target_kind": "\"Directory\"", "traversal_path": "\"\""}}
    - '(__source_file)':
        - {"table": "gl_edge", "follows": "target_id", "columns": {"source_id": "$ROOT | file_dir", "source_kind": "\"Directory\"", "relationship_kind": "\"CONTAINS\"", "target_id": "$ROOT", "target_kind": "\"File\"", "traversal_path": "\"\""}}
    - '(__def)':
        - {"table": "gl_edge", "follows": "target_id", "columns": {"source_id": "$ROOT | tree_root", "source_kind": "\"File\"", "relationship_kind": "\"DEFINES\"", "target_id": "$ROOT", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
    - '(__module_export (%imports $ROOT:__name))': none
    - '(__module_export $ROOT:%imports)': none
    - '(%imports $ROOT:(__name "/./"))':
        - {"table": "gl_edge", "follows": "target_id", "columns": {"source_id": "$ROOT | tree_root", "source_kind": "\"File\"", "relationship_kind": "\"IMPORTS\"", "target_id": "$ROOT", "target_kind": "\"ImportedSymbol\"", "traversal_path": "\"\""}}
    - '(%imports !(__name "/./"))':
        - {"table": "gl_edge", "follows": "target_id", "columns": {"source_id": "$ROOT | tree_root", "source_kind": "\"File\"", "relationship_kind": "\"IMPORTS\"", "target_id": "$ROOT", "target_kind": "\"ImportedSymbol\"", "traversal_path": "\"\""}}
  graph:
    - '(__def)':
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"Definition\"", "relationship_kind": "\"CALLS\"", "target_id": "$ROOT | out(\"Calls\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"Definition\"", "relationship_kind": "\"DEFINES\"", "target_id": "$ROOT | out(\"Defines\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"Definition\"", "relationship_kind": "\"EXTENDS\"", "target_id": "$ROOT | out(\"Extends\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
        - {"table": "gl_edge", "expect": {"target_id": "gl_imported_symbol"}, "columns": {"source_id": "$ROOT", "source_kind": "\"Definition\"", "relationship_kind": "\"CALLS\"", "target_id": "$ROOT | out_unresolved(\"Imports\") | dangling", "target_kind": "\"ImportedSymbol\"", "traversal_path": "\"\""}}
    - '(__source_file)':
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"File\"", "relationship_kind": "\"CALLS\"", "target_id": "$ROOT | out(\"Calls\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
        - {"table": "gl_edge", "expect": {"target_id": "gl_file"}, "columns": {"source_id": "$ROOT", "source_kind": "\"File\"", "relationship_kind": "\"IMPORTS\"", "target_id": "$ROOT | out(\"Links\")", "target_kind": "\"File\"", "traversal_path": "\"\""}}
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"File\"", "relationship_kind": "\"IMPORTS\"", "target_id": "$ROOT | out(\"Links\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
    - '(__module_export (%imports $ROOT:__name))': none
    - '(__module_export $ROOT:%imports)': none
    - '(%imports $ROOT:(__name "/./"))':
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"ImportedSymbol\"", "relationship_kind": "\"CALLS\"", "target_id": "$ROOT | out(\"Calls\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"ImportedSymbol\"", "relationship_kind": "\"IMPORTS\"", "target_id": "$ROOT | out(\"Imports\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
    - '(%imports !(__name "/./"))':
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"ImportedSymbol\"", "relationship_kind": "\"CALLS\"", "target_id": "$ROOT | out(\"Calls\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
        - {"table": "gl_edge", "expect": {"target_id": "gl_definition"}, "columns": {"source_id": "$ROOT", "source_kind": "\"ImportedSymbol\"", "relationship_kind": "\"IMPORTS\"", "target_id": "$ROOT | out(\"Imports\")", "target_kind": "\"Definition\"", "traversal_path": "\"\""}}
