define:
  site_role(ROOT):
    '$C:(__call $ROOT:__callee)': 'call_role($C)'
    '(__call)': 'call_role($ROOT)'
    '$K:(__callee $ROOT)': 'site_role($K)'
    '_': '"value"'
  call_role(ROOT):
    '(__call (__type))': '"type"'
    '(__call (__property))': '"value"'
    '_': '"callable"'
  lookup(name, site, values): 'values | member_in(name, site_role(site))'
  member_in(ROOT, name, role):
    '(__def)': 'members(nodes($ROOT), name, role)'
    '(__name)': 'plain($ROOT)'
  unmatched(ROOT, m):
    '_ when instances($ROOT)': none
    '(__def) when members($ROOT, m, site_role(m))': none
    '(_)': '$ROOT'
  callable(ROOT):
    '(__def $K:__callable) when instances($ROOT)': 'members(nodes($ROOT), $K, "callable")'
    '_ when instances($ROOT)': 'nodes($ROOT)'
    '(__def) when fills($ROOT, "callable")': 'plain($ROOT)'
  members(owner, name, role): >-
    declared(owner, name, role)
    or other_parts(owner) | declared(name, role)
    or union(owner, other_parts(owner)) | supers | members(name, role)
  other_parts(ROOT): >-
    minus(union(select_all(file($ROOT), '(__def $N:__defname)', $ROOT | child_sym("__defname")),
    select_all(project, '(__def $N:__defname)', $ROOT | child_sym("__defname"))), $ROOT)
    | impl_pair($ROOT)
  impl_pair(ROOT, owner):
    '(__def (__impl))': '$ROOT'
    '_ when owner | is_impl': '$ROOT'
  is_impl(ROOT):
    '(__def (__impl))': '$ROOT'
  supers(ROOT): 'union(supertypes($ROOT) | is_def, follow($ROOT, extends))'
  declared(owner, name, role): >-
    first(member_defs(owner, name) | fills(role), d => single_role(d))
    or first(member_defs(owner, name) | fills(role), d => d)
  member_defs(owner, name): "select_all(owner, '(__def $N:__defname)', name) | belongs(owner)"
  belongs(ROOT, owner):
    '_ when reaches(boundary($ROOT), owner)': '$ROOT'
    '(__def (__binding (__ivar))) when hop(boundary($ROOT), owner)': '$ROOT'
  reaches(ROOT, owner):
    '_ when same($ROOT, owner)': '$ROOT'
    '(__def (__impl))': 'reaches(boundary($ROOT), owner)'
  hop(ROOT, owner):
    '(__def)': 'reaches(boundary($ROOT), owner)'
  boundary(ROOT): 'first(ancestors($ROOT), a => def_or_scope(a))'
  def_or_scope(ROOT):
    '(__def)': '$ROOT'
    '(__scope)': '$ROOT'
  same(a, b): 'minus(a, minus(a, b))'
  fills(ROOT, role):
    '(__def (%callable_kinds)) when eq(role, "callable")': '$ROOT'
    '(__def (%value_kinds)) when eq(role, "value")': '$ROOT'
    '(__def (%type_kinds)) when eq(role, "type")': '$ROOT'
  single_role(ROOT):
    '(__def (%value_kinds)) when $ROOT | fills("callable")': none
    '_': '$ROOT'
  plain(ROOT): 'minus($ROOT, instances($ROOT))'
  named_value(ROOT):
    '(__def)': 'plain($ROOT)'
    '(__name)': 'plain($ROOT)'
  is_def(ROOT):
    '(__def)': 'plain($ROOT)'
  is_class(ROOT):
    '(__def $K:__class|__struct|__impl|__interface|__trait|__enum)': 'plain($ROOT)'
  is_contract(ROOT):
    '(__def $K:__trait|__interface)': 'plain($ROOT)'
  imported(ROOT):
    '(__name)': 'plain($ROOT)'
  produced(ROOT):
    '(__def)': none
    '(__name)': none
    '(_)': 'plain($ROOT)'
  callable_import(ROOT, tag):
    '$I:(_ $ROOT:__name) when $I | tag(tag)': 'plain($ROOT)'
  type(ROOT):
    '(_ (__call (__property) $K:__callee)) when $K | type | is_class': '$K | walk'
    '(_ $C:__call)': '$C'
    '_': '$ROOT | walk'
  walk(ROOT):
    '(_ (__object))': '$ROOT | on_object($ROOT)'
    '(_ $M:__member)': '$M | on_object($ROOT)'
    '_': '$ROOT | named'
  on_object(ROOT, SITE):
    '(_ (__object !(__call) !(__object) !(__qualifier) !(__member) !(__ivar)))': 'on_named($ROOT, $SITE)'
    '(_ $O:__object)': 'lookup($ROOT, $SITE, union($O | type, $O | type | type_node | type))'
  on_named(ROOT, SITE):
    '(_ $O:__object)': 'lookup($ROOT, $SITE, union($O | type, $O | type | type_node | type))'
  named(ROOT):
    '(_ (__qualifier))': '$ROOT | name'
    '(_ $I:__ivar)': '$I | ivar | meaning($ROOT)'
    '_ when $ROOT | read': '$ROOT | name | meaning($ROOT)'
    '_': '$ROOT | ivar | meaning($ROOT)'
  member(ROOT, M):
    '(__def)': 'lookup($M, $M, $ROOT)'
    '(__name)': 'none'
    '_': '$ROOT | type_node | type | member($M)'
  reference(ROOT):
    '$P:(_ $ROOT)': 'minus(unique($ROOT | type), $P) | named_value'
    '_': 'minus(unique($ROOT | type), $ROOT) | named_value'
  source(ROOT):
    '_': '$ROOT | tail | record'
  record(ROOT):
    '(__obj)': '$ROOT'
    '(_ $R:__obj)': '$R'
    '(_ $K:__callee $A:__args) when $K | type | is_class': '$A'
    '_': '$ROOT'
  chain_head(ROOT):
    '(_ (__member $O:__object))': '$O | chain_root'
  chain_root(ROOT):
    '(_ (__member $O:__object))': '$O | chain_root'
    '_': '$ROOT'
  binding_site(ROOT):
    '$P:(_ $ROOT)': '$P | site'
  site(ROOT):
    '(__def)': 'none'
    '(__binding (__rhs !(__ssa_branch) (__member)))': '$ROOT'
    '$P:(_ $ROOT)': '$P | site'
  returns(ROOT):
    '(__def $K:__class|__struct|__impl|__interface|__trait|__enum)': '$ROOT'
    '(__def $T:__ssa_return_type)': '$T | type'
    '(__def **!__def|__lambda/(__ssa_return $B:__ssa_branch))': '$B | branch_type'
    '_': '$ROOT | inferred_return'
  branch_type(ROOT):
    '(_ $$$A:__ssa_arm)': 'lub($A | tail | arm_type)'
  arm_type(ROOT):
    '(__ssa_return)': 'none'
    '(__ssa_branch $$$A:__ssa_arm) when $A': 'known($ROOT | branch_type)'
    '(__ssa_branch)': 'none'
    '(_ $K:__callee)': 'known($K | type)'
    '_': 'opaque'

  visible(name, at): 'declared_in(name, at) or imported_name(name, at)'
  imported_name(name, at): >-
    select_all(file(at), '(__import $ROOT:__name)' by local_name($ROOT), name) | target_of
    or select_all(file(at), '(__import $ROOT:__name)' by $ROOT | written, "*") | follow(imports) | exported(name)
  local_name(ROOT): 'default($ROOT | child_sym("__alias"), default($ROOT | child_sym("__ssa_hint"), $ROOT))'
  declared_in(name, at): >-
    first(enclose(at), s => select(s, '(__def $N:__defname)', name))
  target_of(ROOT): 'declared_in(@ROOT, ROOT) or $ROOT | follow(imports)'
  resolved(ROOT):
    '(__call (__type) $ROOT)': 'declared_in(@ROOT, ROOT) | is_class or imported_name(@ROOT, ROOT)'
    '_': 'visible(@ROOT, ROOT)'
  supertypes(ROOT):
    '(__def $$$S:__supertype)': '$S | type | is_def'
  callable_kinds(at): '%callable_kinds'
  value_kinds(at): '%value_kinds'
  type_kinds(at): '%type_kinds'
