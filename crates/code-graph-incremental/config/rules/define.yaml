  sourced(ROOT, list, listed):
    '$I:(_ $ROOT) when listed': 'listed_import($ROOT, $I, list)'
    '$I:(_ $ROOT)': 'unlisted_import($ROOT, $I, list)'
    '_ when listed': none
    '_': '$ROOT'
  listed_import(ROOT, import, list):
    '_ when in(import | child_sym("__source_path"), list)': '$ROOT'
  unlisted_import(ROOT, import, list):
    '_ when in(import | child_sym("__source_path"), list)': none
