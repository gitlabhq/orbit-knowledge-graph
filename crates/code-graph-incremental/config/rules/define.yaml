  meaning(ROOT, site): 'member_for($ROOT, site) | stored_value'
  stored_value(ROOT):
    '_ when instances($ROOT)': '$ROOT'
    '(__def)': 'field_value($ROOT) or $ROOT'
    '_': '$ROOT'
  field_value(ROOT):
    '(__def $B:__binding) when stored_typed($ROOT, $B)': 'producer($B)'
  stored_typed(ROOT, binding):
    '_ when typed(binding)': 'stored($ROOT)'
  stored(ROOT):
    '(__def (__field_def))': '$ROOT'
    '(__def (__property))': '$ROOT'
  producer(ROOT):
    '(__binding (__ssa_typed))': '$ROOT'
    '(__binding $R:__rhs)': 'rhs_call($R) | member_call or $ROOT'
    '_': '$ROOT'
  member_call(ROOT):
    '(__call (__callee (__member)))': '$ROOT'
  typed(ROOT):
    '(__binding $T:__ssa_typed)': '$T'
    '(__binding $R:__rhs)': 'rhs_call($R) | callee_of or value_member($R)'
  callee_of(ROOT):
    '(__call $K:__callee)': '$K'
  value_member(ROOT):
    '(_ #!labelled $M:__member)': '$M'
