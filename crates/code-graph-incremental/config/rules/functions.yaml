functions:
  type:
    cases:
      - match: '(_ (__call (__property) $K:__callee))'
        when: '$K | type | is_class'
        value: '$K | walk'
      - match: '(_ $C:__call)'
        value: $C
      - value: '$ROOT | walk'

  walk:
    cases:
      - match: '(_ (__object))'
        value: '$ROOT | on_object($ROOT)'
      - match: '(_ $M:__member)'
        value: '$M | on_object($ROOT)'
      - value: '$ROOT | named'

  on_object:
    params: [$SITE]
    cases:
      - match: '(_ $O:__object)'
        value: 'lookup($ROOT, $SITE, $O | type, $O | type | type_node | type)'

  named:
    cases:
      - match: '(_ (__qualifier))'
        value: '$ROOT | name'
      - match: '(_ $I:__ivar)'
        value: '$I | ivar | meaning($ROOT)'
      - when: '$ROOT | read'
        value: '$ROOT | name | meaning($ROOT)'
      - value: '$ROOT | ivar | meaning($ROOT)'

  member:
    params: [$M]
    cases:
      - match: '(__def)'
        value: 'lookup($M, $M, $ROOT)'
      - match: '(__name)'
        value: none
      - value: '$ROOT | type_node | type | member($M)'

  reference:
    cases:
      - match: '$P:(_ $ROOT)'
        value: '$ROOT | type | sole($P)'
      - value: '$ROOT | type | sole($ROOT)'

  source:
    cases:
      - value: '$ROOT | tail | record'

  record:
    cases:
      - match: '(__obj)'
        value: $ROOT
      - match: '(_ $R:__obj)'
        value: $R
      - match: '(_ $K:__callee $A:__args)'
        when: '$K | type | is_class'
        value: $A
      - value: $ROOT

  chain_head:
    cases:
      - match: '(_ (__member $O:__object))'
        value: '$O | chain_root'

  chain_root:
    cases:
      - match: '(_ (__member $O:__object))'
        value: '$O | chain_root'
      - value: $ROOT

  binding_site:
    cases:
      - match: '$P:(_ $ROOT)'
        value: '$P | site'

  site:
    cases:
      - match: '(__def)'
        value: none
      - match: '(__binding (__rhs !(__ssa_branch) (__member)))'
        value: $ROOT
      - match: '$P:(_ $ROOT)'
        value: '$P | site'
