functions:
  type:
    cases:
      - match: '(_ (__call (__property) $K:__callee))'
        when: '$K | type | is_class'
        value: '$K | walk'
      - match: '(_ $C:__call)'
        value: $C
      - value: '$ROOT | walk'

  walk:
    cases:
      - match: '(_ (__object))'
        value: '$ROOT | on_object($ROOT)'
      - match: '(_ $M:__member)'
        value: '$M | on_object($ROOT)'
      - value: '$ROOT | named'

  on_object:
    params: [$SITE]
    cases:
      - match: '(_ (__object !(__call) !(__object) !(__qualifier) !(__member) !(__ivar)))'
        value: 'on_named($ROOT, $SITE)'
      - match: '(_ $O:__object)'
        value: 'lookup($ROOT, $SITE, %callable_kinds, %value_kinds, %type_kinds, $O | type, $O | type | type_node | type)'

  on_named:
    params: [$SITE]
    key: ['$ROOT | child("__object") | sym', '$ROOT | sym', '$SITE | role']
    cases:
      - match: '(_ $O:__object)'
        value: 'lookup($ROOT, $SITE, %callable_kinds, %value_kinds, %type_kinds, $O | type, $O | type | type_node | type)'

  named:
    cases:
      - match: '(_ (__qualifier))'
        value: '$ROOT | name'
      - match: '(_ $I:__ivar)'
        value: '$I | ivar | meaning($ROOT, %callable_kinds, %value_kinds, %type_kinds)'
      - when: '$ROOT | read'
        value: '$ROOT | name | meaning($ROOT, %callable_kinds, %value_kinds, %type_kinds)'
      - value: '$ROOT | ivar | meaning($ROOT, %callable_kinds, %value_kinds, %type_kinds)'

  member:
    params: [$M]
    cases:
      - match: '(__def)'
        value: 'lookup($M, $M, %callable_kinds, %value_kinds, %type_kinds, $ROOT)'
      - match: '(__name)'
        value: none
      - value: '$ROOT | type_node | type | member($M)'

  reference:
    cases:
      - match: '$P:(_ $ROOT)'
        value: '$ROOT | type | sole($P)'
      - value: '$ROOT | type | sole($ROOT)'

  source:
    cases:
      - value: '$ROOT | tail | record'

  record:
    cases:
      - match: '(__obj)'
        value: $ROOT
      - match: '(_ $R:__obj)'
        value: $R
      - match: '(_ $K:__callee $A:__args)'
        when: '$K | type | is_class'
        value: $A
      - value: $ROOT

  chain_head:
    cases:
      - match: '(_ (__member $O:__object))'
        value: '$O | chain_root'

  chain_root:
    cases:
      - match: '(_ (__member $O:__object))'
        value: '$O | chain_root'
      - value: $ROOT

  binding_site:
    cases:
      - match: '$P:(_ $ROOT)'
        value: '$P | site'

  site:
    cases:
      - match: '(__def)'
        value: none
      - match: '(__binding (__rhs !(__ssa_branch) (__member)))'
        value: $ROOT
      - match: '$P:(_ $ROOT)'
        value: '$P | site'

  returns:
    cases:
      - match: '(__def $K:__class|__struct|__impl|__interface|__trait|__enum)'
        value: $ROOT
      - match: '(__def $T:__ssa_return_type)'
        value: '$T | type'
      - match: '(__def **!__def|__lambda/(__ssa_return $B:__ssa_branch))'
        value: '$B | branch_type'
      - value: '$ROOT | inferred_return'

  branch_type:
    cases:
      - match: '(_ $$$A:__ssa_arm)'
        value: 'lub($A | tail | arm_type)'

  arm_type:
    cases:
      - match: '(__ssa_return)'
        value: none
      - match: '(__ssa_branch $$$A:__ssa_arm)'
        when: $A
        value: 'known($ROOT | branch_type)'
      - match: '(__ssa_branch)'
        value: none
      - match: '(_ $K:__callee)'
        value: 'known($K | type)'
      - value: opaque
