data:
  import_kinds: [__import, __import_type]

define:
  file_at(path):
    '_ when path | regex_match("(^|/)[*]$")': >-
      select(files, '(__source_file)' by $ROOT | regex_replace("/?[^/]*$", ""), path | regex_replace("/?[*]$", ""))
      or select(files, '(__source_file $P:__package)' by package_path($P), path | regex_replace("/?[*]$", ""))
    '_': >-
      select(files, '(__source_file)' by $ROOT | stem, path)
      or select(files, '(__source_file)' by $ROOT | collapse_index(%index_files), path)
      or file(select(files, '(__source_file $P:__package (__def $ROOT:__defname))' by package_path($P) | concat("/", $ROOT), path))
      or file(select(files, '(__source_file (__def $ROOT:__defname))' by package_path($ROOT), path))
  package_path(ROOT): '$ROOT | regex_replace("[.]|::|[\\\\]", "/")'
  roots(at): >-
    select(project, '(__dir $D:__source_root)') | tree_path
  files(path): 'first(%search, place => locate(place, path))'
  locate(place, path):
    '_ when in(place, "external")': 'outside(path, %external)'
    '_ when in(place, "stdlib")': 'outside(path, %stdlib)'
    '_ when in(place, "roots")': 'file_at(path) or first(roots(path), r => file_at(r | concat("/", path)))'
  outside(path, names):
    '_ when in(path | split_first("/"), names)': 'opaque'
  modules(ROOT): 'aliased($ROOT) or files($ROOT | tag("resolved_source"))'
  aliased(ROOT): >-
    first(select(project, '(__alias)') | longest_first, a => alias_files(a, $ROOT))
  alias_files(ROOT, imp):
    '(__alias $S:__scope) when eq($S, $imp | tag("alias_scope"))': 'files($imp | child("__source_path") | map_prefix($ROOT, $ROOT | child("__str")))'
    '(__alias !(__scope))': 'files($imp | child("__source_path") | map_prefix($ROOT, $ROOT | child("__str")))'
  submodule(ROOT, N): 'files($ROOT | tag("resolved_source") | concat("/", @$N))'
  exported(module, name): >-
    select(owned(module), '(__def $N:__defname)', name)
    or select(under(module), '(__def $N:__defname)', name)
    or select(owned(module), '(__def $N:__default_export)', name)
    or select(owned(module), '(__module_export (__default_export))' by $ROOT | child("__default_export"), name) | target_of
    or select(under(module), '(__def #exports)' by $ROOT | tag("exports"), name)
    or select(owned(module), '(%import_kinds $ROOT:__name)' by local_name($ROOT), name) | reexported(name) | is_def
    or select(owned(module), '(%import_kinds $ROOT:__name)' by $ROOT | written, "*") | reexported(name) | is_def
  offered(module, name): 'exported(module, name) or module'
  written(ROOT):
    '(_ (__ssa_hint "*"))': '"*"'
    '_': '$ROOT'
  reexported(ROOT, N):
    '$I:(%import_kinds $ROOT:(__name "*"))': '$I | modules | offered($N) or $I | modules | offered($ROOT)'
    '$I:(%import_kinds $ROOT:__name)': '$I | modules | offered($ROOT)'
  producing(ROOT):
    '(__call)': '$ROOT | follow(calls, site) | returned or $ROOT | type'
    '(__binding $R:__rhs)': '$R | tail | producing or $ROOT | type'
    '_': '$ROOT | type'
  linked_file(ROOT): "select(files, '(__source_file)' by $ROOT, @ROOT)"
  linked_section(ROOT, anchor): "select(under(linked_file($ROOT)), '(__def $N:__anchor)', @anchor)"
  returned(ROOT):
    '_ when $ROOT | returns | is_class': '$ROOT | returns'
    '_': 'visible($ROOT | returns, $ROOT)'

resolve:
  link:
    - '(__link $A:__anchor) when linked_section($ROOT, $A)':
        links: { from: 'file($ROOT)', to: 'linked_section($ROOT, $A)' }
    - '(__link) when linked_file($ROOT)':
        links: { from: 'file($ROOT)', to: 'linked_file($ROOT)' }

  import:
    - '$I:(%import_kinds $ROOT:__name) when $I | modules':
        imports: { from: $ROOT, to: '$I | modules | offered(written($ROOT)) | foreign' }
    - '$I:(%import_kinds $ROOT:__name)':
        imports: { from: $ROOT, to: '$I | submodule($ROOT) | offered(written($ROOT)) | foreign' }

  call:
    - '(__call (__callee $M:(__member $O:__object))) when $O | read | is_file':
        calls: { to: '$O | read | is_file | offered($M) | callable | foreign', site: $ROOT }
    - '(__call (__callee $M:(__member $O:__object)))':
        calls:
          - { to: '$O | type | member($M) | foreign', site: $ROOT }
          - { to: '$ROOT | follow(type_flow, site) | producing | member($M)', site: $ROOT }
    - '(__call (__callee $I:__ivar))':
        calls: { to: 'lookup(@$I, $ROOT, scope($ROOT) | class) | foreign', site: $ROOT }
    - '(__call (__callee "/./"))':
        calls: { to: 'targets($ROOT, false) | callable | foreign', site: $ROOT }

  decorator:
    - '$D:(__def $ROOT:__decorator)':
        calls: { from: $D, to: '$ROOT | type | callable | foreign' }

  supertype:
    - '$D:(__def $ROOT:__supertype)':
        extends: { from: $D, to: '$ROOT | type | is_def | foreign' }
