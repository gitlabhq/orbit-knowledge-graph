data:
  import_kinds: [__import, __import_type]

define:
  file_at(path):
    '_ when path | regex_match("(^|/)[*]$")': >-
      select(files, '(__source_file)' by $ROOT | regex_replace("[^/]*$", "."), path | regex_replace("(^|/)[*]$", "$1."))
      or select(files, '(__source_file $P:__package)' by package_path($P), path | regex_replace("/?[*]$", ""))
    '_': >-
      select(files, '(__source_file)' by $ROOT | stem, path)
      or select(files, '(__source_file)' by $ROOT, path)
      or select(files, '(__source_file)' by $ROOT | collapse_index(%index_files), path)
      or file(select(files, '(__source_file $P:__package (__def $ROOT:__defname))' by package_path($P) | concat("/", $ROOT), path))
      or file(select(files, '(__source_file (__def $ROOT:__defname))' by package_path($ROOT), path))
  package_path(ROOT): '$ROOT | regex_replace("[.]|::|[\\\\]", "/")'
  roots(at): >-
    select(project, '(__dir $D:__source_root)') | tree_path
  files(path): 'first(%search, place => locate(place, path))'
  locate(place, path):
    '_ when in(place, "external")': 'outside(path, %external)'
    '_ when in(place, "stdlib")': 'outside(path, %stdlib)'
    '_ when in(place, "roots")': 'file_at(path) or first(roots(path), r => file_at(r | concat("/", path)))'
  outside(path, names):
    '_ when in(path | split_first("/"), names)': 'opaque'
  modules(ROOT): 'aliased($ROOT) or files($ROOT | tag("resolved_source"))'
  aliased(ROOT): >-
    first(union(governing($ROOT) | config_aliases, select(project, '(__alias)')) | longest_first,
      a => alias_files(a, $ROOT))
  governing(ROOT): 'config_file($ROOT | file_dir | inherited_tag("ts_config"))'
  config_file(path): "select(project, '(__file)' by tree_path($ROOT), path)"
  config_aliases(ROOT): >-
    select(under($ROOT), '(__config_alias)')
    or $ROOT | child("__extends") | config_file | config_aliases
    or select(under($ROOT), '(__reference)') | config_file | config_aliases
  alias_files(ROOT, imp):
    '(_ $S:__scope) when in($S, $imp | tag("alias_scope"))': 'files($imp | child("__source_path") | map_prefix($ROOT, $ROOT | child("__str")))'
    '(_ !(__scope))': 'files($imp | child("__source_path") | map_prefix($ROOT, $ROOT | child("__str")))'
  submodule(ROOT, N): 'files($ROOT | tag("resolved_source") | concat("/", @$N))'
  exported(module, name): >-
    select(owned(module), '(__def $N:__defname)', name)
    or select(under(module), '(__def $N:__defname)', name)
    or select(owned(module), '(__def $N:__default_export)', name)
    or select(owned(module), '(__module_export (__default_export))' by $ROOT | child("__default_export"), name) | target_of
    or select(under(module), '(__def #exports)' by $ROOT | tag("exports"), name)
    or select(owned(module), '(%import_kinds $ROOT:(__name "*" $A:__alias))' by $A, name) | namespace_module
    or select(owned(module), '(%import_kinds $ROOT:__name)' by local_name($ROOT), name) | reexported(name) | is_def
    or select(owned(module), '(%import_kinds $ROOT:__name)' by $ROOT | written, "*") | reexported(name) | is_def
  namespace_module(ROOT):
    '$I:(%import_kinds $ROOT)': '$I | modules'
  offered(module, name): 'exported(module, name) or module'
  written(ROOT):
    '(_ (__ssa_hint "*"))': '"*"'
    '_': '$ROOT'
  reexported(ROOT, N):
    '$I:(%import_kinds $ROOT:(__name "*"))': '$I | modules | offered($N) or $I | modules | offered($ROOT)'
    '$I:(%import_kinds $ROOT:__name)': '$I | modules | offered($ROOT)'
  producing(ROOT):
    '(__call #unwrapped)': '$ROOT | follow(calls, site) | unwrapped_return'
    '(__call)': '$ROOT | follow(calls, site) | returned or $ROOT | type'
    '(__binding $R:__rhs)': '$R | tail | producing or $ROOT | type'
    '(__binding $T:__ssa_typed)': '$T | type'
    '_': '$ROOT | type'
  annotated(ROOT):
    '(__binding $T:__ssa_typed)': '$T | type | unique'
  dispatched(ROOT, contract, M):
    '_ when contract_impls($ROOT, contract)': 'declared(contract_impls($ROOT, contract), M, "callable") or declared(contract, M, "callable")'
  contract_impls(ROOT, contract): '$ROOT | other_parts | implements(contract)'
  implements(ROOT, contract):
    '_ when same(supertypes($ROOT), contract)': '$ROOT'
  linked_file(ROOT): "select(files, '(__source_file)' by $ROOT, @ROOT)"
  linked_section(ROOT, anchor): "select(under(linked_file($ROOT)), '(__def $N:__anchor)', @anchor)"
  unwrapped_return(ROOT):
    '(__def (__ssa_return_type $A:__type_arg))': '$A | type'
  returned(ROOT):
    '_ when $ROOT | returns | is_class': '$ROOT | returns'
    '_': 'visible($ROOT | returns, $ROOT)'

resolve:
  link:
    - '(__link $A:__anchor) when linked_section($ROOT, $A)':
        links: { from: 'file($ROOT)', to: 'linked_section($ROOT, $A)' }
    - '(__link) when linked_file($ROOT)':
        links: { from: 'file($ROOT)', to: 'linked_file($ROOT)' }

  import:
    - '$I:(%import_kinds $ROOT:__name) when $I | modules':
        imports: { from: $ROOT, to: '$I | modules | offered(written($ROOT)) | elsewhere(file($ROOT))' }
    - '$I:(%import_kinds $ROOT:__name)':
        imports: { from: $ROOT, to: '$I | submodule($ROOT) | offered(written($ROOT)) | elsewhere(file($ROOT))' }

  call:
    - '(__call (__callee $M:(__member $O:__object))) when $O | read | is_file':
        calls: { to: '$O | read | is_file | offered($M) | callable | elsewhere(file($ROOT))', site: $ROOT }
    - '(__call (__callee $M:(__member $O:__object $D:(__dispatch !(__object)))))':
        calls: { to: '$O | type | dispatched($D | type, $M)', site: $ROOT }
    - '(__call (__callee $M:(__member $O:__object (__dispatch (__object))))) when $O | type | is_contract':
        calls: { to: '$ROOT | follow(type_flow, site) | producing | member($M) or $O | type | member($M) | elsewhere(file($ROOT))', site: $ROOT }
    - '(__call (__callee $M:(__member $O:(__object (__qualifier)))))':
        calls: { to: '$O | type | member($M) | elsewhere(file($ROOT))', site: $ROOT }
    - '(__call (__callee $M:(__member $O:(__object !(__call) !(__member) !(__object) !(__qualifier) !(__ivar)))))':
        calls:
          - { to: '$O | type | member($M) | elsewhere(file($ROOT)) or $O | type | member($M) | impl_member', site: $ROOT }
          - { to: '$ROOT | follow(type_flow, site) | producing | member($M) or $ROOT | follow(type_flow, site) | annotated | member($M)', site: $ROOT }
    - '(__call (__callee $M:(__member $O:__object)))':
        calls:
          - { to: '$O | type | member($M) | elsewhere(file($ROOT)) or $O | type | member($M) | impl_member', site: $ROOT }
          - { to: '$ROOT | follow(type_flow, site) | producing | member($M)', site: $ROOT }
    - '(__call (__callee $I:__ivar))':
        calls: { to: 'lookup(@$I, $ROOT, scope($ROOT) | class) | elsewhere(file($ROOT))', site: $ROOT }
    - '(__call (__callee "/./"))':
        calls: { to: 'targets($ROOT, false) | callable | elsewhere(file($ROOT))', site: $ROOT }

  bound_import_call:
    - '(__call (__callee "/./")) when $ROOT | follow(type_flow, site) | follow(imports, site)':
        calls: { to: '$ROOT | follow(type_flow, site) | follow(imports, site) | follow(imports, from) | callable | elsewhere(file($ROOT))', site: $ROOT }

  bound_import:
    - '(__binding (__rhs !$ANY)) when $ROOT | follow(imports, site)':
        calls: { to: '$ROOT | follow(imports, site) | follow(imports, from) | initialized | elsewhere(file($ROOT))', site: $ROOT }

  decorator:
    - '$D:(__def $ROOT:__decorator)':
        calls: { from: $D, to: '$ROOT | type | is_def | elsewhere(file($ROOT))' }

  supertype:
    - '$D:(__def $ROOT:__supertype)':
        extends: { from: $D, to: '$ROOT | type | is_def | elsewhere(file($ROOT))' }
