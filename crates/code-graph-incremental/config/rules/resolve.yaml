resolve:
  - group: call
    match: '(__call (__callee $M:(__member $O:__object)))'
    when: '$O | read | module'
    emit: { calls: { from: enclosing, to: '$O | read | module | export($M) | callable(%callable_kinds, %value_kinds, %type_kinds) | foreign', site: $ROOT } }
  - group: call
    match: '(__call (__callee $M:(__member $O:__object)))'
    emit: { calls: { from: enclosing, to: '$O | type | member($M) | foreign', site: $ROOT } }
  - group: call
    match: '(__call (__callee $I:__ivar))'
    emit: { calls: { from: enclosing, to: 'lookup(@$I, $ROOT, %callable_kinds, %value_kinds, %type_kinds, enclosing | class) | foreign', site: $ROOT } }
  - group: call
    match: '(__call (__callee "/./"))'
    emit: { calls: { from: enclosing, to: 'targets($ROOT, false, %callable_kinds, %value_kinds, %type_kinds) | callable(%callable_kinds, %value_kinds, %type_kinds) | foreign', site: $ROOT } }

  - group: decorator
    match: '$D:(__def $ROOT:__decorator)'
    emit: { calls: { from: $D, to: '$ROOT | type | callable(%callable_kinds, %value_kinds, %type_kinds) | foreign' } }

  - group: supertype
    match: '$D:(__def $ROOT:__supertype)'
    emit: { extends: { from: $D, to: '$ROOT | type | is_def | foreign' } }
