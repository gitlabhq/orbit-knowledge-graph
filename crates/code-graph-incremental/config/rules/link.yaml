link:
  - group: imports
    match: '$ROOT:__import|__import_type'
    enter: ['mod.ssa.bind_import($ROOT, %shadows_locals, %inline_modules)']
    children: skip

  - group: impl
    match: '(__def $N:(__defname "/./") (__impl))'
    emit: { imports: { from: $N, to: $N | reference, resolution: reference, resolve: none } }

  - group: inline
    match: '(__def (__defname "/./") $$$S:__supertype)'
    enter:
      - 'mod.ssa.bind_import($S | child("__import"), %shadows_locals, %inline_modules)'
      - 'mod.ssa.bind_import($S | child("__import_type"), %shadows_locals, %inline_modules)'
  - group: inline
    match: '(__call $$$I:__import|__import_type)'
    enter: ['mod.ssa.bind_import($I, %shadows_locals, %inline_modules)']

  - group: def
    match: '(__def #scoped (__defname "/./") $$$S:__supertype)'
    enter: [define($ROOT), 'inherit($ROOT, $S | type)', 'mod.ssa.enter_def($ROOT, true, $ROOT | tag("scoped"))']
    emit:
      defines: { from: enclosing_def, to: $ROOT }
      extends: { from: $ROOT, to: $ROOT | supers }
  - group: def
    match: '(__def (__defname "/./") $$$S:__supertype)'
    enter: [define($ROOT), 'inherit($ROOT, $S | type)', 'mod.ssa.enter_def($ROOT, false, none)']
    emit:
      defines: { from: enclosing_def, to: $ROOT }
      extends: { from: $ROOT, to: $ROOT | supers }

  - group: def_children
    match: '(__def #scoped (__defname "/./"))'
    exit: [mod.ssa.leave]
  - group: def_children
    match: '(__def (__defname "/./") $$$D:__decorator)'
    children: $D
  - group: def_children
    match: '(__def)'
    children: skip

  - group: decorator
    match: '$D:(__def $ROOT:__decorator)'
    emit:
      calls: { from: $D, to: $ROOT | type | is_def }
      imports: { from: $D, to: $ROOT | type | imported, site: $ROOT }
  - group: decorator_children
    match: '$D:(__def #scoped $ROOT:__decorator)'
  - group: decorator_children
    match: '(__decorator)'
    children: skip

  - group: shadow
    match: '(__call $C:__callee (__property))'
    when: $C | type | is_class
  - group: shadow
    match: '(__call)'
    enter: [shadow($ROOT)]

  - group: call
    match: '(__call $C:__callee (__property))'
    when: $C | type | is_class
  - group: call
    match: '(__call (__callee (__member $O?:__object $DI:(__dispatch !(__object)))))'
    enter:
      - emit: { imports: { from: $O, to: $O | reference, site: $ROOT | binding_site, resolution: reference, resolve: none } }
      - emit: { imports: { from: $DI, to: $DI | reference, site: $ROOT | binding_site, resolution: reference, resolve: none } }
  - group: call
    match: '(__call (__callee $M:(__member $O:__object (__dispatch (__object)))))'
    when: $O | name | is_contract
    emit: { type_flow: { from: enclosing, to: $M | receiver_calls, site: $ROOT } }
  - group: call
    match: '(__call #implicit_self (__callee "/./"))'
    when: 'targets($ROOT, true)'
    emit:
      calls: { from: enclosing, to: 'targets($ROOT, true) | callable', site: $ROOT }
      imports: { from: enclosing, to: 'targets($ROOT, true) | imported', site: $ROOT }
      type_flow: { from: enclosing, to: 'targets($ROOT, true) | produced', site: $ROOT }
  - group: call
    match: '(__call #implicit_self (__callee %builtins))'
    when: 'unresolved($ROOT, true)'
    emit: { imports: { from: enclosing, to: mod.ssa.wildcards | callable_import, site: $ROOT, resolution: reference, resolve: none } }
  - group: call
    match: '(__call #implicit_self (__callee %providers))'
    when: 'unresolved($ROOT, true)'
    enter:
      - emit: { imports: { from: enclosing, to: 'mod.ssa.wildcards | callable_import | sourced(%providers, true)', site: $ROOT, resolution: reference, resolve: none } }
      - emit: { imports: { from: enclosing, to: 'mod.ssa.wildcards | callable_import | sourced(%providers, false)', site: $ROOT } }
  - group: call
    match: '(__call #implicit_self (__callee "/./"))'
    when: 'unresolved($ROOT, true)'
    emit: { imports: { from: enclosing, to: mod.ssa.wildcards | callable_import, site: $ROOT } }
  - group: call
    match: '(__call #implicit_self (__callee "/./"))'
  - group: call
    match: '(__call $C:(__callee $M?:__member))'
    when: $C | mod.ssa.pending
    enter:
      - emit: { type_flow: { from: enclosing, to: $M | receiver_calls, site: $ROOT } }
      - mod.ssa.defer($ROOT)
    late:
      - emit:
          calls: { from: enclosing, to: $ROOT | mod.ssa.deferred | callable, site: $ROOT }
          imports: { from: enclosing, to: $ROOT | mod.ssa.deferred | imported, site: $ROOT }
          type_flow: { from: enclosing, to: $ROOT | mod.ssa.deferred | produced, site: $ROOT }
  - group: call
    match: '(__call (__callee $M:(__member $O:(__object $VC?:__call))))'
    enter:
      - shadow($VC)
      - emit: { type_flow: { from: enclosing, to: $M | receiver_calls, site: $ROOT } }
      - emit: { calls: { from: enclosing, to: $O | type | member($M), site: $ROOT } }
      - emit:
          calls: { from: enclosing, to: $O | type | unmatched($M) | callable, site: $ROOT }
          imports: { from: enclosing, to: $O | type | unmatched($M) | imported, site: $ROOT }
          type_flow: { from: enclosing, to: $O | type | unmatched($M) | produced, site: $ROOT }
      - emit: { type_flow: { from: enclosing, to: $O | chain_head | type | typed_calls, site: $ROOT } }
      - mod.ssa.defer($ROOT)
    late:
      - emit: { calls: { from: enclosing, to: $ROOT | mod.ssa.deferred | member($M), site: $ROOT } }
      - emit:
          calls: { from: enclosing, to: $ROOT | mod.ssa.deferred | unmatched($M) | callable, site: $ROOT }
          imports: { from: enclosing, to: $ROOT | mod.ssa.deferred | unmatched($M) | imported, site: $ROOT }
          type_flow: { from: enclosing, to: $ROOT | mod.ssa.deferred | unmatched($M) | produced, site: $ROOT }
  - group: call
    match: '(__call (__callee (__member)))'
  - group: call
    match: '(__call (__callee $I:__ivar))'
    emit: { calls: { from: enclosing, to: 'lookup(@$I, $ROOT, enclosing | class)', site: $ROOT } }
  - group: call
    match: '(__call (__callee "/./"))'
    when: 'targets($ROOT, false)'
    emit:
      calls: { from: enclosing, to: 'targets($ROOT, false) | callable', site: $ROOT }
      imports: { from: enclosing, to: 'targets($ROOT, false) | imported', site: $ROOT }
      type_flow: { from: enclosing, to: 'targets($ROOT, false) | produced', site: $ROOT }
  - group: call
    match: '(__call (__callee %builtins))'
    when: 'unresolved($ROOT, false)'
    emit: { imports: { from: enclosing, to: mod.ssa.wildcards, site: $ROOT, resolution: reference, resolve: none } }
  - group: call
    match: '(__call (__callee %providers))'
    when: 'unresolved($ROOT, false)'
    enter:
      - emit: { imports: { from: enclosing, to: 'mod.ssa.wildcards | sourced(%providers, true)', site: $ROOT, resolution: reference, resolve: none } }
      - emit: { imports: { from: enclosing, to: 'mod.ssa.wildcards | sourced(%providers, false)', site: $ROOT } }
  - group: call
    match: '(__call (__callee "/./"))'
    when: 'unresolved($ROOT, false)'
    emit: { imports: { from: enclosing, to: mod.ssa.wildcards, site: $ROOT } }

  - group: member
    match: '(__callee $ROOT:__member)'
  - group: member
    match: '(__member (__object $ROOT:__member))'
  - group: member
    match: '(__member)'
    when: $ROOT | mod.ssa.slot
  - group: member
    match: '(__member $O:__object)'
    enter:
      - emit: { calls: { from: enclosing, to: $O | type | member($ROOT), resolution: reference } }
      - emit:
          calls: { from: enclosing, to: $O | type | unmatched($ROOT) | callable, resolution: reference }
          imports: { from: enclosing, to: $O | type | unmatched($ROOT) | imported, site: $ROOT | binding_site, resolution: reference, resolve: none }
          type_flow: { from: enclosing, to: $O | type | unmatched($ROOT) | produced, resolution: reference }

  - group: bind
    match: '(__binding (__qualifier))'
    enter: ['mod.ssa.bind($ROOT, $ROOT, none)']
    children: skip
  - group: bind
    match: '(__def $K:__class|__struct|__impl|__interface|__trait|__enum $ROOT:(__binding "/^$/"))'
    children: skip
  - group: bind
    match: '(__destructure $ROOT:(__binding "/./" $RHS?:__rhs))'
    enter: ['mod.ssa.bind($ROOT, $ROOT, $RHS | source)']
    children: skip
  - group: bind
    match: '(__destructure $ROOT:__binding)'
    children: skip
  - group: bind
    match: '(__ssa_loop (__arr $$$E:__call) $ROOT:(__binding !(__rhs)))'
    when: $E
    enter: ['mod.ssa.bind($ROOT, $E, none)']
    children: skip
  - group: bind
    match: '(__ssa_loop $ROOT:(__binding !(__rhs) (__declaration "/./")))'
    when: $ROOT | mod.ssa.slot
    enter: ['mod.ssa.bind($ROOT, opaque, none)']
    children: skip
  - group: bind
    match: '(__binding !(__rhs) (__declaration "/./"))'
    when: $ROOT | mod.ssa.slot
    children: skip
  - group: bind
    match: '(__binding $$$PRE:__call (__rhs $BR:__ssa_branch $$$FX:__side_effect))'
    when: $ROOT | mod.ssa.slot
    children: [$BR, $FX, $PRE]
    exit: ['mod.ssa.bind($ROOT, none, none)']
  - group: bind
    match: '(__binding $$$PRE:__call $RHS?:(__rhs $$$R))'
    when: $ROOT | mod.ssa.slot
    children: [$R, $PRE]
    exit: ['mod.ssa.bind($ROOT, $ROOT | value_of, $RHS | source)']

  - group: bare
    match: '(__binding $B:(__rhs !$ANY))'
    when: $B | name | imported
    exit:
      - emit:
          imports: { from: enclosing, to: $B | name | imported, site: $ROOT, resolution: reference }
          type_flow: { from: enclosing, to: $ROOT, site: $ROOT }
  - group: bare
    match: '(__binding $B:(__rhs !$ANY))'
    exit:
      - emit: { calls: { from: enclosing, to: $B | name | initialized, site: $ROOT } }

  - group: hoist
    match: '(__scope #hoisted $$$D:__def)'
    enter: [define($D)]

  - group: revisit
    match: '(__ssa_loop)'
    when: mod.ssa.in_loop
  - group: revisit
    match: '(__ssa_loop)'
    exit: [revisit]

  - group: flow
    match: '(__scope #hoisted)'
    enter: ['mod.ssa.enter_scope($ROOT, $ROOT | tag("scoped"), true)']
    exit: [mod.ssa.leave]
  - group: flow
    match: '(__scope)'
    enter: ['mod.ssa.enter_scope($ROOT, $ROOT | tag("scoped"), false)']
    exit: [mod.ssa.leave]
  - group: flow
    match: '(__lambda)'
    enter: [mod.ssa.fork(none)]
    exit: [mod.ssa.leave]
  - group: flow
    match: '$B:(__binding (__rhs $ROOT:(__ssa_branch $$$C $A:__ssa_arm $$$REST:__ssa_arm)))'
    children: [$C, $A, $REST]
    between: [mod.ssa.fork($B)]
    exit: [mod.ssa.leave]
  - group: flow
    match: '(__ssa_arm !$X:!__ssa_branch $ROOT:(__ssa_branch $$$C $A:__ssa_arm $$$REST:__ssa_arm))'
    children: [$C, $A, $REST]
    between: [mod.ssa.fork($ROOT)]
    exit: [mod.ssa.leave]
  - group: flow
    match: '(__ssa_branch $$$C $A:__ssa_arm $$$REST:__ssa_arm)'
    children: [$C, $A, $REST]
    between: [mod.ssa.fork(none)]
    exit: [mod.ssa.leave]
  - group: flow
    match: '(__ssa_branch $ROOT:__ssa_arm)'
    exit: ['mod.ssa.yield($ROOT | valued, $ROOT | value_of, $ROOT | source)', mod.ssa.join]
  - group: flow
    match: '(__ssa_loop $$$H $B:(__binding (__declaration) #!lifted) $$$R)'
    children: [$H, $B, $R]
    between: [mod.ssa.loop_header($ROOT)]
    exit: [mod.ssa.leave]
  - group: flow
    match: '(__ssa_loop)'
    enter: [mod.ssa.loop_header($ROOT)]
    exit: [mod.ssa.leave]
