
link:
  impl:
    - '(__def $N:(__defname "/./") (__impl))':
        imports: { from: $N, to: '$N | reference', resolution: reference }

  def:
    - '(__def (__defname "/./") $$$S:__supertype)':
        defines: { from: enclosing_def, to: $ROOT }
        extends: { from: $ROOT, to: '$ROOT | supers' }

  decorator:
    - '$D:(__def $ROOT:__decorator)':
        calls: { from: $D, to: '$ROOT | type | is_def' }
        imports: { from: $D, to: '$ROOT | type | imported', site: $ROOT }

  call:
    - '(__call $C:__callee (__property)) when $C | type | is_class': none
    - '(__call (__callee (__member $O?:__object $DI:(__dispatch !(__object)))))':
        imports:
          - { from: $O, to: '$O | reference', site: '$ROOT | binding_site', resolution: reference }
          - { from: $DI, to: '$DI | reference', site: '$ROOT | binding_site', resolution: reference }
    - '(__call (__callee $M:(__member $O:__object (__dispatch (__object))))) when $O | name | is_contract':
        type_flow: { to: '$M | receiver_calls', site: $ROOT }
    - '(__call #implicit_self (__callee "/./")) when targets($ROOT, true, %callable_kinds, %value_kinds, %type_kinds)':
        calls: { to: 'targets($ROOT, true, %callable_kinds, %value_kinds, %type_kinds) | callable(%callable_kinds, %value_kinds, %type_kinds)', site: $ROOT }
        imports: { to: 'targets($ROOT, true, %callable_kinds, %value_kinds, %type_kinds) | imported', site: $ROOT }
        type_flow: { to: 'targets($ROOT, true, %callable_kinds, %value_kinds, %type_kinds) | produced', site: $ROOT }
    - '(__call #implicit_self (__callee %builtins)) when unresolved($ROOT, true, %callable_kinds, %value_kinds, %type_kinds)':
        imports: { to: '$ROOT | mod.ssa.wildcards | callable_import("callable")', site: $ROOT, resolution: reference }
    - '(__call #implicit_self (__callee %providers)) when unresolved($ROOT, true, %callable_kinds, %value_kinds, %type_kinds)':
        imports:
          - { to: '$ROOT | mod.ssa.wildcards | callable_import("callable") | sourced(%providers, true)', site: $ROOT, resolution: reference }
          - { to: '$ROOT | mod.ssa.wildcards | callable_import("callable") | sourced(%providers, false)', site: $ROOT }
    - '(__call #implicit_self (__callee "/./")) when unresolved($ROOT, true, %callable_kinds, %value_kinds, %type_kinds)':
        imports: { to: '$ROOT | mod.ssa.wildcards | callable_import("callable")', site: $ROOT }
    - '(__call #implicit_self (__callee "/./"))': none
    - '(__call $C:(__callee $M?:__member)) when $ROOT | mod.ssa.pending':
        type_flow:
          - { to: '$M | receiver_calls', site: $ROOT }
          - { to: '$ROOT | mod.ssa.deferred | produced', site: $ROOT }
        calls: { to: '$ROOT | mod.ssa.deferred | callable(%callable_kinds, %value_kinds, %type_kinds)', site: $ROOT }
        imports: { to: '$ROOT | mod.ssa.deferred | imported', site: $ROOT }
    - '(__call (__callee $M:(__member $O:__object)))':
        type_flow:
          - { to: '$M | receiver_calls', site: $ROOT }
          - { to: '$O | type | unmatched($M, %callable_kinds, %value_kinds, %type_kinds) | produced', site: $ROOT }
          - { to: '$O | chain_head | type | typed_calls', site: $ROOT }
        calls:
          - { to: '$O | type | member($M)', site: $ROOT }
          - { to: '$O | type | unmatched($M, %callable_kinds, %value_kinds, %type_kinds) | callable(%callable_kinds, %value_kinds, %type_kinds)', site: $ROOT }
        imports: { to: '$O | type | unmatched($M, %callable_kinds, %value_kinds, %type_kinds) | imported', site: $ROOT }
    - '(__call (__callee $I:__ivar))':
        calls: { to: 'lookup(@$I, $ROOT, %callable_kinds, %value_kinds, %type_kinds, enclosing | class)', site: $ROOT }
    - '(__call (__callee "/./")) when targets($ROOT, false, %callable_kinds, %value_kinds, %type_kinds)':
        calls: { to: 'targets($ROOT, false, %callable_kinds, %value_kinds, %type_kinds) | callable(%callable_kinds, %value_kinds, %type_kinds)', site: $ROOT }
        imports: { to: 'targets($ROOT, false, %callable_kinds, %value_kinds, %type_kinds) | imported', site: $ROOT }
        type_flow: { to: 'targets($ROOT, false, %callable_kinds, %value_kinds, %type_kinds) | produced', site: $ROOT }
    - '(__call (__callee %builtins)) when unresolved($ROOT, false, %callable_kinds, %value_kinds, %type_kinds)':
        imports: { to: '$ROOT | mod.ssa.wildcards', site: $ROOT, resolution: reference }
    - '(__call (__callee %providers)) when unresolved($ROOT, false, %callable_kinds, %value_kinds, %type_kinds)':
        imports:
          - { to: '$ROOT | mod.ssa.wildcards | sourced(%providers, true)', site: $ROOT, resolution: reference }
          - { to: '$ROOT | mod.ssa.wildcards | sourced(%providers, false)', site: $ROOT }
    - '(__call (__callee "/./")) when unresolved($ROOT, false, %callable_kinds, %value_kinds, %type_kinds)':
        imports: { to: '$ROOT | mod.ssa.wildcards', site: $ROOT }

  member:
    - '(__member $O:__object)':
        calls:
          - { to: '$O | type | member($ROOT)', resolution: reference }
          - { to: '$O | type | unmatched($ROOT, %callable_kinds, %value_kinds, %type_kinds) | callable(%callable_kinds, %value_kinds, %type_kinds)', resolution: reference }
        imports: { to: '$O | type | unmatched($ROOT, %callable_kinds, %value_kinds, %type_kinds) | imported', site: '$ROOT | binding_site', resolution: reference }
        type_flow: { to: '$O | type | unmatched($ROOT, %callable_kinds, %value_kinds, %type_kinds) | produced', resolution: reference }
