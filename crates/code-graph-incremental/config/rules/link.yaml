link:
  - group: imports
    match: '(__import)'
    enter: ['mod.ssa.bind_import($ROOT, %shadows_locals, %inline_modules)']
    children: skip
  - group: imports
    match: '(__import_type)'
    enter: ['mod.ssa.bind_import($ROOT, %shadows_locals, %inline_modules)']
    children: skip

  - group: impl
    match: '(__def $N:(__defname "/./") (__impl))'
    emit: { imports: { from: $N, to: $N | reference, resolution: reference, resolve: none } }

  - group: super_imports
    match: '(__def (__defname "/./") $$$S:__supertype)'
    enter: ['mod.ssa.bind_inline($S, %shadows_locals, %inline_modules)']

  - group: def
    match: '(__def (__defname "/./") $$$S:__supertype)'
    enter:
      - define($ROOT)
      - inherit($ROOT, $S | type)
      - mod.ssa.enter_def($ROOT)
    emit:
      defines: { from: enclosing_def, to: $ROOT }
      extends: { from: $ROOT, to: $ROOT | supers }

  - group: def_children
    match: '(__def (__defname "/./"))'
    when: $ROOT | tagged("scoped")
    exit: [mod.ssa.leave()]
  - group: def_children
    match: '(__def (__defname "/./") $$$D:__decorator)'
    children: $D
  - group: def_children
    match: '(__def)'
    children: skip

  - group: decorator
    match: '$D:(__def $ROOT:__decorator)'
    emit:
      calls: { from: $D, to: $ROOT | type | is_def }
      imports: { from: $D, to: $ROOT | type | imported, site: $ROOT }
  - group: decorator_children
    match: '$D:(__def $ROOT:__decorator)'
    when: $D | tagged("scoped")
  - group: decorator_children
    match: '(__decorator)'
    children: skip

  - group: inline
    match: '(__call)'
    enter: ['mod.ssa.bind_inline($ROOT, %shadows_locals, %inline_modules)']
  - group: inline
    match: '(__supertype)'
    enter: ['mod.ssa.bind_inline($ROOT, %shadows_locals, %inline_modules)']

  - group: shadow
    match: '(__call $C:__callee (__property))'
    when: $C | type | is_class
  - group: shadow
    match: '(__call)'
    enter: [shadow($ROOT)]

  - group: call
    match: '(__call $C:__callee (__property))'
    when: $C | type | is_class
  - group: call
    match: '(__call (__callee (__member $O?:__object $DI:(__dispatch !(__object)))))'
    enter:
      - emit: { imports: { from: $O, to: $O | reference, site: $ROOT | binding_site, resolution: reference, resolve: none } }
      - emit: { imports: { from: $DI, to: $DI | reference, site: $ROOT | binding_site, resolution: reference, resolve: none } }
  - group: call
    match: '(__call (__callee $M:(__member $O:__object (__dispatch (__object)))))'
    when: $O | name | is_contract
    emit: { type_flow: { from: enclosing, to: $M | receiver_calls, site: $ROOT } }
  - group: call
    match: '(__call $C:(__callee $M?:__member))'
    when: $C | mod.ssa.phi
    enter:
      - emit: { type_flow: { from: enclosing, to: $M | receiver_calls, site: $ROOT } }
      - mod.ssa.defer($ROOT)
    late:
      - emit:
          calls: { from: enclosing, to: $ROOT | mod.ssa.deferred_callee | callable, site: $ROOT }
          imports: { from: enclosing, to: $ROOT | mod.ssa.deferred_callee | imported, site: $ROOT }
          type_flow: { from: enclosing, to: $ROOT | mod.ssa.deferred_callee | produced, site: $ROOT }
  - group: call
    match: '(__call (__callee $M:(__member $O:(__object $VC?:__call))))'
    enter:
      - shadow($VC)
      - emit: { type_flow: { from: enclosing, to: $M | receiver_calls, site: $ROOT } }
      - emit: { calls: { from: enclosing, to: $O | type | member($M), site: $ROOT } }
      - emit:
          calls: { from: enclosing, to: $O | type | unmatched($M) | callable, site: $ROOT }
          imports: { from: enclosing, to: $O | type | unmatched($M) | imported, site: $ROOT }
          type_flow: { from: enclosing, to: $O | type | unmatched($M) | produced, site: $ROOT }
      - emit: { type_flow: { from: enclosing, to: $O | chain_head | type | typed_calls, site: $ROOT } }
      - mod.ssa.defer($ROOT)
    late:
      - emit: { calls: { from: enclosing, to: $ROOT | mod.ssa.deferred_receiver | member($M), site: $ROOT } }
      - emit:
          calls: { from: enclosing, to: $ROOT | mod.ssa.deferred_receiver | unmatched($M) | callable, site: $ROOT }
          imports: { from: enclosing, to: $ROOT | mod.ssa.deferred_receiver | unmatched($M) | imported, site: $ROOT }
          type_flow: { from: enclosing, to: $ROOT | mod.ssa.deferred_receiver | unmatched($M) | produced, site: $ROOT }
  - group: call
    match: '(__call (__callee (__member)))'
  - group: call
    match: '(__call (__callee $I:__ivar))'
    emit: { calls: { from: enclosing, to: 'enclosing | class | members(@$I, $ROOT)', site: $ROOT } }
  - group: call
    match: '(__call (__callee "/./"))'
    when: $ROOT | targets
    emit:
      calls: { from: enclosing, to: $ROOT | targets | callable, site: $ROOT }
      imports: { from: enclosing, to: $ROOT | targets | imported, site: $ROOT }
      type_flow: { from: enclosing, to: $ROOT | targets | produced, site: $ROOT }
  - group: call
    match: '(__call (__callee "/./"))'
    when: '$ROOT | unresolved | tagged("implicit_self")'
    emit: { imports: { from: enclosing, to: mod.ssa.wildcards | callable_import, site: $ROOT } }
  - group: call
    match: '(__call (__callee "/./"))'
    when: $ROOT | unresolved
    emit: { imports: { from: enclosing, to: mod.ssa.wildcards, site: $ROOT } }

  - group: member
    match: '(__callee $ROOT:__member)'
  - group: member
    match: '(__member (__object $ROOT:__member))'
  - group: member
    match: '(__member)'
    when: $ROOT | mod.ssa.slot
  - group: member
    match: '(__member $O:__object)'
    enter:
      - emit: { calls: { from: enclosing, to: $O | type | member($ROOT), resolution: reference } }
      - emit:
          calls: { from: enclosing, to: $O | type | unmatched($ROOT) | callable, resolution: reference }
          imports: { from: enclosing, to: $O | type | unmatched($ROOT) | imported, site: $ROOT | binding_site, resolution: reference, resolve: none }
          type_flow: { from: enclosing, to: $O | type | unmatched($ROOT) | produced, resolution: reference }

  - group: bind
    match: '(__binding (__qualifier))'
    enter: [mod.ssa.bind_static($ROOT)]
    children: skip
  - group: bind
    match: '(__def $ROOT:__binding)'
    when: $ROOT | initializer
    children: skip
  - group: bind
    match: '(__destructure $ROOT:(__binding "/./" $RHS?:__rhs))'
    enter: [mod.ssa.declare($ROOT), 'mod.ssa.bind($ROOT, $ROOT, $RHS | tail)']
    children: skip
  - group: bind
    match: '(__destructure $ROOT:__binding)'
    children: skip
  - group: bind
    match: '(__ssa_loop (__arr $$$E:__call) $ROOT:(__binding !(__rhs)))'
    when: $E
    enter: ['mod.ssa.bind($ROOT, $E, none)', mod.ssa.declare($ROOT | plain_declaration)]
    children: skip
  - group: bind
    match: '(__ssa_loop $ROOT:(__binding !(__rhs) (__declaration "/./")))'
    when: $ROOT | mod.ssa.slot
    enter: ['mod.ssa.bind($ROOT, opaque, none)']
    children: skip
  - group: bind
    match: '(__binding !(__rhs) (__declaration "/./"))'
    when: $ROOT | mod.ssa.slot
    children: skip
  - group: bind
    match: '(__binding $$$PRE:__call (__rhs $BR:__ssa_branch $$$FX:__side_effect))'
    when: $ROOT | mod.ssa.slot
    children: [$BR, $FX, $PRE]
    exit: [mod.ssa.declare($ROOT | plain_declaration)]
  - group: bind
    match: '(__binding $$$PRE:__call $RHS?:(__rhs $$$R))'
    when: $ROOT | mod.ssa.slot
    children: [$R, $PRE]
    exit:
      - 'mod.ssa.bind($ROOT, $ROOT | assigned, $RHS | tail | source)'
      - mod.ssa.declare($ROOT | plain_declaration)

  - group: bare
    match: '(__binding $B:(__rhs !$ANY))'
    when: $B | name | imported
    exit:
      - emit:
          imports: { from: enclosing, to: $B | name | imported, site: $ROOT, resolution: reference }
          type_flow: { from: enclosing, to: $ROOT, site: $ROOT }
  - group: bare
    match: '(__binding $B:(__rhs !$ANY))'
    exit:
      - emit: { calls: { from: enclosing, to: $B | name | initialized, site: $ROOT } }

  - group: hoist
    match: '(__scope $$$D:__def)'
    when: $ROOT | tagged("hoisted")
    enter: [define($D)]

  - group: revisit
    match: '(__ssa_loop)'
    when: $ROOT | outermost
    exit: [revisit]

  - group: flow
    match: '(__scope)'
    enter: [mod.ssa.enter_scope($ROOT)]
    exit: [mod.ssa.leave()]
  - group: flow
    match: '(__lambda)'
    enter: [mod.ssa.fork($ROOT | sink)]
    exit: [mod.ssa.leave()]
  - group: flow
    match: '(__ssa_branch $$$C $A:__ssa_arm $$$REST:__ssa_arm)'
    children: [$C, $A, $REST]
    between: [mod.ssa.fork($ROOT | sink)]
    exit: [mod.ssa.leave()]
  - group: flow
    match: '(__ssa_branch $ROOT:__ssa_arm)'
    exit:
      - 'mod.ssa.bind($ROOT | arm_target, $ROOT | arm_value, $ROOT | tail | source)'
      - mod.ssa.join()
  - group: flow
    match: '(__ssa_loop $$$H $B:(__binding (__declaration)) $$$R)'
    when: $B | unlifted
    children: [$H, $B, $R]
    between: [mod.ssa.loop_header($ROOT)]
    exit: [mod.ssa.leave()]
  - group: flow
    match: '(__ssa_loop)'
    enter: [mod.ssa.loop_header($ROOT)]
    exit: [mod.ssa.leave()]
