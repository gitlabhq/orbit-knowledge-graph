data:
  import_kinds: [__import, __import_type]

functions:
  modules:
    cases:
      - when: '$ROOT | alias($ROOT | tag("alias_scope"))'
        value: '$ROOT | alias($ROOT | tag("alias_scope")) | files | foreign'
      - when: '$ROOT | mod.scope.source | under(%external)'
        value: none
      - value: '$ROOT | tag("resolved_source") | files | foreign'
  submodule:
    params: [$N]
    cases:
      - value: '$ROOT | tag("resolved_source") | concat("/", @$N) | files | foreign'
  offered:
    params: [$N]
    cases:
      - when: '$ROOT | export($N)'
        value: '$ROOT | export($N)'
      - when: '$ROOT | reexports($N)'
        value: '$ROOT | reexports($N) | reexported($N)'
      - value: $ROOT
  reexported:
    params: [$N]
    cases:
      - match: '$I:(%import_kinds $ROOT:(__name "*"))'
        value: '$I | modules | offered($N)'
      - match: '$I:(%import_kinds $ROOT:__name)'
        value: '$I | modules | offered($ROOT)'

imports:
  - group: name
    match: '$I:(%import_kinds $ROOT:__name)'
    when: '$I | modules'
    emit: { imports: { from: $ROOT, to: '$I | modules | offered($ROOT) | foreign' } }
  - group: name
    match: '$I:(%import_kinds $ROOT:__name)'
    when: '$I | mod.scope.source | under(%stdlib)'
  - group: name
    match: '$I:(%import_kinds $ROOT:__name)'
    emit: { imports: { from: $ROOT, to: '$I | submodule($ROOT) | offered($ROOT) | foreign' } }
