- match: '(__decorator)'
  when: [mod.def.owner($ROOT), mod.tree.named($ROOT), mod.types.chain($ROOT)]
  do: mod.emit.calls(mod.def.owner($ROOT), mod.types.cross($WHEN))
- match: '(__decorator)'
  when: [mod.def.owner($ROOT), mod.tree.named($ROOT)]
  do: mod.imports.unbound(mod.def.owner($ROOT), $ROOT)

- match: '(__supertype)'
  when: [mod.def.owner($ROOT), mod.tree.named($ROOT), mod.types.cross(mod.types.chain($ROOT))]
  do:
    - mod.emit.extends(mod.def.owner($ROOT), $WHEN)
    - mod.members.inherited(mod.def.owner($ROOT), $WHEN)

- match: '(__destructure)'
  do: mod.members.destructure($ROOT, mod.def.enclosing())

- match: '(__call (__callee $M:(__member $O:__object)))'
  when:
    - mod.tree.named($M)
    - mod.tree.root_name($O)
    - mod.tree.lacks(mod.tree.child($M, "__dispatch"), "__object")
    - mod.types.chain($O)
  do: mod.emit.calls_at(mod.def.enclosing(), mod.members.dispatch($WHEN, $M), $ROOT)
- match: '(__call (__callee $M:(__member $O:__object)))'
  when:
    - mod.tree.named($M)
    - mod.tree.root_name($O)
    - mod.tree.child($M, "__dispatch")
    - mod.types.contract(mod.types.chain($O))
- match: '(__call (__callee $M:(__member $O:__object)))'
  when: [mod.tree.named($M), mod.tree.root_name($O), mod.types.chain($O)]
  do: mod.emit.calls_at(mod.def.enclosing(), mod.members.up(mod.types.cross_class($WHEN), $M), $ROOT)
- match: '(__call (__callee $M:(__member $O:__object)))'
  when: [mod.tree.named($M), mod.tree.root_name($O)]
  do: mod.imports.unbound_object(mod.def.enclosing(), mod.tree.root_name($O))
