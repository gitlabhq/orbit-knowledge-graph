import: [shapes]

rulesets:
  tag_file_dir:
    - name: tag-file-dir
      rules:
        - match: '$M:__source_file'
          tag: { file_dir: '@$M | regex_replace("[^/]*$", "") | regex_replace("/$", "")' }

  resolve_paths:
    - name: resolve-paths
      rules:
        - match: '(__import)'
          tag: { resolved_source: '$ROOT | child_sym("__source_path")' }
        - match: '(__import (__source_path "^."))'
          tag:
            resolved_source: '$ROOT | ancestor_tag("file_dir") | concat("/", $ROOT | child_sym("__source_path")) | regex_replace("(^|/)\./", "$1") | regex_loop("[^/]+/\.\./", "") | regex_replace("/$", "") | regex_replace("^/", "")'

  ssa_cleanup:
    - name: ssa-cleanup
      rules:
        - match: '(__ssa_return $V:identifier)'
          replace: '%return_value($V)'

  type_def_tags:
    - match: '(__def (__class))'
      tag: { callable: 'true', value: 'true', declares_type: 'true', scoped: 'true' }
    - match: '(__def (__lambda))'
      tag: { callable: 'true' }
    - match: '(__def (__enum_variant))'
      tag: { callable: 'true', value: 'true' }
    - match: '(__def (__struct))'
      tag: { value: 'true', declares_type: 'true', scoped: 'true' }
    - match: '(__def (__impl))'
      tag: { scoped: 'true' }
    - match: '(__def (__trait))'
      tag: { value: 'true', declares_type: 'true', scoped: 'true' }
    - match: '(__def (__enum))'
      tag: { value: 'true', declares_type: 'true', scoped: 'true' }

  function_def_tags:
    - match: '(__def (__function))'
      tag: { callable: 'true', scoped: 'true' }
    - match: '(__def (__method))'
      tag: { callable: 'true', scoped: 'true' }

  class_lambda_def_tags:
    - match: '(__def (__class))'
      tag: { callable: 'true', value: 'true', declares_type: 'true', scoped: 'true' }
    - match: '(__def (__lambda))'
      tag: { callable: 'true' }

  trait_def_tags:
    - match: '(__def (__impl))'
      tag: { scoped: 'true' }
    - match: '(__def (__trait))'
      tag: { value: 'true', declares_type: 'true', scoped: 'true' }
    - match: '(__def (__enum))'
      tag: { value: 'true', declares_type: 'true', scoped: 'true' }

  alias_field_def_tags:
    - match: '(__def (__type_alias))'
      tag: { value: 'true', declares_type: 'true' }
    - match: '(__def (__field_def))'
      tag: { value: 'true' }

  callable_struct_def_tags:
    - match: '(__def (__enum_variant))'
      tag: { callable: 'true', value: 'true' }
    - match: '(__def (__struct))'
      tag: { callable: 'true', value: 'true', declares_type: 'true', scoped: 'true' }

  interface_def_tags:
    - match: '(__def (__interface))'
      tag: { value: 'true', declares_type: 'true' }
