import: [shapes]

stages:
  tag_file_dir:
    - stage: tag-file-dir
      rewrite:
        - '$M:__source_file': '#file_dir=@$M | regex_replace("[^/]*$", "") | regex_replace("/$", "")'
  resolve_paths:
    - stage: resolve-paths
      rewrite:
        - '(__import)': '#resolved_source=$ROOT | child("__source_path")'
        - '(__import (__source_path "^."))': '#resolved_source=$ROOT | tag_up("file_dir") | concat("/", $ROOT | child("__source_path")) | regex_replace("(^|/)\./", "$1") | regex_loop("[^/]+/\.\./", "") | regex_replace("/$", "") | regex_replace("^/", "")'
  ssa_cleanup:
    - stage: ssa-cleanup
      rewrite:
        - '(__ssa_return $V:identifier)': '%return_value($V)'
  type_def_tags:
    - '(__def (__class))': '#callable=true #value=true #declares_type=true #scoped=true'
    - '(__def (__lambda))': '#callable=true'
    - '(__def (__enum_variant))': '#callable=true #value=true'
    - '(__def (__struct))': '#value=true #declares_type=true #scoped=true'
    - '(__def (__impl))': '#scoped=true'
    - '(__def (__trait))': '#value=true #declares_type=true #scoped=true'
    - '(__def (__enum))': '#value=true #declares_type=true #scoped=true'
  function_def_tags:
    - '(__def (__function))': '#callable=true #scoped=true'
    - '(__def (__method))': '#callable=true #scoped=true'
  class_lambda_def_tags:
    - '(__def (__class))': '#callable=true #value=true #declares_type=true #scoped=true'
    - '(__def (__lambda))': '#callable=true'
  trait_def_tags:
    - '(__def (__impl))': '#scoped=true'
    - '(__def (__trait))': '#value=true #declares_type=true #scoped=true'
    - '(__def (__enum))': '#value=true #declares_type=true #scoped=true'
  alias_field_def_tags:
    - '(__def (__type_alias))': '#value=true #declares_type=true'
    - '(__def (__field_def))': '#value=true'
  callable_struct_def_tags:
    - '(__def (__enum_variant))': '#callable=true #value=true'
    - '(__def (__struct))': '#callable=true #value=true #declares_type=true #scoped=true'
  interface_def_tags:
    - '(__def (__interface))': '#value=true #declares_type=true'
