import: [shapes]

rulesets:
  canonical_callee_calls:
    - match: '(call_expression function: $F:__ivar arguments: $A)'
      replace: '(__call (__callee $F) $A)'
    - match: '(call_expression function: $F:__member arguments: $A)'
      replace: '(__call (__callee $F) $A)'

  c_like_assignments:
    - match: '(assignment_expression left: $N:__ivar right: $R:__call)'
      replace: '(__binding $N (__rhs $R))'
    - match: '(assignment_expression left: $N:__ivar right: $R)'
      replace: '(__binding $N (__rhs @$R $R))'
    - match: '(assignment_expression left: $N:identifier right: $R:__call)'
      replace: '%bind_call($N, $R)'
    - match: '(assignment_expression left: $N:identifier right: $R)'
      replace: '%bind($N, $R)'
    - match: '(if_statement condition: $C consequence: $Q alternative:? $A)'
      replace: '(__ssa_branch $C (__ssa_arm $Q) (__ssa_arm? $A))'

  suffix_calls:
    - match: '(call_expression $F:__ivar (call_suffix $$$A))'
      replace: '(__call (__callee $F) $$$A)'
    - match: '(call_expression $F:__member (call_suffix $$$A))'
      replace: '(__call (__callee $F) $$$A)'
    - match: '(call_expression $F:simple_identifier (call_suffix $$$A))'
      replace: '%call($F, $$$A)'
    - match: '(call_expression $F (call_suffix $$$A))'
      replace: '%call($F, $$$A)'
