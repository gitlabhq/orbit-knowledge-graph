stages:
  def_types:
    - stage: def_type
      rewrite:
        - '(__def (__function))': '#def_type=Function'
        - '(__def (__method))': '#def_type=Method'
        - '(__def (__class))': '#def_type=Class'
        - '(__def (__struct))': '#def_type=Struct'
        - '(__def (__interface))': '#def_type=Interface'
        - '(__def (__enum))': '#def_type=Enum'
        - '(__def (__enum_variant))': '#def_type=EnumVariant'
        - '(__def (__trait))': '#def_type=Trait'
        - '(__def (__impl))': '#def_type=Impl'
        - '(__def (__variable))': '#def_type=Variable'
        - '(__def (__constant))': '#def_type=Constant'
        - '(__def (__static_constant))': '#def_type=Static'
        - '(__def (__lambda))': '#def_type=Lambda'
        - '(__def (__field_def))': '#def_type=Field'
        - '(__def (__property))': '#def_type=Property'
        - '(__def (__type_alias))': '#def_type=TypeAlias'
  display_wildcard_imports:
    - stage: imports
      rewrite:
        - '(__import)': '#entity=ImportedSymbol #file_path=$ROOT | ancestor_tag("file_path") #source_path=$ROOT | child_sym("__source")'
        - '(__name "*")': '#import_type=WildcardImport #resolved=$ROOT | has_incoming("Imports")'
        - '(__name (__alias))': '#import_type=AliasedImport #resolved=$ROOT | has_incoming("Imports")'
        - '(__name)': '#resolved=$ROOT | has_incoming("Imports")'
  display_imports:
    - stage: imports
      rewrite:
        - '(__import)': '#entity=ImportedSymbol #file_path=$ROOT | ancestor_tag("file_path") #source_path=$ROOT | child_sym("__source")'
        - '(__name)': '#resolved=$ROOT | has_incoming("Imports")'
  def_fqn_dotted_except_impl:
    - '(__def !(__impl))': '#entity=Definition #fqn=$ROOT | ancestor_tag("fqn") | concat(".", $ROOT | child_sym("__defname")) | keep_last(".", 64, 4096) #file_path=$ROOT | ancestor_tag("file_path")'
    - '(__def (__impl))': '#entity=Definition #file_path=$ROOT | ancestor_tag("file_path")'
  type_def_types:
    - '(__def (__class))': '#def_type=Class'
    - '(__def (__struct))': '#def_type=Struct'
    - '(__def (__interface))': '#def_type=Interface'
    - '(__def (__enum))': '#def_type=Enum'
    - '(__def (__enum_variant))': '#def_type=EnumVariant'
    - '(__def (__trait))': '#def_type=Trait'
    - '(__def (__impl))': '#def_type=Impl'
    - '(__def (__variable))': '#def_type=Variable'
    - '(__def (__constant))': '#def_type=Constant'
    - '(__def (__lambda))': '#def_type=Lambda'
    - '(__def (__field_def))': '#def_type=Field'
    - '(__def (__property))': '#def_type=Property'
    - '(__def (__type_alias))': '#def_type=TypeAlias'
  import_entity:
    - '(__import)': '#entity=ImportedSymbol #file_path=$ROOT | ancestor_tag("file_path") #source_path=$ROOT | child_sym("__source")'
  aliased_import_type:
    - '(__name (__alias))': '#import_type=AliasedImport #resolved=$ROOT | has_incoming("Imports")'
  def_fqn_colons_except_impl:
    - '(__def !(__impl))': '#entity=Definition #fqn=$ROOT | ancestor_tag("fqn") | concat("::", $ROOT | child_sym("__defname")) | keep_last("::", 64, 4096) #file_path=$ROOT | ancestor_tag("file_path")'
    - '(__def (__impl))': '#entity=Definition #file_path=$ROOT | ancestor_tag("file_path")'
  def_fqn_dotted:
    - '(__def)': '#entity=Definition #fqn=$ROOT | ancestor_tag("fqn") | concat(".", $ROOT | child_sym("__defname")) | keep_last(".", 64, 4096) #file_path=$ROOT | ancestor_tag("file_path")'
  def_fqn_colons:
    - '(__def)': '#entity=Definition #fqn=$ROOT | ancestor_tag("fqn") | concat("::", $ROOT | child_sym("__defname")) | keep_last("::", 64, 4096) #file_path=$ROOT | ancestor_tag("file_path")'
  value_def_types:
    - '(__def (__variable))': '#def_type=Variable'
    - '(__def (__constant))': '#def_type=Constant'
    - '(__def (__static_constant))': '#def_type=Static'
    - '(__def (__lambda))': '#def_type=Lambda'
  function_def_types:
    - '(__def (__function))': '#def_type=Function'
    - '(__def (__method))': '#def_type=Method'
