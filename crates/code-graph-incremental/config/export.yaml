# How the canonical tree becomes the ontology's local tables.
#
# Every column carries an explicit type, and loading checks each table
# against the ontology: a column missing here, a column unknown to the
# ontology, or a type or nullability the two disagree on is a load error.
#
# Entities are node kinds. Directories and files come from the project tree
# (`__root` over `__dir` and `__file`), and each parsed file's `__source_file`
# root stands in for its `__file` node, so an ancestor walk from a definition
# reaches its file, then its directories.
#
# A column is filled by one of:
#   from: <transforms>   the rule-file transform language, run on the row's
#                        node: tag("k"), ancestor_tag("k"), child_sym("kind"),
#                        ancestor_sym("kind"), tree_path(sep), split_last(sep),
#                        or(a, b), default(v), regex_*, ... Omitted: the
#                        node's own text.
#   const: <text>        a literal
#   position: <which>    start_line | end_line | start_byte | end_byte |
#                        start_col | end_col
#     span: [...]        which node the position measures: the first candidate
#                        that applies, else the row's node. `tag:<key>` applies
#                        when the node carries the tag; `<kind>` when it has
#                        such a child.
# `on: expanded` runs the column on the child produced by `expand:` (the node
# itself when there was nothing to expand).
#
# The caller hands in an envelope of named values (project id, branch,
# commit); `header` binds them to the columns every row starts with, and
# `ids.prefix` says which of them seed every row id. `from: id` is the row's
# own id. An entity's `id` names its seed and the columns hashed after the
# prefix; `span` adds the node's byte range. This mirrors the code-graph
# scheme so both pipelines agree on ids.

ids:
  prefix: [project_id, branch]

header:
  - { name: id, type: Int64, from: id }
  - { name: project_id, type: Int64, from: project_id }
  - { name: branch, type: Utf8, from: branch }
  - { name: commit_sha, type: Utf8, from: commit_sha }
  - { name: traversal_path, type: Utf8, const: "" }

entities:
  Directory:
    source: __dir|__root
    id: { seed: dir, columns: [path] }
    columns:
      - { name: path, type: Utf8, from: tree_path("/")|default(".") }
      # id| makes this a pipeline; a bare default() is skipped on the root's empty text.
      - { name: name, type: Utf8, from: id|default(".") }

  File:
    source: __source_file
    id: { seed: file, columns: [path] }
    columns:
      - { name: path, type: Utf8 }
      - { name: name, type: Utf8, from: split_last("/") }
      - { name: extension, type: Utf8, from: split_last("/")|split_last(".") }
      - { name: language, type: Utf8, from: tag("language") }
      - { name: size_bytes, type: Int64, position: end_byte }
      - { name: skip_reason, type: Utf8, from: tag("reason") }
      - { name: is_test, type: Boolean, from: tag("is_test")|default("false") }
      - name: is_generated
        type: Boolean
        from: 'concat(":", "tag:generated", "id")|regex_match("^true:|\.min\.(js|css)$|\.pb\.go$|_pb2(_grpc)?\.py$|\.g\.dart$|\.designer\.cs$|\.generated\.\w+$|(^|[:/])(gen|generated)/")'
      - name: is_vendored
        type: Boolean
        from: regex_match("(^|/)(vendor|vendors|node_modules|third_party|bower_components|Pods|Carthage)/")

  Definition:
    source: __def
    exclude_tag: { kind: [Impl] }
    id: { seed: def, columns: [file_path, fqn, kind, signature] }
    columns:
      - { name: file_path, type: Utf8, from: ancestor_tag("file_path") }
      - { name: language, type: Utf8, from: tag("language") }
      - { name: fqn, type: Utf8, from: tag("fqn"), cap: 1024 }
      - { name: name, type: Utf8, from: child_sym("__defname"), cap: 512 }
      - { name: signature, type: Utf8, from: tag("signature"), cap: 2048 }
      - { name: parameters, type: ListUtf8, from: tag("parameters"), split: "\x1f", max: 64, cap: 512 }
      - { name: return_type, type: Utf8, nullable: true, from: tag("return_type"), cap: 512 }
      - { name: declared_type, type: Utf8, nullable: true, from: tag("declared_type"), cap: 1024 }
      - { name: doc_comment, type: Utf8, from: tag("doc_comment"), cap: 1024, over: words }
      - name: category
        type: Utf8
        from: tag("kind")|map("Class:Type", "Struct:Type", "Interface:Type", "Trait:Type", "Enum:Type", "TypeAlias:Type", "Function:Callable", "Method:Callable", "Constructor:Callable", "Test:Callable", "Field:Value", "Constant:Value", "Variable:Value", "EnumMember:Value", "Module:Module", "Macro:Macro")
      - { name: kind, type: Utf8, from: tag("kind") }
      - { name: language_kind, type: Utf8, from: 'or("tag:language_kind", "tag:kind")' }
      - name: scope
        type: Utf8
        from: ancestor_tag("kind")|map("Function:local", "Method:local", "Constructor:local", "Test:local", "Class:member", "Struct:member", "Interface:member", "Trait:member", "Enum:member", "TypeAlias:member", "Module:member", "Impl:member", "Field:member", "Constant:member", "Variable:member", "EnumMember:member", "Macro:member")|default("top_level")
      - { name: modifiers, type: ListUtf8, from: tag("modifiers"), split: " ", sort: true, max: 16 }
      - { name: visibility, type: Utf8, nullable: true, from: tag("visibility") }
      - { name: generated_by, type: Utf8, nullable: true, from: tag("generated_by"), cap: 256 }
      - { name: start_line, type: Int64, position: start_line, span: [tag:definition_span, __defname] }
      - { name: end_line, type: Int64, position: end_line, span: [tag:definition_span, __defname] }
      - { name: start_byte, type: Int64, position: start_byte, span: [tag:definition_span, __defname] }
      - { name: end_byte, type: Int64, position: end_byte, span: [tag:definition_span, __defname] }
      - { name: start_column, type: Int64, position: start_col, span: [tag:definition_span, __defname] }
      - { name: end_column, type: Int64, position: end_col, span: [tag:definition_span, __defname] }

  Import:
    source: __import|__import_type
    exclude_parent: __module_export
    expand: __name
    id: { seed: import, columns: [file_path, import_path, name, alias, span] }
    columns:
      - { name: file_path, type: Utf8, from: ancestor_tag("file_path") }
      - name: import_kind
        type: Utf8
        on: expanded
        from: or("tag:import_kind", "ancestor_tag:import_kind")|default("symbol")
      - name: language_kind
        type: Utf8
        on: expanded
        from: or("tag:import_type", "ancestor_tag:import_type")|default("NamedImport")
      - { name: import_path, type: Utf8, from: tag("source_path"), cap: 1024, over: drop }
      - { name: name, type: Utf8, on: expanded, cap: 512, over: drop }
      - { name: alias, type: Utf8, on: expanded, from: ancestor_sym("__alias"), cap: 256, over: empty }
      - { name: fqn, type: Utf8, nullable: true, on: expanded, from: tag("fqn"), cap: 1024, over: empty }
      - name: is_external
        type: Boolean
        on: expanded
        from: has_outgoing("Imports", "parent")|map("true:false", "false:true")
      - { name: start_line, type: Int64, position: start_line }
      - { name: end_line, type: Int64, position: end_line }
      - { name: start_byte, type: Int64, position: start_byte }
      - { name: end_byte, type: Int64, position: end_byte }
      - { name: start_column, type: Int64, position: start_col }
      - { name: end_column, type: Int64, position: end_col }

# The edge table. `containment` rows link each `to` entity to its nearest
# enclosing `from` entity. `graph` rows come from the resolver, matched on
# edge kind and the entities at each end; all rows collapse to one
# row per source, target and kind.
edges:
  columns:
    - { name: source_id, type: Int64, from: source.id }
    - { name: source_kind, type: Utf8, from: source.entity }
    - { name: relationship_kind, type: Utf8, from: kind }
    - { name: target_id, type: Int64, from: target.id }
    - { name: target_kind, type: Utf8, from: target.entity }
    - { name: traversal_path, type: Utf8, const: "" }
    - { name: lines, type: ListInt64, from: lines }
    - { name: resolution, type: Utf8, from: resolution }
    - { name: access, type: Utf8, const: "" }
    - { name: usage, type: Utf8, const: "" }
  containment:
    - { from: Directory, to: Directory, kind: CONTAINS }
    - { from: Directory, to: File, kind: CONTAINS }
    - { from: File, to: Definition, kind: DEFINES }
    - { from: File, to: Import, kind: DEFINES }
  graph:
    - { edge: Calls, to: Definition, site: [__decorator], kind: ANNOTATED_BY }
    - { edge: Imports, from: Definition, to: Import, site: [__decorator], kind: ANNOTATED_BY }
    - { edge: Calls, to: Definition, site_child: __type=parameter, kind: USES_TYPE, set: { usage: parameter } }
    - { edge: Calls, to: Definition, site_child: __type=return, kind: USES_TYPE, set: { usage: return } }
    - { edge: Calls, to: Definition, site_child: __type=generic, kind: USES_TYPE, set: { usage: generic } }
    - { edge: Calls, to: Definition, site_child: __type=cast, kind: USES_TYPE, set: { usage: cast } }
    - { edge: Calls, to: Definition, site_child: __type, kind: USES_TYPE, set: { usage: field } }
    - { edge: Calls, to: Definition, reference: true, kind: USES_VALUE, set: { access: read } }
    - edge: Calls
      to: Definition
      site: [__call]
      receiver: true
      target_tag: { kind: [Class, Struct, Interface, Trait, Enum, TypeAlias, Module] }
      kind: USES_VALUE
      set: { access: read }
    - edge: Calls
      to: Definition
      site: [__call]
      target_tag: { kind: [Class, Struct, Interface, Trait, Enum, TypeAlias, Module, EnumMember] }
      kind: INSTANTIATES
    - { edge: Calls, to: Definition, kind: CALLS }
    - { edge: Defines, from: Definition, to: Definition, kind: DEFINES }
    - { edge: Extends, from: Definition, to: Definition, target_tag: { kind: [Interface, Trait] }, kind: IMPLEMENTS }
    - { edge: Extends, from: Definition, to: Definition, kind: EXTENDS }
    - { edge: Overrides, from: Definition, to: Definition, kind: OVERRIDES }
    - { edge: Imports, from: Import, to: Definition, lift: File, kind: DEPENDS_ON }
    - { edge: Imports, from: Import, to: File, lift: File, kind: DEPENDS_ON }
    - { edge: Imports, from: Import, to: Definition, kind: RESOLVES_TO }
    - { edge: Imports, from: Import, to: File, kind: RESOLVES_TO }
    - { edge: Imports, from: Definition, to: Import, kind: CALLS, fallback: true }
    - { edge: Imports, from: File, to: Import, kind: CALLS, fallback: true }
