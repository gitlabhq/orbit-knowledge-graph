ids:
  prefix: [project_id, branch]

header:
  - { name: id, type: Int64, from: id }
  - { name: project_id, type: Int64, from: project_id }
  - { name: branch, type: Utf8, from: branch }
  - { name: commit_sha, type: Utf8, from: commit_sha }
  - { name: traversal_path, type: Utf8, const: "" }

entities:
  Directory:
    source: __dir|__root
    id: { seed: dir, columns: [path] }
    columns:
      - { name: path, type: Utf8, from: tree_path("/")|default(".") }
      - { name: name, type: Utf8, from: default(".") }

  File:
    source: __source_file
    id: { seed: file, columns: [path] }
    columns:
      - { name: path, type: Utf8 }
      - { name: name, type: Utf8, from: split_last("/") }
      - { name: extension, type: Utf8, from: split_last("/")|split_last(".") }
      - { name: language, type: Utf8, from: tag("language") }
      - { name: size_bytes, type: Int64, position: end_byte }
      - { name: reason, type: Utf8, from: tag("reason") }

  Definition:
    source: __def
    id: { seed: def, columns: [file_path, fqn, span] }
    columns:
      - { name: file_path, type: Utf8, from: ancestor_tag("file_path") }
      - { name: fqn, type: Utf8, from: tag("fqn") }
      - { name: name, type: Utf8, from: child_sym("__defname") }
      - { name: definition_type, type: Utf8, from: tag("def_type") }
      - { name: start_line, type: Int64, position: start_line, span: [tag:definition_span, __defname] }
      - { name: end_line, type: Int64, position: end_line, span: [tag:definition_span, __defname] }
      - { name: start_byte, type: Int64, position: start_byte, span: [tag:definition_span, __defname] }
      - { name: end_byte, type: Int64, position: end_byte, span: [tag:definition_span, __defname] }
      - { name: start_char, type: Int64, position: start_col, span: [tag:definition_span, __defname] }
      - { name: end_char, type: Int64, position: end_col, span: [tag:definition_span, __defname] }
      - { name: signature, type: Utf8, from: default("") }
      - { name: front_matter_name, type: Utf8, from: child_sym("__front_matter_name") }
      - { name: front_matter_description, type: Utf8, from: child_sym("__front_matter_description") }
      - { name: front_matter_license, type: Utf8, from: child_sym("__front_matter_license") }
      - { name: front_matter_compatibility, type: Utf8, from: child_sym("__front_matter_compatibility") }
      - { name: front_matter_allowed_tools, type: Utf8, from: child_sym("__front_matter_allowed_tools") }
      - { name: front_matter_metadata, type: Utf8, from: child_sym("__front_matter_metadata") }
      - { name: front_matter_title, type: Utf8, from: child_sym("__front_matter_title") }
      - { name: front_matter_stage, type: Utf8, from: child_sym("__front_matter_stage") }
      - { name: front_matter_group, type: Utf8, from: child_sym("__front_matter_group") }
      - { name: front_matter_info, type: Utf8, from: child_sym("__front_matter_info") }
      - { name: front_matter_version, type: Utf8, from: child_sym("__front_matter_version") }
      - { name: front_matter_category, type: Utf8, from: child_sym("__front_matter_category") }

  ImportedSymbol:
    source: __import|__import_type
    exclude_parent: __module_export
    expand: __name
    id: { seed: import, columns: [file_path, import_path, identifier_name, identifier_alias, span] }
    columns:
      - { name: file_path, type: Utf8, from: ancestor_tag("file_path") }
      - name: import_type
        type: Utf8
        on: expanded
        from: or("tag:import_type", "ancestor_tag:import_type")|default("NamedImport")
      - { name: import_path, type: Utf8, from: tag("source_path") }
      - { name: identifier_name, type: Utf8, on: expanded }
      - { name: identifier_alias, type: Utf8, on: expanded, from: ancestor_sym("__alias") }
      - { name: start_line, type: Int64, position: start_line }
      - { name: end_line, type: Int64, position: end_line }
      - { name: start_byte, type: Int64, position: start_byte }
      - { name: end_byte, type: Int64, position: end_byte }
      - { name: start_char, type: Int64, position: start_col }
      - { name: end_char, type: Int64, position: end_col }

edges:
  columns:
    - { name: source_id, type: Int64, from: source.id }
    - { name: source_kind, type: Utf8, from: source.entity }
    - { name: relationship_kind, type: Utf8, from: kind }
    - { name: target_id, type: Int64, from: target.id }
    - { name: target_kind, type: Utf8, from: target.entity }
    - { name: traversal_path, type: Utf8, const: "" }
  containment:
    - { from: Directory, to: Directory, kind: CONTAINS }
    - { from: Directory, to: File, kind: CONTAINS }
    - { from: File, to: Definition, kind: DEFINES }
    - { from: File, to: ImportedSymbol, kind: IMPORTS }
  graph:
    - { edge: Calls, to: Definition, kind: CALLS }
    - { edge: Defines, from: Definition, to: Definition, kind: DEFINES }
    - { edge: Extends, from: Definition, to: Definition, kind: EXTENDS }
    - { edge: Imports, from: ImportedSymbol, to: Definition, kind: IMPORTS }
    - { edge: Imports, from: Definition, to: ImportedSymbol, kind: CALLS, fallback: true }
    - { edge: Links, from: File, to: File, kind: IMPORTS }
    - { edge: Links, from: File, to: Definition, kind: IMPORTS }
    - { edge: Links, from: Definition, to: File, kind: IMPORTS }
    - { edge: Links, from: Definition, to: Definition, kind: IMPORTS }
