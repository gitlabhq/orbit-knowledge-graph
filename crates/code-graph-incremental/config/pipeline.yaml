scopes: [__def]
edges: [calls, defines, imports, extends, type_flow, links]

phases:
  - { name: canonicalize, over: tree, does: rewrite, budget: { label: rewrite, tree: file_rewrite_ms, skip: skip_timeout_walk } }
  - { name: normalize, over: tree, does: rewrite, budget: { label: rewrite, tree: file_rewrite_ms, skip: skip_timeout_walk } }
  - name: link
    over: tree
    does: edges
    bind: { core.read: ssa.flow, ssa.value_of: value_of, ssa.valued: valued, ssa.source: source }
    budget: { tree: file_link_ms, skip: skip_timeout_ssa }
  - { name: project, over: project, does: rewrite }
  - name: resolve
    over: family
    does: edges
    until: stable
    budget: { scope: cross_file_resolve_ms }
    bind: { core.read: resolved }
  - { name: display, over: tree, does: tags }
  - { name: export, over: graph, does: rows }
