scopes: [__def]

phases:
  - { name: canonicalize, over: tree, does: rewrite, budget: { label: rewrite, tree: file_rewrite_ms } }
  - { name: normalize, over: tree, does: rewrite, budget: { label: rewrite, tree: file_rewrite_ms } }
  - name: link
    over: tree
    does: edges
    bind: { core.read: ssa.flow, ssa.value_of: core.value_of, ssa.valued: core.valued, ssa.source: source }
    budget: { tree: file_link_ms }
  - { name: project, over: project, does: rewrite }
  - name: resolve
    over: family
    does: edges
    until: stable
    bind: { core.read: resolved }
  - { name: display, over: tree, does: tags }
  - { name: export, over: graph, does: rows }
