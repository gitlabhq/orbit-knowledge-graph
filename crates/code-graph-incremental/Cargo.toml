[package]
name = "code-graph-incremental"
version.workspace = true
edition = "2024"
license = "LicenseRef-EE"

[package.metadata.cargo-shear]
ignored = ["pest"] # used by pest_derive-generated code

[lints]
workspace = true

[features]
pretty-print = []

[dependencies]
arrow = { workspace = true }
cpu-time = { workspace = true }
either = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
indextree = "4.9"
itertools = "0.14"
lasso = { version = "0.7", features = ["multi-threaded", "ahasher"] }
pest = { workspace = true }
pest_consume = { workspace = true }
pest_derive = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true }
rkyv = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
stacker = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
zstd = "0.14"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64", "xxhash3_128"] }
tree-sitter = "0.26.3"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-elixir = "0.3.5"
tree-sitter-go = "0.25.0"
tree-sitter-hcl = "1.1.0"
tree-sitter-java = "0.23.0"
tree-sitter-kotlin-sg = "0.4.0"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.0"
tree-sitter-rust = "0.24.0"
tree-sitter-scala = "0.24.0"
tree-sitter-swift = "0.7.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
tree-sitter-haskell = "0.23.1"
tree-sitter-ocaml = "0.25.0"
ontology = { path = "../ontology" }
orbit-utils = { path = "../utils" }
orbit-arrow = { path = "../utils/arrow" }

[dev-dependencies]
termtree = "1.0"
tempfile = { workspace = true }
zstd = "0.14"
