[package]
name = "code-graph-incremental"
version.workspace = true
edition = "2024"
license = "LicenseRef-EE"

[package.metadata.cargo-shear]
ignored = ["pest"] # used by pest_derive-generated code

[lints]
workspace = true

[features]
pretty-print = []

[dependencies]
arrow = { workspace = true }
cpu-time = { workspace = true }
either = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
indextree = { workspace = true }
itertools = { workspace = true }
lasso = { workspace = true, features = ["multi-threaded", "ahasher"] }
pest = { workspace = true }
pest_consume = { workspace = true }
pest_derive = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true }
rkyv = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
stacker = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
twox-hash = { workspace = true, features = ["xxhash3_64", "xxhash3_128"] }
zstd = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-containerfile = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-elixir = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-hcl = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-kotlin-sg = { workspace = true }
tree-sitter-lua = { workspace = true }
tree-sitter-php = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-scala = { workspace = true }
tree-sitter-swift = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-zig = { workspace = true }
tree-sitter-haskell = { workspace = true }
tree-sitter-ocaml = { workspace = true }
ontology = { path = "../ontology" }
orbit-utils = { path = "../utils", features = ["markdown"] }
orbit-arrow = { path = "../utils/arrow" }

[dev-dependencies]
arrow = { workspace = true, features = ["ipc"] }
termtree = { workspace = true }
tempfile = { workspace = true }
zstd = { workspace = true }
