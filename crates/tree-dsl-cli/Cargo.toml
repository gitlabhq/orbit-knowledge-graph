[package]
name = "tree-dsl-cli"
version = "0.1.0"
edition = "2024"

[features]
default = ["test-runner"]
test-runner = ["dep:tree-dsl-tests"]

[dependencies]
tree-dsl = { path = "../tree-dsl" }
tree-dsl-tests = { path = "../tree-dsl-tests", optional = true }
clap = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
walkdir = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "tree-dsl"
path = "src/main.rs"
