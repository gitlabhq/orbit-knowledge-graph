[package]
name = "query-data-model"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
jsonschema = { workspace = true }
ontology = { path = "../ontology" }
orbit-utils = { path = "../utils" }
pest = { workspace = true }
pest_consume = { workspace = true }
pest_derive = { workspace = true }
rust-embed = { workspace = true, features = ["include-exclude"] }
serde = { workspace = true }
serde-saphyr = { workspace = true, optional = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }

[features]
from-ontology = ["dep:serde-saphyr"]

[dev-dependencies]
query-data-model = { path = ".", features = ["from-ontology"] }

[lints]
workspace = true
