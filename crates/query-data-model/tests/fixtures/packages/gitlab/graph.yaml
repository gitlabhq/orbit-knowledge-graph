kind: graph
package: gitlab
domain: core
entities:
  Group:
    identity: id
    label: full_path
    default_columns: [id, name, full_path]
    properties:
      id: int64
      name: string
      full_path: { type: string, unique: true }
      traversal_path: string
  Project:
    identity: id
    label: full_path
    default_columns: [id, name, full_path]
    properties:
      id: int64
      name: string
      full_path: { type: string, unique: true }
      traversal_path: string
  User:
    identity: id
    label: username
    default_columns: [id, username]
    properties:
      id: int64
      username: { type: string, unique: true }
      email: string?
  MergeRequest:
    description: A merge request for code review.
    identity: id
    label: title
    default_columns: [id, iid, title, state]
    properties:
      id: int64
      iid: int64
      title: { type: string, default: "" }
      state:
        type: enum
        values: { 1: opened, 2: closed, 3: merged, 4: locked }
        terminal: [merged]
      project_id: int64
      author_id: int64?
      diff: string?
      traversal_path: string
  Note:
    identity: id
    label: body
    default_columns: [id, body]
    properties:
      id: int64
      body: string
      project_id: int64
      author_id: int64?
      traversal_path: string
relationships:
  CONTAINS:
    variants:
      Group -> Project: { cardinality: one_to_many }
      Group -> Group: { cardinality: one_to_many }
  IN_PROJECT:
    variants:
      MergeRequest -> Project: { cardinality: many_to_one }
      Note -> Project: { cardinality: many_to_one }
  AUTHORED:
    variants:
      User -> MergeRequest: { cardinality: one_to_many }
      User -> Note: { cardinality: one_to_many }
  HAS_NOTE:
    variants:
      MergeRequest -> Note: { cardinality: one_to_many }
