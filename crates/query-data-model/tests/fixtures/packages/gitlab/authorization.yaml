kind: authorization
package: gitlab
permissions: [read, read_developer, read_maintainer, read_group, read_merge_request, read_note, read_project]
scopes:
  namespace: {kind: hierarchy, provider: gitlab_session}
  global: {kind: global, provider: gitlab_session}
entities:
  Group:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_group, resource: group}]
    properties:
      open: [id, name, full_path]
      hidden: [traversal_path]

  Project:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_project, resource: project}]
    properties:
      open: [id, name, full_path]
      hidden: [traversal_path]

  User:
    scope: global
    permission: read
    checks: open
    properties:
      open: [id, username]
      admin_exact: [email]

  MergeRequest:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_merge_request, resource: merge_request}]
    properties:
      open: [id, iid, title, state, project_id, author_id, diff]
      hidden: [traversal_path]

  Note:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_note, resource: note}]
    properties:
      open: [id, body, project_id, author_id]
      hidden: [traversal_path]

relationships:
  AUTHORED:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  CONTAINS:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: nested}}
  HAS_NOTE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  IN_PROJECT:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: holder}}
