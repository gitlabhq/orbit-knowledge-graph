kind: graph
package: tenant.agent_memory
domain: agents
entities:
  AgentMemory:
    description: A fact an agent saved while it worked in a project.
    identity: id
    label: summary
    default_columns: [id, summary, created_at]
    properties:
      id: int64
      summary: string
      created_at: timestamp
      project_id: int64
      traversal_path: string
relationships:
  IN_PROJECT:
    variants:
      AgentMemory -> Project: { cardinality: many_to_one }
  REMEMBERS:
    variants:
      AgentMemory -> MergeRequest: { cardinality: many_to_many }
      AgentMemory -> Note: { cardinality: many_to_many }
