kind: storage
package: integration.linear
store: graph
entities:
  LinearIssue:
    table: gl_linear_issue
    columns:
      id: { immutable: true, backend: { type: Int64 } }
      title: { backend: { type: String } }
      body: { backend: { type: String } }
      state: { backend: { type: LowCardinality(String) } }
      merge_request_id: { backend: { type: Nullable(Int64) } }
      traversal_path: { backend: { type: String } }
    access: { text: [title], order: [id] }
relationships:
  CLOSES:
    MergeRequest -> LinearIssue: { edge_table: gl_edge }
  RELATES_TO:
    LinearIssue -> MergeRequest: { edge_table: gl_edge }
