kind: authorization
package: integration.linear
entities:
  LinearIssue:
    scope: namespace
    permission: read_maintainer
    enforce: {clickhouse: {scope_key: traversal_path}}
    properties:
      open: [id, title, body, state, merge_request_id]
      hidden: [traversal_path]

relationships:
  CLOSES:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  RELATES_TO:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
