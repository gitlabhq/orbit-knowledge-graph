kind: source
package: integration.linear
source: data_lake
declare:
  connection: datalake
  version: _version
  watermark: _watermark
  deleted: _deleted
entities:
  LinearIssue:
    tables: [linear_tickets]
    order_by: [traversal_path, id]
    query: generated
    edges:
    - {label: RELATES_TO, from: {field: id, kind: LinearIssue}, to: {field: merge_request_id, kind: MergeRequest}}
relationships:
  CLOSES:
    pipelines:
      CLOSES_linear_closings:
        tables: [linear_closings]
        fields: [merge_request_id, issue_id]
        order_by: [traversal_path, id]
        query: generated
        from: {field: merge_request_id, kind: MergeRequest}
        to: {field: issue_id, kind: LinearIssue}
