kind: graph
package: integration.linear
domain: planning
entities:
  LinearIssue:
    description: A Linear ticket linked to GitLab work.
    label: title
    defaults: [id, title, state]
    properties:
      id: int64
      title: string
      body: string
      state:
        type: enum
        stored_as_text: true
        values: { 0: backlog, 1: todo, 2: in_progress, 3: done, 4: canceled }
      merge_request_id: int64?
      traversal_path: string
relationships:
  CLOSES:
    description: A Linear ticket closed by a merge request.
    variants:
      MergeRequest -> LinearIssue: { cardinality: many_to_many }
  RELATES_TO:
    variants:
      LinearIssue -> MergeRequest: { cardinality: many_to_one }
