# Scheduled e2e pin bumper. Token provisioned by infra-mgmt terraform
# (environments/release-platform/knowledge-graph.tf). Setup: create a daily
# pipeline schedule with SCHEDULE_ONLY=e2e-pin-bump; rehearse once with
# DRY_RUN=true on the schedule.
e2e-pin-bump:
  extends: .automation-bot
  stage: review
  needs: []
  variables:
    DRY_RUN: "false"
  rules:
    - if: $CI_PROJECT_ID != $CANONICAL_PROJECT_ID
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_ONLY == "e2e-pin-bump"
  before_script:
    - test -n "${AUTOMATION_BOT_TOKEN}" || (echo "Missing AUTOMATION_BOT_TOKEN from Vault" && exit 1)
    - apk add --no-cache bash curl python3 git coreutils yq
    # The project-level GITLAB_TOKEN variable outranks glab auth login config,
    # so override it or glab acts as that token's bot.
    - export GITLAB_TOKEN="$AUTOMATION_BOT_TOKEN"
  script:
    - bash scripts/ci/open-e2e-bump-mr.sh

# Commits the Rails contract snapshot that e2e exported from the newly pinned
# GitLab, so the pin bump MR also carries the matching snapshot.
rails-contract-sync:
  extends: .automation-bot
  stage: review
  needs:
    - job: e2e
      artifacts: true
  variables:
    DRY_RUN: "false"
  rules:
    - if: $CI_PROJECT_ID != $CANONICAL_PROJECT_ID
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == 'automation/e2e-pin-bump'
  before_script:
    - test -n "${AUTOMATION_BOT_TOKEN}" || (echo "Missing AUTOMATION_BOT_TOKEN from Vault" && exit 1)
    - apk add --no-cache bash git coreutils
  script:
    - bash scripts/ci/sync-rails-contract.sh
