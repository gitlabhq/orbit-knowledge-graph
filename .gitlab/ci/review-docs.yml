.review-docs:
  image: ruby:3.3-alpine3.23
  extends:
    - .canonical-mr-only-rules
  stage: review
  cache: {}
  dependencies: []
  before_script:
  - gem install gitlab --no-doc
  - apk add --update openssl
  - wget https://gitlab.com/gitlab-org/gitlab/-/raw/master/scripts/trigger-build.rb
  - chmod 755 trigger-build.rb
  secrets:
    DOCS_PROJECT_API_TOKEN:
      gitlab_secrets_manager:
        name: DOCS_PROJECT_API_TOKEN
        source: group/gitlab-org
      file: false
    DOCS_TRIGGER_TOKEN:
      gitlab_secrets_manager:
        name: DOCS_TRIGGER_TOKEN
        source: group/gitlab-org
      file: false
  variables:
    GIT_STRATEGY: none
    DOCS_GITLAB_REPO_SUFFIX: orbit
    DOCS_BRANCH: main
  when: manual

review-docs-deploy:
  extends:
  - .review-docs
  environment:
    name: review/mr-${CI_MERGE_REQUEST_IID}
    url: https://docs-upstream-${DOCS_GITLAB_REPO_SUFFIX}-${CI_MERGE_REQUEST_IID}.gitlab-marketing.workers.dev/${DOCS_GITLAB_REPO_SUFFIX}
    auto_stop_in: 2 weeks
    on_stop: review-docs-cleanup
  script:
  - ./trigger-build.rb docs deploy

review-docs-cleanup:
  extends:
  - .review-docs
  environment:
    name: review/mr-${CI_MERGE_REQUEST_IID}
    action: stop
  script:
  - ./trigger-build.rb docs cleanup
