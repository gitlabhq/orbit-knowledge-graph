# Single manual trigger that spawns a child pipeline with prepare/run/cleanup.
# Shows as one collapsible "ra_bench" block in the pipeline UI.
# Gate label: orbit::bench
ra_bench:
  stage: benchmark
  rules:
    - if: $CI_MERGE_REQUEST_LABELS !~ /\borbit::bench\b/
      when: never
    - when: manual
  variables:
    RUN_ID: "ra-${CI_PIPELINE_ID}"
  trigger:
    include: .gitlab/ci/ra-bench-child.yml
    strategy: depend
