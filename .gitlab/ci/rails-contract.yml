# Checks the ontology redaction config against the Rails side of the GitLab
# that e2e pins: export the contract from the pinned CNG toolbox image, then
# run the ontology contract test on it.
.rails-contract-rules:
  rules:
    - !reference [.skip-on-solo-schedule, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - config/ontology/**/*
        - crates/ontology/**/*
        - e2e/config/versions.yaml
        - scripts/rails-contract/**/*
        - .gitlab/ci/rails-contract.yml
      interruptible: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

rails-contract-image:
  stage: lint
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  extends:
    - .rails-contract-rules
  needs: []
  script:
    - apk add --no-cache bash yq
    - echo "RAILS_CONTRACT_TOOLBOX_IMAGE=$(bash scripts/rails-contract/toolbox-image.sh)" | tee rails-contract-image.env
  artifacts:
    reports:
      dotenv: rails-contract-image.env

rails-contract-export:
  stage: lint
  image:
    name: $RAILS_CONTRACT_TOOLBOX_IMAGE
    entrypoint: [""]
  tags:
    - saas-linux-medium-amd64
  extends:
    - .rails-contract-rules
  needs:
    - rails-contract-image
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: git
    POSTGRES_PASSWORD: secure password
    POSTGRES_DB: gitlabhq_production
    RAILS_ENV: production
    GITLAB_LICENSE_MODE: test
  script:
    - bash scripts/rails-contract/export-in-toolbox.sh rails-contract.json
  artifacts:
    paths:
      - rails-contract.json
    expire_in: 1 week

rails-contract-check:
  stage: lint
  extends:
    - .job-template
    - .sccache-template
    - .rails-contract-rules
  needs:
    - rails-contract-export
  variables:
    RAILS_CONTRACT_SNAPSHOT: $CI_PROJECT_DIR/rails-contract.json
  script:
    - mise run rails-contract:check
