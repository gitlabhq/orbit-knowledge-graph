# Per-MR Orbit performance test against a real (small-scale) caproni + Orbit
# stack, seeded with an xtask-generated synthetic graph.
#
# Flow (all in one job; see scripts/ci/orbit-perf.sh):
#   1. build xtask + `synth generate` a synthetic graph (Parquet)   -- this repo
#   2. clone gitlab-caproni + `caproni up` with the orbit fragment  -- real stack
#   3. bulk-load the Parquet straight into gkg's ClickHouse (v<N>_gl_*)
#   4. port-forward gkg gRPC + run the gRPC load test (cargo xtask loadtest)
#
# Synthetic bulk-load deliberately bypasses siphon CDC / project seeding / code
# indexing (those only exist to populate the graph the slow way).
#
# Runs automatically on the default branch (so every merge produces a perf
# datapoint without anyone remembering to press a button) and stays available
# as a manual opt-in on MRs. allow_failure everywhere because it is heavy
# (~30-45 min) and pulls up a full cluster, so a perf blip must not break main.
#
# Splitting the xtask build into a per-release prebuilt artifact is a follow-up.
orbit-perf:
  extends:
    - .job-template      # rust + mise build image
    - .sccache-template  # shared sccache (fast xtask build)
  stage: benchmark
  needs: []
  # Not interruptible: on the default branch the next merge would otherwise
  # auto-cancel an in-flight run and we would lose the datapoint.
  interruptible: false
  # One run at a time, so a burst of merges queues instead of standing up
  # several full clusters on large runners concurrently.
  resource_group: orbit-perf
  timeout: 2h
  tags: [saas-linux-large-amd64]
  services:
    - docker:dind
  rules:
    - if: $CI_PROJECT_ID != $CANONICAL_PROJECT_ID
      when: never
    # Solo scheduled pipelines run exactly one named job; this heavy one must
    # drop out of them (it now matches the default branch, which schedules use).
    - !reference [.skip-on-solo-schedule, rules]
    # Post-merge on the default branch: merging an MR pushes to main, which
    # fires this automatically. This is the tracked signal.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    # Still runnable on demand from an MR, opt-in because it is heavy.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      allow_failure: true
      when: manual
  variables:
    # docker:dind (mirrors caproni .integration-base)
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    FF_NETWORK_PER_BUILD: 1
    # Job knobs
    SYNTH_CONFIG: crates/xtask/simulator_medium.yaml  # ~10M edges / ~3M nodes (staging-scale)
    CAPRONI_REF: main
    ROUNDS: "5"
    CONCURRENCY: "20"
  script:
    - bash scripts/ci/orbit-perf.sh
  artifacts:
    when: always
    paths:
      - loadtest-results.md
