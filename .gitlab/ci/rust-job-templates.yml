# Trust model: scripts/ci/cargo-home-cache.sh.
.cargo-home-cache:
  paths: &cargo-home-paths
    - .cargo-cache/git/db
    - .cargo-cache/registry/cache
    - .cargo-cache/registry/index
  pull:
    key: &cargo-home-key
      prefix: cargo-home
      files:
        - Cargo.lock
    fallback_keys:
      - cargo-home-latest
    paths: *cargo-home-paths
    policy: pull
  push:
    key: *cargo-home-key
    paths: *cargo-home-paths
    # So only merged code writes the cache; set in unit-test.
    policy: $CARGO_HOME_CACHE_POLICY
  push-latest:
    key: cargo-home-latest
    paths: *cargo-home-paths
    policy: $CARGO_HOME_CACHE_POLICY

# Extend after `.job-template`; for jobs that resolve no dependencies and the release CLI builds.
.no-cargo-home-cache:
  variables:
    SKIP_CARGO_HOME_CACHE: "1"
  cache: []

.job-template:
  tags:
    - saas-linux-medium-amd64
  image: registry.gitlab.com/gitlab-org/rust/build-images/orbit-knowledge-graph-slim:test-427e34c7@sha256:fca134ea42659c363c9f57ed11503b5a134d801042125b078bcc109b17744918
  variables:
    # The slim image leaves out these tools; mise must not download them.
    MISE_DISABLE_TOOLS: "aqua:gitleaks/gitleaks,bun,cargo:cargo-bolero,cargo:cargo-cyclonedx,cargo:cargo-edit,cargo:cargo-geiger,cargo:cargo-zigbuild,clickhouse,github:duckdb/duckdb,lefthook,lychee,rumdl,vale,watchexec,zig"
    # Fail closed: an empty policy would let the runner upload.
    CARGO_HOME_CACHE_POLICY: pull
  before_script:
    - ./scripts/ci/cargo-home-cache.sh
    - mise install
  cache:
    - !reference [.cargo-home-cache, pull]

# For jobs that need a tool the slim image leaves out (bolero, cyclonedx, zig, clickhouse).
.full-build-image:
  image: registry.gitlab.com/gitlab-org/rust/build-images/orbit-knowledge-graph:latest
  variables:
    MISE_DISABLE_TOOLS: lefthook

.sccache-template:
  variables:
    CARGO_INCREMENTAL: "0"
    SCCACHE_GCS_BUCKET: "gl-knowledgegraph-sccache"
    SCCACHE_GCS_KEY_PATH: "${SCCACHE_GCS_KEY}"
    # Only protected refs write the shared cache; MR pipelines read it.
    SCCACHE_GCS_RW_MODE: "READ_ONLY"
    DUCKDB_DOWNLOAD_LIB: "1"
  before_script:
    - ./scripts/ci/cargo-home-cache.sh
    - mise install
    - |
      if [ -n "${SCCACHE_GCS_KEY}" ]; then
        export RUSTC_WRAPPER="sccache"
        # Stops sccache's `rustc +stable` probe from downloading a toolchain; it must be in cargo's env.
        export RUSTUP_AUTO_INSTALL=0
        if [ "${CI_COMMIT_REF_PROTECTED:-}" = "true" ]; then
          export SCCACHE_GCS_RW_MODE=READ_WRITE
        fi
        sccache --start-server || true
      fi
