.cargo-home-cache:
  paths: &cargo-home-paths
    - .cargo-cache/git/db
    - .cargo-cache/registry/cache
    - .cargo-cache/registry/index
  pull:
    key: &cargo-home-key
      prefix: cargo-home
      files:
        - Cargo.lock
    fallback_keys:
      - cargo-home-latest
    paths: *cargo-home-paths
    policy: pull
  push:
    key: *cargo-home-key
    paths: *cargo-home-paths
    policy: $CARGO_HOME_CACHE_POLICY
  push-latest:
    key: cargo-home-latest
    paths: *cargo-home-paths
    policy: $CARGO_HOME_CACHE_POLICY

.no-cargo-home-cache:
  variables:
    SKIP_CARGO_HOME_CACHE: "1"
  cache: []

.job-template:
  tags:
    - saas-linux-medium-amd64
  image: registry.gitlab.com/gitlab-org/rust/build-images/orbit-knowledge-graph:3775d4e@sha256:4f3e96295f9f0d83f6550e626d30df7ae4c9dbc8a31ce61605bb6f246b7d50de
  variables:
    MISE_DISABLE_TOOLS: lefthook,clickhouse
    CARGO_HOME_CACHE_POLICY: pull
  before_script:
    - ./scripts/ci/cargo-home-cache.sh
    - mise install
  cache:
    - !reference [.cargo-home-cache, pull]

.sccache-template:
  variables:
    CARGO_INCREMENTAL: "0"
    SCCACHE_GCS_BUCKET: "gl-knowledgegraph-sccache"
    SCCACHE_GCS_KEY_PATH: "${SCCACHE_GCS_KEY}"
    SCCACHE_GCS_RW_MODE: "READ_ONLY"
    DUCKDB_DOWNLOAD_LIB: "1"
  before_script:
    - ./scripts/ci/cargo-home-cache.sh
    - mise install
    - |
      if [ -n "${SCCACHE_GCS_KEY}" ]; then
        export RUSTC_WRAPPER="sccache"
        # Stops sccache's `rustc +stable` probe from downloading a toolchain; it must be in cargo's env.
        export RUSTUP_AUTO_INSTALL=0
        if [ "${CI_COMMIT_REF_PROTECTED:-}" = "true" ]; then
          export SCCACHE_GCS_RW_MODE=READ_WRITE
        fi
        sccache --start-server || true
      fi
