include:
  - project: 'gitlab-com/gl-security/security-operations/infrastructure-security-public/oidc-modules'
    ref: '3.3.0'
    file: 'templates/gcp_auth.yaml'

stages:
  - prepare
  - run
  - cleanup

.ra-bench-base:
  extends: .google-oidc:auth
  tags:
    - saas-linux-medium-amd64
  image: registry.gitlab.com/gitlab-org/rust/build-images/orbit-knowledge-graph:latest
  variables:
    KUBECTL_VERSION: "1.35.2"
    HELM_VERSION: "3.20.0"
    HELMFILE_VERSION: "1.4.2"
    RA_EPHEMERAL_CLUSTER: "1"
  before_script:
    - !reference [.google-oidc:auth, before_script]
    - bash e2e/scripts/install-ci-tools.sh

ra_bench_prepare:
  extends: .ra-bench-base
  stage: prepare
  script:
    - source bench/scripts/labels-to-env.sh
    - echo "Quota check and results bucket verification"
    - gcloud storage ls gs://gkg-ra-results/ > /dev/null 2>&1 || echo "Results bucket not accessible"
    - gcloud container clusters list --project gl-knowledgegraph-prj-f2eec59d --zone us-central1-a --format="table(name,status,currentNodeCount)"

ra_bench_run:
  extends: .ra-bench-base
  stage: run
  timeout: 3h
  needs: [ra_bench_prepare]
  script:
    - source bench/scripts/labels-to-env.sh
    - bench/scripts/provision.sh
    - |
      if [ -z "${RA_SKIP_IMPORT:-}" ]; then
        DUMP_PREFIX="${DUMP_PREFIX:-core-2026-06-25-1115}" bench/scripts/import-dump-job.sh
      fi
    - bench/scripts/run-all-phases.sh
    - uv run bench/scoring/score.py "bench/results/${RUN_ID}" "${TIER:-small}"
    - uv run bench/scoring/report.py "bench/results/${RUN_ID}" "${TIER:-small}"
  after_script:
    - !reference [.google-oidc:auth, before_script]
    - bash e2e/scripts/install-ci-tools.sh
    - bench/scripts/teardown.sh || true
  artifacts:
    paths:
      - bench/results/*/report.md
      - bench/results/*/slo_results.json
      - bench/results/*/phases.jsonl
    when: always
    expire_in: 30 days

ra_bench_cleanup:
  extends: .ra-bench-base
  stage: cleanup
  needs:
    - job: ra_bench_run
      artifacts: false
  when: always
  script:
    - source bench/scripts/labels-to-env.sh
    - bench/scripts/teardown.sh
