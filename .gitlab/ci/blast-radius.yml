# Two-way dependency blast radius (prototype).
#
# Consumer direction: an MR that bumps a lockfile version gets a per-file
# table of this project's own import sites of the bumped package, to size
# bump risk at a glance. Producer direction: an MR that changes the published
# surface (proto, Go client) gets a ranked table of downstream projects
# importing that surface (e.g. Workhorse consumes the gkgpb Go module).
# Published namespaces are auto-discovered from manifests (go.mod,
# package.json, gemspec); the Ruby proto gem has no static gemspec, so it is
# passed explicitly via --namespace.
#
# Setup: store a token as a masked CI/CD variable BLAST_RADIUS_GITLAB_TOKEN
# with `api` scope (posting the MR note needs write). The token's user must
# have Knowledge Graph access; a project access token bot may not — see the
# 403 guidance in the job log if the query is rejected.
#
# Advisory while prototyping: allow_failure keeps a failed report from
# blocking renovate MRs.
blast-radius-report:
  stage: review
  image: registry.gitlab.com/gitlab-org/cli:v1.111.0
  tags:
    - saas-linux-small-amd64
  needs: []
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PROJECT_ID != $CANONICAL_PROJECT_ID
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - Cargo.lock
        - Gemfile.lock
        - go.sum
        - "**/*.proto"
        - clients/**/*
      allow_failure: true
  before_script:
    - test -n "${BLAST_RADIUS_GITLAB_TOKEN:-}" || (echo "Missing BLAST_RADIUS_GITLAB_TOKEN" && exit 1)
    - apk add --no-cache bash git jq python3
    - export GITLAB_TOKEN="$BLAST_RADIUS_GITLAB_TOKEN"
  script:
    - |
      diff_base="${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-$CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      python3 scripts/ci/blast-radius.py "$CI_PROJECT_ID" \
        --diff-range "${diff_base}...HEAD" \
        --namespace gitlab-gkg-proto > blast-radius.md
    - cat blast-radius.md
    - bash scripts/ci/blast-radius-comment.sh blast-radius.md
  artifacts:
    paths:
      - blast-radius.md
    expire_in: 1 week
