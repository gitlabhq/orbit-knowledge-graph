repository-checks:
  extends:
    - .python-check-template
    - .mr-and-main-rules
  script:
    - apk add --no-cache jsonnet yq
    - uv run ci/run_checks.py checks

advisory-checks:
  extends:
    - .python-check-template
    - .mr-and-main-rules
  allow_failure: true
  script:
    - uv run ci/run_checks.py advisory
