[extend]
path = "/gitleaks.toml"

[[rules]]
id = "password-env-in-command"
description = "Password set inline as an environment variable, such as CLICKHOUSE_PASSWORD or PGPASSWORD"
regex = '''\b[A-Z][A-Z0-9_]*(?:PASSWORD|PASSWD|_PWD)=['"]?([^\s'"$<{.][^\s'"]{3,})'''
secretGroup = 1
keywords = ["password=", "passwd=", "_pwd="]
[[rules.allowlists]]
regexTarget = "line"
regexes = ['''(?:^|\s)-e\s+[A-Z]''', '''(?:\s-h\s*|--host[= ])(?:localhost|127\.0\.0\.1|[a-z0-9_-]+)(?:[\s:]|$)''']

[[rules]]
id = "password-flag-in-command"
description = "Password passed as a --password flag, such as clickhouse-client or nats"
regex = '''--password(?:=|\s+)['"]?([^\s'"$<{.-][^\s'"]{3,})'''
secretGroup = 1
keywords = ["--password"]

[[rules]]
id = "kubectl-literal-secret"
description = "Secret value passed to kubectl create secret --from-literal"
regex = '''(?i)--from-literal=[a-z0-9_.-]*(?:password|passwd|token|secret|key)[a-z0-9_.-]*=['"]?([^\s'"$<{.][^\s'"]{3,})'''
secretGroup = 1
keywords = ["--from-literal"]

[[rules]]
id = "url-userinfo-password"
description = "Password in a ClickHouse, NATS, Postgres, or HTTP URL to a public host"
regex = '''(?i)\b(?:postgres(?:ql)?|clickhouse|nats|tls|https?)://[^\s:/@'"]+:([^\s@/'"$<{]{4,})@[^\s/:'"]+'''
secretGroup = 1
keywords = ["://"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''@(?:localhost|127\.\d+\.\d+\.\d+|0\.0\.0\.0|host\.docker\.internal|[a-z0-9_-]+|[^\s/:'"]*\.(?:example|test|local|internal|svc|invalid)(?:\.[a-z]+)*)$''']

[[rules]]
id = "yaml-secret-field"
description = "Literal secret on an Orbit config key in YAML, such as password or verifying_key"
regex = '''(?im)^\s*(?:[a-z0-9]+_)*(?:password|passwd|signing_key|verifying_key|api_token|admin_token|access_token|secret_access_key|session_token|service_account_key)\s*:\s*['"]?([^\s'"#$<{~|>][^'"#\n]{3,}?)['"]?\s*(?:#.*)?$'''
path = '''\.ya?ml$'''
secretGroup = 1
keywords = ["password", "passwd", "_key", "_token"]
[[rules.allowlists]]
regexes = ['''(?i)^(?:null|none|true|false)$''']

[[allowlists]]
description = "Placeholders and test values"
targetRules = ["password-env-in-command", "password-flag-in-command", "kubectl-literal-secret", "url-userinfo-password", "yaml-secret-field"]
stopwords = ["password", "passwd", "pass", "changeme", "secret", "example", "placeholder", "redacted", "xxxx", "test", "dummy", "fake", "default", "token"]
