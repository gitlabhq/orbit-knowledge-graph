# Dependency rules for `orbit quality`, checked by the orbit-quality-gate CI
# job. Each rule keeps a boundary the code already holds; the guideline it
# comes from is in the name when one is written down. In CI, only
# dependencies a merge request adds fail the job.

layers:
  - name: "the query compiler's later steps do not depend on a frontend (architecture/querying/query-engine.md: one intermediate representation)"
    from:
      - "crates/query-engine/compiler/src/passes/validate/**"
      - "crates/query-engine/compiler/src/passes/normalize.rs"
      - "crates/query-engine/compiler/src/passes/restrict.rs"
      - "crates/query-engine/compiler/src/passes/plan/**"
      - "crates/query-engine/compiler/src/passes/lower/**"
      - "crates/query-engine/compiler/src/passes/codegen/**"
      - "crates/query-engine/compiler/src/passes/security*.rs"
      - "crates/query-engine/compiler/src/passes/hydrate.rs"
    deny: ["crates/query-engine/compiler/src/passes/frontend/**"]
  - name: "query frontends do not depend on planning, lowering, code generation, or security"
    from: ["crates/query-engine/compiler/src/passes/frontend/**"]
    deny:
      - "crates/query-engine/compiler/src/passes/plan/**"
      - "crates/query-engine/compiler/src/passes/lower/**"
      - "crates/query-engine/compiler/src/passes/codegen/**"
      - "crates/query-engine/compiler/src/passes/security*.rs"
  - name: "code generation does not depend on the frontends or validation"
    from: ["crates/query-engine/compiler/src/passes/codegen/**"]
    deny:
      - "crates/query-engine/compiler/src/passes/frontend/**"
      - "crates/query-engine/compiler/src/passes/validate/**"
  - name: "the ClickHouse code generator does not depend on the DuckDB one"
    from: ["crates/query-engine/compiler/src/passes/codegen/clickhouse*"]
    deny: ["crates/query-engine/compiler/src/passes/codegen/duckdb*"]
  - name: "local graph commands do not call the GitLab Orbit API (CONTEXT.md: the workspace group uses only the Local graph)"
    from:
      - "crates/orbit-cli/src/database/**"
      - "crates/orbit-cli/src/commands/index/**"
      - "crates/orbit-cli/src/commands/index.rs"
      - "crates/orbit-cli/src/commands/definition.rs"
      - "crates/orbit-cli/src/commands/relations.rs"
      - "crates/orbit-cli/src/commands/reset.rs"
      - "crates/orbit-cli/src/commands/quality/**"
      - "crates/orbit-cli/src/sql.rs"
      - "crates/orbit-cli/src/workspace.rs"
    deny: ["crates/orbit-cli/src/remote/**"]
  - name: "the GitLab Orbit API client does not depend on local graph storage"
    from: ["crates/orbit-cli/src/remote/**"]
    deny: ["crates/orbit-cli/src/database/**", "crates/orbit-cli/src/commands/index/**"]
  - name: "the indexer engine does not depend on its domain modules (crates/indexer/AGENTS.md)"
    from: ["crates/indexer/src/engine/**", "crates/indexer/src/nats/**", "crates/indexer/src/clickhouse/**"]
    deny: ["crates/indexer/src/modules/**"]
  - name: "the indexer's SDLC module does not depend on the code or namespace deletion modules"
    from: ["crates/indexer/src/modules/sdlc/**"]
    deny: ["crates/indexer/src/modules/code/**", "crates/indexer/src/modules/namespace_deletion/**"]
  - name: "the indexer's code module does not depend on the SDLC or namespace deletion modules"
    from: ["crates/indexer/src/modules/code/**"]
    deny: ["crates/indexer/src/modules/sdlc/**", "crates/indexer/src/modules/namespace_deletion/**"]
  - name: "code-graph's shared linker and pipeline have no language branches (crates/code-graph/AGENTS.md)"
    from:
      - "crates/code-graph/src/v2/linker/**"
      - "crates/code-graph/src/v2/pipeline.rs"
      - "crates/code-graph/src/v2/sink.rs"
    deny: ["crates/code-graph/src/v2/langs/**"]
  - name: "code-graph's generic languages do not depend on its custom ones"
    from: ["crates/code-graph/src/v2/langs/generic/**"]
    deny: ["crates/code-graph/src/v2/langs/custom/**"]


# Data flow: which code may write the graph, run DDL, or reach a store.
forbid:
  # indexer/src/lib.rs also calls DDL, in run_dispatcher. It stays out of
  # only_in because the same file holds run, the indexer-mode entry point.
  # The gate fails only on new uses, so that existing call does not fail it.
  - name: "DDL runs only in dispatcher-mode code: schema::migration and migration completion GC (crates/indexer/AGENTS.md: indexers do not run DDL)"
    symbols:
      - "orbit_migrations::execute::create_all_versioned_tables"
      - "orbit_migrations::execute::create_tables_with_selective_cloning"
      - "orbit_migrations::execute::create_unversioned_definitions"
      - "orbit_migrations::execute::replace_refreshable_views"
      - "orbit_migrations::execute::drop_versioned_refreshable_views"
      - "orbit_migrations::execute::drop_all_version_entities"
      - "orbit_migrations::garbage_collection::drop_entities"
      - "orbit_migrations::version::mark_version_dropped"
      - "create_all_versioned_tables"
      - "create_tables_with_selective_cloning"
      - "create_unversioned_definitions"
      - "replace_refreshable_views"
      - "drop_versioned_refreshable_views"
      - "drop_all_version_entities"
    paths: ["crates/indexer/src/**", "crates/orbit-server/src/**", "crates/query-engine/**"]
    only_in:
      - "crates/indexer/src/schema/migration.rs"
      - "crates/indexer/src/orchestrator/scheduled/migration_completion.rs"
      - "crates/orbit-server/src/clickhouse_setup.rs"
  - name: "only the indexer writes graph tables; the server, query engine, and CLI read (architecture/README.md, ADR 023)"
    symbols:
      - "indexer::clickhouse::ClickHouseWriter"
      - "indexer::clickhouse::writer"
      - "clickhouse_client::ArrowClickHouseClient::insert_arrow"
      - "clickhouse_client::ArrowClickHouseClient::insert_arrow_streaming"
      - "clickhouse_client::ArrowClickHouseClient::insert_query"
      - "ClickHouseWriter"
    paths: ["crates/orbit-server/src/**", "crates/query-engine/**", "crates/orbit-cli/src/**"]
  - name: "query reads reach ClickHouse only through the execution and hydration stages, after security and compilation (architecture/querying/query-lifecycle.md)"
    symbols:
      - "crate::pipeline::stages::execution::execute_query"
      - "orbit_server::pipeline::stages::execution::execute_query"
      - "crate::pipeline::stages::hydration"
      - "orbit_server::pipeline::stages::hydration"
    paths:
      - "crates/orbit-server/src/grpc/**"
      - "crates/orbit-server/src/tools/**"
      - "crates/orbit-server/src/content/**"
      - "crates/orbit-server/src/pipeline/stages/routing.rs"
      - "crates/orbit-server/src/pipeline/stages/security.rs"
      - "crates/orbit-server/src/pipeline/stages/authorization.rs"
      - "crates/orbit-server/src/pipeline/stages/redaction.rs"
  - name: "the query compiler does not open a store connection; it only renders SQL (architecture/querying/query-engine.md)"
    symbols: ["clickhouse_client", "duckdb_client", "duckdb::"]
    paths: ["crates/query-engine/compiler/src/**"]

# Functions the dead-code check leaves out: entry points and test helpers,
# which nothing in the code calls.
dead:
  ignore_names: ["main", "Test*", "Benchmark*", "Fuzz*", "test_*"]
  ignore_paths: ["crates/fuzz/**", "crates/xtask/**", "**/benches/**", "**/build.rs"]

# Test code beyond the shared defaults (tests/, *_test.*, and so on): by
# path, and by definition name for test modules inside source files.
test_paths: ["**/tests.rs", "**/testkit/**", "**/test_helpers.rs", "**/test_util*.rs", "crates/integration-testkit/**"]
test_symbols: ["::tests?::", "::[a-z_]+_tests::", "::fencing::", "::regression::", "::build_validations::"]
