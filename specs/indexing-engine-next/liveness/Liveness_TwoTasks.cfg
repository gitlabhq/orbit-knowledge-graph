CONSTANTS
    Pods = {p1, p2}
    NoPod = NoPod
    Offsets = {0, 1}
    Ttl = 3
    RenewEvery = 1
    SkewMargin = 1
    AckWait = 2
    MaxTime = 3
    MaxEvents = 2
    MaxStalls = 0
    MaxCrashes = 1
    MaxWipes = 0
    MaxDuplicates = 0
    MaxLosses = 0
