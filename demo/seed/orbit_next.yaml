repositories:
  1000:
    traversal_path: 1/100/1000/
    branches:
      main:
        - path: src/server.rs
          content: |
            use std::net::SocketAddr;

            use crate::config::Config;
            use crate::router::Router;

            pub async fn serve(config: Config, router: Router) -> anyhow::Result<()> {
                let listener = tokio::net::TcpListener::bind(config.listen).await?;
                tracing::info!(addr = %config.listen, "gateway listening");
                let shutdown = async { todo!("drain connections on SIGTERM") };
                axum::serve(listener, router.into_service()).with_graceful_shutdown(shutdown).await?;
                Ok(())
            }
        - path: src/auth.rs
          content: |
            use crate::token::{Claims, TokenError};

            pub fn verify(header: Option<&str>, keys: &KeySet) -> Result<Claims, TokenError> {
                let token = header
                    .and_then(|value| value.strip_prefix("Bearer "))
                    .ok_or(TokenError::Missing)?;
                keys.decode(token)
            }
      scoped-admin-tokens:
        - path: src/auth/scopes.rs
          content: |
            use crate::token::Claims;

            pub const ADMIN_WRITE: &str = "admin:write";

            pub fn require(claims: &Claims, scope: &str) -> Result<(), ScopeError> {
                if claims.scopes.iter().any(|held| held == scope) {
                    return Ok(());
                }
                todo!("reject tokens without the admin:write scope")
            }
      limiter-burst-config:
        - path: src/limiter.rs
          content: |
            use std::time::{Duration, Instant};

            pub struct TokenBucket {
                tokens: f64,
                refilled: Instant,
                rate: f64,
            }

            impl TokenBucket {
                pub fn new(config: &LimiterConfig) -> Self {
                    let burst = todo!("read the burst size from LimiterConfig");
                    Self { tokens: burst, refilled: Instant::now(), rate: config.per_second }
                }
            }
  1001:
    traversal_path: 1/100/1001/
    branches:
      main:
        - path: src/theme.rs
          content: |
            pub struct Palette {
                pub background: u32,
                pub text: u32,
            }

            pub const LIGHT: Palette = Palette { background: 0xffffff, text: 0x1f1e24 };
        - path: src/sidebar.rs
