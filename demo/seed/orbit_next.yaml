  1001:
    branches:
      main:
        - path: charts/orbit/values.yaml
          content: |
            replicaCount: 1
            clickhouse:
              image:
                repository: clickhouse/clickhouse-server
                tag: "26.3"
            objectStore:
              enabled: false
        - path: charts/orbit/templates/deployment.yaml
          content: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ .Release.Name }}-orbit
            spec:
              replicas: {{ .Values.replicaCount }}
      rustfs-dev-values:
        - path: charts/orbit/values-dev.yaml
          content: |
            objectStore:
              enabled: true
              kind: rustfs
              endpoint: http://rustfs:9000
              bucket: orbit-dev
      pin-clickhouse-digest:
        - path: charts/orbit/values.yaml
          content: |
            clickhouse:
              image:
