[settings]
experimental = true

[hooks]
postinstall = "if [ -z \"$CI\" ]; then mise run hooks:install; fi"
# Auto-install lefthook git hooks when entering the project.
# Closes the gap where a developer clones and forgets `mise run hooks:install` — hooks
# become self-healing. Guarded: skips if lefthook isn't on PATH yet (fresh clone
# before `mise install`) and skips if hooks are already installed.
enter = 'test -n "$CI" || { common_dir=$(git rev-parse --git-common-dir 2>/dev/null) && test -f "$common_dir/hooks/pre-commit" && test -f "$common_dir/hooks/post-checkout"; } || { command -v lefthook >/dev/null 2>&1 && mise run hooks:install; true; }'

[env]
# gitlab-caproni checkout. Override with an absolute path, e.g: export CAPRONI_DIR=$HOME/Projects/gitlab-caproni
# Do not use ~ (tilde is not expanded in variable values).
CAPRONI_DIR_RESOLVED = "{{env.CAPRONI_DIR | default(value=env.HOME ~ '/gitlab-caproni')}}"


# Auto-download prebuilt DuckDB shared library on first build (cached in target/).
DUCKDB_DOWNLOAD_LIB = "{{env.DUCKDB_DOWNLOAD_LIB | default(value='1')}}"

# CI sets its own wrapper in .sccache-template; export RUSTC_WRAPPER= to opt out locally.
RUSTC_WRAPPER = "{% if env.RUSTC_WRAPPER is defined %}{{env.RUSTC_WRAPPER}}{% elif env.CI is defined %}{% else %}sccache{% endif %}"

[tools]
"rust" = { version = "1.98.1", components = "rustfmt,clippy", targets = "aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu", postinstall = "bash ./scripts/checks/check-rust-toolchain.sh --write" }
"cargo:cargo-nextest" = "0.9.123"
"cargo:cargo-edit" = "0.13.8"
"cargo:cargo-audit" = "0.22.0"
"cargo:cargo-deny" = "0.19.0"
"cargo:cargo-geiger" = "0.13.0"
"cargo:cargo-cyclonedx" = "0.5.7"
"cargo:cargo-zigbuild" = "0.23.4"
ast-grep = "0.51.0"
"cargo:https://gitlab.com/gitlab-org/rust/gitlab-xtasks" = "tag:v1.6.1"
"cargo:cargo-bolero" = "0.13.4"
"cargo:cargo-shear" = "1.13.1"
# Rebuild-and-run loop for Caproni edit mode (scripts/dev/caproni-edit-mode.sh).
watchexec = "2.8.0"
"sccache" = "0.13.0"
"zig" = "0.15.2"
clickhouse = "26.6.8.7-stable"
duckdb = "1.5.1"
uv = "0.9.28"
bun = "1.4.4"
lychee = "0.23"
vale = "3.14.1"
lefthook = "2.1.3"
protoc = "34.1"
jq = "1.7"
yq = "4.52.5"
"aqua:gitleaks/gitleaks" = "8.30.1"
"github:google/go-jsonnet" = "0.22.0"
# aws-lc-fips-sys compiles the AWS-LC FIPS module from source and needs cmake and go.
cmake = "4.4.3"
go = "1.27.1"
glab = "1.123.0"

[tasks."hooks:install"]
run = ["lefthook install --force", "cp scripts/hooks/post-checkout $(git rev-parse --git-common-dir)/hooks/post-checkout"]
description = "Install git hooks (lefthook + worktree support)"

[tasks."fuzz:corpus-pull"]
run = "scripts/fuzz/corpus.sh pull"
description = "Add crates/fuzz/seeds.yaml and, with a token, the grown corpus in GCS to every fuzz target's corpus/"

[tasks."fuzz:deep"]
run = "scripts/fuzz/run.sh deep"
description = "Run libFuzzer with AddressSanitizer over every fuzz target, sharing FUZZ_BUDGET_SECONDS (default 600)"

[tasks."test:fuzz"]
run = "scripts/fuzz/run.sh smoke"
description = "Replay each fuzz target's corpus, then a second of random inputs, on stable Rust"

[tasks."fuzz:compile"]
run = ["scripts/fuzz/corpus.sh pull fuzz_compile", "cargo +nightly bolero test fuzz_compile -p orbit-fuzz"]
description = "Fuzz the query compiler (compile JSON → SQL pipeline)"

[tasks."fuzz:compile-structured"]
run = ["scripts/fuzz/corpus.sh pull fuzz_compile_structured", "cargo +nightly bolero test fuzz_compile_structured -p orbit-fuzz"]
description = "Fuzz the query compiler with structured JSON query generation"

[tasks."fuzz:gql"]
run = ["scripts/fuzz/corpus.sh pull fuzz_gql", "cargo +nightly bolero test fuzz_gql -p orbit-fuzz"]
description = "Fuzz the Orbit query frontend with unstructured text"

[tasks."fuzz:gql-grammar"]
run = ["scripts/fuzz/corpus.sh pull fuzz_gql_grammar", "cargo +nightly bolero test fuzz_gql_grammar -p orbit-fuzz"]
description = "Fuzz the Orbit query frontend with derivations of its own grammar"

[tasks."fuzz:ruby"]
run = ["scripts/fuzz/corpus.sh pull fuzz_ruby", "cargo +nightly bolero test fuzz_ruby -p orbit-fuzz"]
description = "Fuzz the Ruby code parser"

[tasks."fuzz:python"]
run = ["scripts/fuzz/corpus.sh pull fuzz_python", "cargo +nightly bolero test fuzz_python -p orbit-fuzz"]
description = "Fuzz the Python code parser"

[tasks."fuzz:typescript"]
run = ["scripts/fuzz/corpus.sh pull fuzz_typescript", "cargo +nightly bolero test fuzz_typescript -p orbit-fuzz"]
description = "Fuzz the TypeScript/JavaScript code parser"

[tasks."fuzz:java"]
run = ["scripts/fuzz/corpus.sh pull fuzz_java", "cargo +nightly bolero test fuzz_java -p orbit-fuzz"]
description = "Fuzz the Java code parser"

[tasks."fuzz:kotlin"]
run = ["scripts/fuzz/corpus.sh pull fuzz_kotlin", "cargo +nightly bolero test fuzz_kotlin -p orbit-fuzz"]
description = "Fuzz the Kotlin code parser"

[tasks."fuzz:csharp"]
run = ["scripts/fuzz/corpus.sh pull fuzz_csharp", "cargo +nightly bolero test fuzz_csharp -p orbit-fuzz"]
description = "Fuzz the C# code parser"

[tasks."fuzz:rust-parser"]
run = ["scripts/fuzz/corpus.sh pull fuzz_rust_parser", "cargo +nightly bolero test fuzz_rust_parser -p orbit-fuzz"]
description = "Fuzz the Rust code parser"

[tasks."fuzz:indexer-messages"]
run = ["scripts/fuzz/corpus.sh pull fuzz_indexer_messages", "cargo +nightly bolero test fuzz_indexer_messages -p orbit-fuzz"]
description = "Fuzz indexer message deserialization"

# The workspace step shares the unit-test features; the second relinks `orbit` without the server's FIPS module.
[tasks.build]
run = "cargo build --workspace && cargo build -p orbit-cli"
description = "Build the crates with the dev profile"

[tasks."build:release"]
run = "cargo build --release --workspace --exclude orbit-cli && cargo build --release -p orbit-cli"
description = "Build the crates with the release profile"

[tasks."build:cli"]
run = "cargo build -p orbit-cli --bin orbit --release --features duckdb-client/bundled"
description = "Build the CLI"

[tasks.test]
alias = "test:fast"
run = "./scripts/dev/run-unit-tests.sh"
description = "Run unit tests (--lib, the xtask and orbit binaries, and the code-graph-incremental integration targets; no Docker)"

[tasks."test:local"]
run = "cargo nextest run --test local"
description = "Run local integration tests — compiler + querying pipeline (no Docker)"

[tasks."test:scripts"]
run = "for t in scripts/dev/tests/*_test.sh scripts/fuzz/*_test.sh; do bash \"$t\" || exit 1; done"
description = "Run the shell tests for the local development scripts (no cluster needed)"

[tasks."test:plan-shape"]
run = "cargo test -p integration-tests --test local compiler::plan_shape -- --nocapture"
description = "Check logical input and selected physical plans against YAML fixtures"

[tasks."test:integration:codegraph"]
run = "cargo nextest run -p integration-tests-codegraph --no-capture"
description = "Run code-graph and code-graph-incremental YAML suites with OpenCypher-like checks (no Docker)"

[tasks."test:cli"]
run = "cargo build -p orbit-cli && cargo nextest run --test cli --test outside_repository --no-fail-fast"
description = "Run CLI integration tests — concurrency, worktrees (no Docker)"

[tasks."test:integration"]
run = "./scripts/dev/run-container-tests.sh --all-features --test server_containers --test indexer_containers --no-fail-fast --retries 0"
env = { DOCKER_HOST = "unix://{{env.HOME}}/.colima/gkg/docker.sock" }
description = "Run container tests (requires the Colima `gkg` profile: `colima start gkg --memory 12`)"

[tasks."test:integration:server"]
run = "./scripts/dev/run-container-tests.sh --all-features --test server_containers -j 4 --no-fail-fast --retries 0 -E 'test(data_correctness) | test(redaction_integration) | test(graph_formatter)'"
env = { DOCKER_HOST = "unix://{{env.HOME}}/.colima/gkg/docker.sock" }
description = "Run server integration tests (data correctness, redaction, graph formatter)"

[tasks."test:integration:overlay"]
run = "GKG_TEST_ONTOLOGY_OVERLAY={{arg(name='overlay')}} ./scripts/dev/run-container-tests.sh --all-features --test server_containers --test indexer_containers -j 4 --no-fail-fast --retries 0 -E 'test(data_correctness) | test(denormalized_tables_match_their_source_join)'"
env = { DOCKER_HOST = "unix://{{env.HOME}}/.colima/gkg/docker.sock" }
description = "Run data correctness against the ontology with config/seeds/overlays/<name>/ merged over it"

[tasks."test:integration:data"]
run = "./scripts/dev/run-container-tests.sh --all-features --test server_containers --no-fail-fast --retries 0 --no-capture -E 'test(data_correctness)'"
env = { DOCKER_HOST = "unix://{{env.HOME}}/.colima/gkg/docker.sock" }
description = "Run data correctness integration tests"

[tasks."test:integration:corpus"]
run = "./scripts/dev/run-container-tests.sh --all-features --test server_containers --no-fail-fast --retries 0 --no-capture -E 'test(corpus_smoke)'"
env = { DOCKER_HOST = "unix://{{env.HOME}}/.colima/gkg/docker.sock" }
description = "Run the query-corpus smoke test (every corpus query compiles + runs)"

[tasks."test:integration:indexer"]
run = "./scripts/dev/run-container-tests.sh --all-features --test indexer_containers --no-fail-fast --retries 0"
env = { DOCKER_HOST = "unix://{{env.HOME}}/.colima/gkg/docker.sock" }
description = "Run indexer integration tests (schema migration, engine, NATS, namespace deletion)"

[tasks."test:integration:indexer:code"]
run = "./scripts/dev/run-container-tests.sh -p integration-tests --test indexer_containers --retries 0 -E 'test(code_indexing_task)'"
env = { DOCKER_HOST = "unix://{{env.HOME}}/.colima/gkg/docker.sock" }
description = "Run indexer integration tests (code indexing)"

[tasks."test:integration:indexer:sdlc:scenario"]
run = "SCENARIO_FILTER='{{arg(name='filter')}}' ./scripts/dev/run-container-tests.sh --all-features --test indexer_containers --no-fail-fast --retries 0 --no-capture -E 'test(scenario_indexing)'"
env = { DOCKER_HOST = "unix://{{env.HOME}}/.colima/gkg/docker.sock" }
description = "Run SDLC indexer scenarios matching a folder/name substring, e.g. `mise test:integration:indexer:sdlc:scenario ci/` or `... processes_jobs`"

[tasks.clean]
run = "cargo clean"
description = "Clean the crates"

[tasks."lint:fmt"]
run = "cargo fmt --all -- --check"
description = "Check Rust formatting"

[tasks."lint:code"]
run = [
  "cargo clippy --workspace --exclude duckdb-client --all-targets --all-features -- -D warnings",
  "cargo clippy -p duckdb-client --all-targets -- -D warnings",
]
description = "Run clippy lint checks"

[tasks."lint:logs"]
run = [
  "ast-grep test --skip-snapshot-tests",
  """ast-grep scan crates \
    --globs '!**/tests/**' --globs '!**/tests.rs' --globs '!**/test_helpers.rs' \
    --globs '!**/testing.rs' --globs '!**/testkit.rs' --globs '!**/testkit/**' \
    --globs '!**/benches/**' --globs '!**/examples/**' --globs '!**/build.rs' \
    --globs '!crates/integration-*/**' --globs '!crates/fuzz/**'""",
]
description = "Check log, span and print call sites against the red data rules (scripts/linting/logs)"

[tasks."lint:deps"]
run = "cargo shear"
description = "Check for unused workspace and crate dependencies"

[tasks."lint:code:fix"]
run = [
  "cargo fmt",
  "cargo clippy --workspace --exclude duckdb-client --all-targets --all-features --fix --allow-dirty -- -D warnings",
  "cargo clippy -p duckdb-client --all-targets --fix --allow-dirty -- -D warnings",
  "cargo fmt",
]
description = "Run clippy lint checks and fix applicable issues"

[tasks."lint:newlines"]
run = "gitlab-xtasks lint verify-newlines --file-extensions rs,md,yml,yaml,toml,astro,js,ts,json,mdx,vue,rb,css,mjs --directory . --exclude-files docs-locale"
description = "Check trailing newline formatting in the codebase"

[tasks."lint:integration-test-lanes"]
run = "cargo xtask integration-lanes --check"
description = "Check that integration test lanes partition the container tests"

[tasks."fix:newlines"]
run = "gitlab-xtasks lint verify-newlines --file-extensions rs,md,yml,yaml,toml,astro,js,ts,json,mdx,vue,rb,css,mjs --directory . --exclude-files docs-locale --fix"
description = "Fix newlines formatting in the codebase"

[tasks."local:index:repo"]
run = 'cargo run --release --bin orbit -- index ${usage_repo_path?} --stats'
description = "Index a local repository"
usage = 'arg "<repo_path>"'

[tasks."local:query"]
run = 'cargo run --release --bin orbit -- sql "${@}"'
description = "Run a raw SQL query against the local DuckDB graph (~/.gitlab/orbit/graph.duckdb)"
usage = 'arg "<sql>"'

[tasks."diff:branch"]
run = "git diff --unified=0 origin/${usage_base:-main}...HEAD $(xargs < .gitdiffignore) > git_diff_full.txt"
description = "Diff current branch against an origin branch (default: main)"
usage = 'arg "[base]" default="main" help="Branch on origin to diff against"'


[tasks."query:profile"]
run = 'cargo run -p query-profiler -- "$@"'
description = "Profile a GKG query against ClickHouse (use -- to pass args)"

[tasks."query:diff"]
run = 'python3 scripts/dev/diff-profiler-results.py "$@"'
description = "Compare query-profiler result files (use -- to pass args)"

[tasks."perf:gtime"]
run = "./scripts/dev/gtime.sh"

[tasks."perf:rss"]
run = './scripts/dev/average_rss.sh ${usage_repo_path?} ${usage_interval:-0.025}'
description = "Measure average RSS memory usage during indexing"
usage = '''
arg "<repo_path>"
arg "[interval]" default="0.025" help="Sampling interval in seconds"
'''

[task_templates."bench:engine"]
vars = { action = "run" }
run = 'cargo xtask code-indexing-benchmark {{ vars.action }}'

[tasks."bench:run"]
extends = "bench:engine"
description = "Run a measured code indexing benchmark"

[tasks."bench:smoke"]
extends = "bench:engine"
vars = { action = "smoke" }
description = "Run one code indexing pass against each benchmark repository"

[tasks."proto:go"]
run = "scripts/dev/proto-go.sh generate"
description = "Generate Go protobuf/gRPC stubs for Workhorse integration"

[tasks."proto:go:check"]
run = "scripts/dev/proto-go.sh check"
description = "Verify Go proto stubs are up to date"

[tasks."proto:ruby"]
run = '''
mkdir -p crates/orbit-server/proto/ruby
protoc --ruby_out=crates/orbit-server/proto/ruby \
  --grpc_out=crates/orbit-server/proto/ruby \
  --plugin=protoc-gen-grpc=$(which grpc_ruby_plugin) \
  -I crates/orbit-server/proto \
  crates/orbit-server/proto/orbit.proto
echo "Ruby proto files generated in crates/orbit-server/proto/ruby/"
'''
description = "Generate Ruby protobuf files for Rails client"

[tasks."proto:build-gem"]
run = '''
BUNDLE_GEMFILE=clients/protogem/Gemfile bundle install --quiet
ruby clients/protogem/build-proto-gem
'''
description = "Build gitlab-orbit-proto Ruby gem from proto definitions"

[tasks."server:start"]
run = "./scripts/dev/orbit-native-dev.sh webserver"
description = "Start the GKG server (webserver mode)"

[tasks."server:dispatch"]
run = "./scripts/dev/orbit-native-dev.sh dispatcher"
description = "Start the GKG server (dispatch-indexing mode)"

[tasks.dev]
run = [
  "mise run dev:check",
  "mise run dev:connect ::: dev:web ::: dev:indexer ::: dev:dispatcher",
]
description = "Start a local Orbit environment (webserver + indexer + dispatcher) against the Caproni cluster"

[tasks."dev:connect"]
run = "./scripts/dev/orbit-native-dev.sh connect"
description = "Hold the Caproni port-forwards, park the in-cluster Orbit, and route Rails to the local webserver (restored on Ctrl+C)"

[tasks."dev:check"]
run = "./scripts/dev/orbit-native-dev.sh check"
description = "Verify Caproni-connected local development prerequisites"

[tasks."dev:status"]
run = "./scripts/dev/orbit-native-dev.sh config"
description = "Show the derived Caproni-backed configuration for local development"

[tasks."dev:stop"]
run = "echo 'Use Ctrl+C in the running mise session to stop all dev processes'"
description = "Explain how to stop the local Orbit environment"

[tasks."dev:setup"]
run = "./scripts/dev/orbit-native-dev.sh setup"
description = "Apply config/graph.sql to the Caproni graph database"

[tasks."dev:web"]
run = "./scripts/dev/orbit-native-dev.sh webserver"
description = "Start a local Orbit webserver against the Caproni cluster"

[tasks."dev:indexer"]
run = "./scripts/dev/orbit-native-dev.sh indexer"
description = "Start a local Orbit indexer against the Caproni cluster"

[tasks."dev:dispatcher"]
run = "./scripts/dev/orbit-native-dev.sh dispatcher"
description = "Start a local Orbit dispatch-indexing process against the Caproni cluster"

[tasks."dev:healthcheck"]
run = "./scripts/dev/orbit-native-dev.sh healthcheck"
description = "Start the local GKG health-check process"


[tasks."vendor"]
run = "bash ./scripts/vendored/run.sh vendor ${@}"
description = "Run a vendored dependency's vendor_script (e.g. mise vendor -- duckdb)"
usage = 'arg "<name>"'

[tasks."vendor:all"]
run = "bash ./scripts/vendored/run.sh vendor --all"
description = "Run vendor_script for every vendored dependency that has one"

[tasks."check:vendored"]
run = "bash ./scripts/vendored/run.sh check ${@}"
description = "Run a vendored dependency's check_script (e.g. mise check:vendored -- duckdb)"
usage = 'arg "<name>"'

[tasks."check:vendored:all"]
run = "bash ./scripts/vendored/run.sh check --all"
description = "Run check_script for every vendored dependency that has one"

[tasks."versions:validate"]
run = "uvx check-jsonschema --verbose --schemafile config/schemas/versions.schema.json config/versions.yaml"
description = "Validate config/versions.yaml against JSON schema"

[tasks."ontology:validate"]
run = "find config/ontology -name '*.yaml' ! -name 'reference.yaml' | xargs uvx check-jsonschema --verbose --schemafile config/schemas/ontology.schema.json"
description = "Validate ontology YAML files against JSON schema"

[tasks."named-queries:validate"]
run = "find config/named_queries -name '*.yaml' | xargs uvx check-jsonschema --verbose --schemafile config/schemas/named_query.schema.json"
description = "Validate named query YAML files against JSON schema"

[tasks."scenarios:validate"]
run = "find crates/integration-tests/tests/indexer/scenarios -name '*.yaml' | xargs uvx check-jsonschema --verbose --schemafile config/schemas/indexer_scenario.schema.json"
description = "Validate indexer test scenario YAML files against JSON schema"


[tasks."schema:generate"]
run = "cargo xtask schema -o config/schemas/config.schema.json"
description = "Generate JSON Schema for the server configuration"

[tasks."toolchain:generate"]
run = "bash ./scripts/checks/check-rust-toolchain.sh --write"
description = "Regenerate rust-toolchain.toml from mise.toml"

[tasks."toolchain:check"]
run = "bash ./scripts/checks/check-rust-toolchain.sh --check"
description = "Fail if rust-toolchain.toml is out of sync with mise.toml"

[tasks."schema:bump"]
run = "cargo xtask migration-ledger bump"
description = "Bump the schema pin in config/versions.yaml, append a migration ledger entry, and re-snapshot fingerprints"

[tasks."schema:snapshot"]
run = "cargo xtask migration-ledger snapshot"
description = "Snapshot auxiliary tables and refreshable views without bumping the schema pin or the ledger"

[tasks."schema:ledger:check"]
run = "cargo xtask migration-ledger check"
description = "Fail if the migration ledger or fingerprint snapshot drifted from the ontology"

[tasks."rails-contract:check"]
run = "test -s \"${RAILS_CONTRACT_SNAPSHOT:?run mise run rails-contract:export first}\" && cargo test -p ontology --test rails_contract"
description = "Fail if the ontology redaction config does not match the Rails contract in RAILS_CONTRACT_SNAPSHOT"

[tasks."rails-contract:export"]
run = "cd \"${GITLAB_DIR:?set GITLAB_DIR to a GitLab checkout}\" && bundle exec rails runner - < \"$MISE_PROJECT_ROOT/scripts/rails-contract/export.rb\" | sed -n '/^{$/,/^}$/p' > \"${RAILS_CONTRACT_SNAPSHOT:-/tmp/rails-contract.json}\""
description = "Export the Rails contract from the GitLab checkout in GITLAB_DIR to RAILS_CONTRACT_SNAPSHOT (default /tmp/rails-contract.json)"

[tasks."metrics:catalog"]
run = "cargo xtask metrics-catalog"
description = "Regenerate crates/orbit-observability/orbit-dashboards/gkg-metrics.json"

[tasks."metrics:catalog:check"]
run = "cargo xtask metrics-catalog --check"
description = "Fail if the committed metrics catalog is out of date"

[tasks."dashboards"]
run = "cargo xtask dashboards"
description = "Regenerate dashboards/{orbit,dedicated}/*.dashboard.json from jsonnet sources"

[tasks."dashboards:check"]
run = "cargo xtask dashboards --check"
description = "Fail if the committed dashboards are out of date"

[tasks."docs:query-language"]
run = "cargo xtask query-docs"
description = "Regenerate the ontology-derived tables in docs/docs-gitlab-com/remote/queries/query-language.md"

[tasks."docs:query-language:check"]
run = "cargo xtask query-docs --check"
description = "Fail if the query-language.md text-indexed properties table is out of date"

[tasks."schema:generate:ddl"]
depends = ["schema:generate:ddl:remote", "schema:generate:ddl:local"]
description = "Regenerate ClickHouse (versioned + persistent) and DuckDB DDL from ontology"

[tasks."schema:generate:ddl:remote"]
depends = [
    "schema:generate:ddl:remote:versioned",
    "schema:generate:ddl:remote:persistent",
]
description = "Regenerate the versioned and persistent ClickHouse DDL from ontology"

[tasks."schema:generate:ddl:remote:versioned"]
run = "cargo xtask ddl --target remote 2>/dev/null > config/graph.sql.tmp && mv config/graph.sql.tmp config/graph.sql"
description = "Regenerate config/graph.sql (versioned ClickHouse) from ontology"

[tasks."schema:generate:ddl:remote:persistent"]
run = "cargo xtask ddl --target remote-persistent 2>/dev/null > config/graph_persistent.sql.tmp && mv config/graph_persistent.sql.tmp config/graph_persistent.sql"
description = "Regenerate config/graph_persistent.sql (durable unversioned ClickHouse) from ontology"

[tasks."schema:generate:ddl:local"]
run = "cargo xtask ddl --target local 2>/dev/null > config/graph_local.sql.tmp && mv config/graph_local.sql.tmp config/graph_local.sql"
description = "Regenerate config/graph_local.sql (DuckDB) from ontology"

[tasks."site:dev"]
run = "bun run --filter @orbit/site dev"
description = "Serve the engineering site with live reload"

[tasks."site:build"]
run = "bun run build && bun run typecheck && bun run test"
description = "Build, typecheck, and test the JavaScript workspace packages"

[tasks."lint:markdown"]
run = "bun x markdownlint-cli2 '*.md' 'docs/**/*.md' 'docs-locale/**/*.md'"
description = "Run markdownlint on all markdown files"

[tasks."lint:vale"]
run = "vale --minAlertLevel error *.md docs docs-locale"
description = "Run Vale prose linting on markdown files"

[tasks."lint:links"]
run = "lychee --offline --include-fragments --exclude-path output --exclude-path .claude --exclude-path .opencode --exclude-path .ai/principles/distilled --exclude-path packages/site/content --exclude-path node_modules '**/*.md'"
description = "Check for broken links in markdown files"

[tasks."lint:prose"]
run = "uv run --quiet scripts/linting/prose_lint.py"
description = "Lint the prose LLMs read: prompts, skills, agent guides, templates (pass files, --all, or --diff-base <sha>)"

[tasks."lint:prose:test"]
run = "uv run --quiet scripts/linting/prose_lint_test.py"
description = "Run the prose linter's unit tests"

[tasks."lint:yaml"]
run = "uv run --quiet scripts/linting/yaml_lint.py"
description = "Check the layout of the YAML test suites with Prettier and the blank-line rule (pass files to scope)"

[tasks."lint:yaml:fix"]
run = "uv run --quiet scripts/linting/yaml_lint.py --fix"
description = "Fix the layout of the YAML test suites"

[tasks."lint:yaml:test"]
run = "uv run --quiet scripts/linting/yaml_lint_test.py"
description = "Run the YAML layout linter's unit tests"

[tasks."lint:comments:test"]
run = "uv run --quiet scripts/linting/comment_check_test.py"
description = "Run the comment check's unit tests"

[tasks."lint:docs"]
depends = ["lint:markdown", "lint:vale", "lint:links"]
run = "echo 'All doc linters passed'"
description = "Run all documentation linters"

[tasks."docs:principles:sync"]
run = "DRY_RUN=true bash ./scripts/ci/sync-doc-principles.sh"
description = "Rehearse the documentation-principles sync: fetch upstream and show the diff"

[tasks."skill:sync:orbit"]
run = "cp docs/docs-gitlab-com/remote/queries/query-language.md skills/orbit/references/query_language.md"
description = "Sync upstream docs into the Orbit agent skill (skills/orbit/references/)"
