apiVersion: batch/v1
kind: Job
metadata:
  name: ra-import-dump
  labels:
    app: ra-bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: ra-import-sa
      containers:
        - name: import
          image: google/cloud-sdk:latest
          env:
            - name: CH_HOST
              value: "clickhouse.${CH_NAMESPACE}.svc.cluster.local"
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ra-import-ch-auth
                  key: password
            - name: DUMP_PREFIX
              value: "${DUMP_PREFIX}"
            - name: BUCKET
              value: "gs://gkg-datalake-dumps"
            - name: GCE_METADATA_HOST
              value: "169.254.169.254"
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              CH_URL="http://${CH_HOST}:8123"
              CH_PASS_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['CH_PASSWORD'], safe=''))")
              CH_AUTH="user=default&password=${CH_PASS_ENC}"
              unset CH_PASSWORD CH_PASS_ENC

              ch() {
                local db="${1:-}" query="${2:-}"
                local params="${CH_AUTH}"
                [ -n "${db}" ] && params="${params}&database=${db}"
                curl -sf "${CH_URL}/?${params}" -d "${query}" 2>/dev/null
              }

              rewrite_ddl() {
                sed -E \
                  -e 's/CREATE TABLE [A-Za-z0-9_]+\./CREATE TABLE /' \
                  -e "s/Shared(Replacing|Aggregating|Summing|Collapsing|VersionedCollapsing)?MergeTree\('[^']*', *'[^']*'(, *)?/\1MergeTree(/" \
                  -e 's/Shared(Replacing|Aggregating|Summing|Collapsing|VersionedCollapsing)?MergeTree/\1MergeTree/' \
                  -e 's/MergeTree\(, */MergeTree(/' \
                  -e '/dictGetOrDefault/s/DEFAULT .*/,/' \
                  "$1"
              }

              WORK="/tmp/dump/datalake"
              mkdir -p "${WORK}"

              echo "==> Downloading datalake from ${BUCKET}/${DUMP_PREFIX}/datalake/"
              gsutil -m rsync -r "${BUCKET}/${DUMP_PREFIX}/datalake/" "${WORK}/"

              echo "==> Creating tables and importing data"
              for sf in ${WORK}/*.schema.sql; do
                [ -f "${sf}" ] || continue
                t=$(basename "${sf}" .schema.sql)

                ddl=$(rewrite_ddl "${sf}")
                # CREATE IF NOT EXISTS: additive, never drops existing data.
                # DROP only on explicit schema migration (not here).
                ddl=$(echo "${ddl}" | sed 's/^CREATE TABLE /CREATE TABLE IF NOT EXISTS /')
                if ! ch datalake "${ddl}"; then
                  echo "  SKIP: ${t} (DDL failed)"
                  continue
                fi

                p=0
                for pf in ${WORK}/${t}.part*.Native.gz; do
                  [ -f "${pf}" ] || continue
                  gzip -dc "${pf}" | curl -sf \
                    -H "Content-Type: application/octet-stream" \
                    "${CH_URL}/?${CH_AUTH}&database=datalake&query=INSERT+INTO+${t}+FORMAT+Native&input_format_skip_unknown_fields=1" \
                    --data-binary @- 2>/dev/null || echo "  WARN: ${t} part ${p}"
                  p=$((p+1))
                done
                [ ${p} -gt 0 ] && echo "  ${t}: ${p} parts"
              done

              echo "==> Creating stub tables for ontology-referenced tables not in the dump"
              # The ontology's change-detection queries reference tables the
              # core dump does not contain (CI, security, etc.). Empty stubs
              # prevent the dispatcher from error-looping.
              STUBS="siphon_ci_sources_pipelines siphon_ci_runners siphon_container_repositories
                siphon_deployments siphon_environments siphon_events siphon_todos
                siphon_award_emoji siphon_banned_users siphon_bulk_import_entities
                siphon_ci_pipeline_metadata siphon_ci_runner_namespaces siphon_ci_runner_projects
                siphon_deployment_merge_requests siphon_duo_workflows_workflows
                siphon_group_audit_events siphon_internal_events siphon_issue_metrics
                siphon_merge_request_context_commits"
              for s in ${STUBS}; do
                ch datalake "CREATE TABLE IF NOT EXISTS ${s} (
                  id Int64,
                  traversal_path String DEFAULT '',
                  _siphon_watermark DateTime64(6, 'UTC') DEFAULT now64(6, 'UTC'),
                  _siphon_replicated_at DateTime64(6, 'UTC') DEFAULT now64(6, 'UTC'),
                  _siphon_deleted Bool DEFAULT false
                ) ENGINE = ReplacingMergeTree(_siphon_replicated_at, _siphon_deleted)
                ORDER BY id" || true
              done

              echo "==> Verifying row counts (no row data, counts only)"
              curl -s "${CH_URL}/?${CH_AUTH}&database=datalake" \
                -d "SELECT name, total_rows FROM system.tables WHERE database='datalake' AND total_rows > 0 ORDER BY total_rows DESC FORMAT TSV" \
                2>/dev/null

              echo "==> Import complete."
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 16Gi
