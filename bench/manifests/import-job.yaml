apiVersion: batch/v1
kind: Job
metadata:
  name: ra-import-dump
  labels:
    app: ra-bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: google/cloud-sdk:slim
          env:
            - name: CH_HOST
              value: "clickhouse.${CH_NAMESPACE}.svc.cluster.local"
            - name: CH_PASSWORD
              value: "${CH_PASSWORD}"
            - name: DUMP_PREFIX
              value: "${DUMP_PREFIX}"
            - name: BUCKET
              value: "gs://gkg-datalake-dumps"
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              CH_URL="http://${CH_HOST}:8123"
              CH_AUTH="user=default&password=${CH_PASSWORD}"
              ch() { curl -sf "${CH_URL}/?${CH_AUTH}&$1" ${2:+-d "$2"}; }
              chq() { ch "database=$1" "$2"; }

              WORK="/tmp/dump"
              mkdir -p "${WORK}/datalake"

              echo "==> Downloading datalake from ${BUCKET}/${DUMP_PREFIX}/datalake/"
              gcloud storage rsync "${BUCKET}/${DUMP_PREFIX}/datalake/" "${WORK}/datalake/" --recursive

              echo "==> Creating databases"
              ch "" "CREATE DATABASE IF NOT EXISTS staging"
              ch "" "CREATE DATABASE IF NOT EXISTS datalake"

              echo "==> Importing into staging"
              for schema_file in ${WORK}/datalake/*.schema.sql; do
                [ -f "${schema_file}" ] || continue
                table=$(basename "${schema_file}" .schema.sql)

                ddl=$(sed \
                  -e 's/SharedReplacingMergeTree([^)]*)//g' \
                  -e 's/SharedMergeTree([^)]*)//g' \
                  -e 's/`[a-z_]*`\.`/`/g' \
                  "${schema_file}")
                if echo "${ddl}" | grep -q "ENGINE = ()"; then
                  ddl=$(echo "${ddl}" | sed 's/ENGINE = ()/ENGINE = ReplacingMergeTree()/g')
                fi

                chq staging "DROP TABLE IF EXISTS ${table}" || true
                if ! chq staging "${ddl}"; then
                  echo "  WARNING: DDL failed for ${table}, skipping"
                  continue
                fi

                parts=0
                for part_file in ${WORK}/datalake/${table}.part*.Native.gz; do
                  [ -f "${part_file}" ] || continue
                  gzip -dc "${part_file}" | curl -sf \
                    -H "Content-Type: application/octet-stream" \
                    "${CH_URL}/?${CH_AUTH}&database=staging&query=INSERT+INTO+${table}+FORMAT+Native" \
                    --data-binary @- || echo "  WARNING: part import failed"
                  parts=$((parts + 1))
                done
                echo "  ${table}: ${parts} parts"
              done

              echo "==> Dropping staging data after copy (defense in depth)"
              echo "==> Copying staging -> datalake (with PII scrub)"
              for table in $(chq staging "SHOW TABLES"); do
                case "${table}" in
                  siphon_users)
                    chq datalake \
                      "INSERT INTO ${table} SELECT * REPLACE (
                        '' AS email, '' AS name, toString(sipHash64(username)) AS username
                       ) FROM staging.${table}" && continue ;;
                  siphon_notes)
                    chq datalake \
                      "INSERT INTO ${table} SELECT * REPLACE ('' AS note) FROM staging.${table}" && continue ;;
                  siphon_merge_request_diffs)
                    chq datalake \
                      "INSERT INTO ${table} SELECT * REPLACE ('' AS st_diffs) FROM staging.${table}" && continue ;;
                  siphon_merge_request_diff_files)
                    chq datalake \
                      "INSERT INTO ${table} SELECT * REPLACE (
                        '' AS diff, '' AS external_diff_offset, '' AS external_diff_size
                       ) FROM staging.${table}" 2>/dev/null
                    # Fallback if columns differ: copy without diff content columns.
                    if [ $? -ne 0 ]; then
                      chq datalake "INSERT INTO ${table} SELECT * FROM staging.${table}" 2>/dev/null
                    fi
                    continue ;;
                  merge_requests)
                    chq datalake \
                      "INSERT INTO ${table} SELECT * REPLACE (
                        '' AS title, '' AS description
                       ) FROM staging.${table}" && continue ;;
                  work_items)
                    chq datalake \
                      "INSERT INTO ${table} SELECT * REPLACE (
                        '' AS title, '' AS description
                       ) FROM staging.${table}" && continue ;;
                  siphon_approvals|siphon_members|siphon_issue_assignees|siphon_merge_request_assignees|siphon_merge_request_reviewers)
                    chq datalake \
                      "INSERT INTO ${table} SELECT * FROM staging.${table}" && continue ;;
                esac
                chq datalake \
                  "INSERT INTO ${table} SELECT * FROM staging.${table}" 2>/dev/null || true
              done

              echo "==> Dropping staging (raw unscrubbed data)"
              ch "" "DROP DATABASE IF EXISTS staging"

              echo "==> Materializing _siphon_watermark"
              for table in $(chq datalake "SHOW TABLES"); do
                chq datalake \
                  "ALTER TABLE ${table} ADD COLUMN IF NOT EXISTS _siphon_watermark DateTime64(6,'UTC') DEFAULT now64(6,'UTC')" 2>/dev/null || true
                chq datalake \
                  "ALTER TABLE ${table} MATERIALIZE COLUMN _siphon_watermark" 2>/dev/null || true
              done

              echo "==> Verifying row counts"
              for table in $(chq datalake "SHOW TABLES"); do
                rows=$(chq datalake "SELECT count() FROM ${table}")
                echo "  ${table}: ${rows} rows"
              done

              echo "==> Import complete. Staging dropped. Only scrubbed data in datalake."
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 8Gi
