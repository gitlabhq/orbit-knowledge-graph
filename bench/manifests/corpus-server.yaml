apiVersion: apps/v1
kind: Deployment
metadata:
  name: corpus-server
  namespace: ${CH_NAMESPACE}
  labels: { app: corpus-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: corpus-server }
  template:
    metadata:
      labels: { app: corpus-server }
    spec:
      serviceAccountName: corpus-server-sa
      containers:
        - name: server
          image: ${CORPUS_IMAGE}
          args: ["--gcs-bucket", "${CORPUS_BUCKET}", "--port", "8090"]
          ports:
            - containerPort: 8090
              name: http
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/v4/internal/orbit/project/0/info, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: corpus-server
  namespace: ${CH_NAMESPACE}
spec:
  selector: { app: corpus-server }
  ports:
    - port: 8090
      name: http
