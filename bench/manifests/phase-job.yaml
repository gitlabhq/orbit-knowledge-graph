apiVersion: batch/v1
kind: Job
metadata:
  name: ra-phase-${PHASE}
  labels:
    app: ra-bench
    phase: ${PHASE}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
        - name: phase
          image: ${XTASK_IMAGE}
          env:
            - name: NATS_URL
              value: "nats://nats.${NATS_NAMESPACE}.svc.cluster.local:4222"
            - name: CH_URL
              value: "http://clickhouse.${CH_NAMESPACE}.svc.cluster.local:8123"
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ra-phase-ch-auth
                  key: password
            - name: SIPHON_STREAM
              value: "${SIPHON_STREAM}"
            - name: PHASE
              value: "${PHASE}"
            - name: SCHEMA_VERSION
              value: "${SCHEMA_VERSION}"
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              CH_AUTH="user=default&password=${CH_PASSWORD}"
              unset CH_PASSWORD

              case "${PHASE}" in
                p1)
                  echo "==> P1: SDLC backfill via enrollment trigger"
                  if [ -f /config/namespace_ids.txt ]; then
                    xtask bench publish-triggers \
                      --stream "${SIPHON_STREAM}" \
                      --nats-url "${NATS_URL}" \
                      --kind enrollment \
                      --ids /config/namespace_ids.txt
                  else
                    echo "No namespace_ids.txt; skipping trigger publish"
                  fi
                  echo "==> Waiting 60s for backfill to drain"
                  sleep 60
                  ;;
                p3a)
                  echo "==> P3a: steady-state SDLC replay"
                  xtask bench replay-sdlc \
                    --rate "${RATE:-200}" \
                    --duration-secs "${DURATION:-300}" \
                    --manifest /config/manifest.tsv \
                    --ch-url "${CH_URL}" \
                    --ch-user default \
                    --ch-password "$(echo "${CH_AUTH}" | sed 's/.*password=//')" \
                    --results /results/p3a-replay-results.json
                  ;;
                p4)
                  echo "==> P4: query ladder"
                  xtask bench query-load \
                    --mix /bench/query-mixes/baseline \
                    --qps "${QPS_LADDER:-1,5}" \
                    --duration-per-step-secs "${STEP_DURATION:-60}" \
                    --schema-version "${SCHEMA_VERSION}" \
                    --ch-url "${CH_URL}" \
                    --ch-database gkg \
                    --ch-user default \
                    --ch-password "$(echo "${CH_AUTH}" | sed 's/.*password=//')" \
                    --results /results/p4-query-results.json
                  ;;
                *)
                  echo "Unknown phase: ${PHASE}"
                  exit 1
                  ;;
              esac

              echo "==> Phase ${PHASE} complete"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: results
              mountPath: /results
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 4Gi }
      volumes:
        - name: config
          configMap:
            name: ra-phase-config
            optional: true
        - name: results
          emptyDir: {}
