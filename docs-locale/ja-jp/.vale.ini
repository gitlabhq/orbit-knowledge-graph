# Vale configuration file for localized documentation.
#
# Translations are deliberately NOT checked with `gitlab_base`. Those rules
# encode English typography, so they produce false positives on other
# languages. For example, French requires a no-break space before `:`, which
# gitlab_base.NonStandardSpaces and gitlab_base.SentenceSpacing both reject.
#
# Add locale-specific rules to `.vale/locale_rules/`. This mirrors the setup in
# gitlab-org/gitlab, see doc-locale/*/.vale.ini there.
#
# For more information, see https://vale.sh/docs/vale-ini.

StylesPath = .vale
MinAlertLevel = suggestion

IgnoredScopes = code, tt, text.frontmatter.stage

[*.md]
BasedOnStyles = locale_rules
