image:
  repository: registry.gitlab.com/gitlab-org/orbit/knowledge-graph/gkg
  tag: "0.83.1"
  pullPolicy: Always

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

secrets:
  # Each application credential is sourced from its own pre-existing Kubernetes
  # Secret via `perKey.<name>.secretName` (required for every key consumed by an
  # enabled component). `perKey.<name>.key` selects the field within that Secret
  # and defaults to `keys.<name>`. Each key is mounted at /etc/secrets/<path>.
  keys:
    # Required for webserver to verify GitLab JWT tokens. Mounted at /etc/secrets/gitlab/jwt/verifying_key
    gitlabJwtVerifyingKey: gitlab-jwt-verifying-key
    # Required for outbound calls to get Gitaly information. Mounted at /etc/secrets/gitlab/jwt/signing_key
    gitlabJwtSigningKey: gitlab-jwt-signing-key
    # Required for ClickHouse datalake access. Mounted at /etc/secrets/datalake/password
    datalakePassword: datalake-password
    # Required for ClickHouse graph access. Mounted at /etc/secrets/graph/password
    graphPassword: graph-password
    # Required for ClickHouse graph read-only access. Mounted at /etc/secrets/graph/password
    graphReadPassword: graph-read-password
    # Required for CustomersDot quota API authentication. Mounted at /etc/secrets/billing/quota/api_token
    quotaApiToken: quota-api-token
  perKey:
    gitlabJwtVerifyingKey:
      secretName: ""
      key: ""
    gitlabJwtSigningKey:
      secretName: ""
      key: ""
    datalakePassword:
      secretName: ""
      key: ""
    graphPassword:
      secretName: ""
      key: ""
    graphReadPassword:
      secretName: ""
      key: ""
    quotaApiToken:
      secretName: ""
      key: ""

webserver:
  enabled: true
  replicas: 3
  logLevel: "info"
  # Per-service image overrides. When set, take precedence over the global image.* values.
  # Leave empty to use the global defaults.
  image:
    repository: ""
    tag: ""
  probes:
    enabled: true
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      cpu: "500m"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 50054
    annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # PodDisruptionBudget. Skipped automatically when replicas < 2.
  # Set exactly one of minAvailable / maxUnavailable; the other must stay empty.
  # When both are set, minAvailable wins. To switch, clear the unused field
  # explicitly (e.g. `--set webserver.pdb.minAvailable= --set webserver.pdb.maxUnavailable=1`).
  pdb:
    enabled: true
    minAvailable: 60%
    maxUnavailable: ""

indexer:
  # Master switch. When false, no indexer pool Deployments are rendered.
  enabled: true

  # Defaults applied to every entry in `pools` unless the pool overrides them.
  # Pool fields deep-merge over these (dicts merge, lists/scalars replace).
  replicas: 3
  logLevel: "info,salsa=warn,ra_ap_hir_ty=warn"
  # Per-service image overrides. When set, take precedence over the global image.* values.
  # Leave empty to use the global defaults.
  image:
    repository: ""
    tag: ""
  probes:
    enabled: true
  tmpSizeLimit: "10Gi"
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
      ephemeral-storage: "5Gi"
    limits:
      cpu: "8"
      memory: "16Gi"
      ephemeral-storage: "15Gi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # PodDisruptionBudget defaults applied per pool. Pools may override via `pools.<name>.pdb`.
  # When a pool sets a threshold field, the opposing field from these defaults is dropped
  # so the rendered PDB has exactly one threshold. Skipped per-pool when the pool's
  # replicas < 2.
  pdb:
    enabled: true
    minAvailable: ""
    maxUnavailable: 25%

  # Map of indexer pools. Each entry produces its own Deployment, ConfigMap,
  # and PodMonitor named `<release>-indexer-<pool>`. Pool keys also become the
  # The legacy `gkg.gitlab.com/indexer-pool` label is retained on every emitted
  # resource to preserve selectors and workload identity during upgrades.
  #
  # `modules` controls which engine modules the pool registers handlers for.
  # Omit (or leave empty) for a universal pool that registers all modules.
  # Common splits:
  #   modules: [code]                          # code-only pool
  #   modules: [sdlc, namespace_deletion]      # sdlc + namespace deletion pool
  #
  # `engine` deep-merges over the top-level `.engine` block for this pool only.
  # Any top-level indexer field above (replicas, resources, nodeSelector, ...)
  # may be overridden inline.
  #
  # `clickhouse.graph` deep-merges over the top-level `.clickhouse.graph` for this
  # pool only: define connection details (host, database, user) once globally and
  # override just `insertSettings` / `sessionSettings` per pool.
  pools:
    default: {}
    # Example split (replace `default` above with both of these):
    # sdlc:
    #   replicas: 4
    #   modules: [sdlc, namespace_deletion]
    #   resources:
    #     requests: { cpu: "500m", memory: "2Gi", ephemeral-storage: "2Gi" }
    #     limits:   { cpu: "2",    memory: "4Gi", ephemeral-storage: "5Gi" }
    #   engine:
    #     max_concurrent_workers: 24
    #     concurrency_groups: { sdlc: 24 }
    # code:
    #   replicas: 2
    #   modules: [code]
    #   nodeSelector: { workload: code-indexer }
    #   resources:
    #     requests: { cpu: "4",  memory: "8Gi",  ephemeral-storage: "20Gi" }
    #     limits:   { cpu: "16", memory: "32Gi", ephemeral-storage: "60Gi" }
    #   engine:
    #     max_concurrent_workers: 8
    #     concurrency_groups: { code: 8 }
    #   # Autoscale this pool with KEDA on the work-queue depth the application
    #   # serves over HTTP from the health-check deployment (metrics-api scaler).
    #   # When keda.enabled is true the Deployment stops rendering a fixed
    #   # `replicas` so KEDA owns the count; requires healthCheck.enabled.
    #   keda:
    #     enabled: true
    #     minReplicaCount: 2        # floor for change-data latency
    #     maxReplicaCount: 32       # consumer feeding limit; raise ack-pending first to go higher
    #     pollingInterval: 15       # seconds (default 15)
    #     cooldownPeriod: 300       # seconds (default 300)
    #     fallback:                 # hold steady if the endpoint errors
    #       failureThreshold: 3
    #       replicas: 4
    #     advanced:                 # passthrough to ScaledObject.spec.advanced
    #       horizontalPodAutoscalerConfig:
    #         behavior:
    #           scaleDown:
    #             stabilizationWindowSeconds: 600   # long scale-down window, avoid flapping
    #     trigger:
    #       path: /queue-depth      # path on the health-check HTTP server
    #       valueLocation: code_pending   # JSON field to read
    #       targetValue: "200"      # desired value per replica; tune in staging
    #       activationTargetValue: "1"    # scale from 0->1 once the value exceeds this
    # sdlc-strict:
    #   modules: [sdlc, namespace_deletion]
    #   replicas: 5
    #   pdb:
    #     minAvailable: 60%   # tighter than the indexer-level default for live indexing

dispatcher:
  enabled: false
  # Singleton; PDB is intentionally disabled so node drains can proceed.
  pdb:
    enabled: false
  logLevel: "info"
  # Per-service image overrides. When set, take precedence over the global image.* values.
  # Leave empty to use the global defaults.
  image:
    repository: ""
    tag: ""
  probes:
    enabled: true
    port: 4203
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

healthCheck:
  enabled: false
  replicas: 2
  # PodDisruptionBudget. Skipped automatically when replicas < 2.
  pdb:
    enabled: true
    minAvailable: 50%
    maxUnavailable: ""
  logLevel: "info"
  # Per-service image overrides. When set, take precedence over the global image.* values.
  # Leave empty to use the global defaults.
  image:
    repository: ""
    tag: ""
  probes:
    enabled: true
  port: 4201
  # When empty, the chart auto-populates one entry per enabled indexer pool plus
  # the dispatcher (when enabled), all in the release namespace. Override to
  # watch additional namespaces or specific resources.
  targets: []
  # Ingress NetworkPolicy guarding the health-check HTTP server (which also
  # serves the KEDA scaling metric). Off by default; enable per env where the
  # cluster enforces network policies. `from` lists the allowed ingress
  # sources, for example the KEDA operator namespace.
  networkPolicy:
    enabled: false
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: keda
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

clickhouse:
  datalake:
    host: ""
    httpPort: 8123
    database: ""
    user: default
    ssl: false
    sessionSettings: {}
    insertSettings: {}
  graph:
    host: ""
    httpPort: 8123
    database: ""
    user: default
    readUser: ""
    ssl: false
    sessionSettings: {}
    insertSettings: {}

nats:
  url: ""
  consumerName: gkg-indexer
  fetchExpiresSecs: 5
  batchSize: 10
  subscriptionBufferSize: 100
  tls:
    enabled: false
    # Name of an existing Kubernetes Secret containing NATS TLS certificates (e.g. from cert-manager)
    existingSecret: ""
    # Secret key names mapping to certificate files
    keys:
      caCert: ca.crt
      clientCert: tls.crt
      clientKey: tls.key

gitlab:
  baseUrl: ""
  # Optional DNS override hostname. When set, the baseUrl host is resolved
  # to this hostname's IP, allowing TLS to verify against baseUrl while
  # routing traffic through a different endpoint (e.g. a PSC gateway).
  resolveHost: ""

schedule:
  tasks:
    global:
      cron: "0 */1 * * * *"
    namespace:
      cron: "0 */1 * * * *"
    code-backfill:
      cron: "0 */1 * * * *"
    table-cleanup:
      cron: "0 0 3 * * *"
    namespace-deletion:
      cron: "0 0 3 * * *"
    migration-completion:
      cron: "0 */1 * * * *"

engine:
  max_concurrent_workers: 16
  concurrency_groups:
    sdlc: 12
    code: 4
  topics:
    global-handler:
      concurrency_group: sdlc
      max_attempts: 1
      retry_interval_secs: 60
    namespace-handler:
      concurrency_group: sdlc
      max_attempts: 1
      retry_interval_secs: 60
    code-indexing-task:
      concurrency_group: code
      max_attempts: 5
      retry_interval_secs: 60
      dead_letter_on_exhaustion: true
    namespace-deletion:
      concurrency_group: code
      max_attempts: 1
  handlers:
    entity-handler:
      batch_size_overrides:
        WorkItem: 50000
      partition_overrides:
        Job: 5
    code-indexing-task:
      pipeline:
        max_file_size_bytes: 5000000
        max_files: 1000000
        worker_threads: 0
        max_concurrent_languages: 0
        per_file_timeout_ms: 2000
        cross_file_resolve_timeout_ms: 180000

tls:
  enabled: false
  # Name of an existing Kubernetes TLS secret (must contain tls.crt and tls.key)
  existingSecret: ""

podLabels: {}
podAnnotations: {}
deploymentAnnotations: {}

metrics:
  otel:
    enabled: false
    endpoint: ""
  prometheus:
    enabled: false
    port: 9394
    podTargetLabels: []

# Prometheus alert rules for the GKG stack, shipped as a PrometheusRule
# discovered by the Prometheus Operator (e.g. kube-prometheus-stack). Needs
# `metrics.prometheus.enabled` so the alerted series exist. Each rule links
# its playbook under https://runbooks.gitlab.com/orbit/alerts/.
alerts:
  enabled: false
  # Extra labels on the PrometheusRule, for Prometheus CRs whose ruleSelector
  # requires a marker label (kube-prometheus-stack defaults to
  # `release: <prometheus-release-name>`).
  additionalLabels: {}

# Snowplow analytics. Off by default; opt-in via `analytics.enabled`.
# Applied to indexer, dispatcher, and webserver app configs.
analytics:
  enabled: false
  # Snowplow collector base URL (no path). Required when enabled.
  # The tracker appends `/com.snowplowanalytics.snowplow/tp2`.
  collector_url: ""
  deployment:
    # Deployment shape: com | dedicated | self_managed
    type: self_managed
    # Analytics environment: development | staging | production
    environment: development

# Snowplow billing events. Off by default; opt-in via `billing.enabled`.
# Applied to the webserver app config only (billing fires on query execution).
billing:
  enabled: false
  # Snowplow collector base URL (no path). Required when enabled.
  # Staging: https://billing.stgsub.gitlab.net
  # Production: https://billing.prdsub.gitlab.net
  collector_url: ""
  quota:
    enabled: false
    # CustomersDot base URL. Required when quota.enabled is true.
    # Staging: https://customers.staging.gitlab.com
    # Production: https://customers.gitlab.com
    customers_dot_url: ""
    api_user: "gl_com_api+orbit@gitlab.com"

# Process-wide feature flags. Every key set here is passed through verbatim to
# the Orbit `features:` config section (rendered into indexer pool configs only,
# the sole consumer today is the `sdlc` module). Empty by default so the default
# render omits the block and stays valid against image tags whose schema predates
# a flag. Add a key to enable it; the image.tag must define that flag, e.g.:
#   features:
#     system_notes: true   # requires image.tag >= 0.70.0
features: {}

# Creates the gkg database and users from the contract in the gkg image, as a
# pre-install/pre-upgrade hook. Off by default: enable only for managed
# ClickHouse Cloud, where the server's initdb scripts are not available.
clickhouseSetup:
  enabled: false
  applyImage: busybox:1.37.0
  backoffLimit: 2
  # ClickHouse `default` admin password, used only by this hook. Required when
  # enabled. The gkg user passwords come from secrets.perKey.
  adminSecret:
    secretName: ""
    key: admin-password
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

extraResources: []

nameOverride: ""
fullnameOverride: ""
