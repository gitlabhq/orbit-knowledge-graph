groups:
  - name: gkg-alerts
    rules:
      - alert: GKGAllowlistRejectedBurst
        expr: sum by (env, environment, stage) (rate(gkg_query_engine_compiler_rejected_total{failure_reason=~"ontology|ontology_internal"}[5m])) * 60 > 5
        for: 5m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: Sustained ontology-allowlist violations, above 5 per minute; schema drift or an enumeration attempt.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGAllowlistRejectedBurst/
          title: Burst of GKG ontology-allowlist rejections
      - alert: GKGAuthFilterMissing
        expr: sum by (env, environment, stage) (rate(gkg_query_engine_compiler_rejected_total{failure_reason="security"}[5m])) > 0
        for: 1m
        labels:
          alert_type: cause
          severity: critical
        annotations:
          description: A query reached the compiler without a valid security context; the compiler rejected it, but this path means authorization filtering would have been bypassed.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGAuthFilterMissing/
          title: A GKG query reached the compiler without a security context
      - alert: GKGAuthorizationFailureRate
        expr: sum by (env, environment, stage) (rate(gkg_query_pipeline_failed_total{failure_reason="authorization"}[5m])) * 60 > 1
        for: 5m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: The Rails authorization exchange is failing, above 1 failure per minute; redaction callbacks are not completing.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGAuthorizationFailureRate/
          title: GKG redaction calls to Rails are failing
      - alert: GKGCircuitBreakerOpen
        expr: sum by (env, environment, stage) (rate(gkg_circuit_breaker_state_transitions_total{to="open"}[5m])) > 0
        for: 1m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: A circuit breaker opened; an external dependency is unreachable and calls to it are being shed.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGCircuitBreakerOpen/
          title: A GKG circuit breaker opened
      - alert: GKGCircuitBreakerRejectRateHigh
        expr: sum by (env, environment, stage) (rate(gkg_circuit_breaker_calls_rejected_total[5m])) * 60 > 10
        for: 5m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: A circuit is open and shedding significant traffic, above 10 rejected calls per minute.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGCircuitBreakerRejectRateHigh/
          title: An open GKG circuit breaker is shedding traffic
      - alert: GKGContainerOOMKilled
        expr: sum by (env, environment, stage, container) (increase(container_oom_events_total{container=~"gkg-.*"}[10m])) > 0
        for: 1m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: A GKG container was OOM killed; its memory limit is too small for the workload.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGContainerOOMKilled/
          title: "{{ $labels.container }} containers are being OOM killed"
      - alert: GKGExecutionFailureRate
        expr: sum by (env, environment, stage) (rate(gkg_query_pipeline_failed_total{failure_reason="execution"}[5m])) * 60 > 1
        for: 5m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: ClickHouse query execution is failing, above 1 failure per minute.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGExecutionFailureRate/
          title: GKG queries are failing at ClickHouse execution
      - alert: GKGPipelineInvariantViolated
        expr: sum by (env, environment, stage) (rate(gkg_query_engine_compiler_rejected_total{failure_reason=~"lowering|enforcement|codegen|pipeline"}[5m])) > 0
        for: 1m
        labels:
          alert_type: cause
          severity: critical
        annotations:
          description: The query compiler reached a state that upstream validation should have prevented; the generated SQL could have been incorrect.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGPipelineInvariantViolated/
          title: The GKG query compiler violated an internal invariant
      - alert: GKGPipelineLatencyP95High
        expr: histogram_quantile(0.95, sum by (env, environment, stage, le) (rate(gkg_query_pipeline_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: p95 end-to-end query pipeline latency is above 5 seconds for 10 minutes.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGPipelineLatencyP95High/
          title: GKG query p95 latency is above 5s
      - alert: GKGPipelinePostCompileErrorRateHigh
        expr: "sum by (env, environment, stage) (rate(gkg_query_pipeline_queries_total{status!~\"ok|compile_error\"}[5m]))\n  / sum by (env, environment, stage) (rate(gkg_query_pipeline_queries_total{status!=\"compile_error\"}[5m])) > 0.01"
        for: 5m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: Post-compile failure rate is above 1%, isolating server-side reliability from client-input quality.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGPipelinePostCompileErrorRateHigh/
          title: GKG post-compile query failure rate is above 1%
      - alert: GKGQueryingErrorRateHigh
        expr: "sum by (env, environment, stage) (rate(gkg_query_pipeline_queries_total{status!=\"ok\"}[5m]))\n  / sum by (env, environment, stage) (rate(gkg_query_pipeline_queries_total[5m])) > 0.05"
        for: 5m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: Aggregate query error rate across all failure modes is above 5% for 5 minutes (the availability SLI).
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGQueryingErrorRateHigh/
          title: GKG query error rate is above 5%
      - alert: GKGSecurityRejected
        expr: sum by (env, environment, stage) (rate(gkg_query_pipeline_failed_total{failure_reason="security"}[5m])) > 0
        for: 5m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: The query pipeline is rejecting requests for invalid or missing security context.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGSecurityRejected/
          title: GKG is rejecting queries for invalid security context
      - alert: GKGValidationFailedBurst
        expr: sum by (env, environment, stage) (rate(gkg_query_engine_compiler_rejected_total{failure_reason=~"parse|schema|reference|pagination"}[5m])) * 60 > 10
        for: 5m
        labels:
          alert_type: cause
          severity: warning
        annotations:
          description: Sustained burst of structural validation failures, above 10 per minute; a broken client or someone probing the API.
          runbook_url: https://runbooks.gitlab.com/orbit/alerts/GKGValidationFailedBurst/
          title: Burst of GKG query validation failures
