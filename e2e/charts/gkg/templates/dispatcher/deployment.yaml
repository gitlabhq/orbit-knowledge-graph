{{- if .Values.dispatcher.enabled }}
{{- $secretKeys := list "datalakePassword" "graphPassword" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gkg.fullname" . }}-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gkg.componentLabels" (dict "root" . "component" "dispatcher" "serviceTag" .Values.dispatcher.image.tag) | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gkg.componentSelectorLabels" (dict "root" . "component" "dispatcher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gkg.componentSelectorLabels" (dict "root" . "component" "dispatcher") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dispatcher/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "gkg.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "gkg.podSecurityContext" . | nindent 8 }}
      containers:
        - name: gkg-dispatcher
          image: "{{ include "gkg.serviceImageRepository" (dict "root" . "serviceRepository" .Values.dispatcher.image.repository) }}:{{ include "gkg.serviceImageTag" (dict "root" . "serviceTag" .Values.dispatcher.image.tag) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--mode=dispatch-indexing"
          ports:
            - name: health
              containerPort: {{ .Values.dispatcher.probes.port }}
              protocol: TCP
            {{- if .Values.metrics.prometheus.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.prometheus.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.dispatcher.probes.enabled }}
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- include "gkg.secretVolumeMount" (dict "root" . "keys" $secretKeys) | nindent 12 }}
            {{- include "gkg.natsTlsVolumeMount" . | nindent 12 }}
          securityContext:
            {{- include "gkg.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.dispatcher.resources | nindent 12 }}
      {{- with .Values.dispatcher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dispatcher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dispatcher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gkg.fullname" . }}-dispatcher-config
        {{- include "gkg.secretVolume" (dict "root" . "keys" $secretKeys) | nindent 8 }}
        {{- include "gkg.natsTlsVolume" . | nindent 8 }}
{{- end }}
