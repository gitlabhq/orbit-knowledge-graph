{{- if .Values.clickhouseSetup.enabled }}
{{/* pre-install/pre-upgrade so the gkg users exist before the app pods connect. */}}
{{- $writer := index .Values.secrets.perKey "graphPassword" }}
{{- $reader := index .Values.secrets.perKey "graphReadPassword" }}
{{- $siphon := index .Values.secrets.perKey "datalakePassword" }}
{{- $admin := .Values.clickhouseSetup.adminSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gkg.fullname" . }}-clickhouse-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gkg.componentLabels" (dict "root" . "component" "clickhouse-setup" "serviceTag" "") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.clickhouseSetup.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "gkg.componentSelectorLabels" (dict "root" . "component" "clickhouse-setup") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "gkg.podSecurityContext" . | nindent 8 }}
      initContainers:
        - name: render-contract
          image: "{{ include "gkg.serviceImageRepository" (dict "root" . "serviceRepository" "") }}:{{ include "gkg.serviceImageTag" (dict "root" . "serviceTag" "") }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              while IFS= read -r line; do
                case "$line" in ''|--*) continue ;; esac
                line="${line//'${GRAPH_DB}'/$GRAPH_DB}"
                line="${line//'${DATALAKE_DB}'/$DATALAKE_DB}"
                line="${line//'${GKG_WRITER_PASSWORD}'/$GKG_WRITER_PASSWORD}"
                line="${line//'${GKG_READER_PASSWORD}'/$GKG_READER_PASSWORD}"
                line="${line//'${GKG_SIPHON_READER_PASSWORD}'/$GKG_SIPHON_READER_PASSWORD}"
                printf '%s\n' "$line"
              done < /usr/share/gkg/clickhouse-setup.sql > /contract/setup.sql
              echo "contract rendered ($(grep -c ';' /contract/setup.sql) statements)"
          env:
            - name: GRAPH_DB
              value: {{ .Values.clickhouse.graph.database | quote }}
            - name: DATALAKE_DB
              value: {{ .Values.clickhouse.datalake.database | quote }}
            - name: GKG_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.perKey.graphPassword.secretName is required when clickhouseSetup.enabled is true" $writer.secretName }}
                  key: {{ $writer.key | default (index .Values.secrets.keys "graphPassword") }}
            - name: GKG_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.perKey.graphReadPassword.secretName is required when clickhouseSetup.enabled is true" $reader.secretName }}
                  key: {{ $reader.key | default (index .Values.secrets.keys "graphReadPassword") }}
            - name: GKG_SIPHON_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.perKey.datalakePassword.secretName is required when clickhouseSetup.enabled is true" $siphon.secretName }}
                  key: {{ $siphon.key | default (index .Values.secrets.keys "datalakePassword") }}
          volumeMounts:
            - name: contract
              mountPath: /contract
          securityContext:
            {{- include "gkg.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.clickhouseSetup.resources | nindent 12 }}
      containers:
        # busybox ships no CA bundle, so --no-check-certificate for Cloud TLS.
        - name: apply-contract
          image: {{ .Values.clickhouseSetup.applyImage | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              n=0
              while IFS= read -r line; do
                [ -n "$line" ] || continue
                n=$((n + 1))
                wget -q -O - --no-check-certificate \
                  --header "X-ClickHouse-User: default" \
                  --header "X-ClickHouse-Key: $CH_ADMIN_PASSWORD" \
                  --post-data "$line" "$CH_URL/" \
                  || { echo "FAILED at statement $n" >&2; exit 1; }
              done < /contract/setup.sql
              echo "clickhouse setup complete ($n statements)"
          env:
            - name: CH_URL
              value: {{ include "gkg.clickhouseGraphUrl" . | quote }}
            - name: CH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "clickhouseSetup.adminSecret.secretName is required when clickhouseSetup.enabled is true" $admin.secretName }}
                  key: {{ $admin.key }}
          volumeMounts:
            - name: contract
              mountPath: /contract
              readOnly: true
          securityContext:
            {{- include "gkg.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.clickhouseSetup.resources | nindent 12 }}
      {{- with .Values.clickhouseSetup.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouseSetup.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouseSetup.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: contract
          emptyDir: {}
{{- end }}
