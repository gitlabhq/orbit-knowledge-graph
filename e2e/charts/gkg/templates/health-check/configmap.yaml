{{- if .Values.healthCheck.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gkg.fullname" . }}-health-check-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gkg.componentLabels" (dict "root" . "component" "health-check") | nindent 4 }}
data:
  default.yaml: |
    health_check:
      bind_address: "0.0.0.0:{{ .Values.healthCheck.port }}"
      targets:
        {{- if .Values.healthCheck.targets }}
        {{- range .Values.healthCheck.targets }}
        - namespace: {{ .namespace | default $.Release.Namespace | quote }}
          {{- with .deployments }}
          deployments:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- with .statefulSets }}
          statefulSets:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- else }}
        - namespace: {{ .Release.Namespace | quote }}
          deployments:
            {{- include "gkg.healthCheckDefaultDeployments" . | nindent 12 }}
        {{- end }}
    datalake:
      {{- include "gkg.clickhouseConfig" (dict "url" (include "gkg.clickhouseDatalakeUrl" .) "config" .Values.clickhouse.datalake) | nindent 6 }}
    graph:
      {{- include "gkg.clickhouseConfig" (dict "url" (include "gkg.clickhouseGraphUrl" .) "config" (mustMergeOverwrite (dict) .Values.clickhouse.graph (dict "user" .Values.clickhouse.graph.readUser))) | nindent 6 }}
    nats:
      url: {{ include "gkg.natsUrl" . | quote }}
      consumer_name: {{ .Values.nats.consumerName | quote }}
      {{- if .Values.nats.tls.enabled }}
      tls_ca_cert_path: "/etc/nats-tls/ca.pem"
      tls_cert_path: "/etc/nats-tls/client.pem"
      tls_key_path: "/etc/nats-tls/client-key.pem"
      {{- end }}
    metrics:
      log_level: {{ .Values.healthCheck.logLevel | quote }}
      otel:
        enabled: {{ .Values.metrics.otel.enabled }}
        {{- if .Values.metrics.otel.enabled }}
        endpoint: {{ .Values.metrics.otel.endpoint | quote }}
        {{- end }}
      prometheus:
        enabled: {{ .Values.metrics.prometheus.enabled }}
        port: {{ .Values.metrics.prometheus.port }}
{{- end }}
