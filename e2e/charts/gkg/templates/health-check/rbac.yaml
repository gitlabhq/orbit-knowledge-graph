{{- if .Values.healthCheck.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gkg.fullname" . }}-health-check
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gkg.componentLabels" (dict "root" . "component" "health-check") | nindent 4 }}
{{- $fullname := include "gkg.fullname" . }}
{{- $labels := include "gkg.componentLabels" (dict "root" . "component" "health-check") }}
{{- $saNamespace := .Release.Namespace }}
{{- $seen := dict }}
{{- $targets := .Values.healthCheck.targets }}
{{- if not $targets }}{{- $targets = list (dict "namespace" $saNamespace) }}{{- end }}
{{- range $targets }}
{{- $ns := .namespace | default $saNamespace }}
{{- if not (hasKey $seen $ns) }}
{{- $_ := set $seen $ns true }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-health-check
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-health-check
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-health-check
    namespace: {{ $saNamespace }}
roleRef:
  kind: Role
  name: {{ $fullname }}-health-check
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
