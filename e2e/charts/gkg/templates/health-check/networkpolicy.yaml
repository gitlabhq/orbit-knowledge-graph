{{- if and .Values.healthCheck.enabled .Values.healthCheck.networkPolicy.enabled }}
{{- if not .Values.healthCheck.networkPolicy.from }}{{ fail "healthCheck.networkPolicy.from must not be empty when networkPolicy is enabled" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gkg.fullname" . }}-health-check
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gkg.componentLabels" (dict "root" . "component" "health-check") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gkg.componentSelectorLabels" (dict "root" . "component" "health-check") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.healthCheck.networkPolicy.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.healthCheck.port }}
{{- end }}
