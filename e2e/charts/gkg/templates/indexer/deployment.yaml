{{- if .Values.indexer.enabled }}
{{- $secretKeys := list "datalakePassword" "graphPassword" "gitlabJwtSigningKey" }}
{{- range $name, $pool := .Values.indexer.pools }}
{{- if eq (include "gkg.indexerPoolEnabled" (dict "root" $ "pool" $pool)) "true" }}
{{- $merged := include "gkg.indexerPoolMerged" (dict "root" $ "pool" $pool) | fromYaml }}
{{- $kind := include "gkg.indexerPoolKind" $merged.modules }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gkg.indexerPoolName" (dict "root" $ "pool" $name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gkg.indexerPoolLabels" (dict "root" $ "pool" $name "kind" $kind "serviceTag" $merged.image.tag) | nindent 4 }}
  {{- with $.Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not (and $merged.keda $merged.keda.enabled) }}
  replicas: {{ $merged.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gkg.indexerPoolSelectorLabels" (dict "root" $ "pool" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gkg.indexerPoolSelectorLabels" (dict "root" $ "pool" $name) | nindent 8 }}
        gkg.gitlab.com/indexer-modules: {{ $kind | quote }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/indexer/configmap.yaml") $ | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "gkg.serviceAccountName" $ }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "gkg.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: gkg-indexer
          image: "{{ include "gkg.serviceImageRepository" (dict "root" $ "serviceRepository" $merged.image.repository) }}:{{ include "gkg.serviceImageTag" (dict "root" $ "serviceTag" $merged.image.tag) }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - "--mode=indexer"
          ports:
            - name: health
              containerPort: 4202
              protocol: TCP
            {{- if $.Values.metrics.prometheus.enabled }}
            - name: metrics
              containerPort: {{ $.Values.metrics.prometheus.port }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "gkg.secretVolumeMount" (dict "root" $ "keys" $secretKeys) | nindent 12 }}
            {{- include "gkg.natsTlsVolumeMount" $ | nindent 12 }}
          {{- if $merged.probes.enabled }}
          startupProbe:
            httpGet:
              path: /ready
              port: 4202
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: 4202
            periodSeconds: 10
          {{- end }}
          securityContext:
            {{- include "gkg.securityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $merged.resources | nindent 12 }}
      {{- with $merged.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $merged.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $merged.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gkg.indexerPoolName" (dict "root" $ "pool" $name) }}-config
        - name: tmp
          emptyDir:
            sizeLimit: {{ $merged.tmpSizeLimit }}
        {{- include "gkg.secretVolume" (dict "root" $ "keys" $secretKeys) | nindent 8 }}
        {{- include "gkg.natsTlsVolume" $ | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
