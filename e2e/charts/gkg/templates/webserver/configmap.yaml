{{- if .Values.webserver.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gkg.fullname" . }}-webserver-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gkg.componentLabels" (dict "root" . "component" "webserver") | nindent 4 }}
data:
  default.yaml: |
    bind_address: "0.0.0.0:{{ .Values.webserver.service.httpPort }}"
    grpc_bind_address: "0.0.0.0:{{ .Values.webserver.service.grpcPort }}"
    {{- if .Values.healthCheck.enabled }}
    health_check_url: "http://{{ include "gkg.fullname" . }}-health-check:{{ .Values.healthCheck.port }}"
    {{- end }}
    nats:
      url: {{ include "gkg.natsUrl" . | quote }}
      {{- if .Values.nats.tls.enabled }}
      tls_ca_cert_path: "/etc/nats-tls/ca.pem"
      tls_cert_path: "/etc/nats-tls/client.pem"
      tls_key_path: "/etc/nats-tls/client-key.pem"
      {{- end }}
    graph:
      {{- include "gkg.clickhouseConfig" (dict "url" (include "gkg.clickhouseGraphUrl" .) "config" (mustMergeOverwrite (dict) .Values.clickhouse.graph (dict "user" .Values.clickhouse.graph.readUser))) | nindent 6 }}
    {{- with (include "gkg.gitlabBaseUrl" .) }}
    gitlab:
      base_url: {{ . | quote }}
      {{- if $.Values.gitlab.resolveHost }}
      resolve_host: {{ $.Values.gitlab.resolveHost | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.tls.enabled }}
    tls:
      cert_path: "/etc/tls/tls.crt"
      key_path: "/etc/tls/tls.key"
    {{- end }}
    metrics:
      log_level: {{ .Values.webserver.logLevel | quote }}
      otel:
        enabled: {{ .Values.metrics.otel.enabled }}
        {{- if .Values.metrics.otel.enabled }}
        endpoint: {{ .Values.metrics.otel.endpoint | quote }}
        {{- end }}
      prometheus:
        enabled: {{ .Values.metrics.prometheus.enabled }}
        port: {{ .Values.metrics.prometheus.port }}
    analytics:
      {{- include "gkg.analyticsConfig" . | nindent 6 }}
    billing:
      {{- include "gkg.billingConfig" . | nindent 6 }}
{{- end }}
