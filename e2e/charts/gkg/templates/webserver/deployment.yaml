{{- if .Values.webserver.enabled }}
{{- $secretKeys := list "gitlabJwtVerifyingKey" "gitlabJwtSigningKey" "graphReadPassword" }}
{{- if .Values.billing.quota.enabled }}
{{- $secretKeys = append $secretKeys "quotaApiToken" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gkg.fullname" . }}-webserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gkg.componentLabels" (dict "root" . "component" "webserver" "serviceTag" .Values.webserver.image.tag) | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.webserver.replicas }}
  selector:
    matchLabels:
      {{- include "gkg.componentSelectorLabels" (dict "root" . "component" "webserver") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gkg.componentSelectorLabels" (dict "root" . "component" "webserver") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/webserver/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "gkg.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "gkg.podSecurityContext" . | nindent 8 }}
      containers:
        - name: gkg-webserver
          image: "{{ include "gkg.serviceImageRepository" (dict "root" . "serviceRepository" .Values.webserver.image.repository) }}:{{ include "gkg.serviceImageTag" (dict "root" . "serviceTag" .Values.webserver.image.tag) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--mode=webserver"
          ports:
            - name: http
              containerPort: {{ .Values.webserver.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.webserver.service.grpcPort }}
              protocol: TCP
            {{- if .Values.metrics.prometheus.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.prometheus.port }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- include "gkg.secretVolumeMount" (dict "root" . "keys" $secretKeys) | nindent 12 }}
            {{- include "gkg.natsTlsVolumeMount" . | nindent 12 }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            {{- end }}
          {{- if .Values.webserver.probes.enabled }}
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: {{ .Values.webserver.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.webserver.probes.failureThreshold }}
          {{- end }}
          securityContext:
            {{- include "gkg.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.webserver.resources | nindent 12 }}
      {{- with .Values.webserver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webserver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webserver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gkg.fullname" . }}-webserver-config
        {{- include "gkg.secretVolume" (dict "root" . "keys" $secretKeys) | nindent 8 }}
        {{- include "gkg.natsTlsVolume" . | nindent 8 }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "tls.existingSecret is required when tls.enabled is true" .Values.tls.existingSecret }}
        {{- end }}
{{- end }}
