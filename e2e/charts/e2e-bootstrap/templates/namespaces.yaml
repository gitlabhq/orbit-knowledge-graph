{{- $namespaces := list .Values.namespaces.nats .Values.namespaces.clickhouse .Values.namespaces.siphon }}
{{- if not .Values.externalGitlab }}
{{- $namespaces = append $namespaces .Values.namespaces.gitlab }}
{{- end }}
{{- range $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
