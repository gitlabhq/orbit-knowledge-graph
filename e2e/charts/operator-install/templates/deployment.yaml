apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-operator
  labels:
    app: gitlab-operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app: gitlab-operator
  template:
    metadata:
      labels:
        app: gitlab-operator
    spec:
      serviceAccountName: gitlab-operator
      initContainers:
        # The operator's webhook server expects TLS certs. In the e2e we do
        # not provision a ValidatingWebhookConfiguration, but the server
        # still starts and crashes without certs. Generate a self-signed pair.
        - name: webhook-cert
          image: alpine/openssl:latest
          command:
            - sh
            - -c
            - |
              openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
                -keyout /certs/tls.key -out /certs/tls.crt \
                -days 1 -nodes -subj "/CN=webhook"
          volumeMounts:
            - name: webhook-certs
              mountPath: /certs
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --enable-leader-election=false
            - --metrics-secure=false
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HELM_CHARTS
              value: /charts
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      volumes:
        - name: webhook-certs
          emptyDir: {}
