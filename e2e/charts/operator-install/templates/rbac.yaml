apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-operator
---
# Use cluster-admin for the e2e spike. The GKG chart renders ServiceAccounts,
# Roles, RoleBindings, and other types that require broad RBAC. Enumerating
# every resource type the chart could render is fragile. Lock down in
# production by generating the role from controller-gen markers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-operator-e2e-admin
subjects:
  - kind: ServiceAccount
    name: gitlab-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

