image:
  repository: clickhouse/clickhouse-server
  tag: "26.6"
  pullPolicy: IfNotPresent

# 1 = a single node with plain engines. 3 = three replicas that each run an
# embedded Keeper node; the setup job then creates the databases with the
# Replicated engine ON CLUSTER and the ClusterIP service spreads requests.
replicas: 1

password: "e2e-clickhouse-password"

users:
  siphon:
    password: "e2e-siphon-ch-password"
  gitlab:
    password: "e2e-gitlab-ch-password"

databases:
  datalake: datalake
  graph: gkg

persistence:
  enabled: true
  size: 20Gi

resources:
  requests:
    cpu: 1
    memory: 4Gi
  limits:
    cpu: 4
    memory: 8Gi
