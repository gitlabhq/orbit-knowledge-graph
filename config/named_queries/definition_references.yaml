name: definition_references
description: Definitions that call the given definition, with location and type columns.
parameters:
  node_id:
    schema: { type: string, pattern: "^[1-9][0-9]{0,18}$" }
    example: "1"
query:
  gql: |
    MATCH (caller:Definition)-[:CALLS]->(def:Definition {id: {{ integer("node_id") }}})
    RETURN caller.start_line, caller.file_path, caller.name, caller.fqn, caller.definition_type, def
    LIMIT 100
