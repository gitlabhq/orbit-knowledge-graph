name: definition_references
description: Definitions that call the given definition, with location and type columns.
parameters:
  node_id:
    schema: { type: integer, minimum: 1 }
    example: 1
query:
  query_type: traversal
  nodes:
    - id: caller
      entity: Definition
      columns: [start_line, file_path, name, fqn, definition_type]
    - id: def
      entity: Definition
      node_ids: [{ $param: node_id }]
  relationships:
    - type: CALLS
      from: caller
      to: def
  limit: 100
