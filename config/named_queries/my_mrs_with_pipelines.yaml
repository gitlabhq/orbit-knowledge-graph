name: my_mrs_with_pipelines
description: My merge requests and their head pipelines
bindings: [current_user_id]
query:
  json:
    query_type: traversal
    nodes:
      - id: me
        entity: User
        node_ids:
          - { $binding: current_user_id }
        columns: [id, username]
      - id: mr
        entity: MergeRequest
        columns: [id, title, state]
      - id: pipeline
        entity: Pipeline
        columns: [id, status, duration]
    relationships:
      - { type: AUTHORED, from: me, to: mr }
      - { type: HAS_HEAD_PIPELINE, from: mr, to: pipeline }
    limit: 100
  gql: |
    MATCH (me:User {id: {{ binding("current_user_id") }}})-[:AUTHORED]->(mr:MergeRequest)-[:HAS_HEAD_PIPELINE]->(pipeline:Pipeline)
    RETURN me.id, me.username, mr.id, mr.title, mr.state, pipeline.id, pipeline.status, pipeline.duration
    LIMIT 100
