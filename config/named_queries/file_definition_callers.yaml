name: file_definition_callers
description: CALLS edges from any definition into the definitions of one file.
parameters:
  project_id:
    schema: { type: integer, minimum: 1 }
    example: 1
  file_path:
    schema: { type: string, minLength: 1, maxLength: 1024 }
    example: app/models/user.rb
query:
  gql: |
    MATCH (caller:Definition)-[:CALLS]->(def:Definition)
    WHERE def.project_id = {{ param("project_id") }} AND def.file_path = {{ param("file_path") }}
    RETURN caller, def
    LIMIT 500
