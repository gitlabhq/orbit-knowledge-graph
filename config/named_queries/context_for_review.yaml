name: context_for_review
description: "Merge request neighbors the context summary lacks: assignees, approvers, labels, milestone, and mentions. Cut at limit in no set order; check pagination.truncated."
parameters:
  node_ids:
    schema: { type: array, items: { type: integer, minimum: 1 }, minItems: 1, maxItems: 500 }
    example: [1]
  limit:
    schema: { type: integer, minimum: 1, maximum: 500 }
    example: 100
query:
  json:
    query_type: neighbors
    nodes:
      - id: center
        entity: MergeRequest
        node_ids: { $param: node_ids }
    neighbors:
      direction: both
      rel_types: [ASSIGNED, APPROVED, HAS_LABEL, IN_MILESTONE, MENTIONS]
    limit: { $param: limit }
  gql: |
    MATCH (center:MergeRequest)-[:ASSIGNED|APPROVED|HAS_LABEL|IN_MILESTONE|MENTIONS]-(neighbor)
    WHERE center.id IN {{ param("node_ids") }}
    RETURN center, neighbor
    LIMIT {{ param("limit") }}
