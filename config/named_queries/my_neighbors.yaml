name: my_neighbors
description: My neighbors in the graph
default: true
bindings: [current_user_id]
query:
  json:
    query_type: neighbors
    nodes:
      - id: me
        entity: User
        node_ids:
          - { $binding: current_user_id }
    neighbors:
      direction: both
    limit: 100
  gql: |
    MATCH (me:User {id: {{ binding("current_user_id") }}})--(neighbor)
    RETURN me, neighbor
    LIMIT 100
