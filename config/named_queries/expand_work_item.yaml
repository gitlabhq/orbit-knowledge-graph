name: expand_work_item
description: "Work item neighbors for context expansion: people, labels, milestone, project or group, closing MRs, related, parent and child items. Cut at limit in no set order; check pagination.truncated."
parameters:
  node_ids:
    schema: { type: array, items: { type: integer, minimum: 1 }, minItems: 1, maxItems: 500 }
    example: [1]
  limit:
    schema: { type: integer, minimum: 1, maximum: 500 }
    example: 100
query:
  gql: |
    MATCH (center:WorkItem)-[:AUTHORED|ASSIGNED|HAS_LABEL|IN_MILESTONE|IN_PROJECT|IN_GROUP|CLOSES|RELATED_TO|CONTAINS]-(neighbor)
    WHERE center.id IN {{ param("node_ids") }}
    RETURN center, neighbor
    LIMIT {{ param("limit") }}
