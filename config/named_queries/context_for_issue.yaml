name: context_for_issue
description: "Work item neighbors the context summary lacks: author, related, parent, and child work items, and mentions. Cut at limit in no set order; check pagination.truncated."
parameters:
  node_ids:
    schema: { type: array, items: { type: integer, minimum: 1 }, minItems: 1, maxItems: 500 }
    example: [1]
  limit:
    schema: { type: integer, minimum: 1, maximum: 500 }
    example: 100
query:
  gql: |
    MATCH (center:WorkItem)-[:AUTHORED|RELATED_TO|CONTAINS|MENTIONS]-(neighbor)
    WHERE center.id IN {{ param("node_ids") }}
    RETURN center, neighbor
    LIMIT {{ param("limit") }}
