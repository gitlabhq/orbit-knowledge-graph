name: context_for_issue
description: "Work item context the Orbit context summary lacks: author, related, parent, and child work items, and the MRs and work items it mentions or that mention it. Cut at limit in no set order; check pagination.truncated."
parameters:
  node_ids:
    schema: { type: array, items: { type: integer, minimum: 1 }, minItems: 1, maxItems: 500 }
    example: [1]
  limit:
    schema: { type: integer, minimum: 1, maximum: 500 }
    example: 100
query:
  json:
    query_type: neighbors
    nodes:
      - id: center
        entity: WorkItem
        node_ids: { $param: node_ids }
    neighbors:
      direction: both
      rel_types: [AUTHORED, RELATED_TO, CONTAINS, MENTIONS]
    limit: { $param: limit }
  gql: |
    MATCH (center:WorkItem)-[:AUTHORED|RELATED_TO|CONTAINS|MENTIONS]-(neighbor)
    WHERE center.id IN {{ param("node_ids") }}
    RETURN center, neighbor
    LIMIT {{ param("limit") }}
