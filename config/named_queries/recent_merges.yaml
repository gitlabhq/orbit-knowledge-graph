name: recent_merges
description: Recently merged merge requests and the people who merged them
query:
  json:
    query_type: traversal
    nodes:
      - id: u
        entity: User
        columns: [id, username]
      - id: mr
        entity: MergeRequest
        filters:
          state: merged
        columns: [id, title, merged_at]
    relationships:
      - { type: MERGED, from: u, to: mr }
    limit: 100
  gql: |
    MATCH (u:User)-[:MERGED]->(mr:MergeRequest {state: "merged"})
    RETURN u.id, u.username, mr.id, mr.title, mr.merged_at
    LIMIT 100
