name: definition_callees
description: Definitions the given definition calls, with location and type columns.
parameters:
  node_id:
    schema: { type: string, pattern: "^[1-9][0-9]{0,18}$" }
    example: "1"
settings:
  use_skip_indexes_if_final_exact_mode: 0
query:
  json:
    query_type: traversal
    nodes:
      - id: caller
        entity: Definition
        node_ids: [{ $param: node_id }]
      - id: callee
        entity: Definition
        columns: [start_line, file_path, name, fqn, kind]
    relationships:
      - type: CALLS
        from: caller
        to: callee
    limit: 100
  gql: |
    MATCH (caller:Definition {id: {{ integer("node_id") }}})-[:CALLS]->(callee:Definition)
    RETURN caller, callee.start_line, callee.file_path, callee.name, callee.fqn, callee.kind
    LIMIT 100
