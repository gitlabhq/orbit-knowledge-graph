name: context_for_branch
description: "Branch context: the branch's pipelines, newest first, with status, sha, source, why each failed, and the merge request it ran for. The json spelling cannot compare a pipeline's ref with the branch name, so it lists the project's pipelines; the gql spelling keeps only the branch's."
parameters:
  node_ids:
    schema: { type: array, items: { type: integer, minimum: 1 }, minItems: 1, maxItems: 500 }
    example: [1]
  limit:
    schema: { type: integer, minimum: 1, maximum: 500 }
    example: 100
query:
  json:
    query_type: traversal
    nodes:
      - id: center
        entity: Branch
        node_ids: { $param: node_ids }
        columns: [id, name, is_default]
      - id: project
        entity: Project
        columns: [id, full_path]
      - id: pipeline
        entity: Pipeline
        columns: [id, status, ref, sha, source, failure_reason, merge_request_id, created_at]
    relationships:
      - { type: IN_PROJECT, from: center, to: project }
      - { type: IN_PROJECT, from: pipeline, to: project }
    order_by: "-pipeline.id"
    limit: { $param: limit }
  gql: |
    MATCH (center:Branch)-[:IN_PROJECT]->(project:Project)<-[:IN_PROJECT]-(pipeline:Pipeline)
    WHERE center.id IN {{ param("node_ids") }} AND pipeline.ref = center.name
    RETURN center.id, center.name, center.is_default, project.id, project.full_path, pipeline.id, pipeline.status, pipeline.ref, pipeline.sha, pipeline.source, pipeline.failure_reason, pipeline.merge_request_id, pipeline.created_at
    ORDER BY pipeline.id DESC
    LIMIT {{ param("limit") }}
