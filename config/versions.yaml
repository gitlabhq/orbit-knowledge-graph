# Pinned versions and upstream revisions. Deserialized into
# orbit_versions::Versions (every key is required, unknown keys fail
# the build). Shell scripts read vendored entries via yq.

# Graph schema version; prefixes every versioned ClickHouse table (vN_).
# Bump with `mise schema:bump`, which also appends a migration ledger entry.
schema: 101

# Accepted query-DSL shape. Bump when graph_query.schema.json or the
# compiler's input/validate passes change what queries are accepted.
query_dsl: 12.1.14

# Response envelope of the raw (JSON) formatter.
raw_output_format: 5.0.4

# Response envelope of the TOON formatter (format=llm query results).
toon_output_format: 1.0.0

# Response envelope of the GQL table formatter.
gql_output_format: 1.0.1

# Vendored dependencies. Each entry declares its pins, artifact location,
# and vendor/check scripts. Vendor scripts read pins and write computed
# checksums back into this file via `yq -i`. Run `mise vendor <name>`.
vendored:
  # gitlab-org/gitlab commit whose SystemNoteMetadata::ICON_TYPES is vendored.
  gitlab_system_note_actions:
    version: ea52f8c3adc370db76545ecd82728710f2609800
    vendor_dir: config/vendored
    check_script: scripts/vendored/gitlab_system_note_actions/check.sh

  # Iglu schema version pins. Edit a pin here, then run `mise vendor -- iglu`
  # to fetch the schema JSON from the upstream Iglu registry.
  iglu:
    vendor_dir: config/schemas/iglu
    vendor_script: scripts/vendored/iglu/bump.sh
    check_script: scripts/vendored/iglu/check.sh
    pins:
      orbit_query: 2-2-1
      orbit_common: 1-0-4
      orbit_cli_command: 1-0-1
      orbit_cli_setup: 1-0-0
      orbit_code_indexing: 2-0-0
      orbit_sdlc_indexing: 3-0-0
