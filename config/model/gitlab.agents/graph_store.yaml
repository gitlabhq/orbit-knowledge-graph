kind: storage
package: gitlab.agents
store: graph
entities:
  AgentSession:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [Delta(8), LZ4]}
        flow_type: {default: "'other'", codec: [LZ4]}
        source: {default: "'gitlab_duo'", codec: [LZ4]}
        project_id: {codec: [Delta(8), LZ4]}
        session_started_at: {codec: [Delta(8), ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        flow_type: {type: set(64), granularity: 2}
        source: {type: set(8), granularity: 2}
        project_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_agent_session, key: id}}
