kind: storage
package: gitlab.agents
store: graph
entities:
  AgentSession:
    complete: true
    accepts: [id, project_id]
    table: gl_agent_session
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [Delta(8), LZ4]}}
      flow_type: {stored_as_text: true, backend: {type: LowCardinality(String), codec: [LZ4]}}
      source: {backend: {type: LowCardinality(String), codec: [LZ4]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [Delta(8), LZ4]}}
      session_started_at: {immutable: true, backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [id, flow_type, source, project_id], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        flow_type: {type: set(64), granularity: 2}
        source: {type: set(8), granularity: 2}
        project_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_agent_session, key: id}}
