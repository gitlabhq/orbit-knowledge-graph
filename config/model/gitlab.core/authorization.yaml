kind: authorization
package: gitlab.core
entities:
  Group:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_group, resource: group}]
    properties:
      open: [id, full_path, name, description, created_at, updated_at, visibility_level]
      hidden: [traversal_path]

  Note:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_note, resource: note}]
    properties:
      open: [id, note, noteable_type, noteable_id, line_code, created_at, updated_at, discussion_id,
             resolved_at, internal, confidential, commit_id, st_diff, project_id, author_id]
      hidden: [traversal_path]

  Project:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_code, resource: project}]
    properties:
      open: [id, full_path, name, description, created_at, updated_at, visibility_level, archived,
             star_count, last_activity_at]
      hidden: [traversal_path]

  User:
    scope: global
    permission: read
    checks: [{provider: rails, permission: read_user, resource: user}]
    properties:
      open: [id, username, name, created_at, state, avatar_url, last_activity_on, user_type]
      exact: [public_email]
      admin: [first_name, last_name, updated_at, preferred_language, private_profile, is_admin,
              is_auditor, is_external]
      admin_exact: [email]
