kind: storage
package: gitlab.core
store: graph
entities:
  Group:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        name: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        visibility_level: {default: "''", codec: [LZ4]}
        full_path: {default: "''", codec: [ZSTD(3)]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        name: text
        full_path: bloom_filter(0.0001)
        description: text
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [created_at, updated_at]
      path_lookups: {id: {table: gl_group, key: id}, full_path: {table: gl_group, key: full_path}}

  Note:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        note: {default: "''", codec: [ZSTD(3)]}
        noteable_type: {default: "''", codec: [LZ4]}
        noteable_id: {codec: [Delta(8), LZ4]}
        line_code: {default: "''", codec: [ZSTD(1)]}
        commit_id: {default: "''", codec: [ZSTD(1)]}
        st_diff: {default: "''", codec: [ZSTD(3)]}
        discussion_id: {codec: [ZSTD(1)]}
        resolved_at: {codec: [Delta(8), ZSTD(1)]}
        internal: {default: "false"}
        confidential: {}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [Delta(8), LZ4]}
        author_id: {codec: [Delta(8), LZ4]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        noteable_type: {type: set(14), granularity: 2}
        internal: minmax
        confidential: minmax
        id: bloom_filter(0.0001)
        note: text
        discussion_id: bloom_filter(0.0001)
        noteable_id: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
        author_id: bloom_filter(0.0001)
        created_at: minmax
      settings: {add_minmax_index_for_temporal_columns: "1"}
      high_fan_out: [noteable_id]
      epoch_nulls: [created_at, updated_at, resolved_at]
      path_lookups: {id: {table: gl_note, key: id}}

  Project:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        name: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        visibility_level: {default: "''", codec: [LZ4]}
        full_path: {default: "''", codec: [ZSTD(3)]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        archived: {type: Nullable(Bool)}
        star_count: {type: Nullable(Int64), codec: [Delta(8), LZ4]}
        last_activity_at: {codec: [Delta(8), ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        archived: minmax
        id: bloom_filter(0.0001)
        name: text
        full_path: bloom_filter(0.0001)
        description: text
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [created_at, updated_at, last_activity_at]
      path_lookups:
        id: {table: gl_project, key: id}
        full_path: {table: gl_project, key: full_path}

  User:
    path_column: null
    backend:
      sort_key: [id]
      primary_key: [id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        username: {default: "''", codec: [ZSTD(1)]}
        email: {default: "''", codec: [ZSTD(1)]}
        name: {default: "''", codec: [ZSTD(1)]}
        first_name: {default: "''", codec: [ZSTD(1)]}
        last_name: {default: "''", codec: [ZSTD(1)]}
        state: {default: "''", codec: [LZ4]}
        avatar_url: {codec: [ZSTD(1)]}
        public_email: {default: "''", codec: [ZSTD(1)]}
        preferred_language: {default: "''", codec: [ZSTD(1)]}
        last_activity_on: {default: "'1970-01-01'", codec: [Delta(4), ZSTD(1)]}
        private_profile: {default: "false"}
        is_admin: {default: "false"}
        is_auditor: {default: "false"}
        is_external: {default: "false"}
        user_type: {default: "''", codec: [LZ4]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
      indexes:
        _deleted: minmax
        state: {type: set(10), granularity: 2}
        user_type: {type: set(26), granularity: 2}
        private_profile: minmax
        is_admin: minmax
        is_auditor: minmax
        is_external: minmax
        username: text
        name: text
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [created_at, updated_at, last_activity_on]
