kind: storage
package: gitlab
store: graph
engine:
  kind: clickhouse
  connection: main
  table: gl_{entity}
  path_column: traversal_path
  backend:
    version_column: _version
    deleted_column: _deleted
    engine: ReplacingMergeTree(_version, _deleted)
    sort_key: [traversal_path, id]
    columns:
      _version: {type: "DateTime64(6, 'UTC')", default: now64(6), codec: [Delta(8), ZSTD(1)]}
      _deleted: {type: Bool, default: "false"}
    settings:
      index_granularity: "1024"
      allow_experimental_replacing_merge_with_cleanup: "1"
      enable_block_number_column: "1"
      enable_block_offset_column: "1"
    edge_tables:
      gl_ci_edge:
        sort_key:
        - traversal_path
        - relationship_kind
        - source_id
        - target_id
        - source_kind
        - target_kind
        primary_key: [traversal_path, relationship_kind, source_id]
        columns:
          traversal_path: {type: String, default: "'0/'", codec: [ZSTD(1)]}
          source_id: {type: Int64, codec: [Delta(8), ZSTD(1)]}
          source_kind: {type: LowCardinality(String), codec: [LZ4]}
          relationship_kind: {type: LowCardinality(String), codec: [LZ4]}
          target_id: {type: Int64, codec: [T64, ZSTD(1)]}
          target_kind: {type: LowCardinality(String), codec: [LZ4]}
          source_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
          target_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
        indexes:
          _deleted: minmax
          source_id: bloom_filter(0.0001)
          target_id: bloom_filter(0.0001)
          source_tags: {type: text(tokenizer = 'array'), granularity: 64, name: source_tags_idx}
          target_tags: {type: text(tokenizer = 'array'), granularity: 64, name: target_tags_idx}
        writers:
        - BUILT_BY
        - CHILD_OF
        - DEPLOYED_TO
        - Deployment
        - Environment
        - Job
        - MergeRequest
        - Pipeline
        - SecurityScan
        - Stage
        - TRIGGERS_PIPELINE
      gl_code_edge:
        domains: [source_code]
        sort_key:
        - traversal_path
        - relationship_kind
        - project_id
        - branch
        - source_id
        - target_id
        - source_kind
        - target_kind
        primary_key: [traversal_path, relationship_kind, project_id, branch]
        columns:
          traversal_path: {type: String, default: "'0/'", codec: [ZSTD(1)]}
          project_id: {type: Int64, codec: [T64, ZSTD(1)]}
          branch: {type: String, codec: [ZSTD(1)]}
          source_id: {type: Int64, codec: [Delta(8), ZSTD(1)]}
          source_kind: {type: LowCardinality(String), codec: [LZ4]}
          relationship_kind: {type: LowCardinality(String), codec: [LZ4]}
          target_id: {type: Int64, codec: [T64, ZSTD(1)]}
          target_kind: {type: LowCardinality(String), codec: [LZ4]}
          source_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
          target_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
        indexes:
          _deleted: minmax
          source_id: bloom_filter(0.0001)
          target_id: bloom_filter(0.0001)
          project_id: bloom_filter(0.0001)
          branch: bloom_filter(0.0001)
          source_tags: {type: text(tokenizer = 'array'), granularity: 64, name: source_tags_idx}
          target_tags: {type: text(tokenizer = 'array'), granularity: 64, name: target_tags_idx}
        writers: [Branch, Definition, Directory, File, ImportedSymbol]
      gl_diff_edge:
        sort_key:
        - traversal_path
        - relationship_kind
        - source_id
        - target_id
        - source_kind
        - target_kind
        primary_key: [traversal_path, relationship_kind, source_id]
        columns:
          traversal_path: {type: String, default: "'0/'", codec: [ZSTD(1)]}
          source_id: {type: Int64, codec: [Delta(8), ZSTD(1)]}
          source_kind: {type: LowCardinality(String), codec: [LZ4]}
          relationship_kind: {type: LowCardinality(String), codec: [LZ4]}
          target_id: {type: Int64, codec: [T64, ZSTD(1)]}
          target_kind: {type: LowCardinality(String), codec: [LZ4]}
          source_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
          target_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
        indexes:
          _deleted: minmax
          source_id: bloom_filter(0.0001)
          target_id: bloom_filter(0.0001)
          source_tags: {type: text(tokenizer = 'array'), granularity: 64, name: source_tags_idx}
          target_tags: {type: text(tokenizer = 'array'), granularity: 64, name: target_tags_idx}
        writers: [IN_PROJECT, MergeRequest, MergeRequestDiff, MergeRequestDiffFile]
      gl_edge:
        default: true
        sort_key:
        - traversal_path
        - relationship_kind
        - source_id
        - target_id
        - source_kind
        - target_kind
        primary_key: [traversal_path, relationship_kind, source_id]
        columns:
          traversal_path: {type: String, default: "'0/'", codec: [ZSTD(1)]}
          source_id: {type: Int64, codec: [Delta(8), ZSTD(1)]}
          source_kind: {type: LowCardinality(String), codec: [LZ4]}
          relationship_kind: {type: LowCardinality(String), codec: [LZ4]}
          target_id: {type: Int64, codec: [T64, ZSTD(1)]}
          target_kind: {type: LowCardinality(String), codec: [LZ4]}
          source_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
          target_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
        indexes:
          _deleted: minmax
          source_id: bloom_filter(0.0001)
          target_id: bloom_filter(0.0001)
          source_tags: {type: text(tokenizer = 'array'), granularity: 64, name: source_tags_idx}
          target_tags: {type: text(tokenizer = 'array'), granularity: 64, name: target_tags_idx}
        writers:
        - APPROVED
        - ASSIGNED
        - AgentSession
        - CLOSES
        - CONTAINS
        - CREATED_MR
        - ContainerRepository
        - DECLARES_DEPENDENCY
        - Dependency
        - Group
        - HAS_LABEL
        - Label
        - MEMBER_OF
        - MergeRequest
        - Milestone
        - Note
        - Package
        - PackageFile
        - Project
        - RELATED_TO
        - REOPENED
        - REVIEWER
        - SystemNote
        - WorkItem
      gl_sec_edge:
        sort_key:
        - traversal_path
        - relationship_kind
        - source_id
        - target_id
        - source_kind
        - target_kind
        primary_key: [traversal_path, relationship_kind, source_id]
        columns:
          traversal_path: {type: String, default: "'0/'", codec: [ZSTD(1)]}
          source_id: {type: Int64, codec: [Delta(8), ZSTD(1)]}
          source_kind: {type: LowCardinality(String), codec: [LZ4]}
          relationship_kind: {type: LowCardinality(String), codec: [LZ4]}
          target_id: {type: Int64, codec: [T64, ZSTD(1)]}
          target_kind: {type: LowCardinality(String), codec: [LZ4]}
          source_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
          target_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
        indexes:
          _deleted: minmax
          source_id: bloom_filter(0.0001)
          target_id: bloom_filter(0.0001)
          source_tags: {type: text(tokenizer = 'array'), granularity: 64, name: source_tags_idx}
          target_tags: {type: text(tokenizer = 'array'), granularity: 64, name: target_tags_idx}
        writers:
        - FIXES
        - Finding
        - HAS_IDENTIFIER
        - HAS_VULNERABILITY
        - IN_PROJECT
        - SecurityScan
        - Vulnerability
        - VulnerabilityIdentifier
        - VulnerabilityOccurrence
        - VulnerabilityScanner
