    tables:
      namespace_storage_snapshot:
        versioned: false
        engine: ReplacingMergeTree
        columns:
          snapshot_date: {type: Date32}
          schema_version: {type: Int64}
          logical_table: {type: String}
          top_level_namespace: {type: String}
          compressed_bytes: {type: Int64}
        sort_key: [logical_table, top_level_namespace, snapshot_date]
        settings:
          allow_experimental_replacing_merge_with_cleanup: "1"
          enable_block_number_column: "1"
          enable_block_offset_column: "1"
        ttl: snapshot_date + INTERVAL 400 DAY
      checkpoint:
        engine: ReplacingMergeTree(_version, _deleted)
        columns:
          key: {type: String, codec: [ZSTD(1)]}
          watermark: {type: "DateTime64(6, 'UTC')", codec: [Delta(8), ZSTD(1)]}
          cursor_values: {type: String, default: "''", codec: [ZSTD(1)]}
          attempts: {type: Int64, default: "0", codec: [ZSTD(1)]}
          indexed_at: {type: "Nullable(DateTime64(6, 'UTC'))", codec: [Delta(8), ZSTD(1)]}
          _version: {type: "DateTime64(6, 'UTC')", default: now64(6), codec: [Delta(8), ZSTD(1)]}
          _deleted: {type: Bool, default: "false"}
        sort_key: [key]
        settings:
          allow_experimental_replacing_merge_with_cleanup: "1"
          enable_block_number_column: "1"
          enable_block_offset_column: "1"
      namespace_deletion_schedule:
        engine: ReplacingMergeTree(_version, _deleted)
        columns:
          namespace_id: {type: Int64, codec: [ZSTD(1)]}
          traversal_path: {type: String, codec: [ZSTD(1)]}
          scheduled_deletion_date: {type: "DateTime64(6, 'UTC')", codec: [Delta(8), ZSTD(1)]}
          _version: {type: "DateTime64(6, 'UTC')", default: now64(6), codec: [Delta(8), ZSTD(1)]}
          _deleted: {type: Bool, default: "false"}
        sort_key: [namespace_id, traversal_path]
        settings:
          allow_experimental_replacing_merge_with_cleanup: "1"
          enable_block_number_column: "1"
          enable_block_offset_column: "1"
      code_indexing_checkpoint:
        engine: ReplacingMergeTree(_version, _deleted)
        columns:
          traversal_path: {type: String, codec: [ZSTD(1)]}
          project_id: {type: Int64, codec: [ZSTD(1)]}
          branch: {type: String, codec: [ZSTD(1)]}
          last_task_id: {type: Int64, codec: [ZSTD(1)]}
          last_commit: {type: String, default: "''", codec: [ZSTD(1)]}
          indexed_at: {type: "Nullable(DateTime64(6, 'UTC'))", codec: [Delta(8), ZSTD(1)]}
          attempts: {type: Int64, default: "0", codec: [ZSTD(1)]}
          is_default_branch: {type: Bool, default: "false"}
          _version: {type: "DateTime64(6, 'UTC')", default: now64(6), codec: [Delta(8), ZSTD(1)]}
          _deleted: {type: Bool, default: "false"}
        sort_key: [traversal_path, project_id, branch]
        settings:
          allow_experimental_replacing_merge_with_cleanup: "1"
          enable_block_number_column: "1"
          enable_block_offset_column: "1"
    dictionaries:
      gl_project_traversal_paths_dict:
        source: gl_project
        key: id
        attributes: {id: Int64, traversal_path: String}
        layout: hashed
        lifetime: {min: 60, max: 300}
      gl_group_traversal_paths_dict:
        source: gl_group
        key: id
        attributes: {id: Int64, traversal_path: String}
        layout: hashed
        lifetime: {min: 60, max: 300}
    refreshable_views:
      namespace_storage_snapshot_refresh:
        append_to: namespace_storage_snapshot
        refresh: EVERY 1 DAY OFFSET 2 HOUR
        select: |
          {% for table in graph.tables if table.has_traversal_path %}
          SELECT
              today() AS snapshot_date,
              {{ schema.version }} AS schema_version,
              '{{ table.logical_name }}' AS logical_table,
              top_level_namespace,
              toInt64(sum(attributed)) AS compressed_bytes
          FROM (
            SELECT top_level_namespace,
                   data_compressed_bytes * (w_eff / sum(w_eff) OVER (PARTITION BY part_name)) AS attributed
            FROM (
              SELECT part_name, top_level_namespace, data_compressed_bytes,
                     if(max(w_raw) OVER (PARTITION BY part_name) = 0, n_granules, w_raw) AS w_eff
              FROM (
                SELECT pp.part_name AS part_name, pp.top_level_namespace AS top_level_namespace, pp.n_granules AS n_granules,
                       p.data_compressed_bytes AS data_compressed_bytes,
                       if(p.part_type = 'Wide', pp.w_sum, pp.w_min) AS w_raw
                FROM (
                  SELECT part_name, top_level_namespace,
                         sum(d_sum) AS w_sum, sum(d_min) AS w_min, toInt64(count()) AS n_granules
                  FROM (
                    SELECT
                      part_name,
                      arrayStringConcat(arraySlice(splitByChar('/', traversal_path), 1, 2), '/') AS top_level_namespace,
                      greatest(toInt64(leadInFrame(sum_off, 1, sum_off) OVER w) - toInt64(sum_off), 0) AS d_sum,
                      greatest(toInt64(leadInFrame(min_off, 1, min_off) OVER w) - toInt64(min_off), 0) AS d_min
                    FROM (
                      SELECT part_name, mark_number, traversal_path,
                             arraySum(x -> ifNull(x.1, 0), array(COLUMNS('\\.mark$'))) AS sum_off,
                             arrayMin(x -> ifNull(x.1, 0), array(COLUMNS('\\.mark$'))) AS min_off
                      FROM mergeTreeIndex(currentDatabase(), '{{ table.physical_name }}', with_marks = true)
                    )
                    WINDOW w AS (PARTITION BY part_name ORDER BY mark_number ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING)
                  )
                  GROUP BY part_name, top_level_namespace
                ) pp
                JOIN (
                  SELECT name, part_type, data_compressed_bytes
                  FROM system.parts
                  WHERE database = currentDatabase() AND active
                    AND table = '{{ table.physical_name }}'
                ) p ON p.name = pp.part_name
              )
            )
          )
          GROUP BY top_level_namespace
          UNION ALL
          {% endfor %}
          SELECT
              today() AS snapshot_date,
              {{ schema.version }} AS schema_version,
              replaceRegexpOne(table, '^v\\d+_', '') AS logical_table,
              '0/' AS top_level_namespace,
              toInt64(sum(data_compressed_bytes)) AS compressed_bytes
          FROM system.parts
          WHERE database = currentDatabase() AND active
            AND table IN (
          {% for table in graph.tables if table.global %}
              '{{ table.physical_name }}'{% if not loop.last %},{% endif %}
          {% endfor %}
            )
          GROUP BY table
relationships:
  AUTHORED:
    variants:
      User -> Note: {fk: author_id}
      User -> MergeRequest: {fk: author_id}
      User -> Vulnerability: {fk: author_id, backend: {table: gl_sec_edge}}
      User -> WorkItem: {fk: author_id}

  AUTO_CANCELED_BY:
    variants:
      Pipeline -> Pipeline: {fk: auto_canceled_by_id, backend: {table: gl_ci_edge}}
      Job -> Pipeline: {fk: auto_canceled_by_id, backend: {table: gl_ci_edge}}

  BUILT_BY:
    variants:
      Package -> Pipeline: {backend: {table: gl_ci_edge}}
      PackageFile -> Pipeline: {backend: {table: gl_ci_edge}}

  CALLS: {columns: {project_id: project_id, branch: branch}}
