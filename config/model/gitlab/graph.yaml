kind: graph
package: gitlab
relationships:
  APPROVED: {description: User who approved a merge request, variants: [User -> MergeRequest]}
  ASSIGNED:
    description: Assignment relationship between users and entities
    variants: [User -> MergeRequest, User -> WorkItem]

  AUTHORED:
    description: Authorship relationship between users and entities
    variants: [User -> Note, User -> MergeRequest, User -> Vulnerability, User -> WorkItem]

  AUTO_CANCELED_BY:
    description: Entity was auto-canceled by a newer pipeline
    variants: [Pipeline -> Pipeline, Job -> Pipeline]

  BUILT_BY:
    description: Package or package file was built by a CI/CD pipeline
    variants: [Package -> Pipeline, PackageFile -> Pipeline]

  CALLS:
    description: Call relationships in source code representing function/method invocations
    variants:
    - Definition -> Definition
    - File -> Definition
    - Definition -> ImportedSymbol
    - File -> ImportedSymbol

  CHILD_OF:
    description: >-
      Pipeline was triggered as a child of another pipeline (downstream pipeline
      relationship)
    variants: [Pipeline -> Pipeline]

  CLOSED:
    description: User who closed a work item
    variants: [User -> WorkItem, User -> MergeRequest]

  CLOSES:
    description: Merge request closes a work item when merged
    variants: [MergeRequest -> WorkItem]

  CONFIRMED_BY: {description: User who confirmed a vulnerability, variants: [User -> Vulnerability]}
  CONTAINS:
    description: Container relationship for core entities (hierarchy/ownership)
    variants:
    - Group -> Group
    - Group -> Project
    - User -> Project
    - Project -> Branch
    - WorkItem -> WorkItem
    - Branch -> Directory
    - Branch -> File
    - Directory -> Directory
    - Directory -> File

  CREATED_FOR_MR:
    description: Environment was first created by a merge request pipeline
    variants: [Environment -> MergeRequest]

  CREATED_MR:
    description: Agent session created a merge request
    variants: [AgentSession -> MergeRequest]

  CREATOR: {description: User created project, variants: [User -> Project]}
  DECLARES_DEPENDENCY:
    description: Package declares a dependency
    variants: [Package -> Dependency]

  DEFINES:
    description: Definition relationships in source code
    variants: [File -> Definition, Definition -> Definition]

  DEPLOYED_BY: {description: User who triggered a deployment, variants: [User -> Deployment]}
  DEPLOYED_TO:
    description: Merge request was deployed as part of a deployment
    variants: [MergeRequest -> Deployment]

  DETECTED_BY:
    description: Finding was detected by a vulnerability scanner
    variants: [Finding -> VulnerabilityScanner, VulnerabilityOccurrence -> VulnerabilityScanner]

  DISMISSED_BY: {description: User who dismissed a vulnerability, variants: [User -> Vulnerability]}
  EXTENDS:
    description: >-
      Supertype relationships in source code (inheritance, interface implementation,
      struct embedding, mixin composition)
    variants: [Definition -> Definition]

  FIXES:
    description: Merge request fixes a vulnerability
    variants: [MergeRequest -> Vulnerability]

  HAS_DIFF:
    description: Diff snapshots of a merge request
    variants: [MergeRequest -> MergeRequestDiff]

  HAS_FILE:
    description: Files changed in a merge request diff
    variants: [MergeRequestDiff -> MergeRequestDiffFile]

  HAS_FINDING:
    description: Entity has associated finding or vulnerability occurrence
    variants: [Vulnerability -> VulnerabilityOccurrence, SecurityScan -> Finding]

  HAS_HEAD_PIPELINE:
    description: >-
      Merge request's head pipeline (pipeline running against the tip of the source
      branch)
    variants: [MergeRequest -> Pipeline]

  HAS_IDENTIFIER:
    description: Entity has associated vulnerability identifier (CVE, CWE, etc.)
    variants:
    - Finding -> VulnerabilityIdentifier
    - VulnerabilityOccurrence -> VulnerabilityIdentifier

  HAS_JOB:
    description: Pipeline or stage contains job relationship
    variants: [Stage -> Job, Pipeline -> Job]

  HAS_LABEL:
    description: Entity has a label applied
    variants: [WorkItem -> Label, MergeRequest -> Label]

  HAS_LATEST_DIFF:
    description: >-
      Merge request's most recent diff snapshot (points to the latest
      MergeRequestDiff)
    variants: [MergeRequest -> MergeRequestDiff]

  HAS_NOTE:
    description: Entity has a note/comment attached
    variants: [MergeRequest -> Note, WorkItem -> Note, Vulnerability -> Note]

  HAS_PACKAGE_FILE:
    description: Package contains a package file
    variants: [Package -> PackageFile]

  HAS_STAGE: {description: Pipeline contains stage relationship, variants: [Pipeline -> Stage]}
  HAS_VULNERABILITY:
    description: Registry package is affected by a known security vulnerability
    variants: [Package -> Vulnerability]

  IMPORTS:
    description: Import relationships in source code
    variants: [File -> ImportedSymbol, ImportedSymbol -> Definition]

  IN_ENVIRONMENT:
    description: Deployment targets an environment
    variants: [Deployment -> Environment]

  IN_GROUP:
    description: Entity belongs to a group
    variants: [Milestone -> Group, Label -> Group, WorkItem -> Group]

  IN_MILESTONE:
    description: Entity belongs to a milestone
    variants: [WorkItem -> Milestone, MergeRequest -> Milestone]

  IN_PIPELINE:
    description: Entity belongs to a pipeline
    variants: [SecurityScan -> Pipeline, Job -> Pipeline]

  IN_PROJECT:
    description: Project association for entities
    variants:
    - Note -> Project
    - MergeRequest -> Project
    - Pipeline -> Project
    - Stage -> Project
    - Job -> Project
    - Vulnerability -> Project
    - Finding -> Project
    - VulnerabilityIdentifier -> Project
    - WorkItem -> Project
    - Milestone -> Project
    - Label -> Project
    - SecurityScan -> Project
    - Branch -> Project
    - Deployment -> Project
    - Environment -> Project
    - MergeRequestDiff -> Project
    - MergeRequestDiffFile -> Project
    - VulnerabilityScanner -> Project
    - VulnerabilityOccurrence -> Project
    - Package -> Project
    - PackageFile -> Project
    - ContainerRepository -> Project
    - Dependency -> Project
    - AgentSession -> Project

  LAST_EDITED_BY:
    description: User who most recently edited an entity's content (title/description)
    variants: [User -> MergeRequest]

  MEMBER_OF:
    description: A user is a member of a group or project
    variants: [User -> Group, User -> Project]

  MENTIONS:
    description: >-
      One merge request or work item references another in its description or a
      comment, recorded from the cross-reference system note GitLab writes on mention.
    variants:
    - MergeRequest -> MergeRequest
    - MergeRequest -> WorkItem
    - WorkItem -> MergeRequest
    - WorkItem -> WorkItem

  MERGED: {description: User who merged a merge request, variants: [User -> MergeRequest]}
  MERGED_AT_COMMIT:
    description: The commit a merge request was merged at, sourced from the merge_requests row.
    variants: [MergeRequest -> Commit]

  OCCURRENCE_OF:
    description: Vulnerability occurrence is an occurrence of a vulnerability
    variants: [VulnerabilityOccurrence -> Vulnerability]

  ON_BRANCH:
    description: Code entities belong to a specific branch
    variants: [Directory -> Branch, File -> Branch]

  OWNER:
    description: Ownership relationship between users and groups/projects
    variants: [User -> Group]

  RAN_BY: {description: Security scan was executed by a CI job, variants: [SecurityScan -> Job]}
  RELATED_TO:
    description: Related or blocking relationship between work items
    variants: [WorkItem -> WorkItem]

  REOPENED:
    description: User who reopened a merge request or work item (ADR 013)
    variants: [User -> MergeRequest, User -> WorkItem]

  RESOLVED_BY: {description: User who resolved a vulnerability, variants: [User -> Vulnerability]}
  REVIEWER:
    description: Review assignment relationship between users and merge requests
    variants: [User -> MergeRequest]

  RUNS_ON: {description: Job executed on a runner, variants: [Job -> Runner]}
  SCANS:
    description: VulnerabilityScanner scans a project for security vulnerabilities
    variants: [VulnerabilityScanner -> Project]

  SOURCE_PROJECT:
    description: Merge request's source project (differs from target project for fork-based MRs)
    variants: [MergeRequest -> Project]

  TRIGGERED:
    description: Trigger relationship between entities
    variants: [User -> Pipeline, MergeRequest -> Pipeline, User -> Job]

  TRIGGERED_BY_PIPELINE:
    description: >-
      Job was triggered by an upstream pipeline (child pipeline relationship from the
      job side)
    variants: [Job -> Pipeline]

  TRIGGERS_PIPELINE:
    description: Bridge job triggered a downstream pipeline
    variants: [Job -> Pipeline]

  UPDATED_BY:
    description: User who most recently updated an entity (non-content changes)
    variants: [User -> MergeRequest]
