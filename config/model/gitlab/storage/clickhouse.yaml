          source_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
          target_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
        indexes:
          _deleted: minmax
          source_id: bloom_filter(0.0001)
          target_id: bloom_filter(0.0001)
          source_tags: {type: text(tokenizer = 'array'), granularity: 64, name: source_tags_idx}
          target_tags: {type: text(tokenizer = 'array'), granularity: 64, name: target_tags_idx}
      gl_sec_edge:
        sort_key:
        - traversal_path
        - relationship_kind
        - source_id
        - target_id
        - source_kind
        - target_kind
        primary_key: [traversal_path, relationship_kind, source_id]
        columns:
          traversal_path: {type: String, default: "'0/'", codec: [ZSTD(1)]}
          source_id: {type: Int64, codec: [Delta(8), ZSTD(1)]}
          source_kind: {type: LowCardinality(String), codec: [LZ4]}
          relationship_kind: {type: LowCardinality(String), codec: [LZ4]}
          target_id: {type: Int64, codec: [T64, ZSTD(1)]}
          target_kind: {type: LowCardinality(String), codec: [LZ4]}
          source_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
          target_tags: {type: Array(LowCardinality(String)), codec: [LZ4]}
        indexes:
          _deleted: minmax
          source_id: bloom_filter(0.0001)
          target_id: bloom_filter(0.0001)
          source_tags: {type: text(tokenizer = 'array'), granularity: 64, name: source_tags_idx}
          target_tags: {type: text(tokenizer = 'array'), granularity: 64, name: target_tags_idx}
