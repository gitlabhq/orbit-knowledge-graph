kind: authorization
package: gitlab
permissions: [read, read_security, read_build, read_code, read_container_image, read_deployment, read_environment, read_group, read_label, read_merge_request, read_milestone, read_note, read_package, read_pipeline, read_runner, read_scan, read_security_resource, read_user, read_vulnerability, read_vulnerability_scanner, read_work_item]
scopes:
  namespace: {kind: hierarchy, provider: gitlab_session}
  global: {kind: global, provider: gitlab_session}
relationships:
  APPROVED:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  ASSIGNED:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  AUTHORED:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  AUTO_CANCELED_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  BUILT_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  CALLS:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  CHILD_OF:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  CLOSED:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  CLOSES:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  CONFIRMED_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  CONTAINS:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
    variants:
      Group -> Group: {clickhouse: {scope_key: traversal_path, of: nested}}
      Group -> Project: {clickhouse: {scope_key: traversal_path, of: nested}}
      WorkItem -> WorkItem: {clickhouse: {scope_key: traversal_path, of: own}}
  CREATED_FOR_MR:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  CREATED_MR:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  CREATOR:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  DECLARES_DEPENDENCY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  DEFINES:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  DEPLOYED_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  DEPLOYED_TO:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  DETECTED_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: own}}
    variants:
      VulnerabilityOccurrence -> VulnerabilityScanner: {clickhouse: {scope_key: traversal_path, of: both}}
  DISMISSED_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  EXTENDS:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  FIXES:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  HAS_DIFF:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_FILE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_FINDING:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_HEAD_PIPELINE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_IDENTIFIER:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: own}}
    variants:
      VulnerabilityOccurrence -> VulnerabilityIdentifier: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_JOB:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_LABEL:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  HAS_LATEST_DIFF:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_NOTE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: own}}
  HAS_PACKAGE_FILE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_STAGE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  HAS_VULNERABILITY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  IMPORTS:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
    variants:
      ImportedSymbol -> Definition: {clickhouse: {scope_key: traversal_path, of: source}}
  IN_ENVIRONMENT:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  IN_GROUP:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: holder}}
  IN_MILESTONE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  IN_PIPELINE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  IN_PROJECT:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: holder}}
  LAST_EDITED_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  MEMBER_OF:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  MENTIONS:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: own}}
  MERGED:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  MERGED_AT_COMMIT:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  OCCURRENCE_OF:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  ON_BRANCH:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  OWNER:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  RAN_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  RELATED_TO:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  REOPENED:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  RESOLVED_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  REVIEWER:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  RUNS_ON:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  SCANS:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: both}}
  SOURCE_PROJECT:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  TRIGGERED:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
    variants:
      MergeRequest -> Pipeline: {clickhouse: {scope_key: traversal_path, of: both}}
  TRIGGERED_BY_PIPELINE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: own}}
  TRIGGERS_PIPELINE:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
  UPDATED_BY:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: target}}
