kind: storage
package: gitlab.packages
store: graph
entities:
  Dependency:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [Delta(8), LZ4]}
        name: {default: "''", codec: [ZSTD(1)]}
        version_pattern: {default: "''", codec: [ZSTD(1)]}
        project_id: {codec: [Delta(8), LZ4]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.001)
        name: text
        project_id: bloom_filter(0.001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_dependency, key: id}}

  Package:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        name: {default: "''", codec: [ZSTD(1)]}
        version: {codec: [ZSTD(1)]}
        package_type: {default: "''", codec: [LZ4]}
        status: {default: "''", codec: [LZ4]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        name: text
        package_type: {type: set(16), granularity: 2}
        status: {type: set(8), granularity: 2}
        project_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [created_at, updated_at]
      path_lookups: {id: {table: gl_package, key: id}}

  PackageFile:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [Delta(8), LZ4]}
        file_name: {default: "''", codec: [ZSTD(1)]}
        size: {codec: [ZSTD(1)]}
        file_sha256: {codec: [ZSTD(1)]}
        status: {default: "''", codec: [LZ4]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [Delta(8), LZ4]}
        package_id: {codec: [Delta(8), LZ4]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.001)
        file_name: text
        status: {type: set(8), granularity: 2}
        project_id: bloom_filter(0.001)
        package_id: bloom_filter(0.001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [created_at, updated_at]
      path_lookups: {id: {table: gl_package_file, key: id}}
