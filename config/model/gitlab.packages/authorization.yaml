kind: authorization
package: gitlab.packages
entities:
  Dependency:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_package, resource: dependency}]
    properties:
      open: [id, name, version_pattern, project_id]
      hidden: [traversal_path]

  Package:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_package, resource: package}]
    properties:
      open: [id, name, version, package_type, status, created_at, updated_at, project_id]
      hidden: [traversal_path]

  PackageFile:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_package, resource: package_file}]
    properties:
      open: [id, file_name, size, file_sha256, status, created_at, updated_at, project_id,
             package_id]
      hidden: [traversal_path]
