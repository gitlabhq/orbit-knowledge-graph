kind: storage
package: gitlab.code_review
store: graph
entities:
  MergeRequest:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        iid: {codec: [Delta(8), LZ4]}
        title: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        source_branch: {default: "''", codec: [ZSTD(1)]}
        target_branch: {default: "''", codec: [ZSTD(1)]}
        state: {default: "''", codec: [LZ4]}
        merge_status: {type: LowCardinality(String), default: "'unchecked'", codec: [LZ4]}
        draft: {default: "false"}
        squash: {default: "false"}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        merge_commit_sha: {default: "''", codec: [ZSTD(1)]}
        discussion_locked: {}
        prepared_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        latest_build_started_at: {codec: [Delta(8), ZSTD(1)]}
        latest_build_finished_at: {codec: [Delta(8), ZSTD(1)]}
        first_deployed_to_production_at: {codec: [Delta(8), ZSTD(1)]}
        merged_at: {codec: [Delta(8), ZSTD(1)]}
        latest_closed_at: {codec: [Delta(8), ZSTD(1)]}
        first_comment_at: {codec: [Delta(8), ZSTD(1)]}
        first_commit_at: {codec: [Delta(8), ZSTD(1)]}
        last_commit_at: {codec: [Delta(8), ZSTD(1)]}
        diff_size: {codec: [Delta(8), LZ4]}
        modified_paths_size: {codec: [Delta(8), LZ4]}
        commits_count: {codec: [Delta(8), LZ4]}
        first_approved_at: {codec: [Delta(8), ZSTD(1)]}
        first_reassigned_at: {codec: [Delta(8), ZSTD(1)]}
        added_lines: {codec: [Delta(8), LZ4]}
        removed_lines: {codec: [Delta(8), LZ4]}
        first_contribution: {default: "false"}
        reviewer_first_assigned_at: {codec: [Delta(8), ZSTD(1)]}
        author_id: {codec: [Delta(8), LZ4]}
        merge_user_id: {codec: [Delta(8), LZ4]}
        updated_by_id: {codec: [Delta(8), LZ4]}
        last_edited_by_id: {codec: [Delta(8), LZ4]}
        closed_by_id: {codec: [Delta(8), LZ4]}
        milestone_id: {codec: [Delta(8), LZ4]}
        source_project_id: {codec: [Delta(8), LZ4]}
        head_pipeline_id: {codec: [Delta(8), LZ4]}
        latest_merge_request_diff_id: {codec: [Delta(8), LZ4]}
        merged_commit_id: {codec: [Delta(8), LZ4]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        state: {type: set(6), granularity: 2}
        draft: minmax
        squash: minmax
        discussion_locked: minmax
        first_contribution: minmax
        id: bloom_filter(0.0001)
        title: text
        description: text
        source_branch: text
        target_branch: text
        merge_status: {type: set(8), granularity: 2}
        project_id: bloom_filter(0.0001)
        author_id: bloom_filter(0.0001)
        merge_user_id: bloom_filter(0.0001)
        milestone_id: bloom_filter(0.0001)
        source_project_id: bloom_filter(0.0001)
        updated_by_id: bloom_filter(0.0001)
        last_edited_by_id: bloom_filter(0.0001)
        closed_by_id: bloom_filter(0.0001)
        head_pipeline_id: bloom_filter(0.0001)
        latest_merge_request_diff_id: bloom_filter(0.0001)
        merged_commit_id: bloom_filter(0.0001)
        iid: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls:
      - created_at
      - updated_at
      - prepared_at
      - latest_build_started_at
      - latest_build_finished_at
      - first_deployed_to_production_at
      - merged_at
      - latest_closed_at
      - first_comment_at
      - first_commit_at
      - last_commit_at
      - first_approved_at
      - first_reassigned_at
      - reviewer_first_assigned_at
      path_lookups: {id: {table: gl_merge_request, key: id}}

  MergeRequestDiff:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        merge_request_id: {codec: [T64, ZSTD(1)]}
        state: {default: "''", codec: [ZSTD(1)]}
        base_commit_sha: {default: "''", codec: [ZSTD(1)]}
        head_commit_sha: {default: "''", codec: [ZSTD(1)]}
        start_commit_sha: {default: "''", codec: [ZSTD(1)]}
        commits_count: {codec: [Delta(8), LZ4]}
        files_count: {codec: [Delta(8), LZ4]}
        project_id: {codec: [T64, ZSTD(1)]}
        diff_type: {default: "'regular'", codec: [LZ4]}
        real_size: {default: "''", codec: [ZSTD(1)]}
        stored_externally: {default: "false"}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        merge_request_id: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
        head_commit_sha: text
      settings: {add_minmax_index_for_temporal_columns: "1"}
      high_fan_out: [merge_request_id]
      epoch_nulls: [created_at, updated_at]
      path_lookups: {id: {table: gl_merge_request_diff, key: id}}

  MergeRequestDiffFile:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        merge_request_id: {codec: [T64, ZSTD(1)]}
        merge_request_diff_id: {codec: [T64, ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        too_large: {default: "false"}
        new_path: {default: "''", codec: [ZSTD(3)]}
        old_path: {default: "''", codec: [ZSTD(3)]}
        new_file: {default: "false"}
        renamed_file: {default: "false"}
        deleted_file: {default: "false"}
        binary: {}
        generated: {}
        a_mode: {default: "''", codec: [ZSTD(1)]}
        b_mode: {default: "''", codec: [ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        too_large: minmax
        new_file: minmax
        renamed_file: minmax
        deleted_file: minmax
        binary: minmax
        id: bloom_filter(0.0001)
        new_path: text
        old_path: text
        merge_request_id: bloom_filter(0.0001)
        merge_request_diff_id: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
      high_fan_out: [merge_request_diff_id]
      path_lookups: {id: {table: gl_merge_request_diff_file, key: id}}
