kind: storage
package: gitlab.code_review
store: graph
entities:
  MergeRequest:
    complete: true
    table: gl_merge_request
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      iid: {immutable: true, backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      title: {backend: {type: String, codec: [ZSTD(1)]}}
      description: {backend: {type: String, codec: [ZSTD(3)]}}
      source_branch: {backend: {type: String, codec: [ZSTD(1)]}}
      target_branch: {backend: {type: String, codec: [ZSTD(1)]}}
      state: {backend: {type: LowCardinality(String), codec: [LZ4]}}
      merge_status: {selectivity: low, backend: {type: LowCardinality(String), codec: [LZ4]}}
      draft: {backend: {type: Bool}}
      squash: {backend: {type: Bool}}
      created_at: {immutable: true, backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      updated_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      merge_commit_sha: {backend: {type: String, codec: [ZSTD(1)]}}
      discussion_locked: {backend: {type: Nullable(Bool)}}
      prepared_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      latest_build_started_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      latest_build_finished_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      first_deployed_to_production_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      merged_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      latest_closed_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      first_comment_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      first_commit_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      last_commit_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      diff_size: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      modified_paths_size: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      commits_count: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      first_approved_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      first_reassigned_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      added_lines: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      removed_lines: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      first_contribution: {backend: {type: Bool}}
      reviewer_first_assigned_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      author_id: {immutable: true, backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      merge_user_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      updated_by_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      last_edited_by_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      closed_by_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      milestone_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      source_project_id: {immutable: true, backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      head_pipeline_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      latest_merge_request_diff_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      merged_commit_id: {immutable: true, backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [state, draft, squash, discussion_locked, first_contribution, id, merge_status, project_id, author_id, merge_user_id, milestone_id, source_project_id, updated_by_id, last_edited_by_id, closed_by_id, head_pipeline_id, latest_merge_request_diff_id, merged_commit_id, iid], text: [title, description, source_branch, target_branch], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        state: {type: set(6), granularity: 2}
        draft: minmax
        squash: minmax
        discussion_locked: minmax
        first_contribution: minmax
        id: bloom_filter(0.0001)
        title: text
        description: text
        source_branch: text
        target_branch: text
        merge_status: {type: set(8), granularity: 2}
        project_id: bloom_filter(0.0001)
        author_id: bloom_filter(0.0001)
        merge_user_id: bloom_filter(0.0001)
        milestone_id: bloom_filter(0.0001)
        source_project_id: bloom_filter(0.0001)
        updated_by_id: bloom_filter(0.0001)
        last_edited_by_id: bloom_filter(0.0001)
        closed_by_id: bloom_filter(0.0001)
        head_pipeline_id: bloom_filter(0.0001)
        latest_merge_request_diff_id: bloom_filter(0.0001)
        merged_commit_id: bloom_filter(0.0001)
        iid: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls:
      - created_at
      - updated_at
      - prepared_at
      - latest_build_started_at
      - latest_build_finished_at
      - first_deployed_to_production_at
      - merged_at
      - latest_closed_at
      - first_comment_at
      - first_commit_at
      - last_commit_at
      - first_approved_at
      - first_reassigned_at
      - reviewer_first_assigned_at
      path_lookups: {id: {table: gl_merge_request, key: id}}

  MergeRequestDiff:
    complete: true
    table: gl_merge_request_diff
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      merge_request_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      state: {selectivity: low, backend: {type: String, codec: [ZSTD(1)]}}
      base_commit_sha: {immutable: true, backend: {type: String, codec: [ZSTD(1)]}}
      head_commit_sha: {immutable: true, backend: {type: String, codec: [ZSTD(1)]}}
      start_commit_sha: {immutable: true, backend: {type: String, codec: [ZSTD(1)]}}
      commits_count: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      files_count: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      diff_type: {immutable: true, backend: {type: LowCardinality(String), codec: [LZ4]}}
      real_size: {backend: {type: String, codec: [ZSTD(1)]}}
      stored_externally: {backend: {type: Bool}}
      created_at: {immutable: true, backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      updated_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [id, merge_request_id, project_id], text: [head_commit_sha], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        merge_request_id: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
        head_commit_sha: text
      settings: {add_minmax_index_for_temporal_columns: "1"}
      high_fan_out: [merge_request_id]
      epoch_nulls: [created_at, updated_at]
      path_lookups: {id: {table: gl_merge_request_diff, key: id}}

  MergeRequestDiffFile:
    complete: true
    table: gl_merge_request_diff_file
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      merge_request_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      merge_request_diff_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      too_large: {immutable: true, backend: {type: Bool}}
      new_path: {immutable: true, backend: {type: String, codec: [ZSTD(3)]}}
      old_path: {immutable: true, backend: {type: String, codec: [ZSTD(3)]}}
      new_file: {immutable: true, backend: {type: Bool}}
      renamed_file: {immutable: true, backend: {type: Bool}}
      deleted_file: {immutable: true, backend: {type: Bool}}
      binary: {immutable: true, backend: {type: Nullable(Bool)}}
      generated: {backend: {type: Nullable(Bool)}}
      a_mode: {selectivity: low, backend: {type: String, codec: [ZSTD(1)]}}
      b_mode: {selectivity: low, backend: {type: String, codec: [ZSTD(1)]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [too_large, new_file, renamed_file, deleted_file, binary, id, merge_request_id, merge_request_diff_id, project_id], text: [new_path, old_path], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        too_large: minmax
        new_file: minmax
        renamed_file: minmax
        deleted_file: minmax
        binary: minmax
        id: bloom_filter(0.0001)
        new_path: text
        old_path: text
        merge_request_id: bloom_filter(0.0001)
        merge_request_diff_id: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
      high_fan_out: [merge_request_diff_id]
      path_lookups: {id: {table: gl_merge_request_diff_file, key: id}}
