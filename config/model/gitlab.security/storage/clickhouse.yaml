kind: storage
package: gitlab.security
store: graph
entities:
  Finding:
    complete: true
    accepts: [id, scanner_id, scan_id, project_id]
    table: gl_finding
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      uuid: {immutable: true, backend: {type: String, codec: [ZSTD(1)]}}
      name: {backend: {type: String, codec: [ZSTD(1)]}}
      description: {backend: {type: String, codec: [ZSTD(3)]}}
      solution: {backend: {type: String, codec: [ZSTD(3)]}}
      severity: {backend: {type: LowCardinality(String), codec: [LZ4]}}
      deduplicated: {backend: {type: Bool}}
      overridden_uuid: {immutable: true, backend: {type: String, codec: [ZSTD(1)]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      scan_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      scanner_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [deduplicated, id, project_id, scan_id, scanner_id], text: [name, description], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        deduplicated: minmax
        id: bloom_filter(0.0001)
        name: text
        description: text
        project_id: bloom_filter(0.0001)
        scan_id: bloom_filter(0.0001)
        scanner_id: bloom_filter(0.0001)
      path_lookups: {id: {table: gl_finding, key: id}}

  SecurityScan:
    complete: true
    accepts: [id, pipeline_id, project_id, build_id]
    table: gl_security_scan
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      scan_type: {immutable: true, backend: {type: LowCardinality(String), codec: [LZ4]}}
      status: {backend: {type: LowCardinality(String), codec: [LZ4]}}
      latest: {backend: {type: Bool}}
      created_at: {immutable: true, backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)], default: now()}}
      updated_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)], default: now()}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      pipeline_id: {immutable: true, backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      build_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [latest, id, project_id, pipeline_id, build_id, status], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        latest: minmax
        id: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
        pipeline_id: bloom_filter(0.0001)
        build_id: bloom_filter(0.0001)
        status: {type: set(8), granularity: 2}
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_security_scan, key: id}}

  Vulnerability:
    complete: true
    accepts: [id, author_id, confirmed_by_id, dismissed_by_id, finding_id, project_id, resolved_by_id]
    table: gl_vulnerability
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      title: {backend: {type: String, codec: [ZSTD(1)]}}
      description: {backend: {type: String, codec: [ZSTD(3)]}}
      state: {backend: {type: LowCardinality(String), codec: [LZ4]}}
      severity: {backend: {type: LowCardinality(String), codec: [LZ4]}}
      report_type: {immutable: true, backend: {type: LowCardinality(String), codec: [LZ4]}}
      resolved_on_default_branch: {backend: {type: Bool}}
      present_on_default_branch: {backend: {type: Bool}}
      created_at: {immutable: true, backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      updated_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      detected_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      resolved_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      confirmed_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      dismissed_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      finding_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      author_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      confirmed_by_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      resolved_by_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      dismissed_by_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [state, severity, report_type, resolved_on_default_branch, present_on_default_branch, id, project_id, finding_id, author_id, confirmed_by_id, resolved_by_id, dismissed_by_id], text: [title, description], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        state: {type: set(4), granularity: 2}
        severity: {type: set(8), granularity: 2}
        report_type: {type: set(4), granularity: 2}
        resolved_on_default_branch: minmax
        present_on_default_branch: minmax
        id: bloom_filter(0.0001)
        title: text
        description: text
        project_id: bloom_filter(0.0001)
        finding_id: bloom_filter(0.0001)
        author_id: bloom_filter(0.0001)
        confirmed_by_id: bloom_filter(0.0001)
        resolved_by_id: bloom_filter(0.0001)
        dismissed_by_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [detected_at, resolved_at, confirmed_at, dismissed_at]
      path_lookups: {id: {table: gl_vulnerability, key: id}}

  VulnerabilityIdentifier:
    complete: true
    accepts: [id, project_id]
    table: gl_vulnerability_identifier
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      external_type: {immutable: true, selectivity: low, backend: {type: String, codec: [ZSTD(1)]}}
      external_id: {immutable: true, backend: {type: String, codec: [ZSTD(1)]}}
      name: {backend: {type: String, codec: [ZSTD(1)]}}
      url: {backend: {type: String, codec: [ZSTD(1)]}}
      created_at: {immutable: true, backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      updated_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [id, project_id], text: [external_type, external_id, name], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        external_type: text
        external_id: text
        name: text
        project_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_vulnerability_identifier, key: id}}

  VulnerabilityOccurrence:
    complete: true
    accepts: [id, scanner_id, project_id, vulnerability_id]
    table: gl_vulnerability_occurrence
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      uuid: {immutable: true, backend: {type: String, codec: [ZSTD(1)]}}
      name: {backend: {type: String, codec: [ZSTD(1)]}}
      description: {backend: {type: String, codec: [ZSTD(3)]}}
      solution: {backend: {type: String, codec: [ZSTD(3)]}}
      cve: {backend: {type: String, codec: [ZSTD(1)]}}
      location: {backend: {type: String, codec: [ZSTD(3)]}}
      location_fingerprint: {backend: {type: String, codec: [ZSTD(1)]}}
      severity: {backend: {type: LowCardinality(String), codec: [LZ4]}}
      report_type: {immutable: true, backend: {type: LowCardinality(String), codec: [LZ4]}}
      detection_method: {immutable: true, backend: {type: LowCardinality(String), codec: [LZ4]}}
      created_at: {immutable: true, backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)], default: now()}}
      updated_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)], default: now()}}
      detected_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      scanner_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      vulnerability_id: {backend: {type: Nullable(Int64), codec: [Delta(8), LZ4]}}
      primary_identifier_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [id, cve, project_id, scanner_id, vulnerability_id, primary_identifier_id, report_type], text: [name, description], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        name: text
        description: text
        cve: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
        scanner_id: bloom_filter(0.0001)
        vulnerability_id: bloom_filter(0.0001)
        primary_identifier_id: bloom_filter(0.0001)
        report_type: {type: set(16), granularity: 2}
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [detected_at]
      path_lookups: {id: {table: gl_vulnerability_occurrence, key: id}}

  VulnerabilityScanner:
    complete: true
    accepts: [id, project_id]
    table: gl_vulnerability_scanner
    columns:
      id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      external_id: {immutable: true, backend: {type: String, codec: [ZSTD(1)]}}
      name: {backend: {type: String, codec: [ZSTD(1)]}}
      vendor: {selectivity: low, backend: {type: LowCardinality(String), codec: [LZ4]}}
      created_at: {immutable: true, backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      updated_at: {backend: {type: "DateTime64(0, 'UTC')", codec: [Delta(8), ZSTD(1)]}}
      project_id: {immutable: true, backend: {type: Int64, codec: [T64, ZSTD(1)]}}
      traversal_path: {backend: {type: String, codec: [ZSTD(1)]}}
    access: {filter: [id, project_id], text: [name, external_id], order: [id]}
    backend:
      primary_key: [traversal_path, id]
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        name: text
        external_id: text
        project_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_vulnerability_scanner, key: id}}
