kind: graph
package: gitlab.security
domain: security
domain_description: Entities related to security vulnerabilities and findings.
entities:
  Finding:
    style: {size: 26, color: "#F87171"}
    description: A security scan finding (occurrence) that may be linked to a vulnerability
    identity: id
    label: uuid
    default_columns: [id, uuid, name, severity]
    properties:
      id: {type: int64, description: Unique ID.}
      uuid: {type: uuid, description: Unique UUID., default: ''}
      name: {type: string, description: Finding name., default: ''}
      description: {type: string, description: Detailed description., default: ''}
      solution: {type: string, description: Recommended remediation., default: ''}
      severity:
        type: enum
        description: Severity level.
        values: {1: info, 2: unknown, 4: low, 5: medium, 6: high, 7: critical}
        default: ''
      deduplicated: {type: boolean, description: Deduplicated flag., default: false}
      overridden_uuid: {type: uuid, description: UUID of the overridden finding., default: ''}
      project_id:
        type: int64
        description: Owning project ID.
      scan_id:
        type: int64
        description: Producing security scan ID.
      scanner_id:
        type: int64
        description: Detecting scanner ID.
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}

  SecurityScan:
    style: {size: 26, color: "#B91C1C"}
    description: A security scan execution that produces findings within a CI/CD pipeline
    identity: id
    label: id
    default_columns: [id, scan_type, status]
    properties:
      id: {type: int64, description: Unique ID.}
      scan_type:
        type: enum
        description: Scan type.
        values:
          1: sast
          2: dependency_scanning
          3: container_scanning
          4: dast
          5: secret_detection
          6: coverage_fuzzing
          7: api_fuzzing
          8: cluster_image_scanning
          9: sarif
        default: ''
      status:
        type: enum
        description: Current status.
        values:
          0: created
          1: succeeded
          2: job_failed
          3: report_error
          4: preparing
          5: preparation_failed
          6: purged
        terminal: [succeeded, job_failed, report_error, preparation_failed, purged]
        default: ''
      latest:
        type: boolean
        description: Whether this is the latest scan of its type for the project.
        default: true
      created_at: {type: timestamp, description: Creation timestamp.}
      updated_at: {type: timestamp, description: Last update timestamp.}
      project_id:
        type: int64
        description: Owning project ID.
      pipeline_id:
        type: int64?
        description: Pipeline ID that ran this scan.
      build_id:
        type: int64
        description: Job (build) ID that executed this scan.
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}

  Vulnerability:
    style: {size: 34, color: "#DC2626"}
    description: >-
      A security vulnerability identified in a project, representing a confirmed or
      potential security issue
    identity: id
    label: title
    default_columns: [id, title, state, severity, report_type]
    properties:
      id: {type: int64, description: Unique ID.}
      title: {type: string, description: Summary title., default: ''}
      description: {type: string, description: Detailed description., default: ''}
      state:
        type: enum
        description: Current state.
        values: {1: detected, 2: dismissed, 3: resolved, 4: confirmed}
        default: ''
      severity:
        type: enum
        description: Severity level.
        values: {1: info, 2: unknown, 4: low, 5: medium, 6: high, 7: critical}
        default: ''
      report_type:
        type: enum
        description: Security scan type that detected this.
        values:
          0: sast
          1: dependency_scanning
          2: container_scanning
          3: dast
          4: secret_detection
          5: coverage_fuzzing
          6: api_fuzzing
          7: cluster_image_scanning
          8: container_scanning_for_registry
          9: sarif
          99: generic
        default: ''
      resolved_on_default_branch: {type: boolean, description: Resolved on default branch., default: false}
      present_on_default_branch: {type: boolean, description: Present on default branch., default: true}
      created_at: {type: timestamp, description: Creation timestamp.}
      updated_at: {type: timestamp, description: Last update timestamp.}
      detected_at: {type: timestamp?, description: First detection timestamp.}
      resolved_at: {type: timestamp?, description: Resolution timestamp.}
      confirmed_at: {type: timestamp?, description: Confirmation timestamp.}
      dismissed_at: {type: timestamp?, description: Dismissal timestamp.}
      project_id:
        type: int64
        description: Owning project ID.
      finding_id:
        type: int64
        description: Associated vulnerability occurrence ID.
      author_id: {type: int64, description: Author user ID.}
      confirmed_by_id: {type: int64?, description: Confirming user ID.}
      resolved_by_id: {type: int64?, description: Resolving user ID.}
      dismissed_by_id: {type: int64?, description: Dismissing user ID.}
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}

  VulnerabilityIdentifier:
    style: {size: 22, color: "#7F1D1D"}
    description: A vulnerability identifier such as a CVE, CWE, or other external reference
    identity: id
    label: name
    default_columns: [id, name, external_type, external_id]
    properties:
      id: {type: int64, description: Unique ID.}
      external_type:
        type: string
        description: Identifier type (e.g. cve, cwe, gemnasium).
        default: ''
      external_id:
        type: string
        description: Identifier value (e.g. CVE-2021-44228).
        default: ''
      name: {type: string, description: Human-readable name., default: ''}
      url: {type: string, description: Reference URL. May be empty for some identifier types., default: ''}
      created_at: {type: timestamp, description: Creation timestamp.}
      updated_at: {type: timestamp, description: Last update timestamp.}
      project_id:
        type: int64
        description: Owning project ID.
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}

  VulnerabilityOccurrence:
    style: {size: 28, color: "#EF4444"}
    description: A specific occurrence of a vulnerability detected in a project
    identity: id
    label: uuid
    default_columns: [id, uuid, name, severity, report_type]
    properties:
      id: {type: int64, description: Unique ID.}
      uuid: {type: uuid, description: Unique UUID., default: ''}
      name: {type: string, description: Occurrence name., default: ''}
      description: {type: string, description: Detailed description., default: ''}
      solution: {type: string, description: Recommended remediation., default: ''}
      cve:
        type: string
        description: >-
          Legacy fingerprint for deduplication. Not necessarily a CVE ID despite the
          column name.
        default: ''
      location:
        type: string
        description: "Vulnerability location (serialized JSON: file, dependency, image, or kubernetes_resource)."
        default: '{}'
      location_fingerprint: {type: string, description: Location fingerprint., default: ''}
      severity:
        type: enum
        description: Severity level.
        values: {1: info, 2: unknown, 4: low, 5: medium, 6: high, 7: critical}
        default: ''
      report_type:
        type: enum
        description: Security report type.
        values:
          0: sast
          1: dependency_scanning
          2: container_scanning
          3: dast
          4: secret_detection
          5: coverage_fuzzing
          6: api_fuzzing
          7: cluster_image_scanning
          8: container_scanning_for_registry
          9: sarif
          99: generic
        default: ''
      detection_method:
        type: enum
        description: Detection method.
        values:
          0: gitlab_security_report
          1: external_security_report
          2: bug_bounty
          3: code_review
          4: security_audit
        default: ''
      created_at: {type: timestamp, description: Creation timestamp.}
      updated_at: {type: timestamp, description: Last update timestamp.}
      detected_at: {type: timestamp?, description: Detection timestamp.}
      project_id:
        type: int64
        description: Owning project ID.
      scanner_id:
        type: int64
        description: Detecting scanner ID.
      vulnerability_id:
        type: int64?
        description: Linked vulnerability ID.
      primary_identifier_id:
        type: int64
        description: Primary identifier (CVE/CWE) ID.
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}

  VulnerabilityScanner:
    style: {size: 24, color: "#FCA5A5"}
    description: A security scanner that detects vulnerabilities in projects
    identity: id
    label: name
    default_columns: [id, name, vendor]
    properties:
      id: {type: int64, description: Unique ID.}
      external_id:
        type: string
        description: External ID (e.g. gemnasium, bandit).
        default: ''
      name: {type: string, description: Display name., default: ''}
      vendor: {type: string, description: "Scanner vendor (default: GitLab).", default: GitLab}
      created_at: {type: timestamp, description: Creation timestamp.}
      updated_at: {type: timestamp, description: Last update timestamp.}
      project_id:
        type: int64
        description: Owning project ID.
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}
