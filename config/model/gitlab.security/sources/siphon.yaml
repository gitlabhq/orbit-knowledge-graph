kind: source
package: gitlab.security
source: siphon
entities:
  Finding:
    tables: [siphon_security_findings]
    order_by: [traversal_path, id, partition_number]
    query: finding.sql.j2
    edges:
    - label: IN_PROJECT
      from: {field: id, kind: Finding}
      to: {field: project_id, kind: Project}
    - label: DETECTED_BY
      from: {field: id, kind: Finding}
      to: {field: scanner_id, kind: VulnerabilityScanner}
    - label: HAS_FINDING
      from: {field: scan_id, kind: SecurityScan}
      to: {field: id, kind: Finding}
    reindex: [siphon_security_findings]

  SecurityScan:
    tables: [siphon_security_scans]
    order_by: [traversal_path, id]
    query: generated
    edges:
    - label: IN_PROJECT
      from: {field: id, kind: SecurityScan}
      to: {field: project_id, kind: Project}
    - label: IN_PIPELINE
      from: {field: id, kind: SecurityScan}
      to: {field: pipeline_id, kind: Pipeline}
    - label: RAN_BY
      from: {field: id, kind: SecurityScan}
      to: {field: build_id, kind: Job}
    reindex: [siphon_security_scans]

  Vulnerability:
    tables: [siphon_vulnerabilities]
    order_by: [traversal_path, id]
    query: generated
    enrich: [state, severity, report_type, resolved_on_default_branch, present_on_default_branch]
    edges:
    - label: IN_PROJECT
      from: {field: id, kind: Vulnerability}
      to: {field: project_id, kind: Project}
    - label: AUTHORED
      from: {field: author_id, kind: User}
      to: {field: id, kind: Vulnerability}
    - label: HAS_FINDING
      from: {field: id, kind: Vulnerability}
      to: {field: finding_id, kind: VulnerabilityOccurrence}
    - label: CONFIRMED_BY
      from: {field: confirmed_by_id, kind: User}
      to: {field: id, kind: Vulnerability}
      mutable: true
    - label: RESOLVED_BY
      from: {field: resolved_by_id, kind: User}
      to: {field: id, kind: Vulnerability}
      mutable: true
    - label: DISMISSED_BY
      from: {field: dismissed_by_id, kind: User}
      to: {field: id, kind: Vulnerability}
      mutable: true
    reindex: [siphon_vulnerabilities]

  VulnerabilityIdentifier:
    tables: [siphon_vulnerability_identifiers]
    order_by: [traversal_path, id]
    query: generated
    edges:
    - label: IN_PROJECT
      from: {field: id, kind: VulnerabilityIdentifier}
      to: {field: project_id, kind: Project}
    reindex: [siphon_vulnerability_identifiers]

  VulnerabilityOccurrence:
    tables: [siphon_vulnerability_occurrences]
    order_by: [traversal_path, id]
    query: generated
    binary: [location_fingerprint]
    enrich: [severity, report_type, detection_method]
    edges:
    - label: IN_PROJECT
      from: {field: id, kind: VulnerabilityOccurrence}
      to: {field: project_id, kind: Project}
    - label: DETECTED_BY
      from: {field: id, kind: VulnerabilityOccurrence}
      to: {field: scanner_id, kind: VulnerabilityScanner}
      mutable: true
    - label: HAS_IDENTIFIER
      from: {field: id, kind: VulnerabilityOccurrence}
      to: {field: primary_identifier_id, kind: VulnerabilityIdentifier}
    - label: OCCURRENCE_OF
      from: {field: id, kind: VulnerabilityOccurrence}
      to: {field: vulnerability_id, kind: Vulnerability}
    reindex: [siphon_vulnerability_occurrences]

  VulnerabilityScanner:
    tables: [siphon_vulnerability_scanners]
    order_by: [traversal_path, id]
    query: generated
    edges:
    - label: SCANS
      from: {field: id, kind: VulnerabilityScanner}
      to: {field: project_id, kind: Project}
    - label: IN_PROJECT
      from: {field: id, kind: VulnerabilityScanner}
      to: {field: project_id, kind: Project}
    reindex: [siphon_vulnerability_scanners]
