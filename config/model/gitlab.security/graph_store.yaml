kind: storage
package: gitlab.security
store: graph
entities:
  Finding:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        uuid: {default: "''", codec: [ZSTD(1)]}
        name: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        solution: {default: "''", codec: [ZSTD(3)]}
        severity: {default: "''", codec: [LZ4]}
        deduplicated: {default: "false"}
        overridden_uuid: {default: "''", codec: [ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        scan_id: {codec: [T64, ZSTD(1)]}
        scanner_id: {codec: [T64, ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        deduplicated: minmax
        id: bloom_filter(0.0001)
        name: text
        description: text
        project_id: bloom_filter(0.0001)
        scan_id: bloom_filter(0.0001)
        scanner_id: bloom_filter(0.0001)
      path_lookups: {id: {table: gl_finding, key: id}}

  SecurityScan:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        scan_type: {default: "''", codec: [LZ4]}
        status: {default: "''", codec: [LZ4]}
        latest: {default: "true"}
        created_at: {default: now(), codec: [Delta(8), ZSTD(1)]}
        updated_at: {default: now(), codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        pipeline_id: {codec: [Delta(8), LZ4]}
        build_id: {codec: [T64, ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        latest: minmax
        id: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
        pipeline_id: bloom_filter(0.0001)
        build_id: bloom_filter(0.0001)
        status: {type: set(8), granularity: 2}
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_security_scan, key: id}}

  Vulnerability:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        title: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        state: {default: "''", codec: [LZ4]}
        severity: {default: "''", codec: [LZ4]}
        report_type: {default: "''", codec: [LZ4]}
        resolved_on_default_branch: {default: "false"}
        present_on_default_branch: {default: "true"}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        detected_at: {codec: [Delta(8), ZSTD(1)]}
        resolved_at: {codec: [Delta(8), ZSTD(1)]}
        confirmed_at: {codec: [Delta(8), ZSTD(1)]}
        dismissed_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        finding_id: {codec: [T64, ZSTD(1)]}
        author_id: {codec: [T64, ZSTD(1)]}
        confirmed_by_id: {codec: [Delta(8), LZ4]}
        resolved_by_id: {codec: [Delta(8), LZ4]}
        dismissed_by_id: {codec: [Delta(8), LZ4]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        state: {type: set(4), granularity: 2}
        severity: {type: set(8), granularity: 2}
        report_type: {type: set(4), granularity: 2}
        resolved_on_default_branch: minmax
        present_on_default_branch: minmax
        id: bloom_filter(0.0001)
        title: text
        description: text
        project_id: bloom_filter(0.0001)
        finding_id: bloom_filter(0.0001)
        author_id: bloom_filter(0.0001)
        confirmed_by_id: bloom_filter(0.0001)
        resolved_by_id: bloom_filter(0.0001)
        dismissed_by_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [detected_at, resolved_at, confirmed_at, dismissed_at]
      path_lookups: {id: {table: gl_vulnerability, key: id}}

  VulnerabilityIdentifier:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        external_type: {default: "''", codec: [ZSTD(1)]}
        external_id: {default: "''", codec: [ZSTD(1)]}
        name: {default: "''", codec: [ZSTD(1)]}
        url: {default: "''", codec: [ZSTD(1)]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        external_type: text
        external_id: text
        name: text
        project_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_vulnerability_identifier, key: id}}

  VulnerabilityOccurrence:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        uuid: {default: "''", codec: [ZSTD(1)]}
        name: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        solution: {default: "''", codec: [ZSTD(3)]}
        cve: {default: "''", codec: [ZSTD(1)]}
        location: {default: "'{}'", codec: [ZSTD(3)]}
        location_fingerprint: {default: "''", codec: [ZSTD(1)]}
        severity: {default: "''", codec: [LZ4]}
        report_type: {default: "''", codec: [LZ4]}
        detection_method: {default: "''", codec: [LZ4]}
        created_at: {default: now(), codec: [Delta(8), ZSTD(1)]}
        updated_at: {default: now(), codec: [Delta(8), ZSTD(1)]}
        detected_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        scanner_id: {codec: [T64, ZSTD(1)]}
        vulnerability_id: {codec: [Delta(8), LZ4]}
        primary_identifier_id: {codec: [T64, ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        name: text
        description: text
        cve: bloom_filter(0.0001)
        project_id: bloom_filter(0.0001)
        scanner_id: bloom_filter(0.0001)
        vulnerability_id: bloom_filter(0.0001)
        primary_identifier_id: bloom_filter(0.0001)
        report_type: {type: set(16), granularity: 2}
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [detected_at]
      path_lookups: {id: {table: gl_vulnerability_occurrence, key: id}}

  VulnerabilityScanner:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        external_id: {default: "''", codec: [ZSTD(1)]}
        name: {default: "''", codec: [ZSTD(1)]}
        vendor: {type: LowCardinality(String), default: "'GitLab'", codec: [LZ4]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [T64, ZSTD(1)]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        name: text
        external_id: text
        project_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      path_lookups: {id: {table: gl_vulnerability_scanner, key: id}}
