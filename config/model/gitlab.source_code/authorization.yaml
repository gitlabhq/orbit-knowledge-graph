kind: authorization
package: gitlab.source_code
entities:
  Branch:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_code, resource: project, object: Project, id: project_id}]
    properties:
      open: [id, project_id, name, is_default]
      hidden: [traversal_path]

  Commit:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_code, resource: project, object: Project, id: project_id}]
    properties:
      open: [id, sha, project_id]
      hidden: [traversal_path]

  Definition:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_code, resource: project, object: Project, id: project_id}]
    properties:
      open: [id, project_id, branch, commit_sha, file_path, fqn, name, definition_type, start_line,
             end_line, start_byte, end_byte, start_char, end_char, content]
      hidden: [traversal_path]

  Directory:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_code, resource: project, object: Project, id: project_id}]
    properties:
      open: [id, project_id, branch, commit_sha, path, name]
      hidden: [traversal_path]

  File:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}, orbit_code: {scope_key: {via: IN_PROJECT}}}
    checks: [{provider: rails, permission: read_code, resource: project, object: Project, id: project_id}]
    properties:
      open: [id, project_id, branch, commit_sha, path, name, extension, language, size_bytes,
             content, reason]
      hidden: [traversal_path]

  ImportedSymbol:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    checks: [{provider: rails, permission: read_code, resource: project, object: Project, id: project_id}]
    properties:
      open: [id, project_id, branch, commit_sha, file_path, import_type, import_path,
             identifier_name, identifier_alias, start_line, end_line, start_byte, end_byte,
             start_char, end_char]
      hidden: [traversal_path]
