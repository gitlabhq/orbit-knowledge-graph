kind: authorization
package: gitlab.source_code
entities:
  Branch:
    scope: namespace
    role: reporter
    redaction: {resource: project, ability: read_code, id: project_id}

  Commit:
    scope: namespace
    role: reporter
    redaction: {resource: project, ability: read_code, id: project_id}

  Definition:
    scope: namespace
    role: reporter
    redaction: {resource: project, ability: read_code, id: project_id}

  Directory:
    scope: namespace
    role: reporter
    redaction: {resource: project, ability: read_code, id: project_id}

  File:
    scope: namespace
    role: reporter
    redaction: {resource: project, ability: read_code, id: project_id}

  ImportedSymbol:
    scope: namespace
    role: reporter
    redaction: {resource: project, ability: read_code, id: project_id}
properties:
  Branch.traversal_path: {hidden: true, filterable: false}
  Commit.traversal_path: {hidden: true, filterable: false}
  Definition.traversal_path: {hidden: true, filterable: false}
  Directory.traversal_path: {hidden: true, filterable: false}
  File.traversal_path: {hidden: true, filterable: false}
  ImportedSymbol.traversal_path: {hidden: true, filterable: false}
