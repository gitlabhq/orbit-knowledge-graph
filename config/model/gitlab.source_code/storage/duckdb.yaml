kind: storage
package: gitlab.source_code
store: local
entities:
  Definition:
    complete: true
    accepts: [id]
    exclude: [content]
    table: gl_definition
    columns:
      id: {immutable: true, backend: {type: BIGINT}}
      traversal_path: {backend: {type: VARCHAR}}
      project_id: {immutable: true, backend: {type: BIGINT}}
      branch: {immutable: true, backend: {type: VARCHAR}}
      commit_sha: {backend: {type: VARCHAR}}
      file_path: {immutable: true, backend: {type: VARCHAR}}
      fqn: {immutable: true, backend: {type: VARCHAR}}
      name: {immutable: true, backend: {type: VARCHAR}}
      definition_type: {immutable: true, selectivity: low, backend: {type: VARCHAR}}
      start_line: {immutable: true, backend: {type: BIGINT}}
      end_line: {immutable: true, backend: {type: BIGINT}}
      start_byte: {immutable: true, backend: {type: BIGINT}}
      end_byte: {immutable: true, backend: {type: BIGINT}}
      start_char: {immutable: true, backend: {type: BIGINT}}
      end_char: {immutable: true, backend: {type: BIGINT}}
    access: {order: [project_id, branch, id]}

  Directory:
    complete: true
    accepts: [id]
    table: gl_directory
    columns:
      id: {immutable: true, backend: {type: BIGINT}}
      traversal_path: {backend: {type: VARCHAR}}
      project_id: {immutable: true, backend: {type: BIGINT}}
      branch: {immutable: true, backend: {type: VARCHAR}}
      commit_sha: {backend: {type: VARCHAR}}
      path: {immutable: true, backend: {type: VARCHAR}}
      name: {immutable: true, backend: {type: VARCHAR}}
    access: {order: [project_id, branch, id]}

  File:
    complete: true
    accepts: [id]
    exclude: [content]
    table: gl_file
    columns:
      id: {immutable: true, backend: {type: BIGINT}}
      traversal_path: {backend: {type: VARCHAR}}
      project_id: {immutable: true, backend: {type: BIGINT}}
      branch: {immutable: true, backend: {type: VARCHAR}}
      commit_sha: {backend: {type: VARCHAR}}
      path: {immutable: true, backend: {type: VARCHAR}}
      name: {immutable: true, backend: {type: VARCHAR}}
      extension: {immutable: true, selectivity: low, backend: {type: VARCHAR}}
      language: {immutable: true, selectivity: low, backend: {type: VARCHAR}}
      size_bytes: {backend: {type: BIGINT}}
      reason: {selectivity: low, backend: {type: VARCHAR}}
    access: {order: [project_id, branch, id]}

  ImportedSymbol:
    complete: true
    accepts: [id]
    table: gl_imported_symbol
    columns:
      id: {immutable: true, backend: {type: BIGINT}}
      traversal_path: {backend: {type: VARCHAR}}
      project_id: {immutable: true, backend: {type: BIGINT}}
      branch: {immutable: true, backend: {type: VARCHAR}}
      commit_sha: {backend: {type: VARCHAR}}
      file_path: {immutable: true, backend: {type: VARCHAR}}
      import_type: {immutable: true, selectivity: low, backend: {type: VARCHAR}}
      import_path: {immutable: true, backend: {type: VARCHAR}}
      identifier_name: {immutable: true, backend: {type: VARCHAR}}
      identifier_alias: {immutable: true, backend: {type: VARCHAR}}
      start_line: {immutable: true, backend: {type: BIGINT}}
      end_line: {immutable: true, backend: {type: BIGINT}}
      start_byte: {immutable: true, backend: {type: BIGINT}}
      end_byte: {immutable: true, backend: {type: BIGINT}}
      start_char: {immutable: true, backend: {type: BIGINT}}
      end_char: {immutable: true, backend: {type: BIGINT}}
    access: {order: [project_id, branch, id]}
