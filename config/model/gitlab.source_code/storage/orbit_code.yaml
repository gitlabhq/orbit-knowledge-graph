kind: storage
package: gitlab.source_code
store: code
engine:
  kind: orbit_code
  connection: code_indexing
entities:
  File:
    accepts: [project_id, branch]
    columns:
      project_id: {}
      branch: {}
      path: {}
    backend:
      repository: {project: project_id, branch: branch}
      search: {content: [trigram, structural], path: [trigram]}
