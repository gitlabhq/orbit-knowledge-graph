kind: storage
package: gitlab.source_code
store: code
engine:
  kind: orbit_code
  connection: code_indexing
entities:
  File:
    columns:
      id: {immutable: true}
      traversal_path: {}
      project_id: {immutable: true}
      branch: {immutable: true}
      commit_sha: {}
      path: {immutable: true}
      name: {immutable: true}
      extension: {immutable: true}
      language: {immutable: true}
      size_bytes: {}
      reason: {}
    backend:
      search: {content: [trigram, structural], path: [trigram]}
