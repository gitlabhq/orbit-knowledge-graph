kind: storage
package: gitlab.source_code
store: local
entities:
  Definition:
    table: gl_definition
    exclude: [content]
    backend:
      sort_key: [traversal_path, project_id, branch, id]
      columns: {commit_sha: {default: "''"}}

  Directory:
    table: gl_directory
    backend:
      sort_key: [traversal_path, project_id, branch, id]
      columns: {commit_sha: {default: "''"}}

  File:
    table: gl_file
    exclude: [content]
    backend:
      sort_key: [traversal_path, project_id, branch, id]
      columns: {commit_sha: {default: "''"}, size_bytes: {default: "0"}, reason: {default: "''"}}

  ImportedSymbol:
    table: gl_imported_symbol
    backend:
      sort_key: [traversal_path, project_id, branch, id]
      columns:
        commit_sha: {default: "''"}
        identifier_name: {default: "''"}
        identifier_alias: {default: "''"}
