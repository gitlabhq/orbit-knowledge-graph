kind: storage
package: gitlab.plan
store: graph
entities:
  Label:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        title: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        color: {default: "''", codec: [ZSTD(1)]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [Delta(8), LZ4]}
        group_id: {codec: [Delta(8), LZ4]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        title: text
        description: text
        project_id: bloom_filter(0.0001)
        group_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [created_at, updated_at]
      path_lookups: {id: {table: gl_label, key: id}}

  Milestone:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        iid: {codec: [Delta(8), LZ4]}
        title: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        state: {default: "''", codec: [ZSTD(1)]}
        due_date: {default: "'1970-01-01'", codec: [Delta(4), ZSTD(1)]}
        start_date: {default: "'1970-01-01'", codec: [Delta(4), ZSTD(1)]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [Delta(8), LZ4]}
        group_id: {codec: [Delta(8), LZ4]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        id: bloom_filter(0.0001)
        title: text
        state: {type: set(4), granularity: 2}
        description: text
        project_id: bloom_filter(0.0001)
        group_id: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [due_date, start_date, created_at, updated_at]
      path_lookups: {id: {table: gl_milestone, key: id}}

  WorkItem:
    backend:
      primary_key: [traversal_path, id]
      columns:
        id: {codec: [T64, ZSTD(1)]}
        iid: {type: Nullable(Int64), codec: [Delta(8), LZ4]}
        title: {default: "''", codec: [ZSTD(1)]}
        description: {default: "''", codec: [ZSTD(3)]}
        state: {default: "''", codec: [LZ4]}
        work_item_type: {default: "''", codec: [LZ4]}
        confidential: {default: "false"}
        due_date: {default: "'1970-01-01'", codec: [Delta(4), ZSTD(1)]}
        start_date: {default: "'1970-01-01'", codec: [Delta(4), ZSTD(1)]}
        weight: {codec: [Delta(8), LZ4]}
        created_at: {codec: [Delta(8), ZSTD(1)]}
        updated_at: {codec: [Delta(8), ZSTD(1)]}
        closed_at: {codec: [Delta(8), ZSTD(1)]}
        project_id: {codec: [Delta(8), LZ4]}
        author_id: {codec: [Delta(8), LZ4]}
        milestone_id: {codec: [Delta(8), LZ4]}
        namespace_id: {codec: [T64, ZSTD(1)]}
        closed_by_id: {codec: [Delta(8), LZ4]}
        traversal_path: {default: "'0/'", codec: [ZSTD(1)]}
      indexes:
        _deleted: minmax
        state: {type: set(10), granularity: 2}
        work_item_type: {type: set(10), granularity: 2}
        confidential: minmax
        id: bloom_filter(0.0001)
        title: text
        description: text
        project_id: bloom_filter(0.0001)
        author_id: bloom_filter(0.0001)
        milestone_id: bloom_filter(0.0001)
        namespace_id: bloom_filter(0.0001)
        closed_by_id: bloom_filter(0.0001)
        iid: bloom_filter(0.0001)
      settings: {add_minmax_index_for_temporal_columns: "1"}
      epoch_nulls: [due_date, start_date, created_at, updated_at, closed_at]
      path_lookups: {id: {table: gl_work_item, key: id}}
