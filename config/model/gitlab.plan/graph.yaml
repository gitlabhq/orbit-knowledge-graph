kind: graph
package: gitlab.plan
domain: plan
domain_description: Entities related to planning, tracking, and organizing work.
entities:
  Label:
    style: {size: 22, color: "#A855F7"}
    description: A label for categorizing and filtering work items
    label: title
    defaults: [id, title, color]
    properties:
      id: {type: int64, description: Unique ID.}
      title: {type: string, description: Label title., default: ''}
      description: {type: string, description: Description text., default: ''}
      color: {type: string, description: Hex color code., default: ''}
      created_at: {type: timestamp?, description: Creation timestamp.}
      updated_at: {type: timestamp?, description: Last update timestamp.}
      project_id:
        type: int64?
        description: Owning project ID. Null for group-scoped.
      group_id:
        type: int64?
        description: Owning group ID. Null for project-scoped.
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}

  Milestone:
    style: {size: 30, color: "#D946EF"}
    description: A milestone for tracking progress toward a goal within a project or group
    label: title
    defaults: [id, iid, title, state, due_date, start_date]
    properties:
      id: {type: int64, description: Unique ID.}
      iid: {type: int64?, description: Scoped milestone number.}
      title: {type: string, description: Title., default: ''}
      description: {type: string, description: Description text., default: ''}
      state: {type: string, description: "State (active, closed).", selectivity: low, default: ''}
      due_date: {type: date?, description: Due date.}
      start_date: {type: date?, description: Start date.}
      created_at: {type: timestamp?, description: Creation timestamp.}
      updated_at: {type: timestamp?, description: Last update timestamp.}
      project_id:
        type: int64?
        description: Owning project ID. Null for group-scoped.
      group_id:
        type: int64?
        description: Owning group ID. Null for project-scoped.
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}

  WorkItem:
    style: {size: 32, color: "#EC4899"}
    description: >-
      A work item representing an issue, epic, task, incident, or other trackable
      unit of work
    label: title
    defaults: [id, iid, title, state, work_item_type]
    properties:
      id: {type: int64, description: Unique ID.}
      iid: {type: int64, description: Scoped work item number.}
      title: {type: string, description: Title., default: ''}
      description: {type: string, description: Description body (markdown)., default: ''}
      state: {type: enum, description: Current state., values: {1: opened, 2: closed}, default: ''}
      work_item_type:
        type: enum
        description: Work item type.
        values:
          1: issue
          2: incident
          3: test_case
          4: requirement
          5: task
          6: objective
          7: key_result
          8: epic
          9: ticket
        default: ''
      confidential: {type: boolean, description: Confidential flag., default: false}
      due_date: {type: date?, description: Due date.}
      start_date: {type: date?, description: Start date.}
      weight: {type: int64?, description: Weight/points assigned.}
      created_at: {type: timestamp?, description: Creation timestamp.}
      updated_at: {type: timestamp?, description: Last update timestamp.}
      closed_at: {type: timestamp?, description: Closed timestamp.}
      project_id:
        type: int64?
        description: Owning project ID. Null for group-scoped.
      author_id: {type: int64?, description: Author user ID.}
      milestone_id: {type: int64?, description: Associated milestone ID.}
      namespace_id:
        type: int64
        description: Owning namespace (group) ID.
      closed_by_id: {type: int64?, description: User ID who closed this.}
      traversal_path: {type: string, description: Namespace path for authz., default: 0/}
