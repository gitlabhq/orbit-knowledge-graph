kind: graph
package: gitlab.plan
domain: plan
domain_description: Entities related to planning, tracking, and organizing work.
entities:
  Label:
    style: {size: 22, color: "#A855F7"}
    description: A label for categorizing and filtering work items
    label: title
    defaults: [id, title, color]
    properties:
      id: {type: int64, description: Unique ID., immutable: true}
      title: {type: string, description: Label title.}
      description: {type: string, description: Description text.}
      color: {type: string, description: Hex color code.}
      created_at: {type: timestamp?, description: Creation timestamp., immutable: true}
      updated_at: {type: timestamp?, description: Last update timestamp.}
      project_id:
        type: int64?
        description: Owning project ID. Null for group-scoped.
        immutable: true
        references: [Project]
      group_id:
        type: int64?
        description: Owning group ID. Null for project-scoped.
        immutable: true
        references: [Group]
      traversal_path: {type: string, description: Namespace path for authz.}

  Milestone:
    style: {size: 30, color: "#D946EF"}
    description: A milestone for tracking progress toward a goal within a project or group
    label: title
    defaults: [id, iid, title, state, due_date, start_date]
    properties:
      id: {type: int64, description: Unique ID., immutable: true}
      iid: {type: int64?, description: Scoped milestone number., immutable: true}
      title: {type: string, description: Title.}
      description: {type: string, description: Description text.}
      state: {type: string, description: "State (active, closed).", selectivity: low}
      due_date: {type: date?, description: Due date.}
      start_date: {type: date?, description: Start date.}
      created_at: {type: timestamp?, description: Creation timestamp., immutable: true}
      updated_at: {type: timestamp?, description: Last update timestamp.}
      project_id:
        type: int64?
        description: Owning project ID. Null for group-scoped.
        immutable: true
        references: [Project]
      group_id:
        type: int64?
        description: Owning group ID. Null for project-scoped.
        immutable: true
        references: [Group]
      traversal_path: {type: string, description: Namespace path for authz.}

  WorkItem:
    style: {size: 32, color: "#EC4899"}
    description: >-
      A work item representing an issue, epic, task, incident, or other trackable
      unit of work
    label: title
    defaults: [id, iid, title, state, work_item_type]
    properties:
      id: {type: int64, description: Unique ID., immutable: true}
      iid: {type: int64, description: Scoped work item number., immutable: true}
      title: {type: string, description: Title.}
      description: {type: string, description: Description body (markdown).}
      state: {type: enum, description: Current state., values: {1: opened, 2: closed}}
      work_item_type:
        type: enum
        description: Work item type.
        values:
          1: issue
          2: incident
          3: test_case
          4: requirement
          5: task
          6: objective
          7: key_result
          8: epic
          9: ticket
      confidential: {type: boolean, description: Confidential flag.}
      due_date: {type: date?, description: Due date.}
      start_date: {type: date?, description: Start date.}
      weight: {type: int64?, description: Weight/points assigned.}
      created_at: {type: timestamp?, description: Creation timestamp., immutable: true}
      updated_at: {type: timestamp?, description: Last update timestamp.}
      closed_at: {type: timestamp?, description: Closed timestamp.}
      project_id:
        type: int64?
        description: Owning project ID. Null for group-scoped.
        immutable: true
        references: [Project]
      author_id: {type: int64?, description: Author user ID., immutable: true, references: [User]}
      milestone_id: {type: int64?, description: Associated milestone ID., references: [Milestone]}
      namespace_id:
        type: int64
        description: Owning namespace (group) ID.
        immutable: true
        references: [Group]
      closed_by_id: {type: int64?, description: User ID who closed this., references: [User]}
      traversal_path: {type: string, description: Namespace path for authz.}
