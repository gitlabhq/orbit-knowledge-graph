description: User who reopened a merge request or work item (ADR 013)

variants:
  - from_node: { type: User, id: id }
    to_node: { type: MergeRequest, id: id }
    scope: prune_to_target
    description: "User reopened a merge request."

  - from_node: { type: User, id: id }
    to_node: { type: WorkItem, id: id }
    scope: prune_to_target
    description: "User reopened a work item."

indexer:
  reindex: [siphon_resource_state_events]
pipelines:
  - name: REOPENED_siphon_resource_state_events_MergeRequest
    extract:
      type: clickhouse
      tables: [siphon_resource_state_events]
      fields: [user_id, merge_request_id]
      order_by: [traversal_path, id]
      filter: "state = 5"
      query: generated
      lookups:
        - { node: User, id: user_id }
    transform:
      type: datafusion
      edges:
        - from: { field: user_id, kind: User, enrich: true }
          to: { field: merge_request_id, kind: MergeRequest }
          label: REOPENED
  - name: REOPENED_siphon_resource_state_events_WorkItem
    extract:
      type: clickhouse
      tables: [siphon_resource_state_events]
      fields: [user_id, issue_id]
      order_by: [traversal_path, id]
      filter: "state = 5"
      query: generated
      lookups:
        - { node: User, id: user_id }
    transform:
      type: datafusion
      edges:
        - from: { field: user_id, kind: User, enrich: true }
          to: { field: issue_id, kind: WorkItem }
          label: REOPENED
