description: A user has effective access to a project, through direct membership, group inheritance, or a group share
table: gl_access_edge

properties:
  access_level:
    type: enum
    source: access_level
    nullable: false
    description: "User's effective access level in the project."
    values:
      20: reporter
      25: security_manager
      30: developer
      40: maintainer
      50: owner

variants:
  - from_node: { type: User, id: id }
    to_node: { type: Project, id: id }
    scope: prune_to_target
    description: "User has effective access to project at Reporter or higher."

indexer:
  reindex: [siphon_project_authorizations]
pipelines:
  - name: HAS_ACCESS_siphon_project_authorizations
    extract:
      type: clickhouse
      tables: [siphon_project_authorizations]
      order_by: [traversal_path, user_id, project_id, access_level]
      query: has_access.sql.j2
    transform:
      type: datafusion
      edges:
        - from: { field: user_id, kind: User }
          to: { field: project_id, kind: Project }
          label: HAS_ACCESS
