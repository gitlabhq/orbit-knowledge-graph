description: A file or a type declares a definition or an import, or owns it as a member

variants:
  - from_node: { type: File, id: id }
    to_node: { type: Definition, id: id }
    scope: same_namespace
    description: "File declares a definition."

  - from_node: { type: Definition, id: id }
    to_node: { type: Definition, id: id }
    scope: same_namespace
    description: "Definition declares or owns a member, such as a class and its methods."

  - from_node: { type: File, id: id }
    to_node: { type: Import, id: id }
    scope: same_namespace
    description: "File holds an import statement for the name."
