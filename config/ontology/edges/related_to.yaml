# config/ontology/edges/related_to.yaml

description: A work item relates to another work item

variants:
  - from_node: { type: WorkItem, id: id }
    to_node: { type: WorkItem, id: id }
    scope: prune_to_source
    description: "Work item relates to another work item. Blocking links are BLOCKS edges."

indexer:
  reindex: [siphon_issue_links]
pipelines:
  - name: RELATED_TO_siphon_issue_links_WorkItem
    extract:
      type: clickhouse
      tables: [siphon_issue_links]
      fields: [source_id, target_id]
      order_by: [traversal_path, source_id, id]
      filter: "link_type = 0"
      query: generated
    transform:
      type: datafusion
      edges:
        - from: { field: source_id, kind: WorkItem }
          to: { field: target_id, kind: WorkItem }
          label: RELATED_TO
