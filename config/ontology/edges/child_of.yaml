# config/ontology/edges/child_of.yaml

description: Pipeline or Duo workflow was started as a child of another of the same type
table: gl_ci_edge

variants:
  - from_node: { type: Pipeline, id: id }
    to_node: { type: Pipeline, id: id }
    scope: prune_to_source
    description: "Pipeline is a downstream child of the source pipeline."

  - from_node: { type: DuoWorkflow, id: id }
    to_node: { type: DuoWorkflow, id: id }
    table: gl_edge
    fk_column: parent_workflow_id
    scope: prune_to_source
    description: "Duo workflow was started by the parent workflow."

indexer:
  reindex: [siphon_ci_sources_pipelines]
pipelines:
  - name: CHILD_OF_siphon_ci_sources_pipelines_Pipeline
    extract:
      type: clickhouse
      tables: [siphon_ci_sources_pipelines]
      fields: [pipeline_id, source_pipeline_id]
      order_by: [traversal_path, id, partition_id]
      query: generated
      lookups:
        - { node: Pipeline, id: pipeline_id }
        - { node: Pipeline, id: source_pipeline_id }
    transform:
      type: datafusion
      edges:
        - from: { field: pipeline_id, kind: Pipeline, enrich: true }
          to: { field: source_pipeline_id, kind: Pipeline, enrich: true }
          label: CHILD_OF
