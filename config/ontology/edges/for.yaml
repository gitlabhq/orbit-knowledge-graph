description: A to-do item is about a work item, merge request, or Duo workflow

variants:
  - from_node: { type: Todo, id: id }
    to_node: { type: WorkItem, id: id }
    table: gl_todo_edge
    scope: prune_to_source
    description: "To-do item is about the work item."

  - from_node: { type: Todo, id: id }
    to_node: { type: MergeRequest, id: id }
    table: gl_todo_edge
    scope: prune_to_source
    description: "To-do item is about the merge request."

  - from_node: { type: Todo, id: id }
    to_node: { type: DuoWorkflow, id: id }
    table: gl_todo_edge
    scope: prune_to_source
    description: "To-do item asks for input on the Duo workflow."
