description: Code reads or writes a value without a call

properties:
  lines:
    type: int64[]
    source: lines
    nullable: false
    description: "Sorted 1-based lines of each use between the two nodes; at most 64 entries."

  resolution:
    type: enum
    enum_type: string
    source: resolution
    nullable: false
    description: "How the engine found the target, from the strongest rule to the weakest."
    values:
      0: local
      1: import
      2: declared_type
      3: inferred_type
      4: wildcard_import

  access:
    type: enum
    enum_type: string
    source: access
    nullable: false
    description: "Whether the source reads or writes the value."
    values:
      0: read
      1: write

variants:
  - from_node: { type: Definition, id: id }
    to_node: { type: Definition, id: id }
    scope: same_namespace
    description: "Definition reads or writes a value definition, or passes a function as a value."

  - from_node: { type: Definition, id: id }
    to_node: { type: Import, id: id }
    scope: same_namespace
    description: "Definition reads or writes an imported value."

  - from_node: { type: File, id: id }
    to_node: { type: Definition, id: id }
    scope: same_namespace
    description: "Top-level code of the file reads or writes a value definition."

  - from_node: { type: File, id: id }
    to_node: { type: Import, id: id }
    scope: same_namespace
    description: "Top-level code of the file reads or writes an imported value."
