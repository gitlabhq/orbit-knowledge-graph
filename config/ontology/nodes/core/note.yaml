# config/ontology/nodes/core/note.yaml

node_type: Note
domain: core
description: A comment or annotation on a GitLab object (issue, merge request, commit, etc.)
label: id
destination_table: gl_note
default_columns: [id, noteable_type, noteable_id, created_at]

style:
  size: 24
  color: "#64748B"

redaction:
  resource_type: note
  id_column: id
  ability: read_note

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."
    traversal_path_lookup:
      kind: id
      source_table: gl_note
      key_column: id

  note:
    type: string
    source: note
    nullable: false
    description: "Text content (markdown)."

  noteable_type:
    type: enum
    source: noteable_type
    nullable: false
    mutable: false
    description: "Type of object the note is attached to."
    enum_type: string
    values:
      0: Issue
      1: MergeRequest
      2: Commit
      3: Snippet
      4: "WikiPage::Meta"
      5: "DesignManagement::Design"
      6: "AlertManagement::Alert"
      7: Vulnerability
      8: AbuseReport
      9: "ComplianceManagement::Projects::ComplianceViolation"
      10: Epic

  noteable_id:
    type: int64
    source: noteable_id
    nullable: true
    mutable: false
    high_fan_out: true
    description: "ID of the attached object. Null for commits."

  line_code:
    type: string
    source: line_code
    nullable: false
    description: "Line position identifier for diff notes."

  created_at:
    type: timestamp
    source: created_at
    nullable: true
    mutable: false
    description: "Creation timestamp."

  updated_at:
    type: timestamp
    source: updated_at
    nullable: true
    description: "Last update timestamp."

  discussion_id:
    type: string
    source: discussion_id
    nullable: true
    mutable: false
    description: "Discussion thread ID."

  resolved_at:
    type: timestamp
    source: resolved_at
    nullable: true
    description: "Resolution timestamp."

  internal:
    type: boolean
    source: internal
    nullable: false
    description: "Only visible to users with Reporter+ access on the parent resource."

  confidential:
    type: boolean
    source: confidential
    nullable: true
    description: "Legacy alias for internal; synced on create. Being renamed per gitlab#367923."

  commit_id:
    type: string
    source: commit_id
    nullable: false
    mutable: false
    description: "Commit SHA for commit notes."

  st_diff:
    type: string
    source: st_diff
    nullable: false
    description: "Serialized diff snippet for diff notes."

  project_id:
    type: int64
    source: project_id
    nullable: true
    mutable: false
    description: "Owning project ID."

  author_id:
    type: int64
    source: author_id
    nullable: true
    mutable: false
    description: "Author user ID."

  type:
    type: enum
    source: note_type
    nullable: false
    mutable: false
    description: "Note class. Note for a plain comment."
    enum_type: string
    selectivity: low
    values:
      0: Note
      1: DiffNote
      2: DiscussionNote
      3: LegacyDiffNote

  file_path:
    type: string
    source: file_path
    nullable: true
    description: "Path of the file in the new version of the diff. Null when the note has no diff position."

  new_line:
    type: int64
    source: new_line
    nullable: true
    description: "Line number in the new version of the file. Null for a removed line."

  old_line:
    type: int64
    source: old_line
    nullable: true
    description: "Line number in the old version of the file. Null for an added line."

  resolved_by_id:
    type: int64
    source: resolved_by_id
    nullable: true
    description: "User ID who resolved the discussion thread."

  resolved_by_push:
    type: boolean
    source: resolved_by_push
    nullable: true
    description: "Whether a push resolved the discussion thread."

  review_id:
    type: int64
    source: review_id
    nullable: true
    mutable: false
    description: "ID of the merge request review that published the note."

  updated_by_id:
    type: int64
    source: updated_by_id
    nullable: true
    description: "User ID who last updated."

  last_edited_at:
    type: timestamp
    source: last_edited_at
    nullable: true
    description: "Last text edit timestamp."

  imported_from:
    type: enum
    source: imported_from
    nullable: false
    mutable: false
    description: "Import source. none when not imported."
    values:
      0: none
      1: gitlab_migration
      2: gitlab_project
      3: gitlab_group
      4: github
      5: bitbucket
      6: bitbucket_server
      7: fogbugz
      8: gitea
      9: git
      10: manifest
      11: custom_template
      12: jira
      13: offline_transfer

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

indexer:
  reindex: [siphon_notes]
pipelines:
  - name: Note
    extract:
      type: clickhouse
      tables: [siphon_notes]
      order_by: [traversal_path, noteable_type, noteable_id, id]
      query: note.sql.j2
    transform:
      type: datafusion
      edges:
        - from:
            field: author_id
            kind: User
          to:
            field: id
            kind: Note
          label: AUTHORED
        - from:
            field: id
            kind: Note
          to:
            field: project_id
            kind: Project
          label: IN_PROJECT
        - from:
            field: noteable_id
            kind:
              derive: noteable_type
              mapping:
                Issue: WorkItem
                Epic: WorkItem
          to:
            field: id
            kind: Note
          label: HAS_NOTE
          mutable: true
        - from:
            field: resolved_by_id
            kind: User
          to:
            field: id
            kind: Note
          label: RESOLVED_BY
          mutable: true
        - from:
            field: updated_by_id
            kind: User
          to:
            field: id
            kind: Note
          label: UPDATED_BY
          mutable: true
storage:
  primary_key: [traversal_path, id]
  settings:
    add_minmax_index_for_temporal_columns: "1"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: note, type: "String", default: "''", codec: ["ZSTD(3)"]}
    - {name: noteable_type, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: noteable_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: line_code, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: commit_id, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: st_diff, type: "String", default: "''", codec: ["ZSTD(3)"]}
    - {name: discussion_id, type: "Nullable(String)", codec: ["ZSTD(1)"]}
    - {name: resolved_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: internal, type: "Bool", default: "false"}
    - {name: confidential, type: "Nullable(Bool)"}
    - {name: created_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: updated_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: project_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: author_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: type, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: file_path, type: "Nullable(String)", codec: ["ZSTD(1)"]}
    - {name: new_line, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: old_line, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: resolved_by_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: resolved_by_push, type: "Nullable(Bool)"}
    - {name: review_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: updated_by_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: last_edited_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: imported_from, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: traversal_path, type: "String", default: "'0/'", codec: ["ZSTD(1)"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_noteable_type, column: noteable_type, type: "set(14)", granularity: 2}
    - {name: idx_internal, column: internal, type: "minmax", granularity: 1}
    - {name: idx_confidential, column: confidential, type: "minmax", granularity: 1}
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_note, column: note, type: text, granularity: 1}
    - {name: idx_discussion_id, column: discussion_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_noteable_id, column: noteable_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_project_id, column: project_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_author_id, column: author_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_created_at, column: created_at, type: "minmax", granularity: 1}
    - {name: idx_type, column: type, type: "set(8)", granularity: 2}
    - {name: idx_file_path, column: file_path, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_resolved_by_id, column: resolved_by_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_review_id, column: review_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_updated_by_id, column: updated_by_id, type: "bloom_filter(0.0001)", granularity: 1}
