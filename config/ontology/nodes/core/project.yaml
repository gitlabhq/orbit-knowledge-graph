# config/ontology/nodes/core/project.yaml

node_type: Project
domain: core
description: A GitLab project/repository
label: name
destination_table: gl_project
default_columns: [id, name, full_path, visibility_level]

style:
  size: 40
  color: "#3B82F6"

redaction:
  resource_type: project
  id_column: id
  # Temporary: aligned with source-code entities so Project + code traversals
  # don't emit two (resource_type=project, ability=...) redaction entries that
  # Rails then 400s on as duplicate. Revert to read_project after the
  # response-side discriminator fix lands. See #570.
  ability: read_code

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."
    traversal_path_lookup:
      kind: id
      source_table: gl_project
      key_column: id

  full_path:
    type: string
    source: full_path
    nullable: false
    unique: true
    description: "Full path (e.g. gitlab-org/gitlab)."
    traversal_path_lookup:
      kind: full_path
      source_table: gl_project
      key_column: full_path

  name:
    type: string
    source: name
    nullable: false
    description: "Display name."

  description:
    type: string
    source: description
    nullable: false
    description: "Description text."

  created_at:
    type: timestamp
    source: created_at
    nullable: true
    mutable: false
    description: "Creation timestamp."

  updated_at:
    type: timestamp
    source: updated_at
    nullable: true
    description: "Last update timestamp."

  visibility_level:
    type: enum
    source: visibility_level
    nullable: false
    description: "Visibility level."
    values:
      0: private
      10: internal
      20: public

  archived:
    type: boolean
    source: archived
    nullable: false
    description: "Archived flag."

  star_count:
    type: int64
    source: star_count
    nullable: false
    description: "Number of stars."

  last_activity_at:
    type: timestamp
    source: last_activity_at
    nullable: true
    description: "Last activity timestamp."

  pending_delete:
    type: boolean
    source: pending_delete
    nullable: true
    description: "Deletion is in progress."

  marked_for_deletion_at:
    type: date
    source: marked_for_deletion_at
    nullable: true
    description: "Date the project was marked for deletion."

  hidden:
    type: boolean
    source: hidden
    nullable: false
    admin_only: true
    description: "Hidden because its creator is banned. Admins only."

  project_namespace_id:
    type: int64
    source: project_namespace_id
    nullable: true
    description: "ID of the project namespace row."

  last_repository_updated_at:
    type: timestamp
    source: last_repository_updated_at
    nullable: true
    description: "Last repository push timestamp."

  mirror:
    type: boolean
    source: mirror
    nullable: false
    description: "Pull mirroring is enabled."

  mirror_user_id:
    type: int64
    source: mirror_user_id
    nullable: true
    description: "ID of the user the pull mirror runs as. Null when mirroring is off."

  request_access_enabled:
    type: boolean
    source: request_access_enabled
    nullable: false
    description: "Users can request access to the project."

  shared_runners_enabled:
    type: boolean
    source: shared_runners_enabled
    nullable: false
    description: "Instance runners are enabled for the project."

  public_builds:
    type: boolean
    source: public_builds
    nullable: false
    description: "Job logs and artifacts are visible to everyone with project access."

  packages_enabled:
    type: boolean
    source: packages_enabled
    nullable: true
    description: "Package registry is enabled."

  ci_config_path:
    type: string
    source: ci_config_path
    nullable: true
    description: "Custom CI configuration file path. Null means .gitlab-ci.yml."

  only_allow_merge_if_pipeline_succeeds:
    type: boolean
    source: only_allow_merge_if_pipeline_succeeds
    nullable: false
    description: "Merge requests need a successful pipeline to merge."

  only_allow_merge_if_all_discussions_are_resolved:
    type: boolean
    source: only_allow_merge_if_all_discussions_are_resolved
    nullable: true
    description: "Merge requests need all threads resolved to merge."

  merge_method:
    type: enum
    source: merge_method
    nullable: false
    description: "Merge method for merge requests."
    enum_type: string
    values:
      0: merge
      1: rebase_merge
      2: ff

  remove_source_branch_after_merge:
    type: boolean
    source: remove_source_branch_after_merge
    nullable: true
    description: "Source branch deletion is selected by default on new merge requests."

  resolve_outdated_diff_discussions:
    type: boolean
    source: resolve_outdated_diff_discussions
    nullable: true
    description: "Diff threads resolve when a push changes their lines."

  autoclose_referenced_issues:
    type: boolean
    source: autoclose_referenced_issues
    nullable: true
    description: "Merging to the default branch closes referenced issues."

  suggestion_commit_message:
    type: string
    source: suggestion_commit_message
    nullable: true
    description: "Commit message template for applied suggestions."

  approvals_before_merge:
    type: int64
    source: approvals_before_merge
    nullable: false
    description: "Project-level number of approvals a merge request needs."

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

indexer:
  reindex:
    - table: siphon_projects
      traversal_path:
        dictionary: project_traversal_paths_dict
        key_column: id
    - siphon_routes
pipelines:
  - name: Project
    extract:
      type: clickhouse
      # tables[0] is the partition-probe base: it must carry traversal_path + id.
      # siphon_projects lacks traversal_path (Project derives it via the join), so
      # project_namespace_traversal_paths leads.
      tables: [project_namespace_traversal_paths, siphon_projects, siphon_routes]
      order_by: [traversal_path, id]
      query: project.sql.j2
    transform:
      type: datafusion
      edges:
        - from:
            field: creator_id
            kind: User
          to:
            field: id
            kind: Project
          label: CREATOR
          mutable: true
        - from:
            field: namespace_id
            kind: Group
          to:
            field: id
            kind: Project
          label: CONTAINS
          mutable: true
        - from:
            field: marked_for_deletion_by_user_id
            kind: User
          to:
            field: id
            kind: Project
          label: MARKED_FOR_DELETION_BY
          mutable: true
storage:
  primary_key: [traversal_path, id]
  settings:
    add_minmax_index_for_temporal_columns: "1"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: name, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: description, type: "String", default: "''", codec: ["ZSTD(3)"]}
    - {name: visibility_level, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: full_path, type: "String", default: "''", codec: ["ZSTD(3)"]}
    - {name: created_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: updated_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: archived, type: "Nullable(Bool)"}
    - {name: star_count, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: last_activity_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: pending_delete, type: "Nullable(Bool)"}
    - {name: marked_for_deletion_at, type: "Date32", default: "'1970-01-01'", codec: ["Delta(4)", "ZSTD(1)"]}
    - {name: hidden, type: "Bool", default: "false"}
    - {name: project_namespace_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: last_repository_updated_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: mirror, type: "Bool", default: "false"}
    - {name: mirror_user_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: request_access_enabled, type: "Bool", default: "false"}
    - {name: shared_runners_enabled, type: "Bool", default: "false"}
    - {name: public_builds, type: "Bool", default: "false"}
    - {name: packages_enabled, type: "Nullable(Bool)"}
    - {name: ci_config_path, type: "Nullable(String)", codec: ["ZSTD(1)"]}
    - {name: only_allow_merge_if_pipeline_succeeds, type: "Bool", default: "false"}
    - {name: only_allow_merge_if_all_discussions_are_resolved, type: "Nullable(Bool)"}
    - {name: merge_method, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: remove_source_branch_after_merge, type: "Nullable(Bool)"}
    - {name: resolve_outdated_diff_discussions, type: "Nullable(Bool)"}
    - {name: autoclose_referenced_issues, type: "Nullable(Bool)"}
    - {name: suggestion_commit_message, type: "Nullable(String)", codec: ["ZSTD(1)"]}
    - {name: approvals_before_merge, type: "Int64", default: "0", codec: ["T64", "ZSTD(1)"]}
    - {name: traversal_path, type: "String", default: "'0/'", codec: ["ZSTD(1)"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_archived, column: archived, type: "minmax", granularity: 1}
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_name, column: name, type: text, granularity: 1}
    - {name: idx_full_path, column: full_path, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_description, column: description, type: text, granularity: 1}
