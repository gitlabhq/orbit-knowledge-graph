# config/ontology/nodes/core/group.yaml

node_type: Group
domain: core
description: A GitLab group (top-level group or subgroup)
label: name
destination_table: gl_group
default_columns: [id, name, full_path, visibility_level]

style:
  size: 45
  color: "#8B5CF6"

redaction:
  resource_type: group
  id_column: id
  ability: read_group

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."
    traversal_path_lookup:
      kind: id
      source_table: gl_group
      key_column: id

  full_path:
    type: string
    source: full_path
    nullable: false
    unique: true
    description: "Full path (e.g. gitlab-org/quality)."
    traversal_path_lookup:
      kind: full_path
      source_table: gl_group
      key_column: full_path

  name:
    type: string
    source: name
    nullable: false
    description: "Display name."

  description:
    type: string
    source: description
    nullable: false
    description: "Description text."

  created_at:
    type: timestamp
    source: created_at
    nullable: true
    mutable: false
    description: "Creation timestamp."

  updated_at:
    type: timestamp
    source: updated_at
    nullable: true
    description: "Last update timestamp."

  visibility_level:
    type: enum
    source: visibility_level
    nullable: false
    description: "Visibility level."
    values:
      0: private
      10: internal
      20: public

  state:
    type: enum
    source: state
    nullable: false
    description: "Lifecycle state. ancestor_inherited means the group has no state of its own."
    values:
      0: ancestor_inherited
      1: archived
      2: deletion_scheduled
      3: creation_in_progress
      4: deletion_in_progress
      5: transfer_in_progress
      6: maintenance
      7: transfer_scheduled

  avatar_url:
    type: string
    source: avatar
    nullable: true
    description: "Avatar upload filename (not a URL; the full URL is computed at runtime)."

  deletion_scheduled_at:
    type: timestamp
    source: deletion_scheduled_at
    nullable: true
    description: "Time the group was scheduled for deletion."

  request_access_enabled:
    type: boolean
    source: request_access_enabled
    nullable: false
    description: "Users can request access to the group."

  shared_runners_enabled:
    type: boolean
    source: shared_runners_enabled
    nullable: false
    description: "Instance runners are enabled for the group."

  require_two_factor_authentication:
    type: boolean
    source: require_two_factor_authentication
    nullable: false
    description: "Members must use two-factor authentication."

  membership_lock:
    type: boolean
    source: membership_lock
    nullable: true
    description: "Projects in the group cannot add members directly."

  share_with_group_lock:
    type: boolean
    source: share_with_group_lock
    nullable: true
    description: "Projects in the group cannot be shared with other groups."

  mentions_disabled:
    type: boolean
    source: mentions_disabled
    nullable: true
    description: "Group mentions do not send notifications."

  auto_devops_enabled:
    type: boolean
    source: auto_devops_enabled
    nullable: true
    description: "Auto DevOps setting. Null means the group inherits it."

  lfs_enabled:
    type: boolean
    source: lfs_enabled
    nullable: true
    description: "Git LFS setting. Null means the instance default."

  project_creation_level:
    type: enum
    source: project_creation_level
    nullable: true
    description: "Minimum role that can create projects. Null means the instance default."
    values:
      0: noone
      1: maintainer
      2: developer
      3: administrator
      4: owner

  subgroup_creation_level:
    type: enum
    source: subgroup_creation_level
    nullable: true
    description: "Minimum role that can create subgroups. Null means owner."
    values:
      0: owner
      1: maintainer

  default_branch_protection:
    type: enum
    source: default_branch_protection
    nullable: true
    description: "Default branch protection for new projects. Null means the instance default."
    values:
      0: none
      1: developer_can_push
      2: full
      3: developer_can_merge
      4: developer_can_initial_push

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

indexer:
  reindex:
    - table: siphon_namespaces
      traversal_path:
        dictionary: namespace_traversal_paths_dict
        key_column: id
    - table: siphon_namespace_details
      traversal_path:
        dictionary: namespace_traversal_paths_dict
        key_column: namespace_id
    - siphon_routes
pipelines:
  - name: Group
    extract:
      type: clickhouse
      # tables[0] is the partition-probe base: it must carry traversal_path + id.
      # siphon_namespaces lacks traversal_path (Group derives it via the join), so
      # namespace_traversal_paths leads.
      tables: [namespace_traversal_paths, siphon_namespaces, siphon_namespace_details, siphon_routes]
      order_by: [traversal_path, id]
      query: group.sql.j2
    transform:
      type: datafusion
      edges:
        - from:
            field: owner_id
            kind: User
          to:
            field: id
            kind: Group
          label: OWNER
          mutable: true
        - from:
            field: parent_id
            kind: Group
          to:
            field: id
            kind: Group
          label: CONTAINS
          mutable: true
        - from:
            field: creator_id
            kind: User
          to:
            field: id
            kind: Group
          label: CREATOR
          mutable: true
storage:
  primary_key: [traversal_path, id]
  settings:
    add_minmax_index_for_temporal_columns: "1"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: name, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: description, type: "String", default: "''", codec: ["ZSTD(3)"]}
    - {name: visibility_level, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: full_path, type: "String", default: "''", codec: ["ZSTD(3)"]}
    - {name: created_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: updated_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: state, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: avatar_url, type: "Nullable(String)", codec: ["ZSTD(1)"]}
    - {name: deletion_scheduled_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: request_access_enabled, type: "Bool", default: "false"}
    - {name: shared_runners_enabled, type: "Bool", default: "false"}
    - {name: require_two_factor_authentication, type: "Bool", default: "false"}
    - {name: membership_lock, type: "Nullable(Bool)"}
    - {name: share_with_group_lock, type: "Nullable(Bool)"}
    - {name: mentions_disabled, type: "Nullable(Bool)"}
    - {name: auto_devops_enabled, type: "Nullable(Bool)"}
    - {name: lfs_enabled, type: "Nullable(Bool)"}
    - {name: project_creation_level, type: "LowCardinality(Nullable(String))", codec: ["LZ4"]}
    - {name: subgroup_creation_level, type: "LowCardinality(Nullable(String))", codec: ["LZ4"]}
    - {name: default_branch_protection, type: "LowCardinality(Nullable(String))", codec: ["LZ4"]}
    - {name: traversal_path, type: "String", default: "'0/'", codec: ["ZSTD(1)"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_state, column: state, type: "set(10)", granularity: 2}
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_name, column: name, type: text, granularity: 1}
    - {name: idx_full_path, column: full_path, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_description, column: description, type: text, granularity: 1}
