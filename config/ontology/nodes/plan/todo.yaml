node_type: Todo
domain: plan
description: A to-do item for one user, raised by an action on a work item, merge request, or other target. To-do items on commits are not indexed
label: action
destination_table: gl_todo
default_columns: [id, action, state, target_type, created_at]

style:
  size: 18
  color: "#14B8A6"

redaction:
  resource_type: todo
  id_column: id
  ability: read_todo
  owner_column: user_id
  owner_bypass: none

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."
    traversal_path_lookup:
      kind: id
      source_table: gl_todo
      key_column: id

  user_id:
    type: int64
    source: user_id
    nullable: false
    mutable: false
    description: "ID of the user who owns the to-do item."

  author_id:
    type: int64
    source: author_id
    nullable: false
    mutable: false
    description: "ID of the user whose action raised the to-do item."

  action:
    type: enum
    source: action
    nullable: false
    mutable: false
    description: "Action that raised the to-do item."
    values:
      1: assigned
      2: mentioned
      3: build_failed
      4: marked
      5: approval_required
      6: unmergeable
      7: directly_addressed
      8: merge_train_removed
      9: review_requested
      10: member_access_requested
      11: review_submitted
      12: okr_checkin_requested
      13: added_approver
      14: ssh_key_expired
      15: ssh_key_expiring_soon
      16: duo_pro_access_granted
      17: duo_enterprise_access_granted
      18: duo_core_access_granted
      19: duo_workflow_input_required
      20: transfer_failed

  state:
    type: enum
    source: state
    nullable: false
    description: "State."
    enum_type: string
    values:
      0: pending
      1: done

  target_type:
    type: string
    source: target_type
    nullable: false
    mutable: false
    description: "Class of the target (e.g. 'Issue', 'MergeRequest', 'Epic')."
    selectivity: low

  target_id:
    type: int64
    source: target_id
    nullable: true
    mutable: false
    description: "ID of the target."

  note_id:
    type: int64
    source: note_id
    nullable: true
    mutable: false
    description: "Note that raised the to-do item, if any."

  project_id:
    type: int64
    source: project_id
    nullable: true
    mutable: false
    description: "Project of the target, if any."

  group_id:
    type: int64
    source: group_id
    nullable: true
    mutable: false
    description: "Group of the target, if any."

  created_at:
    type: timestamp
    source: created_at
    nullable: true
    mutable: false
    description: "Creation timestamp."

  updated_at:
    type: timestamp
    source: updated_at
    nullable: true
    description: "Last update timestamp."

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

indexer:
  reindex: [siphon_todos]
pipelines:
  - name: Todo
    extract:
      type: clickhouse
      tables: [siphon_todos]
      order_by: [traversal_path, user_id, id]
      filter: "{{deleted_column}} OR (target_type NOT IN ('User', 'Key', 'Commit') AND traversal_path != '0/')"
      query: generated
    transform:
      type: datafusion
      edges:
        - from:
            field: user_id
            kind: User
          to:
            field: id
            kind: Todo
          label: HAS_TODO
        - from:
            field: id
            kind: Todo
          to:
            field: target_id
            kind:
              derive: target_type
              mapping:
                Issue: WorkItem
                WorkItem: WorkItem
                MergeRequest: MergeRequest
                "Ai::DuoWorkflows::Workflow": DuoWorkflow
          label: FOR
        - from:
            field: id
            kind: Todo
          to:
            field: note_id
            kind: Note
          label: ON_NOTE
        - from:
            field: id
            kind: Todo
          to:
            field: author_id
            kind: User
          label: RAISED_BY
storage:
  primary_key: [traversal_path, id]
  settings:
    add_minmax_index_for_temporal_columns: "1"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: user_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: author_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: action, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: state, type: "LowCardinality(String)", default: "'pending'", codec: ["LZ4"]}
    - {name: target_type, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: target_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: note_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: project_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: group_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: created_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: updated_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: traversal_path, type: "String", default: "'0/'", codec: ["ZSTD(1)"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_user_id, column: user_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_target_id, column: target_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_action, column: action, type: "set(32)", granularity: 2}
    - {name: idx_state, column: state, type: "set(4)", granularity: 2}
    - {name: idx_target_type, column: target_type, type: "set(16)", granularity: 2}
