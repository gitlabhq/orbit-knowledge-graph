# config/ontology/nodes/ci/pipeline.yaml

node_type: Pipeline
domain: ci
description: A CI/CD pipeline that runs a series of stages and jobs to build, test, and deploy code
label: id
destination_table: gl_pipeline
default_columns: [id, iid, status, ref, source]
enrichment_props: [status, source, tag, failure_reason, protected]

style:
  size: 30
  color: "#6366F1"

redaction:
  resource_type: ci_pipeline
  id_column: id
  ability: read_pipeline

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."
    traversal_path_lookup:
      kind: id
      source_table: gl_pipeline
      key_column: id

  iid:
    type: int64
    source: iid
    nullable: true
    mutable: false
    description: "Project-scoped pipeline number."

  sha:
    type: string
    source: sha
    nullable: false
    mutable: false
    description: "Commit SHA the pipeline runs against."

  ref:
    type: string
    source: ref
    nullable: false
    mutable: false
    description: "Branch or tag name."

  status:
    type: enum
    source: status
    nullable: false
    description: "Execution status."
    enum_type: string
    values:
      0: created
      1: pending
      2: running
      3: success
      4: failed
      5: canceled
      6: skipped
      7: manual
      8: scheduled
      9: preparing
      10: waiting_for_resource
      11: waiting_for_callback
      12: canceling
    terminal_values: [success, failed, canceled, skipped]

  source:
    type: enum
    source: source
    nullable: false
    mutable: false
    description: "Trigger source."
    values:
      0: unknown
      1: push
      2: web
      3: trigger
      4: schedule
      5: api
      6: external
      7: pipeline
      8: chat
      9: webide
      10: merge_request_event
      11: external_pull_request_event
      12: parent_pipeline
      13: ondemand_dast_scan
      14: ondemand_dast_validation
      15: security_orchestration_policy
      16: container_registry_push
      17: duo_workflow
      18: pipeline_execution_policy_schedule
      19: dependency_management_security_update

  tag:
    type: boolean
    source: tag
    nullable: false
    mutable: false
    description: "Whether running on a git tag."

  duration:
    type: int64
    source: duration
    nullable: true
    description: "Wall-clock duration in seconds (first job start to last job finish, excluding queued time)."

  failure_reason:
    type: enum
    source: failure_reason
    nullable: false
    description: "Failure reason."
    values:
      0: unknown_failure
      1: config_error
      2: external_validation_failure
      3: user_not_verified
      21: size_limit_exceeded
      22: job_activity_limit_exceeded
      23: deployments_limit_exceeded
      25: project_deleted
      26: filtered_by_rules
      27: filtered_by_workflow_rules
      28: composite_identity_forbidden
      29: pipeline_ref_creation_failure
      30: filtered_by_no_pipeline
      31: gitaly_unavailable
      32: seed_timeout

  created_at:
    type: timestamp
    source: created_at
    nullable: true
    mutable: false
    description: "Creation timestamp."

  started_at:
    type: timestamp
    source: started_at
    nullable: true
    description: "Execution start timestamp."

  finished_at:
    type: timestamp
    source: finished_at
    nullable: true
    description: "Execution finish timestamp."

  committed_at:
    type: timestamp
    source: committed_at
    nullable: true
    mutable: false
    description: "Commit timestamp."

  updated_at:
    type: timestamp
    source: updated_at
    nullable: true
    description: "Last update timestamp."

  before_sha:
    type: string
    source: before_sha
    nullable: false
    mutable: false
    description: "Previous commit SHA before the triggering push."

  yaml_errors:
    type: string
    source: yaml_errors
    nullable: false
    description: "CI config parsing errors."

  protected:
    type: boolean
    source: protected
    nullable: true
    description: "Whether the ref is protected."

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID."

  user_id:
    type: int64
    source: user_id
    nullable: true
    mutable: false
    description: "Triggering user ID."

  merge_request_id:
    type: int64
    source: merge_request_id
    nullable: true
    mutable: false
    description: "Triggering MR ID."

  auto_canceled_by_id:
    type: int64
    source: auto_canceled_by_id
    nullable: true
    description: "Pipeline ID that auto-canceled this one."

  config_source:
    type: enum
    source: config_source
    nullable: true
    mutable: false
    description: "CI configuration origin. Null when unknown."
    values:
      1: repository_source
      2: auto_devops_source
      3: webide_source
      4: remote_source
      5: external_project_source
      6: bridge_source
      7: parameter_source
      8: compliance_source
      9: security_policies_default_source
      10: pipeline_execution_policy_forced
      11: security_scan_profiles_source

  locked:
    type: enum
    source: locked
    nullable: false
    description: "Artifact lock state."
    values:
      0: unlocked
      1: artifacts_locked

  pipeline_schedule_id:
    type: int64
    source: pipeline_schedule_id
    nullable: true
    mutable: false
    description: "Pipeline schedule ID that started the pipeline."

  trigger_id:
    type: int64
    source: trigger_id
    nullable: true
    mutable: false
    description: "Pipeline trigger token ID that started the pipeline."

  source_sha:
    type: string
    source: source_sha
    nullable: true
    mutable: false
    description: "Source branch SHA of a merged results pipeline."

  target_sha:
    type: string
    source: target_sha
    nullable: true
    mutable: false
    description: "Target branch SHA of a merged results pipeline."

  external_pull_request_id:
    type: int64
    source: external_pull_request_id
    nullable: true
    mutable: false
    description: "External pull request ID that started the pipeline."

  name:
    type: string
    source: name
    nullable: true
    description: "Pipeline name from workflow:name."

  auto_cancel_on_new_commit:
    type: enum
    source: auto_cancel_on_new_commit
    nullable: false
    description: "Auto-cancel policy when a newer pipeline runs on the same ref."
    values:
      0: conservative
      1: interruptible
      2: none

  auto_cancel_on_job_failure:
    type: enum
    source: auto_cancel_on_job_failure
    nullable: false
    description: "Auto-cancel policy when a job fails."
    values:
      0: none
      1: all

  security_policy_protected_branch_bypassed:
    type: boolean
    source: security_policy_protected_branch_bypassed
    nullable: false
    description: "Whether a security policy bypassed branch protection for the pipeline."

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

indexer:
  reindex: [siphon_p_ci_pipelines, siphon_ci_pipeline_metadata]
pipelines:
  - name: Pipeline
    extract:
      type: clickhouse
      tables: [siphon_p_ci_pipelines, siphon_ci_pipeline_metadata]
      order_by: [traversal_path, id, partition_id]
      query: pipeline.sql.j2
    transform:
      type: datafusion
      edges:
        - from:
            field: id
            kind: Pipeline
          to:
            field: project_id
            kind: Project
          label: IN_PROJECT
        - from:
            field: user_id
            kind: User
          to:
            field: id
            kind: Pipeline
          label: TRIGGERED
        - from:
            field: merge_request_id
            kind: MergeRequest
          to:
            field: id
            kind: Pipeline
          label: TRIGGERED
        - from:
            field: id
            kind: Pipeline
          to:
            field: auto_canceled_by_id
            kind: Pipeline
          label: AUTO_CANCELED_BY
          mutable: true
storage:
  primary_key: [traversal_path, id]
  settings:
    add_minmax_index_for_temporal_columns: "1"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: iid, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: ref, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: status, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: source, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: tag, type: "Bool", default: "false"}
    - {name: duration, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: failure_reason, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: created_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: started_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: finished_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: committed_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: updated_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: before_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: yaml_errors, type: "String", default: "''", codec: ["ZSTD(3)"]}
    - {name: protected, type: "Nullable(Bool)"}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: user_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: merge_request_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: auto_canceled_by_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: config_source, type: "LowCardinality(Nullable(String))", codec: ["LZ4"]}
    - {name: locked, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: pipeline_schedule_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: trigger_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: source_sha, type: "Nullable(String)", codec: ["ZSTD(1)"]}
    - {name: target_sha, type: "Nullable(String)", codec: ["ZSTD(1)"]}
    - {name: external_pull_request_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: name, type: "Nullable(String)", codec: ["ZSTD(1)"]}
    - {name: auto_cancel_on_new_commit, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: auto_cancel_on_job_failure, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: security_policy_protected_branch_bypassed, type: "Bool", default: "false"}
    - {name: traversal_path, type: "String", default: "'0/'", codec: ["ZSTD(1)"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_status, column: status, type: "set(16)", granularity: 2}
    - {name: idx_tag, column: tag, type: "minmax", granularity: 1}
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_source, column: source, type: "set(20)", granularity: 2}
    - {name: idx_ref, column: ref, type: text, granularity: 1}
    - {name: idx_project_id, column: project_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_user_id, column: user_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_merge_request_id, column: merge_request_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_auto_canceled_by_id, column: auto_canceled_by_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_config_source, column: config_source, type: "set(12)", granularity: 2}
    - {name: idx_pipeline_schedule_id, column: pipeline_schedule_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_trigger_id, column: trigger_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_external_pull_request_id, column: external_pull_request_id, type: "bloom_filter(0.0001)", granularity: 1}
