# config/ontology/nodes/ci/runner.yaml

node_type: Runner
domain: ci
global: true
description: A CI/CD runner that executes jobs
label: name
destination_table: gl_runner
default_columns: [id, runner_type, name, active]
sort_key: [id]

style:
  size: 22
  color: "#A78BFA"

redaction:
  resource_type: ci_runner
  id_column: id
  ability: read_runner

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."

  runner_type:
    type: enum
    source: runner_type
    nullable: false
    mutable: false
    description: "Scope: instance, group, or project."
    values:
      1: instance_type
      2: group_type
      3: project_type

  name:
    type: string
    source: name
    nullable: false
    description: "Human-readable runner name."

  description:
    type: string
    source: description
    nullable: false
    description: "Maintainer-provided description."

  active:
    type: boolean
    source: active
    nullable: false
    description: "Whether currently accepting jobs."

  locked:
    type: boolean
    source: locked
    nullable: false
    admin_only: true
    description: "Whether locked to its assignment."

  run_untagged:
    type: boolean
    source: run_untagged
    nullable: false
    admin_only: true
    description: "Whether it picks up untagged jobs."

  access_level:
    type: enum
    source: access_level
    nullable: false
    admin_only: true
    description: "Whether restricted to protected refs."
    values:
      0: not_protected
      1: ref_protected

  maximum_timeout:
    type: int64
    source: maximum_timeout
    nullable: true
    admin_only: true
    description: "Max job timeout in seconds."

  organization_id:
    type: int64
    source: organization_id
    nullable: true
    description: "Cell organization ID."

  registration_type:
    type: enum
    source: registration_type
    nullable: false
    mutable: false
    admin_only: true
    description: "Registration method."
    values:
      0: registration_token
      1: authenticated_user

  creation_state:
    type: enum
    source: creation_state
    nullable: false
    admin_only: true
    description: "Whether runner creation finished."
    values:
      0: started
      100: finished

  maintainer_note:
    type: string
    source: maintainer_note
    nullable: false
    admin_only: true
    description: "Maintenance note."

  creator_id:
    type: int64
    source: creator_id
    nullable: true
    mutable: false
    admin_only: true
    description: "User ID who created the runner."

  created_at:
    type: timestamp
    source: created_at
    nullable: true
    mutable: false
    description: "Registration timestamp."

  contacted_at:
    type: timestamp
    source: contacted_at
    nullable: true
    admin_only: true
    description: "Last contact timestamp."

  updated_at:
    type: timestamp
    source: updated_at
    nullable: true
    admin_only: true
    description: "Last update timestamp."

pipelines:
  - name: Runner
    extract:
      type: clickhouse
      tables: [siphon_ci_runners]
      order_by: [id, runner_type]
      query: generated
    transform:
      type: datafusion
storage:
  primary_key: [id]
  settings:
    add_minmax_index_for_temporal_columns: "1"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: runner_type, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: name, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: description, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: active, type: "Bool", default: "true"}
    - {name: locked, type: "Bool", default: "false"}
    - {name: run_untagged, type: "Bool", default: "true"}
    - {name: access_level, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: maximum_timeout, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: organization_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: created_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: contacted_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: registration_type, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: creation_state, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: maintainer_note, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: creator_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: updated_at, type: "DateTime64(0, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_runner_type, column: runner_type, type: "set(4)", granularity: 2}
    - {name: idx_name, column: name, type: text, granularity: 1}
