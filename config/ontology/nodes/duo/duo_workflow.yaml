# config/ontology/nodes/duo/duo_workflow.yaml

node_type: DuoWorkflow
domain: duo
description: A Duo Agent Platform session in a project. Existence and flow type only, never its content
label: flow_type
destination_table: gl_duo_workflow
default_columns: [id, flow_type, environment, created_at]

style:
  size: 24
  color: "#A78BFA"

# Project-delegated on purpose: the session's existence is visible to anyone with
# read_code (Reporter+) on the project, like the source-code nodes. read_duo_workflow
# is invoker-only for non-pipeline sessions and would hide that.
redaction:
  resource_type: project
  id_column: project_id
  ability: read_code

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."

  flow_type:
    type: enum
    source: flow_type
    nullable: false
    description: "Kind of flow, from the workflow definition with its version dropped (developer/v1 becomes developer). Unrecognized definitions are 'other'."
    enum_type: string
    selectivity: low
    values:
      0: software_development
      1: external_agent
      2: ai_catalog_agent
      3: claude_code_compliance_api
      4: chat
      5: agentic_chat
      6: developer
      7: code_review
      8: deep_code_review
      9: fix_pipeline
      10: convert_to_gl_ci
      11: resolve_sast_vulnerability
      12: sast_fp_detection
      13: secrets_fp_detection
      14: security_review
      15: recommend_reviewers
      16: risk_classification
      17: workplan
      18: readiness_score
      19: slack_assistant
      20: resolve_dependency_bump
      21: bl_security
      22: business_context_security_guidelines
      23: other

  environment:
    type: enum
    source: environment
    nullable: true
    description: "Surface the session ran in."
    selectivity: low
    values:
      1: ide
      2: web
      3: chat_partial
      4: chat
      5: ambient
      6: external

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID."

  namespace_id:
    type: int64
    source: namespace_id
    nullable: true
    mutable: false
    description: "Owning namespace ID, when the session also records one."

  created_at:
    type: timestamp
    source: created_at
    nullable: false
    mutable: false
    description: "Creation timestamp."

  updated_at:
    type: timestamp
    source: updated_at
    nullable: false
    description: "Last update timestamp."

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

indexer:
  reindex: [siphon_duo_workflows_workflows]
pipelines:
  - name: DuoWorkflow
    extract:
      type: clickhouse
      tables: [siphon_duo_workflows_workflows]
      order_by: [traversal_path, id]
      query: duo_workflow.sql.j2
    transform:
      type: datafusion
      edges:
        - from:
            field: id
            kind: DuoWorkflow
          to:
            field: project_id
            kind: Project
          label: IN_PROJECT

storage:
  primary_key: [traversal_path, id]
  settings:
    add_minmax_index_for_temporal_columns: "1"
    auto_statistics_types: "'minmax, uniq, countmin'"
  columns:
    - {name: id, type: "Int64", codec: ["Delta(8)", "LZ4"]}
    - {name: flow_type, type: "LowCardinality(String)", default: "'other'", codec: ["LZ4"]}
    - {name: environment, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: project_id, type: "Int64", codec: ["Delta(8)", "LZ4"]}
    - {name: namespace_id, type: "Nullable(Int64)", codec: ["Delta(8)", "LZ4"]}
    - {name: created_at, type: "Nullable(DateTime64(0, 'UTC'))", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: updated_at, type: "Nullable(DateTime64(0, 'UTC'))", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: traversal_path, type: "String", default: "'0/'", codec: ["ZSTD(1)"]}
  indexes:
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_flow_type, column: flow_type, type: "set(32)", granularity: 2}
    - {name: idx_environment, column: environment, type: "set(8)", granularity: 2}
    - {name: idx_project_id, column: project_id, type: "bloom_filter(0.0001)", granularity: 1}
