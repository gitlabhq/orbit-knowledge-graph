# config/ontology/nodes/source_code/branch.yaml

node_type: Branch
domain: source_code
description: A Git branch in a repository
label: name
destination_table: gl_branch
sort_key: [traversal_path, project_id, id]
default_columns: [id, name, is_default]

style:
  size: 28
  color: "#14B8A6"

redaction:
  resource_type: project
  id_column: project_id
  ability: read_code

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Derived ID (hash of project_id + branch name)."
    traversal_path_lookup:
      kind: id
      source_table: gl_branch
      key_column: id

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID."

  name:
    type: string
    source: name
    nullable: false
    mutable: false
    description: "Branch name (e.g., main, feature/new-login)."

  is_default:
    type: boolean
    source: is_default
    nullable: false
    description: "Whether this is the project's default branch."

  commit_sha:
    type: string
    source: commit_sha
    nullable: false
    description: "Commit SHA of the branch head that the graph indexed; compare it with the branch head to see if the graph is behind."

  indexed_at:
    type: timestamp
    source: indexed_at
    nullable: false
    description: "Time when the indexer wrote the graph for this branch."

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

storage:
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: traversal_path, type: "String", codec: ["ZSTD(1)"]}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: name, type: "String", codec: ["ZSTD(1)"]}
    - {name: is_default, type: "Bool", default: "true"}
    - {name: commit_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: indexed_at, type: "DateTime64(6, 'UTC')", default: "toDateTime64(0, 6, 'UTC')", codec: ["Delta(8)", "ZSTD(1)"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_project_id, column: project_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_name, column: name, type: text, granularity: 1}
