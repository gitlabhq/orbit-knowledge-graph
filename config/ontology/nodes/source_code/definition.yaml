# config/ontology/nodes/source_code/definition.yaml

node_type: Definition
domain: source_code
description: A code definition such as a class, function, method, or module
label: name
destination_table: gl_definition
default_columns: [id, name, fqn, definition_type, file_path, commit_sha, start_line, end_line]
sort_key: [traversal_path, project_id, branch, id]

style:
  size: 26
  color: "#2DD4BF"

redaction:
  resource_type: project
  id_column: project_id
  ability: read_code

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."
    traversal_path_lookup:
      kind: id
      source_table: gl_definition
      key_column: id

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID."

  branch:
    type: string
    source: branch
    nullable: false
    mutable: false
    description: "Git branch."

  commit_sha:
    type: string
    source: commit_sha
    nullable: false
    description: "Indexed commit SHA."

  file_path:
    type: string
    source: file_path
    nullable: false
    mutable: false
    description: "Containing file path."

  fqn:
    type: string
    source: fqn
    nullable: false
    mutable: false
    description: "Fully qualified name (e.g., MyModule::MyClass#my_method)."

  name:
    type: string
    source: name
    nullable: false
    mutable: false
    description: "Short name."

  definition_type:
    type: string
    source: definition_type
    nullable: false
    mutable: false
    description: "Definition kind (e.g., Class, Module, Method, Function, Struct, Enum, Trait, Lambda)."
    selectivity: low

  start_line:
    type: int64
    source: start_line
    nullable: false
    mutable: false
    description: "Start line."

  end_line:
    type: int64
    source: end_line
    nullable: false
    mutable: false
    description: "End line."

  start_byte:
    type: int64
    source: start_byte
    nullable: false
    mutable: false
    description: "Start byte offset."

  end_byte:
    type: int64
    source: end_byte
    nullable: false
    mutable: false
    description: "End byte offset."

  start_char:
    type: int64
    source: start_char
    nullable: false
    mutable: false
    description: "Start column."

  end_char:
    type: int64
    source: end_char
    nullable: false
    mutable: false
    description: "End column."

  front_matter_name:
    type: string
    source: front_matter_name
    nullable: false
    description: "Front matter `name` value; empty when absent or not a scalar. Set only on FrontMatter definitions."

  front_matter_description:
    type: string
    source: front_matter_description
    nullable: false
    description: "Front matter `description` value; empty when absent or not a scalar. Set only on FrontMatter definitions."

  front_matter_license:
    type: string
    source: front_matter_license
    nullable: false
    description: "Front matter `license` value; empty when absent or not a scalar. Set only on FrontMatter definitions."
    selectivity: low

  front_matter_compatibility:
    type: string
    source: front_matter_compatibility
    nullable: false
    description: "Front matter `compatibility` value; empty when absent or not a scalar. Set only on FrontMatter definitions."

  front_matter_allowed_tools:
    type: string
    source: front_matter_allowed_tools
    nullable: false
    description: "Front matter `allowed-tools` value; empty when absent or not a scalar. Set only on FrontMatter definitions."

  front_matter_metadata:
    type: string
    source: front_matter_metadata
    nullable: false
    description: "Front matter `metadata` map as compact JSON with sorted keys and scalar values; empty when absent or not a map. Set only on FrontMatter definitions."

  front_matter_title:
    type: string
    source: front_matter_title
    nullable: false
    description: "Front matter `title` value; empty when absent or not a scalar. Set only on FrontMatter definitions."

  front_matter_stage:
    type: string
    source: front_matter_stage
    nullable: false
    description: "Front matter `stage` value; empty when absent or not a scalar. Set only on FrontMatter definitions."
    selectivity: low

  front_matter_group:
    type: string
    source: front_matter_group
    nullable: false
    description: "Front matter `group` value; empty when absent or not a scalar. Set only on FrontMatter definitions."
    selectivity: low

  front_matter_info:
    type: string
    source: front_matter_info
    nullable: false
    description: "Front matter `info` value; empty when absent or not a scalar. Set only on FrontMatter definitions."
    selectivity: low

  front_matter_version:
    type: string
    source: front_matter_version
    nullable: false
    description: "Front matter `version` value; empty when absent or not a scalar. Set only on FrontMatter definitions."
    selectivity: low

  front_matter_category:
    type: string
    source: front_matter_category
    nullable: false
    description: "Front matter `category` value; empty when absent or not a scalar. Set only on FrontMatter definitions."
    selectivity: low

  content:
    type: string
    virtual:
      service: gitaly
      lookup: blob_content
      depends_on: [project_id, commit_sha, branch, file_path, start_byte, end_byte]
    nullable: true
    description: "Source text, resolved from Gitaly via start_byte/end_byte."

storage:
  settings:
    index_granularity: "1024"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: traversal_path, type: "String", codec: ["ZSTD(1)"]}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: branch, type: "String", codec: ["ZSTD(1)"]}
    - {name: commit_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: file_path, type: "String", codec: ["ZSTD(9)"]}
    - {name: fqn, type: "String", codec: ["ZSTD(9)"]}
    - {name: name, type: "String", codec: ["ZSTD(9)"]}
    - {name: definition_type, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: start_line, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: end_line, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: start_byte, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: end_byte, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: start_char, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: end_char, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: front_matter_name, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: front_matter_description, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: front_matter_license, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: front_matter_compatibility, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: front_matter_allowed_tools, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: front_matter_metadata, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: front_matter_title, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: front_matter_stage, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: front_matter_group, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: front_matter_info, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: front_matter_version, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: front_matter_category, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_project_id, column: project_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_name, column: name, type: text, granularity: 1}
    - {name: idx_fqn, column: fqn, type: text, granularity: 1}
    - {name: idx_file_path, column: file_path, type: text, granularity: 1}
    - {name: idx_definition_type, column: definition_type, type: "set(20)", granularity: 2}
