node_type: Import
domain: source_code
description: One imported name in one file, such as import numpy as np
label: name
destination_table: gl_import
default_columns: [id, name, alias, import_kind, import_path, fqn, is_external, branch, file_path, start_line]
sort_key: [traversal_path, project_id, branch, id]

style:
  size: 22
  color: "#5EEAD4"

redaction:
  resource_type: project
  id_column: project_id
  ability: read_code

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."
    traversal_path_lookup:
      kind: id
      source_table: gl_import
      key_column: id

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    hidden: true
    nullable: false
    description: "Namespace path for authz."

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID."

  branch:
    type: string
    source: branch
    nullable: false
    mutable: false
    description: "Git branch."

  commit_sha:
    type: string
    source: commit_sha
    nullable: false
    description: "Indexed commit SHA."

  file_path:
    type: string
    source: file_path
    nullable: false
    mutable: false
    description: "Path of the file that holds the import."

  import_kind:
    type: enum
    enum_type: string
    source: import_kind
    nullable: false
    mutable: false
    description: "What the import brings in: one symbol, a whole module, a wildcard, or only side effects."
    values:
      0: symbol
      1: module
      2: wildcard
      3: side_effect

  language_kind:
    type: enum
    enum_type: string
    source: language_kind
    nullable: false
    mutable: false
    description: "The import construct as the language writes it, such as CjsRequire or StaticImport."
    values:
      0: Alias
      1: AliasedExternCrate
      2: AliasedImport
      3: AliasedUse
      4: ArgoCdSource
      5: Autoload
      6: CiComponentInclude
      7: CiLocalInclude
      8: CiProjectInclude
      9: CiRemoteInclude
      10: CiTemplateInclude
      11: CjsRequire
      12: DefaultImport
      13: Extend
      14: ExternCrate
      15: FromImport
      16: FutureImport
      17: GlobUse
      18: GroupedImport
      19: HelmChartDependency
      20: Import
      21: Include
      22: ModDeclaration
      23: Module
      24: NamedImport
      25: NamespaceImport
      26: Prepend
      27: PubUse
      28: PubUseGroup
      29: ReExport
      30: ReExportAliased
      31: ReExportGlob
      32: Require
      33: RequireRelative
      34: SideEffectImport
      35: Source
      36: StaticImport
      37: Use
      38: UseGroup
      39: WildcardImport

  import_path:
    type: string
    source: import_path
    nullable: false
    mutable: false
    description: "Module or path as written, such as numpy or ./utils."

  name:
    type: string
    source: name
    nullable: false
    mutable: false
    description: "Imported name, such as get in from requests import get."

  alias:
    type: string
    source: alias
    nullable: false
    mutable: false
    description: "Local alias of the import, such as np in import numpy as np; empty when there is none."

  fqn:
    type: string
    source: fqn
    nullable: true
    mutable: false
    description: "Full name of the imported target, such as requests.get; null when the engine cannot tell."

  is_external:
    type: boolean
    source: is_external
    nullable: false
    mutable: false
    description: "True when the import resolves to nothing in the index, such as a third-party library."

  start_line:
    type: int64
    source: start_line
    nullable: false
    mutable: false
    description: "Start line."

  end_line:
    type: int64
    source: end_line
    nullable: false
    mutable: false
    description: "End line."

  start_byte:
    type: int64
    source: start_byte
    nullable: false
    mutable: false
    description: "Start byte offset."

  end_byte:
    type: int64
    source: end_byte
    nullable: false
    mutable: false
    description: "End byte offset."

  start_char:
    type: int64
    source: start_char
    nullable: false
    mutable: false
    description: "Start column."

  end_char:
    type: int64
    source: end_char
    nullable: false
    mutable: false
    description: "End column."

storage:
  settings:
    index_granularity: "1024"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: traversal_path, type: "String", codec: ["ZSTD(1)"]}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: branch, type: "String", codec: ["ZSTD(1)"]}
    - {name: commit_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: file_path, type: "String", codec: ["ZSTD(9)"]}
    - {name: import_kind, type: "LowCardinality(String)", default: "''", codec: ["LZ4"]}
    - {name: language_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: import_path, type: "String", codec: ["ZSTD(9)"]}
    - {name: name, type: "String", default: "''", codec: ["ZSTD(9)"]}
    - {name: alias, type: "String", default: "''", codec: ["ZSTD(9)"]}
    - {name: fqn, type: "Nullable(String)", codec: ["ZSTD(9)"]}
    - {name: is_external, type: "Bool", default: "false"}
    - {name: start_line, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: end_line, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: start_byte, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: end_byte, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: start_char, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: end_char, type: "Int64", codec: ["T64", "ZSTD(1)"]}
  indexes:
    - {name: idx_deleted, column: _deleted, type: "minmax", granularity: 1}
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_project_id, column: project_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_name, column: name, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_fqn, column: fqn, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_file_path, column: file_path, type: text, granularity: 1}
    - {name: idx_import_path, column: import_path, type: text, granularity: 1}
    - {name: idx_import_kind, column: import_kind, type: "set(8)", granularity: 2}
    - {name: idx_language_kind, column: language_kind, type: "set(64)", granularity: 2}
