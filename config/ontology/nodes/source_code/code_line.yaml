# config/ontology/nodes/source_code/code_line.yaml

node_type: CodeLine
domain: source_code
description: A single physical line of source text within a file
label: content
destination_table: gl_code_line
default_columns: [id, path, line_number, content]
# Must match the shared stale-cleaner tombstone projection
# (traversal_path, project_id, branch, id) or tombstones never dedup against
# the live rows. `id` is stable across re-indexes, so a given line is replaced
# rather than duplicated.
sort_key: [traversal_path, project_id, branch, id]

style:
  size: 16
  color: "#94A3B8"

redaction:
  resource_type: project
  id_column: project_id
  ability: read_code

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Synthetic id: FxHash of (project_id, branch, path, line_number). Excludes commit_sha so a re-index replaces the line instead of appending a new row."

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    nullable: false
    description: "Namespace path for authz."

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID."

  branch:
    type: string
    source: branch
    nullable: false
    mutable: false
    description: "Git branch."

  commit_sha:
    type: string
    source: commit_sha
    nullable: false
    mutable: false
    description: "Indexed commit SHA."

  path:
    type: string
    source: path
    nullable: false
    mutable: false
    description: "Relative path of the containing file within the repository."

  line_number:
    type: int64
    source: line_number
    nullable: false
    mutable: false
    description: "1-based physical line number within the file."

  content:
    type: string
    source: content
    nullable: false
    mutable: false
    description: "Raw text of the line, without its trailing newline."

storage:
  settings:
    index_granularity: "8192"
    auto_statistics_types: "'minmax, uniq, countmin'"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: traversal_path, type: "String", codec: ["ZSTD(1)"]}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: branch, type: "String", codec: ["ZSTD(1)"]}
    - {name: commit_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: path, type: "String", codec: ["ZSTD(3)"]}
    - {name: line_number, type: "Int64", default: "0", codec: ["Delta(8)", "ZSTD(1)"]}
    - {name: content, type: "String", default: "''", codec: ["ZSTD(3)"]}
  indexes:
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_project_id, column: project_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_path, column: path, type: "text(tokenizer = splitByString(['/']))", granularity: 1}
    - {name: idx_content, column: content, type: "text(tokenizer = splitByNonAlpha)", granularity: 1}
