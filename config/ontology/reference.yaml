node_type: User
domain: core
description: A GitLab user account
destination_table: users

properties:
  id:
    type: int64
    source: id
    nullable: false

  username:
    type: string
    source: username
    nullable: false

  email:
    type: string
    source: email
    nullable: false

  is_admin:
    type: boolean
    source: admin
    nullable: false

  user_type:
    type: enum
    source: user_type
    nullable: false
    values: 
      0: human
      1: support_bot
      2: alert_bot
      8: automation_bot

edges:
  - type: OWNER
    source_id: owner_id
    target_kind: User

  - type: CONTAINS
    source: parent_id
    target_kind: Group

etl:
  query: |
    SELECT * FROM notes where noteable_type = 'MergeRequest'

