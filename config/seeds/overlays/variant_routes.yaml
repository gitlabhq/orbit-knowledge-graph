- file: gitlab/graph.yaml
  find: |4
          description: Call relationships in source code representing function/method invocations
  replace: |4
          description: Calls with variant storage routes
- file: gitlab/authorization.yaml
  find: |4
        CALLS: same_namespace
  replace: |4
        CALLS: {variants: {Definition -> Definition: same_namespace, File -> Definition: same_namespace}}
- file: gitlab/storage/clickhouse.yaml
  find: |2
      CALLS:
        Definition -> Definition: {edge_table: gl_code_edge, copies: {project_id: [source.project_id, target.project_id], branch: [source.branch, target.branch]}}
        File -> Definition: {edge_table: gl_code_edge, copies: {project_id: [source.project_id, target.project_id], branch: [source.branch, target.branch]}}
        Definition -> ImportedSymbol: {edge_table: gl_code_edge, copies: {project_id: [source.project_id, target.project_id], branch: [source.branch, target.branch]}}
        File -> ImportedSymbol: {edge_table: gl_code_edge, copies: {project_id: [source.project_id, target.project_id], branch: [source.branch, target.branch]}}
  replace: |2
      CALLS:
        Definition -> Definition: {edge_table: gl_code_edge, copies: {project_id: [source.project_id, target.project_id], branch: [source.branch, target.branch]}}
        File -> Definition: {edge_table: gl_edge}
        Definition -> ImportedSymbol: {edge_table: gl_code_edge, copies: {project_id: [source.project_id, target.project_id], branch: [source.branch, target.branch]}}
        File -> ImportedSymbol: {edge_table: gl_edge}
