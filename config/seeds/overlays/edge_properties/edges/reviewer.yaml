table: gl_prop_edge
properties:
  state:
    type: enum
    source: state
    nullable: false
    description: "Review state of the reviewer on the merge request."
    values:
      0: unreviewed
      1: reviewed
      2: requested_changes
      3: approved
      4: unapproved
      5: review_started
  created_at:
    type: datetime
    source: created_at
    nullable: false
    description: "When the reviewer was requested."
  project_id:
    type: int
    source: project_id
    nullable: false
    description: "Project of the merge request, a name that gl_code_edge also uses as a base column."
  review_note:
    type: string
    source: review_note
    nullable: true
    description: "Free text the reviewer left, when any."
