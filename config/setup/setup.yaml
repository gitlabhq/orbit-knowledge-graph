# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  - Find related symbols together: `{{orbit}} grep 'a|b|c'`. Auto-indexed. FTS: terms AND; `a|b` OR. Narrow with --path/--kind.
  - Need callers/callees too? Add `--connections` to grep.
  - `{{orbit}} context Definition:123` returns source and callers/callees. Batch IDs or paths in one call.
  - Chain independent lookups. Inspect relevant code, tests, and helpers together.
  - Reuse shown source; search again only for a specific missing fact.

nudge_search: |
  Batch related names in `{{orbit}} grep 'a|b|c'`; add --connections for callers/callees. Reuse results instead of repeating discovery.
nudge_read: |
  Start with Orbit to locate relevant code and relationships: `{{orbit}} grep 'words'` or `{{orbit}} context path`. Then inspect only files/ranges it identifies. Reuse source already shown.
graph_first_deny: |
  Blocked once: query Orbit directly; no index step. Use `{{orbit}} grep 'words'` to locate code or `{{orbit}} context path` for relationships/maps. Then inspect only files/ranges Orbit identifies.
template_vars:
  reminder: "[orbit] Batch related names: run {{orbit}} grep 'a|b|c'; add --connections for callers/callees. Reuse results instead of repeating discovery."
