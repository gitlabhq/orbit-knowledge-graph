# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  Use Orbit first for code.

  - Find: `{{orbit}} grep "<concept>"`. Start unfiltered with 1-3 identifier words. Miss: try a source identifier. Broad: add `--path <glob>` or `--kind Class,Method`.
  - Read: use `{{orbit}} context Definition:<id>` from grep. File: `{{orbit}} context <path>`. Add `--outline` for signatures/members.
  - Relationships: `{{orbit}} context Definition:<id> --related`; add `--tests` to show test connections.
  - Graph matches guide investigation; they don't prove dataflow or absence. Verify source. Answer mechanism + `file:line`; skip search narration.

nudge_search: |
  For code discovery, run `{{orbit}} grep "<terms>"` with 1-3 identifier keywords, without filters first.
nudge_read: |
  Read a grep result with `{{orbit}} context Definition:<id>`, or a file with `{{orbit}} context <path>`. Find unknown code with `{{orbit}} grep "<terms>"`.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
