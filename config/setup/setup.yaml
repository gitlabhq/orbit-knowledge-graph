# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  Use Orbit first for code.

  - Find: `{{orbit}} grep "<concept>"`. Start unfiltered with 1-3 identifier words. Miss: retry once with a source identifier. Broad: add `--path <glob>` or `--kind Class,Method`.
  - Read code: `{{orbit}} context Definition:<id>` or `{{orbit}} context <path>`. Use `--outline` for signatures.
  - Definition context includes relationships; `--tests` shows hidden test connections.
  - Edit context output; never truncate it. Raw Read or shell reads: non-code or unavailable Orbit source only.
  - Answers from graph cite mechanism + `file:line`; skip search narration.

nudge_search: |
  Run `{{orbit}} grep "<terms>"` first. Read discovered code with `{{orbit}} context <path>`; raw Read or shell reads are only for non-code or unavailable Orbit source.
nudge_read: |
  Read code with `{{orbit}} context Definition:<id>` or `{{orbit}} context <path>`. Built-in Read and shell reads are only for non-code or unavailable Orbit source.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
