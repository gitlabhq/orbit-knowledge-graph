# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  Use `{{orbit}} grep` instead of grep or rg for every search. It covers code, tests, config, and docs, and shows the top match's source.

  - Unknown code? `{{orbit}} grep 'words'`. FTS. Terms AND; `a|b` OR. Too broad? Add `--path`/`--kind`.
  - Output: matching definitions, Mentions (every other matching line), then the top match's source. Source? `{{orbit}} context path:120-180`. Callers/callees? `{{orbit}} context <name>`.
  - Need file map? `{{orbit}} context path`. Directory? `{{orbit}} context dir`.
  - Do not reread unchanged files. Reuse shown source.

nudge_search: |
  Grep means `{{orbit}} grep 'words'`. FTS. Terms AND; `a|b` OR. Add --path/--kind.
nudge_read: |
  Do not reread unchanged files. Reuse shown source. Callers/callees? `{{orbit}} context <name>`.
template_vars:
  reminder: "[orbit] Grep means run {{orbit}} grep 'words'. FTS."
