# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  Use Orbit for code navigation to discover vital codebase context and make edits faster.

  - Find relevant code: `{{orbit}} grep "<concepts or identifiers>"`. Use returned names/paths to narrow.
  - Explore context: `{{orbit}} context <targets...>`. Only know the file? Get the map with context and batch context relevant Definition IDs. Already know IDs? Get source.
  - Definition context returns full source and indexed connections. File context returns a definition map and indexed connections, without bodies. Follow IDs for more.
  - Too broad? Narrow with `--path`/`--kind` or smaller context targets. Never truncate Orbit output with head. Miss? Retry once with identifiers.

nudge_search: |
  Find code with `{{orbit}} grep "<words>"`; reuse returned source. Only know the file? `{{orbit}} context <path>` gives a map. Batch needed Definition IDs in context for source and connections. Raw reads only for non-code or unavailable Orbit source. Never truncate Orbit output.
nudge_read: |
  Reuse returned source. Only know the file? `{{orbit}} context <path>` gives its map. Batch needed Definition IDs in context for source and connections. Raw reads only for non-code or unavailable Orbit source. Never truncate Orbit output.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
