# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# hook guard texts, and the MCP server entry.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  Prefer `{{orbit}}` commands to bash tools for file/code search and callers/callees. Grep means `{{orbit}} grep`.

  - Unknown code? `{{orbit}} grep 'words'`. FTS. Terms AND; `a|b` OR.
  - grep shows IDs and file:lines. Source? `{{orbit}} context path:120-180`. Callers/callees? `{{orbit}} context Definition:123`.
  - Do not reread unchanged files. Reuse shown source.
  - Need file map? `{{orbit}} context path`. Directory? `{{orbit}} context dir`.
  - Too broad? Add `--path`/`--kind`.

nudge_search: |
  Grep means `{{orbit}} grep 'words'`. FTS. Terms AND; `a|b` OR. Add --path/--kind.
nudge_read: |
  Do not reread unchanged files. Reuse shown source. Callers/callees? `{{orbit}} context Definition:123`.
graph_first_deny: |
  Blocked once: this session has not used Orbit yet. Run `{{orbit}} grep 'words'` first; it matches symbol names and file paths (FTS; terms AND, `a|b` OR; add --path/--kind).
session_start: |
  Orbit indexes this repository. Grep means `{{orbit}} grep 'words'`. Callers/callees? `{{orbit}} context Definition:123`.
graph_first_session: |
  Orbit indexes this repository. Start every code search with `{{orbit}} grep 'words'`, before grep, find, or reading source. Callers/callees? `{{orbit}} context Definition:123`.
