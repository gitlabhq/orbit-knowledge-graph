# yaml-language-server: $schema=../schemas/setup.schema.json
instructions: |
  ## Orbit

  - MANDATORY: `{{orbit}} grep` must be used for search instead of grep and rg. Ignores case, `_`, `-`; `a|b` OR; narrow with paths, `def:words`, or `file:x`.{{remote_grep}}
  - MANDATORY: `{{orbit}} context` must be used for reading code instead of reading files. Batch all reads and searches you can name, code with tests: `{{orbit}} context a.rs:10-40 a_test.rs:5-60 Name; {{orbit}} grep 'x'`. Names show connections. Edit straight from its output; no separate read is needed.{{remote_gitlab}}{{remote_query}}{{server_entities}}

remote:
  remote_grep: " Prefix a GitLab kind to search GitLab: {{gitlab_kinds}}."
  remote_gitlab: "\n- MANDATORY: `{{orbit}}` must be used for reading GitLab instead of glab and glab api; writes stay with glab. `{{orbit}} context mr:42 job:9` reads GitLab; bare `{{orbit}} context` reads the branch's MR and CI failures, and `repo:group/project symbol:Name` a sibling project."
  remote_query: "\n- MANDATORY: `{{orbit}} query` must be used for counts, rankings, and relationships across GitLab. {{query_syntax}}"
server_entities: "\n\nConnected providers and their entities, for `{{orbit}} query`:\n{{entities}}"

nudge_gitlab: |
  MANDATORY: `{{orbit}}` must be used for reading GitLab instead of glab; writes stay with glab. `{{orbit}} grep` is local-only; GitLab entities: {{gitlab_kinds}}. `{{orbit}} context mr:42 issue:7 branch:x pipeline:9 job:9` reads them; bare `{{orbit}} context` reads the current branch's MR and CI; `{{orbit}} context repo:group/project symbol:Name file:path` reads a sibling project's code.
nudge_search: |
  MANDATORY: `{{orbit}} grep` must be used for search instead of grep and rg. Ignores case, `_`, `-`; `a|b` OR. Narrow with paths, as with rg, or `def:words`/`file:x`.
template_vars:
  reminder: "[orbit] Grep means run {{orbit}} grep 'words'. rg output plus enclosing definitions."
