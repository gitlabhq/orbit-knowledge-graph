# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  Prefer Orbit over raw file tools for discovering and inspecting repository code.

  - Find definitions with `{{orbit}} grep "<terms>"` without filters. Search one concept per query; multiword identifiers are fine. Results list `fqn`, `kind`, and `loc`.
  - Inspect a known definition with `{{orbit}} context "<fqn>"`, or a known code file with `{{orbit}} context --file <path>`. Do not search first when you already know the target. File context includes imports and surrounding structure.
  - Use the returned source for investigation and edits. If Orbit already supplied the needed source, do not retrieve it again with `read`, `cat`, `head`, or `sed`.
  - Use `read` for non-code files, unavailable index coverage, or when Orbit cannot reliably return current working-tree source. Use `rg` for literal-text searches that definition search does not support.
  - Start implementing as soon as the edit point and nearby pattern are clear. Follow another identifier only to answer a remaining question; batch independent lookups.
  - For weak or unmatched terms, try the code's identifier (e.g. "throttle" → "rateLimit"). For too many hits, narrow with `--path <dir-or-glob>` (repeatable) or `--kind Class,Method` (one comma-separated list).
  - Trace relationships with `{{orbit}} grep "<fqn>" --callers`, `--callees`, or `--related-to`. With `--related-to`, use `--in`/`--out` for direction and `--edge calls|extends|imports` for edge kind. `--path`/`--kind` filter connected results; `--tests` expands test connections otherwise shown as counts.
  - `grep` offers a copyable context command for up to three candidates when bodies are not already shown. `grep --body` includes up to three bodies. `context` accepts multiple FQNs; `--outline` prints signatures and members only. Name/path matches do not establish a code connection or dataflow.
  - Answers directly from the graph should name the mechanism and cite `file:line`. Skip question restatements and search narration.

nudge_search: |
  Prefer `{{orbit}} grep "<terms>"` for definition searches. Inspect known targets directly with `{{orbit}} context "<fqn>"` or `{{orbit}} context --file <path>`. Use `rg` for literal-text searches that definition search does not support.
nudge_read: |
  Prefer `{{orbit}} context "<fqn>"` or `{{orbit}} context --file <path>` for repository code. Do not search first for a known target or retrieve source Orbit already supplied. Use `read` for non-code files, unavailable index coverage, or when Orbit cannot reliably return current working-tree source.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
