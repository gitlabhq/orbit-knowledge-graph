# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  Use Orbit first for code.

  - Find: `{{orbit}} grep "<concept>"`. Start unfiltered with 1-3 identifier words. Miss: retry once with a source identifier. Broad: add `--path <glob>` or `--kind Class,Method`.
  - Read: use `{{orbit}} context Definition:<id>` from grep. File: `{{orbit}} context <path>`. Use `--outline` for signatures. If raw search finds a file, return to context.
  - Relationships: `{{orbit}} context Definition:<id> --related`; add `--tests` to show test connections.
  - Edit from context output. Never `cat`/`head`/`sed` source or truncate Orbit output.
  - Answers from graph cite mechanism + `file:line`; skip search narration.

nudge_search: |
  Run `{{orbit}} grep "<terms>"` first. If raw search finds a file, read it with `{{orbit}} context <path>`, never `cat`, `head`, or `sed`.
nudge_read: |
  Read source with `{{orbit}} context Definition:<id>` or `{{orbit}} context <path>`, never `cat`, `head`, or `sed`. Find unknown code with `{{orbit}} grep "<terms>"`.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
