# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  The Orbit knowledge graph is available for discovering entities or tracing relationships.

  - Before starting any task related to this codebase, run `{{orbit}} grep "<terms>"` without filters. Use 1-3 identifier keywords (e.g. `"activateExtension"`, `"shard allocation decider"`). Results list `fqn`, `kind`, and `loc`.
  - For weak or unmatched terms, try the code's identifier (e.g. "throttle" → "rateLimit"). For too many hits, narrow with `--path <dir-or-glob>` (repeatable) or `--kind Class,Method` (one comma-separated list).
  - Trace relationships with `{{orbit}} grep "<fqn>" --callers`, `--callees`, or `--related-to`. With `--related-to`, use `--in`/`--out` for direction and `--edge calls|extends|imports` for edge kind. `--path`/`--kind` filter connected results; `--tests` expands test connections otherwise shown as counts.
  - Read bodies with `{{orbit}} context "<fqn>" ["<fqn>"...]` or `{{orbit}} context --file <path>` for all definitions in a file. Add `--outline` to either for signatures and members only. `grep ... --body` includes the top match's body.
  - Answers directly from the graph should name the mechanism and cite `file:line`. Skip question restatements and search narration.

nudge_search: |
  For code discovery, run `{{orbit}} grep "<terms>"` with 1-3 identifier keywords, without filters first.
nudge_read: |
  For code investigation, read known definitions with `{{orbit}} context "<fqn>" ["<fqn>"...]` or `{{orbit}} context --file <path>`. Find unknown symbols with `{{orbit}} grep "<terms>"`.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
