# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  Prefer Orbit for code search and callers/callees.

  - Find code: `{{orbit}} grep 'words'`. FTS, not regex. Terms AND; `a|b` OR. No `\b`, `.*`, or anchors.
  - File known? Read needed lines.
  - Source shown? Reuse it. Read missing lines or what Edit needs.
  - Need source + callers/callees? `{{orbit}} context Definition:123`. Use returned IDs. Batch them.
  - Need file map? `{{orbit}} context path`. No source bodies.
  - Too broad? Scope grep with `--path`/`--kind`. No `head`/`tail`; they cut source.

nudge_search: |
  Prefer `{{orbit}} grep 'words'` for code search. FTS, not regex. Terms AND; `a|b` OR. Scope with --path/--kind. No head/tail.
nudge_read: |
  Read needed lines. Reuse shown source. Need callers/callees? Prefer `{{orbit}} context Definition:123`. Use returned IDs. Batch them. No head/tail.
template_vars:
  reminder: "[orbit] Unknown code? run {{orbit}} grep 'words'. FTS, not regex."
