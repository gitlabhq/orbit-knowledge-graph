# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  Use Orbit for code.

  - Find: `{{orbit}} grep "<words>"`. Searches definition names/paths/bodies. Narrow with `--path <glob>` or `--kind Class,Method`; retry misses once with identifiers.
  - Reuse returned source. Edit when enough.
  - Need more? `{{orbit}} context <path> Definition:<id> [TARGET...]` accepts any mix of files and IDs. Batch known targets; skip grep. Quote paths with spaces.
  - Context returns complete requested source once, even for large files. Grep bounds inline source and links omitted bodies.
  - Definition context includes bounded indexed relationships and a small test sample; follow returned IDs. `--tests` expands the sample. Missing links do not prove no callers or tests exist.
  - Raw Read/shell reads only for non-code or unavailable Orbit source. Never truncate Orbit output.

nudge_search: |
  Known targets? Batch paths and Definition IDs in `{{orbit}} context <TARGET...>` for complete source. Otherwise `{{orbit}} grep "<words>"` searches definition names/paths/bodies. Reuse returned source; edit when enough.
nudge_read: |
  Reuse source already returned. Missing code? Batch paths and Definition IDs in `{{orbit}} context <TARGET...>` for complete source. Raw Read/shell reads only for non-code or unavailable Orbit source.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
