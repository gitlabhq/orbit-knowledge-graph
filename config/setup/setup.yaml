# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  Prefer Orbit for code search and callers/callees. Grep means `{{orbit}} grep`.

  - Unknown code? `{{orbit}} grep 'words'`. FTS, not regex. Terms AND; `a|b` OR.
  - grep shows IDs and file:lines. Source? `{{orbit}} context path:120-180`. Callers/callees? `{{orbit}} context Definition:123`.
  - Do not reread unchanged files. Reuse shown source.
  - Need file map? `{{orbit}} context path`. Directory? `{{orbit}} context dir`.
  - Too broad? Add `--path`/`--kind`.

nudge_search: |
  Grep means `{{orbit}} grep 'words'`. FTS, not regex. Terms AND; `a|b` OR. Add --path/--kind.
nudge_read: |
  Do not reread unchanged files. Reuse shown source. Callers/callees? `{{orbit}} context Definition:123`.
template_vars:
  reminder: "[orbit] Grep means run {{orbit}} grep 'words'. FTS, not regex."
