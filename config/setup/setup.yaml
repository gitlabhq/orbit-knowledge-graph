# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare. `remote` fills `{{name}}` placeholders in `instructions` when
# Orbit can reach GitLab at setup time, and they render empty otherwise.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  - MANDATORY: `{{orbit}} grep` must be used for search instead of grep and rg. Ignores case, `_`, `-`; `a|b` OR. Narrow with paths, as with rg, or `is:def`/`file:x`.{{remote_gitlab}}
  - `{{orbit}} context path:120-180` can be used for reading line ranges. `{{orbit}} context <name>` must be used for getting useful connections.
  - MANDATORY: read all the code definitions you need in one call{{remote_context}}, plus independent searches: `{{orbit}} context a.rs:10-40{{remote_context_example}}; {{orbit}} grep 'x'`. Then follow new leads.
  - Reuse shown source instead of rereading unchanged files.

remote:
  remote_gitlab: "\n- MANDATORY: `{{orbit}}` must be used for GitLab instead of glab: `{{orbit}} grep 'is:mr words'` (or `is:issue`, `is:branch`, `is:commit`) finds, `{{orbit}} context mr:42 branch:x pipeline:9` reads."
  remote_context: ""
  remote_context_example: " mr:42"

nudge_gitlab: |
  MANDATORY: `{{orbit}}` must be used for GitLab instead of glab. `{{orbit}} grep 'is:mr words'` finds MRs, also `is:issue`, `is:branch`, `is:commit`, `is:comment`. `{{orbit}} context mr:42 issue:7 branch:x pipeline:9 job:9` reads them; bare `{{orbit}} context` reads the current branch's MR and CI.
nudge_search: |
  MANDATORY: `{{orbit}} grep` must be used for search instead of grep and rg. Ignores case, `_`, `-`; `a|b` OR. Narrow with paths, as with rg, or `is:def`/`file:x`.
template_vars:
  reminder: "[orbit] Grep means run {{orbit}} grep 'words'. rg output plus enclosing definitions."
