# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  - `{{orbit}} grep` must be used for search instead of bash tools like grep, rg, find, and ls. Ignores case, `_`, `-`; `a|b` OR. Narrow with `--path`/`--kind`.
  - `{{orbit}} context path:120-180` must be used for reading line ranges. `{{orbit}} context <name>` must be used for getting useful connections.
  - Reuse shown source instead of rereading unchanged files.

nudge_search: |
  Grep means `{{orbit}} grep 'words'`. Every matching line, one row per file. `a|b` OR. Add --path/--kind.
nudge_read: |
  Do not reread unchanged files. Reuse shown source. Callers/callees? `{{orbit}} context <name>`.
template_vars:
  reminder: "[orbit] Grep means run {{orbit}} grep 'words'. Every matching line, one row per file."
