# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  Use Orbit for code.

  - Find relevant code for discovery and edits: `{{orbit}} grep "<concepts or identifiers>"`. Use returned names/paths to narrow.
  - Read or explore known files and Definition IDs: `{{orbit}} context <targets...>`. Batch only needed targets.
  - Enough source? Edit. Reuse returned source; don't reread it.
  - Definition context includes indexed caller/callee links + test samples. Follow IDs for more; `--tests` expands samples.
  - Too broad? Narrow with `--path`/`--kind` or smaller context targets. Never truncate. Miss? Retry once with identifiers.

nudge_search: |
  Known targets? Batch paths and Definition IDs in `{{orbit}} context <TARGET...>` for complete source. Otherwise `{{orbit}} grep "<words>"` searches definition names/paths/bodies. Reuse returned source; edit when enough.
nudge_read: |
  Reuse source already returned. Missing code? Batch paths and Definition IDs in `{{orbit}} context <TARGET...>` for complete source. Raw Read/shell reads only for non-code or unavailable Orbit source.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
