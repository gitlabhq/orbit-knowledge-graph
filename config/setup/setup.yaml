# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  Orbit is a graph of the code's definitions and relationships. Query it before shell grep or reading files.

  - Find: `{{orbit}} grep "<1-3 identifier keywords>"`. On a miss, retry with the code's own name. On too many hits, add `--path <glob>` or `--kind Class,Method`.
  - Trace: `{{orbit}} grep "<fqn>" --callers`, `--callees`, or `--related-to`.
  - Read: `{{orbit}} context "<fqn>"` or `{{orbit}} context --file <path>`. Add `--outline` for signatures only.
  - Name the mechanism and cite `file:line`. Skip restating the question or narrating the search.

nudge_search: |
  For code discovery, run `{{orbit}} grep "<terms>"` with 1-3 identifier keywords, without filters first.
nudge_read: |
  Read known definitions with `{{orbit}} context "<fqn>"` or `{{orbit}} context --file <path>`. Find unknown ones with `{{orbit}} grep "<terms>"`.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
