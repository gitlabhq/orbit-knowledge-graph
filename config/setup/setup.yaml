# yaml-language-server: $schema=../schemas/setup.schema.json
instructions: |
  ## Orbit

  Orbit first for code.
  `{{orbit}} grep "<one concept>"`: start unfiltered; retry misses with source identifiers; narrow with `--path <dir-or-glob>` or `--kind Class,Method`.
  `{{orbit}} context "<fqn>"`: bodies/test helpers; `--file <path>` alone: definitions/imports; `--repo <path>`: elsewhere.
  `{{orbit}} context "<fqn>" --related`: connections; incoming `<--` + `calls`: callers; `--tests`: hidden tests.

  Edit returned verbatim source, stripping `NN|`. No whole-file rereads for edits.
  Never truncate output; grep budgets itself. Narrow targets; follow supplied context commands.
  Raw tools: literal searches, non-code, missing/unreliable Orbit source only.
  Names aren't dataflow; absent edges prove nothing. Verify source. Answer mechanism + `file:line`, without narration.

nudge_search: |
  Find: `{{orbit}} grep "<terms>"`. Callers: `{{orbit}} context "<fqn>" --related`. Text matches are not calls. No `head`.
nudge_usage: |
  Callers/connections: `{{orbit}} context "{{term}}" --related`. Definition: `{{orbit}} grep "{{term}}"`.
nudge_in_file: |
  File definitions/imports: `{{orbit}} context --file={{path}}`. Find: `{{orbit}} grep "{{term}}" --path {{path}}`. Reuse returned source.
nudge_read: |
  File definitions/imports: `{{orbit}} context --file <path>`. Body/helper: `{{orbit}} context "<fqn>"`. Strip `NN|`; edit. No whole-file rereads or `head`. Raw reads only for non-code or missing/unreliable Orbit source.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
