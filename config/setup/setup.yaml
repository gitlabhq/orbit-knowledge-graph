# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  Use Orbit for code navigation to discover vital codebase context and make edits faster.

  - Explore code / find code to edit: `{{orbit}} grep "<words>"`. Multiple possible names? `{{orbit}} grep 'x|y|z'`. Exact names get source first. Prefer `{{orbit}} grep` to grep.
  - Explore context: `{{orbit}} context <targets...>`. Only know the file? Get map with context, batch context relevant Definition IDs. Known IDs? Get source.
  - Definition context returns full source and indexed connections. File context returns a definition map and indexed connections, without bodies. Follow IDs for more.
  - Too broad? Narrow with `--path`/`--kind` or smaller context targets. Orbit output is bounded; never pipe it through `head` or `tail`. Use the printed `next:` context command. Miss? Retry with identifiers.

nudge_search: |
  Find code: `{{orbit}} grep "<words>"`. Any name: `{{orbit}} grep 'x|y|z'`, one list. Reuse source. File known? `{{orbit}} context <path>` gives map. Output is bounded: never pipe through head/tail. Use printed next context command.
nudge_read: |
  Reuse returned source. Only know the file? `{{orbit}} context <path>` gives its map. Batch needed Definition IDs in context for source and connections. Output is bounded: never pipe through head/tail.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
