# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  Prefer Orbit for discovering, inspecting, and before editing repository code in any checkout instead of raw Bash.

  - Find definitions with `{{orbit}} grep "<terms>"` without filters. Search one concept per query; multiword identifiers are fine. Results list `fqn`, `kind`, and `loc`.
  - `{{orbit}} context` is the best way to read code. `{{orbit}} context --file <path>` prints a file overview with imports and definition signatures instead of every line; `{{orbit}} context "<fqn>"` prints full bodies. Use these instead of `cat`, `head`, `sed -n`, or the Read tool for code. Pass `--repo <path>` when inspecting another repository.
  - For weak or unmatched terms, try the code's identifier (e.g. "throttle" → "rateLimit"). For too many hits, narrow with `--path <dir-or-glob>` (repeatable) or `--kind Class,Method` (one comma-separated list).
  - Trace relationships with `{{orbit}} context "<fqn>" --related`. Lines show direction (`<--` incoming, `-->` outgoing) and edge kind, so callers are incoming `calls`. `--tests` expands test connections otherwise shown as counts.
  - `grep` includes source for three or fewer matches; broader results include a copyable `context` command. Name/path matches do not prove a code relationship or dataflow.
  - Answers directly from the graph should name the mechanism and cite `file:line`. Skip question restatements and search narration.

nudge_search: |
  Prefer `{{orbit}} grep "<terms>"` for definition searches. Inspect known targets directly with `{{orbit}} context "<fqn>"` or `{{orbit}} context --file <path>`.
nudge_read: |
  Prefer `{{orbit}} context "<fqn>"` or `{{orbit}} context --file <path>` for repository code. Do not search first for a known target or retrieve source Orbit already supplied. Use `read` for non-code files, unavailable index coverage, or when Orbit cannot reliably return current working-tree source.
template_vars:
  reminder: "[orbit] when a graph lookup would help, run {{orbit}} grep"
