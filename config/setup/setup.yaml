# yaml-language-server: $schema=../schemas/setup.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, the MCP server entry, and the `template_vars` that fill `{{name}}` placeholders
# in the templates assistants declare. `remote` fills `{{name}}` placeholders in `instructions` when
# Orbit can reach GitLab at setup time, and they render empty otherwise.
mcp_server:
  name: orbit
  command: "{{orbit}} mcp serve"
instructions: |
  ## Orbit

  - MANDATORY: `{{orbit}} grep` must be used for search instead of grep and rg{{remote_grep}}. Ignores case, `_`, `-`; `a|b` OR; narrow with paths, `def:words`, or `file:x`.
  - `{{orbit}} context` reads code in one call: `a.rs:10-40 b.rs:88-120`, or a name for its connections{{remote_context}}. Edit from its output without rereading.

remote:
  remote_grep: ", and instead of glab: `mr:words` or `issue:words` searches GitLab"
  remote_context: "; `mr:42 job:9` reads GitLab, bare `{{orbit}} context` the branch's MR and CI failures, `repo:group/project symbol:Name` a sibling project"

nudge_gitlab: |
  MANDATORY: `{{orbit}}` must be used for GitLab instead of glab. `{{orbit}} grep 'mr:words'` searches MRs, and `issue:`, `branch:`, `commit:`, `comment:` the rest. `{{orbit}} context mr:42 issue:7 branch:x pipeline:9 job:9` reads them; bare `{{orbit}} context` reads the current branch's MR and CI; `{{orbit}} context repo:group/project symbol:Name file:path` reads a sibling project's code.
nudge_search: |
  MANDATORY: `{{orbit}} grep` must be used for search instead of grep and rg. Ignores case, `_`, `-`; `a|b` OR. Narrow with paths, as with rg, or `def:words`/`file:x`.
template_vars:
  reminder: "[orbit] Grep means run {{orbit}} grep 'words'. rg output plus enclosing definitions."
