# yaml-language-server: $schema=../schemas/setup_modes.schema.json
# Every string that differs between the local graph (`orbit sql`) and the remote graph
# (`glab orbit remote`); only the commands and the availability check differ. `template_vars`
# fill `{{name}}` placeholders in the templates assistants declare.
local:
  instructions: |
    ## Orbit graph

    Repositories on this machine are indexed into a local Orbit code graph (`orbit list` shows which). Query the graph before grep or reading files for any question about how the code fits together: where something is defined or belongs, where a behavior happens, what handles a case, who calls or imports it, what an API looks like. Plain questions count — "where do we send X", "what handles Y", "how does Z work" are all graph questions. Grep matches text and returns noise; the graph returns resolved definitions, callers, and imports.

    Copy-paste recipes (DuckDB SQL):

    - Find a definition: `orbit sql "SELECT name, definition_type, file_path, start_line FROM gl_definition WHERE name LIKE '%Retry%'"`
    - Who calls X: `orbit sql "SELECT s.name, s.file_path, s.start_line FROM gl_edge e JOIN gl_definition s ON e.source_id=s.id JOIN gl_definition t ON e.target_id=t.id WHERE e.relationship_kind='CALLS' AND t.name='run_sql'"` (flip source/target for what X calls; `EXTENDS` for subtypes)
    - Orient in unfamiliar code / where should new code live: `orbit repo-map` (drill down: `tree`, `api <Type>`, `class`, `extends`, `imports`)
    - `orbit schema` lists tables; `orbit skill` prints the full recipe reference

    If orbit reports the current commit is not indexed, run `orbit index .` and retry. Grep and raw file reads are fine once the graph has oriented you, or to modify and debug specific lines. For questions spanning other projects or GitLab entities (merge requests, issues, pipelines, users), use `glab orbit` when available.

    This applies to subagents: put the same rule in any subagent prompt that explores code.
  nudge_search: |
    MANDATORY: a local Orbit code graph covers this code. You MUST query it before grepping raw files — grep returns textual noise, the graph returns resolved definitions. Start with `orbit sql "SELECT name, definition_type, file_path, start_line FROM gl_definition WHERE name LIKE '%<term>%'"`; caller/import/subtype recipes are in `orbit skill`, and `orbit repo-map` orients you in unfamiliar code. Grep after the graph has oriented you, or to modify/debug specific lines. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  nudge_read: |
    MANDATORY: a local Orbit code graph covers this code. You MUST orient with the graph before reading source files one by one — run `orbit sql "<DuckDB SQL>"` (definitions, callers, imports) or `orbit repo-map`. Read raw files after the graph has oriented you, or to modify/debug specific lines. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  template_vars:
    reminder: "[orbit] local code graph available: for code-structure questions run orbit sql or orbit repo-map (scoped results, cheaper than grep); orbit skill prints the query reference."
    require_local_graph: true
remote:
  instructions: |
    ## Orbit graph

    GitLab projects are covered by the remote Orbit graph. Query the graph before grep or reading files for any question about how the code fits together: where something is defined, where a behavior happens, what handles a case, who calls or imports it, what an API looks like. Plain questions count — "where do we send X", "what handles Y", "how does Z work" are all graph questions. The same goes for GitLab entities: merge requests, issues, pipelines, users, cross-project dependencies. Grep matches text and returns noise; the graph returns resolved definitions and relationships.

    - Run queries with `glab orbit remote query <file.json|->`; `glab orbit remote schema` lists entities and edges.
    - The `orbit` agent skill has copy-paste query recipes and the full DSL reference — consult it before writing a query by hand.
    - Raw grep and file reads are fine once the graph has oriented you, or to modify and debug specific lines.
    - This applies to subagents: put the same rule in any subagent prompt that explores code.
  nudge_search: |
    MANDATORY: the remote Orbit graph covers this code. You MUST run `glab orbit remote query` before grepping raw files — grep returns textual noise, the graph returns resolved definitions and relationships. `glab orbit remote schema` lists entities and edges; the `orbit` skill has copy-paste recipes. Grep after the graph has oriented you, or to modify/debug specific lines. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  nudge_read: |
    MANDATORY: the remote Orbit graph covers this code. You MUST orient with the graph before reading source files one by one — run `glab orbit remote query` (definitions, callers, imports; `glab orbit remote schema` lists entities). Read raw files after the graph has oriented you, or to modify/debug specific lines. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  template_vars:
    reminder: "[orbit] remote Orbit graph available: for code-structure and GitLab-entity questions run glab orbit remote query (scoped results, cheaper than grep); glab orbit remote schema lists entities."
    require_local_graph: false
