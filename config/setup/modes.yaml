# yaml-language-server: $schema=../schemas/setup_modes.schema.json
# Every string that differs between the local graph (`orbit sql`) and the
# remote Knowledge Graph (`glab orbit remote`). The rules are the same either
# way; only the commands and the availability check differ. `template_vars`
# fill `{{name}}` placeholders in the templates assistants declare.
local:
  instructions: |
    ## Orbit knowledge graph

    Repositories on this machine are indexed into a local Orbit code graph (`orbit list` shows which). For code-structure questions — where something is defined or belongs, who calls or imports it, what an API looks like — query the graph before reaching for grep: grep matches text and returns noise; the graph returns resolved definitions, callers, and imports.

    Copy-paste recipes (DuckDB SQL):

    - Find a definition: `orbit sql "SELECT name, definition_type, file_path, start_line FROM gl_definition WHERE name LIKE '%Retry%'"`
    - Who calls X: `orbit sql "SELECT s.name, s.file_path, s.start_line FROM gl_edge e JOIN gl_definition s ON e.source_id=s.id JOIN gl_definition t ON e.target_id=t.id WHERE e.relationship_kind='CALLS' AND t.name='run_sql'"` (flip source/target for what X calls; `EXTENDS` for subtypes)
    - Orient in unfamiliar code / where should new code live: `orbit repo-map` (drill down: `tree`, `api <Type>`, `class`, `extends`, `imports`)
    - `orbit schema` lists tables; `orbit skill` prints the full recipe reference

    If orbit reports the current commit is not indexed, run `orbit index .` and retry. Grep and raw file reads are fine once the graph has oriented you, or to modify and debug specific lines. For questions spanning other projects or GitLab entities (merge requests, issues, pipelines, users), use `glab orbit` when available.
  nudge_search: |
    A local Orbit code graph is available — it returns resolved definitions instead of textual noise. Instead of grep, try: `orbit sql "SELECT name, definition_type, file_path, start_line FROM gl_definition WHERE name LIKE '%<term>%'"`. Caller/import/subtype recipes: `orbit skill`. Grep after the graph has oriented you, or to modify/debug specific lines.
  nudge_read: |
    A local Orbit code graph is available. Before reading source files one by one, run `orbit sql "<DuckDB SQL>"` (definitions, callers, imports) or `orbit repo-map` to orient. Read raw files after the graph has oriented you, or to modify/debug specific lines.
  template_vars:
    reminder: "[orbit] local code graph available: for code-structure questions run orbit sql or orbit repo-map (scoped results, cheaper than grep); orbit skill prints the query reference."
    require_local_graph: true
remote:
  instructions: |
    ## Orbit knowledge graph

    GitLab projects are covered by the remote Orbit graph. For code-structure questions — where something is defined, who calls or imports it, what an API looks like — and GitLab-entity questions (merge requests, issues, pipelines, users, cross-project dependencies), query the graph before reaching for grep: grep matches text and returns noise; the graph returns resolved definitions and relationships.

    - Run queries with `glab orbit remote query <file.json|->`; `glab orbit remote schema` lists entities and edges.
    - The `orbit` agent skill has copy-paste query recipes and the full DSL reference — consult it before writing a query by hand.
    - Raw grep and file reads are fine once the graph has oriented you, or to modify and debug specific lines.
  nudge_search: |
    The remote Orbit graph is available. For code-structure questions, run `glab orbit remote query` before grepping raw files — the graph returns scoped results with far less output. `glab orbit remote schema` lists entities and edges. Grep after the graph has oriented you, or to modify/debug specific lines.
  nudge_read: |
    The remote Orbit graph is available. Before reading source files one by one, run `glab orbit remote query` (definitions, callers, imports; see `glab orbit remote schema`) to orient. Read raw files after the graph has oriented you, or to modify/debug specific lines.
  template_vars:
    reminder: "[orbit] remote Orbit graph available: for code-structure and GitLab-entity questions run glab orbit remote query (scoped results, cheaper than grep); glab orbit remote schema lists entities."
    require_local_graph: false
