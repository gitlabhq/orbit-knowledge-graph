# yaml-language-server: $schema=../schemas/setup_modes.schema.json
# Every string that differs between the local graph (`orbit sql`) and the remote graph
# (`glab orbit remote`); only the commands and the availability check differ. `template_vars`
# fill `{{name}}` placeholders in the templates assistants declare.
local:
  instructions: |
    ## Orbit graph

    Repositories on this machine are indexed into a local Orbit code graph. Query the graph before grep or reading files for any question about how the code fits together: where something is defined or belongs, where a behavior happens, what handles a case, who calls or imports it, what an API looks like. Plain questions count — "where do we send X", "what handles Y", "how does Z work" are all graph questions. Grep matches text and returns noise; the graph returns resolved definitions, callers, and imports.

    Rules:

    - For any question about how this code fits together, run `orbit local ask "<your question>"` FIRST, before grep and before reading files.
    - Ask in the words you would use with a colleague. "where do we send messages to the dlq", "what handles NATS backpressure" are single `orbit local ask` calls.
    - If `ask` notes unmatched terms or weak matches, retry once with different wording for those terms — a synonym or an identifier fragment ("throttle" → "rate limit"). If the retry also misses, fall back to grep.
    - Grep and raw file reads come *after* the graph has oriented you, or to modify and debug specific lines.
    - When `ask` returns confident matches with snippets, answer from them. Verify with at most one file read when the snippet alone is ambiguous — do not re-derive what the graph already resolved.
    - Drop to SQL only for what `ask` does not cover: exact filters, aggregation, or columns it does not print.
    - If two graph queries in a row return nothing useful, the graph likely lacks those edges — fall back to grep immediately instead of reformulating SQL.
    - Answer tersely: name the mechanism, cite `file:line`, and stop. Do not paste code blocks the reader can open from the citation, and do not restate the question or narrate your search.

    Copy-paste recipes (DuckDB SQL):

    - Find a definition: `orbit sql "SELECT name, definition_type, file_path, start_line FROM gl_definition WHERE name LIKE '%Retry%'"`
    - Who calls X: `orbit sql "SELECT s.name, s.file_path, s.start_line FROM gl_edge e JOIN gl_definition s ON e.source_id=s.id JOIN gl_definition t ON e.target_id=t.id WHERE e.relationship_kind='CALLS' AND t.name='run_sql'"` (flip source/target for what X calls; `EXTENDS` for subtypes)
    - Orient in unfamiliar code / where should new code live: `orbit repo-map` (drill down: `tree`, `api <Type>`, `class`, `extends`, `imports`)
    - `orbit schema` lists tables; `orbit skill` prints the full recipe reference

    `ask` indexes the current commit automatically; if `orbit sql` or `orbit repo-map` report it is not indexed, run `orbit index .` and retry. Grep and raw file reads are fine once the graph has oriented you, or to modify and debug specific lines. For questions spanning other projects or GitLab entities (merge requests, issues, pipelines, users), use `glab orbit` when available.

    This applies to subagents: put the same rule in any subagent prompt that explores code.
  nudge_search: |
    MANDATORY: a local Orbit code graph covers this code. Before grepping raw files, run `orbit local ask "<your question>"` — one command in plain language, returning resolved definitions and their connections instead of textual noise. For exact filters or aggregation use `orbit sql "<DuckDB SQL>"` (`orbit skill` prints the recipes), and `orbit repo-map` orients you in unfamiliar code. Grep after the graph has oriented you, or to modify/debug specific lines. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  nudge_read: |
    MANDATORY: a local Orbit code graph covers this code. Before reading source files one by one, orient with `orbit local ask "<your question>"` — one command in plain language, returning the matching definitions and what connects to them. For exact filters or aggregation use `orbit sql "<DuckDB SQL>"`, or `orbit repo-map` for a structural overview. Read raw files after the graph has oriented you, or to modify/debug specific lines. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  template_vars:
    reminder: "[orbit] local code graph available: for code-structure questions run orbit local ask with your question (one command, no SQL to write, cheaper than grep); orbit sql and orbit repo-map cover exact filters and structure."
    require_local_graph: true
remote:
  instructions: |
    ## Orbit graph

    This project is covered by the remote Orbit graph: resolved definitions, callers, imports, merge requests, issues, and the relationships between them.

    Rules:

    - For any question about this codebase or its GitLab history — where something is defined, who calls it, which merge requests or issues relate to it — query the graph FIRST, before grep and before reading files: `glab orbit remote query <file.json|->`.
    - `glab orbit remote schema` lists entities and edges, and the `orbit` agent skill has copy-paste query recipes — consult it before writing a query by hand.
    - Grep and raw file reads come *after* the graph has oriented you, or to modify and debug specific lines. Grep matches text and returns noise; the graph returns resolved relationships.
    - If two graph queries in a row return nothing useful, the graph likely lacks those edges — fall back to grep immediately instead of reformulating the query.
    - This applies to subagents: put the same rule in any subagent prompt that explores code.
  nudge_search: |
    MANDATORY: the remote Orbit graph covers this code. Before grepping raw files, query it with `glab orbit remote query` (the `orbit` skill has copy-paste recipes) — it returns resolved definitions and their connections instead of textual noise, and covers merge requests, issues, pipelines, and aggregation. Grep after the graph has oriented you, or to modify/debug specific lines. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  nudge_read: |
    MANDATORY: the remote Orbit graph covers this code. Before reading source files one by one, orient with `glab orbit remote query` (the `orbit` skill has copy-paste recipes) — it returns the matching definitions and what connects to them, and covers merge requests, issues, pipelines, and aggregation. Read raw files after the graph has oriented you, or to modify/debug specific lines. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  template_vars:
    reminder: "[orbit] remote Orbit graph available: for code-structure, merge-request, or issue questions use glab orbit remote query (the orbit skill has recipes; cheaper than grep)."
    require_local_graph: false
