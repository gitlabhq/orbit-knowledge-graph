# yaml-language-server: $schema=../schemas/setup_modes.schema.json
# Every string that differs between the local graph (`{{orbit}} sql`) and the remote graph
# (`glab orbit remote`); only the commands and the availability check differ. `template_vars`
# fill `{{name}}` placeholders in the templates assistants declare.
local:
  instructions: |
    ## Orbit
    
    This project has a code knowledge graph with cross-file relationships and code definitions.

    Rules:

    - Never answer a question about this codebase from prior knowledge. Every answer must be grounded in a `{{orbit}} grep` result from this repository.
    - For any task first run `{{orbit}} grep "<keywords>"` in order to find relevant code definitions. Use `{{orbit}} show "<fqn>"` to show the full body of a definition and `{{orbit}} describe "<fqn>"` for all edge connections to a definition.
    - NEVER open a file just to read one definition's body. `{{orbit}} grep` only prints `fqn`, `kind`, and `loc` — `{{orbit}} show "<fqn>"` is always the follow-up if you want the full source, not a file read. File reads are only for editing and for lines outside any indexed definition (imports, module-level wiring, comments).
    - Weak or unmatched `grep` terms: retry with a synonym or identifier fragment ("throttle" → "rate limit").
    - Only skip `{{orbit}}` commands if the user explicitly requests not to use it.
    - For aggregations or more complex graph queries, run `{{orbit}} schema` to list tables once and `{{orbit}} sql` to execute raw SQL.
    - When answering from the graph, answer tersely: name the mechanism and cite `file:line`. Do not restate the question or narrate your search.

  nudge_search: |
    MANDATORY: the Orbit code graph covers this code. Before grepping raw files, run `{{orbit}} grep "<terms>"` to find relevant code definitions.
  nudge_read: |
    MANDATORY: the Orbit code graph covers this code. Before reading source files one by one, start with `{{orbit}} grep "<terms>"`.
  template_vars:
    reminder: "[orbit] local code graph available: run {{orbit}} grep with your question before text grep"
    require_local_graph: true
remote:
  instructions: |
    ## Orbit

    This project is covered by the Orbit knowledge graph

    Rules:

    - For any question about this codebase or its GitLab history — where something is defined, who calls it, which merge requests or issues relate to it — query the graph FIRST, before grep and before reading files: `glab orbit remote query <file.json|->`.
    - The same default holds while implementing: where the code you will change lives and what machinery already exists are graph queries, not greps. Do not scaffold new code before checking what already exists.
    - `glab orbit remote schema` lists entities and edges, and the `orbit` agent skill has copy-paste query recipes — consult it before writing a query by hand.
    - Files are for editing, or for reading lines the graph has not already shown you — not for searching. Grep matches text and returns noise; the graph returns resolved relationships.
    - If two graph queries in a row return nothing useful, the graph likely lacks those edges — fall back to grep immediately instead of reformulating the query.
    - This applies to subagents: put the same rule in any subagent prompt that explores code.
  nudge_search: |
    MANDATORY: the remote Orbit graph covers this code. Before grepping raw files, query it with `glab orbit remote query` (the `orbit` skill has copy-paste recipes) — it returns resolved definitions and their connections instead of textual noise, and covers merge requests, issues, pipelines, and aggregation. Grep only for literal strings the graph cannot index; code-structure lookups go to the graph at every step, not just the first. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  nudge_read: |
    MANDATORY: the remote Orbit graph covers this code. Before reading source files one by one, start with `glab orbit remote query` (the `orbit` skill has copy-paste recipes) — it returns the matching definitions and what connects to them, and covers merge requests, issues, pipelines, and aggregation. Files are for editing, or for reading lines the graph has not already shown you — not for searching. This applies to subagents too — put the same rule in any subagent prompt that explores code.
  template_vars:
    reminder: "[orbit] remote Orbit graph available: for code-structure, merge-request, or issue questions use glab orbit remote query (the orbit skill has recipes; cheaper than grep)."
    require_local_graph: false
