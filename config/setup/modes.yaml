# yaml-language-server: $schema=../schemas/setup_modes.schema.json
# Every string `orbit setup` writes into an assistant's files: the managed instruction block, the
# two hook nudges, and the `template_vars` that fill `{{name}}` placeholders in the templates
# assistants declare.
instructions: |
  ## Orbit

  This project has a code knowledge graph with code definition nodes and relationship edges.

  Rules:

  - For any task first run `{{orbit}} grep` to find the relevant code definitions. Use one to three keywords that would appear in the identifier (`"activateExtension"`, `"shard allocation decider"`).
  - Generic words (`service`, `handler`, `create`, `update`) match thousands of symbols; pair them with `--path <dir-or-glob>` (repeatable) for the feature area and `--kind Class,Method` (one comma-separated list). Use `{{orbit}} context "<fqn>" ["<fqn>"...]` for full bodies (or `grep ... --body` to get the top match's body in one call), `{{orbit}} context --file <path>` to show every definition in a file, `--outline` on either to see signatures and members without bodies, and `{{orbit}} grep "<fqn>" --related-to` to list every connection (`--in`/`--out` for one direction, `--edge calls|extends|imports` for one relationship; connections from test files are collapsed into a count unless `--tests`). `grep "<fqn>" --callers` and `grep "<fqn>" --callees` list callers and callees; `--path`/`--kind` filter the connected results.
  - The graph is for discovery: use it when you know a concept, a name, or a relationship but not where it lives. `{{orbit}} grep "<terms>"` only prints `fqn`, `kind`, and `loc` — `{{orbit}} context` is the follow-up for one or multiple definition bodies, and `{{orbit}} context --file <path>` for a whole file's definitions.
  - When grep reports weak or unmatched terms, or thousands of hidden hits, the query is too broad or not a symbol name: switch to the identifier fragment the code would use ("throttle" → "rateLimit"), or scope with `--path`/`--kind`. Do not rephrase the question with more words.
  - Only skip `{{orbit}}` commands if the user explicitly requests not to use it.
  - For aggregations or more complex graph queries, run `{{orbit}} schema` to list tables once and `{{orbit}} sql` to execute raw SQL.
  - When answering from the graph, answer tersely: name the mechanism and cite `file:line`. Do not restate the question or narrate your search.

nudge_search: |
  MANDATORY: the Orbit code graph covers this code. Before grepping or cat-ing raw source for a name or concept, run `{{orbit}} grep "<terms>"` with `--path <dir-or-glob>` to scope it to find relevant code definitions. Text grep and full reads are for exact string literals and files the graph does not index.
nudge_read: |
  MANDATORY: the Orbit code graph covers this code. Before reading source files one by one, start with `{{orbit}} grep "<terms>"`; `{{orbit}} context "<fqn>" ["<fqn>"...]` prints the definitions you need, and `{{orbit}} context --file <path>` reads a whole file with its definitions labelled.
template_vars:
  reminder: "[orbit] local code graph available: run {{orbit}} grep with your question before text grep"
