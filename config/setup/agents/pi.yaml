# yaml-language-server: $schema=../../schemas/setup_agent.schema.json
# Pi reads AGENTS.md natively (project root, or ~/.pi/agent/AGENTS.md for user scope), so the
# instruction file is the whole integration.
name: pi
title: Pi
detect: ["~/.pi/agent"]
instruction_file:
  project: AGENTS.md
  global: "~/.pi/agent/AGENTS.md"
# Features that are on for the channel (packages/agent-plugins-nightly/features.yaml) install here.
feature_dir:
  project: .pi/extensions/orbit-features
  global: "~/.pi/agent/extensions/orbit-features"
