# yaml-language-server: $schema=../../schemas/setup_agent.schema.json
# Pi reads AGENTS.md natively (project root, or ~/.pi/agent/AGENTS.md for user scope), so the
# instruction file is the whole integration.
name: pi
title: Pi
detect: ["~/.pi/agent"]
instruction_file:
  project: AGENTS.md
  global: "~/.pi/agent/AGENTS.md"
template_files:
  - path:
      project: .pi/extensions/orbit-nightly/index.js
      global: "~/.pi/agent/extensions/orbit-nightly/index.js"
    template: output-guard/pi.mjs
    ui: true
    nightly: true
  - path:
      project: .pi/extensions/orbit-nightly/core.mjs
      global: "~/.pi/agent/extensions/orbit-nightly/core.mjs"
    template: output-guard/core.mjs
    ui: true
    nightly: true
