# yaml-language-server: $schema=../../schemas/setup_agent.schema.json
# OpenCode has no PreToolUse-style context injection, so orbit.js appends a one-per-session graph
# reminder to the first shell command's output. orbit-ui/ is an OpenCode 2 plugin directory: its
# server part (index.js) reports each Orbit call and its TUI part (tui.tsx) draws it above the
# prompt. OpenCode discovers both under its plugins directory, so neither is registered in
# opencode.json; OpenCode 2 skips a single-file entry there with a warning.
name: opencode
title: OpenCode
detect: ["$XDG_CONFIG_HOME/opencode", "~/.config/opencode"]
instruction_file:
  project: AGENTS.md
  global: "~/.config/opencode/AGENTS.md"
template_files:
  - path:
      project: .opencode/plugins/orbit.js
      global: "~/.config/opencode/plugins/orbit.js"
    template: opencode_plugin.js
  - path:
      project: .opencode/plugins/orbit-ui/index.js
      global: "~/.config/opencode/plugins/orbit-ui/index.js"
    template: agents/opencode_ui/index.js
    ui: true
  - path:
      project: .opencode/plugins/orbit-ui/rpc.ts
      global: "~/.config/opencode/plugins/orbit-ui/rpc.ts"
    template: agents/opencode_ui/rpc.ts
    ui: true
  - path:
      project: .opencode/plugins/orbit-ui/tui.tsx
      global: "~/.config/opencode/plugins/orbit-ui/tui.tsx"
    template: agents/opencode_ui/tui.tsx
    ui: true
retired:
  template_files:
    - path:
        project: .opencode/plugins/orbit-ui.js
        global: "~/.config/opencode/plugins/orbit-ui.js"
      ui: true
  registrations:
    - file:
        project: .opencode/opencode.json
        global: "~/.config/opencode/opencode.json"
      path: [plugin]
      value:
        project: .opencode/plugins/orbit.js
        global: "~/.config/opencode/plugins/orbit.js"
    - file:
        project: .opencode/opencode.json
        global: "~/.config/opencode/opencode.json"
      path: [plugin]
      value:
        project: .opencode/plugins/orbit-ui.js
        global: "~/.config/opencode/plugins/orbit-ui.js"
      ui: true
  mcp:
    file:
      project: opencode.json
      global: "~/.config/opencode/opencode.json"
    format: opencode
skills:
  dir:
    project: .agents/skills
    global: "~/.agents/skills"
