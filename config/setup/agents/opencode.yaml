# OpenCode has no PreToolUse-style context injection; a tool.execute.before
# plugin prepends a one-per-session graph reminder to the first bash command.
name: opencode
instruction_file:
  project: AGENTS.md
  global: "~/.config/opencode/AGENTS.md"
template_files:
  - path:
      project: .opencode/plugins/orbit.js
      global: "~/.config/opencode/plugins/orbit.js"
    template: "modes/{mode}/opencode_plugin.js"
registrations:
  - file:
      project: .opencode/opencode.json
      global: "~/.config/opencode/opencode.json"
    path: [plugin]
    value:
      project: .opencode/plugins/orbit.js
      global: "~/.config/opencode/plugins/orbit.js"
