# yaml-language-server: $schema=../../schemas/setup_agent.schema.json
# Claude Code honors PreToolUse additionalContext, so search/read calls also get an
# `orbit hook-guard` nudge on top of the CLAUDE.md block. Claude Code does not scan
# `.agents/skills`, so the shared skill dir is linked into `.claude/skills`.
name: claude
title: Claude Code
detect: ["$CLAUDE_CONFIG_DIR", "~/.claude", "~/.claude.json"]
instruction_file:
  project: CLAUDE.md
  global: "${CLAUDE_CONFIG_DIR:-~/.claude}/CLAUDE.md"
# Claude Code reads AGENTS.md only when no CLAUDE.md exists, so setup never creates a
# CLAUDE.md in a project; it writes the block to AGENTS.md unless the user has a CLAUDE.md.
project_instruction_fallback: AGENTS.md
json_merges:
  - file:
      project: .claude/settings.json
      global: "${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json"
    path: [hooks, PreToolUse]
    marker: hook-guard
    entries:
      - matcher: "Bash|Grep"
        hooks:
          - type: command
            command: "{{orbit}} hook-guard search{{hook_gitlab}}"
retired:
  mcp:
    file:
      project: .mcp.json
      global: "${CLAUDE_CONFIG_DIR:-~}/.claude.json"
    format: claude
skills:
  dir:
    project: .agents/skills
    global: "~/.agents/skills"
  link:
    project: .claude/skills
    global: "${CLAUDE_CONFIG_DIR:-~/.claude}/skills"
  permissions:
    file:
      project: .claude/settings.json
      global: "${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json"
    rules:
      - "Bash({{orbit}} skills get orbit)"
      - "Bash({{orbit}} skills get orbit *)"
plugin:
  dir:
    project: .claude/orbit/claude_plugin
    global: "${CLAUDE_CONFIG_DIR:-~/.claude}/orbit/claude_plugin"
  settings:
    project: .claude/settings.local.json
    global: "${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json"
  marketplace: gitlab-orbit
  name: gitlab-orbit
  min_version: "2.1.287"
  version_command: [claude, --version]
