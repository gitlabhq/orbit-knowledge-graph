# yaml-language-server: $schema=../../schemas/setup_agent.schema.json
# Claude Code honors PreToolUse additionalContext, so search/read calls also get an
# `orbit hook-guard` nudge on top of the CLAUDE.md block.
name: claude
instruction_file:
  project: CLAUDE.md
  global: "~/.claude/CLAUDE.md"
json_merges:
  - file:
      project: .claude/settings.json
      global: "~/.claude/settings.json"
    path: [hooks, PreToolUse]
    marker: orbit hook-guard
    entries:
      - matcher: "Bash|Grep|Glob"
        hooks:
          - type: command
            command: orbit hook-guard search --mode {mode}
      - matcher: Read
        hooks:
          - type: command
            command: orbit hook-guard read --mode {mode}
