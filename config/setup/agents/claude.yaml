# yaml-language-server: $schema=../../schemas/setup_agent.schema.json
# Claude Code honors PreToolUse additionalContext, so search/read calls also get an
# `orbit hook-guard` nudge on top of the CLAUDE.md block. Claude Code does not scan
# `.agents/skills`, so the shared skill dir is linked into `.claude/skills`.
name: claude
title: Claude Code
detect: ["$CLAUDE_CONFIG_DIR", "~/.claude", "~/.claude.json"]
instruction_file:
  project: CLAUDE.md
  global: "~/.claude/CLAUDE.md"
json_merges:
  - file:
      project: .claude/settings.json
      global: "~/.claude/settings.json"
    path: [hooks, PreToolUse]
    marker: hook-guard
    entries:
      - matcher: "Bash|Grep"
        hooks:
          - type: command
            command: "{{orbit}} hook-guard search{{hook_gitlab}}"
mcp:
  file:
    project: .mcp.json
    global: "~/.claude.json"
  format: claude
  coding_agent: claude-code
skills:
  dir:
    project: .agents/skills
    global: "~/.agents/skills"
  link:
    project: .claude/skills
    global: "~/.claude/skills"
  permissions:
    file:
      project: .claude/settings.json
      global: "~/.claude/settings.json"
    rules:
      - "Bash({{orbit}} skills get orbit)"
      - "Bash({{orbit}} skills get orbit *)"
# The Orbit UI plugin is opt-in (`--claude-ui`). Its marketplace entry uses a relative source,
# so Claude Code loads it straight from the directory marketplace with no install step.
# Project scope registers it in settings.local.json because the marketplace path is absolute.
plugin:
  source: claude_plugin
  dir:
    project: .claude/orbit/claude_plugin
    global: "~/.claude/orbit/claude_plugin"
  settings:
    project: .claude/settings.local.json
    global: "~/.claude/settings.json"
  marketplace: gitlab-orbit
  name: gitlab-orbit
  min_version: "2.1.287"
  version_command: [claude, --version]
