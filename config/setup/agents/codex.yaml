# yaml-language-server: $schema=../../schemas/setup_agent.schema.json
# Codex PreToolUse hooks take the same stdin and output JSON as Claude Code, so shell calls get
# the `orbit hook-guard` nudge. Codex runs a new hook only after the user trusts it in `/hooks`.
name: codex
title: Codex
detect: ["$CODEX_HOME", "~/.codex"]
instruction_file:
  project: AGENTS.md
  global: "~/.codex/AGENTS.md"
json_merges:
  - file:
      project: .codex/hooks.json
      global: "~/.codex/hooks.json"
    path: [hooks, PreToolUse]
    marker: hook-guard
    entries:
      - matcher: Bash
        hooks:
          - type: command
            command: "{{orbit}} hook-guard search"
            timeout: 10
    note:
      project: "trust the orbit hook in /hooks"
      global: "trust the orbit hook in /hooks"
mcp:
  file:
    project: .codex/config.toml
    global: "~/.codex/config.toml"
  format: codex
  coding_agent: codex
skills:
  dir:
    project: .agents/skills
    global: "~/.agents/skills"
