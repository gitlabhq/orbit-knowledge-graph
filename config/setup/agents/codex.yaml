# yaml-language-server: $schema=../../schemas/setup_agent.schema.json
name: codex
title: Codex
detect: ["$CODEX_HOME", "~/.codex"]
instruction_file:
  project: AGENTS.md
  global: "~/.codex/AGENTS.md"
json_merges:
  - file:
      project: .codex/hooks.json
      global: "${CODEX_HOME:-~/.codex}/hooks.json"
    path: [hooks, SessionStart]
    marker: hook-guard instructions
    trust: codex
    entries:
      - hooks:
          - type: command
            command: "{{orbit}} hook-guard instructions"
            timeout: 10
retired:
  mcp:
    file:
      project: .codex/config.toml
      global: "~/.codex/config.toml"
    format: codex
skills:
  dir:
    project: .agents/skills
    global: "~/.agents/skills"
