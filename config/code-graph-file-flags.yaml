test:
  globs:
    - "**/test/**"
    - "**/tests/**"
    - "**/spec/**"
    - "**/__tests__/**"
    - "**/testdata/**"
    - "**/*_test.go"
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/conftest.py"
    - "**/*_spec.rb"
    - "**/*_test.rb"
    - "**/*.test.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
    - "**/*.spec.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
    - "**/*Test.{java,kt,scala,php,swift,cs}"
    - "**/*Tests.{java,kt,scala,swift,cs}"
    - "**/*Spec.{scala,kt,groovy}"
    - "**/*_test.{exs,lua,zig,c,cc,cpp}"
    - "**/*_spec.lua"
    - "**/*.bats"
generated:
  globs:
    - "**/*.pb.go"
    - "**/*.pb.{cc,h}"
    - "**/*_pb2.py"
    - "**/*_pb2_grpc.py"
    - "**/*.generated.*"
    - "**/*.g.dart"
    - "**/*.min.{js,mjs,cjs,css}"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/Cargo.lock"
    - "**/Gemfile.lock"
    - "**/poetry.lock"
    - "**/composer.lock"
    - "**/go.sum"
  markers:
    - "Code generated"
    - "@generated"
    - "DO NOT EDIT"
    - "<auto-generated"
vendored:
  globs:
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/third_party/**"
    - "**/third-party/**"
    - "**/bower_components/**"
    - "**/Pods/**"
