kind: graph
package: integration.slack
entities:
  SlackMessage:
    identity: id
    label: text
    default_columns: [id, workspace, channel, author, text, sent_at]
    properties:
      id: {type: string}
      workspace: {type: string}
      merge_request_id: {type: int64}
      channel: {type: string}
      author: {type: string}
      text: {type: string}
      sent_at: {type: timestamp}

  Incident:
    identity: id
    label: title
    default_columns: [id, title, message_id]
    properties:
      id: {type: int64}
      title: {type: string}
      message_id: {type: string}
      traversal_path: {type: string}

  SlackWorkspace:
    identity: id
    label: name
    default_columns: [id, name, group_id, traversal_path]
    properties:
      id: {type: string}
      name: {type: string}
      group_id: {type: int64}
      traversal_path: {type: string}
relationships:
  IN_WORKSPACE: {variants: {SlackMessage -> SlackWorkspace: {cardinality: many_to_one}}}
  INSTALLED_IN: {variants: {SlackWorkspace -> Group: {cardinality: many_to_one}}}
  DISCUSSES: {variants: {SlackMessage -> MergeRequest: {cardinality: many_to_one}}}
  RAISED_IN: {variants: {Incident -> SlackMessage: {cardinality: many_to_one}}}
