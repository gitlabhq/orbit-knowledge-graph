kind: storage
package: integration.slack
store: slack_live
engine:
  kind: live
  connection: data_extraction
entities:
  SlackMessage:
    accepts: [workspace, issue_id]
    columns:
      id: {}
      workspace: {}
      channel: {}
      author: {}
      text: {}
      sent_at: {}
      issue_id: {}
    backend:
      operation: search.messages
      filters: [workspace, channel, author, sent_at, issue_id]
      text: text
