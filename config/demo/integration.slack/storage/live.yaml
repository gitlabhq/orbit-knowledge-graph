kind: storage
package: integration.slack
store: slack
engine:
  kind: live
  connection: data_extraction
entities:
  SlackMessage:
    complete: true
    columns:
      id: {immutable: true}
      workspace: {immutable: true}
      channel: {}
      author: {}
      text: {}
      sent_at: {}
    backend:
      operation: search.messages
      filters: [channel, author, sent_at]
      text: text
  SlackWorkspace:
    columns:
      id: {immutable: true}
      name: {}
    backend:
      operation: workspaces.list
relationships:
  IN_WORKSPACE:
    SlackMessage -> SlackWorkspace: {fk: {on: source, column: workspace}}
