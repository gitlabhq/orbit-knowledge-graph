kind: storage
package: integration.slack
store: slack
engine:
  kind: live
  connection: data_extraction
entities:
  SlackMessage:
    complete: true
    accepts: [id, merge_request_id]
    columns:
      id: {}
      workspace: {}
      merge_request_id: {}
      channel: {}
      author: {}
      text: {}
      sent_at: {}
    backend:
      operation: search.messages
      filters: [id, channel, author, sent_at, merge_request_id]
      text: text
  SlackWorkspace:
    accepts: []
    columns:
      id: {}
      name: {}
    backend:
      operation: workspaces.list
relationships:
  IN_WORKSPACE:
    SlackMessage -> SlackWorkspace: {fk: {on: source, column: workspace}}
  DISCUSSES:
    SlackMessage -> MergeRequest: {fk: {on: source, column: merge_request_id}}
