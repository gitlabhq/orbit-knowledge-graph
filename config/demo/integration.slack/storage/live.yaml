kind: storage
package: integration.slack
store: slack
engine:
  kind: live
  connection: data_extraction
  path_column: traversal_path
entities:
  SlackMessage:
    columns:
      id: {immutable: true}
      channel: {}
      author: {}
      text: {}
      sent_at: {}
    backend:
      operation: search.messages
      filters: [channel, author, sent_at]
      text: text
