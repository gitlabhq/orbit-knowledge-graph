kind: authorization
package: integration.slack
entities:
  SlackMessage:
    scope: namespace
    permission: read
    enforce:
      duckdb: {scope_key: traversal_path}
      live: {scope_key: {via: IN_WORKSPACE}}
    checks:
      - {provider: slack, kind: delegated}
    properties:
      open: [id, channel, author, text, sent_at, issue_id, merge_request_id]
      exact: [workspace]
      hidden: [traversal_path]
  SlackWorkspace:
    scope: namespace
    permission: read
    enforce:
      duckdb: {scope_key: traversal_path}
    properties:
      open: [id, name]
      hidden: [namespace_id, traversal_path]
relationships:
  IN_WORKSPACE:
    scope: namespace
    permission: read
    enforce: {duckdb: {scope_key: traversal_path, of: both}}
  INSTALLED_IN:
    scope: namespace
    permission: read
    enforce: {duckdb: {scope_key: traversal_path, of: holder}}
  MENTIONS_ISSUE:
    scope: namespace
    permission: read
    enforce: {duckdb: {scope_key: traversal_path, of: source}}
  DISCUSSES:
    scope: namespace
    permission: read
    enforce: {duckdb: {scope_key: traversal_path, of: source}}
