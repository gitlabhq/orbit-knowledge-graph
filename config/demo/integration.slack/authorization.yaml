kind: authorization
package: integration.slack
entities:
  SlackMessage:
    scope: namespace
    permission: read
    enforce: {live: {scope_key: {via: [IN_WORKSPACE, INSTALLED_IN]}}}
    checks: [{provider: slack, kind: delegated}]
    properties:
      open: [id, workspace, merge_request_id, channel, author, text, sent_at]

  Incident:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}}
    properties:
      open: [id, title, message_id]
      hidden: [traversal_path]

  SlackWorkspace:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path}, live: {scope_key: {via: INSTALLED_IN}}}
    properties:
      open: [id, name, group_id]
      hidden: [traversal_path]
relationships:
  IN_WORKSPACE: {scope: namespace, permission: read, enforce: {}}
  DISCUSSES: {scope: namespace, permission: read, enforce: {}}
  RAISED_IN:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: source}}
  INSTALLED_IN:
    scope: namespace
    permission: read
    enforce: {clickhouse: {scope_key: traversal_path, of: holder}}
