name: list_commands
version: 1.4.0
variables: [commands, catalog]
description: >-
  Orbit is the GitLab Knowledge Graph. It answers code-structure and
  cross-entity questions: callers, definitions, imports, blast radius,
  relationship traversal, joins across entities or projects, and repository
  maps. It also counts, ranks, and groups across MRs, work items, pipelines,
  and projects. One graph query replaces many API calls made in a loop.
  Examples: "who calls X", "what breaks if I change Y", "which MRs touched
  files imported by Z". Use it even when the user does not mention Orbit.
  {% if catalog %}The command catalog is included below as JSON. Call
  invoke_command with a command's name and put the inputs matching its
  input_schema inside invoke_command's parameters.


  Available commands:

  {{ catalog }}{% else %}Call this before invoke_command to get each command's
  input schema.


  Available commands:

  {{ commands }}{% endif %}
