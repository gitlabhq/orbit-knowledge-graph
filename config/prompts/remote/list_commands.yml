name: list_commands
version: 1.5.0
variables: [commands, catalog, relationships]
description: >-
  Orbit is the GitLab Knowledge Graph. It answers code-structure and
  cross-entity questions: callers, definitions, imports, blast radius,
  relationship traversal, joins across entities or projects, and repository
  maps. It also counts, ranks, and groups across MRs, work items, pipelines,
  and projects. One graph query replaces many API calls made in a loop.
  Examples: "who calls X", "what breaks if I change Y", "which MRs touched
  files imported by Z". Use it even when the user does not mention Orbit.
  {% if catalog %}The command catalog is included below as JSON. Call
  invoke_command with a command's name and put the inputs matching its
  input_schema inside invoke_command's parameters.


  Available commands:

  {{ catalog }}{% if relationships %}


  Graph relationships, one (Source)-[:TYPE]->(Target|Target) pattern per
  line. Use these exact node and relationship names without fetching the
  schema. Fetch node properties only for nodes you query whose property
  names you do not know. An unknown property error lists the valid ones.
  Anchor groups and projects by full_path, not name. Resolve a loosely named
  group or project first with full_path CONTAINS 'x' (case-insensitive).
  There is no NOT: query both sets and compare them.


  {{ relationships }}{% endif %}{% else %}Call this before invoke_command to get each command's
  input schema.


  Available commands:

  {{ commands }}{% endif %}
