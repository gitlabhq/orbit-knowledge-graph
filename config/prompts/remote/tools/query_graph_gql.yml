name: query_graph_gql
version: 1.1.0
summary: >-
  Traverse GitLab relationships and code structure with openCypher 9-based syntax:
  callers, imports, blast radius, joins across entity types, grouped counts.
description: >-
  Query GitLab relationships with read-only openCypher 9-based syntax (MATCH ... RETURN).
  Use it for traversals, blast radius, joins, and grouped counts. Use normal
  GitLab tools for one known entity, a plain list or count, or a write.
  Schema: CALL db.schema('NodeName') or CALL db.schema().
  Anchor a node by ID or literal filter. LIMIT isn't a filter.
  Use -[:TYPE]->; max 3 hops. WHERE uses AND. One ORDER BY key.
  LIMIT/PAGE: 1-1000 rows. No OR, general NOT, DISTINCT, count(*), OPTIONAL MATCH,
  WITH or UNION.
