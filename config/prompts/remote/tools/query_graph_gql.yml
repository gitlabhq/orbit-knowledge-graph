name: query_graph_gql
version: 1.8.0
summary: >-
  Traverse GitLab relationships and code structure with openCypher 9-based syntax:
  callers, imports, blast radius, joins across entity types, grouped counts.
description: >-
  Read-only openCypher 9-based syntax (MATCH ... RETURN) over the GitLab
  Knowledge Graph: relationships, blast radius, joins, grouped counts.
  Schema: CALL db.schema() or CALL db.schema('Node').
  Filter at least one node by ID or literal property, within the project
  or group asked about; LIMIT isn't a filter.
  Use -[:TYPE]->, bound repeats *1..3; max 3 hops. WHERE uses AND and NOT on
  one node's properties. Alias aggregates, count(mr) AS n, and ORDER BY the
  alias; one sort key, no tie-breakers. Page: SKIP 0-10000, LIMIT 1-1000.
  No OR, XOR, RETURN DISTINCT, count(*), OPTIONAL MATCH, WITH or UNION.
  count(x) counts rows; count(DISTINCT x) counts distinct values.
