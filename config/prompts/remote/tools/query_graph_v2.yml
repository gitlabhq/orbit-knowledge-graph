name: query_graph_v2
version: 1.0.3
description: >-
  Traverse GitLab relationships and code, join entities, or aggregate groups.
  Use ordinary GitLab tools for single entities, simple lists/counts, and writes.
  First call get_query_dsl for grammar and get_graph_schema for valid names.
  Database text can be capped at 2,048 characters plus " [truncated]", even for
  point lookups. Use the GitLab API for full text.
