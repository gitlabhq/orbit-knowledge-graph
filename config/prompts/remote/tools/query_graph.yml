name: query_graph
version: 1.1.0
summary: >-
  Traverse GitLab relationships and code structure: callers, imports, blast
  radius, joins across entity types, grouped counts.
description: >-
  Query how GitLab entities and code relate: traversals, blast radius, joins
  across entity types, and grouped counts. For one known entity, a plain list
  or count, or a write, use the normal GitLab tools. The DSL grammar alone has
  no real names. Before you write a query, you must call get_graph_schema for
  node, property, and edge names, and get_query_dsl for the grammar.
