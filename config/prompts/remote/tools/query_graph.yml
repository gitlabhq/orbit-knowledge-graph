name: query_graph
version: 1.0.3
summary: >-
  Traverse GitLab relationships and code structure for callers/imports,
  dependencies and blast radius, cross-entity joins, or grouped aggregation.
description: >-
  Traverse GitLab relationships and code, join entities, or aggregate groups.
  Use ordinary GitLab tools for single entities, simple lists/counts, and writes.
  The DSL is structure only: call get_graph_schema with expand_nodes for valid
  names and get_query_dsl for grammar. Text can be capped at 2,048 characters
  plus " [truncated]"; use the GitLab API for full text, even for point lookups.
