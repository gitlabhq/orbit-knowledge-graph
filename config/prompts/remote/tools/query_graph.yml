name: query_graph
version: 1.2.0
summary: >-
  Traverse GitLab relationships and code structure: callers, imports, blast
  radius, joins across entity types, grouped counts.
description: >-
  Query how GitLab entities and code relate: callers, relationship
  traversals, blast radius, joins across entity types, and grouped counts.
  Node, property, and edge names come from get_graph_schema, and the grammar
  from get_query_dsl. Call both before you write a query.
