name: query_graph
version: 1.3.0
summary: >-
  Traverse GitLab relationships and code structure: callers, imports, blast
  radius, joins across entity types, grouped counts.
description: >-
  Query how GitLab entities and code relate: callers, blast radius, and
  relationships and aggregations across users, MRs, work items, pipelines, and
  projects. Counts, ranks, groups, and follows multi-hop chains in one query
  instead of many API calls. Before you write a query, you must call
  get_graph_schema for names and get_query_dsl for the grammar.
