# Base description for the legacy MCP tool surface. The server appends the
# TOON-condensed DSL grammar at runtime (kept for one release cycle, see
# registry.rs).
name: query_graph
version: 1.0.0
summary: Execute permission-aware graph queries over GitLab SDLC and code entities.
description: >-
  Execute graph queries. The DSL below is STRUCTURE ONLY — you MUST call
  get_graph_schema (with expand_nodes) to discover valid node/property/edge
  names. Use get_query_dsl for the full grammar reference.
