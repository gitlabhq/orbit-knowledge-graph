name: reindex
version: 1.0.0
short: Re-index only what changed since the last `orbit index --ff=inc`
description: >-
  Re-index only what changed since the last `orbit index --ff=inc`


  Needs the incremental engine (`--ff=inc`) and a repository that `orbit
  index --ff=inc` has indexed before; its state lives under
  `~/.gitlab/orbit/var/<project>/`. Changed files come from git: commits
  since the indexed one, plus uncommitted and untracked changes. Returns
  JSON with the per-language work done.
