name: workspace
version: 1.2.0
short: Index and query the local code graph built from your checkouts
description: >-
  Index and query the local code graph built from your checkouts


  `grep` and `context` index the working tree on their own, so agents rarely
  need these commands. Use `index` from hooks or scripts to warm the graph.
  `sql` and `schema` run read-only DuckDB queries, and `list` shows what is
  indexed. `reset` deletes
  the graph so the next index starts from nothing.
