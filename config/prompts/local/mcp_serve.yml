name: mcp_serve
version: 1.1.0
short: Serve the local graph to MCP-compatible AI agents
description: >-
  Serve the local graph to MCP-compatible AI agents


  Plug into editors that support MCP, such as Claude Code, Cursor, OpenCode, or
  Codex. The agent can then call `run_sql`, `get_graph_schema`, and `index`.
