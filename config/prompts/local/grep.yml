name: grep
version: 2.5.0
short: Search every line in local code, tests, config, and docs
description: >-
  Search every line in local code, tests, config, and docs, like ripgrep.
  Matching ignores case, `_`, and `-`; quote `a|b|c` for OR alternatives.
  Output follows rg's heading layout: each file's path once, then `line:text` for each match.
  A `line-» Kind name:start-end ←callers →callees` line precedes the matches inside each definition,
  ending with `also name in path:line` for same-name definitions outside the results.
  More than 20 files get a `»` index by directory first.
  Import lines get `line-» imports ...`, and other code gets `line-» outside indexed definitions`.
  Lines print in full; -m caps matches per file and -M caps line width.
  A missing path searches tracked paths with the same last segment.
  A scoped search with no matches widens one directory at a time and says so.
  Files that define a term come first,
  then code, tests, and config or docs. A definition the query names prints
  first with its source. Pass paths as with rg; rg and grep flags such as
  -A, -l, -w, and -g work.
  Qualifiers in the query, as in GitHub search: `is:` picks what to search
  (`is:def`, `is:class`, `is:method`, `is:file`, `is:dir`, and on GitLab
  `is:issue`, `is:mr`, `is:branch`, `is:commit`, `is:comment`); the other words are
  the search. `symbol:x` finds definitions named x, `file:x` keeps paths containing
  x (alone it lists them), `ext:rs` and `lang:py` filter files as rg -g and -t do,
  and `repo:group/project` searches that GitLab project. `-F` reads the query
  literally.
  A plain search without paths or file filters also searches the GitLab project
  behind `origin`. Its work items, merge requests, commits, notes, and milestones
  print after local results, with tokens for `context`. Name a GitLab project,
  group, URL, `Project[id]`, or `Group[id]` as a path to search it instead,
  including its code when it has no local checkout. An indexed checkout of that
  project is searched locally.
  `is:issue`, `is:mr`, `is:commit`, `is:comment`, and `is:milestone` search only
  GitLab. `is:branch` finds branches by words from their names, with their merge
  requests and pipelines.
