name: grep
version: 2.0.0
short: Search every line in local code, tests, config, and docs
description: >-
  Search every line in local code, tests, config, and docs, like ripgrep.
  Matching ignores case, `_`, and `-`; quote `a|b|c` for OR alternatives.
  Output has one row per file with every matching line in full, labeled with its
  enclosing definition. Files that define a term come first, then code, tests,
  and config or docs. The top definition's source follows. Omit the query with
  `--path` to list definitions.
