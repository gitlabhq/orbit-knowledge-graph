name: grep
version: 2.2.0
short: Search every line in local code, tests, config, and docs
description: >-
  Search every line in local code, tests, config, and docs, like ripgrep.
  Matching ignores case, `_`, and `-`; quote `a|b|c` for OR alternatives.
  Output follows rg's heading layout: each file's path once, then `line:text`
  for each match, with `line-» Kind name:start-end ←callers →callees` before
  the matches inside each definition. Files that define a term come first,
  then code, tests, and config or docs. A definition the query names prints
  first with its source. Pass paths as with rg; rg and grep flags such as
  -A, -l, -w, and -g work. `--kind` takes definition kinds such as
  `Class,Method`, or `File` and `Directory` to list where matches are.
