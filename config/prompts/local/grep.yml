name: grep
version: 1.8.0
short: Search local definition names, paths, and bodies
description: >-
  Search local definition names, paths, and bodies.


  One query per call. Quote `a|b|c` for OR alternatives.
  OR matches keep their best alternative score, without a bonus for matching
  more alternatives. This is not regex syntax; each alternative needs search terms.


  Returns ranked `Definition:<id>` references. Identifier alternatives report
  exact hits and exact misses separately. Each search previews up to three
  exact-name hits, or the top related match if none are exact, within 120 source
  lines. Repeated previews and overlapping source print once per invocation.
  Output is already bounded; never pipe it through `head` or `tail`. Use the
  printed `next:` command to batch relevant IDs in context for complete source
  and indexed relationships.
