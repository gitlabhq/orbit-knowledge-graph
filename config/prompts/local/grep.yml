name: grep
version: 1.9.0
short: Search local definition names, paths, and bodies
description: >-
  Search local definition names, paths, and bodies.


  One query per call. Quote `a|b|c` for OR alternatives. DuckDB FTS requires all
  searchable terms in each alternative and orders by BM25. OR matches keep
  their best alternative score, without a bonus for matching more alternatives.
  This is not regex syntax; each alternative needs search terms.


  Returns ranked `Definition:<id>` references. Identifier alternatives report
  case-insensitive exact symbol-name hits and misses within the selected scope,
  before the result limit; these labels do not affect ranking. Each search
  previews up to three returned exact-name hits, or its first name/path match
  if none are exact, within 120 source lines. Body-only mentions remain listed
  without automatic source or context suggestions; request their IDs explicitly
  with context to read them. Repeated previews and overlapping source print once
  per invocation. The printed `next:` command adds indexed relationships and
  complete source, repeating previewed lines. Narrow with --path/--kind or raise
  --limit instead of piping output through `head` or `tail`.
