name: grep
version: 1.6.0
short: Search local definition names, paths, and bodies
description: >-
  Search local definition names, paths, and bodies.


  Returns ranked `Definition:<id>` references and up to 120 source lines across
  the top three matches, without repeating overlapping lines. Larger bodies
  appear as outlines with followable IDs. Use `--path` or `--kind` to narrow
  results, then batch needed references in context for complete source and
  indexed relationships.
