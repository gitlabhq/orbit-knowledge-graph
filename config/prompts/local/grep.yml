name: grep
version: 1.14.0
short: Search local definition names, paths, and bodies
description: >-
  Search local definition names, paths, and bodies with one query: quote `a|b|c` for OR
  alternatives, each requiring all searchable terms.
  Single tokens must also match literally, ignoring case; this is FTS, not regex.
  Results rank exact names before name/path hits and body mentions; pass a
  printed name or `path:start-end` to `context` for source and relationships.
  A Mentions section then lists matching lines in config, templates, and docs.
