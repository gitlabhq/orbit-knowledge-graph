name: grep
version: 2.2.0
short: Search every line in local code, tests, config, and docs
description: >-
  Search every line in local code, tests, config, and docs, like ripgrep.
  Matching ignores case, `_`, and `-`; quote `a|b|c` for OR alternatives.
  Each file is one row with its matching lines grouped under their enclosing
  `Kind name:start-end ←callers →callees`. Files that define a term come first,
  then code, tests, and config or docs. A definition the query names prints
  first with its source. Pass paths as with rg; rg and grep flags such as
  -A, -l, -w, and -g work. `--kind` takes definition kinds such as
  `Class,Method`, or `File` and `Directory` to list where matches are.
  A plain search without paths or file filters also searches the GitLab project
  behind `origin`. Its work items, merge requests, commits, notes, and milestones
  print after local results, with tokens for `context`. Name a GitLab project,
  group, URL, `Project[id]`, or `Group[id]` as a path to search it instead. An
  indexed checkout of that project is also searched locally.
  `--kind MergeRequest,WorkItem` searches only GitLab.
