name: run_sql
version: 1.1.0
short: Run a read-only SQL query against the local DuckDB graph
description: >-
  Run a read-only SQL query against the local DuckDB graph


  Accepts an array of DuckDB SQL statements. Each runs in order, and its rows
  land at the same index of the result array. Call `get_graph_schema` first if
  you do not know the tables. Orbit rejects large result sets, so add `LIMIT`
  or narrow the projection.
