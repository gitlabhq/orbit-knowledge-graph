name: index
version: 1.2.0
short: Index a code repository into the local graph
description: >-
  Index a code repository into the local graph


  Pass a repository path, or a directory that holds several repositories.
  Each one is indexed into the workspace DuckDB. Indexing takes seconds to
  minutes, so call it sparingly. `SELECT * FROM _orbit_manifest` via `run_sql`
  shows what is already indexed. A terminal shows progress; other output is
  JSON graph statistics.
