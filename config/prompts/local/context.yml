name: context
version: 1.7.0
short: Expand local code context
description: >-
  Expand local code context.


  Batch file paths, `File:<id>`, or `Definition:<id>`. Files return definition
  maps; Definitions return complete source. Both include every indexed
  connection, with tests in their own section. Reuse source; never truncate
  output. Raw reads are only for non-code or source Orbit cannot provide.
