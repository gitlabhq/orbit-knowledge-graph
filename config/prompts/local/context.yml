name: context
version: 1.14.0
short: Expand local code context and GitLab entities
description: >-
  Expand local code context and GitLab entities.


  Batch file paths, `path:start-end` line ranges, directories, names, and the
  `Definition:<id>` or `File:<id>` that grep prints. GitLab targets use what
  GitLab shows, as `grep` prints them: `mr:42`, `issue:7`, `branch:name`,
  `pipeline:123`, `job:456`, `commit:0123abc`, or a GitLab URL. They resolve in
  the `origin` project; `repo:group/project` names another, and `mr:group/project!42`
  names one per target. Code targets read the local index, including another
  indexed checkout that owns the ID. Merge requests and issues return their
  description, comments and review threads, and for merge requests the changed
  files and failed CI jobs. A branch reads its merge request, or its latest
  pipeline when it has none. Pipelines list failed jobs, and jobs show their
  logs; commits show their message, changed files, and merge requests.
  With no targets at all it reads the current branch. Files and line ranges
  return numbered source with the indexed callers of the definitions shown
  and the test files that cover them.
  Ranges widen so no definition is cut in half.
  Directories list indexed files with definition counts. Choose a Definition ID for complete source and its indexed
  connections. Test connections appear in their own section. Reuse source; never
  truncate output. Raw reads are only for non-code or source Orbit cannot provide.
