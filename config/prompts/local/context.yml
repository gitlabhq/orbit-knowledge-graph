name: context
version: 1.10.0
short: Expand local code context and GitLab entities
description: >-
  Expand local code context and GitLab entities.


  Batch file paths, `path:start-end` line ranges, directories, `File:<id>`, or
  `Definition:<id>`. Add GitLab references such as `MergeRequest[42]`, `Issue[7]`,
  `group/project!12`, `!12`, or a GitLab URL. Code targets read the local index,
  including another indexed checkout that owns the ID. GitLab references return
  entity context after the local output. Files return compact definition maps with every followable
  ID and up to ten connections per section, with omitted counts. Line ranges
  return those numbered lines with the definitions they touch; directories list
  indexed files with definition counts. Choose a Definition ID for complete source and its indexed
  connections. Test connections appear in their own section. Reuse source; never
  truncate output. Raw reads are only for non-code or source Orbit cannot provide.
