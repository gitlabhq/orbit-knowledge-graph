name: uninstall
version: 1.2.0
short: Remove what `orbit setup` wrote into AI coding agents
description: >-
  Remove what `orbit setup` wrote into AI coding agents


  Removes the instruction section, hooks, MCP server entry, and skill files
  that `orbit setup` wrote. A picker lists the detected agents that have Orbit installed; `--yes`
  skips it.
  Skill directories are removed only when `orbit setup` recorded them and they are unchanged, and only once no other selected or remaining agent still uses them. The `orbit-cli` skill from earlier releases is removed too, keeping files you added or edited. Other files you edited after setup are kept, with their `.orbit-backup` copies.
  Targets user-global configuration unless `--project` or `--dir` is given.
