name: setup
version: 1.1.0
short: Configure AI coding assistants to consult the graph
description: >-
  Configure AI coding assistants to consult the graph


  Detects the assistants installed on this machine from their configuration
  directories, pre-selects them in a short picker, shows what will change,
  and asks once. Each assistant gets the managed instruction section, the
  Orbit skill files, and nudge hooks where the assistant supports them.
  Pass `--mcp` to also register the `orbit` MCP server. `--skip` leaves a
  component out. Name assistants to pre-select only those, or pass `--all`
  for every supported assistant.
  Targets user-global configuration by default, or the project with
  `--project` or `--dir`. Existing files get a one-time `.orbit-backup`
  sibling before the first change. Re-running updates everything in place.
  `--yes` skips the wizard and applies the defaults; `--dry-run` stops before
  writing. `orbit uninstall` reverts it.
