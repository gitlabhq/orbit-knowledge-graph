name: setup
version: 1.5.0
short: Configure AI coding agents to consult the graph
description: >-
  Configure AI coding agents to consult the graph


  Detects the agents installed on this machine and gives each one the Orbit
  instruction section, hooks, skill, and agent plugins. The agent plugins show
  Orbit calls in Claude Code and OpenCode. A picker lists the detected agents, then asks
  about the agent plugins; `--yes` skips both and takes the defaults. `--skip`
  leaves a component out, and `--install mcp` also registers the MCP server. The skill is always
  named `orbit`. By default it is a wrapper that loads the real skill when the
  agent reads it. With `--skill full` it holds the skill files themselves. Duo gets that form
  unless `--skill wrapper` says otherwise, which warns that Duo cannot run it. A later run keeps the installed form unless `--skill` says otherwise. Inside a Git
  repository it then indexes the repository; `--no-index` skips that.
  Writes user-global configuration unless `--project` or `--dir` is given.
  Existing files get a one-time `.orbit-backup` sibling, and an `orbit` skill
  directory that setup did not write, or that changed since, is moved to `orbit.orbit-backup`. Re-running updates
  in place. `orbit uninstall` reverts it.
