name: setup
version: 1.2.0
short: Configure AI coding agents to consult the graph
description: >-
  Configure AI coding agents to consult the graph


  Detects the agents installed on this machine and gives each one the Orbit
  instruction section, hooks, and skill. A picker pre-selects the detected
  agents; `--yes` skips it. `--mcp` also registers the MCP server. Writes
  user-global configuration unless `--project` or `--dir` is given.
  Existing files get a one-time `.orbit-backup` sibling. Re-running updates
  in place. `orbit uninstall` reverts it.
