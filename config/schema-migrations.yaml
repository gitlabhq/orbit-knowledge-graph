# yaml-language-server: $schema=schemas/schema-migrations.schema.json
#
# One entry per SCHEMA_VERSION bump, newest first (prepended by `mise schema:bump`).
# Each entry declares how much of the graph a given version invalidates:
#   scope: "*"    full rebuild (fail-safe; the default for anything unmapped)
#   scope: sdlc   SDLC-sourced tables; optional `entities:` narrows to a subset
#   scope: code   the code-graph tables (Definition, File, Directory, Branch,
#                 ImportedSymbol) and their edge table
#   scope: none   re-index NOTHING; the source text changed but the produced
#                 output is byte-identical. Requires a `note:` certifying
#                 output-neutrality. This deliberately bypasses the
#                 under-declaration guard, so the note is mandatory and audited.
#
# Humans may WIDEN an entry (scope or entities), never narrow it below the
# drift detected from the fingerprint snapshot — CI enforces this, except for a
# note-gated `scope: none` entry, the certified output-neutral escape hatch. A
# version with no entry is treated as "*", which also makes pruning old entries safe.
migrations:
- version: 116
  scope: none
  note: >-
    Terminal values on CI and security scan states now list only states a row never
    leaves; query metadata only, no table changes.
- version: 115
  scope: "*"
  note: >-
    Makes every node time column non-nullable and stores a null time as the epoch,
    so the temporal minmax table setting indexes all 76 of them; the 25 explicit time
    minmax lines go and Date32 columns default to 1970-01-01. The job failure_reason
    set index widens from 32 to 64 to cover its 46 declared values plus the empty
    default. DDL changes on 23 tables; null times are rewritten to the epoch on
    re-index.
- version: 114
  scope: none
  note: "Declares the measured scope on twenty edge variants and an id traversal_path lookup on every path-scoped node, 31 in all. Query-planner metadata only: the compiler prunes with it, the indexer never reads it, so no table DDL or indexed row changes."
- version: 113
  scope: "*"
  note: "Adds skip indexes measured at group scope on 2026-10-22: set on security_scan.status, job.failure_reason and vulnerability_occurrence.report_type; bloom on merge_request.iid and work_item.iid; text on merge_request_diff.head_commit_sha so prefix searches prune; minmax on note.created_at. DDL changes on seven tables; no indexed row changes."
- version: 112
  scope: none
  note: >-
    The MergeRequest extract finds its page keys first, in a materialized CTE, and
    joins metrics, reviewers and approvals only for those keys instead of the whole
    window; on prod data it returns the same rows as before (the version kept for the
    last MR of a page was already arbitrary), so no indexed row changes.
- version: 111
  scope: "*"
  note: "Adds a minmax skip index on _deleted to every versioned table so a pre-pick filter can carry OR _deleted and still prune tombstone-free granules. Drops the unique marks on Label.title and Milestone.title (titles repeat across projects) and the mutable: false marks on code-graph commit_sha and File.size_bytes (ids do not include the commit). Full rebuild so the index files exist for every part."
- version: 110
  scope: none
  note: >-
    Ontology marks User.username, User.email, Project.full_path, Group.full_path,
    Label.title and Milestone.title as unique so the query planner treats an equality
    on them as a point lookup; no table DDL or indexed row changes.
- version: 109
  scope: "*"
  note: Forces a full re-index to backfill existing graph rows.
- version: 108
  scope: none
  note: >-
    AgentSession pages by its table sort key (traversal_path, session_started_at,
    id) instead of (traversal_path, id); only extract page order changes, so every
    indexed row is byte-identical.
- version: 107
  scope: "*"
  note: >-
    Drops auto_statistics_types from every table. Loading the statistics cost
    250-1050 ms per query with no better plans; a full rebuild creates the tables without
    them (a clone would copy the old SETTINGS).
- version: 106
  scope: "*"
- version: 105
  scope: "*"
  note: >-
    Registers the AgentSession node and the CREATED_MR edge in schema.yaml. The
    scope deriver widens any schema.yaml change to a full rebuild, so no narrower scope
    is accepted.
- version: 104
  scope: "*"
- version: 103
  scope: none
  note: >-
    The internal result column prefix changes from _gkg_ to _orbit_. The prefix
    names only query-time result aliases; no table column, extract SQL, transform
    output, or DDL uses it, so every indexed row is byte-identical.
- version: 102
  scope: none
  note: >-
    Adds the hidden flag to traversal_path on 30 nodes. The flag is read only by
    the client-facing schema, wildcard column, and error-candidate surfaces; extract
    SQL, transform output, and DDL are unchanged, so every indexed row is
    byte-identical.
- version: 101
  scope: "*"
  note: >-
    Text and ngram skip indexes are keyed on lower(column) and every path index
    tokenizes on splitByNonAlpha, so string operators are indexed and case-insensitive.
    ATTACH PARTITION FROM rejects parts whose skip-index definitions differ, so a
    clone cannot carry them and every table rebuilds.
- version: 100
  scope: "*"
  note: >-
    checkpoint gains attempts and indexed_at, and code_indexing_checkpoint gains
    attempts and is_default_branch with a nullable indexed_at, for indexing status. A
    clone keeps the old columns, so every table rebuilds.
- version: 99
  scope: none
  note: >-
    Adds the CALLS File -> ImportedSymbol variant that the code indexer already
    emits for top-level calls to unresolved imports. Indexed rows are byte-identical;
    the variant only declares existing edges so query validation can check relationship
    endpoints.
- version: 98
  scope: none
  note: >-
    Dropped the unused traversal_path_lookup.dictionary annotation from Project and
    Group (MR !2539); DDL and produced rows are byte-identical.
- version: 97
  scope: none
  note: >-
    Outer ORDER BY on the lookup extracts (generated and the two authored
    templates) so pages stream in sort-key order; extracted rows and graph rows remain
    byte-identical.
- version: 96
  scope: none
  note: >-
    MergeRequestDiffFile lookup CTE collapses the parent diff's datalake versions
    to the latest one (argMax, GROUP BY id) instead of joining every unmerged version.
    Each output row is one of the rows the previous join already produced, and the
    survivor among duplicate rows is now deterministic instead of insertion-order
    dependent, so no re-index is needed.
- version: 95
  scope: none
  note: "cosmetic: normalize auxiliary table codec casing to match canonical PascalCase"
- version: 94
  scope: "*"
  note: >-
    Versioned tables declare enable_block_number_column and
    enable_block_offset_column so every row carries a unique persisted block identity for patch-part
    deletes; a full rebuild is required because attached parts keep foreign block numbers
- version: 93
  scope: "*"
  note: >-
    gl_definition drops search_text and token_count; local ranked search now
    derives a gl_def_doc document table and a DuckDB FTS (BM25) index, and remote text
    recall is delegated to orbit-next instead of ClickHouse columns
- version: 92
  scope: "*"
  note: >-
    gl_definition gains search_text and token_count columns (write-time tokenized
    identifier text for ranked search); code tables re-derive to populate them
- version: 91
  scope: "*"
  note: >-
    Use _siphon_replicated_at for deterministic Siphon state resolution while
    preserving _siphon_watermark for incremental windows.
- version: 90
  scope: none
  note: >-
    serde_yaml was replaced with serde-saphyr; source fingerprints now hash
    canonical JSON instead of re-rendered YAML. Ontology sources and generated DDL are
    byte-identical; only the fingerprint algorithm changed.
- version: 89
  scope: none
  note: >-
    MergeRequestDiffFile extract rewritten from bare INNER JOIN to CTE + IN-list.
    Output is byte-identical in production because both
    siphon_merge_request_diff_files and siphon_merge_request_diffs carry the same traversal_path for related
    records.
- version: 88
  scope: none
  note: >-
    Marks 13 edge mappings mutable so the stale-edge sweep reconciles them. The
    flag is read only by the sweep's group derivation; extract SQL, transform output and
    DDL are untouched, so every indexed row is byte-identical.
- version: 87
  scope: "*"
  note: >-
    Project/Group extract collapses its traversal-path join with argMax, so a
    transferred entity indexes once at its current path instead of once per historical
    path; rebuild drops the already-written stale-path duplicates.
- version: 86
  scope: "*"
  note: "HAS_VULNERABILITY extract switched to LEFT JOINs from _batch so paging keys on driver-row cardinality (#1064); windows skipped by the old INNER JOINs must backfill. Deriver widens a .sql.j2 edge change to '*'."
- version: 85
  scope: sdlc
  entities:
  - HAS_VULNERABILITY
  note: >-
    New HAS_VULNERABILITY edge (Package->Vulnerability); clone carries every prior
    table intact and only this edge re-derives.
- version: 84
  scope: none
  note: >-
    isValidUTF8 guard on decoded_sha; a no-op for every value already written
    (raw-binary SHAs previously failed the decode and produced no row), so no indexed row
    changes.
- version: 83
  scope: none
  note: >-
    Source-owned base projections and independent stage compilation preserve all 47
    serialized plans byte-identically.
- version: 82
  scope: none
  note: >-
    Extract lookups and transform property bindings expand independently from node
    enrichment_props; graph rows remain byte-identical.
- version: 81
  scope: none
  note: >-
    MR !1931 pipeline/.sql.j2 restructuring plus indexer.reindex explicit-list
    unification; DDL and reindex_sources() output byte-identical.
- version: 80
  scope: "*"
  note: ledger introduced; earlier versions implicitly "*"
