grpc_bind_address: "127.0.0.1:50054"
jwt_clock_skew_secs: 60
probe_server: {}

nats:
  url: "localhost:4222"
  connection_timeout_secs: 10
  request_timeout_secs: 5
  ack_wait_secs: 300
  max_deliver: 5
  subscription_buffer_size: 100
  batch_size: 10
  auto_create_streams: true
  stream_replicas: 1
  stream_max_age_secs: 14400
  fetch_expires_secs: 5
  consumer_inactive_threshold_secs: 3600
  release_gc_idle_threshold_secs: 3600

datalake:
  url: "http://127.0.0.1:8123"
  database: default
  username: default
  compatibility: "26.6"
  replicated: false
  session_settings:
    # Must stay 0 to avoid a ClickHouse 26.6 bug that skips the Siphon watermark index and scans whole tables.
    use_skip_indexes_on_data_read: "0"
  insert_settings: {}
  profiling:
    enabled: false
    explain: false
    query_log: false
    processors: false
    instance_health: false

graph:
  url: "http://127.0.0.1:8123"
  database: default
  username: default
  compatibility: "26.6"
  replicated: false
  session_settings:
    max_query_size: "10485760"
    distributed_cache_discard_connection_if_unread_data: "0"
    use_text_index_postings_cache: "1"
  insert_settings:
    optimize_on_insert: "0"
    async_insert: "1"
    wait_for_async_insert: "1"
    async_insert_busy_timeout_min_ms: "1000"
    async_insert_busy_timeout_max_ms: "1000"
  profiling:
    enabled: false
    explain: false
    query_log: false
    processors: false
    instance_health: false

gitlab:
  jwt: {}

tls:
  internal:
    enabled: false

clickhouse_setup:
  admin_username: default

engine:
  concurrency_groups: {}
  topics: {}
  modules: [sdlc, code, namespace_deletion]
  datalake_retry:
    halving_initial_block_size: 100000
    halving_min_block_size: 1024
  handlers:
    entity-handler:
      system_notes_resolve_lookup_batch_size: 1000
      batch_size_overrides: {}
    code-indexing-task:
      pipeline:
        max_file_size_bytes: 5000000
        max_files: 1000000
        max_total_bytes: 2000000000
        max_repository_files: 2000000
        source_memory_budget_bytes: 67108864
        source_compress_spill: false
        worker_threads: 0
        max_concurrent_languages: 0
        per_file_timeout_ms: 2000
        per_file_parse_timeout_ms: 100
        per_file_walk_timeout_ms: 100
        per_file_ssa_timeout_ms: 100
        cross_file_resolve_timeout_ms: 180000
        max_tree_depth: 4096
        max_cross_file_names: 40000000
        max_manifest_bytes: 67108864
        max_file_edges: 2000000
        job_timeout_secs: 1500
        fetch_concurrency: 10
        archive_storage_budget: 4
        archive_tenant_budget: 8
        archive_lease_ttl_secs: 30
        archive_lease_max_wait_secs: 30
        write_slice_rows: 1000000
        write_max_concurrent: 8
        small_repo_max_files: 650

schedule:
  tasks:
    global:
      cron: "0 */1 * * * *"
      run_timeout_secs: 300
    namespace:
      cron: "*/30 * * * * *"
      run_timeout_secs: 600
      sweep_interval_secs: 3600
    siphon:
      events_stream_name: "siphon_stream_main_db"
      batch_size: 100
    code-backfill:
      cron: "0 */1 * * * *"
      run_timeout_secs: 3600
      publish_window: 200000
      stale_sweeps_per_tick: 10
    table-cleanup:
      cron: "0 0 3 * * 0"
      run_timeout_secs: 7200
    namespace-deletion:
      cron: "0 0 3 * * *"
      run_timeout_secs: 43200
    migration-completion:
      cron: "0 */1 * * * *"
      run_timeout_secs: 3600
    stale-edge-reconciliation:
      cron: "0 */30 * * * *"
      run_timeout_secs: 3600
      lookback_secs: 3600
    namespace-freshness:
      cron: "0 */5 * * * *"
      run_timeout_secs: 1800
    graph-stats:
      cron: "0 30 4 * * *"
      run_timeout_secs: 1800

health_check:
  bind_address: "0.0.0.0:4201"
  targets: []

grpc:
  keepalive_interval_secs: 20
  keepalive_timeout_secs: 20
  tcp_keepalive_secs: 60
  connection_window_size: 2097152
  stream_window_size: 1048576
  concurrency_limit: 256
  max_connection_age_secs: 300      # 5 min, for L4 ILB rebalancing; null turns it off (behind the Orbit Gateway)
  max_connection_age_grace_secs: 30 # graceful drain window; paired with max_connection_age_secs to avoid tonic 0.14.5 panic (hyperium/tonic#2522)
  stream_timeout_secs: 60
  max_header_list_size_bytes: 65536 # 64 KiB; tonic/hyper default of 16 KiB is too small for GitLab JWTs carrying many traversal IDs
  result_chunk_bytes: 524288
  max_result_bytes: 67108864

query:
  default:
    max_execution_time: 30
    max_ast_elements: 1000000
    max_expanded_ast_elements: 10000000
    max_ast_depth: 10000
    use_query_cache: true
    query_cache_ttl: 10

metrics:
  expanded_logs:
    global_override: true
    root_namespace_ids: []
  otel:
    enabled: false
    endpoint: "http://localhost:4317"
  prometheus:
    enabled: false

schema:
  max_retained_versions: 2
  version_poll_interval_secs: 5
  indexer_schema_wait_timeout_secs: 300

analytics:
  enabled: null
  collector_url: ""
  local_collector_url: ""
  deployment:
    type: self_managed
    environment: development

billing:
  enabled: false
  collector_url: "http://localhost:9090"
  auth_mode: oidc
  quota:
    enabled: false
    customers_dot_url: "http://localhost:5000"
    auth_mode: admin_token
    request_timeout_ms: 1000
    fallback_cache_ttl_secs: 3600

features: {}

# Static credentials are Option fields meant for secret files:
# /etc/secrets/object_storage/secret_access_key, /etc/secrets/object_storage/service_account_key.
object_storage:
  enabled: false
  provider: s3
  bucket: ""
  prefix: ""
  auth: identity
  path_style: false
  allow_http: false
