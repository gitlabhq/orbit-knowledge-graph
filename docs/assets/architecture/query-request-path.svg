<text x="435" y="-128" font-size="19" font-weight="600" fill="#a8a7af" text-anchor="middle" dominant-baseline="central">redaction</text>
<text x="0" y="78" font-size="27" font-weight="650" fill="#FC6D26" text-anchor="middle" dominant-baseline="central">Caller</text>
<text x="0" y="112" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">Agent, CLI,</text>
<text x="0" y="138" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">or REST</text>
<text x="290" y="78" font-size="27" font-weight="650" fill="#E24329" text-anchor="middle" dominant-baseline="central">GitLab</text>
<text x="290" y="112" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">Checks who</text>
<text x="290" y="138" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">is asking</text>
<text x="580" y="90" font-size="27" font-weight="650" fill="#6B4DB6" text-anchor="middle" dominant-baseline="central">Orbit</text>
<text x="580" y="124" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">Compiles</text>
<text x="580" y="150" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">secure SQL</text>
<text x="870" y="78" font-size="27" font-weight="650" fill="#3B82F6" text-anchor="middle" dominant-baseline="central">ClickHouse</text>
<text x="870" y="112" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">Runs one</text>
<text x="870" y="138" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">bounded query</text>
<text x="1160" y="78" font-size="27" font-weight="650" fill="#14B8A6" text-anchor="middle" dominant-baseline="central">Response</text>
<text x="1160" y="112" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">Only rows the</text>
<text x="1160" y="138" font-size="19" font-weight="450" fill="#8f8e96" text-anchor="middle" dominant-baseline="central">caller may see</text>
