# Generated by `cargo xtask alerts` in gitlab-org/orbit/knowledge-graph
# from docs/dev/runbooks/alerts/*.md - do not edit, update the playbooks and regenerate.
groups:
- name: gkg-alerts
  rules:
  - alert: GKGAllowlistRejectedBurst
    expr: sum by (env, environment, stage) (rate(gkg_query_engine_compiler_rejected_total{failure_reason=~"ontology|ontology_internal"}[5m])) * 60 > 5
    for: 5m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGAllowlistRejectedBurst.md
      summary: Sustained ontology-allowlist violations, above 5 per minute; schema drift or an enumeration attempt.
  - alert: GKGAuthFilterMissing
    expr: sum by (env, environment, stage) (rate(gkg_query_engine_compiler_rejected_total{failure_reason="security"}[5m])) > 0
    for: 1m
    labels:
      severity: s2
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGAuthFilterMissing.md
      summary: A query reached the compiler without a valid security context; the compiler rejected it, but this path means authorization filtering would have been bypassed.
  - alert: GKGAuthorizationFailureRate
    expr: sum by (env, environment, stage) (rate(gkg_query_pipeline_failed_total{failure_reason="authorization"}[5m])) * 60 > 1
    for: 5m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGAuthorizationFailureRate.md
      summary: The Rails authorization exchange is failing, above 1 failure per minute; redaction callbacks are not completing.
  - alert: GKGCircuitBreakerOpen
    expr: sum by (env, environment, stage) (rate(gkg_circuit_breaker_state_transitions_total{to="open"}[5m])) > 0
    for: 1m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGCircuitBreakerOpen.md
      summary: A circuit breaker opened; an external dependency is unreachable and calls to it are being shed.
  - alert: GKGCircuitBreakerRejectRateHigh
    expr: sum by (env, environment, stage) (rate(gkg_circuit_breaker_calls_rejected_total[5m])) * 60 > 10
    for: 5m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGCircuitBreakerRejectRateHigh.md
      summary: A circuit is open and shedding significant traffic, above 10 rejected calls per minute.
  - alert: GKGExecutionFailureRate
    expr: sum by (env, environment, stage) (rate(gkg_query_pipeline_failed_total{failure_reason="execution"}[5m])) * 60 > 1
    for: 5m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGExecutionFailureRate.md
      summary: ClickHouse query execution is failing, above 1 failure per minute.
  - alert: GKGPipelineInvariantViolated
    expr: sum by (env, environment, stage) (rate(gkg_query_engine_compiler_rejected_total{failure_reason=~"lowering|enforcement|codegen|pipeline"}[5m])) > 0
    for: 1m
    labels:
      severity: s2
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGPipelineInvariantViolated.md
      summary: The query compiler reached a state that upstream validation should have prevented; the generated SQL could have been incorrect.
  - alert: GKGPipelineLatencyP95High
    expr: histogram_quantile(0.95, sum by (env, environment, stage, le) (rate(gkg_query_pipeline_duration_seconds_bucket[5m]))) > 5
    for: 10m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGPipelineLatencyP95High.md
      summary: p95 end-to-end query pipeline latency is above 5 seconds for 10 minutes.
  - alert: GKGPipelinePostCompileErrorRateHigh
    expr: |-
      sum by (env, environment, stage) (rate(gkg_query_pipeline_queries_total{status!~"ok|compile_error"}[5m]))
        / sum by (env, environment, stage) (rate(gkg_query_pipeline_queries_total{status!="compile_error"}[5m])) > 0.01
    for: 5m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGPipelinePostCompileErrorRateHigh.md
      summary: Post-compile failure rate is above 1%, isolating server-side reliability from client-input quality.
  - alert: GKGQueryingErrorRateHigh
    expr: |-
      sum by (env, environment, stage) (rate(gkg_query_pipeline_queries_total{status!="ok"}[5m]))
        / sum by (env, environment, stage) (rate(gkg_query_pipeline_queries_total[5m])) > 0.05
    for: 5m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGQueryingErrorRateHigh.md
      summary: Aggregate query error rate across all failure modes is above 5% for 5 minutes (the availability SLI).
  - alert: GKGSecurityRejected
    expr: sum by (env, environment, stage) (rate(gkg_query_pipeline_failed_total{failure_reason="security"}[5m])) > 0
    for: 5m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGSecurityRejected.md
      summary: The query pipeline is rejecting requests for invalid or missing security context.
  - alert: GKGValidationFailedBurst
    expr: sum by (env, environment, stage) (rate(gkg_query_engine_compiler_rejected_total{failure_reason=~"parse|schema|reference|pagination"}[5m])) * 60 > 10
    for: 5m
    labels:
      severity: s3
      team: context_systems
      type: orbit
    annotations:
      runbook_url: https://gitlab.com/gitlab-org/orbit/knowledge-graph/-/blob/main/docs/dev/runbooks/alerts/GKGValidationFailedBurst.md
      summary: Sustained burst of structural validation failures, above 10 per minute; a broken client or someone probing the API.
