mission: Give every AI agent and every engineer on GitLab a fast, correct map of their code and their software delivery data.
people:
  - username: michaelangeloio
    name: Michael Angelo Rivera
    title: Orbit Engineering Lead
    bio: Started GitLab Orbit to give agents the context that senior engineers carry in their heads. Leads engineering and owns the roadmap with Product.
