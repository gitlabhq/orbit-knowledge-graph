principles:
  - title: Everyone ships
    text: Every person on the team writes code, including Product and Design.
  - title: More than one hat
    text: Each of us works toward the end goal, even when the work is outside our job title.
  - title: Built for agents
    text: We design every feature for AI agents first, then for people.
  - title: Small and fast
    text: We stay small, listen to customers, and change direction fast when we learn something new.
