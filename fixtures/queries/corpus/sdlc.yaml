q21:
  desc: "MR reviewers per project"
  category: aggregation
  suite: sdlc
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "mr",
          "entity": "MergeRequest",
          "filters": {
            "state": {"in": ["opened", "closed", "merged"]}
          }
        },
        {
          "id": "reviewer",
          "entity": "User"
        },
        {
          "id": "p",
          "entity": "Project"
        }
      ],
      "relationships": [
        {
          "type": "REVIEWER",
          "from": "reviewer",
          "to": "mr"
        },
        {
          "type": "IN_PROJECT",
          "from": "mr",
          "to": "p"
        }
      ],
      "group_by": ["p"],
      "aggregations": [
        {
          "count": "reviewer",
          "as": "reviewer_count"
        }
      ],
      "limit": 15
    }
  opencypher: |
    MATCH (mr:MergeRequest)<-[:REVIEWER]-(reviewer:User),
          (mr)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p, count(reviewer) AS reviewer_count
    LIMIT 15

