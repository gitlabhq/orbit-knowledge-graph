q5:
  desc: "Count MRs per project"
  category: aggregation
  suite: sdlc
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "mr",
          "entity": "MergeRequest",
          "filters": {
            "state": {"in": ["opened", "closed", "merged"]}
          }
        },
        {
          "id": "p",
          "entity": "Project"
        }
      ],
      "relationships": [
        {
          "type": "IN_PROJECT",
          "from": "mr",
          "to": "p"
        }
      ],
      "group_by": ["p"],
      "aggregations": [
        {
          "count": "mr",
          "as": "mr_count"
        }
      ],
      "aggregation_sort": "-mr_count",
      "limit": 10
    }
  opencypher: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 10

