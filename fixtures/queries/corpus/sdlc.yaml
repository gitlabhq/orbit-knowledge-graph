# SDLC query corpus.
#
# Core SDLC traversals + aggregations (also drives the xtask simulator).
# Canonical corpus entry: desc / category / suite / query (inline GQL).
# Placeholders: `x.id IN $sample` / `$sample:N` bind to real in-scope ids at run time.

q1:
  desc: "List active users"
  category: search
  suite: sdlc
  query: |
    MATCH (u:User {state: 'active'})
    RETURN *
    ORDER BY u.created_at DESC
    LIMIT 30

q2:
  desc: "Open merge requests in a project"
  category: traversal
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest {state: 'opened'})-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN $sample
    RETURN *
    ORDER BY mr.created_at DESC
    LIMIT 25

q3:
  desc: "Draft MRs awaiting review"
  category: traversal
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest {state: 'opened', draft: true})<-[:AUTHORED]-(author:User)
    RETURN *
    LIMIT 20

q4:
  desc: "MRs merged by a specific user"
  category: traversal
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest {state: 'merged'})<-[:MERGED]-(merger:User)
    WHERE merger.id IN $sample
    RETURN *
    ORDER BY mr.updated_at DESC
    LIMIT 30

q5:
  desc: "Count MRs per project"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 10

q6:
  desc: "Failed pipelines recently"
  category: traversal
  suite: sdlc
  query: |
    MATCH (pipe:Pipeline {status: 'failed'})-[:IN_PROJECT]->(p:Project)
    RETURN *
    ORDER BY pipe.created_at DESC
    LIMIT 30

q7:
  desc: "Pipeline success rate by project"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (pipe:Pipeline)-[:IN_PROJECT]->(p:Project)
    WHERE pipe.status IN ['success', 'failed']
    RETURN p, count(pipe) AS total_pipelines
    LIMIT 20

q8:
  desc: "Long-running pipelines"
  category: search
  suite: sdlc
  query: |
    MATCH (pipe:Pipeline {status: 'success'})
    WHERE pipe.duration > 60
    RETURN *
    ORDER BY pipe.duration DESC
    LIMIT 20

q9:
  desc: "Critical vulnerabilities detected"
  category: traversal
  suite: sdlc
  query: |
    MATCH (v:Vulnerability {severity: 'critical', state: 'detected'})-[:IN_PROJECT]->(p:Project)
    RETURN *
    ORDER BY v.detected_at DESC
    LIMIT 30

q10:
  desc: "Unresolved high-severity vulns by report type"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (v:Vulnerability)
    WHERE v.severity IN ['high', 'critical'] AND v.state IN ['detected', 'confirmed']
    RETURN count(v) AS vuln_count
    LIMIT 10

q11:
  desc: "Vulnerabilities fixed by MRs"
  category: traversal
  suite: sdlc
  query: |
    MATCH (v:Vulnerability {state: 'resolved'})<-[:FIXES]-(mr:MergeRequest {state: 'merged'})
    RETURN *
    LIMIT 25

q12:
  desc: "Open work items (issues) by type"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (wi:WorkItem {state: 'opened'})
    RETURN count(wi) AS count
    LIMIT 10

q13:
  desc: "Overdue work items"
  category: search
  suite: sdlc
  query: |
    MATCH (wi:WorkItem {state: 'opened'})
    RETURN *
    ORDER BY wi.due_date
    LIMIT 30

q14:
  desc: "High weight work items assigned to user"
  category: traversal
  suite: sdlc
  query: |
    MATCH (wi:WorkItem {state: 'opened'})<-[:ASSIGNED]-(assignee:User)
    WHERE wi.weight >= 1 AND assignee.id IN $sample
    RETURN *
    LIMIT 20
  expect: empty # only ~6% of opened gitlab-org work items have weight>=1; a random sample user rarely has one assigned

q15:
  desc: "Work items closing MRs"
  category: traversal
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest {state: 'merged'})-[:CLOSES]->(wi:WorkItem)
    RETURN *
    LIMIT 30

q16:
  desc: "Notes (comments) on MRs by user"
  category: traversal
  suite: sdlc
  query: |
    MATCH (note:Note {noteable_type: 'MergeRequest'})<-[:AUTHORED]-(author:User)
    WHERE author.id IN $sample
    RETURN *
    ORDER BY note.created_at DESC
    LIMIT 30
  expect: empty # most sampled users have no MR-noteable_type notes in gitlab-org; verified rows for hand-picked MR commenters only

q17:
  desc: "Comment activity per user"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (note:Note {noteable_type: 'MergeRequest'})<-[:AUTHORED]-(author:User)
    RETURN author, count(note) AS note_count
    ORDER BY note_count DESC
    LIMIT 20

q18:
  desc: "Projects in a group"
  category: traversal
  suite: sdlc
  query: |
    MATCH (p:Project {archived: false})<-[:CONTAINS]-(g:Group)
    WHERE g.id IN $sample
    RETURN *
    ORDER BY p.last_activity_at DESC
    LIMIT 30

q19:
  desc: "Public projects"
  category: search
  suite: sdlc
  query: |
    MATCH (p:Project {visibility_level: 'public', archived: false})
    RETURN *
    ORDER BY p.star_count DESC
    LIMIT 20

q20:
  desc: "User contributions: authored MRs"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest)<-[:AUTHORED]-(author:User)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN author, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 20

q21:
  desc: "MR reviewers per project"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest)<-[:REVIEWER]-(reviewer:User), (mr)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p, count(reviewer) AS reviewer_count
    LIMIT 15

q22:
  desc: "Work items in milestone"
  category: traversal
  suite: sdlc
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:IN_MILESTONE]->(m:Milestone)
    WHERE m.id IN $sample
    RETURN *
    LIMIT 30

q23:
  desc: "Work items with specific label"
  category: traversal
  suite: sdlc
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:HAS_LABEL]->(lbl:Label)
    WHERE lbl.id IN $sample
    RETURN *
    LIMIT 30

q24:
  desc: "Pipeline triggered by MR"
  category: traversal
  suite: sdlc
  query: |
    MATCH (pipe:Pipeline {source: 'merge_request_event'})<-[:TRIGGERED]-(mr:MergeRequest)
    WHERE mr.id IN $sample
    RETURN *
    ORDER BY pipe.created_at DESC
    LIMIT 10
  expect: empty # random sampled MRs in gitlab-org rarely have a TRIGGERED Pipeline edge; structurally verified against a known MR

q25:
  desc: "Shortest path between two projects"
  category: path_finding
  suite: sdlc
  query: |
    MATCH path = ANY SHORTEST (src:Project)-[:CONTAINS*1..2]->(dst:Project)
    WHERE src.id IN $sample AND dst.id IN $sample
    RETURN path
  expect: empty # CONTAINS is parent->child only; two random gitlab-org projects share a Group parent and have no directed CONTAINS path between them

q26:
  desc: "Users by state"
  category: search
  suite: sdlc
  query: |
    MATCH (u:User {state: 'active'})
    RETURN *
    LIMIT 20

q27:
  desc: "Bot accounts"
  category: search
  suite: sdlc
  query: |
    MATCH (u:User)
    WHERE u.user_type IN ['project_bot', 'service_account', 'automation_bot']
    RETURN *
    ORDER BY u.created_at DESC
    LIMIT 30

q28:
  desc: "Confidential work items"
  category: traversal
  suite: sdlc
  query: |
    MATCH (wi:WorkItem {confidential: true, state: 'opened'})-[:IN_PROJECT]->(p:Project)
    RETURN *
    LIMIT 20

q29:
  desc: "SAST vulnerabilities by severity"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (v:Vulnerability {report_type: 'sast'})
    RETURN v.severity, count(v) AS total
    ORDER BY total DESC
    LIMIT 10

q30:
  desc: "Merge requests by state"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr.state, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 10

q31:
  desc: "Pipeline duration by status"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (pipe:Pipeline)
    WHERE pipe.status IN ['success', 'failed']
    RETURN pipe.status, count(pipe) AS pipeline_count, avg(pipe.duration) AS avg_duration
    ORDER BY pipeline_count DESC
    LIMIT 10

q32:
  desc: "Jobs by status and when"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (job:Job)
    WHERE job.status IN ['success', 'failed', 'running', 'pending']
    RETURN job.status, job.when, count(job) AS job_count
    ORDER BY job_count DESC
    LIMIT 20

q33:
  desc: "Vulnerabilities by severity and state"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (v:Vulnerability)
    WHERE v.report_type IN ['sast', 'dependency_scanning', 'container_scanning', 'secret_detection']
    RETURN v.severity, v.state, count(v) AS vuln_count
    ORDER BY vuln_count DESC
    LIMIT 30

q34:
  desc: "Merge request state by project"
  category: aggregation
  suite: sdlc
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged'] AND p.id IN $sample
    RETURN p, mr.state, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 20
