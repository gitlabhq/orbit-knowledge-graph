q34:
  desc: "Merge request state by project"
  category: aggregation
  suite: sdlc
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "mr",
          "entity": "MergeRequest",
          "filters": {
            "state": {"in": ["opened", "closed", "merged"]}
          }
        },
        {
          "id": "p",
          "entity": "Project",
          "node_ids": "$sample"
        }
      ],
      "relationships": [
        {
          "type": "IN_PROJECT",
          "from": "mr",
          "to": "p"
        }
      ],
      "group_by": [
        "p",
        "mr.state"
      ],
      "aggregations": [
        {
          "count": "mr",
          "as": "mr_count"
        }
      ],
      "aggregation_sort": "-mr_count",
      "limit": 20
    }
  opencypher: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged'] AND p.id IN $sample
    RETURN p, mr.state, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 20

