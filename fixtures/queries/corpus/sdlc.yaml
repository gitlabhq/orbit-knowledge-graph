      ],
      "relationships": [
        {
          "type": "AUTHORED",
          "from": "author",
          "to": "mr"
        }
      ],
      "limit": 20
    }
  opencypher: |
    MATCH (mr:MergeRequest {state: 'opened', draft: true})<-[:AUTHORED]-(author:User)
    RETURN mr
    LIMIT 20

