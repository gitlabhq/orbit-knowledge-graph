vulnerabilities_by_project_and_severity:
  desc: "Vulnerabilities by project and severity"
  category: aggregation
  suite: grouping
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "v",
          "entity": "Vulnerability",
          "filters": {
            "state": {"in": ["detected", "confirmed"]}
          }
        },
        {
          "id": "p",
          "entity": "Project",
          "columns": [
            "name",
            "full_path"
          ]
        }
      ],
      "relationships": [
        {
          "type": "IN_PROJECT",
          "from": "v",
          "to": "p"
        }
      ],
      "group_by": [
        "p",
        "v.severity"
      ],
      "aggregations": [
        {
          "count": "v",
          "as": "vulnerability_count"
        },
        {
          "max": "v.updated_at",
          "as": "latest_vulnerability_update"
        }
      ],
      "aggregation_sort": "-vulnerability_count",
      "limit": 20
    }
  opencypher: |
    MATCH (v:Vulnerability)-[:IN_PROJECT]->(p:Project)
    WHERE v.state IN ['detected', 'confirmed']
    RETURN p, p.name, p.full_path, v.severity, count(v) AS vulnerability_count, max(v.updated_at) AS latest_vulnerability_update
    ORDER BY vulnerability_count DESC
    LIMIT 20

