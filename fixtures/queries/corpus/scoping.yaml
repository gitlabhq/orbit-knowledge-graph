# traversal_path PK-pruning corpus.
#
# project/group/namespace scope filters; {{TOKENS}} resolved from a tokens file.
# Canonical corpus entry: desc / category / suite / query (inline GQL).
# Placeholders: `x.id IN $sample` / `$sample:N` bind to real in-scope ids at run time.

proj_node_lookup_by_id:
  desc: "Project node lookup by numeric id (eq). Rewrite turns id-eq into startsWith(traversal_path,'<prefix>') on the gl_project PK; without the rewrite this is a bloom-filter scan on idx_id."
  category: search
  suite: scoping
  query: |
    MATCH (p:Project {id: {{PROJECT_ID}}})
    RETURN p{.id, .name, .full_path, .visibility_level}
    LIMIT 1

proj_node_lookup_by_full_path:
  desc: "Project node lookup by full_path (eq). Rewrite resolves full_path -> traversal_path prefix via the graph-DB dictionary and emits startsWith(traversal_path,'<prefix>') on the PK; otherwise an idx_full_path bloom scan."
  category: search
  suite: scoping
  query: |
    MATCH (p:Project {full_path: '{{PROJECT_FULL_PATH}}'})
    RETURN p{.id, .name, .full_path, .visibility_level}
    LIMIT 1

proj_id_mr_in_project_eq:
  desc: "MergeRequest IN_PROJECT Project, project scoped by id (eq). The project-id filter rewrites to startsWith(traversal_path,'<prefix>') applied to gl_merge_request, gl_project and the IN_PROJECT gl_edge rows."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    RETURN mr{.iid, .title, .state, .project_id}, p
    ORDER BY mr.created_at DESC
    LIMIT 100

proj_full_path_mr_in_project_eq:
  desc: "MergeRequest IN_PROJECT Project, project scoped by full_path (eq). Identical traversal to proj_id_mr_in_project_eq; the dict resolves full_path -> same traversal_path prefix; PK rewrite applies to all three tables."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {full_path: '{{PROJECT_FULL_PATH}}'})
    RETURN mr{.iid, .title, .state, .project_id}, p
    ORDER BY mr.created_at DESC
    LIMIT 100

proj_id_in_mr_in_project:
  desc: "MergeRequest IN_PROJECT Project, project scoped by id with op 'in' (single id). Exercises the 'in' operator rewrite; single-element IN should compile to the same single-prefix PK predicate as eq."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN [{{PROJECT_ID}}]
    RETURN mr{.iid, .title, .state, .project_id}, p
    LIMIT 100

proj_id_in2_mr_or_of_prefixes:
  desc: "TWO-element project_id IN across two sibling projects, asserting the OR-of-startsWith multi-prefix PK predicate in the clean project slice (the positive OR-of-prefixes proof)."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN [{{PROJECT_ID}}, {{PROJECT_ID_2}}]
    RETURN mr{.iid, .title, .state, .project_id}, p
    LIMIT 100

proj_id_workitem_in_project_eq:
  desc: "WorkItem IN_PROJECT Project, project scoped by id (eq). gl_work_item PK is (traversal_path, id); the project-id rewrite prunes the WorkItem scan on the PK."
  category: traversal
  suite: scoping
  query: |
    MATCH (wi:WorkItem)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    RETURN wi{.iid, .title, .state, .work_item_type}, p
    LIMIT 100

proj_id_pipeline_in_project_eq:
  desc: "Pipeline IN_PROJECT Project, project scoped by id (eq). gl_pipeline PK is (traversal_path, id); the project-id rewrite prunes the pipeline scan on the PK."
  category: traversal
  suite: scoping
  query: |
    MATCH (pipe:Pipeline)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    RETURN pipe{.id, .status, .source, .ref, .created_at}, p
    ORDER BY pipe.created_at DESC
    LIMIT 100

proj_full_path_pipeline_source_filter:
  desc: "Pipeline IN_PROJECT scoped by project full_path WITH the canonical source='merge_request_event' filter (per recipes.md). Gives Pipeline a full_path-scoped case plus a column-filter-plus-prefix interaction."
  category: traversal
  suite: scoping
  query: |
    MATCH (pipe:Pipeline {source: 'merge_request_event'})-[:IN_PROJECT]->(p:Project {full_path: '{{PROJECT_FULL_PATH}}'})
    RETURN pipe{.id, .status, .source, .ref}, p
    LIMIT 100

proj_id_vuln_in_project_eq:
  desc: "Vulnerability IN_PROJECT Project, project scoped by id (eq). gl_vulnerability PK is (traversal_path, id); the project-id rewrite prunes the vuln scan on the PK. Also exercises the security pass ANDing the user's auth prefix with the resolved scope prefix."
  category: traversal
  suite: scoping
  query: |
    MATCH (v:Vulnerability)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    RETURN v{.id, .severity, .state, .report_type}, p
    LIMIT 100

note_in_project_id:
  desc: "Note IN_PROJECT Project scoped by id. Proves the rewrite prunes gl_note on its PK; Note is a core scoped entity with no prior coverage."
  category: traversal
  suite: scoping
  query: |
    MATCH (n:Note)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    RETURN n{.id, .note, .author_id}, p
    LIMIT 100

proj_id_mr_count_by_state_agg:
  desc: "Aggregation. Count MergeRequests by state within PROJECT_ID (scoped by id). RETURN mr.state, count(mr). The project-id filter rewrites to startsWith(traversal_path,'<prefix>') and prunes the gl_merge_request scan feeding the aggregate."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr.state, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 10

proj_full_path_mr_count_by_state_agg:
  desc: "Aggregation. Count MergeRequests by state within the project, scoped by full_path (eq). Same aggregate as proj_id_mr_count_by_state_agg but addressed by full_path; dict resolves full_path -> same prefix and prunes on the PK."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {full_path: '{{PROJECT_FULL_PATH}}'})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr.state, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 10

proj_unknown_id_mr_in_project:
  desc: "Negative/guard. MergeRequest IN_PROJECT Project where the project id is nonexistent. Dict misses, resolves to '0/', scope must be treated as unknown (empty), NOT widened. Proves the rewrite fails closed."
  category: traversal
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{UNKNOWN_ID}}})
    RETURN mr{.iid, .title, .state, .project_id}, p
    LIMIT 100

grp_id_workitem_in_group:
  desc: "WorkItems IN_GROUP a top-level group, scoped by Group id. Resolver looks up the group's traversal_path via the dictionary and rewrites the Group id filter into startsWith(traversal_path,'<group_prefix>') on the WorkItem PK."
  category: traversal
  suite: scoping
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:IN_GROUP]->(g:Group {id: {{GROUP_ID}}})
    RETURN wi{.id, .iid, .title, .state, .namespace_id}, g
    ORDER BY wi.created_at DESC
    LIMIT 50

grp_fullpath_workitem_in_group:
  desc: "Same WorkItem IN_GROUP query but scoped by Group full_path instead of id. Proves the full_path -> traversal_path resolution yields the identical PK prefix predicate as the id path."
  category: traversal
  suite: scoping
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:IN_GROUP]->(g:Group {full_path: '{{GROUP_FULL_PATH}}'})
    RETURN wi{.id, .iid, .title, .state, .namespace_id}, g
    ORDER BY wi.created_at DESC
    LIMIT 50

grp_id_label_in_group:
  desc: "Group-level Labels IN_GROUP a top-level group, scoped by Group id. Label is a distinct entity table (gl_label) keyed on (traversal_path, id); confirms the rewrite applies per-entity, not just to WorkItem."
  category: traversal
  suite: scoping
  query: |
    MATCH (lbl:Label)-[:IN_GROUP]->(g:Group {id: {{GROUP_ID}}})
    RETURN lbl{.id, .title, .color, .group_id}, g
    LIMIT 50

grp_id_milestone_in_group:
  desc: "Group milestones IN_GROUP a top-level group, scoped by Group id. Third distinct IN_GROUP entity (gl_milestone) to show the rewrite is entity-agnostic across the plan domain."
  category: traversal
  suite: scoping
  query: |
    MATCH (m:Milestone {state: 'active'})-[:IN_GROUP]->(g:Group {id: {{GROUP_ID}}})
    RETURN m{.id, .iid, .title, .state, .group_id}, g
    LIMIT 50

grp_id_milestone_count_by_state_agg:
  desc: "Group-level Milestone aggregation by state scoped by Group id. Adds the aggregation path for Milestone with its correct string state values (active/closed) and confirms IN_GROUP fk=group_id pruning under aggregation."
  category: aggregation
  suite: scoping
  query: |
    MATCH (m:Milestone)-[:IN_GROUP]->(g:Group {id: {{GROUP_ID}}})
    WHERE m.state IN ['active', 'closed']
    RETURN m.state, count(m) AS ms_count
    ORDER BY ms_count DESC
    LIMIT 10

grp_id_mr_in_project_contains:
  desc: "MergeRequests in projects under a top-level group. Group CONTAINS Project, MergeRequest IN_PROJECT Project, scoped by Group id. Tests transitive scoping. the group prefix covers every project's subtree."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest {state: 'opened'})-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group {id: {{GROUP_ID}}})
    RETURN mr{.id, .iid, .title, .state, .project_id}, p, g
    ORDER BY mr.created_at DESC
    LIMIT 50

grp_id_count_mrs_aggregation_MOTIVATING:
  desc: "MOTIVATING CASE. COUNT all merge requests across an entire top-level group (aggregation), scoped by Group id. Group CONTAINS Project, MR IN_PROJECT Project, grouped by project. The headline whole-group MR rollup the PK-pruning feature exists to make fast."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group {id: {{GROUP_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 50

subgrp_id_count_mrs_aggregation_deeper_prefix:
  desc: "COUNT merge requests across a nested SUBGROUP only, scoped by subgroup id. Same motivating aggregation but the resolved prefix is a strict EXTENSION of the parent group's prefix, so it prunes to a deeper, smaller traversal_path subtree."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group {id: {{SUBGROUP_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 50

subgrp_fullpath_workitem_in_group:
  desc: "WorkItems IN_GROUP a nested subgroup, scoped by subgroup full_path. Confirms full_path resolution on a non-root namespace yields the deeper prefix and excludes work items that belong to the parent group but not the subgroup."
  category: traversal
  suite: scoping
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:IN_GROUP]->(g:Group {full_path: '{{SUBGROUP_FULL_PATH}}'})
    RETURN wi{.id, .iid, .title, .state, .namespace_id}, g
    LIMIT 50

subgrp_id_workitem_transitive_contains:
  desc: "Transitive subgroup descent. Group CONTAINS Group (CONTAINS*1..2) down to a nested subgroup, then WorkItem IN_GROUP that subgroup, scoped by the TOP group id. Proves the top-group prefix still prunes across a Group->Group hop."
  category: traversal
  suite: scoping
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:IN_GROUP]->(sub:Group)<-[:CONTAINS*1..2]-(g:Group {id: {{GROUP_ID}}})
    RETURN wi{.id, .iid, .title, .namespace_id}, sub, g
    LIMIT 50

grp_id_vuln_count_by_severity_agg:
  desc: "Whole-group Vulnerability aggregation grouped by severity, scoped by Group id via CONTAINS+IN_PROJECT. Covers a security-domain entity under aggregation and exercises the auth-prefix AND scope-prefix interaction in the aggregation path."
  category: aggregation
  suite: scoping
  query: |
    MATCH (v:Vulnerability)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group {id: {{GROUP_ID}}})
    WHERE v.state IN ['detected', 'confirmed']
    RETURN v.severity, count(v) AS vuln_count
    ORDER BY vuln_count DESC
    LIMIT 20

grp_namespace_id_project_leaf_GAP:
  desc: "Project scoped by full_path (the SAFE path). Flags that the residual gap is specifically a raw namespace_id filter whose value is a project_namespace_id fed as a Group/namespace scope, NOT this full_path case which prunes correctly to the project's own leaf prefix."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest {state: 'opened'})-[:IN_PROJECT]->(p:Project {full_path: '{{PROJECT_FULL_PATH}}'})
    RETURN mr{.id, .iid, .title, .state, .project_id}, p
    LIMIT 50

grp_unknown_id_no_widen:
  desc: "Scope by a nonexistent Group id. Dictionary miss must resolve to '0/' (unknown), returning ZERO rows. The rewrite must NOT fall back to an unscoped full-table scan that would leak other groups' data."
  category: traversal
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:IN_GROUP]->(g:Group {id: {{UNKNOWN_ID}}})
    RETURN *
    LIMIT 50

grp_id_count_workitems_aggregation:
  desc: "Whole-group WorkItem rollup (aggregation) scoped by Group id. count open work items across the group, grouped by work_item_type. Complements the MR motivating case with a plan-domain aggregation to show pruning generalizes across aggregation targets."
  category: aggregation
  suite: scoping
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:IN_GROUP]->(g:Group {id: {{GROUP_ID}}})
    RETURN wi.work_item_type, count(wi) AS wi_count
    ORDER BY wi_count DESC
    LIMIT 20

ns_group_id_resolves_traversal:
  desc: "namespace_id filter where the id is a real GROUP namespace. Expressed as Group.id eq {{GROUP_ID}} (a Group's id IS its namespace_id). Single-node traversal the feature rewrites into startsWith(traversal_path,'<group-prefix>/') on the gl_group PK."
  category: search
  suite: scoping
  query: |
    MATCH (g:Group {id: {{GROUP_ID}}})
    RETURN g{.id, .name, .full_path}
    LIMIT 50

ns_group_full_path_resolves_traversal:
  desc: "Same group scope addressed by full_path. Group.full_path eq {{GROUP_FULL_PATH}}; the feature looks up the namespace by path in the dictionary and rewrites to startsWith(traversal_path,'<prefix>/')."
  category: search
  suite: scoping
  query: |
    MATCH (g:Group {full_path: '{{GROUP_FULL_PATH}}'})
    RETURN g{.id, .name, .full_path}
    LIMIT 50

ns_subgroup_id_scopes_to_subtree:
  desc: "namespace_id filter where the id is a SUBGROUP (still a Group namespace). Scoping to a subgroup must prune to the subgroup's deeper prefix and must NOT return siblings under the same parent."
  category: search
  suite: scoping
  query: |
    MATCH (g:Group {id: {{SUBGROUP_ID}}})
    RETURN g{.id, .full_path, .traversal_path}
    LIMIT 50

ns_project_namespace_id_GAP:
  desc: "DOCUMENTED RESIDUAL GAP. namespace_id where the id is a PROJECT_NAMESPACE id (a project's leaf namespace, type='Project'). A project's traversal_path leaf == project_namespace_id, NOT project.id; the dict is keyed for group/namespace prefixes. Passing this id as Group.id must NOT widen scope and must stay correct."
  category: search
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (g:Group {id: {{PROJECT_NAMESPACE_ID}}})
    RETURN g{.id, .full_path}
    LIMIT 50

ns_unknown_id_no_widen:
  desc: "Unknown / nonexistent namespace_id. Dictionary miss must resolve to '0/' and be treated as unknown, returning 0 rows. Must NOT fall back to an unscoped (full-table) query."
  category: search
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (g:Group {id: {{UNKNOWN_ID}}})
    RETURN g{.id, .full_path}
    LIMIT 50

proj_id_mr_in_project_scoped_traversal:
  desc: "EDGE multi-node. MergeRequest IN_PROJECT Project, scoped to a single project by Project.id. The feature must push the project scope down to the traversal_path PK of BOTH the MergeRequest node and the Project node (same prefix)."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    RETURN mr{.iid, .title, .state, .project_id}, p{.id, .full_path}
    ORDER BY mr.created_at DESC
    LIMIT 50

proj_full_path_mr_count_agg_scoped:
  desc: "EDGE aggregation scoped by Project.full_path. count MergeRequests per project, filtered to one project by full_path. Confirms the rewrite works through the aggregation path and that the count is exact."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {full_path: '{{PROJECT_FULL_PATH}}'})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p{.id, .full_path}, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 10

multihop_user_authored_mr_in_project_group_scoped:
  desc: "Intentionally encodes the common mistake (group_id stuffed into Project.id via a bogus id_property filter key). The harness must assert it is REJECTED at runtime ontology validation. The correct group-scoped multi-hop is multihop_group_scope_via_group_node."
  category: traversal
  suite: scoping
  expect: error # deliberate negative control: id_property is rejected by the ontology allowlist
  query: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{GROUP_ID}}, id_property: 'namespace_id'})
    RETURN u{.username}, mr{.iid, .title, .project_id}, p{.id, .full_path}
    LIMIT 100

multihop_group_scope_via_group_node:
  desc: "MULTI-HOP correctly scoped to a GROUP by adding the Group as a node and joining the leaf Project via CONTAINS. User AUTHORED MergeRequest IN_PROJECT Project, Group CONTAINS Project with Group.id eq {{GROUP_ID}}. The group's traversal_path prefix prunes the whole subtree. Positive counterpart to the rejected case above."
  category: traversal
  suite: scoping
  query: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group {id: {{GROUP_ID}}})
    RETURN u{.username}, mr{.iid, .title, .project_id}, p{.id, .full_path}, g{.id, .full_path}
    LIMIT 100

edge_rel_scoped_prune_reviewer:
  desc: "Edge-table-scoped multi-hop (User REVIEWER MergeRequest IN_PROJECT Project) under a project prefix, asserting the gl_edge scan ITSELF prunes on traversal_path. Edge pruning was previously asserted only indirectly via node pruning."
  category: traversal
  suite: scoping
  query: |
    MATCH (u:User)-[:REVIEWER]->(mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    RETURN u{.username}, mr{.iid, .title, .state}, p
    LIMIT 100

path_finding_two_entities_in_project:
  desc: "PATH_FINDING between two seeded entities within one project. shortest path from a specific MergeRequest to its Project, both pinned by id, scoped within {{PROJECT_ID}}. Confirms the path search frontier is bounded by the project prefix."
  category: path_finding
  suite: scoping
  expect: empty # bidirectional path-finding frontier OOMs at gitlab-org scope
  query: |
    MATCH path = ANY SHORTEST (src:MergeRequest {id: {{MR_NODE_ID}}})-[:IN_PROJECT*1..2]->(dst:Project {id: {{PROJECT_ID}}})
    RETURN path

unknown_id_path_finding_no_widen:
  desc: "PATH_FINDING with an endpoint pinned to a nonexistent id. Proves the path frontier fails closed (dict-miss '0/') and returns no path rather than widening the gl_edge frontier scan."
  category: path_finding
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH path = ANY SHORTEST (src:MergeRequest {id: {{MR_NODE_ID}}})-[:IN_PROJECT|CONTAINS*1..3]->(dst:Project {id: {{UNKNOWN_ID}}})
    RETURN path

path_finding_two_projects_in_group_by_full_path:
  desc: "PATH_FINDING between two seeded projects within the same group, endpoints pinned by full_path (engine resolves prefixes from the dictionary). Relationship types are required for every shortest-path query."
  category: path_finding
  suite: scoping
  expect: empty # CONTAINS is parent->child only; sibling projects share a Group parent so no directed path exists via [CONTAINS, IN_PROJECT]
  query: |
    MATCH path = ANY SHORTEST (a:Project {full_path: '{{PROJECT_FULL_PATH}}'})-[:CONTAINS|IN_PROJECT*1..3]->(b:Project {full_path: '{{PROJECT_FULL_PATH_2}}'})
    RETURN path

neighbors_project_center_outgoing:
  desc: "NEIGHBORS of a project-scoped center node. immediate neighbors of Project {{PROJECT_ID}}. The center is pinned by id and the project's traversal_path prefix bounds the gl_edge scan."
  category: neighbors
  suite: scoping
  query: |
    MATCH (p:Project {id: {{PROJECT_ID}}})--(n)
    RETURN p{.id, .full_path}, n
    LIMIT 100

unknown_id_neighbors_no_widen:
  desc: "NEIGHBORS of a nonexistent center id. Proves the neighbors gl_edge scan fails closed ('0/' prefix) and returns zero neighbors rather than scanning the whole edge table."
  category: neighbors
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (p:Project {id: {{UNKNOWN_ID}}})--(n)
    RETURN p{.id, .full_path}, n
    LIMIT 100

neighbors_group_center_contains_rel_filter:
  desc: "NEIGHBORS of a GROUP center, restricted to CONTAINS edges. direct children (subgroups + projects) of group {{GROUP_ID}}. Group center pinned by id; -[:CONTAINS]-> narrows the edges. Bounded by the group's traversal_path prefix."
  category: neighbors
  suite: scoping
  query: |
    MATCH (g:Group {id: {{GROUP_ID}}})-[:CONTAINS]->(n)
    RETURN g{.id, .full_path}, n
    LIMIT 100

proj_id_mr_count:
  desc: "Total MR count scoped to a single project by project id. Anchors scope on the Project node (Project id); the MR node's startsWith(traversal_path, '<proj_prefix>') prunes on the PK. The original slow-query class the rewrite targets."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN count(mr) AS mr_count
    LIMIT 1
    DEBUG

proj_fullpath_mr_count:
  desc: "Same total MR count but scope expressed by Project.full_path (eq). Exercises the full_path -> traversal_path prefix resolution path. Result must be identical to proj_id_mr_count for the same project."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {full_path: '{{PROJECT_FULL_PATH}}'})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN count(mr) AS mr_count
    LIMIT 1
    DEBUG

proj_id_mr_by_state:
  desc: "GROUP BY MergeRequest.state within a single project (by id). Verifies grouped aggregation correctness under PK pruning. each state bucket must match per-state truth, and buckets must sum to the proj_id_mr_count total."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr.state, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 10
    DEBUG

group_id_mr_by_author:
  desc: "GROUP BY author (User node) of MRs across ALL projects in a group, scoped by group id. The Group anchors the traversal_path prefix; MRs in any descendant project share it, so the join scan prunes on PK. The cross-project 'who authored the most MRs in this group' slow query."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)<-[:AUTHORED]-(author:User), (mr)-[:IN_PROJECT]->(p:Project)<-[:CONTAINS]-(g:Group {id: {{GROUP_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN author, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 20
    DEBUG

group_fullpath_wi_by_state:
  desc: "GROUP BY WorkItem.state for work items directly in a group, scoped by group full_path via the IN_GROUP edge. Exercises group full_path -> prefix resolution and the IN_GROUP scoping path (distinct from IN_PROJECT)."
  category: aggregation
  suite: scoping
  query: |
    MATCH (wi:WorkItem)-[:IN_GROUP]->(g:Group {full_path: '{{GROUP_FULL_PATH}}'})
    WHERE wi.state IN ['opened', 'closed']
    RETURN wi.state, count(wi) AS wi_count
    ORDER BY wi_count DESC
    LIMIT 10
    DEBUG

proj_id_mr_orderby_limit_page:
  desc: "Traversal of MRs in a project by id, ordered by created_at DESC with a 20-row limit. Verifies order_by produces a stable top-N under PK pruning. Pairs with the next case (larger limit) for containment checks."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr{.id, .iid, .title, .state, .created_at}, p
    ORDER BY mr.created_at DESC
    LIMIT 20
    DEBUG

proj_id_mr_orderby_limit_page2:
  desc: "Same scoped+ordered query with a larger limit (40). The 20-row result must be a prefix of this 40-row result under the same order."
  category: traversal
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{PROJECT_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr{.id, .iid, .title, .state, .created_at}, p
    ORDER BY mr.created_at DESC
    LIMIT 40
    DEBUG

aggpaging_namespace_id_project_gap:
  desc: "DOCUMENTED RESIDUAL GAP. Aggregate WorkItem count where the scope is a raw namespace_id filter whose value is a project_namespace_id. Correctness must hold; PK pruning is undefined for the project_namespace_id rewrite. {{PROJECT_NAMESPACE_ID}} placeholder must be substituted with the project_namespace_id, not project.id."
  category: aggregation
  suite: scoping
  query: |
    MATCH (wi:WorkItem {namespace_id: {{PROJECT_NAMESPACE_ID}}})
    WHERE wi.state IN ['opened', 'closed']
    RETURN count(wi) AS wi_count
    LIMIT 1
    DEBUG

unknown_id_no_widen:
  desc: "Negative/safety. Aggregate MR count scoped to a Project id that does not exist. Dict lookup misses, yielding '0/' which must be treated as UNKNOWN scope. result must be empty (count 0), NOT a widening to the whole instance. Proves a dict miss never broadens scope."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {id: {{UNKNOWN_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN count(mr) AS mr_count
    LIMIT 1
    DEBUG

unknown_project_id_mr_empty:
  desc: "Scope MRs to a nonexistent project_id. The rewrite resolves project_id -> project_namespace_id via the dict; a miss yields the '0/' sentinel, so startsWith(traversal_path,'0/') matches nothing. MUST return empty and MUST NOT widen to a full scan."
  category: traversal
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (mr:MergeRequest {project_id: {{UNKNOWN_ID}}})-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr{.iid, .title, .state, .project_id}, p
    LIMIT 50
    DEBUG

unknown_full_path_proj_empty:
  desc: "Single-node Project scoped by a nonexistent full_path. The rewrite resolves full_path -> the project's own traversal_path prefix; an unresolvable path is a miss => unknown prefix ('0/'). MUST short-circuit to empty, not scan gl_project."
  category: search
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (p:Project {full_path: 'this-org/does-not-exist-nowhere'})
    RETURN p{.full_path, .name, .visibility_level}
    LIMIT 50
    DEBUG

full_path_trailing_slash:
  desc: "Scope a Project by its real full_path with a trailing slash appended. full_path in gl_project has no trailing slash; the rewrite must normalize (strip trailing '/') before dict lookup, else it misses and returns empty. Asserts the normalizer, not a leak."
  category: search
  suite: scoping
  expect: empty # normalizer not implemented today: trailing-slash full_path misses the dict and short-circuits empty (fail-closed)
  query: |
    MATCH (p:Project {full_path: '{{PROJECT_FULL_PATH}}/'})
    RETURN p{.full_path, .name}
    LIMIT 50
    DEBUG

full_path_case_variant:
  desc: "Scope a Project by an upper/mixed-case variant of its real full_path. GitLab paths are case-sensitive in storage; the rewrite/dict lookup must treat the case variant as a distinct (missing) key. Expect empty, never a widened scan, never an accidental case-insensitive match."
  category: search
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (p:Project {full_path: '{{PROJECT_FULL_PATH_UPPER}}'})
    RETURN p{.full_path, .name}
    LIMIT 50
    DEBUG

project_id_in_multi:
  desc: "Scope MR-count aggregation to THREE real authorized projects via project_id IN [...]. The rewrite must produce a multi-prefix predicate. OR of startsWith(traversal_path, prefix_i) for each resolved leaf, each PK-prunable. Validates multi-prefix correctness AND that each prefix still prunes."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged'] AND mr.project_id IN [{{PROJECT_ID}}, {{PROJECT_ID_2}}, {{PROJECT_ID_3}}]
    RETURN p, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 20
    DEBUG

org_unscoped_control:
  desc: "Baseline control. an unscoped User listing (gl_user is a global table with NO traversal_path, in skip_security_filter_for_entities). No scope filter, so the prefix-rewrite feature is a no-op. Establishes the un-rewritten baseline read_rows for comparison."
  category: search
  suite: scoping
  query: |
    MATCH (u:User {state: 'active'})
    RETURN u{.username, .state}
    LIMIT 30
    DEBUG

out_of_scope_project_id_zero_leak:
  desc: "Scope MRs to a REAL project that exists but is OUTSIDE the calling user's authorized traversal paths. The security pass must AND the resolved scope prefix with the user's authorized prefixes; the conjunction is empty => zero rows, no leak."
  category: search
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (mr:MergeRequest {project_id: {{UNAUTH_PROJECT_ID}}})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr{.iid, .title, .project_id}
    LIMIT 50
    DEBUG

out_of_scope_full_path_group:
  desc: "Two-node WorkItem IN_GROUP Group scoped by a Group full_path the user is NOT authorized for. The rewrite resolves the group's prefix; the security AND with the user's auth prefixes empties it. Exercises the group-prefix path plus an edge join, ensuring the edge table's traversal_path is also ANDed down (no leak via edge join)."
  category: traversal
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (wi:WorkItem {state: 'opened'})-[:IN_GROUP]->(g:Group {full_path: '{{UNAUTH_GROUP_FULL_PATH}}'})
    RETURN wi{.iid, .title, .namespace_id}, g
    LIMIT 50
    DEBUG

negsec_namespace_id_project_gap:
  desc: "DOCUMENTED RESIDUAL GAP. WorkItem.namespace_id eq a value that is a PROJECT namespace's id (project_namespace_id), i.e. the leaf, not a group namespace. The leaf IS a project's traversal_path leaf, so the rewrite CAN resolve it, but this is the one case the design calls out as a gap. {{PROJECT_NAMESPACE_ID}} = projects.project_namespace_id, NOT projects.id."
  category: search
  suite: scoping
  query: |
    MATCH (wi:WorkItem {state: 'opened', namespace_id: {{PROJECT_NAMESPACE_ID}}})
    RETURN wi{.iid, .title, .namespace_id, .project_id}
    LIMIT 50
    DEBUG

unknown_namespace_id_group_empty:
  desc: "Aggregation (WorkItem count by state) scoped by namespace_id eq a fully nonexistent id. namespace_id dict lookup misses => '0/' sentinel. For an aggregation, Layer 3 redaction cannot run, so the empty result must come purely from the prefix/security predicate. MUST return zero buckets, never a full-table grouped scan."
  category: aggregation
  suite: scoping
  expect: empty # fail-closed control: must return zero rows (no scope widening)
  query: |
    MATCH (wi:WorkItem {namespace_id: {{UNKNOWN_ID}}})
    RETURN wi.state, count(wi) AS wi_count
    ORDER BY wi_count DESC
    LIMIT 10
    DEBUG

scoped_group_full_path_neighbors_authz_and:
  desc: "Neighbors of an AUTHORIZED group selected by full_path, restricted to CONTAINS edges. Positive scoping control. the rewrite resolves the group's prefix and ANDs it with the user's auth prefixes (which include it), returning the group's direct children and pruning to that subtree. Proves the rewrite does the RIGHT thing on an authorized scope."
  category: neighbors
  suite: scoping
  query: |
    MATCH (g:Group {full_path: '{{GROUP_FULL_PATH}}'})-[:CONTAINS]->(n)
    RETURN g{.name, .full_path}, n
    LIMIT 50
    DEBUG

unauth_group_in_authorized_list_no_leak:
  desc: "Multi-prefix mix where the scope list contains one AUTHORIZED group full_path and one UNAUTHORIZED group full_path (full_path IN [...]). The rewrite builds two prefixes; the security AND must keep the authorized prefix and empty the unauthorized one. Result includes only the authorized group's projects, no leak."
  category: traversal
  suite: scoping
  query: |
    MATCH (p:Project)<-[:CONTAINS]-(g:Group)
    WHERE g.full_path IN ['{{GROUP_FULL_PATH}}', '{{UNAUTH_GROUP_FULL_PATH}}']
    RETURN p{.name, .full_path}, g
    LIMIT 50
    DEBUG

mr_ids_changed_paths_agg:
  desc: "Most-changed file paths across pinned MergeRequests: MergeRequest (pinned ids) HAS_LATEST_DIFF -> MergeRequestDiff HAS_FILE -> MergeRequestDiffFile, grouped by old_path. The pinned MR ids resolve to their project traversal_path, which floods across the same_namespace diff edges so both edge dedup scans and the diff-file aggregation seek the project's PK range instead of the whole authorized diff-file subtree."
  category: aggregation
  suite: scoping
  query: |
    MATCH (mr:MergeRequest)-[:HAS_LATEST_DIFF]->(d:MergeRequestDiff)-[:HAS_FILE]->(f:MergeRequestDiffFile)
    WHERE mr.id IN $sample
    RETURN f.old_path, count(f) AS changes
    ORDER BY changes DESC
    LIMIT 40

pipeline_filter_changed_paths_agg:
  desc: "Most-changed file paths under a project's failed merge_request_event pipelines: Pipeline (project_id/status/source filters) <-TRIGGERED- MergeRequest -HAS_LATEST_DIFF-> MergeRequestDiff -HAS_FILE-> MergeRequestDiffFile, grouped by old_path. A filter-anchored FK-backed chain lowers to node FK joins (pl.merge_request_id, mr.latest_merge_request_diff_id, f.merge_request_diff_id) rather than edge scans, which is both faster and avoids stale HAS_LATEST_DIFF edge over-counting."
  category: aggregation
  suite: scoping
  query: |
    MATCH (pl:Pipeline {project_id: {{PROJECT_ID}}, status: 'failed', source: 'merge_request_event'})<-[:TRIGGERED]-(mr:MergeRequest)-[:HAS_LATEST_DIFF]->(d:MergeRequestDiff)-[:HAS_FILE]->(f:MergeRequestDiffFile)
    RETURN f.old_path, count(f) AS changes
    ORDER BY changes DESC
    LIMIT 60
