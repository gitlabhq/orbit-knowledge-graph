# Property-grouping aggregation stress corpus.
#
# Wide entity x property aggregation matrix.
# Canonical corpus entry: desc / category / suite / query (inline GQL).
# Placeholders: `x.id IN $sample` / `$sample:N` bind to real in-scope ids at run time.

security_vulnerability_001_by_severity:
  desc: "Security vulnerability 001 by severity"
  category: aggregation
  suite: grouping_stress
  query: |
    MATCH (v:Vulnerability)
    WHERE v.state IN ['detected', 'confirmed', 'resolved', 'dismissed']
    RETURN v.severity, count(v) AS vulnerability_count
    ORDER BY vulnerability_count DESC
    LIMIT 20

