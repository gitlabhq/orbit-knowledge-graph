join_pipeline_project_100_by_status_and_visibility:
  desc: "Join pipeline project 100 by status and visibility"
  category: aggregation
  suite: grouping_stress
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "pipe",
          "entity": "Pipeline",
          "filters": {
            "status": {"in": ["success", "failed", "running", "pending"]}
          }
        },
        {
          "id": "p",
          "entity": "Project"
        }
      ],
      "relationships": [
        {
          "type": "IN_PROJECT",
          "from": "pipe",
          "to": "p"
        }
      ],
      "group_by": [
        "pipe.status",
        "p.visibility_level"
      ],
      "aggregations": [
        {
          "count": "pipe",
          "as": "pipeline_count"
        },
        {
          "avg": "pipe.duration",
          "as": "avg_duration"
        }
      ],
      "aggregation_sort": "-pipeline_count",
      "limit": 50
    }
  opencypher: |
    MATCH (pipe:Pipeline)-[:IN_PROJECT]->(p:Project)
    WHERE pipe.status IN ['success', 'failed', 'running', 'pending']
    RETURN pipe.status, p.visibility_level, count(pipe) AS pipeline_count, avg(pipe.duration) AS avg_duration
    ORDER BY pipeline_count DESC
    LIMIT 50

