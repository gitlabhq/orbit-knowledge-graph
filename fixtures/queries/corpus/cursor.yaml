# Keyset-pagination (cursor) corpus.
#
# Traversal / aggregation queries carrying a cursor for keyset pagination.
# Canonical corpus entry: desc / category / suite / query (inline GQL).
# Placeholders: `x.id IN $sample` / `$sample:N` bind to real in-scope ids at run time.

01_cascading_sip_3node_chain_cursor:
  desc: "Cascading sip 3node chain cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE u.id IN $sample:3
    RETURN *
    PAGE 10

02_cascading_sip_4node_fan_out_cursor:
  desc: "Cascading sip 4node fan out cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (p:Project)<-[:IN_PROJECT]-(mr:MergeRequest {state: 'merged'})<-[:AUTHORED]-(author:User), (mr)-[:HAS_NOTE]->(note:Note)
    WHERE p.id IN $sample
    RETURN *
    PAGE 10

03_neighbors_both_directions_cursor:
  desc: "Neighbors both directions cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (mr:MergeRequest)--(n)
    WHERE mr.id IN $sample:3
    RETURN n
    PAGE 20

04_neighbors_outgoing_rel_filter_cursor:
  desc: "Neighbors outgoing rel filter cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (p:Project)-[:CONTAINS]->(n)
    WHERE p.id IN $sample
    RETURN n
    PAGE 10

05_aggregation_count_merged_mrs_cursor:
  desc: "Aggregation count merged mrs cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    RETURN p{.name}, count(mr) AS merged_mr_count
    ORDER BY merged_mr_count DESC
    PAGE 5

06_aggregation_sum_pipeline_duration_cursor:
  desc: "Aggregation sum pipeline duration cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (pipe:Pipeline {status: 'success'})-[:IN_PROJECT]->(p:Project)
    RETURN p{.name}, sum(pipe.duration) AS total_pipeline_seconds
    ORDER BY total_pipeline_seconds DESC
    PAGE 5

07_traversal_user_to_group_cursor:
  desc: "Traversal user to group cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group)
    WHERE u.id IN $sample
    RETURN *
    PAGE 10

08_traversal_project_pipelines_jobs_cursor:
  desc: "Traversal project pipelines jobs cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (p:Project)<-[:IN_PROJECT]-(pipe:Pipeline {status: 'failed'})<-[:IN_PIPELINE]-(j:Job {status: 'failed'})
    WHERE p.id IN $sample
    RETURN *
    PAGE 10

09_ns_traversal_all_mrs_cursor:
  desc: "Ns traversal all mrs cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN *
    PAGE 10

10_search_pipelines_failed_cursor:
  desc: "Search pipelines failed cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (pipe:Pipeline {status: 'failed'})
    RETURN pipe{.id, .status, .ref}
    PAGE 10

11_search_all_mrs_cursor:
  desc: "Search all mrs cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (mr:MergeRequest)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr{.id, .title, .state}
    PAGE 20

12_complex_mr_full_context_cursor:
  desc: "Complex mr full context cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (mr:MergeRequest {state: 'merged'})<-[:AUTHORED]-(author:User), (mr)-[:IN_PROJECT]->(p:Project)
    RETURN *
    PAGE 20

13_large_result_traversal_all_jobs_cursor:
  desc: "Large result traversal all jobs cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (j:Job)-[:IN_PIPELINE]->(pipe:Pipeline)
    WHERE j.status IN ['success', 'failed', 'running', 'pending']
    RETURN *
    PAGE 50

14_aggregation_no_sort_cursor:
  desc: "Aggregation no sort cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p{.name}, count(mr) AS mr_count
    PAGE 5

15_path_finding_depth2_user_to_project:
  desc: "Path finding depth2 user to project"
  category: path_finding
  suite: cursor
  expect: empty # shortest-path between random sampled User/Project rarely connects in scope
  query: |
    MATCH path = ANY SHORTEST (src:User)-[:AUTHORED|IN_PROJECT*1..2]->(dst:Project)
    WHERE src.id IN $sample AND dst.id IN $sample
    RETURN path

16_path_finding_depth3:
  desc: "Path finding depth3 work item containment chain"
  category: path_finding
  suite: cursor
  expect: empty # shortest-path between random sampled endpoints rarely connects in scope
  query: |
    MATCH path = ANY SHORTEST (src:WorkItem)-[:CONTAINS*1..3]->(dst:WorkItem)
    WHERE src.id IN $sample AND dst.id IN $sample
    RETURN path

17_property_group_vulnerabilities_by_severity_cursor:
  desc: "Property group vulnerabilities by severity cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (v:Vulnerability)
    WHERE v.state IN ['detected', 'confirmed', 'resolved', 'dismissed']
    RETURN v.severity, count(v) AS vulnerability_count
    ORDER BY vulnerability_count DESC
    PAGE 5

18_property_group_pipeline_status_source_cursor:
  desc: "Property group pipeline status source cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (pipe:Pipeline)
    WHERE pipe.status IN ['success', 'failed', 'running', 'pending']
    RETURN pipe.status, pipe.source, count(pipe) AS pipeline_count
    ORDER BY pipeline_count DESC
    PAGE 10

19_node_property_group_project_pipeline_status_cursor:
  desc: "Node property group project pipeline status cursor"
  category: cursor
  suite: cursor
  query: |
    MATCH (pipe:Pipeline)-[:IN_PROJECT]->(p:Project)
    WHERE pipe.status IN ['success', 'failed']
    RETURN p{.name, .full_path}, pipe.status, count(pipe) AS pipeline_count
    ORDER BY pipeline_count DESC
    PAGE 10
