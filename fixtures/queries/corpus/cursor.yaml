05_aggregation_count_merged_mrs_cursor:
  desc: "Aggregation count merged mrs cursor"
  category: cursor
  suite: cursor
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "mr",
          "entity": "MergeRequest",
          "filters": {
            "state": "merged"
          }
        },
        {
          "id": "p",
          "entity": "Project",
          "columns": [
            "name"
          ]
        }
      ],
      "relationships": [
        {
          "type": "IN_PROJECT",
          "from": "mr",
          "to": "p"
        }
      ],
      "group_by": ["p"],
      "aggregations": [
        {
          "count": "mr",
          "as": "merged_mr_count"
        }
      ],
      "aggregation_sort": "-merged_mr_count",
      "cursor": {
        "page_size": 5
      }
    }
  opencypher: |
    MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    RETURN p, p.name, count(mr) AS merged_mr_count
    ORDER BY merged_mr_count DESC

