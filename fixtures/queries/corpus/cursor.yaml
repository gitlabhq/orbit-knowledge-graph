17_property_group_vulnerabilities_by_severity_cursor:
  desc: "Property group vulnerabilities by severity cursor"
  category: cursor
  suite: cursor
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "v",
          "entity": "Vulnerability",
          "filters": {
            "state": {"in": ["detected", "confirmed", "resolved", "dismissed"]}
          }
        }
      ],
      "group_by": ["v.severity"],
      "aggregations": [
        {
          "count": "v",
          "as": "vulnerability_count"
        }
      ],
      "aggregation_sort": "-vulnerability_count",
      "cursor": {
        "page_size": 5
      }
    }
  opencypher: |
    MATCH (v:Vulnerability)
    WHERE v.state IN ['detected', 'confirmed', 'resolved', 'dismissed']
    RETURN v.severity, count(v) AS vulnerability_count
    ORDER BY vulnerability_count DESC

