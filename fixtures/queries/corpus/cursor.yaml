# Keyset-pagination (cursor) corpus.
#
# Traversal / aggregation queries carrying a cursor for keyset pagination.
# Canonical corpus entry: desc / category / suite / query (inline DSL JSON).
# Placeholders: "$sample" / "$sample:N" bind to real in-scope ids at run time.

01_cascading_sip_3node_chain_cursor:
  desc: "Cascading sip 3node chain cursor"
  category: cursor
  suite: cursor
  query: |
    {
      "query_type": "traversal",
      "nodes": [
        {
          "id": "u",
          "entity": "User",
          "node_ids": "$sample:3"
        },
        {
          "id": "mr",
          "entity": "MergeRequest",
          "filters": {
            "state": "merged"
          }
        },
        {
          "id": "p",
          "entity": "Project"
        }
      ],
      "relationships": [
        {
          "type": "AUTHORED",
          "from": "u",
          "to": "mr"
        },
        {
          "type": "IN_PROJECT",
          "from": "mr",
          "to": "p"
        }
      ],
      "cursor": {
        "page_size": 10
      }
    }
  opencypher: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE u.id IN $sample_3
    RETURN u

02_cascading_sip_4node_fan_out_cursor:
  desc: "Cascading sip 4node fan out cursor"
  category: cursor
  suite: cursor
  query: |
    {
      "query_type": "traversal",
      "nodes": [
        {
          "id": "p",
          "entity": "Project",
          "node_ids": "$sample"
        },
        {
          "id": "mr",
          "entity": "MergeRequest",
          "filters": {
            "state": "merged"
          }
        },
        {
          "id": "author",
          "entity": "User"
        },
        {
          "id": "note",
          "entity": "Note"
        }
      ],
      "relationships": [
        {
          "type": "IN_PROJECT",
          "from": "mr",
          "to": "p"
        },
        {
          "type": "AUTHORED",
          "from": "author",
          "to": "mr"
        },
        {
          "type": "HAS_NOTE",
          "from": "mr",
          "to": "note"
        }
      ],
      "cursor": {
        "page_size": 10
      }
    }
  opencypher: |
    MATCH (p:Project)<-[:IN_PROJECT]-(mr:MergeRequest {state: 'merged'})<-[:AUTHORED]-(author:User),
          (mr)-[:HAS_NOTE]->(note:Note)
    WHERE p.id IN $sample
    RETURN p

