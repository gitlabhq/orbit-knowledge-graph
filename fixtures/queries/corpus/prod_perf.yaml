    MATCH (mr:MergeRequest {id: {{MR_ID}}})
    RETURN mr

a03_mr_by_iid_project:
  desc: "MR by IID project"
  category: search
  suite: prod_perf
  query: |
    MATCH (mr:MergeRequest {iid: 235291})-[:IN_PROJECT]->(p:Project {full_path: 'gitlab-org/gitlab'})
    RETURN mr.id, mr.title, mr.state

a04_mr_by_iid_project_id:
