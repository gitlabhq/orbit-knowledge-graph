# Production performance corpus.
#
# 131 GQL queries over real gitlab-org shapes: point lookups, filtered scans,
# 1-hop and multi-hop traversals, aggregations, neighbors, path finding,
# pagination, and code graph. Used for the prod A/B runs of
# `use_statistics=0` (!2865), neighbors per-arm kinds (!2868), and
# FINAL-free latest-row reads (!2942) at scope 1/9970/.
# Canonical corpus entry: desc / category / suite / query (inline GQL).
#
# Date windows are literal: 7, 30, and 90 days before the 2026-10-17 run.
# {{TOKENS}} values used on prod:
#   {{GITLAB_PROJECT_ID}} = 278964  (gitlab-org/gitlab)
#   {{KG_PROJECT_ID}} = 77960826  (gitlab-org/orbit/knowledge-graph)
#   {{ORG_GROUP_ID}} = 9970  (gitlab-org)
#   {{ORBIT_GROUP_ID}} = 120946322  (gitlab-org/orbit)
#   {{MEMBER_USER_ID}} = 7980077  (User)
#   {{ASSIGNEE_USER_ID}} = 5054237  (User)
#   {{APPROVER_USER_ID}} = 20271294  (User)
#   {{AUTHOR_USER_ID}} = 64248  (User)
#   {{PROLIFIC_AUTHOR_USER_ID}} = 128633  (User)
#   {{BOT_USER_ID}} = 1786152  (User)
#   {{MR_ID}} = 549661405  (MergeRequest)
#   {{KG_MR_ID}} = 549658919  (MergeRequest)
#   {{WORK_ITEM_ID}} = 206806508  (WorkItem)
#   {{EPIC_ID}} = 206800025  (WorkItem)
#   {{PIPELINE_ID}} = 2952150594  (Pipeline)
#   {{JOB_ID}} = 17217733329  (Job)
#   {{VULNERABILITY_ID}} = 408651131  (Vulnerability)
#   {{LABEL_ID}} = 2278648  (Label)
#   {{MILESTONE_ID}} = 5948917  (Milestone)
#   {{FILE_ID}} = 2224282993346279700  (File)
#   {{DEFINITION_ID}} = 3155405440850214569  (Definition)

a01_project_by_path:
  desc: "Project by path"
  category: search
  suite: prod_perf
  query: |
    MATCH (p:Project {full_path: 'gitlab-org/gitlab'})
    RETURN p.id, p.full_path
    LIMIT 1

a02_mr_by_id:
  desc: "MR by ID"
  category: search
