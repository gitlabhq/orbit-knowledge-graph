# General GKG query corpus (mixed shapes).
#
# Broad traversal / aggregation / path-finding / neighbors coverage.
# Canonical corpus entry: desc / category / suite / query (inline GQL).
# Placeholders: `x.id IN $sample` / `$sample:N` bind to real in-scope ids at run time.

q1_defines_traversal_file_ends_with_rb:
  desc: "DEFINES traversal (File ends_with .rb)"
  category: code_graph
  suite: general
  query: |
    MATCH (f:File)-[:DEFINES]->(d:Definition)
    WHERE f.path ENDS WITH '.rb' AND d.name STARTS WITH 'process'
    RETURN *
    LIMIT 20

q2_datetime_range_filter_on_mr:
  desc: "DateTime range filter on MR"
  category: traversal
  suite: general
  query: |
    MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE mr.merged_at >= '2026-03-01T00:00:00Z' AND p.id IN $sample
    RETURN *
    ORDER BY mr.merged_at DESC
    LIMIT 20

q3_bidirectional_neighbors_on_project:
  desc: "Bidirectional neighbors on Project"
  category: neighbors
  suite: general
  query: |
    MATCH (p:Project)-[:CONTAINS|IN_PROJECT]-(n)
    WHERE p.id IN $sample
    RETURN n
    LIMIT 20

q4_3_node_agg_mr_count_per_author:
  desc: "3-node agg MR count per author"
  category: aggregation
  suite: general
  query: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN $sample
    RETURN u, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 20

q5_source_side_mr_count:
  desc: "Source-side MR count"
  category: aggregation
  suite: general
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN $sample
    RETURN p, count(mr) AS mr_count
    LIMIT 10

q6_user_mrs_in_project_traversal:
  desc: "User MRs in project traversal"
  category: traversal
  suite: general
  query: |
    MATCH (u:User {username: 'stanhu'})-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE p.id IN $sample
    RETURN *
    ORDER BY mr.merged_at DESC
    LIMIT 10

q7_path_finding_user_to_project:
  desc: "Path finding User to Project"
  category: path_finding
  suite: general
  expect: empty # random $sample pair + wide BFS OOMs at gitlab-org scope
  query: |
    MATCH path = ANY SHORTEST (src:User)-[:AUTHORED|IN_PROJECT|MEMBER_OF*1..2]->(dst:Project)
    WHERE src.id IN $sample AND dst.id IN $sample
    RETURN path
    LIMIT 10

q8_token_match_on_mr_title:
