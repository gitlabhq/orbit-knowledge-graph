  category: aggregation
  suite: general
  query: |
    MATCH (pipe:Pipeline)
    WHERE pipe.status IN ['success', 'failed', 'running', 'pending']
    RETURN pipe.status, pipe.source, count(pipe) AS pipe_count
    ORDER BY pipe_count DESC
    LIMIT 30

i10_merge_request_state_draft_matrix:
  desc: "Merge request state draft matrix"
  category: aggregation
  suite: general
  query: |
    MATCH (mr:MergeRequest)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr.state, mr.draft, count(mr) AS mr_count, avg(mr.diff_size) AS avg_diff_size
    ORDER BY mr_count DESC
    LIMIT 30

i11_project_visibility_and_mr_state:
  desc: "Project visibility and MR state"
  category: aggregation
  suite: general
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project {archived: false})
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p.visibility_level, mr.state, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 30

i12_project_and_vulnerability_severity:
  desc: "Project and vulnerability severity"
  category: aggregation
  suite: general
  query: |
    MATCH (v:Vulnerability)-[:IN_PROJECT]->(p:Project)
    WHERE v.state IN ['detected', 'confirmed']
    RETURN p{.name, .full_path}, v.severity, count(v) AS vuln_count
    ORDER BY vuln_count DESC
    LIMIT 20
