  suite: general
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE token_match(mr.title, 'security') AND p.id IN $sample
    RETURN *
    ORDER BY mr.updated_at DESC
    LIMIT 15

