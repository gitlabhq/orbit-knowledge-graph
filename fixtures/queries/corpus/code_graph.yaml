# Code-graph query corpus.
#
# CALLS / EXTENDS / DEFINES / IMPORTS over File / Definition / ImportedSymbol.
# Canonical corpus entry: desc / category / suite / query (inline DSL JSON).
# Placeholders: "$sample" / "$sample:N" bind to real in-scope ids at run time.

q1:
  desc: "Definition-to-definition call edges"
  category: code_graph
  suite: code_graph
  query: |
    {
      "query_type": "traversal",
      "nodes": [
        {
          "id": "caller",
          "entity": "Definition",
          "filters": {
            "definition_type": {"in": ["Class", "Module", "Method", "Function"]}
          }
        },
        {
          "id": "callee",
          "entity": "Definition"
        }
      ],
      "relationships": [
        {
          "type": "CALLS",
          "from": "caller",
          "to": "callee"
        }
      ],
      "limit": 30
    }
  opencypher: |
    MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
    WHERE caller.definition_type IN ['Class', 'Module', 'Method', 'Function']
    RETURN caller
    LIMIT 30

q2:
  desc: "Calls into an imported symbol"
  category: code_graph
  suite: code_graph
  query: |
    {
      "query_type": "traversal",
      "nodes": [
        {
          "id": "caller",
          "entity": "Definition",
          "filters": {
            "definition_type": {"in": ["Class", "Module", "Method", "Function"]}
          }
        },
        {
          "id": "sym",
          "entity": "ImportedSymbol"
        }
      ],
      "relationships": [
        {
          "type": "CALLS",
          "from": "caller",
          "to": "sym"
        }
      ],
      "limit": 30
    }
  opencypher: |
    MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
    WHERE caller.definition_type IN ['Class', 'Module', 'Method', 'Function']
    RETURN caller
    LIMIT 30

q3:
  desc: "Class inheritance chain"
  category: code_graph
  suite: code_graph
  query: |
    {
      "query_type": "traversal",
      "nodes": [
        {
          "id": "child",
          "entity": "Definition",
          "filters": {
            "definition_type": "Class"
          }
        },
        {
          "id": "parent",
          "entity": "Definition"
        }
      ],
      "relationships": [
        {
          "type": "EXTENDS",
          "from": "child",
          "to": "parent"
        }
      ],
      "limit": 30
    }
  opencypher: |
    MATCH (child:Definition {definition_type: 'Class'})-[:EXTENDS]->(parent:Definition)
    RETURN child
    LIMIT 30

q4:
  desc: "Count callers of a definition (aggregation)"
  category: code_graph
  suite: code_graph
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "caller",
          "entity": "Definition"
        },
        {
          "id": "callee",
          "entity": "Definition",
          "node_ids": "$sample"
        }
      ],
      "relationships": [
        {
          "type": "CALLS",
          "from": "caller",
          "to": "callee"
        }
      ],
      "aggregations": [
        {
          "count": "caller",
          "as": "caller_count"
        }
      ],
      "limit": 1
    }
  opencypher: |
    MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
    WHERE callee.id IN $sample
    RETURN count(caller) AS caller_count
    LIMIT 1

q5:
  desc: "Definitions by type"
  category: code_graph
  suite: code_graph
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "d",
          "entity": "Definition",
          "filters": {
            "definition_type": {"in": ["Class", "Module", "Method", "Function"]}
          }
        }
      ],
      "group_by": ["d.definition_type"],
      "aggregations": [
        {
          "count": "d",
          "as": "definition_count"
        }
      ],
      "aggregation_sort": "-definition_count",
      "limit": 20
    }
  opencypher: |
    MATCH (d:Definition)
    WHERE d.definition_type IN ['Class', 'Module', 'Method', 'Function']
    RETURN d.definition_type, count(d) AS definition_count
    ORDER BY definition_count DESC
    LIMIT 20

q6:
  desc: "Files by language"
  category: code_graph
  suite: code_graph
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "f",
          "entity": "File",
          "filters": {
            "language": {"in": ["ruby", "javascript", "typescript", "python"]}
          }
        }
      ],
      "group_by": ["f.language"],
      "aggregations": [
        {
          "count": "f",
          "as": "file_count"
        }
      ],
      "aggregation_sort": "-file_count",
      "limit": 20
    }
  opencypher: |
    MATCH (f:File)
    WHERE f.language IN ['ruby', 'javascript', 'typescript', 'python']
    RETURN f.language, count(f) AS file_count
    ORDER BY file_count DESC
    LIMIT 20

q7:
  desc: "Definitions by file and type"
  category: code_graph
  suite: code_graph
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "f",
          "entity": "File",
          "columns": [
            "path",
            "language"
          ],
          "filters": {
            "language": {"in": ["ruby", "javascript", "typescript", "python"]}
          }
        },
        {
          "id": "d",
          "entity": "Definition"
        }
      ],
      "relationships": [
        {
          "type": "DEFINES",
          "from": "f",
          "to": "d"
        }
      ],
      "group_by": [
        "f",
        "d.definition_type"
      ],
      "aggregations": [
        {
          "count": "d",
          "as": "definition_count"
        }
      ],
      "aggregation_sort": "-definition_count",
      "limit": 20
    }
  opencypher: |
    MATCH (f:File)-[:DEFINES]->(d:Definition)
    WHERE f.language IN ['ruby', 'javascript', 'typescript', 'python']
    RETURN f, f.path, f.language, d.definition_type, count(d) AS definition_count
    ORDER BY definition_count DESC
    LIMIT 20

q8:
  desc: "Imported symbols by type"
  category: code_graph
  suite: code_graph
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "sym",
          "entity": "ImportedSymbol",
          "filters": {
            "import_type": {"in": ["Import", "NamedImport", "DefaultImport", "FromImport", "Require", "Include", "WildcardImport"]}
          }
        }
      ],
      "group_by": ["sym.import_type"],
      "aggregations": [
        {
          "count": "sym",
          "as": "import_count"
        }
      ],
      "aggregation_sort": "-import_count",
      "limit": 20
    }
  opencypher: |
    MATCH (sym:ImportedSymbol)
    WHERE sym.import_type IN ['Import', 'NamedImport', 'DefaultImport', 'FromImport', 'Require', 'Include', 'WildcardImport']
    RETURN sym.import_type, count(sym) AS import_count
    ORDER BY import_count DESC
    LIMIT 20

