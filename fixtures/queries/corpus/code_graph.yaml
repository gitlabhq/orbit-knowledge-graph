# Code-graph query corpus.
#
# CALLS / EXTENDS / DEFINES / IMPORTS over File / Definition / ImportedSymbol.
# Canonical corpus entry: desc / category / suite / query (inline GQL).
# Placeholders: $sample / $sample:N bind to real in-scope ids at run time.

q1:
  desc: "Definition-to-definition call edges"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
    WHERE caller.definition_type IN ['Class', 'Module', 'Method', 'Function']
    RETURN caller, callee
    LIMIT 30

q2:
  desc: "Calls into an imported symbol"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (caller:Definition)-[:CALLS]->(sym:ImportedSymbol)
    WHERE caller.definition_type IN ['Class', 'Module', 'Method', 'Function']
    RETURN caller, sym
    LIMIT 30

q3:
  desc: "Class inheritance chain"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (child:Definition {definition_type: 'Class'})-[:EXTENDS]->(parent:Definition)
    RETURN child, parent
    LIMIT 30

q4:
  desc: "Count callers of a definition (aggregation)"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (caller:Definition)-[:CALLS]->(callee:Definition {id: $sample})
    RETURN count(caller) AS caller_count
    LIMIT 1

q5:
  desc: "Definitions by type"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (d:Definition)
    WHERE d.definition_type IN ['Class', 'Module', 'Method', 'Function']
    RETURN d.definition_type, count(d) AS definition_count
    ORDER BY definition_count DESC
    LIMIT 20

q6:
  desc: "Files by language"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (f:File)
    WHERE f.language IN ['ruby', 'javascript', 'typescript', 'python']
    RETURN f.language, count(f) AS file_count
    ORDER BY file_count DESC
    LIMIT 20

q7:
  desc: "Definitions by file and type"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (f:File)-[:DEFINES]->(d:Definition)
    WHERE f.language IN ['ruby', 'javascript', 'typescript', 'python']
    RETURN f{.path, .language}, d.definition_type, count(d) AS definition_count
    ORDER BY definition_count DESC
    LIMIT 20

q8:
  desc: "Imported symbols by type"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (sym:ImportedSymbol)
    WHERE sym.import_type IN ['Import', 'NamedImport', 'DefaultImport', 'FromImport', 'Require', 'Include', 'WildcardImport']
    RETURN sym.import_type, count(sym) AS import_count
    ORDER BY import_count DESC
    LIMIT 20
