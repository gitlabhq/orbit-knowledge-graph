# Code-graph query corpus.
#
# CALLS / EXTENDS / DEFINES / IMPORTS over File / Definition / Import.
# Canonical corpus entry: desc / category / suite / query (inline GQL).
# Placeholders: `x.id IN $sample` / `$sample:N` bind to real in-scope ids at run time.

q1:
  desc: "Definition-to-definition call edges"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
    WHERE caller.kind IN ['Class', 'Module', 'Method', 'Function']
    RETURN *
    LIMIT 30

q2:
  desc: "Calls into an imported symbol"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (caller:Definition)-[:CALLS]->(sym:Import)
    WHERE caller.kind IN ['Class', 'Module', 'Method', 'Function']
    RETURN *
    LIMIT 30

q3:
  desc: "Class inheritance chain"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (child:Definition {kind: 'Class'})-[:EXTENDS]->(parent:Definition)
    RETURN *
    LIMIT 30

q4:
  desc: "Count callers of a definition (aggregation)"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (caller:Definition)-[:CALLS]->(callee:Definition)
    WHERE callee.id IN $sample
    RETURN count(caller) AS caller_count
    LIMIT 1

q5:
  desc: "Definitions by type"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (d:Definition)
    WHERE d.kind IN ['Class', 'Module', 'Method', 'Function']
    RETURN d.kind, count(d) AS definition_count
    ORDER BY definition_count DESC
    LIMIT 20

q6:
  desc: "Files by language"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (f:File)
    WHERE f.language IN ['ruby', 'javascript', 'typescript', 'python']
    RETURN f.language, count(f) AS file_count
    ORDER BY file_count DESC
    LIMIT 20

q7:
  desc: "Definitions by file and type"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (f:File)-[:DEFINES]->(d:Definition)
    WHERE f.language IN ['ruby', 'javascript', 'typescript', 'python']
    RETURN f{.path, .language}, d.kind, count(d) AS definition_count
    ORDER BY definition_count DESC
    LIMIT 20

q8:
  desc: "Imported symbols by type"
  category: code_graph
  suite: code_graph
  query: |
    MATCH (sym:Import)
    WHERE sym.language_kind IN ['Import', 'NamedImport', 'DefaultImport', 'FromImport', 'Require', 'Include', 'WildcardImport']
    RETURN sym.language_kind, count(sym) AS import_count
    ORDER BY import_count DESC
    LIMIT 20
