08_mrs_per_month_by_project:
  desc: "Mrs per month by project"
  category: time_series
  suite: time_series
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "p",
          "entity": "Project",
          "columns": [
            "name"
          ]
        },
        {
          "id": "mr",
          "entity": "MergeRequest",
          "filters": {
            "state": "merged",
            "merged_at": {"gte": "2026-01-01T00:00:00Z"}
          }
        }
      ],
      "relationships": [
        {
          "type": "IN_PROJECT",
          "from": "mr",
          "to": "p"
        }
      ],
      "group_by": [
        "p",
        {"key": "mr.merged_at", "truncate": "month"}
      ],
      "aggregations": [
        {
          "count": "mr",
          "as": "merge_count"
        }
      ],
      "aggregation_sort": "-merge_count",
      "limit": 30
    }
  opencypher: |
    MATCH (p:Project)<-[:IN_PROJECT]-(mr:MergeRequest {state: 'merged'})
    WHERE mr.merged_at >= '2026-01-01T00:00:00Z'
    RETURN p, p.name, date_trunc('month', mr.merged_at), count(mr) AS merge_count
    ORDER BY merge_count DESC
    LIMIT 30

