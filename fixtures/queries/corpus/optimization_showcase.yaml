# Optimizer showcase corpus.
#
# Queries that exercise SIP / cascade / namespace-scoped optimizer passes.
# Canonical corpus entry: desc / category / suite / query (inline GQL).
# Placeholders: `x.id IN $sample` / `$sample:N` bind to real in-scope ids at run time.

01_cascading_sip_3node_chain:
  desc: "Cascading sip 3node chain"
  category: traversal
  suite: showcase
  query: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    WHERE u.id IN $sample:3
    RETURN *
    LIMIT 50

02_cascading_sip_4node_fan_out:
  desc: "Cascading sip 4node fan out"
  category: traversal
  suite: showcase
  query: |
    MATCH (p:Project)<-[:IN_PROJECT]-(mr:MergeRequest {state: 'merged'})<-[:AUTHORED]-(author:User), (mr)-[:HAS_NOTE]->(note:Note)
    WHERE p.id IN $sample
    RETURN *
    LIMIT 30

03_neighbors_both_directions:
  desc: "Neighbors both directions"
  category: neighbors
  suite: showcase
  query: |
    MATCH (mr:MergeRequest)--(n)
    WHERE mr.id IN $sample:3
    RETURN n
    LIMIT 100

04_neighbors_outgoing_with_rel_filter:
  desc: "Neighbors incoming with rel filter"
  category: neighbors
  suite: showcase
  query: |
    MATCH (p:Project)<-[:IN_PROJECT]-(n)
    WHERE p.id IN $sample
    RETURN n
    LIMIT 50

05_path_finding_depth3:
  desc: "Path finding depth3"
  category: path_finding
  suite: showcase
  query: |
    MATCH path = ANY SHORTEST (src:Project)-[:IN_PROJECT|AUTHORED*1..2]->(dst:Project)
    WHERE src.id IN $sample AND dst.id IN $sample
    RETURN path
  expect: empty # two random Projects don't share a 2-hop directed path; every entity->Project edge goes IN_PROJECT inbound, so Project->Project via [AUTHORED, IN_PROJECT] loops back to self

06_path_finding_depth2_user_to_project:
  desc: "Path finding depth2 user to project"
  category: path_finding
  suite: showcase
  expect: empty # random User->Project pair rarely has a bounded path in scope
  query: |
    MATCH path = ANY SHORTEST (src:User)-[:AUTHORED|IN_PROJECT*1..2]->(dst:Project)
    WHERE src.id IN $sample AND dst.id IN $sample
    RETURN path

07_aggregation_count_merged_mrs:
  desc: "Aggregation count merged mrs"
  category: aggregation
  suite: showcase
  query: |
    MATCH (mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    RETURN p{.name}, count(mr) AS merged_mr_count
    ORDER BY merged_mr_count DESC
    LIMIT 20

08_aggregation_sum_pipeline_duration:
  desc: "Aggregation sum pipeline duration"
  category: aggregation
  suite: showcase
  query: |
    MATCH (pipe:Pipeline {status: 'success'})-[:IN_PROJECT]->(p:Project)
    RETURN p{.name}, sum(pipe.duration) AS total_pipeline_seconds
    ORDER BY total_pipeline_seconds DESC
    LIMIT 15

09_cascading_sip_aggregation_mr_count_pinned:
  desc: "Cascading sip aggregation mr count pinned"
  category: aggregation
  suite: showcase
  query: |
    MATCH (p:Project)<-[:IN_PROJECT]-(mr:MergeRequest {state: 'merged'})
    WHERE p.id IN $sample:3
    RETURN p{.name}, count(mr) AS merged_mr_count
    ORDER BY merged_mr_count DESC
    LIMIT 10

10_traversal_user_to_group:
  desc: "Traversal user to group"
  category: traversal
  suite: showcase
  query: |
    MATCH (u:User)-[:MEMBER_OF]->(g:Group)
    WHERE u.id IN $sample
    RETURN *
    LIMIT 50

11_traversal_project_pipelines_jobs:
  desc: "Traversal project pipelines jobs"
  category: traversal
  suite: showcase
  expect: empty # 3-hop Project->Pipeline->Job OOMs on large sampled projects at gitlab-org scope
  query: |
    MATCH (p:Project)<-[:IN_PROJECT]-(pipe:Pipeline {status: 'failed'})<-[:IN_PIPELINE]-(j:Job {status: 'failed'})
    WHERE p.id IN $sample
    RETURN *
    LIMIT 20

12_ns_traversal_all_mrs_in_group:
  desc: "Ns traversal all mrs in group"
  category: traversal
  suite: showcase
  query: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN *
    LIMIT 50

13_ns_traversal_merged_mrs_with_notes:
  desc: "Ns traversal merged mrs with notes"
  category: traversal
  suite: showcase
  query: |
    MATCH (mr:MergeRequest {state: 'merged'})-[:HAS_NOTE]->(n:Note)
    RETURN *
    LIMIT 50
  expect: empty # #582 silent-empty: state filter is pushed onto the HAS_NOTE edge denorm, which encodes no MR state, yielding zero rows

14_ns_aggregation_mr_count_by_project_no_ids:
  desc: "Ns aggregation mr count by project no ids"
  category: aggregation
  suite: showcase
  query: |
    MATCH (mr:MergeRequest)-[:IN_PROJECT]->(p:Project)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN p{.name}, count(mr) AS mr_count
    ORDER BY mr_count DESC
    LIMIT 20

15_ns_aggregation_jobs_by_status:
  desc: "Ns aggregation jobs by status"
  category: aggregation
  suite: showcase
  query: |
    MATCH (j:Job)-[:IN_PROJECT]->(p:Project)
    WHERE j.status IN ['success', 'failed', 'running', 'pending']
    RETURN p{.name}, count(j) AS job_count
    ORDER BY job_count DESC
    LIMIT 20

16_ns_search_pipelines_failed:
  desc: "Ns search pipelines failed"
  category: search
  suite: showcase
  query: |
    MATCH (pipe:Pipeline {status: 'failed'})
    RETURN pipe{.id, .status, .ref}
    LIMIT 50

17_ns_traversal_narrow_group_authored:
