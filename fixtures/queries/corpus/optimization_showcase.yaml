29_node_and_property_group_project_pipeline_status:
  desc: "Node and property group project pipeline status"
  category: aggregation
  suite: showcase
  query: |
    {
      "query_type": "aggregation",
      "nodes": [
        {
          "id": "pipe",
          "entity": "Pipeline",
          "filters": {
            "status": {"in": ["success", "failed"]}
          }
        },
        {
          "id": "p",
          "entity": "Project",
          "columns": [
            "name",
            "full_path"
          ]
        }
      ],
      "relationships": [
        {
          "type": "IN_PROJECT",
          "from": "pipe",
          "to": "p"
        }
      ],
      "group_by": [
        "p",
        "pipe.status"
      ],
      "aggregations": [
        {
          "count": "pipe",
          "as": "pipeline_count"
        },
        {
          "avg": "pipe.duration",
          "as": "avg_duration"
        }
      ],
      "aggregation_sort": "-pipeline_count",
      "limit": 30
    }
  opencypher: |
    MATCH (pipe:Pipeline)-[:IN_PROJECT]->(p:Project)
    WHERE pipe.status IN ['success', 'failed']
    RETURN p, p.name, p.full_path, pipe.status, count(pipe) AS pipeline_count, avg(pipe.duration) AS avg_duration
    ORDER BY pipeline_count DESC
    LIMIT 30

