  category: traversal
  suite: showcase
  query: |
    MATCH (j:Job)-[:IN_PIPELINE]->(pipe:Pipeline)
    WHERE j.status IN ['success', 'failed', 'running', 'pending']
    RETURN *
    LIMIT 500

25_ns_search_all_mrs:
  desc: "Ns search all mrs"
  category: search
  suite: showcase
  query: |
    MATCH (mr:MergeRequest)
    WHERE mr.state IN ['opened', 'closed', 'merged']
    RETURN mr{.id, .title, .state}
    LIMIT 100

26_property_group_vulnerabilities_by_severity:
  desc: "Property group vulnerabilities by severity"
  category: aggregation
  suite: showcase
  query: |
    MATCH (v:Vulnerability)
    WHERE v.state IN ['detected', 'confirmed', 'resolved', 'dismissed']
    RETURN v.severity, count(v) AS vulnerability_count
    ORDER BY vulnerability_count DESC
    LIMIT 20

27_property_group_security_scans_by_type:
  desc: "Property group security scans by type"
  category: aggregation
  suite: showcase
  query: |
    MATCH (s:SecurityScan {latest: true})
    RETURN s.scan_type, count(s) AS scan_count
    ORDER BY scan_count DESC
    LIMIT 20

28_property_group_pipeline_status_source:
  desc: "Property group pipeline status source"
  category: aggregation
  suite: showcase
  query: |
    MATCH (pipe:Pipeline)
    WHERE pipe.status IN ['success', 'failed', 'running', 'pending']
    RETURN pipe.status, pipe.source, count(pipe) AS pipeline_count
    ORDER BY pipeline_count DESC
    LIMIT 30

29_node_and_property_group_project_pipeline_status:
  desc: "Node and property group project pipeline status"
  category: aggregation
  suite: showcase
  query: |
    MATCH (pipe:Pipeline)-[:IN_PROJECT]->(p:Project)
    WHERE pipe.status IN ['success', 'failed']
    RETURN p{.name, .full_path}, pipe.status, count(pipe) AS pipeline_count, avg(pipe.duration) AS avg_duration
    ORDER BY pipeline_count DESC
    LIMIT 30
