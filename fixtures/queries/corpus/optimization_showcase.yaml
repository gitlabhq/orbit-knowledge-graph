  category: traversal
  suite: showcase
  query: |
    MATCH (mr:MergeRequest {state: 'merged'})<-[:AUTHORED]-(author:User), (mr)-[:IN_PROJECT]->(p:Project)
    RETURN *
    LIMIT 100

20_complex_pipeline_chain_no_ids:
  desc: "Complex pipeline chain no ids"
  category: traversal
  suite: showcase
  query: |
    MATCH (pipe:Pipeline {status: 'failed'}), (j:Job), (pipe)-[:IN_PROJECT]->(p:Project), (pipe)-[:HAS_JOB]->(j)
    RETURN *
    LIMIT 50

21_complex_aggregation_multi_filter:
  desc: "Complex aggregation multi filter"
  category: aggregation
  suite: showcase
