    MATCH (mr:MergeRequest {state: 'merged', draft: false})-[:IN_PROJECT]->(p:Project)
    RETURN p{.name}, count(mr) AS merged_non_draft_count
    ORDER BY merged_non_draft_count DESC
    LIMIT 20

22_complex_narrow_3node_no_ids:
  desc: "Complex narrow 3node no ids"
  category: traversal
  suite: showcase
  query: |
    MATCH (u:User)-[:AUTHORED]->(mr:MergeRequest {state: 'merged'})-[:IN_PROJECT]->(p:Project)
    RETURN *
    LIMIT 50

23_complex_narrow_aggregation_jobs_per_project:
  desc: "Complex narrow aggregation jobs per project"
  category: aggregation
  suite: showcase
  query: |
    MATCH (j:Job {status: 'failed'})-[:IN_PROJECT]->(p:Project)
    RETURN p{.name}, count(j) AS failed_job_count
    ORDER BY failed_job_count DESC
