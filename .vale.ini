StylesPath = .vale
MinAlertLevel = warning

# `stage: Orbit` is the handbook stage name, not prose, so the standalone-product-name
# rule must not reach it.
IgnoredScopes = code, tt, text.frontmatter.stage

# Cypher is a graph query language name, not British spelling of "cipher".
[*.md]
BasedOnStyles = gitlab_base
gitlab_base.British = NO

[docs/source/**/*.md]
BasedOnStyles = gitlab_base, orbit
gitlab_base.British = NO

[todo.md]
BasedOnStyles =

[CHANGELOG.md]
BasedOnStyles =

[LICENSE.md]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

[.gitlab/**]
BasedOnStyles =

[.opencode/**]
BasedOnStyles =

[.sessions/**]
BasedOnStyles =

[.dev/**]
BasedOnStyles =

[helm/**/charts/**]
BasedOnStyles =

# Translations are linted by docs-locale/<locale>/.vale.ini, which applies
# locale-specific rules instead of the English gitlab_base style.
[docs-locale/**]
BasedOnStyles =
